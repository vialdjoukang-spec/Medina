<template data-pop="e11-sm-iwgdf" data-title="Groupe de travail international sur le pied diabétique"><p>Le groupe international sur le pied diabétique publie depuis 1999 des recommandations sur la prévention et la prise en charge des complications du pied. Ses recommandations de 2023 comprennent un guide pratique et un texte sur l’artériopathie rédigé avec la Société européenne de chirurgie vasculaire et la Society for Vascular Surgery.</p><p><b>Usage dans la leçon.</b> Le groupe fournit la technique des gestes (monofilament, diapason, test d’Ipswich, indices de pression) et la stratification du risque. L’organisation suisse des soins, elle, suit le guide QualiCCare 2023 ; les deux textes ne comptent pas le monofilament de la même façon.</p><p>Sources : IWGDF Guidelines 2023, recommandations pratiques et recommandations intersociétés sur l’artériopathie, consultées le 15.10.2026.</p></template>
<template data-pop="e11-sm-polyurie" data-title="Polyurie et polydipsie : mécanisme et valeur"><p><b>Définition.</b> La polydipsie désigne une prise de liquides supérieure à 3 L par jour ; une polyurie hypotonique dépasse 40 mL/kg par 24 heures avec une osmolalité urinaire inférieure à 800 mOsm/kg (Atila, Refardt et Christ-Crain 2026). Dans le diabète, la polyurie n’est pas hypotonique au sens de cette définition : elle est entraînée par le glucose.</p><p><b>Mécanisme.</b> Quand la charge de glucose filtrée dépasse la capacité maximale de réabsorption du tubule proximal, le glucose passe dans l’urine et entraîne une diurèse osmotique, avec perte d’eau et de sodium. La contraction du volume et l’hémoconcentration suivent ; la soif compense, tant que le patient peut boire.</p><p><b>Valeur.</b> Les sources lues ne chiffrent pas la fréquence de ces symptômes au diagnostic d’un diabète de type 2. Avec une glycémie aléatoire d’au moins 11,1 mmol/L, des symptômes classiques suffisent au diagnostic (onglet Pathologie, îlot 7).</p><p><b>Piège.</b> La glycosurie dépend de la filtration : sous dapagliflozine, l’excrétion urinaire de glucose passe de 85 g par jour à fonction rénale normale à 11 g par jour en insuffisance rénale sévère. Une polyurie modeste ne rassure donc pas chez l’insuffisant rénal. Une polyurie à glycémie normale doit faire exclure les autres causes, après avoir écarté la diurèse osmotique d’un diabète déséquilibré.</p><p>Sources : Ghezzi, Loo et Wright, Diabetologia 2018 ; information professionnelle suisse Forxiga®, août 2026 ; Umpierrez et al., Diabetologia 2024 ; Atila, Refardt et Christ-Crain, J Clin Endocrinol Metab 2026.</p></template>
<template data-pop="e11-sm-amaigrissement" data-title="Amaigrissement : le signe de la carence insulinique"><p><b>Questions.</b> Le médecin précise la perte de poids en kilogrammes et sa durée, son caractère volontaire ou non, et l’associe aux symptômes osmotiques et à une cétonurie ou une cétonémie.</p><p><b>Mécanisme.</b> La carence en insuline et l’excès d’hormones de contre-régulation libèrent les acides gras du tissu adipeux ; le foie les oxyde et produit des corps cétoniques. La perte urinaire de glucose ajoute une perte calorique.</p><p><b>Valeur.</b> La SSED 2023 classe l’amaigrissement et la cétonurie ou cétose parmi les signes typiques de carence insulinique ; dans ce contexte, surtout avec une HbA1c supérieure à 10 %, ou chez un patient de poids normal ou faible, l’insuline peut être le traitement préféré. Environ un quart des patients étiquetés type 2 ont un déficit insulinique prédominant.</p><p><b>Piège.</b> Un amaigrissement voulu, sous agoniste du récepteur du <button class="w" data-k="e11-gl-13">GLP-1</button> ou après un changement de mode de vie, n’a pas cette signification : la question « volontaire ou non » est indispensable.</p><p>Sources : Gastaldi et al., recommandations SSED 2023, section diagnostic différentiel ; Umpierrez et al., Diabetologia 2024, physiopathologie.</p></template>
<template data-pop="e11-sm-digestif" data-title="Nausées, vomissements et douleurs abdominales"><p><b>Mécanisme.</b> Ces symptômes accompagnent la cétose et l’acidose métabolique de l’acidocétose ; les vomissements aggravent la contraction du volume et peuvent ajouter une alcalose métabolique.</p><p><b>Valeur.</b> Ils sont présents dans plus de la moitié des acidocétoses et rares dans l’état hyperosmolaire (consensus 2024).</p><p><b>Piège.</b> La douleur abdominale peut être une conséquence de l’acidocétose ou le signe de sa cause déclenchante ; si elle persiste après correction de la déshydratation et de l’acidose, une évaluation complémentaire s’impose. Sous inhibiteur du SGLT2, ces symptômes imposent un dosage des cétones même si la glycémie est inférieure à 14 mmol/L.</p><p>Sources : Umpierrez et al., Diabetologia 2024, présentation clinique ; information professionnelle suisse Forxiga®, août 2026, mises en garde.</p></template>
<template data-pop="e11-sm-hypo-silence" data-title="Hypoglycémies que le patient ne signale pas"><p><b>Questions.</b> Le médecin demande activement s’il y a eu des hypoglycémies sévères, de degré 3, c’est-à-dire avec aide d’un tiers nécessaire ou perte de connaissance, au cours de l’année, et si le patient perçoit encore ses hypoglycémies. Le score de Clarke aide à évaluer cette perception ; un score d’au moins 4 signale une perception altérée dans la directive suisse de conduite.</p><p><b>Mécanisme.</b> Des réponses de contre-régulation altérées peuvent conduire à une non-perception des hypoglycémies, dans le type 1 comme dans le type 2 ; la revue de 2024 ne retient pas de lien direct avec la neuropathie autonome.</p><p><b>Valeur.</b> La directive suisse souligne qu’une très forte proportion des hypoglycémies sévères n’est pas mentionnée spontanément par les patients ; aucune proportion chiffrée n’y est donnée.</p><p><b>Piège.</b> L’absence de plainte ne prouve pas l’absence d’épisode, surtout sous insuline ou gliclazide.</p><p>Sources : SSED et SGRM, Richtlinien Diabetes und Fahreignung, version 1, août 2025 ; Eleftheriadou et al., Diabetologia 2024.</p></template>
<template data-pop="e11-sm-orthostatisme" data-title="Hypotension orthostatique et tachycardie de repos"><p><b>Technique.</b> La pression se mesure après un repos couché, puis debout. L’hypotension orthostatique est une baisse durable d’au moins 20 mmHg de la systolique, d’au moins 30 mmHg en cas d’hypertension couchée, ou d’au moins 10 mmHg de la diastolique.</p><p><b>Mécanisme.</b> L’atteinte du baroréflexe et la dénervation sympathique empêchent l’augmentation du tonus sympathique et des résistances vasculaires qui compense la baisse du retour veineux au lever. Plus tôt, l’atteinte vagale laisse le sympathique prédominer, d’où une tachycardie de repos qui peut atteindre 130 par minute.</p><p><b>Valeur.</b> Dans l’étude ACCORD, l’hypotension orthostatique était associée à la mortalité totale (rapport de risques 1,61) ; il s’agit d’une association, non d’une preuve de causalité. La prévalence de la neuropathie autonome cardiovasculaire du type 2 varie de 12 à 73 % selon les études.</p><p><b>Piège.</b> Le diagnostic de neuropathie autonome repose sur les tests cardiovasculaires de la fréquence cardiaque, non sur la seule mesure couchée-debout ; une hypovolémie par diurèse osmotique peut aussi abaisser la pression.</p><p>Sources : Eleftheriadou, Spallone, Tahrani et Alam, Diabetologia 2024 ; Umpierrez et al., Diabetologia 2024.</p></template>
<template data-pop="e11-sm-kussmaul" data-title="Respiration de Kussmaul"><p><b>Définition.</b> Respiration profonde, souvent rapide, à l’odeur fruitée d’acétone.</p><p><b>Mécanisme.</b> C’est la compensation respiratoire de l’acidose métabolique de l’acidocétose ; l’acétone, produit de dégradation de l’acide acétoacétique, passe dans l’air expiré.</p><p><b>Valeur.</b> Le signe oriente vers une acidose métabolique ; le diagnostic repose sur le β-hydroxybutyrate, le <button class="w" data-k="e11-gl-7">pH</button> veineux et les bicarbonates.</p><p><b>Piège.</b> Une dyspnée profonde n’est pas une dyspnée de congestion : chez un diabétique sous inhibiteur du SGLT2, elle impose les cétones avant d’attribuer la dyspnée au cœur.</p><p>Sources : Umpierrez et al., Diabetologia 2024, présentation clinique et critères.</p></template>
<template data-pop="e11-sm-volemie" data-title="Déshydratation : ce que montrent les constantes"><p><b>Technique.</b> Le médecin évalue le volume par les constantes : fréquence cardiaque et pression artérielle, à confronter à l’état de vigilance.</p><p><b>Mécanisme.</b> La diurèse osmotique, la natriurèse et les vomissements contractent le volume. L’hypertonie due à l’hyperglycémie déplace l’eau des cellules vers le secteur extracellulaire et peut maintenir temporairement la pression.</p><p><b>Valeur.</b> Tachycardie et hypotension sont corrélées à une hypovolémie sévère ; une hémodynamique stable ne l’exclut pas.</p><p><b>Piège.</b> Une pression normale chez un patient hyperglycémique et confus ne rassure pas ; l’osmolalité et les électrolytes tranchent.</p><p>Sources : Umpierrez et al., Diabetologia 2024, évaluation initiale.</p></template>
<template data-pop="e11-sm-monofilament-valeur" data-title="Perte de la sensibilité de protection : technique et valeur du monofilament"><p><b>Technique.</b> Le monofilament de 10 g est d’abord montré sur la main ; le patient ne regarde pas. Trois sites par pied sont testés, filament perpendiculaire jusqu’à sa flexion, environ deux secondes par application, jamais sur un ulcère, une callosité, une cicatrice ou une nécrose. Deux applications réelles alternent avec au moins une application simulée : la sensibilité est présente si deux réponses sur trois sont justes (IWGDF 2023). La grille suisse QualiCCare retient, pour l’absence de neuropathie, un résultat de 4/4.</p><p><b>Mécanisme.</b> La polyneuropathie diabétique réduit la perception de la pression ; une blessure n’est plus ressentie et la plaie progresse sans douleur.</p><p><b>Valeur.</b> Face à la conduction nerveuse, une méta-analyse de huit études trouve une sensibilité de 0,53, une spécificité de 0,88, et des rapports de vraisemblance de 4,56 et 0,53, avec une forte hétérogénéité des protocoles (Wang et al. 2017).</p><p><b>Piège.</b> Un monofilament perçu n’exclut pas une neuropathie ; un filament usé donne de faux résultats. Le groupe international conseille de le laisser reposer 24 heures après 10 à 15 patients et de le remplacer après 70 à 90 patients.</p><p>Sources : IWGDF 2023, annexe 1 ; QualiCCare 2023 ; Wang et al., Journal of Diabetes Research 2017.</p></template>
<template data-pop="e11-sm-ips" data-title="Indice de pression systolique cheville/bras chez le diabétique"><p><b>Technique.</b> Patient couché depuis 10 minutes, dans une pièce tempérée, sans alcool, effort ni caféine depuis deux heures. Le médecin mesure au Doppler la pression humérale aux deux bras, puis les pressions pédieuse et tibiale postérieure, brassard à environ 2 cm au-dessus de la malléole. Chez le diabétique, l’indice de chaque membre divise la plus basse des deux pressions de la cheville par la plus haute des pressions humérales.</p><p><b>Normal et pathologique.</b> Un indice supérieur à 1,3 ou inférieur à 0,9 est anormal. Un indice de 0,9 à 1,3, un indice orteil/bras d’au moins 0,70 et des ondes triphasiques ou biphasiques rendent l’artériopathie moins probable ; aucune valeur ne l’exclut.</p><p><b>Mécanisme du piège.</b> La calcification de la média, associée à la neuropathie, élève la pression à la cheville et, dans une moindre mesure, à l’orteil.</p><p><b>Urgence.</b> Un indice inférieur à 0,5, une pression transcutanée d’oxygène inférieure à 25 mmHg ou une pression d’orteil inférieure à 30 mmHg signalent une ischémie critique dans le guide suisse.</p><p>Sources : IWGDF 2023, annexe 2 et recommandations intersociétés ; QualiCCare 2023.</p></template>
<template data-pop="e11-sm-charcot" data-title="Neuro-ostéoarthropathie de Charcot active"><p><b>Signe.</b> Un pied rouge, chaud et gonflé chez un diabétique fait évoquer une neuro-ostéoarthropathie de Charcot active.</p><p><b>Mécanisme.</b> Il s’agit d’un processus inflammatoire stérile chez un patient neuropathe, qui lèse os, articulations et tissus mous ; non traité, il conduit à des fractures, des luxations et un pied déformé.</p><p><b>Diagnostic.</b> Il repose sur les signes inflammatoires après exclusion des autres causes et sur l’imagerie : radiographie, puis imagerie par résonance magnétique si la radiographie est normale.</p><p><b>Conduite.</b> Le guide suisse place le Charcot aigu au niveau 3 d’urgence ; la décharge et l’immobilisation commencent dès que le diagnostic est envisagé.</p><p>Sources : IWGDF 2023, recommandations pratiques, section 5 ; QualiCCare 2023.</p></template>
<template data-pop="e11-sm-acanthosis" data-title="Acanthosis nigricans : mécanisme et valeur"><p><b>Inspection.</b> Peau brune à noire, épaissie, veloutée, surtout à la nuque, aux aisselles et sur le dos des articulations des doigts ; d’autres sites existent, comme l’aine ou la région ombilicale.</p><p><b>Mécanisme.</b> Le facteur de croissance analogue à l’insuline et les récepteurs des facteurs de croissance des fibroblastes et de l’épiderme favorisent la prolifération des kératinocytes et des fibroblastes dermiques, sur un fond inflammatoire lié à l’insulinorésistance.</p><p><b>Valeur.</b> Sa prévalence varie de 4,5 à 74 % selon la population étudiée ; elle signale une insulinorésistance, sans poser le diagnostic de diabète.</p><p><b>Piège.</b> Le signe n’est pas spécifique : une forme maligne, liée notamment à un excès de facteur de croissance transformant alpha, et des endocrinopathies comme l’acromégalie peuvent aussi la provoquer.</p><p>Sources : Radu, Carsote, Dumitrascu, Sandru et Ingravallo, Diagnostics 2022.</p></template>
