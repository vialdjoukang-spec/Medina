<p>Pour la glycémie, le contexte comprend le jeûne, le plasma ou le sang capillaire, une charge orale et la grossesse. Un chiffre sous le seuil diagnostique ne constitue pas à lui seul un certificat de normalité universelle. Les références de l’analyseur et les conditions du prélèvement restent nécessaires [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">S14</a>].</p>
</section>
<section class="ilot" id="e14-semio-signs" data-semiology="signs"><h3>Signes : décrire avant d’interpréter</h3><p>La polyurie correspond à un volume urinaire augmenté ; la pollakiurie à des mictions plus fréquentes. La soif, la nycturie, la perte de poids et la vision trouble sont précisées dans leur durée et circonstances. Vomissements, douleur abdominale, respiration profonde et troubles cognitifs changent le degré d’urgence. L’absence de plainte ne réfute pas un diabète chronique [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Le médecin distingue également les symptômes d’hypoglycémie survenant sous traitement de ceux de l’hyperglycémie. Une difficulté cognitive nécessitant de l’aide définit la gravité pratique de l’épisode hypoglycémique, sans exiger un chiffre unique [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">S18</a>].</p>
</section>
<section class="ilot" id="e14-semio-mechanisms" data-semiology="mechanisms"><h3>Mécanismes : du glucose au signe</h3><p>Une action insulinique insuffisante augmente la disponibilité du glucose au-delà de son utilisation. La perte urinaire de glucose entraîne de l’eau : la diurèse osmotique explique polyurie, soif et déplétion. La carence insulinique et la contre-régulation favorisent la production de cétones. L’acidose provoque une compensation respiratoire profonde [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>L’hyperosmolarité modifie les échanges d’eau et peut altérer la cognition ; elle peut préserver transitoirement la pression malgré un déficit d’eau. Le potassium plasmatique est un compartiment mesuré, pas le stock total. Sa redistribution explique une kaliémie initiale trompeuse puis sa chute sous insuline [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
</section>
<section class="ilot" id="e14-semio-examination" data-semiology="examination"><h3>Examen : conditions, technique et limites</h3><p>Le médecin examine conscience, respiration, pouls, pression, muqueuses et diurèse. Il recherche infection et ischémie. L’électrocardiogramme contribue à la sécurité électrolytique. Le pied est entièrement inspecté, les pouls sont palpés et la sensibilité protectrice est testée ; un résultat vasculaire rassurant ne clôt pas l’enquête si le contexte reste suspect [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-05-PAD-Guideline.pdf" target="_blank" rel="noopener">S25</a>].</p>
<p>Le <button class="w" data-k="e14-peptide">dosage du peptide C</button> demande une glycémie simultanée et des conditions connues. Le rein élimine une partie du peptide C ; une insuffisance rénale peut le faire paraître conservé. La méthode et la durée du diabète modifient la conclusion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
</section>
<section class="ilot" id="e14-semio-interpretation" data-semiology="interpretation"><h3>Interprétation : trois questions indépendantes</h3><p>La glycémie et l’HbA1c répondent à « le diabète est-il confirmé ? ». Cétones, pH, bicarbonate et osmolalité répondent à « existe-t-il une crise ? ». Les anticorps et la réserve insulinique contribuent à « de quel type s’agit-il ? ». Ces trois réponses ne sont pas interchangeables [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Un anticorps isolé ne signifie pas automatiquement besoin immédiat d’insuline dans toute auto-immunité lente. Inversement, une sécrétion très basse peut imposer une couverture insulinique sans anticorps détecté. Le contexte clinique reste déterminant [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
</section>
<section class="ilot" id="e14-semio-differentials" data-semiology="differentials"><h3>Différentiels : choisir un discriminant</h3><p>Une polyurie sans hyperglycémie demande une autre explication de la perte d’eau ; une simple fréquence mictionnelle n’a pas le même mécanisme. Devant une acidose avec cétones, le médecin recherche aussi jeûne, alcool et grossesse. Une acidose lactique, notamment sous metformine avec hypoxie ou insuffisance rénale aiguë, peut coexister ou dominer [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>].</p>
<p>Dans le diabète confirmé, type 1, type 2, forme pancréatique, médicamenteuse et génétique sont discriminés par chronologie, phénotype, autoanticorps, sécrétion et explorations ciblées. Une liste d’hypothèses ne remplace pas cette comparaison [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
</section>
<section class="ilot" id="e14-semio-urgency" data-semiology="urgency"><h3>Urgence : le tableau prime sur l’étiquette</h3><p>Altération de conscience, choc, respiration anormale, vomissements persistants et cétones élevées imposent une évaluation immédiate. L’acidocétose euglycémique est possible ; une glycémie modérée ne justifie pas l’attente. Une hypokaliémie augmente le danger de l’insuline précoce [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Un pied infecté avec manifestations systémiques, une ischémie sévère, une gangrène ou un Charcot aigu impose le parcours spécialisé. Une neuropathie peut masquer la douleur. Le risque d’amputation ne se juge pas sur l’intensité de cette douleur [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-05-PAD-Guideline.pdf" target="_blank" rel="noopener">S25</a>].</p>
</section>
<section class="ilot" id="e14-semio-limits" data-semiology="limits"><h3>Limites : population et produit exact</h3><p>Le consensus de crise est adulte ; il ne fournit pas une ordonnance pédiatrique. Grossesse, fragilité, insuffisance cardiaque et dialyse modifient surveillance et traitement. Les seuils d’HbA1c, peptide C et indices vasculaires gardent leurs limites de méthode et de population [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-05-PAD-Guideline.pdf" target="_blank" rel="noopener">S25</a>].</p>
<p>Les FI suisses de plusieurs concentrés de potassium mentionnent acidose et déshydratation grave comme contre-indications. Les produits cristalloïdes ont aussi leurs propres limites. Une recommandation syndromique n’efface pas cette divergence : le choix opérationnel relève d’un protocole hospitalier expert et d’une vérification pharmaceutique, sans délai évitable devant le risque vital [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680295520907" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680514340132" target="_blank" rel="noopener">S26</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680411810011" target="_blank" rel="noopener">S27</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680565210019" target="_blank" rel="noopener">S29</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680298000024" target="_blank" rel="noopener">S30</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680586050014" target="_blank" rel="noopener">S31</a>].</p>
</section>
<section class="ilot" id="e14-semio-sources" data-semiology="sources"><h3>Sources : quelle preuve pour quelle observation ?</h3><p>L’OMS 2019 [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>] étaye la définition et le typage clinique ; la SSED 2023 [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>] situe l’insulinodéficience et les cibles. Jones et Hattersley [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>] étayent les limites du peptide C ; le consensus EASD/JBDS conjoint 2024 [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>] et JBDS [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>] étayent crises et temporalité. Les critères suisses de suivi [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">S12</a>], QCARE [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">S13</a>] et le groupe international du pied diabétique et les sociétés de chirurgie vasculaire européenne et américaine [<a data-reference-source="1" href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-05-PAD-Guideline.pdf" target="_blank" rel="noopener">S25</a>] fondent l’examen du pied et ses limites.</p>
<p>Les FI [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680295520907" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680514340132" target="_blank" rel="noopener">S26</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680411810011" target="_blank" rel="noopener">S27</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680565210019" target="_blank" rel="noopener">S29</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680298000024" target="_blank" rel="noopener">S30</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680586050014" target="_blank" rel="noopener">S31</a>] concernent leurs produits exacts. La source anatomique [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-9-the-endocrine-pancreas" target="_blank" rel="noopener">S21</a>] explique le pancréas normal ; la figure historique a sa preuve de licence distincte. Aucun test technique ni cette auto-relecture n’équivaut à un examen médical humain.</p>
</section>
<div class="key"><b>Science → clinique.</b> Une polyurie et une respiration profonde ne décrivent pas le même mécanisme.</div><div class="key"><b>Science → examen.</b> Glycémie, cétones et peptide C répondent à des questions distinctes.</div><div class="key"><b>Science → traitement.</b> La gravité et le besoin d’insuline sont traités avant le classement définitif.</div><div class="key"><b>À retenir.</b> Une interprétation explicite conserve contexte, limites et action attendue.</div></div><div class="sci" role="tabpanel" aria-labelledby="e14-tab-anat" id="e14-s-anat" hidden><section class="ilot" id="e14-s-anat-cours"><h2>Anatomie : un même organe, deux fonctions</h2><p>Le pancréas est un organe allongé situé en grande partie en arrière de la partie inférieure de l’estomac. Il participe à la digestion par son tissu exocrine et à la régulation des nutriments par ses îlots endocrines. Cette organisation évite de confondre maladie du pancréas et mécanisme exclusivement auto-immun [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-9-the-endocrine-pancreas" target="_blank" rel="noopener">S21</a>].</p>
<p>Les acini sécrètent des enzymes digestives drainées vers l’intestin par le système canalaire. Les îlots sont des groupes cellulaires distincts qui sécrètent notamment insuline et glucagon vers la circulation. La figure originale situe ces régions ; elle ne représente pas un pancréas diabétique [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-9-the-endocrine-pancreas" target="_blank" rel="noopener">S21</a>].</p>
<figure id="e14-figure-anatomie" data-e14-style="e14-local-3"><div data-e14-style="e14-local-4"><img src="assets/img/e14/alpha/codex/pancreas-openstax2013.jpg" alt="Original OpenStax 2013 : pancréas exocrine et îlots endocrines, avec une micrographie humaine normale et quatre repères français décrits sous l’image." data-e14-style="e14-local-5" width="1092" height="551"><span data-e14-pin="1" data-e14-style="e14-local-6">1</span><span data-e14-pin="1" data-e14-style="e14-local-7">2</span><span data-e14-pin="1" data-e14-style="e14-local-8">3</span><span data-e14-pin="1" data-e14-style="e14-local-9">4</span></div><figcaption>Original humain publié par OpenStax College, Connexions 2013 ; micrographie University of Michigan Medical School ©2012. <a href="https://commons.wikimedia.org/wiki/File:1820_The_Pancreas.jpg" target="_blank" rel="noopener">Source de l’original</a> · <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>. Pixels inchangés ; seuls quatre repères en surimpression sont ajoutés. 1 : tissu pancréatique ; 2 : région canalaire exocrine ; 3 : îlot dans la micrographie ; 4 : tissu acinaire adjacent. Les repères situent des régions, sans prouver le type du diabète. Les mentions anglaises appartiennent à l’original.</figcaption></figure>
<p>Le repère 1 situe le tissu pancréatique au contact du duodénum. Le repère 2 suit une région des canaux exocrines. Le repère 3 identifie un îlot sur la micrographie ; le repère 4 montre le tissu exocrine voisin. Ces structures coexistent dans le même organe mais ne remplissent pas la même fonction [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-9-the-endocrine-pancreas" target="_blank" rel="noopener">S21</a>].</p>
<p>Une chirurgie, une inflammation ou une autre affection du pancréas exocrine peut s’accompagner d’une hyperglycémie ; l’histoire clinique oriente alors vers un diabète spécifique. Une insuline nécessaire ne transforme pas cette étiologie en diabète de type 1. L’anatomie donne une hypothèse, que les documents de chirurgie, le contexte et les examens ciblés doivent établir [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32326843/master" target="_blank" rel="noopener">S20</a>].</p>
<p>Inversement, une image morphologique normale ne mesure pas la réserve fonctionnelle des cellules β. La sécrétion endogène est explorée par un dosage interprété, et l’auto-immunité par des anticorps selon la question. Une exploration anatomique sans indication n’est pas un substitut au typage biologique [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<div class="key"><b>Science → clinique.</b> Une histoire de pancréatite ou de chirurgie change la recherche étiologique.</div><div class="key"><b>Science → examen.</b> Le dossier pancréatique et les explorations orientées complètent les dosages ; une image normale ne mesure pas l’insuline.</div><div class="key"><b>Science → traitement.</b> Le besoin d’insuline se traite selon le déficit fonctionnel, même si la cause est pancréatique.</div><div class="key"><b>À retenir.</b> La figure explique une architecture normale, sans établir la cause d’un diabète.</div><p class="src">[<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-9-the-endocrine-pancreas" target="_blank" rel="noopener">S21</a>] §17.9, anatomie normale ; [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>] tableau 1 et typage ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>] sécrétion ; [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32326843/master" target="_blank" rel="noopener">S20</a>] distinction type/traitement.</p>
<button class="pareto-btn ui" data-k="pareto-e14-s-anat-cours">Essentiel — Anatomie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e14-tab-histo" id="e14-s-histo" hidden><section class="ilot" id="e14-s-histo-cours"><h2>Histologie : distinguer tissu observé et fonction mesurée</h2><p>La micrographie normale montre l’association d’un îlot endocrine et du tissu acinaire exocrine. Les cellules β produisent l’insuline ; les cellules α produisent le glucagon. D’autres cellules endocrines sécrètent notamment somatostatine et polypeptide pancréatique. Une coupe normale ne démontre pas le type de diabète d’un patient [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-9-the-endocrine-pancreas" target="_blank" rel="noopener">S21</a>].</p>
<figure id="e14-figure-histologie" data-e14-style="e14-local-3"><div data-e14-style="e14-local-4"><img src="assets/img/e14/alpha/codex/pancreas-openstax2013.jpg" alt="Original OpenStax 2013 : pancréas exocrine et îlots endocrines, avec une micrographie humaine normale et quatre repères français décrits sous l’image." data-e14-style="e14-local-5" width="1092" height="551"><span data-e14-pin="1" data-e14-style="e14-local-6">1</span><span data-e14-pin="1" data-e14-style="e14-local-7">2</span><span data-e14-pin="1" data-e14-style="e14-local-8">3</span><span data-e14-pin="1" data-e14-style="e14-local-9">4</span></div><figcaption>Original humain publié par OpenStax College, Connexions 2013 ; micrographie University of Michigan Medical School ©2012. <a href="https://commons.wikimedia.org/wiki/File:1820_The_Pancreas.jpg" target="_blank" rel="noopener">Source de l’original</a> · <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>. Pixels inchangés ; seuls quatre repères en surimpression sont ajoutés. 1 : tissu pancréatique ; 2 : région canalaire exocrine ; 3 : îlot dans la micrographie ; 4 : tissu acinaire adjacent. Les repères situent des régions, sans prouver le type du diabète. Les mentions anglaises appartiennent à l’original.</figcaption></figure>
<p>Le repère 3 se trouve dans la zone d’îlot et le repère 4 dans le tissu acinaire adjacent. Les annotations anglaises sur les cellules appartiennent à l’illustration d’origine. La simple teinte de cette image ne devient pas un test diagnostique de l’auto-immunité, de la masse β ou d’une carence en insuline. Cette réserve évite d’attribuer à une image pédagogique une performance clinique qu’elle ne possède pas [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-9-the-endocrine-pancreas" target="_blank" rel="noopener">S21</a>, <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>].</p>
<p>Le type 1 se caractérise par une destruction β-cellulaire souvent immunitaire. Le type 2 combine des degrés variables de dysfonction sécrétoire et de résistance à l’insuline. La clinique ne déduit pas ces mécanismes d’une biopsie pancréatique de routine : la classification pratique utilise le tableau clinique, l’évolution et les marqueurs disponibles [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>].</p>
<p>La production d’une molécule d’insuline s’accompagne de celle d’une molécule de peptide C lors du clivage de la proinsuline. Ce lien biochimique permet d’explorer la fonction du tissu sans compter ses cellules sur une coupe. La concentration périphérique dépend ensuite de l’élimination et de la glycémie ; elle n’est pas une mesure directe de la masse d’îlots [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<p>Une réserve mesurable au début peut persister malgré une auto-immunité ; une insuffisance rénale peut aussi majorer le résultat sanguin. Le médecin confronte donc structure théorique, marqueur de fonction et évolution avant de conclure. L’absence de critère histologique disponible ne doit pas retarder une insulinothérapie nécessaire [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>].</p>
<div class="key"><b>Science → clinique.</b> La destruction et la dysfonction peuvent conduire au même symptôme d’hyperglycémie.</div><div class="key"><b>Science → examen.</b> Le peptide C explore une sécrétion contextualisée ; les anticorps explorent un mécanisme immunitaire.</div><div class="key"><b>Science → traitement.</b> L’insulinodéficience clinique se traite sans attendre une preuve tissulaire.</div><div class="key"><b>À retenir.</b> Une image normale ne démontre ni auto-immunité, ni absence de maladie.</div><p class="src">[<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-9-the-endocrine-pancreas" target="_blank" rel="noopener">S21</a>] îlots/acini ; [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>] classification et limites ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>] fonction et clairance ; [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>] priorité à l’insulinodéficience.</p>
<button class="pareto-btn ui" data-k="pareto-e14-s-histo-cours">Essentiel — Histologie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e14-tab-physio" id="e14-s-physio" hidden><section class="ilot" id="e14-s-physio-cours"><h2>Physiologie : sécrétion, action et contre-régulation</h2><p>La régulation glycémique repose sur une sécrétion d’insuline adaptée et une réponse tissulaire suffisante. L’insuline facilite l’utilisation du glucose et son stockage, tout en freinant la production hépatique et la cétogenèse. Le glucagon augmente la disponibilité hépatique du glucose lorsque les besoins l’exigent. L’équilibre dépend donc de plusieurs flux, et pas de la seule quantité d’hormone mesurée [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-9-the-endocrine-pancreas" target="_blank" rel="noopener">S21</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>L’insulinorésistance augmente les besoins. Une concentration d’insuline ou de peptide C située dans l’intervalle du laboratoire peut rester insuffisante pour ces besoins. À l’inverse, une faible sécrétion peut devenir cliniquement décisive même en l’absence d’obésité. Le phénotype n’est pas un dosage et le dosage n’est pas un type [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<figure><svg role="img" aria-label="Schéma fonctionnel non anatomique du rôle de l’insuline ; les étapes décrivent une régulation, sans proportion quantitative [S21, S11]." viewBox="0 0 450 312" data-e14-style="e14-local-2"><rect x="8" y="5" width="434" height="52" rx="8" fill="#eff5f7" stroke="#28546d"/><text x="225" y="37" fill="#183a55" font-size="17" text-anchor="middle">Insuline adaptée aux besoins</text><text x="225" y="79" fill="#183a55" font-size="22" text-anchor="middle">↓</text><rect x="8" y="83" width="434" height="52" rx="8" fill="#eff5f7" stroke="#28546d"/><text x="225" y="115" fill="#183a55" font-size="17" text-anchor="middle">Production hépatique freinée</text><text x="225" y="157" fill="#183a55" font-size="22" text-anchor="middle">↓</text><rect x="8" y="161" width="434" height="52" rx="8" fill="#eff5f7" stroke="#28546d"/><text x="225" y="193" fill="#183a55" font-size="17" text-anchor="middle">Utilisation et stockage suffisants</text><text x="225" y="235" fill="#183a55" font-size="22" text-anchor="middle">↓</text><rect x="8" y="239" width="434" height="52" rx="8" fill="#eff5f7" stroke="#28546d"/><text x="225" y="271" fill="#183a55" font-size="17" text-anchor="middle">Équilibre glycémique préservé</text></svg><figcaption>Schéma fonctionnel non anatomique du rôle de l’insuline ; les étapes décrivent une régulation, sans proportion quantitative [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-9-the-endocrine-pancreas" target="_blank" rel="noopener">S21</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</figcaption></figure>
<p>Lorsque l’action insulinique devient insuffisante, le glucagon et les autres hormones de contre-régulation favorisent la production de glucose et de cétones. L’hyperglycémie provoque une diurèse osmotique et une déplétion hydrique. La réhydratation améliore à elle seule la perfusion rénale et peut faire baisser le glucose ; le débit d’insuline ne s’ajuste donc pas sans suivre cette évolution [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>].</p>
<p>Une sécrétion résiduelle peut limiter la cétose sans prévenir l’hyperosmolarité. Cette dissociation explique qu’une personne âgée profondément déshydratée ait peu de cétones. Une forme mixte reste possible. La différence est fonctionnelle ; elle ne permet pas de classer automatiquement le diabète comme type 1 ou type 2 [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Le peptide C renseigne sur la production endogène actuelle ; les autoanticorps peuvent renseigner sur le risque d’évolution de cette production. Un prélèvement pendant une hypoglycémie supprime physiologiquement la sécrétion et peut tromper. Une glycémie simultanée et une condition alimentaire connue sont donc indispensables [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<div class="key"><b>Science → clinique.</b> Polyurie, soif et amaigrissement traduisent un déséquilibre des flux et des pertes.</div><div class="key"><b>Science → examen.</b> Le peptide C répond à une question de sécrétion, pas à la confirmation du diabète.</div><div class="key"><b>Science → traitement.</b> Le déficit absolu impose une couverture insulinique ; l’état hyperosmolaire demande aussi une correction hydrique prudente.</div><div class="key"><b>À retenir.</b> La même hyperglycémie peut résulter de mécanismes différents et exige un contexte.</div><p class="src">[<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>] physiologie et prélèvement ; [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>] résistance/déficit ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>] pathogénie et traitement ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>] temporalité.</p>
<button class="pareto-btn ui" data-k="pareto-e14-s-physio-cours">Essentiel — Physiologie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e14-tab-bioch" id="e14-s-bioch" hidden><section class="ilot" id="e14-s-bioch-cours"><h2>Biochimie : cétones, osmoles et potassium</h2><p>La carence en insuline et la contre-régulation favorisent la lipolyse et la production hépatique de cétones. Le β-hydroxybutyrate est le principal cétoacide mesuré dans l’acidocétose. La réaction urinaire au nitroprussiate mesure surtout l’acétoacétate ; elle ne mesure pas le β-hydroxybutyrate. La cétonurie peut donc sous-estimer le début et surestimer la persistance lorsque le β-hydroxybutyrate se convertit en acétoacétate pendant l’amélioration [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>L’accumulation d’acides s’accompagne d’une baisse du bicarbonate et du pH. Le <button class="w" data-k="e14-anion">trou anionique</button> estime les charges non mesurées à partir du sodium, du chlorure et du bicarbonate. Il peut rester trompeur après remplissage chloré : une acidose hyperchlorémique n’est pas nécessairement une cétose persistante. La résolution se fonde sur les cétones et le pH ou le bicarbonate [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<figure><svg role="img" aria-label="Chaîne non anatomique des risques potassiques ; la normalité apparente du plasma ne mesure pas le stock corporel [S11, S23]." viewBox="0 0 450 312" data-e14-style="e14-local-2"><rect x="8" y="5" width="434" height="52" rx="8" fill="#eff5f7" stroke="#28546d"/><text x="225" y="37" fill="#183a55" font-size="17" text-anchor="middle">Déficit insulinique et pertes urinaires</text><text x="225" y="79" fill="#183a55" font-size="22" text-anchor="middle">↓</text><rect x="8" y="83" width="434" height="52" rx="8" fill="#eff5f7" stroke="#28546d"/><text x="225" y="115" fill="#183a55" font-size="17" text-anchor="middle">Potassium total diminué</text><text x="225" y="157" fill="#183a55" font-size="22" text-anchor="middle">↓</text><rect x="8" y="161" width="434" height="52" rx="8" fill="#eff5f7" stroke="#28546d"/><text x="225" y="193" fill="#183a55" font-size="17" text-anchor="middle">Kaliémie initiale parfois normale</text><text x="225" y="235" fill="#183a55" font-size="22" text-anchor="middle">↓</text><rect x="8" y="239" width="434" height="52" rx="8" fill="#eff5f7" stroke="#28546d"/><text x="225" y="271" fill="#183a55" font-size="17" text-anchor="middle">Insuline : potassium vers les cellules</text></svg><figcaption>Chaîne non anatomique des risques potassiques ; la normalité apparente du plasma ne mesure pas le stock corporel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</figcaption></figure>
<p>Le sodium et le glucose contribuent à la tonicité. L’<button class="w" data-k="e14-osmoles">osmolalité efficace et totale</button> est calculée avec la formule et les unités indiquées. La formule efficace exclut l’urée ; la formule totale l’inclut. Une valeur efficace &gt;300 ou totale &gt;320 mOsm/kg intervient dans les critères hyperosmolaires 2024, mais jamais seule [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Pendant la correction, une baisse du glucose déplace l’eau et peut augmenter la natrémie. Cette hausse initiale ne constitue pas, seule, une indication de soluté hypotonique. L’équipe suit la trajectoire de l’osmolalité, la diurèse, la circulation et le sodium, en évitant une correction trop rapide [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>].</p>
<p>L’insuline fait rentrer le potassium dans les cellules. Les concentrés de potassium ont des concentrations différentes et ne sont jamais injectés non dilués. Les contre-indications exactes des produits suisses empêchent de transformer mécaniquement la formule syndromique en ordonnance d’ampoules [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680295520907" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680514340132" target="_blank" rel="noopener">S26</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680565210019" target="_blank" rel="noopener">S29</a>].</p>
<div class="key"><b>Science → clinique.</b> Respiration profonde et troubles cognitifs peuvent traduire acidose et hypertonicité.</div><div class="key"><b>Science → examen.</b> Le dosage sanguin des cétones est préférable à la seule bandelette pour suivre l’acidocétose.</div><div class="key"><b>Science → traitement.</b> L’équipe coordonne eau, insuline, glucose et électrolytes selon un protocole surveillé.</div><div class="key"><b>À retenir.</b> La formule et le compartiment mesuré changent le sens d’un chiffre.</div><p class="src">[<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>] §3–4 et figure 2 ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>] osmolalité ; [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680295520907" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680514340132" target="_blank" rel="noopener">S26</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680565210019" target="_blank" rel="noopener">S29</a>] manipulation et précautions.</p>
<button class="pareto-btn ui" data-k="pareto-e14-s-bioch-cours">Essentiel — Biochimie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e14-tab-gene" id="e14-s-gene" hidden><section class="ilot" id="e14-s-gene-cours"><h2>Génétique et immunologie : préciser sans retarder les soins</h2><p>La classification de l’OMS distingue défauts monogéniques de la cellule β, anomalies monogéniques de l’action de l’insuline et autres syndromes génétiques. Avant six mois, une cause monogénique est prioritaire. Chez un sujet jeune, l’histoire familiale et le profil clinique peuvent justifier une consultation spécialisée. Les fréquences dépendent de la population ; un âge n’est pas à lui seul un test génétique [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>].</p>
<p>La recherche d’auto-immunité utilise notamment les anticorps contre la décarboxylase de l’acide glutamique, l’antigène des îlots 2, le transporteur du zinc 8 et l’insuline. Le médecin tient compte de la durée et d’une insulinothérapie déjà reçue. Une négativité ne démontre pas à elle seule un type 2 ; une positivité isolée doit aussi être confrontée à la réserve sécrétoire et au tableau clinique [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<figure><svg role="img" aria-label="Démarche non anatomique de typage, sans règle absolue d’âge ou de marqueur [S4, S5, S10]." viewBox="0 0 450 312" data-e14-style="e14-local-2"><rect x="8" y="5" width="434" height="52" rx="8" fill="#eff5f7" stroke="#28546d"/><text x="225" y="37" fill="#183a55" font-size="17" text-anchor="middle">Âge et histoire familiale connus</text><text x="225" y="79" fill="#183a55" font-size="22" text-anchor="middle">↓</text><rect x="8" y="83" width="434" height="52" rx="8" fill="#eff5f7" stroke="#28546d"/><text x="225" y="115" fill="#183a55" font-size="17" text-anchor="middle">Phénotype et auto-immunité confrontés</text><text x="225" y="157" fill="#183a55" font-size="22" text-anchor="middle">↓</text><rect x="8" y="161" width="434" height="52" rx="8" fill="#eff5f7" stroke="#28546d"/><text x="225" y="193" fill="#183a55" font-size="17" text-anchor="middle">Réserve sécrétoire contextualisée</text><text x="225" y="235" fill="#183a55" font-size="22" text-anchor="middle">↓</text><rect x="8" y="239" width="434" height="52" rx="8" fill="#eff5f7" stroke="#28546d"/><text x="225" y="271" fill="#183a55" font-size="17" text-anchor="middle">Test spécialisé si décision modifiée</text></svg><figcaption>Démarche non anatomique de typage, sans règle absolue d’âge ou de marqueur [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</figcaption></figure>
<p>Dans une auto-immunité lente de l’adulte, la sécrétion peut être mieux conservée au diagnostic. La présence d’un syndrome métabolique n’exclut pas cette forme. L’objectif est de prévoir une éventuelle baisse de réserve et d’organiser un suivi ; un anticorps positif n’impose pas dans tous les cas le même schéma au même jour [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<p>Le repère SSED 2023 de peptide C &gt;200 et &lt;600 pmol/L, anticorps négatifs et absence de forte histoire familiale soutient une insulinodéficience dans le contexte décrit. Il ne constitue pas une norme universelle : le prélèvement, la glycémie, le rein et l’évolution comptent. La SSED rappelle qu’un type 1 précoce reste possible et qu’un contrôle ultérieur peut être nécessaire [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<p>Les sous-groupes issus d’analyses de cohortes illustrent l’hétérogénéité des diabètes de l’adulte. Ils ne sont pas des critères officiels de E14 ni une preuve de traitement individualisé validé pour chaque patient. Le besoin de traiter une carence insulinique prime sur l’attente d’une classification de recherche [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>].</p>
<div class="key"><b>Science → clinique.</b> Le tableau familial et l’auto-immunité modifient les probabilités sans décider seuls.</div><div class="key"><b>Science → examen.</b> Le test génétique est ciblé ; anticorps et peptide C apportent des informations complémentaires.</div><div class="key"><b>Science → traitement.</b> Une insulinodéficience menaçante est traitée avant le résultat génétique ou immunologique.</div><div class="key"><b>À retenir.</b> Le type est une conclusion clinique soutenue par des examens, puis réévaluée.</div><p class="src">[<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>] tableau 1 et §3 ; [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>] sous-types et déficit ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>] valeurs/limites et utilité des marqueurs.</p>
<button class="pareto-btn ui" data-k="pareto-e14-s-gene-cours">Essentiel — Génétique et immunologie</button></section>
</div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>
<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="e14-p-1"><h2>Choisir selon l’urgence et l’insulinodéficience</h2><p>Le code E14 ne désigne aucun traitement propre. Une crise demande un protocole hospitalier ; une insulinodéficience impose une couverture insulinique ; un type 2 confirmé ouvre une stratégie multifactorielle. L’absence de type précis ne justifie pas un traitement oral automatique [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Situation</th><th data-e14-style="e14-local-1">Principe</th><th data-e14-style="e14-local-1">Précaution suisse</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Crise hyperglycémique</td><td data-e14-style="e14-local-1">L’équipe coordonne eau, insuline, glucose et électrolytes.</td><td data-e14-style="e14-local-1">Les FI des produits exacts et leurs incompatibilités sont vérifiées.</td></tr><tr><td data-e14-style="e14-local-1">Insulinodéficience sans crise</td><td data-e14-style="e14-local-1">Une insulinothérapie individualisée et une éducation sont organisées.</td><td data-e14-style="e14-local-1"><button class="w" data-k="e14-novorapid">NovoRapid</button> est une insuline rapide ; hors pompe adaptée, il ne remplace pas à lui seul une couverture basale.</td></tr><tr><td data-e14-style="e14-local-1">Type 2 devenu probable/confirmé</td><td data-e14-style="e14-local-1">La SSED envisage metformine et protection cardio-rénale selon le patient.</td><td data-e14-style="e14-local-1">Glucophage est contre-indiqué dans l’acidose ou la déshydratation aiguë ; la filtration limite la dose.</td></tr><tr><td data-e14-style="e14-local-1">Hypoglycémie sévère</td><td data-e14-style="e14-local-1">L’entourage et les secours assurent le traitement.</td><td data-e14-style="e14-local-1">Baqsimi 3 mg nasal est autorisé dès un an ; il exige des réserves de glycogène.</td></tr></tbody></table>
<p>Les autres classes de type 2 sont évoquées comme stratégie de la SSED, sans ordonnance de produit non vérifié. Un inhibiteur du cotransport sodium-glucose peut favoriser une acidocétose euglycémique ; il est arrêté à l’admission lors d’une acidocétose et sa reprise n’est pas routinière selon le consensus [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="key"><b>À retenir.</b> Le médicament dépend de l’état clinique et du produit, pas du code.</div><button class="pareto-btn ui" data-k="pareto-e14-p-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e14-p-2"><h2>Monographies suisses exactes : dose et population</h2><p>Les doses ci-dessous concernent les formulations nommées. Les débits de perfusion de crise proviennent du consensus adulte ; ils ne sont pas présentés comme des doses écrites dans la FI <button class="w" data-k="e14-novorapid">NovoRapid</button> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Produit et version</th><th data-e14-style="e14-local-1">Posologie et voie</th><th data-e14-style="e14-local-1">Adaptations ou limites</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1"><button class="w" data-k="e14-metformine">Glucophage comprimés, octobre 2025</button></td><td data-e14-style="e14-local-1">Adulte : début 500–1000 mg/j par voie orale, augmentation de 500 mg tous les cinq à sept jours selon tolérance ; maximum 3000 mg/j.</td><td data-e14-style="e14-local-1">En filtration 30–59 : début 500 ou 850 mg/j, maximum 1000 mg/j en deux prises. Sous 30 : contre-indiqué.</td></tr><tr><td data-e14-style="e14-local-1"><button class="w" data-k="e14-novorapid">NovoRapid 100 unités/ml, avril 2026</button></td><td data-e14-style="e14-local-1">La FI décrit des besoins totaux usuels d’insuline de 0,5–1 unité/kg/j, individualisés ; la fraction rapide dépend du schéma.</td><td data-e14-style="e14-local-1">Voie sous-cutanée liée au repas ; voie intraveineuse uniquement professionnelle et surveillée. Les débits/kg/h de crise ne sont pas un total/jour.</td></tr><tr><td data-e14-style="e14-local-1"><button class="w" data-k="e14-baqsimi">Baqsimi poudre nasale, mars 2026</button></td><td data-e14-style="e14-local-1">3 mg dans une narine, dose unique, dès un an ; aucune inspiration nécessaire.</td><td data-e14-style="e14-local-1">Pas d’adaptation rénale/hépatique forfaitaire ; aucune étude formelle spécifique. Sous un an : non recommandé.</td></tr></tbody></table>
<p>Une dose maximale n’est pas une cible. Chez le sujet âgé ou en insuffisance rénale/hépatique, le besoin d’insuline peut diminuer ; la surveillance et l’adaptation sont individualisées. L’intervalle 30–59 de Glucophage est volontairement plus large que celui de certains tableaux génériques : c’est la FI de ce produit qui est citée [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<p>Le <button class="w" data-k="e14-calculdose">calcul d’unités par kilogramme et par heure</button> distingue débit d’insuline, concentration préparée et vitesse de pompe. Une confusion entre unité/ml et unité/kg/h peut être grave [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<div class="key"><b>À retenir.</b> Dose, formulation, voie, fréquence et population restent attachées à la même source.</div><button class="pareto-btn ui" data-k="pareto-e14-p-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e14-p-3"><h2>Contre-indications, interactions et surveillance</h2><p>L’acidose et la défaillance rénale aiguë changent immédiatement le rapport bénéfice-risque de la metformine. L’hypoglycémie et l’hypokaliémie sont des risques essentiels de l’insuline. Le glucagon peut être inefficace lorsque les réserves hépatiques de glycogène sont épuisées [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Produit</th><th data-e14-style="e14-local-1">Risques ou contre-indications</th><th data-e14-style="e14-local-1">Surveillance et réponse</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Glucophage</td><td data-e14-style="e14-local-1">Acidose, coma/précoma diabétique, filtration &lt;30, insuffisance hépatique, hypoxie aiguë et déshydratation ; interactions rénales, alcool et contraste iodé.</td><td data-e14-style="e14-local-1">Le produit est arrêté dans la situation aiguë ; fonction rénale et reprise sont réévaluées. Troubles digestifs et vitamine B12 sont surveillés.</td></tr><tr><td data-e14-style="e14-local-1"><button class="w" data-k="e14-novorapid">NovoRapid</button></td><td data-e14-style="e14-local-1">Hypoglycémie, hypokaliémie ; erreur de dose, de produit ou de site ; hypersensibilité.</td><td data-e14-style="e14-local-1">Glycémie et potassium sont suivis en perfusion. Rotation des sites, repas et dispositifs sont vérifiés ; les bêtabloquants peuvent masquer les signes.</td></tr><tr><td data-e14-style="e14-local-1">Baqsimi</td><td data-e14-style="e14-local-1">Hypersensibilité et phéochromocytome contre-indiqués ; prudence insulinome ; efficacité réduite si jeûne, alcoolisme ou insuffisance surrénale.</td><td data-e14-style="e14-local-1">Une aide est appelée ; rien n’est donné par bouche à une personne qui ne peut avaler. Des glucides sont pris après récupération. Indométacine et warfarine sont considérées.</td></tr></tbody></table>
<p>La FI Glucophage impose, pour un examen intravasculaire iodé si filtration &lt;60, un arrêt 48 heures avant puis une réévaluation rénale 48 heures après. Une chirurgie prévue sous anesthésie générale, spinale ou péridurale suit également un arrêt 48 heures avant et une reprise au plus tôt 48 heures après avec alimentation et fonction rénale satisfaisantes. Ces règles exactes ne sont pas remplacées par une formule générique [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>].</p>
<p>Des symptômes évoquant une acidose lactique sous metformine imposent l’arrêt et une évaluation hospitalière urgente. La <button class="w" data-k="e14-metformine">monographie complète</button> précise interactions, grossesse, allaitement et fonction rénale [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>].</p>
<div class="key"><b>À retenir.</b> Une dose correcte peut devenir dangereuse si la situation clinique ou une interaction change.</div><button class="pareto-btn ui" data-k="pareto-e14-p-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e14-p-4"><h2>Perfusions : distinguer protocole syndromique et produit</h2><p>Un protocole de crise décrit une stratégie dans une population. Une FI décrit un produit autorisé, ses concentrations, limites et contre-indications. Le passage de l’un à l’autre demande une vérification explicite : une même classe ne garantit pas la même conformité [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680295520907" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680514340132" target="_blank" rel="noopener">S26</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680411810011" target="_blank" rel="noopener">S27</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680565210019" target="_blank" rel="noopener">S29</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680298000024" target="_blank" rel="noopener">S30</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680586050014" target="_blank" rel="noopener">S31</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Document</th><th data-e14-style="e14-local-1">Ce qu’il établit</th><th data-e14-style="e14-local-1">Ce qu’il ne permet pas de déduire</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Consensus adulte 2024</td><td data-e14-style="e14-local-1">Il propose insuline, remplissage et potassium selon le syndrome et les résultats.</td><td data-e14-style="e14-local-1">Il n’autorise pas automatiquement toute ampoule suisse.</td></tr><tr><td data-e14-style="e14-local-1"><button class="w" data-k="e14-novorapid">NovoRapid</button> 100 unités/ml</td><td data-e14-style="e14-local-1">La voie intraveineuse professionnelle et certaines concentrations compatibles sont décrites.</td><td data-e14-style="e14-local-1">La FI ne contient pas le débit de 0,1 unité/kg/h de l’acidocétose.</td></tr><tr><td data-e14-style="e14-local-1"><button class="w" data-k="e14-potassium">KCl</button> B. Braun et Sintetica</td><td data-e14-style="e14-local-1">Les concentrés doivent être dilués ; acidose, déshydratation grave et insuffisance rénale figurent parmi les contre-indications.</td><td data-e14-style="e14-local-1">Le débit de potassium du consensus ne devient pas une ordonnance de ces concentrés en crise.</td></tr><tr><td data-e14-style="e14-local-1">Chlorure de sodium Baxter/Bichsel et Ringer-Acetat Fresenius</td><td data-e14-style="e14-local-1">Les produits ont leurs indications, volumes, débits et contre-indications propres.</td><td data-e14-style="e14-local-1">Une déshydratation hypertonique n’est pas une indication automatiquement autorisée de ces produits.</td></tr></tbody></table>
<p>La divergence n’est pas effacée et ne justifie pas de retarder sans raison les soins vitaux. Elle impose une décision du médecin expérimenté et une vérification par la pharmacie/protocole hospitalier du produit, de la préparation, de la surveillance et du cadre d’emploi. Aucun produit alternatif non vérifié n’est présenté ici comme solution. La <button class="w" data-k="e14-potassium">fenêtre potassium et concentrés</button> et la <button class="w" data-k="e14-fluides">fenêtre cristalloïdes exacts</button> exposent les limites [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680295520907" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680514340132" target="_blank" rel="noopener">S26</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680411810011" target="_blank" rel="noopener">S27</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680565210019" target="_blank" rel="noopener">S29</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680298000024" target="_blank" rel="noopener">S30</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680586050014" target="_blank" rel="noopener">S31</a>].</p>
<p>Le bicarbonate n’est pas administré en routine dans le consensus ; une acidose très sévère relève d’une décision experte. Le phosphate n’est pas substitué systématiquement. Aucune dose d’un produit de bicarbonate ou phosphate non relu n’est ajoutée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="key"><b>À retenir.</b> La stratégie de réanimation et l’autorisation d’un produit sont confrontées avant préparation ; leur divergence reste visible.</div><button class="pareto-btn ui" data-k="pareto-e14-p-4">Essentiel de cette partie</button></section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>
<template data-pop="e14-classification" data-title="Classification : une conclusion clinique réévaluable"><div class="lab">Ce qui est classé</div><p>Le diabète est confirmé par des critères de glycémie ou d’HbA1c dans des conditions adaptées. Le type décrit le mécanisme probable : destruction β-cellulaire, résistance associée à dysfonction sécrétoire, forme hybride ou autre cause spécifique. Une information insuffisante justifie un type provisoire, pas l’absence de traitement [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>].</p>
<div class="lab">Raisonnement</div><p>Le médecin recherche d’abord le besoin d’insuline et les urgences. Il confronte ensuite histoire, âge, phénotype, famille, auto-immunité et sécrétion. Une maladie du pancréas, une endocrinopathie ou un médicament peut changer l’hypothèse. Aucun élément isolé n’est décisif dans tous les cas [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<div class="lab">Limite</div><p>La catégorie OMS « non classé » est temporaire. Son rapprochement avec E14 n’est pas une correspondance administrative officielle démontrée. L’insuline reçue ne classe pas le type ; les sous-groupes de cohortes ne sont pas des sous-codes de E14 [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32326843/master" target="_blank" rel="noopener">S20</a>].</p>
</template>
<template data-pop="e14-peptide" data-title="Peptide C : sécrétion, concentration et interprétation"><div class="lab">De la molécule au sang</div><p>Le clivage de la proinsuline produit une molécule d’insuline et une de peptide C. Leur sécrétion est équimolaire. Leurs concentrations périphériques ne sont pas égales : une partie importante de l’insuline est extraite par le foie et sa demi-vie est plus courte. La revue décrit environ 20–30 minutes pour le peptide C contre 3–5 pour l’insuline [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<div class="lab">Ce qui est mesuré</div><p>L’insuline injectée n’apporte pas de peptide C. Le résultat estime donc la sécrétion endogène actuelle. Une insuffisance rénale peut augmenter le taux sanguin ; un prélèvement pendant une hypoglycémie peut le diminuer. Le laboratoire doit connaître jeûne ou repas/stimulation, glycémie simultanée et méthode [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<div class="lab">Unités et repères</div><p>Un nmol/L représente 1000 pmol/L. Ainsi 0,2 nmol/L correspond à 200 pmol/L. Dans la revue, un peptide C stimulé &lt;0,2 nmol/L soutient un déficit absolu ; le seuil proposé à jeun est différent (&lt;0,08 nmol/L). Ces repères proviennent de populations insulinotraitées et ne sont pas des références universelles ; une valeur proche d’une borne exige prudence [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<p>La SSED 2023 décrit un contexte de peptide C &gt;200 et &lt;600 pmol/L avec anticorps négatifs et sans forte histoire familiale. Une insulinodéficience est alors envisagée ; un type 1 précoce reste possible. La méthode, le repas, le glucose et le rein empêchent d’appliquer ce nombre sans contexte [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<div class="lab">Conséquence</div><p>Une réserve conservée au début ne réfute pas un type 1. L’utilité discriminante augmente après plusieurs années ; cela n’interdit pas un dosage plus précoce pertinent. L’insulinothérapie nécessaire n’attend pas le résultat [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>].</p>
</template>
<template data-pop="e14-semio" data-title="Sémiologie : plainte, mécanisme et décision"><div class="lab">Chronologie</div><p>La polyurie décrit une augmentation de volume, tandis qu’une pollakiurie décrit des mictions fréquentes. Le médecin précise nycturie, boissons, perte de poids et durée. Le glucose urinaire entraîne de l’eau et des électrolytes, ce qui relie hyperglycémie, polyurie, soif et déplétion [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="lab">Gravité</div><p>Vomissements, respiration profonde et troubles cognitifs changent l’urgence. La respiration de Kussmaul compense une acidose ; son absence ne l’exclut pas. La douleur abdominale peut être liée à la crise ou à sa cause et demande une nouvelle évaluation si elle persiste après correction [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="lab">Examen et interprétation</div><p>La pression artérielle apparemment préservée peut masquer une déplétion dans l’hyperosmolarité. L’examen est confronté aux électrolytes, cétones, pH et osmolalité. La première décision concerne la sécurité ; le type sera précisé ensuite [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>].</p>
</template>
<template data-pop="e14-hba" data-title="HbA1c : seuil, cible et interférences"><div class="lab">Diagnostic et cible</div><p>Le seuil de diabète retenu est ≥6,5 % ou 48 mmol/mol avec une méthode standardisée. Chez l’asymptomatique, le résultat est confirmé. La zone 5,7–6,4 % citée par la SSED 2011 exprime un risque intermédiaire ; elle ne signifie pas absence certaine de diabète si le plasma répond à un critère. Une cible de traitement autour de 7 % n’est pas un seuil de normalité [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">S14</a>].</p>
<div class="lab">Discordances</div><p>Les hémoglobinopathies et les changements de renouvellement érythrocytaire peuvent modifier la mesure ou sa signification. Hémolyse, transfusion, insuffisance sévère rénale/hépatique et carence martiale demandent une interprétation prudente. La direction et l’importance peuvent dépendre de la méthode et du contexte ; le laboratoire participe à l’analyse [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">S14</a>].</p>
<div class="lab">Situations rapides ou particulières</div><p>Le diagnostic aigu d’un type 1 possible ne doit pas attendre l’HbA1c. Le diagnostic de diabète gestationnel utilise un parcours spécifique. L’OMS retient les bornes ≥ ; le document suisse 2011 utilise parfois >. Cette différence historique est déclarée, pas fusionnée [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">S14</a>].</p>
</template>
<template data-pop="e14-pied" data-title="Pied diabétique : la douleur absente ne rassure pas"><div class="lab">Examen</div><p>Le pied est inspecté sur toutes ses faces. Le médecin décrit profondeur et localisation d’une plaie, rougeur, chaleur, tuméfaction, déformations, pouls et sensibilité. Le monofilament et la pallesthésie évaluent des fonctions différentes. Les repères QCARE de monofilament 4/4 et vibration &gt;4/8 appartiennent à son parcours ; ils n’excluent pas toute neuropathie dans toute technique [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">S13</a>].</p>
<div class="lab">Limite vasculaire majeure</div><p>La simplification QCARE « deux pouls et indice ≥0,9 » ne permet pas une exclusion universelle d’artériopathie. le groupe international du pied diabétique et les sociétés de chirurgie vasculaire européenne et américaine recommande de combiner Doppler, indice cheville-bras et indice orteil-bras. La maladie devient moins probable avec indice cheville-bras 0,9–1,3, indice orteil-bras ≥0,70 et flux bi- ou triphasique ; aucun résultat isolé ne suffit à l’exclure [<a data-reference-source="1" href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-05-PAD-Guideline.pdf" target="_blank" rel="noopener">S25</a>].</p>
<div class="lab">Urgence</div><p>Ulcère/gangrène avec infection et ischémie demande un avis vasculaire urgent. Dans ce contexte, les repères d’ischémie sévère IWGDF comprennent indice cheville-bras &lt;0,4, pression cheville &lt;50 mmHg, pression orteil &lt;30 mmHg, pression transcutanée d’oxygène &lt;30 mmHg ou Doppler monophasique/absent. Ces valeurs ne doivent pas être mélangées avec les seuils légèrement différents du parcours QCARE [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-05-PAD-Guideline.pdf" target="_blank" rel="noopener">S25</a>].</p>
<p>Une plaie profonde/plantaire, une évolution défavorable ou un pied chaud évoquant Charcot nécessite une montée de niveau. L’absence de douleur peut refléter la neuropathie et ne diminue pas l’urgence [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">S13</a>].</p>
</template>
<template data-pop="e14-crise" data-title="Crises adultes : stratégie, surveillance et résolution"><div class="lab">Diagnostic</div><p>L’acidocétose exige diabète connu ou glucose ≥11,1 mmol/L, cétones élevées et acidose. La figure 2 du consensus précise β-hydroxybutyrate ≥3 ou cétonurie ≥2+, pH &lt;7,3 et/ou bicarbonate &lt;18. Une glycémie plus basse est possible chez le diabétique connu, notamment sous traitement favorisant la cétose [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="lab">Traitement hospitalier</div><p>Le consensus adulte coordonne remplissage, insuline, électrolytes et cause. L’insuline rapide en perfusion est généralement débutée à 0,1 unité/kg/h dans l’acidocétose après sécurisation du potassium ; sous 13,9 mmol/L de glucose, l’ajout de glucose et une réduction usuelle à 0,05 permettent de poursuivre la correction des cétones. Les valeurs sont un protocole syndromique, pas une posologie inscrite dans toute FI [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<p>Dans l’état hyperosmolaire sans acidose (pH ≥7,3, bicarbonate ≥18), le consensus décrit 0,05 unité/kg/h ; en forme mixte, il décrit 0,1. JBDS privilégie d’abord la correction hydrique et peut différer l’insuline tant que le glucose baisse avec elle. Bicarbonate 15–17,9 ou contexte complexe demande une analyse experte plutôt qu’un automatisme [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>].</p>
<div class="lab">Limites de vitesse</div><p>Pour l’état hyperosmolaire, le consensus évite une baisse glycémique dépassant 5–6,7 mmol/L/h, une baisse de sodium &gt;10 mmol/L/24 h et une baisse d’osmolalité au-delà de 3–8 mOsm/kg/h. La hausse initiale du sodium sous correction du glucose ne suffit pas à décider un soluté hypotonique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="lab">Surveillance et sortie de crise</div><p>Le glucose est suivi toutes les une à deux heures ; électrolytes, créatinine, cétones et pH environ toutes les quatre heures. La résolution de l’acidocétose exige cétones &lt;0,6 et pH ≥7,3 ou bicarbonate ≥18. Le trou anionique et la cétonurie ne sont pas des critères privilégiés. Le relais sous-cutané prévoit un recouvrement d’une à deux heures avant arrêt de perfusion, avec dose adaptée au produit et au patient [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Le protocole est adulte. Grossesse, fragilité, dialyse, atteinte cardiaque et enfance demandent une adaptation ; les limites de produits suisses restent visibles dans les fenêtres dédiées [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680295520907" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680514340132" target="_blank" rel="noopener">S26</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680411810011" target="_blank" rel="noopener">S27</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680565210019" target="_blank" rel="noopener">S29</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680298000024" target="_blank" rel="noopener">S30</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680586050014" target="_blank" rel="noopener">S31</a>].</p>
</template>
<template data-pop="e14-potassium" data-title="Potassium : impératif physiologique et limites de produit"><div class="lab">Pourquoi la kaliémie trompe</div><p>Le déficit total dans l’acidocétose est souvent de 3–6 mmol/kg, mais l’acidose et le manque d’insuline déplacent le potassium vers le sang. Une valeur normale ou élevée n’exclut pas le déficit. L’insuline le fait rentrer dans les cellules et peut provoquer une chute dangereuse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<div class="lab">Repères du consensus adulte</div><p>Si la kaliémie est &lt;3,5 mmol/L, le consensus préconise une substitution et retarde l’insuline jusqu’à &gt;3,5. Il décrit un repère de 10 mmol/h dans cette situation et généralement 20–30 mmol de potassium par litre de soluté lorsque nécessaire pour viser 4–5 mmol/L. La diurèse, la fonction rénale et les contrôles conditionnent toute mise en œuvre. Ce repère n’est pas une prescription des concentrés nommés ci-dessous [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
