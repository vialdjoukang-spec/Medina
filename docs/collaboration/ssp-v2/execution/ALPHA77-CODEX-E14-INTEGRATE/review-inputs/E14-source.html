nes défaillants</a></li><li><a href="#e14-13">Documentation clinique, sous-codes et particularités suisses</a></li><li><a href="#e14-14">Critères formels, paramètres décisifs et pièges</a></li></ol></nav>
<div class="chap-body">
<section class="ilot" id="e14-1"><h2><span class="n">1</span>Reconnaître le diabète sans attendre son type</h2><p>Une soif inhabituelle, une polyurie et un amaigrissement font rechercher une hyperglycémie. Chez une adulte de 34 ans, ces plaintes accompagnent une glycémie capillaire de 26 mmol/L. Ce chiffre fictif impose une évaluation rapide ; le prélèvement plasmatique, les cétones et l’état clinique précisent le diagnostic et l’urgence. Une mesure capillaire d’orientation ne remplace pas toutes les conditions du diagnostic biologique [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>La première question concerne la sécurité : existe-t-il une acidocétose, un état hyperosmolaire ou une autre affection aiguë ? La deuxième concerne le mécanisme : le patient manque-t-il d’insuline ? Le typage définitif vient ensuite. Une suspicion d’insulinodéficience ne doit pas attendre le résultat des anticorps pour être traitée [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Le raisonnement s’applique aux situations de soif, de perte de poids, de diurèse anormale et de glycémie anormale décrites dans PROFILES. Il ne constitue pas une correspondance officielle entre présentation clinique et code. Les vignettes et quiz sont des exercices originaux [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S28</a>].</p>
<div class="key"><b>À retenir.</b> L’urgence et le besoin d’insuline précèdent l’étiquette du diabète. Un traitement reçu ne prouve pas son type.</div><button class="pareto-btn ui" data-k="pareto-e14-1">Essentiel — Reconnaître le diabète sans attendre son type</button></section>
<section class="ilot" id="e14-2"><h2><span class="n">2</span>Définition, histoire naturelle et classification clinique</h2><p>Le diabète associe une hyperglycémie non traitée à une anomalie de sécrétion ou d’action de l’insuline, souvent aux deux. Une destruction des cellules β peut entraîner une carence absolue ; une résistance des tissus augmente les besoins auxquels le pancréas ne répond plus suffisamment. L’hyperglycémie peut rester longtemps silencieuse ou se révéler par une crise. L’exposition prolongée favorise les complications rénales, rétiniennes, nerveuses et vasculaires [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>].</p>
<p>Le « diabète sucré, sans précision » désigne un diabète dont le type n’est pas documenté. Il n’a pas de mécanisme ni de médicament propres. L’OMS propose une catégorie clinique temporaire « diabète non classé ». Son rapprochement avec E14 est pédagogique ; les deux libellés ne sont pas une équivalence administrative démontrée [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32326843/master" target="_blank" rel="noopener">S20</a>].</p>
<p>La classification clinique relie chaque hypothèse au mécanisme et au traitement à envisager.</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Hypothèse</th><th data-e14-style="e14-local-1">Mécanisme dominant</th><th data-e14-style="e14-local-1">Conséquence pratique</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Type 1</td><td data-e14-style="e14-local-1">Destruction β-cellulaire, souvent auto-immune</td><td data-e14-style="e14-local-1">L’insulinodéficience peut exiger immédiatement l’insuline.</td></tr><tr><td data-e14-style="e14-local-1">Type 2</td><td data-e14-style="e14-local-1">Résistance à l’insuline et défaut sécrétoire variables</td><td data-e14-style="e14-local-1">La stratégie dépend de la réserve, du risque cardiovasculaire et rénal.</td></tr><tr><td data-e14-style="e14-local-1">Formes hybrides</td><td data-e14-style="e14-local-1">Auto-immunité lente ou diabète avec cétose et réserve récupérable</td><td data-e14-style="e14-local-1">Le suivi peut modifier le classement et les besoins.</td></tr><tr><td data-e14-style="e14-local-1">Autre type spécifique</td><td data-e14-style="e14-local-1">Maladie du pancréas, médicament, endocrinopathie ou anomalie génétique</td><td data-e14-style="e14-local-1">Le traitement dépend de la cause, pas du seul phénotype.</td></tr><tr><td data-e14-style="e14-local-1">Hyperglycémie de la grossesse</td><td data-e14-style="e14-local-1">Diabète préexistant ou gestationnel selon les critères</td><td data-e14-style="e14-local-1">Le parcours obstétrical et sa classification sont spécifiques.</td></tr><tr><td data-e14-style="e14-local-1">Type non encore classé</td><td data-e14-style="e14-local-1">Information insuffisante ou discordante</td><td data-e14-style="e14-local-1">La sécurité est assurée puis le type est réévalué.</td></tr></tbody></table>
<p>Ces catégories ne se distinguent pas par un âge, un poids ou un anticorps isolés. Un adulte obèse peut avoir un diabète auto-immun ; une personne mince peut avoir un type 2. La <button class="w" data-k="e14-classification">classification et ses limites</button> évite de transformer une probabilité en certitude [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<div class="key"><b>À retenir.</b> Le type est une conclusion argumentée et révisable. « Sous insuline » ne signifie pas « type 1 ».</div><button class="pareto-btn ui" data-k="pareto-e14-2">Essentiel — Définition, histoire naturelle et classification clinique</button></section>
<section class="ilot" id="e14-3"><h2><span class="n">3</span>Épidémiologie suisse et limites de comparaison</h2><p>L’enquête suisse sur la santé 2022 estime à 6,2 % la proportion des personnes de 15 ans ou plus déclarant un diabète ou un traitement. Elle concernait les ménages privés et reposait sur une déclaration. Cette proportion était de 4,8 % en 2017 ; elle augmente avec l’âge. Les femmes étaient concernées à 5,6 % et les hommes à 6,9 % [<a data-reference-source="1" href="https://ind.obsan.admin.ch/fr/indicator/monam/diabete-age-15" target="_blank" rel="noopener">S7</a>].</p>
<p>Ces chiffres décrivent tous les diabètes déclarés. Ils ne mesurent ni l’incidence, ni les cas non diagnostiqués, ni la fréquence de E14. L’indicateur indique explicitement que les types ne sont pas quantifiables de manière fiable. Les personnes institutionnalisées ne sont pas représentées par cette enquête [<a data-reference-source="1" href="https://ind.obsan.admin.ch/fr/indicator/monam/diabete-age-15" target="_blank" rel="noopener">S7</a>].</p>
<p>L’OMS rapporte qu’environ 10 % des présentations initialement étiquetées type 2 en Europe, Amérique du Nord et Asie peuvent relever d’une auto-immunité lentement évolutive. Cette proportion dépend des populations et définitions. Elle ne mesure pas les diabètes sans précision en Suisse. La classification de recherche par sous-groupes citée par la SSED illustre l’hétérogénéité ; elle ne fournit pas une prévalence nationale des sous-types [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>].</p>
<div class="alert"><b>Limite documentaire.</b> Aucune incidence ou prévalence contemporaine suisse ou européenne spécifique à E14 n’a été établie dans les sources consultées. La fréquence de tous les diabètes ne la remplace pas.</div><div class="key"><b>À retenir.</b> Le poids du diabète en Suisse est documenté ; la part des types incertains reste une question distincte.</div><button class="pareto-btn ui" data-k="pareto-e14-3">Essentiel — Épidémiologie suisse et limites de comparaison</button></section>
<section class="ilot" id="e14-4"><h2><span class="n">4</span>Du fonctionnement normal aux syndromes</h2><p>Le pancréas comprend un tissu exocrine digestif et des îlots endocrines. Les cellules β sécrètent l’insuline, les cellules α le glucagon. L’insuline favorise l’utilisation et le stockage des nutriments ; elle freine la production hépatique de glucose et de corps cétoniques. Son effet doit être proportionné aux besoins [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-9-the-endocrine-pancreas" target="_blank" rel="noopener">S21</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Le clivage de la proinsuline libère une molécule d’insuline et une de peptide C. La sécrétion est équimolaire, mais leurs concentrations dans le sang périphérique ne sont pas égales : l’insuline subit une extraction hépatique importante et disparaît plus vite. Le <button class="w" data-k="e14-peptide">peptide C : production, prélèvement et limites</button> aide donc à estimer la sécrétion endogène, même sous insuline injectée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<p>Quand l’insuline devient insuffisante, la production hépatique de glucose augmente et l’utilisation devient inadaptée. L’hyperglycémie provoque une diurèse osmotique : l’eau et les électrolytes sont perdus dans les urines. La polyurie précède ainsi souvent la soif et la déshydratation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-9-the-endocrine-pancreas" target="_blank" rel="noopener">S21</a>].</p>
<p>Une carence plus profonde, associée aux hormones de contre-régulation, favorise la lipolyse puis la production de cétones. Leur accumulation provoque une acidose. Dans l’état hyperosmolaire, une sécrétion résiduelle limite la cétose sans contrôler la glycémie ; les pertes d’eau deviennent majeures. Les formes mixtes existent et ne doivent pas être forcées dans deux catégories exclusives [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Le potassium total peut être très diminué alors que la kaliémie initiale est normale ou élevée. L’acidose et le déficit insulinique déplacent le potassium vers le plasma ; la diurèse et les vomissements le font perdre. L’insuline le fait rentrer dans les cellules : une kaliémie basse devient particulièrement dangereuse au début du traitement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<div class="key"><b>À retenir.</b> La polyurie reflète une perte d’eau ; les cétones reflètent un déficit d’action insulinique. Une kaliémie initiale normale ne prouve pas des réserves normales.</div><button class="pareto-btn ui" data-k="pareto-e14-4">Essentiel — Du fonctionnement normal aux syndromes</button></section>
<section class="ilot" id="e14-5"><h2><span class="n">5</span>Étiologies et facteurs qui orientent le typage</h2><p>L’enquête recherche une destruction auto-immune, une insulinorésistance, une maladie pancréatique et une cause médicamenteuse ou génétique. Ces hypothèses peuvent se combiner. Une infection peut révéler un diabète préexistant ; elle n’établit pas à elle seule une nouvelle étiologie [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Chaque hypothèse possède des indices qui orientent un examen utile.</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Hypothèse</th><th data-e14-style="e14-local-1">Indices à rechercher</th><th data-e14-style="e14-local-1">Étape discriminante</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Type 1 ou auto-immun lent</td><td data-e14-style="e14-local-1">Perte de poids rapide, cétose, autre maladie auto-immune ; tout âge possible</td><td data-e14-style="e14-local-1">Les autoanticorps et la réserve sécrétoire complètent le tableau.</td></tr><tr><td data-e14-style="e14-local-1">Type 2</td><td data-e14-style="e14-local-1">Adiposité viscérale, sédentarité, antécédents familiaux, acanthosis nigricans</td><td data-e14-style="e14-local-1">Le contexte soutient l’hypothèse mais n’exclut pas une auto-immunité.</td></tr><tr><td data-e14-style="e14-local-1">Diabète pancréatique</td><td data-e14-style="e14-local-1">Pancréatite, chirurgie, tumeur ou autre atteinte exocrine connue</td><td data-e14-style="e14-local-1">L’histoire et les explorations sont ciblées sur le pancréas.</td></tr><tr><td data-e14-style="e14-local-1">Cause médicamenteuse</td><td data-e14-style="e14-local-1">Corticostéroïdes, immunothérapie anticancéreuse ou autres traitements hyperglycémiants</td><td data-e14-style="e14-local-1">La chronologie et le mécanisme du médicament sont confrontés au profil.</td></tr><tr><td data-e14-style="e14-local-1">Forme monogénique</td><td data-e14-style="e14-local-1">Diabète avant six mois ; histoire familiale évocatrice chez un sujet jeune</td><td data-e14-style="e14-local-1">Une consultation spécialisée détermine l’intérêt du test génétique.</td></tr><tr><td data-e14-style="e14-local-1">Endocrinopathie</td><td data-e14-style="e14-local-1">Signes d’excès d’hormones antagonistes de l’insuline</td><td data-e14-style="e14-local-1">L’exploration hormonale suit une suspicion clinique.</td></tr></tbody></table>
<p>L’âge modifie les probabilités sans créer une frontière absolue. Avant six mois, une cause monogénique est prioritaire ; le type 2 est rare avant la puberté. Les formes monogéniques du jeune adulte, l’auto-immunité lente et les maladies du pancréas demandent une attention particulière lorsqu’un type 2 paraît atypique [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>].</p>
<p>La cétose n’est pas réservée au type 1. Une récupération de la sécrétion après stabilisation peut modifier le classement. Une origine géographique ne suffit jamais à exclure cette évolution ; l’ancienne formulation ethnique de l’OMS 2019 n’est pas utilisée comme règle d’exclusion [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="key"><b>À retenir.</b> Le médecin choisit les examens qui peuvent modifier la décision. Le type reste réévalué après correction de la crise.</div><button class="pareto-btn ui" data-k="pareto-e14-5">Essentiel — Étiologies et facteurs qui orientent le typage</button></section>
<section class="ilot" id="e14-6"><h2><span class="n">6</span>Anamnèse : préciser le symptôme et son contexte</h2><div data-semiology-clinical="E14"><p>La <button class="w" data-k="e14-semio">sémiologie clinique analytique</button> commence par la chronologie. Le médecin distingue une augmentation du volume urinaire d’une simple fréquence accrue des mictions. Il précise la soif, les boissons, la nycturie, l’amaigrissement et la durée. Une installation en heures ou quelques jours évoque davantage une acidocétose ; l’état hyperosmolaire se développe souvent sur plusieurs jours ou semaines [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Les vomissements, la douleur abdominale, une respiration profonde, une somnolence ou une confusion font rechercher une crise. La douleur abdominale touche plus de la moitié des acidocétoses dans la synthèse 2024 ; si elle persiste après correction, une autre cause doit être recherchée. Une douleur peut aussi signaler le facteur déclenchant [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Le médecin demande les traitements exacts et leur dernière prise, les omissions d’insuline, une panne de dispositif, le jeûne, un régime cétogène, l’alcool et les signes d’infection. Il recherche une grossesse et une maladie rénale ou cardiaque. Sous inhibiteur du cotransport sodium-glucose, une glycémie peu élevée ne rassure pas devant vomissements et cétones [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Il explore aussi les hypoglycémies, leur perception et le recours à une tierce personne, puis les symptômes visuels, sensitifs, vasculaires et les plaies du pied. L’accès à l’insuline, au matériel et à une alimentation régulière, la compréhension du traitement et la santé psychique influencent le risque de récidive ; ils font partie de l’enquête, sans jugement [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">S13</a>].</p>
</div><div class="key"><b>À retenir.</b> La temporalité, les pertes hydriques et les traitements donnent au chiffre glycémique sa signification clinique.</div><button class="pareto-btn ui" data-k="pareto-e14-6">Essentiel — Anamnèse : préciser le symptôme et son contexte</button></section>
<section class="ilot" id="e14-7"><h2><span class="n">7</span>Examen clinique et syndromes de gravité</h2><p>L’examen commence par la conscience, la ventilation et la circulation. La fréquence cardiaque, la pression artérielle, les muqueuses et la diurèse contribuent à l’évaluation volémique. Une respiration ample de Kussmaul traduit une compensation de l’acidose ; son absence n’exclut pas une crise [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Une stabilité apparente de la pression artérielle n’exclut pas la déplétion. Dans l’hyperosmolarité, le transfert d’eau depuis les cellules peut préserver temporairement le secteur vasculaire. Le poids, la température et l’examen dirigé recherchent infection, ischémie et facteur déclenchant. Un électrocardiogramme complète le bilan devant les troubles électrolytiques ou une suspicion d’ischémie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>].</p>
<p>Le pied est inspecté dessus, dessous et entre les orteils. Le médecin décrit plaie, chaleur, rougeur, profondeur, déformation et pouls ; il teste la sensibilité protectrice au monofilament et la vibration selon la technique enseignée. Une plaie peut être grave malgré l’absence de douleur si la sensibilité est diminuée [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">S13</a>].</p>
<p>Deux pouls palpables ou un indice cheville-bras apparemment rassurant n’excluent pas une artériopathie. L’évaluation associe, selon la suspicion ou l’ulcère, Doppler, indice cheville-bras et indice orteil-bras. La <button class="w" data-k="e14-pied">fenêtre pied diabétique et limites vasculaires</button> confronte explicitement les simplifications QCARE à la recommandation du groupe international du pied diabétique et des sociétés de chirurgie vasculaire 2023 [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-05-PAD-Guideline.pdf" target="_blank" rel="noopener">S25</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Syndrome</th><th data-e14-style="e14-local-1">Constats préoccupants</th><th data-e14-style="e14-local-1">Action</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Crise métabolique</td><td data-e14-style="e14-local-1">Vomissements, respiration profonde, confusion, pertes hydriques</td><td data-e14-style="e14-local-1">Le bilan urgent recherche cétones, acidose, potassium et hyperosmolarité.</td></tr><tr><td data-e14-style="e14-local-1">Pied infecté ou ischémique</td><td data-e14-style="e14-local-1">Gangrène, infection systémique/rapidement progressive ou ischémie sévère</td><td data-e14-style="e14-local-1">Une équipe spécialisée et vasculaire est sollicitée en urgence.</td></tr><tr><td data-e14-style="e14-local-1">Pied chaud et tuméfié</td><td data-e14-style="e14-local-1">Neuropathie et suspicion de Charcot aigu</td><td data-e14-style="e14-local-1">Le parcours de pied spécialisé est activé sans banaliser la douleur absente.</td></tr><tr><td data-e14-style="e14-local-1">Hypoglycémie sévère</td><td data-e14-style="e14-local-1">Trouble cognitif empêchant l’autotraitement, convulsion ou perte de conscience</td><td data-e14-style="e14-local-1">Une tierce personne traite et appelle les secours.</td></tr></tbody></table>
<p>Ces signes déterminent la priorité. Ils ne constituent pas un score unique validé pour E14 [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-05-PAD-Guideline.pdf" target="_blank" rel="noopener">S25</a>].</p>
<div class="key"><b>À retenir.</b> La gravité est clinique et biologique. Un chiffre isolé, un pouls palpable ou une douleur absente ne suffisent pas à rassurer.</div><button class="pareto-btn ui" data-k="pareto-e14-7">Essentiel — Examen clinique et syndromes de gravité</button></section>

<section class="ilot" id="e14-8"><h2><span class="n">8</span>Diagnostic positif, examens et arbre décisionnel</h2><p>Le diagnostic de diabète repose sur une mesure adaptée et ses conditions. La grossesse possède un parcours particulier. Chez l’adulte non enceinte, les seuils suivants viennent de l’OMS 2019 ; la prise de position suisse 2011 apporte les précautions pour l’hémoglobine glyquée [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">S14</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Mesure</th><th data-e14-style="e14-local-1">Seuil de diabète</th><th data-e14-style="e14-local-1">Conditions</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Glycémie plasmatique à jeun</td><td data-e14-style="e14-local-1">≥7,0 mmol/L</td><td data-e14-style="e14-local-1">Le prélèvement et le jeûne sont documentés.</td></tr><tr><td data-e14-style="e14-local-1">Glycémie plasmatique deux heures après 75 g de glucose</td><td data-e14-style="e14-local-1">≥11,1 mmol/L</td><td data-e14-style="e14-local-1">Une épreuve standardisée est nécessaire.</td></tr><tr><td data-e14-style="e14-local-1">Hémoglobine glyquée HbA1c</td><td data-e14-style="e14-local-1">≥6,5 % (48 mmol/mol)</td><td data-e14-style="e14-local-1">La méthode est standardisée et les interférences sont considérées.</td></tr><tr><td data-e14-style="e14-local-1">Glycémie plasmatique aléatoire</td><td data-e14-style="e14-local-1">≥11,1 mmol/L</td><td data-e14-style="e14-local-1">Des signes ou symptômes de diabète sont présents.</td></tr></tbody></table>
<p>Chez une personne asymptomatique, l’OMS demande une confirmation, de préférence par le même test un autre jour, dès que possible. Une situation aiguë impose en parallèle l’évaluation de gravité. Le symbole « supérieur à » du document suisse 2011 est plus ancien ; les seuils « supérieur ou égal » de l’OMS sont retenus ici [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">S14</a>].</p>
<p>Une HbA1c basse ou discordante ne doit pas différer la prise en charge d’une hyperglycémie aiguë. Hémolyse, transfusion, hémoglobinopathie, carence martiale ou atteinte sévère rénale/hépatique peuvent modifier sa lecture. La <button class="w" data-k="e14-hba">fenêtre HbA1c et discordances</button> distingue le seuil diagnostique, le risque intermédiaire et la cible de traitement [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">S14</a>].</p>
<div class="key"><b>Arbre décisionnel.</b> Le médecin confirme l’hyperglycémie et recherche immédiatement une crise. Si la sécurité est menacée, il traite selon le protocole hospitalier. Il cherche ensuite une cause secondaire et confronte âge, histoire familiale, phénotype, autoanticorps et peptide C. Une information insuffisante conduit à une conclusion provisoire écrite et à un contrôle programmé [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</div><p>Le peptide C n’est pas systématiquement reporté de trois à cinq ans : il peut aider plus tôt si la question est pertinente. Sa valeur discriminante augmente avec la durée. Il s’interprète avec la glycémie du prélèvement, le repas ou la stimulation, la méthode et la fonction rénale. Un résultat conservé au début n’exclut pas un type 1 [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<div class="key"><b>À retenir.</b> Le diagnostic de diabète, le diagnostic de crise et le diagnostic du type répondent à trois questions différentes.</div><button class="pareto-btn ui" data-k="pareto-e14-8">Essentiel — Diagnostic positif, examens et arbre décisionnel</button></section>
<section class="ilot" id="e14-9"><h2><span class="n">9</span>Drapeaux rouges et crises hyperglycémiques</h2><p>Une acidocétose ou un état hyperosmolaire impose des soins hospitaliers rapides. Les critères du consensus conjoint 2024 concernent l’adulte. Les enfants, la grossesse et l’insuffisance rénale avancée nécessitent des parcours adaptés [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">État</th><th data-e14-style="e14-local-1">Critères à réunir</th><th data-e14-style="e14-local-1">Point de vigilance</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Acidocétose</td><td data-e14-style="e14-local-1">Diabète connu ou glycémie ≥11,1 mmol/L ; β-hydroxybutyrate ≥3,0 mmol/L ou cétonurie ≥2+ ; pH &lt;7,3 et/ou bicarbonate &lt;18 mmol/L</td><td data-e14-style="e14-local-1">Les trois composantes doivent être présentes. Une glycémie &lt;11,1 reste possible chez le diabétique connu.</td></tr><tr><td data-e14-style="e14-local-1">État hyperosmolaire</td><td data-e14-style="e14-local-1">Glycémie ≥33,3 mmol/L ; osmolalité efficace &gt;300 mOsm/kg ou totale &gt;320 ; β-hydroxybutyrate &lt;3,0 ou cétonurie &lt;2+ ; pH ≥7,3 et bicarbonate ≥15 mmol/L</td><td data-e14-style="e14-local-1">Les quatre composantes diagnostiques viennent de la figure 2 du consensus ; une forme mixte modifie le traitement.</td></tr></tbody></table>
<p>Le seuil de bicarbonate ≥15 dans le diagnostic hyperosmolaire ne doit pas être confondu avec ≥18 dans la branche thérapeutique sans acidose du même consensus. Un bicarbonate de 16 demande l’analyse de la cause de l’acidose et un avis expert ; il ne justifie pas une sélection automatique du débit d’insuline [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Gravité de l’acidocétose</th><th data-e14-style="e14-local-1">Cétones et acidose</th><th data-e14-style="e14-local-1">Orientation proposée</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Légère</td><td data-e14-style="e14-local-1">β-hydroxybutyrate 3–6 ; pH &gt;7,25 à &lt;7,30 ou bicarbonate 15–18 mmol/L</td><td data-e14-style="e14-local-1">Unité avec surveillance étroite si patient alerte et sans complication.</td></tr><tr><td data-e14-style="e14-local-1">Modérée</td><td data-e14-style="e14-local-1">β-hydroxybutyrate 3–6 ; pH 7,0–7,25 ; bicarbonate 10 à &lt;15</td><td data-e14-style="e14-local-1">Soins intermédiaires selon état clinique et moyens.</td></tr><tr><td data-e14-style="e14-local-1">Sévère</td><td data-e14-style="e14-local-1">β-hydroxybutyrate &gt;6 ; pH &lt;7,0 ou bicarbonate &lt;10 ; stupeur/coma possible</td><td data-e14-style="e14-local-1">Soins intensifs ; l’état clinique peut suffire à escalader.</td></tr></tbody></table>
<p>Tous les critères de la ligne ne doivent pas être présents simultanément pour orienter le niveau de soins. Le coma, le sepsis, l’infarctus et les défaillances d’organes priment sur la seule case biologique. Les détails du <button class="w" data-k="e14-crise">traitement adulte et de la résolution</button> restent liés à la surveillance [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="alert"><b>Urgence malgré glycémie modérée.</b> Sous inhibiteur du cotransport sodium-glucose, pendant une grossesse, un jeûne ou après administration d’insuline, des cétones élevées et une acidose peuvent accompagner une glycémie inférieure à 11,1 mmol/L [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</div><h3>Hypoglycémie : traiter le niveau de conscience</h3><p>Une personne consciente capable d’avaler peut traiter une hypoglycémie modérée par du glucose ou un aliment sucré, conformément à la FI de l’insuline. Un trouble cognitif empêchant l’autotraitement, une convulsion ou une perte de conscience impose une aide urgente ; rien n’est donné par la bouche si la déglutition n’est pas sûre. Le <button class="w" data-k="e14-baqsimi">glucagon nasal exact</button> peut être administré par une tierce personne selon son indication. L’équipe médicale peut devoir utiliser du glucose intraveineux si la réponse est insuffisante. Après récupération, l’apport de glucides et la recherche de la cause réduisent le risque de récidive [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">S18</a>].</p><div class="key"><b>À retenir.</b> Les cétones et l’équilibre acido-basique déterminent l’acidocétose. L’hyperosmolarité se calcule avec une formule précisée.</div><button class="pareto-btn ui" data-k="pareto-e14-9">Essentiel — Drapeaux rouges et crises hyperglycémiques</button></section>
<section class="ilot" id="e14-10"><h2><span class="n">10</span>Prise en charge : stabiliser puis choisir le traitement</h2><p>La crise exige quatre actions coordonnées : restaurer prudemment la perfusion, corriger le déficit d’action insulinique, gérer les électrolytes et traiter le facteur déclenchant. La glycémie se contrôle toutes les une à deux heures ; le bilan électrolytique, la créatinine, les cétones et le pH sont suivis environ toutes les quatre heures. L’osmolalité est également suivie dans l’état hyperosmolaire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Le consensus 2024 propose, chez l’adulte sans atteinte cardiaque ni rénale, un cristalloïde isotonique ou équilibré à 500–1000 ml/h pendant les deux à quatre premières heures, puis une adaptation clinique. Le sujet fragile, insuffisant cardiaque ou dialysé reçoit des quantités plus prudentes avec réévaluations rapprochées. Ce repère syndromique ne choisit pas une marque ni n’annule sa contre-indication [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Une kaliémie inférieure à 3,5 mmol/L demande correction avant l’insuline dans le consensus. L’insuline fait rentrer le potassium dans les cellules ; la perfusion trop précoce peut provoquer une arythmie. Le <button class="w" data-k="e14-potassium">potassium : protocole et divergence des produits suisses</button> distingue impérativement le repère international du choix de l’ampoule [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680295520907" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680514340132" target="_blank" rel="noopener">S26</a>].</p>
<p>Dans une acidocétose, le consensus propose habituellement une insuline rapide en perfusion continue à 0,1 unité/kg/h ; lorsque la glycémie descend sous 13,9 mmol/L, le glucose ajouté et une réduction usuelle à 0,05 unité/kg/h permettent de poursuivre jusqu’à correction des cétones. La FI <button class="w" data-k="e14-novorapid">NovoRapid 100 unités/ml</button> permet l’administration intraveineuse surveillée, mais ne fournit pas ce protocole de crise. Le produit, la préparation et la pompe sont vérifiés par l’équipe [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<p>Dans l’état hyperosmolaire sans acidose significative, la réhydratation précède ou accompagne une insulinothérapie plus prudente. JBDS peut différer l’insuline jusqu’au ralentissement de la baisse glycémique sous remplissage ; les formes mixtes suivent une logique d’acidocétose. La vitesse de correction de l’osmolalité compte autant que celle du glucose [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>].</p>
<p>Après stabilisation, une insulinodéficience présumée conduit à une insulinothérapie adaptée, une éducation et une consultation spécialisée. Une co-formulation proposée par la SSED à un sous-groupe de type 2 insulinodéficient ne constitue pas le traitement universel d’un type 1 possible. Le relais de perfusion exige un recouvrement avec l’insuline sous-cutanée pour éviter un intervalle sans couverture [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Si le type 2 devient probable ou confirmé, la SSED recommande une prise en charge multifactorielle et envisage metformine avec une classe protectrice cardio-rénale. Le choix dépend de la fonction rénale, de l’alimentation, du risque de cétose et des autorisations du produit. Un inhibiteur du cotransport sodium-glucose ne remplace pas l’insuline chez un patient insulinodéficient. Le médicament <button class="w" data-k="e14-metformine">Glucophage : information professionnelle exacte</button> est contre-indiqué pendant une acidose ou une déshydratation aiguë [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>].</p>
<div class="key"><b>À retenir.</b> La stabilisation précède le traitement durable. Chaque protocole s’applique à sa population et chaque médicament à son produit exact.</div><button class="pareto-btn ui" data-k="pareto-e14-10">Essentiel — Prise en charge : stabiliser puis choisir le traitement</button></section>
<section class="ilot" id="e14-11"><h2><span class="n">11</span>Complications, suivi et prévention des récidives</h2><p>L’exposition chronique à l’hyperglycémie, la pression artérielle, le tabac et le risque lipidique contribuent aux atteintes d’organes. Une baisse isolée de l’HbA1c ne suffit pas à organiser les soins. L’évaluation recherche rein, rétine, sensibilité, circulation des pieds et risque cardiovasculaire ; une complication peut précéder la reconnaissance du diabète [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">S15</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Domaine</th><th data-e14-style="e14-local-1">Organisation du suivi</th><th data-e14-style="e14-local-1">Limite</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Glycémie et traitement</td><td data-e14-style="e14-local-1">Contrôles réguliers ; grille SSED 2017 : ≥3 consultations/an et HbA1c ≥2/an</td><td data-e14-style="e14-local-1">Le début du traitement et les déséquilibres demandent davantage de contrôles.</td></tr><tr><td data-e14-style="e14-local-1">Rein</td><td data-e14-style="e14-local-1">Créatinine/filtration et rapport albumine/créatinine urinaire au moins annuels</td><td data-e14-style="e14-local-1">La chronicité exige ≥3 mois ; une anomalie aiguë n’attend pas pour être évaluée.</td></tr><tr><td data-e14-style="e14-local-1">Pied</td><td data-e14-style="e14-local-1">Inspection, sensibilité et pouls au moins annuels ; fréquence accrue selon le risque</td><td data-e14-style="e14-local-1">Un ulcère ne relève pas d’un simple rendez-vous annuel.</td></tr><tr><td data-e14-style="e14-local-1">Œil</td><td data-e14-style="e14-local-1">Évaluation ophtalmologique ; grille 2017 : au moins tous les deux ans</td><td data-e14-style="e14-local-1">L’intervalle est individualisé si rétinopathie, grossesse ou baisse visuelle.</td></tr><tr><td data-e14-style="e14-local-1">Type du diabète</td><td data-e14-style="e14-local-1">Réévaluation du dossier, des anticorps/réserve selon indication</td><td data-e14-style="e14-local-1">Une glycémie normalisée sous traitement ne prouve pas le type.</td></tr></tbody></table>
<p>La synthèse suisse rénale distingue un débit estimé &lt;60 ml/min/1,73 m² et une albuminurie anormale persistants au moins trois mois. Le <button class="w" data-k="e14-rein">bilan rénal et ses catégories</button> évite de qualifier toute protéinurie de diabétique. Une hématurie active, une dégradation rapide ou un syndrome néphrotique demandent un avis néphrologique [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">S15</a>].</p>
<p>Après une crise, le patient reçoit un schéma écrit, du matériel disponible, les règles lors d’une maladie intercurrente et un contact en cas de cétones, vomissements ou hypoglycémie. Le consensus propose un suivi rapproché dans les deux à quatre semaines après sortie ; un besoin plus précoce est décidé selon le risque. Les difficultés financières, psychiques ou de compréhension sont traitées avec l’équipe [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>La SSED propose souvent une HbA1c autour de 7 %. Un objectif plus bas peut convenir à certains patients sans hypoglycémies ; une fragilité, des comorbidités ou une espérance de vie limitée conduisent à le relâcher. Le <button class="w" data-k="e14-cibles">tableau des cibles et du temps dans la cible</button> décrit des objectifs de traitement, pas des valeurs normales [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>].</p>
<div class="key"><b>À retenir.</b> Le suivi vérifie les organes, l’autonomie et le type. Le plan de sortie doit rendre possible le traitement prescrit.</div><button class="pareto-btn ui" data-k="pareto-e14-11">Essentiel — Complications, suivi et prévention des récidives</button></section>
<section class="ilot" id="e14-12"><h2><span class="n">12</span>Grossesse, enfant, âge avancé et organes défaillants</h2><p>La grossesse change les seuils, le suivi et le codage. Une hyperglycémie nouvellement découverte demande une évaluation obstétricale spécialisée ; l’HbA1c ne remplace pas l’épreuve utilisée pour diagnostiquer un diabète gestationnel. Une acidocétose peut être euglycémique et exige immédiatement une équipe médicale et obstétricale expérimentée [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Chez l’enfant, le diagnostic peut évoluer rapidement. Un diabète avant six mois appelle une enquête génétique urgente ; un type 1 possible doit être traité sans attendre cette conclusion. Les débits et volumes de crise adultes ne sont pas transposés à la pédiatrie. <button class="w" data-k="e14-novorapid">NovoRapid</button> indique des données posologiques dès deux ans ; son emploi sous deux ans relève d’une surveillance médicale étroite. Baqsimi est autorisé pour l’hypoglycémie sévère dès un an, ce qui ne crée pas un protocole pédiatrique complet [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<p>Chez la personne âgée, le médecin évalue cognition, nutrition, fragilité, aide disponible et risque d’hypoglycémie. Une anorexie ou une dénutrition rendent indésirable une stratégie accentuant la perte d’appétit. Une simplification peut être nécessaire. Une décompensation hyperosmolaire peut révéler une infection ou un manque d’accès à l’eau [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>].</p>
<p>Une insuffisance rénale peut augmenter le peptide C sanguin et réduire les besoins en insuline. La filtration modifie aussi l’éligibilité et la dose de metformine. La FI Glucophage octobre 2025 limite à 1000 mg/j l’intervalle 30–59 ml/min/1,73 m² et interdit le produit sous 30. Ce plafond exact est plus restrictif que certains tableaux génériques [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<p>L’insuffisance hépatique contre-indique Glucophage ; la déplétion en glycogène peut diminuer l’effet du glucagon. Les besoins en insuline deviennent individualisés. Les monographies ne doivent pas fusionner absence d’adaptation forfaitaire et démonstration de sécurité dans toute défaillance [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<div class="key"><b>À retenir.</b> La population et les organes conditionnent chaque résultat et chaque dose. Une conduite adulte standard ne couvre pas toutes ces situations.</div><button class="pareto-btn ui" data-k="pareto-e14-12">Essentiel — Grossesse, enfant, âge avancé et organes défaillants</button></section>
<section class="ilot" id="e14-13"><h2><span class="n">13</span>Documentation clinique, sous-codes et particularités suisses</h2><p>Après le raisonnement clinique, le dossier précise le diabète documenté, le type retenu ou encore incertain, les complications et le plan de réévaluation. E14 est utilisé quand le type reste sans précision. L’insuline reçue ne permet pas d’affecter rétrospectivement un type 1 [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32326843/master" target="_blank" rel="noopener">S20</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Sous-catégorie</th><th data-e14-style="e14-local-1">Présentation couverte</th><th data-e14-style="e14-local-1">Orientation clinique</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">E14.0</td><td data-e14-style="e14-local-1">Avec coma</td><td data-e14-style="e14-local-1">Le médecin distingue hypoglycémie, hyperosmolarité, acidocétose et autre cause du coma.</td></tr><tr><td data-e14-style="e14-local-1">E14.1</td><td data-e14-style="e14-local-1">Avec acidocétose</td><td data-e14-style="e14-local-1">Le diagnostic biologique et les critères de résolution sont vérifiés.</td></tr><tr><td data-e14-style="e14-local-1">E14.2</td><td data-e14-style="e14-local-1">Complications rénales</td><td data-e14-style="e14-local-1">La chronicité et les causes rénales alternatives sont considérées.</td></tr><tr><td data-e14-style="e14-local-1">E14.3</td><td data-e14-style="e14-local-1">Complications oculaires</td><td data-e14-style="e14-local-1">La rétine et le cristallin relèvent de l’évaluation ophtalmologique.</td></tr><tr><td data-e14-style="e14-local-1">E14.4</td><td data-e14-style="e14-local-1">Complications neurologiques</td><td data-e14-style="e14-local-1">La neuropathie peut être sensitive, autonome, focale ou diffuse.</td></tr><tr><td data-e14-style="e14-local-1">E14.5</td><td data-e14-style="e14-local-1">Complications vasculaires périphériques</td><td data-e14-style="e14-local-1">L’ischémie, la gangrène et l’ulcère demandent une évaluation vasculaire.</td></tr><tr><td data-e14-style="e14-local-1">E14.6</td><td data-e14-style="e14-local-1">Autres complications précisées</td><td data-e14-style="e14-local-1">Une arthropathie ou une autre atteinte doit être documentée.</td></tr><tr><td data-e14-style="e14-local-1">E14.7</td><td data-e14-style="e14-local-1">Complications multiples</td><td data-e14-style="e14-local-1">Le pied diabétique et les autres atteintes multiples sont détaillés.</td></tr><tr><td data-e14-style="e14-local-1">E14.8</td><td data-e14-style="e14-local-1">Complications non précisées</td><td data-e14-style="e14-local-1">L’imprécision de la complication est explicitée et réduite si possible.</td></tr><tr><td data-e14-style="e14-local-1">E14.9</td><td data-e14-style="e14-local-1">Sans complication</td><td data-e14-style="e14-local-1">L’absence de complication documentée n’abolit pas le dépistage.</td></tr></tbody></table>
<p>Les sous-divisions suisses à cinq caractères sont expliquées dans la <button class="w" data-k="e14-nosologie">fenêtre de classification et décompensation</button>. Le manuel 2025 juge la décompensation sur l’ensemble du traitement et de l’évolution, et non sur la glycémie d’admission seule. Le diagnostic principal dépend aussi du motif d’hospitalisation ; un tableau pédagogique ne remplace pas la règle de codage appliquée au cas [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32326843/master" target="_blank" rel="noopener">S20</a>].</p>
<p>La <button class="w" data-k="e14-conduite">conduite automobile en Suisse</button> dépend du traitement, des hypoglycémies, des complications et du groupe médical du permis. Le patient n’est pas rendu apte à conduire par un code ou une HbA1c isolée. Le document suisse 2025 distingue les porteurs d’une surveillance continue avec alarmes et ceux sans cette sécurité [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">S8</a>].</p>
<p>Aucune prise en charge financière individuelle, couverture de dispositif ou autorisation de conduite n’est garantie ici. Les règles de la liste des spécialités et des moyens et appareils doivent être vérifiées pour le produit, l’indication et la date. Les conditions historiques d’indice de masse corporelle dans les recommandations 2023 ne sont pas présentées comme remboursement automatique en 2026. Aucune obligation spécifique de déclaration ni couverture accident, invalidité ou remboursement individuel n’a été établie dans les sources de cette leçon ; ces questions administratives restent à vérifier pour le cas concerné [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32326843/master" target="_blank" rel="noopener">S20</a>].</p>
<div class="key"><b>À retenir.</b> Le code décrit la conclusion clinique ; il ne la remplace ni ne décide le remboursement.</div><button class="pareto-btn ui" data-k="pareto-e14-13">Essentiel — Documentation clinique, sous-codes et particularités suisses</button></section>
<section class="ilot" id="e14-14"><h2><span class="n">14</span>Critères formels, paramètres décisifs et pièges</h2><p>Le patient initial conserve un type provisoire tant que les arguments manquent. Sa glycémie capillaire élevée impose l’évaluation urgente de la crise. Des anticorps négatifs ou un peptide C mesurable au début ne suffisent pas à supprimer le risque d’insulinodéficience [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="alert"><b>Critères formels.</b> Chez l’adulte non enceinte, le diabète est défini par glycémie plasmatique à jeun ≥7,0 mmol/L, post-charge à deux heures ≥11,1, HbA1c standardisée ≥6,5 %, ou glycémie aléatoire ≥11,1 avec symptômes. L’asymptomatique demande confirmation. L’acidocétose exige les composantes diabète/hyperglycémie, cétones et acidose ; la glycémie seule ne suffit pas. E14 signifie que le type demeure sans précision [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</div><div class="key"><b>Paramètres clés.</b> Une cétonémie ≥3,0 mmol/L et un pH &lt;7,3 et/ou bicarbonate &lt;18 orientent l’acidocétose. Une kaliémie &lt;3,5 retarde l’insuline dans le consensus adulte. L’osmolalité efficace &gt;300 ou totale &gt;320 n’a de sens que dans le tableau hyperosmolaire complet. La résolution de l’acidocétose exige cétones &lt;0,6 et pH ≥7,3 ou bicarbonate ≥18 [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</div><p>Les pièges décisifs sont la confusion entre sécrétion équimolaire et concentrations identiques d’insuline/peptide C ; l’exclusion de type 1 par l’âge ou l’obésité ; la rassurance sur une glycémie modérée sous traitement favorisant la cétose ; la transposition d’une dose générique à un produit contre-indiqué ; l’exclusion d’artériopathie par deux pouls ; l’étiquetage d’une maladie rénale chronique après seulement deux mois [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680295520907" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-05-PAD-Guideline.pdf" target="_blank" rel="noopener">S25</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680514340132" target="_blank" rel="noopener">S26</a>].</p>
<p>Pour l’examen, l’objectif est d’argumenter la gravité, le choix de l’examen et l’action, puis d’expliquer le suivi au patient. Aucun score unique E14, aucune fréquence nationale E14 et aucune garantie de question fédérale ne sont inventés [<a data-reference-source="1" href="https://ind.obsan.admin.ch/fr/indicator/monam/diabete-age-15" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S28</a>].</p>
<div class="key"><b>À retenir.</b> Le dossier garde séparés diagnostic, type, crise, cible et codage. Chaque incertitude appelle une action et une échéance.</div><button class="pareto-btn ui" data-k="pareto-e14-14">Essentiel — Critères formels, paramètres décisifs et pièges</button></section>
<div class="src"><h3>Sources effectivement consultées</h3><p>Les passages, populations et limites sont détaillés dans le dossier de recherche. Les anciens audits restent attachés à leur version.</p>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="e14-e-1"><h2>Choisir l’examen selon la question</h2><p>Il n’existe pas un test unique répondant au diagnostic, à la gravité et au type. Chaque prescription demande une question précise et un résultat capable de modifier la conduite [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Question</th><th data-e14-style="e14-local-1">Examen pertinent</th><th data-e14-style="e14-local-1">Interprétation et limite</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Diabète confirmé ?</td><td data-e14-style="e14-local-1">Glycémie plasmatique, HbA1c standardisée ou épreuve orale selon contexte</td><td data-e14-style="e14-local-1">La confirmation chez l’asymptomatique respecte le test et sa méthode.</td></tr><tr><td data-e14-style="e14-local-1">Crise présente ?</td><td data-e14-style="e14-local-1">Glucose, électrolytes, créatinine, cétones, gaz veineux ; osmolalité selon tableau</td><td data-e14-style="e14-local-1">Le β-hydroxybutyrate aide au diagnostic et au suivi ; une bandelette seule est plus limitée.</td></tr><tr><td data-e14-style="e14-local-1">Auto-immunité ?</td><td data-e14-style="e14-local-1">Autoanticorps ciblés</td><td data-e14-style="e14-local-1">Un résultat s’interprète dans le tableau clinique, sans devenir un ordre de traitement universel.</td></tr><tr><td data-e14-style="e14-local-1">Sécrétion endogène ?</td><td data-e14-style="e14-local-1">Peptide C avec glycémie et fonction rénale</td><td data-e14-style="e14-local-1">Le repas ou la stimulation et la méthode conditionnent le seuil.</td></tr><tr><td data-e14-style="e14-local-1">Complication rénale ?</td><td data-e14-style="e14-local-1">Filtration estimée et rapport albumine/créatinine</td><td data-e14-style="e14-local-1">Une chronicité doit être établie ; une cause non diabétique reste possible.</td></tr><tr><td data-e14-style="e14-local-1">Pied ischémique ?</td><td data-e14-style="e14-local-1">Examen, Doppler et indices de pression selon suspicion</td><td data-e14-style="e14-local-1">Aucun chiffre isolé ne suffit à exclure la maladie artérielle.</td></tr></tbody></table>
<p>Une glycémie très élevée change l’urgence, mais ne classe pas le type. Un peptide C conservé change une probabilité ; il ne dispense pas d’évaluer les cétones [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="key"><b>À retenir.</b> La question clinique détermine le test, les conditions de mesure et la décision attendue.</div><button class="pareto-btn ui" data-k="pareto-e14-e-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e14-e-2"><h2>Glycémie, hémoglobine glyquée et valeurs intermédiaires</h2><p>La glycémie mesure une concentration à un instant donné. L’HbA1c reflète une exposition liée à l’hémoglobine, dont la durée de vie et la méthode influencent le résultat. Les repères intermédiaires suivants sont des catégories de risque, et non l’intervalle de référence de tout laboratoire [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">S14</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Mesure</th><th data-e14-style="e14-local-1">Sous la zone intermédiaire citée</th><th data-e14-style="e14-local-1">Zone intermédiaire SSED 2011</th><th data-e14-style="e14-local-1">Seuil diabète OMS 2019</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">À jeun, plasma</td><td data-e14-style="e14-local-1">&lt;5,6 mmol/L</td><td data-e14-style="e14-local-1">5,6–6,9 mmol/L</td><td data-e14-style="e14-local-1">≥7,0 mmol/L</td></tr><tr><td data-e14-style="e14-local-1">Deux heures après 75 g</td><td data-e14-style="e14-local-1">&lt;7,8 mmol/L</td><td data-e14-style="e14-local-1">≥7,8 à &lt;11,1 mmol/L</td><td data-e14-style="e14-local-1">≥11,1 mmol/L</td></tr><tr><td data-e14-style="e14-local-1">HbA1c standardisée</td><td data-e14-style="e14-local-1">&lt;5,7 %</td><td data-e14-style="e14-local-1">5,7–6,4 %</td><td data-e14-style="e14-local-1">≥6,5 % (48 mmol/mol)</td></tr></tbody></table>
<p>La borne post-charge 11,1 est exclue de la zone intermédiaire pour éviter un chevauchement : elle répond déjà au seuil diabétique OMS. Une valeur sous le seuil d’HbA1c ne réfute pas une hyperglycémie pathologique établie par le plasma. La <button class="w" data-k="e14-hba">discordance HbA1c/glycémie</button> demande une vérification de la méthode et du renouvellement érythrocytaire [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">S14</a>].</p>
<div class="quiz ui" id="e14-quiz-1"><p><b>Cas 1.</b> Une personne asymptomatique a une HbA1c de 6,6 % isolée. Aucun élément de crise n’est présent. Quelle suite respecte l’OMS ?</p>
<button data-ok="0">Le diabète est exclu, car la glycémie manque.</button><button data-ok="1">Le résultat doit être confirmé rapidement, de préférence par le même test un autre jour.</button><button data-ok="0">Le type 2 est certain et le traitement est déterminé.</button><p class="fb" hidden>La confirmation ne doit pas être confondue avec le typage. Une méthode fiable et les facteurs d’interférence sont vérifiés ; le résultat isolé ne prouve pas un type [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">S14</a>].</p>
</div><div class="key"><b>À retenir.</b> Le seuil de diagnostic, la zone de risque et la cible thérapeutique sont trois repères différents.</div><button class="pareto-btn ui" data-k="pareto-e14-e-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e14-e-3"><h2>Peptide C et anticorps : lire les conditions avant le chiffre</h2><p>Le peptide C est produit avec l’insuline endogène. En revanche, son élimination et celle de l’insuline diffèrent. L’insuline injectée ne contient pas de peptide C ; le dosage reste utile sous traitement, à condition de connaître le contexte glycémique et rénal [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Situation</th><th data-e14-style="e14-local-1">Ce qu’elle change</th><th data-e14-style="e14-local-1">Erreur à éviter</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Hypoglycémie au prélèvement</td><td data-e14-style="e14-local-1">La sécrétion est physiologiquement diminuée.</td><td data-e14-style="e14-local-1">Le résultat bas ne se lit pas comme une destruction β certaine.</td></tr><tr><td data-e14-style="e14-local-1">Insuffisance rénale</td><td data-e14-style="e14-local-1">L’élimination du peptide C diminue.</td><td data-e14-style="e14-local-1">Un résultat conservé ne prouve pas une réserve suffisante.</td></tr><tr><td data-e14-style="e14-local-1">Début du diabète</td><td data-e14-style="e14-local-1">Une réserve peut persister dans le type 1.</td><td data-e14-style="e14-local-1">La valeur mesurable ne supprime pas le risque d’insulinodéficience.</td></tr><tr><td data-e14-style="e14-local-1">Valeur stimulée très basse</td><td data-e14-style="e14-local-1">La revue propose &lt;0,2 nmol/L pour un déficit absolu dans ses populations.</td><td data-e14-style="e14-local-1">Ce repère n’est pas le seuil à jeun ; méthode et proximité de la borne comptent.</td></tr><tr><td data-e14-style="e14-local-1">Peptide C &gt;200 et &lt;600 pmol/L avec anticorps négatifs</td><td data-e14-style="e14-local-1">La SSED décrit un contexte d’insulinodéficience, sans exclure un type 1 précoce.</td><td data-e14-style="e14-local-1">Le résultat ne devient pas un intervalle normal universel.</td></tr></tbody></table>
<p>Le repère stimulé &lt;0,2 nmol/L de la revue correspond à &lt;200 pmol/L. Un prélèvement à jeun n’a pas le même seuil proposé. La <button class="w" data-k="e14-peptide">fenêtre du peptide C</button> précise la conversion, la glycémie simultanée et les limites [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<div class="quiz ui" id="e14-quiz-2"><p><b>Cas 2.</b> Un adulte obèse, traité par insuline depuis peu, a un peptide C mesurable avec une insuffisance rénale. Peut-on exclure un type 1 ?</p>
<button data-ok="0">Oui, l’obésité et le peptide C suffisent.</button><button data-ok="1">Non, la durée, la glycémie, la fonction rénale et l’auto-immunité doivent être confrontées.</button><button data-ok="0">Oui, toute insuline injectée apporte du peptide C.</button><p class="fb" hidden>Le peptide C reflète la sécrétion endogène, mais le rein et la glycémie changent sa lecture. La sécrétion peut persister au début d’un diabète auto-immun [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
</div><div class="key"><b>À retenir.</b> Un résultat mesure une fonction dans des conditions connues ; il ne remplace pas le dossier clinique.</div><button class="pareto-btn ui" data-k="pareto-e14-e-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e14-e-4"><h2>Crise, résolution et dépistage des complications</h2><p>Dans une crise, les examens suivent une trajectoire. L’équipe ne s’arrête pas à la baisse du glucose si les cétones ou l’acidose persistent. La <button class="w" data-k="e14-osmoles">formule d’osmolalité</button> et le <button class="w" data-k="e14-anion">trou anionique</button> ont des usages distincts [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Mesure de suivi</th><th data-e14-style="e14-local-1">Repère du consensus adulte</th><th data-e14-style="e14-local-1">Limite</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Glycémie</td><td data-e14-style="e14-local-1">Contrôle toutes les une à deux heures</td><td data-e14-style="e14-local-1">Une baisse ne signifie pas résolution de l’acidocétose.</td></tr><tr><td data-e14-style="e14-local-1">Potassium</td><td data-e14-style="e14-local-1">Contrôle deux heures après début d’insuline puis toutes les quatre heures</td><td data-e14-style="e14-local-1">La substitution dépend aussi du rein, de la diurèse et du produit.</td></tr><tr><td data-e14-style="e14-local-1">Résolution d’acidocétose</td><td data-e14-style="e14-local-1">Cétones &lt;0,6 mmol/L et pH ≥7,3 ou bicarbonate ≥18 mmol/L</td><td data-e14-style="e14-local-1">Le trou anionique et la cétonurie ne sont pas les critères privilégiés.</td></tr><tr><td data-e14-style="e14-local-1">Résolution hyperosmolaire proposée</td><td data-e14-style="e14-local-1">Osmolalité &lt;300, cognition améliorée, diurèse &gt;0,5 ml/kg/h et glycémie &lt;13,9 mmol/L</td><td data-e14-style="e14-local-1">Il s’agit d’une définition proposée ; l’état clinique est suivi.</td></tr><tr><td data-e14-style="e14-local-1">Bilan chronique</td><td data-e14-style="e14-local-1">Rapport urinaire albumine/créatinine, filtration, œil et pied</td><td data-e14-style="e14-local-1">Une anomalie atypique ne doit pas être automatiquement attribuée au diabète.</td></tr></tbody></table>
<p>Une catégorie rénale exige une persistance, pas seulement deux résultats proches. Le <button class="w" data-k="e14-rein">rapport urinaire et la filtration</button> indique les unités et les facteurs qui modifient le suivi [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">S15</a>].</p>
<div class="quiz ui" id="e14-quiz-3"><p><b>Cas 3.</b> Sous un traitement favorisant la cétose, un patient diabétique vomit. Glycémie 9 mmol/L, β-hydroxybutyrate 4,2, pH 7,18 et bicarbonate 9. Quelle hypothèse est prioritaire ?</p>
<button data-ok="0">L’acidocétose est exclue par la glycémie.</button><button data-ok="1">Une acidocétose euglycémique impose une prise en charge urgente.</button><button data-ok="0">Une simple zone de prédiabète suffit à expliquer le tableau.</button><p class="fb" hidden>Le diabète connu satisfait la première composante malgré le glucose modéré. Cétones et acidose établissent les autres composantes ; la situation est urgente [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
</div><div class="quiz ui" id="e14-quiz-4"><p><b>Cas 4.</b> Après traitement, le β-hydroxybutyrate est de 0,5 mmol/L, le pH de 7,31 et le bicarbonate de 17. Le critère de résolution de l’acidocétose est-il atteint ?</p>
<button data-ok="1">Oui, cétones &lt;0,6 et pH ≥7,3 satisfont le critère.</button><button data-ok="0">Non, la cétonurie doit absolument disparaître.</button><button data-ok="0">Non, le trou anionique doit toujours être normal.</button><p class="fb" hidden>Le critère relie cétones basses et pH ou bicarbonate corrigé. La situation globale, la glycémie et le relais doivent encore être appréciés ; la cétonurie peut rester trompeuse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
</div><div class="key"><b>À retenir.</b> La résolution métabolique, la stabilité clinique et la sécurité du relais sont vérifiées ensemble.</div><button class="pareto-btn ui" data-k="pareto-e14-e-4">Essentiel de cette partie</button></section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="e14-tab-semio" role="tab" aria-selected="true" aria-controls="e14-s-semio" data-s="e14-s-semio">Sémiologie fondamentale et analytique</button><button id="e14-tab-anat" role="tab" aria-selected="false" aria-controls="e14-s-anat" data-s="e14-s-anat">Anatomie</button><button id="e14-tab-histo" role="tab" aria-selected="false" aria-controls="e14-s-histo" data-s="e14-s-histo">Histologie</button><button id="e14-tab-physio" role="tab" aria-selected="false" aria-controls="e14-s-physio" data-s="e14-s-physio">Physiologie</button><button id="e14-tab-bioch" role="tab" aria-selected="false" aria-controls="e14-s-bioch" data-s="e14-s-bioch">Biochimie</button><button id="e14-tab-gene" role="tab" aria-selected="false" aria-controls="e14-s-gene" data-s="e14-s-gene">Génétique et immunologie</button></div><div class="chap-body sci-body"><div class="sci" role="tabpanel" aria-labelledby="e14-tab-semio" id="e14-s-semio"><section class="ilot" id="e14-s-semio-cours"><h2>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h2><p>La sémiologie relie une plainte à un mécanisme, puis à un examen capable de modifier la décision. La glycémie est une mesure ; sa signification dépend de la situation et de l’état du patient [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<figure><svg role="img" aria-label="Démarche logique non anatomique, sans score : contexte → hypothèse → examen → action [S4, S10, S11]." viewBox="0 0 450 312" data-e14-style="e14-local-2"><rect x="8" y="5" width="434" height="52" rx="8" fill="#eff5f7" stroke="#28546d"/><text x="225" y="37" fill="#183a55" font-size="17" text-anchor="middle">Plainte et chronologie documentées</text><text x="225" y="79" fill="#183a55" font-size="22" text-anchor="middle">↓</text><rect x="8" y="83" width="434" height="52" rx="8" fill="#eff5f7" stroke="#28546d"/><text x="225" y="115" fill="#183a55" font-size="17" text-anchor="middle">Mécanisme et risque immédiat recherchés</text><text x="225" y="157" fill="#183a55" font-size="22" text-anchor="middle">↓</text><rect x="8" y="161" width="434" height="52" rx="8" fill="#eff5f7" stroke="#28546d"/><text x="225" y="193" fill="#183a55" font-size="17" text-anchor="middle">Examen ciblé et conditions précisées</text><text x="225" y="235" fill="#183a55" font-size="22" text-anchor="middle">↓</text><rect x="8" y="239" width="434" height="52" rx="8" fill="#eff5f7" stroke="#28546d"/><text x="225" y="271" fill="#183a55" font-size="17" text-anchor="middle">Décision, explication et suivi écrits</text></svg><figcaption>Démarche logique non anatomique, sans score : contexte → hypothèse → examen → action [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</figcaption></figure>
</section>
<section class="ilot" id="e14-semio-normal" data-semiology="normal"><h3>Normalité : équilibre entre production et utilisation</h3><p>Le pancréas endocrine adapte l’insuline aux besoins. La production hépatique de glucose et son utilisation tissulaire doivent rester coordonnées. La sécrétion de peptide C suit celle de l’insuline, mais leurs concentrations périphériques diffèrent. Un intervalle de laboratoire, un seuil de diabète et une cible de traitement ne désignent pas la même chose [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-9-the-endocrine-pancreas" target="_blank" rel="noopener">S21</a>].</p>
