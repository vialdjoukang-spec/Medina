<figure><img src="assets/img/c77/alpha/claude/lymph_node_regions_seer.svg" alt="Silhouette humaine de face portant des zones colorées et des étiquettes en anglais pour les régions ganglionnaires : anneau de Waldeyer, prétragienne, cervicale et occipitale, sus-claviculaire, infraclaviculaire, pectorale, axillaire, épitrochléenne et brachiale, médiastinale, hilaire, rate, para-aortique, mésentérique, iliaque, inguinale et fémorale, poplitée."><figcaption>Figure 1 — Régions ganglionnaires du corps humain, schéma original du programme SEER du National Cancer Institute, vectorisé par Fred the Oyster. Les étiquettes anglaises se lisent ainsi : <i>Waldeyer ring</i>, anneau de Waldeyer ; <i>Pre-auricular</i>, prétragien ; <i>Cervical and occipital</i>, cervical et occipital ; <i>Supraclavicular</i>, sus-claviculaire ; <i>Infraclavicular</i>, infraclaviculaire ; <i>Pectoral</i>, pectoral ; <i>Axillary</i>, axillaire ; <i>Epitrochlear and brachial</i>, épitrochléen et brachial ; <i>Mediastinal</i>, médiastinal ; <i>Hilar</i>, hilaire ; <i>Spleen</i>, rate ; <i>Paraaortic</i>, para-aortique ; <i>Mesenteric</i>, mésentérique ; <i>Iliac</i>, iliaque ; <i>Inguinal and femoral</i>, inguinal et fémoral ; <i>Popliteal</i>, poplité. Dans la CIM-10-GM 2024, C77.0 regroupe la tête, la face et le cou, sus-claviculaire compris ; C77.1 les ganglions intrathoraciques ; C77.2 les ganglions intra-abdominaux ; C77.3 l’aisselle et le membre supérieur, pectoraux compris ; C77.4 l’aine et le membre inférieur ; C77.5 les ganglions intrapelviens. Le schéma a été conçu pour les régions de la classification d’Ann Arbor des lymphomes ; il situe les régions sans représenter les voies de drainage, et les rectangles colorés ne sont pas à l’échelle. Image : « Lymph node regions.svg », d’après NCI SEER Training Modules, œuvre du gouvernement fédéral des États-Unis, domaine public ; vectorisation Fred the Oyster ; via Wikimedia Commons.</figcaption></figure>
<p>La figure situe les régions ganglionnaires que le codage C77 distingue. Elle ne montre pas le drainage de chaque organe : le lien entre la région atteinte et le primitif probable est donné par le tableau topographique de l’onglet Pathologie et par le texte ci-dessus.</p>
