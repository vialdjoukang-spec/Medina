<section class="ilot" id="g05-semio-normal" data-semiology="normal"><h3>1. Normalité utile : fonctions, circuits et liquide</h3><p data-src="R27,R33,R36,R38">L’examen compare vigilance, orientation, mémoire et langage au fonctionnement habituel décrit par le patient et son entourage. Il recherche une commande motrice symétrique, une perception sensitive cohérente, des réflexes interprétables et un contrôle sphinctérien conservé. La moelle associe une substance grise centrale, où se trouvent notamment les motoneurones, et des voies longitudinales dans la substance blanche : elle est donc un relais local autant qu’une voie de passage.</p><p data-src="R38">Pour le LCR lombaire adulte, le tableau des Swiss Memory Clinics 2024 fournit des repères : ≤ 4 cellules/µL, protéines 0,15–0,45 g/L, glucose voisin de 60 % de la glycémie et lactate &lt;2,1 mmol/L. Ces repères proviennent d’un document sur les troubles cognitifs et doivent céder aux intervalles du laboratoire, à l’âge et aux conditions du prélèvement. Ils ne constituent ni un score d’encéphalite ni des normes néonatales.</p></section>
<section class="ilot" id="g05-semio-signs" data-semiology="signs"><h3>2. Analyser les symptômes dans le temps</h3><p data-src="R2,R17,R18,R39">Une confusion, une amnésie récente, un changement de comportement, une aphasie, une crise ou une baisse de vigilance suggèrent une atteinte cérébrale. Une paraparésie ou tétraparésie, des troubles sensitifs sous un certain niveau, une douleur en ceinture et une rétention urinaire orientent vers la moelle. Une céphalée avec photophobie et raideur de nuque évoque les méninges ; son absence n’exclut pas une encéphalite. Des signes cérébraux et médullaires associés font discuter une encéphalomyélite.</p><p data-src="R2,R18,R37">Préciser la dernière période de fonctionnement normal, la vitesse d’installation, la progression, les fluctuations, les crises observées et les traitements déjà administrés. Un début en quelques minutes ou heures fait notamment rechercher un mécanisme vasculaire ; une progression inflammatoire peut être aiguë ou subaiguë. Décrire « je n’arrive plus à marcher » en termes de force, équilibre, douleur et sensibilité évite de confondre faiblesse, ataxie et limitation douloureuse.</p></section>
<section class="ilot" id="g05-semio-mechanisms" data-semiology="mechanisms"><h3>3. Relier structure, perturbation et signe</h3><table class="t"><thead><tr><th>Fonction ou structure</th><th>Perturbation</th><th>Signe et conséquence pratique</th></tr></thead><tbody><tr data-src="R1,R2,R19"><td>Réseaux temporaux médiaux impliqués dans la mémoire</td><td>Inflammation nécrosante HSV ou atteinte limbique auto-immune</td><td>Amnésie, confusion, crises : rechercher infection et auto-immunité, sans attribuer la cause à la seule topographie.</td></tr><tr data-src="R33,R36"><td>Commande corticospinale et motoneurones médullaires</td><td>Lésion des voies descendantes ou de la corne ventrale</td><td>Déficit moteur ; signes pyramidaux parfois retardés. Une aréflexie initiale ne prouve pas une atteinte périphérique.</td></tr><tr data-src="R7,R37"><td>Voies proprioceptives dorsales et racines</td><td>Atteinte tabétique</td><td>Ataxie sensitive et aréflexie : sérologie syphilis et bilan neurologique adapté.</td></tr><tr data-src="R18,R37"><td>Voies longues et contrôle sphinctérien</td><td>Myélopathie inflammatoire, compressive ou vasculaire</td><td>Déficit sous-lésionnel et troubles urinaires : IRM urgente, avant de conclure à une infection médullaire.</td></tr><tr data-src="R3,R31"><td>Élimination rénale des antiviraux</td><td>Accumulation ou troubles électrolytiques liés au traitement</td><td>Confusion, myoclonies ou crises peuvent être iatrogènes : revoir doses, rein et ions en parallèle du bilan infectieux.</td></tr></tbody></table></section>
<section class="ilot" id="g05-semio-examination" data-semiology="examination"><h3>4. Réaliser et documenter l’examen</h3><p data-src="R2,R27,R36">Commencer par les fonctions vitales et la vigilance ; noter l’heure et les facteurs qui gênent l’évaluation, dont sédation ou état postcritique. Décrire orientation, parole, compréhension et mémoire récente, puis nerfs crâniens, force, tonus, réflexes, sensibilité et coordination. Comparer les côtés et répéter l’examen si le tableau évolue. La marche ne s’évalue que si l’état et la sécurité le permettent.</p><p data-src="R36">Pour objectiver une faiblesse, comparer le maintien des bras tendus et celui des membres inférieurs en position de Mingazzini, puis les groupes musculaires. Rechercher le réflexe plantaire par stimulation du bord externe de la plante d’arrière en avant : la flexion du gros orteil est habituelle, son extension constitue le signe de Babinski. Des réflexes vifs isolés peuvent être physiologiques ; la diffusion, le clonus et l’ensemble du tableau comptent davantage qu’un adjectif isolé.</p><p data-src="R17,R18,R37">En cas de suspicion médullaire, préciser les modalités sensitives atteintes, leur distribution et leur limite supérieure, sans assimiler automatiquement niveau sensitif et niveau lésionnel. Interroger explicitement miction, rétention, transit et fonction sexuelle. Rechercher une atteinte respiratoire dans les formes cervicales hautes et des signes visuels ou de l’area postrema si une maladie AQP4/MOG est possible. L’examen doit être complété par une évaluation spécialisée des fonctions sphinctériennes lorsque nécessaire.</p></section>
<section class="ilot" id="g05-semio-interpretation" data-semiology="interpretation"><h3>5. Interpréter sans transformer un indice en preuve</h3><p data-src="R2,R18,R39">Ni l’absence de fièvre, ni celle de raideur, de pléiocytose ou de lésion précoce à l’IRM ne suffisent à exclure une encéphalite. Une PCR négative se lit selon le virus, la méthode, la date du prélèvement et la probabilité clinique. En particulier, le panel multiplex ne remplace pas une PCR ciblée HSV lorsqu’une suspicion forte persiste. Des neutrophiles ou des bandes oligoclonales dans le LCR ne démontrent pas, à eux seuls, une infection ou une sclérose en plaques.</p><p data-src="R20">Le GCS &lt;12 est associé à un pronostic défavorable dans la cohorte danoise de 495 adultes hospitalisés ; il ne constitue pas un test diagnostique d’HSV. À l’inverse, une orientation clinique plausible ne dispense pas de rechercher une cause traitable différente. Les associations observées dans une cohorte ne décrivent pas une causalité certaine pour chaque patient.</p></section>
<section class="ilot" id="g05-semio-differentials" data-semiology="differentials"><h3>6. Distinguer les principaux diagnostics concurrents</h3><p data-src="R2,R17,R18,R19,R24">Une méningite bactérienne peut altérer la vigilance et nécessite une couverture antibiotique immédiate si elle reste plausible. Une encéphalite auto-immune peut évoluer sans fièvre, avec IRM ou LCR peu contributifs. Une crise non convulsive peut expliquer une confusion et justifier l’EEG. Une myélopathie compressive, un infarctus médullaire ou une fistule durale peuvent imiter une myélite : la topographie, la rapidité et l’IRM orientent le bilan. Les troubles métaboliques, toxiques et médicamenteux restent à rechercher simultanément.</p><p data-src="R18,R30">Chez une personne lupique, l’infection, le mécanisme inflammatoire, la thrombose et une NMOSD associée restent des hypothèses distinctes. Une auto-immunité déjà connue n’autorise pas à attribuer toute nouvelle manifestation à la même maladie. Des anticorps positifs mais discordants avec le syndrome demandent confirmation et discussion avec le laboratoire.</p></section>
<section class="ilot" id="g05-semio-urgency" data-semiology="urgency"><h3>7. Reconnaître l’urgence et agir</h3><p data-src="R2,R26">Détérioration de vigilance, crises répétées ou prolongées, signe d’engagement, insuffisance respiratoire, choc ou déficit rapidement progressif imposent l’escalade immédiate. Si l’encéphalite herpétique est suspectée, commencer l’aciclovir IV sans attendre la PCR, idéalement dans les six premières heures selon EAN/ESCMID 2026. Ce repère n’est pas un délai à laisser passer. Si une méningite bactérienne est possible, la SSI vise les antibiotiques dans l’heure suivant l’admission.</p><p data-src="R2,R17,R37">Un déficit médullaire avec rétention urinaire ou atteinte respiratoire appelle une IRM et un avis neurologique/neurochirurgical urgents selon l’hypothèse. La PL se fait rapidement si elle est sûre ; si l’imagerie ou une contre-indication la retarde, commencer les traitements urgents après les prélèvements sanguins possibles, sans attendre. La définition de cas exigeant 24 heures de symptômes ne doit jamais retarder les soins.</p></section>
<section class="ilot" id="g05-semio-limits" data-semiology="limits"><h3>8. Limites et populations particulières</h3><p data-src="R2,R3,R4,R18,R38">Les recommandations EAN/ESCMID portent sur l’adulte hospitalisé ; elles ne sont pas un protocole néonatal. L’immunodépression peut atténuer la fièvre ou la réaction du LCR et élargit le diagnostic différentiel. Le sujet âgé, l’insuffisant rénal, la femme enceinte et l’enfant nécessitent un choix médicamenteux adapté au produit exact. Les tableaux biologiques sont des repères, pas des seuils universels indépendants du laboratoire.</p><p data-src="R27,R28,R29">Les liens avec PROFILES 2017 sont une correspondance pédagogique proposée par l’auteur. PROFILES 2 entre dans l’enseignement dès le semestre 2025/26 et devient la base annoncée de l’examen fédéral 2028 ; les identifiants des deux versions ne sont pas interchangeables. L’apprentissage sur cette page ne démontre pas une autonomie d’examen clinique ou de ponction lombaire.</p></section>
<section class="ilot" id="g05-semio-sources" data-semiology="sources"><h3>9. Quels passages soutiennent cette analyse ?</h3><p>R2, PICO 1–16 : anamnèse, urgences, PL, PCR, IRM, EEG et rééducation. R17, sémiologie et orientation des myélites : niveau, sphincters et causes non infectieuses. R18, sections 4–9 : NMOSD, anticorps, LCR et diagnostics concurrents. R36–R37, examen pyramidal et syndromes médullaires : technique et localisation. R38, tableau 2 : repères biologiques lombaires adultes. R27–R29 : cadre pédagogique suisse et calendrier. Les références héritées non rouvertes ne servent pas de preuve nouvelle.</p><p class="src">Passages relus le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/" data-reference-source="1" target="_blank" rel="noopener">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a> ; <a href="https://www.infectiologie.com/UserFiles/File/formation/desc/2025/seminaire-octobre-2025/vend-1010-them.-12/conf-2-myelites-c-henry.pdf" data-reference-source="1" target="_blank" rel="noopener">R17 — Orientation diagnostique devant une myélite, Carole Henry</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" data-reference-source="1" target="_blank" rel="noopener">R18 — NEMOS : diagnostic et diagnostic différentiel des NMOSD, partie I</a> ; <a href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal" data-reference-source="1" target="_blank" rel="noopener">R36 — Collège des enseignants de neurologie : syndrome pyramidal</a> ; <a href="https://www.cen-neurologie.fr/premier-cycle/les-fondamentaux-de-la-pathologie-neurologique/la-semiologie-neurologique-et-ses-bases-anatomofonctionnelles/chapitre-15-syndromes-topographiques" data-reference-source="1" target="_blank" rel="noopener">R37 — CEN : syndromes topographiques médullaires</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/85-JJvunZKA1/broschuere-diagnostikempfehlungen-demenz.pdf" data-reference-source="1" target="_blank" rel="noopener">R38 — Swiss Memory Clinics : diagnostic, tableau LCR</a> ; <a href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" data-reference-source="1" target="_blank" rel="noopener">R27 — PROFILES 2017, document officiel</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" data-reference-source="1" target="_blank" rel="noopener">R28 — MEBEKO : exigences examen médecine humaine 2026</a> ; <a href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" data-reference-source="1" target="_blank" rel="noopener">R29 — Berendonk et al., PROFILES 2</a>.</p></section></div><div class="sci" id="g05-s-anat" role="tabpanel" aria-labelledby="g05-tab-anat" hidden><section class="ilot" id="g05-s-anat-cours"><h2>Anatomie : du territoire à la fonction</h2><p data-src="R2,R34">La surface médiale du cerveau aide à situer les régions cingulaire et temporale médiale impliquées dans certaines encéphalites. La planche ci-dessous représente un hémisphère normal ; elle ne désigne aucune lésion. Dans l’encéphalite HSV, l’IRM peut montrer une atteinte temporale médiale, insulaire et frontale inférieure, parfois cingulaire. La topographie reste une orientation, à confronter au LCR et à l’évolution.</p><figure class="card" data-origin="human-original"><img src="assets/img/g05/alpha/codex/gray727.png" alt="Planche humaine Gray727 : surface médiale de l’hémisphère gauche, avec gyrus cingulaire, corps calleux, uncus et région parahippocampique." loading="lazy" width="700"><figcaption><b>Figure 1 — Repères de la face médiale gauche.</b> Henry Vandyke Carter, dans Gray, édition 1918, planche 727 ; domaine public. Original conservé. <a href="https://commons.wikimedia.org/wiki/File:Gray727.png" target="_blank" rel="noopener">Provenance et droits</a>.</figcaption><ol><li><b>Gyrus cingulaire</b> : bande corticale arquée au-dessus du corps calleux, étiquetée « Cingulate gyrus ».</li><li><b>Corps calleux</b> : structure centrale arquée, distincte du cortex qui l’entoure.</li><li><b>Région parahippocampique et uncus</b> : en bas de la face médiale ; l’ancienne étiquette « Hippocampal gyrus » correspond à un repère de surface. L’hippocampe profond n’est pas exposé par cette vue.</li><li><b>Orientation</b> : région frontale à droite de cette planche, région occipitale à gauche ; aucune convention d’IRM ne doit lui être appliquée.</li></ol><p data-src="R2,R34">Annotations françaises ajoutées à côté de l’original. Elles servent à situer les noms ; elles ne dessinent pas une atteinte HSV ni une extension obligatoire.</p></figure><p data-src="R18,R33,R37">La moelle se lit à deux échelles : les circuits locaux de substance grise, puis les voies longues qui conduisent les commandes et les informations sensitives. Une lésion peut donc associer des signes au niveau atteint et des signes en dessous. La localisation clinique oriente l’étendue de l’IRM, mais ne permet pas de présumer la cause inflammatoire, vasculaire ou compressive.</p><figure class="card" data-origin="human-original"><img src="assets/img/g05/alpha/codex/gray671.png" alt="Planche Gray671 : hémicoupes médullaires C7, T6, L1 et S1 illustrant les colonnes cellulaires." loading="lazy" width="350"><figcaption><b>Figure 2 — Variations de la substance grise médullaire.</b> Carter/Gray, édition 1918, planche 671 ; domaine public. <a href="https://commons.wikimedia.org/wiki/File:Gray671.png" target="_blank" rel="noopener">Original et droits</a>.</figcaption><ol><li><b>De haut en bas</b> : C7, T6, L1, S1, selon les étiquettes de l’original.</li><li><b>Substance grise</b> : territoire central pointillé, avec des groupes cellulaires différents selon le niveau.</li><li><b>Corne ventrale</b> : région des motoneurones ; son atteinte peut produire un déficit moteur flasque.</li><li><b>Limite</b> : cette planche historique montre des colonnes cellulaires et des hémicoupes ; elle n’est ni une IRM, ni une carte complète moderne de tous les faisceaux.</li></ol></figure><p data-src="R17,R18,R37">La distinction anatomique devient pratique devant un patient paraplégique : rechercher le niveau sensitif, les réflexes, les signes sphinctériens et les signes au-dessus du niveau. Une IRM limitée à la région lombaire ne suffit pas automatiquement ; la lésion peut être plus haute que les symptômes des jambes. Une atteinte cervicale haute peut compromettre la respiration.</p><p class="src">Passages relus le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/" data-reference-source="1" target="_blank" rel="noopener">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a> ; <a href="https://anatomie.cosminpopa.ro/en/3-the-spinal-cord-or-medulla-spinalis/" data-reference-source="1" target="_blank" rel="noopener">R33 — Gray, anatomie de la moelle, édition 1918</a> ; <a href="https://commons.wikimedia.org/wiki/File:Gray727.png" data-reference-source="1" target="_blank" rel="noopener">R34 — Gray 727 : surface médiale de l’hémisphère gauche</a> ; <a href="https://commons.wikimedia.org/wiki/File:Gray671.png" data-reference-source="1" target="_blank" rel="noopener">R35 — Gray 671 : colonnes cellulaires médullaires</a> ; <a href="https://www.infectiologie.com/UserFiles/File/formation/desc/2025/seminaire-octobre-2025/vend-1010-them.-12/conf-2-myelites-c-henry.pdf" data-reference-source="1" target="_blank" rel="noopener">R17 — Orientation diagnostique devant une myélite, Carole Henry</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" data-reference-source="1" target="_blank" rel="noopener">R18 — NEMOS : diagnostic et diagnostic différentiel des NMOSD, partie I</a> ; <a href="https://www.cen-neurologie.fr/premier-cycle/les-fondamentaux-de-la-pathologie-neurologique/la-semiologie-neurologique-et-ses-bases-anatomofonctionnelles/chapitre-15-syndromes-topographiques" data-reference-source="1" target="_blank" rel="noopener">R37 — CEN : syndromes topographiques médullaires</a>.</p><button class="pareto-btn ui" data-k="pareto-g05-anat">▲ Loi de Pareto — Anatomie</button></section></div><div class="sci" id="g05-s-histo" role="tabpanel" aria-labelledby="g05-tab-histo" hidden><section class="ilot" id="g05-s-histo-cours"><h2>Histologie : tissu normal et nature de la lésion</h2><p data-src="R33,R36,R37">La substance grise médullaire contient des corps cellulaires neuronaux, leurs prolongements et des éléments gliaux ; la substance blanche est dominée par des fibres organisées en voies. Les motoneurones de la corne ventrale envoient leurs axones vers les racines antérieures. Cette organisation explique qu’une atteinte de substance grise puisse donner une faiblesse flasque, tandis qu’une atteinte des voies longues produit un autre ensemble de signes, parfois après une phase initiale de sidération.</p><p data-src="R2,R39">L’encéphalite est une inflammation du parenchyme ; l’encéphalopathie décrit un dysfonctionnement cérébral sans prouver cette inflammation. Une inflammation méningée peut accompagner l’atteinte parenchymateuse, mais les cellules du LCR ne constituent pas une coupe histologique du cerveau. Leur nombre ne mesure donc pas directement l’étendue des lésions.</p><p data-src="R1,R7,R18">L’encéphalite HSV est décrite comme nécrosante ; les maladies démyélinisantes et les atteintes liées à AQP4/MOG relèvent de mécanismes différents. Dans la neurosyphilis, l’atteinte méningovasculaire peut associer inflammation vasculaire et ischémie ; le tabès touche particulièrement les racines postérieures et les voies proprioceptives. Ces distinctions évitent d’interpréter toute lésion T2 comme une même maladie.</p><p data-src="R2,R18">La biopsie cérébrale n’est pas le premier examen d’une encéphalite suspectée. Elle se discute après un bilan étendu resté non diagnostique, avec infectiologie, neurologie et neurochirurgie, en tenant compte d’une lésion accessible et de l’effet attendu sur le traitement. Une biopsie médullaire peut entraîner un handicap important : les diagnostics inflammatoires et les anticorps pertinents doivent être étudiés avant cette décision.</p><div class="key"><b>À retenir.</b> Une image inflammatoire ou un LCR anormal ne révèle pas, à lui seul, la cellule cible ni la cause. Localisation, mécanisme et étiologie sont trois questions distinctes.</div><p class="src">Passages relus le 2 novembre 2026 : <a href="https://anatomie.cosminpopa.ro/en/3-the-spinal-cord-or-medulla-spinalis/" data-reference-source="1" target="_blank" rel="noopener">R33 — Gray, anatomie de la moelle, édition 1918</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/" data-reference-source="1" target="_blank" rel="noopener">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13499315/" data-reference-source="1" target="_blank" rel="noopener">R7 — German guideline on neurosyphilis 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" data-reference-source="1" target="_blank" rel="noopener">R18 — NEMOS : diagnostic et diagnostic différentiel des NMOSD, partie I</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3783060/" data-reference-source="1" target="_blank" rel="noopener">R39 — International Encephalitis Consortium : définition des cas</a>.</p></section></div><div class="sci" id="g05-s-physio" role="tabpanel" aria-labelledby="g05-tab-physio" hidden><section class="ilot" id="g05-s-physio-cours"><h2>Physiologie : voies longues et liquide cérébro-spinal</h2><p data-src="R33,R36,R37">Les voies descendantes assurent la commande motrice volontaire et modulent l’activité réflexe. Leur interruption peut entraîner un déficit puis une libération des réflexes et une spasticité. Les voies sensitives restent organisées par modalités : la proprioception et le tact fin ne suivent pas exactement le trajet de la sensibilité thermoalgique. Une dissociation entre modalités a donc une valeur de localisation, sans identifier à elle seule l’agent responsable.</p><p data-src="R18,R38">Le LCR doit être interprété avec des prélèvements sanguins appariés lorsque l’examen le nécessite. La glycorachie se comprend par rapport à la glycémie ; les protéines et les quotients LCR/sérum renseignent sur les échanges et l’inflammation. Un taux augmenté de protéines n’équivaut pas à une synthèse locale d’anticorps. La cellularité dépend aussi du moment de la maladie et du terrain immunitaire.</p><table class="t"><thead><tr><th>Mesure lombaire adulte</th><th>Repère SMC 2024</th><th>Utilité et limite</th></tr></thead><tbody><tr data-src="R38"><td>Cellules</td><td>≤ 4/µL</td><td>Pléiocytose au-delà du repère local ; compter rapidement, idéalement sous 1–2 h selon le document.</td></tr><tr data-src="R38"><td>Protéines</td><td>0,15–0,45 g/L</td><td>Interpréter avec âge, laboratoire et contexte ; ni étiologie ni gravité seules.</td></tr><tr data-src="R38"><td>Glucose</td><td>Environ 60 % du taux sanguin</td><td>Associer une glycémie ; valeur isolée moins informative.</td></tr><tr data-src="R38"><td>Lactate</td><td>&lt;2,1 mmol/L</td><td>Repère de normalité, distinct des seuils d’orientation infectieuse.</td></tr></tbody></table><p data-src="R38,R2">Un calcul illustratif peut éclairer le rapport glucose : pour une glycorachie de 3,0 mmol/L et une glycémie simultanée de 5,0 mmol/L, le rapport vaut 3,0 ÷ 5,0=0,60. Les deux unités identiques s’annulent. Cet exemple fictif montre le calcul ; il ne permet pas d’exclure une infection chez un patient confus et fébrile.</p><p data-src="R2">L’évolution est aussi physiologique que microbiologique : les troubles de mémoire, la fatigue, les difficultés de communication ou les séquelles motrices peuvent persister après maîtrise de l’infection. EAN/ESCMID recommande d’évaluer les besoins de rééducation à tous les stades, même lorsque l’atteinte initiale paraît modérée, et de préparer un suivi avant la sortie.</p><p class="src">Passages relus le 2 novembre 2026 : <a href="https://anatomie.cosminpopa.ro/en/3-the-spinal-cord-or-medulla-spinalis/" data-reference-source="1" target="_blank" rel="noopener">R33 — Gray, anatomie de la moelle, édition 1918</a> ; <a href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal" data-reference-source="1" target="_blank" rel="noopener">R36 — Collège des enseignants de neurologie : syndrome pyramidal</a> ; <a href="https://www.cen-neurologie.fr/premier-cycle/les-fondamentaux-de-la-pathologie-neurologique/la-semiologie-neurologique-et-ses-bases-anatomofonctionnelles/chapitre-15-syndromes-topographiques" data-reference-source="1" target="_blank" rel="noopener">R37 — CEN : syndromes topographiques médullaires</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/85-JJvunZKA1/broschuere-diagnostikempfehlungen-demenz.pdf" data-reference-source="1" target="_blank" rel="noopener">R38 — Swiss Memory Clinics : diagnostic, tableau LCR</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" data-reference-source="1" target="_blank" rel="noopener">R18 — NEMOS : diagnostic et diagnostic différentiel des NMOSD, partie I</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/" data-reference-source="1" target="_blank" rel="noopener">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a>.</p><button class="pareto-btn ui" data-k="pareto-g05-liquide">▲ Loi de Pareto — Liquide cérébro-spinal</button></section></div><div class="sci" id="g05-s-immuno" role="tabpanel" aria-labelledby="g05-tab-immuno" hidden><section class="ilot" id="g05-s-immuno-cours"><h2>Immunologie : distinguer infection active et réponse secondaire</h2><p data-src="R1,R2,R19">Une infection peut léser directement le système nerveux et être suivie d’une réponse auto-immune. Après HSV, de nouveaux troubles psychiatriques, mouvements anormaux, crises ou une aggravation cognitive imposent de rechercher plusieurs causes : infection persistante ou nouvelle, complication, toxicité, crise non convulsive et encéphalite auto-immune. La succession temporelle ne prouve pas automatiquement le mécanisme immunitaire.</p><p data-src="R19">Pour les anticorps neuronaux, la cible précise, la classe d’immunoglobuline, le compartiment et la cohérence clinique sont essentiels. Les IgG dirigées contre GluN1 ont une signification différente d’anticorps mal spécifiés « anti-NMDA ». Le sérum seul peut être trompeur ; le bilan des encéphalites auto-immunes associe généralement sérum et LCR. Un résultat inattendu doit être discuté et confirmé, non transformé mécaniquement en diagnostic.</p><p data-src="R18">AQP4 est un canal hydrique très représenté dans le SNC ; les IgG anti-AQP4 sont associées à la majorité des NMOSD. MOGAD est une entité distincte, malgré des tableaux communs de myélite ou d’atteinte optique. Pour AQP4/MOG, les tests cellulaires sériques sont la référence pratique recommandée par NEMOS ; si possible, prélever avant immunothérapie. Une positivité faible ou une double positivité inhabituelle doit conduire à réexaminer le syndrome et la méthode.</p><p data-src="R18,R30">Dans le lupus, distinguer l’inflammation neurologique d’une manifestation vasculaire liée aux antiphospholipides est déterminant pour le traitement. Le bilan initial recherche les mêmes alternatives que chez une personne non lupique, en particulier l’infection et les causes toxiques ou métaboliques. Le lupus peut aussi coexister avec une NMOSD : le nom de la maladie systémique ne suffit pas à expliquer la myélite.</p><p data-src="R19,R30">Les décisions d’immunothérapie se fondent sur le syndrome, les examens et le degré d’exclusion des causes concurrentes. Elles ne reposent pas uniquement sur un titre d’anticorps, qui peut rester détectable après amélioration. Les formes sévères nécessitent une discussion spécialisée rapide ; l’attente d’un anticorps ne doit pas devenir une règle universelle de retard thérapeutique.</p><p class="src">Passages relus le 2 novembre 2026 : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">R1 — DGN S1 Virale Meningoenzephalitis 2025, v 7.0</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/" data-reference-source="1" target="_blank" rel="noopener">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" data-reference-source="1" target="_blank" rel="noopener">R18 — NEMOS : diagnostic et diagnostic différentiel des NMOSD, partie I</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5066574/" data-reference-source="1" target="_blank" rel="noopener">R19 — Graus et al. : diagnostic des encéphalites auto-immunes</a> ; <a href="https://doi.org/10.1136/ard-2023-224762" data-reference-source="1" target="_blank" rel="noopener">R30 — EULAR : recommandations lupus, actualisation 2023</a>.</p><button class="pareto-btn ui" data-k="pareto-g05-immuno">▲ Loi de Pareto — Immunologie</button></section></div><div class="sci" id="g05-s-bio" role="tabpanel" aria-labelledby="g05-tab-bio" hidden><section class="ilot" id="g05-s-bio-cours"><h2>Biochimie : comprendre tests et médicaments</h2><p data-src="R2,R7">Une PCR recherche un acide nucléique ; un anticorps témoigne d’une réponse immunitaire. Ces deux tests n’ont ni le même délai ni la même interprétation. La PCR ciblée du LCR est centrale pour HSV ; une recherche intrathécale d’anticorps peut compléter les situations tardives ou répétitivement négatives. Une sérologie positive dans le sang n’est pas automatiquement la preuve d’une production dans le SNC.</p><p data-src="R7,R18">Le raisonnement sur les quotients compare le compartiment LCR au sang. Le quotient d’anticorps spécifiques doit être confronté aux immunoglobulines totales et à l’état des échanges sang–LCR. Les formules simplifiées ne remplacent pas l’interprétation du laboratoire, notamment en cas de synthèse intrathécale globale ou de dysfonction importante de la barrière. Dans la neurosyphilis, un index antitréponémique peut rester positif longtemps et ne mesure pas à lui seul l’activité après traitement.</p><table class="t"><thead><tr><th>Cible</th><th>Mécanisme</th><th>Conséquence clinique</th></tr></thead><tbody><tr data-src="R3"><td>Aciclovir</td><td>Activation initiale par thymidine-kinase virale puis phosphorylation cellulaire ; inhibition de la polymérase et interruption de chaîne.</td><td>Sélectivité antivirale ; une résistance liée à la kinase peut modifier le choix du recours.</td></tr><tr data-src="R4,R31"><td>Ganciclovir / foscarnet</td><td>Activation du ganciclovir notamment par UL97 ; foscarnet inhibiteur direct sans cette activation.</td><td>Résistances et toxicités différentes ; ne pas transposer doses, indications ou compatibilités.</td></tr><tr data-src="R8,R11,R14"><td>Antifolates et folinate</td><td>Pyriméthamine : DHFR ; sulfadiazine : synthèse des folates ; folinate : forme réduite utilisable.</td><td>Association antiparasitaire et prévention de la toxicité médullaire, avec NFS et produit exact.</td></tr><tr data-src="R32"><td>Brivudine et DPD</td><td>Son métabolite inhibe durablement la dégradation des fluoropyrimidines.</td><td>Association potentiellement mortelle, y compris avec flucytosine ou 5-FU topique ; délai minimal après brivudine.</td></tr></tbody></table><p data-src="R3,R4,R31">La pharmacocinétique relie le mécanisme à la sécurité. Une baisse de clairance rénale peut augmenter l’exposition à l’aciclovir, au ganciclovir ou au foscarnet. La neurotoxicité et les troubles électrolytiques peuvent alors imiter une aggravation encéphalitique. Une dose se calcule avec l’unité exacte de la source : mg/kg, mg/m² et millions d’UI ne sont pas interchangeables ; la clairance du foscarnet est présentée en mL/min/kg dans sa FI.</p><p class="src">Passages relus le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/" data-reference-source="1" target="_blank" rel="noopener">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13499315/" data-reference-source="1" target="_blank" rel="noopener">R7 — German guideline on neurosyphilis 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" data-reference-source="1" target="_blank" rel="noopener">R18 — NEMOS : diagnostic et diagnostic différentiel des NMOSD, partie I</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" data-reference-source="1" target="_blank" rel="noopener">R3 — Aciclovir Labatec IV, FI suisse exacte</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680491880133" data-reference-source="1" target="_blank" rel="noopener">R4 — Cymevene 500 mg IV, FI suisse exacte</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680209640011" data-reference-source="1" target="_blank" rel="noopener">R8 — Daraprim 25 mg, FI suisse exacte</a> ; <a href="https://www.fachinfo.de/fi/pdf/004337" data-reference-source="1" target="_blank" rel="noopener">R11 — Sulfadiazin-Heyl 500 mg, RCP allemand exact</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680510760309" data-reference-source="1" target="_blank" rel="noopener">R14 — Folinate de calcium Sandoz, capsules 15 mg, FI suisse exacte</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680523570131" data-reference-source="1" target="_blank" rel="noopener">R31 — Foscavir, FI suisse exacte</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680554650024" data-reference-source="1" target="_blank" rel="noopener">R32 — Brivex, FI suisse exacte</a>.</p></section></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="g05-p-1"><h2><span class="n">p-1</span>Prescrire un produit, pour une indication et un patient</h2>
<p data-src="R2,R3,R4,R8,R10,R31">La recommandation clinique répond au choix de stratégie ; la fiche d’information professionnelle(FI) précise le produit, sa voie, ses indications homologuées et ses conditions de sécurité. Une recommandation plus récente ne remplace pas automatiquement la FI, et une durée de FI ne résout pas toutes les situations neurologiques. Toute divergence est nommée ci-dessous. Les doses adultes sont des références à fonction rénale normale, à adapter au patient et au protocole spécialisé.</p>
<table class="t"><thead><tr><th>Cible et mécanisme</th><th>Produit exact relu</th><th>Point de décision</th></tr></thead><tbody><tr><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">HSV/VZV : activation par thymidine-kinase virale, puis inhibition de la polymérase</td><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Aciclovir Labatec IV, GTIN 7680603250014, décembre 2025.</td><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Traitement urgent ; accumulation rénale et neurotoxicité à prévenir.</td></tr><tr><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">CMV : activation notamment par UL97, cible polymérase UL54</td><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Cymevene 500 mg IV, GTIN 7680491880133, janvier 2026.</td><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Myélotoxicité et néphrotoxicité ; résistance et indication à interpréter avec spécialiste.</td></tr><tr><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Polymérase virale : inhibition directe sans activation par kinase</td><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Foscavir 24 mg/mL, GTIN 7680523570131, juin 2022.</td><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">FI de rétinite CMV/HSV mucocutané résistant ; encéphalite hors périmètre étudié de cette FI.</td></tr><tr><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Paroi bactérienne : protéines liant les pénicillines</td><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Amoxicillin OrPha IV, GTIN 7680688150018, février 2026 ; Penicilline Grünenthal, GTIN 7680562710024, mai 2023.</td><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Listeria et neurosyphilis ont des régimes propres ; ne pas substituer une pénicilline dépôt.</td></tr><tr><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Céftriaxone, bêta-lactamine</td><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Ceftriaxon Labatec, GTIN 7680598760031, juin 2025.</td><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Méningite bactérienne empirique et alternative neurosyphilis ; pas couverture de Listeria.</td></tr><tr><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Voie des folates parasitaires</td><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Daraprim 25 mg, GTIN 7680209640011, février 2023 ; sulfadiazine de produit exact.</td><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Pyriméthamine associée au sulfamide et au folinate ; vérifier hémogramme et formulation.</td></tr><tr><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Blocage séquentiel de synthèse des folates</td><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Bactrim IV, GTIN 7680378870561, mars 2023.</td><td data-src="R1,R3,R4,R5,R8,R9,R10,R15,R16,R31">Toujours exprimer séparément TMP/SMX ; schéma toxoplasmose HAS distinct de la FI.</td></tr></tbody></table>
<p data-src="R14">Le folinate de calcium Sandoz relu est la <b>capsule 15 mg</b> (GTIN 7680510760309, septembre 2023). Le folinate fournit un folate réduit et contourne le blocage de réduction des folates ; il ne se confond pas avec l’acide folique. Sa FI porte sur le sauvetage après méthotrexate et l’association au 5-FU, pas explicitement sur la toxoplasmose ; son emploi avec pyriméthamine est étayé par Daraprim et les recommandations.</p>

</section>
<section class="ilot" id="g05-p-2"><h2><span class="n">p-2</span>Aciclovir : dose, perfusion et fonction rénale</h2>
<table class="t"><thead><tr><th>Population/indication</th><th>FI Aciclovir Labatec</th><th>Durée et précision</th></tr></thead><tbody><tr><td data-src="R2,R3">Adulte et adolescent&gt;12 ans, encéphalite HSV</td><td data-src="R2,R3">10 mg/kg IV toutes les 8 h.</td><td data-src="R2,R3">Perfusion lente sur au moins 1 h ; FI 10 jours, recommandation EAN au moins 14 jours pour HSV prouvé.</td></tr><tr><td data-src="R2,R3">Enfant 3 mois–12 ans, encéphalite HSV</td><td data-src="R2,R3">500 mg/m²IV toutes les 8 h.</td><td data-src="R2,R3">Ne pas remplacer cette dose par une dose adulte enmg/kg sans protocole pédiatrique.</td></tr><tr><td data-src="R2,R3">Nouveau-né, infection HSV du SNC ou disséminée</td><td data-src="R2,R3">20 mg/kg IV toutes les 8 h.</td><td data-src="R2,R3">21 jours  ; 14 jours concerne l’infection limitée à peau/muqueuses, pas le SNC.</td></tr></tbody></table>
<table class="t"><thead><tr><th>Clairance adulte</th><th>Adaptation à la dose usuelle de l’indication</th></tr></thead><tbody><tr><td data-src="R3">&gt;50 mL/min</td><td data-src="R3">Dose usuelle toutes les 8 h.</td></tr><tr><td data-src="R3">25–50 mL/min</td><td data-src="R3">Dose usuelle toutes les 12 h.</td></tr><tr><td data-src="R3">10–25 mL/min</td><td data-src="R3">Dose usuelle toutes les 24 h.</td></tr><tr><td data-src="R3">0–10 mL/min</td><td data-src="R3">Demi-dose toutes les 24 h.</td></tr><tr><td data-src="R3">Hémodialyse</td><td data-src="R3">Demi-dose toutes les 24 h et après la dialyse selon la FI ; coordonner l’horaire avec la séance.</td></tr></tbody></table>
<p data-src="R3">Évaluer hydratation, créatinine et évolution de la fonction rénale ; une insuffisance rénale aiguë impose une réévaluation rapprochée, pas l’usage figé d’une ancienne clairance. Éviter une injection rapide. Une confusion, hallucination, agitation, crise ou altération de conscience sous traitement peut être une neurotoxicité, particulièrement en cas d’accumulation ; elle doit être distinguée d’une aggravation infectieuse.</p>
<p data-src="R3">La FI signale les interactions ou risques additifs avec ciclosporine, tacrolimus et mycophénolate, ainsi que les réactions cutanées graves. Une réexposition après réaction cutanée grave n’est pas une simple stratégie de réduction de dose. Pendant la grossesse, la FI réserve l’emploi à une nécessité impérative ; elle demande l’interruption de l’allaitement pendant le traitement. La décision clinique urgente reste individualisée avec l’équipe spécialisée.</p>
<div class="key" data-src="R2,R3"><b>Durée et intervalle répondent à deux questions différentes.</b> L’intervalle protège d’une accumulation rénale ; la durée totale traite l’infection cérébrale. Espacer une dose ne permet pas de raccourcir arbitrairement le traitement.</div>

<p class="ui">Approfondir : <button class="w" data-k="g05-aciclovir">Aciclovir : fiche détaillée</button></p></section>
<section class="ilot" id="g05-p-3"><h2><span class="n">p-3</span>Ganciclovir et foscarnet : deux profils de toxicité</h2>
<p data-src="R4">Cymevene IV : la dose d’induction usuelle de la FI, à fonction rénale normale, est 5 mg/kg toutes les 12 h pendant 14–21 jours, perfusée sur une heure. Les indications visent les infections graves à CMV mettant en jeu la vie ou la vision dans les terrains définis ; ce n’est pas un protocole d’encéphalite de toute cause. L’utilisation avant 18 ans n’est pas homologuée dans cette FI ; efficacité/sécurité ne sont pas établies pour toutes les situations congénitales ou immunocompétentes.</p>
<table class="t"><thead><tr><th>Clairance créatinine</th><th>Induction Cymevene IV</th><th>Entretien FI, pas décision automatique pour encéphalite</th></tr></thead><tbody><tr><td data-src="R4">≥ 70 mL/min</td><td data-src="R4">5 mg/kg toutes les 12 h</td><td data-src="R4">5 mg/kg toutes les 24 h</td></tr><tr><td data-src="R4">50–69 mL/min</td><td data-src="R4">2,5 mg/kg toutes les 12 h</td><td data-src="R4">2,5 mg/kg toutes les 24 h</td></tr><tr><td data-src="R4">25–49 mL/min</td><td data-src="R4">2,5 mg/kg toutes les 24 h</td><td data-src="R4">1,25 mg/kg toutes les 24 h</td></tr><tr><td data-src="R4">10–24 mL/min</td><td data-src="R4">1,25 mg/kg toutes les 24 h</td><td data-src="R4">0,625 mg/kg toutes les 24 h</td></tr><tr><td data-src="R4">&lt;10 mL/min, hémodialyse</td><td data-src="R4">1,25 mg/kg trois fois/semaine après dialyse</td><td data-src="R4">0,625 mg/kg trois fois/semaine après dialyse</td></tr></tbody></table>
<p data-src="R4">Ne pas commencer si neutrophiles&lt;500/µL, plaquettes&lt;25 000/µL ou hémoglobine&lt;8 g/dL. Surveiller hémogramme, rein et hydratation ; les associations myélotoxiques ou néphrotoxiques majorent le risque. L’association à imipénem/cilastatine a été liée à des convulsions. La rubrique contre-indications mentionne la grossesse ; la rubrique reproduction décrit l’exception d’un bénéfice maternel justifiant le risque : cette tension réglementaire impose un avis spécialisé, pas une formule rassurante. Allaitement à éviter ; contraception féminine pendant et 30 jours après, méthode barrière masculine pendant et 90 jours après selon FI.</p>
<p data-src="R31"><b>Foscavir n’est pas un équivalent de ganciclovir.</b> La FI suisse propose pour rétinite CMV du sida 60 mg/kg toutes les 8 h sur au moins 1 h, ou 90 mg/kg toutes les 12 h sur au moins 2 h, en induction de 2–3 semaines. Pour HSV <b>mucocutané</b> résistant, elle décrit 40 mg/kg toutes les 8 h. Les 60 mg/kg toutes les 8 h utilisés dans certaines recommandations neurologiques sont un contexte distinct, non une dose homologuée universelle du HSV.</p>
<p data-src="R31">Les tables rénales du foscarnet utilisent une clairance en<b>mL/min/kg</b>, différente du mL/min des tableaux précédents. En dessous de 0,4 mL/min/kg, la FI ne recommande pas le traitement ; l’hémodialyse n’a pas de régime recommandé dans cette FI. Utiliser sa table complète et l’avis pharmaceutique plutôt qu’une interpolation improvisée. Contrôler créatinine tous les deux jours pendant l’induction puis au moins hebdomadairement en entretien, et adapter à l’état clinique.</p>
<p data-src="R31">Hydrater selon la tolérance ; surveiller calcium ionisé, magnésium et autres ions ainsi que le risque QT. Une hypocalcémie ionisée est possible malgré un calcium total normal. Par voie périphérique, diluer la solution 24 mg/mL à 12 mg/mL ou moins selon FI. Ne pas mélanger ni administrer simultanément dans la même ligne avec ganciclovir, aciclovir, cotrimoxazole, vancomycine ou solutions contenant des cations divalents : une association thérapeutique n’autorise pas une association dans la tubulure. Grossesse et allaitement : ne pas administrer selon FI ; éviter une conception paternelle pendant six mois après traitement.</p>

<p class="ui">Approfondir : <button class="w" data-k="g05-ganciclovir">Ganciclovir</button> · <button class="w" data-k="g05-foscarnet">Foscarnet</button></p></section>
<section class="ilot" id="g05-p-4"><h2><span class="n">p-4</span>Bêta-lactamines : dose neurologique et sécurité</h2>
<p data-src="R5,R26"><b>Amoxicillin OrPha IV.</b> Pour une infection grave de l’adulte&gt;40 kg, la FI autorise 2 g en perfusion courte de 30 min,3–6 fois/jour, maximum 12 g/j. La SSI utilise 2 g toutes les 4 h pour la couverture de Listeria dans les situations de risque. Sa FI ne fixe pas toute la durée d’une neurolistériose ; sensibilité, foyer et évolution guident le spécialiste.</p>
<p data-src="R5">La table rénale générale de la FI prévoit, après charge 1 g,0,5–1 g toutes les 12 h pour clairance 10–30 mL/min et 0,5 g toutes les 24 h sous 10 mL/min ; une dose supplémentaire 1 g après hémodialyse est décrite. Ces règles générales ne doivent pas être appliquées mécaniquement à une infection du SNC sans vérifier exposition et gravité. Surveiller rein, cristallurie, hémogramme, foie et INR selon contexte ; interactions avec méthotrexate et anticoagulants à considérer. Contre-indications allergiques, mononucléose/leucémie lymphoïde et réactions cutanées graves sont à vérifier. Ne pas utiliser de lidocaïne en IV ni mélanger avec un aminoside. Pendant la grossesse, la FI demande de la prudence ; l’allaitement doit être interrompu pendant le traitement selon ce produit exact.</p>
<p data-src="R7,R9"><b>Penicilline Grünenthal.</b> La benzylpénicilline sodique est adaptée à la neurosyphilis selon le schéma causal, distinct des doses générales 20–60 MUI/j de la FI. Un million d’UI correspond ici à 599 mg de substance et 38,6 mg de sodium ;10 MUI apportent 386 mg de sodium. Au-delà de 2 MUI, injection IV lente, au maximum 0,5 MUI/min selon FI. Prendre en compte surcharge sodée, hypokaliémie, allergie, fonction rénale et neurotoxicité avec convulsions. Les interactions avec méthotrexate et probénécide demandent attention.</p>
<p data-src="R9">La FI permet l’emploi pendant la grossesse. Pendant l’allaitement, de petites quantités passent dans le lait, avec risque de sensibilisation ou troubles digestifs chez l’enfant à surveiller. Une réaction de Jarisch–Herxheimer précoce ne doit pas être confondue avec une réaction allergique immédiate ; l’évaluation clinique décide de la conduite.</p>
<p data-src="R16,R26,R7"><b>Ceftriaxon Labatec.</b> La SSI utilise 2 g IV toutes les 12 h dans la méningite bactérienne communautaire adulte ; la neurosyphilis relève du schéma 2 g/j pendant 14 jours de DGN 2026. Si clairance&lt;10 mL/min, la FI limite à 2 g/j ; même plafond chez le patient dialysé, sans supplément après dialyse. Une insuffisance rénale et hépatique grave associée impose une surveillance clinique renforcée. Une infection nécessitant une exposition élevée et ces limites rénales doit être discutée avec infectiologie/pharmacie.</p>
<p data-src="R16">Ne pas mélanger la ceftriaxone aux solutions contenant du calcium. Chez le nouveau-né, prématurité, hyperbilirubinémie et nécessité de calcium IV comportent des contre-indications spécifiques ; chez les patients plus âgés, une administration séquentielle peut être possible avec rinçage approprié selon FI. Rechercher allergie, hémolyse, réactions cutanées graves et neurotoxicité. Pendant la grossesse, indication stricte ; allaitement interrompu selon la FI relue.</p>

<p class="ui">Approfondir : <button class="w" data-k="g05-amoxicilline">Amoxicilline</button> · <button class="w" data-k="g05-penicilline">Pénicilline G</button> · <button class="w" data-k="g05-herxheimer">Jarisch–Herxheimer</button></p></section>
<section class="ilot" id="g05-p-5"><h2><span class="n">p-5</span>Toxoplasmose : calcul, produits et surveillance</h2>
<p data-src="R10,R15"><b>Le rapport TMP/SMX est 1:5.</b> Une ampoule de Bactrim IV de 5 mL contient 80 mg de triméthoprime et 400 mg de sulfaméthoxazole. Le schéma HAS 15/75 mg/kg/j correspond à la dose <b>quotidienne totale</b>, divisée en trois administrations ; il ne faut pas donner 15 mg/kg de TMP à chaque prise. La toxoplasmose n’est pas nommée dans les indications de cette FI, et sa durée de six semaines ne doit pas être confondue avec les durées usuelles IV ou la pneumocystose homologuées.</p>
<p data-src="R15">Pour Bactrim IV, clairance&gt;30 mL/min : posologie habituelle ;15–30 : moitié de la posologie ;&lt;15 : contre-indication selon FI. L’hémodialyse a des indications spécifiques de dose après séance et de suivi des concentrations ; la dialyse péritonéale n’est pas recommandée. Surveiller kaliémie, créatinine et hémogramme, particulièrement avec autres médicaments hyperkaliémiants ou myélotoxiques. Dofétilide est contre-indiqué ; méthotrexate et phénytoïne exposent à des interactions importantes.</p>
<p data-src="R15">Le concentré doit être dilué, jamais injecté en bolus : une ampoule dans 125 mL de solution compatible est le schéma habituel ; perfusion 30–60 min, au maximum 90 min. Une restriction hydrique peut justifier la dilution spécifique d’une ampoule dans 75 mL prévue par FI, avec les solutés autorisés. Tenir compte des excipients éthanol et propylène glycol. Déficit G6PD, réactions cutanées graves et restrictions néonatales/grossesse sont à vérifier ; le troisième trimestre est contre-indiqué. Ne pas extrapoler une désensibilisation après une réaction cutanée grave. En début de grossesse, si le cotrimoxazole est indispensable sans alternative, la FI recommande une supplémentation en acide folique de 5 mg/j ; cela ne remplace pas le folinate requis avec pyriméthamine. Pendant l’allaitement, mettre en balance le bénéfice maternel et les risques pour le nourrisson, notamment ictère nucléaire et hypersensibilité, selon âge et terrain.</p>
<p data-src="R8,R10"><b>Daraprim.</b> La pyriméthamine inhibe la dihydrofolate-réductase ; sa longue demi-vie favorise une toxicité persistante. Toujours associer sulfamide et folinate dans le régime concerné. La FI demande une numération au moins hebdomadaire et pendant deux semaines après l’arrêt ; chez l’immunodéprimé, au moins deux fois par semaine. Le premier trimestre est contre-indiqué et l’allaitement doit être interrompu. Méthotrexate, triméthoprime, zidovudine et autres myélotoxiques peuvent majorer le risque.</p>
<table class="t"><thead><tr><th>Sulfadiazine exacte</th><th>Règle lue</th><th>Pourquoi ne pas fusionner</th></tr></thead><tbody><tr><td data-src="R10,R11,R12">Sulfadiazin-Heyl 500 mg, RCP allemand août 2020</td><td data-src="R10,R11,R12">Adulte 50 mg/kg/j, maximum 4 g/j, répartis en quatre prises.</td><td data-src="R10,R11,R12">Clairance&lt;25 mL/min contre-indiquée ; premier trimestre contre-indiqué ; hydratation et diurèse suffisantes.</td></tr><tr><td data-src="R10,R11,R12">ADIAZINE 500 mg, RCP français juillet 2018</td><td data-src="R10,R11,R12">Adulte 4–6 g/j en 4–6 prises ; association à pyriméthamine.</td><td data-src="R10,R11,R12">Réduction en insuffisance rénale modérée, atteinte sévère contre-indiquée ; grossesse appréciée selon nécessité maternelle.</td></tr><tr><td data-src="R10,R11,R12">HAS 2024, schéma clinique VIH</td><td data-src="R10,R11,R12">100 mg/kg/j, maximum 6 g/j.</td><td data-src="R10,R11,R12">Ce plafond n’est pas celui de tous les produits ; une substitution de marque/pays demande vérification.</td></tr></tbody></table>
<p data-src="R11,R12">Les sulfamides exposent à cristallurie, atteinte rénale, cytopénies et réactions cutanées graves ; déficit G6PD et antécédents d’allergie sont à rechercher. Hydratation, surveillance urinaire et alcalinisation selon protocole font partie du traitement. L’information de disponibilité suisse n’a pas été établie par les RCP étrangers : elle doit être confirmée avant prescription.</p>
<p data-src="R14"><b>Folinate.</b> L’absorption orale est saturable ; une capsule 15 mg ne permet pas de déduire un fractionnement donnant 25 mg. Demander une présentation appropriée. Le folinate peut diminuer l’effet de phénytoïne, phénobarbital et primidone ; surveiller les crises et les concentrations si indiqué. Il ne doit pas masquer une carence en vitamine B12. L’acide folique n’est pas un substitut automatique au folinate requis avec pyriméthamine.</p>

<p class="ui">Approfondir : <button class="w" data-k="g05-pyrimethamine">Pyriméthamine et associations</button></p></section>
<section class="ilot" id="g05-p-6"><h2><span class="n">p-6</span>Interactions critiques et limites de prescription</h2>
<div class="alert" data-src="R32"><b>Brivudine et fluoropyrimidines : interaction potentiellement mortelle.</b> Brivex est réservé au zona précoce de l’adulte immunocompétent. Son métabolite inhibe irréversiblement la DPD :5-FU, y compris topique, capécitabine, tégafur et flucytosine peuvent devenir gravement toxiques. Respecter au moins quatre semaines <b>après la fin</b> de brivudine avant une fluoropyrimidine ; rechercher aussi un traitement récent, en cours ou planifié avant de prescrire. Une prise accidentelle demande une évaluation hospitalière urgente et un avis toxicologique.</div>
<p data-src="R32">Brivex est contre-indiqué chez l’immunodéprimé, l’enfant/adolescent, pendant la grossesse et l’allaitement ; il n’est pas un traitement d’encéphalite. La formule «toxicité jusqu’à quatre semaines» est insuffisante : elle peut faire croire qu’une coadministration serait acceptable après un délai arbitraire depuis la première dose.</p>
<p data-src="R2,R30,R40,R42,R44,R46,R47">Les régimes des parasitoses rares, de la tuberculose et des immunothérapies sont laissés aux protocoles spécialisés cités et aux FI exactes à vérifier au moment de leur utilisation. La monographie expose leurs indications et limites, sans inventer de dose, d’autorisation suisse ou de disponibilité. Une aide mnémotechnique peut organiser la surveillance, mais ne remplace jamais poids, voie, fonction rénale, indication et produit.</p>
