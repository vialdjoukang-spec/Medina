</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>
<template data-pop="g05-codage" data-title="G05 : une manifestation, pas toute encéphalite"><p data-src="R6">Le code astérisque décrit l’atteinte neurologique d’une maladie classée ailleurs. La cause et la manifestation se codent ensemble selon la classification applicable. Les sous-groupes distinguent bactéries, virus, autres infections/parasites et autres affections, dont le lupus.</p>
<p data-src="R6">Une myélite transverse idiopathique, une ADEM et l’encéphalite à tiques ne deviennent pas automatiquement G05. La source relue est la CIM-10-GM allemande 2024 : elle ne certifie ni une version suisse 2026 ni une règle de facturation locale.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm">R6 — ICD 10 GM 2024 G04/G05 officiel BfArM</a>.</p></template>
<template data-pop="g05-criteres" data-title="Possible, probable, confirmée : trois niveaux"><p data-src="R39,R2">Le critère majeur du Consortium 2013 est une altération mentale ≥ 24 h sans autre cause identifiée. Deux critères mineurs donnent une encéphalite possible, au moins trois une probable : fièvre ≥ 38°C dans les 72 h autour de la présentation, crise inexpliquée, déficit focal nouveau, LCR ≥ 5 cellules/µL, imagerie aiguë compatible ou EEG compatible.</p>
<p data-src="R39,R2">La confirmation exige une preuve étiologique ou anatomopathologique appropriée. Un nombre de critères ne confirme pas HSV. Ne jamais attendre 24 h pour traiter un patient dont le tableau suggère une encéphalite urgente.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3783060/">R39 — International Encephalitis Consortium : définition des cas</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a>.</p></template>
<template data-pop="g05-hsve" data-title="HSV : traiter la suspicion, confirmer la cause"><p data-src="R1,R2,R20">L’atteinte temporale médiale et frontobasale peut produire troubles de mémoire, langage, comportement et crises. Les signes ne sont ni obligatoires ni spécifiques ; une forme précoce peut avoir IRM et LCR peu contributifs.</p>
<p data-src="R1,R2,R20">Commencer l’aciclovir IV dès que possible, idéalement dans les six heures selon EAN. Si une PCR précoce est négative mais la suspicion forte, poursuivre et répéter le bilan. Une aggravation impose aussi de rechercher état de mal, complication vasculaire, toxicité et auto-immunité.</p>
<p data-src="R1,R2,R20">La mortalité 8 % à 30 jours et 15 % à 6 mois de la cohorte danoise concerne 495 adultes avec encéphalite virale présumée/prouvée, tous agents confondus, et non exclusivement HSV.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf">R1 — DGN S1 Virale Meningoenzephalitis 2025, v 7.0</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://doi.org/10.1016/j.cmi.2026.04.002">R20 — Duerlund et al. : cohorte danoise encéphalite infectieuse</a>.</p></template>
<template data-pop="g05-antinmda" data-title="Après HSV : penser aussi à une auto-immunité"><p data-src="R2,R19">Une reprise de symptômes psychiatriques, cognitifs, de mouvements anormaux ou de crises après amélioration d’un HSV doit faire reprendre le diagnostic. Une encéphalite auto-immune, notamment anti-NMDAR, est possible ; la récidive n’est pas automatiquement virale.</p>
<p data-src="R2,R19">Les 27–57 % cités par EAN concernent des patients avec rechute, pas tous les HSV. Pour les anticorps neuronaux, sérum et LCR se complètent ; les IgG dirigées contre GluN1 dans un contexte compatible ont une autre portée qu’un résultat sérique isolé discordant. Le titre ne remplace pas l’évolution clinique.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5066574/">R19 — Graus et al. : diagnostic des encéphalites auto-immunes</a>.</p></template>
<template data-pop="g05-vzv" data-title="VZV : encéphalite et vasculopathie"><p data-src="R1,R2,R32">L’éruption de varicelle ou de zona est un indice ; son absence n’exclut pas une atteinte neurologique. Les tableaux peuvent être méningés, cérébraux, cérébelleux, médullaires ou vasculaires. Le dénominateur d’une fréquence doit être vérifié avant de l’appliquer à tous les cas de varicelle.</p>
<p data-src="R1,R2,R32">L’aciclovir IV 10 mg/kg toutes les 8 h chez l’adulte à rein normal est le schéma retenu par EAN. Les corticoïdes peuvent se discuter dans une vasculopathie confirmée. La brivudine du zona cutané n’est pas un traitement d’encéphalite.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf">R1 — DGN S1 Virale Meningoenzephalitis 2025, v 7.0</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680554650024">R32 — Brivex, FI suisse exacte</a>.</p></template>
<template data-pop="g05-cmv" data-title="CMV et autres virus de l’immunodéprimé"><p data-src="R1,R4,R31">Le terrain, l’IRM et la microbiologie orientent la recherche de CMV et d’autres opportunistes. Une PCR positive ne doit pas être interprétée indépendamment du tableau ; les panels larges peuvent détecter des signaux dont l’attribution causale demande prudence.</p>
<p data-src="R1,R4,R31">Ganciclovir et éventuellement foscarnet relèvent d’une stratégie spécialisée. Les FI ne constituent pas un protocole d’encéphalite universel ; distinguer rétinite CMV, infections graves à CMV et HSV mucocutané résistant. Une association accroît les enjeux rénaux, ioniques et hématologiques.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf">R1 — DGN S1 Virale Meningoenzephalitis 2025, v 7.0</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680491880133">R4 — Cymevene 500 mg IV, FI suisse exacte</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680523570131">R31 — Foscavir, FI suisse exacte</a>.</p></template>
<template data-pop="g05-pess" data-title="PESS : une complication tardive différente"><p data-src="R1,R23">La panencéphalite sclérosante subaiguë est une affection chronique liée à la rougeole, apparaissant après une longue latence. La DGN décrit chez l’enfant/adolescent une dégradation comportementale et cognitive progressive avec myoclonies ; l’EEG et la production intrathécale d’anticorps participent au diagnostic.</p>
<p data-src="R1,R23">Elle ne se confond pas avec l’encéphalite aiguë de la rougeole. La vaccination prévient la rougeole et ses complications ; le chiffre OFSP d’une encéphalite pour 1000 cas ne doit pas être présenté comme l’incidence de PESS. Aucune estimation suisse de PESS n’est établie ici.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf">R1 — DGN S1 Virale Meningoenzephalitis 2025, v 7.0</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.bag.admin.ch/fr/rougeole">R23 — OFSP : rougeole</a>.</p></template>
<template data-pop="g05-listeria" data-title="Listeria : le tronc cérébral n’est pas obligatoire"><p data-src="R21,R24,R25,R26">La neurolistériose peut être une méningo-encéphalite sans rhombencéphalite. Dans MONALISA,42/252 formes neurologiques comportaient une atteinte du tronc ; les données françaises ne constituent pas une incidence suisse. Hémocultures et LCR sont complémentaires.</p>
<p data-src="R21,R24,R25,R26">En Suisse, la SSI ajoute amoxicilline 2 g IV toutes les 4 h chez les adultes&gt;50 ans ou à risque, dont la grossesse, dans la méningite présumée. La durée documentée de Listeria est généralement au moins trois semaines selon DGN, à individualiser si complication. La ceftriaxone seule ne couvre pas cette hypothèse.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.bag.admin.ch/fr/listeriose-2">R21 — OFSP : listériose</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/">R24 — DGN : méningite bactérienne communautaire adulte</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://doi.org/10.1016/S1473-3099(16)30521-7">R25 — MONALISA : cohorte prospective nationale</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://ssi.guidelines.ch/guideline/2315/fr">R26 — SSI : méningite, version française</a>.</p></template>
<template data-pop="g05-neurosyphilis" data-title="Neurosyphilis : attribuer et suivre"><p data-src="R7,R9">Le tableau peut être méningé, méningovasculaire, cognitif/psychiatrique ou médullaire. Le tabès atteint les racines/cordons postérieurs : ataxie proprioceptive, troubles sensitifs et aréflexie peuvent coexister. Une syphilis récente peut aussi atteindre le SNC.</p>
<p data-src="R7,R9">Sérologie sanguine et LCR couplés s’interprètent ensemble. VDRL négatif n’exclut pas ; PCR peu sensible et index intrathécal persistant ne règlent pas seuls le diagnostic ou l’activité. Une neurosyphilis probable/confirmée repose sur un faisceau défini par la recommandation 2026.</p>
<p data-src="R7,R9">Pénicilline G IV 14 jours, avec schémas détaillés dans le cours ; ceftriaxone est une alternative. Après bonne réponse clinique et sérologique, aucune PL de routine n’est requise ; une réponse insuffisante justifie une nouvelle évaluation.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13499315/">R7 — German guideline on neurosyphilis 2026</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680562710024">R9 — Penicilline Grünenthal, FI suisse exacte</a>.</p></template>
<template data-pop="g05-toxo" data-title="Toxoplasmose cérébrale : diagnostic d’épreuve surveillé"><p data-src="R10,R15">Chez une personne vivant avec le VIH immunodéprimée, déficit focal, imagerie compatible et sérologie IgG soutiennent le diagnostic. Une PCR LCR positive est très spécifique dans les données discutées, mais sa sensibilité est insuffisante pour exclure l’infection si elle est négative.</p>
<p data-src="R10,R15">La HAS 2024 privilégie TMP/SMX 15/75 mg/kg/j en trois prises ; six semaines d’attaque selon réponse. En l’absence d’amélioration après 15 jours, réimager et discuter une biopsie, notamment pour lymphome. Corticoïdes seulement si effet de masse menaçant ; entretien après l’attaque jusqu’à restauration immunitaire.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.has-sante.fr/upload/docs/application/pdf/2024-07/reco484_argumentaire_vih_complications_cd_20240627_pd_ap.pdf">R10 — HAS complications associées au VIH : argumentaire</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680378870561">R15 — Bactrim solution à diluer pour perfusion, FI suisse</a>.</p></template>
<template data-pop="g05-lupus" data-title="Lupus : inflammation ou thrombose ?"><p data-src="R30,R18">Une manifestation neurologique chez un patient lupique n’est pas automatiquement due au lupus. Infection, toxicité, causes métaboliques et maladie vasculaire doivent être recherchées comme chez les autres patients. Une myélite peut également relever d’une NMOSD associée.</p>
<p data-src="R30,R18">Pour un mécanisme inflammatoire attribué au lupus, glucocorticoïdes et immunosuppression sont discutés ; pour un mécanisme vasculaire lié aux antiphospholipides, la stratégie est antithrombotique. Les formes sévères peuvent nécessiter cyclophosphamide ou rituximab spécialisé, sans dose improvisée ici. Les nouveaux biologiques ont peu de données dans ces formes souvent exclues des essais.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://doi.org/10.1136/ard-2023-224762">R30 — EULAR : recommandations lupus, actualisation 2023</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/">R18 — NEMOS : diagnostic et diagnostic différentiel des NMOSD, partie I</a>.</p></template>
<template data-pop="g05-irm" data-title="Une IRM normale précoce n’exclut pas"><p data-src="R2,R18,R19">L’IRM est préférée pour analyser le parenchyme ; viser 24 h, au plus tard 48 h selon EAN et possibilités. Temporal médial/frontobasal oriente vers HSV, mais les diagnostics auto-immuns et autres causes se recoupent. La diffusion recherche aussi des complications vasculaires.</p>
<p data-src="R2,R18,R19">Si le tableau demeure convaincant ou s’aggrave, répéter une imagerie non contributive. Une myélite demande un examen médullaire adapté, en priorité pour écarter la compression. Une lésion ≥ 3 segments vertébraux est étendue, pas pathognomonique de NMOSD.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/">R18 — NEMOS : diagnostic et diagnostic différentiel des NMOSD, partie I</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5066574/">R19 — Graus et al. : diagnostic des encéphalites auto-immunes</a>.</p></template>
<template data-pop="g05-lcr" data-title="LCR : une photographie à un moment donné"><p data-src="R38,R39,R2">Repères pédagogiques du LCR lombaire adulte :≤ 4 leucocytes/µL, protéines 0,15–0,45 g/L, glucose environ 60 % du sang, lactate&lt;2,1 mmol/L. Ils proviennent du document Swiss Memory Clinics 2024, pas d’une norme universelle de l’encéphalite ; appliquer le laboratoire local et l’âge.</p>
<p data-src="R38,R39,R2">Cellules, protéines et glucose peuvent être encore normaux tôt dans l’évolution ou chez l’immunodéprimé. L’interprétation associe délai, traitement déjà reçu, différentiel cellulaire, microbiologie et IRM ; aucun seuil isolé de PCT ou lactate n’exclut toutes les bactéries.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.bag.admin.ch/dam/fr/sd-web/85-JJvunZKA1/broschuere-diagnostikempfehlungen-demenz.pdf">R38 — Swiss Memory Clinics : diagnostic, tableau LCR</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3783060/">R39 — International Encephalitis Consortium : définition des cas</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a>.</p></template>
<template data-pop="g05-pcr" data-title="PCR ciblée, panel et faux négatif précoce"><p data-src="R2,R1">La PCR HSV/VZV ciblée reste importante lorsque la suspicion est forte. Un panel multiplex peut compléter mais ne remplace pas automatiquement les tests ciblés ; sa performance varie selon l’agent et la méthode.</p>
<p data-src="R2,R1">Après une première PL&lt;3 jours non diagnostique, répéter 2–3 jours plus tard, en visant 48 h. Ne pas arrêter l’aciclovir sur un seul résultat précoce négatif. Élargir selon immunodépression, exposition et évolution ; un séquençage exploratoire n’est pas l’examen de première urgence de tout patient.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf">R1 — DGN S1 Virale Meningoenzephalitis 2025, v 7.0</a>.</p></template>
<template data-pop="g05-graus" data-title="Encéphalite auto-immune : possible n’est pas confirmée"><p data-src="R19">Les critères possibles de Graus 2016 associent début subaigu&lt;3 mois de troubles mnésiques, mentaux ou psychiatriques ; au moins un déficit focal, des crises inexpliquées, une pléiocytose ou une IRM évocatrice ; et exclusion raisonnable des autres causes.</p>
<p data-src="R19">Une IRM ou un LCR normal ne l’exclut pas. Sérum et LCR sont utiles pour les anticorps neuronaux ; discordance ou faible spécificité demandent confirmation. Ne pas attendre un anticorps pour organiser l’évaluation spécialisée, et ne pas immunosupprimer automatiquement sur un résultat isolé.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5066574/">R19 — Graus et al. : diagnostic des encéphalites auto-immunes</a>.</p></template>
<template data-pop="g05-eeg" data-title="EEG : rechercher les crises, pas identifier seul un virus"><p data-src="R2">Un EEG est particulièrement utile si la conscience ne s’explique pas, si un état de mal non convulsif est possible ou si une présentation psychiatrique fait douter d’une atteinte organique. Il n’est pas imposé systématiquement à toute encéphalite.</p>
<p data-src="R2">Ralentissement et décharges périodiques peuvent accompagner l’inflammation ou une autre lésion cérébrale. Ils ne sont pas pathognomoniques de HSV ; le diagnostic reste clinico-biologique et radiologique.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a>.</p></template>
<template data-pop="g05-indice" data-title="Anticorps intrathécaux : sérum et LCR couplés"><p data-src="R2,R7,R18">La comparaison des anticorps spécifiques dans le sérum et le LCR, corrigée du transfert de barrière et des immunoglobulines selon la méthode du laboratoire, cherche une synthèse intrathécale. Une formule simplifiée non validée localement peut être trompeuse.</p>
<p data-src="R2,R7,R18">Les anticorps HSV peuvent persister des années ; l’index tréponémique peut rester positif après traitement. Un index positif ne prouve donc pas isolément l’activité actuelle. Interpréter avec cellules, clinique, chronologie et autres tests.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13499315/">R7 — German guideline on neurosyphilis 2026</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/">R18 — NEMOS : diagnostic et diagnostic différentiel des NMOSD, partie I</a>.</p></template>
<template data-pop="g05-fsme" data-title="Prévention suisse : tiques et vaccination"><p data-src="R22,R23,R6">L’OFSP recommande la vaccination contre l’encéphalite à tiques dès 3 ans pour les personnes exposées dans les régions à risque ; entre 1 et 2 ans, discussion individualisée. La page relue exclut le Tessin de l’ensemble des cantons considérés à risque. Protection vestimentaire, répulsifs et retrait des tiques complètent la prévention.</p>
<p data-src="R22,R23,R6">FSME/A84 est un diagnostic différentiel, pas automatiquement G05. La vaccination rougeole est une prévention distincte : deux doses à 9 et 12 mois, avec rattrapage selon statut, idéalement RORV selon recommandation suisse.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.bag.admin.ch/de/zeckenuebertragene-krankheiten">R22 — OFSP : maladies transmises par les tiques</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.bag.admin.ch/fr/rougeole">R23 — OFSP : rougeole</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm">R6 — ICD 10 GM 2024 G04/G05 officiel BfArM</a>.</p></template>
<template data-pop="g05-duree" data-title="Aciclovir : pourquoi 10 et 14 jours apparaissent-ils ?"><p data-src="R3,R2">La FI suisse Aciclovir Labatec décrit 10 jours pour l’encéphalite HSV chez les patients ≥ 3 mois. L’EAN/ESCMID 2026 recommande au moins 14 jours pour une encéphalite HSV prouvée ;21–28 jours sont discutés si absence d’amélioration, aggravation ou immunodépression.</p>
<p data-src="R3,R2">Il faut afficher cette divergence de portée plutôt que choisir automatiquement la date la plus récente. Chez le nouveau-né avec atteinte SNC, la FI précise 21 jours. Une amélioration clinique chez l’adulte ne justifie pas à elle seule un arrêt prématuré ; une PL de fin n’est pas systématique si bonne évolution.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680603250014">R3 — Aciclovir Labatec IV, FI suisse exacte</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a>.</p></template>
<template data-pop="g05-dexa" data-title="Corticoïdes : trois maladies, trois raisonnements"><p data-src="R2,R25,R26">Dans HSV, l’EAN 2026 ne peut recommander pour ou contre un usage systématique après analyse de DexEnceph. Dans la méningite bactérienne présumée, la SSI les utilise pour le bénéfice pneumococcique attendu et demande l’arrêt si pneumocoque exclu.</p>
<p data-src="R2,R25,R26">Dans MONALISA, l’association entre dexaméthasone et mortalité est observationnelle : elle n’établit pas seule un effet causal. Une vasculopathie VZV ou une maladie inflammatoire confirmée constitue encore un autre contexte ; ne pas transférer une règle sans son indication.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://doi.org/10.1016/S1473-3099(16)30521-7">R25 — MONALISA : cohorte prospective nationale</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://ssi.guidelines.ch/guideline/2315/fr">R26 — SSI : méningite, version française</a>.</p></template>
<template data-pop="g05-aciclovir" data-title="AciclovirLabatec : voie, rein et durée">
<table class="t"><thead><tr><th>Population/indication</th><th>FI Aciclovir Labatec</th><th>Durée et précision</th></tr></thead><tbody><tr><td data-src="R2,R3">Adulte et adolescent&gt;12 ans, encéphalite HSV</td><td data-src="R2,R3">10 mg/kg IV toutes les 8 h.</td><td data-src="R2,R3">Perfusion lente sur au moins 1 h ; FI 10 jours, recommandation EAN au moins 14 jours pour HSV prouvé.</td></tr><tr><td data-src="R2,R3">Enfant 3 mois–12 ans, encéphalite HSV</td><td data-src="R2,R3">500 mg/m²IV toutes les 8 h.</td><td data-src="R2,R3">Ne pas remplacer cette dose par une dose adulte enmg/kg sans protocole pédiatrique.</td></tr><tr><td data-src="R2,R3">Nouveau-né, infection HSV du SNC ou disséminée</td><td data-src="R2,R3">20 mg/kg IV toutes les 8 h.</td><td data-src="R2,R3">21 jours  ; 14 jours concerne l’infection limitée à peau/muqueuses, pas le SNC.</td></tr></tbody></table>
<table class="t"><thead><tr><th>Clairance adulte</th><th>Adaptation à la dose usuelle de l’indication</th></tr></thead><tbody><tr><td data-src="R3">&gt;50 mL/min</td><td data-src="R3">Dose usuelle toutes les 8 h.</td></tr><tr><td data-src="R3">25–50 mL/min</td><td data-src="R3">Dose usuelle toutes les 12 h.</td></tr><tr><td data-src="R3">10–25 mL/min</td><td data-src="R3">Dose usuelle toutes les 24 h.</td></tr><tr><td data-src="R3">0–10 mL/min</td><td data-src="R3">Demi-dose toutes les 24 h.</td></tr><tr><td data-src="R3">Hémodialyse</td><td data-src="R3">Demi-dose toutes les 24 h et après la dialyse selon la FI ; coordonner l’horaire avec la séance.</td></tr></tbody></table>
<p data-src="R3">Évaluer hydratation, créatinine et évolution de la fonction rénale ; une insuffisance rénale aiguë impose une réévaluation rapprochée, pas l’usage figé d’une ancienne clairance. Éviter une injection rapide. Une confusion, hallucination, agitation, crise ou altération de conscience sous traitement peut être une neurotoxicité, particulièrement en cas d’accumulation ; elle doit être distinguée d’une aggravation infectieuse.</p>
<p data-src="R3">La FI signale les interactions ou risques additifs avec ciclosporine, tacrolimus et mycophénolate, ainsi que les réactions cutanées graves. Une réexposition après réaction cutanée grave n’est pas une simple stratégie de réduction de dose. Pendant la grossesse, la FI réserve l’emploi à une nécessité impérative ; elle demande l’interruption de l’allaitement pendant le traitement. La décision clinique urgente reste individualisée avec l’équipe spécialisée.</p>
<div class="key" data-src="R2,R3"><b>Durée et intervalle répondent à deux questions différentes.</b> L’intervalle protège d’une accumulation rénale ; la durée totale traite l’infection cérébrale. Espacer une dose ne permet pas de raccourcir arbitrairement le traitement.</div>

<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13650609/">R2 — EAN/ESCMID Diagnosis and Management of Infectious Encephalitis in Adults</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680603250014">R3 — Aciclovir Labatec IV, FI suisse exacte</a>.</p></template>

<template data-pop="g05-ganciclovir" data-title="Cymevene et Foscavir : indications distinctes">
<p data-src="R4">Cymevene IV : la dose d’induction usuelle de la FI, à fonction rénale normale, est 5 mg/kg toutes les 12 h pendant 14–21 jours, perfusée sur une heure. Les indications visent les infections graves à CMV mettant en jeu la vie ou la vision dans les terrains définis ; ce n’est pas un protocole d’encéphalite de toute cause. L’utilisation avant 18 ans n’est pas homologuée dans cette FI ; efficacité/sécurité ne sont pas établies pour toutes les situations congénitales ou immunocompétentes.</p>
<table class="t"><thead><tr><th>Clairance créatinine</th><th>Induction Cymevene IV</th><th>Entretien FI, pas décision automatique pour encéphalite</th></tr></thead><tbody><tr><td data-src="R4">≥ 70 mL/min</td><td data-src="R4">5 mg/kg toutes les 12 h</td><td data-src="R4">5 mg/kg toutes les 24 h</td></tr><tr><td data-src="R4">50–69 mL/min</td><td data-src="R4">2,5 mg/kg toutes les 12 h</td><td data-src="R4">2,5 mg/kg toutes les 24 h</td></tr><tr><td data-src="R4">25–49 mL/min</td><td data-src="R4">2,5 mg/kg toutes les 24 h</td><td data-src="R4">1,25 mg/kg toutes les 24 h</td></tr><tr><td data-src="R4">10–24 mL/min</td><td data-src="R4">1,25 mg/kg toutes les 24 h</td><td data-src="R4">0,625 mg/kg toutes les 24 h</td></tr><tr><td data-src="R4">&lt;10 mL/min, hémodialyse</td><td data-src="R4">1,25 mg/kg trois fois/semaine après dialyse</td><td data-src="R4">0,625 mg/kg trois fois/semaine après dialyse</td></tr></tbody></table>
<p data-src="R4">Ne pas commencer si neutrophiles&lt;500/µL, plaquettes&lt;25 000/µL ou hémoglobine&lt;8 g/dL. Surveiller hémogramme, rein et hydratation ; les associations myélotoxiques ou néphrotoxiques majorent le risque. L’association à imipénem/cilastatine a été liée à des convulsions. La rubrique contre-indications mentionne la grossesse ; la rubrique reproduction décrit l’exception d’un bénéfice maternel justifiant le risque : cette tension réglementaire impose un avis spécialisé, pas une formule rassurante. Allaitement à éviter ; contraception féminine pendant et 30 jours après, méthode barrière masculine pendant et 90 jours après selon FI.</p>
<p data-src="R31"><b>Foscavir n’est pas un équivalent de ganciclovir.</b> La FI suisse propose pour rétinite CMV du sida 60 mg/kg toutes les 8 h sur au moins 1 h, ou 90 mg/kg toutes les 12 h sur au moins 2 h, en induction de 2–3 semaines. Pour HSV <b>mucocutané</b> résistant, elle décrit 40 mg/kg toutes les 8 h. Les 60 mg/kg toutes les 8 h utilisés dans certaines recommandations neurologiques sont un contexte distinct, non une dose homologuée universelle du HSV.</p>
<p data-src="R31">Les tables rénales du foscarnet utilisent une clairance en<b>mL/min/kg</b>, différente du mL/min des tableaux précédents. En dessous de 0,4 mL/min/kg, la FI ne recommande pas le traitement ; l’hémodialyse n’a pas de régime recommandé dans cette FI. Utiliser sa table complète et l’avis pharmaceutique plutôt qu’une interpolation improvisée. Contrôler créatinine tous les deux jours pendant l’induction puis au moins hebdomadairement en entretien, et adapter à l’état clinique.</p>
<p data-src="R31">Hydrater selon la tolérance ; surveiller calcium ionisé, magnésium et autres ions ainsi que le risque QT. Une hypocalcémie ionisée est possible malgré un calcium total normal. Par voie périphérique, diluer la solution 24 mg/mL à 12 mg/mL ou moins selon FI. Ne pas mélanger ni administrer simultanément dans la même ligne avec ganciclovir, aciclovir, cotrimoxazole, vancomycine ou solutions contenant des cations divalents : une association thérapeutique n’autorise pas une association dans la tubulure. Grossesse et allaitement : ne pas administrer selon FI ; éviter une conception paternelle pendant six mois après traitement.</p>

<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680491880133">R4 — Cymevene 500 mg IV, FI suisse exacte</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680523570131">R31 — Foscavir, FI suisse exacte</a>.</p></template>

<template data-pop="g05-amoxicilline" data-title="Amoxicilline, pénicillineG et ceftriaxone">
<p data-src="R5,R26"><b>Amoxicillin OrPha IV.</b> Pour une infection grave de l’adulte&gt;40 kg, la FI autorise 2 g en perfusion courte de 30 min,3–6 fois/jour, maximum 12 g/j. La SSI utilise 2 g toutes les 4 h pour la couverture de Listeria dans les situations de risque. Sa FI ne fixe pas toute la durée d’une neurolistériose ; sensibilité, foyer et évolution guident le spécialiste.</p>
<p data-src="R5">La table rénale générale de la FI prévoit, après charge 1 g,0,5–1 g toutes les 12 h pour clairance 10–30 mL/min et 0,5 g toutes les 24 h sous 10 mL/min ; une dose supplémentaire 1 g après hémodialyse est décrite. Ces règles générales ne doivent pas être appliquées mécaniquement à une infection du SNC sans vérifier exposition et gravité. Surveiller rein, cristallurie, hémogramme, foie et INR selon contexte ; interactions avec méthotrexate et anticoagulants à considérer. Contre-indications allergiques, mononucléose/leucémie lymphoïde et réactions cutanées graves sont à vérifier. Ne pas utiliser de lidocaïne en IV ni mélanger avec un aminoside. Pendant la grossesse, la FI demande de la prudence ; l’allaitement doit être interrompu pendant le traitement selon ce produit exact.</p>
<p data-src="R7,R9"><b>Penicilline Grünenthal.</b> La benzylpénicilline sodique est adaptée à la neurosyphilis selon le schéma causal, distinct des doses générales 20–60 MUI/j de la FI. Un million d’UI correspond ici à 599 mg de substance et 38,6 mg de sodium ;10 MUI apportent 386 mg de sodium. Au-delà de 2 MUI, injection IV lente, au maximum 0,5 MUI/min selon FI. Prendre en compte surcharge sodée, hypokaliémie, allergie, fonction rénale et neurotoxicité avec convulsions. Les interactions avec méthotrexate et probénécide demandent attention.</p>
<p data-src="R9">La FI permet l’emploi pendant la grossesse. Pendant l’allaitement, de petites quantités passent dans le lait, avec risque de sensibilisation ou troubles digestifs chez l’enfant à surveiller. Une réaction de Jarisch–Herxheimer précoce ne doit pas être confondue avec une réaction allergique immédiate ; l’évaluation clinique décide de la conduite.</p>
<p data-src="R16,R26,R7"><b>Ceftriaxon Labatec.</b> La SSI utilise 2 g IV toutes les 12 h dans la méningite bactérienne communautaire adulte ; la neurosyphilis relève du schéma 2 g/j pendant 14 jours de DGN 2026. Si clairance&lt;10 mL/min, la FI limite à 2 g/j ; même plafond chez le patient dialysé, sans supplément après dialyse. Une insuffisance rénale et hépatique grave associée impose une surveillance clinique renforcée. Une infection nécessitant une exposition élevée et ces limites rénales doit être discutée avec infectiologie/pharmacie.</p>
<p data-src="R16">Ne pas mélanger la ceftriaxone aux solutions contenant du calcium. Chez le nouveau-né, prématurité, hyperbilirubinémie et nécessité de calcium IV comportent des contre-indications spécifiques ; chez les patients plus âgés, une administration séquentielle peut être possible avec rinçage approprié selon FI. Rechercher allergie, hémolyse, réactions cutanées graves et neurotoxicité. Pendant la grossesse, indication stricte ; allaitement interrompu selon la FI relue.</p>

<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680688150018">R5 — Amoxicillin OrPha IV, FI suisse exacte</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13499315/">R7 — German guideline on neurosyphilis 2026</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680562710024">R9 — Penicilline Grünenthal, FI suisse exacte</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680598760031">R16 — Ceftriaxon Labatec IV/IM, FI suisse</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://ssi.guidelines.ch/guideline/2315/fr">R26 — SSI : méningite, version française</a>.</p></template>
<template data-pop="g05-penicilline" data-title="PénicillineG : neurosyphilis et sécurité">
<p data-src="R5,R26"><b>Amoxicillin OrPha IV.</b> Pour une infection grave de l’adulte&gt;40 kg, la FI autorise 2 g en perfusion courte de 30 min,3–6 fois/jour, maximum 12 g/j. La SSI utilise 2 g toutes les 4 h pour la couverture de Listeria dans les situations de risque. Sa FI ne fixe pas toute la durée d’une neurolistériose ; sensibilité, foyer et évolution guident le spécialiste.</p>
<p data-src="R5">La table rénale générale de la FI prévoit, après charge 1 g,0,5–1 g toutes les 12 h pour clairance 10–30 mL/min et 0,5 g toutes les 24 h sous 10 mL/min ; une dose supplémentaire 1 g après hémodialyse est décrite. Ces règles générales ne doivent pas être appliquées mécaniquement à une infection du SNC sans vérifier exposition et gravité. Surveiller rein, cristallurie, hémogramme, foie et INR selon contexte ; interactions avec méthotrexate et anticoagulants à considérer. Contre-indications allergiques, mononucléose/leucémie lymphoïde et réactions cutanées graves sont à vérifier. Ne pas utiliser de lidocaïne en IV ni mélanger avec un aminoside. Pendant la grossesse, la FI demande de la prudence ; l’allaitement doit être interrompu pendant le traitement selon ce produit exact.</p>
<p data-src="R7,R9"><b>Penicilline Grünenthal.</b> La benzylpénicilline sodique est adaptée à la neurosyphilis selon le schéma causal, distinct des doses générales 20–60 MUI/j de la FI. Un million d’UI correspond ici à 599 mg de substance et 38,6 mg de sodium ;10 MUI apportent 386 mg de sodium. Au-delà de 2 MUI, injection IV lente, au maximum 0,5 MUI/min selon FI. Prendre en compte surcharge sodée, hypokaliémie, allergie, fonction rénale et neurotoxicité avec convulsions. Les interactions avec méthotrexate et probénécide demandent attention.</p>
<p data-src="R9">La FI permet l’emploi pendant la grossesse. Pendant l’allaitement, de petites quantités passent dans le lait, avec risque de sensibilisation ou troubles digestifs chez l’enfant à surveiller. Une réaction de Jarisch–Herxheimer précoce ne doit pas être confondue avec une réaction allergique immédiate ; l’évaluation clinique décide de la conduite.</p>
<p data-src="R16,R26,R7"><b>Ceftriaxon Labatec.</b> La SSI utilise 2 g IV toutes les 12 h dans la méningite bactérienne communautaire adulte ; la neurosyphilis relève du schéma 2 g/j pendant 14 jours de DGN 2026. Si clairance&lt;10 mL/min, la FI limite à 2 g/j ; même plafond chez le patient dialysé, sans supplément après dialyse. Une insuffisance rénale et hépatique grave associée impose une surveillance clinique renforcée. Une infection nécessitant une exposition élevée et ces limites rénales doit être discutée avec infectiologie/pharmacie.</p>
<p data-src="R16">Ne pas mélanger la ceftriaxone aux solutions contenant du calcium. Chez le nouveau-né, prématurité, hyperbilirubinémie et nécessité de calcium IV comportent des contre-indications spécifiques ; chez les patients plus âgés, une administration séquentielle peut être possible avec rinçage approprié selon FI. Rechercher allergie, hémolyse, réactions cutanées graves et neurotoxicité. Pendant la grossesse, indication stricte ; allaitement interrompu selon la FI relue.</p>

<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13499315/">R7 — German guideline on neurosyphilis 2026</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680562710024">R9 — Penicilline Grünenthal, FI suisse exacte</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680598760031">R16 — Ceftriaxon Labatec IV/IM, FI suisse</a>.</p></template>
<template data-pop="g05-pyrimethamine" data-title="Toxoplasmose : produits et calculs">
<p data-src="R10,R15"><b>Le rapport TMP/SMX est 1:5.</b> Une ampoule de Bactrim IV de 5 mL contient 80 mg de triméthoprime et 400 mg de sulfaméthoxazole. Le schéma HAS 15/75 mg/kg/j correspond à la dose <b>quotidienne totale</b>, divisée en trois administrations ; il ne faut pas donner 15 mg/kg de TMP à chaque prise. La toxoplasmose n’est pas nommée dans les indications de cette FI, et sa durée de six semaines ne doit pas être confondue avec les durées usuelles IV ou la pneumocystose homologuées.</p>
<p data-src="R15">Pour Bactrim IV, clairance&gt;30 mL/min : posologie habituelle ;15–30 : moitié de la posologie ;&lt;15 : contre-indication selon FI. L’hémodialyse a des indications spécifiques de dose après séance et de suivi des concentrations ; la dialyse péritonéale n’est pas recommandée. Surveiller kaliémie, créatinine et hémogramme, particulièrement avec autres médicaments hyperkaliémiants ou myélotoxiques. Dofétilide est contre-indiqué ; méthotrexate et phénytoïne exposent à des interactions importantes.</p>
<p data-src="R15">Le concentré doit être dilué, jamais injecté en bolus : une ampoule dans 125 mL de solution compatible est le schéma habituel ; perfusion 30–60 min, au maximum 90 min. Une restriction hydrique peut justifier la dilution spécifique d’une ampoule dans 75 mL prévue par FI, avec les solutés autorisés. Tenir compte des excipients éthanol et propylène glycol. Déficit G6PD, réactions cutanées graves et restrictions néonatales/grossesse sont à vérifier ; le troisième trimestre est contre-indiqué. Ne pas extrapoler une désensibilisation après une réaction cutanée grave. En début de grossesse, si le cotrimoxazole est indispensable sans alternative, la FI recommande une supplémentation en acide folique de 5 mg/j ; cela ne remplace pas le folinate requis avec pyriméthamine. Pendant l’allaitement, mettre en balance le bénéfice maternel et les risques pour le nourrisson, notamment ictère nucléaire et hypersensibilité, selon âge et terrain.</p>
<p data-src="R8,R10"><b>Daraprim.</b> La pyriméthamine inhibe la dihydrofolate-réductase ; sa longue demi-vie favorise une toxicité persistante. Toujours associer sulfamide et folinate dans le régime concerné. La FI demande une numération au moins hebdomadaire et pendant deux semaines après l’arrêt ; chez l’immunodéprimé, au moins deux fois par semaine. Le premier trimestre est contre-indiqué et l’allaitement doit être interrompu. Méthotrexate, triméthoprime, zidovudine et autres myélotoxiques peuvent majorer le risque.</p>
<table class="t"><thead><tr><th>Sulfadiazine exacte</th><th>Règle lue</th><th>Pourquoi ne pas fusionner</th></tr></thead><tbody><tr><td data-src="R10,R11,R12">Sulfadiazin-Heyl 500 mg, RCP allemand août 2020</td><td data-src="R10,R11,R12">Adulte 50 mg/kg/j, maximum 4 g/j, répartis en quatre prises.</td><td data-src="R10,R11,R12">Clairance&lt;25 mL/min contre-indiquée ; premier trimestre contre-indiqué ; hydratation et diurèse suffisantes.</td></tr><tr><td data-src="R10,R11,R12">ADIAZINE 500 mg, RCP français juillet 2018</td><td data-src="R10,R11,R12">Adulte 4–6 g/j en 4–6 prises ; association à pyriméthamine.</td><td data-src="R10,R11,R12">Réduction en insuffisance rénale modérée, atteinte sévère contre-indiquée ; grossesse appréciée selon nécessité maternelle.</td></tr><tr><td data-src="R10,R11,R12">HAS 2024, schéma clinique VIH</td><td data-src="R10,R11,R12">100 mg/kg/j, maximum 6 g/j.</td><td data-src="R10,R11,R12">Ce plafond n’est pas celui de tous les produits ; une substitution de marque/pays demande vérification.</td></tr></tbody></table>
<p data-src="R11,R12">Les sulfamides exposent à cristallurie, atteinte rénale, cytopénies et réactions cutanées graves ; déficit G6PD et antécédents d’allergie sont à rechercher. Hydratation, surveillance urinaire et alcalinisation selon protocole font partie du traitement. L’information de disponibilité suisse n’a pas été établie par les RCP étrangers : elle doit être confirmée avant prescription.</p>
<p data-src="R14"><b>Folinate.</b> L’absorption orale est saturable ; une capsule 15 mg ne permet pas de déduire un fractionnement donnant 25 mg. Demander une présentation appropriée. Le folinate peut diminuer l’effet de phénytoïne, phénobarbital et primidone ; surveiller les crises et les concentrations si indiqué. Il ne doit pas masquer une carence en vitamine B12. L’acide folique n’est pas un substitut automatique au folinate requis avec pyriméthamine.</p>

<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680209640011">R8 — Daraprim 25 mg, FI suisse exacte</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.has-sante.fr/upload/docs/application/pdf/2024-07/reco484_argumentaire_vih_complications_cd_20240627_pd_ap.pdf">R10 — HAS complications associées au VIH : argumentaire</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.fachinfo.de/fi/pdf/004337">R11 — Sulfadiazin-Heyl 500 mg, RCP allemand exact</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/66265330/extrait">R12 — ADIAZINE 500 mg, RCP français exact</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680510760309">R14 — Folinate de calcium Sandoz, capsules 15 mg, FI suisse exacte</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680378870561">R15 — Bactrim solution à diluer pour perfusion, FI suisse</a>.</p></template>
<template data-pop="g05-brivudine" data-title="Brivudine : délai après la dernière dose">
<div class="alert" data-src="R32"><b>Brivudine et fluoropyrimidines : interaction potentiellement mortelle.</b> Brivex est réservé au zona précoce de l’adulte immunocompétent. Son métabolite inhibe irréversiblement la DPD :5-FU, y compris topique, capécitabine, tégafur et flucytosine peuvent devenir gravement toxiques. Respecter au moins quatre semaines <b>après la fin</b> de brivudine avant une fluoropyrimidine ; rechercher aussi un traitement récent, en cours ou planifié avant de prescrire. Une prise accidentelle demande une évaluation hospitalière urgente et un avis toxicologique.</div>
<p data-src="R32">Brivex est contre-indiqué chez l’immunodéprimé, l’enfant/adolescent, pendant la grossesse et l’allaitement ; il n’est pas un traitement d’encéphalite. La formule «toxicité jusqu’à quatre semaines» est insuffisante : elle peut faire croire qu’une coadministration serait acceptable après un délai arbitraire depuis la première dose.</p>
<p data-src="R2,R30,R40,R42,R44,R46,R47">Les régimes des parasitoses rares, de la tuberculose et des immunothérapies sont laissés aux protocoles spécialisés cités et aux FI exactes à vérifier au moment de leur utilisation. La monographie expose leurs indications et limites, sans inventer de dose, d’autorisation suisse ou de disponibilité. Une aide mnémotechnique peut organiser la surveillance, mais ne remplace jamais poids, voie, fonction rénale, indication et produit.</p>

<template data-pop="g05-herxheimer" data-title="Jarisch–Herxheimer : ne pas confondre avec allergie"><p data-src="R7,R9">La réaction peut survenir tôt après le traitement de la syphilis, avec fièvre et aggravation inflammatoire transitoire. La recommandation neurosyphilis 2026 rapporte 1–2 % dans son contexte et un délai typique 12–24 h ; la FI décrit aussi des réactions plus précoces.</p>
<p data-src="R7,R9">Le traitement est symptomatique, sans interruption automatique de l’antibiotique ni corticoïdes systématiques. Une réaction avec signes d’anaphylaxie doit au contraire être évaluée comme urgence allergique ; la chronologie seule ne tranche pas.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13499315/">R7 — German guideline on neurosyphilis 2026</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680562710024">R9 — Penicilline Grünenthal, FI suisse exacte</a>.</p></template>
<template data-pop="g05-mnemo" data-title="Mémo de sécurité construit pour cette leçon"><p data-src="R3,R4,R15,R31"><b>Agent – Voie – Dose – Rein – Surveillance.</b> Ce mémo est une aide pédagogique de l’auteur, pas un score validé. Identifier l’agent ou la cible empirique ; vérifier le produit et la voie ; écriremg/kg/j oumg/kg/prise ; adapter à la fonction rénale ; planifier hémogramme, ions et autres contrôles.</p>
<p data-src="R3,R4,R15,R31">L’aciclovir et le foscarnet font surveiller particulièrement rein et neurologie/ions ; ganciclovir et pyriméthamine imposent l’hémogramme ; cotrimoxazole demande aussi kaliémie. Un mémo ne remplace pas la FI exacte.</p>

<template data-pop="g05-lacunes" data-title="Limites réelles de cette version"><p data-src="R6,R13,R20,R40,R42,R44,R46,R47">Le codage est fondé sur CIM-10-GM 2024, sans certification suisse 2026. La cohorte danoise est lue au niveau du résumé ; elle ne fournit pas une incidence suisse. Le texte intégral RMS 2024 sur l’auto-immunité n’a pas été lu, seulement son résumé, complété par Graus/EAN/NEMOS/EULAR.</p>
<p data-src="R6,R13,R20,R40,R42,R44,R46,R47">Les produits étrangers de sulfadiazine ne prouvent pas une disponibilité suisse. Les infections rares et immunothérapies sont couvertes en diagnostic, principes de traitement et orientation, sans prétendre fournir chaque protocole posologique spécialisé. Les figures sont des planches anatomiques historiques humaines, non des images de maladie.</p>
<p data-src="R6,R13,R20,R40,R42,R44,R46,R47">Auto-relecture IA documentée, aucune validation médicale humaine ; les tests techniques ne certifient pas les indications thérapeutiques.</p>

<template data-pop="g05-myelite" data-title="Myélite : trois fonctions et une urgence à exclure"><p data-src="R17,R18,R36,R37">Moteur, sensibilité et autonomie doivent être examinés ensemble. Le niveau sensitif, la rétention urinaire et les signes pyramidaux orientent, mais une phase aiguë flasque/aréflexique est possible. Le niveau clinique ne fixe pas toujours la hauteur exacte de la lésion.</p>
<p data-src="R17,R18,R36,R37">IRM urgente pour écarter une compression ; début hyperaigu fait discuter infarctus. Ensuite rechercher infection, maladie démyélinisante, lupus, sarcoïdose ou tumeur selon le tableau. AQP4/MOG sériques par méthode cellulaire s’interprètent avec IRM et clinique.</p>

<template data-pop="g05-toxo-prophylaxie" data-title="Prophylaxie primaire et secondaire : ne pas mélanger"><p data-src="R10">La HAS 2024 recommande la prophylaxie primaire si CD4&lt;200/µL ou&lt;15 %, avec arrêt envisageable après CD4&gt;100/µL et charge virale indétectable&gt;3 mois selon contexte.</p>
<p data-src="R10">Après une toxoplasmose cérébrale, la prophylaxie secondaire a un critère plus exigeant :CD4&gt;200/µL et suppression virale&gt;6 mois. TMP/SMX 160/800 mg une fois/jour est l’entretien proposé. Un régime pyriméthamine–clindamycine ne protège pas de la pneumocystose et demande une prévention complémentaire.</p>
