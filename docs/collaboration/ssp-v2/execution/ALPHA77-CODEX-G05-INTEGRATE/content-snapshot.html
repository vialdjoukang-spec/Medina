<section class="ilot" id="g05-0"><h2><span class="n">0</span>La question clinique</h2>
<p data-src="R2,R17,R26">Un adulte devient confus et fébrile ; un autre développe une faiblesse des jambes, un niveau sensitif et une rétention urinaire. Le premier tableau évoque une atteinte cérébrale, le second une atteinte médullaire. Dans les deux cas, la première décision porte sur une urgence traitable : infection du système nerveux, état de mal épileptique, compression médullaire ou atteinte vasculaire. La recherche de la cause et le traitement progressent ensemble.</p>
<div class="key" data-src="R2,R26"><b>Deux délais, deux contextes.</b> Devant une encéphalite virale suspectée, l’EAN/ESCMID 2026 recommande l’aciclovir IV dès que possible, idéalement dans les six heures. Si une méningite bactérienne reste plausible, la SSI suisse demande une antibiothérapie dans l’heure. Une imagerie ou une ponction retardée ne doit pas retarder ces traitements.</div>
<p data-src="R6">G05 est un code de manifestation : il relie l’encéphalite, la myélite ou leur association à une affection classée ailleurs. La clinique précède le choix du code. Cette leçon rassemble donc les mécanismes, la démarche et les traitements communs, tout en distinguant les maladies causales.</p>

</section>
<section class="ilot" id="g05-1"><h2><span class="n">1</span>Définition, périmètre et diagnostic positif</h2>
<p data-src="R1,R17,R39">L’<b>encéphalite</b> associe une dysfonction cérébrale et des éléments compatibles avec une inflammation du parenchyme. Une encéphalopathie métabolique ou toxique peut provoquer une confusion sans inflammation cérébrale. La <b>myélite</b> est une atteinte inflammatoire de la moelle : déficit moteur, troubles sensitifs et dysfonction autonome peuvent être incomplets ou asymétriques. L’<b>encéphalomyélite</b> combine les deux territoires ; une méningo-encéphalite ajoute une atteinte méningée.</p>
<table class="t"><thead><tr><th>Définition de cas du Consortium 2013</th><th>Contenu</th></tr></thead><tbody><tr><td data-src="R39">Critère majeur</td><td data-src="R39">Altération de l’état mental pendant au moins 24 h, sans autre cause identifiée : baisse de conscience, confusion ou changement de personnalité.</td></tr><tr><td data-src="R39">Critères mineurs</td><td data-src="R39">Fièvre ≥ 38 °C dans les 72 h avant ou après la présentation ; crise nouvelle non expliquée par une épilepsie préexistante ; déficit focal nouveau ; LCR ≥ 5 leucocytes/µL ; anomalie parenchymateuse aiguë nouvelle à l’imagerie ; EEG compatible sans autre explication.</td></tr><tr><td data-src="R39">Possible, probable, confirmée</td><td data-src="R39">Critère majeur + deux mineurs : possible ; + au moins trois : probable. Une confirmation exige une preuve anatomopathologique, infectieuse ou auto-immune appropriée ; elle ne découle pas du seul nombre de critères.</td></tr></tbody></table>
<div class="trap" data-src="R2,R39"><b>Un cadre de classification n’est pas un chronomètre thérapeutique.</b> Ne pas attendre 24 h d’évolution, la fièvre ou une pléiocytose pour traiter une suspicion préoccupante. Un LCR initial normal est possible, notamment très tôt ou chez l’immunodéprimé.</div>
<table class="t"><thead><tr><th>Sous-code de manifestation</th><th>Affections citées par la CIM-10-GM 2024</th></tr></thead><tbody><tr><td data-src="R6">G05.0* — bactéries</td><td data-src="R6">Notamment neurolistériose, neurosyphilis et atteinte tuberculeuse correspondante.</td></tr><tr><td data-src="R6">G05.1* — virus</td><td data-src="R6">Notamment herpès, varicelle/zona, rougeole, oreillons, rubéole, CMV, entérovirus et adénovirus.</td></tr><tr><td data-src="R6">G05.2* — autres infections</td><td data-src="R6">Notamment toxoplasmose, trypanosomiase, maladie de Chagas, Naegleria et méningo-encéphalite à éosinophiles.</td></tr><tr><td data-src="R6">G05.8* — autres affections</td><td data-src="R6">Notamment atteinte neurologique du lupus systémique.</td></tr></tbody></table>
<p data-src="R6">Le code étiologique et le code astérisque sont associés selon les règles de la classification applicable. Une myélite transverse idiopathique (G37.3), une encéphalomyélite aiguë disséminée (G04.0) ou une encéphalite à tiques (A84) ne deviennent pas automatiquement G05. La référence de codage relue est allemande, version 2024 : elle ne certifie pas la facturation suisse 2026. <button class="w" data-k="g05-codage">Comprendre la règle dague–astérisque</button>.</p>

<section class="ilot" id="g05-2"><h2><span class="n">2</span>Épidémiologie et portée des chiffres</h2>
<p data-src="R20">Une cohorte nationale prospective danoise a inclus <b>495 adultes hospitalisés entre 2015 et 2023</b> pour encéphalite virale présumée ou prouvée. L’incidence estimée était de 1,18 pour 100 000 habitants par an (IC 95 % 1,01–1,35), avec un âge médian de 70 ans (IQR 54–78). VZV était identifié chez 156/495 patients (32 %), HSV-1 chez 154/495 (31 %), le virus de l’encéphalite à tiques chez 23/495 (5 %), un autre virus chez 40/495 (8 %) ; 122/495 (24 %) restaient sans agent identifié.</p>
<p data-src="R20">Dans cette population hospitalière, la confusion concernait 391/488 patients évaluables (80 %), les céphalées 234/397 (59 %) et le changement de personnalité 183/439 (42 %). Les dénominateurs diffèrent parce que toutes les données n’étaient pas disponibles. Ces fréquences ne décrivent ni toute infection virale ni la population suisse.</p>
<p data-src="R21,R23">L’OFSP rapporte jusqu’à une centaine de listérioses par an en Suisse, <b>toutes formes confondues</b> : ce chiffre n’est pas une incidence de neurolistériose. Pour la rougeole, la page fédérale indique environ une encéphalite pour 1 000 cas. Aucune incidence suisse globale de G05 n’a été établie par les sources relues ici.</p>
<p data-src="R25">Dans MONALISA, cohorte française 2009–2013, 252 des 818 listérioses incluses étaient neurologiques : 212/252 (84 %) se présentaient comme une méningo-encéphalite et 42/252 (17 %) comportaient une atteinte du tronc cérébral. Ces catégories peuvent se recouper ; une rhombencéphalite n’est donc pas l’unique visage de la neurolistériose.</p>
<div class="key" data-src="R20,R25"><b>Lire une fréquence avec son dénominateur.</b> Une proportion chez des malades hospitalisés ne mesure pas le risque de la population générale ; une association pronostique ne démontre pas un effet causal.</div>

</section>
<section class="ilot" id="g05-3"><h2><span class="n">3</span>De la lésion au symptôme : physiopathologie</h2>
<table class="t"><thead><tr><th>Mécanisme</th><th>Conséquence clinique</th><th>Ce que cela change</th></tr></thead><tbody><tr><td data-src="R1,R2,R7,R18,R19,R30,R36,R37">Infection du parenchyme, notamment HSV</td><td data-src="R1,R2,R7,R18,R19,R30,R36,R37">Atteinte temporale médiale/frontobasale possible : mémoire, langage, comportement et crises.</td><td data-src="R1,R2,R7,R18,R19,R30,R36,R37">L’association est évocatrice, jamais une preuve suffisante de l’agent ; PCR et contexte restent nécessaires.</td></tr><tr><td data-src="R1,R2,R7,R18,R19,R30,R36,R37">Inflammation méningée et parenchymateuse</td><td data-src="R1,R2,R7,R18,R19,R30,R36,R37">Céphalées, fièvre, raideur, confusion ; les signes méningés peuvent manquer.</td><td data-src="R1,R2,R7,R18,R19,R30,R36,R37">Traiter aussi une méningite bactérienne plausible, sans attribuer toute confusion fébrile à un virus.</td></tr><tr><td data-src="R1,R2,R7,R18,R19,R30,R36,R37">Inflammation ou lésion vasculaire</td><td data-src="R1,R2,R7,R18,R19,R30,R36,R37">VZV ou syphilis peuvent produire des manifestations focales ; dans le lupus, un mécanisme vasculaire lié aux antiphospholipides peut dominer.</td><td data-src="R1,R2,R7,R18,R19,R30,R36,R37">L’imagerie vasculaire et la distinction infection/inflammation/thrombose orientent des traitements différents.</td></tr><tr><td data-src="R1,R2,R7,R18,R19,R30,R36,R37">Atteinte des voies médullaires</td><td data-src="R1,R2,R7,R18,R19,R30,R36,R37">Déficit moteur, niveau sensitif, troubles sphinctériens ; atteinte aiguë parfois flasque avant l’apparition de spasticité.</td><td data-src="R1,R2,R7,R18,R19,R30,R36,R37">Écarter une compression et un infarctus avant d’appeler le syndrome « myélite ».</td></tr><tr><td data-src="R1,R2,R7,R18,R19,R30,R36,R37">Auto-immunité neuronale ou gliale</td><td data-src="R1,R2,R7,R18,R19,R30,R36,R37">Encéphalite limbique, syndrome anti-NMDAR ; myélite dans NMOSD/MOGAD ou lupus.</td><td data-src="R1,R2,R7,R18,R19,R30,R36,R37">Rechercher les diagnostics concurrents en parallèle ; un autoanticorps isolé ne remplace pas l’attribution clinique.</td></tr></tbody></table>
<p data-src="R2,R19">Après une encéphalite herpétique, une aggravation secondaire peut relever d’une auto-immunité, notamment anti-NMDAR, plutôt que d’une persistance virale. Les proportions de 27–57 % rapportées par la recommandation concernent des <b>patients présentant une rechute</b>, pas tous les patients ayant eu un HSV. Il faut reprendre l’examen, l’IRM, le LCR et les recherches ciblées avant de choisir le traitement.</p>
<p data-src="R33,R36,R37">La relation entre circuit normal, lésion et signe est développée dans les six sous-onglets scientifiques. Les planches humaines originales y montrent la surface cérébrale médiale et les colonnes cellulaires de la moelle ; elles ne prétendent pas représenter une IRM pathologique.</p>

<p class="ui">Approfondir : <button class="w" data-k="g05-hsve">HSV</button> · <button class="w" data-k="g05-antinmda">Rechute auto-immune</button></p></section>
<section class="ilot" id="g05-4"><h2><span class="n">4</span>Causes, terrains et syndromes évocateurs</h2>
<table class="t"><thead><tr><th>Situation</th><th>Hypothèses prioritaires</th><th>Réserve d’interprétation</th></tr></thead><tbody><tr><td data-src="R1,R2,R7,R17,R18,R26">Confusion fébrile aiguë, crises, troubles mnésiques ou aphasie</td><td data-src="R1,R2,R7,R17,R18,R26">HSV ; VZV ; autres virus ; méningite bactérienne ; encéphalite auto-immune.</td><td data-src="R1,R2,R7,R17,R18,R26">Ni absence de fièvre ni IRM normale précoce n’exclut une encéphalite.</td></tr><tr><td data-src="R1,R2,R7,R17,R18,R26">Immunodépression, transplantation, VIH avancé</td><td data-src="R1,R2,R7,R17,R18,R26">CMV, toxoplasmose, VZV, HSV ; selon contexte JCV, HHV-6 et autres opportunistes.</td><td data-src="R1,R2,R7,R17,R18,R26">Un résultat moléculaire peut nécessiter une interprétation clinico-radiologique ; tous les agents détectés ne sont pas la cause.</td></tr><tr><td data-src="R1,R2,R7,R17,R18,R26">Âge élevé ou terrain exposant à Listeria</td><td data-src="R1,R2,R7,R17,R18,R26">Méningo-encéphalite ou atteinte du tronc : troubles des nerfs crâniens, équilibre, déglutition.</td><td data-src="R1,R2,R7,R17,R18,R26">Les céphalosporines usuelles ne constituent pas une couverture de Listeria ; la SSI ajoute l’amoxicilline selon âge/terrain.</td></tr><tr><td data-src="R1,R2,R7,R17,R18,R26">Atteinte cognitive chronique, troubles pupillaires, syndrome méningovasculaire ou cordonal postérieur</td><td data-src="R1,R2,R7,R17,R18,R26">Neurosyphilis.</td><td data-src="R1,R2,R7,R17,R18,R26">La neurosyphilis peut survenir à différents stades ; ne pas la réduire à la syphilis tardive.</td></tr><tr><td data-src="R1,R2,R7,R17,R18,R26">Myélite, névrite optique ou syndrome de l’area postrema</td><td data-src="R1,R2,R7,R17,R18,R26">NMOSD, MOGAD ; lupus ; infection selon exposition.</td><td data-src="R1,R2,R7,R17,R18,R26">Une lésion médullaire ≥ 3 segments vertébraux contigus est longitudinalement étendue, sans être spécifique d’une cause.</td></tr><tr><td data-src="R1,R2,R7,R17,R18,R26">Voyage, migration ou exposition particulière</td><td data-src="R1,R2,R7,R17,R18,R26">Tuberculose, trypanosomiase, Chagas, Naegleria, helminthose ; arbovirose selon zone.</td><td data-src="R1,R2,R7,R17,R18,R26">Le voyage oriente les prélèvements, mais ne dispense pas de traiter les causes urgentes habituelles.</td></tr></tbody></table>
<p data-src="R22">L’encéphalite à tiques est un diagnostic différentiel important en Suisse. La vaccination recommandée par l’OFSP concerne les personnes exposées dès trois ans dans les régions à risque ; entre un et deux ans, la décision est individualisée. La page relue considère les cantons suisses à risque sauf le Tessin. Vérifier la carte et les recommandations en vigueur au moment de la consultation.</p>

<section class="ilot" id="g05-5"><h2><span class="n">5</span>Anamnèse : reconstruire la chronologie avec le proche</h2>
<p data-src="R2,R17,R19">Le patient confus peut minimiser ses troubles ou ne pas les mémoriser. Demander à un proche l’état antérieur, le premier changement et la progression : heures, jours ou semaines ; fluctuations ; crises ; fièvre ; céphalées ; changement de comportement, mémoire ou langage. Une évolution subaiguë de moins de trois mois peut entrer dans le cadre d’une encéphalite auto-immune, mais n’élimine pas une infection.</p>
<table class="t"><thead><tr><th>Axe</th><th>Questions utiles</th></tr></thead><tbody><tr><td data-src="R1,R2,R7,R17,R21,R39">Signes cérébraux</td><td data-src="R1,R2,R7,R17,R21,R39">Troubles de conscience, amnésie, hallucinations ou agitation, automatisme/crise, déficit focal, diplopie, dysphagie, trouble de marche.</td></tr><tr><td data-src="R1,R2,R7,R17,R21,R39">Signes médullaires</td><td data-src="R1,R2,R7,R17,R21,R39">Faiblesse des membres, douleur rachidienne, paresthésies, sensation de ceinture, niveau sensitif, rétention ou incontinence, constipation, troubles sexuels ; dyspnée si atteinte haute.</td></tr><tr><td data-src="R1,R2,R7,R17,R21,R39">Terrain et traitements</td><td data-src="R1,R2,R7,R17,R21,R39">Immunosuppression, cancer, VIH, greffe, maladie auto-immune ; anticoagulants avant PL ; nouveaux médicaments et toxiques ; fonction rénale et hydratation avant antiviraux.</td></tr><tr><td data-src="R1,R2,R7,R17,R21,R39">Expositions</td><td data-src="R1,R2,R7,R17,R21,R39">Tiques/insectes, morsure animale, voyage et résidence antérieure, contacts infectieux, statut vaccinal, aliments à risque de Listeria, exposition sexuelle ; eau entrée dans le nez ou ingestion à risque si parasitose envisagée.</td></tr><tr><td data-src="R1,R2,R7,R17,R21,R39">Évolution sous traitement</td><td data-src="R1,R2,R7,R17,R21,R39">Heure des premières doses, prélèvements avant/après traitement, observance, effets indésirables, amélioration puis rechute : infection persistante, complication et auto-immunité restent à distinguer.</td></tr></tbody></table>
<div class="key" data-src="R2"><b>Interprétation.</b> Une éruption peut orienter vers VZV, mais son absence ne suffit pas à l’exclure. Aucun signe ni facteur d’exposition isolé ne permet d’éliminer les principaux agents traitables.</div>

</section>
<section class="ilot" id="g05-6"><h2><span class="n">6</span>Examen clinique et syndromes de localisation</h2>
<p data-src="R2,R26">Commencer par voies aériennes, respiration, circulation, température et glycémie, puis mesurer la vigilance et rechercher des crises. Documenter l’examen et son heure pour comparer l’évolution. Une baisse progressive de conscience, un état de mal, une menace respiratoire ou des troubles hémodynamiques justifient une prise en charge intensive ; l’admission en réanimation n’est pas automatique pour toute encéphalite.</p>
<table class="t"><thead><tr><th>Examen</th><th>Comment examiner et interpréter</th></tr></thead><tbody><tr><td data-src="R2,R7,R17,R36,R37">Fonctions supérieures</td><td data-src="R2,R7,R17,R36,R37">Évaluer orientation et attention, compréhension et dénomination, mémoire récente, comportement. Une aphasie n’est pas une simple confusion ; une amnésie isolée requiert aussi un diagnostic différentiel.</td></tr><tr><td data-src="R2,R7,R17,R36,R37">Nerfs crâniens et tronc</td><td data-src="R2,R7,R17,R36,R37">Pupilles, oculomotricité, visage, déglutition, voix et langue ; relever une asymétrie. Dans la neurosyphilis, une dissociation lumière–accommodation peut orienter sans suffire au diagnostic.</td></tr><tr><td data-src="R2,R7,R17,R36,R37">Motricité et réflexes</td><td data-src="R2,R7,R17,R36,R37">Comparer force et maintien des bras ; Mingazzini aux jambes ; tonus, réflexes et réponse plantaire. Un Babinski est une extension du gros orteil ; des réflexes vifs isolés ne prouvent pas une lésion pyramidale.</td></tr><tr><td data-src="R2,R7,R17,R36,R37">Sensibilité et moelle</td><td data-src="R2,R7,R17,R36,R37">Tester tact, douleur/température, vibration et position ; chercher un niveau sur le tronc et comparer côtés. Le niveau clinique n’est pas nécessairement le niveau anatomique exact de la lésion.</td></tr><tr><td data-src="R2,R7,R17,R36,R37">Marche et coordination</td><td data-src="R2,R7,R17,R36,R37">Si l’état le permet, équilibre, marche, coordination segmentaire ; distinguer ataxie cérébelleuse, proprioceptive et faiblesse. Ne pas faire marcher un patient instable sans aide.</td></tr><tr><td data-src="R2,R7,R17,R36,R37">Autonomie et sphincters</td><td data-src="R2,R7,R17,R36,R37">Rechercher rétention, incontinence et trouble du transit ; réévaluer respiration dans une atteinte médullaire haute. Une aréflexie initiale n’élimine pas une atteinte centrale aiguë.</td></tr></tbody></table>
<p data-src="R37">Un <b>syndrome médullaire transverse</b> associe des déficits sous-lésionnels moteurs et sensitifs avec troubles autonomes. Un <b>Brown-Séquard</b> associe déficit moteur et proprioceptif du côté de la lésion, avec déficit thermoalgique controlatéral. Une atteinte centrale peut dissocier la sensibilité thermoalgique des autres modalités. Une atteinte du cône peut mêler signes pyramidaux et périphériques. Ces modèles localisent ; ils ne nomment pas l’agent.</p>
<div class="alert" data-src="R17,R18,R37"><b>Urgence médullaire.</b> Déficit progressif, niveau sensitif ou trouble sphinctérien récent : imagerie urgente pour rechercher une compression. Un début hyperaigu, notamment en moins de quatre heures, fait discuter une origine ischémique ; une progression sur plus de quatre semaines élargit vers tumeur ou sarcoïdose.</div>

<section class="ilot" id="g05-7"><h2><span class="n">7</span>Démarche diagnostique : agir et vérifier en parallèle</h2>
<p data-src="R2,R26">La démarche ne consiste pas à attendre qu’un bilan complet confirme l’encéphalite. Elle commence par les fonctions vitales, la glycémie et les crises, puis organise les prélèvements et les traitements urgents. Rechercher une cause bactérienne en même temps que HSV/VZV ; documenter l’heure des symptômes, de la ponction et de l’aciclovir pour interpréter les résultats.</p>
<table class="t"><thead><tr><th>Étape</th><th>Décision</th><th>Réévaluation</th></tr></thead><tbody><tr><td data-src="R2,R17,R18,R26">Immédiatement</td><td data-src="R2,R17,R18,R26">Stabiliser ; prendre hémocultures et prélèvements utiles sans retard thérapeutique ; aciclovir IV si suspicion ; antibiothérapie si méningite bactérienne possible.</td><td data-src="R2,R17,R18,R26">Conscience, respiration, circulation, crises et électrolytes.</td></tr><tr><td data-src="R2,R17,R18,R26">Ponction lombaire</td><td data-src="R2,R17,R18,R26">La réaliser dès que possible si elle est sûre ; sinon traiter, imager selon indication et réévaluer sa faisabilité.</td><td data-src="R2,R17,R18,R26">Une PL différée reste utile. Ne pas confondre scanner de sécurité et examen étiologique de référence.</td></tr><tr><td data-src="R2,R17,R18,R26">Première journée</td><td data-src="R2,R17,R18,R26">IRM cérébrale préférée, idéalement dans les 24 h et au plus tard 48 h selon EAN ; LCR, PCR ciblées HSV/VZV, examens guidés par terrain.</td><td data-src="R2,R17,R18,R26">EEG si crise non convulsive suspectée, altération inexpliquée ou doute diagnostique ; pas automatiquement chez tous.</td></tr><tr><td data-src="R2,R17,R18,R26">Résultat négatif précoce</td><td data-src="R2,R17,R18,R26">Si première PL avant 3 jours et non diagnostique, répéter 2–3 jours plus tard, en visant 48 h ; poursuivre aciclovir si suspicion forte.</td><td data-src="R2,R17,R18,R26">Reconsidérer l’ensemble clinique, imagerie, LCR et diagnostics alternatifs.</td></tr><tr><td data-src="R2,R17,R18,R26">Déficit médullaire</td><td data-src="R2,R17,R18,R26">IRM médullaire urgente pour compression ; localisation clinique, bilan cérébral et LCR/anticorps selon hypothèse.</td><td data-src="R2,R17,R18,R26">Infarctus, NMOSD/MOGAD, lupus, infection, tumeur et sarcoïdose ne partagent pas le même traitement.</td></tr></tbody></table>
<p data-src="R2">Un panel méningo-encéphalite multiplex peut compléter le bilan ; il <b>ne remplace pas les PCR ciblées</b> lorsque la suspicion est forte. La recommandation EAN/ESCMID souligne la faible certitude des données et les faux négatifs possibles, notamment pour HSV-1. Le résultat du test doit répondre à une question clinique, pas fermer artificiellement le diagnostic.</p>
<table class="t"><thead><tr><th>Diagnostic différentiel</th><th>Indice utile</th><th>Piège</th></tr></thead><tbody><tr><td data-src="R2,R3,R17,R18,R19,R26">Méningite bactérienne, abcès</td><td data-src="R2,R3,R17,R18,R19,R26">Terrain, sepsis, LCR, hémocultures et imagerie.</td><td data-src="R2,R3,R17,R18,R19,R26">L’absence de raideur ou un marqueur inflammatoire peu élevé ne suffit pas à exclure.</td></tr><tr><td data-src="R2,R3,R17,R18,R19,R26">AVC, thrombose ou infarctus médullaire</td><td data-src="R2,R3,R17,R18,R19,R26">Début brutal, distribution vasculaire, diffusion et imagerie adaptée.</td><td data-src="R2,R3,R17,R18,R19,R26">Une infection peut aussi se compliquer d’un événement vasculaire.</td></tr><tr><td data-src="R2,R3,R17,R18,R19,R26">État de mal non convulsif</td><td data-src="R2,R3,R17,R18,R19,R26">Trouble de conscience persistant, fluctuations ou signes discrets ; EEG.</td><td data-src="R2,R3,R17,R18,R19,R26">Un EEG anormal ne distingue pas à lui seul encéphalite infectieuse et auto-immune.</td></tr><tr><td data-src="R2,R3,R17,R18,R19,R26">Toxique, métabolique, médicament</td><td data-src="R2,R3,R17,R18,R19,R26">Glycémie, ions, fonction rénale/hépatique, exposition et chronologie.</td><td data-src="R2,R3,R17,R18,R19,R26">L’aciclovir accumulé peut provoquer des manifestations neurologiques et simuler une aggravation.</td></tr><tr><td data-src="R2,R3,R17,R18,R19,R26">Encéphalite auto-immune</td><td data-src="R2,R3,R17,R18,R19,R26">Début subaigu, mémoire/comportement/crises, critères cliniques, IRM/LCR/anticorps.</td><td data-src="R2,R3,R17,R18,R19,R26">IRM ou LCR normaux possibles ; anticorps sérique isolé parfois trompeur.</td></tr><tr><td data-src="R2,R3,R17,R18,R19,R26">Compression médullaire</td><td data-src="R2,R3,R17,R18,R19,R26">Déficit moteur, niveau sensitif, douleur et sphincters ; IRM urgente.</td><td data-src="R2,R3,R17,R18,R19,R26">Une étiquette « myélite » ne doit jamais retarder une décompression nécessaire.</td></tr></tbody></table>

<section class="ilot" id="g05-8"><h2><span class="n">8</span>Urgences, complications et soins de support</h2>
<p data-src="R2,R26">Une aggravation neurologique impose une réévaluation immédiate : état de mal, œdème ou hypertension intracrânienne, événement vasculaire, hydro-électrolytes, sepsis, toxicité du traitement ou nouveau mécanisme immunitaire. Prévenir l’aspiration et assurer la ventilation si la conscience ou la déglutition sont compromises. Les indications de soins intensifs sont cliniques et évolutives.</p>
<p data-src="R2">Traiter les crises aiguës selon le protocole d’urgence institutionnel. La recommandation ne justifie pas un antiépileptique en prophylaxie primaire chez tout patient sans crise ; après une crise, durée et arrêt se discutent selon l’évolution et l’avis neurologique. Un état de mal non convulsif peut expliquer une conscience qui ne s’améliore pas.</p>
<p data-src="R17,R18,R37">Dans une myélite, surveiller force, niveau sensitif, respiration si lésion haute et fonction vésicale. Une rétention doit être identifiée et prise en charge ; la rééducation et l’évaluation des besoins d’aide commencent pendant la phase aiguë. Les déficits peuvent évoluer malgré un premier examen peu spectaculaire.</p>
<div class="alert" data-src="R2,R3,R31"><b>Aggravation sous antiviral : reprendre le raisonnement.</b> Vérifier dose, poids utilisé, intervalle, perfusion et fonction rénale ; rechercher crises, complication de l’infection et toxicité. Ne pas conclure automatiquement à une résistance et ne pas augmenter aveuglément la dose.</div>

<section class="ilot" id="g05-9"><h2><span class="n">9</span>Traitement causal : infection, inflammation ou mécanisme vasculaire</h2>
<p data-src="R2,R3"><b>HSV.</b> Chez l’adulte à fonction rénale normale, l’aciclovir IV 10 mg/kg toutes les 8 h, perfusé sur au moins une heure, est le traitement initial. L’EAN/ESCMID 2026 recommande au moins 14 jours pour une encéphalite HSV prouvée ;21–28 jours peuvent être nécessaires si absence d’amélioration, aggravation ou immunodépression. Cette durée clinique diffère des 10 jours décrits dans la FI suisse Aciclovir Labatec pour l’encéphalite : les deux niveaux de référence sont affichés, pas fusionnés. Si le patient s’améliore, une PL de fin de traitement n’est pas systématique.</p>
<p data-src="R2"><b>Arrêter l’aciclovir empirique</b> demande une faible probabilité résiduelle ou une autre cause établie, et une interprétation concordante des examens : PCR HSV négative sur LCR prélevé après 72 h, cellularité normale sauf autre explication, IRM sans atteinte temporale compatible. Un résultat négatif isolé précoce ne suffit pas. En cas de forte suspicion, poursuivre et répéter les investigations.</p>
<p data-src="R2,R3,R32"><b>VZV.</b> L’EAN retient l’aciclovir IV 10 mg/kg toutes les 8 h chez l’adulte avec fonction rénale normale ; la durée dépend de la présentation et de l’évolution spécialisée. Une vasculopathie confirmée peut conduire à discuter une corticothérapie adjuvante. La brivudine orale, homologuée pour le zona précoce de l’adulte immunocompétent, n’est pas un substitut thérapeutique dans l’encéphalite.</p>
<p data-src="R2"><b>Corticoïdes dans HSV.</b> La recommandation 2026 ne peut recommander pour ou contre leur utilisation systématique. L’essai DexEnceph discuté inclut 94 participants randomisés,47 par groupe, sans amélioration du critère principal ni des critères secondaires rapportés. Une analyse post hoc sur le délai ne démontre pas un bénéfice causal. Il serait inexact de présenter encore cet essai comme simplement non publié.</p>
<p data-src="R1,R4,R31"><b>CMV neurologique chez l’immunodéprimé.</b> Le ganciclovir IV, parfois associé au foscarnet selon le contexte et l’avis infectiologique, repose sur des données et recommandations spécialisées. Les FI suisses exactes ne valident pas un protocole universel d’encéphalite : Cymevene vise les infections graves à CMV dans son périmètre, Foscavir la rétinite CMV du sida et le HSV mucocutané résistant. La durée et l’association ne se déduisent pas automatiquement de la rétinite ; surveiller ensemble rein, ions et hémogramme.</p>
<p data-src="R24,R26,R5"><b>Listeria.</b> La SSI suisse ajoute l’amoxicilline IV 2 g toutes les 4 h à la ceftriaxone chez l’adulte de plus de 50 ans ou à risque de Listeria, dont la grossesse, dans la méningite communautaire présumée à fonction rénale normale. Après documentation, le traitement est adapté à la sensibilité et à l’atteinte ; la DGN indique généralement au moins trois semaines pour Listeria. Une rhombencéphalite ou un foyer compliqué demande une discussion individualisée. Ne pas considérer la ceftriaxone seule comme couverture de Listeria.</p>
<p data-src="R25,R26">La dexaméthasone empirique de la méningite bactérienne répond surtout au bénéfice attendu dans le pneumocoque : la SSI demande son arrêt si celui-ci est exclu. L’association entre dexaméthasone et mortalité observée dans MONALISA ne prouve pas, à elle seule, une causalité. Elle ne doit pas être transformée en essai randomisé ni en justification de prolonger les corticoïdes dans toute neurolistériose.</p>
<p data-src="R7,R9,R16"><b>Neurosyphilis.</b> La recommandation DGN 2026 propose 14 jours de pénicilline G IV :6 MUI toutes les 6 h, ou 5 MUI cinq fois/jour, ou 10 MUI toutes les 8 h. La ceftriaxone 2 g IV par jour pendant 14 jours est une alternative discutée. Il s’agit de benzylpénicilline aqueuse, pas d’une pénicilline dépôt. Réaction de Jarisch–Herxheimer et allergie ne sont pas synonymes ; la réaction inflammatoire précoce se traite symptomatiquement, sans interruption automatique de l’antibiotique ni corticoïdes de routine.</p>
<p data-src="R10,R15"><b>Toxoplasmose cérébrale du VIH.</b> La HAS 2024 recommande en première intention triméthoprime/sulfaméthoxazole <b>15/75 mg/kg/jour au total</b>, répartis en trois prises, PO ou IV, avec un maximum de 12 ampoules IV/jour dans le schéma décrit. L’attaque dure 6 semaines si la réponse est satisfaisante ; elle peut nécessiter une prolongation selon la situation. Le schéma est distinct des indications et durées homologuées de Bactrim IV suisse. Évaluer l’amélioration clinique et radiologique ; sans réponse après 15 jours, réimager et discuter notamment une biopsie pour lymphome ou autre diagnostic.</p>
<p data-src="R8,R10,R11,R12,R14">L’alternative HAS associe pyriméthamine 100 mg à J1 puis 50 mg/j, sulfadiazine 100 mg/kg/j sans dépasser 6 g/j, et folinate 25 mg trois fois/semaine. Ces chiffres ne sont pas interchangeables avec chaque produit : Sulfadiazin-Heyl allemand plafonne à 4 g/j, ADIAZINE français décrit 4–6 g/j, et Daraprim suisse ne fixe pas un régime unique pour toutes les formes sévèrement immunodéprimées. Faire vérifier produit, approvisionnement et présentation par la pharmacie ; une capsule de folinate 15 mg n’est pas une dose de 25 mg.</p>
<p data-src="R10">Dans la toxoplasmose, réserver les corticoïdes à un effet de masse menaçant ; traiter une crise si elle survient, sans prophylaxie anticonvulsivante universelle. Débuter les antirétroviraux dans les deux semaines selon la recommandation HAS. Après l’attaque, une prophylaxie secondaire est nécessaire jusqu’à restauration immunitaire selon les critères précisés au suivi.</p>
<p data-src="R18,R19,R30"><b>Auto-immunité et lupus.</b> Rechercher simultanément infection, toxicité et maladie vasculaire avant d’attribuer les signes au lupus. Une manifestation inflammatoire neuropsychiatrique peut nécessiter glucocorticoïdes et immunosuppression ; une manifestation vasculaire liée aux antiphospholipides demande une stratégie antithrombotique appropriée. Les myélopathies et confusions sévères peuvent justifier cyclophosphamide ou rituximab en milieu spécialisé. Cette leçon ne fournit pas de doses de ces agents sans leurs FI exactes ; leur indication ne résulte pas de la seule présence d’anticorps.</p>

<section class="ilot" id="g05-10"><h2><span class="n">10</span>Suivi, réadaptation, pronostic et prévention</h2>
<p data-src="R2">Prévoir une évaluation des besoins de réadaptation à toutes les étapes : cognition, mémoire, langage, comportement, fatigue, motricité, autonomie et retentissement familial. Une sortie avec examen moteur rassurant n’exclut pas des troubles mnésiques ou exécutifs importants. Transmettre un plan de suivi, les résultats encore attendus et les signes qui imposent une réévaluation.</p>
<p data-src="R20">Dans la cohorte danoise précitée,111/495 patients (22 %) ont été admis en soins intensifs. La mortalité toutes causes était de 41/495 (8 %) à 30 jours et 76/495 (15 %) à 6 mois. L’immunodépression, HSV-1 et un Glasgow&lt;12 étaient associés à une mortalité à 6 mois plus élevée ; il s’agit d’associations observationnelles dans cette population, pas d’un pronostic individuel certain ni d’une démonstration causale.</p>
<p data-src="R7">Après neurosyphilis, suivre clinique et sérologie quantitative appropriée. Si la réponse clinique et sérologique est bonne, la recommandation 2026 ne demande pas de PL systématique. Une réponse insuffisante justifie une réévaluation, souvent vers 4–6 mois ou plus tôt selon l’évolution. La persistance d’anticorps tréponémiques ou d’un index intrathécal ne démontre pas à elle seule une infection active.</p>
<p data-src="R10">Après toxoplasmose du VIH, la HAS propose en entretien TMP/SMX 160/800 mg une fois/jour jusqu’à CD4&gt;200/µL et charge virale indétectable pendant plus de 6 mois. La <b>prophylaxie primaire</b> est une autre situation : recommandée si CD4&lt;200/µL ou&lt;15 %, elle peut être interrompue après CD4&gt;100/µL et suppression virale durable&gt;3 mois selon le contexte. Ne pas appliquer ce seuil plus bas à l’arrêt de la prophylaxie secondaire d’une toxoplasmose cérébrale.</p>
<p data-src="R21,R22,R23">Prévenir selon la cause : hygiène alimentaire et éviction des aliments à risque de Listeria chez les personnes vulnérables ; protection contre les tiques et vaccination FSME selon exposition ; vaccination rougeole, idéalement RORV selon recommandations suisses, à 9 et 12 mois avec rattrapage des personnes non immunes. Le suivi infectiologique inclut prévention adaptée au VIH et prise en charge des expositions sexuelles lorsque pertinente.</p>
<p data-src="R17,R18">Après myélite, réévaluer marche, transferts, douleur, sensibilité, spasticité et fonctions vésicale, intestinale et sexuelle. Une maladie récidivante comme NMOSD exige un suivi spécialisé ; la résolution de l’épisode ne suffit pas à décider l’arrêt d’un traitement préventif propre à cette maladie.</p>

<section class="ilot" id="g05-11"><h2><span class="n">11</span>Causes rares et terrains particuliers</h2>
<p data-src="R40"><b>Trypanosomiase africaine.</b> Rechercher un séjour en Afrique subsaharienne et l’exposition aux glossines. Après la phase sanguine/lymphatique, l’atteinte neurologique peut provoquer troubles du sommeil, comportement, sensibilité profonde, tonus, marche et crises. L’OMS 2024 définit le stade neurologique par plus de 5 leucocytes/µL et/ou des trypanosomes dans le LCR. Espèce, gravité, âge et poids déterminent le traitement ; le fexinidazole a élargi les options, y compris pour rhodesiense en 2024. La sélection et la surveillance relèvent d’un centre de médecine tropicale, pas d’un régime unique extrapolé.</p>
<p data-src="R41,R42"><b>Chagas.</b> Chez un patient ayant vécu en Amérique latine, surtout immunodéprimé, une méningo-encéphalite ou une lésion cérébrale focale peut révéler une réactivation de T. cruzi et simuler une toxoplasmose. Deux tests sérologiques différents documentent l’infection chronique ; prélèvements directs et PCR, notamment quantitative sériée, participent à l’évaluation d’une réactivation. Une sérologie positive seule ne prouve pas que la lésion cérébrale est chagasique. Benznidazole ou nifurtimox nécessitent expertise, surveillance et vérification du produit disponible ; le statut américain ne démontre pas une homologation suisse.</p>
<p data-src="R43,R44"><b>Naegleria.</b> Une méningo-encéphalite rapidement progressive après entrée d’eau potentiellement contaminée dans le nez impose une alerte infectiologique et microbiologique immédiate. Le début peut imiter une méningite bactérienne, puis évoluer vers confusion, crises et œdème cérébral. Le CDC recommande une association thérapeutique spécialisée, fondée sur des données limitées, notamment des survivants et des résultats expérimentaux. Les formulations d’amphotéricine et les azolés ne sont pas interchangeables sans expertise ; aucun protocole posologique suisse complet n’est extrapolé ici.</p>
<p data-src="R45,R46"><b>Méningite à éosinophiles.</b> Voyage, aliments crus ou insuffisamment cuits et éosinophilie orientent notamment vers A. cantonensis. L’éosinophilie peut manquer au début ; d’autres causes restent possibles. L’analyse du LCR et des examens spécialisés sont préférables à un examen de selles, peu utile pour ce diagnostic. Selon la synthèse CDC, le traitement est surtout symptomatique et anti-inflammatoire ; le bénéfice additionnel d’un anthelminthique n’est pas établi de manière uniforme et se discute avec le spécialiste.</p>
<p data-src="R47"><b>Tuberculose neurologique.</b> Une évolution subaiguë avec céphalées, fièvre, signes méningés ou focaux fait rechercher une tuberculose selon le terrain. Xpert/Ultra et culture du LCR sont complémentaires ; aucun test négatif isolé ne l’exclut. L’imagerie recherche notamment hydrocéphalie, infarctus et tuberculomes. Le traitement prolongé est spécialisé : la recommandation 2025/26 conserve une référence adulte de 12 mois, sans transposer les schémas pédiatriques courts. Les corticoïdes sont fortement recommandés sans VIH, individualisés avec VIH ; l’introduction des antirétroviraux est généralement différée de 4–8 semaines. Une atteinte médullaire impose aussi d’écarter une compression vertébrale.</p>
<p data-src="R3,R4,R5,R7,R15,R16"><b>Enfant, grossesse et insuffisance rénale.</b> Ces situations ne se gèrent pas par une simple règle de trois. Les doses pédiatriques d’aciclovir diffèrent selon âge et surface corporelle ; l’atteinte néonatale du SNC demande 21 jours dans la FI relue. Cymevene n’est pas homologué avant 18 ans dans cette FI. Grossesse, allaitement, fonction rénale et interactions sont vérifiés produit par produit dans l’onglet pharmacologie.</p>

</section>
<section class="ilot" id="g05-12"><h2><span class="n">12</span>Critères décisifs et correspondances PROFILES</h2>
<p data-src="R19">Une <b>encéphalite auto-immune possible</b> selon Graus 2016 associe un début subaigu (&lt;3 mois) de troubles mnésiques, d’altération mentale ou de symptômes psychiatriques, au moins un élément parmi déficit focal, crises non expliquées, pléiocytose ou IRM évocatrice, et exclusion raisonnable des alternatives. Une encéphalite limbique définie demande un ensemble plus strict, notamment une atteinte temporale médiale bilatérale en FLAIR avec argument LCR ou EEG et exclusion des autres causes. La catégorie «possible» n’est pas une confirmation étiologique.</p>
<p data-src="R18">Une myélite longitudinalement étendue mesure au moins trois segments vertébraux contigus. Pour NMOSD, les exigences diffèrent selon la présence d’AQP4-IgG ; la sérologie doit être interprétée avec le syndrome, l’IRM et les diagnostics concurrents. Les tests sériques par méthode cellulaire sont privilégiés ; faible titre ou résultat discordant impose confirmation. Lupus et NMOSD peuvent coexister : un lupus connu ne dispense pas de rechercher AQP4/MOG lorsque le tableau le justifie.</p>
<p data-src="R27,R28,R29"><b>Formation suisse.</b> Les correspondances pédagogiques proposées ici utilisent PROFILES 2017 : SSP 96–105 (équilibre, marche, mouvements, langage, vertiges, céphalée, mémoire, parésie, sensibilité, crises),120/126/145 (comportement, confusion, coma),205/207/216/219 (urgences neurologiques correspondantes), ainsi que l’examen neurologique/coma de l’EPA2 et des gestes de l’EPA6. Ce rapprochement est celui de l’auteur, pas une table officielle G05–SSP. MEBEKO 2026 mentionne 265 situations ; la publication suisse sur PROFILES 2 situe sa mise en œuvre au semestre 2025/26 et son usage comme base de l’examen fédéral à partir de 2028. Ne pas confondre les numérotations des versions.</p>

</section>
<section class="ilot" id="g05-13"><h2><span class="n">13</span>Points clés et pièges de raisonnement</h2>
<table class="t"><thead><tr><th>À retenir</th><th>Erreur à éviter</th></tr></thead><tbody><tr><td data-src="R2,R3,R17,R18,R19,R30,R31">Localiser cerveau, méninges et/ou moelle.</td><td data-src="R2,R3,R17,R18,R19,R30,R31">Appeler toute confusion une encéphalite ou toute faiblesse une myélite.</td></tr><tr><td data-src="R2,R3,R17,R18,R19,R30,R31">Traiter tôt HSV et une méningite bactérienne plausible.</td><td data-src="R2,R3,R17,R18,R19,R30,R31">Attendre 24 h, le scanner, la PCR ou une raideur de nuque.</td></tr><tr><td data-src="R2,R3,R17,R18,R19,R30,R31">Répéter un bilan trop précoce si la suspicion reste forte.</td><td data-src="R2,R3,R17,R18,R19,R30,R31">Exclure HSV sur une PCR ou une IRM initiale normale.</td></tr><tr><td data-src="R2,R3,R17,R18,R19,R30,R31">Interpréter preuve, population et produit exact.</td><td data-src="R2,R3,R17,R18,R19,R30,R31">Fusionner dose de rétinite, HSV cutané et encéphalite ; confondre mg/kg/j avec mg/kg/prise.</td></tr><tr><td data-src="R2,R3,R17,R18,R19,R30,R31">Attribuer le mécanisme avant immunosuppression.</td><td data-src="R2,R3,R17,R18,R19,R30,R31">Qualifier l’auto-immunité de moins urgente ou le lupus de cause automatique.</td></tr><tr><td data-src="R2,R3,R17,R18,R19,R30,R31">Planifier réadaptation et suivi cognitif/sphinctérien.</td><td data-src="R2,R3,R17,R18,R19,R30,R31">Réduire la guérison à la disparition de la fièvre.</td></tr></tbody></table>
<p data-src="R2,R10,R31,R32">Les erreurs médicamenteuses les plus dangereuses sont l’accumulation rénale d’aciclovir, la confusion entre TMP et SMX, les doses de foscarnet empruntées à une autre indication et l’association brivudine–fluoropyrimidines. L’onglet pharmacologie expose les conditions concrètes de prévention.</p>

</section>
<section class="ilot" id="g05-auto-evaluation"><h2>Auto-évaluation raisonnée</h2><div class="quiz ui"><p data-src="R2,R3"><b>Cas 1.</b> Un adulte confus et fébrile a une clairance de 40 mL/min. Une encéphalite HSV est suspectée.</p><button data-ok="1">Débuter l’aciclovir IV, avec adaptation de l’intervalle à 12 h selon FI.</button><button data-ok="0">Attendre la PCR avant tout antiviral.</button><p class="fb" hidden data-src="R2,R3">Une suspicion préoccupante se traite sans attendre  ; 25–50 mL/min correspond à un intervalle de 12 h, à réévaluer si fonction rénale change.</p></div><div class="quiz ui"><p data-src="R2"><b>Cas 2.</b> PCR HSV négative sur LCR prélevé au premier jour, mais tableau et IRM évocateurs.</p><button data-ok="0">Exclure définitivement HSV.</button><button data-ok="1">Poursuivre le traitement et répéter le bilan au délai approprié.</button><p class="fb" hidden data-src="R2">Une négativité précoce ne suffit pas ; la répétition de PL est recommandée si le premier prélèvement&lt;3 jours reste non diagnostique.</p></div><div class="quiz ui"><p data-src="R17,R18,R37"><b>Cas 3.</b> Paraparésie récente, niveau sensitif et rétention urinaire.</p><button data-ok="1">Rechercher d’urgence une compression par imagerie adaptée.</button><button data-ok="0">Attendre l’apparition d’une spasticité pour retenir une atteinte centrale.</button><p class="fb" hidden data-src="R17,R18,R37">Une atteinte médullaire aiguë peut être flasque et aréflexique ; la compression est une priorité.</p></div><div class="quiz ui"><p data-src="R10"><b>Cas 4.</b> Arrêt de prophylaxie secondaire après toxoplasmose cérébrale VIH.</p><button data-ok="0">Appliquer directement le seuil de la prophylaxie primaire.</button><button data-ok="1">Attendre CD4&gt;200/µL et charge indétectable&gt;6 mois selon HAS.</button><p class="fb" hidden data-src="R10">Les critères d’arrêt primaire et secondaire diffèrent ; les confondre expose à une prévention insuffisante.</p></div><div class="quiz ui"><p data-src="R31"><b>Cas 5.</b> Une dose de foscarnet est choisie dans la FI pour HSV mucocutané résistant.</p><button data-ok="1">Vérifier séparément le contexte neurologique et le statut hors indication.</button><button data-ok="0">Utiliser automatiquement cette dose pour toute encéphalite HSV.</button><p class="fb" hidden data-src="R31">Les indications, doses et preuves diffèrent ; la FI ne valide pas une encéphalite universelle.</p></div><div class="quiz ui"><p data-src="R7"><b>Cas 6.</b> Neurosyphilis traitée avec bonne réponse clinique et sérologique.</p><button data-ok="0">PL répétée obligatoire malgré toute bonne réponse.</button><button data-ok="1">Suivi clinique/sérologique ; pas de PL systématique selon DGN 2026.</button><p class="fb" hidden data-src="R7">Une réponse insuffisante rouvre le bilan ; les anticorps persistants seuls ne prouvent pas activité.</p></div><div class="quiz ui"><p data-src="R32"><b>Cas 7.</b> Brivudine récemment terminée ; traitement par fluoropyrimidine envisagé.</p><button data-ok="1">Vérifier un intervalle d’au moins quatre semaines après la fin et consulter l’équipe prescriptrice.</button><button data-ok="0">Compter quatre semaines depuis la première dose seulement.</button><p class="fb" hidden data-src="R32">L’interaction liée à la DPD peut être mortelle ; le délai se compte après la dernière dose.</p></div></section><section class="ilot" id="g05-14"><h2><span class="n">14</span>Références et limites de la monographie</h2>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="g05-e-1"><h2><span class="n">e-1</span>Organiser les examens sans retarder le traitement</h2>
<p data-src="R2,R26">Chaque examen répond à une question : le LCR recherche une inflammation et un agent ; l’IRM localise le parenchyme atteint et les complications ; l’EEG recherche notamment une activité épileptique. Aucun résultat isolé ne résume l’ensemble du diagnostic. Prélever les hémocultures avant l’antibiothérapie si cela ne retarde pas son administration, puis organiser rapidement la PL.</p>
<table class="t"><thead><tr><th>Question</th><th>Examen initial</th><th>Limite</th></tr></thead><tbody><tr><td data-src="R2,R17,R18,R26">Infection ou inflammation du SNC ?</td><td data-src="R2,R17,R18,R26">LCR : pression si pertinente et sûre, cellules/différentiel, protéines, glucose couplé sanguin, lactate ; microbiologie ciblée.</td><td data-src="R2,R17,R18,R26">Normalité précoce possible ; inflammation non spécifique.</td></tr><tr><td data-src="R2,R17,R18,R26">Où est la lésion et existe-t-il une complication ?</td><td data-src="R2,R17,R18,R26">IRM cérébrale, diffusion et séquences adaptées, contraste selon indication.</td><td data-src="R2,R17,R18,R26">Une IRM normale précoce ne suffit pas à exclure une encéphalite.</td></tr><tr><td data-src="R2,R17,R18,R26">Crise persistante ou état de mal non convulsif ?</td><td data-src="R2,R17,R18,R26">EEG selon présentation.</td><td data-src="R2,R17,R18,R26">Anomalie non spécifique ; EEG normal bref n’exclut pas toute crise intermittente.</td></tr><tr><td data-src="R2,R17,R18,R26">Compression ou atteinte inflammatoire médullaire ?</td><td data-src="R2,R17,R18,R26">IRM médullaire urgente avec territoire adapté à la clinique, bilan cérébral selon hypothèse.</td><td data-src="R2,R17,R18,R26">Un niveau sensitif ne fixe pas toujours la hauteur exacte de la lésion.</td></tr><tr><td data-src="R2,R17,R18,R26">Cause systémique ou terrain ?</td><td data-src="R2,R17,R18,R26">Hémogramme, ions, glucose, rein/foie ; hémocultures, sérologies et autres prélèvements orientés.</td><td data-src="R2,R17,R18,R26">Ni CRP/PCT ni lactate ne servent seuls à exclure une infection bactérienne.</td></tr></tbody></table>

</section>
<section class="ilot" id="g05-e-2"><h2><span class="n">e-2</span>Ponction lombaire : sécurité, prélèvement et valeurs usuelles</h2>
<p data-src="R2,R26">La PL est prioritaire si elle est sûre. Dans la recommandation EAN 2026, une imagerie préalable se discute devant Glasgow&lt;10, crise récente, déficit focal, œdème papillaire ou immunosuppression sévère. Les troubles de coagulation, anticoagulants, thrombopénie et infection locale demandent aussi une évaluation spécifique. L’impossibilité d’examiner le fond d’œil n’est pas, seule, une indication automatique de scanner. Si la PL ne peut être faite, traiter et réévaluer, notamment dans les 12–24 h selon le contexte.</p>
<div class="trap" data-src="R2,R26"><b>Seuils de sécurité : ne pas fabriquer un consensus.</b> L’EAN discute un seuil plaquettaire de 40 G/L ; la SSI suisse demande plus de 50 G/L dans son guide de méningite. Appliquer le protocole local et l’évaluation de l’hémostase, sans substituer un chiffre isolé à l’analyse du risque.</div>
<table class="t"><thead><tr><th>Paramètre lombaire adulte</th><th>Repère normal pédagogique</th><th>Interprétation</th></tr></thead><tbody><tr><td data-src="R38,R39,R2,R45">Leucocytes</td><td data-src="R38,R39,R2,R45">≤ 4/µL</td><td data-src="R38,R39,R2,R45">La définition de cas utilise ≥ 5/µL ; une valeur normale précoce n’exclut pas l’encéphalite.</td></tr><tr><td data-src="R38,R39,R2,R45">Protéines</td><td data-src="R38,R39,R2,R45">0,15–0,45 g/L</td><td data-src="R38,R39,R2,R45">Augmentation possible par inflammation ou perturbation de barrière ; dépend de l’âge et du laboratoire.</td></tr><tr><td data-src="R38,R39,R2,R45">Glucose</td><td data-src="R38,R39,R2,R45">Environ 60 % de la glycémie</td><td data-src="R38,R39,R2,R45">Mesurer la glycémie associée ; une baisse oriente mais n’identifie pas à elle seule l’agent.</td></tr><tr><td data-src="R38,R39,R2,R45">Lactate</td><td data-src="R38,R39,R2,R45">&lt;2,1 mmol/L</td><td data-src="R38,R39,R2,R45">Un résultat élevé est non spécifique ; aucun plafond absolu ne définit toute infection virale.</td></tr><tr><td data-src="R38,R39,R2,R45">Différentiel cellulaire</td><td data-src="R38,R39,R2,R45">À interpréter avec nombre total</td><td data-src="R38,R39,R2,R45">Prédominance lymphocytaire, neutrophile ou éosinophile oriente sans constituer une preuve unique.</td></tr></tbody></table>
<p data-src="R38">Ces repères viennent du tableau LCR adulte de Swiss Memory Clinics 2024, diffusé sur le site OFSP avec avertissement éditorial : il ne s’agit pas d’une recommandation OFSP sur l’encéphalite. Les intervalles du laboratoire, le site de prélèvement et l’âge priment ; ne pas transposer ces valeurs au nouveau-né. L’analyse cellulaire doit être rapide, idéalement dans les 1–2 h, pour limiter les erreurs préanalytiques.</p>
<p data-src="R2,R7,R18">Prévoir les analyses avant le geste avec le laboratoire : PCR HSV/VZV et autres agents selon terrain ; sérum couplé lorsque les index intrathécaux sont nécessaires ; conservation d’un aliquot si bilan élargi attendu. Les quotients albumine/Ig et les bandes oligoclonales renseignent sur barrière et immunité intrathécale, mais ne désignent pas automatiquement une cause.</p>

<p class="ui">Approfondir : <button class="w" data-k="g05-lcr">Valeurs du LCR</button> · <button class="w" data-k="g05-indice">Anticorps intrathécaux</button></p></section>
<section class="ilot" id="g05-e-3"><h2><span class="n">e-3</span>PCR, sérologies et calendrier</h2>
<p data-src="R2">Si une première PL réalisée avant le troisième jour n’établit pas le diagnostic, répéter le prélèvement 2–3 jours plus tard, en visant 48 h selon EAN. Poursuivre l’aciclovir en cas de suspicion forte. Le délai de la maladie, le traitement déjà reçu, le volume et la technique modifient l’interprétation d’un résultat négatif.</p>
<p data-src="R2">La recommandation conditionnelle EAN privilégie des PCR ciblées lorsque le diagnostic est suspecté et déconseille de les remplacer par le seul panel multiplex. Pour HSV-1, une synthèse de trois études totalisant 6883 échantillons rapporte une sensibilité d’environ 76 % du panel BioFire, avec <b>très faible certitude</b> : ce chiffre n’est ni la performance de toute PCR HSV ni une estimation universelle pour chaque laboratoire.</p>
<p data-src="R2">Une recherche d’IgG HSV intrathécales sur sérum/LCR couplés à partir de 7–10 jours peut aider si la PCR précoce n’a pas été disponible ou reste négative malgré une suspicion. Les anticorps peuvent persister des années : ils ne prouvent pas isolément une infection active. Pour certaines flaviviroses, la sérologie IgM et, selon contexte vaccinal, IgG est utile ; le choix du test dépend de l’agent et de la phase.</p>
<table class="t"><thead><tr><th>Contexte</th><th>Recherche ciblée</th><th>Interprétation</th></tr></thead><tbody><tr><td data-src="R1,R2,R7,R10,R18,R47">Immunodépression</td><td data-src="R1,R2,R7,R10,R18,R47">CMV, autres virus et agents opportunistes selon clinique/IRM ; statut VIH si indiqué.</td><td data-src="R1,R2,R7,R10,R18,R47">Éviter l’attribution automatique d’un résultat positif sans concordance.</td></tr><tr><td data-src="R1,R2,R7,R10,R18,R47">Neurosyphilis</td><td data-src="R1,R2,R7,R10,R18,R47">Sérologie tréponémique sanguine ; LCR avec cellules/protéines et tests couplés, VDRL/RPR et index selon protocole.</td><td data-src="R1,R2,R7,R10,R18,R47">VDRL négatif n’exclut pas ; PCR peu sensible ; index persistant n’est pas un marqueur isolé d’activité.</td></tr><tr><td data-src="R1,R2,R7,R10,R18,R47">Toxoplasmose VIH</td><td data-src="R1,R2,R7,R10,R18,R47">Imagerie, sérologie IgG, PCR LCR si PL sûre ; PCR sanguine si besoin.</td><td data-src="R1,R2,R7,R10,R18,R47">PCR LCR peu sensible mais très spécifique dans les données HAS ; négative n’exclut pas.</td></tr><tr><td data-src="R1,R2,R7,R10,R18,R47">Tuberculose</td><td data-src="R1,R2,R7,R10,R18,R47">Xpert/Ultra et culture du LCR, autres prélèvements selon foyer.</td><td data-src="R1,R2,R7,R10,R18,R47">Complémentarité ; aucune négativité unique ne suffit à exclure.</td></tr><tr><td data-src="R1,R2,R7,R10,R18,R47">Myélite auto-immune</td><td data-src="R1,R2,R7,R10,R18,R47">AQP4-IgG et MOG-IgG sériques par méthode cellulaire si syndrome compatible.</td><td data-src="R1,R2,R7,R10,R18,R47">Prélever idéalement avant immunothérapie ; confirmer faible titre ou discordance, sans retarder une urgence.</td></tr></tbody></table>

</section>
<section class="ilot" id="g05-e-4"><h2><span class="n">e-4</span>Imagerie : cerveau, moelle et limites</h2>
<p data-src="R2">L’IRM est préférée au scanner pour l’encéphalite, idéalement dans les 24 h et au plus tard 48 h selon les possibilités. Les anomalies temporales médiales ou frontobasales orientent vers HSV, mais ne lui sont pas exclusives. Diffusion, FLAIR et contraste selon indication recherchent inflammation, infarctus, œdème, abcès ou autre lésion. Répéter l’imagerie si le tableau persiste ou s’aggrave malgré un examen initial non contributif.</p>
<p data-src="R18,R19">Une atteinte temporale médiale bilatérale peut soutenir une encéphalite limbique dans le cadre des autres critères ; une lésion unilatérale a davantage de diagnostics différentiels. Pour une myélite, l’IRM doit écarter la compression, préciser longueur et localisation de la lésion, et rechercher les éléments associés. Une extension ≥ 3 segments vertébraux n’est pas synonyme de NMOSD ; infection, sarcoïdose et autres causes restent possibles.</p>
<p data-src="R10,R42">Chez une personne vivant avec le VIH, des lésions focales avec effet de masse font discuter toxoplasmose, lymphome et, selon exposition, Chagas. Une présentation atypique ou une absence d’amélioration sous traitement d’épreuve justifie une nouvelle stratégie diagnostique plutôt qu’un simple prolongement automatique. La PL peut être contre-indiquée par le risque d’engagement.</p>

</section>
<section class="ilot" id="g05-e-5"><h2><span class="n">e-5</span>EEG, biopsie et diagnostic séquentiel</h2>
<p data-src="R2">L’EEG est indiqué pour une suspicion de crise non convulsive, un trouble de conscience inexpliqué ou un doute entre présentation psychiatrique et atteinte cérébrale organique. Ralentissement et décharges périodiques peuvent soutenir une atteinte cérébrale ; ils ne sont pas pathognomoniques de HSV. Une prescription systématique chez tous les patients n’est pas recommandée par EAN 2026.</p>
<p data-src="R10,R18">La biopsie n’est pas un examen de routine d’une encéphalite typique. Pour toxoplasmose présumée sans réponse après 15 jours, la HAS propose de discuter une biopsie stéréotaxique après réimagerie, notamment pour lymphome. Une biopsie médullaire comporte des risques et ne doit pas précéder un bilan non invasif approprié d’une myélite suspectée.</p>
<div class="key" data-src="R2,R19"><b>La synthèse est dynamique.</b> Consigner ce qui est établi, probable, encore possible et exclu raisonnablement. Une nouvelle crise, une aggravation ou une discordance laboratoire–IRM conduit à rouvrir le raisonnement ; elle ne prouve pas d’emblée résistance ou auto-immunité.</div>
<button class="pareto-btn ui" data-k="pareto-g05-examens">▲ Loi de Pareto — Interpréter les examens dans le temps</button>
</section>
