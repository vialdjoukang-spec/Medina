<template data-pop="e11-codage" data-title="Codage CIM-10-GM du diabète de type 2"><p>La CIM-10-GM 2024 classe le diabète de type 2 sous E11 et précise la complication par le quatrième caractère : E11.0 avec coma, E11.1 avec acidocétose, E11.2 avec complications rénales, E11.3 avec complications oculaires, E11.4 avec complications neurologiques, E11.5 avec complications vasculaires périphériques, E11.6 avec d’autres complications précisées, E11.7 avec complications multiples, E11.8 avec complications non précisées et E11.9 sans complication.</p><p>Le cinquième caractère indique si le diabète est désigné comme décompensé (1) ou non (0). Avec E11.7, il distingue le pied diabétique (4 et 5) des autres complications multiples (2 et 3). Le coma et l’acidocétose se codent toujours comme décompensés : E11.01 et E11.11.</p><p>Le code E11 exclut notamment le diabète pendant la grossesse, l’accouchement ou le post-partum (O24.-), le diabète pancréoprive (E13.-), le diabète lié à la malnutrition (E12.-), la tolérance au glucose perturbée (R73.0) et la glycosurie rénale (E74.8).</p><p class="src">Référence : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e10-e14.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc E10–E14, consulté le 15.10.2026</a>.</p></template>
