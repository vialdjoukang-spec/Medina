La SSED n’admet plus, parmi les <button class="w" data-justification="1" data-k="e11-su">sulfonylurées (position suisse et contentieux)</button>, que le gliclazide, dans des cas choisis, parce que sa demi-vie courte et l’absence de métabolite actif limitent l’hypoglycémie ; elle lui préfère une insuline basale après échec de la trithérapie.
