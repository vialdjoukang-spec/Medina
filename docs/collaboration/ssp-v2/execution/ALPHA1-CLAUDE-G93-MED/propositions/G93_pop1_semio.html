<template data-pop="g93-sm-tvo" data-title="Obscurcissements visuels transitoires">
<div class="lab">Définition</div><p>Le patient décrit des voiles ou des pertes de vision brèves, souvent de quelques secondes. Ils figurent avec le flou visuel et la diplopie parmi les symptômes visuels de l’hypertension intracrânienne [S2].</p><div class="lab">Mécanisme</div><p>Ils résultent de la pression intracrânienne élevée ; la recommandation européenne n’en détaille pas le mécanisme [S2].</p><div class="lab">Valeur et piège</div><p>Leur fréquence n’est pas chiffrée dans les sources lues. Ils ne mesurent pas le risque visuel : chez certains patients, l’ischémie prolongée de la tête du nerf optique conduit à une perte visuelle irréversible, et seule l’évaluation de la fonction visuelle l’apprécie [S2].</p><p class="src">Références : [S2] Fédération européenne des céphalées, 2018, section « Ophthalmic features ».</p></template>
<template data-pop="g93-sm-vi" data-title="Paralysie du sixième nerf crânien">
<div class="lab">Normal</div><p>Les deux yeux se portent ensemble en dehors ; le regard latéral ne dédouble pas les images.</p><div class="lab">Technique</div><p>Le médecin fait suivre une cible dans le regard horizontal et recherche un défaut d’abduction ; le patient décrit une diplopie horizontale [S2].</p><div class="lab">Mécanisme</div><p>Le nerf serait comprimé contre le ligament pétreux ou la crête du rocher, ou étiré le long de son trajet intracrânien ; ce mécanisme n’a pas été entièrement étudié [S2].</p><div class="lab">Valeur</div><p>Sans œdème papillaire, une paralysie uni- ou bilatérale du sixième nerf suffit à une HII certaine si les autres critères sont réunis [S2]. Sa fréquence n’est pas chiffrée dans les sources lues.</p><p class="src">Références : [S2] sections « Other symptoms » et « IIHWOP ».</p></template>
<template data-pop="g93-sm-acouphene" data-title="Acouphène pulsatile">
<div class="lab">Définition</div><p>Bruit rythmé au rythme du pouls, uni- ou bilatéral, fréquemment observé dans l’HII [S2].</p><div class="lab">Mécanisme</div><p>Une turbulence du flux dans une sténose du sinus transverse est supposée ; la recommandation demande d’autres études pour le confirmer [S2].</p><div class="lab">Valeur</div><p>L’acouphène pulsatile figure parmi les critères de la céphalée attribuée à l’HII (classification internationale des céphalées) [S2].</p><p class="src">Références : [S2] section « Other symptoms » et tableau 1.</p></template>
<template data-pop="g93-sm-pseudo" data-title="Pseudo-œdème papillaire : causes et gestes">
<div class="lab">Problème</div><p>Une papille qui paraît gonflée sans hypertension intracrânienne entraîne des examens et des gestes inutiles ; l’erreur diagnostique atteint 40 % dans l’HII, surtout par un examen ophtalmologique incorrect [S2].</p><div class="lab">Gestes</div><p>L’ophtalmologue expérimenté mesure la pression intraoculaire, exclut une hypotonie et examine la papille de façon critique [S2].</p><div class="lab">Causes à reconnaître</div><p>Petite papille hypermétrope, papille oblique du myope, traction vitréenne et drusen de la papille [S2].</p><p class="src">Références : [S2] section « Ophthalmic features ».</p></template>
<template data-pop="g93-sm-perimetrie" data-title="Périmétrie : interpréter la fiabilité">
<div class="lab">Déficits typiques</div><p>Élargissement de la tache aveugle, rétrécissement périphérique, ressaut nasal inférieur ou déficit arciforme partiel [S2].</p><div class="lab">Fiabilité</div><p>La périmétrie est un test psychophysique : attention, motivation, fatigue et biais de réponse modifient les seuils. Dans l’essai IIHTT, un cinquième des participants a eu un échec de performance, revenu à la normale au contrôle ; une aggravation ou des indices de fiabilité médiocres imposent donc de répéter l’examen [S2]. Des pertes de fixation de plus de 20 % peuvent compromettre la fiabilité [S2].</p><p class="src">Références : [S2] section « Ophthalmic features » et tableau 3.</p></template>
<template data-pop="g93-sm-pupille" data-title="Réflexe photomoteur après arrêt cardiaque">
<div class="lab">Technique</div><p>La lumière d’une lampe provoque normalement une diminution transitoire de la taille de la pupille ; un pupillomètre portable quantifie cette réponse [S5].</p><div class="lab">Valeur</div><p>Absent des deux côtés, le réflexe standard est peu spécifique dans les premières heures ; sa précision augmente ensuite et atteint 0 % de faux positifs après 96 heures, pour une sensibilité de 20 à 25 % [S5].</p><div class="lab">Piège</div><p>Les sédatifs utilisés au début peuvent l’abolir ; la recommandation 2025 conseille le pupillomètre lorsqu’il est disponible [S5].</p><p class="src">Références : [S5] ERC et ESICM 2025, « Ocular reflexes ».</p></template>
<template data-pop="g93-sm-cornee" data-title="Réflexe cornéen : technique et valeur">
<div class="lab">Technique</div><p>Le médecin touche le bord externe de la cornée (limbe) avec une mèche de coton ; une projection d’air ou d’eau limite le risque d’abrasion. La réponse normale est un clignement [S5].</p><div class="lab">Valeur</div><p>Absent des deux côtés après 72 heures, il prédit un mauvais pronostic neurologique avec 0 % de faux positifs (intervalle de confiance à 95 % : 0 à 3,4 %) et une sensibilité de 25 à 40 % dans la plupart des études [S5].</p><div class="lab">Piège</div><p>Il dépend d’une contraction musculaire : les curares et les sédatifs l’abolissent, et les modalités de recherche varient d’une équipe à l’autre [S5].</p><p class="src">Références : [S5] « Ocular reflexes ».</p></template>
<template data-pop="g93-sm-moteur" data-title="Réponse motrice à la douleur">
<div class="lab">Échelle</div><p>La composante motrice du score de Glasgow va de l’absence de réponse (1) à l’obéissance aux ordres (6) ; un patient qui n’obéit pas (moins de 6) à 72 heures entre dans la stratégie pronostique de 2025 [S5].</p><div class="lab">Valeur</div><p>Une réponse absente ou en extension (1 ou 2) s’associe à un mauvais pronostic, mais sa spécificité est faible et atteint rarement 100 %, même après 96 heures [S5]. Un retrait ou une localisation (4 ou 5) dans les quatre premiers jours est au contraire un signe de récupération [S5].</p><div class="lab">Piège</div><p>Comme le réflexe cornéen, la réponse motrice dépend des muscles striés et des curares [S5].</p><p class="src">Références : [S5] « Motor response » et « Prediction of good neurological outcome ».</p></template>
<template data-pop="g93-sm-myoclonie" data-title="Myoclonies après arrêt cardiaque">
<div class="lab">Définition</div><p>Contractions musculaires brèves, involontaires, focales, multifocales ou généralisées ; elles sont de loin la forme de crise clinique la plus fréquente après un arrêt et apparaissent en général dans les deux premiers jours [S5].</p><div class="lab">Valeur</div><p>Des myoclonies dans les 96 heures s’associent le plus souvent à un mauvais pronostic, mais des faux positifs jusqu’à 22 % sont décrits [S5]. L’état de mal myoclonique se définit en 2025 comme des myoclonies continues et généralisées de plus de 30 minutes dans les 72 premières heures [S5].</p><div class="lab">Piège</div><p>Le syndrome de Lance-Adams désigne des myoclonies d’action chez un patient qui a repris conscience ; avec un fond électroencéphalographique bénin, un essai de réveil est tenté quelques jours après l’arrêt [S5].</p><p class="src">Références : [S5] « Myoclonus and status myoclonus », « Control of seizures ».</p></template>
<template data-pop="g93-sm-engagement" data-title="Signes d’engagement et de mort cérébrale imminente">
<div class="lab">Signes</div><p>Pupilles fixes et dilatées, diabète insipide, et modifications cardiovasculaires évoquant un engagement, comme une bradycardie associée à une hypertension ou une instabilité hémodynamique inexpliquée [S5].</p><div class="lab">Fréquence</div><p>La mort cérébrale survient dans 5 à 10 % des décès après réanimation conventionnelle et dans environ 25 % après réanimation extracorporelle, surtout dans les trois à quatre premiers jours [S5].</p><div class="lab">Limite</div><p>Les syndromes d’engagement temporal, sous-falcoriel et amygdalien ne sont pas décrits dans les sources lues ; ils restent à sourcer avant d’être enseignés.</p><p class="src">Références : [S5] « Suggested prognostication strategy ».</p></template>
<template data-pop="g93-sm-mpe" data-title="Malaise post-effort">
<div class="lab">Définition</div><p>Aggravation des symptômes après un effort physique ou mental, souvent remarquée des heures plus tard ou le lendemain, et qui dure d’un jour dans les formes légères à des jours ou des semaines dans les formes modérées à sévères [S6].</p><div class="lab">Technique</div><p>L’interrogatoire relie chaque aggravation à l’effort qui l’a précédée et à son délai ; il distingue ce malaise d’une simple fatigue proportionnée à l’effort [S6].</p><div class="lab">Valeur</div><p>Il est exigé pour le diagnostic clinique ; son absence fait chercher une autre cause [S6]. Son mécanisme n’est pas établi dans les sources lues.</p><p class="src">Références : [S6] EUROMENE 2021, « Clinical presentation ».</p></template>
<template data-pop="g93-sm-orthostat" data-title="Intolérance orthostatique et tachycardie posturale">
<div class="lab">Symptômes</div><p>Vertige, palpitations, tremblements, faiblesse ou nausée en position debout immobile, améliorés en position couchée ; ils apparaissent après quelques minutes, parfois jusqu’à 10 minutes ou plus selon la dysautonomie [S6].</p><div class="lab">Technique</div><p>Le médecin mesure la fréquence cardiaque et la pression couché, puis debout de façon répétée, ou demande une table d’inclinaison [S6].</p><div class="lab">Calcul</div><p>Tachycardie posturale : augmentation de plus de 30 par minute par rapport à la valeur couchée après 20 ans, de plus de 40 par minute chez les plus jeunes, ou fréquence debout de plus de 120 par minute à tout âge [S6]. Exemple : 70 par minute couché et 115 debout chez un patient de 19 ans, soit 115 − 70 = 45 par minute, au-delà de 40.</p><div class="lab">Mécanisme et piège</div><p>Dysautonomie ou hypovolémie relative ; certains patients présentent plutôt une hypotension debout [S6].</p><p class="src">Références : [S6] « Physical examination » et « Orthostatic intolerance ».</p></template>
<template data-pop="g93-unites" data-title="Deux unités de pression : centimètres d’eau et millimètres de mercure">
<div class="lab">Bases</div><p>La pression d’ouverture lombaire se mesure avec une colonne de liquide et s’exprime en centimètres d’eau ; la pression intracrânienne monitorée s’exprime en millimètres de mercure. Un centimètre d’eau vaut 98,0665 pascals et un millimètre de mercure 133,322 pascals (définitions des unités).</p><div class="lab">Formule</div><p>Pression en mmHg = pression en cm d’eau × 0,7356 ; pression en cm d’eau = pression en mmHg × 1,3595.</p><div class="lab">Exemples</div><p>25 cm d’eau (seuil adulte de l’HII [S2]) = 25 × 0,7356 = 18,4 mmHg. 30 cm d’eau (haut de la zone grise [S2]) = 22,1 mmHg. Le seuil de traitement du traumatisme, 20 à 22 mmHg [S7], correspond à 27,2 à 29,9 cm d’eau. La baisse de 11,9 cm d’eau après chirurgie bariatrique [S3] équivaut à 8,8 mmHg.</p><div class="lab">Limite</div><p>La conversion rend les chiffres comparables, pas les situations : la pression d’ouverture lombaire de l’HII et la pression intracrânienne du traumatisme ne se mesurent ni au même endroit ni chez les mêmes patients, et leurs seuils ne se transposent pas.</p><p class="src">Références : [S2] ; [S3] ; [S7] ; définitions conventionnelles du pascal, du centimètre d’eau et du millimètre de mercure.</p></template>
