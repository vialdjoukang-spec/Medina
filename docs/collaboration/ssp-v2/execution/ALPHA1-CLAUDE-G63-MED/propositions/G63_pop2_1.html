<template data-pop="g63-sm-brulure" data-title="Brûlure distale nocturne : mécanisme, valeur et piège">
<div class="lab">Définition</div><p>La brûlure est une douleur spontanée, distale, souvent nocturne, des deux pieds. Elle est le premier symptôme de l’atteinte des petites fibres dans la neuropathie diabétique [S2].</p>
<div class="lab">Mécanisme</div><p>Les petites fibres sont touchées avant les grosses dans le diabète. Leur atteinte produit la brûlure et la perte de la piqûre et du froid [S2].</p>
<div class="lab">Valeur</div><p>La douleur touche 30 à 50 % des neuropathies diabétiques [S2] et 42 % des neuropathies alcooliques [S6]. Les sources lues ne chiffrent pas la sensibilité ni la spécificité de la brûlure.</p>
<div class="lab">Piège</div><p>La neurographie reste normale si seules les petites fibres sont atteintes [S2]. Un examen des grosses fibres normal n’écarte donc pas la neuropathie.</p></template>
<template data-pop="g63-sm-ataxie" data-title="Ataxie sensitive : mécanisme et orientation">
<div class="lab">Définition</div><p>L’ataxie sensitive est une instabilité liée à la perte de l’information de position. Elle s’aggrave lorsque la vue ne compense plus.</p>
<div class="lab">Mécanisme</div><p>Elle traduit l’atteinte des grosses fibres. Dans la carence en vitamine B12, les cordons postérieurs de la moelle s’y ajoutent [S1].</p>
<div class="lab">Orientation</div><p>Une ataxie avec réflexes vifs et signes pyramidaux désigne une myéloneuropathie combinée, évocatrice d’une carence en vitamine B12 [S1].</p>
<div class="lab">Limite</div><p>Les sources lues ne chiffrent pas la fréquence de l’ataxie dans les polyneuropathies secondaires.</p></template>
<template data-pop="g63-sm-achille" data-title="Aréflexie achilléenne : valeur et limite">
<div class="lab">Valeur</div><p>L’aréflexie distale associée à une baisse de la pallesthésie ou de la piqûre est un signe sensible et spécifique de polyneuropathie [S1]. La revue ne donne pas de chiffre.</p>
<div class="lab">Limite</div><p>Le réflexe isolé est moins discriminant. Dans une cohorte de 2022 diabétiques à Vienne, il manquait chez 68,6 % des patients dont la vibration était anormale, mais aussi chez 24,8 % de ceux dont la vibration était normale [S14].</p>
<div class="lab">Conséquence</div><p>Une aréflexie isolée ne suffit pas à poser le diagnostic. Le médecin cherche la baisse de la pallesthésie ou de la piqûre.</p>
<div class="lab">Lacune</div><p>La technique du geste n’est pas décrite dans les sources lues ; elle doit être sourcée avant intégration.</p></template>
<template data-pop="g63-sm-pouls" data-title="Pouls du pied et index de pression systolique : valeur et limite">
<div class="lab">Technique</div><p>Le médecin palpe les pouls tibial postérieur et pédieux. S’ils manquent, il palpe les pouls poplité et fémoral [S3]. L’index de pression systolique se mesure au Doppler, couché, après 10 minutes de repos [S4].</p>
<div class="lab">Valeur</div><p>Une artériopathie cliniquement importante peut le plus souvent être écartée lorsque les deux pouls du pied sont perçus des deux côtés [S4]. Un index inférieur à 0,9 est hautement suspect d’artériopathie [S4].</p>
<div class="lab">Piège</div><p>Le pouls pédieux manque chez jusqu’à 8 % des sujets sains et le tibial postérieur chez jusqu’à 3 % [S4]. Des artères calcifiées faussent l’index vers le haut ; un index supérieur à 1,3 se rencontre chez 30 % des patients atteints d’ulcère [S4].</p></template>
<template data-pop="g63-sm-pyramidal" data-title="Réflexes vifs et signes pyramidaux : la myéloneuropathie de la carence en vitamine B12">
<div class="lab">Mécanisme</div><p>La carence en vitamine B12 atteint à la fois les grosses fibres et les cordons postérieurs de la moelle. Les réflexes deviennent vifs et des signes pyramidaux apparaissent [S1].</p>
<div class="lab">Valeur</div><p>Près de la moitié des patients ayant des symptômes neurologiques n’ont pas d’anémie macrocytaire [S1]. Un hémogramme normal ne rassure donc pas.</p>
<div class="lab">Conduite</div><p>La substitution est rapide. Des troubles de la marche installés depuis plus de 2 ans ne sont pas toujours réversibles [S21]. Le protoxyde d’azote peut produire une carence fonctionnelle malgré des réserves normales [S21].</p></template>
