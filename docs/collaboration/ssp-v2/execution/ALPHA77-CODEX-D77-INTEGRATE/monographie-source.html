ta-d77-credit>Gleiberg, photographie personnelle de rate humaine, 1989, H&E, objectif 56× · <a href="https://commons.wikimedia.org/wiki/File:Milz_(Mensch).jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/2.0/de/" target="_blank" rel="noopener">CC BY-SA 2.0 Allemagne</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Dans la schistosomiase hépatosplénique, les œufs retenus et la réponse tissulaire contribuent à la fibrose périportale. Le niveau tissulaire explique le mécanisme, mais la preuve parasitaire et l’évaluation circulatoire restent des questions complémentaires. Le mot fibrose ne suffit pas à dire si l’infection est encore active ou si toutes les lésions sont réversibles.</p><p><b>Science → clinique.</b> Le retentissement d’un changement tissulaire dépend de sa localisation et de la circulation ; une personne peut avoir des varices sans effondrement initial de la fonction hépatique.</p><p><b>Science → examen.</b> Le prélèvement tissulaire doit répondre à une question qui modifie le diagnostic ou les soins. Une splénomégalie ne constitue pas seule une indication de biopsie splénique.</p><p><b>Science → traitement.</b> Le traitement antiparasitaire vise l’infection ; la réponse de la fibrose et des complications peut être différée ou incomplète. Une cicatrice et une activité parasitaire ne sont pas une seule cible.</p><div class="key"><b>À retenir.</b> Décrire structure, site et limites du prélèvement avant de conclure sur la maladie.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">NORMAL-SPLEEN — OpenStax 21.1 : moelle, rate et organes lymphoïdes normaux</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-TX — Revue HSS 2021 : traitements, bêtabloquants, chirurgie et TIPS</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a>.</p></section>
</div><div class="sci" id="d77-s-physio" role="tabpanel" aria-labelledby="d77-tab-physio" hidden><section class="ilot" id="d77-s-physio-content" ><h2>Physiologie : flux, résistance et fonction préservée</h2><p>Le sang du système porte traverse le foie avant de retourner à la circulation générale. La circulation dépend du débit et des résistances rencontrées. Une modification de résistance en amont des sinusoïdes peut augmenter la pression portale tout en laissant initialement une grande partie de la fonction hépatocellulaire préservée. Cette dissociation est centrale dans la HSS.</p><p>La rate participe à la filtration sanguine et à la réponse immunitaire. Son volume, le flux qui la traverse et les concentrations cellulaires mesurées dans le sang peuvent se modifier ensemble, sans être des mesures équivalentes. La revue HSS discute notamment congestion et augmentation du flux splénique ; elle ne permet pas de réduire toutes les cytopénies à une destruction des cellules.</p><figure data-d77-figure="portal"><div data-d77-frame="tall"><img src="assets/img/d77/alpha/codex/Gray591-Portal_vein.png" alt="Planche humaine du système porte, veine splénique et affluents digestifs" loading="lazy"><span data-d77-mark="1" aria-hidden="true">1</span><span data-d77-mark="2" aria-hidden="true">2</span><span data-d77-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Tronc porte montant vers le foie.</li><li>Trajet de la veine splénique depuis la rate.</li><li>Affluents mésentériques : drainage digestif vers le système porte.</li></ol><p>Schéma normal, sans mesure de pression, de débit ou de fibrose. La couleur sert à repérer les veines, sans représenter une obstruction réelle.</p><p data-d77-credit>Jmarchn, adaptation humaine de Gray 591, 19 juin 2023 · <a href="https://commons.wikimedia.org/wiki/File:Gray591-Portal_vein.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Des voies collatérales peuvent se développer et exposer à une hémorragie digestive. Le foie peut continuer des fonctions de synthèse et de métabolisme malgré ce risque. Une mesure d’enzymes ne résume donc pas tout le fonctionnement du réseau. Une maladie hépatique associée peut toutefois modifier ce profil et doit être recherchée si les données sont discordantes.</p><p><b>Science → clinique.</b> Absence d’ascite ou enzymes peu perturbées ne neutralisent pas une hématémèse. Le retentissement hémodynamique doit être évalué immédiatement.</p><p><b>Science → examen.</b> Le Doppler, la numération et l’endoscopie décrivent des dimensions différentes. Les tendances sont interprétées avec le traitement et les symptômes ; le pouls sous bêtabloquant peut masquer une réponse attendue à l’hémorragie.</p><p><b>Science → traitement.</b> Le propranolol se titre avec fréquence, pression et tolérance selon sa FI. La diminution d’un chiffre n’est pas une preuve de disparition de l’infection ni de toute complication portale.</p><div class="key"><b>À retenir.</b> Évaluer simultanément circulation, fonction et tolérance ; aucun chiffre ne remplace les autres.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways" target="_blank" rel="noopener">NORMAL-PORTAL — OpenStax 20.5 : système porte hépatique normal</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">NORMAL-SPLEEN — OpenStax 21.1 : moelle, rate et organes lymphoïdes normaux</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680470250018" target="_blank" rel="noopener">FI-PROPRANOLOL — FI suisse de janvier 2023 : indication portale, doses et sécurité</a>.</p></section>
</div><div class="sci" id="d77-s-bio" role="tabpanel" aria-labelledby="d77-tab-bio" hidden><section class="ilot" id="d77-s-bio-content" ><h2>Biochimie : constituants sanguins, concentrations et unités</h2><p>Le sang associe plasma et éléments figurés. Les hématies participent au transport de l’oxygène par l’hémoglobine ; les leucocytes contribuent aux défenses ; les plaquettes sont des fragments cellulaires impliqués dans l’hémostase. Ces catégories ne sont pas des synonymes, et une numération de plaquettes en G/L ne peut pas être comparée directement à une hémoglobine en g/L.</p><p>La moelle rouge est un site de production des cellules sanguines. La coupe macroscopique de tête fémorale ci-dessous distingue des zones rouges et jaunes ; elle ne montre pas un frottis, une maturation cellulaire détaillée ou une mesure du débit de production. La concentration d’une lignée dans le sang ne révèle pas à elle seule combien la moelle en produit.</p><figure data-d77-figure="marrow"><div data-d77-frame="wide"><img src="assets/img/d77/alpha/codex/normal-marrow-openstax2016.jpg" alt="Coupe macroscopique de tête fémorale humaine montrant moelle rouge et zone jaune" loading="lazy"><span data-d77-mark="1" aria-hidden="true">1</span><span data-d77-mark="2" aria-hidden="true">2</span><span data-d77-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Zone de moelle rouge dans l’os spongieux.</li><li>Barre d’échelle originale de 1 cm ; elle ne mesure pas la production médullaire.</li><li>Bord osseux clair, distinct de la moelle.</li></ol><p>Photographie macroscopique normale avec barre d’échelle originale de 1 cm, pas un frottis ni une mesure d’activité de production. Aucune cellule ni anomalie médullaire n’est inventée.</p><p data-d77-credit>OpenStax, Anatomy and Physiology, version 8.25, 18 mai 2016, figure 22.05 · <a href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Le foie participe à la synthèse de protéines, dont des facteurs de coagulation, et à des fonctions métaboliques. Les enzymes, la synthèse et la circulation portale ne sont pas la même variable. Dans la HSS, la fonction peut rester relativement préservée alors que les complications circulatoires existent. Une anémie peut être liée à des pertes digestives ou à une carence, sans exclure d’autres mécanismes associés.</p><p><b>Science → clinique.</b> Fatigue ou pâleur ne suffisent pas à déterminer une cause d’anémie. Une thrombocytopénie doit être mise en relation avec le saignement, les autres lignées et le contexte, sans seuil de geste inventé.</p><p><b>Science → examen.</b> Écrire analyte, unité, référence du laboratoire et date. Les repères adultes HUG 2019 sont un exemple daté ; le profil pédiatrique ou gravidique demande ses propres références.</p><p><b>Science → traitement.</b> Corriger une cause documentée et surveiller la trajectoire. Ni un taux isolé ni une photographie normale ne justifient automatiquement transfusion, traitement médullaire ou splénectomie.</p><div class="key"><b>À retenir.</b> Nommer ce qui est mesuré avant de donner un sens au résultat.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-1-an-overview-of-blood" target="_blank" rel="noopener">NORMAL-BLOOD — OpenStax 18.1 : constituants et fonctions du sang normal</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">NORMAL-SPLEEN — OpenStax 21.1 : moelle, rate et organes lymphoïdes normaux</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways" target="_blank" rel="noopener">NORMAL-PORTAL — OpenStax 20.5 : système porte hépatique normal</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">CH-HUG-LAB — Diapositive 3, repères adultes de numération, 2019</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a>.</p></section>
</div><div class="sci" id="d77-s-immuno" role="tabpanel" aria-labelledby="d77-tab-immuno" hidden><section class="ilot" id="d77-s-immuno-content" ><h2>Immunologie et physiopathologie : défense, inflammation et prévention</h2><p>La rate est un organe lymphoïde secondaire exposé aux antigènes circulant dans le sang. Sa pulpe blanche organise des réponses impliquant lymphocytes B et T ; la pulpe rouge et les cellules phagocytaires participent au traitement de particules et d’éléments sanguins. La défense et la filtration sont liées, sans être une même mesure de fonction.</p><p>La réaction aux œufs de schistosomes dans les tissus peut entraîner inflammation granulomateuse et fibrose. Cette réponse contribue à la maladie chronique ; elle ne signifie pas que toute cytopénie soit une destruction auto-immune. L’identification d’un œuf et la description d’une sérologie répondent à des questions différentes de l’observation de tissu ou du retentissement portal.</p><figure data-d77-figure="histo"><div data-d77-frame="tall"><img src="assets/img/d77/alpha/codex/Milz_Mensch.jpg" alt="Histologie H&amp;E de rate humaine normale, pulpe blanche et rouge, numéros originaux conservés" loading="lazy"><span data-d77-mark="1" aria-hidden="true">1</span><span data-d77-mark="2" aria-hidden="true">2</span><span data-d77-mark="3" aria-hidden="true">3</span><span data-d77-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Follicule lymphoïde secondaire de pulpe blanche, numéro 1 de l’original.</li><li>Artériole centrale, numéro 2 de l’original.</li><li>Gaine lymphoïde périartériolaire (PALS), numéro 3 de l’original.</li><li>Pulpe rouge, numéro 4 de l’original.</li></ol><p>Les quatre flèches bleues originales sont conservées ; les repères HTML et la légende française les accompagnent. Tissu humain normal, sans granulome ou fibrose de schistosomiase démontrés. La coloration ne permet pas d’identifier ici chaque cellule immunitaire.</p><p data-d77-credit>Gleiberg, photographie personnelle de rate humaine, 1989, H&E, objectif 56× · <a href="https://commons.wikimedia.org/wiki/File:Milz_(Mensch).jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/2.0/de/" target="_blank" rel="noopener">CC BY-SA 2.0 Allemagne</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La perte anatomique ou une déficience fonctionnelle documentée de la rate augmente le risque d’infections graves, notamment à bactéries encapsulées. Ce risque n’est pas automatiquement celui de toute grande rate. Le protocole CHUV distingue prévention, information, vaccinations, antibiothérapie de réserve et situations sélectionnées de prophylaxie ; il ne transforme pas toutes les splénomégalies en asplénie.</p><p><b>Science → clinique.</b> Après splénectomie, fièvre ou état grippal doit faire envisager une infection urgente. La prévention doit être expliquée et répétée, car le risque persiste dans le temps.</p><p><b>Science → examen.</b> L’évaluation d’une fièvre suit l’urgence clinique ; elle ne doit pas attendre une démonstration de défaut immunitaire ou un rendez-vous lointain. La photographie normale ne mesure pas la protection contre les infections.</p><p><b>Science → traitement.</b> Anticiper le plan vaccinal et le plan antibiotique individuel lorsqu’une splénectomie est envisagée. Le produit, les recommandations suisses actuelles et la personne déterminent les modalités ; aucune voie ou dose non vérifiée n’est imposée ici.</p><div class="key"><b>À retenir.</b> Prévenir les conséquences de l’asplénie lorsqu’elle existe, sans confondre volume et fonction.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">NORMAL-SPLEEN — OpenStax 21.1 : moelle, rate et organes lymphoïdes normaux</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-ASPLEN — Pages 1–2, information et prévention après splénectomie, 2024</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-FEVER — Page 3, conduite devant fièvre et plan antibiotique, 2024</a>.</p></section>
</div></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="d77-p-status" ><h2>Statut suisse et disponibilité : vérifier le produit réel</h2><p>La recherche de praziquantel/Biltricide dans AmiKo et dans les 11 114 lignes de la liste officielle Swissmedic des médicaments humains au 30 septembre 2026 n’a pas fourni d’entrée correspondante. Cette constatation datée ne prouve ni une absence future d’autorisation ni l’impossibilité d’un approvisionnement individuel. Aucune FI suisse de praziquantel n’est inventée.</p><p>L’article 49 OAMéd présenté par Swissmedic prévoit, sous conditions, l’importation de petites quantités pour un patient ou une urgence par des professionnels habilités, notamment avec vérification du médicament autorisé dans un pays au contrôle équivalent et de l’absence d’alternative appropriée autorisée/disponible. Les exigences de responsabilité, de qualité et de traçabilité restent applicables. Ce cours n’accorde aucune autorisation d’importation et ne conseille pas un achat autonome sur Internet.</p><p>L’EMA a signalé le 3 juin 2026 l’arrêt de disponibilité de Biltricide 600 mg dans les marchés concernés ; l’ANSM signalait une rupture française le 6 mai 2026 et un approvisionnement exceptionnel. Ces informations ne décrivent pas une autorisation suisse. Pharmacie et spécialiste doivent vérifier le produit réellement accessible, son origine et son information de référence avant prescription.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissmedic.ch/swissmedic/fr/home/services/listen_neu.html" target="_blank" rel="noopener">CH-PRAZI-STATUS — Liste Swissmedic du 30 septembre 2026 et recherches AmiKo</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/swissmedic/fr/home/humanarzneimittel/bewilligungen_zertifikate/autorisation-speciale.html" target="_blank" rel="noopener">CH-IMPORT — Section 2.1, importation humaine selon article 49 OAMéd</a> ; <a data-reference-source="1" href="https://www.ema.europa.eu/en/medicines/human/shortages/biltricide" target="_blank" rel="noopener">EU-EMA-AVAIL — Disponibilité de Biltricide dans les marchés concernés, 3 juin 2026</a> ; <a data-reference-source="1" href="https://ansm.sante.fr/disponibilites-des-produits-de-sante/medicaments/biltricide-600-mg-comprime-pellicule-quadrisecable-praziquantel" target="_blank" rel="noopener">EU-ANSM-AVAIL — Rupture française et approvisionnement exceptionnel, 6 mai 2026</a>.</p></section>
<section class="ilot" id="d77-p-prazi" ><h2>Praziquantel : RCP français clairement attribué</h2><p>Le RCP français ANSM de <b>Biltricide 600 mg, comprimé quadrisécable, du 30 mai 2024</b> est utilisé faute de FI suisse retrouvée. Il s’agit d’une référence étrangère, sans preuve de disponibilité ou d’autorisation en Suisse. Les schémas ci-dessous sont ceux de ce produit ; ils ne constituent pas une prescription individuelle ni un schéma universel pour toutes les complications.</p><table class="t"><thead><tr><th>Espèce dans le RCP</th><th>Dose orale sur 24 heures</th><th>Modalité</th></tr></thead><tbody><tr><td>S. haematobium</td><td>40 mg/kg</td><td>Une prise</td></tr><tr><td>S. mansoni / S. intercalatum</td><td>40 mg/kg en une prise OU 20 mg/kg par prise, deux prises</td><td>Si plusieurs prises le même jour : intervalle de 4 à 6 heures</td></tr><tr><td>S. japonicum</td><td>60 mg/kg en une prise OU 30 mg/kg par prise, deux prises</td><td>Si plusieurs prises le même jour : intervalle de 4 à 6 heures</td></tr></tbody></table><p>Prendre avec ou après un repas, sans mâcher. Chez le jeune enfant, le RCP décrit la possibilité de broyer/disperser avec aliment ou liquide pour limiter le risque d’étouffement ; la sécurité avant un an n’est pas établie. La dose calculée, la formulation accessible et l’arrondi doivent être vérifiés par le prescripteur et le pharmacien. Le traitement de formes aiguës ou neurologiques demande une expertise spécifique.</p><p>Contre-indications importantes : hypersensibilité, cysticercose oculaire et association à la rifampicine. Les inducteurs enzymatiques et la dexaméthasone peuvent diminuer l’exposition ; l’éfavirenz n’est pas recommandé. Certains inhibiteurs, dont kétoconazole ou cimétidine, l’augmentent. Vérifier l’ensemble des médicaments. L’atteinte hépatique sévère et la HSS peuvent augmenter et prolonger les concentrations ; une prudence particulière est nécessaire. Un retard d’élimination en insuffisance rénale ne permet pas d’inventer une réduction numérique universelle.</p><p>Effets indésirables et aggravation inflammatoire possible doivent être anticipés avec le spécialiste, notamment en forme aiguë ou atteinte neurologique. Ne pas appliquer automatiquement un second traitement à 28 jours parce qu’un cas RMS l’a reçu ; la persistance d’infection, la réexposition et le contrôle orientent la décision.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-TX — Consensus espagnol 2022 : traitement, tableau 3 et populations</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-FOLLOW — Consensus espagnol 2022 : suivi et retraitement</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2018/revue-medicale-suisse-605/diagnostic-de-schistosomiase-urinaire-par-l-identification-de-miracidiums-de-schistosoma-haematobium" target="_blank" rel="noopener">CH-RMS-DX — Résumé, diagnostic et limites du cas urinaire, 2018</a>.</p></section>
<section class="ilot" id="d77-p-propranolol" ><h2>Propranolol Zentiva : indication suisse et titration</h2><p><b>FI suisse consultée : janvier 2023</b>, présentation correspondant au GTIN 7680470250018. Elle mentionne la prévention des hémorragies digestives hautes chez les patients avec hypertension portale et varices œsophagiennes, à l’exception de la cirrhose décompensée. Cette indication ne décide pas seule de l’ensemble du traitement d’une HSS.</p><p><b>Adulte, selon cette indication :</b> début à 20 mg deux fois par jour ; titration avec objectif de baisse de la fréquence au repos de 25 %, pouvant atteindre 80 mg deux fois par jour et, si nécessaire, un maximum de 160 mg deux fois par jour. Ce plafond n’est pas une cible routinière. Ne pas augmenter si la fréquence est déjà de 50–55/min ; pression, symptômes et tolérance peuvent imposer une adaptation plus tôt. Les comprimés de 40 et 80 mg ont une rainure décorative et ne sont pas destinés à être divisés : vérifier la présentation permettant réellement la dose prescrite.</p><p>Contre-indications et situations à vérifier : asthme ou antécédent de bronchospasme, bradycardie, hypotension, choc, insuffisance cardiaque décompensée, certains blocs auriculoventriculaires et autres contre-indications de la FI. Prudence en atteinte rénale ou hépatique, avec dose initiale adaptée à la situation et surveillance. Le produit peut masquer la tachycardie d’une hémorragie et expose à des effets hémodynamiques ou métaboliques.</p><p>Interactions : vérapamil/diltiazem, antiarythmiques, digoxine et autres traitements ralentisseurs ; vérifier aussi clonidine, rifampicine et l’ensemble de l’ordonnance. La grossesse ne se discute qu’en nécessité absolue selon la FI ; ne pas allaiter sous ce produit selon cette référence. Les doses pédiatriques mentionnées pour d’autres indications ne sont pas une posologie d’hypertension portale. Chez le patient coronarien, éviter un arrêt brutal et suivre une réduction progressive prescrite.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680470250018" target="_blank" rel="noopener">FI-PROPRANOLOL — FI suisse de janvier 2023 : indication portale, doses et sécurité</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-TX — Revue HSS 2021 : traitements, bêtabloquants, chirurgie et TIPS</a>.</p></section>
<section class="ilot" id="d77-p-carvedilol" ><h2>Carvedilol Spirig HC : frontière de l’indication</h2><p><b>FI suisse consultée : octobre 2023</b>, GTIN 7680576230013. Ses indications sont l’hypertension essentielle, l’angor et certaines insuffisances cardiaques stables ; elle ne mentionne pas l’hypertension portale. Les schémas cardiovasculaires de cette FI ne sont pas recopiés comme posologie D77. Un usage pour HSS serait une décision spécialisée hors de cette indication, à justifier et surveiller.</p><p>La revue HSS 2021 ne comportait pas d’étude de carvédilol dans son corpus ; cette limite historique ne démontre pas l’absence de toute étude ultérieure en 2026. Une préférence recommandée dans un autre mécanisme, comme la cirrhose, ne suffit pas à établir la meilleure stratégie HSS.</p><p>La FI impose notamment de vérifier insuffisance hépatique cliniquement manifeste, asthme/BPCO, bradycardie, blocs, hypotension sévère et insuffisance cardiaque décompensée. Le produit n’est pas recommandé avant 18 ans. Grossesse seulement en nécessité absolue ; allaitement contre-indiqué. Interactions et surveillance concernent notamment digoxine, ciclosporine, tacrolimus, rifampicine et amiodarone. La comparaison avec le propranolol est donc une discussion d’indication, de preuve et de sécurité, pas un échange automatique de doses.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576230013" target="_blank" rel="noopener">FI-CARVEDILOL — FI suisse d’octobre 2023 : indications, populations et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-TX — Revue HSS 2021 : traitements, bêtabloquants, chirurgie et TIPS</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a>.</p></section>
<section class="ilot" id="d77-p-populations" ><h2>Enfant, grossesse, allaitement, organes et prévention</h2><p><b>Âge.</b> La sécurité du Biltricide français n’est pas établie avant un an ; les formulations et la déglutition comptent. L’OMS 2022 recommande l’accès au traitement des personnes infectées, y compris les très jeunes enfants avec appréciation clinique et formulation adaptée. Cette politique ne remplace pas le RCP du produit disponible ni l’avis pédiatrique.</p><p><b>Grossesse et allaitement.</b> L’OMS 2022 recommande le traitement des femmes enceintes hors premier trimestre et des femmes allaitantes. Le RCP français autorise l’emploi en grossesse si cliniquement justifié et demande l’interruption de l’allaitement les jours de traitement puis 24 heures après. Ces formulations sont attribuées, sans moyenne inventée : choisir la conduite avec le spécialiste pour le produit réel et la situation. Les FI suisses de propranolol et de carvédilol ont leurs propres restrictions, distinctes du praziquantel.</p><p><b>Foie et rein.</b> La HSS et l’atteinte hépatique sévère peuvent modifier l’exposition au praziquantel ; le traitement bêtabloquant demande aussi surveillance hémodynamique et vérification des contre-indications. Une fonction hépatique souvent préservée dans HSS ne permet pas de supposer qu’elle l’est chez chaque personne.</p><p><b>Après splénectomie.</b> Plan vaccinal et antibiotique individuel selon recommandations suisses actuelles et produits précis. Le protocole CHUV 2024 est une source institutionnelle datée, sans remplacement des FI des vaccins ou antibiotiques. Aucune dose antibiotique, marque vaccinale ou voie sous-cutanée pour thrombocytopénie n’est imposée sans lecture de l’information du produit concerné.</p><p><b>Cadre suisse.</b> Les conditions d’autorisation, d’importation, de remboursement ou de prise en charge se vérifient pour le dossier réel ; ce cours ne promet aucun droit automatique. Les tâches PROFILES 2017 pertinentes incluent hématémèse, méléna, anémie, numération leucocytaire anormale et parasites dans les selles. Les exercices MEDINA sont originaux et fictifs, sans statut de questions fédérales officielles.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a> ; <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240041608" target="_blank" rel="noopener">INT-WHO — OMS 2022, recommandation 4, page xix</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680470250018" target="_blank" rel="noopener">FI-PROPRANOLOL — FI suisse de janvier 2023 : indication portale, doses et sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576230013" target="_blank" rel="noopener">FI-CARVEDILOL — FI suisse d’octobre 2023 : indications, populations et limites</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-ASPLEN — Pages 1–2, information et prévention après splénectomie, 2024</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/swissmedic/fr/home/humanarzneimittel/bewilligungen_zertifikate/autorisation-speciale.html" target="_blank" rel="noopener">CH-IMPORT — Section 2.1, importation humaine selon article 49 OAMéd</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Situations cliniques pertinentes, liste SSP 2017</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction et exigences de l’examen fédéral 2026</a>.</p></section>

<template data-pop="d77-exp-1" data-title="Comprendre — 1. Définition : manifestation, syndrome et cause"><p><b>Lecture expliquée.</b> D77* est une manifestation à relier à une maladie causale ; volume, fibrose et hypersplénisme ne sont pas synonymes.</p><p>D77* est une catégorie de manifestation : « Autres maladies du sang et des organes hématopoïétiques au cours de maladies classées ailleurs ». Son inclusion explicite dans la CIM-10-GM suisse 2024 est la <b>fibrose splénique due à la schistosomiase [bilharziose] (B65.-†)</b>. D77 n’a pas de sous-code décimal dans cette version. Le code de la maladie causale et celui de sa manifestation ne remplacent pas la démonstration clinique.</p><p>Cette monographie développe cette inclusion, sans prétendre que toute maladie classable en D77 soit une bilharziose. La <b>splénomégalie</b> décrit une augmentation de volume ; l’<b>hypersplénisme</b> décrit un retentissement hématologique associé à la rate ; la <b>fibrose</b> décrit une transformation tissulaire. Ces termes ne sont pas interchangeables. Une grande rate n’est pas automatiquement une rate non fonctionnelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe D77, inclusion et usage astérisque</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-ASPLEN — Pages 1–2, information et prévention après splénectomie, 2024</a>.</p></template>
<template data-pop="pareto-d77-1" data-title="Essentiel — 1. Définition : manifestation, syndrome et cause"><p>D77* est une manifestation à relier à une maladie causale ; volume, fibrose et hypersplénisme ne sont pas synonymes.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe D77, inclusion et usage astérisque</a>.</p></template>
<template data-pop="d77-exp-2" data-title="Comprendre — 2. Épidémiologie : exposition et sélection des populations"><p><b>Lecture expliquée.</b> Documenter une exposition compatible ; aucune incidence suisse directe D77 n’est retenue.</p><p>L’exposition pertinente est un contact cutané avec de l’eau douce contaminée dans une région d’endémie : lieu de naissance, séjour, migration, activité professionnelle ou voyage. L’infection peut persister et les symptômes chroniques être discrets. Une brève exposition ne garantit pas l’absence d’infection ; l’absence d’éosinophilie ne suffit pas à l’écarter.</p><p>Les formes hépatospléniques sont surtout associées à <i>S. mansoni</i> et <i>S. japonicum</i>. <i>S. haematobium</i> oriente davantage vers une atteinte urogénitale. Cette orientation ne remplace pas l’identification ni l’étude d’une atteinte concomitante. Une hématurie terminale dans un récit d’exposition doit être explorée, sans la prendre pour une preuve d’hypertension portale.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2018/revue-medicale-suisse-605/diagnostic-de-schistosomiase-urinaire-par-l-identification-de-miracidiums-de-schistosoma-haematobium" target="_blank" rel="noopener">CH-RMS-DX — Résumé, diagnostic et limites du cas urinaire, 2018</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a>.</p></template>
<template data-pop="pareto-d77-2" data-title="Essentiel — 2. Épidémiologie : exposition et sélection des populations"><p>Documenter une exposition compatible ; aucune incidence suisse directe D77 n’est retenue.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a>.</p></template>
<template data-pop="d77-exp-3" data-title="Comprendre — 3. Physiopathologie : œufs, tissu et circulation"><p><b>Lecture expliquée.</b> Les œufs et la réponse tissulaire contribuent à la fibrose périportale et à une hypertension présinusoïdale.</p><p>Les cercaires pénètrent la peau au contact de l’eau contaminée. Le cycle conduit à des vers adultes et à une production d’œufs ; une partie des œufs se retrouve dans les tissus. La réaction inflammatoire granulomateuse aux œufs contribue à la fibrose périportale. Il ne s’agit pas simplement d’un ver qui bouche directement la veine porte.</p><p>Cette image montre un œuf, sans démontrer sa viabilité, une fibrose splénique ou le degré d’hypertension portale. Source américaine utilisée uniquement pour la figure, sans recommandation clinique américaine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-TX — Revue HSS 2021 : traitements, bêtabloquants, chirurgie et TIPS</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a>.</p></template>
<template data-pop="pareto-d77-3" data-title="Essentiel — 3. Physiopathologie : œufs, tissu et circulation"><p>Les œufs et la réponse tissulaire contribuent à la fibrose périportale et à une hypertension présinusoïdale.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a>.</p></template>
<template data-pop="d77-exp-4" data-title="Comprendre — 4. Démarche clinique : gravité, cause puis retentissement"><p><b>Lecture expliquée.</b> Urgence d’abord, puis infection, organes et profil sanguin : chaque examen répond à une question.</p><p><b>Première étape : rechercher une urgence.</b> Hématémèse, méléna, malaise, altération de conscience ou signes circulatoires imposent une évaluation et une prise en charge urgentes. Une hémorragie peut être grave avec une fonction hépatique jusque-là conservée. Sous bêtabloquant, l’absence de tachycardie ne rassure pas à elle seule.</p><p><b>Deuxième étape : établir la plausibilité causale.</b> Documenter les expositions et les traitements antérieurs, puis choisir les examens parasitologiques selon l’espèce et le site suspectés. La sérologie complète l’enquête mais ne sépare pas de façon fiable infection ancienne et infection active.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680470250018" target="_blank" rel="noopener">FI-PROPRANOLOL — FI suisse de janvier 2023 : indication portale, doses et sécurité</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-TX — Consensus espagnol 2022 : traitement, tableau 3 et populations</a>.</p></template>
<template data-pop="pareto-d77-4" data-title="Essentiel — 4. Démarche clinique : gravité, cause puis retentissement"><p>Urgence d’abord, puis infection, organes et profil sanguin : chaque examen répond à une question.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a>.</p></template>
<template data-pop="d77-exp-5" data-title="Comprendre — 5. Anamnèse : relier chronologie et mécanismes"><p><b>Lecture expliquée.</b> Dates, lieux, eau douce, traitements, saignements et autres médicaments changent le raisonnement.</p><p>Préciser pays et dates de résidence ou de séjour, type d’eau, baignades et activités, épisodes de fièvre après exposition, diagnostics antérieurs, praziquantel reçu et éventuelles réexpositions. La forme aiguë peut associer fièvre, rash, toux ou dyspnée dans les semaines après l’exposition ; elle ne se gère pas comme une simple infection chronique stable.</p><p>Rechercher saignements digestifs et leur calendrier, fatigue, dyspnée, pesanteur de l’hypocondre gauche et augmentation du volume abdominal. Documenter diarrhée, sang dans les selles, hématurie terminale, symptômes urinaires et signes neurologiques. Une plainte oriente un compartiment ; elle ne suffit pas à identifier le mécanisme.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2018/revue-medicale-suisse-605/diagnostic-de-schistosomiase-urinaire-par-l-identification-de-miracidiums-de-schistosoma-haematobium" target="_blank" rel="noopener">CH-RMS-DX — Résumé, diagnostic et limites du cas urinaire, 2018</a> ; <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-FEVER — Page 3, conduite devant fièvre et plan antibiotique, 2024</a>.</p></template>
<template data-pop="pareto-d77-5" data-title="Essentiel — 5. Anamnèse : relier chronologie et mécanismes"><p>Dates, lieux, eau douce, traitements, saignements et autres médicaments changent le raisonnement.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a>.</p></template>
<template data-pop="d77-exp-6" data-title="Comprendre — 6. Examen clinique : volume, saignement et état général"><p><b>Lecture expliquée.</b> Une fonction hépatique préservée et l’absence d’ascite n’excluent pas des varices graves.</p><p>Commencer par l’état général, la conscience, la pression, le pouls, la perfusion et les signes de saignement. La recherche d’une grosse rate vient après la sécurité immédiate. Décrire pâleur, lésions cutanées hémorragiques éventuelles, ictère, abdomen distendu et signes respiratoires ; aucun de ces signes isolés n’est spécifique de la bilharziose.</p><p>Palper prudemment le foie et la rate, décrire douleur, limites et consistance, rechercher ascite et circulation collatérale. L’examen clinique situe le problème mais l’échographie fournit une mesure et étudie les vaisseaux. Une rate non palpée n’exclut pas toute anomalie ; une rate palpable ne prouve pas une fibrose.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a>.</p></template>
<template data-pop="pareto-d77-6" data-title="Essentiel — 6. Examen clinique : volume, saignement et état général"><p>Une fonction hépatique préservée et l’absence d’ascite n’excluent pas des varices graves.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a>.</p></template>
<template data-pop="d77-exp-7" data-title="Comprendre — 7. Syndromes : séparer ce qui peut coexister"><p><b>Lecture expliquée.</b> Les regroupements cliniques orientent ; ils ne démontrent pas un mécanisme unique de cytopénie.</p><p>Ces profils sont des regroupements cliniques. Ils guident les investigations et l’urgence ; ils ne constituent pas des critères chiffrés validés pour attribuer D77. Une cytopénie profonde ou atypique doit faire rechercher d’autres mécanismes plutôt que de refermer le dossier sur la rate.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-FEVER — Page 3, conduite devant fièvre et plan antibiotique, 2024</a>.</p></template>
<template data-pop="pareto-d77-7" data-title="Essentiel — 7. Syndromes : séparer ce qui peut coexister"><p>Les regroupements cliniques orientent ; ils ne démontrent pas un mécanisme unique de cytopénie.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a>.</p></template>
<template data-pop="d77-exp-8" data-title="Comprendre — 8. Diagnostic positif : croiser des preuves différentes"><p><b>Lecture expliquée.</b> Croiser preuve parasitaire et atteinte hépatoportale ; sérologie seule insuffisante pour l’activité.</p><p>La preuve de schistosomiase repose notamment sur la mise en évidence d’œufs dans les selles, les urines ou un tissu selon la situation. La sensibilité d’un prélèvement peut être faible ; une négativité n’éteint pas une forte suspicion. Les examens répétés, la sérologie et les techniques spécialisées sont choisis avec le laboratoire et le spécialiste.</p><p>La sérologie est utile dans l’enquête d’exposition et le dépistage ciblé, mais peut rester positive longtemps. Elle ne suffit pas à démontrer une infection active, la guérison ou une fibrose splénique. Une image d’œuf publiée pour apprendre sa morphologie n’est pas un résultat du patient.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2018/revue-medicale-suisse-605/diagnostic-de-schistosomiase-urinaire-par-l-identification-de-miracidiums-de-schistosoma-haematobium" target="_blank" rel="noopener">CH-RMS-DX — Résumé, diagnostic et limites du cas urinaire, 2018</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe D77, inclusion et usage astérisque</a>.</p></template>
<template data-pop="pareto-d77-8" data-title="Essentiel — 8. Diagnostic positif : croiser des preuves différentes"><p>Croiser preuve parasitaire et atteinte hépatoportale ; sérologie seule insuffisante pour l’activité.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a>.</p></template>

<template data-pop="d77-exp-9" data-title="Comprendre — 9. Explorations : une question par examen"><p><b>Lecture expliquée.</b> Numération, parasitologie, Doppler et endoscopie mesurent des dimensions différentes.</p><p>Le choix dépend de l’urgence et de ce qui modifiera le plan. Chez une personne instable ou qui saigne, la séquence de soins ne peut pas attendre un dossier parasitologique complet.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">CH-HUG-LAB — Diapositive 3, repères adultes de numération, 2019</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a>.</p></template>
<template data-pop="pareto-d77-9" data-title="Essentiel — 9. Explorations : une question par examen"><p>Numération, parasitologie, Doppler et endoscopie mesurent des dimensions différentes.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a>.</p></template>
<template data-pop="d77-exp-10" data-title="Comprendre — 10. Arbre diagnostique et diagnostics différentiels"><p><b>Lecture expliquée.</b> Une hypertension non cirrhotique n’est pas automatiquement une PSVD ; schistosomiase exclue de sa définition.</p><p>Les autres causes de splénomégalie et de cytopénies comprennent infections, maladies hématologiques, troubles de production ou de destruction et autres maladies hépatoportales. Une perte digestive ou une carence peut contribuer à l’anémie. Il faut rechercher une cause coexistante lorsque les résultats ne sont pas expliqués par le mécanisme retenu.</p><p>L’EASL 2026 exclut explicitement la schistosomiase de la définition de la maladie vasculaire porto-sinusoïdale (PSVD). « Hypertension portale sans cirrhose » n’est donc pas automatiquement « PSVD ». Les seuils et stratégies conçus pour cirrhose ou PSVD ne deviennent pas des règles HSS par simple analogie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a> ; <a data-reference-source="1" href="https://www.journal-of-hepatology.eu/article/S0168-8278(25)02406-7/fulltext" target="_blank" rel="noopener">EU-EASL-BOUND — EASL 2026 : définition de PSVD et exclusions explicites</a>.</p></template>
<template data-pop="pareto-d77-10" data-title="Essentiel — 10. Arbre diagnostique et diagnostics différentiels"><p>Une hypertension non cirrhotique n’est pas automatiquement une PSVD ; schistosomiase exclue de sa définition.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.journal-of-hepatology.eu/article/S0168-8278(25)02406-7/fulltext" target="_blank" rel="noopener">EU-EASL-BOUND — EASL 2026 : définition de PSVD et exclusions explicites</a>.</p></template>
<template data-pop="d77-exp-11" data-title="Comprendre — 11. Prise en charge : traiter la cause et les complications"><p><b>Lecture expliquée.</b> Traiter infection et complications ; ni splénectomie automatique ni transposition aveugle de la cirrhose.</p><p><b>Urgence hémorragique.</b> Une hématémèse ou un méléna avec retentissement nécessite une filière urgente et une évaluation endoscopique appropriée. Le traitement oral du parasite ou l’augmentation d’un bêtabloquant à domicile ne remplace pas cette prise en charge. Une forme aiguë sévère ou neurologique relève également d’un avis spécialisé.</p><p><b>Infection.</b> Le praziquantel est le traitement de référence dans les sources consultées, avec schéma adapté à l’espèce, au produit et à la personne. La liste Swissmedic du 30 septembre 2026 et les recherches AmiKo n’ont pas fourni d’entrée praziquantel/Biltricide : c’est une constatation datée, sans preuve d’indisponibilité définitive. Le pharmacien et le spécialiste vérifient le produit réellement accessible et, si nécessaire, les conditions légales d’importation. Le RCP français décrit les doses, sans devenir une FI suisse.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-TX — Consensus espagnol 2022 : traitement, tableau 3 et populations</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/swissmedic/fr/home/services/listen_neu.html" target="_blank" rel="noopener">CH-PRAZI-STATUS — Liste Swissmedic du 30 septembre 2026 et recherches AmiKo</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/swissmedic/fr/home/humanarzneimittel/bewilligungen_zertifikate/autorisation-speciale.html" target="_blank" rel="noopener">CH-IMPORT — Section 2.1, importation humaine selon article 49 OAMéd</a> ; <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680470250018" target="_blank" rel="noopener">FI-PROPRANOLOL — FI suisse de janvier 2023 : indication portale, doses et sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576230013" target="_blank" rel="noopener">FI-CARVEDILOL — FI suisse d’octobre 2023 : indications, populations et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-TX — Revue HSS 2021 : traitements, bêtabloquants, chirurgie et TIPS</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-ASPLEN — Pages 1–2, information et prévention après splénectomie, 2024</a>.</p></template>
<template data-pop="pareto-d77-11" data-title="Essentiel — 11. Prise en charge : traiter la cause et les complications"><p>Traiter infection et complications ; ni splénectomie automatique ni transposition aveugle de la cirrhose.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-TX — Revue HSS 2021 : traitements, bêtabloquants, chirurgie et TIPS</a>.</p></template>
<template data-pop="d77-exp-12" data-title="Comprendre — 12. Prévention, suivi et pronostic : un plan à plusieurs horizons"><p><b>Lecture expliquée.</b> Suivi adapté, réexpositions et prévention après splénectomie ; sérologie persistante n’est pas synonyme d’échec.</p><p>Prévenir les nouvelles expositions à l’eau douce contaminée et expliquer que le traitement ne procure pas une immunité contre une réinfection. Organiser le suivi parasitologique et clinique ; le consensus espagnol propose une réévaluation globale vers trois mois, avec modalités adaptées. Une complication impose un contrôle plus tôt, et une sérologie persistante n’est pas à elle seule une indication de retraitement.</p><p>Suivre numérations, symptômes, état hépatoportal et varices selon le plan spécialisé. Une guérison parasitologique ne signifie pas disparition immédiate des collatérales ou d’une fibrose avancée. À l’inverse, certaines lésions peuvent régresser : le pronostic dépend de l’ancienneté, des complications, des réexpositions et des maladies associées.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-FOLLOW — Consensus espagnol 2022 : suivi et retraitement</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-TX — Revue HSS 2021 : traitements, bêtabloquants, chirurgie et TIPS</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-ASPLEN — Pages 1–2, information et prévention après splénectomie, 2024</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-FEVER — Page 3, conduite devant fièvre et plan antibiotique, 2024</a>.</p></template>
<template data-pop="pareto-d77-12" data-title="Essentiel — 12. Prévention, suivi et pronostic : un plan à plusieurs horizons"><p>Suivi adapté, réexpositions et prévention après splénectomie ; sérologie persistante n’est pas synonyme d’échec.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-FOLLOW — Consensus espagnol 2022 : suivi et retraitement</a>.</p></template>
<template data-pop="d77-exp-13" data-title="Comprendre — 13. Points clés : ce qui change une décision"><p><b>Lecture expliquée.</b> Exposition, infection, circulation, numération et plan doivent rester visibles dans la conclusion.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe D77, inclusion et usage astérisque</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-TX — Consensus espagnol 2022 : traitement, tableau 3 et populations</a> ; <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a>.</p></template>
<template data-pop="pareto-d77-13" data-title="Essentiel — 13. Points clés : ce qui change une décision"><p>Exposition, infection, circulation, numération et plan doivent rester visibles dans la conclusion.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a>.</p></template>
<template data-pop="d77-exp-14" data-title="Comprendre — 14. Pièges : raccourcis qui exposent à une erreur"><p><b>Lecture expliquée.</b> Un RCP étranger ne devient pas une FI suisse et une incertitude ne devient pas une certitude.</p><p>Rassurer sur les seules transaminases, attribuer toute anémie à l’hypersplénisme, déduire une guérison de l’absence d’éosinophilie, ou appeler cirrhose toute hypertension portale effacent des mécanismes importants. Un dosage sérologique et une photographie histologique normale ne démontrent pas une infection active ni une fibrose chez la personne examinée.</p><p>Les autres raccourcis à éviter sont la splénectomie motivée uniquement par un chiffre, la transposition d’un traitement de cirrhose sans justification HSS, l’application à l’enfant d’un schéma adulte et la présentation d’un RCP étranger comme FI suisse. La recommandation OMS en santé publique et le RCP d’un produit peuvent différer pour grossesse, allaitement ou âge : la différence doit être attribuée et résolue pour le produit réel.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a> ; <a data-reference-source="1" href="https://www.journal-of-hepatology.eu/article/S0168-8278(25)02406-7/fulltext" target="_blank" rel="noopener">EU-EASL-BOUND — EASL 2026 : définition de PSVD et exclusions explicites</a> ; <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240041608" target="_blank" rel="noopener">INT-WHO — OMS 2022, recommandation 4, page xix</a> ; <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a>.</p></template>
<template data-pop="pareto-d77-14" data-title="Essentiel — 14. Pièges : raccourcis qui exposent à une erreur"><p>Un RCP étranger ne devient pas une FI suisse et une incertitude ne devient pas une certitude.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a>.</p></template>
<template data-pop="d77-cas-1" data-title="Cas 1 — Une hématémèse avec enzymes peu perturbées"><p><b>Exercice fictif original.</b></p><p>Une personne exposée en zone d’endémie a une grosse rate, des plaquettes basses et un vomissement sanglant. La fonction hépatique peut rester relativement conservée dans HSS : cette information ne neutralise pas le risque. Évaluer sans délai saignement et état circulatoire, puis la source et les complications avec l’équipe appropriée.</p><p>Le traitement oral du parasite et un contrôle de sérologie ne remplacent pas la filière urgente. L’absence de tachycardie sous propranolol ne garantit pas l’absence de perte sanguine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680470250018" target="_blank" rel="noopener">FI-PROPRANOLOL — FI suisse de janvier 2023 : indication portale, doses et sécurité</a>.</p></template>
<template data-pop="d77-cas-2" data-title="Cas 2 — Une sérologie encore positive après traitement"><p><b>Exercice fictif original.</b></p><p>Une personne traitée présente encore une sérologie positive, sans nouveau symptôme rapporté. Ce résultat ne démontre pas seul une infection active ou un échec. Revoir calendrier, exposition, résultats directs et suivi approprié avec le spécialiste.</p><p>Le consensus espagnol propose une réévaluation globale vers trois mois, avec adaptation clinique. Ne pas prescrire automatiquement une nouvelle dose à 28 jours sur la base d’un seul cas publié.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-FOLLOW — Consensus espagnol 2022 : suivi et retraitement</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2018/revue-medicale-suisse-605/diagnostic-de-schistosomiase-urinaire-par-l-identification-de-miracidiums-de-schistosoma-haematobium" target="_blank" rel="noopener">CH-RMS-DX — Résumé, diagnostic et limites du cas urinaire, 2018</a>.</p></template>
<template data-pop="d77-cas-3" data-title="Cas 3 — Le médicament accessible n’est pas encore identifié"><p><b>Exercice fictif original.</b></p><p>Un projet de praziquantel est établi, mais la pharmacie doit préciser l’approvisionnement. Les recherches datées Swissmedic/AmiKo n’ont pas fourni d’entrée ; il faut vérifier le produit, son information et les conditions d’accès. Le RCP français fournit une référence étrangère, sans démontrer une disponibilité suisse.</p><p>En présence d’allaitement, expliquer la différence entre politique OMS et RCP français, puis décider avec le spécialiste selon le produit réel. Ne pas fusionner les deux formulations.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissmedic.ch/swissmedic/fr/home/services/listen_neu.html" target="_blank" rel="noopener">CH-PRAZI-STATUS — Liste Swissmedic du 30 septembre 2026 et recherches AmiKo</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/swissmedic/fr/home/humanarzneimittel/bewilligungen_zertifikate/autorisation-speciale.html" target="_blank" rel="noopener">CH-IMPORT — Section 2.1, importation humaine selon article 49 OAMéd</a> ; <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a> ; <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240041608" target="_blank" rel="noopener">INT-WHO — OMS 2022, recommandation 4, page xix</a>.</p></template>
<template data-pop="d77-cas-4" data-title="Cas 4 — Fièvre après splénectomie"><p><b>Exercice fictif original.</b></p><p>Une personne splénectomisée a de la fièvre un soir. Le protocole CHUV insiste sur un contact urgent et l’absence d’attente nocturne. Utiliser la réserve antibiotique déjà prescrite selon son plan si l’avis n’est pas accessible rapidement, puis poursuivre l’évaluation.</p><p>Ce cas ne justifie pas de donner à toute personne avec une grande rate un diagnostic d’asplénie ou une dose antibiotique universelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-ASPLEN — Pages 1–2, information et prévention après splénectomie, 2024</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-FEVER — Page 3, conduite devant fièvre et plan antibiotique, 2024</a>.</p></template>
<template data-pop="d77-calcul-dose" data-title="Calcul pédagogique : mg/kg et quantité totale"><p><b>Exemple fictif, sans prescription.</b> Pour une masse de 60 kg et un schéma étranger de 40 mg/kg sur 24 heures, la quantité arithmétique est 60 × 40 = 2 400 mg. Le kilogramme s’annule : le résultat est une masse totale de médicament, pas une dose en mg/kg ni une décision de nombre de comprimés.</p><p>Le choix du schéma dépend de l’espèce, du produit réel, de l’âge, des organes et des interactions. La formulation et l’arrondi doivent être vérifiés. Le RCP français distingue notamment 40 et 60 mg/kg selon l’espèce et fixe 4–6 heures entre prises répétées le même jour ; une opération correcte ne valide pas la prescription.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a>.</p></template>
<template data-pop="d77-calcul-pouls" data-title="Calcul pédagogique : baisse relative de fréquence"><p><b>Exemple fictif.</b> Une fréquence initiale au repos de 80/min diminuée de 25 % donne 80 × (1 − 0,25) = 60/min. Le pourcentage se calcule sur la valeur initiale. Ce résultat illustre l’objectif mentionné dans la FI du propranolol ; il ne commande pas une augmentation automatique.</p><p>Pression, symptômes, perfusion, contre-indications et tolérance comptent. La FI demande de ne pas augmenter si la fréquence est déjà de 50–55/min ; la sécurité peut imposer une adaptation avant cette borne. Le maximum de dose n’est pas une cible routinière.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680470250018" target="_blank" rel="noopener">FI-PROPRANOLOL — FI suisse de janvier 2023 : indication portale, doses et sécurité</a>.</p></template>
