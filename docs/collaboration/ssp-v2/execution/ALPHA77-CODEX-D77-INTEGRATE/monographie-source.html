77-figure="portal"] [data-d77-mark="3"]{left:46%;top:61%}[data-d77-figure="egg"] [data-d77-mark="1"]{left:23%;top:66%}[data-d77-figure="egg"] [data-d77-mark="2"]{left:50%;top:43%}[data-d77-figure="egg"] [data-d77-mark="3"]{left:78%;top:37%}[data-d77-figure="marrow"] [data-d77-mark="1"]{left:45%;top:35%}[data-d77-figure="marrow"] [data-d77-mark="2"]{left:13%;top:4%}[data-d77-figure="marrow"] [data-d77-mark="3"]{left:85%;top:47%}[data-d77-figure="histo"] [data-d77-mark="1"]{left:44%;top:24%}[data-d77-figure="histo"] [data-d77-mark="2"]{left:44%;top:39%}[data-d77-figure="histo"] [data-d77-mark="3"]{left:54%;top:65%}[data-d77-figure="histo"] [data-d77-mark="4"]{left:90%;top:77%}</style><div class="panel" id="pA"><nav class="toc ui"><b>Plan monographique</b><ol><li><a href="#d77-1">Définition</a></li><li><a href="#d77-2">Épidémiologie</a></li><li><a href="#d77-3">Physiopathologie</a></li><li><a href="#d77-4">Démarche clinique</a></li><li><a href="#d77-5">Anamnèse</a></li><li><a href="#d77-6">Examen clinique</a></li><li><a href="#d77-7">Syndromes</a></li><li><a href="#d77-8">Diagnostic positif</a></li><li><a href="#d77-9">Explorations</a></li><li><a href="#d77-10">Arbre diagnostique et diagnostics différentiels</a></li><li><a href="#d77-11">Prise en charge</a></li><li><a href="#d77-12">Prévention, suivi et pronostic</a></li><li><a href="#d77-13">Points clés</a></li><li><a href="#d77-14">Pièges</a></li></ol></nav><div class="chap-body" data-semiology-clinical="D77"><section class="ilot" id="d77-question" ><h2>Une grosse rate et des plaquettes basses : où se trouve le problème ?</h2><p><b>Vignette fictive.</b> Une personne ayant vécu en zone d’endémie rapporte des baignades en eau douce. Une splénomégalie et une thrombocytopénie ont été découvertes ; elle mentionne aussi un épisode de vomissement sanglant. Les transaminases peu perturbées suffisent-elles à rassurer ? Faut-il enlever la rate pour corriger la numération ?</p><p>La priorité est le saignement possible, puis l’explication de l’association entre exposition, maladie parasitaire, circulation portale et signes sanguins. Un foie encore fonctionnel peut être traversé par une hypertension portale importante. Une faible numération ne prouve pas à elle seule un défaut médullaire, et une rate volumineuse ne prouve pas une schistosomiase.</p><div class="key"><b>À retenir.</b> Évaluer la gravité avant d’attribuer une cytopénie à la rate.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a>.</p></section>
<section class="ilot" id="d77-1" ><h2>1. Définition : manifestation, syndrome et cause</h2><p>D77* est une catégorie de manifestation : « Autres maladies du sang et des organes hématopoïétiques au cours de maladies classées ailleurs ». Son inclusion explicite dans la CIM-10-GM suisse 2024 est la <b>fibrose splénique due à la schistosomiase [bilharziose] (B65.-†)</b>. D77 n’a pas de sous-code décimal dans cette version. Le code de la maladie causale et celui de sa manifestation ne remplacent pas la démonstration clinique.</p><p>Cette monographie développe cette inclusion, sans prétendre que toute maladie classable en D77 soit une bilharziose. La <b>splénomégalie</b> décrit une augmentation de volume ; l’<b>hypersplénisme</b> décrit un retentissement hématologique associé à la rate ; la <b>fibrose</b> décrit une transformation tissulaire. Ces termes ne sont pas interchangeables. Une grande rate n’est pas automatiquement une rate non fonctionnelle.</p><p>La schistosomiase hépatosplénique associe notamment fibrose périportale, hypertension portale présinusoïdale et splénomégalie. Le caractère « splénique » du libellé de classification ne doit pas faire oublier le mécanisme portal et la recherche de la cause parasitaire.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe D77, inclusion et usage astérisque</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-ASPLEN — Pages 1–2, information et prévention après splénectomie, 2024</a>.</p><p><button class="w" data-k="d77-exp-1">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-d77-1">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="d77-2" ><h2>2. Épidémiologie : exposition et sélection des populations</h2><p>L’exposition pertinente est un contact cutané avec de l’eau douce contaminée dans une région d’endémie : lieu de naissance, séjour, migration, activité professionnelle ou voyage. L’infection peut persister et les symptômes chroniques être discrets. Une brève exposition ne garantit pas l’absence d’infection ; l’absence d’éosinophilie ne suffit pas à l’écarter.</p><p>Les formes hépatospléniques sont surtout associées à <i>S. mansoni</i> et <i>S. japonicum</i>. <i>S. haematobium</i> oriente davantage vers une atteinte urogénitale. Cette orientation ne remplace pas l’identification ni l’étude d’une atteinte concomitante. Une hématurie terminale dans un récit d’exposition doit être explorée, sans la prendre pour une preuve d’hypertension portale.</p><p>Aucune incidence suisse spécifique de D77 ni fréquence universelle de cytopénie n’est retenue dans les documents lus. Les cohortes de formes compliquées et les séries d’intervention sélectionnent des personnes malades ; leurs proportions ne représentent pas tous les migrants, tous les voyageurs ou toutes les infections.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2018/revue-medicale-suisse-605/diagnostic-de-schistosomiase-urinaire-par-l-identification-de-miracidiums-de-schistosoma-haematobium" target="_blank" rel="noopener">CH-RMS-DX — Résumé, diagnostic et limites du cas urinaire, 2018</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a>.</p><p><button class="w" data-k="d77-exp-2">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-d77-2">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="d77-3" ><h2>3. Physiopathologie : œufs, tissu et circulation</h2><p>Les cercaires pénètrent la peau au contact de l’eau contaminée. Le cycle conduit à des vers adultes et à une production d’œufs ; une partie des œufs se retrouve dans les tissus. La réaction inflammatoire granulomateuse aux œufs contribue à la fibrose périportale. Il ne s’agit pas simplement d’un ver qui bouche directement la veine porte.</p><figure data-d77-figure="egg"><div data-d77-frame="wide"><img src="assets/img/d77/alpha/codex/Schistosoma_mansoni_egg_4841_lores.jpg" alt="Photomicrographie d’un œuf de Schistosoma mansoni avec éperon latéral" loading="lazy"><span data-d77-mark="1" aria-hidden="true">1</span><span data-d77-mark="2" aria-hidden="true">2</span><span data-d77-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Éperon latéral attribué à S. mansoni par la provenance.</li><li>Corps de l’œuf, objet observé en microscopie.</li><li>Contour de l’œuf ; aucune taille calculée sans échelle calibrée.</li></ol><p>Cette image montre un œuf, sans démontrer sa viabilité, une fibrose splénique ou le degré d’hypertension portale. Source américaine utilisée uniquement pour la figure, sans recommandation clinique américaine.</p><p data-d77-credit>CDC, photomicrographie humaine institutionnelle, PHIL 4841, 1979 ; auteur individuel non renseigné · <a href="https://commons.wikimedia.org/wiki/File:Schistosoma_mansoni_egg_4841_lores.jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://commons.wikimedia.org/wiki/Template:PD-USGov-HHS-CDC" target="_blank" rel="noopener">Domaine public — œuvre fédérale américaine</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>L’augmentation de résistance en amont des sinusoïdes explique une hypertension portale <b>présinusoïdale</b>. La congestion et l’augmentation du flux splénique contribuent à la splénomégalie ; des voies collatérales et des varices peuvent se développer. La fonction hépatocellulaire est souvent relativement préservée, ce qui distingue ce mécanisme d’une cirrhose avancée, sans garantir un foie toujours indemne.</p><figure data-d77-figure="portal"><div data-d77-frame="tall"><img src="assets/img/d77/alpha/codex/Gray591-Portal_vein.png" alt="Planche humaine du système porte, veine splénique et affluents digestifs" loading="lazy"><span data-d77-mark="1" aria-hidden="true">1</span><span data-d77-mark="2" aria-hidden="true">2</span><span data-d77-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Tronc porte montant vers le foie.</li><li>Trajet de la veine splénique depuis la rate.</li><li>Affluents mésentériques : drainage digestif vers le système porte.</li></ol><p>Schéma normal, sans mesure de pression, de débit ou de fibrose. La couleur sert à repérer les veines, sans représenter une obstruction réelle.</p><p data-d77-credit>Jmarchn, adaptation humaine de Gray 591, 19 juin 2023 · <a href="https://commons.wikimedia.org/wiki/File:Gray591-Portal_vein.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Thrombocytopénie et leucopénie peuvent accompagner ce tableau. La revue HSS 2021 souligne l’incertitude entre stase intrasplénique, séquestration et destruction ; il serait excessif de présenter toute baisse de numération comme une destruction immune démontrée. L’anémie peut aussi résulter de pertes digestives, de carences ou d’autres maladies. Plusieurs mécanismes peuvent coexister.</p><p>Le praziquantel traite l’infection sensible ; la régression de certaines lésions ou de l’hypertension portale peut survenir, surtout tôt et chez les jeunes. Les lésions avancées peuvent persister. Dire que la fibrose ne régresse jamais serait aussi trompeur que promettre sa disparition après une dose.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-TX — Revue HSS 2021 : traitements, bêtabloquants, chirurgie et TIPS</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a>.</p><p><button class="w" data-k="d77-exp-3">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-d77-3">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="d77-4" ><h2>4. Démarche clinique : gravité, cause puis retentissement</h2><p><b>Première étape : rechercher une urgence.</b> Hématémèse, méléna, malaise, altération de conscience ou signes circulatoires imposent une évaluation et une prise en charge urgentes. Une hémorragie peut être grave avec une fonction hépatique jusque-là conservée. Sous bêtabloquant, l’absence de tachycardie ne rassure pas à elle seule.</p><p><b>Deuxième étape : établir la plausibilité causale.</b> Documenter les expositions et les traitements antérieurs, puis choisir les examens parasitologiques selon l’espèce et le site suspectés. La sérologie complète l’enquête mais ne sépare pas de façon fiable infection ancienne et infection active.</p><p><b>Troisième étape : décrire les organes et le sang.</b> Numération, frottis selon le contexte, bilan hépatique, échographie-Doppler et évaluation des varices répondent à des questions distinctes. Une numération n’imagine pas la veine porte et une échographie ne prouve pas la présence d’un œuf viable.</p><p><b>Quatrième étape : organiser les soins.</b> Avis de médecine tropicale/infectiologie et hépatologie, avec hématologie lorsque le profil sanguin est discordant ou complexe. Le traitement de l’infection et la prévention d’une hémorragie portale ne sont pas une seule intervention.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680470250018" target="_blank" rel="noopener">FI-PROPRANOLOL — FI suisse de janvier 2023 : indication portale, doses et sécurité</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-TX — Consensus espagnol 2022 : traitement, tableau 3 et populations</a>.</p><p><button class="w" data-k="d77-exp-4">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-d77-4">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="d77-5" ><h2>5. Anamnèse : relier chronologie et mécanismes</h2><p>Préciser pays et dates de résidence ou de séjour, type d’eau, baignades et activités, épisodes de fièvre après exposition, diagnostics antérieurs, praziquantel reçu et éventuelles réexpositions. La forme aiguë peut associer fièvre, rash, toux ou dyspnée dans les semaines après l’exposition ; elle ne se gère pas comme une simple infection chronique stable.</p><p>Rechercher saignements digestifs et leur calendrier, fatigue, dyspnée, pesanteur de l’hypocondre gauche et augmentation du volume abdominal. Documenter diarrhée, sang dans les selles, hématurie terminale, symptômes urinaires et signes neurologiques. Une plainte oriente un compartiment ; elle ne suffit pas à identifier le mécanisme.</p><p>Recueillir antécédents hépatiques, autres infections, alcool, médicaments, grossesse, allaitement et traitements qui modifient les numérations ou la pression. Une rifampicine prescrite ailleurs est une donnée essentielle avant praziquantel. Demander si la personne a déjà subi une splénectomie ou reçu un plan de prévention d’asplénie ; cela change la conduite devant une fièvre.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2018/revue-medicale-suisse-605/diagnostic-de-schistosomiase-urinaire-par-l-identification-de-miracidiums-de-schistosoma-haematobium" target="_blank" rel="noopener">CH-RMS-DX — Résumé, diagnostic et limites du cas urinaire, 2018</a> ; <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-FEVER — Page 3, conduite devant fièvre et plan antibiotique, 2024</a>.</p><p><button class="w" data-k="d77-exp-5">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-d77-5">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="d77-6" ><h2>6. Examen clinique : volume, saignement et état général</h2><p>Commencer par l’état général, la conscience, la pression, le pouls, la perfusion et les signes de saignement. La recherche d’une grosse rate vient après la sécurité immédiate. Décrire pâleur, lésions cutanées hémorragiques éventuelles, ictère, abdomen distendu et signes respiratoires ; aucun de ces signes isolés n’est spécifique de la bilharziose.</p><p>Palper prudemment le foie et la rate, décrire douleur, limites et consistance, rechercher ascite et circulation collatérale. L’examen clinique situe le problème mais l’échographie fournit une mesure et étudie les vaisseaux. Une rate non palpée n’exclut pas toute anomalie ; une rate palpable ne prouve pas une fibrose.</p><figure data-d77-figure="spleen"><div data-d77-frame="wide"><img src="assets/img/d77/alpha/codex/Gray1188.png" alt="Planche historique de la face viscérale de la rate humaine normale" loading="lazy"><span data-d77-mark="1" aria-hidden="true">1</span><span data-d77-mark="2" aria-hidden="true">2</span><span data-d77-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Surface gastrique : relation anatomique normale.</li><li>Hile et vaisseaux : passage du pédicule splénique.</li><li>Surface colique : rapport avec le côlon.</li></ol><p>Planche anatomique normale, sans cas de fibrose. Une surface normale situe un organe ; elle ne mesure ni congestion ni fonction immunitaire.</p><p data-d77-credit>Henry Vandyke Carter / Henry Gray, Anatomy of the Human Body, 1918, planche 1188 · <a href="https://commons.wikimedia.org/wiki/File:Gray1188.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La conservation de la fonction hépatique et l’absence d’ascite peuvent coexister avec des varices à risque. Inversement, une ascite, un ictère ou une altération de synthèse imposent de rechercher une forme avancée ou une autre atteinte associée. Chez l’enfant, les formes portales peuvent se présenter sans image périportale typique : le modèle adulte ne doit pas être appliqué mécaniquement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a>.</p><p><button class="w" data-k="d77-exp-6">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-d77-6">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="d77-7" ><h2>7. Syndromes : séparer ce qui peut coexister</h2><table class="t"><thead><tr><th>Profil</th><th>Ce qu’il suggère</th><th>Ce qu’il ne prouve pas</th></tr></thead><tbody><tr><td>Splénomégalie + thrombocytopénie/leucopénie</td><td>Retentissement splénique possible dans un contexte portal</td><td>Ni cause parasitaire certaine, ni mécanisme exclusif de destruction</td></tr><tr><td>Splénomégalie + varices/collatérales</td><td>Hypertension portale à caractériser</td><td>Cirrhose obligatoire ou fonction hépatique nécessairement effondrée</td></tr><tr><td>Anémie + saignement digestif</td><td>Perte sanguine et retentissement à évaluer</td><td>Anémie uniquement due à l’hypersplénisme</td></tr><tr><td>Fièvre après exposition, rash/toux/dyspnée</td><td>Forme aiguë possible, avis spécialisé</td><td>Forme chronique stable justifiant un traitement automatique sans bilan</td></tr><tr><td>Fièvre après splénectomie ou asplénie fonctionnelle documentée</td><td>Risque infectieux urgent</td><td>Situation équivalente à toute simple splénomégalie</td></tr></tbody></table><p>Ces profils sont des regroupements cliniques. Ils guident les investigations et l’urgence ; ils ne constituent pas des critères chiffrés validés pour attribuer D77. Une cytopénie profonde ou atypique doit faire rechercher d’autres mécanismes plutôt que de refermer le dossier sur la rate.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-FEVER — Page 3, conduite devant fièvre et plan antibiotique, 2024</a>.</p><p><button class="w" data-k="d77-exp-7">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-d77-7">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="d77-8" ><h2>8. Diagnostic positif : croiser des preuves différentes</h2><p>La preuve de schistosomiase repose notamment sur la mise en évidence d’œufs dans les selles, les urines ou un tissu selon la situation. La sensibilité d’un prélèvement peut être faible ; une négativité n’éteint pas une forte suspicion. Les examens répétés, la sérologie et les techniques spécialisées sont choisis avec le laboratoire et le spécialiste.</p><p>La sérologie est utile dans l’enquête d’exposition et le dépistage ciblé, mais peut rester positive longtemps. Elle ne suffit pas à démontrer une infection active, la guérison ou une fibrose splénique. Une image d’œuf publiée pour apprendre sa morphologie n’est pas un résultat du patient.</p><p>Le diagnostic de forme hépatosplénique ajoute les données hépatoportales et spléniques : échographie-Doppler, contexte clinique, complications et examens appropriés. L’endoscopie établit la présence et le grade des varices. Les rapports plaquettes/taille splénique étudiés dans de petites séries ne sont pas des règles universelles permettant d’exclure des varices.</p><p>Le choix D77* n’intervient qu’après documentation de la manifestation et de la maladie causale B65.-†. Une thrombocytopénie isolée avec une sérologie ancienne positive n’est pas une démonstration suffisante.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2018/revue-medicale-suisse-605/diagnostic-de-schistosomiase-urinaire-par-l-identification-de-miracidiums-de-schistosoma-haematobium" target="_blank" rel="noopener">CH-RMS-DX — Résumé, diagnostic et limites du cas urinaire, 2018</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe D77, inclusion et usage astérisque</a>.</p><p><button class="w" data-k="d77-exp-8">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-d77-8">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="d77-9" ><h2>9. Explorations : une question par examen</h2><table class="t"><thead><tr><th>Examen</th><th>Question</th><th>Limite ou suite</th></tr></thead><tbody><tr><td>Numération et évolution, frottis si indiqué</td><td>Quelles lignées, quelle profondeur et quelle trajectoire ?</td><td>Interpréter avec références du laboratoire et contexte ; la numération ne prouve pas le mécanisme</td></tr><tr><td>Bilan hépatique et de synthèse adapté</td><td>Fonction préservée, atteinte associée ou décompensation ?</td><td>Des enzymes peu perturbées n’excluent pas une hypertension portale</td></tr><tr><td>Recherche d’œufs, sérologie, tests spécialisés selon le site</td><td>Infection plausible, documentée, active ou ancienne ?</td><td>Expliquer la sensibilité, la persistance sérologique et les limites de disponibilité</td></tr><tr><td>Échographie-Doppler</td><td>Fibrose périportale, taille des organes, flux, collatérales ou thrombose ?</td><td>N’établit pas seule l’activité parasitaire ; critères pédiatriques et expertise comptent</td></tr><tr><td>Endoscopie digestive</td><td>Varices et risque hémorragique à évaluer ?</td><td>Ne pas remplacer par une règle plaquettes/rate non validée universellement</td></tr><tr><td>Exploration tissulaire ou médullaire sélectionnée</td><td>Une autre maladie changerait-elle la prise en charge ?</td><td>Pas de biopsie splénique ou médullaire automatique sur une cytopénie attribuée sans enquête</td></tr></tbody></table><p>Le choix dépend de l’urgence et de ce qui modifiera le plan. Chez une personne instable ou qui saigne, la séquence de soins ne peut pas attendre un dossier parasitologique complet.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">CH-HUG-LAB — Diapositive 3, repères adultes de numération, 2019</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a>.</p><p><button class="w" data-k="d77-exp-9">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-d77-9">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="d77-10" ><h2>10. Arbre diagnostique et diagnostics différentiels</h2><ol><li><b>Saignement ou instabilité ?</b> Prise en charge urgente, puis recherche et traitement de la source avec l’équipe adaptée.</li><li><b>Splénomégalie et numération anormale confirmées ?</b> Comparer aux résultats antérieurs et au frottis lorsque pertinent ; rechercher mécanismes associés.</li><li><b>Exposition compatible ?</b> Enquête parasitologique ciblée ; ne pas confondre sérologie ancienne et maladie active.</li><li><b>Hypertension portale présente ?</b> Imagerie vasculaire et évaluation des varices, en distinguant obstacle, fibrose périportale et autres maladies du foie.</li><li><b>Concordance complète ?</b> Documenter cause et manifestation ; sinon élargir l’enquête et demander les avis pertinents.</li></ol><p>Les autres causes de splénomégalie et de cytopénies comprennent infections, maladies hématologiques, troubles de production ou de destruction et autres maladies hépatoportales. Une perte digestive ou une carence peut contribuer à l’anémie. Il faut rechercher une cause coexistante lorsque les résultats ne sont pas expliqués par le mécanisme retenu.</p><p>L’EASL 2026 exclut explicitement la schistosomiase de la définition de la maladie vasculaire porto-sinusoïdale (PSVD). « Hypertension portale sans cirrhose » n’est donc pas automatiquement « PSVD ». Les seuils et stratégies conçus pour cirrhose ou PSVD ne deviennent pas des règles HSS par simple analogie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a> ; <a data-reference-source="1" href="https://www.journal-of-hepatology.eu/article/S0168-8278(25)02406-7/fulltext" target="_blank" rel="noopener">EU-EASL-BOUND — EASL 2026 : définition de PSVD et exclusions explicites</a>.</p><p><button class="w" data-k="d77-exp-10">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-d77-10">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="d77-11" ><h2>11. Prise en charge : traiter la cause et les complications</h2><p><b>Urgence hémorragique.</b> Une hématémèse ou un méléna avec retentissement nécessite une filière urgente et une évaluation endoscopique appropriée. Le traitement oral du parasite ou l’augmentation d’un bêtabloquant à domicile ne remplace pas cette prise en charge. Une forme aiguë sévère ou neurologique relève également d’un avis spécialisé.</p><p><b>Infection.</b> Le praziquantel est le traitement de référence dans les sources consultées, avec schéma adapté à l’espèce, au produit et à la personne. La liste Swissmedic du 30 septembre 2026 et les recherches AmiKo n’ont pas fourni d’entrée praziquantel/Biltricide : c’est une constatation datée, sans preuve d’indisponibilité définitive. Le pharmacien et le spécialiste vérifient le produit réellement accessible et, si nécessaire, les conditions légales d’importation. Le RCP français décrit les doses, sans devenir une FI suisse.</p><p><b>Hypertension portale.</b> La prévention d’hémorragie et les traitements endoscopiques sont discutés avec l’hépatologue. Le propranolol dispose d’une indication suisse concernant la prévention des hémorragies digestives hautes avec hypertension portale et varices, hors cirrhose décompensée selon la FI. Le carvédilol suisse consulté n’a pas cette indication ; une préférence issue de la cirrhose ne s’impose pas automatiquement à la HSS.</p><p><b>Interventions.</b> Chirurgie, dérivations ou TIPS peuvent être discutés dans des situations sélectionnées. Les preuves HSS restent hétérogènes et les comparaisons limitées. Une splénectomie n’est pas la réponse automatique à une numération basse ; elle crée notamment des obligations de prévention infectieuse. Les décisions prennent en compte saignements, circulation, fonction, autres maladies et ressources de suivi.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-TX — Consensus espagnol 2022 : traitement, tableau 3 et populations</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/swissmedic/fr/home/services/listen_neu.html" target="_blank" rel="noopener">CH-PRAZI-STATUS — Liste Swissmedic du 30 septembre 2026 et recherches AmiKo</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/swissmedic/fr/home/humanarzneimittel/bewilligungen_zertifikate/autorisation-speciale.html" target="_blank" rel="noopener">CH-IMPORT — Section 2.1, importation humaine selon article 49 OAMéd</a> ; <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680470250018" target="_blank" rel="noopener">FI-PROPRANOLOL — FI suisse de janvier 2023 : indication portale, doses et sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576230013" target="_blank" rel="noopener">FI-CARVEDILOL — FI suisse d’octobre 2023 : indications, populations et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-TX — Revue HSS 2021 : traitements, bêtabloquants, chirurgie et TIPS</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-ASPLEN — Pages 1–2, information et prévention après splénectomie, 2024</a>.</p><p><button class="w" data-k="d77-exp-11">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-d77-11">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="d77-12" ><h2>12. Prévention, suivi et pronostic : un plan à plusieurs horizons</h2><p>Prévenir les nouvelles expositions à l’eau douce contaminée et expliquer que le traitement ne procure pas une immunité contre une réinfection. Organiser le suivi parasitologique et clinique ; le consensus espagnol propose une réévaluation globale vers trois mois, avec modalités adaptées. Une complication impose un contrôle plus tôt, et une sérologie persistante n’est pas à elle seule une indication de retraitement.</p><p>Suivre numérations, symptômes, état hépatoportal et varices selon le plan spécialisé. Une guérison parasitologique ne signifie pas disparition immédiate des collatérales ou d’une fibrose avancée. À l’inverse, certaines lésions peuvent régresser : le pronostic dépend de l’ancienneté, des complications, des réexpositions et des maladies associées.</p><p>Si splénectomie prévue ou asplénie fonctionnelle documentée, prévoir information, vaccinations et plan antibiotique individuel. Le protocole CHUV révisé le 9 septembre 2024 conseille d’anticiper si possible les vaccinations avant une chirurgie élective ; le calendrier et les produits doivent être vérifiés dans les recommandations suisses en vigueur. Une simple splénomégalie ne suffit pas à appliquer le statut d’asplénie.</p><p>Après splénectomie, fièvre, état grippal ou morsure justifient un contact urgent. Le CHUV insiste sur l’absence d’attente nocturne ; si un avis n’est pas accessible rapidement, la réserve antibiotique prescrite dans le plan individuel doit être utilisée selon ce plan, puis l’évaluation poursuivie. Ce cours ne fabrique pas une posologie antibiotique sans FI du produit prescrit.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-FOLLOW — Consensus espagnol 2022 : suivi et retraitement</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-TX — Revue HSS 2021 : traitements, bêtabloquants, chirurgie et TIPS</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-ASPLEN — Pages 1–2, information et prévention après splénectomie, 2024</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-FEVER — Page 3, conduite devant fièvre et plan antibiotique, 2024</a>.</p><p><button class="w" data-k="d77-exp-12">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-d77-12">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="d77-13" ><h2>13. Points clés : ce qui change une décision</h2><ul><li>Une cytopénie et une grande rate appellent une explication ; elles ne constituent pas un diagnostic causal.</li><li>La HSS peut provoquer des varices graves avec une fonction hépatique relativement préservée.</li><li>Les œufs et la réaction tissulaire expliquent la fibrose ; l’imagerie et l’endoscopie décrivent un autre niveau de preuve.</li><li>Une sérologie positive ne suffit pas à démontrer activité, guérison ou fibrose.</li><li>Traiter l’infection n’annule pas le suivi des complications portales.</li><li>Le produit réellement disponible, sa FI/RCP et la population déterminent la prescription.</li><li>D77* décrit une manifestation à relier à la maladie causale ; aucun sous-code D77.x n’est inventé.</li></ul><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe D77, inclusion et usage astérisque</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-TX — Consensus espagnol 2022 : traitement, tableau 3 et populations</a> ; <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a>.</p><p><button class="w" data-k="d77-exp-13">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-d77-13">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="d77-14" ><h2>14. Pièges : raccourcis qui exposent à une erreur</h2><p>Rassurer sur les seules transaminases, attribuer toute anémie à l’hypersplénisme, déduire une guérison de l’absence d’éosinophilie, ou appeler cirrhose toute hypertension portale effacent des mécanismes importants. Un dosage sérologique et une photographie histologique normale ne démontrent pas une infection active ni une fibrose chez la personne examinée.</p><p>Les autres raccourcis à éviter sont la splénectomie motivée uniquement par un chiffre, la transposition d’un traitement de cirrhose sans justification HSS, l’application à l’enfant d’un schéma adulte et la présentation d’un RCP étranger comme FI suisse. La recommandation OMS en santé publique et le RCP d’un produit peuvent différer pour grossesse, allaitement ou âge : la différence doit être attribuée et résolue pour le produit réel.</p><div class="trap"><b>Piège.</b> Ne pas transformer une incertitude de source ou de disponibilité en certitude clinique.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a> ; <a data-reference-source="1" href="https://www.journal-of-hepatology.eu/article/S0168-8278(25)02406-7/fulltext" target="_blank" rel="noopener">EU-EASL-BOUND — EASL 2026 : définition de PSVD et exclusions explicites</a> ; <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240041608" target="_blank" rel="noopener">INT-WHO — OMS 2022, recommandation 4, page xix</a> ; <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a>.</p><p><button class="w" data-k="d77-exp-14">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-d77-14">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="d77-entrainement" ><h2>S’entraîner : quatre décisions et quatre cas</h2><div class="quiz ui"><p>Une fonction hépatique conservée exclut-elle une hémorragie portale grave ?</p><button data-ok="1">Non, la HSS peut associer fonction relativement préservée et varices.</button><button data-ok="0">Oui, elle exclut les varices.</button><p class="fb" hidden>La circulation portale et la fonction hépatocellulaire sont des dimensions distinctes.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a>.</p><div class="quiz ui"><p>Une sérologie positive démontre-t-elle seule l’activité ou l’échec du traitement ?</p><button data-ok="1">Non, elle peut persister et doit être interprétée avec les autres données.</button><button data-ok="0">Oui, elle suffit à imposer une nouvelle dose.</button><p class="fb" hidden>La preuve directe, le calendrier et les réexpositions orientent le suivi.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-FOLLOW — Consensus espagnol 2022 : suivi et retraitement</a>.</p><div class="quiz ui"><p>Le RCP français de Biltricide est-il une FI suisse ?</p><button data-ok="1">Non, sa provenance étrangère et le produit accessible doivent être explicités.</button><button data-ok="0">Oui, il prouve l’autorisation suisse.</button><p class="fb" hidden>Le statut daté, l’accès légal et l’information du produit réel restent à vérifier.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissmedic.ch/swissmedic/fr/home/services/listen_neu.html" target="_blank" rel="noopener">CH-PRAZI-STATUS — Liste Swissmedic du 30 septembre 2026 et recherches AmiKo</a>.</p><div class="quiz ui"><p>Toute thrombocytopénie avec grosse rate impose-t-elle une splénectomie ?</p><button data-ok="1">Non, il faut caractériser mécanismes, complications et alternatives.</button><button data-ok="0">Oui, le chiffre suffit.</button><p class="fb" hidden>Les décisions HSS sont spécialisées ; la splénectomie crée notamment un risque infectieux durable.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-TX — Revue HSS 2021 : traitements, bêtabloquants, chirurgie et TIPS</a>.</p><p><button class="w" data-k="d77-cas-1">Cas 1</button> <button class="w" data-k="d77-cas-2">Cas 2</button> <button class="w" data-k="d77-cas-3">Cas 3</button> <button class="w" data-k="d77-cas-4">Cas 4</button></p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Situations cliniques pertinentes, liste SSP 2017</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction et exigences de l’examen fédéral 2026</a>.</p></section>
</div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="d77-e-blood" ><h2>Numération : compter, comparer et expliquer</h2><p>Une numération décrit des concentrations sanguines. Il faut garder la date, les unités, les références du laboratoire, les lignées atteintes et leur évolution. Une baisse simultanée de plaquettes et de leucocytes dans un contexte de grande rate est compatible avec un retentissement splénique ; elle ne démontre pas à elle seule une destruction ni une infection active.</p><p>Le support HUG du 9 septembre 2019 donne, pour l’adulte, des repères d’hémoglobine de 140–180 g/L chez l’homme et 120–160 g/L chez la femme, de leucocytes de 4–11 G/L et de plaquettes de 150–350 G/L. Ce sont des <b>exemples pédagogiques datés</b>, sans remplacement des références du laboratoire, ni extrapolation à l’enfant ou à la grossesse. Ils ne constituent pas des seuils de transfusion, de geste ou d’hospitalisation.</p><p>Une anémie peut refléter saignement, carence, production diminuée ou autres mécanismes associés. Le frottis et les investigations complémentaires suivent la question clinique ; une ponction médullaire ne se décide pas du seul mot « hypersplénisme ». Une discordance entre mécanisme présumé et trajectoire sanguine justifie une réévaluation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">CH-HUG-LAB — Diapositive 3, repères adultes de numération, 2019</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a>.</p></section>
<section class="ilot" id="d77-e-parasite" ><h2>Parasitologie : présence, activité et site</h2><p>La recherche d’œufs dans les selles ou les urines dépend de l’espèce et du tableau. L’observation directe permet une identification morphologique, mais sa sensibilité peut être faible. Selon la suspicion, un prélèvement négatif appelle des examens répétés ou spécialisés, choisis avec le laboratoire. Les modalités de recueil ne sont pas interchangeables entre un site intestinal et un site urogénital.</p><p>La sérologie apporte une information d’exposition, avec des limites chez les personnes anciennement exposées ou traitées. Elle ne sépare pas toujours infection active et ancienne, et ne prouve pas la guérison. PCR ou recherche d’antigènes sont des outils de centres spécialisés dont disponibilité et interprétation doivent être précisées.</p><figure data-d77-figure="egg"><div data-d77-frame="wide"><img src="assets/img/d77/alpha/codex/Schistosoma_mansoni_egg_4841_lores.jpg" alt="Photomicrographie d’un œuf de Schistosoma mansoni avec éperon latéral" loading="lazy"><span data-d77-mark="1" aria-hidden="true">1</span><span data-d77-mark="2" aria-hidden="true">2</span><span data-d77-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Éperon latéral attribué à S. mansoni par la provenance.</li><li>Corps de l’œuf, objet observé en microscopie.</li><li>Contour de l’œuf ; aucune taille calculée sans échelle calibrée.</li></ol><p>Cette image montre un œuf, sans démontrer sa viabilité, une fibrose splénique ou le degré d’hypertension portale. Source américaine utilisée uniquement pour la figure, sans recommandation clinique américaine.</p><p data-d77-credit>CDC, photomicrographie humaine institutionnelle, PHIL 4841, 1979 ; auteur individuel non renseigné · <a href="https://commons.wikimedia.org/wiki/File:Schistosoma_mansoni_egg_4841_lores.jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://commons.wikimedia.org/wiki/Template:PD-USGov-HHS-CDC" target="_blank" rel="noopener">Domaine public — œuvre fédérale américaine</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Dans le cas suisse RMS 2018, des œufs et miracidiums urinaires ont documenté une schistosomiase urinaire. Ce cas ne démontre pas une fibrose splénique chez toute personne avec hématurie. Son traitement répété à 28 jours ne devient pas un calendrier universel.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2018/revue-medicale-suisse-605/diagnostic-de-schistosomiase-urinaire-par-l-identification-de-miracidiums-de-schistosoma-haematobium" target="_blank" rel="noopener">CH-RMS-DX — Résumé, diagnostic et limites du cas urinaire, 2018</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-FOLLOW — Consensus espagnol 2022 : suivi et retraitement</a>.</p></section>
<section class="ilot" id="d77-e-portal" ><h2>Imagerie et endoscopie : organes et complications</h2><p>L’échographie-Doppler étudie foie, rate, fibrose périportale, veines, direction des flux et collatérales. L’opérateur doit connaître la question HSS ; l’absence d’une image typique n’exclut pas toutes les formes, en particulier chez l’enfant. Une anatomie normale illustrée dans les sciences ne remplace pas cet examen.</p><p>L’endoscopie établit la présence et le grade des varices. Les indices associant numération plaquettaire et taille splénique ont été étudiés dans des séries hétérogènes ; leurs seuils ne sont pas enseignés comme méthode universelle d’exclusion. Une fonction hépatique conservée ne supprime pas le risque de varices.</p><p>Une exploration invasive est discutée si son résultat peut changer le diagnostic ou les soins et si son risque est acceptable. Il n’existe pas ici d’instruction de biopsier systématiquement une rate volumineuse. Les critères de cirrhose ou de PSVD demandent leur propre contexte ; l’EASL 2026 exclut la schistosomiase de la définition de PSVD.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a> ; <a data-reference-source="1" href="https://www.journal-of-hepatology.eu/article/S0168-8278(25)02406-7/fulltext" target="_blank" rel="noopener">EU-EASL-BOUND — EASL 2026 : définition de PSVD et exclusions explicites</a>.</p></section>
<section class="ilot" id="d77-e-plan" ><h2>Interprétation et suivi : rendre les incertitudes utiles</h2><p>La conclusion doit préciser ce qui est documenté : exposition, preuve parasitaire, manifestations hépatoportales, profil hématologique et complications. Il faut aussi écrire ce qui reste incertain, ce qui sera contrôlé et par qui. Un seul test ne prouve pas tous ces niveaux.</p><p>Après traitement, interpréter les résultats avec le calendrier, la viabilité éventuelle des œufs, les symptômes, l’imagerie et les réexpositions. La sérologie peut persister et l’éosinophilie n’est pas un marqueur de guérison suffisant. Le consensus espagnol 2022 propose une réévaluation globale vers trois mois ; le suivi des varices et des symptômes peut imposer d’autres délais. Une aggravation ne doit pas attendre cette échéance.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-FOLLOW — Consensus espagnol 2022 : suivi et retraitement</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-TX — Revue HSS 2021 : traitements, bêtabloquants, chirurgie et TIPS</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2018/revue-medicale-suisse-605/diagnostic-de-schistosomiase-urinaire-par-l-identification-de-miracidiums-de-schistosoma-haematobium" target="_blank" rel="noopener">CH-RMS-DX — Résumé, diagnostic et limites du cas urinaire, 2018</a>.</p></section>
</div></div>

<div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="d77-tab-semio" role="tab" data-s="d77-s-semio" aria-controls="d77-s-semio" aria-selected="true">Sémiologie fondamentale et analytique</button><button id="d77-tab-anat" role="tab" data-s="d77-s-anat" aria-controls="d77-s-anat" aria-selected="false">Anatomie</button><button id="d77-tab-histo" role="tab" data-s="d77-s-histo" aria-controls="d77-s-histo" aria-selected="false">Histologie</button><button id="d77-tab-physio" role="tab" data-s="d77-s-physio" aria-controls="d77-s-physio" aria-selected="false">Physiologie</button><button id="d77-tab-bio" role="tab" data-s="d77-s-bio" aria-controls="d77-s-bio" aria-selected="false">Biochimie</button><button id="d77-tab-immuno" role="tab" data-s="d77-s-immuno" aria-controls="d77-s-immuno" aria-selected="false">Immunologie et physiopathologie</button></div><div class="chap-body sci-body"><div class="sci" id="d77-s-semio" role="tabpanel" aria-labelledby="d77-tab-semio"><section class="ilot" id="d77-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>La rate normale est un organe lymphoïde secondaire et un filtre du sang. Sa pulpe rouge participe au traitement des éléments sanguins ; sa pulpe blanche organise des réponses immunitaires. La moelle rouge produit les cellules sanguines. Volume splénique, concentration des cellules dans le sang et production médullaire décrivent donc des dimensions différentes.</p><p>La normalité d’un résultat dépend de la population, de la méthode et du laboratoire. Les repères adultes du support HUG 2019 sont attribués dans les examens ; ils ne sont ni des seuils universels de geste ni des valeurs pédiatriques. Une fonction hépatique conservée n’est pas un certificat de pression portale normale.</p><figure data-d77-figure="spleen"><div data-d77-frame="wide"><img src="assets/img/d77/alpha/codex/Gray1188.png" alt="Planche historique de la face viscérale de la rate humaine normale" loading="lazy"><span data-d77-mark="1" aria-hidden="true">1</span><span data-d77-mark="2" aria-hidden="true">2</span><span data-d77-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Surface gastrique : relation anatomique normale.</li><li>Hile et vaisseaux : passage du pédicule splénique.</li><li>Surface colique : rapport avec le côlon.</li></ol><p>Planche anatomique normale, sans cas de fibrose. Une surface normale situe un organe ; elle ne mesure ni congestion ni fonction immunitaire.</p><p data-d77-credit>Henry Vandyke Carter / Henry Gray, Anatomy of the Human Body, 1918, planche 1188 · <a href="https://commons.wikimedia.org/wiki/File:Gray1188.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">NORMAL-SPLEEN — OpenStax 21.1 : moelle, rate et organes lymphoïdes normaux</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-1-an-overview-of-blood" target="_blank" rel="noopener">NORMAL-BLOOD — OpenStax 18.1 : constituants et fonctions du sang normal</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">CH-HUG-LAB — Diapositive 3, repères adultes de numération, 2019</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a>.</p></section>
<section class="ilot" id="d77-semio-signs" data-semiology="signs"><h3>Signes, symptômes et regroupements</h3><p>Pesanteur de l’hypocondre gauche peuvent orienter vers une grande rate, mais ne sont pas spécifiques. Une rate augmentée à l’imagerie est une observation anatomique. Thrombocytopénie ou leucopénie sont des résultats analytiques ; le mot hypersplénisme relie leur interprétation à la rate dans un contexte cohérent, sans expliquer automatiquement toute anémie.</p><p>Hématémèse ou méléna suggèrent un saignement digestif à évaluer rapidement. Hématurie terminale oriente vers une atteinte urogénitale ; fièvre et manifestations après exposition orientent aussi vers une forme aiguë. Ces profils peuvent coexister. L’absence d’ascite, de plainte ou d’éosinophilie n’annule pas une infection ou une complication portale.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2018/revue-medicale-suisse-605/diagnostic-de-schistosomiase-urinaire-par-l-identification-de-miracidiums-de-schistosoma-haematobium" target="_blank" rel="noopener">CH-RMS-DX — Résumé, diagnostic et limites du cas urinaire, 2018</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a>.</p></section>
<section class="ilot" id="d77-semio-mechanisms" data-semiology="mechanisms"><h3>Du mécanisme au signe</h3><p>Les œufs retenus dans les tissus déclenchent une réponse inflammatoire et peuvent conduire à une fibrose périportale. L’obstacle présinusoïdal modifie la circulation portale, favorisant splénomégalie, collatérales et varices. Des varices peuvent donc apparaître avant une insuffisance hépatocellulaire importante ; cette dissociation explique pourquoi des enzymes peu perturbées ne rassurent pas seules.</p><p>Les mécanismes exacts des cytopénies de HSS ne sont pas entièrement réglés. Stase, séquestration et autres processus peuvent contribuer ; il faut éviter une causalité unique de destruction immune. Une anémie peut aussi résulter d’une perte digestive ou de carences, et une anomalie médullaire coexistante reste possible. Une hypothèse devient utile lorsqu’elle explique la trajectoire et résiste aux données discordantes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a>.</p></section>
<section class="ilot" id="d77-semio-examination" data-semiology="examination"><h3>Recueillir et mesurer les données</h3><p>Recueillir exposition à l’eau douce, lieux et dates, traitements passés, réexpositions, saignements et symptômes d’autres organes. Vérifier médicaments, grossesse, allaitement et antécédents de splénectomie. L’examen commence par l’état circulatoire et le retentissement, puis décrit foie, rate, abdomen et signes associés.</p><p>La numération compte les lignées ; la parasitologie recherche l’agent ; la sérologie informe sur l’exposition ; le Doppler explore circulation et organes ; l’endoscopie voit les varices. Chaque examen répond à une question. Conserver unités et références permet de comparer des contrôles ; une photographie d’œuf ou de rate normale demeure un support d’apprentissage et ne devient pas un résultat individuel.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">CH-HUG-LAB — Diapositive 3, repères adultes de numération, 2019</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a>.</p></section>
<section class="ilot" id="d77-semio-interpretation" data-semiology="interpretation"><h3>Interpréter la concordance et la discordance</h3><p>La concordance entre exposition compatible, preuve parasitaire et atteinte hépatoportale renforce une conclusion causale. Une sérologie seule, surtout après exposition ancienne, ne suffit pas à prouver une infection active ; une recherche d’œufs négative unique ne l’exclut pas avec certitude. Une fonction hépatique préservée peut coexister avec des varices.</p><p>Les rapports plaquettes/taille splénique proposés dans des cohortes ne sont pas des règles universelles pour éviter l’endoscopie. Une thrombocytopénie disproportionnée, une évolution inattendue ou des signes non expliqués obligent à rouvrir l’enquête. L’interprétation doit nommer ce qui est certain, probable ou encore indéterminé et associer chaque incertitude à un contrôle pertinent.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a>.</p></section>
<section class="ilot" id="d77-semio-differentials" data-semiology="differentials"><h3>Différentiels et erreurs de catégorie</h3><p>Une grosse rate et des numérations basses peuvent accompagner d’autres infections, des maladies hématologiques ou d’autres atteintes hépatoportales. Une anémie peut combiner pertes digestives, carence et mécanismes de distribution ou de production. La présence d’une schistosomiase n’interdit pas une seconde maladie.</p><p>Fibrose splénique, fibrose périportale, cirrhose, splénomégalie et asplénie ne sont pas des synonymes. L’EASL 2026 exclut explicitement la schistosomiase de la définition de PSVD. Le raisonnement doit donc précéder l’étiquette et le code. D77* n’est pas une catégorie automatique pour toute cytopénie secondaire ; sa relation à la maladie causale doit être documentée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe D77, inclusion et usage astérisque</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://www.journal-of-hepatology.eu/article/S0168-8278(25)02406-7/fulltext" target="_blank" rel="noopener">EU-EASL-BOUND — EASL 2026 : définition de PSVD et exclusions explicites</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-ASPLEN — Pages 1–2, information et prévention après splénectomie, 2024</a>.</p></section>
<section class="ilot" id="d77-semio-urgency" data-semiology="urgency"><h3>Urgence : le signe qui change la séquence</h3><p>Hématémèse, méléna avec retentissement, malaise ou altération circulatoire imposent une filière urgente. On ne retarde pas les soins pour compléter un codage ou un bilan de sérologie. Le propranolol peut masquer une tachycardie de perte sanguine ; pression, conscience et perfusion gardent leur importance.</p><p>Une suspicion de forme aiguë sévère ou neurologique nécessite un avis spécialisé avant de recopier un schéma chronique. Après splénectomie ou en asplénie fonctionnelle documentée, une fièvre ou un état grippal est urgent : le plan écrit et l’antibiotique de réserve prescrit s’inscrivent dans cette prise en charge, sans remplacer l’évaluation. Une simple splénomégalie ne définit pas cette situation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-TX — Consensus espagnol 2022 : traitement, tableau 3 et populations</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680470250018" target="_blank" rel="noopener">FI-PROPRANOLOL — FI suisse de janvier 2023 : indication portale, doses et sécurité</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-FEVER — Page 3, conduite devant fièvre et plan antibiotique, 2024</a>.</p></section>
<section class="ilot" id="d77-semio-limits" data-semiology="limits"><h3>Limites, populations et prudence causale</h3><p>Les études d’interventions HSS sont hétérogènes, souvent limitées et sélectionnées. Les seuils de cirrhose et les stratégies de PSVD ne s’appliquent pas par simple ressemblance. Chez l’enfant, les manifestations portales et les images peuvent différer ; les doses et conditions d’usage doivent suivre le produit et la population.</p><p>Le bilan Swissmedic daté et les recherches AmiKo n’ont pas fourni de FI suisse de praziquantel ; cela ne prouve pas une indisponibilité définitive. Le RCP français 2024 et l’OMS 2022 diffèrent notamment pour l’allaitement et la grossesse. Ces limites sont attribuées dans la pharmacologie et doivent être résolues pour le produit réellement accessible. Une auto-relecture IA n’est pas une validation humaine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/swissmedic/fr/home/services/listen_neu.html" target="_blank" rel="noopener">CH-PRAZI-STATUS — Liste Swissmedic du 30 septembre 2026 et recherches AmiKo</a> ; <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a> ; <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240041608" target="_blank" rel="noopener">INT-WHO — OMS 2022, recommandation 4, page xix</a>.</p></section>
<section class="ilot" id="d77-semio-sources" data-semiology="sources"><h3>Sources et décisions attribuées</h3><p>Le cadre suisse associe la nomenclature OFS, le support HUG daté pour les repères de numération, le cas RMS pour la preuve urinaire et le protocole CHUV 2024 pour la prévention après splénectomie. Les FI exactes de Propranolol Zentiva (janvier 2023) et Carvedilol Spirig HC (octobre 2023) limitent indications, doses et populations. Swissmedic documente le statut daté et les règles d’importation.</p><p>Le consensus espagnol 2022 guide l’enquête parasitaire et le suivi ; la revue HSS 2021 précise mécanismes et limites des interventions. Le passage EASL 2026 lu concerne la définition de PSVD, sans prétendre valider tous ses traitements pour HSS. Le RCP français de Biltricide du 30 mai 2024 est clairement étranger. Les sections réellement lues, paraphrases, dates et limites figurent dans le ledger ; aucune lecture intégrale ou recommandation américaine n’est prétendue.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe D77, inclusion et usage astérisque</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">CH-HUG-LAB — Diapositive 3, repères adultes de numération, 2019</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2018/revue-medicale-suisse-605/diagnostic-de-schistosomiase-urinaire-par-l-identification-de-miracidiums-de-schistosoma-haematobium" target="_blank" rel="noopener">CH-RMS-DX — Résumé, diagnostic et limites du cas urinaire, 2018</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-ASPLEN — Pages 1–2, information et prévention après splénectomie, 2024</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680470250018" target="_blank" rel="noopener">FI-PROPRANOLOL — FI suisse de janvier 2023 : indication portale, doses et sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576230013" target="_blank" rel="noopener">FI-CARVEDILOL — FI suisse d’octobre 2023 : indications, populations et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a> ; <a data-reference-source="1" href="https://www.journal-of-hepatology.eu/article/S0168-8278(25)02406-7/fulltext" target="_blank" rel="noopener">EU-EASL-BOUND — EASL 2026 : définition de PSVD et exclusions explicites</a> ; <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a>.</p></section>
<section class="ilot" id="d77-semio-bridge" ><h3>De la sémiologie à la décision</h3><p><b>Science → clinique.</b> Décrire séparément volume, numération, circulation et infection avant de proposer une cause.</p><p><b>Science → examen.</b> Choisir ce qui vérifie le mécanisme ou une complication, et expliquer les négativités non excluantes.</p><p><b>Science → traitement.</b> L’urgence et la cause documentée déterminent les soins ; un code ou une cytopénie ne prescrit pas une splénectomie.</p><div class="key"><b>À retenir.</b> Relier signe, mécanisme, mesure et décision sans effacer les limites.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-TX — Revue HSS 2021 : traitements, bêtabloquants, chirurgie et TIPS</a>.</p></section>
</div><div class="sci" id="d77-s-anat" role="tabpanel" aria-labelledby="d77-tab-anat" hidden><section class="ilot" id="d77-s-anat-content" ><h2>Anatomie : deux organes reliés par une circulation</h2><p>La rate est un organe lymphoïde secondaire associé à la circulation sanguine. Son pédicule au hile permet l’entrée et la sortie des vaisseaux. Sa position et ses surfaces expliquent ses rapports avec estomac, rein et côlon ; une pesanteur abdominale n’identifie cependant pas à elle seule l’organe responsable.</p><p>Le système porte recueille le drainage veineux de la rate et d’une partie importante du tube digestif. Il conduit ce sang vers les sinusoïdes hépatiques ; les veines hépatiques rejoignent ensuite la circulation cave. Le foie reçoit aussi du sang par l’artère hépatique. Le système porte met donc en série des territoires capillaires, et non une simple artère alimentant directement la rate.</p><figure data-d77-figure="portal"><div data-d77-frame="tall"><img src="assets/img/d77/alpha/codex/Gray591-Portal_vein.png" alt="Planche humaine du système porte, veine splénique et affluents digestifs" loading="lazy"><span data-d77-mark="1" aria-hidden="true">1</span><span data-d77-mark="2" aria-hidden="true">2</span><span data-d77-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Tronc porte montant vers le foie.</li><li>Trajet de la veine splénique depuis la rate.</li><li>Affluents mésentériques : drainage digestif vers le système porte.</li></ol><p>Schéma normal, sans mesure de pression, de débit ou de fibrose. La couleur sert à repérer les veines, sans représenter une obstruction réelle.</p><p data-d77-credit>Jmarchn, adaptation humaine de Gray 591, 19 juin 2023 · <a href="https://commons.wikimedia.org/wiki/File:Gray591-Portal_vein.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Cette organisation permet de comprendre une hypertension portale dont le mécanisme se situe dans les espaces périportaux. Une rate volumineuse peut refléter ce problème circulatoire sans que la cause première soit une maladie isolée de la rate. Les collatérales créent d’autres voies de drainage ; les varices digestives constituent une complication à rechercher avec un outil approprié.</p><p><b>Science → clinique.</b> Associer grande rate et signes digestifs fait rechercher le territoire portal. Une fonction hépatique encore conservée ne supprime pas cette relation anatomique.</p><p><b>Science → examen.</b> Le Doppler étudie les vaisseaux et les flux ; l’endoscopie voit les varices. Une planche normale situe les trajets mais ne mesure pas la pression d’une personne.</p><p><b>Science → traitement.</b> Traiter uniquement l’infection ou uniquement une numération ne répond pas à toutes les complications circulatoires. Les interventions de dérivation ou sur la rate demandent une analyse anatomique et spécialisée.</p><div class="key"><b>À retenir.</b> La rate et le foie doivent être interprétés dans le même réseau, avec des fonctions distinctes.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways" target="_blank" rel="noopener">NORMAL-PORTAL — OpenStax 20.5 : système porte hépatique normal</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">NORMAL-SPLEEN — OpenStax 21.1 : moelle, rate et organes lymphoïdes normaux</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-TX — Revue HSS 2021 : traitements, bêtabloquants, chirurgie et TIPS</a>.</p></section>
</div><div class="sci" id="d77-s-histo" role="tabpanel" aria-labelledby="d77-tab-histo" hidden><section class="ilot" id="d77-s-histo-content" ><h2>Histologie : pulpe normale et réaction tissulaire</h2><p>La rate normale associe pulpe rouge et pulpe blanche. La pulpe rouge est liée à la filtration du sang et au traitement des éléments sanguins ; la pulpe blanche contient des territoires lymphoïdes participant aux réponses adaptatives. La photographie humaine H&E présentée ici distingue un follicule secondaire, une artériole, une gaine périartériolaire et la pulpe rouge selon sa légende originale.</p><p>Une coloration histologique montre une organisation et des structures dans un prélèvement limité. Elle ne mesure pas directement la pression portale, la production médullaire ou la qualité d’une réponse vaccinale. L’image normale ne démontre ni granulome ni fibrose de schistosomiase. Les repères ajoutés accompagnent les flèches originales ; ils ne créent pas une lésion.</p><figure data-d77-figure="histo"><div data-d77-frame="tall"><img src="assets/img/d77/alpha/codex/Milz_Mensch.jpg" alt="Histologie H&amp;E de rate humaine normale, pulpe blanche et rouge, numéros originaux conservés" loading="lazy"><span data-d77-mark="1" aria-hidden="true">1</span><span data-d77-mark="2" aria-hidden="true">2</span><span data-d77-mark="3" aria-hidden="true">3</span><span data-d77-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Follicule lymphoïde secondaire de pulpe blanche, numéro 1 de l’original.</li><li>Artériole centrale, numéro 2 de l’original.</li><li>Gaine lymphoïde périartériolaire (PALS), numéro 3 de l’original.</li><li>Pulpe rouge, numéro 4 de l’original.</li></ol><p>Les quatre flèches bleues originales sont conservées ; les repères HTML et la légende française les accompagnent. Tissu humain normal, sans granulome ou fibrose de schistosomiase démontrés. La coloration ne permet pas d’identifier ici chaque cellule immunitaire.</p><p da
