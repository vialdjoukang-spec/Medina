<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="e02-e-1"><h2><span class="n">e-1</span>Hiérarchie des examens</h2>
<p>La question posée choisit l’examen. Confirmer une hypothyroïdie infraclinique, attribuer l’anomalie à l’iode et décider du traitement sont trois questions différentes, et aucun test unique ne répond aux trois. Pour la confirmation, la <b>référence</b> est la répétition de la <button class="w" data-k="e02-tsh">TSH</button> et de la <button class="w" data-k="e02-t4">T4</button> libre à deux ou trois mois (<button class="w" data-k="e02-s-eta">ETA</button> 2013). Pour l’attribution à la carence, il n’existe pas de test de référence individuel : aucun test de référence individuel validé n’est présenté dans ces sources et la décision repose sur un faisceau d’arguments.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Question</th><th style="min-width:10em">Examen</th><th style="min-width:10em">Statut</th></tr></thead><tbody><tr><td style="min-width:10em">L’<button class="w" data-k="e02-hic">HIC</button> existe-t-elle ?</td><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> et <button class="w" data-k="e02-t4">T4</button> libre, répétées à 6–12 semaines ou 2–3 mois chez l’adulte stable hors grossesse</td><td style="min-width:10em">Indiqué : examen de confirmation</td></tr><tr><td style="min-width:10em">L’origine est-elle auto-immune ?</td><td style="min-width:10em">Anticorps anti-<button class="w" data-k="e02-antitpo">TPO</button> (anti-thyroglobuline si <button class="w" data-k="e02-antitpo">anti-TPO</button> négatifs et suspicion persistante selon <button class="w" data-k="e02-s-has">HAS</button>)</td><td style="min-width:10em">Indiqué lors du contrôle</td></tr><tr><td style="min-width:10em">Existe-t-il un goitre ou un nodule ?</td><td style="min-width:10em">Échographie thyroïdienne</td><td style="min-width:10em">Conditionnel : goitre ou autre indication</td></tr><tr><td style="min-width:10em">L’apport en iode est-il insuffisant ?</td><td style="min-width:10em">Anamnèse alimentaire et composition du supplément ; <button class="w" data-k="e02-iodurie">iodurie</button> (population)</td><td style="min-width:10em">Anamnèse indiquée ; iodurie non diagnostique chez l’individu</td></tr><tr><td style="min-width:10em">La glande est-elle stimulée ?</td><td style="min-width:10em"><button class="w" data-k="e02-tg">Thyroglobuline</button></td><td style="min-width:10em">Non systématique ; marqueur de population</td></tr><tr><td style="min-width:10em">Une cause concurrente existe-t-elle ?</td><td style="min-width:10em">Revue des médicaments, prise de biotine, cortisol selon le contexte</td><td style="min-width:10em">Indiqué si le contexte l’évoque</td></tr></tbody></table>
<p>Le tableau classe les examens par utilité décisionnelle. Les deux premières lignes structurent l’évaluation d’une <button class="w" data-k="e02-hic">HIC</button> persistante ; les anticorps ne sont pas à redoser systématiquement s’ils sont déjà positifs ; les autres répondent à une suspicion précise. L’échographie, en particulier, ne remplace pas l’anamnèse : un aspect hypoéchogène ou hétérogène oriente vers l’auto-immunité, mais l’absence d’anomalie n’exclut rien.</p>
</section>

<section class="ilot" id="e02-e-2"><h2><span class="n">e-2</span><button class="w" data-k="e02-tsh">TSH</button> et <button class="w" data-k="e02-t4">T4</button> libre : fiche d’interprétation</h2>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Élément</th><th style="min-width:10em">Valeur ou règle</th><th style="min-width:10em">Population et source</th></tr></thead><tbody><tr><td style="min-width:10em">Intervalle de référence de la <button class="w" data-k="e02-tsh">TSH</button></td><td style="min-width:10em">0,4 à 4,0 mU/L</td><td style="min-width:10em">Adulte, <button class="w" data-k="e02-s-eta">ETA</button> 2013 ; le laboratoire fait foi</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-hic">HIC</button> légère</td><td style="min-width:10em">4,0 à 10,0 mU/L avec <button class="w" data-k="e02-t4">T4</button> libre normale</td><td style="min-width:10em">Adulte non enceinte</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-hic">HIC</button> sévère</td><td style="min-width:10em">Plus de 10 mU/L avec <button class="w" data-k="e02-t4">T4</button> libre normale</td><td style="min-width:10em">Adulte non enceinte</td></tr><tr><td style="min-width:10em">Enfant</td><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> supérieure à la limite propre à l’âge et à la méthode, avec <button class="w" data-k="e02-t4">T4</button> libre normale</td><td style="min-width:10em"><button class="w" data-k="e02-s-eta">ETA</button> 2014, section pédiatrique</td></tr><tr><td style="min-width:10em">Grossesse</td><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> au-dessus de l’intervalle propre à la grossesse</td><td style="min-width:10em"><button class="w" data-k="e02-s-has">HAS</button> 2022 et <button class="w" data-k="e02-s-rcog">RCOG</button> 2025 ; norme de trimestre et de méthode, ou limite pragmatique 4,0 mU/L</td></tr><tr><td style="min-width:10em">Sujet de plus de 80 ans</td><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> de 4,0 à 7,0 mU/L parfois physiologique</td><td style="min-width:10em"><button class="w" data-k="e02-s-eta">ETA</button> 2013</td></tr></tbody></table>
<p>Ces valeurs situent une concentration ; elles ne remplacent pas le jugement sur la répétition du dosage. La <button class="w" data-k="e02-tsh">TSH</button> est environ 30 % plus haute le soir et la nuit ; le « point de consigne » individuel de la <button class="w" data-k="e02-tsh">TSH</button> n’occupe qu’environ un tiers de l’intervalle de référence, de sorte qu’une valeur dans l’intervalle peut déjà être anormale pour la personne. Une élévation légère isolée chez l’adulte stable hors grossesse se contrôle dans des conditions comparables. Une valeur dans la norme ne devient pas pathologique sur la seule notion de point de consigne, et une hypothyroïdie sévère pendant la grossesse ne doit pas attendre un délai de routine.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Traiter à partir d’une seule <button class="w" data-k="e02-tsh">TSH</button>. La fonction se normalise spontanément chez 6 à 35 % des patients ; une confirmation adaptée au contexte réduit le risque de traitement inutile ; les situations gravidiques sévères suivent un délai plus court.</div>
</section>

<section class="ilot" id="e02-e-3"><h2><span class="n">e-3</span>Marqueurs du statut iodé</h2>
<p>Plusieurs marqueurs sont décrits par l’<button class="w" data-k="e02-s-oms">OMS</button>. Tous mesurent une <b>population</b>, ce qui limite leur usage au chevet.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Marqueur</th><th style="min-width:10em">Ce qu’il reflète</th><th style="min-width:10em">Limite</th></tr></thead><tbody><tr><td style="min-width:10em"><button class="w" data-k="e02-iodurie">Iodurie</button></td><td style="min-width:10em">Apport récent (environ 90 % de l’iode alimentaire part dans l’urine en 24 heures)</td><td style="min-width:10em">Valeur ponctuelle inutilisable pour un individu ; dépend de la dilution urinaire</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-tg">Thyroglobuline</button></td><td style="min-width:10em">Apport des mois ou années précédents ; réagit rapidement</td><td style="min-width:10em">S’élève aussi en cas d’excès d’iode ; intervalle de référence de l’écolier iodé en sang séché : 4 à 40 µg/L</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-tsh-neo">TSH néonatale</button></td><td style="min-width:10em">Suffisance iodée de la population</td><td style="min-width:10em">Fausse par la povidone iodée appliquée à la mère ou au nouveau-né</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> de l’adulte et de l’écolier</td><td style="min-width:10em">Mauvais marqueur : différences faibles, chevauchement important</td><td style="min-width:10em">Non recommandée dans les enquêtes</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-t4">T4</button> et T3</td><td style="min-width:10em">Moins sensibles que la thyroglobuline</td><td style="min-width:10em">Non recommandées pour suivre le statut iodé</td></tr></tbody></table>
<p>Le tableau explique pourquoi la <button class="w" data-k="e02-tsh">TSH</button> élevée ne sert pas de test de carence chez la patiente : elle s’élève aussi dans la thyroïdite. L’<button class="w" data-k="e02-seuils-iodurie">échelle des seuils d’iodurie médiane (carence légère à excès)</button> classe des groupes. Chez les femmes enceintes suisses, une médiane de 97 µg/L, inférieure au seuil de 150 µg/L, signale un statut collectif insuffisant ; elle ne désigne aucune patiente en particulier.</p>
<p>Le calcul de la baisse suisse rend la comparaison concrète : de 140 µg/L en 2015 à 97 µg/L en 2020–2022, la médiane perd 43 µg/L, soit <b>43 ÷ 140 ≈ 0,31</b>, c’est-à-dire environ 30 %. L’<button class="w" data-k="e02-calc-baisse">arithmétique de cette baisse (formule et lecture)</button> exige de conserver la même méthode de mesure dans les deux enquêtes.</p>
</section>

<section class="ilot" id="e02-e-4"><h2><span class="n">e-4</span>Pièges préanalytiques et analytiques</h2>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Piège</th><th style="min-width:10em">Mécanisme</th><th style="min-width:10em">Parade</th></tr></thead><tbody><tr><td style="min-width:10em">Heure du prélèvement</td><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> plus haute le soir et la nuit</td><td style="min-width:10em">Répéter à la même heure du jour</td></tr><tr><td style="min-width:10em">Biotine</td><td style="min-width:10em">Interfère avec les immunodosages thyroïdiens ; résultat faussement bas ou élevé</td><td style="min-width:10em">Interroger sur la prise, informer le laboratoire et contrôler par une méthode adaptée ; un éventuel arrêt se décide selon le produit et le laboratoire</td></tr><tr><td style="min-width:10em">Insuffisance surrénalienne non traitée</td><td style="min-width:10em">Peut élever la <button class="w" data-k="e02-tsh">TSH</button></td><td style="min-width:10em">Juger l’<button class="w" data-k="e02-hic">HIC</button> au moins quatre semaines après substitution adéquate</td></tr><tr><td style="min-width:10em">Exposition récente à l’iode</td><td style="min-width:10em">Produit de contraste ou médicament iodé fausse l’iodurie</td><td style="min-width:10em">Exclure ce contexte avant d’interpréter</td></tr><tr><td style="min-width:10em">Travail de nuit, sommeil irrégulier, exercice intense</td><td style="min-width:10em">Déplacent la <button class="w" data-k="e02-tsh">TSH</button></td><td style="min-width:10em">Standardiser les conditions</td></tr><tr><td style="min-width:10em">Povidone iodée chez la mère ou le nouveau-né</td><td style="min-width:10em">Fausse la <button class="w" data-k="e02-tsh">TSH</button> néonatale</td><td style="min-width:10em">Noter l’antisepsie utilisée</td></tr></tbody></table>
<div class="key"><b>À retenir.</b> Une <button class="w" data-k="e02-tsh">TSH</button> discordante avec la clinique se discute avant de se traiter : heure, biotine, surrénale et médicaments font partie des explications à rechercher, sans classement de fréquence non démontré.</div>
</section>

<section class="ilot" id="e02-e-5"><h2><span class="n">e-5</span>Diagnostics et profils biologiques</h2>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Diagnostic</th><th style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button></th><th style="min-width:10em"><button class="w" data-k="e02-t4">T4</button> libre</th><th style="min-width:10em"><button class="w" data-k="e02-antitpo">Anti-TPO</button></th><th style="min-width:10em">Contexte</th></tr></thead><tbody><tr><td style="min-width:10em">E02 (<button class="w" data-k="e02-hic">HIC</button> par carence en iode)</td><td style="min-width:10em">Élevée</td><td style="min-width:10em">Normale</td><td style="min-width:10em">Négatifs ou positifs si cause auto-immune associée</td><td style="min-width:10em">Apport insuffisant ou besoins accrus</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-hic">HIC</button> auto-immune</td><td style="min-width:10em">Élevée</td><td style="min-width:10em">Normale</td><td style="min-width:10em">Positifs ou anti-Tg positifs</td><td style="min-width:10em">Échographie hypoéchogène</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-hic">HIC</button> transitoire</td><td style="min-width:10em">Élevée puis normale</td><td style="min-width:10em">Normale</td><td style="min-width:10em">Variable</td><td style="min-width:10em">Thyroïdite subaiguë, convalescence, arrêt de lévothyroxine</td></tr><tr><td style="min-width:10em">Hypothyroïdie manifeste par carence (E01.8)</td><td style="min-width:10em">Élevée</td><td style="min-width:10em">Basse</td><td style="min-width:10em">Variable</td><td style="min-width:10em">Carence plus profonde ou chronique</td></tr><tr><td style="min-width:10em">Hypothyroxinémie isolée de la grossesse</td><td style="min-width:10em">Normale</td><td style="min-width:10em">Basse (sous le 2,5e centile gravidique)</td><td style="min-width:10em">Variable</td><td style="min-width:10em">Peut relever d’une carence iodée</td></tr></tbody></table>
<p>La lecture se fait par colonnes : la <button class="w" data-k="e02-tsh">TSH</button> et la <button class="w" data-k="e02-t4">T4</button> libre définissent le cadre, les anticorps et le contexte départagent les causes. <button class="w" data-k="e02-tsh">TSH</button> et <button class="w" data-k="e02-t4">T4</button> libre définissent le profil ; les anticorps et l’histoire orientent la cause. Des anticorps négatifs ne suffisent pas à affirmer E02, et leur positivité n’exclut pas un apport insuffisant associé. La classification doit suivre l’attribution clinique documentée.</p>
</section>

<section class="ilot" id="e02-e-6"><h2><span class="n">e-6</span>Cas cliniques</h2>
<p>Les quatre cas ci-dessous mobilisent la confirmation, l’attribution, la décision et les pièges analytiques. Les valeurs sont pédagogiques.</p>
<div class="quiz ui"><p><b>Cas 1.</b> Une femme de 31 ans prépare une grossesse, <button class="w" data-k="e02-tsh">TSH</button> 5,8 mU/L et <button class="w" data-k="e02-t4">T4</button> libre normale. Elle a peu de sources alimentaires d’iode. Quelle suite est la plus adaptée ?</p><button data-ok="0">A. Attendre systématiquement trois mois et ne discuter lévothyroxine que si la TSH dépasse 10.</button><button data-ok="1">B. Organiser une confirmation et un avis adaptés au projet de conception, rechercher les causes, corriger les apports et discuter lévothyroxine préconceptionnelle.</button><button data-ok="0">C. Affirmer une carence sur le régime et prescrire de l’iode seul.</button><p class="fb" hidden>Réponse B. Le <button class="w" data-k="e02-s-rcog">RCOG</button> 2025 propose de considérer lévothyroxine avant conception pour une <button class="w" data-k="e02-hic">HIC</button>, surtout avec <button class="w" data-k="e02-antitpo">anti-TPO</button> déjà positifs ; la <button class="w" data-k="e02-s-has">HAS</button> précise des parcours de grossesse et d’infertilité. Le délai ordinaire de l’adulte stable ne s’applique pas automatiquement. Corriger les apports ne doit pas retarder une substitution indiquée, et le régime ne prouve pas seul la cause.</p></div>
<div class="quiz ui"><p><b>Cas 2.</b> Une patiente a une iodurie ponctuelle de 90 µg/L. Que peut-on en conclure sur son statut iodé individuel ?</p><button data-ok="0">A. Qu’elle est en carence, puisque 90 µg/L est inférieur à 100 µg/L.</button><button data-ok="1">B. Pas de diagnostic individuel stable à partir de cette valeur : les seuils classent des médianes de populations ; la répétition sur de nombreux jours est une méthode de recherche, pas une prescription de routine ; le RCOG 2025 déconseille les urines ponctuelles ou de 24 heures pour classer une femme enceinte individuellement.</button><button data-ok="0">C. Qu’elle est en excès, car l’iodurie reflète l’apport des mois précédents.</button><p class="fb" hidden>Réponse B. L’iodurie reflète l’apport récent (environ 90 % de l’iode part dans l’urine en 24 heures) et dépend de la dilution urinaire. Les seuils de l’OMS portent sur la médiane d’un groupe. L’option C confond l’iodurie, marqueur du récent, avec la thyroglobuline, qui reflète des mois.</p></div>
<div class="quiz ui"><p><b>Cas 3.</b> Un homme de 48 ans a deux <button class="w" data-k="e02-tsh">TSH</button> à 12 mU/L, une <button class="w" data-k="e02-t4">T4</button> libre normale et des <button class="w" data-k="e02-antitpo">anti-TPO</button> positifs. Il ne mange ni laitages ni poisson, mais utilise du sel iodé. Que retenir ?</p><button data-ok="0">A. E02 : le régime explique tout et l’iode suffit.</button><button data-ok="1">B. HIC sévère, très probablement auto-immune ; le traitement par lévothyroxine est recommandé avant 65 à 70 ans même sans symptôme.</button><button data-ok="0">C. Attentisme, car toutes les HIC se surveillent.</button><p class="fb" hidden>Réponse B. Les <button class="w" data-k="e02-antitpo">anti-TPO</button> positifs orientent vers une thyroïdite auto-immune, cause persistante la plus fréquente, que l’iode ne guérit pas. La <button class="w" data-k="e02-tsh">TSH</button> dépasse 10 mU/L : l’<button class="w" data-k="e02-s-eta">ETA</button> recommande le traitement avant 65 à 70 ans (recommandation 13). L’usage de sel iodé ne garantit pas à lui seul un apport total suffisant ; une cause nutritionnelle associée reste à évaluer.</p></div>
<div class="quiz ui"><p><b>Cas 4.</b> Une patiente prend de la biotine. Sa <button class="w" data-k="e02-tsh">TSH</button> est incohérente avec une <button class="w" data-k="e02-t4">T4</button> libre normale et l’absence de symptôme. Quelle est la démarche ?</p><button data-ok="1">A. Suspecter une interférence analytique, interroger sur la biotine et informer le laboratoire et contrôler par une méthode adaptée ; un éventuel arrêt se décide selon le produit et le laboratoire.</button><button data-ok="0">B. Débuter la lévothyroxine selon la valeur mesurée.</button><button data-ok="0">C. Doser l’iodurie pour confirmer la carence.</button><p class="fb" hidden>Réponse A. La biotine interfère avec les immunodosages thyroïdiens et peut fausser le résultat vers le bas ou vers le haut. Traiter une valeur possiblement artefactuelle expose à un traitement inutile ; l’iodurie ne règle pas la question analytique.</p></div>
<div class="key"><b>À retenir.</b> Un examen se choisit pour la question posée. La <button class="w" data-k="e02-tsh">TSH</button> se confirme, les anticorps départagent l’origine, l’iodurie décrit une population, et l’interférence se cherche avant de traiter.</div>
<button class="pareto-btn ui" data-k="pareto-e02-examens">▲ Loi de Pareto — Examens complémentaires</button>
</section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>
<div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="e02-tab-semio" role="tab" aria-selected="true" aria-controls="e02-s-semio" data-s="e02-s-semio">Sémiologie fondamentale et analytique</button><button id="e02-tab-anat" role="tab" aria-selected="false" aria-controls="e02-s-anat" data-s="e02-s-anat">Anatomie</button><button id="e02-tab-histo" role="tab" aria-selected="false" aria-controls="e02-s-histo" data-s="e02-s-histo">Histologie</button><button role="tab" aria-selected="false" aria-controls="e02-s-phys" data-s="e02-s-phys"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M6 12h12M12 6v12"/></svg>Physiologie</button><button role="tab" aria-selected="false" aria-controls="e02-s-bioch" data-s="e02-s-bioch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M6 12h12M12 6v12"/></svg>Biochimie</button><button role="tab" aria-selected="false" aria-controls="e02-s-sante" data-s="e02-s-sante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M6 12h12M12 6v12"/></svg>Santé publique</button></div><div class="chap-body sci-body"><div class="sci" id="e02-s-semio" role="tabpanel" aria-labelledby="e02-tab-semio"><section class="ilot" id="e02-s-semio-intro"><h2>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h2><p>Elle relie les plaintes et les signes au profil hormonal, à l’étiologie et au délai d’action. La question n’est pas de reconnaître un visage « typique », mais de confirmer une anomalie sans attribuer abusivement sa cause à l’iode.</p></section><section class="ilot" id="e02-semio-normal"><h3 data-semiology="normal">Normalité utile : fonction, structure et normes</h3><p>La thyroïde se situe en avant de la trachée, sous le larynx ; deux lobes sont réunis par un isthme. Les follicules organisent la synthèse et le stockage des hormones sur la thyroglobuline. L’iode est un substrat indispensable, tandis que la <button class="w" data-k="e02-tsh">TSH</button> est un signal de régulation. Une glande de taille normale peut fonctionner normalement ou présenter une anomalie biologique discrète : la morphologie et la fonction ne sont pas interchangeables.</p><p>La référence de <button class="w" data-k="e02-tsh">TSH</button> dépend de la population, de l’âge, de la grossesse et de la méthode. Chez l’adulte non enceinte, l’<button class="w" data-k="e02-s-eta">ETA</button> décrit habituellement 0,4–4,0 mU/L, mais le laboratoire et le contexte clinique commandent l’interprétation. Une <button class="w" data-k="e02-t4">T4</button> libre normale avec une <button class="w" data-k="e02-tsh">TSH</button> élevée persistante définit l’<button class="w" data-k="e02-hic">HIC</button>. Elle ne prouve pas que tous les tissus manquent d’hormone, ni que l’iode est la cause.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">OpenStax §17.4, anatomie et régulation</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS, définitions et populations</a>.</p></section><section class="ilot" id="e02-semio-signs"><h3 data-semiology="signs">Symptômes et signes : préciser la plainte</h3><p>Fatigue, frilosité, constipation, peau sèche, crampes ou faiblesse, troubles de mémoire et modification de la voix sont rapportés dans les études d’<button class="w" data-k="e02-hic">HIC</button>. Les écarts entre personnes euthyroïdiennes et <button class="w" data-k="e02-hic">HIC</button> sont souvent modestes ; certains travaux ne retrouvent qu’une différence de fatigue. « Infraclinique » qualifie donc la biologie et ne garantit pas une absence de plainte. Inversement, ces plaintes fréquentes ne suffisent pas au diagnostic.</p><p>L’anamnèse précise début, progression, circonstances, retentissement et symptômes associés. Une modification après une infection ou un changement de traitement oriente autrement qu’une anomalie stable depuis des années. Une augmentation cervicale doit être décrite séparément de la fatigue : elle informe sur la structure, et ne prouve pas le déficit hormonal. L’absence de goitre ou de symptôme n’exclut pas une anomalie persistante de <button class="w" data-k="e02-tsh">TSH</button>.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3923601/" target="_blank" rel="noopener">ETA 2013, symptômes et causes transitoires</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS, démarche diagnostique</a>.</p></section><section class="ilot" id="e02-semio-mechanisms"><h3 data-semiology="mechanisms">Relier le mécanisme au signe sans le surinterpréter</h3><p>Si l’iode disponible limite la synthèse, la régulation peut augmenter la stimulation thyroïdienne et maintenir encore la <button class="w" data-k="e02-t4">T4</button> dans sa norme. Le couple <button class="w" data-k="e02-tsh">TSH</button> élevée–<button class="w" data-k="e02-t4">T4</button> libre normale devient alors compatible avec une adaptation. Cependant, dans la carence légère, la <button class="w" data-k="e02-tsh">TSH</button> et la <button class="w" data-k="e02-t4">T4</button> peuvent rester normales : une chaîne « manque d’iode → <button class="w" data-k="e02-tsh">TSH</button> forcément élevée » serait fausse. Une thyroïdite peut produire le même couple biologique en réduisant la capacité de la glande.</p><p>Les hormones thyroïdiennes participent au métabolisme énergétique et à la thermogenèse. Cela rend une frilosité ou une fatigue biologiquement compréhensible dans une hypothyroïdie, sans autoriser à attribuer chaque plainte d’<button class="w" data-k="e02-hic">HIC</button> à ce mécanisme. La différence entre plausibilité et preuve est illustrée par TRUST : la <button class="w" data-k="e02-tsh">TSH</button> baisse sous traitement, sans bénéfice symptomatique moyen chez les personnes âgées étudiées.</p><figure><svg viewBox="0 0 600 150" role="img" aria-label="Un mécanisme plausible ne prouve pas la cause" style="width:100%;height:auto"><rect x="10" y="15" width="260" height="70" rx="8" fill="#f4f7f7" stroke="#222"/><rect x="330" y="15" width="260" height="70" rx="8" fill="#f4f7f7" stroke="#222"/><path d="M275 50h45m-10-7 10 7-10 7" fill="none" stroke="#222" stroke-width="2"/><text x="140" y="53" text-anchor="middle" fill="#111" font-size="22">Profil biologique</text><text x="460" y="53" text-anchor="middle" fill="#111" font-size="22">Contexte et évolution</text><text x="300" y="125" text-anchor="middle" fill="#111" font-size="21">Un mécanisme plausible ne prouve pas la cause</text></svg><figcaption>Schéma logique, non anatomique. Un mécanisme plausible ne prouve pas la cause. Les flèches indiquent le raisonnement, pas une probabilité chiffrée.</figcaption></figure><p class="src">Sources : <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Paediatrica 2020, adaptation selon degré de carence</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">FI Euthyrox, mécanisme</a> ; <a href="https://doi.org/10.1056/NEJMoa1603825" target="_blank" rel="noopener">TRUST, résumé</a>.</p></section><section class="ilot" id="e02-semio-examination"><h3 data-semiology="examination">Technique clinique et conditions de mesure</h3><p>Observer le cou en position normale puis en extension, palper les lobes de part et d’autre de la trachée et apprécier la taille, la consistance et la présence de nodules. La déglutition aide à repérer l’ascension thyroïdienne. Les grades OMS 0, 1 et 2 décrivent respectivement l’absence de goitre détecté, le goitre palpable non visible et le goitre visible en position habituelle. Les formes discrètes sont sujettes aux variations entre examinateurs.</p><p>Pour le prélèvement, noter l’heure et les circonstances, les résultats précédents, une maladie récente et les produits contenant de la biotine. La variation circadienne de <button class="w" data-k="e02-tsh">TSH</button> justifie des prélèvements comparables. La FI demande d’informer le laboratoire et de choisir si possible une méthode non sensible à la biotine ; elle ne donne pas un délai universel d’arrêt. Une interruption se décide avec les professionnels, selon la dose et le dosage utilisé.</p><p class="src">Sources : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS 2007, §4.3.1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3923601/" target="_blank" rel="noopener">ETA, investigation</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">FI, interférences</a>.</p></section><section class="ilot" id="e02-semio-interpretation"><h3 data-semiology="interpretation">Valeur d’un résultat et limites de l’absence</h3><p>Une <button class="w" data-k="e02-tsh">TSH</button> isolée légèrement élevée ne suffit pas à conclure à une maladie durable. Chez l’adulte stable hors grossesse, les sources proposent un contrôle à 6–12 semaines ou à 2–3 mois selon le référentiel. Une <button class="w" data-k="e02-t4">T4</button> libre basse fait rechercher une hypothyroïdie manifeste ; une suspicion hypophysaire impose <button class="w" data-k="e02-tsh">TSH</button> et <button class="w" data-k="e02-t4">T4</button> libre d’emblée, car la <button class="w" data-k="e02-tsh">TSH</button> seule peut être trompeuse. Les délais ordinaires ne sont pas appliqués mécaniquement à la grossesse ou au nourrisson.</p><p>Les <button class="w" data-k="e02-antitpo">anti-TPO</button> positifs soutiennent l’auto-immunité ; leur négativité ne l’exclut pas et ne prouve pas une carence. Une iodurie ponctuelle basse renseigne sur l’échantillon, pas sur un diagnostic individuel stable. Les seuils OMS comparent des médianes de populations. Le <button class="w" data-k="e02-s-rcog">RCOG</button> déconseille l’usage d’urines ponctuelles ou de 24 heures pour déterminer le statut iodé individuel pendant la grossesse. Aucun score clinique ou rapport de vraisemblance validé propre à E02 n’est inventé.</p><p class="src">Sources : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS, diagnostic</a> ; <a href="https://obgyn.onlinelibrary.wiley.com/doi/full/10.1111/1471-0528.18088" target="_blank" rel="noopener">RCOG, iode et tests</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3923601/" target="_blank" rel="noopener">ETA, anticorps</a>.</p></section><section class="ilot" id="e02-semio-differentials"><h3 data-semiology="differentials">Distinguer les causes concurrentes</h3><p>Le premier différentiel persistant est l’auto-immunité, explorée par les anticorps et, si indication morphologique, l’échographie. Une thyroïdite transitoire ou une convalescence se reconnaît notamment par le contexte et l’évolution. Le lithium et l’amiodarone peuvent modifier la fonction ; leur présence n’autorise pas leur arrêt sans discussion. Une insuffisance surrénalienne non traitée peut élever la <button class="w" data-k="e02-tsh">TSH</button> et modifie surtout la sécurité d’une substitution.</p><p>L’âge avancé, l’obésité et les rythmes de sommeil modifient aussi l’interprétation. Une <button class="w" data-k="e02-t4">T4</button> libre basse avec <button class="w" data-k="e02-tsh">TSH</button> normale en grossesse relève d’une hypothyroxinémie isolée à vérifier selon la méthode ; hors grossesse, une discordance peut justifier la recherche d’une cause centrale. Plusieurs mécanismes peuvent coexister : anticorps positifs et apports faibles ne sont pas des diagnostics mutuellement exclusifs.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3923601/" target="_blank" rel="noopener">ETA, diagnostic</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS, causes et discordances</a> ; <a href="https://obgyn.onlinelibrary.wiley.com/doi/full/10.1111/1471-0528.18088" target="_blank" rel="noopener">RCOG, hypothyroxinémie</a>.</p></section><section class="ilot" id="e02-semio-urgency"><h3 data-semiology="urgency">Priorité temporelle et sécurité</h3><p>Les sources consultées ne définissent pas une urgence vitale propre à une <button class="w" data-k="e02-hic">HIC</button> iodoprive stable. Elles imposent néanmoins de ne pas banaliser une grossesse avec <button class="w" data-k="e02-tsh">TSH</button> très élevée ou une <button class="w" data-k="e02-t4">T4</button> basse : le <button class="w" data-k="e02-s-rcog">RCOG</button> recommande de traiter rapidement les formes sévères gravidiques et les hypothyroïdies manifestes. Un projet de conception exige un calendrier actif, pas un contrôle lointain appliqué par habitude.</p><p>Avant lévothyroxine, une insuffisance surrénalienne non traitée est une contre-indication : les glucocorticoïdes doivent être instaurés d’abord. Une cardiopathie impose la lecture des contre-indications exactes et une prise en charge adaptée, pas seulement une dose réduite. Des signes graves discordants avec une simple <button class="w" data-k="e02-hic">HIC</button> demandent une évaluation de leur cause ; aucun protocole de coma ou dose d’urgence non documenté n’est créé dans cette leçon.</p><p class="src">Sources : <a href="https://obgyn.onlinelibrary.wiley.com/doi/full/10.1111/1471-0528.18088" target="_blank" rel="noopener">RCOG §7</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">FI Euthyrox, contre-indications et précautions</a>.</p></section><section class="ilot" id="e02-semio-limits"><h3 data-semiology="limits">Applicabilité suisse et populations particulières</h3><p>Le contexte nutritionnel vient de l’<button class="w" data-k="e02-s-osav">OSAV</button> et des études suisses ; les seuils cliniques européens sont identifiés comme tels. L’<button class="w" data-k="e02-ofsp">évaluation des technologies de la santé</button> suisse de 2022 ne fournit ni un test de carence ni une obligation de rembourser ou de refuser un traitement. La FI Euthyrox régit le produit exact ; une recommandation d’<button class="w" data-k="e02-hic">HIC</button> décide de la pertinence clinique, question différente. Leurs différences de dose, d’espacement et de suivi restent visibles.</p><p>Chez l’enfant, les normes sont liées à l’âge et les taux de normalisation diffèrent selon l’étiologie. Chez la personne âgée, une élévation modeste peut relever de la distribution normale ; le risque de surtraitement compte. Pendant la grossesse, les références de dosage, le trimestre, la conception et le postpartum changent l’algorithme. Aucune de ces populations ne reçoit automatiquement les seuils de l’adulte jeune non enceinte.</p><p class="src">Sources : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS, populations particulières</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4109520/" target="_blank" rel="noopener">ETA 2014, enfance</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">FI Euthyrox</a>.</p></section><section class="ilot" id="e02-semio-sources"><h3 data-semiology="sources">Passages qui fondent le raisonnement</h3><p>La normalité anatomique et la synthèse sont reliées à OpenStax §17.4 ; la technique de palpation et les grades au guide OMS §4.3.1 ; les symptômes, la variabilité et les causes aux sections diagnostiques de l’<button class="w" data-k="e02-s-eta">ETA</button> 2013. Paediatrica 2020 décrit l’adaptation carentielle et les particularités infantiles. La <button class="w" data-k="e02-s-has">HAS</button> 2022 précise diagnostic, suivi, âge et grossesse ; le <button class="w" data-k="e02-s-rcog">RCOG</button> 2025 précise la préconception et les décisions gravidiques. La correction de mai 2026 a été contrôlée et ne change pas les recommandations d’<button class="w" data-k="e02-hic">HIC</button>.</p><p>La FI suisse d’Euthyrox, mise à jour février 2023 et relue le 2 novembre 2026, étaye les contre-indications, interactions et effets indésirables. PROFILES 2017 comporte l’inspection/palpation de la thyroïde, le goitre et les hormones thyroïdiennes anormales : les vignettes de cette leçon travaillent ces compétences sans prétendre être des questions officielles ni une correspondance CIM fédérale publiée. Les lectures et empreintes sont conservées dans le dossier de sources ; l’auto-relecture ne vaut pas validation médicale humaine.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">OpenStax §17.4</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS 2007</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3923601/" target="_blank" rel="noopener">ETA 2013</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Paediatrica 2020</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS 2022</a> ; <a href="https://obgyn.onlinelibrary.wiley.com/doi/full/10.1111/1471-0528.18088" target="_blank" rel="noopener">RCOG 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">FI Euthyrox</a> ; <a href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">PROFILES 2017</a>.</p></section><div class="key"><b>Science → clinique.</b> Un symptôme non spécifique demande une description avant une attribution.</div><div class="key"><b>Science → examen.</b> Les normes, la répétition et la méthode conditionnent la conclusion.</div><div class="key"><b>Science → traitement.</b> La grossesse, le bénéfice attendu et les risques orientent la décision.</div><div class="key"><b>À retenir.</b> Décrire les symptômes, confirmer le profil et argumenter la cause sont trois étapes distinctes ; le contexte fixe le délai.</div><button class="pareto-btn ui" data-k="pareto-e02-semio">▲ Loi de Pareto — Sémiologie</button></div><div class="sci" id="e02-s-anat" role="tabpanel" aria-labelledby="e02-tab-anat" hidden><section class="ilot" id="e02-s-anat-cours"><h2>Anatomie : ce que l’examen du cou peut montrer</h2><p>Les deux lobes thyroïdiens encadrent la trachée ; l’isthme les relie en avant. La position sous le larynx explique les repères de l’inspection et de la palpation. La vue postérieure distingue les parathyroïdes, dont la proximité ne signifie pas qu’elles assurent la synthèse des hormones thyroïdiennes. Le goitre décrit une augmentation de volume ; il ne renseigne pas seul sur le statut hormonal.</p><figure><div style="position:relative;max-width:420px;margin:0 auto"><img loading="lazy" src="assets/img/e02/alpha/codex/e02-thyroide-normale-openstax2013.jpg" width="737" height="1410" alt="Thyroïde humaine normale : vues antérieure et postérieure, puis micrographie folliculaire ; repères 1 isthme, 2 parathyroïdes, 3 colloïde." style="display:block;width:100%;height:auto"><span role="img" aria-label="Repère 1 : isthme" style="position:absolute;left:47.5%;top:17%;transform:translate(-50%,-50%);background:#fff;color:#111;border:2px solid #111;border-radius:50%;width:1.6em;height:1.6em;line-height:1.4em;text-align:center;font-size:14px;font-weight:700">1</span><span role="img" aria-label="Repère 2 : parathyroïde" style="position:absolute;left:57%;top:50.9%;transform:translate(-50%,-50%);background:#fff;color:#111;border:2px solid #111;border-radius:50%;width:1.6em;height:1.6em;line-height:1.4em;text-align:center;font-size:14px;font-weight:700">2</span><span role="img" aria-label="Repère 3 : colloïde" style="position:absolute;left:49%;top:85%;transform:translate(-50%,-50%);background:#fff;color:#111;border:2px solid #111;border-radius:50%;width:1.6em;height:1.6em;line-height:1.4em;text-align:center;font-size:14px;font-weight:700">3</span></div><figcaption>Figure anatomique — Normal avant pathologique. 1 : isthme ; 2 : région des parathyroïdes en vue postérieure ; 3 : colloïde folliculaire. Original OpenStax College, Connexions, 19 juin 2013 ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">version originale sur Commons</a>, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>. La micrographie est créditée à University of Michigan Medical School dans la figure source. Fichier original inchangé ; repères en surimpression ajoutés. La licence de cette version ne se déduit pas de celle du manuel actuel.</figcaption></figure><p>Les repères en surimpression désignent l’isthme, la région parathyroïdienne et la colloïde d’un follicule. La figure est une illustration anatomique humaine publiée en 2013 et une micrographie réelle, pas une représentation générée d’une thyroïde « E02 ». Un tel diagnostic ne possède pas ici une apparence anatomique univoque démontrée. La normalité est montrée pour comprendre la localisation de l’examen, pas pour affirmer une lésion chez le patient.</p><p>Une glande augmentée peut accompagner une carence chronique ou une maladie auto-immune ; une glande non augmentée peut présenter une <button class="w" data-k="e02-hic">HIC</button>. La distinction entre taille, structure et fonction évite de demander une échographie uniquement parce que la <button class="w" data-k="e02-tsh">TSH</button> est élevée. L’<button class="w" data-k="e02-s-eta">ETA</button> ne recommande pas l’échographie systématique en l’absence d’une indication telle qu’un goitre. Un nodule palpable doit être évalué selon la démarche nodulaire appropriée ; E02 ne suffit pas à en prédire la nature.</p><div class="key"><b>Science → clinique.</b> La découverte d’une augmentation cervicale oriente l’examen morphologique, sans prouver la cause iodée.</div><div class="key"><b>Science → examen.</b> La palpation est limitée dans les petites augmentations ; une échographie répond à une indication clinique.</div><div class="key"><b>Science → traitement.</b> Une substitution se décide sur la fonction et le contexte ; l’augmentation de taille ne justifie pas à elle seule une dose suppressive.</div><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">OpenStax §17.4, anatomie</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, palpation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3923601/" target="_blank" rel="noopener">ETA, imagerie</a>.</p><div class="key"><b>À retenir.</b> La taille ne détermine pas la fonction ; l’examen morphologique ne prouve pas une carence iodée.</div><button class="pareto-btn ui" data-k="pareto-e02-anat">▲ Loi de Pareto — Anatomie</button></section></div><div class="sci" id="e02-s-histo" role="tabpanel" aria-labelledby="e02-tab-histo" hidden><section class="ilot" id="e02-s-histo-cours"><h2>Histologie : le follicule et ses limites diagnostiques</h2><p>Le tissu thyroïdien est organisé en follicules. Leur épithélium entoure une cavité contenant la colloïde, dans laquelle la thyroglobuline sert de support et de réserve pour les hormones. Sur la micrographie originale ci-dessous, la colloïde apparaît rosée et les noyaux des cellules folliculaires dessinent une bordure plus sombre. L’image montre une organisation normale, sans preuve de carence chez une personne donnée.</p><figure><div style="position:relative;max-width:420px;margin:0 auto"><img loading="lazy" src="assets/img/e02/alpha/codex/e02-thyroide-normale-openstax2013.jpg" width="737" height="1410" alt="Thyroïde humaine normale : vues antérieure et postérieure, puis micrographie folliculaire ; repères 1 isthme, 2 parathyroïdes, 3 colloïde." style="display:block;width:100%;height:auto"><span role="img" aria-label="Repère 1 : isthme" style="position:absolute;left:47.5%;top:17%;transform:translate(-50%,-50%);background:#fff;color:#111;border:2px solid #111;border-radius:50%;width:1.6em;height:1.6em;line-height:1.4em;text-align:center;font-size:14px;font-weight:700">1</span><span role="img" aria-label="Repère 2 : parathyroïde" style="position:absolute;left:57%;top:50.9%;transform:translate(-50%,-50%);background:#fff;color:#111;border:2px solid #111;border-radius:50%;width:1.6em;height:1.6em;line-height:1.4em;text-align:center;font-size:14px;font-weight:700">2</span><span role="img" aria-label="Repère 3 : colloïde" style="position:absolute;left:49%;top:85%;transform:translate(-50%,-50%);background:#fff;color:#111;border:2px solid #111;border-radius:50%;width:1.6em;height:1.6em;line-height:1.4em;text-align:center;font-size:14px;font-weight:700">3</span></div><figcaption>Figure histologique — Normal avant pathologique. 1 : isthme ; 2 : région des parathyroïdes en vue postérieure ; 3 : colloïde folliculaire. Original OpenStax College, Connexions, 19 juin 2013 ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">version originale sur Commons</a>, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>. La micrographie est créditée à University of Michigan Medical School dans la figure source. Fichier original inchangé ; repères en surimpression ajoutés. La licence de cette version ne se déduit pas de celle du manuel actuel.</figcaption></figure><p>Les cellules folliculaires produisent la thyroglobuline, participent à l’incorporation de l’iode et reprennent la colloïde avant libération des hormones. La présence d’une réserve explique que la disponibilité alimentaire récente et la fonction hormonale ne varient pas à l’identique à chaque instant. Les cellules parafolliculaires visibles sur la figure ne doivent pas être confondues avec cet épithélium ; elles produisent la calcitonine, qui ne sert pas à diagnostiquer une carence iodée.</p><p>La stimulation chronique peut s’accompagner d’hyperplasie et d’augmentation de volume. Cela ne constitue pas une signature histologique unique de E02. Une ponction ou une biopsie n’est pas recommandée pour confirmer une <button class="w" data-k="e02-hic">HIC</button> nutritionnelle isolée ; la démarche repose sur la biologie, les causes et les apports. Une lésion nodulaire répond à une autre question, et ne transforme pas la thyroglobuline sanguine en test individuel de carence.</p><div class="key"><b>Science → clinique.</b> Une même compensation biologique peut accompagner des architectures différentes.</div><div class="key"><b>Science → examen.</b> Ni une photographie normale ni un marqueur folliculaire ne confirme la causalité nutritionnelle individuelle.</div><div class="key"><b>Science → traitement.</b> L’iode fournit un substrat ; la lévothyroxine fournit l’hormone. Leur indication n’est pas décidée par une image histologique isolée.</div><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">OpenStax §17.4, follicules et synthèse</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Paediatrica, adaptation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3923601/" target="_blank" rel="noopener">ETA, examens</a>.</p><div class="key"><b>À retenir.</b> Le follicule relie synthèse et stockage ; une image normale ou un marqueur folliculaire ne diagnostique pas E02.</div><button class="pareto-btn ui" data-k="pareto-e02-histo">▲ Loi de Pareto — Histologie</button></section></div><div class="sci" id="e02-s-phys" hidden><section class="ilot" id="e02-s-phys-cours"><h2>Physiologie de l’adaptation à la carence en iode</h2>
<p>Le principe est celui d’une boucle de régulation. Quand la thyroxine circulante diminue, l’hypophyse sécrète davantage de <button class="w" data-k="e02-tsh">TSH</button>, et cette hormone stimule la glande. Le système vise à maintenir la concentration de <button class="w" data-k="e02-t4">T4</button> dans l’intervalle de référence. La <button class="w" data-k="e02-tsh">TSH</button> élevée de E02 est donc la <b>variable ajustée</b>, la <button class="w" data-k="e02-t4">T4</button> la <b>variable protégée</b>.</p>
<p><b>Le stock et le flux.</b> L’enfant et l’adulte stockent l’iode dans la thyroïde ; cette réserve couvre les périodes de faible apport. Le flux, lui, traverse l’organisme vite : environ 90 % de l’iode alimentaire est excrété en 24 heures. Le nourrisson naît avec des réserves minimales, suffisantes pour quelques jours seulement ; il dépend ensuite du lait maternel ou des préparations. La glande mammaire concentre l’iode grâce au <button class="w" data-k="e02-nis">symporteur sodium/iodure (NIS)</button>.</p>
<p><b>Les ajustements.</b> La carence prolongée augmente la captation d’iode, le rapport T3/<button class="w" data-k="e02-t4">T4</button> sécrété et la conversion périphérique de <button class="w" data-k="e02-t4">T4</button> en T3. Il en résulte une <button class="w" data-k="e02-t4">T4</button> sérique plus basse et une T3 plus haute que dans une population iodée. Les sources lues ne donnent pas la raison moléculaire de ce déplacement ; le cours se limite au constat.</p>
<figure><svg viewBox="0 0 600 150" role="img" aria-label="Viser un apport adapté, pas le maximum" style="width:100%;height:auto"><rect x="10" y="15" width="260" height="70" rx="8" fill="#f4f7f7" stroke="#222"/><rect x="330" y="15" width="260" height="70" rx="8" fill="#f4f7f7" stroke="#222"/><path d="M275 50h45m-10-7 10 7-10 7" fill="none" stroke="#222" stroke-width="2"/><text x="140" y="53" text-anchor="middle" fill="#111" font-size="22">Carence ou excès</text><text x="460" y="53" text-anchor="middle" fill="#111" font-size="22">Risque de dysfonction</text><text x="300" y="125" text-anchor="middle" fill="#111" font-size="21">Viser un apport adapté, pas le maximum</text></svg><figcaption>Schéma logique, non anatomique. Viser un apport adapté, pas le maximum. Les flèches indiquent le raisonnement, pas une probabilité chiffrée.</figcaption></figure><p class="src">Relation qualitative décrite dans Paediatrica 2020 ; aucun optimum individuel ni risque numérique n’est dessiné.</p>
<p><b>Grossesse et nouveau-né.</b> Les besoins de la femme enceinte montent avec la production hormonale maternelle et la captation d’iode par le fœtus, le placenta et le liquide amniotique. Chez le nouveau-né, le stock thyroïdien est faible et le renouvellement élevé : la glande réclame une stimulation accrue, d’où l’hyperthyrotropinémie transitoire des premières semaines.</p>
<div class="key"><b>Science → clinique.</b> Un système qui protège la <button class="w" data-k="e02-t4">T4</button> au prix de la <button class="w" data-k="e02-tsh">TSH</button> explique l’infraclinique : les symptômes peuvent être absents ou peu spécifiques, même si la compensation biologique persiste.</div>
<div class="key"><b>Science → examen.</b> La <button class="w" data-k="e02-tsh">TSH</button> néonatale, sensible au renouvellement élevé du nouveau-né, devient un marqueur de population ; la <button class="w" data-k="e02-tsh">TSH</button> de l’adulte, protégée par le stock, ne l’est pas.</div>
<div class="key"><b>Science → traitement.</b> La relation en U impose de corriger la carence sans viser l’excès : l’objectif est la plage autour de 150 µg/j, non un maximum.</div>
<div class="key"><b>À retenir.</b> Une carence légère peut laisser <button class="w" data-k="e02-tsh">TSH</button> et <button class="w" data-k="e02-t4">T4</button> normales ; une <button class="w" data-k="e02-hic">HIC</button> iodoprive est une situation possible, pas une étape obligatoire de toute carence.</div>
<p>Le rétrocontrôle négatif relie hypothalamus, hypophyse et thyroïde : les hormones circulantes participent à freiner la stimulation. La <button class="w" data-k="e02-tsh">TSH</button> peut donc amplifier une petite variation autour du point de consigne individuel. Cette sensibilité en fait un outil de diagnostic fonctionnel, sans la transformer en indicateur spécifique des apports iodés. Une anomalie des structures centrales exige une autre lecture du couple <button class="w" data-k="e02-tsh">TSH</button>–<button class="w" data-k="e02-t4">T4</button> libre.</p><figure><svg viewBox="0 0 600 150" role="img" aria-label="La population change le sens du résultat" style="width:100%;height:auto"><rect x="10" y="15" width="260" height="70" rx="8" fill="#f4f7f7" stroke="#222"/><rect x="330" y="15" width="260" height="70" rx="8" fill="#f4f7f7" stroke="#222"/><path d="M275 50h45m-10-7 10 7-10 7" fill="none" stroke="#222" stroke-width="2"/><text x="140" y="53" text-anchor="middle" fill="#111" font-size="22">T4 libre et TSH</text><text x="460" y="53" text-anchor="middle" fill="#111" font-size="22">Référence adaptée</text><text x="300" y="125" text-anchor="middle" fill="#111" font-size="21">La population change le sens du résultat</text></svg><figcaption>Schéma logique, non anatomique. La population change le sens du résultat. Les flèches indiquent le raisonnement, pas une probabilité chiffrée.</figcaption></figure><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">OpenStax, rétrocontrôle</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS, hypothyroïdie centrale et normes</a>.</p><button class="pareto-btn ui" data-k="pareto-e02-sphys">▲ Loi de Pareto — Physiologie</button>
</section></div><div class="sci" id="e02-s-bioch" hidden><section class="ilot" id="e02-s-bioch-cours"><h2>Biochimie de la synthèse hormonale et des marqueurs</h2>
<p>L’iode est le substrat indispensable de la <button class="w" data-k="e02-t4">T4</button> et de la T3. Sans lui, la glande ne peut pas fabriquer d’hormone, quelle que soit la stimulation de la <button class="w" data-k="e02-tsh">TSH</button>. La <button class="w" data-k="e02-tg">thyroglobuline</button> est la protéine folliculaire sur laquelle les hormones sont synthétisées : elle sert de support à cette synthèse. Son taux sanguin est bas quand l’apport est suffisant, et s’élève quand l’hyperplasie stimulée augmente la thyroglobuline sérique.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Molécule</th><th style="min-width:10em">Rôle</th><th style="min-width:10em">Lecture en carence</th></tr></thead><tbody><tr><td style="min-width:10em">Iode</td><td style="min-width:10em">Substrat de la <button class="w" data-k="e02-t4">T4</button> et de la T3</td><td style="min-width:10em">Apport insuffisant : substrat limitant</td></tr><tr><td style="min-width:10em">Thyroglobuline</td><td style="min-width:10em">Support folliculaire de la synthèse</td><td style="min-width:10em">Élevée (sensible, rapide)</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button></td><td style="min-width:10em">Stimule la glande</td><td style="min-width:10em">Élevée en carence modérée ou sévère</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-t4">T4</button></td><td style="min-width:10em">Hormone principale</td><td style="min-width:10em">Normale ou un peu basse (modérée), basse (sévère)</td></tr><tr><td style="min-width:10em">T3</td><td style="min-width:10em">Hormone issue en partie de la conversion périphérique de la <button class="w" data-k="e02-t4">T4</button></td><td style="min-width:10em">Souvent normale ou plus haute</td></tr></tbody></table>
<p>Le tableau compare des profils possibles selon la sévérité ; il ne décrit pas une chronologie obligatoire chez chaque patient. La thyroglobuline peut être sensible à l’adaptation, mais dépend aussi de l’excès iodé et du contexte thyroïdien. La <button class="w" data-k="e02-t4">T4</button> est moins adaptée au monitorage nutritionnel de population.</p>
<p><b>Les artefacts.</b> Les immunodosages thyroïdiens reposent sur une reconnaissance moléculaire que la <button class="w" data-k="e02-biotine">biotine</button> peut perturber. L’erreur peut aller dans un sens ou dans l’autre : résultats faussement bas ou élevés. L’iodurie, elle, dépend de la dilution urinaire ; l’étude suisse l’a corrigée par la créatininurie et par un second échantillon.</p>
<div class="key"><b>Science → clinique.</b> La <button class="w" data-k="e02-tsh">TSH</button> élevée peut venir d’une synthèse limitée par le substrat (carence) ou d’une glande atteinte (auto-immunité) : la biochimie ne les distingue pas, l’anamnèse et les anticorps le font.</div>
<div class="key"><b>Science → examen.</b> La Tg peut s’élever alors que <button class="w" data-k="e02-tsh">TSH</button> et <button class="w" data-k="e02-t4">T4</button> restent normales ; elle s’élève aussi en cas d’excès d’iode, ce qui limite sa spécificité.</div>
<div class="key"><b>Science → traitement.</b> Apporter de l’iode fournit le substrat ; la lévothyroxine apporte le produit. Les deux n’ont pas la même cible.</div>
<div class="key"><b>À retenir.</b> Substrat, support, stimulation et produit sont des niveaux distincts ; aucun marqueur n’attribue seul une cause individuelle.</div>
<p>La thyroglobuline porte des résidus de tyrosine sur lesquels l’iode est incorporé ; les étapes catalysées par la peroxydase conduisent aux précurseurs puis à la triiodothyronine, avec trois atomes d’iode, et à la thyroxine, avec quatre. Le stockage et la libération après reprise de colloïde séparent l’apport immédiat et la sécrétion. Dans le sang, la liaison protéique explique que concentration totale et fraction libre ne soient pas synonymes. La grossesse modifie notamment les protéines porteuses, d’où l’importance d’une méthode et d’une référence appropriées.</p><p>La lévothyroxine orale est liée aux protéines à près de 100 % selon sa FI et possède une demi-vie d’environ sept jours chez le sujet sain ; son effet ne s’évalue pas à partir d’une dose isolée ou d’un symptôme du lendemain. Le fer et le calcium peuvent diminuer l’absorption. Cette chaîne relie la biochimie au contrôle de prise avant d’augmenter une dose.</p><figure><svg viewBox="0 0 600 150" role="img" aria-label="Vérifier les interactions avant de majorer" style="width:100%;height:auto"><rect x="10" y="15" width="260" height="70" rx="8" fill="#f4f7f7" stroke="#222"/><rect x="330" y="15" width="260" height="70" rx="8" fill="#f4f7f7" stroke="#222"/><path d="M275 50h45m-10-7 10 7-10 7" fill="none" stroke="#222" stroke-width="2"/><text x="140" y="53" text-anchor="middle" fill="#111" font-size="22">Prise et absorption</text><text x="460" y="53" text-anchor="middle" fill="#111" font-size="22">Exposition hormonale</text><text x="300" y="125" text-anchor="middle" fill="#111" font-size="21">Vérifier les interactions avant de majorer</text></svg><figcaption>Schéma logique, non anatomique. Vérifier les interactions avant de majorer. Les flèches indiquent le raisonnement, pas une probabilité chiffrée.</figcaption></figure><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">OpenStax, synthèse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">FI, absorption, distribution et élimination</a>.</p><button class="pareto-btn ui" data-k="pareto-e02-sbioch">▲ Loi de Pareto — Biochimie</button>
</section></div><div class="sci" id="e02-s-sante" hidden><section class="ilot" id="e02-s-sante-cours"><h2>Santé publique : sel iodé et monitorage</h2>
<p>Corriger la carence est d’abord une politique de population. Le sel iodé est le vecteur retenu : l’<button class="w" data-k="e02-s-oms">OMS</button> juge l’iodation universelle du sel la stratégie la plus efficace. La Suisse l’applique depuis 1922, sur une base volontaire.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Année</th><th style="min-width:10em">Teneur du sel (mg d’iode par kg)</th></tr></thead><tbody><tr><td style="min-width:10em">Origine (1922)</td><td style="min-width:10em">3,75</td></tr><tr><td style="min-width:10em">1962</td><td style="min-width:10em">7,5</td></tr><tr><td style="min-width:10em">1980</td><td style="min-width:10em">15</td></tr><tr><td style="min-width:10em">1998</td><td style="min-width:10em">20</td></tr><tr><td style="min-width:10em">Depuis janvier 2014</td><td style="min-width:10em">25 (plage 20 à 40 citée dans les publications, non revalidée juridiquement ici)</td></tr></tbody></table>
<p>Le tableau montre quatre relèvements successifs de la teneur. L’apport reste pourtant dépendant du comportement : 70 à 80 % du sel consommé provient d’aliments transformés, dont un tiers seulement est salé avec du sel iodé. D’où le portrait suisse : des écoliers suffisants (iodurie médiane 127 µg/L) et des femmes enceintes insuffisantes (97 µg/L). Les sources d’iode selon l’<button class="w" data-k="e02-s-osav">OSAV</button> sont le sel iodé (51 %), les produits laitiers (26 %) et les poissons et fruits de mer (9 %) ; 86 % des boulangeries utilisent du sel iodé.</p>
<p>Le monitorage compare une médiane à des seuils. Pour des écoliers et des adultes non enceintes, une médiane de 100 à 199 µg/L signe un apport adéquat ; pour la grossesse, il faut 150 à 249 µg/L. Un seuil de 100 µg/L suffit pour l’allaitement et les enfants de moins de deux ans.</p>
<div class="key"><b>Science → clinique.</b> Une moyenne collective suffisante peut cacher des sous-groupes carencés : les femmes enceintes sans supplément iodé, les végétaliens et les faibles consommateurs de lait.</div>
<div class="key"><b>Science → examen.</b> Les marqueurs de population (iodurie médiane, Tg, <button class="w" data-k="e02-tsh">TSH</button> néonatale) ne se transposent pas à une patiente.</div>
<div class="key"><b>Science → traitement.</b> Les recommandations alimentaires de l’<button class="w" data-k="e02-s-osav">OSAV</button> et le choix d’un supplément prénatal iodé répondent aux sous-groupes que le sel n’atteint pas.</div>
<div class="key"><b>À retenir.</b> Le sel iodé protège la population, pas chaque femme enceinte : l’écart se comble par le conseil individuel.</div>
<p>L’objectif est de remplacer le sel ordinaire par du sel iodé sans augmenter la quantité de sel. À 25 mg/kg, un gramme de sel apporte théoriquement 25 µg d’iode ; ce calcul de concentration n’est pas une consigne d’ingérer davantage de sel et ne prend pas en compte toutes les pertes ou les autres aliments. L’iodation des produits transformés et l’information des groupes à risque complètent l’usage ménager.</p><p>Le rapport <button class="w" data-k="e02-ofsp">évaluation des technologies de la santé</button> suisse sur la lévothyroxine traite une autre question : le bénéfice d’une substitution dans l’<button class="w" data-k="e02-hic">HIC</button>, pas l’utilité de l’iodation. Son coût modélisé sur cinq ans, de 9 à 87 millions de francs selon les scénarios d’utilisation, ne représente ni des dépenses observées ni une décision de remboursement. Santé publique nutritionnelle et prescription individuelle restent deux niveaux distincts.</p><figure><svg viewBox="0 0 600 150" role="img" aria-label="Un seuil collectif ne diagnostique pas une personne" style="width:100%;height:auto"><rect x="10" y="15" width="260" height="70" rx="8" fill="#f4f7f7" stroke="#222"/><rect x="330" y="15" width="260" height="70" rx="8" fill="#f4f7f7" stroke="#222"/><path d="M275 50h45m-10-7 10 7-10 7" fill="none" stroke="#222" stroke-width="2"/><text x="140" y="53" text-anchor="middle" fill="#111" font-size="22">Médiane de population</text><text x="460" y="53" text-anchor="middle" fill="#111" font-size="22">Politique nutritionnelle</text><text x="300" y="125" text-anchor="middle" fill="#111" font-size="21">Un seuil collectif ne diagnostique pas une personne</text></svg><figcaption>Schéma logique, non anatomique. Un seuil collectif ne diagnostique pas une personne. Les flèches indiquent le raisonnement, pas une probabilité chiffrée.</figcaption></figure><p class="src">Sources : <a href="https://www.blv.admin.ch/fr/sel-iode" target="_blank" rel="noopener">OSAV, sel iodé</a> ; <a href="https://www.bag.admin.ch/dam/en/sd-web/hiZGlyL6EGOQ/h0035ltsh-hta-report.pdf" target="_blank" rel="noopener">OFSP HTA, résumé exécutif</a>.</p><button class="pareto-btn ui" data-k="pareto-e02-ssante">▲ Loi de Pareto — Santé publique</button>
</section></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="e02-p-1"><h2><span class="n">p-1</span>Stratégie pharmacologique</h2>
<p>Dans E02, deux logiques thérapeutiques coexistent et ne se confondent pas : <b>apporter le substrat</b> (l’iode) ou <b>remplacer le produit</b> (la <button class="w" data-k="e02-levo">lévothyroxine</button>). Aucun essai retrouvé dans les sources consultées ne compare les deux dans cette situation, et aucune recommandation suisse ou européenne propre à l’<button class="w" data-k="e02-hic">HIC</button> iodoprive n’a été trouvée. Le choix s’appuie donc sur la cause supposée, la <button class="w" data-k="e02-tsh">TSH</button>, l’âge et la grossesse.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Objectif</th><th style="min-width:10em">Moyen</th><th style="min-width:10em">Limite</th></tr></thead><tbody><tr><td style="min-width:10em">Apporter le substrat</td><td style="min-width:10em">Sel iodé ; produits laitiers ; poisson de mer ; <button class="w" data-k="e02-supplement">supplément prénatal contenant de l’iode</button></td><td style="min-width:10em">Pas de bénéfice neurodéveloppemental démontré en carence légère ; l’excès est à éviter</td></tr><tr><td style="min-width:10em">Remplacer l’hormone</td><td style="min-width:10em"><button class="w" data-k="e02-levo">Lévothyroxine (Euthyrox)</button></td><td style="min-width:10em">Pas d’amélioration des symptômes dans TRUST ni dans la méta-analyse bernoise pour les formes légères</td></tr><tr><td style="min-width:10em">Se protéger de l’iode radioactif</td><td style="min-width:10em"><button class="w" data-k="e02-ki65">Iodure de potassium 65 mg</button></td><td style="min-width:10em">Usage exclusivement sur ordre des autorités ; jamais une supplémentation nutritionnelle</td></tr></tbody></table>
<p>Le tableau écarte une confusion fréquente : la ligne trois ne relève pas de la prise en charge de E02, bien qu’il s’agisse d’iode. Elle ne figure ici que pour la nommer et en interdire l’usage nutritionnel.</p>
<div class="key"><b>À retenir.</b> Corriger l’apport et décider de la substitution sont deux démarches complémentaires. Une grossesse ou une forme sévère peut justifier lévothyroxine malgré un déficit iodé ; l’iode seul ne remplace pas une hormone indiquée.</div>
</section>

<section class="ilot" id="e02-p-2"><h2><span class="n">p-2</span>Place selon le phénotype</h2>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Phénotype</th><th style="min-width:10em">Choix principal</th><th style="min-width:10em">Justification</th></tr></thead><tbody><tr><td style="min-width:10em"><button class="w" data-k="e02-hic">HIC</button> légère, contexte carencé, projet de grossesse</td><td style="min-width:10em">Corriger l’apport et organiser rapidement la confirmation ; discuter lévothyroxine préconceptionnelle avec le spécialiste</td><td style="min-width:10em">Le contexte nutritionnel doit être évalué, sans retarder une substitution indiquée ; <button class="w" data-k="e02-s-rcog">RCOG</button> 2025 et <button class="w" data-k="e02-s-has">HAS</button> 2022</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-hic">HIC</button> légère, symptômes, sujet jeune</td><td style="min-width:10em">Essai de lévothyroxine limité dans le temps</td><td style="min-width:10em"><button class="w" data-k="e02-s-eta">ETA</button> 2013 : réévaluer 3 à 4 mois après normalisation de la <button class="w" data-k="e02-tsh">TSH</button>, arrêter sans amélioration</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-hic">HIC</button> sévère (<button class="w" data-k="e02-tsh">TSH</button> supérieure à 10 mU/L), moins de 65–70 ans</td><td style="min-width:10em">Lévothyroxine</td><td style="min-width:10em"><button class="w" data-k="e02-s-eta">ETA</button> 2013, recommandation 13 ; risque coronarien accru au-dessus de 10 mU/L</td></tr><tr><td style="min-width:10em">Plus de 80–85 ans, <button class="w" data-k="e02-tsh">TSH</button> de 10 mU/L ou moins</td><td style="min-width:10em">Attentisme</td><td style="min-width:10em">Attentisme selon ETA 2013 dans cette tranche d’âge ; TRUST ne montre pas de bénéfice symptomatique dans sa population de 65 ans et plus ; <button class="w" data-k="e02-tsh">TSH</button> naturellement plus haute</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-t4">T4</button> libre basse</td><td style="min-width:10em">Réévaluer l’hypothyroïdie manifeste et sa cause ; pas de code déduit de la <button class="w" data-k="e02-t4">T4</button> seule</td><td style="min-width:10em">Le traitement relève du cours E01 et de l’information professionnelle</td></tr></tbody></table>
<p>Ce tableau se lit de la gauche vers la droite : le phénotype oriente vers un choix, la justification rappelle la source. La grossesse et les autres populations particulières ont leurs propres recommandations, développées dans le chapitre clinique.</p>
</section>

<section class="ilot" id="e02-p-3"><h2><span class="n">p-3</span>Posologie de la lévothyroxine</h2>
<p>Les posologies suivantes viennent de l’information professionnelle suisse d’<button class="w" data-k="e02-levo">Euthyrox (mise à jour de février 2023)</button> et de l’<button class="w" data-k="e02-s-eta">ETA</button> 2013. La FI suisse décrit le produit et ses modalités ; les recommandations décident de la pertinence du traitement dans une <button class="w" data-k="e02-hic">HIC</button>. La date seule ne résout pas une différence de champ ou de population.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Population</th><th style="min-width:10em">Dose</th><th style="min-width:10em">Titration ou entretien</th></tr></thead><tbody><tr><td style="min-width:10em">Adulte, hypothyroïdie (information professionnelle)</td><td style="min-width:10em">Initiale 25 à 50 µg/j</td><td style="min-width:10em">+25 à 50 µg toutes les 2 à 4 semaines ; entretien 100 à 200 µg/j</td></tr><tr><td style="min-width:10em">Adulte sans cardiopathie (<button class="w" data-k="e02-s-eta">ETA</button> 2013)</td><td style="min-width:10em">Environ 1,5 µg/kg/j</td><td style="min-width:10em">Entretien habituel de l’<button class="w" data-k="e02-hic">HIC</button> : 50 à 100 µg/j</td></tr><tr><td style="min-width:10em">Sujet âgé, cardiaque, hypothyroïdie ancienne ou sévère</td><td style="min-width:10em">Initiale 25 µg/j</td><td style="min-width:10em">Augmentation prudente ; <button class="w" data-k="e02-s-eta">ETA</button> : 25 à 50 µg/j chez le cardiaque ou l’âgé</td></tr><tr><td style="min-width:10em">Enfant de 0 à 6 mois</td><td style="min-width:10em">25 à 75 µg/j</td><td style="min-width:10em">10 µg/kg</td></tr><tr><td style="min-width:10em">Enfant de 6 à 12 mois</td><td style="min-width:10em">50 à 75 µg/j</td><td style="min-width:10em">8 µg/kg</td></tr><tr><td style="min-width:10em">Enfant de 1 à 5 ans</td><td style="min-width:10em">75 à 100 µg/j</td><td style="min-width:10em">5 à 6 µg/kg</td></tr><tr><td style="min-width:10em">Enfant de 6 à 12 ans</td><td style="min-width:10em">100 à 150 µg/j</td><td style="min-width:10em">4 à 5 µg/kg</td></tr></tbody></table>
<p>Le tableau conserve les sources côte à côte, car elles répondent à des questions différentes : l’information professionnelle décrit l’hypothyroïdie, l’<button class="w" data-k="e02-s-eta">ETA</button> décrit l’<button class="w" data-k="e02-hic">HIC</button>. La dose de 1,5 µg/kg appliquée à 60 kg donne 90 µg/j, soit au milieu de la fourchette d’entretien de l’<button class="w" data-k="e02-s-eta">ETA</button> (50 à 100 µg/j). La prise est unique, le matin, à jeun, au moins une demi-heure avant le petit-déjeuner.</p>
<p><b>Portée pédiatrique.</b> Les lignes par âge reproduisent la FI de substitution et ne prescrivent pas le traitement de toute <button class="w" data-k="e02-hic">HIC</button> de l’enfant. À partir de 12 ans, la FI utilise les doses adultes ; avant cet âge, adaptation individuelle. Chez le nourrisson, la suspension du comprimé dans un peu d’eau est préparée immédiatement avant administration, avec prise de la dose entière au moins une demi-heure avant le premier repas. Les apports médicamenteux sont distincts des besoins nutritionnels en iode.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">FI Euthyrox, posologie</a>.</p><div class="trap"><span class="k">Piège</span> Appliquer la dose d’entretien de l’hypothyroïdie manifeste (100 à 200 µg/j) à une <button class="w" data-k="e02-hic">HIC</button> légère. L’<button class="w" data-k="e02-s-eta">ETA</button> situe l’entretien de l’<button class="w" data-k="e02-hic">HIC</button> à 50 à 100 µg/j, avec une cible de <button class="w" data-k="e02-tsh">TSH</button> dans la moitié inférieure de l’intervalle de référence.</div>
</section>

<section class="ilot" id="e02-p-4"><h2><span class="n">p-4</span>Interactions, contre-indications et surveillance</h2>
<div class="alert"><b>Interactions à anticiper.</b> Les sels de calcium, le fer et l’aluminium réduisent l’absorption : la lévothyroxine se prend au moins <b>deux heures avant</b> eux selon l’information professionnelle ; l’<button class="w" data-k="e02-s-eta">ETA</button> conseille d’espacer calcium, fer et inhibiteurs de la pompe à protons d’au moins <b>quatre heures</b>. Les résines se prennent 4 à 5 heures après. Les inhibiteurs de la pompe à protons diminuent l’absorption. Les inducteurs enzymatiques, les œstrogènes et la sertraline augmentent les besoins. Les produits de contraste iodés et l’amiodarone modifient la fonction thyroïdienne.</div>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Contre-indication de la lévothyroxine</th><th style="min-width:10em">Conduite associée</th></tr></thead><tbody><tr><td style="min-width:10em">Insuffisance cardiaque avec tachycardie ; pancardite et myocardite aiguës ; infarctus aigu ; angor</td><td style="min-width:10em">Contre-indication</td></tr><tr><td style="min-width:10em">Insuffisance hypophysaire ou surrénalienne non traitée</td><td style="min-width:10em">Si insuffisance surrénalienne : glucocorticoïdes d’abord. Si suspicion d’autonomie : investigations spécialisées selon la FI ; pas de scintigraphie systématique de l’<button class="w" data-k="e02-hic">HIC</button></td></tr><tr><td style="min-width:10em">Hyperthyroïdie</td><td style="min-width:10em">Contre-indication</td></tr></tbody></table>
<p>La liste découle d’un principe : la lévothyroxine augmente le travail cardiaque et le métabolisme ; elle est donc dangereuse lorsque le cœur ou la surrénale ne peuvent y répondre. Ce raisonnement est une explication de l’auteur ; l’information professionnelle donne la liste sans le mécanisme détaillé.</p>
<p>La FI ajoute l’hypersensibilité au produit et, pendant la grossesse, l’association à un traitement antithyroïdien parmi les contre-indications. Un antécédent cardiaque demande une évaluation spécialisée : « commencer bas » ne rend pas une contre-indication sans effet. Les règles de test de suppression de la FI ne constituent pas un examen de routine de l’<button class="w" data-k="e02-hic">HIC</button> et ne s’appliquent pas pendant la grossesse.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">FI Euthyrox, contre-indications et précautions</a>.</p><h3>Surveillance</h3>
<ul><li><b><button class="w" data-k="e02-tsh">TSH</button></b> à environ deux mois après le début, puis au moins annuelle ; cible proposée par ETA 2013 de 0,4 à 2,5 mU/L chez la plupart des adultes, de 1 à 5 mU/L après 70 à 75 ans. Ces repères ne remplacent pas l’individualisation selon l’âge, le laboratoire et le contexte.</li><li><b>Grossesse</b> : poursuivre sans interruption ; la dose peut devoir augmenter ; reprendre la dose antérieure après l’accouchement et contrôler la <button class="w" data-k="e02-tsh">TSH</button> à six à huit semaines.</li><li><b>Effets indésirables</b> : la FI décrit, sans fréquences déterminables, hypersensibilité et angiœdème, tremblements, insomnie, agitation, céphalées, convulsions, symptômes psychotiques, tachycardie/arythmies, angor ou décompensation cardiaque, diarrhée, transpiration et perte de poids. Une augmentation trop rapide ou une dose excessive favorise les manifestations thyrotoxiques ; réduire ou interrompre temporairement sous contrôle selon la FI, puis reprendre prudemment.</li></ul>
</section>

<section class="ilot" id="e02-p-5"><h2><span class="n">p-5</span>Médicaments et produits à éviter</h2>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">À éviter</th><th style="min-width:10em">Raison</th></tr></thead><tbody><tr><td style="min-width:10em">T3 seule ou association <button class="w" data-k="e02-t4">T4</button>/T3</td><td style="min-width:10em">L’<button class="w" data-k="e02-s-eta">ETA</button> 2013 la déconseille (recommandation 16, grade 1S)</td></tr><tr><td style="min-width:10em">Lévothyroxine pour perdre du poids</td><td style="min-width:10em">Recommandation 8 de l’<button class="w" data-k="e02-s-eta">ETA</button> ; rappel de l’information professionnelle</td></tr><tr><td style="min-width:10em">Comprimés d’iodure de potassium 65 mg comme supplément</td><td style="min-width:10em">Réservés à la protection contre l’iode radioactif sur ordre des autorités</td></tr><tr><td style="min-width:10em">Supplément prénatal sans iode en pensant couvrir l’apport</td><td style="min-width:10em">Elevit Pronatal ne comporte pas d’iode</td></tr><tr><td style="min-width:10em">Algues en quantité</td><td style="min-width:10em">Elles peuvent apporter des quantités très élevées d’iode (<button class="w" data-k="e02-s-osav">OSAV</button>)</td></tr><tr><td style="min-width:10em">Traitement d’une <button class="w" data-k="e02-tsh">TSH</button> isolée non confirmée</td><td style="min-width:10em">Normalisation spontanée chez 6 à 35 %</td></tr></tbody></table>
<div class="key"><b>À retenir.</b> Les erreurs de prescription dans E02 sont des erreurs de cible : traiter une valeur non confirmée, opposer à tort correction iodée et substitution lorsqu’elles sont toutes deux indiquées, ou croire qu’un complément couvre l’iode sans l’avoir lu.</div>
<button class="pareto-btn ui" data-k="pareto-e02-pharma">▲ Loi de Pareto — Pharmacologie</button>
</section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>
