<p>Dans cette <b>vignette fictive</b>, une femme de 31 ans prépare une grossesse. Elle est végane depuis quatre ans, cuisine sans sel iodé, boit des boissons végétales non enrichies et prend un complément multivitaminé dont la composition ne mentionne pas d’iode. Son médecin dose la <button class="w" data-k="e02-tsh">TSH</button> avant la conception : 5,8 mU/L, avec une <button class="w" data-k="e02-t4">T4</button> libre dans l’intervalle de référence. Ces valeurs sont pédagogiques ; elles servent à poser trois questions.</p>
<p>La première concerne la réalité de l’anomalie : une seule mesure ne fait pas un diagnostic, car la <button class="w" data-k="e02-tsh">TSH</button> varie dans la journée et se normalise spontanément chez 6 à 35 % des personnes. La deuxième concerne la cause : une thyroïdite auto-immune, première cause d’hypothyroïdie infraclinique persistante, ou un apport d’iode insuffisant. La troisième concerne la conduite : corriger l’apport en iode, substituer par <button class="w" data-k="e02-levo">lévothyroxine</button>, ou surveiller.</p>
<div class="key"><b>À retenir.</b> Confirmer le profil, rechercher la cause et définir le délai d’action selon le contexte ; la préparation d’une grossesse ne justifie pas une attente automatique de trois mois. La catégorie E02 suppose que la carence en iode est documentée ou très probable ; une <button class="w" data-k="e02-hic">hypothyroïdie infraclinique (définition et seuils)</button> isolée n’est pas présumée iodoprive dans un pays où le sel est iodé.</div>
</section>

<section class="ilot" id="e02-1"><h2><span class="n">1</span>Définition, nosologie et classifications</h2>
<h3>1.1 Ce que désigne le code E02</h3>
<p>Le libellé de l’Office fédéral de la statistique est « Hypothyroïdie par carence inapparente en iode ». La catégorie ne comporte aucun sous-code. L’adjectif « inapparente » traduit le terme anglais <i>subclinical</i> de la classification de l’<button class="w" data-k="e02-s-oms">OMS</button> : c’est l’<b>hypothyroïdie</b> qui est infraclinique, c’est-à-dire découverte par la biologie sans signe clinique net, et non la carence. L’iode manque bel et bien ; la glande compense encore.</p>
<p>La <button class="w" data-k="e02-nomenclature">frontière avec E01 et E03 (notes d’exclusion de la classification)</button> se trace ainsi : la catégorie E01 exclut E02, et l’hypothyroïdie acquise par carence iodée non précisée se classe en <button class="w" data-k="e02-nomenclature">E01.8</button> ; la catégorie E03 exclut l’hypothyroïdie liée à la carence iodée. Le cours traite donc l’hypothyroïdie <b>infraclinique attribuée à une carence en iode</b>. L’hypothyroïdie infraclinique d’une autre cause, surtout auto-immune, relève de E03 ou de E06 et devient ici le diagnostic différentiel principal.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Code</th><th style="min-width:10em">Contenu</th><th style="min-width:10em">Place dans ce cours</th></tr></thead><tbody><tr><td style="min-width:10em">E01</td><td style="min-width:10em">Affections thyroïdiennes liées à une carence en iode</td><td style="min-width:10em">Renvoi : le goitre de la carence chronique y est traité</td></tr><tr><td style="min-width:10em">E01.8</td><td style="min-width:10em">Autres affections thyroïdiennes et apparentées liées à une carence en iode ; inclut l’hypothyroïdie acquise par carence iodée non précisée</td><td style="min-width:10em">Autre affection liée à l’iode ; attribution causale nécessaire, pas simple lecture de <button class="w" data-k="e02-t4">T4</button></td></tr><tr><td style="min-width:10em">E02</td><td style="min-width:10em">Hypothyroïdie par carence inapparente en iode</td><td style="min-width:10em">Objet du cours</td></tr><tr><td style="min-width:10em">E03</td><td style="min-width:10em">Autres hypothyroïdies, hors carence iodée</td><td style="min-width:10em">Diagnostic différentiel</td></tr></tbody></table>
<p>La biologie établit le type de dysfonction ; l’histoire clinique établit sa cause. E02 suppose une hypothyroïdie infraclinique attribuée à une carence iodée. Une <button class="w" data-k="e02-t4">T4</button> libre basse fait sortir du cadre infraclinique, mais ne décide pas à elle seule du code : E01.8 ne convient que si la cause iodée est retenue. « Non précisée » n’est pas un synonyme de « manifeste ».</p>
<h3>1.2 Hypothyroïdie infraclinique et ses catégories</h3>
<p>L’<button class="w" data-k="e02-hic">hypothyroïdie infraclinique (HIC)</button> est une <button class="w" data-k="e02-tsh">TSH</button> sérique élevée avec une <button class="w" data-k="e02-t4">T4</button> libre dans l’intervalle de référence ; la T3 libre n’est pas un examen usuel de confirmation. L’<button class="w" data-k="e02-s-eta">ETA</button> retient pour la <button class="w" data-k="e02-tsh">TSH</button> un intervalle de 0,4 à 4,0 mU/L chez l’adulte ; le laboratoire du patient reste la référence de la mesure.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Catégorie (adulte non enceinte)</th><th style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button></th><th style="min-width:10em">Part des cas</th><th style="min-width:10em">Conduite de principe</th></tr></thead><tbody><tr><td style="min-width:10em"><button class="w" data-k="e02-hic">HIC</button> légère</td><td style="min-width:10em">4,0 à 10,0 mU/L</td><td style="min-width:10em">Environ 90 %</td><td style="min-width:10em">Surveillance ; essai de lévothyroxine possible si symptômes chez un sujet de moins de 65 ans</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-hic">HIC</button> sévère</td><td style="min-width:10em">Plus de 10 mU/L</td><td style="min-width:10em">Environ 10 %</td><td style="min-width:10em">Traitement recommandé avant 65 à 70 ans, même sans symptôme</td></tr></tbody></table>
<p>Le seuil de 10 mU/L sépare deux risques : le risque coronarien et celui d’insuffisance cardiaque apparaissent surtout au-dessus de lui (voir la section 10). Les seuils changent hors de l’adulte non enceinte. Pendant la <button class="w" data-k="e02-grossesse">grossesse (définitions et risques)</button>, la <button class="w" data-k="e02-tsh">TSH</button> se compare à un intervalle propre à la grossesse ; chez l’<button class="w" data-k="e02-enfant">enfant (définition et évolution)</button>, l’<button class="w" data-k="e02-hic">HIC</button> correspond à une <button class="w" data-k="e02-tsh">TSH</button> supérieure à la limite propre à l’âge et à la méthode.</p>
<h3>1.3 Apports recommandés en iode</h3>
<p>Savoir si un apport est insuffisant exige un point de comparaison. Deux référentiels existent : celui de l’<button class="w" data-k="e02-s-oms">OMS</button>, de l’UNICEF et de l’ICCIDD, et celui de l’<button class="w" data-k="e02-s-efsa">EFSA</button>. Ils ne coïncident pas en grossesse, et le cours les cite séparément.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Population</th><th style="min-width:10em">OMS, UNICEF, ICCIDD (2007)</th><th style="min-width:10em"><button class="w" data-k="e02-s-efsa">EFSA</button> (2014)</th></tr></thead><tbody><tr><td style="min-width:10em">Enfant de 0 à 59 mois</td><td style="min-width:10em">90 µg/j</td><td style="min-width:10em">70 à 130 µg/j (7 mois et plus)</td></tr><tr><td style="min-width:10em">Enfant de 6 à 12 ans</td><td style="min-width:10em">120 µg/j</td><td style="min-width:10em">Non lu dans le dossier</td></tr><tr><td style="min-width:10em">Adolescent et adulte</td><td style="min-width:10em">150 µg/j</td><td style="min-width:10em">150 µg/j</td></tr><tr><td style="min-width:10em">Grossesse et allaitement</td><td style="min-width:10em">250 µg/j</td><td style="min-width:10em">200 µg/j</td></tr></tbody></table>
<p>Ces valeurs sont des repères d’apport total, aliments et compléments réunis, et non des seuils diagnostiques individuels. Un apport rapporté de 220 µg/j ne permet pas de déclarer une patiente « suffisante <button class="w" data-k="e02-s-efsa">EFSA</button> » mais « carencée OMS ». L’avis <button class="w" data-k="e02-s-efsa">EFSA</button> repose notamment sur des réserves préconceptionnelles suffisantes ; la différence de 50 µg/j reflète des méthodes et hypothèses distinctes. Le détail pédiatrique par âge n’est pas déduit de la fourchette 70–130 µg/j du résumé.</p>
<div class="trap"><span class="k">Piège</span> Confondre le <b>code</b> E02 et le <b>diagnostic</b> d’une carence. Le code décrit une situation biologique (<button class="w" data-k="e02-tsh">TSH</button> élevée, <button class="w" data-k="e02-t4">T4</button> libre normale) rattachée à une cause ; il ne prouve pas la cause. Aucun critère diagnostique publié propre à E02 n’a été retrouvé : la section 12 propose une construction pédagogique, signalée comme telle.</div>
<p><b>Définition clinique.</b> « Infraclinique » ne signifie ni invisible à l’anamnèse ni nécessairement asymptomatique. C’est un couple biologique : <button class="w" data-k="e02-tsh">TSH</button> au-dessus de la norme adaptée, <button class="w" data-k="e02-t4">T4</button> libre normale, anomalie persistante. Fatigue, constipation ou frilosité peuvent coexister, mais ces symptômes ne prouvent ni l’origine thyroïdienne ni le mécanisme carentiel.</p><p class="src">Sources : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS 2022, définitions et diagnostic</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3923601/" target="_blank" rel="noopener">ETA 2013, symptômes</a>.</p><button class="pareto-btn ui" data-k="pareto-e02-definition">▲ Loi de Pareto — Définition et nosologie</button>
</section>

<section class="ilot" id="e02-2"><h2><span class="n">2</span>Fréquence et situation suisse</h2>
<h3>2.1 L’hypothyroïdie infraclinique en général</h3>
<p>La prévalence de l’<button class="w" data-k="e02-hic">HIC</button> va de 4 à 10 % selon le sexe, l’âge et la population : environ 8 % des femmes (10 % après 55 ans) et 3 % des hommes. Elle augmente avec l’âge, chez les personnes d’origine européenne et, fait contre-intuitif, <b>dans les régions suffisamment iodées</b>. Environ 20 % des <button class="w" data-k="e02-hic">HIC</button> n’ont ni anticorps anti-<button class="w" data-k="e02-antitpo">TPO</button> ni anticorps anti-thyroglobuline détectables ; la <b>thyroïdite auto-immune</b> reste la cause persistante la plus fréquente.</p>
<h3>2.2 Le paradoxe iodé</h3>
<p>Un apport faible ne produit pas mécaniquement plus d’hypothyroïdie. Au Danemark, avant l’iodation, la région en carence modérée (iodurie 45 µg/L) comptait <b>moins</b> d’hypothyroïdies manifestes (26,5 pour 100 000 par an) que la région en carence légère (61 µg/L ; 40,1 pour 100 000 par an), mais <b>plus</b> d’hyperthyroïdies (92,9 contre 65,4 pour 100 000 par an). La <button class="w" data-k="e02-paradoxe">relation en U entre apport et fonction thyroïdienne (étude danoise)</button> résume ce résultat : des troubles surviennent en cas d’apport insuffisant comme excessif, et les auteurs situent l’optimum dans une plage étroite autour de 150 µg/j. Le résumé lu ne donne pas le mécanisme de l’écart entre les deux régions.</p>
<div class="key"><b>Conséquence didactique.</b> Dans un pays iodé comme la Suisse, une <button class="w" data-k="e02-hic">HIC</button> n’est pas présumée liée à l’iode. E02 exige une carence documentée ou fortement probable : grossesse, régime sans sel iodé ni laitages, supplément sans iode.</div>
<h3>2.3 La Suisse</h3>
<p>Le sel iodé existe en Suisse depuis 1922 et dans tout le pays depuis 1952. Sa teneur est passée de 3,75 mg/kg à 25 mg/kg en janvier 2014 (<button class="w" data-k="e02-sel">histoire et règles du sel iodé</button>). L’iodation reste <b>volontaire</b> : plus de 80 % des ménages utilisent du sel iodé, mais un tiers seulement des aliments transformés salés en contient, alors que 70 à 80 % du sel consommé vient de ces aliments.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Population (Suisse, 2020–2022)</th><th style="min-width:10em">Résultat</th><th style="min-width:10em">Lecture</th></tr></thead><tbody><tr><td style="min-width:10em">Écoliers de 6 à 12 ans</td><td style="min-width:10em">Iodurie médiane 127 µg/L ; apport habituel estimé inadéquat chez 5,4 % (méthode et incertitude à préciser)</td><td style="min-width:10em">Statut suffisant</td></tr><tr><td style="min-width:10em">Femmes enceintes</td><td style="min-width:10em">Iodurie médiane 97 µg/L (seuil OMS : 150 µg/L)</td><td style="min-width:10em">Statut insuffisant</td></tr><tr><td style="min-width:10em">Femmes enceintes sans supplément iodé</td><td style="min-width:10em">Apport inadéquat chez 31 %</td><td style="min-width:10em">Risque concentré ici</td></tr><tr><td style="min-width:10em">Femmes enceintes sous supplément iodé</td><td style="min-width:10em">Apport inadéquat chez 0,2 %</td><td style="min-width:10em">Association avec moins d’apports estimés inadéquats ; pas preuve causale individuelle</td></tr></tbody></table>
<p>Le <button class="w" data-k="e02-suisse">monitorage national 2020–2022 (méthode et chiffres)</button> montre un fossé entre l’enfant, protégé par le sel, et la femme enceinte, dont les besoins montent : l’iodurie des femmes enceintes a baissé d’environ 30 % depuis 2015 (140 µg/L). La thyroglobuline médiane a augmenté sur la même période. Pourtant, toutes les femmes étaient euthyroïdiennes sauf une, soit 0,2 % d’<button class="w" data-k="e02-hic">HIC</button>, et aucune corrélation n’apparaît entre iodurie et <button class="w" data-k="e02-tsh">TSH</button> ou <button class="w" data-k="e02-t4">T4</button>.</p>
<p>Ce dernier résultat tempère le tableau : un statut iodé collectif insuffisant ne se traduit pas encore, dans cette étude, par une thyroïde en échec. Les femmes en âge de procréer, les mères allaitantes, les végétariens et végétaliens, les faibles consommateurs de lait et les forts consommateurs de produits végétaux ultra-transformés sont les groupes que l’<button class="w" data-k="e02-s-osav">OSAV</button> désigne comme à risque. Chez le nourrisson, l’iodurie médiane de 70 à 100 µg/L correspond à un apport estimé de 40 à 50 µg/j, jugé insuffisant.</p>
<h3>Ce que les chiffres suisses ne permettent pas de conclure</h3><p>L’enquête de Fischer a inclus 362 enfants pour l’iodurie et 513 femmes enceintes au total ; après exclusions, l’analyse urinaire porte sur 473 femmes. Les dosages sanguins étaient la <button class="w" data-k="e02-tsh">TSH</button> et la <b><button class="w" data-k="e02-t4">T4</button> totale sur sang séché</b>, non la <button class="w" data-k="e02-t4">T4</button> libre sérique. Les références gravidiques et besoins moyens américains utilisés pour les calculs sont des choix méthodologiques de l’étude, pas les seuils cliniques adoptés dans ce cours. La section des résultats identifie une <button class="w" data-k="e02-hic">HIC</button> (0,2 %), alors que le résumé décrit globalement une population euthyroïdienne. Ni cette observation isolée ni la médiane urinaire ne mesurent la prévalence suisse de E02.</p><p>Le faible recrutement, la sous-représentation de petites communes et la contamination suspectée de certains prélèvements limitent la représentativité. L’inadéquation nutritionnelle est estimée par un modèle : 5,4 % chez les enfants, avec intervalle de confiance 0,0–14,6 %. Chez les femmes sans supplément, 31,0 % (10,5–41,1) ont un apport estimé inférieur au besoin moyen de 160 µg/j, contre 0,2 % (0,0–4,0) chez les utilisatrices. L’association ne remplace pas un essai randomisé ; les groupes peuvent différer par d’autres habitudes.</p><p>Les valeurs infantiles de 70–100 µg/L citées plus haut proviennent d’études antérieures reprises par Paediatrica 2020. Elles ne décrivent pas tous les nourrissons suisses de 2026. De même, les incidences danoises de 1997–1998 concernent les maladies manifestes ; elles ne donnent ni un risque personnel ni un effet garanti de l’iodation.</p><p class="src">Sources : <a href="https://doi.org/10.1007/s00394-023-03287-6" target="_blank" rel="noopener">Fischer et al., méthodes, résultats et limites</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Paediatrica 2020</a>.</p><button class="pareto-btn ui" data-k="pareto-e02-epidemio">▲ Loi de Pareto — Fréquence et situation suisse</button>
</section>

<section class="ilot" id="e02-3"><h2><span class="n">3</span>Physiopathologie</h2>
<h3>3.1 L’iode, substrat des hormones thyroïdiennes</h3>
<p>L’iode est indispensable à la synthèse de la <button class="w" data-k="e02-t4">T4</button> et de la T3. Environ 90 % de l’iode alimentaire est éliminé dans l’urine en 24 heures : l’iodurie reflète donc l’apport <b>récent</b>. La glande stocke de l’iode et s’en sert pendant les périodes de faible apport. La thyroglobuline est la protéine folliculaire sur laquelle les hormones sont synthétisées ; son taux sanguin est bas quand l’apport est suffisant.</p>
<h3>3.2 L’adaptation à la carence</h3>
<p>Quand l’iode disponible diminue, la <button class="w" data-k="e02-t4">T4</button> circulante tend à baisser et l’hypophyse augmente sa sécrétion de <button class="w" data-k="e02-tsh">TSH</button>. Cette stimulation déclenche une <button class="w" data-k="e02-adaptation">série d’ajustements (captation, rapport T3/T4, conversion périphérique)</button> : la thyroïde capte davantage d’iode, sécrète proportionnellement plus de T3 et la conversion de <button class="w" data-k="e02-t4">T4</button> en T3 augmente dans les tissus. La glande développe une hyperplasie et la <button class="w" data-k="e02-tg">thyroglobuline (marqueur sensible)</button> sérique s’élève ; le <button class="w" data-k="e02-goitre">goitre</button> est l’adaptation classique à la carence chronique.</p>
<figure><svg viewBox="0 0 600 150" role="img" aria-label="TSH et T4 peuvent rester normales" style="width:100%;height:auto"><rect x="10" y="15" width="260" height="70" rx="8" fill="#f4f7f7" stroke="#222"/><rect x="330" y="15" width="260" height="70" rx="8" fill="#f4f7f7" stroke="#222"/><path d="M275 50h45m-10-7 10 7-10 7" fill="none" stroke="#222" stroke-width="2"/><text x="140" y="53" text-anchor="middle" fill="#111" font-size="22">Apports insuffisants</text><text x="460" y="53" text-anchor="middle" fill="#111" font-size="22">Adaptation possible</text><text x="300" y="125" text-anchor="middle" fill="#111" font-size="21">TSH et T4 peuvent rester normales</text></svg><figcaption>Schéma logique, non anatomique. <button class="w" data-k="e02-tsh">TSH</button> et <button class="w" data-k="e02-t4">T4</button> peuvent rester normales. Les flèches indiquent le raisonnement, pas une probabilité chiffrée.</figcaption></figure><p class="src">Schéma d’adaptation : Paediatrica 2020. Si la <button class="w" data-k="e02-tsh">TSH</button> augmente et la <button class="w" data-k="e02-t4">T4</button> libre reste normale, le profil est infraclinique ; la cause iodée doit encore être étayée.</p>
<p>Cette chaîne éclaire le profil biologique de E02. Dans la carence <b>légère</b>, la thyroglobuline s’élève, mais la <button class="w" data-k="e02-tsh">TSH</button> et la <button class="w" data-k="e02-t4">T4</button> restent en général normales. Dans la carence <b>modérée</b>, la <button class="w" data-k="e02-tsh">TSH</button> peut s’élever légèrement : elle maintient la <button class="w" data-k="e02-t4">T4</button> normale ou un peu basse, ce qui correspond à E02 seulement si la <button class="w" data-k="e02-t4">T4</button> libre reste dans sa norme et si la cause iodée est retenue. Dans la carence <b>sévère</b>, la thyroglobuline et la <button class="w" data-k="e02-tsh">TSH</button> sont élevées, la <button class="w" data-k="e02-t4">T4</button> est basse, la T3 souvent normale, et le goitre ainsi que l’hypothyroïdie clinique deviennent fréquents.</p>
<h3>3.3 Grossesse et nouveau-né</h3>
<p>En <button class="w" data-k="e02-grossesse">grossesse</button>, les besoins augmentent : production accrue d’hormones maternelles, captation d’iode par le fœtus, le placenta et le liquide amniotique. Le développement cérébral dépend des hormones thyroïdiennes dès le début de la grossesse ; la dépendance maternelle précoce impose de préparer les apports avant la conception, d’où le poids de l’apport maternel. Le <button class="w" data-k="e02-nouveau-ne">nouveau-né</button> possède peu d’iode thyroïdien et un renouvellement élevé ; la carence demande une stimulation accrue par la <button class="w" data-k="e02-tsh">TSH</button>, ce qui explique l’élévation transitoire de la <button class="w" data-k="e02-tsh">TSH</button> néonatale.</p>
<div class="key"><b>Science → clinique.</b> Une <button class="w" data-k="e02-tsh">TSH</button> élevée avec <button class="w" data-k="e02-t4">T4</button> libre normale traduit une compensation biologique, sans mesurer directement un « effort » ni identifier sa cause. Une carence légère peut laisser la <button class="w" data-k="e02-tsh">TSH</button> normale. Corriger les apports ne garantit pas une normalisation, notamment si une thyroïdite coexiste : il faut réévaluer plutôt que promettre une réponse.</div>
<button class="pareto-btn ui" data-k="pareto-e02-physio">▲ Loi de Pareto — Physiopathologie</button>
</section>

<section class="ilot" id="e02-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Deux mécanismes rendent un apport insuffisant : une offre trop faible et des besoins qui augmentent. Le tableau les rassemble avec leur justification.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Facteur</th><th style="min-width:10em">Pourquoi il compte</th></tr></thead><tbody><tr><td style="min-width:10em">Cuisine et table sans sel iodé</td><td style="min-width:10em">Le sel iodé du ménage et des produits transformés fournit 51 % de l’iode alimentaire suisse selon l’<button class="w" data-k="e02-s-osav">OSAV</button></td></tr><tr><td style="min-width:10em">Régime végétalien sans aliments enrichis</td><td style="min-width:10em">Les boissons végétales non enrichies sont généralement pauvres en iode ; vérifier la composition ; les produits laitiers fournissent 26 % de l’apport</td></tr><tr><td style="min-width:10em">Faible consommation de lait</td><td style="min-width:10em">Le lait biologique contient moins d’iode que le lait conventionnel</td></tr><tr><td style="min-width:10em">Produits transformés salés sans iode</td><td style="min-width:10em">Seuls 47 % des produits suisses et 9 % des produits importés sont salés avec du sel iodé</td></tr><tr><td style="min-width:10em">Grossesse et allaitement</td><td style="min-width:10em">La demande augmente (fœtus, placenta, lait) ; le nourrisson allaité dépend entièrement de l’iode maternel</td></tr><tr><td style="min-width:10em">Supplément prénatal sans iode</td><td style="min-width:10em">Le produit le plus prescrit dans l’étude suisse n’en contenait pas</td></tr></tbody></table>
<p>La composition d’un supplément prénatal doit donc être lue. Le <button class="w" data-k="e02-supplement">supplément Elevit Pronatal (composition sans iode)</button> en offre un exemple vérifié dans l’information professionnelle suisse. À l’inverse, les comprimés d’iodure de potassium à 65 mg distribués par la Confédération ne servent <b>qu’</b>à protéger la thyroïde contre l’iode radioactif sur ordre des autorités ; ils ne constituent pas une supplémentation nutritionnelle.</p>
<div class="trap"><span class="k">Piège</span> Croire qu’un « complément prénatal » apporte de l’iode. Dans l’étude suisse, 61 % seulement des produits prénatals du marché contenaient au moins 150 µg d’iode. Lire l’étiquette ou l’information professionnelle évite l’omission.</div>
<button class="pareto-btn ui" data-k="pareto-e02-causes">▲ Loi de Pareto — Causes et risque</button>
</section>

<section class="ilot" id="e02-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’histoire clinique cherche à la fois la <b>carence</b> et les <b>causes concurrentes</b> d’une <button class="w" data-k="e02-tsh">TSH</button> élevée. Elle prépare la lecture des examens, car aucun test ne distingue seul l’origine nutritionnelle.</p>
<div class="two"><div class="card"><h4>Rechercher la carence</h4><p>Le médecin demande le sel iodé au ménage, la quantité de lait et de produits laitiers (trois portions par jour sont recommandées), le poisson de mer, le régime végétalien et les boissons végétales non enrichies. Il note aussi la grossesse, le projet de grossesse, l’allaitement, et la <b>composition</b> du supplément pris.</p></div><div class="card"><h4>Éliminer les causes concurrentes</h4><p>Il recherche une <button class="w" data-k="e02-causes-trans">cause transitoire</button> (thyroïdite subaiguë ou indolore, arrêt de lévothyroxine, convalescence d’une maladie non thyroïdienne), un <button class="w" data-k="e02-amiodarone">médicament (lithium, amiodarone)</button>, une exposition récente à l’iode (produit de contraste) et une <button class="w" data-k="e02-surrenale">insuffisance surrénalienne</button>.</p></div></div>
<p>Les symptômes sont rares dans l’<button class="w" data-k="e02-hic">HIC</button>. Une fatigue a pu s’améliorer sous lévothyroxine dans une étude, mais les résultats restent inconstants ; l’absence de plainte n’exclut donc rien. Les facteurs qui élèvent ou déplacent la <button class="w" data-k="e02-tsh">TSH</button> sont le travail de nuit, le sommeil irrégulier, l’exercice intense, la dépression et l’obésité. La <button class="w" data-k="e02-biotine">biotine</button> fausse les dosages thyroïdiens par immunoanalyse.</p>
<div class="key"><b>À retenir.</b> Trois questions de départ : y a-t-il un projet de grossesse ou une grossesse ? Que mange la patiente comme source d’iode ? Quel est le contenu exact de son supplément ? Elles orientent le bilan et la prévention.</div>
<h3>Décrire avant d’attribuer</h3><p>Une fatigue se décrit par sa date de début, sa persistance, son retentissement et sa relation aux autres plaintes. Le médecin recherche frilosité, constipation, peau sèche, crampes, faiblesse, modification de la voix et ralentissement ressenti. Il ne les additionne pas en un score diagnostique inventé : l’<button class="w" data-k="e02-s-eta">ETA</button> décrit des différences modestes entre groupes et une faible spécificité. Une aggravation récente après maladie, changement de médicament ou arrêt de lévothyroxine modifie la probabilité d’une anomalie transitoire.</p><p>Le recueil alimentaire porte sur les produits effectivement consommés : marque et enrichissement de la boisson végétale, sel ménager iodé ou non, habitudes de restauration, laitages ou alternatives enrichies, fréquence des produits marins. Il recherche aussi les algues et la multiplication de compléments. Un régime végétalien n’est pas, à lui seul, un diagnostic de carence ; un complément étiqueté « grossesse » n’est pas une preuve d’apport iodé.</p><p>Le projet de grossesse est daté, car il change le délai acceptable de réévaluation. Les antécédents thyroïdiens personnels et familiaux, les maladies auto-immunes, une chirurgie cervicale ou une irradiation et les bilans antérieurs orientent l’étiologie. Les médicaments sont recensés avec la dose, la date d’introduction et les modifications récentes ; on ne suspend pas d’emblée le lithium ou l’amiodarone.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3923601/" target="_blank" rel="noopener">ETA 2013, diagnostic et symptômes</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS 2022, dépistage ciblé et médicaments</a> ; <a href="https://www.blv.admin.ch/fr/sel-iode" target="_blank" rel="noopener">OSAV, sources alimentaires</a>.</p><button class="pareto-btn ui" data-k="pareto-e02-anamnese">▲ Loi de Pareto — Anamnèse</button>
</section>

<section class="ilot" id="e02-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen est pauvre dans E02, et c’est un enseignement en soi : la découverte est biologique. Il cherche un <button class="w" data-k="e02-goitre">goitre (adaptation à la carence chronique)</button>. Un goitre diffus ou nodulaire associé à une <button class="w" data-k="e02-hic">HIC</button> persistante est, selon l’<button class="w" data-k="e02-s-eta">ETA</button>, un argument pour discuter un traitement.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Élément</th><th style="min-width:10em">Ce qu’il apporte</th><th style="min-width:10em">Limite</th></tr></thead><tbody><tr><td style="min-width:10em">Goitre diffus</td><td style="min-width:10em">Cohérent avec une stimulation chronique par la <button class="w" data-k="e02-tsh">TSH</button> ou avec une auto-immunité</td><td style="min-width:10em">Ne tranche pas entre carence et thyroïdite</td></tr><tr><td style="min-width:10em">Goitre nodulaire</td><td style="min-width:10em">Argument pour discuter un traitement si l’<button class="w" data-k="e02-hic">HIC</button> persiste</td><td style="min-width:10em">Décrire la taille et la structure ; la palpation ne prouve ni la carence ni la bénignité</td></tr><tr><td style="min-width:10em">Signes d’hypothyroïdie</td><td style="min-width:10em">Leur présence ferait chercher une <button class="w" data-k="e02-t4">T4</button> libre basse</td><td style="min-width:10em">Rares dans l’<button class="w" data-k="e02-hic">HIC</button></td></tr></tbody></table>
<p>Ce tableau rappelle que l’examen oriente sans conclure. Un examen normal n’écarte pas E02, et une anomalie palpable ne désigne pas la cause.</p>
<h3>Technique de l’examen cervical</h3><p>Le guide OMS propose d’observer le cou en position habituelle puis en extension douce, de palper de chaque côté de la trachée entre la région cricoïdienne et le haut du sternum, et de noter la taille et la consistance. Une déglutition d’eau facilite l’observation de la montée de la thyroïde. Il faut expliquer le geste et rechercher une anomalie focale plutôt que simplement écrire « thyroïde normale ».</p><table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Grade OMS</th><th style="min-width:10em">Observation</th><th style="min-width:10em">Limite</th></tr></thead><tbody><tr><td style="min-width:10em">0</td><td style="min-width:10em">Pas de goitre visible ou palpable</td><td style="min-width:10em">N’exclut pas une dysfonction biologique</td></tr><tr><td style="min-width:10em">1</td><td style="min-width:10em">Palpable, non visible en position normale ; nodule possible sans augmentation globale</td><td style="min-width:10em">Variabilité entre examinateurs importante</td></tr><tr><td style="min-width:10em">2</td><td style="min-width:10em">Augmentation visible en position normale et compatible à la palpation</td><td style="min-width:10em">N’identifie pas la cause</td></tr></tbody></table><p>La comparaison au volume de la phalange terminale du pouce du sujet est un repère de terrain du guide OMS, pas une volumétrie échographique. La sensibilité et la spécificité de la palpation sont faibles dans les formes discrètes ; le cours ne leur attribue pas de chiffres non établis. Les signes généraux d’hypothyroïdie doivent être confrontés à la <button class="w" data-k="e02-t4">T4</button> libre, et un examen normal ne dispense pas de confirmer une anomalie biologique persistante.</p><p class="src">Sources : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS 2007, §4.3.1, technique et tableau 6</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3923601/" target="_blank" rel="noopener">ETA 2013, symptômes et imagerie</a>.</p><button class="pareto-btn ui" data-k="pareto-e02-examen">▲ Loi de Pareto — Examen clinique</button>
</section>

<section class="ilot" id="e02-7"><h2><span class="n">7</span>Démarche diagnostique et diagnostic différentiel</h2>
<p>Le diagnostic de E02 se construit en trois temps : confirmer l’<button class="w" data-k="e02-hic">HIC</button>, attribuer l’anomalie à la carence en iode, puis éliminer les autres explications. L’ordre protège contre deux erreurs opposées : traiter une valeur transitoire, ou rapporter à l’iode une thyroïdite auto-immune.</p>
<h3>7.1 Confirmer l’hypothyroïdie infraclinique</h3>
<p>Devant une <button class="w" data-k="e02-tsh">TSH</button> élevée avec une <button class="w" data-k="e02-t4">T4</button> libre normale, l’<button class="w" data-k="e02-s-eta">ETA</button> recommande de <b>répéter la <button class="w" data-k="e02-tsh">TSH</button> et la <button class="w" data-k="e02-t4">T4</button> libre, avec les anticorps anti-<button class="w" data-k="e02-antitpo">TPO</button>, après deux à trois mois</b>, de préférence à la même heure du jour. La <button class="w" data-k="e02-confirmation">justification de ce délai (rythme, variabilité, normalisation spontanée)</button> repose sur trois faits : la <button class="w" data-k="e02-tsh">TSH</button> est environ 30 % plus haute le soir et la nuit ; sa variabilité augmente aux valeurs élevées ; la fonction se normalise spontanément chez 6 à 35 % des patients. Chez le sujet âgé, des intervalles de référence adaptés à l’âge sont recommandés ; après 80 ans, une <button class="w" data-k="e02-tsh">TSH</button> de 4,0 à 7,0 mU/L peut être physiologique.</p>
<p>L’échographie thyroïdienne n’est pas systématique ; elle se discute en présence d’un goitre ou d’une autre indication. Un aspect hypoéchogène ou hétérogène oriente vers l’auto-immunité.</p>
<h3>7.2 Attribuer l’anomalie à la carence en iode</h3>
<ol><li><b>Anticorps anti-<button class="w" data-k="e02-antitpo">TPO</button> négatifs</b> : ils plaident contre la thyroïdite auto-immune, sans l’exclure (environ 20 % des <button class="w" data-k="e02-hic">HIC</button> n’ont aucun anticorps détectable).</li><li><b>Contexte d’apport insuffisant ou de besoins accrus</b> : grossesse, régime sans sel iodé ni laitages, supplément sans iode.</li><li><b>Marqueurs du statut iodé</b> : l’<button class="w" data-k="e02-iodurie">iodurie</button> et la <button class="w" data-k="e02-tg">thyroglobuline</button> décrivent une population plus qu’un individu. Une valeur ponctuelle d’iodurie ne classe pas une personne ; la répétition sur de nombreux jours est une méthode de recherche, pas une prescription de routine ; le <button class="w" data-k="e02-s-rcog">RCOG</button> 2025 déconseille les urines ponctuelles ou de 24 heures pour classer une femme enceinte individuellement.</li><li><b>Exclusion des causes concurrentes</b> : médicaments, insuffisance surrénalienne, interférence analytique.</li></ol>
<p>La <button class="w" data-k="e02-tsh">TSH</button> de l’adulte et de l’écolier est un mauvais marqueur du statut iodé : les différences entre populations sont faibles et le chevauchement important. La <button class="w" data-k="e02-tsh-neo">TSH néonatale</button> est, à l’inverse, un bon indicateur de population. Aucune de ces mesures ne fournit à elle seule un « test de la carence » chez la patiente de la vignette ; l’attribution reste un jugement clinique fondé sur un faisceau d’arguments.</p>
<h3>7.3 Diagnostic différentiel</h3>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Situation</th><th style="min-width:10em">Argument clé</th><th style="min-width:10em">Conséquence</th></tr></thead><tbody><tr><td style="min-width:10em">Thyroïdite auto-immune (E03 ou E06)</td><td style="min-width:10em"><button class="w" data-k="e02-antitpo">Anti-TPO</button> ou anti-thyroglobuline positifs ; échographie hypoéchogène</td><td style="min-width:10em">Cause persistante la plus fréquente ; la correction de l’iode ne la guérit pas</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-hic">HIC</button> transitoire</td><td style="min-width:10em">Thyroïdite subaiguë ou indolore, convalescence, arrêt de lévothyroxine</td><td style="min-width:10em">Contrôle à deux ou trois mois avant toute décision</td></tr><tr><td style="min-width:10em">Médicament</td><td style="min-width:10em">Lithium, amiodarone</td><td style="min-width:10em">Revoir l’indication du médicament et dater la prise</td></tr><tr><td style="min-width:10em">Insuffisance surrénalienne non traitée</td><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> élevée qui se corrige sous glucocorticoïdes</td><td style="min-width:10em">Juger l’<button class="w" data-k="e02-hic">HIC</button> au moins quatre semaines après une substitution adéquate</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> élevée fonctionnelle</td><td style="min-width:10em">Âge supérieur à 80 ans, obésité, rythme nycthéméral, travail de nuit</td><td style="min-width:10em">Intervalle adapté, prélèvement standardisé</td></tr><tr><td style="min-width:10em">Interférence analytique</td><td style="min-width:10em">Prise de biotine</td><td style="min-width:10em">Informer le laboratoire, utiliser si possible une méthode sans interférence ; éventuel arrêt concerté selon la dose et la méthode</td></tr><tr><td style="min-width:10em">Hypothyroxinémie isolée de la grossesse</td><td style="min-width:10em"><button class="w" data-k="e02-t4">T4</button> libre basse, <button class="w" data-k="e02-tsh">TSH</button> normale</td><td style="min-width:10em">Autre entité, également liée parfois à la carence en iode</td></tr><tr><td style="min-width:10em">Hypothyroïdie manifeste par carence en iode</td><td style="min-width:10em"><button class="w" data-k="e02-t4">T4</button> libre basse</td><td style="min-width:10em">Code E01.8, non E02</td></tr><tr><td style="min-width:10em">Mutation inactivatrice du récepteur de la <button class="w" data-k="e02-tsh">TSH</button></td><td style="min-width:10em">Cause rare</td><td style="min-width:10em">Évoquer si tout le reste est écarté</td></tr></tbody></table>
<p>Le tableau doit se lire de haut en bas comme une hiérarchie d’utilité : les deux premières lignes expliquent la majorité des situations et changent la conduite ; les suivantes sont à vérifier par l’anamnèse, parce que leur identification modifie la conduite ; certaines nécessitent malgré tout une substitution hormonale.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Étiqueter « carence en iode » toute <button class="w" data-k="e02-hic">HIC</button> d’une jeune femme. Sans anamnèse alimentaire et sans anticorps, l’attribution est spéculative, et la lévothyroxine ou l’iode risque de s’adresser à la mauvaise cause.</div>
<h3>Arbre décisionnel : population, profil, cause, action</h3><ol><li><b>Grossesse, projet de grossesse ou nourrisson ?</b> Utiliser d’emblée les références et délais spécifiques. Une hypothyroïdie sévère gravidique ne relève pas d’un contrôle différé de routine.</li><li><b><button class="w" data-k="e02-tsh">TSH</button> élevée, <button class="w" data-k="e02-t4">T4</button> libre normale ?</b> Confirmer la persistance chez l’adulte stable : <button class="w" data-k="e02-s-eta">ETA</button>, 2–3 mois ; <button class="w" data-k="e02-s-has">HAS</button>, au moins 6 semaines, généralement 6–12 semaines. Une <button class="w" data-k="e02-t4">T4</button> basse change le diagnostic biologique. En cas de suspicion centrale, la <button class="w" data-k="e02-tsh">TSH</button> seule est insuffisante et le bilan associe <button class="w" data-k="e02-tsh">TSH</button> et <button class="w" data-k="e02-t4">T4</button> libre dès le départ.</li><li><b>Contexte réversible ou interférence ?</b> Convalescence, changement thérapeutique, biotine et conditions de prélèvement se discutent avant une conclusion définitive. L’arrêt d’un médicament utile n’est pas automatique.</li><li><b>Cause auto-immune et apport iodé ?</b> Les <button class="w" data-k="e02-antitpo">anti-TPO</button> explorent l’auto-immunité ; s’ils sont négatifs et la suspicion forte, les anti-thyroglobuline peuvent compléter selon la <button class="w" data-k="e02-s-has">HAS</button>. Un résultat négatif n’est ni un critère obligatoire de E02 ni une preuve nutritionnelle. L’échographie répond à une indication morphologique.</li><li><b>Décision thérapeutique ?</b> Corriger les apports insuffisants, puis décider séparément de la substitution selon persistance, <button class="w" data-k="e02-tsh">TSH</button>, âge, symptômes, grossesse et contexte cardiaque. Si la causalité iodée demeure incertaine, l’écrire plutôt que forcer le code.</li></ol><p class="src">Sources : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS 2022, §§3–4 et 6–11</a> ; <a href="https://obgyn.onlinelibrary.wiley.com/doi/full/10.1111/1471-0528.18088" target="_blank" rel="noopener">RCOG 2025, §7</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3923601/" target="_blank" rel="noopener">ETA 2013, diagnostic</a>.</p><button class="pareto-btn ui" data-k="pareto-e02-diagnostic">▲ Loi de Pareto — Diagnostic</button>
</section>

<section class="ilot" id="e02-8"><h2><span class="n">8</span>Urgences et situations à ne pas manquer</h2>
<div class="alert"><b>Aucune urgence propre à E02 n’est décrite dans les sources lues.</b> La situation prioritaire est la <button class="w" data-k="e02-grossesse-risque">grossesse (risques obstétricaux et neurodéveloppementaux)</button> : <button class="w" data-k="e02-hic">HIC</button> et hypothyroxinémie isolée y sont associées à des issues obstétricales défavorables et à un moindre développement neuro-intellectuel de l’enfant. La lévothyroxine peut atténuer certaines complications obstétricales de l’<button class="w" data-k="e02-hic">HIC</button>, mais aucune preuve n’établit une amélioration du développement de l’enfant.</div>
<h3>8.1 Ce qui ne doit pas être manqué</h3>
<ul><li><b>Une <button class="w" data-k="e02-t4">T4</button> libre basse</b> : rechercher une hypothyroïdie manifeste ou une autre discordance biologique ; le code dépend de la cause, pas de cette valeur seule.</li><li><b>Une insuffisance surrénalienne</b> : l’insuffisance surrénalienne non traitée est une contre-indication de la lévothyroxine ; l’information professionnelle demande de substituer d’abord les glucocorticoïdes.</li><li><b>Une grossesse</b> : un intervalle de référence propre s’applique et l’apport en iode doit être corrigé avant la conception.</li><li><b>Une cardiopathie</b> : si un traitement est décidé, la dose initiale est abaissée à 25 µg/j.</li></ul>
<p>Ces quatre points résument le raisonnement de sécurité. Le premier modifie le diagnostic biologique et demande une nouvelle attribution causale, les deux suivants conditionnent le traitement, le dernier module sa dose. Aucun ne représente une urgence vitale propre à E02, et le cours ne crée pas de danger absent des sources.</p>
<button class="pareto-btn ui" data-k="pareto-e02-urgences">▲ Loi de Pareto — Urgences</button>
</section>

<section class="ilot" id="e02-9"><h2><span class="n">9</span>Prise en charge</h2>
<p>La prise en charge poursuit deux objectifs distincts : <b>corriger la cause nutritionnelle</b> et <b>décider s’il faut remplacer l’hormone</b>. Aucune recommandation spécifique isolée de E02 n’a été retrouvée ; la conduite assemble les recommandations <button class="w" data-k="e02-s-has">HAS</button> 2022 et <button class="w" data-k="e02-s-rcog">RCOG</button> 2025, l’évaluation suisse et la recommandation européenne historique sur l’<button class="w" data-k="e02-hic">HIC</button> (<button class="w" data-k="e02-s-eta">ETA</button> 2013), les données de l’<button class="w" data-k="e02-s-oms">OMS</button> et les publications de l’<button class="w" data-k="e02-s-osav">OSAV</button>. Aucun essai retrouvé dans les sources consultées ne compare l’iode à la lévothyroxine dans cette situation.</p>
<h3>9.1 Corriger l’apport en iode</h3>
<p>Raisonnement : dans E02, la cause est un manque de substrat. Corriger l’apport traite la cause, alors que la lévothyroxine remplace le produit final. Ce raisonnement est une inférence à partir des mécanismes ; les sources lues ne comparent pas directement les deux stratégies chez l’adulte.</p>
<ul><li><b>Population</b> : l’iodation universelle du sel est, selon l’OMS, la stratégie la plus efficace.</li><li><b>Mesures alimentaires de l’<button class="w" data-k="e02-s-osav">OSAV</button></b> : sel iodé en cuisine et à table ; produits transformés fabriqués avec du sel iodé (la liste des ingrédients mentionne « sel iodé ») ; trois portions de lait ou de produits laitiers par jour ; poisson de mer régulièrement.</li><li><b>Grossesse et allaitement</b> : les suppléments pris pendant ces périodes doivent contenir de l’iode. Une supplémentation iodée n’est pas explicitement recommandée en Suisse, mais il est conseillé de choisir un produit prénatal iodé.</li><li><b>Doses OMS</b> pour les populations où l’iodation du sel est insuffisante : 250 µg/j pendant la grossesse et l’allaitement, 150 µg/j chez la femme en âge de procréer.</li><li><b>Calendrier</b> : débuter <b>avant la conception</b>, afin que les réserves thyroïdiennes soient constituées avant la grossesse ; un supplément commencé à la fin du premier trimestre manque la période précoce du développement.</li></ul>
<p>Dans l’enquête suisse, les utilisatrices d’iode avaient une thyroglobuline plus basse et moins d’apports estimés inadéquats, mais la <button class="w" data-k="e02-tsh">TSH</button> et la <button class="w" data-k="e02-t4">T4</button> totale ne différaient pas significativement entre les groupes. Une amélioration causale de la fonction thyroïdienne ne se déduit donc pas de cette étude transversale. L’essai de supplémentation en Inde et en Thaïlande a randomisé 832 femmes à environ 11 semaines, avec une iodurie médiane initiale de 131 µg/L, vers 200 µg/j ou placebo. À 5–6 ans, les différences de quotient intellectuel et de fonctions exécutives n’étaient pas significatives. Seuls environ 313 enfants avaient l’évaluation intellectuelle : les pertes de suivi et le contexte de carence légère limitent l’extrapolation. Ce résultat ne supprime pas la prévention de la carence sévère ni le besoin d’un apport adéquat précoce.</p>
<p>Dans cette enquête, 3,4 % des utilisatrices de supplément avaient un apport habituel estimé au-dessus de 600 µg/j (intervalle de confiance 0,0–10,7 %), contre 2,0 % des non-utilisatrices ; il ne s’agit ni d’une toxicité observée ni d’une limite universelle de sécurité individuelle. Les algues peuvent apporter des quantités très élevées d’iode ; l’<button class="w" data-k="e02-s-osav">OSAV</button> le signale, et la relation en U justifie de ne pas viser l’excès.</p>
<h3>9.2 Quand remplacer l’hormone : la lévothyroxine</h3>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Situation (adulte non enceinte)</th><th style="min-width:10em">Conduite selon l’<button class="w" data-k="e02-s-eta">ETA</button> 2013</th><th style="min-width:10em">Recommandation</th></tr></thead><tbody><tr><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> supérieure à 10 mU/L, moins de 65–70 ans</td><td style="min-width:10em">Traitement recommandé, même sans symptôme</td><td style="min-width:10em">13, grade 2S</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> inférieure à 10 mU/L, symptômes, sujet jeune</td><td style="min-width:10em">Essai de lévothyroxine ; réévaluer 3 à 4 mois après normalisation de la <button class="w" data-k="e02-tsh">TSH</button> ; arrêter sans amélioration</td><td style="min-width:10em">4 et 23</td></tr><tr><td style="min-width:10em">Plus de 80–85 ans, <button class="w" data-k="e02-tsh">TSH</button> de 10 mU/L ou moins</td><td style="min-width:10em">Attentisme, traitement généralement évité</td><td style="min-width:10em">15, grade 3S</td></tr><tr><td style="min-width:10em">Objectif de perte de poids</td><td style="min-width:10em">Aucun traitement</td><td style="min-width:10em">8</td></tr><tr><td style="min-width:10em">Goitre associé à une <button class="w" data-k="e02-hic">HIC</button> persistante</td><td style="min-width:10em">Traitement à discuter</td><td style="min-width:10em">7, grade 2W</td></tr></tbody></table>
<p>Le tableau applique la logique de l’<button class="w" data-k="e02-hic">HIC (définition et seuils)</button> : le seuil de 10 mU/L et l’âge décident, les symptômes ne justifient qu’un essai limité dans le temps. Trois publications postérieures à 2013 vont dans le sens de la retenue pour les formes légères : l’essai <button class="w" data-k="e02-trust">TRUST (sujets de 65 ans et plus)</button>, la <button class="w" data-k="e02-feller">méta-analyse bernoise de 21 essais</button> et le <button class="w" data-k="e02-ofsp">rapport d’évaluation de l’OFSP (2022)</button>. Aucune ne porte spécifiquement sur l’<button class="w" data-k="e02-hic">HIC</button> iodoprive : elles guident la décision de substitution, non le choix entre iode et hormone.</p>
<p>Les <button class="w" data-k="e02-levo">modalités de la lévothyroxine (Euthyrox, information professionnelle suisse)</button> figurent dans l’onglet Pharmacologie : prise unique le matin à jeun, au moins une demi-heure avant le petit-déjeuner ; dose initiale de 25 à 50 µg/j, avec 25 µg/j chez le sujet âgé ou cardiaque ; ajustements toutes les deux à quatre semaines ; interactions avec le calcium, le fer, l’aluminium et les inhibiteurs de la pompe à protons. L’<button class="w" data-k="e02-s-eta">ETA</button> déconseille la T3 seule ou associée à la <button class="w" data-k="e02-t4">T4</button>.</p>
<h3>9.3 Retour à la vignette</h3>
<p>La patiente de 31 ans prépare une grossesse : la conduite ne consiste pas à attendre automatiquement trois mois comme chez un adulte sans projet reproductif. On confirme l’anomalie dans un délai compatible avec la conception, recherche l’auto-immunité et réévalue les apports. Le <button class="w" data-k="e02-s-rcog">RCOG</button> 2025 recommande de <b>considérer la lévothyroxine avant la conception</b> dans l’<button class="w" data-k="e02-hic">HIC</button>, particulièrement si les <button class="w" data-k="e02-antitpo">anti-TPO</button> sont déjà positifs ; la cible préconceptionnelle proposée est au plus 2,5 mU/L sous traitement. La <button class="w" data-k="e02-s-has">HAS</button> distingue notamment infertilité et assistance médicale à la procréation, avec contrôle à quatre semaines pour <button class="w" data-k="e02-tsh">TSH</button> 4–10 mU/L et traitement si l’élévation supérieure à 4 est confirmée. Le calendrier et le traitement se discutent avec le spécialiste : corriger les apports immédiatement ne doit pas retarder une substitution indiquée. Une positivité des anticorps peut révéler une cause associée ; elle ne prouve pas l’absence de carence.</p><p class="src">Sources : <a href="https://obgyn.onlinelibrary.wiley.com/doi/full/10.1111/1471-0528.18088" target="_blank" rel="noopener">RCOG 2025, §7.1</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS 2022, grossesse et infertilité</a>.</p>
<h3>Actualiser la décision après les essais</h3><p>L’évaluation suisse de l’OFSP, rapport du 29 août 2022 publié le 28 octobre, a retenu 22 études uniques dans 28 articles. Elle confirme l’effet biologique de la lévothyroxine sur la <button class="w" data-k="e02-tsh">TSH</button>, mais ne trouve pas de bénéfice clinique cohérent et pertinent sur les autres critères étudiés ; la qualité et le risque de biais varient. Les essais négatifs ne prouvent pas l’inutilité dans toutes les populations : grossesse, jeunes adultes très symptomatiques et <button class="w" data-k="e02-tsh">TSH</button> durablement très élevée sont peu ou autrement représentés.</p><p>TRUST a étudié 737 adultes d’au moins 65 ans, âge moyen 74,4 ans, <button class="w" data-k="e02-tsh">TSH</button> initiale moyenne 6,4 mU/L. À un an, la <button class="w" data-k="e02-tsh">TSH</button> moyenne était 3,63 sous traitement contre 5,48 sous placebo. Malgré cette différence, l’écart de score symptomatique était nul (IC 95 % −2,0 à 2,1), et celui de fatigue de 0,4 point (−2,1 à 2,9), pour une différence cliniquement importante prédéfinie de 9 points. L’absence d’excès significatif d’événements graves dans cet essai n’annule pas les risques connus de surdosage.</p><p>La <button class="w" data-k="e02-s-has">HAS</button> 2022 recommande un traitement chez l’adulte de moins de 65 ans avec <button class="w" data-k="e02-tsh">TSH</button> supérieure à 10 mU/L confirmée ; entre 4 et 10, la discussion tient compte des symptômes, des anticorps, du risque cardiovasculaire et d’un goitre. Un essai symptomatique est réévalué après normalisation : sans amélioration à 3–4 mois, l’arrêt se discute. L’objectif est la plage de référence adaptée et le bénéfice clinique, sans imposer la cible basse <button class="w" data-k="e02-s-eta">ETA</button> à toutes les personnes.</p><p class="src">Sources : <a href="https://www.bag.admin.ch/dam/en/sd-web/hiZGlyL6EGOQ/h0035ltsh-hta-report.pdf" target="_blank" rel="noopener">OFSP HTA 2022, résumé exécutif</a> ; <a href="https://doi.org/10.1056/NEJMoa1603825" target="_blank" rel="noopener">TRUST, résumé</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS 2022, §6</a>.</p><button class="pareto-btn ui" data-k="pareto-e02-traitement">▲ Loi de Pareto — Prise en charge</button>
</section>

<section class="ilot" id="e02-10"><h2><span class="n">10</span>Suivi, évolution et complications</h2>
<h3>10.1 Évolution</h3>
<p>La <button class="w" data-k="e02-progression">progression vers l’hypothyroïdie manifeste</button> est d’environ 5 à 8 % par an selon la <button class="w" data-k="e02-tsh">TSH</button> ; elle est de 4,3 % par an si les <button class="w" data-k="e02-antitpo">anti-TPO</button> sont positifs et de 2,6 % par an s’ils sont négatifs. Ces taux proviennent de cohortes différentes d’<button class="w" data-k="e02-hic">HIC</button> générale et ne sont pas des estimations propres à E02. Des anticorps négatifs ne définissent pas une maladie iodoprive à faible risque. Chez l’enfant, le taux de normalisation dépend fortement de la cause et de la sélection ; les séries auto-immunes ne suivent pas la même évolution que les élévations légères isolées.</p>
<h3>10.2 Complications selon la sévérité</h3>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Domaine</th><th style="min-width:10em">Constat</th><th style="min-width:10em">Nuance</th></tr></thead><tbody><tr><td style="min-width:10em">Cardiovasculaire</td><td style="min-width:10em">Risque coronarien accru surtout si la <button class="w" data-k="e02-tsh">TSH</button> dépasse 10 mU/L (rapport de risque 1,89 ; IC 95 % 1,28–2,80) ; mortalité coronarienne accrue dès 7 mU/L ; insuffisance cardiaque surtout au-dessus de 10 mU/L</td><td style="min-width:10em">Risque surtout avant 65–70 ans, qui peut disparaître après 80–85 ans</td></tr><tr><td style="min-width:10em">Lipides</td><td style="min-width:10em">La lévothyroxine abaisse le cholestérol total et le cholestérol LDL, davantage si la <button class="w" data-k="e02-tsh">TSH</button> dépasse 10 mU/L</td><td style="min-width:10em">Recommandations 11 et 12</td></tr><tr><td style="min-width:10em">Os</td><td style="min-width:10em">Pas de perte de densité minérale osseuse associée à l’<button class="w" data-k="e02-hic">HIC</button> (6 cohortes, 5458 personnes)</td><td style="min-width:10em">Résumé seul lu</td></tr><tr><td style="min-width:10em">Grossesse</td><td style="min-width:10em">Complications obstétricales et neuro-intellectuelles associées</td><td style="min-width:10em">Association, non preuve de causalité</td></tr></tbody></table>
<p>Le tableau demande de distinguer association et causalité : le risque cardiovasculaire est observé en cohorte, et l’essai TRUST n’a pas montré de bénéfice symptomatique chez le sujet âgé. Cette tension explique pourquoi le seuil de 10 mU/L et l’âge guident la décision plutôt que la seule valeur de la <button class="w" data-k="e02-tsh">TSH</button>.</p>
<h3>10.3 Suivi</h3>
<ul><li><b>Sous lévothyroxine</b> : <button class="w" data-k="e02-tsh">TSH</button> à environ deux mois, puis au moins une fois par an ; cible dans la moitié inférieure de l’intervalle (0,4 à 2,5 mU/L) chez la plupart des adultes, et 1 à 5 mU/L acceptable après 70–75 ans.</li><li><b>Sans traitement</b> : si l’<button class="w" data-k="e02-hic">HIC</button> persiste, <button class="w" data-k="e02-tsh">TSH</button> tous les six mois pendant deux ans, puis une fois par an.</li><li><b>Arrêt du suivi</b> : possible si la fonction se normalise chez un patient asymptomatique, sans anticorps ni goitre.</li><li><b>Après correction de l’iode</b> : recontrôler la <button class="w" data-k="e02-tsh">TSH</button> ; une normalisation soutient l’origine nutritionnelle. Cette dernière règle est un raisonnement de l’auteur et non une recommandation publiée.</li></ul>
<h3>Suivre une personne, pas uniquement une <button class="w" data-k="e02-tsh">TSH</button></h3><p>Le suivi vérifie la prise effective, les interactions, les apports et le bénéfice ressenti. Une <button class="w" data-k="e02-tsh">TSH</button> qui reste élevée ne signifie pas automatiquement dose trop faible : horaire, fer/calcium, changement de préparation et absorption doivent être revus. Une <button class="w" data-k="e02-tsh">TSH</button> supprimée sous traitement invite à rechercher un excès de substitution et ses effets, particulièrement chez la personne âgée et la femme ménopausée.</p><p>Les calendriers ne sont pas identiques dans les recommandations. L’<button class="w" data-k="e02-s-eta">ETA</button> 2013 propose, sans traitement, un contrôle semestriel pendant deux ans puis annuel. La <button class="w" data-k="e02-s-has">HAS</button> 2022 prévoit dans une forme stable un contrôle à un an puis tous les 2–3 ans, avec surveillance annuelle si facteurs de progression comme anticorps élevés, chirurgie ou iode radioactif. Le délai est raccourci si la clinique ou les valeurs évoluent, et la grossesse suit son propre calendrier. Sous lévothyroxine, la <button class="w" data-k="e02-s-has">HAS</button> recontrôle généralement après 6–8 semaines et annuellement une fois l’équilibre stable ; la FI exige un contrôle clinique et biologique régulier sans fixer une même cible pour tous.</p><p>Une normalisation après correction alimentaire soutient l’hypothèse nutritionnelle sans démontrer à elle seule la causalité : une anomalie transitoire aurait pu se corriger aussi. Une persistance nécessite une nouvelle analyse plutôt qu’une augmentation indéfinie de l’iode. Les cohortes associent parfois l’<button class="w" data-k="e02-hic">HIC</button> à des anomalies lipidiques ou cardiovasculaires ; elles ne prouvent pas qu’une substitution prévient l’infarctus. Dans les six cohortes de densité osseuse résumées en 2017, l’<button class="w" data-k="e02-hic">HIC</button> n’était pas associée à une perte osseuse accélérée, contrairement à l’hyperthyroïdie infraclinique ; ne pas confondre le risque de la maladie et celui du surtraitement.</p><p class="src">Sources : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS 2022, suivi</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3923601/" target="_blank" rel="noopener">ETA 2013, suivi</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">FI Euthyrox, précautions</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29034571/" target="_blank" rel="noopener">Analyse de cohortes osseuses, résumé</a>.</p><button class="pareto-btn ui" data-k="pareto-e02-suivi">▲ Loi de Pareto — Suivi et complications</button>
</section>

<section class="ilot" id="e02-11"><h2><span class="n">11</span>Situations particulières</h2>
<div class="two"><div class="card"><h4>Grossesse et allaitement</h4><p>La <button class="w" data-k="e02-grossesse">TSH se juge sur l’intervalle propre à la grossesse</button>. Le besoin d’iode est de 250 µg/j (OMS). Le nourrisson exclusivement allaité dépend entièrement de l’iode maternel. Sous lévothyroxine, le traitement se poursuit sans interruption, la dose peut devoir augmenter, et la dose antérieure est reprise après l’accouchement avec un contrôle de la <button class="w" data-k="e02-tsh">TSH</button> à six à huit semaines.</p></div><div class="card"><h4>Nourrisson et enfant</h4><p>Les préparations pour nourrissons sont enrichies en Suisse ; Paediatrica 2020 rapporte 15 à 29 µg pour 100 kcal, valeur historique et non vérification réglementaire actuelle. La diversification sans sel et le lait de vache différé après 12 mois peuvent réduire l’apport entre 6 et 12 mois. L’<button class="w" data-k="e02-enfant">HIC de l’enfant</button> se définit par une <button class="w" data-k="e02-tsh">TSH</button> supérieure à la limite propre à l’âge et à la méthode, avec <button class="w" data-k="e02-t4">T4</button> libre normale.</p></div></div>
<div class="two"><div class="card"><h4>Sujet âgé</h4><p>Les <button class="w" data-k="e02-age">intervalles de référence adaptés à l’âge</button> évitent environ 2 % de diagnostics d’<button class="w" data-k="e02-hic">HIC</button> après 75 ans et 5 % après 90 ans. L’attentisme prévaut après 80–85 ans quand la <button class="w" data-k="e02-tsh">TSH</button> ne dépasse pas 10 mU/L.</p></div><div class="card"><h4>Diabète de type 1</h4><p>Une <button class="w" data-k="e02-diabete">dysfonction thyroïdienne</button> touche environ 10 % des patients ; l’<button class="w" data-k="e02-s-eta">ETA</button> recommande une <button class="w" data-k="e02-tsh">TSH</button> annuelle (recommandation 9). La cause est alors auto-immune plus qu’iodoprive, ce qui éloigne du code E02.</p></div></div>
<h3>Grossesse : diagnostic, traitement et suivi sans mélanger les référentiels</h3><p>La <button class="w" data-k="e02-tsh">TSH</button> se compare à une référence liée au trimestre et à la méthode. En l’absence de norme appropriée, la <button class="w" data-k="e02-s-has">HAS</button> 2022 et le <button class="w" data-k="e02-s-rcog">RCOG</button> 2025 retiennent une limite supérieure pragmatique de 4,0 mU/L ; la cible thérapeutique proche de 2,5 mU/L n’est pas un seuil diagnostique universel. Le <button class="w" data-k="e02-s-rcog">RCOG</button> nomme « <button class="w" data-k="e02-hic">HIC</button> sévère » une <button class="w" data-k="e02-tsh">TSH</button> supérieure à 10 avec <button class="w" data-k="e02-t4">T4</button> libre normale, tandis que des textes plus anciens utilisaient un autre libellé. La décision rapide de traiter cette situation ne dépend pas de ce débat de vocabulaire.</p><table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Question</th><th style="min-width:10em"><button class="w" data-k="e02-s-has">HAS</button> 2022</th><th style="min-width:10em"><button class="w" data-k="e02-s-rcog">RCOG</button> 2025</th></tr></thead><tbody><tr><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> supérieure à 4, <button class="w" data-k="e02-t4">T4</button> libre normale</td><td style="min-width:10em">Traiter l’élévation confirmée ; ne pas imposer le délai ordinaire de 6 semaines à la grossesse</td><td style="min-width:10em">Considérer lévothyroxine, surtout au premier trimestre ; traiter rapidement si <button class="w" data-k="e02-tsh">TSH</button> supérieure à 10</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-antitpo">Anti-TPO</button></td><td style="min-width:10em">Recherche si <button class="w" data-k="e02-tsh">TSH</button> supérieure à 2,5 ; positivité intervient dans les décisions 2,5–4</td><td style="min-width:10em">Ne pas retarder le traitement pour les obtenir ; pas de dépistage systématique chez la femme euthyroïdienne</td></tr><tr><td style="min-width:10em">Surveillance sous traitement</td><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> toutes les 4–6 semaines jusqu’à 22 semaines d’aménorrhée, puis 30–34 semaines d’aménorrhée</td><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> et <button class="w" data-k="e02-t4">T4</button> libre toutes les 4–6 semaines jusqu’à 20 semaines d’aménorrhée, puis vers 28 semaines d’aménorrhée</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-t4">T4</button> libre basse isolée, <button class="w" data-k="e02-tsh">TSH</button> normale</td><td style="min-width:10em">Interprétation adaptée et avis spécialisé</td><td style="min-width:10em">Pas de traitement systématique ; recontrôle à 4–6 semaines</td></tr></tbody></table><p>Ces différences sont attribuées : la <button class="w" data-k="e02-s-has">HAS</button> ne recommande pas la <button class="w" data-k="e02-t4">T4</button> libre pour décider du traitement dans son parcours gravidique, alors que le <button class="w" data-k="e02-s-rcog">RCOG</button> l’intègre au profil et au suivi. Le cours ne construit pas un consensus artificiel. En Suisse, la FI Euthyrox demande un suivi spécialisé, la poursuite sans interruption pendant grossesse et allaitement et une adaptation individuelle. Pour une patiente déjà traitée, les recommandations européennes proposent un plan d’augmentation d’environ 20–30 % dès le début de grossesse ; ce plan est préparé avec le prescripteur, et non transformé en dose automatique applicable à toute <button class="w" data-k="e02-hic">HIC</button>.</p><p>Après l’accouchement, la FI suisse prévoit de revenir immédiatement à la dose préconceptionnelle et de contrôler la <button class="w" data-k="e02-tsh">TSH</button> à 6–8 semaines ; le <button class="w" data-k="e02-s-rcog">RCOG</button> propose le retour à deux semaines. La conduite suisse du produit exact est explicitée, avec ajustement spécialisé. Chez une femme dont le traitement a commencé pendant la grossesse, un arrêt éventuel est une décision individualisée avec contrôle, pas une consigne générale.</p><h3>Enfant et nourrisson</h3><p>L’<button class="w" data-k="e02-s-eta">ETA</button> 2014 demande des références adaptées à l’âge et à la méthode : la notation « 5,5–10 » des études désigne une plage étudiée, pas une limite unique valable de la naissance à l’adolescence. Dans une grande série de demandes de dosages chez l’enfant, 73,6 % des <button class="w" data-k="e02-tsh">TSH</button> initialement entre 5,5 et 10 se normalisaient au contrôle ; les anticorps n’étaient disponibles que chez une minorité. Une série idiopathique sélectionnée de 92 enfants trouvait 41 % de normalisation à deux ans, 47 % de stabilité et 12 % de <button class="w" data-k="e02-tsh">TSH</button> dépassant 10. Ces résultats illustrent la dépendance à la population.</p><p>Au-delà de 3 ans, sans anticorps et avec <button class="w" data-k="e02-t4">T4</button> libre normale, une <button class="w" data-k="e02-hic">HIC</button> légère est souvent surveillée ; l’<button class="w" data-k="e02-s-eta">ETA</button> propose un contrôle à un an, rapproché si aggravation. En contexte auto-immun, elle propose 6–12 mois et davantage si la <button class="w" data-k="e02-tsh">TSH</button> dépasse 10 sans traitement. Chez le nourrisson avec <button class="w" data-k="e02-tsh">TSH</button> persistante après le premier mois, l’orientation spécialisée et la protection du développement priment : l’ancien guide recommande une substitution jusqu’à réévaluation vers 3 ans. Ce repère n’est ni un protocole de dépistage néonatal suisse ni une prescription de dose à partir de ce cours adulte.</p><p>Le nourrisson ne doit pas recevoir davantage de sel pour corriger un risque iodé. Paediatrica recommande de considérer l’apport maternel, les préparations enrichies et la diversification ; le lait de vache comme boisson est différé après 12 mois. Les exigences réglementaires de composition citées dans l’article de 2020 sont datées.</p><h3>Personne âgée, rein et foie</h3><p>La <button class="w" data-k="e02-s-has">HAS</button> 2022 adapte la limite supérieure de <button class="w" data-k="e02-tsh">TSH</button> à l’âge ; son repère de 8 mU/L entre 80 et 89 ans est une proposition de référence, pas un seuil de traitement. Elle discute une <button class="w" data-k="e02-tsh">TSH</button> persistante de 10–20 selon symptômes et risque cardiovasculaire, et recommande le traitement au-dessus de 20. La cible est plus haute que chez le jeune adulte et doit éviter une <button class="w" data-k="e02-tsh">TSH</button> basse. Le repère <button class="w" data-k="e02-s-eta">ETA</button> d’attentisme après 80–85 ans pour <button class="w" data-k="e02-tsh">TSH</button> au plus 10 reste concordant avec cette prudence. L’âge biologique, les comorbidités et les préférences comptent aussi.</p><p>La FI Euthyrox ne fournit pas de schéma posologique validé particulier pour insuffisance rénale ou hépatique : elle signale l’absence d’études et les modifications possibles de liaison protéique. Aucune réduction de dose numérique n’est inventée. Toute substitution reste ajustée à la clinique et aux analyses.</p><p class="src">Sources : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS 2022, §§7–11</a> ; <a href="https://obgyn.onlinelibrary.wiley.com/doi/full/10.1111/1471-0528.18088" target="_blank" rel="noopener">RCOG 2025, §§4–8</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4109520/" target="_blank" rel="noopener">ETA 2014, enfance et recommandations 24–30</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Paediatrica 2020</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">FI Euthyrox</a>.</p><button class="pareto-btn ui" data-k="pareto-e02-particulier">▲ Loi de Pareto — Situations particulières</button>
</section>

<section class="ilot" id="e02-12"><h2><span class="n">12</span>Critères formels et paramètres clés</h2>
<div class="alert"><b>Critères formels et incertitude.</b> Aucun score individuel validé de E02 n’a été identifié dans les sources consultées. Le raisonnement pédagogique exige : une <button class="w" data-k="e02-hic">HIC</button> persistante définie par <button class="w" data-k="e02-tsh">TSH</button> et <button class="w" data-k="e02-t4">T4</button> libre adaptées à la population ; une recherche des causes concurrentes ; une analyse concrète des apports et besoins ; une attribution iodée explicitement argumentée. Les <button class="w" data-k="e02-antitpo">anti-TPO</button> négatifs ne sont pas obligatoires et ne prouvent pas la carence. Une <button class="w" data-k="e02-t4">T4</button> libre basse fait sortir du cadre infraclinique, mais la classification reste étiologique. Une médiane urinaire de population ne remplace aucune de ces étapes.</div>
<div class="key"><b>Paramètres clés.</b> <table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Paramètre</th><th style="min-width:10em">Valeur</th></tr></thead><tbody><tr><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> de référence de l’adulte (<button class="w" data-k="e02-s-eta">ETA</button>)</td><td style="min-width:10em">0,4 à 4,0 mU/L</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-hic">HIC</button> légère ; <button class="w" data-k="e02-hic">HIC</button> sévère</td><td style="min-width:10em">4,0 à 10,0 mU/L ; plus de 10 mU/L</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-hic">HIC</button> de l’enfant</td><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> supérieure à la limite propre à l’âge et à la méthode, avec <button class="w" data-k="e02-t4">T4</button> libre normale</td></tr><tr><td style="min-width:10em">Contrôle de confirmation</td><td style="min-width:10em">2 à 3 mois : <button class="w" data-k="e02-tsh">TSH</button>, <button class="w" data-k="e02-t4">T4</button> libre, <button class="w" data-k="e02-antitpo">anti-TPO</button></td></tr><tr><td style="min-width:10em">Normalisation spontanée</td><td style="min-width:10em">6 à 35 %</td></tr><tr><td style="min-width:10em">Progression vers l’hypothyroïdie manifeste</td><td style="min-width:10em">Cohortes <button class="w" data-k="e02-hic">HIC</button> générale : 5–8 %/an selon <button class="w" data-k="e02-tsh">TSH</button> ; 2,6 % avec anticorps négatifs, pas taux E02</td></tr><tr><td style="min-width:10em">Apport en iode, adulte</td><td style="min-width:10em">150 µg/j (OMS, <button class="w" data-k="e02-s-efsa">EFSA</button>)</td></tr><tr><td style="min-width:10em">Apport en iode, grossesse et allaitement</td><td style="min-width:10em">250 µg/j (OMS) ; 200 µg/j (<button class="w" data-k="e02-s-efsa">EFSA</button>)</td></tr><tr><td style="min-width:10em">Iodurie médiane, seuils de population</td><td style="min-width:10em">100 µg/L (écoliers) ; 150 µg/L (grossesse)</td></tr><tr><td style="min-width:10em">Iodurie médiane suisse 2020–2022</td><td style="min-width:10em">127 µg/L (écoliers) ; 97 µg/L (grossesse)</td></tr><tr><td style="min-width:10em">Sel iodé suisse</td><td style="min-width:10em">25 mg/kg depuis 2014</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> néonatale</td><td style="min-width:10em">Moins de 3 % de valeurs supérieures à 5 mU/L : suffisance de la population</td></tr><tr><td style="min-width:10em">Lévothyroxine, dose initiale</td><td style="min-width:10em">25 à 50 µg/j ; 25 µg/j si âgé ou cardiaque</td></tr><tr><td style="min-width:10em">Cible de <button class="w" data-k="e02-tsh">TSH</button> sous traitement</td><td style="min-width:10em">0,4 à 2,5 mU/L ; 1 à 5 mU/L après 70–75 ans</td></tr></tbody></table></div>
<p class="src">Références principales : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Eur Thyroid J 2013)</a> ; <a href="https://doi.org/10.1007/s00394-023-03287-6" target="_blank" rel="noopener">Fischer et al., apport en iode en Suisse (Eur J Nutr 2024)</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a> ; <a href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">OSAV, sel iodé</a>. Dossier complet : voir les fenêtres et l’onglet Pharmacologie.</p>
</section>
<section class="ilot" id="e02-13"><h2><span class="n">13</span>Points clés : expliquer la décision au patient</h2><p>Le résultat biologique doit d’abord être nommé correctement : <button class="w" data-k="e02-tsh">TSH</button> élevée avec T4 libre normale, confirmée et interprétée avec l’âge, la grossesse et le laboratoire. Le mot « infraclinique » ne signifie pas que la plainte est imaginaire ; il signifie que l’hormone libre reste dans la norme. Une fatigue peut avoir plusieurs causes et une baisse de <button class="w" data-k="e02-tsh">TSH</button> sous traitement ne garantit pas qu’elle disparaîtra.</p><p>La cause iodée se recherche par l’histoire alimentaire et le contexte, tout en explorant les autres causes. Une iodurie ponctuelle n’autorise pas à annoncer « vous êtes carencé ». Les anticorps explorent l’auto-immunité ; ils ne sont pas un test de l’apport iodé. Quand la causalité reste incertaine, la formulation clinique doit le dire.</p><p>Le plan de prise en charge précise trois éléments concrets : comment assurer un apport adapté sans excès de sel ni cumul de compléments ; pourquoi une substitution est indiquée, discutée ou différée ; quand et sur quels critères la décision sera réévaluée. Une grossesse ou un projet de conception est signalé dès le départ. Si un essai symptomatique est choisi, son objectif et son terme de réévaluation sont convenus avant de le prolonger.</p><p class="src">Sources : <button class="w" data-k="e02-s-has">HAS</button> 2022, diagnostic et HIC ; <button class="w" data-k="e02-s-rcog">RCOG</button> 2025, préconception ; OSAV, sel iodé ; OFSP 2022, bénéfices du traitement.</p><button class="pareto-btn ui" data-k="pareto-e02-cles">▲ Loi de Pareto — Points clés</button></section>
<section class="ilot" id="e02-14"><h2><span class="n">14</span>Pièges et raisonnement pour l’examen fédéral</h2><table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Raccourci trompeur</th><th style="min-width:10em">Correction</th></tr></thead><tbody><tr><td style="min-width:10em"><button class="w" data-k="e02-tsh">TSH</button> élevée = carence iodée</td><td style="min-width:10em">Confirmer le profil, puis argumenter la cause</td></tr><tr><td style="min-width:10em"><button class="w" data-k="e02-antitpo">Anti-TPO</button> négatifs = E02</td><td style="min-width:10em">Ils n’excluent pas l’auto-immunité et ne mesurent pas l’apport</td></tr><tr><td style="min-width:10em">Iodurie à 90 µg/L = diagnostic individuel</td><td style="min-width:10em">Les seuils OMS classent des médianes de populations</td></tr><tr><td style="min-width:10em">2,5 mU/L = seuil universel en grossesse</td><td style="min-width:10em">Distinguer référence diagnostique et cible thérapeutique</td></tr><tr><td style="min-width:10em">Toute HIC peut attendre trois mois</td><td style="min-width:10em">Grossesse, conception et nourrisson demandent un calendrier propre</td></tr><tr><td style="min-width:10em">Normaliser la <button class="w" data-k="e02-tsh">TSH</button> prouve un bénéfice clinique</td><td style="min-width:10em">Les essais évaluent séparément symptômes et biologie</td></tr><tr><td style="min-width:10em">Un complément prénatal contient forcément de l’iode</td><td style="min-width:10em">Lire le produit exact et calculer le total</td></tr><tr><td style="min-width:10em">Iode nutritionnel et comprimé nucléaire sont interchangeables</td><td style="min-width:10em">L’iodure de potassium 65 mg appartient à la radioprotection sur ordre des autorités</td></tr></tbody></table><p>PROFILES 2017 comporte l’examen de la thyroïde, le goitre et les hormones thyroïdiennes anormales comme compétences ou points de départ. Les quatre vignettes de l’onglet Examens exercent la confirmation, l’attribution, la décision et l’analyse d’une interférence. Elles sont fictives et ne sont ni des sujets officiels ni une garantie de contenu de l’examen. La classification E02 n’a pas de sous-code dans le catalogue OFS utilisé ici.</p><p class="src"><a href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">PROFILES 2017, examen thyroïdien et situations de départ</a> ; <button class="w" data-k="e02-s-has">HAS</button> 2022 ; <button class="w" data-k="e02-s-rcog">RCOG</button> 2025 ; informations professionnelles suisses.</p><button class="pareto-btn ui" data-k="pareto-e02-pieges">▲ Loi de Pareto — Pièges</button></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>
