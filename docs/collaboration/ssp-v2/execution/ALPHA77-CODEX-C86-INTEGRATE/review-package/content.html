<section class="ilot" id="c86-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>La rubrique C86 regroupe sept sous-codes, mais plusieurs maladies et même plusieurs lignées cellulaires. C86.6 rassemble notamment la papulose lymphomatoïde et le lymphome anaplasique cutané primitif ; C86.4 conserve un ancien nom NK alors que le BPDCN est une néoplasie dendritique. Le code sert à classer ; la biopsie et la synthèse spécialisée déterminent la maladie et son traitement.</p>
<p>Ce cours apprend à reconnaître le siège atteint, choisir un prélèvement utile, distinguer une urgence d’un bilan programmé et expliquer le traitement à partir de la biologie. Les trois vignettes suivantes sont fictives ; elles ne décrivent aucun patient réel.</p>
<div class="two"><div class="card"><h4>Le nez : lésion destructive</h4><p>Un homme de 45 ans présente obstruction nasale, épistaxis et ulcération du palais. Un ENKTL est une hypothèse importante : la biopsie recherche un infiltrat compatible et l’EBV dans les cellules tumorales par EBER. L’ADN d’EBV plasmatique aide ensuite au pronostic et au suivi. Le traitement dépend du stade et de l’aptitude : radiothérapie et programme sans anthracycline contenant de l’asparaginase chez de nombreux patients localisés aptes ; radiothérapie seule possible dans certaines formes de stade I peu volumineuses ou chez un patient fragile.</p></div>
<div class="card"><h4>La rate : maladie sans gros ganglions</h4><p>Un homme de 25 ans sous thiopurine et anti-TNF pour Crohn présente fièvre, splénomégalie et cytopénies. L’absence de ganglion palpable ne rassure pas : le HSTL infiltre préférentiellement rate, foie et moelle. Une biopsie ostéomédullaire avec étude adaptée est prioritaire, parallèlement à la recherche d’infection et de HLH.</p></div></div>
<div class="card"><h4>La peau : chaque lésion disparaît</h4><p>Des papules reviennent par poussées puis régressent spontanément. Cette chronologie oriente vers une papulose lymphomatoïde, à confirmer par corrélation clinique et histologique. L’observation peut être adaptée ; une polychimiothérapie ne prévient pas les récidives ni les lymphomes associés et expose à des dommages disproportionnés.</p></div>
<p>Les objectifs sont de relier chaque entité à son tissu, d’interpréter les marqueurs sans les isoler de la morphologie, de reconnaître HLH, atteinte respiratoire, complication digestive et toxicité, puis de distinguer preuve d’efficacité, autorisation suisse et remboursement. Les six onglets scientifiques expliquent les mécanismes depuis la fonction normale.</p><button class="w" data-k="c86-famille">Définition et frontières de la famille</button><div class="key"><b>À retenir.</b> Le siège, la chronologie, le terrain et l’EBV orientent une hypothèse. Ils ne remplacent pas la preuve et la classification spécialisée.</div><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">[S210] BfArM, CIM-10-GM 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S203] Khoury et al., OMS myéloïde/dendritique 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a>.</p></section>
<section class="ilot" id="c86-1"><h2><span class="n">1</span>Définition, famille et classifications</h2><p>Les lymphomes T périphériques dérivent de lymphocytes T matures ; les classifications et recommandations discutent aussi certaines néoplasies NK. Beaucoup d’entités nodales ou extranodales sont agressives et justifient une stratégie à intention curative. Cette description ne doit pas englober artificiellement les proliférations cutanées indolentes, les lymphoproliférations digestives indolentes ou le BPDCN. La vitesse d’évolution et l’intensité du traitement dépendent de l’entité.</p>
<p>L’OMS 2022 décrit la classification biologique ; l’ICC 2022 est également discutée par Onkopedia. La mise à jour OMS–EORTC 2018 reste une source de classification cutanée. La correspondance ci-dessous est celle de la CIM-10-GM 2024 effectivement consultée : elle ne constitue pas une vérification exhaustive du codage administratif suisse applicable en 2026.</p><table class="t"><thead><tr><th>Sous-code</th><th>Entité enseignée</th><th>Frontière à connaître</th></tr></thead><tbody><tr><td>C86.0</td><td><button class="w" data-k="c86-enktl">Lymphome extranodal NK/T, ENKTL</button></td><td>L’OMS abandonne « type nasal » dans le nom biologique : peau, tube digestif et autres sites existent. La leucémie NK agressive est distincte.</td></tr><tr><td>C86.1</td><td><button class="w" data-k="c86-hstl">Lymphome T hépatosplénique, HSTL</button></td><td>Le phénotype TCR est surtout gamma-delta, parfois alpha-bêta ou silencieux.</td></tr><tr><td>C86.2</td><td><button class="w" data-k="c86-eatl">Lymphome T associé à une entéropathie, EATL</button></td><td>MEITL est une entité séparée ; l’ancien nom « EATL type II » ne convient pas à la classification actuelle.</td></tr><tr><td>C86.3</td><td><button class="w" data-k="c86-sptcl">Lymphome T sous-cutané de type panniculite, SPTCL</button></td><td>Réservé au phénotype alpha-bêta ; le lymphome T gamma-delta cutané est différent.</td></tr><tr><td>C86.4</td><td><button class="w" data-k="c86-bpdcn">Néoplasie blastique à cellules dendritiques plasmacytoïdes, BPDCN</button></td><td>Incluse sous un ancien intitulé NK ; classée parmi les néoplasies dendritiques/histiocytaires dans l’OMS 2022.</td></tr><tr><td>C86.5</td><td><button class="w" data-k="c86-ntfh">Lymphome TFH nodal de type angio-immunoblastique, nTFHL-AI</button></td><td>Ancien AITL ; les types TFH nodal folliculaire et sans autre spécification restent distincts.</td></tr><tr><td>C86.6</td><td><button class="w" data-k="c86-cd30">Proliférations cutanées primitives CD30 positives</button></td><td>Comprend LyP et pcALCL. Un ALCL systémique avec localisation cutanée relève d’une autre entité.</td></tr></tbody></table><p>Le lymphome anaplasique systémique ALK positif ou négatif est classé C84.6/C84.7 dans la table lue. Un ALK positif dans une biopsie cutanée impose de rechercher une maladie systémique, mais de rares cas primitivement cutanés ALK positifs existent : l’immunomarquage seul ne tranche pas. L’histoire, l’examen et le bilan d’extension sont indispensables.</p><button class="w" data-k="c86-classif">Détail du codage et de la classification</button><div class="trap"><span class="k">Piège</span> C86.4 n’est pas une tumeur NK par sa biologie. C86.6 ne correspond pas à une seule maladie. Un compte rendu moderne se lit avec l’entité OMS et son extension, puis se traduit en code.</div><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">[S210] BfArM, CIM-10-GM 2024</a> ; <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S203] Khoury et al., OMS myéloïde/dendritique 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">[S206] OMS–EORTC 2018, publié 2019</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">[S208] Onkopedia, octobre 2025, DGHO/OeGHO/SSH/SGMO</a>.</p></section>
<section class="ilot" id="c86-2"><h2><span class="n">2</span>Épidémiologie : population et mesure avant le pourcentage</h2><p>La revue suisse SZO 2021 cite les données NICER et situe les lymphomes T autour de 10–15 % des lymphomes nouvellement diagnostiqués en Suisse. Il s’agit d’une donnée secondaire publiée en 2021, non d’une extraction nationale 2026. Onkopedia 2025 décrit, pour les PTCL en Europe, environ 10–15 % des lymphomes non hodgkiniens. Ces dénominateurs ne sont pas interchangeables. Aucune incidence suisse contemporaine séparée pour chaque sous-code C86 n’est établie dans le dossier consulté.</p><table class="t"><thead><tr><th>Population</th><th>Observation utile</th><th>Limite</th></tr></thead><tbody><tr><td>ENKTL, revue Tse 2022</td><td>Plus fréquent en Asie et en Amérique centrale/du Sud ; majorité de présentations nasales, mais formes extranodales ailleurs.</td><td>La revue discute aussi la leucémie NK agressive ; elle ne devient pas pour autant un sous-type actuel de l’ENKTL.</td></tr><tr><td>HSTL et Crohn sous thiopurine, revue Carvão 2019</td><td>La compilation de monothérapies comporte 19 cas ; 15 hommes, deux femmes et deux sexes non renseignés.</td><td>Une série publiée de cas rares n’est pas un registre de prévalence. Les données cliniques ne sont disponibles que pour une partie des cas.</td></tr><tr><td>EATL et maladie cœliaque réfractaire de type II</td><td>Association forte avec l’entéropathie ; ESsCD décrit un EATL chez jusqu’à la moitié des RCD-II dans les données discutées.</td><td>Cette proportion concerne une population réfractaire sélectionnée ; elle ne s’applique pas à toute maladie cœliaque.</td></tr><tr><td>Registres cutanés néerlandais/autrichien 2002–2017</td><td>LyP : 12 % ; pcALCL : 8 % ; SPTCL : 1 % des lymphomes cutanés.</td><td>Les proliférations CD30 positives représentent environ un quart des lymphomes T cutanés, dont le dénominateur est plus étroit.</td></tr><tr><td>BPDCN, consensus 2023</td><td>Maladie rare, surtout adulte âgé mais possible chez l’enfant.</td><td>Les populations d’essais et de greffe ne décrivent pas à elles seules tous les patients suisses.</td></tr></tbody></table><p><b>Exemple de lecture critique.</b> Carvão cite chez les hommes de moins de 35 ans un risque de HSTL de 1/7 404 sous thiopurine seule et 1/3 534 sous association thiopurine–anti-TNF. Le passage ne fournit pas d’horizon annuel. Le calcul 100 ÷ 3 534 donne environ 0,0283 % ; 10 000 ÷ 3 534 donne 2,83 événements pour 10 000 personnes dans le cadre de l’estimation, pas pour 10 000 personnes-années. Diviser les deux estimations donne environ 2,1, sans prouver une causalité individuelle ni un effet identique dans toute population.</p><button class="w" data-k="c86-thiopurine">Calcul depuis les bases et limites du risque</button><div class="key"><b>À retenir.</b> Toujours préciser : population, période, dénominateur et type de mesure. Une survie spécifique n’est pas une survie globale ; un taux de réponse n’est pas une probabilité de guérison.</div><button class="pareto-btn ui" data-k="pareto-c86-definition">▲ Loi de Pareto — Définition, classifications et épidémiologie</button><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">[S209] Zander et Renner, revue suisse SZO 2021</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">[S208] Onkopedia, octobre 2025, DGHO/OeGHO/SSH/SGMO</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6624667/" target="_blank" rel="noopener">[S211] Carvão et al., revue de cas Crohn/HSTL, 2019</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">[S206] OMS–EORTC 2018, publié 2019</a> ; <a href="https://journals.lww.com/hemasphere/fulltext/2023/03000/unmet_clinical_needs_and_management.2.aspx" target="_blank" rel="noopener">[S217] Pagano et al., consensus international BPDCN 2023</a>.</p></section>
<section class="ilot" id="c86-3"><h2><span class="n">3</span>Physiopathologie : du fonctionnement normal au signe</h2><p>Une cellule T mature utilise un récepteur T issu de réarrangements géniques. Une réponse normale peut amplifier un clone ; la clonalité n’est donc pas synonyme de cancer. Une cellule NK n’utilise pas ce récepteur réarrangé. Les marqueurs de différenciation orientent le diagnostic, mais une tumeur peut perdre CD5, CD7 ou d’autres marqueurs normalement attendus : c’est l’ensemble morphologique, phénotypique et moléculaire qui compte.</p><table class="t"><thead><tr><th>Entité</th><th>Perturbation</th><th>Conséquence et limite</th></tr></thead><tbody><tr><td>ENKTL</td><td>EBV dans les cellules tumorales ; angio-invasion et nécrose ; multirésistance, notamment P-gp ; activité souvent faible de l’asparagine synthétase.</td><td>Ulcération destructive, intérêt d’EBER tissulaire et de l’ADN d’EBV plasmatique ; programmes sans anthracycline contenant de l’asparaginase. Ce profil n’est pas un test individuel suffisant pour choisir tout le protocole.</td></tr><tr><td>HSTL</td><td>Infiltration des territoires sinusoïdaux de rate, foie et moelle ; anomalies cytogénétiques dont i(7q).</td><td>Organomégalie et cytopénies avec peu ou pas de ganglions. Une cytopénie peut aussi être inflammatoire, médicamenteuse ou liée au HLH.</td></tr><tr><td>EATL</td><td>Prolifération T intestinale dans un contexte d’entéropathie ; RCD-II possible avec lymphocytes intraépithéliaux aberrants.</td><td>Malabsorption, dénutrition, douleur, saignement, obstruction ou perforation. La séquence cœliaque→RCD-II→EATL n’est pas documentée chez chaque malade.</td></tr><tr><td>SPTCL</td><td>Infiltrat cytotoxique alpha-bêta dans l’hypoderme ; HAVCR2/TIM-3 altéré dans certaines populations.</td><td>Nodules profonds et parfois hyperinflammation. Les proportions de variants varient selon les cohortes ; le génotype n’est ni nécessaire au diagnostic ni suffisant pour prédire le HLH.</td></tr><tr><td>BPDCN</td><td>Prolifération de cellules dendritiques plasmacytoïdes immatures ; CD123 et autres marqueurs pDC.</td><td>Lésions cutanées, atteinte médullaire, sanguine ou neurologique ; cible CD123 pour le tagraxofusp, dans un diagnostic intégré.</td></tr><tr><td>nTFHL-AI</td><td>Anomalies TET2/DNMT3A précoces, puis RHOA/IDH2 dans le modèle tumoral ; microenvironnement immunitaire perturbé.</td><td>Adénopathies, hypergammaglobulinémie, manifestations auto-immunes ; Coombs positif ne prouve pas à lui seul une hémolyse.</td></tr><tr><td>LyP et pcALCL</td><td>Proliférations CD30 positives, architecture et évolution différentes.</td><td>Une cytologie inquiétante peut coexister avec la régression spontanée d’une LyP. L’intensité du traitement dépend de l’entité et de l’extension.</td></tr></tbody></table><p>L’ADN d’EBV détecté dans le plasma provient notamment de fragments libérés lors de la mort des cellules tumorales ; il ne faut pas décrire ce phénomène comme une mesure de virus infectieux circulants. Le sang total peut aussi contenir de l’EBV provenant de lymphocytes B porteurs : le choix du prélèvement influence l’interprétation et le suivi.</p><button class="w" data-k="c86-pgp">P-gp, asparagine et conséquence thérapeutique</button> <button class="w" data-k="c86-tfh">Fonction TFH et anomalies tumorales</button> <button class="w" data-k="c86-havcr2">TIM-3 : mécanisme et incertitude statistique</button><div class="key"><b>À retenir.</b> Une explication biologique rend un traitement compréhensible ; elle ne remplace pas les preuves cliniques ni l’étude de ses effets indésirables.</div><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S203] Khoury et al., OMS myéloïde/dendritique 2022</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">[S212] Moonla et al., Haematologica 2023</a> ; <a href="https://www.nature.com/articles/s41588-018-0251-4" target="_blank" rel="noopener">[S213] Gayden et al., Nature Genetics 2018, résumé lu</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">[S206] OMS–EORTC 2018, publié 2019</a>.</p></section>
<section class="ilot" id="c86-4"><h2><span class="n">4</span>Causes, facteurs de risque et prévention raisonnée</h2><p>L’interrogatoire recherche une immunosuppression, une maladie inflammatoire digestive, une entéropathie, les antécédents hématologiques et les traitements. Ces informations orientent les hypothèses sans attribuer automatiquement la maladie à une exposition. Une infection et une hémopathie peuvent coexister.</p><table class="t"><thead><tr><th>Contexte</th><th>Entité évoquée</th><th>Interprétation</th></tr></thead><tbody><tr><td>EBV tissulaire, terrain géographique</td><td>ENKTL</td><td>L’EBV est un élément de définition dans le tissu compatible ; une sérologie positive isolée est très fréquente et ne démontre pas un lymphome.</td></tr><tr><td>Immunosuppression chronique, thiopurine ± anti-TNF</td><td>HSTL</td><td>Vigilance particulière chez l’homme jeune ; les cas existent aussi sans ce terrain. Une durée de deux ans n’est pas un seuil de diagnostic ni une instruction automatique d’arrêt.</td></tr><tr><td>Maladie cœliaque, surtout RCD-II</td><td>EATL</td><td>Rechercher l’exposition au gluten, confirmer l’entéropathie et exclure les autres causes avant de qualifier une maladie de réfractaire.</td></tr><tr><td>Variants germinaux HAVCR2</td><td>SPTCL/HLH dans certaines cohortes</td><td>Les distributions varient avec l’ascendance et la sélection. Le résumé Gayden rapporte environ 60 % dans sa série ; Moonla discute une plage de 25–60 % selon les études.</td></tr><tr><td>Hématopoïèse clonale TET2/DNMT3A</td><td>Lymphome TFH nodal</td><td>Une mutation sanguine peut exister dans plusieurs lignées sans établir à elle seule le diagnostic de lymphome.</td></tr><tr><td>Implant mammaire</td><td>BIA-ALCL, hors de ce groupe</td><td>Entité distincte à ne pas confondre avec un pcALCL.</td></tr></tbody></table><p>La prévention consiste notamment à réévaluer le rapport bénéfice–risque des immunosuppresseurs avec l’équipe qui traite la maladie digestive, à informer sur les signes persistants et à organiser le suivi adapté. La revue de cas de 2019 cite d’anciennes propositions de limitation d’exposition combinée ; elle ne suffit pas à prescrire en 2026 un arrêt universel après deux ans. Un arrêt non concerté peut aussi déstabiliser la maladie de Crohn.</p><div class="trap"><span class="k">Piège</span> Un facteur de risque n’est ni une preuve diagnostique ni une certitude causale. Les estimations de risque des hommes de moins de 35 ans ne sont pas transposées à toute personne sous thiopurine.</div><button class="pareto-btn ui" data-k="pareto-c86-mecanismes">▲ Loi de Pareto — Physiopathologie et facteurs de risque</button><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6624667/" target="_blank" rel="noopener">[S211] Carvão et al., revue de cas Crohn/HSTL, 2019</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://www.nature.com/articles/s41588-018-0251-4" target="_blank" rel="noopener">[S213] Gayden et al., Nature Genetics 2018, résumé lu</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">[S212] Moonla et al., Haematologica 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a>.</p></section>
<section class="ilot" id="c86-5"><h2><span class="n">5</span>Anamnèse et sémiologie clinique</h2><div data-semiology-clinical="C86"><p>Commencer par la chronologie : apparition, progression, poussées, disparition complète ou persistance. Documenter fièvre, sueurs nocturnes, amaigrissement et retentissement fonctionnel. Puis préciser le siège, les traitements et l’immunosuppression. Les symptômes généraux sont peu spécifiques ; leur association au siège et au temps oriente le prélèvement.</p><table class="t"><thead><tr><th>Récit du patient</th><th>Mécanisme à envisager</th><th>Question suivante</th></tr></thead><tbody><tr><td>Obstruction nasale, épistaxis, douleur ou ulcère palatin</td><td>Lésion infiltrante/destructive, ENKTL possible</td><td>Depuis quand ? Progression ? Dysphagie, gêne respiratoire ? Examen ORL et tissu viable pour biopsie.</td></tr><tr><td>Fièvre, fatigue, satiété précoce, ventre augmenté</td><td>Splénomégalie, infiltration, cytopénies ou HLH</td><td>Crohn, thiopurine/anti-TNF, infection, saignements ? L’absence de ganglion ne clôt pas le bilan.</td></tr><tr><td>Douleurs, perte de poids, diarrhée malgré régime</td><td>Entéropathie persistante, RCD-II ou EATL possible</td><td>Diagnostic cœliaque confirmé ? Adhésion au régime ? Vomissement, arrêt du transit, sang ou douleur brutale ?</td></tr><tr><td>Nodules sous-cutanés douloureux, fièvre</td><td>Panniculite tumorale ou inflammatoire</td><td>Profondeur, extension, symptômes de lupus, fièvre persistante et cytopénies évoquant HLH.</td></tr><tr><td>Papules récidivantes qui disparaissent</td><td>LyP possible</td><td>Photographies datées, délai de régression, cicatrices ; une lésion qui persiste ou grossit doit être réévaluée.</td></tr><tr><td>Nodule cutané persistant ou plaques violacées</td><td>pcALCL, BPDCN et autres diagnostics</td><td>Distribution, extension extracutanée, signes sanguins ou neurologiques ; l’aspect n’est pas spécifique.</td></tr></tbody></table><p>Une fatigue avec dyspnée d’effort peut accompagner l’anémie ; des pétéchies orientent vers un trouble plaquettaire ; des infections répétées font rechercher une neutropénie ou une immunodépression. Aucun de ces liens n’est exclusif. Dans le lymphome TFH, une hémolyse auto-immune peut contribuer à l’anémie, à confronter aux réticulocytes, à la bilirubine, à la LDH, à l’haptoglobine et au test direct à l’antiglobuline.</p>
<p>Le dialogue précise les objectifs du patient, sa compréhension des biopsies et traitements, ses contraintes de déplacement et le soutien disponible. Une stratégie intensive ou une greffe se discute avec l’état fonctionnel et les préférences ; l’âge chronologique seul ne remplace pas cette évaluation.</p></div><button class="w" data-k="c86-diffdx">Comparer les diagnostics différentiels</button><div class="key"><b>À retenir.</b> La régression répétée de chaque lésion cutanée est une donnée diagnostique majeure. La noter ne dispense pas de biopsier une lésion représentative et de confronter le résultat.</div><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6624667/" target="_blank" rel="noopener">[S211] Carvão et al., revue de cas Crohn/HSTL, 2019</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">[S206] OMS–EORTC 2018, publié 2019</a> ; <a href="https://journals.lww.com/hemasphere/fulltext/2023/03000/unmet_clinical_needs_and_management.2.aspx" target="_blank" rel="noopener">[S217] Pagano et al., consensus international BPDCN 2023</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S223] HUG, enseignement hémogramme adulte, septembre 2019</a>.</p></section>
<section class="ilot" id="c86-6"><h2><span class="n">6</span>Examen clinique : site biopsiable et gravité</h2><p>Évaluer d’abord les fonctions vitales et la tolérance : état général, respiration, circulation, température, état neurologique et retentissement de la douleur. Une obstruction respiratoire, un état de choc, une aggravation multiviscérale ou un tableau abdominal aigu impose une prise en charge urgente, pendant que le diagnostic étiologique avance.</p><table class="t"><thead><tr><th>Territoire</th><th>Observation</th><th>Ce qu’elle permet et ne permet pas</th></tr></thead><tbody><tr><td>Bouche, nez, voies aériennes</td><td>Ulcération nécrotique, perforation, saignement, masse</td><td>Oriente le bilan ORL et la biopsie. L’aspect ne distingue pas seul tumeur, infection et autre inflammation. Une lésion très nécrotique peut fournir un prélèvement non contributif.</td></tr><tr><td>Foie, rate, ganglions</td><td>Organomégalie ; taille, siège et évolution des ganglions</td><td>Dans la revue Carvão, la splénomégalie était présente dans les 11 cas avec données cliniques, l’hépatomégalie dans sept. Ce sous-groupe ne définit pas une sensibilité diagnostique.</td></tr><tr><td>Peau et hypoderme</td><td>Papules à plusieurs stades, ulcère, nodule profond, plaque violacée</td><td>Choisir une lésion représentative ; la suspicion de SPTCL nécessite un prélèvement contenant suffisamment d’hypoderme. Photographier et cartographier permet la comparaison.</td></tr><tr><td>Signes sanguins</td><td>Pâleur, pétéchies, ecchymoses, ictère</td><td>Confronter à l’hémogramme, à la coagulation et au bilan d’hémolyse ; ne pas déduire une numération depuis l’aspect.</td></tr><tr><td>Abdomen</td><td>Distension, douleur, défense, retentissement général</td><td>Dans l’EATL, rechercher obstruction, saignement ou perforation. Une douleur aiguë sévère relève du parcours urgent, pas d’une simple surveillance programmée.</td></tr></tbody></table><p>Pour une suspicion de pcALCL, examiner les aires ganglionnaires et rechercher une extension systémique. Le consensus cutané propose la biopsie d’un ganglion anormal, notamment au-delà de 1,5 cm. Ce repère n’interdit pas d’explorer un ganglion plus petit si d’autres éléments le rendent suspect. La conclusion « primitif cutané » suppose une confrontation clinique, histologique et d’extension.</p><div class="trap"><span class="k">Piège</span> Un examen ganglionnaire normal n’exclut pas le HSTL. Une sérologie EBV positive ne prouve pas l’ENKTL. Un Coombs positif isolé ne prouve pas que l’anémie est hémolytique.</div><button class="pareto-btn ui" data-k="pareto-c86-clinique">▲ Loi de Pareto — Anamnèse et examen clinique</button><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6624667/" target="_blank" rel="noopener">[S211] Carvão et al., revue de cas Crohn/HSTL, 2019</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S223] HUG, enseignement hémogramme adulte, septembre 2019</a>.</p></section>

<section class="ilot" id="c86-7"><h2><span class="n">7</span>Démarche diagnostique : une preuve adaptée à chaque entité</h2><p>Le diagnostic combine morphologie, immunophénotype, données moléculaires utiles et contexte. Une biopsie excisionnelle ou incisionnelle est préférée lorsque l’architecture tissulaire est nécessaire et que le geste est faisable. Si une biopsie à l’aiguille est retenue, des carottes suffisantes et bien conditionnées sont nécessaires ; une biopsie non contributive ne devient pas rassurante parce qu’elle est négative.</p><table class="t"><thead><tr><th>Étape</th><th>Question et moyens</th><th>Interprétation</th></tr></thead><tbody><tr><td>Prélever</td><td><button class="w" data-k="c86-biopsie">Choisir le tissu et le conditionnement</button> : ganglion, lésion ORL, peau profonde, intestin ou moelle selon la présentation.</td><td>Informer le laboratoire avant le geste des besoins en histologie, cytométrie et biologie moléculaire. Le BPDCN peut être caractérisé par tissu et/ou sang/moelle selon la présentation.</td></tr><tr><td>Classer</td><td>Morphologie, panel de lignée, CD30, EBER si indiqué ; marqueurs TFH, pDC ou cytotoxiques selon l’hypothèse.</td><td>Un marqueur positif ne remplace pas le panel. La perte de marqueurs T peut être informative. Relecture par un hématopathologiste expérimenté.</td></tr><tr><td>Étendre</td><td><button class="w" data-k="c86-tep">TEP-TDM et imagerie adaptée</button> ; <button class="w" data-k="c86-moelle">moelle selon l’entité</button>.</td><td>Bilan recommandé dans les PTCL systémiques ; ne pas appliquer automatiquement la même batterie à une LyP typique sans signe d’extension.</td></tr><tr><td>Évaluer le terrain</td><td><button class="w" data-k="c86-bio">Hémogramme, fonctions d’organes, LDH, virologie et bilan préalable</button>.</td><td>VIH et hépatites selon le parcours ; HTLV-1 notamment si suspicion d’ATLL ou contexte pertinent. Évaluation cardiaque avant anthracycline.</td></tr><tr><td>Stratifier</td><td><button class="w" data-k="c86-index">IPI/PIT/mPIT, PINK/PINK-E</button>.</td><td>Scores pronostiques dans leurs populations respectives ; aucun ne diagnostique le lymphome ni ne choisit seul la greffe.</td></tr><tr><td>Réévaluer</td><td>Nouvelle biopsie si discordance ou rechute, selon l’accessibilité et la situation.</td><td>Une lésion nouvelle peut être progression, infection, autre lymphome ou processus réactif.</td></tr></tbody></table><h3>Diagnostic différentiel</h3><p>Le diagnostic différentiel est une comparaison de mécanismes et de tissus, pas une liste à réciter. La clonalité du TCR peut renforcer une hypothèse, mais une réponse réactive clonale est possible et une tumeur peut donner un résultat négatif ou apparemment polyclonal.</p><table class="t"><thead><tr><th>Tableau</th><th>À comparer</th><th>Élément utile</th></tr></thead><tbody><tr><td>Nodules profonds</td><td>SPTCL, panniculite lupique, lymphome gamma-delta cutané</td><td>Profondeur et architecture, rimming adipocytaire, CD8/βF1, interface/follicules et autres signes de lupus ; aucun marqueur isolé n’est absolu. Les autoanticorps peuvent être négatifs dans un lupus cutané.</td></tr><tr><td>Lésion CD30 positive</td><td>LyP, pcALCL, ALCL systémique, mycosis fongoïde transformé</td><td>Chronologie, architecture, antécédents cutanés, ALK et extension ; la LyP de type C peut mimer un pcALCL.</td></tr><tr><td>Cytopénies et splénomégalie</td><td>HSTL, infection, HLH, autres hémopathies dont SMD</td><td>Infiltration sinusoïdale et panel T ; une dysmyélopoïèse peut accompagner HSTL sans suffire à diagnostiquer SMD.</td></tr><tr><td>Plaques violacées et blastes</td><td>BPDCN, leucémie aiguë myéloïde ou autre néoplasie cutanée</td><td>Combinaison de marqueurs pDC et absence des marqueurs de lignées alternatives, selon l’OMS.</td></tr><tr><td>Entéropathie persistante</td><td>Exposition au gluten, autre cause digestive, RCD-I/II, EATL</td><td>Relecture du diagnostic, biopsies et étude des lymphocytes intraépithéliaux, imagerie/entéroscopie adaptée. La jéjunite ulcéreuse est une complication associée.</td></tr></tbody></table><div class="trap"><span class="k">Piège</span> Une adénopathie ou une lésion cutanée CD30 positive ne suffit pas à choisir BV-CHP. Une infiltration EBER positive doit être localisée aux cellules pertinentes et interprétée avec la morphologie et la lignée.</div><button class="w" data-k="c86-diffdx">Différentiels et types histologiques de LyP</button><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://onlinelibrary.wiley.com/doi/full/10.1111/ddg.14492" target="_blank" rel="noopener">[S219] S2k lupus cutané 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S203] Khoury et al., OMS myéloïde/dendritique 2022</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">[S206] OMS–EORTC 2018, publié 2019</a>.</p></section>
<section class="ilot" id="c86-8"><h2><span class="n">8</span>Urgences et complications : traiter le danger pendant le bilan</h2><div class="alert"><b>Une aggravation clinique prime sur l’attente du bilan complet.</b><p>Le HLH, une obstruction respiratoire, une perforation digestive, un sepsis ou une toxicité grave peuvent engager rapidement le pronostic vital. Leur reconnaissance impose une évaluation hospitalière et spécialisée adaptée. Les manifestations infectieuses, tumorales et inflammatoires peuvent se superposer.</p></div><table class="t"><thead><tr><th>Danger</th><th>Signes et mécanisme</th><th>Action et limite</th></tr></thead><tbody><tr><td>HLH / activation lymphohistiocytaire</td><td>Fièvre persistante, splénomégalie, cytopénies, ferritine croissante, atteinte hépatique, coagulation et organes perturbés.</td><td>Évaluer fonctions vitales et déclencheurs ; discuter rapidement immunomodulation et traitement étiologique en parallèle. Ne pas attendre systématiquement cinq critères si dégradation. <button class="w" data-k="c86-slh">Table des huit critères et limites chez l’adulte</button></td></tr><tr><td>Voies aériennes dans ENKTL</td><td>Atteinte ORL destructive, dyspnée, stridor ou obstruction possible.</td><td>Avis urgent ORL/anesthésie selon la menace, sécurisation et prélèvements coordonnés. Les photographies originales montrent un cas laryngé ayant nécessité une trachéotomie ; ce n’est pas le geste de tout ENKTL.</td></tr><tr><td>Complication digestive d’EATL</td><td>Douleur aiguë, syndrome péritonéal, obstruction, saignement, dénutrition sévère.</td><td>Évaluation urgente, imagerie et avis chirurgical selon la situation. Capsule et endoscopie programmées ne constituent pas une réponse à une suspicion de perforation.</td></tr><tr><td>Fuite capillaire sous tagraxofusp</td><td>Poids en hausse, albumine en baisse, œdèmes, hypotension, dyspnée.</td><td>Suspendre les doses selon la FI, traiter rapidement et suivre l’algorithme hospitalier. Seuils distincts avant la première dose et pendant le traitement.</td></tr><tr><td>Neuropathie ou suspicion de LEMP sous brentuximab</td><td>Symptômes sensitifs/moteurs ; troubles cognitifs, moteurs ou visuels nouveaux en cas de LEMP.</td><td>Adapter selon schéma et grade ; suspendre si LEMP suspectée, évaluer en neurologie, arrêter définitivement si confirmée. Éviter l’association à la bléomycine, contre-indiquée.</td></tr><tr><td>Pancréatite, thrombose/hémorragie ou hépatotoxicité sous pégaspargase</td><td>Douleur abdominale, anomalies cliniques/biologiques, trouble de la coagulation.</td><td>Interrompre en cas de suspicion de pancréatite et arrêter si confirmée ; évaluer et traiter chaque toxicité selon la FI et le protocole spécialisé.</td></tr></tbody></table><p>Les pourcentages doivent rester attachés à leur population. La FI Elzonris rapporte une fuite capillaire chez 40/225 patients, soit 18 %, dans une population mixte d’hémopathies et de doses, avec trois décès (1,3 %). Dans son sous-groupe BPDCN, elle rapporte 19/89 cas (21 %) et trois décès (environ 3 %). La médiane de survenue au sixième jour n’est pas une date après laquelle la surveillance s’arrête.</p>
<p>De même, les survies à cinq ans de 91 % sans HLH et 46 % avec HLH dans une cohorte SPTCL citée par ESMO 2018 décrivent deux groupes observés. Elles ne prouvent pas que le HLH divise causalement par deux la survie de chaque patient. La présence de HLH change surtout l’urgence de l’évaluation et de la stratégie.</p><div class="key"><b>À retenir.</b> Réanimation des défaillances, recherche de la cause et traitement de l’hyperinflammation peuvent devoir avancer ensemble. Le seul traitement différé du lymphome n’est pas une réponse suffisante au HLH grave.</div><button class="pareto-btn ui" data-k="pareto-c86-diagnostic">▲ Loi de Pareto — Diagnostic et urgences</button><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://ashpublications.org/blood/article/133/23/2465/273833/Recommendations-for-the-management-of" target="_blank" rel="noopener">[S215] La Rosée et al., HLH adulte, 2019</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669340018" target="_blank" rel="noopener">[S222] FI suisse Oncaspar, septembre 2025, AIPS via AmiKo</a>.</p></section>
<section class="ilot" id="c86-9"><h2><span class="n">9</span>Prise en charge : objectifs, choix et statut suisse</h2><p>Définir l’objectif avec le patient : guérison recherchée dans de nombreuses entités agressives, contrôle d’une maladie récidivante, traitement d’une complication ou limitation des symptômes. L’aptitude à une chimiothérapie intensive et à la greffe dépend des fonctions d’organes, des comorbidités, de l’état fonctionnel, du contexte social et des préférences. ESMO–EHA recommande l’accès à un essai clinique quand il est pertinent.</p>
<h3>Choix par entité</h3><table class="t"><thead><tr><th>Entité et situation</th><th>Stratégie lue</th><th>Justification et réserve</th></tr></thead><tbody><tr><td>ENKTL localisé I–II, patient apte</td><td>Radiothérapie impliquant le site, généralement ≥50 Gy, associée à une chimiothérapie sans anthracycline contenant de la L-asparaginase (II,A).</td><td>Contrôle local et systémique. L’agencement concomitant, séquentiel ou intercalé dépend du programme. Stade I peu volumineux ou patient fragile : radiothérapie seule possible dans des situations sélectionnées.</td></tr><tr><td>ENKTL nasal III–IV ou extranasal I–IV</td><td>Programmes tels DDGP ou mSMILE chez patients aptes ; AspaMetDex ou P-GemOx selon aptitude et contexte (III,B).</td><td>Pas de CHOP. La comparaison des schémas et les indications de greffe exigent la lecture critique des séries ; un programme n’est pas universellement supérieur.</td></tr><tr><td>HSTL apte</td><td>Induction plus intensive que CHOP, ICE préféré dans la recommandation ; consolidation en réponse, de préférence allogénique.</td><td>Recherche précoce du donneur. L’allogreffe peut faire partie de la première ligne et n’est pas réservée à la rechute.</td></tr><tr><td>EATL apte</td><td>Option CHOP/CHOEP initial puis IVE alterné avec méthotrexate à dose intermédiaire et autogreffe.</td><td>La série de 26 patients avec survie à cinq ans de 60 % est sélectionnée, non randomisée. L’autogreffe utilise les cellules du patient ; elle ne nécessite pas de donneur allogénique.</td></tr><tr><td>EATL non apte à cette intensité</td><td>CHOP-like ou BV-CHP parmi les options ESMO, avec soins nutritionnels et traitement des complications.</td><td>Choix en centre expert ; statut suisse et bénéfice individuel à vérifier.</td></tr><tr><td>SPTCL alpha-bêta sans HLH</td><td>Corticoïdes et immunosuppresseurs tels ciclosporine ou méthotrexate selon ESMO/S2k ; traitement local possible si limité.</td><td>La polychimiothérapie n’est pas le réflexe initial. En cas de progression malgré immunosuppression ou de HLH, stratégie spécialisée plus intensive possible. HAVCR2 n’est pas un préalable pour agir.</td></tr><tr><td>BPDCN adulte</td><td>Tagraxofusp autorisé en première ligne ; plan de traitement et prévention/traitement du SNC selon contexte ; allogreffe en première rémission chez patients appropriés.</td><td>L’autogreffe est une option très sélectionnée, pas un substitut automatique si aucun donneur. Pédiatrie : parcours distinct, sans extrapolation de l’autorisation adulte.</td></tr><tr><td>nTFHL-AI</td><td>CHOP ou CHOEP (II,B) ; formes limitées favorables : trois à quatre cycles et radiothérapie 30–40 Gy peuvent être discutés ; autogreffe chez certains répondeurs à haut risque.</td><td>CD30 positif ne suffit pas à imposer BV-CHP : le bénéfice démontré de ce programme concerne surtout l’ALCL systémique.</td></tr><tr><td>LyP</td><td>Observation, photothérapie ou méthotrexate faible dose selon étendue et gêne.</td><td>Contrôler les lésions ; aucun de ces traitements n’a démontré prévenir les lymphomes associés. Éviter la polychimiothérapie.</td></tr><tr><td>pcALCL</td><td>Excision ou radiothérapie si solitaire/groupé ; traitements systémiques adaptés si multifocal ou extracutané.</td><td>Le brentuximab peut avoir une place selon indication suisse et parcours. Une chimiothérapie multiagent n’est pas le traitement automatique d’une atteinte limitée à la peau.</td></tr></tbody></table><p>Le CHOP contient cyclophosphamide, doxorubicine, vincristine et prednisone ; CHOEP ajoute l’étoposide. BV-CHP remplace la vincristine par le brentuximab védotine afin d’éviter l’addition de neurotoxicité. L’autorisation suisse d’Adcetris couvre le PTCL CD30 positif non prétraité de l’adulte avec CHP, mais une autorisation large ne démontre pas un bénéfice identique dans chaque sous-type.</p>
<p>Pour le HSTL, ESMO cite une compilation de 166 cas, mais les comparaisons CHOP/non-CHOP portent sur des sous-groupes plus petits : les réponses de 52 % contre 82 % et survies médianes de 18 contre 37 mois ne résultent pas d’une randomisation des 166 patients. Elles soutiennent une stratégie experte, sans donner une promesse individuelle.</p>
<h3>Cadre suisse</h3><table class="t"><thead><tr><th>Produit</th><th>Indication effectivement lue</th><th>Conséquence</th></tr></thead><tbody><tr><td>Adcetris, FI juin 2025</td><td>PTCL CD30 positif non prétraité adulte avec CHP ; lymphome T cutané CD30 positif après progression sous traitement systémique ou si les autres traitements systémiques sont exclus.</td><td>Vérifier le parcours clinique exact, les limitations et la prise en charge.</td></tr><tr><td>Elzonris, FI novembre 2022</td><td>BPDCN de l’adulte en première ligne.</td><td>Premier cycle hospitalier et prévention de la fuite capillaire.</td></tr><tr><td>Oncaspar, FI septembre 2025</td><td>Leucémie lymphoblastique aiguë, dans une combinaison.</td><td>Son utilisation dans l’ENKTL est hors indication suisse selon la FI lue ; une recommandation européenne ne modifie pas cette autorisation.</td></tr></tbody></table><p>L’OFSP distingue autorisation, inscription à la liste des spécialités et prise en charge dans les cas particuliers selon les art. 71a–d OAMal. Le remboursement individuel et les limitations 2026 de ces produits n’ont pas été certifiés ici. Ils se vérifient avec les documents actuels et l’assureur, avant un parcours hors indication lorsque requis. Le statut décrit en 2021 dans une revue ne suffit pas pour une décision financière de 2026.</p><button class="w" data-k="c86-greffe">Greffes : autologue et allogénique</button> <button class="w" data-k="c86-rechute">Rechute : preuves et limites</button> <button class="w" data-k="c86-statut-ch">Autorisation et prise en charge suisse</button><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1111/ddg.14706" target="_blank" rel="noopener">[S218] S2k lymphomes cutanés 2021, publié 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://journals.lww.com/hemasphere/fulltext/2023/03000/unmet_clinical_needs_and_management.2.aspx" target="_blank" rel="noopener">[S217] Pagano et al., consensus international BPDCN 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669340018" target="_blank" rel="noopener">[S222] FI suisse Oncaspar, septembre 2025, AIPS via AmiKo</a> ; <a href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S224] OFSP, liste des spécialités</a> ; <a href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S225] OFSP, cas particuliers, art. 71a–d OAMal</a>.</p></section>
<section class="ilot" id="c86-10"><h2><span class="n">10</span>Réponse, suivi, pronostic et prévention</h2><p>Le suivi recherche réponse, rechute, complications et besoins du patient. Sa durée dépend de l’entité et du traitement. Une imagerie réalisée pour évaluer une réponse n’a pas le même objectif qu’une imagerie répétée chez un patient asymptomatique en rémission complète.</p><table class="t"><thead><tr><th>Population / mesure</th><th>Résultat cité</th><th>Lecture correcte</th></tr></thead><tbody><tr><td>LyP, registres cutanés 2002–2017</td><td>Survie spécifique à cinq ans 99 %.</td><td>Mort liée à la maladie ; ce n’est pas la survie globale de chaque patient.</td></tr><tr><td>pcALCL, mêmes registres</td><td>Survie spécifique à cinq ans 95 %.</td><td>Le caractère primitif cutané et le bilan initial importent.</td></tr><tr><td>SPTCL, mêmes registres</td><td>Survie spécifique à cinq ans 87 %.</td><td>Ne pas mélanger avec la survie globale de 82 % d’une autre cohorte historique.</td></tr><tr><td>SPTCL avec/sans HLH, cohorte citée par ESMO 2018</td><td>Survie à cinq ans 46 % avec et 91 % sans HLH.</td><td>Groupes observés ; ni relation causale quantifiée ni prédiction personnalisée.</td></tr><tr><td>ENKTL cutané et lymphome gamma-delta cutané, registres</td><td>Survies spécifiques à cinq ans 16 % et 11 %.</td><td>Le gamma-delta cutané n’est pas un SPTCL alpha-bêta. Le chiffre cutané ne décrit pas tout ENKTL actuel.</td></tr><tr><td>EATL, programme intensif, n=26</td><td>Survie globale à cinq ans 60 % dans la série citée.</td><td>Patients sélectionnés et schéma précis ; non applicable à tous les EATL.</td></tr></tbody></table><p><b>PTCL systémiques après traitement.</b> ESMO propose un examen environ tous les trois mois la première année, puis tous les six mois pendant deux années sans autogreffe ou quatre années avec autogreffe. L’arrêt du suivi dédié après trois ou cinq ans ne concerne que les patients asymptomatiques restant en rémission complète. L’allogreffe a son suivi propre. La TDM/TEP de surveillance systématique n’est pas recommandée en rémission complète sans signe clinique.</p>
<p><b>ENKTL.</b> L’ADN d’EBV plasmatique est suivi avec l’évaluation clinique et la réponse métabolique. Une réponse métabolique complète et un ADN indétectable sont des objectifs favorables ; ils ne garantissent pas l’absence future de rechute. Un résultat s’interprète dans le même type de prélèvement et avec la méthode du laboratoire.</p>
<p><b>RCD-II.</b> En l’absence d’EATL, ESMO propose de considérer des contrôles tous les 6–12 mois, avec imagerie du grêle notamment devant de nouveaux signes préoccupants. Une douleur aiguë ou une aggravation n’attend pas l’échéance. <b>LyP.</b> Le consensus EORTC propose un suivi à vie : les séries qu’il cite rapportent des lymphomes associés chez 4–25 % des patients, parfois après plusieurs décennies. Ce large intervalle n’est pas un risque annuel.</p>
<p><b>Prévention.</b> Réévaluer les immunosuppresseurs avec l’équipe digestive, traiter les carences et la dénutrition, informer sur les symptômes à signaler et anticiper les toxicités. Aucun arrêt systématique de thiopurine à deux ans n’est déduit ici d’une revue de cas.</p><button class="w" data-k="c86-suivi">Calendrier et décisions après traitement</button><button class="pareto-btn ui" data-k="pareto-c86-prise-en-charge">▲ Loi de Pareto — Prise en charge, suivi et prévention</button><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">[S206] OMS–EORTC 2018, publié 2019</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6624667/" target="_blank" rel="noopener">[S211] Carvão et al., revue de cas Crohn/HSTL, 2019</a>.</p></section>
<section class="ilot" id="c86-11"><h2><span class="n">11</span>Situations particulières et raisonnement clinique</h2><div class="two"><div class="card"><h4>Enfant et adolescent</h4><p>BPDCN pédiatrique et SPTCL/HLH requièrent une expertise spécifique. L’autorisation suisse Elzonris lue concerne l’adulte. Moonla observe des associations entre âge, HAVCR2 et HLH dans des cohortes sélectionnées ; elles ne permettent pas de prédire individuellement l’évolution d’un enfant. Ne pas transposer les doses ou la greffe adultes.</p></div>
<div class="card"><h4>Personne âgée ou fragile</h4><p>L’âge seul ne définit pas l’aptitude. Évaluer autonomie, comorbidités, fonctions d’organes, objectifs et soutien. ESMO décrit des options moins intensives selon l’entité ; un ENKTL localisé chez un patient fragile peut relever d’une radiothérapie seule. Le consensus BPDCN ne fixe pas une frontière universelle d’allogreffe à un âge unique.</p></div></div>
<div class="two"><div class="card"><h4>Grossesse, contraception, fertilité</h4><p>Les FI contiennent des données concrètes. Adcetris ne s’utilise pendant la grossesse qu’en cas de nécessité absolue après analyse du risque ; contraception efficace pendant le traitement et six mois après chez la femme selon la FI lue, et discussion de la fertilité masculine. Elzonris demande un test de grossesse dans les sept jours avant initiation, contraception pendant et au moins une semaine après, et interruption de l’allaitement pendant et au moins une semaine après. Une situation réelle relève d’une concertation hématologique et obstétricale.</p></div>
<div class="card"><h4>Insuffisance rénale/hépatique</h4><p>Les adaptations dépendent du produit et du schéma. Les règles de monothérapie Adcetris ne sont pas transférées automatiquement à BV-CHP. Pour Elzonris, les données dans ces insuffisances sont limitées et des seuils de suspension sont précisés. Consulter la monographie et la FI avant chaque décision.</p></div></div>
<p><b>Crohn sous immunosuppresseurs.</b> Fièvre, splénomégalie et cytopénies imposent de rechercher infection, HLH et HSTL ; la biopsie et le bilan se coordonnent rapidement. <b>Maladie cœliaque.</b> L’évaluation nutritionnelle et la vérification du régime sont indissociables du diagnostic de RCD-II. <b>Atteinte neurologique/BPDCN.</b> Le consensus propose une évaluation du liquide cérébrospinal et une stratégie intrathécale selon le parcours ; l’absence de pénétration établie du tagraxofusp dans le SNC interdit de le considérer comme une prophylaxie suffisante.</p>
<h3>Cas récapitulatif — vignette fictive</h3>
<div class="quiz ui"><p>Un homme de 28 ans sous azathioprine et infliximab pour Crohn présente fièvre prolongée, splénomégalie, anémie et thrombopénie sans ganglion palpable. Quelle démarche est la plus adaptée ?</p>
<button data-ok="0">A. Conclure à une poussée de Crohn et intensifier automatiquement l’immunosuppression.</button>
<button data-ok="1">B. Rechercher HSTL, infection et HLH ; organiser un bilan spécialisé avec biopsie médullaire adaptée.</button>
<button data-ok="0">C. Exclure le lymphome parce que l’examen ganglionnaire est normal.</button>
<p class="fb" hidden>Réponse B. Le HSTL peut infiltrer foie, rate et moelle sans adénopathie. L’association de fièvre et cytopénies justifie aussi la recherche d’infection et d’hyperinflammation. Un traitement étiologique nécessite une preuve adaptée ; une défaillance vitale ou un HLH grave peut imposer des mesures urgentes pendant le bilan.</p></div><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://journals.lww.com/hemasphere/fulltext/2023/03000/unmet_clinical_needs_and_management.2.aspx" target="_blank" rel="noopener">[S217] Pagano et al., consensus international BPDCN 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">[S212] Moonla et al., Haematologica 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6624667/" target="_blank" rel="noopener">[S211] Carvão et al., revue de cas Crohn/HSTL, 2019</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a>.</p></section>
<section class="ilot" id="c86-12"><h2><span class="n">12</span>Critères formels, calculs et ancrage suisse</h2><table class="t"><thead><tr><th>Question</th><th>Critère et contexte</th><th>Erreur à éviter</th></tr></thead><tbody><tr><td>ENKTL</td><td>Tissu compatible, EBV dans les cellules tumorales, phénotype et architecture intégrés.</td><td>EBER + CD56 n’est pas un diagnostic automatique indépendant du tissu et des alternatives.</td></tr><tr><td>Lymphome TFH nodal</td><td>CD4 et au moins deux marqueurs TFH parmi le panel, avec morphologie et contexte compatibles.</td><td>Deux marqueurs seuls ne prouvent ni la malignité ni le sous-type angio-immunoblastique.</td></tr><tr><td>RCD-II</td><td>Symptômes persistants/récidivants et atrophie après ≥12 mois de régime strict, autres causes exclues ; population aberrante typiquement ≥20 % en cytométrie, clonalité à intégrer.</td><td>Ne pas confondre seuil de cytométrie et immunohistochimie, ni jéjunite ulcéreuse et définition.</td></tr><tr><td>pcALCL</td><td>Expression CD30 par ≥75 % des cellules tumorales, architecture et contexte cutané compatibles, exclusion de LyP/MF et maladie systémique.</td><td>Le seuil de ≥10 % de l’essai ECHELON-2 n’est pas ce critère.</td></tr><tr><td>BPDCN</td><td>Panel pDC selon OMS : CD123 et autre marqueur pDC avec CD4 et/ou CD56, ou autre combinaison définie avec exclusions de lignée.</td><td>CD4 et CD56 ne sont pas obligatoirement tous deux positifs ; CD123 seul ne suffit pas.</td></tr><tr><td>HLH</td><td>Diagnostic moléculaire compatible ou cinq critères sur huit dans HLH-2004 ; appréciation clinique indispensable chez l’adulte.</td><td>Une ferritine ≥500 µg/L n’est pas spécifique ; une dégradation peut imposer un traitement avant cinq critères.</td></tr><tr><td>Albumine sous Elzonris</td><td>≥3,2 g/dL avant première dose ; surveillance sous traitement avec seuil <3,5 g/dL ou baisse ≥0,5 g/dL.</td><td>Ne pas appeler ces seuils des valeurs normales ni les fusionner. 3,2 g/dL =32 g/L.</td></tr></tbody></table><p><b>Calculs pédagogiques.</b> Un pourcentage est un effectif positif divisé par l’effectif total, multiplié par 100 : 160 cellules positives sur 200 donnent 80 %. Pour un médicament à 1,8 mg/kg et un poids fictif de 70 kg, le produit donne 126 mg ; au-delà de 100 kg, Adcetris utilise 100 kg pour ce calcul, soit au maximum 180 mg dans ce schéma. Ces exemples expliquent une opération ; les règles de préparation, adaptations et critères de suspension restent ceux de la FI et du protocole.</p>
<h3>Objectifs fédéraux et pratique suisse</h3><p>Les exigences MEBEKO pour l’examen 2026 renvoient aux 265 situations PROFILES. La mise à jour PROFILES 2 s’applique à l’enseignement depuis 2025/26 et sera la base de l’examen fédéral en 2028 selon la publication suisse de transition. Ne pas présenter la numérotation 2023 comme celle de l’examen 2026.</p>
<p>Dans PROFILES 2017, les entrées utiles ici comprennent SSP 2 (adénopathie), 4 (fatigue), 6 (fièvre), 16 (perte de poids/dénutrition), 21 (épistaxis), 25 (lésions buccales), 88 (ecchymoses/purpura) 93 (papules, ulcères, nécrose et tumeurs cutanées), 159 (histologie, cytologie et génétique moléculaire anormales) et 227 (évaluation partagée des risques et facteurs protecteurs des maladies fréquentes, notamment oncologiques). Ce sont des portes d’entrée cliniques, pas une liste officielle de diagnostics C86. Le chapitre entraîne à passer d’une plainte à l’évaluation de gravité, au prélèvement et à l’orientation spécialisée.</p><button class="w" data-k="c86-profils">PROFILES : versions et situation SSP 2</button><p>La prise en charge suisse ajoute la vérification des FI, des conditions de la liste des spécialités, des éventuels cas particuliers OAMal et de l’information du patient. Le dossier ne certifie pas une limitation de remboursement individuelle 2026. Les incertitudes restantes sont explicites dans la fenêtre des limites ; elles ne sont pas comblées par un chiffre inventé.</p><button class="w" data-k="c86-lacunes">Sources, limites restantes et portée de la relecture</button><button class="pareto-btn ui" data-k="pareto-c86-criteres">▲ Loi de Pareto — Critères et situations particulières</button><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S203] Khoury et al., OMS myéloïde/dendritique 2022</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://ashpublications.org/blood/article/133/23/2465/273833/Recommendations-for-the-management-of" target="_blank" rel="noopener">[S215] La Rosée et al., HLH adulte, 2019</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S228] CIMS, PROFILES 2017, SSP</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">[S229] OFSP/MEBEKO, exigences examen 2026, §2</a> ; <a href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" target="_blank" rel="noopener">[S230] Swiss Medical Weekly 2025, transition PROFILES 2</a> ; <a href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S224] OFSP, liste des spécialités</a> ; <a href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S225] OFSP, cas particuliers, art. 71a–d OAMal</a>.</p></section><details id="c86-reference-index"><summary>Ouvrir une fiche explicative ou une synthèse</summary><ul><li><button class="w" data-k="c86-famille">C86 : sept sous-codes, plusieurs lignées et plusieurs parcours</button></li><li><button class="w" data-k="c86-classif">Codage historique et classification biologique actuelle</button></li><li><button class="w" data-k="c86-enktl">ENKTL : tissu, EBV, extension et stratégie adaptée</button></li><li><button class="w" data-k="c86-hstl">HSTL : le lymphome sans masse ganglionnaire évidente</button></li><li><button class="w" data-k="c86-eatl">EATL : entéropathie, sig prévention</button></li><li><button class="w" data-k="pareto-c86-criteres">Pareto — Critères et situations particulières</button></li><li><button class="w" data-k="pareto-c86-examens">Pareto — Examens</button></li><li><button class="w" data-k="pareto-c86-semio">Pareto — Sémiologie fondamentale</button></li><li><button class="w" data-k="pareto-c86-anat">Pareto — Anatomie</button></li><li><button class="w" data-k="pareto-c86-histo">Pareto — Histologie</button></li><li><button class="w" data-k="pareto-c86-physio">Pareto — Physiologie</button></li><li><button class="w" data-k="pareto-c86-bio">Pareto — Biochimie</button></li><li><button class="w" data-k="pareto-c86-gen">Pareto — Génétique</button></li><li><button class="w" data-k="pareto-c86-pharma">Pareto — Pharmacologie</button></li><li><button class="w" data-k="c86-mnemo">Sous-code et siège : une aide, pas une définition</button></li><li><button class="w" data-k="c86-profils">PROFILES suisse : version et passage de la plainte à la démarche</button></li></ul></details><div class="src"><p>Les références sont liées aux sections et aux fenêtres. Les résultats de séries sont rattachés à leur population. Les limites restantes et les lectures ciblées figurent dans la fenêtre <button class="w" data-k="c86-lacunes">Sources et limites</button>. Aucune validation médicale humaine n’est revendiquée.</p></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="c86-e-1"><h2><span class="n">e-1</span>Hiérarchie des examens : indication et question</h2><p>La référence diagnostique est l’analyse spécialisée d’un prélèvement adapté, intégrée au contexte. Pour un lymphome nodal, la biopsie excisionnelle/incisionnelle préserve l’architecture ; pour le BPDCN leucémique, le sang et la moelle avec cytométrie peuvent contribuer directement au diagnostic. « Biopsie » ne signifie donc pas le même geste pour toute la rubrique C86.</p><table class="t"><thead><tr><th>Examen</th><th>Quand et pourquoi</th><th>Limites</th></tr></thead><tbody><tr><td><button class="w" data-k="c86-biopsie">Tissu et immunohistochimie</button></td><td>Établir l’entité, selon le siège.</td><td>Nécrose, petite carotte ou traitement préalable peuvent réduire le rendement ; demander une nouvelle preuve si discordance.</td></tr><tr><td><button class="w" data-k="c86-tcr">Clonalité TCR</button></td><td>Question de lignée/clonalité en complément.</td><td>Clones réactifs possibles ; résultat négatif possible dans une tumeur.</td></tr><tr><td><button class="w" data-k="c86-tep">TEP-TDM</button></td><td>Extension et réponse des PTCL systémiques avides.</td><td>Pas un examen diagnostique histologique ; inflammation et infection peuvent fixer. Pas systématique dans la LyP typique sans autre anomalie.</td></tr><tr><td><button class="w" data-k="c86-moelle">Moelle</button></td><td>Bilan des PTCL systémiques ; particulièrement important dans HSTL et BPDCN.</td><td>Pas automatiquement requise dans les proliférations cutanées indolentes sans autre signe.</td></tr><tr><td><button class="w" data-k="c86-ebv">ADN d’EBV plasmatique</button></td><td>Pronostic et suivi dans ENKTL.</td><td>Ne remplace pas EBER tissulaire ; prélèvement et méthode constants pour comparer.</td></tr><tr><td><button class="w" data-k="c86-bio">Biologie et préparation</button></td><td>Hémogramme, organes, LDH, virologie pertinente et bilan avant traitement.</td><td>LDH non spécifique ; intervalles propres au laboratoire et seuils de décision distincts.</td></tr><tr><td>Exploration digestive</td><td>Biopsies, entéroscopie, entéro-imagerie et capsule selon RCD-II/EATL.</td><td>Évaluer le risque de rétention avant capsule chez un patient à risque de sténose ; la capsule ne prélève pas le tissu.</td></tr><tr><td>Liquide cérébrospinal dans BPDCN</td><td>Consensus spécialisé : évaluation initiale et stratégie du SNC selon présentation.</td><td>Une ponction s’organise en tenant compte de la sécurité clinique et hématologique ; ce n’est pas un dépistage indifférencié de tout C86.</td></tr><tr><td>TDM/TEP en rémission asymptomatique</td><td>Pas de surveillance systématique recommandée pour les PTCL en rémission complète.</td><td>Un nouveau signe justifie une réévaluation ciblée.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Avant chaque examen, formuler la question. Un résultat utile à l’extension ne prouve pas l’entité, et un score pronostique ne remplace pas le diagnostic.</div><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://journals.lww.com/hemasphere/fulltext/2023/03000/unmet_clinical_needs_and_management.2.aspx" target="_blank" rel="noopener">[S217] Pagano et al., consensus international BPDCN 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://www.thieme-connect.com/products/ejournals/html/10.1055/a-1973-3796" target="_blank" rel="noopener">[S231] ESGE, vidéocapsule, mise à jour 2022</a>.</p></section>
<section class="ilot" id="c86-e-2"><h2><span class="n">e-2</span>Interpréter les nombres : normalité, critère et seuil d’action</h2><p>Un intervalle de référence décrit une population et une méthode ; un seuil diagnostique ou thérapeutique répond à une autre question. Le support d’enseignement HUG de septembre 2019 présente, chez l’adulte, Hb 140–180 g/L chez l’homme et 120–160 g/L chez la femme, leucocytes 4–11 G/L et plaquettes 150–350 G/L. Ce sont des repères suisses datés, pas des normes nationales 2026 ni des valeurs pédiatriques ou de grossesse. Le compte rendu actuel du laboratoire du patient prévaut.</p><table class="t"><thead><tr><th>Paramètre</th><th>Valeur et fonction</th><th>Piège</th></tr></thead><tbody><tr><td>Hb, plaquettes, neutrophiles en HLH-2004</td><td>Cytopénies de ≥2 lignées : Hb <90 g/L, plaquettes <100 G/L, neutrophiles <1 G/L, avec particularité néonatale pour Hb.</td><td>Seuil de critère HLH ; pas définition générale de toute anémie, ni seuil transfusionnel.</td></tr><tr><td>Ferritine</td><td>≥500 µg/L parmi les critères HLH-2004.</td><td>Très peu spécifique seule chez l’adulte ; interpréter dynamique, organes et autres critères.</td></tr><tr><td>CD30</td><td>≥75 % des cellules tumorales dans les critères pcALCL ; ≥10 % à l’inclusion d’ECHELON-2.</td><td>Ces deux nombres répondent à des questions différentes et ne suffisent ni au diagnostic ni à la décision de traitement.</td></tr><tr><td>TFH</td><td>CD4 + au moins deux marqueurs du panel, dans la morphologie appropriée.</td><td>Un phénotype TFH peut exister dans des cellules normales/réactives.</td></tr><tr><td>RCD-II</td><td>Cellules intraépithéliales aberrantes typiquement ≥20 % par cytométrie.</td><td>Contexte symptomatique, régime ≥12 mois, atrophie, exclusion des alternatives et clonalité intégrés.</td></tr><tr><td>Albumine, première dose Elzonris</td><td>≥3,2 g/dL, soit ≥32 g/L.</td><td>Prérequis de traitement, non borne universelle de normalité.</td></tr><tr><td>Albumine sous Elzonris</td><td><3,5 g/dL ou baisse ≥0,5 g/dL : action selon algorithme de fuite capillaire.</td><td>À surveiller avant les doses ; seuil différent de celui de démarrage.</td></tr><tr><td>Poids sous Elzonris</td><td>Hausse ≥1,5 kg par rapport au poids avant la dose précédente.</td><td>Un changement rapide peut signaler la fuite capillaire ; ne pas le confondre avec une prise de poids nutritionnelle.</td></tr></tbody></table><p><b>Calcul fictif.</b> Sur 200 cellules tumorales comptées, 160 positives donnent (160 ÷ 200) ×100 =80 %. Cela satisfait le seuil numérique CD30 du pcALCL, mais le diagnostic exige encore morphologie, contexte et extension. De même, une albumine passant de 3,8 à 3,3 g/dL baisse de 0,5 g/dL : elle franchit un seuil d’action sous tagraxofusp bien que 3,3 reste supérieur à 3,2. La comparaison au seul seuil de première dose serait une erreur.</p><button class="w" data-k="c86-index">Calcul des index et variables nécessaires</button><div class="trap"><span class="k">Piège</span> Un chiffre ne se lit jamais sans sa population, son unité, sa méthode et sa finalité.</div><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S223] HUG, enseignement hémogramme adulte, septembre 2019</a> ; <a href="https://ashpublications.org/blood/article/133/23/2465/273833/Recommendations-for-the-management-of" target="_blank" rel="noopener">[S215] La Rosée et al., HLH adulte, 2019</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a>.</p></section>
<section class="ilot" id="c86-e-3"><h2><span class="n">e-3</span>Imagerie, endoscopie et bilan d’extension</h2><p>La TEP au FDG montre un métabolisme augmenté, qui peut être tumoral ou inflammatoire. Environ 10 % des PTCL sont peu ou pas avides dans les données discutées par ESMO ; une TEP négative ne remplace pas une moelle ou un prélèvement indiqué. L’examen initial sert aussi de référence pour la réponse. Les critères d’extension des lymphomes systémiques ne s’appliquent pas mécaniquement aux lymphomes cutanés primitifs.</p><table class="t"><thead><tr><th>Entité</th><th>Parcours d’extension</th><th>Interprétation</th></tr></thead><tbody><tr><td>ENKTL</td><td>TEP-TDM ; imagerie ORL adaptée, notamment IRM selon extension ; bilan médullaire et évaluation du SNC selon risque/signes.</td><td>ADN d’EBV plasmatique et réponse métabolique se complètent. Une valeur Deauville ≤3 traduit une réponse métabolique complète dans le cadre utilisé.</td></tr><tr><td>HSTL</td><td>Foie, rate et moelle ; TEP-TDM selon parcours.</td><td>La réponse de la moelle et, lorsque possible/pertinent, du foie se confirme par prélèvement dans la recommandation. Le volume splénique seul ne décrit pas toute la réponse.</td></tr><tr><td>RCD-II/EATL</td><td>Biopsies, TEP, entéro-IRM et exploration endoscopique adaptée.</td><td>La capsule visualise sans biopsier. ESGE demande de prendre en compte le risque de rétention dans une suspicion de tumeur du grêle ; obstruction ou sténose modifient le parcours.</td></tr><tr><td>LyP typique</td><td>Examen clinique et biologie adaptée ; imagerie si signes d’extension ou présentation atypique.</td><td>Une LyP diffuse ne devient pas automatiquement un lymphome systémique de stade IV.</td></tr><tr><td>pcALCL</td><td>TDM thoraco-abdomino-pelvienne ± TEP, exploration des ganglions suspects.</td><td>La moelle est conditionnelle si maladie limitée à la peau. La stadification cutanée décrit T, N et M avec leur contexte.</td></tr><tr><td>BPDCN</td><td>Peau, sang/moelle, ganglions et organes selon symptômes ; évaluation du SNC selon consensus.</td><td>Une réponse cutanée ne prouve pas à elle seule une rémission médullaire ou neurologique.</td></tr></tbody></table><p>L’ESGE 2022 ne demande pas des investigations préalables identiques avant toute capsule pour suspicion tumorale ; elle les réserve notamment aux personnes à risque de rétention. Les recommandations de capsule de perméabilité dans Crohn ont leur propre population et ne sont pas transposées comme règle automatique à chaque EATL. Le gastroentérologue choisit la modalité qui peut répondre à la question sans majorer le risque.</p><button class="w" data-k="c86-stad-cutanee">Stadification des proliférations cutanées</button><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://www.thieme-connect.com/products/ejournals/html/10.1055/a-1973-3796" target="_blank" rel="noopener">[S231] ESGE, vidéocapsule, mise à jour 2022</a> ; <a href="https://journals.lww.com/hemasphere/fulltext/2023/03000/unmet_clinical_needs_and_management.2.aspx" target="_blank" rel="noopener">[S217] Pagano et al., consensus international BPDCN 2023</a>.</p></section>
<section class="ilot" id="c86-e-4"><h2><span class="n">e-4</span>Lire l’immunophénotype sans transformer un marqueur en diagnostic</h2><table class="t"><thead><tr><th>Entité</th><th>Profil utile</th><th>Réserve indispensable</th></tr></thead><tbody><tr><td>ENKTL</td><td>EBER dans cellules tumorales ; phénotype cytotoxique, souvent CD56 ; forme NK typiquement CD3 de surface négatif/CD3ε cytoplasmique positif.</td><td>Des formes de lignée T existent et peuvent réarranger TCR. Le profil NK n’est pas obligatoire dans chaque ENKTL.</td></tr><tr><td>HSTL</td><td>TCR souvent gamma-delta, parfois alpha-bêta ou silencieux ; infiltration sinusoïdale ; i(7q) possible.</td><td>Ne pas additionner 75 %, 25 % et 5 % issus d’approximations comme une répartition exhaustive à 105 %.</td></tr><tr><td>EATL et RCD-II</td><td>Étude du tissu intestinal, lymphocytes aberrants et clonalité ; anomalies JAK/STAT décrites.</td><td>RCD-II n’est pas synonyme de lymphome constitué. MEITL reste une entité séparée.</td></tr><tr><td>SPTCL</td><td>CD3, CD8 et marqueurs cytotoxiques, TCR alpha-bêta/βF1 ; rimming adipocytaire.</td><td>Confronter au lupus et aux autres lymphomes ; HAVCR2 n’est pas une condition diagnostique obligatoire.</td></tr><tr><td>BPDCN</td><td>CD123, TCF4/TCL1/CD303/CD304 selon panel ; CD4 et/ou CD56 ; exclusions de lignée.</td><td>Lire les combinaisons exactes OMS, pas une liste de quatre marqueurs tous obligatoires.</td></tr><tr><td>nTFHL-AI</td><td>CD4 et marqueurs TFH ; réseau stromal, vaisseaux et architecture ; TET2/DNMT3A/RHOA/IDH2 peuvent contribuer.</td><td>Une petite carotte peut permettre « lymphome TFH nodal » sans autoriser le sous-type architectural précis.</td></tr><tr><td>pcALCL et LyP</td><td>CD30 ; contexte clinique, architecture et évolution.</td><td>DUSP22 dans le pcALCL n’a pas automatiquement le même sens pronostique que dans l’ALCL systémique.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Le compte rendu explique ce qui soutient le diagnostic, ce qui l’exclut et ce qui reste incertain. Une discussion clinico-pathologique résout les discordances mieux qu’un automatisme fondé sur un marqueur.</div><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S203] Khoury et al., OMS myéloïde/dendritique 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">[S206] OMS–EORTC 2018, publié 2019</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">[S212] Moonla et al., Haematologica 2023</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a>.</p></section>
