<section class="ilot" id="c86-e-5"><h2><span class="n">e-5</span>Cas cliniques pour vérifier le raisonnement</h2><p>Vignettes fictives : choisir une réponse puis lire l’explication. Les indices sont intégrés au contexte, sans remplacer une décision clinique réelle.</p><div class="quiz ui"><p><b>Cas 1 — nez</b> Une biopsie d’ulcère palatin montre un infiltrat compatible, EBER dans les cellules tumorales et phénotype cytotoxique NK. Quel couple est cohérent ?</p><button data-ok="1">A. ENKTL ; suivi de l’ADN d’EBV plasmatique avec la réponse clinique et métabolique.</button><button data-ok="0">B. LyP ; sérologie EBV seule pour mesurer la tumeur.</button><button data-ok="0">C. HSTL ; CHOP automatique.</button><p class="fb" hidden>Réponse A. L’ensemble tissu–EBV–phénotype soutient ENKTL. La sérologie EBV isolée ne prouve pas la tumeur et l’ADN plasmatique n’en remplace pas la biopsie.</p></div><div class="quiz ui"><p><b>Cas 2 — peau</b> Des papules régressent spontanément par poussées, avec une biopsie compatible avec LyP et aucun signe systémique. Quelle conclusion est correcte ?</p><button data-ok="1">A. La corrélation clinique–histologique guide un parcours cutané ; une diffusion cutanée n’est pas automatiquement un stade IV systémique.</button><button data-ok="0">B. Toutes les lésions CD30 positives exigent BV-CHP.</button><button data-ok="0">C. Une TEP et une moelle sont obligatoires dans toute LyP typique.</button><p class="fb" hidden>Réponse A. Chronologie et absence de signe d’extension évitent une stadification ou un traitement excessif. Le suivi reste nécessaire pour les lymphomes associés.</p></div><div class="quiz ui"><p><b>Cas 3 — biologie</b> Sous Elzonris, l’albumine passe de 3,8 à 3,3 g/dL avec gain rapide de poids. Quelle lecture est correcte ?</p><button data-ok="1">A. Suspecter une fuite capillaire et appliquer l’algorithme de suspension/prise en charge de la FI.</button><button data-ok="0">B. Poursuivre sans réévaluation car 3,3 dépasse le seuil de démarrage de 3,2.</button><button data-ok="0">C. Attendre le sixième jour, date obligatoire de survenue.</button><p class="fb" hidden>Réponse A. Le seuil sous traitement est distinct : albumine <3,5 ou baisse ≥0,5 g/dL. Le tableau clinique renforce l’alerte ; la médiane de six jours n’est pas un calendrier de sécurité.</p></div><div class="quiz ui"><p><b>Cas 4 — intestin</b> Une personne cœliaque reste symptomatique avec atrophie après au moins douze mois de régime vérifié ; une population intraépithéliale aberrante est documentée. Quelle démarche est correcte ?</p><button data-ok="1">A. Confirmer RCD-II par l’ensemble des données, exclure EATL et alternatives, puis organiser le suivi expert.</button><button data-ok="0">B. Appeler automatiquement tout clone un EATL.</button><button data-ok="0">C. Attribuer le risque de transformation de RCD-II à toutes les personnes cœliaques.</button><p class="fb" hidden>Réponse A. Symptômes, régime, histologie, cytométrie et clonalité s’interprètent ensemble. Une complication aiguë impose une évaluation urgente indépendante du rythme programmé.</p></div><button class="pareto-btn ui" data-k="pareto-c86-examens">▲ Loi de Pareto — Examens et interprétation</button><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a>.</p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="c86-tab-semio" role="tab" aria-selected="true" aria-controls="c86-s-semio" data-s="c86-s-semio">Sémiologie fondamentale et analytique</button><button id="c86-tab-anat" role="tab" aria-selected="false" aria-controls="c86-s-anat" data-s="c86-s-anat">Anatomie</button><button id="c86-tab-histo" role="tab" aria-selected="false" aria-controls="c86-s-histo" data-s="c86-s-histo">Histologie</button><button id="c86-tab-physio" role="tab" aria-selected="false" aria-controls="c86-s-physio" data-s="c86-s-physio">Physiologie</button><button id="c86-tab-bio" role="tab" aria-selected="false" aria-controls="c86-s-bio" data-s="c86-s-bio">Biochimie</button><button id="c86-tab-gen" role="tab" aria-selected="false" aria-controls="c86-s-gen" data-s="c86-s-gen">Génétique</button></div><div class="chap-body sci-body"><div class="sci" id="c86-s-semio" role="tabpanel" aria-labelledby="c86-tab-semio"><section class="ilot" id="c86-s-semio-cours"><h2>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h2><p>Le signe clinique devient utile lorsqu’on explique quel tissu fonctionne normalement, comment il est perturbé et ce que l’observation permet réellement de conclure. Dans C86, le siège et le mode évolutif orientent le prélèvement ; ils ne remplacent jamais la classification tissulaire. Les neuf étapes suivantes relient le raisonnement à des décisions concrètes.</p><section class="ilot" id="c86-semio-normal" data-semiology="normal"><h3>1. Normalité : circulation, territoires et contrôles immunitaires</h3><p>Les lymphocytes se développent dans les organes lymphoïdes primaires puis circulent dans le sang et la lymphe et participent aux réponses dans les organes secondaires. Les ganglions organisent les réponses aux antigènes provenant des tissus ; la rate participe au contrôle des éléments circulant dans le sang. Les muqueuses respiratoires et digestives contiennent aussi du tissu lymphoïde. Il existe donc des cellules immunitaires hors des ganglions : un lymphome n’a pas besoin de produire une masse ganglionnaire palpable.</p><p>Une expansion clonale T peut être normale lorsqu’un antigène sélectionne des cellules portant un récepteur adapté ; la réponse est ensuite régulée. Le signal moléculaire de clonalité n’est donc pas synonyme de cancer. La transformation associe un contexte, une architecture anormale, une cytologie, un phénotype parfois aberrant et des anomalies biologiques. Dans la peau, distinguer surface, derme et hypoderme guide la profondeur nécessaire du prélèvement.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">[S226] OpenStax, anatomie et physiologie 2e, §21.1 : bases normales, texte seulement</a> ; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-3-the-adaptive-immune-response-t-lymphocytes-and-their-functional-types" target="_blank" rel="noopener">[S227] OpenStax, anatomie et physiologie 2e, §21.3 : fonctions T normales, texte seulement</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">[S212] Moonla et al., Haematologica 2023</a>.</p></section><section class="ilot" id="c86-semio-signs" data-semiology="signs"><h3>2. Décrire les signes : siège, temps et retentissement</h3><p>Une <b>papule</b> superficielle qui apparaît puis régresse au sein de poussées répétées n’exprime pas la même dynamique qu’un <b>nodule profond</b> persistant ou qu’une <b>ulcération nécrotique</b> progressive. Pour une LyP présumée, documenter la durée de chaque lésion, les récidives et les lésions qui ne suivent pas le même cours. Pour une panniculite, préciser profondeur, douleur, distribution et symptômes généraux ; l’aspect seul ne sépare pas SPTCL et lupus.</p><p>Une obstruction nasale unilatérale, des épistaxis et une ulcération palatine évoquent un processus local destructeur. Rechercher dyspnée, bruit inspiratoire, modification de voix et difficulté à avaler afin de ne pas manquer le retentissement des voies aériennes. Fièvre avec grosse rate et cytopénies, même sans adénopathie, fait discuter HSTL, infection, toxicité et HLH. Dans l’entéropathie, préciser douleur, diarrhée, perte pondérale, alimentation, saignement et signes d’occlusion.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://onlinelibrary.wiley.com/doi/full/10.1111/ddg.14492" target="_blank" rel="noopener">[S219] S2k lupus cutané 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6624667/" target="_blank" rel="noopener">[S211] Carvão et al., revue de cas Crohn/HSTL, 2019</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a>.</p></section><section class="ilot" id="c86-semio-mechanisms" data-semiology="mechanisms"><h3>3. Expliquer une chaîne plutôt que réciter une association</h3><table class="t"><thead><tr><th>Fonction ou structure</th><th>Perturbation</th><th>Signe et conséquence</th></tr></thead><tbody><tr><td>Muqueuse ORL et lumière respiratoire</td><td>Infiltration/destruction de l’ENKTL</td><td>Ulcération, saignement, obstruction ; un stridor impose de traiter d’abord la menace respiratoire.</td></tr><tr><td>Sinusoïdes médullaires, spléniques et hépatiques</td><td>Infiltration du HSTL</td><td>Hépatosplénomégalie et cytopénies sans masse ganglionnaire dominante ; orienter l’examen médullaire.</td></tr><tr><td>Épithélium intestinal et nutrition</td><td>Atrophie, lymphocytes aberrants, ulcération ou lymphome</td><td>Malabsorption, amaigrissement, hypoalbuminémie ; rechercher RCD-II/EATL et complications.</td></tr><tr><td>Régulation de l’activation immunitaire</td><td>Hyperinflammation de HLH</td><td>Fièvre, cytopénies, atteinte hépatique/coagulation ; soins de soutien et bilan causal en parallèle.</td></tr><tr><td>Interactions TFH–cellules B</td><td>Microenvironnement tumoral perturbé</td><td>Hypergammaglobulinémie et manifestations auto-immunes possibles ; les cellules B EBV positives ne sont pas automatiquement le clone T.</td></tr></tbody></table><p>Ces chaînes expliquent pourquoi le même symptôme peut avoir plusieurs causes. Une thrombopénie peut résulter d’une infiltration, d’une consommation, d’une séquestration splénique ou d’un traitement. La localiser dans un mécanisme demande la chronologie, l’hémogramme complet, le frottis et les examens ciblés ; le seul code ne tranche pas.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a> ; <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S223] HUG, enseignement hémogramme adulte, septembre 2019</a>.</p></section><section class="ilot" id="c86-semio-examination" data-semiology="examination"><h3>4. Examiner et mesurer dans de bonnes conditions</h3><p>L’examen comporte l’ensemble de la peau et les aires ganglionnaires, l’abdomen, la cavité buccale et l’évaluation des fonctions vitales selon les signes. Décrire la lésion choisie pour biopsie, sa profondeur et les traitements déjà reçus. Une lésion palatine nécrotique ne doit pas conduire à prélever uniquement du matériel non exploitable. Une lésion sous-cutanée demande une biopsie qui atteint le tissu malade. L’équipe de prélèvement et le laboratoire définissent ensemble les besoins de fixation et de cytométrie.</p><p>Une valeur biologique garde sa méthode et son unité. L’enseignement HUG 2019 donne chez l’adulte une Hb de référence de 140–180 g/L chez l’homme et 120–160 g/L chez la femme, des leucocytes de 4–11 ×10⁹/L et des plaquettes de 150–350 ×10⁹/L. Ce sont des repères datés, pas des normes universelles ni des seuils pédiatriques. La référence du laboratoire du patient prévaut. Une mesure de l’EBV dans le plasma n’est pas interchangeable avec un résultat obtenu sur sang total.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1111/ddg.14706" target="_blank" rel="noopener">[S218] S2k lymphomes cutanés 2021, publié 2022</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S223] HUG, enseignement hémogramme adulte, septembre 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a>.</p></section><section class="ilot" id="c86-semio-interpretation" data-semiology="interpretation"><h3>5. Interpréter : ce que prouve un test et ce qu’il ne prouve pas</h3><p>Un <b>CD30 positif</b> peut servir à caractériser une prolifération ou à définir une population d’essai. Le seuil ≥75 % de cellules tumorales appartient aux critères du pcALCL dans le contexte adapté ; le seuil ≥10 % était celui d’ECHELON-2. Ni l’un ni l’autre ne dispense d’identifier l’entité. Un panel TFH implique CD4 et au moins deux marqueurs, mais le type angio-immunoblastique nécessite aussi son architecture.</p><p>Un <b>EBER positif</b> localise l’infection dans une population du tissu ; un <b>ADN d’EBV plasmatique</b> est un biomarqueur de charge/réponse. Une <b>fixation TEP</b> n’est pas spécifique de tumeur viable. Une <b>ferritine ≥500 µg/L</b> est un seuil de critères HLH, très peu spécifique chez l’adulte. Une <b>clonalité T</b> peut exister dans une réponse non maligne. L’absence d’adénopathie ne rassure pas devant un tableau de HSTL ; une absence de signe cutané n’exclut pas BPDCN.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a> ; <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://ashpublications.org/blood/article/133/23/2465/273833/Recommendations-for-the-management-of" target="_blank" rel="noopener">[S215] La Rosée et al., HLH adulte, 2019</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a> ; <a href="https://journals.lww.com/hemasphere/fulltext/2023/03000/unmet_clinical_needs_and_management.2.aspx" target="_blank" rel="noopener">[S217] Pagano et al., consensus international BPDCN 2023</a>.</p></section><section class="ilot" id="c86-semio-differentials" data-semiology="differentials"><h3>6. Faire des comparaisons utiles au lit du patient</h3><p><b>LyP ou pcALCL :</b> la régression spontanée répétée de chaque lésion oriente la LyP, mais l’histologie et la surveillance d’une lésion atypique restent nécessaires. <b>SPTCL ou panniculite lupique :</b> le siège profond et les nodules se recouvrent ; relier une biopsie représentative au contexte dermatologique et immunologique. <b>ENKTL ou autre ulcération ORL :</b> l’EBV doit être démontré dans les cellules tumorales et la morphologie doit être compatible ; l’aspect nécrotique seul ne suffit pas.</p><p><b>RCD-II ou EATL :</b> des lymphocytes aberrants et une atrophie ne prouvent pas un lymphome invasif ; l’EATL est recherché par l’ensemble du bilan spécialisé. <b>Hémolyse ou infiltration médullaire :</b> la chute d’Hb avec réticulocytose, LDH/bilirubine compatibles et haptoglobine basse oriente une destruction, mais le contexte et le frottis restent essentiels. <b>HLH ou sepsis :</b> ils peuvent coexister ; les distinguer n’autorise pas à retarder le traitement d’une infection possible.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://onlinelibrary.wiley.com/doi/full/10.1111/ddg.14492" target="_blank" rel="noopener">[S219] S2k lupus cutané 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S223] HUG, enseignement hémogramme adulte, septembre 2019</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a>.</p></section><section class="ilot" id="c86-semio-urgency" data-semiology="urgency"><h3>7. Reconnaître ce qui ne peut pas attendre</h3><p>Stridor ou détresse respiratoire dans une atteinte ORL, douleur abdominale aiguë avec suspicion de perforation/occlusion, saignement important et instabilité hémodynamique imposent une prise en charge hospitalière immédiate. Dans un HLH possible avec atteinte d’organes, évaluation, traitement du déclencheur, immunomodulation et soutien se discutent en parallèle ; attendre le résultat génétique ou tous les critères peut être dangereux.</p><p>Sous tagraxofusp, une prise de poids, des œdèmes, une baisse d’albumine ou une hypotension font rechercher une fuite capillaire avant la dose suivante. Sous pégaspargase, douleur abdominale persistante, signes thrombotiques ou ictère demandent une évaluation et une adaptation selon la FI. Sous brentuximab, un nouveau trouble neurologique n’est pas toujours une neuropathie périphérique banale : une suspicion de LEMP entraîne une suspension et un bilan. Le patient doit connaître les signes et le contact de l’équipe.</p><figure id="c86-semio-original" data-origin="human-original"><img src="assets/img/c86/alpha/codex/tse2022-figure1-original.jpg" alt="Planche originale ENKTL, panneaux A à G : atteinte orbitaire et palatine, obstruction laryngée, foyers cutanés et évolution après traitement" loading="lazy" width="1770" height="974"><figcaption><b>Figure originale — ENKTL, du site au retentissement.</b> <b>A–B :</b> les flèches noires montrent l’atteinte orbitaire ; les flèches blanches de B repèrent la nécrose/destruction palatine. <b>C :</b> même patient après début du traitement, observation illustrative. <b>D :</b> autre patient, lumière laryngée très rétrécie sur TDM et fixation en TEP ; le cas publié a nécessité une trachéotomie urgente. <b>E–F :</b> foyers cutanés concordants entre TEP et photographies ; une biopsie nasopharyngée révélait aussi une atteinte malgré l’examen visuel initial. <b>G :</b> évolution de ces lésions après traitement. Les cas ne donnent ni une sensibilité diagnostique ni une garantie de réponse. Original humain de Tse et al., <i>Journal of Hematology &amp; Oncology</i> 2022, figure 1, <a href="https://doi.org/10.1186/s13045-022-01293-5" target="_blank" rel="noopener">source éditeur</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels, lettres et flèches d’origine conservés ; légende explicative française ajoutée.</figcaption></figure><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669340018" target="_blank" rel="noopener">[S222] FI suisse Oncaspar, septembre 2025, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a>.</p></section><section class="ilot" id="c86-semio-limits" data-semiology="limits"><h3>8. Limites : population, technologie et réglementation</h3><p>Les performances d’un signe isolé ne sont pas chiffrées lorsqu’aucune étude adaptée n’a été lue. Les petits groupes de cas Crohn/HSTL ne décrivent pas tous les HSTL ; les registres cutanés ne donnent pas le pronostic de tout ENKTL nasal. Un odds ratio HAVCR2/HLH n’est ni un risque absolu ni une causalité individuelle démontrée. Les critères HLH pédiatriques servent de cadre chez l’adulte, avec jugement clinique.</p><p>Les doses et indications de la FI suisse concernent un produit précis ; la recommandation européenne et le remboursement suisse répondent à d’autres questions. Les normes HUG adultes ne s’appliquent pas à un nouveau-né ou à la grossesse. Les figures illustrent des patients publiés et une histologie sélectionnée ; elles ne permettent pas un diagnostic personnel par ressemblance. Les sources actuelles peuvent conserver des termes historiques, comme EATL type II : la nomenclature OMS est explicitement distinguée.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6624667/" target="_blank" rel="noopener">[S211] Carvão et al., revue de cas Crohn/HSTL, 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">[S206] OMS–EORTC 2018, publié 2019</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">[S212] Moonla et al., Haematologica 2023</a> ; <a href="https://ashpublications.org/blood/article/133/23/2465/273833/Recommendations-for-the-management-of" target="_blank" rel="noopener">[S215] La Rosée et al., HLH adulte, 2019</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S224] OFSP, liste des spécialités</a>.</p></section><section class="ilot" id="c86-semio-sources" data-semiology="sources"><h3>9. Relier chaque chaîne aux passages lus</h3><table class="t"><thead><tr><th>Question</th><th>Passages utilisés</th></tr></thead><tbody><tr><td>Territoires normaux et réponse T</td><td>OpenStax §21.1 et §21.3, bases descriptives seulement, sans recommandation thérapeutique américaine ni réutilisation de figure.</td></tr><tr><td>Architecture, phénotype, biopsie</td><td>OMS 2022 lymphoïde et dendritique ; ESMO–EHA 2025 diagnostic et stadification.</td></tr><tr><td>ORL, EBER, plasma et imagerie</td><td>Tse 2022 : figure 1, évaluation, mécanismes et traitement ; ESMO–EHA ENKTL.</td></tr><tr><td>Peau et régression</td><td>OMS–EORTC 2018 ; consensus Kempf 2011 ; ESMO cutané 2018 ; S2k 2021/2022.</td></tr><tr><td>Intestin et hyperinflammation</td><td>ESsCD 2025 partie 2 publiée 2026, §§5.3 et 6.2 ; La Rosée 2019 table 2 ; EULAR/ACR 2022 publié 2023.</td></tr><tr><td>Mesure et sécurité</td><td>HUG 2019, tableau hémogramme adulte et hémolyse ; FI suisses exactes Adcetris, Elzonris et Oncaspar.</td></tr></tbody></table><p>Le dossier de preuves conserve URL, éditeur, version, section réellement consultée, paraphrase, population et limite. Les textes téléchargés mais non parcourus intégralement ne sont pas qualifiés de lectures intégrales. La revue de l’auteur et les tests de navigation ne constituent pas une certification clinique humaine.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S203] Khoury et al., OMS myéloïde/dendritique 2022</a> ; <a href="https://ashpublications.org/blood/article/133/23/2465/273833/Recommendations-for-the-management-of" target="_blank" rel="noopener">[S215] La Rosée et al., HLH adulte, 2019</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S223] HUG, enseignement hémogramme adulte, septembre 2019</a>.</p></section><div class="key"><p><b>Science → clinique.</b> Une ulcération ORL, des cytopénies ou des papules régressives orientent des mécanismes différents, à confronter au contexte.</p><p><b>Science → examen.</b> Choisir le tissu et la profondeur à partir du siège ; distinguer référence de laboratoire et seuil diagnostique.</p><p><b>Science → traitement.</b> La menace respiratoire ou le HLH grave peut nécessiter une action pendant le bilan.</p><p><b>À retenir.</b> Décrire, expliquer, tester puis interpréter ; aucun signe isolé ne résume C86.</p></div><button class="pareto-btn ui" data-k="pareto-c86-semio">▲ Loi de Pareto — Sémiologie fondamentale</button></section></div><div class="sci" id="c86-s-anat" role="tabpanel" aria-labelledby="c86-tab-anat" hidden><section class="ilot" id="c86-s-anat-cours"><h2>Anatomie : de la distribution normale au site de prélèvement</h2><p>Les lymphocytes sont présents dans la moelle, le sang, les organes lymphoïdes et les tissus périphériques. La moelle produit les précurseurs ; les lymphocytes T mûrissent dans le thymus puis rejoignent des territoires où ils rencontrent les antigènes. Les ganglions reçoivent la lymphe des tissus, tandis que la rate filtre le sang. Des structures lymphoïdes muqueuses participent à la défense des voies respiratoires et du tube digestif. Cette organisation explique la possibilité d’une maladie extranodale sans adénopathie dominante.</p><p>Dans un ganglion normal, capsule, réseau de soutien, zones lymphocytaires et vaisseaux constituent une architecture utile au diagnostic. Les veinules à endothélium haut facilitent l’entrée de cellules depuis le sang. Une biopsie ne se réduit donc pas à un prélèvement de cellules : elle doit préserver assez d’organisation pour reconnaître une transformation. Le tissu atteint et sa profondeur orientent le geste.</p><table class="t"><thead><tr><th>Territoire</th><th>Lien avec C86</th><th>Conséquence pratique</th></tr></thead><tbody><tr><td>Cavité nasale, palais, voies aériennes supérieures</td><td>ENKTL peut détruire les tissus et s’étendre sous la muqueuse.</td><td>Examiner ORL et respiration, cartographier par imagerie, prélever un tissu représentatif.</td></tr><tr><td>Sinusoïdes de moelle, rate et foie</td><td>Distribution typique du HSTL, parfois sans ganglion palpable.</td><td>La moelle peut confirmer la maladie ; une TEP seule peut sous-estimer l’infiltration diffuse.</td></tr><tr><td>Intestin grêle</td><td>Atrophie/ulcération dans RCD-II ; EATL et risque de perforation ou d’obstruction.</td><td>Biopsies et exploration digestive ciblées ; prise en charge urgente si complication aiguë.</td></tr><tr><td>Hypoderme</td><td>SPTCL autour du tissu adipeux sous-cutané.</td><td>Une biopsie limitée à l’épiderme manque le compartiment utile.</td></tr><tr><td>Peau, moelle et autres sites</td><td>BPDCN ou prolifération CD30 selon phénotype et contexte.</td><td>Un aspect violacé ou CD56 positif ne suffit pas à définir la lignée.</td></tr><tr><td>Ganglion</td><td>nTFHL-AI et ses diagnostics différentiels.</td><td>Privilégier une architecture exploitable, surtout pour distinguer les types TFH.</td></tr></tbody></table><p>Le tableau associe des territoires fréquents ; il ne définit pas des frontières absolues. Une maladie nasale peut disséminer à la peau, et une présentation cutanée peut cacher une atteinte nasopharyngée. Dans la figure, l’examen nasopharyngé initial ne voyait pas de lésion chez le patient E–G, alors que des biopsies étaient positives. L’anatomie guide la recherche sans dispenser d’une exploration complète.</p><figure id="c86-anat-original" data-origin="human-original"><img src="assets/img/c86/alpha/codex/tse2022-figure1-original.jpg" alt="Planche originale ENKTL, panneaux A à G : atteinte orbitaire et palatine, obstruction laryngée, foyers cutanés et évolution après traitement" loading="lazy" width="1770" height="974"><figcaption><b>Figure originale — ENKTL, du site au retentissement.</b> <b>A–B :</b> les flèches noires montrent l’atteinte orbitaire ; les flèches blanches de B repèrent la nécrose/destruction palatine. <b>C :</b> même patient après début du traitement, observation illustrative. <b>D :</b> autre patient, lumière laryngée très rétrécie sur TDM et fixation en TEP ; le cas publié a nécessité une trachéotomie urgente. <b>E–F :</b> foyers cutanés concordants entre TEP et photographies ; une biopsie nasopharyngée révélait aussi une atteinte malgré l’examen visuel initial. <b>G :</b> évolution de ces lésions après traitement. Les cas ne donnent ni une sensibilité diagnostique ni une garantie de réponse. Original humain de Tse et al., <i>Journal of Hematology &amp; Oncology</i> 2022, figure 1, <a href="https://doi.org/10.1186/s13045-022-01293-5" target="_blank" rel="noopener">source éditeur</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels, lettres et flèches d’origine conservés ; légende explicative française ajoutée.</figcaption></figure><div class="key"><b>Normal → pathologique → geste.</b> Connaître le compartiment malade permet de choisir un prélèvement utile ; cela ne permet pas d’identifier la maladie sur le siège seul.</div><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">[S226] OpenStax, anatomie et physiologie 2e, §21.1 : bases normales, texte seulement</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">[S212] Moonla et al., Haematologica 2023</a>.</p><button class="pareto-btn ui" data-k="pareto-c86-anat">▲ Loi de Pareto — Anatomie</button></section><div class="key"><p><b>Science → clinique.</b> L’infiltration de rate, foie et moelle explique un HSTL sans adénopathie dominante.</p><p><b>Science → examen.</b> Un nodule de l’hypoderme nécessite un prélèvement assez profond ; une tumeur nécrotique demande du tissu exploitable.</p><p><b>Science → traitement.</b> Le siège local participe aux volumes de radiothérapie, tandis que l’extension systémique impose une stratégie globale.</p><p><b>À retenir.</b> Le site guide le prélèvement, sans imposer à lui seul l’entité.</p></div></div><div class="sci" id="c86-s-histo" role="tabpanel" aria-labelledby="c86-tab-histo" hidden><section class="ilot" id="c86-s-histo-cours"><h2>Histologie : lire ensemble architecture, cellule et marqueur</h2><p>Un tissu lymphoïde normal contient plusieurs populations, des vaisseaux et un réseau de soutien. Une prolifération réactionnelle peut augmenter le nombre de cellules sans constituer une tumeur. À l’inverse, des cellules tumorales ne conservent pas nécessairement tous les marqueurs de la cellule normale : pertes ou diminutions de CD2, CD3, CD5, CD7 ou d’autres antigènes sont possibles. C’est la cohérence de l’ensemble qui fait le diagnostic.</p><table class="t"><thead><tr><th>Entité</th><th>Éléments utiles</th><th>Piège</th></tr></thead><tbody><tr><td>ENKTL</td><td>Morphologie compatible, EBER tumoral, CD56 et/ou molécules cytotoxiques ; profil NK ou T selon les cas.</td><td>Un EBER positif dans des cellules B voisines n’identifie pas le clone T/NK.</td></tr><tr><td>HSTL</td><td>Infiltrat intrasinusoïdal, immunophénotype T, contexte hépatosplénique/médullaire.</td><td>L’absence de masse ganglionnaire n’exclut pas le diagnostic.</td></tr><tr><td>SPTCL</td><td>Cellules T atypiques entourant les adipocytes, CD8/βF1/cytotoxicité dans le panel adapté.</td><td>Lupus et lymphome gamma-delta demandent une confrontation, pas une seule coloration.</td></tr><tr><td>BPDCN</td><td>Panel pDC : CD123, TCF4, TCL1, CD303, CD304, avec profils positifs/négatifs OMS.</td><td>CD4/CD56 seuls sont insuffisants ; CD123 est aussi exprimé dans d’autres contextes.</td></tr><tr><td>nTFHL-AI</td><td>Architecture effacée, veinules arborisées, phénotype TFH et contexte intégré.</td><td>Deux marqueurs TFH ne définissent pas à eux seuls le type angio-immunoblastique.</td></tr><tr><td>LyP/pcALCL</td><td>CD30 et morphologie, confrontés à la régression ou persistance et au bilan d’extension.</td><td>Le seuil d’un essai thérapeutique n’est pas un critère diagnostique interchangeable.</td></tr></tbody></table><p>La figure OMS compare trois architectures qui partagent une différenciation TFH. En A, les veinules arborisées et l’infiltrat contribuent au type angio-immunoblastique. En B, l’architecture folliculaire et l’insert PD1 illustrent un autre type ; C montre une prolifération en nappes. Un petit prélèvement peut manquer les zones discriminantes. L’OMS recommande une désignation prudente sur carotte lorsque l’échantillonnage ne permet pas un sous-typage fiable.</p><figure id="c86-histo-original" data-origin="human-original"><img src="assets/img/c86/alpha/codex/who2022-figure7-original.png" alt="Histologie originale OMS des lymphomes TFH : A type angio-immunoblastique, B type folliculaire avec insert PD1, C sans autre spécification" loading="lazy" width="747" height="1430"><figcaption><b>Figure originale — Trois architectures TFH.</b> <b>A :</b> type angio-immunoblastique, architecture effacée et réseau de veinules arborisées ; ce panneau illustre C86.5. <b>B :</b> type folliculaire, amas de cellules pâles au sein de petits lymphocytes ; l’insert montre PD1. <b>C :</b> type sans autre spécification, prolifération en nappes. B et C servent de comparaison et ne doivent pas être tous codés C86.5 du seul fait d’un phénotype TFH. La classification requiert le prélèvement complet, son panel et le contexte. Alaggio et al., <i>Leukemia</i> 2022, figure 7, <a href="https://www.nature.com/articles/s41375-022-01620-2/figures/7" target="_blank" rel="noopener">source éditeur</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Original humain inchangé ; repérage français des panneaux ajouté dans cette légende.</figcaption></figure><p>La clonalité est une pièce du raisonnement. Un clone dominant peut être non malin ; une tumeur peut être mal détectée par un test de réarrangement. Le séquençage peut compléter l’analyse, mais une mutation liée à l’hématopoïèse clonale ne localise pas automatiquement la tumeur. L’expert relie les résultats au compartiment et aux cellules effectivement analysés.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">[S226] OpenStax, anatomie et physiologie 2e, §21.1 : bases normales, texte seulement</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S203] Khoury et al., OMS myéloïde/dendritique 2022</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">[S212] Moonla et al., Haematologica 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">[S206] OMS–EORTC 2018, publié 2019</a>.</p><button class="pareto-btn ui" data-k="pareto-c86-histo">▲ Loi de Pareto — Histologie</button></section><div class="key"><p><b>Science → clinique.</b> La même expression de CD30 peut accompagner des évolutions différentes : LyP, pcALCL ou ALCL systémique.</p><p><b>Science → examen.</b> Architecture et panel complètent la cytologie ; une petite carotte peut limiter le sous-typage TFH.</p><p><b>Science → traitement.</b> La classification correcte évite une chimiothérapie excessive dans LyP et oriente les traitements ciblés dans leur indication.</p><p><b>À retenir.</b> Un marqueur et un clone ne constituent pas seuls un diagnostic.</p></div></div><div class="sci" id="c86-s-physio" role="tabpanel" aria-labelledby="c86-tab-physio" hidden><section class="ilot" id="c86-s-physio-cours"><h2>Physiologie : activer, aider, tuer puis réguler</h2><p>Une cellule T reconnaît un antigène présenté dans un contexte de molécules du complexe majeur d’histocompatibilité. Les clones pertinents prolifèrent et se différencient ; des populations mémoire persistent. Les cellules auxiliaires sécrètent des médiateurs qui orientent d’autres cellules, tandis que les cellules cytotoxiques peuvent induire l’apoptose de cibles. Les cellules régulatrices limitent la réponse. Cette expansion contrôlée est physiologique ; elle ne constitue pas en soi une malignité.</p><p>Les fonctions ne se déduisent pas parfaitement d’une seule étiquette : CD4 est associé surtout aux fonctions auxiliaires/régulatrices et CD8 à la cytotoxicité, avec des exceptions. Les cellules NK utilisent également des mécanismes cytotoxiques, dont perforine et granzymes, sans récepteur T réarrangé. C’est pourquoi une protéine cytotoxique ou CD56 ne prouve pas seule une lignée unique. Le BPDCN doit être séparé de ces lignées malgré son ancien nom.</p><table class="t"><thead><tr><th>Fonction normale</th><th>Perturbation liée à la leçon</th><th>Retentissement interprétable</th></tr></thead><tbody><tr><td>Expansion puis régulation de la réponse</td><td>Activation persistante, notamment dans HLH et certains défauts TIM-3</td><td>Inflammation systémique et atteinte d’organes ; le traitement du déclencheur et de l’hyperinflammation peut être simultané.</td></tr><tr><td>Coopération TFH avec les cellules B</td><td>Microenvironnement d’un lymphome TFH</td><td>Hypergammaglobulinémie, manifestations auto-immunes ou proliférations B associées possibles.</td></tr><tr><td>Défense des tissus périphériques</td><td>Prolifération extranodale T/NK</td><td>Atteintes de peau, muqueuse, intestin ou organes sans obligation d’adénopathie dominante.</td></tr><tr><td>Renouvellement sanguin et filtration splénique</td><td>Infiltration, inflammation, séquestration ou toxicité</td><td>Cytopénies de mécanismes différents à distinguer par la chronologie et le bilan.</td></tr></tbody></table><p>Dans nTFHL-AI, la perturbation ne concerne pas seulement le clone T. Les cellules et médiateurs voisins peuvent être responsables d’une grande partie des signes. Une augmentation polyclonale des immunoglobulines ne signifie pas un myélome ; des cellules B EBER positives ne rendent pas le lymphome T lui-même EBV positif. Une hémolyse auto-immune demande des signes biologiques de destruction et pas seulement un test direct à l’antiglobuline positif.</p><figure id="c86-physio-original" data-origin="human-original"><img src="assets/img/c86/alpha/codex/who2022-figure7-original.png" alt="Histologie originale OMS des lymphomes TFH : A type angio-immunoblastique, B type folliculaire avec insert PD1, C sans autre spécification" loading="lazy" width="747" height="1430"><figcaption><b>Figure originale — Trois architectures TFH.</b> <b>A :</b> type angio-immunoblastique, architecture effacée et réseau de veinules arborisées ; ce panneau illustre C86.5. <b>B :</b> type folliculaire, amas de cellules pâles au sein de petits lymphocytes ; l’insert montre PD1. <b>C :</b> type sans autre spécification, prolifération en nappes. B et C servent de comparaison et ne doivent pas être tous codés C86.5 du seul fait d’un phénotype TFH. La classification requiert le prélèvement complet, son panel et le contexte. Alaggio et al., <i>Leukemia</i> 2022, figure 7, <a href="https://www.nature.com/articles/s41375-022-01620-2/figures/7" target="_blank" rel="noopener">source éditeur</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Original humain inchangé ; repérage français des panneaux ajouté dans cette légende.</figcaption></figure><p>Dans le HLH, la fonction effectrice échappe à sa régulation et s’accompagne de lésions d’organes. Le syndrome peut être génétique, infectieux, malin ou associé à une maladie inflammatoire ; plusieurs contributeurs peuvent coexister. La présence d’hémophagocytose n’est qu’un indice. Le clinicien suit l’évolution des fonctions vitales et des biomarqueurs pour apprécier la dynamique, plutôt que d’attendre un signe histologique unique.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-3-the-adaptive-immune-response-t-lymphocytes-and-their-functional-types" target="_blank" rel="noopener">[S227] OpenStax, anatomie et physiologie 2e, §21.3 : fonctions T normales, texte seulement</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://ashpublications.org/blood/article/133/23/2465/273833/Recommendations-for-the-management-of" target="_blank" rel="noopener">[S215] La Rosée et al., HLH adulte, 2019</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">[S212] Moonla et al., Haematologica 2023</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S223] HUG, enseignement hémogramme adulte, septembre 2019</a>.</p><button class="pareto-btn ui" data-k="pareto-c86-physio">▲ Loi de Pareto — Physiologie</button></section><div class="key"><p><b>Science → clinique.</b> Une réponse immunitaire dérégulée peut donner fièvre et atteintes d’organes, au-delà de la masse tumorale.</p><p><b>Science → examen.</b> Confronter hémolyse présumée aux réticulocytes, bilirubine, LDH, haptoglobine et test direct à l’antiglobuline.</p><p><b>Science → traitement.</b> Le HLH grave peut nécessiter traitement du déclencheur et immunomodulation en parallèle.</p><p><b>À retenir.</b> Expansion clonale contrôlée et coopération cellulaire sont normales ; leur contexte distingue réaction et maladie.</p></div></div><div class="sci" id="c86-s-bio" role="tabpanel" aria-labelledby="c86-tab-bio" hidden><section class="ilot" id="c86-s-bio-cours"><h2>Biochimie : dépendance métabolique, signal viral et biomarqueur</h2><p>Une cellule doit fournir les acides aminés nécessaires à sa synthèse protéique. Une faible capacité de synthèse de l’asparagine rend certaines cellules d’ENKTL dépendantes de l’apport extracellulaire. L’asparaginase diminue cet apport ; la pégylation modifie l’exposition et l’immunogénicité de l’enzyme. Une activité administrée, une activité mesurée et une efficacité tumorale sont trois niveaux différents : des anticorps peuvent inactiver l’enzyme malgré l’administration du produit.</p><figure id="c86-bio-causal"><svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Relation causale non anatomique : capacité de synthèse limitée et déplétion en asparagine" viewBox="0 0 400 330"><rect x="10" y="10" width="380" height="125" rx="14" fill="#edf5f1" stroke="#38665c"/><text x="200" y="43" text-anchor="middle" font-size="18" fill="#173e46">Synthèse d’asparagine limitée</text><text x="200" y="68" text-anchor="middle" font-size="18" fill="#173e46">+ déplétion extracellulaire</text><text x="200" y="93" text-anchor="middle" font-size="18" fill="#173e46">par l’asparaginase</text><path d="M200 140 V180 M188 168 L200 180 L212 168" fill="none" stroke="#8b6a23" stroke-width="4"/><rect x="10" y="190" width="380" height="125" rx="14" fill="#fff8e8" stroke="#8b6a23"/><text x="200" y="225" text-anchor="middle" font-size="18" fill="#173e46">Compensation limitée</text><text x="200" y="250" text-anchor="middle" font-size="18" fill="#173e46">Vulnérabilité tumorale possible</text><text x="200" y="275" text-anchor="middle" font-size="18" fill="#173e46">Réponse à mesurer, non garantie</text></svg><div class="two"><div class="card"><h4>Chaîne métabolique</h4><p>Faible activité d’asparagine synthétase → compensation limitée de la déplétion extracellulaire → vulnérabilité à l’asparaginase.</p></div><div class="card"><h4>Chaîne de résistance</h4><p>Expression de P-gp et phénotype de multirésistance → mauvais résultats des programmes à anthracycline → choix de schémas sans anthracycline dans l’ENKTL.</p></div></div><figcaption>Diagramme causal pédagogique, sans structure anatomique ; relations décrites dans Tse 2022 et ESMO–EHA 2025. Les flèches expliquent une stratégie, pas une réponse individuelle garantie.</figcaption></figure><p>Les conséquences métaboliques ne sont pas exclusivement tumorales. La FI Oncaspar décrit une altération de la synthèse de protéines circulantes, avec hypoalbuminémie et anomalies de coagulation possibles. Pancréatite, intolérance au glucose et atteinte hépatique expliquent la surveillance clinique et biologique. Une baisse de fibrinogène peut donc provenir du traitement aussi bien que d’un syndrome inflammatoire ; la chronologie aide à distinguer les mécanismes.</p><p>L’ADN d’EBV plasmatique illustre un autre lien biochimie–clinique. La mort de cellules infectées libère des fragments détectables. Dans l’ENKTL, le signal suit la charge et la réponse ; le sang total inclut aussi les cellules B mémoires infectées et peut donner un signal d’une autre origine. Une limite de détection est une propriété analytique, pas une frontière biologique absolue entre absence et présence de maladie.</p><table class="t"><thead><tr><th>Résultat</th><th>Question correcte</th><th>Limite</th></tr></thead><tbody><tr><td>LDH au-dessus de la référence</td><td>Existe-t-il un marqueur de renouvellement ou de lésion tissulaire et un facteur pronostique dans ce contexte ?</td><td>Non spécifique d’un lymphome.</td></tr><tr><td>Ferritine croissante</td><td>Le profil s’intègre-t-il à une hyperinflammation et une atteinte d’organes ?</td><td>Le seuil HLH de 500 µg/L est peu spécifique chez l’adulte.</td></tr><tr><td>Albumine basse</td><td>Déficit nutritionnel, inflammation, pertes ou fuite capillaire sous traitement ?</td><td>Le seuil de 32 g/L avant tagraxofusp est une condition de traitement, pas une norme biologique.</td></tr><tr><td>CD123 ciblé par tagraxofusp</td><td>La néoplasie répond-elle aux critères BPDCN et le patient est-il éligible ?</td><td>Une cible exprimée n’est pas un diagnostic ni une garantie de réponse.</td></tr></tbody></table><p>Un calcul d’unité est une mesure de sécurité : 3,2 g/dL d’albumine =32 g/L ; 0,5 g/dL de baisse =5 g/L ; 12 µg/kg de tagraxofusp n’équivaut pas à 12 mg/kg. Les valeurs de la FI conservent le produit, la phase de traitement et la population. Elles ne servent pas de seuils universels pour tous les lymphomes.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669340018" target="_blank" rel="noopener">[S222] FI suisse Oncaspar, septembre 2025, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a>.</p><button class="pareto-btn ui" data-k="pareto-c86-bio">▲ Loi de Pareto — Biochimie</button></section><div class="key"><p><b>Science → clinique.</b> LDH, ferritine et albumine varient dans plusieurs mécanismes ; leur dynamique compte autant que la valeur isolée.</p><p><b>Science → examen.</b> Le suivi d’EBV utilise le prélèvement adapté ; une activité enzymatique mesure autre chose qu’une dose prescrite.</p><p><b>Science → traitement.</b> La dépendance en asparagine explique une option ENKTL, mais les toxicités pancréatiques, hépatiques et de coagulation imposent la surveillance.</p><p><b>À retenir.</b> Distinguer signal biologique, seuil de décision et effet clinique ; conserver les unités.</p></div></div><div class="sci" id="c86-s-gen" role="tabpanel" aria-labelledby="c86-tab-gen" hidden><section class="ilot" id="c86-s-gen-cours"><h2>Génétique : constitutionnel, acquis et clonal ne signifient pas la même chose</h2><p>Une anomalie <b>germinale</b> appartient au patrimoine constitutionnel ; une anomalie <b>somatique</b> apparaît dans une population de cellules. Une <b>clonalité</b> traduit une origine cellulaire commune ou une expansion sélectionnée ; elle ne suffit pas à déclarer une tumeur. Dans C86, ces trois notions se croisent et doivent être distinguées pour éviter une erreur de diagnostic ou de conseil génétique.</p><table class="t"><thead><tr><th>Situation</th><th>Observation documentée</th><th>Interprétation prudente</th></tr></thead><tbody><tr><td>nTFHL-AI</td><td>TET2/DNMT3A précoces dans l’hématopoïèse, puis RHOA/IDH2 dans la population TFH tumorale.</td><td>Le sang peut porter une hématopoïèse clonale sans prouver le siège ou le type du lymphome.</td></tr><tr><td>SPTCL</td><td>Variants germinaux HAVCR2 altérant TIM-3, distributions variables selon les cohortes.</td><td>Prédisposition et risque inflammatoire ; ni pénétrance complète ni prescription automatique.</td></tr><tr><td>RCD-II/EATL</td><td>Population intraépithéliale aberrante, clonalité et anomalies de voies JAK/STAT.</td><td>Le clone est confronté aux symptômes, à l’atrophie et à la recherche de lymphome constitué.</td></tr><tr><td>pcALCL/LyP</td><td>Réarrangements DUSP22–IRF4 dans une partie des cas.</td><td>La portée pronostique diffère de celle du lymphome anaplasique systémique ; ne pas transférer un pronostic entre entités.</td></tr><tr><td>HSTL</td><td>Anomalies cytogénétiques telles qu’isochromosome 7q dans les séries décrites.</td><td>Un marqueur contribue à un diagnostic intégré, sans remplacer morphologie et phénotype.</td></tr></tbody></table><figure id="c86-gen-causal"><svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Modèle causal non anatomique de transformation TFH, OMS 2022" viewBox="0 0 400 330"><rect x="10" y="10" width="380" height="125" rx="14" fill="#edf5f1" stroke="#38665c"/><text x="200" y="43" text-anchor="middle" font-size="18" fill="#173e46">Anomalies épigénétiques</text><text x="200" y="68" text-anchor="middle" font-size="18" fill="#173e46">précoces TET2 / DNMT3A</text><text x="200" y="93" text-anchor="middle" font-size="18" fill="#173e46">dans un clone hématopoïétique</text><path d="M200 140 V180 M188 168 L200 180 L212 168" fill="none" stroke="#8b6a23" stroke-width="4"/><rect x="10" y="190" width="380" height="125" rx="14" fill="#fff8e8" stroke="#8b6a23"/><text x="200" y="225" text-anchor="middle" font-size="18" fill="#173e46">Événements supplémentaires TFH</text><text x="200" y="250" text-anchor="middle" font-size="18" fill="#173e46">RHOA / IDH2 dans le modèle</text><text x="200" y="275" text-anchor="middle" font-size="18" fill="#173e46">Contexte et tissu à interpréter</text></svg><div class="card"><h4>Modèle de transformation TFH</h4><p>Clone hématopoïétique avec anomalies épigénétiques précoces → acquisition d’autres événements dans une population TFH → phénotype tumoral et microenvironnement perturbé.</p></div><figcaption>Modèle causal non anatomique fondé sur l’OMS 2022. Le modèle organise des observations de groupes ; il ne prétend pas reconstituer la chronologie de chaque patient.</figcaption></figure><p>Dans le SPTCL, le résumé de Gayden 2018 décrit deux variants affectant le repliement et l’expression membranaire de TIM-3. Moonla 2023 rapporte une cohorte thaïlandaise et une méta-analyse de données individuelles : sexe masculin et variants HAVCR2 sont associés au HLH ou à un état apparenté. La fréquence des variants dépend du recrutement et de l’ascendance ; le chiffre d’environ 60 % d’une série ne devient pas une fréquence nationale. Les odds ratios élevés avec intervalles larges expriment une association, pas la probabilité qu’un porteur développe un HLH.</p><p>La génétique peut affiner un diagnostic difficile et orienter un essai. Elle ne permet pas de sauter les étapes : une mutation TET2 n’impose pas de l’azacitidine, et une mutation HAVCR2 négative n’exclut pas un HLH. Le résultat, sa qualité et son origine constitutionnelle ou tumorale sont discutés avec l’équipe spécialisée ; une information familiale n’est donnée qu’après interprétation génétique appropriée.</p><div class="trap"><span class="k">Piège</span> Un vocabulaire moderne ne garantit pas une règle plus sûre. Toujours préciser la population, le tissu analysé et le rôle du résultat : diagnostic, pronostic, prédisposition ou cible expérimentale.</div><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">[S208] Onkopedia, octobre 2025, DGHO/OeGHO/SSH/SGMO</a> ; <a href="https://www.nature.com/articles/s41588-018-0251-4" target="_blank" rel="noopener">[S213] Gayden et al., Nature Genetics 2018, résumé lu</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">[S212] Moonla et al., Haematologica 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">[S206] OMS–EORTC 2018, publié 2019</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a>.</p><button class="pareto-btn ui" data-k="pareto-c86-gen">▲ Loi de Pareto — Génétique</button></section><div class="key"><p><b>Science → clinique.</b> Une prédisposition HAVCR2 module un risque de groupe sans déterminer l’évolution individuelle.</p><p><b>Science → examen.</b> Préciser tissu, technique et origine germinale ou somatique ; une mutation sanguine peut appartenir à une hématopoïèse clonale.</p><p><b>Science → traitement.</b> Une mutation TET2 n’impose pas de l’azacitidine ; un essai et son critère de résultat gardent leur importance.</p><p><b>À retenir.</b> Constitutionnel, somatique et clonal ne sont pas synonymes.</p></div></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="c86-p-1"><h2><span class="n">p-1</span>Stratégie pharmacologique : cible, preuve et indication</h2><p>Le traitement suit une entité confirmée, son extension et l’état du patient. La présence d’une cible est une information nécessaire dans certains parcours, mais ne suffit pas à démontrer que tous les patients porteurs bénéficient du même traitement. Les fenêtres donnent les mécanismes, les résultats et les limites des données consultées.</p><table class="t"><thead><tr><th>Classe / programme</th><th>Place</th><th>Point critique</th></tr></thead><tbody><tr><td>CHOP / CHOEP</td><td><button class="w" data-k="c86-chop">PTCL-NOS et lymphomes TFH nodaux</button></td><td>Programme de référence selon le contexte ; pas de règle universelle « six à huit cycles pour tous ». Formes limitées favorables : stratégie abrégée possible.</td></tr><tr><td>Brentuximab védotine, Adcetris</td><td><button class="w" data-k="c86-bv">Anti-CD30 conjugué à MMAE ; BV-CHP ou monothérapie selon indication</button></td><td>Le bénéfice d’ECHELON-2 est surtout établi dans l’ALCL systémique ; autorisation suisse et efficacité par sous-type sont deux questions distinctes.</td></tr><tr><td>Programmes à asparaginase</td><td><button class="w" data-k="c86-asp">ENKTL : mSMILE, DDGP, AspaMetDex, P-GemOx selon contexte</button></td><td>DeVIC ne contient pas d’asparaginase ; il ne doit pas figurer comme exemple de cette classe. Oncaspar n’a pas d’indication suisse ENKTL dans la FI lue.</td></tr><tr><td>ICE / IVE–méthotrexate</td><td><button class="w" data-k="c86-ice">HSTL / EATL selon programme</button></td><td>Intensité et consolidation sont anticipées ; pas une prescription interchangeable.</td></tr><tr><td>Tagraxofusp, Elzonris</td><td><button class="w" data-k="c86-tagra">Protéine ciblant CD123, BPDCN adulte première ligne</button></td><td>Surveillance spécifique de fuite capillaire ; ne remplace pas l’évaluation du SNC ni la discussion de greffe.</td></tr><tr><td>Corticoïdes, ciclosporine, méthotrexate</td><td>SPTCL sans HLH selon ESMO/S2k ; contrôle cutané selon entité.</td><td>Immunosuppression raisonnée ; ne pas appliquer un même schéma au SPTCL, à LyP et à BPDCN.</td></tr><tr><td>Méthotrexate faible dose / photothérapie / traitement local</td><td><button class="w" data-k="c86-lyp-trt">LyP et pcALCL</button></td><td>Objectif de contrôle des lésions et symptômes ; pas de prévention démontrée de tout lymphome associé.</td></tr><tr><td>Traitements de rechute</td><td><button class="w" data-k="c86-rechute">Options par entité et essais</button></td><td>Niveau de preuve, autorisation et remboursement à vérifier ; l’azacitidine orale n’a pas atteint son critère principal de supériorité de PFS dans l’essai TFH cité par ESMO.</td></tr></tbody></table><div class="key"><b>À retenir.</b> CD30, CD123 et EBV relient biologie et stratégie ; aucun ne remplace à lui seul le diagnostic, la lecture des preuves et le choix partagé.</div><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669340018" target="_blank" rel="noopener">[S222] FI suisse Oncaspar, septembre 2025, AIPS via AmiKo</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1111/ddg.14706" target="_blank" rel="noopener">[S218] S2k lymphomes cutanés 2021, publié 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a>.</p></section>
<section class="ilot" id="c86-p-2"><h2><span class="n">p-2</span>Posologies contextualisées et interactions</h2><p>Les doses ci-dessous sont rattachées à un produit, une population et une indication. Elles n’autorisent pas la transposition à un autre schéma. Les FI suisses sont la référence pour la préparation, la surveillance et les adaptations ; le centre prescripteur vérifie la version applicable.</p><table class="t"><thead><tr><th>Produit / indication</th><th>Dose effectivement lue</th><th>Conditions</th></tr></thead><tbody><tr><td>Adcetris avec CHP, PTCL adulte CD30+ non prétraité</td><td>1,8 mg/kg IV en 30 minutes, toutes les trois semaines, six à huit cycles.</td><td>Calcul limité à 100 kg si poids supérieur, soit 180 mg ; prophylaxie primaire par G-CSF dès la première dose selon FI.</td></tr><tr><td>Adcetris monothérapie, lymphome T cutané CD30+ dans l’indication</td><td>1,8 mg/kg toutes les trois semaines, jusqu’à 16 cycles selon réponse/tolérance.</td><td>Adaptations distinctes de la combinaison ; ne pas transférer automatiquement les règles de neuropathie entre schémas.</td></tr><tr><td>Elzonris, BPDCN adulte première ligne</td><td>12 µg/kg IV en 15 minutes, jours 1–5 d’un cycle de 21 jours.</td><td>Doses différables au plus tard au jour 10 selon FI ; premier cycle hospitalier et observation au moins 24 h après la dernière dose. Prémédication H1/H2, corticoïde et paracétamol environ une heure avant.</td></tr><tr><td>Oncaspar : rappel de FI pour LLA, PAS une dose ENKTL</td><td>≤21 ans et surface ≥0,6 m² : 2 500 U/m² toutes les deux semaines ; >21 ans : 2 000 U/m² toutes les deux semaines.</td><td>Ces doses sont celles de l’indication LLA. Le programme ENKTL doit fournir sa propre dose et son calendrier. Les unités des préparations d’asparaginase ne sont pas interchangeables.</td></tr><tr><td>Méthotrexate dans LyP, consensus 2011</td><td>Faibles doses souvent 5–30 mg par semaine dans les séries.</td><td>Rythme hebdomadaire, jamais quotidien par confusion ; choix, surveillance et statut individuel à vérifier. Ce tableau n’est pas une monographie suisse complète du méthotrexate.</td></tr><tr><td>Radiothérapie</td><td>ENKTL localisé : généralement ≥50 Gy ; nTFHL limité sélectionné : 30–40 Gy.</td><td>Volumes, fractionnement et associations définis par l’équipe de radiothérapie. Une dose totale en Gy n’est pas une dose médicamenteuse.</td></tr></tbody></table><div class="alert"><b>Associations et erreurs à éviter</b><p><b>Adcetris–bléomycine :</b> association contre-indiquée en raison de la toxicité pulmonaire. <b>Vincristine :</b> absente de BV-CHP pour limiter l’addition de neurotoxicité. Les inhibiteurs puissants de CYP3A4/P-gp peuvent augmenter l’exposition à MMAE ; la FI décrit une augmentation de 73 % avec kétoconazole, qui est un résultat pharmacocinétique et non un taux de toxicité. Les inducteurs peuvent réduire l’exposition.</p>
<p><b>Oncaspar :</b> ne pas convertir librement entre préparations d’asparaginase ; tenir compte des hypersensibilités, de l’activité enzymatique et des interactions propres au protocole. Les contre-indications comprennent des antécédents graves liés à une asparaginase et certaines atteintes hépatiques sévères, à lire dans la FI.</p>
<p><b>Thiopurine–anti-TNF :</b> une réévaluation spécialisée du rapport bénéfice–risque est justifiée ; la revue de cas ne fournit pas une règle d’arrêt automatique à deux ans. <b>ENKTL :</b> ne pas appliquer CHOP ; ne pas interdire toute radiothérapie seule, option possible chez certains stades I peu volumineux ou patients fragiles.</p></div><button class="w" data-k="c86-bv">Adaptations Adcetris selon schéma</button> <button class="w" data-k="c86-asp">Oncaspar : contre-indications et activité enzymatique</button><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669340018" target="_blank" rel="noopener">[S222] FI suisse Oncaspar, septembre 2025, AIPS via AmiKo</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6624667/" target="_blank" rel="noopener">[S211] Carvão et al., revue de cas Crohn/HSTL, 2019</a>.</p></section>
<section class="ilot" id="c86-p-3"><h2><span class="n">p-3</span>Surveiller et modifier : des signes aux décisions</h2><table class="t"><thead><tr><th>Produit</th><th>À surveiller</th><th>Décision décrite</th></tr></thead><tbody><tr><td>Elzonris</td><td>Avant chaque dose : albumine, poids et signes de fuite ; constantes, fonctions rénale et hépatique selon FI.</td><td>Albumine <3,5 g/dL ou baisse ≥0,5 ; poids +≥1,5 kg : appliquer l’algorithme de suspension et traitement. La FI décrit albumine IV et corticoïdes selon le tableau, avec décision de reprise liée à la gravité.</td></tr><tr><td>Elzonris, organes</td><td>ASAT/ALAT, créatinine/clairance, tension, pouls et température.</td><td>ASAT/ALAT >5 fois limite supérieure : suspendre jusqu’à ≤2,5 fois ; créatinine >1,8 mg/dL (159 µmol/L) ou clairance <60 mL/min : suspension selon FI. Ne pas réduire ces règles à une surveillance d’albumine seule.</td></tr><tr><td>Adcetris</td><td>Neuropathie sensitive/motrice, neutropénie, infection, signes neurologiques compatibles avec LEMP.</td><td>Adaptation selon grade ET combinaison. Avec CHP, grade 2 moteur : réduction à 1,2 mg/kg ; grade 3 moteur ou grade 4 : arrêt selon FI. Consulter la table complète pour autres situations.</td></tr><tr><td>Adcetris, LEMP</td><td>Trouble neurologique nouveau ou aggravé.</td><td>Suspendre si suspicion ; évaluation neurologique, imagerie et recherche JC selon situation. Un test négatif n’exclut pas toujours ; arrêt définitif si confirmation.</td></tr><tr><td>Oncaspar</td><td>Symptômes pancréatiques, glycémie, coagulation (TP/TCA, fibrinogène, antithrombine), foie, réaction allergique.</td><td>Pancréatite suspectée : interrompre ; confirmée : arrêter. Bilan hépatique avant cycle puis au moins hebdomadaire jusqu’à quatre semaines après dernière dose selon FI.</td></tr><tr><td>Oncaspar, activité</td><td>Activité enzymatique et suspicion d’inactivation selon protocole.</td><td>Une dose administrée ne garantit pas une activité efficace. Anticorps/inactivation peuvent conduire à une autre préparation.</td></tr><tr><td>Anthracycline / traitement intensif</td><td>Fonction cardiaque préalable et surveillance liée au protocole, hémogramme et fonctions d’organes.</td><td>Adapter la stratégie à l’aptitude ; le cours ne fournit pas un protocole complet de soins de support de chaque combinaison.</td></tr></tbody></table><p>Les seuils de la FI sont des seuils d’action dans un contexte précis. Une dégradation clinique peut exiger une réponse avant un seuil isolé. La fuite capillaire peut être fatale : les 18 % de la population mixte et les 21 % du sous-groupe BPDCN ne sont pas présentés comme une fréquence universelle. Les données limitées en insuffisance rénale ou hépatique ne signifient pas que toute dose est sûre.</p><div class="key"><b>À retenir.</b> Surveiller signifie prévoir qui mesure, quand, et quelle décision suit une anomalie. Le patient reçoit les signes à signaler et un contact adapté au parcours.</div> <button class="w" data-k="c86-mnemo">Aide mnémotechnique des sous-codes</button><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669340018" target="_blank" rel="noopener">[S222] FI suisse Oncaspar, septembre 2025, AIPS via AmiKo</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a>.</p></section>
<section class="ilot" id="c86-p-4"><h2><span class="n">p-4</span>Monographies et décisions spécialisées</h2><p>Chaque fenêtre distingue mécanisme, preuve, indication, dose, toxicités et limites. Les doses des combinaisons complètes, les soins de support et toutes les situations particulières ne sont pas inventés lorsqu’ils ne figurent pas dans les passages consultés.</p><table class="t"><thead><tr><th>Fenêtre</th><th>Contenu principal</th></tr></thead><tbody><tr><td><button class="w" data-k="c86-bv">Brentuximab védotine — Adcetris</button></td><td>CD30/MMAE, FI suisse, distinction mono/CHP, neurotoxicité et LEMP.</td></tr><tr><td><button class="w" data-k="c86-tagra">Tagraxofusp — Elzonris</button></td><td>CD123, première ligne BPDCN adulte, fuite capillaire, dose et suspension.</td></tr><tr><td><button class="w" data-k="c86-asp">Asparaginase — Oncaspar et schémas ENKTL</button></td><td>Déplétion en asparagine, indication LLA, hors indication ENKTL, activité et toxicités.</td></tr><tr><td><button class="w" data-k="c86-chop">CHOP, CHOEP et BV-CHP</button></td><td>Composition, place, résultats par sous-type et limites des comparaisons.</td></tr><tr><td><button class="w" data-k="c86-ice">ICE et HSTL</button></td><td>Induction, données non randomisées et consolidation.</td></tr><tr><td><button class="w" data-k="c86-greffe">Autogreffe et allogreffe</button></td><td>Origine des cellules, moment, bénéfice/risque et sélection.</td></tr><tr><td><button class="w" data-k="c86-rechute">Rechute</button></td><td>Rebiopsie, essais et options selon entité.</td></tr><tr><td><button class="w" data-k="c86-lyp-trt">LyP et pcALCL</button></td><td>Observation, traitement local, méthotrexate et contrôle des lésions.</td></tr><tr><td><button class="w" data-k="c86-rt">Radiothérapie</button></td><td>Contrôle local, dose et exceptions à une approche combinée.</td></tr></tbody></table><button class="pareto-btn ui" data-k="pareto-c86-pharma">▲ Loi de Pareto — Pharmacologie</button><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669340018" target="_blank" rel="noopener">[S222] FI suisse Oncaspar, septembre 2025, AIPS via AmiKo</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a>.</p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="c86-famille" data-title="C86 : sept sous-codes, plusieurs lignées et plusieurs parcours"><div class="lab">Définition</div><p>C86 est une rubrique de codage des « autres lymphomes à cellules T/NK spécifiés ». Ses sept sous-codes ne correspondent pas exactement à sept maladies : C86.6 inclut notamment la papulose lymphomatoïde et le lymphome anaplasique cutané primitif. C86.4 conserve un ancien intitulé NK mais inclut la néoplasie blastique à cellules dendritiques plasmacytoïdes (BPDCN), de lignée dendritique. Ce regroupement administratif ne détermine ni un traitement commun ni une biologie uniforme.</p><div class="lab">Évolution et intention</div><p>ENKTL, HSTL, EATL et lymphomes TFH nodaux nécessitent habituellement une prise en charge spécialisée rapide, souvent à intention curative. Le BPDCN suit son propre parcours. À l’autre extrême, chaque lésion de papulose lymphomatoïde peut régresser spontanément ; une surveillance ou un traitement destiné à contrôler les lésions est alors adapté. Un SPTCL sans syndrome d’activation lymphohistiocytaire peut relever d’une immunosuppression plutôt que d’une polychimiothérapie.</p><div class="lab">Trois frontières à mémoriser</div><p>Le lymphome anaplasique systémique ALK positif ou négatif appartient à C84.6/C84.7. Le lymphome T gamma-delta cutané n’est pas le SPTCL alpha-bêta de C86.3. La leucémie NK agressive constitue une entité distincte de l’ENKTL, même si certaines revues cliniques les discutent ensemble. Le pathologiste établit l’entité ; le code ne remplace pas cette expertise.</p><div class="lab">Chiffres et limites</div><p>La survie spécifique à cinq ans de 99 % pour la papulose lymphomatoïde et celle de 16 % pour l’ENKTL des registres cutanés néerlandais/autrichien ne forment pas un pronostic universel applicable à tout C86. L’âge, le site, le stade, les traitements et le type de mesure diffèrent. Aucun chiffre suisse contemporain par sous-code n’est affirmé ici.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">[S210] BfArM, CIM-10-GM 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S203] Khoury et al., OMS myéloïde/dendritique 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">[S206] OMS–EORTC 2018, publié 2019</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a>.</p></template>
<template data-pop="c86-classif" data-title="Codage historique et classification biologique actuelle"><div class="lab">Deux niveaux</div><p>La table CIM-10-GM 2024 est le référentiel de correspondance documenté dans ce dossier ; elle n’est pas présentée comme une certification de toute règle suisse de facturation en 2026. L’OMS 2022 décrit les lignées et entités actuelles. Onkopedia confronte aussi l’ICC 2022 ; l’article ICC original n’a pas été relu intégralement ici.</p><table class="t"><thead><tr><th>Sous-code</th><th>Correspondance et frontière</th></tr></thead><tbody><tr><td>C86.0</td><td>ENKTL. L’OMS 2022 supprime « type nasal » du nom biologique, car des sites extranodaux autres que le nez existent.</td></tr><tr><td>C86.1</td><td>HSTL, de phénotype TCR gamma-delta ou alpha-bêta ; une minorité peut être silencieuse pour le TCR. Ne pas additionner des pourcentages approximatifs issus de séries différentes.</td></tr><tr><td>C86.2</td><td>EATL associé à une entéropathie. MEITL est une entité biologique séparée ; ne pas le renommer « EATL type II » dans la nomenclature actuelle.</td></tr><tr><td>C86.3</td><td>SPTCL, de lignée T alpha-bêta. Le lymphome T gamma-delta cutané constitue un autre diagnostic.</td></tr><tr><td>C86.4</td><td>Ancien intitulé « lymphome blastique NK », incluant BPDCN. L’OMS 2022 le place parmi les néoplasies dendritiques/histiocytaires.</td></tr><tr><td>C86.5</td><td>Lymphome TFH nodal de type angio-immunoblastique (nTFHL-AI), ancien AITL. Les types folliculaire et sans autre spécification sont distincts.</td></tr><tr><td>C86.6</td><td>Proliférations cutanées primitives CD30 positives : LyP et pcALCL notamment. Le bilan initial distingue atteinte primitive cutanée et localisation secondaire d’un lymphome systémique.</td></tr></tbody></table><div class="lab">Piège de mise à jour</div><p>Une publication récente peut conserver un vocabulaire ancien : le chapitre intestinal ESsCD publié en 2026 réutilise « EATL type II ». La classification OMS séparant EATL et MEITL est conservée ici. Une discordance de vocabulaire se résout par le domaine de compétence de chaque source, pas par sa date seule.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">[S210] BfArM, CIM-10-GM 2024</a> ; <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S203] Khoury et al., OMS myéloïde/dendritique 2022</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">[S208] Onkopedia, octobre 2025, DGHO/OeGHO/SSH/SGMO</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a>.</p></template>
