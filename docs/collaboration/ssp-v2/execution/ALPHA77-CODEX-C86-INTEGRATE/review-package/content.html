<template data-pop="c86-enktl" data-title="ENKTL : tissu, EBV, extension et stratégie adaptée"><div class="lab">Présentation</div><p>L’ENKTL est une néoplasie extranodale associée à l’EBV, souvent de lignée NK, parfois T cytotoxique. Il prédomine en Asie et dans certaines populations d’Amérique centrale ou du Sud, mais existe en Europe. La revue Tse 2022 décrit environ 80 % de présentations nasales et 15–20 % non nasales dans son panorama clinique ; ces chiffres ne sont pas des incidences suisses. Une obstruction nasale unilatérale, des épistaxis ou une ulcération palatine nécrotique imposent une exploration ; une extension laryngée peut menacer immédiatement les voies aériennes.</p><div class="lab">Diagnostic</div><p>Une biopsie représentative, comprenant du tissu viable en bordure des zones nécrotiques, est confrontée à la morphologie, aux marqueurs cytotoxiques et à EBER dans les cellules tumorales. La forme NK typique exprime CD3ε cytoplasmique, pas le CD3 membranaire, et garde le TCR en configuration germinale. Les formes de lignée T peuvent avoir un TCR réarrangé : ce profil NK n’est donc pas obligatoire dans tous les ENKTL. EBER positif avec CD56 ou des molécules cytotoxiques soutient ce diagnostic dans le contexte adapté ; cela ne suffit pas, seul, à exclure toutes les autres néoplasies EBV positives.</p><div class="lab">Bilan et marqueur</div><p>TEP-TDM, examen médullaire et IRM des territoires ORL concernés définissent l’extension ; les signes neurologiques orientent l’exploration du SNC. L’ADN d’EBV plasmatique suit la charge tumorale et la réponse, en complément de l’imagerie. Il ne remplace ni la biopsie ni EBER. L’objectif est une réponse métabolique complète et un ADN d’EBV indétectable selon la méthode du laboratoire.</p><div class="lab">Traitement</div><p>Chez le patient apte atteint d’une forme localisée, ESMO–EHA 2025 recommande une radiothérapie des sites impliqués d’au moins 50 Gy associée à une chimiothérapie sans anthracycline contenant de la L-asparaginase. Pour une maladie nasale de stade III–IV ou une forme extranasale, le schéma systémique et l’éventuelle greffe sont discutés en centre expert. Une radiothérapie seule reste envisageable dans certains stades I non volumineux ou si la fragilité interdit la chimiothérapie. Une atteinte ORL menaçante impose d’abord la sécurisation des fonctions vitales.</p><div class="lab">Limites</div><p>La résistance à CHOP et la sensibilité à l’asparaginase orientent le choix collectif du traitement ; elles ne prédisent pas une réponse individuelle. Les comparaisons DDGP/SMILE sont discutées entre sources et ne démontrent pas une supériorité universelle. Oncaspar est autorisé en Suisse pour la LLA ; son emploi dans l’ENKTL est hors indication autorisée.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669340018" target="_blank" rel="noopener">[S222] FI suisse Oncaspar, septembre 2025, AIPS via AmiKo</a>.</p></template>
<template data-pop="c86-hstl" data-title="HSTL : le lymphome sans masse ganglionnaire évidente"><div class="lab">Définition et mécanisme</div><p>Le lymphome T hépatosplénique est une néoplasie T rare, souvent gamma-delta, caractérisée par une infiltration des sinusoïdes médullaires, spléniques et hépatiques. Des formes alpha-bêta et silencieuses pour le TCR existent. La distribution tissulaire explique l’hépatosplénomégalie et les cytopénies avec peu ou pas d’adénopathies ; une absence de ganglion palpable ne l’exclut donc pas.</p><div class="lab">Contexte</div><p>La majorité des cas n’est pas réductible à une exposition médicamenteuse unique. Une immunosuppression prolongée, notamment au cours d’une maladie inflammatoire de l’intestin, est un contexte d’alerte. Chez l’homme jeune sous thiopurine, avec ou sans anti-TNF, fièvre, amaigrissement, splénomégalie et cytopénies justifient une évaluation rapide. Cette association ne permet pas d’attribuer toute fièvre au lymphome : infection, poussée inflammatoire et toxicité médullaire restent à discuter.</p><div class="lab">Ce que montrent les petits dénominateurs</div><p>Carvão 2019 réunit 19 cas de Crohn sous thiopurine seule, dont le cas rapporté. Les signes cliniques sont disponibles pour 11 : tous ont une splénomégalie, sept une hépatomégalie, huit des symptômes généraux. L’hémogramme n’est décrit que chez sept : tous ont une thrombopénie, six une anémie et cinq une leucopénie. Ces proportions sélectionnées ne sont ni une sensibilité diagnostique ni une fréquence dans tous les HSTL.</p><div class="lab">Confirmation et traitement</div><p>La biopsie médullaire et l’immunophénotype sont centraux. ESMO–EHA 2025 privilégie chez les patients aptes des schémas plus intensifs que CHOP, notamment ICE (ifosfamide, carboplatine, étoposide), puis une greffe de consolidation chez les répondeurs, de préférence allogénique. Le donneur est recherché précocement lorsque cette stratégie est envisageable. La TEP seule peut manquer une infiltration diffuse : la réponse doit être confrontée à la moelle et, si possible et indiqué, au foie.</p><div class="lab">Preuve et limite</div><p>La comparaison citée dans la recommandation provient d’une synthèse de 166 patients, avec 50 sous CHOP/équivalent et 34 sous schémas non-CHOP dans la comparaison rapportée : réponses 52 % contre 82 %, survies médianes 18 contre 37 mois. L’absence de randomisation, la sélection des patients et les traitements différents empêchent d’en faire un effet causal individuel garanti.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6624667/" target="_blank" rel="noopener">[S211] Carvão et al., revue de cas Crohn/HSTL, 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">[S208] Onkopedia, octobre 2025, DGHO/OeGHO/SSH/SGMO</a>.</p></template>
<template data-pop="c86-eatl" data-title="EATL : entéropathie, signaux d’alarme et risque intestinal"><div class="lab">Définition</div><p>L’EATL est un lymphome T intestinal associé à la maladie cœliaque. La forme réfractaire de type II constitue un état à haut risque, sans que toute maladie cœliaque ou tout clone intraépithélial évolue vers un lymphome. Le MEITL est une entité distincte, généralement sans association à la maladie cœliaque. Le code, l’histologie actuelle et le contexte digestif doivent être confrontés.</p><div class="lab">Clinique</div><p>Des douleurs abdominales persistantes, une perte de poids inexpliquée, une fièvre, une dénutrition ou une obstruction constituent des signaux d’alarme. L’EATL peut se révéler par une perforation, une hémorragie ou une occlusion ; une dégradation aiguë relève d’une évaluation hospitalière immédiate. La dénutrition et l’hypoalbuminémie augmentent aussi les difficultés et toxicités du traitement. Aucun de ces signes n’est spécifique du lymphome.</p><div class="lab">Démarche</div><p>Le gastroentérologue vérifie le diagnostic initial de maladie cœliaque, l’observance du régime et les diagnostics alternatifs ; il organise biopsies, immunophénotypage des lymphocytes intraépithéliaux, analyse de clonalité, imagerie en coupe et entéroscopie selon la situation. La vidéocapsule peut guider l’exploration de la muqueuse, mais ne fournit pas d’histologie et n’est pas un examen à imposer sans appréciation des sténoses et du risque de rétention. Le parcours est coordonné avec l’hématopathologie et l’hématologie.</p><div class="lab">Traitement</div><p>ESMO–EHA 2025 propose, chez certains patients aptes et éligibles à l’autogreffe, un cycle de CHOP ou CHOEP puis trois cycles d’IVE (ifosfamide, étoposide, épirubicine) alternés avec du méthotrexate à dose intermédiaire, puis une consolidation chez les répondeurs. D’autres schémas sont possibles selon l’aptitude ; BV-CHP ne doit pas être assimilé automatiquement à une autorisation européenne ou à une prise en charge suisse. La chirurgie répond aux complications ou à une discussion spécialisée de réduction du risque intestinal ; elle ne remplace pas la prise en charge systémique.</p><div class="lab">Pronostic</div><p>Les 60 % de survie à cinq ans rapportés avec le programme intensif concernent une série sélectionnée de 26 patients et une comparaison historique. Ils ne s’appliquent pas à tous les malades dénutris ou fragiles. L’autogreffe utilise les propres cellules du patient : elle n’exige pas de donneur.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://www.thieme-connect.com/products/ejournals/html/10.1055/a-1973-3796" target="_blank" rel="noopener">[S231] ESGE, vidéocapsule, mise à jour 2022</a>.</p></template>
<template data-pop="c86-sptcl" data-title="SPTCL : hypoderme, inflammation et traitement proportionné"><div class="lab">Définition et diagnostic</div><p>Le SPTCL correspond au lymphome T alpha-bêta sous-cutané de type panniculite. Les nodules ou plaques profonds traduisent l’atteinte de l’hypoderme. L’histologie recherche un infiltrat lymphocytaire atypique autour des adipocytes ; les cellules peuvent exprimer CD3, CD8, TIA1 et le marqueur de TCR alpha-bêta βF1. La biopsie doit donc contenir un hypoderme représentatif. L’architecture, la cytologie et le panel sont interprétés ensemble.</p><div class="lab">Différentiels</div><p>Le lymphome T gamma-delta cutané primitif est une autre maladie, souvent plus agressive ; l’atteinte dermique/épidermique et l’ulcération peuvent orienter mais ne remplacent pas le phénotypage. La panniculite lupique est un autre diagnostic différentiel documenté par la recommandation S2k lupus 2021. Une biopsie et la confrontation clinico-pathologique sont nécessaires ; l’absence d’autoanticorps ne suffit pas à exclure un lupus cutané.</p><div class="lab">Urgence inflammatoire</div><p>Fièvre persistante, cytopénies, splénomégalie, ferritine croissante, atteinte hépatique ou troubles de coagulation font rechercher un HLH. L’étude historique EORTC citée dans ESMO 2018 rapportait des survies globales à cinq ans de 91 % sans syndrome hémophagocytaire et 46 % avec : comparaison de groupes, pas démonstration que le syndrome « divise par deux » le pronostic de chaque personne.</p><div class="lab">Traitement</div><p>Sans HLH, ESMO 2018 propose d’abord corticoïdes systémiques ou autres immunosuppresseurs tels que ciclosporine ou méthotrexate ; S2k 2021/2022 précise une prednisolone seule, avec association possible selon le besoin. Une radiothérapie peut être discutée pour une lésion solitaire. Une progression malgré l’immunosuppression ou un HLH exige une réévaluation spécialisée urgente ; la décision d’immunomodulation, de chimiothérapie et de traitement du déclencheur dépend de la gravité, et pas seulement du résultat HAVCR2.</p><div class="lab">Limite pharmacologique</div><p>Ces recommandations de stratégie ne constituent pas une posologie suisse universelle du SPTCL. Le protocole, les infections, la fonction rénale/hépatique et les interactions doivent être examinés avant une prescription immunosuppressive.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1111/ddg.14706" target="_blank" rel="noopener">[S218] S2k lymphomes cutanés 2021, publié 2022</a> ; <a href="https://onlinelibrary.wiley.com/doi/full/10.1111/ddg.14492" target="_blank" rel="noopener">[S219] S2k lupus cutané 2021</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">[S212] Moonla et al., Haematologica 2023</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a>.</p></template>
<template data-pop="c86-bpdcn" data-title="BPDCN : une néoplasie dendritique dans une ancienne rubrique NK"><div class="lab">Lignée et clinique</div><p>Le BPDCN dérive de cellules dendritiques plasmacytoïdes et appartient aux néoplasies dendritiques/histiocytaires dans l’OMS 2022. Il touche surtout l’adulte âgé avec prédominance masculine, mais des formes pédiatriques existent. Plaques ou nodules violacés, lésions d’allure ecchymotique, cytopénies, atteinte médullaire et ganglionnaire peuvent s’associer. Une présentation sans lésion cutanée est possible.</p><div class="lab">Critères immunophénotypiques OMS 2022</div><p>Deux voies sont décrites : <b>CD123 et au moins un autre marqueur pDC</b> parmi TCF4, TCL1, CD303 et CD304, avec CD4 et/ou CD56 ; <b>ou au moins trois marqueurs pDC</b> avec absence des marqueurs négatifs attendus (CD3, CD14, CD19, CD34, lysozyme et myéloperoxydase). Il ne s’agit donc pas d’exiger simultanément CD4, CD56 et TCL1 dans tout cas. La morphologie et les diagnostics différentiels, notamment leucémie myéloïde/sarcome myéloïde et lymphomes T/NK, restent essentiels.</p><div class="lab">Bilan du SNC</div><p>Le consensus international 2023 recommande fortement une ponction lombaire diagnostique au diagnostic et une analyse sensible du liquide céphalorachidien, avec plan de prophylaxie intrathécale pendant l’induction en centre expert. Sa réalisation dépend de la stabilité clinique, des contre-indications et de l’hémostase. L’absence de signe neurologique n’exclut pas une atteinte occulte. Le tagraxofusp ne dispense pas de ce bilan : son passage de la barrière hémato-encéphalique est inconnu dans la FI suisse.</p><div class="lab">Traitement et limites</div><p>Elzonris est autorisé en Suisse en première ligne chez l’adulte. Chez les patients aptes, une allogreffe est envisagée idéalement en première rémission complète ; l’âge, les comorbidités, la réponse et le donneur déterminent l’éligibilité. L’autogreffe est une possibilité sélectionnée lorsque le risque d’allogreffe est trop élevé ou qu’un donneur adapté manque, sur preuves limitées ; elle n’est pas un substitut automatique. Le consensus 2023 souligne l’absence de comparaison randomisée directe entre stratégies ciblées et chimiothérapie.</p><div class="lab">Enfant</div><p>La prise en charge pédiatrique est distincte ; la FI suisse d’Elzonris ne fournit pas d’autorisation ni de recommandation posologique pédiatrique. L’autorisation américaine mentionnée dans certaines publications ne doit pas être transposée à la Suisse.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S203] Khoury et al., OMS myéloïde/dendritique 2022</a> ; <a href="https://journals.lww.com/hemasphere/fulltext/2023/03000/unmet_clinical_needs_and_management.2.aspx" target="_blank" rel="noopener">[S217] Pagano et al., consensus international BPDCN 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a>.</p></template>
<template data-pop="c86-ntfh" data-title="nTFHL-AI : architecture ganglionnaire et désordre immunitaire"><div class="lab">Identifier le type</div><p>Le lymphome TFH nodal de type angio-immunoblastique est l’ancien AITL. Le phénotype TFH associe CD4 à au moins deux marqueurs parmi PD1, ICOS, CXCL13, CD10 et BCL6 ; leur intensité, leur distribution et leur spécificité comptent. Deux marqueurs ne suffisent pas à définir à eux seuls le type angio-immunoblastique. L’architecture ganglionnaire, l’infiltrat polymorphe et les veinules à endothélium haut arborisées contribuent à la classification.</p><div class="lab">Pourquoi plusieurs lignées peuvent être perturbées</div><p>Les mutations TET2/DNMT3A peuvent apparaître dans une cellule souche hématopoïétique, avant les anomalies RHOA/IDH2 observées dans la population TFH tumorale. Une anomalie épigénétique détectée dans le sang n’est donc pas nécessairement une preuve de lymphome TFH. L’hypergammaglobulinémie polyclonale, une hémolyse auto-immune ou des cellules B EBV positives peuvent accompagner la dérégulation du microenvironnement ; EBER doit être localisé à la bonne population.</p><div class="lab">Prise en charge</div><p>CHOP ou CHOEP est proposé par ESMO–EHA 2025. Une forme limitée, non volumineuse et de profil favorable peut recevoir un programme abrégé de trois à quatre cycles ; une radiothérapie de consolidation et une autogreffe sont discutées selon la réponse et le risque. Le fait d’exprimer CD30 ne démontre pas à lui seul un bénéfice de BV-CHP dans cette entité : le bénéfice global d’ECHELON-2 était surtout porté par les lymphomes anaplasiques systémiques.</p><div class="lab">Rechute</div><p>Une nouvelle biopsie peut révéler un autre processus, y compris une prolifération B ou myéloïde. Un essai clinique et l’allogreffe chez un patient apte et chimiosensible sont discutés. L’azacitidine orale a une activité étudiée, mais l’essai de phase III cité par ESMO 2025 n’a pas atteint son critère principal de supériorité en survie sans progression. Son emploi n’est pas une conséquence automatique d’une mutation TET2.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">[S208] Onkopedia, octobre 2025, DGHO/OeGHO/SSH/SGMO</a>.</p></template>
<template data-pop="c86-cd30" data-title="C86.6 : LyP et pcALCL, même marqueur mais évolution différente"><div class="lab">Clinique discriminante</div><p>La papulose lymphomatoïde donne des poussées de papules ou nodules parfois nécrotiques dont chaque lésion régresse spontanément en semaines à mois. Le pcALCL se présente plutôt comme une tumeur ou un nodule solitaire, groupé ou plus rarement multifocal. Une biopsie CD30 positive peut se ressembler dans ces deux situations : la chronologie documentée, les photographies cliniques et l’examen de toute la peau apportent une information indispensable.</p><div class="lab">Critères et bilan</div><p>Dans le contexte adapté, le pcALCL montre CD30 sur au moins 75 % des cellules tumorales. Il faut exclure une LyP, un mycosis fongoïde transformé et un lymphome systémique avec atteinte secondaire de la peau. ALK positif impose une recherche soigneuse d’atteinte systémique ; de rares cas primitifs cutanés ALK positifs ont cependant été décrits, empêchant une règle absolue fondée sur ce seul marqueur.</p><div class="lab">Pronostic et dénominateurs</div><p>Dans les registres cutanés néerlandais et autrichien 2002–2017, LyP et pcALCL représentent respectivement 12 % et 8 % de tous les lymphomes cutanés, avec survies spécifiques à cinq ans de 99 % et 95 %. L’ensemble des proliférations CD30 positives représente environ 25 % des <em>lymphomes T cutanés</em> : le dénominateur diffère. Les rechutes cutanées sont fréquentes dans le pcALCL, alors que la dissémination extracutanée concerne une minorité.</p><div class="lab">Conduite</div><p>La LyP peut être surveillée ou traitée pour contrôler les poussées ; aucune prévention certaine d’un second lymphome par le traitement n’est démontrée. Pour une lésion de pcALCL solitaire ou groupée, excision ou radiothérapie sont privilégiées. Une maladie multifocale, réfractaire ou extracutanée fait discuter un traitement systémique adapté. Le suivi de la LyP reste prolongé, même lorsque les lésions disparaissent.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">[S206] OMS–EORTC 2018, publié 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a>.</p></template>
<template data-pop="c86-ebv" data-title="EBER tissulaire et ADN d’EBV plasmatique : deux questions"><div class="lab">Tissu</div><p>EBER est recherché par hybridation in situ dans le prélèvement. Il faut déterminer quelles cellules portent le virus : des cellules B réactives ou associées à un lymphome TFH peuvent être EBV positives sans définir un ENKTL. La sérologie EBV témoigne d’une exposition immunologique, pas de la nature de la tumeur.</p><div class="lab">Plasma</div><p>Des fragments d’ADN viral sont libérés dans la circulation lors de la mort des cellules tumorales. Le dosage plasmatique est ainsi un marqueur de charge tumorale et de réponse. Tse 2022 privilégie le plasma, car les lymphocytes B mémoires EBV infectés présents dans le sang total peuvent ajouter un signal qui n’est pas celui du lymphome. ESMO–EHA 2025 recommande une PCR quantitative au diagnostic et pendant le traitement.</p><div class="lab">Interprétation</div><p>Une valeur détectable n’est pas un diagnostic autonome, et une valeur indétectable dépend de la limite analytique du laboratoire. Le suivi emploie autant que possible la même matrice et la même méthode, en conservant unités et limite de détection dans le compte rendu. La cinétique est confrontée à la clinique et à la TEP ; un nombre de copies isolé ne déclenche pas automatiquement un changement de traitement.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a>.</p></template>
<template data-pop="c86-pgp" data-title="Deux propriétés biologiques qui orientent le traitement de l’ENKTL"><div class="lab">Résistance</div><p>Le phénotype de multirésistance, notamment l’expression de la glycoprotéine P, contribue aux mauvais résultats des schémas à anthracycline de type CHOP. Les recommandations choisissent donc des programmes sans anthracycline pour l’ENKTL. Cette décision repose sur les données cliniques et la biologie, pas sur un test isolé de P-gp réalisé chez chaque patient.</p><div class="lab">Dépendance métabolique</div><p>L’activité souvent faible de l’asparagine synthétase limite la capacité des cellules à compenser une déplétion en asparagine extracellulaire. L’asparaginase hydrolyse cette asparagine et prive les cellules sensibles d’un substrat pour la synthèse protéique. La pégylation prolonge l’exposition à l’enzyme ; elle ne transforme pas les unités d’une préparation en équivalents interchangeables de celles d’une autre.</p><div class="lab">Conséquence clinique</div><p>Une chimiothérapie contenant de la L-asparaginase est associée à la radiothérapie dans les formes localisées aptes et constitue la base de nombreux programmes avancés. Les allergies ou anticorps inactivants peuvent réduire l’activité enzymatique malgré une dose administrée ; la FI Oncaspar envisage le suivi d’activité et une autre préparation. La toxicité pancréatique, hépatique et de coagulation impose une surveillance parallèle.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669340018" target="_blank" rel="noopener">[S222] FI suisse Oncaspar, septembre 2025, AIPS via AmiKo</a>.</p></template>
<template data-pop="c86-havcr2" data-title="HAVCR2/TIM-3 : prédisposition, mécanisme et limites statistiques"><div class="lab">Normal et anomalie</div><p>TIM-3 est un régulateur de réponses immunitaires exprimé sur plusieurs populations T et innées. Les variants germinaux HAVCR2 décrits par Gayden 2018 entraînent un mauvais repliement et une perte d’expression membranaire, avec activation immunitaire persistante et augmentation de cytokines inflammatoires. Le résumé de cette étude rapporte environ 60 % de cas porteurs dans sa série ; ce n’est pas une prévalence suisse universelle. Moonla 2023 évoque une plage de 25–60 % selon les études.</p><div class="lab">Population et association</div><p>Moonla inclut une cohorte de 34 patients dans neuf centres thaïlandais, dont 28 SPTCL et six HLH sans panniculite ; l’analyse individuelle agrégée porte sur 127 patients issus de quatre cohortes. Les odds ratios ajustés d’association au HLH/état apparenté sont 2,93 pour le sexe masculin, 4,77 pour l’hétérozygotie et 8,48 pour l’homozygotie ou hétérozygotie composite, avec des intervalles de confiance parfois larges. Ce sont des associations observées, ni des risques absolus ni une prédiction certaine pour un porteur.</p><div class="lab">Décision</div><p>L’âge jeune et le génotype orientent la vigilance et une discussion génétique spécialisée. Le HLH doit être reconnu et traité sur son tableau clinique, sans attendre HAVCR2. Les observations d’amélioration sous immunomodulation ne constituent pas un essai comparatif prouvant un même schéma pour tous les génotypes. Un variant trouvé dans un contexte tumoral ne doit pas être qualifié de germinal sans démarche génétique appropriée.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://www.nature.com/articles/s41588-018-0251-4" target="_blank" rel="noopener">[S213] Gayden et al., Nature Genetics 2018, résumé lu</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">[S212] Moonla et al., Haematologica 2023</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a>.</p></template>
<template data-pop="c86-slh" data-title="HLH : reconnaître l’hyperinflammation et agir en parallèle"><div class="lab">Reconnaître</div><p>Le syndrome d’activation lymphohistiocytaire, ou HLH, associe une activation immunitaire excessive et une atteinte d’organes. Fièvre persistante, splénomégalie, cytopénies, ferritine croissante, anomalies hépatiques et coagulation perturbée doivent alerter. Un sepsis, une infection, une maladie inflammatoire et un lymphome peuvent se recouvrir ou coexister. Une ferritine élevée seule n’est pas diagnostique.</p><div class="lab">HLH-2004 : cinq critères sur huit, ou diagnostic moléculaire compatible</div><table class="t"><thead><tr><th>Critère</th><th>Seuil ou observation dans la table de La Rosée 2019</th></tr></thead><tbody><tr><td>1. Fièvre</td><td>Critère clinique ; le seuil thermique n’est pas chiffré dans cette table.</td></tr><tr><td>2. Splénomégalie</td><td>Clinique ou documentée par imagerie.</td></tr><tr><td>3. Cytopénies</td><td>Au moins deux lignées : Hb <90 g/L ; plaquettes <100 × 10⁹/L ; neutrophiles <1,0 × 10⁹/L. Le seuil d’Hb du nourrisson <4 semaines est distinct.</td></tr><tr><td>4. Triglycérides et/ou fibrinogène</td><td>Triglycérides à jeun ≥3,0 mmol/L et/ou fibrinogène ≤1,5 g/L.</td></tr><tr><td>5. Hémophagocytose</td><td>Moelle, rate ou ganglions ; elle n’est ni constamment visible ni spécifique à elle seule.</td></tr><tr><td>6. Activité NK</td><td>Faible ou absente selon la référence du laboratoire.</td></tr><tr><td>7. Ferritine</td><td>≥500 µg/L, seuil peu spécifique chez l’adulte.</td></tr><tr><td>8. sCD25</td><td>Récepteur soluble de l’IL-2 ≥2 400 U/mL selon la méthode concernée.</td></tr></tbody></table><div class="lab">Limites</div><p>Ces critères ont été développés dans des essais pédiatriques ; l’adulte exige une interprétation clinique. La formulation historique de la table concernant l’hémophagocytose ne doit pas être lue comme une exclusion de toute malignité : le HLH associé au lymphome est précisément un contexte majeur des recommandations adultes. L’absence d’hémophagocytose ou de cinq critères au début ne permet pas de rassurer un patient qui se dégrade. Le HScore peut compléter l’évaluation dans son contexte, sans remplacer le jugement clinique.</p><div class="lab">Conduite urgente</div><p>EULAR/ACR recommande d’évaluer simultanément les fonctions vitales, les déclencheurs infectieux ou malins, la nécessité de soins intensifs et l’immunomodulation. Chez un patient à haut risque ou en aggravation, celle-ci peut être envisagée pendant le bilan, en concertation spécialisée. Corticoïdes, anakinra ou immunoglobulines sont des options contextuelles citées ; les protocoles contenant de l’étoposide et le traitement du lymphome relèvent du contexte étiologique. Aucun schéma pédiatrique complet n’est transposé automatiquement à l’adulte dans ce cours.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://ashpublications.org/blood/article/133/23/2465/273833/Recommendations-for-the-management-of" target="_blank" rel="noopener">[S215] La Rosée et al., HLH adulte, 2019</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a>.</p></template>
<template data-pop="c86-rcd" data-title="Maladie cœliaque réfractaire de type II : critères et surveillance"><div class="lab">Définition actuelle lue</div><p>ESsCD 2025, partie 2 publiée en 2026, définit la forme réfractaire par des symptômes persistants ou récidivants et une atrophie villositaire après <b>au moins 12 mois</b> de régime strict sans gluten, après exclusion des autres causes. Le diagnostic initial, l’exposition persistante au gluten, une réponse lente et d’autres maladies digestives doivent être réexaminés.</p><div class="lab">Type II</div><p>Les lymphocytes intraépithéliaux aberrants perdent CD3 de surface et CD8 tout en gardant CD3 cytoplasmique. La cytométrie retrouve typiquement <b>au moins 20 %</b> de cellules aberrantes ; l’étude du réarrangement TCR apporte une preuve de clonalité. Ce pourcentage est lié à une technique et ne doit pas être transposé tel quel à toute immunohistochimie. Un clone aberrant sans symptômes, anomalies biologiques ou lésions significatives requiert une interprétation prudente et peut justifier une surveillance plutôt qu’un traitement agressif immédiat.</p><div class="lab">Bilan et risque</div><p>Biopsies duodénales bien conditionnées, immunophénotypage, clonalité, imagerie, entéroscopie et parfois vidéocapsule participent au bilan spécialisé. L’EATL doit être recherché avant de conclure à une forme réfractaire. La jéjunite ulcéreuse est une complication associée, pas une définition autonome de RCD-II. Le risque de transformation est élevé dans cette population sélectionnée : la source décrit un EATL chez jusqu’à la moitié des patients, sans appliquer ce chiffre à toute maladie cœliaque.</p><div class="lab">Suivi</div><p>La dénutrition, les douleurs, la perte de poids, la fièvre ou l’obstruction déclenchent une réévaluation. ESMO–EHA 2025 propose de considérer des contrôles tous les 6–12 mois en RCD-II, avec imagerie du grêle notamment devant de nouveaux signes préoccupants ; le rythme et la modalité sont individualisés par l’équipe experte. Une suspicion de complication aiguë ne doit pas attendre ce rendez-vous programmé.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a>.</p></template>
<template data-pop="c86-tfh" data-title="Du lymphocyte TFH normal à la prolifération tumorale"><div class="lab">Fonction et phénotype</div><p>Les lymphocytes T folliculaires auxiliaires participent à la réponse des cellules B dans les structures lymphoïdes. PD1, ICOS, CXCL13, CD10 et BCL6 servent de marqueurs de cette différenciation ; leur expression peut aussi exister dans des cellules normales ou réactives. Pour un lymphome nodal, l’OMS demande CD4 et au moins deux marqueurs TFH, en confrontation avec l’architecture et la clinique.</p><div class="lab">Étapes moléculaires</div><p>Le modèle de l’OMS place TET2 et DNMT3A précocement dans l’hématopoïèse clonale, puis des anomalies RHOA et IDH2 dans la population TFH néoplasique. C’est une explication biologique de données collectives, pas une chronologie séquencée chez chaque patient. Une mutation TET2 dans le sang peut concerner d’autres lignées et ne suffit pas à diagnostiquer nTFHL-AI.</p><div class="lab">Clinique et limite</div><p>Le microenvironnement perturbé peut s’accompagner d’hypergammaglobulinémie polyclonale, d’hémolyse auto-immune et de proliférations B EBV positives. La preuve d’une hémolyse demande une baisse d’Hb et un faisceau biologique compatible, pas un Coombs positif isolé. Le choix d’un traitement épigénétique n’est pas dicté par une mutation unique.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S223] HUG, enseignement hémogramme adulte, septembre 2019</a>.</p></template>
<template data-pop="c86-tcr" data-title="Clonalité du récepteur T : utile, jamais suffisante seule"><div class="lab">Normalité</div><p>Les cellules T développent des réarrangements des gènes du récepteur T ; une réponse immunitaire normale peut sélectionner et amplifier certains clones. Les cellules NK n’utilisent pas ce récepteur réarrangé. Le phénotype membranaire et les études de gènes répondent à des questions complémentaires.</p><div class="lab">Maladie</div><p>Un clone dominant peut étayer une prolifération T néoplasique, mais des clones non malins donnent des résultats positifs ; inversement, une tumeur T peut donner un profil apparemment polyclonal selon la qualité, l’échantillonnage et la méthode. ESMO–EHA 2025 recommande une interprétation intégrant morphologie, phénotype aberrant et données moléculaires.</p><div class="lab">Exemples</div><p>Un ENKTL de lignée NK garde habituellement les gènes TCR en configuration germinale ; une forme de lignée T peut être réarrangée. Le HSTL est le plus souvent gamma-delta, parfois alpha-bêta ou silencieux. Dans RCD-II, le réarrangement TCR contribue à caractériser la population intraépithéliale aberrante mais ne remplace pas les critères digestifs.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">[S208] Onkopedia, octobre 2025, DGHO/OeGHO/SSH/SGMO</a>.</p></template>
<template data-pop="c86-thiopurine" data-title="Thiopurines et HSTL : lire correctement le risque absolu"><div class="lab">Population</div><p>La revue Carvão 2019 cite, chez les <b>hommes de moins de 35 ans</b>, des risques estimés de 1/7 404 sous thiopurine seule et 1/3 534 sous association thiopurine–anti-TNF. Ils ne doivent pas être attribués à tous les patients atteints de Crohn, ni présentés comme un risque annuel : l’horizon temporel n’est pas défini par ce passage.</p><div class="lab">Calcul illustratif</div><p>1 ÷ 7 404 × 100 ≈0,0135 % ; 1 ÷ 3 534 × 100 ≈0,0283 %. Leur rapport arithmétique est environ 2,10 et leur différence environ 0,0148 point de pourcentage. Cette comparaison de deux estimations publiées ne prouve pas à elle seule un effet causal ajusté du médicament et ne prédit pas le risque personnel.</p><div class="lab">Décision clinique</div><p>La revue rapporte qu’une grande partie des cas sous association survient après deux ans et cite des recommandations historiques de limitation chez le jeune homme. Elle ne formule pas de règle formelle de durée de la thiopurine seule. Ce cours ne transforme pas cette revue de cas en consigne d’arrêt automatique : l’équipe de gastroentérologie réévalue bénéfice, contrôle de la maladie, alternatives et risques. Une fièvre avec splénomégalie/cytopénies nécessite une évaluation sans attendre une durée d’exposition particulière.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6624667/" target="_blank" rel="noopener">[S211] Carvão et al., revue de cas Crohn/HSTL, 2019</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">[S208] Onkopedia, octobre 2025, DGHO/OeGHO/SSH/SGMO</a>.</p></template>
<template data-pop="c86-biopsie" data-title="Choisir un prélèvement qui permet une classification"><div class="lab">Pourquoi du tissu</div><p>Le diagnostic associe architecture, cytologie, immunophénotype, virus et données moléculaires. Une biopsie excisionnelle ou incisionnelle est privilégiée lorsque possible. Si la chirurgie ne peut être réalisée, plusieurs carottes peuvent permettre la prise en charge initiale, mais leur précision pour le diagnostic et le sous-typage est inférieure. Un prélèvement pauvre ou nécrotique peut nécessiter une nouvelle biopsie.</p><div class="lab">Adapter au siège</div><p>Une lésion sous-cutanée demande un hypoderme représentatif ; une tumeur nasale nécrotique demande un prélèvement profond et exploitable ; une adénopathie TFH demande assez d’architecture. Dans un HSTL, la moelle peut être le site déterminant. Le BPDCN peut être établi par biopsie cutanée ou cytométrie médullaire, selon la présentation. Les examens ne sont donc pas identiques pour tout C86.</p><div class="lab">Organisation</div><p>Informer le laboratoire de l’hypothèse avant le geste facilite le conditionnement des échantillons destinés à l’histologie, à la cytométrie et aux analyses moléculaires. Le diagnostic est posé ou confirmé par un hématopathologiste expérimenté, disposant des lames et d’un bloc représentatif. Une rechute présumée est rebiopsiée lorsque possible, car infection, réaction inflammatoire ou néoplasie d’une autre lignée peuvent modifier entièrement le traitement.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://journals.lww.com/hemasphere/fulltext/2023/03000/unmet_clinical_needs_and_management.2.aspx" target="_blank" rel="noopener">[S217] Pagano et al., consensus international BPDCN 2023</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1111/ddg.14706" target="_blank" rel="noopener">[S218] S2k lymphomes cutanés 2021, publié 2022</a>.</p></template>
<template data-pop="c86-moelle" data-title="La moelle : indication selon l’entité, pas selon le seul code"><div class="lab">PTCL systémiques</div><p>ESMO–EHA 2025 recommande une aspiration et une biopsie médullaires dans la stadification des PTCL relevant de son champ. La TEP ne les remplace pas systématiquement : une infiltration diffuse peut être peu visible. Dans le HSTL, l’infiltrat intrasinusoïdal est presque constant ; la moelle sert au diagnostic et à la confirmation de réponse.</p><div class="lab">Exceptions cutanées et BPDCN</div><p>Une LyP typique sans anomalie clinique ou biologique ne nécessite pas un bilan médullaire de routine. Le pcALCL purement cutané relève d’un bilan adapté au contexte ; des cytopénies inexpliquées ou une extension suspecte changent l’indication. Le BPDCN demande une évaluation hématologique propre, avec cytométrie et examen médullaire selon sa présentation. Appliquer sans distinction « biopsie médullaire à tous les C86 » serait incorrect.</p><div class="lab">Interprétation</div><p>La cytopénie peut provenir d’infiltration, d’inflammation, d’hypersplénisme, d’une hémolyse ou d’un traitement. Une hémophagocytose peut être observée sans suffire à diagnostiquer un HLH ; son absence précoce ne l’exclut pas. Le résultat doit être intégré à la dynamique clinique et biologique.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://journals.lww.com/hemasphere/fulltext/2023/03000/unmet_clinical_needs_and_management.2.aspx" target="_blank" rel="noopener">[S217] Pagano et al., consensus international BPDCN 2023</a> ; <a href="https://ashpublications.org/blood/article/133/23/2465/273833/Recommendations-for-the-management-of" target="_blank" rel="noopener">[S215] La Rosée et al., HLH adulte, 2019</a>.</p></template>
<template data-pop="c86-bio" data-title="Biologie : référence, anomalie et décision"><div class="lab">Bilan initial</div><p>Hémogramme, fonction rénale/hépatique, LDH, urate, immunoglobulines et sérologies ciblées précèdent le traitement. VIH et hépatites B/C recherchent des infections qui peuvent modifier la stratégie ; HTLV-1 est notamment pertinent pour le différentiel ATLL selon le contexte. L’ADN d’EBV est suivi dans l’ENKTL. Un bilan cardiaque est prévu avant anthracycline et une fonction cardiaque adéquate est requise avant tagraxofusp.</p><div class="lab">Repères suisses adultes datés</div><table class="t"><thead><tr><th>Paramètre</th><th>Repère de l’enseignement HUG 2019</th><th>Limite</th></tr></thead><tbody><tr><td>Hémoglobine</td><td>Homme 140–180 g/L ; femme 120–160 g/L</td><td>Repères adultes de cette source, sans extrapolation à grossesse ou pédiatrie.</td></tr><tr><td>Leucocytes</td><td>4,0–11,0 × 10⁹/L</td><td>Ne donne pas à lui seul le nombre absolu de neutrophiles.</td></tr><tr><td>Plaquettes</td><td>150–350 × 10⁹/L</td><td>L’intervalle du laboratoire du patient prévaut.</td></tr></tbody></table><div class="lab">Interprétation</div><p>Ces repères pédagogiques suisses datés ne sont pas une norme nationale 2026. Une LDH s’interprète par rapport à la limite supérieure de la méthode ; elle augmente aussi dans d’autres lésions tissulaires. Dans une suspicion d’hémolyse : réticulocytes, bilirubine non conjuguée, LDH, haptoglobine, frottis et test direct à l’antiglobuline sont confrontés ; un Coombs positif isolé n’établit pas une hémolyse active.</p><div class="lab">Seuils décisionnels distincts</div><p>Hb <90 g/L et plaquettes <100 × 10⁹/L sont des éléments du critère de cytopénies HLH-2004, pas les limites inférieures de la normalité. Albumine ≥32 g/L est un prérequis avant la première dose de tagraxofusp ; le seuil de surveillance pendant le traitement est différent. Toute valeur doit garder son unité, la population et la question clinique.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">[S209] Zander et Renner, revue suisse SZO 2021</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S223] HUG, enseignement hémogramme adulte, septembre 2019</a> ; <a href="https://ashpublications.org/blood/article/133/23/2465/273833/Recommendations-for-the-management-of" target="_blank" rel="noopener">[S215] La Rosée et al., HLH adulte, 2019</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a>.</p></template>
<template data-pop="c86-tep" data-title="TEP-TDM : extension, réponse et faux positifs"><div class="lab">Place</div><p>La TEP-TDM est privilégiée au diagnostic et en fin de traitement des PTCL nodaux/extranodaux concernés par ESMO–EHA 2025 ; un contrôle intermédiaire est possible. L’avidité du FDG varie selon l’entité et le site. Dans le HSTL, une infiltration diffuse de la moelle ou du foie peut être mal détectée ; les prélèvements restent importants.</p><div class="lab">Réponse</div><p>Une fixation résiduelle n’est pas une preuve suffisante de tumeur viable : infection et inflammation peuvent fixer le FDG. Une biopsie de confirmation est recherchée lorsque le résultat modifierait la prise en charge. Dans l’ENKTL, Deauville ≤3 et ADN d’EBV plasmatique indétectable sont des objectifs décrits ; la réponse globale intègre aussi la clinique.</p><div class="lab">Calendrier et limites</div><p>Le délai après traitement dépend de la modalité reçue et de la décision à prendre ; une TEP trop précoce expose aux phénomènes inflammatoires. Le rendez-vous est fixé par l’équipe et ne doit pas retarder la prise en charge d’une aggravation clinique. Une LyP typique sans signes extracutanés ne justifie pas une TEP systématique. En rémission complète des PTCL, la surveillance régulière par TEP/TDM n’est pas recommandée sans motif clinique.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a>.</p></template>
<template data-pop="c86-index" data-title="Scores pronostiques : mêmes variables, populations différentes"><div class="lab">IPI et PIT</div><p>L’IPI compte âge >60 ans, LDH au-dessus de la limite supérieure, ECOG ≥2, stade III–IV et plus d’un site extranodal. Le PIT des lymphomes T retient âge, état général, LDH et atteinte médullaire. Le mPIT remplace l’atteinte médullaire par le Ki-67 dans la version décrite par SZO ; il ne l’ajoute pas comme un cinquième item. Aucun de ces scores n’est une règle universelle de traitement pour toutes les entités C86, notamment LyP ou BPDCN.</p><div class="lab">PINK et PINK-E</div><p>Pour l’ENKTL traité par programmes sans anthracycline, PINK retient âge >60 ans, stade III–IV, ganglions à distance et présentation non nasale. PINK-E ajoute la détection initiale d’ADN d’EBV. Ces facteurs décrivent le risque de groupes ; les réponses sous traitement apportent ensuite une information dynamique.</p><div class="lab">Exemple pédagogique</div><p>Un patient fictif de 65 ans avec maladie nasale de stade IV, ganglions à distance et EBV plasmatique détectable a trois facteurs PINK et un facteur supplémentaire PINK-E. Ce décompte ne fournit pas une probabilité individuelle de survie sans utiliser le modèle et sa population de validation. Il ne suffit pas à décider seul d’une greffe.</p><div class="lab">Erreur à éviter</div><p>Ne pas confondre score élevé, stade avancé et absence d’option curative. Le choix dépend aussi de l’aptitude, des comorbidités, de l’entité, de la réponse et des préférences du patient. Les anciennes survies par classe ne sont pas transposées à une population contemporaine sans préciser leur contexte.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">[S209] Zander et Renner, revue suisse SZO 2021</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">[S208] Onkopedia, octobre 2025, DGHO/OeGHO/SSH/SGMO</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a>.</p></template>
<template data-pop="c86-diffdx" data-title="Différentiels cutanés : clinique et histologie indissociables"><div class="lab">LyP : sous-types et ressemblances</div><table class="t"><thead><tr><th>Type</th><th>Diagnostic pouvant être mimé</th></tr></thead><tbody><tr><td>A</td><td>pcALCL, mycosis fongoïde tumoral, lymphome de Hodgkin classique.</td></tr><tr><td>B</td><td>Mycosis fongoïde en plaques.</td></tr><tr><td>C</td><td>pcALCL et mycosis fongoïde transformé CD30 positif.</td></tr><tr><td>D</td><td>Lymphome cytotoxique CD8 épidermotrope agressif.</td></tr><tr><td>E</td><td>ENKTL, avec aspect angiocentrique/angiodestructeur.</td></tr><tr><td>Avec réarrangement DUSP22–IRF4</td><td>Mycosis fongoïde transformé dans le tableau OMS–EORTC.</td></tr></tbody></table><div class="lab">Ce qui tranche</div><p>Le type histologique de LyP ne dicte pas à lui seul un pronostic ou une escalade thérapeutique. L’apparition en poussées et la régression spontanée des lésions sont confrontées à la biopsie. Une lésion persistante ou une évolution inhabituelle doit être réévaluée. CD30 n’est pas spécifique d’une entité.</p><div class="lab">Autres frontières</div><p>Un ALK positif dans la peau impose une recherche de lymphome anaplasique systémique, tout en reconnaissant de rares formes cutanées primitives ALK positives. Une panniculite demande de distinguer SPTCL, lymphome gamma-delta cutané et panniculite lupique ; une biopsie superficielle ou un autoanticorps isolé ne tranche pas cette question. Les signes et l’immunophénotype sont relus en expertise.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">[S206] OMS–EORTC 2018, publié 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://onlinelibrary.wiley.com/doi/full/10.1111/ddg.14492" target="_blank" rel="noopener">[S219] S2k lupus cutané 2021</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">[S212] Moonla et al., Haematologica 2023</a>.</p></template>
<template data-pop="c86-stad-cutanee" data-title="Stadification cutanée : décrire l’extension sans surclasser"><div class="lab">Principe</div><p>La classification TNM ISCL/EORTC des lymphomes cutanés autres que mycosis fongoïde/Sézary décrit peau, ganglions et autres organes. Elle ne doit pas être confondue avec le TNMB du mycosis fongoïde ni avec une preuve pronostique identique pour toutes les entités. Ann Arbor/Lugano n’est pas adapté pour interpréter une LyP cutanée diffuse comme une maladie systémique de stade IV.</p><div class="lab">Bilan proportionné</div><p>Dans une LyP typique, sans adénopathie, organomégalie, symptômes B ni anomalie biologique évocatrice, le consensus 2011 ne demande pas d’imagerie ou de biopsie médullaire de routine. Pour le pcALCL, un bilan d’extension recherche une maladie systémique ; une adénopathie suspecte, notamment >1,5 cm dans le consensus, appelle une biopsie adaptée. La taille seule n’est pas un diagnostic de lymphome.</p><div class="lab">Suivre</div><p>Documenter le nombre, la distribution, la taille, l’ulcération et la chronologie des lésions. Une récidive purement cutanée peut garder un bon pronostic ; une extension extracutanée modifie le bilan et la stratégie. Une guérison apparente d’une lésion ne dispense pas du suivi de la LyP.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1111/ddg.14706" target="_blank" rel="noopener">[S218] S2k lymphomes cutanés 2021, publié 2022</a>.</p></template>
<template data-pop="c86-chop" data-title="CHOP, CHOEP et BV-CHP : nommer les composants et la preuve"><table class="t"><thead><tr><th>Schéma</th><th>Composants et place</th></tr></thead><tbody><tr><td>CHOP</td><td>Cyclophosphamide, doxorubicine, vincristine, prednisone. Référence pour certains PTCL nodaux dont TFH ; pas pour ENKTL.</td></tr><tr><td>CHOEP</td><td>CHOP avec étoposide ; choix selon entité, âge, aptitude et protocole.</td></tr><tr><td>BV-CHP</td><td>Brentuximab védotine avec cyclophosphamide, doxorubicine, prednisone. La vincristine est retirée pour éviter la toxicité neurologique additionnelle.</td></tr></tbody></table><div class="lab">Preuve</div><p>ECHELON-2 compare BV-CHP et CHOP dans des PTCL CD30 positifs sélectionnés, avec seuil d’inclusion ≥10 %. Le bénéfice global est principalement porté par les lymphomes anaplasiques systémiques. ESMO–EHA 2025 ne montre pas le même bénéfice démontré dans TFH/PTCL-NOS. L’indication suisse d’Adcetris est plus large que l’indication européenne citée, mais une autorisation ne prouve pas une efficacité identique dans chaque sous-groupe.</p><div class="lab">Cycle et sécurité</div><p>La FI suisse indique 6–8 cycles pour Adcetris avec CHP. Ce nombre ne doit pas devenir une durée obligatoire de tout CHOP : ESMO 2025 prévoit notamment des programmes abrégés dans certains PTCL limités favorables. Les doses des cytotoxiques, leur administration, les prophylaxies et les adaptations appartiennent au protocole exact. Les doses d’un schéma B médiastinal ou d’une LLA ne sont pas transférées à C86.</p><div class="lab">Avant et pendant</div><p>Vérifier fonction cardiaque avant anthracycline, hémogramme, rein/foie, infections et risque de lyse. La FI Adcetris recommande G-CSF dès la première dose avec CHP. Une neuropathie, une infection ou une cytopénie peut imposer une adaptation ; les règles diffèrent entre monothérapie, CHP et autres combinaisons.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a> ; <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">[S209] Zander et Renner, revue suisse SZO 2021</a>.</p></template>
<template data-pop="c86-bv" data-title="Adcetris : indication suisse, dose et surveillance selon le régime"><div class="lab">Mécanisme</div><p>Le brentuximab védotine associe un anticorps anti-CD30 à une charge cytotoxique, la monométhylauristatine E (MMAE). La cible dirige le conjugué vers les cellules exprimant CD30 ; le marqueur n’est cependant pas une preuve autonome que ce médicament est le meilleur traitement d’une entité donnée.</p><div class="lab">Indications suisses utiles à C86</div><p>La FI de juin 2025 autorise Adcetris avec CHP dans le PTCL CD30 positif de l’adulte non prétraité. Pour le lymphome T cutané CD30 positif adulte, l’indication est une progression sous traitement systémique <em>ou</em> l’exclusion d’une autre thérapie systémique. Elle n’est donc pas résumée exactement par « toujours après un traitement systémique ». La sélection clinique respecte l’entité et les alternatives.</p><div class="lab">Dose adulte de la FI</div><p>Avec CHP : 1,8 mg/kg IV en 30 minutes toutes les trois semaines, 6–8 cycles, avec prophylaxie primaire G-CSF dès la première dose. En monothérapie cutanée : 1,8 mg/kg toutes les trois semaines, jusqu’à 16 cycles selon réponse et tolérance. Au-delà de 100 kg, la dose se calcule sur 100 kg, soit au plus 180 mg à cette dose. La sécurité et l’efficacité pédiatriques ne permettent pas une recommandation posologique suisse.</p><div class="lab">Adaptation neurologique avec CHP</div><table class="t"><thead><tr><th>Événement</th><th>Conduite de la FI avec CHP</th></tr></thead><tbody><tr><td>Grade 1</td><td>Poursuivre à même dose/fréquence.</td></tr><tr><td>Grade 2 sensitif</td><td>Même dose ; surveillance.</td></tr><tr><td>Grade 2 moteur</td><td>Réduire à 1,2 mg/kg, maximum 120 mg, toutes les trois semaines.</td></tr><tr><td>Grade 3 sensitif</td><td>Réduire à 1,2 mg/kg, maximum 120 mg.</td></tr><tr><td>Grade 3 moteur ou grade 4</td><td>Arrêter.</td></tr></tbody></table><div class="lab">Autres garde-fous</div><p>La bléomycine concomitante est contre-indiquée pour toxicité pulmonaire. Une suspicion de LEMP impose une suspension et une exploration ; une PCR JCV négative ne l’exclut pas, et une confirmation impose l’arrêt définitif. Surveiller infections, neutropénie, foie, glycémie et signes abdominaux. En monothérapie, la FI évite l’emploi si TFG <30 mL/min ou Child-Pugh B/C ; Child-Pugh A justifie une dose initiale réduite. Ces règles ne se transposent pas sans vérification à une combinaison.</p><div class="lab">Interactions et grossesse</div><p>Les inhibiteurs puissants CYP3A4/P-gp augmentent l’exposition à MMAE ; le kétoconazole a produit une hausse d’environ 73 % dans l’étude citée, tandis que la rifampicine la diminuait d’environ 31 %. Ces chiffres pharmacocinétiques ne sont pas des variations d’efficacité clinique. La grossesse exige une nécessité absolue dans la FI ; deux méthodes contraceptives fiables sont demandées, avec poursuite six mois après la dernière dose chez la femme. La fertilité masculine doit être discutée avant traitement.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a>.</p></template>

<template data-pop="c86-asp" data-title="Asparaginases et ENKTL : ne pas confondre produit et protocole"><div class="lab">Régimes explicités</div><table class="t"><thead><tr><th>Sigle</th><th>Composants</th></tr></thead><tbody><tr><td>DDGP</td><td>Dexaméthasone, cisplatine, gemcitabine, pégaspargase.</td></tr><tr><td>SMILE / mSMILE</td><td>Dexaméthasone, méthotrexate, ifosfamide, L-asparaginase, étoposide ; les versions modifiées et la préparation enzymatique doivent être précisées dans le protocole.</td></tr><tr><td>AspMetDex</td><td>L-asparaginase, méthotrexate, dexaméthasone.</td></tr><tr><td>P-GEMOX</td><td>Pégaspargase, gemcitabine, oxaliplatine.</td></tr><tr><td>DeVIC</td><td>Dexaméthasone, étoposide, ifosfamide, carboplatine : ce schéma ne contient pas d’asparaginase.</td></tr></tbody></table><div class="lab">Choix et preuve</div><p>ESMO–EHA 2025 propose des régimes sans anthracycline avec L-asparaginase, en tenant compte de l’aptitude, du stade, du risque neurologique et du centre. Les études de comparaison DDGP/SMILE sont de faible effectif et discutées dans Tse 2022 ; elles ne permettent pas de déclarer un vainqueur universel. Une réponse globale élevée ne supprime pas le risque infectieux ou la mortalité liée au traitement.</p><div class="lab">Oncaspar en Suisse</div><p>L’indication autorisée est la LLA en association à d’autres antinéoplasiques. Dans cette indication, la FI décrit 2 500 U/m² tous les 14 jours pour les patients ≤21 ans avec surface ≥0,6 m², et 2 000 U/m² pour les adultes >21 ans ; les petits enfants ont une autre règle. <b>Ces doses ne sont pas présentées comme une prescription d’ENKTL.</b> La formulation, l’âge, la surface, le calendrier et l’activité enzymatique doivent rester liés au protocole exact.</p><div class="lab">Surveillance et arrêt</div><p>La FI recommande une administration hospitalière et une vigilance envers l’hypersensibilité. Une pancréatite clinique confirmée interdit la reprise. Les antécédents de pancréatite, thrombose grave ou hémorragie grave sous L-asparaginase, ainsi que l’insuffisance hépatique sévère, figurent parmi les contre-indications. Surveiller glycémie, lipase/amylase, coagulation, fibrinogène, antithrombine, bilirubine et transaminases selon la FI ; les contrôles hépatiques se poursuivent jusqu’à quatre semaines après la dernière dose dans la recommandation lue.</p><div class="lab">Activité et remplacement</div><p>Des anticorps inactivants peuvent diminuer l’activité sans réaction allergique spectaculaire. Un suivi enzymatique peut conduire à changer de préparation. La crisantaspase est proposée dans ESMO en cas d’hypersensibilité ou d’anticorps inactivants contre l’asparaginase d’E. coli ; sa disponibilité et son statut suisse n’ont pas été établis ici. Les activités des différentes protéines ne doivent pas être comparées comme des unités interchangeables.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669340018" target="_blank" rel="noopener">[S222] FI suisse Oncaspar, septembre 2025, AIPS via AmiKo</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">[S208] Onkopedia, octobre 2025, DGHO/OeGHO/SSH/SGMO</a>.</p></template>
<template data-pop="c86-rt" data-title="Radiothérapie : indication, dose et exceptions"><div class="lab">ENKTL localisé</div><p>Chez un patient apte, la radiothérapie des sites impliqués d’au moins 50 Gy est associée à une chimiothérapie sans anthracycline contenant de la L-asparaginase, concomitante, intercalée ou séquentielle. L’extension sous-muqueuse et les territoires initialement atteints guident le volume ; TEP et IRM aident la planification. La dose ne se déduit pas de la seule lésion visible après chimiothérapie.</p><div class="lab">Exception à l’association</div><p>ESMO–EHA 2025 admet une radiothérapie seule dans certains stades I non volumineux ou pour une maladie localisée chez une personne trop fragile pour la chimiothérapie. Il serait donc faux d’enseigner une interdiction absolue de la radiothérapie seule. La décision tient compte du risque de rechute systémique et des comorbidités.</p><div class="lab">Autres entités</div><p>Pour certains PTCL TFH limités répondeurs, une consolidation de 30–40 Gy en 15–20 fractions peut être discutée. Pour un pcALCL solitaire/groupé, excision ou radiothérapie sont des options locales ; ESMO cutané 2018 cite notamment 24–30 Gy selon les recommandations de radiothérapie concernées. Ces prescriptions ne s’échangent pas entre ENKTL, pcALCL et TFH.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a>.</p></template>
<template data-pop="c86-tagra" data-title="Elzonris : BPDCN, unités et fuite capillaire"><div class="lab">Mécanisme et indication</div><p>Le tagraxofusp est une protéine de fusion ciblant CD123 et délivrant une toxine diphtérique. La FI suisse de novembre 2022 l’autorise en première ligne du BPDCN chez l’adulte. Dans l’étude non randomisée citée, 65 adultes naïfs de traitement ont une réponse complète/complète clinique de 56,9 % (IC95 % 44,0–69,2) ; ce résultat n’est pas une comparaison directe avec la chimiothérapie ou la greffe.</p><div class="lab">Dose et lieu</div><p>12 µg/kg IV en 15 minutes, une fois par jour de J1 à J5 d’un cycle de 21 jours ; les retards peuvent étendre la fenêtre d’administration jusqu’à J10 selon la FI. <b>µg n’est pas mg.</b> Pour un adulte fictif de 70 kg, 12 ×70 =840 µg, soit 0,84 mg. Le premier cycle se fait à l’hôpital, avec surveillance au moins 24 heures après la dernière perfusion. Une prémédication est prévue environ 60 minutes avant la perfusion. Pas de bolus.</p><div class="lab">Avant chaque dose</div><table class="t"><thead><tr><th>Paramètre</th><th>Seuil ou action de la FI</th></tr></thead><tbody><tr><td>Avant première dose du cycle 1</td><td>Fonction cardiaque adéquate et albumine ≥3,2 g/dL =32 g/L.</td></tr><tr><td>Albumine pendant traitement</td><td><3,5 g/dL =35 g/L, ou baisse ≥0,5 g/dL =5 g/L : appliquer l’algorithme de fuite capillaire, suspendre et traiter selon signes.</td></tr><tr><td>Poids</td><td>Hausse ≥1,5 kg par rapport à la veille : rechercher et prendre en charge la fuite capillaire.</td></tr><tr><td>ASAT/ALAT</td><td>>5 fois la limite supérieure : suspendre ; reprise lorsque ≤2,5 fois la limite selon FI.</td></tr><tr><td>Rein</td><td>Créatinine >1,8 mg/dL =159 µmol/L ou clairance <60 mL/min : suspension selon l’algorithme.</td></tr><tr><td>Clinique</td><td>Pression, pouls, température, œdèmes, dyspnée et hypotension avant dose et pendant administration.</td></tr></tbody></table><div class="lab">Conduite et dénominateurs</div><p>Œdème, prise de poids, hypoalbuminémie ou hypotension imposent une évaluation rapide ; le protocole prévoit albumine IV, prise en charge hémodynamique et parfois corticoïdes, avec règles strictes de reprise. Les 18 % de fuite capillaire et 1,3 % de cas fatals proviennent de 225 patients de plusieurs hémopathies et doses ; le sous-groupe BPDCN compte 19/89 cas (21 %) et trois décès. La médiane de six jours n’autorise pas à cesser la vigilance ensuite.</p><div class="lab">Autres limites</div><p>Hypersensibilité au produit/excipients : contre-indication. Contrôler lyse tumorale, numération et foie. Les données d’insuffisance rénale/hépatique sont limitées ; aucune dose pédiatrique suisse n’est proposée. Le passage vers le SNC est inconnu et une atteinte neurologique demande une stratégie complémentaire. Grossesse : décision exceptionnelle justifiée ; test dans les sept jours précédant le début, contraception et interruption d’allaitement selon FI, au moins une semaine après dernière dose.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://journals.lww.com/hemasphere/fulltext/2023/03000/unmet_clinical_needs_and_management.2.aspx" target="_blank" rel="noopener">[S217] Pagano et al., consensus international BPDCN 2023</a>.</p></template>
<template data-pop="c86-ice" data-title="ICE et autres programmes du HSTL"><div class="lab">Nom et indication</div><p>ICE associe ifosfamide, carboplatine et étoposide. ESMO–EHA 2025 le suggère comme option de première ligne privilégiée du HSTL chez le patient apte. IVAC associe ifosfamide, étoposide et cytarabine ; DHAP/DHAX et CHOEP sont d’autres possibilités citées. Les patients fragiles peuvent recevoir un programme adapté, par exemple ICE réduit ou GEMOX, en centre expert.</p><div class="lab">Preuve</div><p>Les résultats favorables des régimes non-CHOP proviennent surtout de séries rétrospectives. La comparaison 82 % contre 52 % de réponses ne correspond pas à deux bras randomisés de 166 patients. La sélection, l’aptitude et la consolidation diffèrent ; ces chiffres soutiennent une stratégie mais ne prédisent pas l’effet chez un individu.</p><div class="lab">Après la réponse</div><p>Une greffe est envisagée chez les patients éligibles en réponse complète ou partielle, de préférence allogénique ; l’autogreffe est une alternative sélectionnée si l’allogreffe n’est pas possible. Le contrôle médullaire et éventuellement hépatique complète la TEP. Les doses et mesures de prévention spécifiques de chaque cytotoxique relèvent du protocole exact ; le sigle seul n’est pas une prescription.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">[S208] Onkopedia, octobre 2025, DGHO/OeGHO/SSH/SGMO</a>.</p></template>
<template data-pop="c86-greffe" data-title="Autogreffe et allogreffe : objectifs différents"><div class="lab">Définition</div><p>L’autogreffe utilise les cellules souches du patient après une chimiothérapie intensive ; aucun donneur n’est recherché pour cette procédure. L’allogreffe apporte des cellules d’un donneur et un effet immunologique potentiel contre la néoplasie, avec risques de toxicité, infections et maladie du greffon contre l’hôte. La disponibilité d’un donneur et l’aptitude comptent pour l’allogreffe.</p><table class="t"><thead><tr><th>Situation</th><th>Place discutée</th></tr></thead><tbody><tr><td>TFH/PTCL nodal</td><td>Autogreffe possible en première réponse à haut risque ; allogreffe surtout en rechute chimiosensible si patient apte.</td></tr><tr><td>HSTL</td><td>Consolidation précoce des répondeurs, préférentiellement allogénique ; ne pas attendre obligatoirement une rechute.</td></tr><tr><td>EATL</td><td>Autogreffe après induction chez des répondeurs sélectionnés aptes ; pas de recherche de donneur requise pour cette autogreffe.</td></tr><tr><td>ENKTL avancé/à haut risque</td><td>Choix auto/allogreffe individualisé selon ESMO 2025 ; données limitées et divergences avec des revues antérieures.</td></tr><tr><td>BPDCN</td><td>Allogreffe idéalement en première rémission chez les patients aptes ; autogreffe possible dans des situations sélectionnées, données limitées.</td></tr></tbody></table><div class="lab">Décision</div><p>Le type de greffe ne se déduit pas d’un seul score, de CD30 ou du code C86. Réponse tissulaire/médullaire, état général, organes, comorbidités, âge biologique, souhaits du patient et options disponibles sont discutés collégialement. Les survies des séries transplantées sont fortement sélectionnées et ne représentent pas l’ensemble des patients au diagnostic.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://journals.lww.com/hemasphere/fulltext/2023/03000/unmet_clinical_needs_and_management.2.aspx" target="_blank" rel="noopener">[S217] Pagano et al., consensus international BPDCN 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a>.</p></template>
<template data-pop="c86-lyp-trt" data-title="LyP et pcALCL : traiter l’activité sans surtraiter"><div class="lab">Papulose lymphomatoïde</div><p>Une surveillance est légitime si les lésions sont peu gênantes ; expliquer la chronicité et le risque d’autres lymphomes. Un traitement peut réduire les poussées, mais aucune stratégie n’a démontré qu’elle prévient un second lymphome. Le consensus EORTC/ISCL/USCLC 2011 cite méthotrexate à faible dose et photothérapie PUVA ; la dose de méthotrexate est <b>hebdomadaire, jamais quotidienne</b>. Les doses publiées de 5–30 mg/semaine décrivent ces séries et ne dispensent pas de la vérification du produit, des contre-indications, du rein, des interactions et du protocole.</p><div class="lab">pcALCL</div><p>Une lésion solitaire ou groupée relève préférentiellement d’une excision ou d’une radiothérapie. Une récidive cutanée isolée ne signifie pas nécessairement aggravation systémique. Des lésions multifocales peuvent justifier un traitement systémique tel que méthotrexate ; le brentuximab a une place selon la situation et la FI suisse. Une atteinte extracutanée impose une nouvelle évaluation et une stratégie adaptée.</p><div class="lab">Ce qu’il faut éviter</div><p>La polychimiothérapie n’est pas une réponse de routine à la seule positivité CD30 ou à une LyP diffuse. Les anciennes séries rapportent des rechutes fréquentes après CHOP malgré la réponse initiale dans le pcALCL limité à la peau. Le suivi de la LyP reste au long cours, avec réévaluation des lésions persistantes et des signes systémiques.</p><div class="lab">Portée des sources</div><p>Le consensus 2011 associe des groupes européens et américains et des auteurs suisses ; sa date et sa nature de consensus sont conservées. Il est confronté ici aux recommandations ESMO 2018 et à l’information professionnelle suisse actuelle consultée.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a>.</p></template>
<template data-pop="c86-rechute" data-title="Rechute : rebiopsier, préciser l’objectif, vérifier l’accès"><div class="lab">Avant le traitement</div><p>Une lésion nouvelle peut être une infection, une inflammation, une autre néoplasie ou une rechute. La rebiopsie est recommandée lorsque possible, en utilisant le tissu récent pour les marqueurs et cibles. L’objectif est discuté : obtenir une réponse pour une allogreffe, contrôler les symptômes ou entrer dans un essai.</p><div class="lab">TFH et autres PTCL</div><p>ESMO 2025 propose des programmes à base de platine et, dans TFH, des options incluant 5-azacitidine. L’essai de phase III d’azacitidine orale n’a pas atteint son critère principal de survie sans progression ; des signaux de survie globale et tolérance ne justifient pas de le présenter comme une supériorité établie. Chez des patients moins aptes, ciclosporine, lénalidomide ou bendamustine font partie des options citées, avec niveau de preuve et statut réglementaire à vérifier.</p><div class="lab">ENKTL et BPDCN</div><p>Des anticorps anti-PD1, dont pembrolizumab/nivolumab, ont donné des réponses dans l’ENKTL réfractaire après asparaginase ; la recommandation précise l’absence d’autorisation EMA pour cette indication à sa rédaction. Cela ne prouve pas automatiquement le statut suisse actuel. Dans le BPDCN, combinaisons et nouvelles cibles sont étudiées ; un essai clinique ou une stratégie de greffe est discuté selon réponse et aptitude.</p><div class="lab">Suisse</div><p>Chaque produit exige la vérification de son indication suisse exacte, de la liste des spécialités et de sa limitation. Une recommandation internationale, une publication d’activité et un remboursement sont trois informations différentes. Aucun accès automatique aux molécules de rechute n’est promis ici.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://journals.lww.com/hemasphere/fulltext/2023/03000/unmet_clinical_needs_and_management.2.aspx" target="_blank" rel="noopener">[S217] Pagano et al., consensus international BPDCN 2023</a> ; <a href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S224] OFSP, liste des spécialités</a> ; <a href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S225] OFSP, cas particuliers, art. 71a–d OAMal</a>.</p></template>
<template data-pop="c86-suivi" data-title="Suivi : distinguer rémission, toxicité tardive et nouvelle alerte"><div class="lab">PTCL en réponse complète</div><p>ESMO–EHA 2025 propose anamnèse et examen tous les trois mois pendant un an, puis tous les six mois pendant deux années supplémentaires sans consolidation autologue, ou quatre années supplémentaires après autogreffe. L’arrêt du suivi spécialisé peut être envisagé à trois ou cinq ans chez un patient asymptomatique considéré en rémission complète continue. Après allogreffe, les recommandations propres à la transplantation s’appliquent.</p><div class="lab">Ce qui n’est pas systématique</div><p>Une TEP ou TDM régulière sans signe d’appel n’est pas recommandée pour les PTCL en rémission complète. Le suivi n’est cependant pas annulé par une TEP normale : nouveaux symptômes, cytopénies, infection, toxicités et séquelles demandent une réévaluation. La PCR EBV est recommandée dans le suivi de l’ENKTL ; elle complète la clinique.</p><div class="lab">Autres rythmes</div><p>La LyP garde un suivi prolongé, car des lymphomes associés peuvent survenir tardivement. RCD-II fait l’objet d’une surveillance digestive spécialisée, avec des contrôles tous les 6–12 mois à considérer et une imagerie notamment devant de nouveaux signes préoccupants selon ESMO 2025. Une douleur aiguë, un saignement, une obstruction, un stridor ou un tableau de HLH impose une évaluation immédiate et ne doit pas attendre le contrôle programmé.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.10
