02/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a>.</p></template>
<template data-pop="c86-statut-ch" data-title="Suisse : autorisation, remboursement et accès sont distincts"><table class="t"><thead><tr><th>Produit</th><th>Indication documentée dans la FI suisse consultée</th></tr></thead><tbody><tr><td>Adcetris</td><td>PTCL CD30 positif adulte non prétraité avec CHP ; lymphome T cutané CD30 positif adulte en progression sous traitement systémique ou si une autre thérapie systémique est exclue.</td></tr><tr><td>Elzonris</td><td>Première ligne du BPDCN adulte.</td></tr><tr><td>Oncaspar</td><td>LLA en association ; l’emploi dans ENKTL est hors indication autorisée.</td></tr><tr><td>Autres options citées</td><td>Le statut suisse exact des anti-PD1 dans ENKTL, de la crisantaspase et des agents de rechute n’est pas établi dans ce dossier.</td></tr></tbody></table><div class="lab">Prise en charge</div><p>La liste des spécialités de l’OFSP fixe les produits remboursés par l’AOS et peut comporter des limitations. Une autorisation Swissmedic ne garantit donc pas le paiement de toute indication ou combinaison. Les art. 71a–d OAMal prévoient des exceptions sous conditions, notamment un bénéfice élevé attendu dans une maladie grave sans alternative efficace autorisée et admise dans la LS. Le dossier est examiné avec l’assureur ; la gravité seule ne garantit pas l’acceptation.</p><div class="lab">Limite explicite</div><p>La limitation LS individuelle 2026 d’Adcetris/Elzonris n’a pas été vérifiée ici. La remarque SZO 2021 sur la garantie de prise en charge est conservée comme historique et ne devient pas une réponse de remboursement actuelle. La décision d’accès est documentée avant d’engager une stratégie hors indication ou hors limitation lorsque la procédure le requiert.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669340018" target="_blank" rel="noopener">[S222] FI suisse Oncaspar, septembre 2025, AIPS via AmiKo</a> ; <a href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S224] OFSP, liste des spécialités</a> ; <a href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S225] OFSP, cas particuliers, art. 71a–d OAMal</a>.</p></template>
<template data-pop="c86-lacunes" data-title="Portée de cette révision et limites restantes"><div class="lab">Points complétés</div><p>Les traitements initiaux du SPTCL sans HLH, son différentiel lupique, les critères HLH-2004 et leurs limites adultes, la clinique et le bilan de RCD-II/EATL, les critères OMS de BPDCN, les précautions de trois FI suisses et les repères adultes HUG ont été documentés par des passages lus. Les deux figures originales ont une provenance et une licence vérifiées ; les légendes précisent les limites des cas illustrés.</p><div class="lab">Limites qui demeurent</div><p>Il n’existe pas dans ce dossier d’incidence suisse contemporaine par sous-code C86.x. La correspondance de codage repose sur CIM-10-GM 2024 ; elle ne certifie pas toutes les règles de codage/facturation 2026. L’ICC original n’a pas été relu intégralement. Certaines publications sont des séries sélectionnées ou des consensus anciens. Le résumé Gayden 2018 est identifié comme tel ; ses méthodes complètes ne sont pas prétendues lues.</p><div class="lab">Prescription et accès</div><p>Les trois FI principales sont détaillées sur leurs rubriques utiles ; ce cours ne reproduit pas tous les protocoles cytotoxiques ni toutes les interactions possibles. La disponibilité suisse de la crisantaspase, les indications suisses de plusieurs traitements de rechute et les limitations LS individualisées restent à vérifier. Les doses de LLA d’Oncaspar ne deviennent pas des doses d’ENKTL.</p><div class="lab">Méthode</div><p>Les repères HUG sont un enseignement adulte daté de 2019, pas une norme nationale universelle. Les rapprochements avec PROFILES sont pédagogiques, sans prédiction des examens. Les contrôles de structure, d’images et de navigation et les auto-relectures par l’auteur ne constituent pas une validation médicale humaine. Toute correction ultérieure doit renouveler les preuves affectées.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S203] Khoury et al., OMS myéloïde/dendritique 2022</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1111/ddg.14706" target="_blank" rel="noopener">[S218] S2k lymphomes cutanés 2021, publié 2022</a> ; <a href="https://ashpublications.org/blood/article/133/23/2465/273833/Recommendations-for-the-management-of" target="_blank" rel="noopener">[S215] La Rosée et al., HLH adulte, 2019</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S223] HUG, enseignement hémogramme adulte, septembre 2019</a>.</p></template>
<template data-pop="pareto-c86-definition" data-title="Pareto — Définition, classifications et épidémiologie"><p class="ratio" data-cover="c86-1,c86-2"></p><ul><li>C86 comporte sept sous-codes et plusieurs entités ; C86.4 inclut une néoplasie dendritique, C86.6 LyP et pcALCL.</li><li>OMS/ICC décrivent la biologie ; le codage CIM historique ne remplace pas le diagnostic.</li><li>La proportion suisse de 10–15 % provient d’une revue 2021 citant NICER ; pas d’incidence suisse actuelle par sous-code établie ici.</li><li>Les risques thiopurine cités concernent les hommes <35 ans, sans horizon annuel précisé.</li></ul><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">[S210] BfArM, CIM-10-GM 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S203] Khoury et al., OMS myéloïde/dendritique 2022</a> ; <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">[S209] Zander et Renner, revue suisse SZO 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6624667/" target="_blank" rel="noopener">[S211] Carvão et al., revue de cas Crohn/HSTL, 2019</a>.</p></template>
<template data-pop="pareto-c86-mecanismes" data-title="Pareto — Physiopathologie et facteurs de risque"><p class="ratio" data-cover="c86-3,c86-4"></p><ul><li>ENKTL : EBV tissulaire, destruction locale et résistance aux anthracyclines ; asparaginase selon protocole.</li><li>HAVCR2/TIM-3 peut contribuer au SPTCL/HLH dans certaines populations ; fréquence et risque ne sont pas universels.</li><li>TET2/DNMT3A puis RHOA/IDH2 organisent un modèle TFH, sans imposer un traitement depuis une mutation seule.</li><li>Un facteur de risque oriente une recherche ; il ne prouve pas une causalité individuelle ni un arrêt médicamenteux automatique.</li></ul><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">[S212] Moonla et al., Haematologica 2023</a> ; <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6624667/" target="_blank" rel="noopener">[S211] Carvão et al., revue de cas Crohn/HSTL, 2019</a>.</p></template>
<template data-pop="pareto-c86-clinique" data-title="Pareto — Anamnèse et examen"><p class="ratio" data-cover="c86-5,c86-6"></p><ul><li>Relier siège, chronologie et gravité : nez, rate–foie–moelle, intestin, hypoderme, peau ou ganglion.</li><li>L’absence de ganglion n’exclut pas HSTL ; la régression répétée des papules oriente vers LyP.</li><li>Documenter lésions, cytopénies, fièvre et traitements ; choisir un tissu représentatif.</li><li>Un signe clinique ou un marqueur isolé ne remplace pas la confrontation spécialisée.</li></ul><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6624667/" target="_blank" rel="noopener">[S211] Carvão et al., revue de cas Crohn/HSTL, 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a>.</p></template>
<template data-pop="pareto-c86-diagnostic" data-title="Pareto — Diagnostic et urgences"><p class="ratio" data-cover="c86-7,c86-8"></p><ul><li>Prélèvement adapté et relecture experte ; panel et morphologie intégrés, clonalité seule insuffisante.</li><li>Bilan systémique différent de celui d’une LyP typique ; moelle et TEP ne sont pas automatiques pour tout C86.</li><li>HLH : fonctions vitales, déclencheur et immunomodulation en parallèle si gravité ; ne pas attendre un signe unique.</li><li>Obstruction respiratoire, complication digestive et toxicités graves exigent une réponse urgente.</li></ul><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a>.</p></template>
<template data-pop="pareto-c86-prise-en-charge" data-title="Pareto — Traitement, suivi et prévention"><p class="ratio" data-cover="c86-9,c86-10"></p><ul><li>ENKTL : pas de CHOP ; radiothérapie et asparaginase selon stade/aptitude, radiothérapie seule possible dans certaines situations localisées.</li><li>HSTL : induction et greffe précoce, préférentiellement allogénique ; EATL : autogreffe possible, sans donneur.</li><li>SPTCL sans HLH : immunosuppression possible ; LyP : contrôle des lésions et suivi à vie, pas de polychimiothérapie.</li><li>L’arrêt du suivi PTCL à 3/5 ans ne concerne que les asymptomatiques restant en rémission complète ; pas toute la famille.</li></ul><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(19)31693-X/fulltext" target="_blank" rel="noopener">[S205] ESMO, lymphomes cutanés, 2018</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1111/ddg.14706" target="_blank" rel="noopener">[S218] S2k lymphomes cutanés 2021, publié 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a>.</p></template>
<template data-pop="pareto-c86-criteres" data-title="Pareto — Critères et situations particulières"><p class="ratio" data-cover="c86-11,c86-12"></p><ul><li>Les panels ENKTL, TFH et BPDCN s’interprètent avec le tissu ; deux marqueurs ne font pas tout le diagnostic.</li><li>RCD-II : symptômes/atrophie après ≥12 mois de régime strict, autres causes exclues, cytométrie et clonalité adaptées.</li><li>Albumine Elzonris : ≥3,2 g/dL avant première dose ; seuils d’action sous traitement distincts.</li><li>PROFILES 2017/265 SSP est le cadre de l’examen 2026 ; PROFILES 2 devient celui de l’examen 2028.</li></ul><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S203] Khoury et al., OMS myéloïde/dendritique 2022</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1002/ueg2.70195" target="_blank" rel="noopener">[S214] ESsCD 2025, partie 2 publiée en 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">[S229] OFSP/MEBEKO, exigences examen 2026, §2</a> ; <a href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" target="_blank" rel="noopener">[S230] Swiss Medical Weekly 2025, transition PROFILES 2</a>.</p></template>
<template data-pop="pareto-c86-examens" data-title="Pareto — Examens"><p class="ratio" data-cover="c86-e-1,c86-e-2,c86-e-3,c86-e-4,c86-e-5"></p><ul><li>Séparer référence de laboratoire, seuil diagnostique et seuil d’action thérapeutique.</li><li>EBER tissulaire et ADN d’EBV plasmatique répondent à deux questions complémentaires.</li><li>CD30 ≥75 % pour le critère pcALCL et ≥10 % à l’inclusion d’ECHELON-2 ne sont pas interchangeables.</li><li>Une TEP négative ne remplace pas les prélèvements indiqués ; une capsule ne biopsie pas et peut être retenue.</li></ul><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S223] HUG, enseignement hémogramme adulte, septembre 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">[S207] Kempf et al., EORTC/ISCL/USCLC 2011</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.thieme-connect.com/products/ejournals/html/10.1055/a-1973-3796" target="_blank" rel="noopener">[S231] ESGE, vidéocapsule, mise à jour 2022</a>.</p></template>
<template data-pop="pareto-c86-semio" data-title="Pareto — Sémiologie fondamentale"><p class="ratio" data-cover="c86-s-semio-cours"></p><ul><li>Fonction normale → perturbation → signe → examen → interprétation : expliciter chaque étape.</li><li>Ulcération, cytopénie et papule régressive ont des mécanismes et des diagnostics alternatifs.</li><li>Le seuil biologique ne prend sens qu’avec son unité, sa population et sa finalité.</li><li>La gravité peut imposer une prise en charge avant le résultat complet.</li></ul><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S223] HUG, enseignement hémogramme adulte, septembre 2019</a>.</p></template>
<template data-pop="pareto-c86-anat" data-title="Pareto — Anatomie"><p class="ratio" data-cover="c86-s-anat-cours"></p><ul><li>Les organes lymphoïdes organisent le contact entre cellules et antigènes ; sang et lymphe ne sont pas le même compartiment.</li><li>Le territoire atteint guide un prélèvement suffisamment profond et représentatif.</li><li>Les figures originales illustrent des sites et des architectures ; elles ne sont pas un test diagnostique.</li></ul><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">[S226] OpenStax A&P 2e, anatomie lymphatique normale, §21.1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a>.</p></template>
<template data-pop="pareto-c86-histo" data-title="Pareto — Histologie"><p class="ratio" data-cover="c86-s-histo-cours"></p><ul><li>Architecture, morphologie, phénotype et contexte sont complémentaires.</li><li>Une tumeur T peut perdre des marqueurs ; un clone réactif peut être détecté.</li><li>TFH, pDC, NK et T alpha-bêta/gamma-delta ne se définissent pas par un seul marqueur.</li><li>Un petit prélèvement peut permettre une catégorie sans autoriser un sous-type architectural précis.</li></ul><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S203] Khoury et al., OMS myéloïde/dendritique 2022</a>.</p></template>
<template data-pop="pareto-c86-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="c86-s-physio-cours"></p><ul><li>Expansion clonale, coopération, cytotoxicité et régulation sont des fonctions normales.</li><li>L’hyperinflammation et les anomalies du microenvironnement expliquent des signes au-delà de la seule masse tumorale.</li><li>Un Coombs positif ne prouve pas seul une hémolyse ; une hypergammaglobulinémie polyclonale n’est pas un myélome.</li></ul><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-3-the-adaptive-immune-response-t-lymphocytes-and-their-functional-types" target="_blank" rel="noopener">[S227] OpenStax A&P 2e, fonctions T normales, §21.3</a> ; <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S223] HUG, enseignement hémogramme adulte, septembre 2019</a>.</p></template>
<template data-pop="pareto-c86-bio" data-title="Pareto — Biochimie"><p class="ratio" data-cover="c86-s-bio-cours"></p><ul><li>Déplétion extracellulaire en asparagine et capacité de synthèse limitée expliquent une vulnérabilité tumorale.</li><li>Dose administrée, activité enzymatique et réponse ne sont pas identiques.</li><li>LDH, ferritine et albumine sont des marqueurs contextuels, non spécifiques.</li><li>Convertir correctement : 3,2 g/dL =32 g/L ; µg et mg diffèrent d’un facteur 1 000.</li></ul><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">[S204] Tse et al., ENKTL, 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669340018" target="_blank" rel="noopener">[S222] FI suisse Oncaspar, septembre 2025, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://ard.bmj.com/content/82/10/1271" target="_blank" rel="noopener">[S216] EULAR/ACR 2022, publié 2023</a>.</p></template>
<template data-pop="pareto-c86-gen" data-title="Pareto — Génétique"><p class="ratio" data-cover="c86-s-gen-cours"></p><ul><li>Constitutionnel, somatique et clonal décrivent trois notions différentes.</li><li>HAVCR2 est associé au HLH dans certaines cohortes ; un odds ratio n’est pas un risque absolu.</li><li>Les mutations TFH et DUSP22 doivent rester attachées à leur tissu et leur entité.</li><li>Une cible biologique ne constitue pas à elle seule une indication thérapeutique.</li></ul><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://www.nature.com/articles/s41375-022-01620-2" target="_blank" rel="noopener">[S202] Alaggio et al., OMS lymphoïde 2022</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">[S212] Moonla et al., Haematologica 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">[S206] OMS–EORTC 2018, publié 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a>.</p></template>
<template data-pop="pareto-c86-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="c86-p-1,c86-p-2,c86-p-3,c86-p-4"></p><ul><li>Distinguer mécanisme, preuve par sous-type, autorisation suisse et remboursement.</li><li>Adcetris : bléomycine contre-indiquée ; pas de vincristine dans BV-CHP ; adaptations selon schéma.</li><li>Elzonris : premier cycle hospitalier, surveillance avant doses et algorithme de fuite capillaire.</li><li>Oncaspar : FI LLA ; emploi ENKTL hors indication et dose de protocole distincte.</li></ul><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://amiko.oddb.org/fr/fi?gtin=7680621320010" target="_blank" rel="noopener">[S220] FI suisse Adcetris, juin 2025, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680687970013" target="_blank" rel="noopener">[S221] FI suisse Elzonris, novembre 2022, AIPS via AmiKo</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669340018" target="_blank" rel="noopener">[S222] FI suisse Oncaspar, septembre 2025, AIPS via AmiKo</a> ; <a href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S224] OFSP, liste des spécialités</a> ; <a href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S225] OFSP, cas particuliers, art. 71a–d OAMal</a>.</p></template>
<template data-pop="c86-mnemo" data-title="Sous-code et siège : une aide, pas une définition"><div class="lab">Aide pédagogique</div><table class="t"><thead><tr><th>Sous-code</th><th>Siège souvent évocateur</th><th>Entité</th></tr></thead><tbody><tr><td>0</td><td>Nez et autres territoires extranodaux</td><td>ENKTL</td></tr><tr><td>1</td><td>Foie, rate et moelle</td><td>HSTL</td></tr><tr><td>2</td><td>Intestin grêle</td><td>EATL</td></tr><tr><td>3</td><td>Hypoderme</td><td>SPTCL</td></tr><tr><td>4</td><td>Peau, sang/moelle et autres sites</td><td>BPDCN</td></tr><tr><td>5</td><td>Ganglion et manifestations systémiques</td><td>nTFHL-AI</td></tr><tr><td>6</td><td>Peau</td><td>LyP et pcALCL</td></tr></tbody></table><p>Ce repère créé pour apprendre ne remplace ni la classification ni le bilan d’extension. Une localisation inhabituelle n’exclut pas l’entité.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">[S210] BfArM, CIM-10-GM 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S203] Khoury et al., OMS myéloïde/dendritique 2022</a>.</p></template>
<template data-pop="c86-profils" data-title="PROFILES suisse : version et passage de la plainte à la démarche"><div class="lab">Cadre 2026</div><p>Les exigences MEBEKO pour l’examen fédéral 2026 renvoient à 265 situations PROFILES. La publication Swiss Medical Weekly 2025 annonce PROFILES 2 pour l’enseignement dès 2025/26 et pour l’examen fédéral dès 2028. Ne pas fusionner les numérotations.</p><div class="lab">SSP 2 : adénopathie, PROFILES 2017</div><p>Une personne consulte pour un ganglion augmenté. L’objectif est d’évaluer durée, localisation, signes généraux, exposition, gravité et indications de prélèvement. C86 fournit une partie du diagnostic différentiel, pas une liste officielle de maladies attachées à cette SSP. Un ganglion absent n’exclut pas un lymphome extranodal tel HSTL.</p><div class="lab">Autres entrées lues</div><p>SSP 4 fatigue ; 6 fièvre ; 16 perte de poids/dénutrition ; 21 épistaxis ; 25 lésions de la bouche/gorge ; 88 ecchymoses/purpura ; 93 papules, ulcères, nécrose et tumeurs cutanées ; 159 histologie, cytologie et génétique moléculaire anormales ; 227 évaluation partagée des risques et facteurs protecteurs, notamment oncologiques. Le lien pédagogique passe par la sémiologie, les examens justifiés et l’orientation, avec prise en compte des préférences et de la compréhension du patient.</p><p class="src">Sources, passages consultés le 2 novembre 2026 : <a href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S228] CIMS, PROFILES 2017, SSP</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">[S229] OFSP/MEBEKO, exigences examen 2026, §2</a> ; <a href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" target="_blank" rel="noopener">[S230] Swiss Medical Weekly 2025, transition PROFILES 2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12059256/" target="_blank" rel="noopener">[S201] ESMO–EHA 2025, lymphomes T/NK</a>.</p></template>
