pt-inr">PT</button> explore un temps de coagulation ; le fibrinogène renseigne un substrat de la fibrine ; les D-dimères témoignent de la dégradation de fibrine réticulée. Ces informations sont complémentaires et doivent garder leurs unités et leurs références.</p><p>L’examen du frottis répond à une question morphologique. La recherche d’une souffrance rénale, respiratoire, circulatoire ou neurologique répond à une question d’organe. La recherche du foyer infectieux ou d’une cause tumorale répond à une question causale. Demander plusieurs examens n’a d’intérêt que si chaque résultat peut être relié à une hypothèse ou à une décision.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/laboratoire-hemostase/analyses-routine" target="_blank" rel="noopener">[S705] Laboratoire d’hémostase : analyses de routine</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a>.</p></div></section><section class="ilot" id="d65-semio-interpretation" data-semiology="interpretation"><h3>L’interprétation : le temps fait partie de la valeur</h3><p>Un résultat obtenu après transfusion de plaquettes, apport de fibrinogène ou administration d’un anticoagulant ne décrit pas l’état initial. La date et l’heure du prélèvement, les produits et les doses reçus doivent être rapprochés du résultat. Une hausse transitoire d’un paramètre après substitution ne prouve pas que la consommation est arrêtée.</p><p>Comparer les tendances dans une méthode cohérente évite de confondre une différence technique avec une aggravation clinique. Le score <button class="w" data-k="d65-sources">ISTH</button> utilise le <button class="w" data-k="d65-pt-inr">PT</button> en secondes au-delà du témoin, alors que le <button class="w" data-k="d65-sic">SIC</button> utilise le <button class="w" data-k="d65-pt-inr">PT</button>-<button class="w" data-k="d65-pt-inr">INR</button>. Les D-dimères sont rapportés à une limite supérieure de méthode. L’arithmétique correcte ne compense pas une unité ou une population incorrecte.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://www.hug.ch/laboratoire-hemostase/analyses-routine" target="_blank" rel="noopener">[S705] Laboratoire d’hémostase : analyses de routine</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S715] Technique clinique : transfusions de produits sanguins labiles</a>.</p></div></section><section class="ilot" id="d65-semio-differentials" data-semiology="differentials"><h3>Les diagnostics concurrents : distinguer sans exclure les associations</h3><p>Des schizocytes orientent vers une fragmentation des hématies, mais peuvent se rencontrer dans plusieurs processus. Une microangiopathie thrombotique exige une démarche spécifique et parfois urgente ; sa présence ne se déduit pas d’une image de cours. Une atteinte rénale ne permet pas d’écarter arbitrairement le purpura thrombotique thrombocytopénique.</p><p>Un défaut de synthèse hépatique, une perte sanguine importante, une dilution ou l’effet d’un médicament peuvent produire une partie des anomalies. Ils peuvent aussi coexister avec une <button class="w" data-k="d65-classification">CIVD</button>. La bonne question n’est donc pas toujours de choisir un seul nom : il faut déterminer quels mécanismes sont présents et lesquels changent la conduite immédiate.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/430207/3709751/RMS_607_1021.pdf" target="_blank" rel="noopener">[S711] Anémies hémolytiques et cancers</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S713] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680462400506" target="_blank" rel="noopener">[S709] Héparine Bichsel 417/1000/5000 UI/mL</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a>.</p></div></section><section class="ilot" id="d65-semio-urgency" data-semiology="urgency"><h3>L’urgence : reconnaître une décision qui ne peut attendre</h3><p>Une hémorragie menaçante, un choc, un purpura rapidement extensif, une détresse respiratoire ou une altération neurologique imposent une évaluation urgente. Le score aide à structurer le diagnostic mais ne doit pas retarder le soutien des organes ni le traitement d’une cause évidente. Une phase précoce peut ne pas remplir les critères d’une <button class="w" data-k="d65-classification">CIVD</button> manifeste.</p><p>La filière dépend du contexte : infection et contrôle d’un foyer, traumatisme, complication obstétricale ou urgence hématologique. Une suspicion de leucémie promyélocytaire ne suit pas un simple calendrier de recontrôle ambulatoire. Les responsabilités et les délais d’action doivent être explicites, tandis que les prescriptions restent liées au protocole spécialisé.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener">[S706] Surviving Sepsis Campaign : recommandations 2026</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S712] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S714] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S713] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div></section><section class="ilot" id="d65-semio-limits" data-semiology="limits"><h3>Les limites : ce qu’un signe ou un score ne certifie pas</h3><p>Une numération ne mesure pas toute la fonction plaquettaire ; un <button class="w" data-k="d65-pt-inr">PT</button> ne mesure pas à lui seul toute l’hémostase ; un D-dimère élevé n’est pas spécifique de <button class="w" data-k="d65-classification">CIVD</button>. Un fibrinogène encore normal peut refléter un équilibre temporaire entre synthèse et consommation. Une valeur obtenue après traitement doit être interprétée comme telle.</p><p>Les sources lues ne permettent pas de donner une fréquence suisse de chaque signe ni une sensibilité individuelle fiable pour cette catégorie de cours. Les images du normal illustrent des structures ; elles ne prouvent ni n’excluent une maladie. La couverture des rubriques pédagogiques ne constitue pas une certification médicale humaine du contenu.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">[S719] Human blood smear — Кров людини</a> ; <a data-reference-source="1" href="https://wellcomecollection.org/works/uuk6yhjd" target="_blank" rel="noopener">[S725] SEM of platelets and red blood corpuscle</a>.</p></div></section><section class="ilot" id="d65-semio-sources" data-semiology="sources"><h3>Les sources : relier la décision à sa population</h3><p>Le cadre biologique et diagnostique s’appuie sur la communication <button class="w" data-k="d65-sources">ISTH</button> 2025, la revue 2025 et le laboratoire suisse. Les décisions thérapeutiques sont confrontées aux fiches suisses datées et aux recommandations de chaque contexte. Les textes de sepsis, de traumatisme, de péripartum et de leucémie promyélocytaire ne sont pas des protocoles interchangeables.</p><p>Le seuil de fibrinogène du score ne devient pas une cible de traitement. Une recommandation prophylactique ne devient pas une indication curative. Les articles ou images non accessibles ne sont pas comptés comme lus ; les réemplois de lectures antérieures sont attribués. Les liens ci-dessous donnent des références directes, avec les limites détaillées dans la fenêtre des sources.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://www.hug.ch/laboratoire-hemostase/analyses-routine" target="_blank" rel="noopener">[S705] Laboratoire d’hémostase : analyses de routine</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680469280019" target="_blank" rel="noopener">[S708] Kybernin P 500/1000</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680462400506" target="_blank" rel="noopener">[S709] Héparine Bichsel 417/1000/5000 UI/mL</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S710] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener">[S706] Surviving Sepsis Campaign : recommandations 2026</a>.</p></div></section><figure id="d65-causal-semio"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="550" viewBox="0 0 580 550" role="img" aria-label="De la science à la décision"><title>De la science à la décision</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="66" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Régulation hémostatique perturbée</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="182" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Saignement et/ou souffrance</tspan><tspan x="290" dy="29">d’organe</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="326" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Examens datés et cause recherchée</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="456" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Action adaptée puis réévaluation</tspan></text></svg><figcaption><b>De la science à la décision.</b> Les observations restent contextualisées ; aucun signe isolé ne remplace cette démarche. Schéma causal non anatomique ; aucune structure du corps dessinée.</figcaption></figure><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a>.</p></div><div class="key"><p><b>Science → clinique.</b> Relier saignement et souffrance d’organe aux mécanismes possibles.</p><p><b>Science → examen.</b> Comparer des mesures datées, avec unités et références cohérentes.</p><p><b>Science → traitement.</b> Agir sur l’urgence et la cause ; ne pas attendre un score complet.</p><p><b>À retenir.</b> Relier mécanisme, mesure et décision sans dépasser la preuve.</p></div><button class="pareto-btn ui" data-k="pareto-d65-semio">▲ Loi de Pareto — Sémiologie fondamentale et analytique</button></div><div class="sci" id="d65-s-anat" role="tabpanel" aria-labelledby="d65-tab-anat" hidden><section class="ilot" id="d65-s-anat-cours"><h3>La circulation : une interface entre sang et tissus</h3>
<p>Le sang doit rester mobile dans les vaisseaux pour apporter aux tissus ce dont ils ont besoin. L’endothélium tapisse cette interface et participe à la régulation de la coagulation, de l’inflammation et des échanges. Une lésion locale doit déclencher une réponse limitée ; une activation diffuse de cette interface peut modifier les propriétés du sang sur une grande surface.</p>
<p>Dans la <button class="w" data-k="d65-classification">CIVD</button>, les dépôts de plaquettes et de fibrine peuvent toucher la microcirculation de plusieurs organes. L’atteinte rénale peut se manifester par une diminution des urines ; l’atteinte pulmonaire par une hypoxémie ; une atteinte cérébrale par une altération de la conscience. Ces associations expliquent ce qu’il faut surveiller, mais ne prouvent pas que chaque signe résulte exclusivement d’un thrombus. L’inflammation, l’état circulatoire et la maladie causale interviennent aussi.</p>
<p>La taille du vaisseau et la localisation du processus déterminent ce qui peut être observé. Un microthrombus n’est pas directement visible à l’examen de la peau ; une cyanose ou une nécrose est une conséquence tissulaire. Un prélèvement sanguin explore des éléments circulants, tandis qu’une image d’organe répond à une autre question. Le raisonnement doit relier les échelles sans prétendre que l’une photographie directement l’autre.</p>
<figure id="d65-science-sem" data-origin="human-original"><img src="assets/img/d65/alpha/codex/platelets-rbc-wellcome.jpg" alt="Micrographie électronique en noir et blanc montrant un disque érythrocytaire concave et un groupe de plaquettes avec une échelle originale de dix micromètres" loading="lazy"><figcaption><b>Une hématie et des plaquettes en microscopie électronique.</b> Crédit : David Gregory et Debbie Marshall / Wellcome Collection. <a href="https://wellcomecollection.org/works/uuk6yhjd" target="_blank" rel="noopener">Provenance originale</a> ; <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels intacts. <a href="#d65-science-sem-annotations">Lire les quatre repères français ci-dessous</a>.</figcaption></figure><div class="key" id="d65-science-sem-annotations" role="note"><p><b>Lecture annotée de l’original.</b> <b>Repère 1, disque inférieur gauche :</b> hématie dont la concavité se voit sur cette préparation. <b>Repère 2, amas central et droit :</b> éléments plaquettaires de formes irrégulières. <b>Repère 3, contours des plaquettes :</b> reliefs et prolongements visibles ; leur aspect ne quantifie pas une activation chez un patient. <b>Repère 4, barre inférieure :</b> échelle originale de 10 µm. Il s’agit d’une image de structures sanguines, sans diagnostic de <button class="w" data-k="d65-classification">CIVD</button> ni mesure de coagulation. Le statut clinique du sujet n’est pas établi par cette notice.</p></div>
<p>La micrographie montre une hématie et un groupe de plaquettes. Elle aide à distinguer des éléments figurés et à comprendre qu’une surface cellulaire participe à l’hémostase. Elle ne montre pas une paroi vasculaire ni une <button class="w" data-k="d65-classification">CIVD</button>. Aucun chiffre de concentration, aucune activité plaquettaire et aucun degré d’obstruction ne peuvent être calculés à partir de cette image de préparation.</p>
<p>Cette limite a une conséquence thérapeutique : le traitement doit agir sur la maladie et sur ses conséquences fonctionnelles. Remplacer un facteur peut corriger un déficit mesuré, mais ne retire pas la cause d’activation endothéliale. Soutenir la perfusion peut être nécessaire alors même que le laboratoire montre une amélioration partielle. Les compartiments sanguin, vasculaire et tissulaire doivent rester distingués dans le suivi.</p>
<p>La carte clinique se construit donc avec plusieurs observations : circulation périphérique, respiration, fonction rénale, état neurologique et hémostase. Aucune représentation anatomique inventée n’est utilisée pour simuler une preuve d’organe ; la figure originale sert à comprendre les éléments visibles, et les mécanismes sont expliqués dans le texte.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S717] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://wellcomecollection.org/works/uuk6yhjd" target="_blank" rel="noopener">[S725] SEM of platelets and red blood corpuscle</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Les conséquences dépendent des organes et de la microcirculation atteints.</p><p><b>Science → examen.</b> Un prélèvement sanguin et une exploration d’organe répondent à des questions distinctes.</p><p><b>Science → traitement.</b> Traiter la cause et soutenir les organes en parallèle des corrections biologiques.</p><p><b>À retenir.</b> Relier mécanisme, mesure et décision sans dépasser la preuve.</p></div><button class="pareto-btn ui" data-k="pareto-d65-anat">▲ Loi de Pareto — Anatomie</button></div><div class="sci" id="d65-s-histo" role="tabpanel" aria-labelledby="d65-tab-histo" hidden><section class="ilot" id="d65-s-histo-cours"><h3>Du frottis aux dépôts : voir une structure ne suffit pas à nommer une maladie</h3>
<p>Un frottis sanguin étale les cellules sur une lame pour permettre leur observation. La forme et la répartition des hématies, l’aspect des autres éléments et la qualité de la préparation contribuent à l’interprétation. La numération et la morphologie répondent à des questions différentes : une image n’est pas une concentration, et une concentration ne décrit pas toutes les formes cellulaires.</p>
<p>Dans certaines <button class="w" data-k="d65-classification">CIVD</button>, la circulation à travers des zones pathologiques peut s’accompagner d’une fragmentation des hématies. Les schizocytes sont alors un indice de destruction mécanique. Ils ne sont pas spécifiques de la <button class="w" data-k="d65-classification">CIVD</button> et doivent conduire à considérer une microangiopathie thrombotique ainsi que les autres mécanismes pertinents. Le nombre, la méthode d’évaluation et la cohérence clinique relèvent de l’examen réel du patient.</p>
<figure id="d65-science-blood" data-origin="human-original"><img src="assets/img/d65/alpha/codex/normal-peripheral-blood.jpg" alt="Champ large de frottis sanguin humain avec disques rouges et barre originale de cent micromètres" loading="lazy"><figcaption><b>Le frottis sanguin humain : voir sans surinterpréter.</b> Crédit : Степанюк Ярослав et Борис Максим, Wikimedia Commons. <a href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">Provenance originale</a> ; <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels intacts. <a href="#d65-science-blood-annotations">Lire les quatre repères français ci-dessous</a>.</figcaption></figure><div class="key" id="d65-science-blood-annotations" role="note"><p><b>Lecture annotée de l’original.</b> <b>Repère 1, disques rouges :</b> hématies réparties sur la lame. <b>Repère 2, centres plus clairs :</b> contraste visible de nombreuses cellules, sans mesure individuelle. <b>Repère 3, zones denses et espacées :</b> distribution variable sur la préparation ; elle ne donne pas la numération du patient. <b>Repère 4, haut gauche :</b> barre originale de 100 µm. Ce faible grossissement ne permet pas de certifier une absence de schizocytes. Cette image illustrative ne prouve ni n’exclut une <button class="w" data-k="d65-classification">CIVD</button>. Le statut clinique du sujet n’est pas établi par cette notice.</p></div>
<p>Le champ normal présenté ici est large. On y voit de nombreux disques érythrocytaires et une échelle originale, mais ce grossissement ne permet pas de certifier l’absence de rares anomalies. La légende ne désigne donc aucun schizocyte imaginaire et ne transforme pas cette photographie en image diagnostique de <button class="w" data-k="d65-classification">CIVD</button>. Les variations de densité sur la lame ne donnent pas la concentration sanguine du sujet.</p>
<p>La revue 2025 rapporte des constatations de dépôts microvasculaires de plaquettes et de fibrine dans des contextes cliniques, autopsiques ou expérimentaux. Ce niveau de preuve décrit une réalité physiopathologique ; il n’impose pas une biopsie à chaque patient suspect de <button class="w" data-k="d65-classification">CIVD</button>. Le diagnostic clinique s’appuie sur la cause, les signes et les examens appropriés, avec une attention particulière aux risques des gestes invasifs.</p>
<p>Il faut ainsi distinguer le matériel observé : le frottis montre des éléments circulants ; une coupe tissulaire peut montrer l’architecture et des dépôts ; un dosage décrit un paramètre dans un échantillon. Ces méthodes se complètent, mais elles ne peuvent pas être substituées les unes aux autres. Une micrographie du normal est utile pour apprendre la morphologie tout en restant limitée dans sa portée diagnostique.</p>
<p>La conséquence pratique est simple : décrire ce qui est réellement visible, puis préciser ce qui reste une hypothèse. Cette discipline évite de faire confirmer un diagnostic par une image qui ne le démontre pas et permet de choisir l’examen suivant pour la bonne question.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">[S719] Human blood smear — Кров людини</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/430207/3709751/RMS_607_1021.pdf" target="_blank" rel="noopener">[S711] Anémies hémolytiques et cancers</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S712] Akute Promyelozyten Leukämie (APL) — Onkopedia</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Une fragmentation érythrocytaire est un indice, pas un diagnostic unique.</p><p><b>Science → examen.</b> Décrire le frottis réel et rechercher les diagnostics concurrents.</p><p><b>Science → traitement.</b> La décision spécialisée ne se fonde pas sur une photographie normale de cours.</p><p><b>À retenir.</b> Relier mécanisme, mesure et décision sans dépasser la preuve.</p></div><button class="pareto-btn ui" data-k="pareto-d65-histo">▲ Loi de Pareto — Histologie</button></div><div class="sci" id="d65-s-phys" role="tabpanel" aria-labelledby="d65-tab-phys" hidden><section class="ilot" id="d65-s-phys-cours"><h3>Physiologie : produire assez de thrombine, puis limiter la réaction</h3>
<p>La coagulation normale est une succession de réactions enzymatiques organisée sur des surfaces cellulaires. Le complexe du facteur tissulaire et du facteur VII activé initie la réaction. Les complexes ténase et prothrombinase amplifient ensuite la génération de thrombine. Le calcium et les surfaces phospholipidiques participent à cette organisation ; une simple liste de numéros de facteurs ne rend pas compte de cette localisation.</p>
<p>La thrombine transforme le fibrinogène en fibrine et active le facteur XIII, qui stabilise le réseau. Elle renforce aussi la réaction par des boucles d’amplification. Cette puissance explique l’efficacité de l’hémostase à une brèche, mais aussi la gravité d’une activation diffuse lorsqu’elle n’est plus suffisamment contrôlée.</p>
<p>Trois grands mécanismes anticoagulants sont décrits dans la revue : l’antithrombine, le système protéine C–thrombomoduline et l’inhibiteur de la voie du facteur tissulaire. Ils agissent sur des étapes différentes. Leur fonctionnement dépend aussi de l’environnement endothélial. Dans la <button class="w" data-k="d65-classification">CIVD</button>, la consommation, la dégradation et l’atteinte de ces surfaces peuvent réduire leur efficacité.</p>
<p>La fibrinolyse contribue à remodeler le réseau de fibrine. Le plasminogène est activé en plasmine ; des activateurs et des inhibiteurs règlent cette réaction. La prédominance d’un frein de fibrinolyse favorise la persistance des dépôts, tandis qu’une activation excessive peut contribuer au saignement. Ces mécanismes ne s’excluent pas dans le temps : leur balance peut changer avec l’évolution de la maladie.</p>
<figure id="d65-causal-phys"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="550" viewBox="0 0 580 550" role="img" aria-label="L’équilibre hémostatique normal"><title>L’équilibre hémostatique normal</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="52" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Lésion localisée et activation sur</tspan><tspan x="290" dy="29">surfaces</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="196" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Thrombine puis fibrine stabilisée</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="312" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Freins anticoagulants et</tspan><tspan x="290" dy="29">fibrinolyse régulée</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Caillot utile sans extension</tspan><tspan x="290" dy="29">diffuse</tspan></text></svg><figcaption><b>L’équilibre hémostatique normal.</b> Le schéma représente des relations fonctionnelles, pas une structure anatomique ; la <button class="w" data-k="d65-classification">CIVD</button> perturbe leur régulation et leur localisation. Schéma causal non anatomique ; aucune structure du corps dessinée.</figcaption></figure>
<p>Un résultat de laboratoire est une observation partielle de cet équilibre. Le fibrinogène peut être produit et consommé simultanément ; les plaquettes peuvent être consommées, remplacées et dysfonctionnelles à des degrés variables. Un chiffre normal n’est donc pas une photographie complète de la régulation. La tendance et le contexte restent nécessaires.</p>
<p>Sur le plan thérapeutique, fournir un substrat, freiner une enzyme et inhiber la fibrinolyse sont trois actions différentes. Le mécanisme seul ne prouve pas qu’un médicament améliore le résultat clinique. Il faut aussi une indication, une population étudiée, une balance de risques et une surveillance. C’est précisément pourquoi les produits de l’onglet pharmacologie ne sont pas proposés comme une série à administrer à tous les patients.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis" target="_blank" rel="noopener">[S718] 18.5 Hemostasis  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680469280019" target="_blank" rel="noopener">[S708] Kybernin P 500/1000</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680462400506" target="_blank" rel="noopener">[S709] Héparine Bichsel 417/1000/5000 UI/mL</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S710] Tranexamic Acid Leman, solution injectable 100 mg/mL</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Thrombose et saignement peuvent résulter du même dérèglement.</p><p><b>Science → examen.</b> Le profil et sa tendance renseignent davantage qu’un paramètre isolé.</p><p><b>Science → traitement.</b> Substitution, anticoagulation et antifibrinolyse ont des buts différents.</p><p><b>À retenir.</b> Relier mécanisme, mesure et décision sans dépasser la preuve.</p></div><button class="pareto-btn ui" data-k="pareto-d65-phys">▲ Loi de Pareto — Physiologie</button></div><div class="sci" id="d65-s-bio" role="tabpanel" aria-labelledby="d65-tab-bio" hidden><section class="ilot" id="d65-s-bio-cours"><h3>Biochimie : substrat, enzyme, inhibiteur et produit de dégradation</h3>
<p>Le fibrinogène est une protéine soluble qui sert de substrat à la formation de fibrine. La thrombine est une enzyme qui permet cette transformation ; le facteur XIII activé contribue à stabiliser le réseau. Un dosage de fibrinogène et un dosage ou marqueur d’activité de coagulation ne décrivent donc pas la même étape. Une quantité de substrat disponible ne suffit pas à expliquer la vitesse de sa consommation.</p>
<p>La plasmine participe à la dégradation du réseau. Les D-dimères sont liés à la dégradation de fibrine réticulée ; ils ne sont pas une mesure directe de la masse de caillot dans tous les organes. Une augmentation signifie qu’un processus de formation et de dégradation de fibrine doit être interprété, mais ne désigne pas à elle seule la <button class="w" data-k="d65-classification">CIVD</button>. Le contexte biologique et clinique reste indispensable.</p>
<p>Les mécanismes de régulation comprennent des inhibiteurs et des cofacteurs. L’antithrombine agit sur plusieurs enzymes ; la protéine C activée réduit l’activité de certains cofacteurs ; l’inhibiteur de la voie du facteur tissulaire limite l’initiation. Un déficit d’un frein peut favoriser l’activation, mais sa mesure ne démontre pas automatiquement le bénéfice d’une substitution. La preuve thérapeutique ne se déduit pas uniquement de la logique biochimique.</p>
<figure id="d65-causal-bio"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="550" viewBox="0 0 580 550" role="img" aria-label="Des molécules aux paramètres mesurés"><title>Des molécules aux paramètres mesurés</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="66" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Fibrinogène soluble : substrat</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="196" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Thrombine puis fibrine réticulée</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="326" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Dégradation de fibrine : D-dimères</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Résultats interprétés avec cause</tspan><tspan x="290" dy="29">et méthode</tspan></text></svg><figcaption><b>Des molécules aux paramètres mesurés.</b> Le diagramme distingue les étapes ; un résultat élevé ou bas ne résume pas toute la balance hémostatique. Schéma causal non anatomique ; aucune structure du corps dessinée.</figcaption></figure>
<p>Les unités traduisent ce que l’on mesure. Une concentration en g/L rapporte une masse à un volume ; un temps en secondes mesure une durée ; un <button class="w" data-k="d65-pt-inr">INR</button> est un rapport normalisé utilisé dans des contextes précis ; un multiple de limite supérieure est un rapport sans unité. Ces grandeurs ne doivent pas être additionnées directement : le score convertit d’abord chacune en une catégorie de points.</p>
<p>La conversion 100 mg/dL = 1 g/L s’explique en deux étapes : 100 mg représentent 0,1 g et 1 dL représente 0,1 L ; le rapport 0,1 g/0,1 L vaut 1 g/L. Le chiffre 100 n’a donc pas le même sens lorsqu’on change les unités. De même, une solution de 20 mg/mL relie une masse à un volume d’administration, pas à la concentration que l’on obtiendra automatiquement dans le sang.</p>
<p>Après administration de fibrinogène, le résultat dépend notamment de la situation clinique et de la consommation ; il doit être mesuré et réévalué. Un calcul de volume permet de préparer une quantité prescrite, mais ne prédit pas à lui seul la réponse biologique. La distinction entre calcul exact et décision clinique doit rester explicite dans toute fenêtre pédagogique.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a> ; <a data-reference-source="1" href="https://www.hug.ch/laboratoire-hemostase/analyses-routine" target="_blank" rel="noopener">[S705] Laboratoire d’hémostase : analyses de routine</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Substrat, enzyme et produit de dégradation ne sont pas interchangeables.</p><p><b>Science → examen.</b> Vérifier unités, méthode et calcul avant d’attribuer les points du score.</p><p><b>Science → traitement.</b> Calculer un volume sans confondre ce calcul avec l’indication ou la réponse.</p><p><b>À retenir.</b> Relier mécanisme, mesure et décision sans dépasser la preuve.</p></div><button class="pareto-btn ui" data-k="pareto-d65-bio">▲ Loi de Pareto — Biochimie et hémostase</button></div><div class="sci" id="d65-s-immuno" role="tabpanel" aria-labelledby="d65-tab-immuno" hidden><section class="ilot" id="d65-s-immuno-cours"><h3>Immunologie : quand la réponse protectrice devient diffuse</h3>
<p>L’inflammation et la coagulation ne fonctionnent pas indépendamment. Une réponse locale peut contribuer à contenir une agression et à préserver l’intégrité tissulaire. La revue 2025 décrit ce lien entre immunité innée, cellules circulantes et endothélium. Lorsque l’agression est intense ou diffuse, les mêmes mécanismes peuvent participer à une activation intravasculaire excessive.</p>
<p>Les neutrophiles peuvent libérer des réseaux extracellulaires, appelés <button class="w" data-k="d65-net">NETs</button>, composés notamment d’ADN et de protéines. Les histones et d’autres constituants peuvent interagir avec les cellules et les voies de coagulation. La revue décrit des effets sur l’intégrité endothéliale, l’exposition de surfaces procoagulantes et l’amplification de la génération de thrombine. Ces résultats éclairent les mécanismes ; ils ne fournissent pas un test de routine universel à demander devant chaque suspicion de <button class="w" data-k="d65-classification">CIVD</button>.</p>
<p>Les plaquettes participent elles aussi aux interactions inflammatoires. L’activation des cellules et de l’endothélium peut modifier l’exposition des phospholipides, la libération de médiateurs et l’assemblage des complexes de coagulation. Les freins anticoagulants peuvent être altérés par la consommation, la dégradation ou la perturbation de leur environnement. La diffusion de l’activation transforme une réponse localement utile en processus délétère.</p>
<figure id="d65-causal-immuno"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="550" viewBox="0 0 580 550" role="img" aria-label="Inflammation et coagulation se renforcent"><title>Inflammation et coagulation se renforcent</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="52" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Agression et réponse immunitaire</tspan><tspan x="290" dy="29">innée</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="182" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Activation des cellules et de</tspan><tspan x="290" dy="29">l’endothélium</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="312" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Coagulation amplifiée et freins</tspan><tspan x="290" dy="29">perturbés</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Microthrombose et inflammation des</tspan><tspan x="290" dy="29">organes</tspan></text></svg><figcaption><b>Inflammation et coagulation se renforcent.</b> Relations mécanistiques issues de la revue ; elles ne valident pas à elles seules un médicament ciblant ces voies. Schéma causal non anatomique ; aucune structure du corps dessinée.</figcaption></figure>
<p>Cette perspective explique pourquoi traiter l’infection ou une autre cause reste essentiel. Fournir des plaquettes ou du fibrinogène peut répondre à une conséquence immédiate sans arrêter le signal qui entretient la consommation. Le soutien des organes et le contrôle de la cause doivent donc accompagner les décisions hémostatiques, plutôt que venir seulement après la normalisation du laboratoire.</p>
<p>La protéine C activée existe comme élément physiologique de régulation. Cela ne signifie pas que l’ancien médicament recombinant correspondant reste une option thérapeutique : les essais et le retrait du produit sont une question clinique distincte. De même, des résultats d’analyses de sous-groupes sur l’antithrombine ou la thrombomoduline ne doivent pas être transformés en preuve générale pour toutes les personnes atteintes de <button class="w" data-k="d65-classification">CIVD</button>.</p>
<p>La lecture critique conserve ainsi trois niveaux : mécanisme biologique plausible, effet mesuré dans une étude et bénéfice clinique démontré dans une population. Confondre ces niveaux produit des prescriptions séduisantes mais insuffisamment justifiées. Le cours relie les mécanismes aux observations tout en maintenant cette limite.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener">[S706] Surviving Sepsis Campaign : recommandations 2026</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680469280019" target="_blank" rel="noopener">[S708] Kybernin P 500/1000</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> La réponse inflammatoire peut entretenir une activation diffuse.</p><p><b>Science → examen.</b> Une hypothèse mécanistique ne devient pas automatiquement un test de routine.</p><p><b>Science → traitement.</b> Contrôler la cause ; ne pas prescrire sur une plausibilité biologique seule.</p><p><b>À retenir.</b> Relier mécanisme, mesure et décision sans dépasser la preuve.</p></div><button class="pareto-btn ui" data-k="pareto-d65-immuno">▲ Loi de Pareto — Immunologie</button></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="d65-p-1"><h2>1. Fibrinogène : Haemocomplettan P</h2>
<p><b><button class="w" data-k="d65-fi">FI</button> suisse, avril 2026.</b> Le produit apporte du fibrinogène humain. La fiche décrit les déficits congénitaux et l’hypofibrinogénémie acquise par défaut de synthèse, consommation ou perte. Dans la <button class="w" data-k="d65-classification">CIVD</button>, la présence d’une consommation n’efface pas le besoin d’évaluer le saignement, les autres facteurs et le risque thrombotique.</p>
<p>Après reconstitution, 1 g dans 50 mL ou 2 g dans 100 mL donnent une concentration de 20 mg/mL. La <button class="w" data-k="d65-fi">FI</button> décrit une dose générale initiale de 1–2 g, suivie d’adaptations selon le besoin et l’effet clinique. Elle mentionne des doses plus importantes dans certaines hémorragies graves ; ces exemples ne constituent pas une prescription automatique pour toute <button class="w" data-k="d65-classification">CIVD</button>. Le traitement est supervisé par un médecin expérimenté en troubles de la coagulation et contrôlé, notamment par le fibrinogène mesuré selon Clauss.</p>
<p>La vitesse d’injection ne doit pas dépasser 5 mL/min. L’hypersensibilité et les thromboses manifestes ou l’infarctus du myocarde, sauf hémorragie menaçant la vie, figurent dans les contre-indications. Le risque thromboembolique impose une surveillance, notamment lors de doses élevées ou répétées. Un déficit acquis peut concerner plusieurs facteurs et inhibiteurs ; le fibrinogène seul ne remplace pas l’ensemble de l’hémostase.</p>
<p>Documenter nom commercial et numéro de lot. Les réactions allergiques et anaphylactiques exigent l’arrêt et la prise en charge selon les directives actuelles. Le risque de transmission infectieuse des produits plasmatiques n’est pas considéré comme absolument nul. La grossesse et l’allaitement demandent une appréciation du bénéfice et du risque ; l’absence d’expérience négative rapportée ne constitue pas une preuve universelle d’innocuité.</p>
<div class="key"><b>À retenir.</b> La concentration 20 mg/mL permet un calcul de volume. L’indication, la dose totale, la cible et les répétitions restent des décisions cliniques distinctes.</div><p><button class="w" data-k="d65-calcul-fib">Calcul de volume et de durée</button> · <button class="w" data-k="d65-cibles">Pourquoi les cibles diffèrent entre les textes</button></p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S713] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S714] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a>.</p></div></section>
<section class="ilot" id="d65-p-2"><h2>2. Héparine non fractionnée : lire l’indication avec ses restrictions</h2>
<p><b>Héparine Bichsel, <button class="w" data-k="d65-fi">FI</button> suisse novembre 2020.</b> L’héparine renforce l’action de l’antithrombine et diminue l’activité de plusieurs enzymes de coagulation. La fiche mentionne la <button class="w" data-k="d65-classification">CIVD</button> parmi les indications, mais précise des contre-indications hémorragiques et une exception pour la phase hypercoagulable d’une coagulopathie de consommation. Cette formulation ne doit pas devenir « héparine pour toute <button class="w" data-k="d65-classification">CIVD</button> ».</p>
<p>La posologie est individualisée selon l’indication, l’évolution, le poids, l’âge et les contrôles. La dose prophylactique générale adulte de 5000 <button class="w" data-k="d65-fi">UI</button> sous-cutanées toutes les 12 heures figure dans cette <button class="w" data-k="d65-fi">FI</button> ; elle est présentée pour identifier son contexte, <b>pas comme un traitement curatif de la <button class="w" data-k="d65-classification">CIVD</button></b>. Les schémas thérapeutiques des maladies thromboemboliques ne sont pas transposés automatiquement à une consommation hémorragique. Dans le sepsis, le choix de la thromboprophylaxie relève de la recommandation et du protocole appropriés, avec leurs contre-indications.</p>
<p>Vérifier la concentration du produit : 417,1000 et 5000 <button class="w" data-k="d65-fi">UI</button>/mL ne sont pas interchangeables en volume. Les préparations systémiques ne doivent pas être confondues avec une solution destinée au maintien d’un cathéter. Les tests d’hémostase, dont l’a <button class="w" data-k="d65-differentiel">PTT</button> ou l’anti-Xa selon la pratique locale, s’interprètent avec la situation et les interférences possibles.</p>
<p>La <button class="w" data-k="d65-tih">TIH</button> actuelle ou antérieure, l’hypersensibilité et des situations favorisant fortement l’hémorragie figurent parmi les restrictions importantes. La <button class="w" data-k="d65-fi">FI</button> énumère notamment des atteintes hépatiques, rénales ou pancréatiques sévères et une thrombopénie sévère ; ce cours ne banalise pas ces contre-indications. Une chute des plaquettes sous héparine impose de rechercher une complication spécifique avec l’équipe compétente. Les anciennes descriptions de tests ou de réexposition de cette <button class="w" data-k="d65-fi">FI</button> ne sont pas reprises comme conduite moderne de référence.</p>
<div class="alert"><b>Point de décision.</b> Prophylaxie veineuse, traitement d’une thrombose et décision spécialisée dans une <button class="w" data-k="d65-classification">CIVD</button> sont trois questions différentes. Le score de <button class="w" data-k="d65-classification">CIVD</button> ne fournit pas une dose d’héparine.</div><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680462400506" target="_blank" rel="noopener">[S709] Héparine Bichsel 417/1000/5000 UI/mL</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680469280019" target="_blank" rel="noopener">[S708] Kybernin P 500/1000</a> ; <a data-reference-source="1" href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener">[S706] Surviving Sepsis Campaign : recommandations 2026</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a>.</p></div></section>
<section class="ilot" id="d65-p-3"><h2>3. Antithrombine : Kybernin P et le piège de l’indication</h2>
<p><b><button class="w" data-k="d65-fi">FI</button> suisse, février 2025.</b> L’antithrombine participe normalement au frein de la coagulation. Sa diminution dans une <button class="w" data-k="d65-classification">CIVD</button> est biologiquement compréhensible ; elle ne démontre pas qu’une substitution améliore la situation de chaque patient. Les indications de Kybernin P sont présentées sous l’intitulé du déficit héréditaire en antithrombine. La mention d’une consommation dans cette rubrique ne doit pas être isolée de cet en-tête.</p>
<p>Après reconstitution, le produit contient 50 <button class="w" data-k="d65-fi">UI</button>/mL. Pour le déficit congénital, la dose initiale habituelle donnée par la <button class="w" data-k="d65-fi">FI</button> est de 30–50 <button class="w" data-k="d65-fi">UI</button>/kg ; les doses, la fréquence et la durée suivantes dépendent de l’activité mesurée et de la clinique. La fiche vise en général une activité d’au moins 80% pendant ce traitement, sauf niveau efficace différent selon la situation. Ces nombres ne sont pas des objectifs universels de <button class="w" data-k="d65-classification">CIVD</button> acquise.</p>
<p>La perfusion intraveineuse est lente, au maximum 4 mL/min. Le contrôle biologique est rapproché au début et adapté à la consommation ; la <button class="w" data-k="d65-fi">FI</button> prévoit une surveillance au moins biquotidienne jusqu’à stabilisation, puis quotidienne, notamment avant l’administration suivante. Une formule imprimée de calcul comporte une présentation incomplète dans la version consultée ; elle n’a pas été transformée en calculateur pédagogique.</p>
<p>L’association avec l’héparine peut majorer l’anticoagulation et le risque de saignement. Les contrôles et les doses doivent être réévalués par l’équipe spécialisée. L’hypersensibilité, la traçabilité du lot et les limites de sécurité des produits plasmatiques doivent être prises en compte. L’utilisation pour la détresse respiratoire du prématuré n’est pas indiquée selon la fiche ; aucun schéma pédiatrique n’est extrapolé ici.</p>
<div class="key"><b>À retenir.</b> Une protéine diminuée n’est pas automatiquement une indication de concentré. Distinguer mécanisme physiologique, anomalie mesurée, indication suisse et preuve clinique.</div><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680469280019" target="_blank" rel="noopener">[S708] Kybernin P 500/1000</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a>.</p></div></section>
<section class="ilot" id="d65-p-4"><h2>4. Acide tranexamique : une exception à définir, pas un réflexe</h2>
<p><b>Tranexamic Acid Leman 100 mg/mL, <button class="w" data-k="d65-fi">FI</button> suisse septembre 2026.</b> L’acide tranexamique inhibe la fibrinolyse liée à la plasmine. Stabiliser la fibrine peut être utile dans une hémorragie appropriée, mais peut être dangereux lorsque l’élimination des thrombi est déjà insuffisante. La <button class="w" data-k="d65-fi">FI</button> indique que, dans la majorité des <button class="w" data-k="d65-classification">CIVD</button>, les patients ne doivent pas être traités par ce médicament.</p>
<p>L’exception concerne une activation prédominante du système fibrinolytique avec une hémorragie grave aiguë, dans un environnement disposant d’un laboratoire adapté et de personnel qualifié. La <button class="w" data-k="d65-fi">FI</button> évoque alors une dose unique de 1 g, souvent suffisante ; cette phrase ne dispense pas de définir le mécanisme et les contre-indications. Le profil biologique détaillé imprimé comporte des incohérences de désignation de facteurs et n’est pas recopié comme un algorithme diagnostique.</p>
<p>La voie est exclusivement intraveineuse. La solution 100 mg/mL ne doit pas dépasser 1 mL/min selon la posologie générale : 1 g correspond à 10 mL et nécessite donc au moins 10 minutes à ce débit. La voie intrathécale ou épidurale, ainsi que les autres voies neuraxiales mentionnées dans la <button class="w" data-k="d65-fi">FI</button>, expose à des accidents graves et est contre-indiquée. Étiqueter clairement la seringue et la voie fait partie de la prévention des erreurs.</p>
<p>Les thromboses veineuses ou artérielles aiguës, l’insuffisance rénale grave, les antécédents de convulsions et l’hypersensibilité figurent parmi les contre-indications. Le tableau d’adaptation rénale ne doit pas être utilisé pour contourner la contre-indication d’insuffisance sévère. Les interactions avec les traitements agissant sur l’hémostase et le risque thrombotique exigent une surveillance spécialisée. Les schémas de traumatisme et de péripartum sont propres à leurs recommandations ; leurs essais ne constituent pas une preuve pour chaque <button class="w" data-k="d65-classification">CIVD</button>.</p>
<figure id="d65-causal-txa"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="550" viewBox="0 0 580 550" role="img" aria-label="Pourquoi le mécanisme change la décision"><title>Pourquoi le mécanisme change la décision</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="52" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Acide tranexamique : inhibition de</tspan><tspan x="290" dy="29">fibrinolyse</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="196" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Fibrine moins rapidement dégradée</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="312" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Bénéfice possible dans une</tspan><tspan x="290" dy="29">hémorragie adaptée</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Danger si la thrombose domine ou</tspan><tspan x="290" dy="29">si contre-indication</tspan></text></svg><figcaption><b>Pourquoi le mécanisme change la décision.</b> Ce raisonnement explique la restriction de la <button class="w" data-k="d65-fi">FI</button> ; il ne fournit pas une sélection automatique du patient. Schéma causal non anatomique ; aucune structure du corps dessinée.</figcaption></figure><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S710] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S713] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S714] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a>.</p></div></section>
<section class="ilot" id="d65-p-5"><h2>5. Réconcilier les contextes et surveiller les effets</h2>
<p>Un même produit peut avoir des doses ou des objectifs différents selon l’indication. La <button class="w" data-k="d65-fi">FI</button> du fibrinogène donne un cadre général individualisé ; la directive de traumatisme propose une supplémentation initiale de 3–4 g dans un saignement majeur avec déficit pertinent. La directive péripartale expose d’autres objectifs et doses dans son champ. Ces différences doivent être attribuées et discutées, plutôt que fondues en une dose moyenne qui n’appartiendrait à aucune source.</p>
<p>Dans la leucémie promyélocytaire, le contrôle de la coagulopathie et le traitement de la maladie sont urgents. Les objectifs de plaquettes et de fibrinogène sont spécifiques ; l’usage prophylactique d’anticoagulants ou d’antifibrinolytiques n’a pas de bénéfice démontré dans la source Onkopedia consultée. Une observation de thrombose ou de saignement doit conduire à une décision spécialisée, sans appliquer automatiquement le tableau du sepsis.</p>
<p>Chaque administration est suivie sur deux plans : l’effet recherché et les effets indésirables. Réévaluer le saignement, la perfusion, les organes, les résultats biologiques et les signes d’hypersensibilité ou de thrombose. La traçabilité du nom commercial et du lot est particulièrement importante pour les produits plasmatiques. Une amélioration du laboratoire ne remplace pas cette observation clinique.</p>
<p>En cas de réaction transfusionnelle suspectée, appliquer la procédure du centre et organiser l’hémovigilance. Les documents Swissmedic distinguent notamment gravité et imputabilité : une réaction grave n’a pas nécessairement une causalité déjà établie, et une enquête ne doit pas être remplacée par une attribution intuitive.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S713] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S714] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S712] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S715] Technique clinique : transfusions de produits sanguins labiles</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/bewilligungen/i-310/i-310-aa-01-a01_mbklassierungundabklaerungvontransfusionsreaktione.pdf.download.pdf/I-310.AA.01-A01f_mbclassificationetanalysedesreactionstransfusionne.pdf" target="_blank" rel="noopener">[S716] Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f</a>.</p></div></section>
<section class="ilot" id="d65-p-6"><h2>6. Vérifier les calculs avant de vérifier le résultat</h2>
<p>La dose est une masse ou une quantité d’activité ; la concentration relie cette quantité au volume. Pour Haemocomplettan P, 2 g représentent 2000 mg. À20 mg/mL, le volume correspondant est 100 mL. Au débit maximal de 5 mL/min, le temps minimal arithmétique est 20 minutes. Ce calcul est un exercice ; il ne décide pas si 2 g sont indiqués chez un patient.</p>
<p>Pour la solution de <button class="w" data-k="d65-txa">TXA</button> 100 mg/mL, 1 g correspond à 10 mL ; à 1 mL/min au maximum, la durée est d’au moins 10 minutes. La vitesse d’une autre préparation ou d’un autre produit ne doit pas être importée. Pour l’héparine, une quantité en <button class="w" data-k="d65-fi">UI</button> exige de vérifier la concentration exacte avant de calculer le volume. Une confusion de concentration peut produire une erreur majeure même si l’arithmétique est correcte.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Exercice fictif : un volume calculé de 100 mL de fibrinogène doit respecter un débit ne dépassant pas 5 mL/min. Quelle durée est compatible avec cette limite ?</p><button data-ok="1">Au moins vingt minutes, avec surveillance et indication validée séparément.</button><button data-ok="0">Deux minutes, car 100 mL correspondent à 2 g.</button><button data-ok="0">Cinq minutes, quel que soit le volume.</button><p class="fb" hidden>Durée = volume ÷ débit : 100 ÷ 5 = 20 minutes. La limite de débit ne valide ni le choix de la dose ni l’indication.</p></div><div class="key"><b>À retenir.</b> Avant de calculer : produit, indication, unité, concentration et limite de débit. Après administration : clinique, biologie, effets indésirables et traçabilité.</div><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S710] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680462400506" target="_blank" rel="noopener">[S709] Héparine Bichsel 417/1000/5000 UI/mL</a>.</p></div></section><button class="pareto-btn ui" data-k="pareto-d65-pharma">▲ Loi de Pareto — Pharmacologie</button></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="d65-classification" data-title="D65 : quatre catégories, pas quatre stades"><p>La CIM-10-GM 2024 de l’<button class="w" data-k="d65-classification">OFS</button> distingue D65.0, afibrinogénémie acquise ; D65.1, <button class="w" data-k="d65-classification">CIVD</button> ; D65.2, hémorragie fibrinolytique acquise ; D65.9, syndrome de défibrination sans précision. Les situations obstétricales et néonatales ont des exclusions de codage propres. Cela ne nie pas leur physiopathologie de <button class="w" data-k="d65-classification">CIVD</button>. Une hypofibrinogénémie isolée ne prouve pas automatiquement une activation intravasculaire diffuse.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.mct.bfs.admin.ch/en/cim10/2024/hierarchy/III/D65-D69?lang=fr" target="_blank" rel="noopener">[S701] CIM-10-GM 2024 français : D65 et subdivisions</a> ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d65-d69.htm" target="_blank" rel="noopener">[S702] ICD-10-GM 2024, D65</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a>.</p></div></template>
<template data-pop="d65-coagulation" data-title="Hémostase normale : localisation et régulation"><p>La coagulation forme de la thrombine, qui transforme le fibrinogène en fibrine. Les plaquettes et les surfaces cellulaires organisent les réactions ; le facteur XIII activé stabilise le réseau. Antithrombine, système protéine C–thrombomoduline et inhibiteur de la voie du facteur tissulaire limitent l’activation. Le bénéfice est un caillot utile au bon endroit, avec maintien de la circulation ailleurs.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis" target="_blank" rel="noopener">[S718] 18.5 Hemostasis  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a>.</p></div></template>
<template data-pop="d65-fibrinolyse" data-title="Fibrinolyse : ni toujours excessive, ni toujours insuffisante"><p>La plasmine participe à la dégradation de la fibrine. Des activateurs et des inhibiteurs régulent cette réaction. Dans certaines <button class="w" data-k="d65-classification">CIVD</button>, son frein favorise la persistance des dépôts ; dans d’autres contextes, une activité excessive aggrave le saignement. Les profils peuvent être mixtes et changer dans le temps. Cette variation explique pourquoi un antifibrinolytique ne convient pas automatiquement à toute <button class="w" data-k="d65-classification">CIVD</button> hémorragique.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S710] Tranexamic Acid Leman, solution injectable 100 mg/mL</a>.</p></div></template>
<template data-pop="d65-chronologie" data-title="Le résultat biologique a une histoire"><p>Noter début des signes, heure du prélèvement, traitement causal, anticoagulant, transfusion et substitution. Une hausse des plaquettes ou du fibrinogène après un apport ne prouve pas que la consommation a cessé. La comparaison des valeurs doit tenir compte de la méthode et du contexte. Une amélioration du laboratoire ne remplace pas la réévaluation de la perfusion et des organes.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S715] Technique clinique : transfusions de produits sanguins labiles</a>.</p></div></template>
<template data-pop="d65-differentiel" data-title="Schizocytes : un signe de fragmentation"><p>Une fragmentation des hématies peut apparaître dans une <button class="w" data-k="d65-classification">CIVD</button> et dans une microangiopathie thrombotique. Le frottis doit être confronté aux signes d’hémolyse, aux organes atteints et aux autres résultats. Une atteinte rénale ne permet pas d’exclure arbitrairement un purpura thrombotique thrombocytopénique. Si cette hypothèse change une décision urgente, demander rapidement l’avis spécialisé et les examens adaptés.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/430207/3709751/RMS_607_1021.pdf" target="_blank" rel="noopener">[S711] Anémies hémolytiques et cancers</a>.</p></div></template>
<template data-pop="d65-score-isth" data-title="Score ISTH2025 : refaire une addition"><p>Exemple fictif avec maladie compatible : plaquettes 45 G/L = 2 points ; D-dimères huit fois la limite locale = 3 points ; <button class="w" data-k="d65-pt-inr">PT</button> allongé de 4 secondes = 1 point ; fibrinogène 0,8 g/L = 1 point. Total : 2+3+1+1 = 7. Une seule catégorie par paramètre. Le seuil de cinq est compatible avec une <button class="w" data-k="d65-classification">CIVD</button> manifeste ; il ne fournit ni dose ni choix automatique de médicament.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a>.</p></div></template>
<template data-pop="d65-sic" data-title="SIC : deux conditions simultanées"><p>La coagulopathie induite par le sepsis associe plaquettes, <button class="w" data-k="d65-pt-inr">PT</button>-<button class="w" data-k="d65-pt-inr">INR</button> et quatre domaines <button class="w" data-k="d65-sofa">SOFA</button> : respiratoire, cardiovasculaire, hépatique et rénal. Le total doit atteindre quatre points et la somme des points plaquettes et <button class="w" data-k="d65-pt-inr">INR</button> doit être strictement supérieure à deux. Exemple fictif : plaquettes 80 G/L donnent 2 points, <button class="w" data-k="d65-pt-inr">INR</button> 1,5 donne 2 points et une composante <button class="w" data-k="d65-sofa">SOFA</button> de 1 donne 1 point ; total 5, avec somme coagulation 4. Ce score n’est pas universel hors sepsis.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a>.</p></div></template>
<template data-pop="d65-ddimeres" data-title="D-dimères : toujours avec méthode et limite locale"><p>Le score 2025 utilise un multiple de la limite supérieure de la normale. Résultat et limite doivent être exprimés avec la même méthode et la même unité. Exemple fictif : 4 mg/L ÷ 0,5 mg/L = 8. Un rapport>7 reçoit 3 points ; un rapport>3 à≤7 en reçoit 2. Les unités <button class="w" data-k="d65-ddimeres">FEU</button> et <button class="w" data-k="d65-ddimeres">DDU</button> ne doivent pas être mélangées ; aucune limite absolue universelle n’est substituée à celle du laboratoire.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://www.hug.ch/laboratoire-hemostase/analyses-routine" target="_blank" rel="noopener">[S705] Laboratoire d’hémostase : analyses de routine</a>.</p></div></template>
<template data-pop="d65-produits" data-title="Les produits n’apportent pas la même chose"><p>Les plaquettes contribuent à l’hémostase primaire ; le fibrinogène apporte un substrat précis ; le plasma apporte plusieurs facteurs ; les concentrés érythrocytaires soutiennent le transport d’oxygène. Une <button class="w" data-k="d65-classification">CIVD</button> peut consommer plusieurs éléments. Le choix dépend de la clinique, des déficits, du contexte et du protocole spécialisé. La correction d’une valeur ne constitue pas à elle seule la résolution du syndrome.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S715] Technique clinique : transfusions de produits sanguins labiles</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a>.</p></div></template>
<template data-pop="d65-anticoagulation" data-title="Prévenir une thrombose n’est pas traiter une CIVD"><p>La thromboprophylaxie réduit un risque de thrombose veineuse dans une situation appropriée. Une anticoagulation curative traite une indication différente, avec une autre intensité et d’autres risques. La recommandation de sepsis 2026 prévoit une prophylaxie pharmacologique en l’absence de contre-indication ; elle ne transforme pas une consommation hémorragique en indication universelle d’héparine.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener">[S706] Surviving Sepsis Campaign : recommandations 2026</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680462400506" target="_blank" rel="noopener">[S709] Héparine Bichsel 417/1000/5000 UI/mL</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a>.</p></div></template>
<template data-pop="d65-unites" data-title="Convertir mg/dL en g/L"><p>Un décilitre vaut 0,1 litre et 100 mg valent 0,1 g. Ainsi 100 mg/dL = 0,1 g/0,1 L = 1 g/L. Pour passer de mg/dL à g/L, diviser le nombre par 100. Exemples : 150 mg/dL = 1,5 g/L ; 250 mg/dL = 2,5 g/L. La conversion conserve la concentration ; elle ne transforme pas un seuil diagnostique en objectif de traitement.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a>.</p></div></template>
<template data-pop="d65-calcul-fib" data-title="Fibrinogène : dose, volume et durée"><p>Exercice fictif avec la préparation 20 mg/mL : 2 g = 2000 mg. Volume = 2000 mg ÷ 20 mg/mL = 100 mL. Au débit maximal de 5 mL/min, durée minimale = 100 mL ÷ 5 mL/min = 20 minutes. L’indication et la dose doivent être établies séparément ; la surveillance et la réponse ne se déduisent pas de cette division.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a>.</p></div></template>
<template data-pop="d65-pt-inr" data-title="PT, allongement et INR"><p>Le <button class="w" data-k="d65-pt-inr">PT</button> est un temps de coagulation. Son allongement est la différence entre le temps du patient et celui du témoin, exprimée en secondes. Exemple fictif : 17 s−12 s = 5 s. Le score de <button class="w" data-k="d65-classification">CIVD</button> manifeste utilise cet allongement ; le <button class="w" data-k="d65-sic">SIC</button> utilise le <button class="w" data-k="d65-pt-inr">PT</button>-<button class="w" data-k="d65-pt-inr">INR</button>. Les valeurs ne se remplacent pas directement. L’a <button class="w" data-k="d65-differentiel">PTT</button>, ou temps de thromboplastine partielle activée, est un examen complémentaire qui n’entre pas dans le score manifeste présenté.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://www.hug.ch/laboratoire-hemostase/analyses-routine" target="_blank" rel="noopener">[S705] Laboratoire d’hémostase : analyses de routine</a>.</p></div></template>
<template data-pop="d65-cibles" data-title="Trois usages différents du fibrinogène"><p>Le score <button class="w" data-k="d65-sources">ISTH</button> ajoute un point si le fibrinogène est<1g/L. En traumatisme avec saignement majeur, la recommandation2023 retient un déficit fonctionnel ou une valeur Clauss≤1,5g/L pour envisager la substitution. Le texte péripartal expose des objectifs autour de2–2,5g/L dans son champ. La FI de Haemocomplettan P limite la cible à la limite inférieure normale. Cette divergence est conservée et relève d’une décision spécialisée, pas d’une moyenne entre les textes.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S713] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S714] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a>.</p></div></template>
