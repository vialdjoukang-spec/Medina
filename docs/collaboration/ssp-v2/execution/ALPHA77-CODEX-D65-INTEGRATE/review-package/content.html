<template id="ch-D65"><div class="chap"><div class="chap-head"><div class="code">D65 — Coagulation intravasculaire disséminée [syndrome de défibrination] · CIM-10-GM 2024 · Sang et organes hématopoïétiques</div><h1>Coagulation intravasculaire disséminée : relier cause, consommation et organes</h1><span class="status">Adulte ; contextes septique, traumatique, obstétrical et hématologique distingués · Sources au 02.11.2026 · Auto-relecture pédagogique distincte d’une validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan monographique</b><ol><li><a href="#d65-1">Définition : une coagulation qui perd sa localisation</a></li><li><a href="#d65-2">Épidémiologie : partir du contexte clinique</a></li><li><a href="#d65-3">Physiopathologie : coaguler au bon endroit, puis s’arrêter</a></li><li><a href="#d65-4">Démarche clinique : traiter l’urgence pendant l’enquête</a></li><li><a href="#d65-5">Anamnèse : reconstruire une trajectoire</a></li><li><a href="#d65-6">Examen clinique : rechercher les deux faces du syndrome</a></li><li><a href="#d65-7">Syndromes et diagnostics concurrents</a></li><li><a href="#d65-8">Diagnostic positif : utiliser le score sans lui abandonner la décision</a></li><li><a href="#d65-9">Explorations : demander un examen pour une question</a></li><li><a href="#d65-10">Arbre diagnostique : organiser les décisions parallèles</a></li><li><a href="#d65-11">Prise en charge : trois objectifs distincts</a></li><li><a href="#d65-12">Prévention, suivi et situations particulières</a></li><li><a href="#d65-13">Paramètres clés : un chiffre doit garder son objectif</a></li><li><a href="#d65-14">Pièges, critères formels et raisonnement d’examen</a></li></ol></nav><div class="chap-body"><section class="ilot" id="d65-1"><h2><span class="n">1</span> Définition : une coagulation qui perd sa localisation</h2>
<p>La coagulation intravasculaire disséminée, ou <b><button class="w" data-k="d65-classification">CIVD</button></b>, est un syndrome acquis provoqué par une autre maladie. Le sang coagule de manière excessive dans la circulation, les mécanismes qui limitent cette réaction sont débordés et l’endothélium est lésé. Des microthrombus peuvent compromettre la perfusion des organes ; parallèlement, la consommation des plaquettes et des facteurs, parfois aggravée par une fibrinolyse intense, peut provoquer une hémorragie. Ces deux conséquences peuvent coexister chez la même personne.</p>
<p>La définition actualisée de l’<button class="w" data-k="d65-sources">ISTH</button> en 2025 associe une activation systémique intravasculaire de la coagulation, une fibrinolyse dérégulée et une atteinte endothéliale. Elle distingue une phase précoce, parfois peu symptomatique, de formes avancées avec saignement ou défaillance d’organe. Un score de <button class="w" data-k="d65-classification">CIVD</button> manifeste décrit donc une partie du continuum ; un score inférieur au seuil ne prouve pas que le processus n’a pas commencé.</p>
<p>La catégorie suisse CIM-10-GM D65 comprend la <button class="w" data-k="d65-classification">CIVD</button> et d’autres syndromes de défibrination acquis. <b>D65.0</b> désigne l’afibrinogénémie acquise, <b>D65.1</b> la <button class="w" data-k="d65-classification">CIVD</button>, <b>D65.2</b> l’hémorragie fibrinolytique acquise et <b>D65.9</b> le syndrome de défibrination sans précision. Ces sous-catégories ne sont ni quatre degrés de gravité ni quatre traitements. Une baisse isolée du fibrinogène par défaut de synthèse hépatique ne démontre pas à elle seule une <button class="w" data-k="d65-classification">CIVD</button>.</p>
<p>Le purpura fulminans figure parmi les inclusions. Les situations obstétricales et néonatales ont des exclusions et des codes propres : cette règle de classement ne nie pas leur mécanisme de <button class="w" data-k="d65-classification">CIVD</button>. Le codage décrit le dossier ; il ne doit jamais retarder le traitement d’une urgence.</p>
<div class="key"><b>À retenir.</b> Chercher simultanément la cause, les signes de consommation et la souffrance des organes. Une anomalie de laboratoire isolée ne suffit pas à définir le syndrome.</div><p><button class="w" data-k="d65-classification">Comprendre les quatre sous-codes et les exclusions</button></p><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://www.mct.bfs.admin.ch/en/cim10/2024/hierarchy/III/D65-D69?lang=fr" target="_blank" rel="noopener">[S701] CIM-10-GM 2024 français : D65 et subdivisions</a> ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d65-d69.htm" target="_blank" rel="noopener">[S702] ICD-10-GM 2024, D65</a>.</p></div></section>
<section class="ilot" id="d65-2"><h2><span class="n">2</span> Épidémiologie : partir du contexte clinique</h2>
<p>La <button class="w" data-k="d65-classification">CIVD</button> survient dans des circonstances très différentes. Les infections graves, les lésions tissulaires majeures, certaines complications obstétricales et des cancers sont des contextes importants. Une même anomalie biologique n’a donc pas la même signification chez un patient septique, une personne polytraumatisée et une patiente présentant une hémorragie après l’accouchement.</p>
<table class="t"><thead><tr><th>Contexte</th><th>Ce qui doit être recherché</th><th>Conséquence pratique</th></tr></thead><tbody><tr><td>Sepsis ou choc septique</td><td>Foyer infectieux, dysfonction d’organe et évolution de l’hémostase</td><td>Traiter l’infection et organiser le contrôle du foyer ; suivre la coagulation en parallèle.</td></tr><tr><td>Traumatisme ou lésion tissulaire importante</td><td>Hémorragie, hypoperfusion et coagulopathie associée</td><td>La réanimation hémostatique suit une filière de traumatisme ; elle ne se résume pas au score de <button class="w" data-k="d65-classification">CIVD</button>.</td></tr><tr><td>Grossesse et péripartum</td><td>Décollement placentaire, hémorragie et autres complications obstétricales</td><td>Faire intervenir immédiatement l’équipe obstétricale et anesthésique ; objectifs spécifiques.</td></tr><tr><td>Cancer ou leucémie aiguë</td><td>Maladie évolutive, consommation parfois chronique ; suspicion de leucémie promyélocytaire</td><td>Une présentation peu hémorragique ne rassure pas à elle seule ; une suspicion de leucémie promyélocytaire relève d’une urgence hématologique.</td></tr></tbody></table>
<p>Les publications utilisent des populations, des scores et des moments de prélèvement différents. Les proportions observées en réanimation ou dans une série de cancers ne représentent pas l’incidence de la <button class="w" data-k="d65-classification">CIVD</button> dans la population générale. Les sources suisses et les revues consultées n’ont pas permis d’établir ici une incidence nationale propre à D65, ni une répartition suisse fiable par âge et sexe. Cette lacune est conservée ; aucun taux d’une population étrangère n’est présenté comme un chiffre suisse.</p>
<p>Le pronostic dépend du processus causal, de la défaillance des organes, de l’intensité du saignement ou de la thrombose et de leur évolution sous traitement. Un score de coagulation est une pièce de cette appréciation, pas une probabilité individuelle de décès.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/430207/3709751/RMS_607_1021.pdf" target="_blank" rel="noopener">[S711] Anémies hémolytiques et cancers</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S712] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener">[S706] Surviving Sepsis Campaign : recommandations 2026</a>.</p></div></section>
<section class="ilot" id="d65-3"><h2><span class="n">3</span> Physiopathologie : coaguler au bon endroit, puis s’arrêter</h2>
<p>Normalement, l’hémostase consolide une lésion localisée. Les plaquettes participent au premier bouchon et fournissent une surface aux réactions de coagulation. Le facteur tissulaire déclenche une succession de réactions ; les complexes enzymatiques amplifient la production de thrombine. Celle-ci transforme le fibrinogène soluble en fibrine, puis le facteur XIII activé stabilise le réseau. Le résultat utile est un caillot limité à la zone lésée.</p>
<p>Cette réaction est freinée. L’antithrombine neutralise plusieurs enzymes, notamment la thrombine et le facteur Xa. Le système protéine C–thrombomoduline diminue l’activité de cofacteurs de la coagulation ; l’inhibiteur de la voie du facteur tissulaire limite son initiation. La fibrinolyse remodèle et élimine la fibrine grâce à la plasmine. Endothélium, cellules et protéines plasmatiques forment ainsi un système régulé, et non une simple cascade autonome.</p>
<p>Dans la <button class="w" data-k="d65-classification">CIVD</button>, les signaux inflammatoires et les lésions tissulaires étendent l’activation au-delà d’une brèche. Les surfaces cellulaires deviennent plus procoagulantes ; les mécanismes anticoagulants sont moins efficaces. Des dépôts de fibrine et de plaquettes obstruent la microcirculation. L’atteinte d’organe résulte aussi de l’inflammation, de la dysfonction endothéliale et de la maladie causale : toute insuffisance rénale chez un patient septique ne peut pas être attribuée exclusivement à un microthrombus.</p>
<p>La consommation réduit les réserves disponibles pour arrêter un vrai saignement. La fibrinolyse peut rester freinée, notamment dans certains profils septiques, ou devenir excessive, notamment dans certains contextes traumatiques, obstétricaux ou tumoraux. Un fibrinogène encore normal n’exclut donc pas une <button class="w" data-k="d65-classification">CIVD</button> : sa synthèse et sa consommation peuvent évoluer simultanément. Le profil et la tendance sont plus informatifs qu’un chiffre détaché de son contexte.</p>

f="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis" target="_blank" rel="noopener">[S718] 18.5 Hemostasis  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a>.</p></div></section>
<section class="ilot" id="d65-4"><h2><span class="n">4</span> Démarche clinique : traiter l’urgence pendant l’enquête</h2>
<p>Trois questions organisent le premier raisonnement : <b>quelle maladie peut déclencher le syndrome, quelle menace existe maintenant et comment l’hémostase évolue-t-elle ?</b> Une hémorragie importante, une altération de la conscience, une détresse respiratoire, un choc ou une ischémie périphérique progressive imposent une évaluation urgente. Le calcul complet d’un score ne doit pas devenir une condition préalable à l’appel des équipes compétentes.</p>
<p>Le traitement de la maladie causale et le soutien des organes se déroulent en parallèle du bilan. En cas de sepsis, la recommandation internationale conjointe <button class="w" data-k="d65-sources">ESICM</button>/<button class="w" data-k="d65-sources">SCCM</button> de 2026 demande d’évaluer rapidement un foyer nécessitant un contrôle. Lorsqu’une intervention est nécessaire, elle suggère un contrôle précoce, idéalement dans les six heures suivant le diagnostic de sepsis ou de choc septique. Cette formulation repose sur une certitude très faible et ne transforme pas chaque infection en indication opératoire.</p>
<p>Une hémorragie péripartale exige sa propre filière. Une suspicion de leucémie promyélocytaire appelle une prise en charge hématologique immédiate, avec les mesures spécifiques de cette maladie. Le présent cours ne fournit pas de dose d’antibiotique ou de traitement antileucémique déduite de mémoire : ces prescriptions dépendent du diagnostic, de la personne et du protocole spécialisé.</p>
<p>Noter l’heure des signes, des prélèvements, des traitements et des transfusions aide à interpréter les changements ultérieurs. Une valeur obtenue après substitution ne décrit pas la même situation qu’une valeur prélevée avant. Le partage de cette chronologie avec le laboratoire et les équipes est une partie du traitement.</p>
<div class="alert"><b>Point de décision.</b> Menace vitale : évaluation et traitement urgents de la cause, soutien des organes et bilan simultané. Ne pas attendre que le score atteigne cinq points pour agir.</div><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener">[S706] Surviving Sepsis Campaign : recommandations 2026</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S712] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S714] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a>.</p></div></section>
<section class="ilot" id="d65-5"><h2><span class="n">5</span> Anamnèse : reconstruire une trajectoire</h2>
<p>Rechercher un début brutal ou une dégradation progressive. Demander quels saignements sont apparus, où ils se situent, s’ils suivent une ponction ou une intervention, et s’ils s’associent à une fièvre, une dyspnée, une confusion, une baisse des urines ou une douleur d’un membre. Les informations d’un proche ou de l’équipe peuvent remplacer un interrogatoire impossible chez une personne gravement malade.</p>
<p>La maladie causale est centrale : infection suspectée ou documentée, traumatisme, chirurgie récente, grossesse ou accouchement, cancer connu ou signes d’une maladie hématologique. Les résultats antérieurs permettent de distinguer une thrombopénie chronique d’une chute récente. Une <button class="w" data-k="d65-classification">CIVD</button> associée à un cancer peut être moins spectaculaire sur le plan hémorragique ; cette présentation n’exclut pas une consommation active.</p>
<p>Recenser les traitements anticoagulants, l’exposition à l’héparine, les médicaments influençant l’hémostase et les transfusions récentes. Une thrombopénie sous héparine oblige à envisager une complication spécifique ; son nom ne doit pas être absorbé dans le diagnostic de <button class="w" data-k="d65-classification">CIVD</button>. La fiche suisse de l’héparine contre-indique son emploi en présence d’une thrombopénie induite par l’héparine actuelle ou antérieure. Une suspicion impose un avis et une conduite spécialisés.</p>
<p>Préciser aussi les maladies hépatiques et rénales, les antécédents hémorragiques, les interventions récentes et les produits déjà administrés. L’objectif est de comprendre les mécanismes possibles et les risques du traitement, sans attribuer une fréquence chiffrée à chaque symptôme en l’absence de données appropriées.</p>
<p><button class="w" data-k="d65-chronologie">Construire une chronologie utile au laboratoire</button></p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/430207/3709751/RMS_607_1021.pdf" target="_blank" rel="noopener">[S711] Anémies hémolytiques et cancers</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680462400506" target="_blank" rel="noopener">[S709] Héparine Bichsel 417/1000/5000 UI/mL</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S715] Technique clinique : transfusions de produits sanguins labiles</a>.</p></div></section>
<section class="ilot" id="d65-6" data-semiology-clinical="D65"><h2><span class="n">6</span> Examen clinique : rechercher les deux faces du syndrome</h2>
<p>Examiner la peau, les muqueuses et les sites de ponction peut montrer un purpura, des ecchymoses ou un suintement difficile à arrêter. Rechercher un saignement digestif, urinaire ou opératoire selon la situation. Ces manifestations sont compatibles avec une consommation hémostatique, mais elles peuvent aussi avoir d’autres causes. Leur absence ne suffit pas à exclure une phase précoce.</p>
<p>Évaluer en même temps la perfusion et les organes. Une cyanose acrale bilatérale, une nécrose périphérique, une oligurie, une hypoxémie ou un trouble de la conscience peuvent accompagner une atteinte microvasculaire. Chacun de ces signes a cependant plusieurs mécanismes possibles : choc, hypoxémie, médicament, infection ou atteinte d’organe préexistante. L’examen oriente la gravité et le bilan ; il ne démontre pas à lui seul la nature de chaque lésion.</p>
<table class="t"><thead><tr><th>Observation</th><th>Lien physiopathologique possible</th><th>Question immédiate</th></tr></thead><tbody><tr><td>Saignement aux ponctions ou aux muqueuses</td><td>Plaquettes/facteurs consommés, fibrinolyse excessive ou autre trouble de l’hémostase</td><td>Le saignement menace-t-il la personne et quelle substitution est justifiée ?</td></tr><tr><td>Purpura rapidement extensif, zones nécrotiques</td><td>Atteinte vasculaire et thrombose avec possible composante hémorragique</td><td>Existe-t-il une infection grave ou une autre cause urgente ?</td></tr><tr><td>Oligurie ou confusion</td><td>Hypoperfusion, inflammation, microthrombose ou cause associée</td><td>Quel organe est menacé et quel soutien est nécessaire ?</td></tr><tr><td>Hypoxémie ou détresse respiratoire</td><td>Atteinte pulmonaire multifactorielle ; complication de la maladie ou du traitement</td><td>Évaluer rapidement respiration et circulation ; situer les transfusions dans le temps.</td></tr></tbody></table>
<p>Répéter l’examen et comparer les observations aux résultats biologiques. Un nombre de plaquettes amélioré après transfusion ne prouve pas que la cause est contrôlée ; une dégradation clinique malgré des chiffres apparemment stables impose de réévaluer. La sémiologie fondamentale détaille, dans son premier sous-onglet, la chaîne « mécanisme → signe → examen → décision ».</p>
<div class="key"><b>À retenir.</b> Le signe devient utile lorsqu’il est relié à une hypothèse, à un degré d’urgence et à une réévaluation. Aucun signe isolé n’est présenté ici avec une sensibilité ou une spécificité inventée.</div><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/bewilligungen/i-310/i-310-aa-01-a01_mbklassierungundabklaerungvontransfusionsreaktione.pdf.download.pdf/I-310.AA.01-A01f_mbclassificationetanalysedesreactionstransfusionne.pdf" target="_blank" rel="noopener">[S716] Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f</a>.</p></div></section>
<section class="ilot" id="d65-7"><h2><span class="n">7</span> Syndromes et diagnostics concurrents</h2>
<p>Une présentation à prédominance thrombotique, une consommation hémorragique et une hyperfibrinolyse peuvent se combiner ou se succéder. Ces profils décrivent un moment de la maladie. Ils ne permettent pas, à eux seuls, de choisir automatiquement un anticoagulant ou un antifibrinolytique.</p>
<table class="t"><thead><tr><th>Hypothèse</th><th>Éléments qui orientent</th><th>Limite importante</th></tr></thead><tbody><tr><td><button class="w" data-k="d65-classification">CIVD</button></td><td>Maladie déclenchante compatible, activation/consommation, évolution des plaquettes, <button class="w" data-k="d65-pt-inr">PT</button>, fibrinogène et D-dimères</td><td>Le score peut rester bas au début ; les produits administrés modifient les résultats.</td></tr><tr><td>Microangiopathie thrombotique</td><td>Thrombopénie, hémolyse avec fragmentation des hématies et atteinte d’organe</td><td>Des schizocytes peuvent aussi exister dans la <button class="w" data-k="d65-classification">CIVD</button>. Une atteinte rénale ne permet pas d’écarter le purpura thrombotique thrombocytopénique.</td></tr><tr><td>Hépatopathie sévère</td><td>Défaut de synthèse et contexte hépatique, pouvant expliquer plusieurs anomalies</td><td>Une hépatopathie peut coexister avec une <button class="w" data-k="d65-classification">CIVD</button> ; aucun facteur isolé n’est proposé comme arbitre universel.</td></tr><tr><td>Perte sanguine, dilution et coagulopathie du traumatisme</td><td>Chronologie des pertes, remplissages et transfusions, lésions tissulaires</td><td>Ces mécanismes peuvent s’ajouter à la consommation ; ne pas leur imposer un modèle unique.</td></tr><tr><td>Effet ou complication d’un anticoagulant</td><td>Exposition, chronologie, tests adaptés et fonction d’élimination</td><td>Une anomalie d’a <button class="w" data-k="d65-differentiel">PTT</button> ou d’anti-Xa n’est pas une preuve de <button class="w" data-k="d65-classification">CIVD</button> ; une suspicion de <button class="w" data-k="d65-tih">TIH</button> exige sa propre prise en charge.</td></tr></tbody></table>
<p>Le frottis et le bilan d’hémolyse répondent à une question distincte : existe-t-il une destruction mécanique des hématies ? Si une microangiopathie thrombotique est envisagée, demander rapidement un avis hématologique et les examens spécialisés adaptés. Le cours ne transforme pas une ancienne simplification d’un tableau en règle excluant une maladie grave.</p>
<p>Les diagnostics différentiels sont parfois des diagnostics associés. La cohérence de la cause, de l’examen, des tendances biologiques et de la réponse au traitement doit rester au centre du raisonnement.</p>
<p><button class="w" data-k="d65-differentiel">Schizocytes : un indice, plusieurs mécanismes</button></p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/430207/3709751/RMS_607_1021.pdf" target="_blank" rel="noopener">[S711] Anémies hémolytiques et cancers</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680462400506" target="_blank" rel="noopener">[S709] Héparine Bichsel 417/1000/5000 UI/mL</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S713] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a>.</p></div></section>

<section class="ilot" id="d65-8"><h2><span class="n">8</span> Diagnostic positif : utiliser le score sans lui abandonner la décision</h2>
<p>Le score <button class="w" data-k="d65-sources">ISTH</button> de <button class="w" data-k="d65-classification">CIVD</button> manifeste s’utilise lorsqu’une maladie susceptible de provoquer une <button class="w" data-k="d65-classification">CIVD</button> est présente. La mise à jour de 2025 conserve une combinaison de plaquettes, de marqueurs de fibrine, d’allongement du temps de prothrombine et de fibrinogène, mais précise les catégories de D-dimères par rapport à la limite supérieure de la normale du laboratoire. Un total d’au moins cinq points est compatible avec une <button class="w" data-k="d65-classification">CIVD</button> manifeste dans ce contexte.</p>
<table class="t"><thead><tr><th>Paramètre du score <button class="w" data-k="d65-sources">ISTH</button> 2025</th><th>Résultat</th><th>Points</th></tr></thead><tbody><tr><td>Plaquettes</td><td>≥ 100 G/L ; de 50 à < 100 G/L ; < 50 G/L</td><td>0 ; 1 ; 2</td></tr><tr><td>D-dimères, rapport à la limite supérieure normale de la même méthode</td><td>≤ 3 fois ; > 3 à ≤ 7 fois ; > 7 fois</td><td>0 ; 2 ; 3</td></tr><tr><td>Allongement du <button class="w" data-k="d65-pt-inr">PT</button> par rapport au témoin, en secondes</td><td>< 3 s ; ≥ 3 à < 6 s ; ≥ 6 s</td><td>0 ; 1 ; 2</td></tr><tr><td>Fibrinogène</td><td>≥ 1 g/L ; < 1 g/L</td><td>0 ; 1</td></tr></tbody></table>
<p>Dans chaque ligne, retenir une seule catégorie. Un rapport de D-dimères exactement égal à sept ne remplit pas le critère « supérieur à sept » ; il relève de la catégorie intermédiaire. Un fibrinogène exactement égal à 1 g/L ne reçoit pas le point prévu pour une valeur strictement inférieure. Les résultats proches d’une limite doivent rester interprétés avec la précision analytique et l’évolution clinique.</p>
<p>Le <button class="w" data-k="d65-pt-inr">PT</button> de ce score est un <b>allongement en secondes</b>. Il ne faut pas y substituer directement un <button class="w" data-k="d65-pt-inr">INR</button>. Le tableau primaire de 2025 réunit sous un intitulé commun des données exprimées différemment ; les unités sont donc explicitées ici. De même, les D-dimères doivent être rapportés à la limite de la méthode utilisée : un chiffre en unités <button class="w" data-k="d65-ddimeres">FEU</button> ne se compare pas mécaniquement à un chiffre en unités <button class="w" data-k="d65-ddimeres">DDU</button>.</p>
<p>Le score de coagulopathie induite par le sepsis, ou <b><button class="w" data-k="d65-sic">SIC</button></b>, répond à une autre question : repérer une coagulopathie dans un contexte septique. Il associe les plaquettes, le <button class="w" data-k="d65-pt-inr">PT</button>-<button class="w" data-k="d65-pt-inr">INR</button> et une composante d’atteinte d’organe issue des domaines respiratoire, cardiovasculaire, hépatique et rénal du <button class="w" data-k="d65-sofa">SOFA</button>. Il ne s’applique pas comme score précoce universel à toutes les causes de <button class="w" data-k="d65-classification">CIVD</button>.</p>
<table class="t"><thead><tr><th>Composante <button class="w" data-k="d65-sic">SIC</button></th><th>0 point</th><th>1 point</th><th>2 points</th></tr></thead><tbody><tr><td>Plaquettes</td><td>≥ 150 G/L</td><td>≥ 100 à < 150 G/L</td><td>< 100 G/L</td></tr><tr><td><button class="w" data-k="d65-pt-inr">PT</button>-<button class="w" data-k="d65-pt-inr">INR</button></td><td>≤ 1,2</td><td>> 1,2 à ≤ 1,4</td><td>> 1,4</td></tr><tr><td>Somme des quatre domaines <button class="w" data-k="d65-sofa">SOFA</button> retenus</td><td>0</td><td>1</td><td>≥ 2</td></tr></tbody></table>
<p>Le critère <button class="w" data-k="d65-sic">SIC</button> exige un total d’au moins quatre points <b>et</b> une somme des points plaquettes et <button class="w" data-k="d65-pt-inr">PT</button>-<button class="w" data-k="d65-pt-inr">INR</button> strictement supérieure à deux. Oublier cette seconde condition produit de faux classements. L’attribution des domaines <button class="w" data-k="d65-sofa">SOFA</button> doit suivre leur définition clinique complète ; la petite table n’est pas un substitut à cette évaluation.</p>
<div class="alert"><b>Point de décision.</b> Diagnostic de <button class="w" data-k="d65-classification">CIVD</button> manifeste : maladie compatible et score <button class="w" data-k="d65-sources">ISTH</button> 2025 ≥ 5, confrontés à la clinique et à la trajectoire. Un score inférieur n’exclut pas un stade précoce et ne retarde pas le traitement d’une urgence.</div><p><button class="w" data-k="d65-score-isth">Calculer le score ISTH sur un exemple</button> · <button class="w" data-k="d65-sic">Vérifier les deux conditions du SIC</button> · <button class="w" data-k="d65-ddimeres">Comparer correctement les D-dimères</button></p><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://www.hug.ch/laboratoire-hemostase/analyses-routine" target="_blank" rel="noopener">[S705] Laboratoire d’hémostase : analyses de routine</a>.</p></div></section>
<section class="ilot" id="d65-9"><h2><span class="n">9</span> Explorations : demander un examen pour une question</h2>
<p>Le bilan initial doit documenter la consommation, l’activation de la coagulation, les conséquences d’organe et la maladie causale. Les plaquettes, le <button class="w" data-k="d65-pt-inr">PT</button>, le fibrinogène et les D-dimères donnent une photographie utile, mais leur tendance et le moment du prélèvement sont essentiels. Les tests ne doivent pas être interprétés comme s’ils avaient été prélevés avant tous les traitements lorsqu’une transfusion ou une substitution a déjà eu lieu.</p>
<p>L’a <button class="w" data-k="d65-differentiel">PTT</button> complète l’exploration de l’hémostase selon la situation, mais n’entre pas dans le score <button class="w" data-k="d65-sources">ISTH</button> manifeste présenté ici. Les médicaments anticoagulants et leurs tests spécifiques doivent être pris en compte. L’anti-Xa peut répondre à une question d’exposition à certains anticoagulants ; il n’est pas un score de <button class="w" data-k="d65-classification">CIVD</button>. Aux HUG, ces analyses figurent dans une organisation institutionnelle dont la disponibilité ne doit pas être supposée identique partout.</p>
<p>Le frottis et les marqueurs d’hémolyse explorent une fragmentation érythrocytaire ou une autre cause d’anémie. La créatinine, la fonction hépatique, les données respiratoires et circulatoires orientent la souffrance des organes. Le lactate aide à apprécier un contexte d’hypoperfusion, sans attribuer à lui seul une cause à cette hypoperfusion. Les examens microbiologiques, l’imagerie ou les explorations tumorales sont choisis en fonction de l’hypothèse causale.</p>
<p>Les intervalles du laboratoire, la méthode, les unités et l’heure du prélèvement accompagnent chaque résultat. Une valeur normale unique ne neutralise pas un tableau clinique inquiétant ; une valeur anormale unique ne suffit pas à prouver une <button class="w" data-k="d65-classification">CIVD</button>. Les trois blocs de l’onglet « Examens complémentaires » reprennent ces questions avec leurs pièges.</p>
<div class="key"><b>À retenir.</b> Toujours noter : ce que mesure le test, l’unité, la référence locale, le traitement déjà reçu et la décision que le résultat peut réellement modifier.</div><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://www.hug.ch/laboratoire-hemostase/analyses-routine" target="_blank" rel="noopener">[S705] Laboratoire d’hémostase : analyses de routine</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S713] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div></section>
<section class="ilot" id="d65-10"><h2><span class="n">10</span> Arbre diagnostique : organiser les décisions parallèles</h2>
<p><b>Première étape : reconnaître la menace.</b> Si le patient saigne abondamment, présente un choc, une détresse respiratoire ou une défaillance d’organe évolutive, activer la filière adaptée. Stabilisation, traitement de la cause et examens se font en parallèle. L’arbre n’est pas une succession d’attentes administratives.</p>
<p><b>Deuxième étape : vérifier la cohérence du contexte.</b> Une maladie compatible et plusieurs anomalies qui évoluent ensemble renforcent l’hypothèse. Calculer le score avec les unités correctes, conserver les résultats antérieurs et documenter les transfusions. Dans le sepsis, le <button class="w" data-k="d65-sic">SIC</button> peut compléter l’identification d’une coagulopathie ; il ne remplace pas la recherche de la cause.</p>
<p><b>Troisième étape : chercher ce qui ne cadre pas.</b> Une hémolyse avec fragmentation, une exposition à l’héparine, un défaut de synthèse hépatique ou des pertes massives peuvent orienter vers un autre mécanisme ou une association. Demander tôt l’avis spécialisé lorsque le diagnostic différentiel modifie une décision urgente.</p>
<p><b>Quatrième étape : réévaluer.</b> Un score encore inférieur à cinq appelle une surveillance adaptée au risque et à la vitesse d’évolution. Une amélioration biologique doit être confrontée à la clinique, aux produits reçus et au contrôle de la cause. La fréquence des contrôles est déterminée par la gravité et le protocole du contexte ; aucun intervalle unique n’est imposé à toutes les <button class="w" data-k="d65-classification">CIVD</button>.</p>
<figure id="d65-causal-decision"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="550" viewBox="0 0 580 550" role="img" aria-label="Un parcours clinique réévalué"><title>Un parcours clinique réévalué</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="52" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Menace vitale ? traiter et</tspan><tspan x="290" dy="29">explorer en parallèle</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="182" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Cause compatible + tendances de</tspan><tspan x="290" dy="29">coagulation</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="312" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Score contextualisé et diagnostics</tspan><tspan x="290" dy="29">concurrents</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Contrôle de la cause puis</tspan><tspan x="290" dy="29">réévaluation clinique</tspan></text></svg><figcaption><b>Un parcours clinique réévalué.</b> Chaque étape peut être revisitée si le patient change ; un score ne constitue pas une autorisation automatique de médicament. Schéma causal non anatomique ; aucune structure du corps dessinée.</figcaption></figure><div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Un patient septique devient confus et oligurique. Le score de <button class="w" data-k="d65-classification">CIVD</button> manifeste est encore inférieur à cinq. Quelle conclusion est la plus juste ?</p><button data-ok="1">Traiter la menace et le sepsis, puis réévaluer la coagulation.</button><button data-ok="0">Attendre que le score atteigne cinq avant de demander de l’aide.</button><button data-ok="0">Exclure définitivement une CIVD.</button><p class="fb" hidden>Le processus peut être précoce et les signes d’organe ont plusieurs mécanismes. L’urgence clinique et le traitement causal ne dépendent pas de l’obtention d’un score complet.</p></div><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener">[S706] Surviving Sepsis Campaign : recommandations 2026</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S712] Akute Promyelozyten Leukämie (APL) — Onkopedia</a>.</p></div></section>
<section class="ilot" id="d65-11"><h2><span class="n">11</span> Prise en charge : trois objectifs distincts</h2>
<p><b>Traiter la cause</b> reste fondamental : contrôler l’infection et son foyer, arrêter une hémorragie ou prendre en charge une complication obstétricale ou tumorale. <b>Soutenir les organes</b> répond à la gravité immédiate. <b>Corriger un déficit hémostatique pertinent</b> aide à maîtriser un saignement ou à préparer une intervention lorsque cela est indiqué. Ces trois objectifs ne sont pas interchangeables.</p>
<p>Le fibrinogène, le plasma, les plaquettes et les concentrés érythrocytaires n’apportent pas la même chose. Un concentré de fibrinogène corrige un déficit précis ; il ne remplace pas tous les facteurs consommés ni les plaquettes. Les produits sont choisis selon l’hémorragie, le bilan, les procédures et la filière spécialisée. Les seuils d’une recommandation de traumatisme ou de péripartum ne doivent pas devenir des cibles universelles de <button class="w" data-k="d65-classification">CIVD</button>.</p>
<p>La revue de 2025 ne permet pas d’affirmer qu’un médicament unique traite efficacement toutes les <button class="w" data-k="d65-classification">CIVD</button>. Les résultats négatifs d’essais et les signaux d’analyses de sous-groupes ne sont pas une preuve d’efficacité générale. L’ancienne protéine C activée thérapeutique a été retirée ; elle n’est pas présentée comme une option actuelle. Les pratiques régionales concernant l’antithrombine ou la thrombomoduline recombinante ne constituent pas une autorisation suisse de routine.</p>
<table class="t"><thead><tr><th>Traitement ou stratégie</th><th>Question préalable</th><th>Limite à conserver</th></tr></thead><tbody><tr><td>Fibrinogène, Haemocomplettan P</td><td>Existe-t-il un déficit pertinent et quel objectif le contexte impose-t-il ?</td><td>Dose individualisée, risque thrombotique, contrôles répétés ; autres déficits possibles.</td></tr><tr><td>Héparine non fractionnée</td><td>Existe-t-il une indication spécialisée et une balance bénéfice–risque compatible ?</td><td>La mention <button class="w" data-k="d65-classification">CIVD</button> dans une <button class="w" data-k="d65-fi">FI</button> n’autorise pas une administration automatique chez un patient qui saigne.</td></tr><tr><td>Antithrombine, Kybernin P</td><td>Le patient relève-t-il de l’indication de la <button class="w" data-k="d65-fi">FI</button>, formulée sous déficit héréditaire ?</td><td>Une antithrombine abaissée dans une <button class="w" data-k="d65-classification">CIVD</button> ne suffit pas à justifier le produit.</td></tr><tr><td>Acide tranexamique</td><td>Existe-t-il une hyperfibrinolyse prédominante avec hémorragie grave, dans un cadre approprié ?</td><td>La <button class="w" data-k="d65-fi">FI</button> demande de ne pas traiter la majorité des <button class="w" data-k="d65-classification">CIVD</button> par ce médicament ; exception spécialisée.</td></tr><tr><td>Thromboprophylaxie du sepsis</td><td>Le risque hémorragique ou une autre contre-indication l’empêche-t-il ?</td><td>Prévenir une thrombose veineuse ne signifie pas traiter une <button class="w" data-k="d65-classification">CIVD</button> par anticoagulation curative.</td></tr></tbody></table>
<p>Dans le sepsis, la recommandation 2026 privilégie une thromboprophylaxie pharmacologique en l’absence de contre-indication, avec préférence pour une héparine de bas poids moléculaire dans ce cadre. Cette recommandation ne fournit pas ici une posologie universelle et ne doit pas être convertie en traitement curatif d’une consommation hémorragique. Les quatre fiches suisses de l’onglet pharmacologie expliquent les produits effectivement étudiés.</p>
<p><button class="w" data-k="d65-produits">Comparer les apports des produits sanguins</button> · <button class="w" data-k="d65-anticoagulation">Séparer prophylaxie et anticoagulation thérapeutique</button></p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener">[S706] Surviving Sepsis Campaign : recommandations 2026</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680462400506" target="_blank" rel="noopener">[S709] Héparine Bichsel 417/1000/5000 UI/mL</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680469280019" target="_blank" rel="noopener">[S708] Kybernin P 500/1000</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S710] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S715] Technique clinique : transfusions de produits sanguins labiles</a>.</p></div></section>
<section class="ilot" id="d65-12"><h2><span class="n">12</span> Prévention, suivi et situations particulières</h2>
<p>La prévention commence par la prise en charge de la maladie causale et la reconnaissance d’une dégradation. Ce cours ne propose pas de dépistage populationnel de la <button class="w" data-k="d65-classification">CIVD</button>. Chez une personne à risque, suivre les signes cliniques, les résultats successifs et les organes permet d’ajuster les décisions. Après la phase aiguë, la surveillance doit encore rechercher une récidive, une complication thrombotique, un effet indésirable ou une cause non contrôlée.</p>
<p>La sécurité transfusionnelle demande l’identification correcte de la personne et du produit, les vérifications prévues par le centre et une surveillance pendant l’administration. Devant une réaction suspecte, arrêter la transfusion, alerter, conserver l’accès et les éléments nécessaires à l’enquête selon la procédure locale. Une détresse respiratoire après transfusion a plusieurs causes possibles ; surcharge circulatoire et atteinte pulmonaire liée à la transfusion ne sont pas synonymes.</p>
<table class="t"><thead><tr><th>Situation</th><th>Adaptation essentielle</th><th>Ce qui n’est pas extrapolé</th></tr></thead><tbody><tr><td>Grossesse et péripartum</td><td>Objectifs obstétricaux, contrôle de l’hémorragie et équipe dédiée</td><td>Les exclusions CIM ne suppriment pas le mécanisme ; les doses et cibles ne deviennent pas universelles.</td></tr><tr><td>Traumatisme</td><td>Réanimation hémostatique guidée et contrôle des lésions</td><td>Le seuil de fibrinogène ≤ 1,5 g/L est rattaché à une recommandation de saignement majeur traumatique.</td></tr><tr><td>Leucémie promyélocytaire</td><td>Urgence hématologique, contrôles rapprochés et objectifs propres à cette maladie</td><td>Les cibles de fibrinogène 100–150 mg/dL et de plaquettes 30–50 G/L ne sont pas celles de toutes les <button class="w" data-k="d65-classification">CIVD</button>.</td></tr><tr><td>Atteinte rénale ou hépatique</td><td>Interprétation du bilan et des médicaments avec l’équipe spécialisée</td><td>Pas de dose rénale simplifiée de <button class="w" data-k="d65-txa">TXA</button> en insuffisance sévère, contre-indiquée dans sa <button class="w" data-k="d65-fi">FI</button>.</td></tr><tr><td>Enfant ou nouveau-né</td><td>Référentiel pédiatrique et néonatal adapté</td><td>Aucun protocole adulte universel ; P60 appartient au codage néonatal.</td></tr></tbody></table>
<p>En Suisse, les produits et leurs fiches professionnelles, l’hémovigilance et les procédures institutionnelles doivent être vérifiés. La couverture d’assurance dépend de la situation et des règles applicables ; le cours ne promet pas un remboursement automatique. Aucun délai spécifique de reprise du travail, de conduite automobile ou de prise en charge Suva propre à D65 n’a été établi dans les sources lues. La capacité fonctionnelle et la maladie causale nécessitent une appréciation individuelle.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S715] Technique clinique : transfusions de produits sanguins labiles</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/bewilligungen/i-310/i-310-aa-01-a01_mbklassierungundabklaerungvontransfusionsreaktione.pdf.download.pdf/I-310.AA.01-A01f_mbclassificationetanalysedesreactionstransfusionne.pdf" target="_blank" rel="noopener">[S716] Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S714] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S713] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S712] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S710] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S723] OFSP, liste des spécialités</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S724] OFSP, cas particuliers, art. 71 a–d OAMal</a> ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d65-d69.htm" target="_blank" rel="noopener">[S702] ICD-10-GM 2024, D65</a>.</p></div></section>
<section class="ilot" id="d65-13"><h2><span class="n">13</span> Paramètres clés : un chiffre doit garder son objectif</h2>
<p>Un seuil diagnostique, un seuil d’intervention et une cible de traitement répondent à trois questions différentes. Le fibrinogène illustre ce piège : le score <button class="w" data-k="d65-sources">ISTH</button> attribue un point sous 1 g/L ; la directive européenne de traumatisme recommande une substitution devant un saignement majeur accompagné d’un fibrinogène Clauss ≤ 1,5 g/L ou d’un déficit fonctionnel viscoélastique ; la directive péripartale expose des objectifs plus élevés dans son contexte.</p>
<table class="t"><thead><tr><th>Valeur ou calcul</th><th>Sens exact</th><th>Piège évité</th></tr></thead><tbody><tr><td>100 mg/dL = 1 g/L</td><td>Conversion de concentration : diviser les mg/dL par 100 pour obtenir des g/L</td><td>Ne pas lire 100 mg/dL comme 100 g/L.</td></tr><tr><td>D-dimères mesurés ÷ limite supérieure normale</td><td>Rapport sans unité, si méthode et unité sont cohérentes</td><td>Ne pas comparer des valeurs absolues de deux méthodes différentes.</td></tr><tr><td><button class="w" data-k="d65-pt-inr">PT</button> du patient − <button class="w" data-k="d65-pt-inr">PT</button> témoin</td><td>Allongement exprimé en secondes pour le score manifeste</td><td>Ne pas insérer directement un <button class="w" data-k="d65-pt-inr">INR</button> dans une colonne en secondes.</td></tr><tr><td>2 g de fibrinogène à 20 mg/mL</td><td>2 000 mg ÷ 20 mg/mL = 100 mL</td><td>Masse, concentration et volume sont trois grandeurs distinctes.</td></tr><tr><td>100 mL à un débit maximal de 5 mL/min</td><td>Durée minimale arithmétique de 20 minutes pour ce volume</td><td>Un calcul de durée ne décide ni de l’indication ni de la dose.</td></tr></tbody></table>
<p>La <button class="w" data-k="d65-fi">FI</button> de Haemocomplettan P demande, après substitution, de ne pas dépasser la limite inférieure de la normale pour limiter le risque thromboembolique. Les objectifs de la directive obstétricale peuvent être plus élevés. Cette différence doit rester visible et être arbitrée dans le contexte spécialisé ; les deux textes ne sont pas présentés comme une cible identique.</p>
<div class="key"><b>À retenir.</b> Fibrinogène : diagnostic < 1 g/L ; intervention traumatique ≤ 1,5 g/L avec saignement majeur ; objectifs péripartaux spécifiques autour de 2–2,5 g/L selon le texte. Ne jamais changer de contexte sans le dire.</div><p><button class="w" data-k="d65-unites">Refaire la conversion mg/dL → g/L</button> · <button class="w" data-k="d65-calcul-fib">Refaire le calcul de volume et de durée</button></p><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S713] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S714] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a>.</p></div></section>
<section class="ilot" id="d65-14"><h2><span class="n">14</span> Pièges, critères formels et raisonnement d’examen</h2>
<p>Les situations d’examen doivent faire reconnaître une menace, formuler une hypothèse et justifier la prochaine décision. La connaissance d’un score devient utile si ses conditions d’utilisation sont respectées. Elle devient dangereuse si elle fait ignorer un saignement actif, une maladie causale urgente ou un diagnostic concurrent.</p>
<table class="t"><thead><tr><th>Raccourci trompeur</th><th>Raisonnement à conserver</th></tr></thead><tbody><tr><td>« D-dimères élevés = <button class="w" data-k="d65-classification">CIVD</button> »</td><td>Il faut un contexte compatible, un ensemble de données et leur évolution.</td></tr><tr><td>« Fibrinogène normal = <button class="w" data-k="d65-classification">CIVD</button> exclue »</td><td>Un processus précoce ou une synthèse concomitante peut masquer une consommation.</td></tr><tr><td>« Score élevé = héparine pour tous »</td><td>Le traitement dépend du mécanisme, du saignement, de l’indication et de la balance bénéfice–risque.</td></tr><tr><td>« Tout saignement de <button class="w" data-k="d65-classification">CIVD</button> nécessite du <button class="w" data-k="d65-txa">TXA</button> »</td><td>La <button class="w" data-k="d65-fi">FI</button> restreint son emploi à une exception spécialisée ; la majorité des <button class="w" data-k="d65-classification">CIVD</button> ne doit pas en recevoir.</td></tr><tr><td>« Source biologique correcte = lien bibliographique suffisant »</td><td>Le cours doit permettre de retrouver la bonne version et le bon passage, avec leurs limites.</td></tr></tbody></table><div class="alert"><b>Point de décision.</b> Critères formels à vérifier : maladie compatible ; unités et méthode identifiées ; score <button class="w" data-k="d65-sources">ISTH</button> 2025 correctement calculé, ≥ 5 pour une forme manifeste ; clinique, trajectoire et diagnostics concurrents examinés. Pour <button class="w" data-k="d65-sic">SIC</button> : sepsis, total ≥ 4 et somme plaquettes + <button class="w" data-k="d65-pt-inr">INR</button> > 2. Les sous-codes D65.0, D65.1, D65.2 et D65.9 décrivent le classement, pas un traitement.</div><div class="key"><b>À retenir.</b> Paramètres décisifs : plaquettes en G/L ; D-dimères en multiples de la limite locale ; allongement du <button class="w" data-k="d65-pt-inr">PT</button> en secondes ; fibrinogène en g/L ; seuils et objectifs attribués à leur contexte. Les résultats évolutifs comptent autant que le total.</div>
<p><button class="w" data-k="d65-profiles">PROFILES</button> et les documents suisses de l’examen fournissent un cadre de raisonnement et de compétences ; ils ne permettent pas de prédire un sujet ni de certifier une note de qualité de ce cours. Les cas interactifs sont fictifs. Les limites de recherche, les dates des fiches et la nature de l’auto-relecture restent consultables dans les sources.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Cas fictif : plaquettes 45 G/L, D-dimères huit fois la limite locale, <button class="w" data-k="d65-pt-inr">PT</button> allongé de 4 s et fibrinogène 0,8 g/L, avec maladie compatible. Quel total donne le score <button class="w" data-k="d65-sources">ISTH</button> présenté ?</p><button data-ok="1">Sept points : 2 + 3 + 1 + 1.</button><button data-ok="0">Cinq points, en comptant deux catégories de D-dimères.</button><button data-ok="0">Quatre points, car le PT doit être remplacé par un INR.</button><p class="fb" hidden>Une catégorie par paramètre : plaquettes 2, D-dimères 3, <button class="w" data-k="d65-pt-inr">PT</button> 1 et fibrinogène 1. Le total est compatible avec une <button class="w" data-k="d65-classification">CIVD</button> manifeste ; il ne choisit pas seul le médicament.</p></div><p><button class="w" data-k="d65-profiles">Situer ce raisonnement dans le cadre suisse de formation</button> · <button class="w" data-k="d65-sources">Consulter les références et les limites de lecture</button></p><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S710] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S720] PROFILES 2017, situations de départ</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">[S721] OFSP/MEBEKO, exigences examen 2026, §2</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" target="_blank" rel="noopener">[S722] Swiss Medical Weekly 2025, transition PROFILES 2</a> ; <a data-reference-source="1" href="https://www.mct.bfs.admin.ch/en/cim10/2024/hierarchy/III/D65-D69?lang=fr" target="_blank" rel="noopener">[S701] CIM-10-GM 2024 français : D65 et subdivisions</a> ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d65-d69.htm" target="_blank" rel="noopener">[S702] ICD-10-GM 2024, D65</a>.</p></div></section><button class="pareto-btn ui" data-k="pareto-d65-cours">▲ Loi de Pareto — Monographie</button><details id="d65-reference-index"><summary>Ouvrir une explication ou une synthèse</summary><ul><li><button class="w" data-k="d65-classification">D65 : quatre catégories, pas quatre stades</button></li><li><button class="w" data-k="d65-coagulation">Hémostase normale : localisation et régulation</button></li><li><button class="w" data-k="d65-fibrinolyse">Fibrinolyse : ni toujours excessive, ni toujours insuffisante</button></li><li><button class="w" data-k="d65-chronologie">Le résultat biologique a une histoire</button></li><li><button class="w" data-k="d65-differentiel">Schizocytes : un signe de fragmentation</button></li><li><button class="w" data-k="d65-score-isth">Score ISTH 2025 : refaire une addition</button></li><li><button class="w" data-k="d65-sic">SIC : deux conditions simultanées</button></li><li><button class="w" data-k="d65-ddimeres">D-dimères : toujours avec méthode et limite locale</button></li><li><button class="w" data-k="d65-produits">Les produits n’apportent pas la même chose</button></li><li><button class="w" data-k="d65-anticoagulation">Prévenir une thrombose n’est pas traiter une CIVD</button></li><li><button class="w" data-k="d65-unites">Convertir mg/dL en g/L</button></li><li><button class="w" data-k="d65-calcul-fib">Fibrinogène : dose, volume et durée</button></li><li><button class="w" data-k="d65-pt-inr">PT, allongement et INR</button></li><li><button class="w" data-k="d65-cibles">Trois usages différents du fibrinogène</button></li><li><button class="w" data-k="d65-fi">Lire une fiche suisse de produit</button></li><li><button class="w" data-k="d65-fibrinogene">Fibrinogène : substrat de la fibrine</button></li><li><button class="w" data-k="d65-antithrombine">Antithrombine : mécanisme et indication distincts</button></li><li><button class="w" data-k="d65-heparine">HNF et HBPM : ne pas confondre les cadres</button></li><li><button class="w" data-k="d65-txa">TXA : l’acide tranexamique exige une indication</button></li><li><button class="w" data-k="d65-calcul-txa">TXA : calculer sans changer de concentration</button></li><li><button class="w" data-k="d65-tih">TIH : une complication qui garde son diagnostic propre</button></li><li><button class="w" data-k="d65-sofa">SOFA dans le SIC : seulement quatre domaines retenus</button></li><li><button class="w" data-k="d65-net">NETs : un lien entre immunité et coagulation</button></li><li><button class="w" data-k="d65-tfpi">TFPI : un frein de la voie du facteur tissulaire</button></li><li><button class="w" data-k="d65-transfusion">Transfusion : identité, surveillance et réaction</button></li><li><button class="w" data-k="d65-taco-trali">Dyspnée après transfusion : plusieurs mécanismes</button></li><li><button class="w" data-k="d65-rein">Une table rénale ne supprime pas une contre-indication</button></li><li><button class="w" data-k="d65-apl">Leucémie promyélocytaire : une urgence distincte</button></li><li><button class="w" data-k="d65-causes">Une même étiquette, des causes différentes</button></li><li><button class="w" data-k="d65-profiles">Cadre suisse de formation et limites de l’exercice</button></li><li><button class="w" data-k="d65-sources">Sources, dates et limites</button></li><li> <div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="d65-e-1"><h2>1. Mesurer consommation et activation</h2>
<p>La numération plaquettaire exprime une concentration, habituellement en G/L, soit des milliards de plaquettes par litre. Le résultat doit être comparé aux valeurs antérieures et à la référence du laboratoire. Une chute peut être informative avant même le franchissement d’un seuil du score. Les plaquettes transfusées et les autres traitements modifient cette trajectoire : noter leur chronologie évite une fausse impression de résolution.</p>
<p>Le temps de prothrombine est un temps de coagulation. Pour le score <button class="w" data-k="d65-sources">ISTH</button> manifeste, demander ou calculer l’allongement par rapport au témoin en secondes. Un <button class="w" data-k="d65-pt-inr">PT</button> de 17 secondes comparé à un témoin de 12 secondes donne un allongement de 5 secondes ; cet exemple fictif vaut un point dans ce paramètre du score. Il ne donne pas un <button class="w" data-k="d65-pt-inr">INR</button> de cinq. Le <button class="w" data-k="d65-pt-inr">PT</button>-<button class="w" data-k="d65-pt-inr">INR</button> est utilisé différemment dans le <button class="w" data-k="d65-sic">SIC</button> ; les deux expressions ne doivent pas être interchangées.</p>
<p>Le fibrinogène est le substrat transformé en fibrine. La méthode Clauss est la méthode de contrôle mentionnée par la <button class="w" data-k="d65-fi">FI</button> suisse de Haemocomplettan P. La valeur doit être interprétée avec la clinique, la synthèse, la consommation et les produits administrés. La <button class="w" data-k="d65-fi">FI</button> indique une plage normale de 200–450 mg/dL, soit 2–4,5 g/L ; il s’agit de la référence donnée par ce document, pas d’un remplacement de l’intervalle du laboratoire ni d’une cible pour toute personne enceinte.</p>
<p>Les D-dimères renseignent sur la dégradation de fibrine réticulée. Une augmentation n’est pas spécifique de la <button class="w" data-k="d65-classification">CIVD</button>. Pour le score 2025, rapporter le résultat à la limite supérieure de la méthode, avec la même unité. Une valeur de 4 mg/L avec une limite locale de 0,5 mg/L donne un rapport de huit ; ces nombres sont fictifs et ne définissent pas la norme d’un laboratoire réel. La comparaison de résultats <button class="w" data-k="d65-ddimeres">FEU</button> et <button class="w" data-k="d65-ddimeres">DDU</button> sans précaution est un piège.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://www.hug.ch/laboratoire-hemostase/analyses-routine" target="_blank" rel="noopener">[S705] Laboratoire d’hémostase : analyses de routine</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a>.</p></div><p><button class="w" data-k="d65-pt-inr">PT, allongement et INR : trois expressions à distinguer</button> · <button class="w" data-k="d65-ddimeres">Lire méthode, unité et limite supérieure</button></p></section>
<section class="ilot" id="d65-e-2"><h2>2. Examiner la cellule et la souffrance des organes</h2>
<p>Un frottis peut montrer une fragmentation des hématies. Ce résultat oriente vers une destruction mécanique, mais ne nomme pas à lui seul le syndrome causal. Une <button class="w" data-k="d65-classification">CIVD</button> et une microangiopathie thrombotique peuvent partager des signes d’hémolyse. L’interprétation relève de la morphologie, du contexte clinique et des autres examens ; une image pédagogique normale ne remplace pas l’examen du prélèvement du patient.</p>
<p>Les paramètres d’hémolyse, la fonction rénale et hépatique, l’état respiratoire et les données de perfusion répondent à des questions complémentaires. Une oligurie ne démontre pas que les reins contiennent des microthrombus ; une hypoxémie ne prouve pas un mécanisme unique. La maladie causale, l’état circulatoire et les traitements reçus doivent rester dans le diagnostic différentiel.</p>
<p>Le lactate peut contribuer à suivre un contexte d’hypoperfusion, notamment lors d’un traumatisme ou d’un choc. Son interprétation dépend aussi de la production et de l’élimination. Aucune valeur de lactate n’est ajoutée au score <button class="w" data-k="d65-sources">ISTH</button> présenté. Les examens spécialisés d’une microangiopathie ou d’une complication de l’héparine sont demandés avec l’équipe compétente lorsque l’hypothèse peut modifier un traitement urgent.</p>
<figure id="d65-exam-original-blood" data-origin="human-original"><img src="assets/img/d65/alpha/codex/normal-peripheral-blood.jpg" alt="Champ large de frottis sanguin humain avec disques rouges et barre originale de cent micromètres" loading="lazy"><figcaption><b>Le frottis sanguin humain : voir sans surinterpréter.</b> Crédit : Степанюк Ярослав et Борис Максим, Wikimedia Commons. <a href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">Provenance originale</a> ; <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels intacts. <a href="#d65-exam-original-blood-annotations">Lire les quatre repères français ci-dessous</a>.</figcaption></figure><div class="key" id="d65-exam-original-blood-annotations" role="note"><p><b>Lecture annotée de l’original.</b> <b>Repère 1, disques rouges :</b> hématies réparties sur la lame. <b>Repère 2, centres plus clairs :</b> contraste visible de nombreuses cellules, sans mesure individuelle. <b>Repère 3, zones denses et espacées :</b> distribution variable sur la préparation ; elle ne donne pas la numération du patient. <b>Repère 4, haut gauche :</b> barre originale de 100 µm. Ce faible grossissement ne permet pas de certifier une absence de schizocytes. Cette image illustrative ne prouve ni n’exclut une <button class="w" data-k="d65-classification">CIVD</button>. Le statut clinique du sujet n’est pas établi par cette notice.</p></div><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/430207/3709751/RMS_607_1021.pdf" target="_blank" rel="noopener">[S711] Anémies hémolytiques et cancers</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S713] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680462400506" target="_blank" rel="noopener">[S709] Héparine Bichsel 417/1000/5000 UI/mL</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">[S719] Human blood smear — Кров людини</a>.</p></div></section>
<section class="ilot" id="d65-e-3"><h2>3. Relier le bilan à une décision et à une nouvelle mesure</h2>
<p>Les explorations de la cause sont adaptées au tableau : recherche d’un foyer infectieux, bilan d’une lésion traumatique ou d’une complication obstétricale, exploration hématologique ou tumorale. L’examen doit avoir une question précise et un effet possible sur la conduite. En cas de menace vitale, la recherche ne doit pas retarder le traitement causal nécessaire.</p>
<p>Avant d’attribuer une variation à l’évolution de la maladie, vérifier l’heure et les conditions du prélèvement, les traitements anticoagulants, les transfusions et les substitutions. Le laboratoire peut aider à examiner une incohérence ou une interférence. Les HUG décrivent une organisation d’analyses d’hémostase avec des examens de routine et des examens spécialisés ; ce cadre institutionnel n’est pas une promesse de disponibilité immédiate dans tous les lieux de soins.</p>
<p>Après une intervention, évaluer à la fois son effet biologique et son effet clinique. Corriger un fibrinogène ne garantit pas que l’hémorragie est contrôlée ; améliorer un score ne garantit pas que la cause est résolue. Documenter le produit, la dose, l’heure et la réaction permet de comprendre la mesure suivante et d’assurer la traçabilité.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Un résultat de D-dimères est élevé, mais son unité et la limite supérieure du laboratoire ne sont pas connues. Que faire avant de lui attribuer les points du score 2025 ?</p><button data-ok="1">Obtenir la méthode, l’unité et la limite locale correspondante.</button><button data-ok="0">Employer automatiquement une limite fixe valable pour tous les laboratoires.</button><button data-ok="0">Remplacer les D-dimères par le fibrinogène.</button><p class="fb" hidden>Le score utilise un multiple de la limite supérieure de la méthode. Un chiffre isolé, sans unité ni référence cohérente, ne permet pas ce calcul.</p></div><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://www.hug.ch/laboratoire-hemostase/analyses-routine" target="_blank" rel="noopener">[S705] Laboratoire d’hémostase : analyses de routine</a> ; <a data-reference-source="1" href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener">[S706] Surviving Sepsis Campaign : recommandations 2026</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S715] Technique clinique : transfusions de produits sanguins labiles</a>.</p></div></section><button class="pareto-btn ui" data-k="pareto-d65-examens">▲ Loi de Pareto — Examens</button></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="d65-tab-semio" role="tab" aria-selected="true" aria-controls="d65-s-semio" data-s="d65-s-semio">Sémiologie fondamentale et analytique</button><button id="d65-tab-anat" role="tab" aria-selected="false" aria-controls="d65-s-anat" data-s="d65-s-anat">Anatomie</button><button id="d65-tab-histo" role="tab" aria-selected="false" aria-controls="d65-s-histo" data-s="d65-s-histo">Histologie</button><button id="d65-tab-phys" role="tab" aria-selected="false" aria-controls="d65-s-phys" data-s="d65-s-phys">Physiologie</button><button id="d65-tab-bio" role="tab" aria-selected="false" aria-controls="d65-s-bio" data-s="d65-s-bio">Biochimie et hémostase</button><button id="d65-tab-immuno" role="tab" aria-selected="false" aria-controls="d65-s-immuno" data-s="d65-s-immuno">Immunologie</button></div><div class="chap-body sci-body"><div class="sci" id="d65-s-semio" role="tabpanel" aria-labelledby="d65-tab-semio"><section class="ilot" id="d65-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><h4>La fonction normale : contenir une brèche sans obstruer la circulation</h4><p>Une hémostase efficace doit former un caillot là où il est utile et maintenir le reste de la circulation ouvert. Les plaquettes, les facteurs plasmatiques et la surface des cellules participent à cette localisation. La thrombine transforme le fibrinogène en fibrine ; les mécanismes anticoagulants et la fibrinolyse limitent ensuite l’extension et la persistance de la réaction. L’endothélium est une interface active de cet équilibre.</p><p>Cette organisation explique la question clinique centrale : le sang peut-il encore assurer la perfusion tout en arrêtant un saignement ? Dans une <button class="w" data-k="d65-classification">CIVD</button>, ces fonctions peuvent se dégrader simultanément. La normalité ne se résume donc pas à un chiffre de plaquettes ou de fibrinogène ; elle suppose une régulation adaptée au lieu, au temps et au besoin.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis" target="_blank" rel="noopener">[S718] 18.5 Hemostasis  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a>.</p></div></section><section class="ilot" id="d65-semio-signs" data-semiology="signs"><h3>Les signes : observer saignement et ischémie ensemble</h3><p>Le saignement aux muqueuses, aux sites de ponction ou sur un champ opératoire peut révéler une hémostase consommée ou une fibrinolyse excessive. Le purpura et les ecchymoses rendent une partie du problème visible, sans en déterminer à eux seuls la cause. L’absence d’un saignement spectaculaire ne rassure pas sur la microcirculation.</p><p>La cyanose acrale, une nécrose périphérique, l’oligurie, l’hypoxémie et les troubles de conscience peuvent accompagner une atteinte d’organe. Leur interprétation reste multifactorielle : le choc, l’infection, les traitements et une maladie préexistante peuvent intervenir. Les signes sont recherchés ensemble, datés et répétés ; aucune photographie ni observation isolée ne donne une probabilité certaine de <button class="w" data-k="d65-classification">CIVD</button>.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a>.</p></div></section><section class="ilot" id="d65-semio-mechanisms" data-semiology="mechanisms"><h3>Le mécanisme : consommer en formant des thrombi</h3><p>L’activation diffuse de la coagulation produit de la thrombine et de la fibrine dans la circulation. Les plaquettes participent aux dépôts et peuvent être consommées. Les réserves de facteurs diminuent si leur utilisation dépasse leur renouvellement. Un patient peut alors développer des obstructions microvasculaires tout en disposant de moins de moyens pour arrêter une hémorragie.</p><p>La fibrinolyse modifie ce profil. Si elle est trop freinée, la persistance des dépôts favorise l’obstruction ; si elle devient excessive, la dégradation du matériel hémostatique peut aggraver le saignement. Le contexte causal et le moment de l’observation déterminent leur combinaison. Cette dynamique explique pourquoi un médicament utile dans une situation peut être inapproprié dans une autre.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S710] Tranexamic Acid Leman, solution injectable 100 mg/mL</a>.</p></div></section><section class="ilot" id="d65-semio-examination" data-semiology="examination"><h3>L’examen : choisir une mesure pour une fonction</h3><p>La numération plaquettaire mesure une concentration de cellules ou fragments circulants, mais pas toutes leurs fonctions. Le <button class="w" data-k="d65-
