<template data-pop="g63-atypiques" data-title="Signes atypiques chez un diabétique : bilan étendu et avis neurologique">
<div class="lab">Signes</div><p>Début aigu, distribution non dépendante de la longueur des nerfs, prédominance motrice, asymétrie. Ces caractères s’écartent de la neuropathie diabétique typique, qui est lente, distale, symétrique et d’abord sensitive.</p>
<div class="lab">Conduite</div><p>Un avis neurologique et un bilan étendu s’imposent : vitamine B12, thyroïde, immunofixation des protéines, liquide cérébrospinal, imagerie par résonance magnétique, génétique et, rarement, biopsie.</p>
<div class="lab">Raison</div><p>Le diabète est fréquent : il coexiste avec d’autres causes de neuropathie, y compris des causes traitables ou graves. Le diagnostic de neuropathie diabétique reste un diagnostic d’exclusion.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7096070/" target="_blank" rel="noopener">Feldman et coll., Diabetic neuropathy, Nature Reviews Disease Primers, 2019</a>.</p></template>
<template data-pop="g63-labo" data-title="Laboratoire de base et étendu : liste et indications">
<div class="lab">Bilan de base</div><p>Protéine C réactive, formule sanguine, électrolytes, fonctions hépatique et rénale, électrophorèse et immunofixation des protéines, protéinurie de Bence Jones, TSH, hémoglobine glyquée, CDT, vitamine B12.</p>
<div class="lab">Bilan étendu</div><p>Holotranscobalamine ; vitamines B1, B6 et E ; anticorps antinucléaires ; ANCA périnucléaires et cytoplasmiques ; cryoglobulines ; sérologies des hépatites, du virus de l’immunodéficience humaine et de Borrelia ; anticorps anti-GM1 IgM, anti-GQ1b et anti-MAG ; liquide cérébrospinal avec sérologies.</p>
<div class="lab">Limite</div><p>Les sources lues ne donnent pas de valeurs de référence chiffrées pour ces dosages : le seuil du laboratoire utilisé fait foi. Le bilan étendu est réservé aux signes atypiques ou aux neuropathies sévères sans cause.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et coll., Polyneuropathies, Deutsches Ärzteblatt International, 2018</a>.</p></template>
<template data-pop="g63-vascul" data-title="Neuropathie vasculitique : critères cliniques et traitement">
<div class="lab">Définition clinique</div><p>Atteinte sensitive ou sensitivo-motrice, asymétrique ou multifocale, distale, prédominant aux membres inférieurs, douloureuse, à évolution aiguë par poussées, avec une neurophysiologie non démyélinisante.</p>
<div class="lab">Orientation vers une vasculite systémique</div><p>Atteinte d’autres organes, ANCA, cryoglobulines, vitesse de sédimentation de 100 mm/h ou plus. La biopsie combinée du nerf, du muscle et de la peau augmente le rendement.</p>
<div class="lab">Traitement de la forme non systémique</div><p>Les corticoïdes en monothérapie pendant au moins 6 mois forment la première ligne. Une association à un immunosuppresseur (cyclophosphamide, azathioprine, méthotrexate) s’impose si la neuropathie progresse vite ou sous corticoïdes. Le cyclophosphamide est réservé aux formes sévères, de préférence en bolus intraveineux. Après une rémission sous association, l’entretien dure 18 à 24 mois, par azathioprine ou méthotrexate.</p>
<div class="lab">Limite</div><p>Recommandation de 2010, lue en résumé seulement.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1529-8027.2010.00281.x" target="_blank" rel="noopener">Collins et coll., recommandation du Peripheral Nerve Society sur la neuropathie vasculitique non systémique, Journal of the Peripheral Nervous System, 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et coll., 2018</a>.</p></template>
<template data-pop="g63-pnscare" data-title="Score PNS-Care : définition du syndrome paranéoplasique">
<div class="lab">Définition</div><p>Un syndrome paranéoplasique est dit définitif lorsque le score PNS-Care atteint au moins 8. Le score additionne le phénotype clinique, les anticorps à haut ou moyen risque et la présence d’un cancer.</p>
<div class="lab">Dépistage tumoral</div><p>Il est rapide ; il est répété tous les 4 à 6 mois pendant 2 ans si le phénotype est à haut risque, l’anticorps à haut risque et le premier bilan négatif.</p>
<div class="lab">Limite</div><p>Les tableaux 1 et 2 de la publication de 2021 n’ont pas été lus : le détail des points attribués à chaque élément n’est pas reproduit.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8237398/" target="_blank" rel="noopener">Graus et coll., Updated diagnostic criteria for paraneoplastic neurologic syndromes, 2021</a>.</p></template>
<template data-pop="g63-pidc" data-title="Polyradiculoneuropathie chronique, Guillain-Barré et neuropathie motrice multifocale">
<div class="lab">Guillain-Barré</div><p>Incidence de 1 à 2 pour 100 000 par an ; maximum atteint en 4 semaines au plus. Hospitalisation rapide : troubles conductifs cardiaques et insuffisance respiratoire. Si la progression continue au-delà de 8 semaines, le diagnostic est requalifié en polyradiculoneuropathie chronique à début aigu, ce qui concerne environ 5 % des patients (EAN/PNS, 2023).</p>
<div class="lab">Polyradiculoneuropathie inflammatoire démyélinisante chronique</div><p>Prévalence de 2 à 3 pour 100 000 ; évolution d’au moins 8 semaines ; faiblesse proximale et distale symétrique, aréflexie ; démyélinisation électrophysiologique ; liquide cérébrospinal à moins de 10 leucocytes par microlitre avec protéines élevées. La révision européenne de 2021 distingue la forme typique et des variantes (multifocale, focale, distale, motrice, sensitive) et ne garde que deux niveaux de certitude : la maladie et la maladie possible.</p>
<div class="lab">Neuropathie motrice multifocale</div><p>Incidence de 0,6 à 2 pour 100 000 ; faiblesse distale asymétrique, blocs de conduction ; anticorps anti-GM1 IgM dans environ 50 % des cas.</p>
<div class="lab">Limite</div><p>La recommandation de 2021 n’a été lue qu’en résumé.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/ene.16073" target="_blank" rel="noopener">van Doorn et coll., recommandation EAN/PNS sur le syndrome de Guillain-Barré, European Journal of Neurology, 2023</a> (résumé) ; <a href="https://doi.org/10.1111/ene.14959" target="_blank" rel="noopener">Van den Bergh et coll., recommandation EAN/PNS sur la polyradiculoneuropathie chronique, European Journal of Neurology, 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et coll., 2018</a>.</p></template>
<template data-pop="g63-contglyc" data-title="Contrôle glycémique et neuropathie : type 1, type 2 et risques">
<div class="lab">Données</div><p>Le contrôle glycémique est efficace dans le type 1 (différence de risque annualisée de −1,84 ; intervalle de confiance de −2,56 à −1,11). Il n’est pas significatif dans le type 2 (−0,58 ; intervalle de −1,17 à 0,01).</p>
<div class="lab">Risques</div><p>Un objectif d’hémoglobine glyquée inférieur à 6 % a accru la mortalité dans le type 2. Un contrôle trop agressif peut provoquer une neuropathie induite par le traitement.</p>
<div class="lab">Explication</div><p>L’insulinorésistance neuronale pourrait expliquer en partie le moindre bénéfice dans le type 2 ; c’est une hypothèse.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7096070/" target="_blank" rel="noopener">Feldman et coll., Diabetic neuropathy, Nature Reviews Disease Primers, 2019</a>.</p></template>
<template data-pop="g63-douleur" data-title="Douleur neuropathique : lignes de traitement et niveaux de preuve">
<div class="lab">Révision NeuPSIG de 2025, en vigueur</div><p>La révision repose sur 313 essais. Première ligne, recommandation forte : antidépresseurs tricycliques, ligands α2δ (prégabaline, gabapentine), inhibiteurs de la recapture de la sérotonine et de la noradrénaline. Deuxième ligne, recommandation faible : capsaïcine à 8 % en patch, capsaïcine en crème, lidocaïne à 5 % en emplâtre. Troisième ligne, recommandation faible : toxine botulique A, stimulation magnétique transcrânienne répétée, opioïdes.</p>
<div class="lab">Version antérieure de 2015</div><p>La méta-analyse de 2015 plaçait la lidocaïne topique, la capsaïcine à haute concentration et le tramadol en deuxième ligne, puis les opioïdes forts et la toxine botulique A en troisième. Le tramadol a donc quitté la deuxième ligne en 2025.</p>
<div class="lab">Recommandation européenne de 2010</div><p>Preuves de niveau A pour les tricycliques, la prégabaline, la gabapentine, le tramadol, les opioïdes, la duloxétine et la venlafaxine ; l’association d’un tricyclique à la gabapentine et celle de la gabapentine à un opioïde sont utiles.</p>
<div class="lab">Revue allemande de 2018</div><p>Gabapentinoïdes, tricycliques et duloxétine en premier choix ; capsaïcine à 8 %, lidocaïne et tramadol en deuxième ; opioïdes forts en troisième.</p>
<div class="lab">Statut suisse</div><p>La toxine botulique A n’a pas d’indication suisse de douleur neuropathique, et aucune spécialité de lidocaïne à 5 % en emplâtre n’a été trouvée dans l’index AmiKo : leur emploi serait hors indication. La gabapentine n’est autorisée que pour la neuropathie diabétique et la névralgie postherpétique.</p>
<div class="lab">Choix de la source</div><p>La révision de 2025 est la source primaire la plus récente ; elle l’emporte sur les versions de 2015 et 2010, conservées ici pour comparaison. Les sources de 2025, 2015 et 2010 ont été lues en résumé seulement. Les recommandations américaines ne sont pas retenues comme fondement.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(25)00068-7" target="_blank" rel="noopener">Soliman et coll., Lancet Neurology, 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4493167/" target="_blank" rel="noopener">Finnerup et coll., Lancet Neurology, 2015</a> ; <a href="https://doi.org/10.1111/j.1468-1331.2010.02999.x" target="_blank" rel="noopener">Attal et coll., recommandation de l’EFNS, 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et coll., 2018</a> ; indication suisse de BOTOX, Swissmedic (AIPS via AmiKo), consultée le 16 octobre 2026.</p></template>
<template data-pop="g63-nnt" data-title="Nombre de patients à traiter : valeurs de 2025 et lecture en douleur neuropathique">
<div class="lab">Définition</div><p>Le nombre de patients à traiter est l’effectif qu’il faut traiter pour obtenir un répondeur de plus qu’avec le placebo. Plus il est bas, plus le traitement est efficace en moyenne.</p>
<table class="t"><thead><tr><th>Classe (révision de 2025)</th><th>Nombre de patients à traiter</th></tr></thead><tbody><tr><td>Antidépresseurs tricycliques</td><td>4,6</td></tr><tr><td>Inhibiteurs de la recapture de la sérotonine et de la noradrénaline</td><td>7,4</td></tr><tr><td>Ligands α2δ (prégabaline, gabapentine)</td><td>8,9</td></tr><tr><td>Capsaïcine à 8 % (deuxième ligne)</td><td>13,2</td></tr></tbody></table>
<div class="lab">Lecture</div><p>Ces valeurs sont des estimations poolées d’essais contre placebo. Elles ne comparent pas directement les classes et ne suffisent pas à les hiérarchiser : le choix suit le terrain et les contre-indications. En 2015, les valeurs étaient de 6,4 pour les inhibiteurs de la recapture, 7,7 pour la prégabaline, 7,2 pour la gabapentine et 10,6 pour la capsaïcine à 8 % ; elles étaient déjà plus basses pour les tricycliques.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(25)00068-7" target="_blank" rel="noopener">Soliman et coll., Pharmacotherapy and non-invasive neuromodulation for neuropathic pain, Lancet Neurology, 2025</a> (résumé) ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4493167/" target="_blank" rel="noopener">Finnerup et coll., Lancet Neurology, 2015</a> (résumé).</p></template>
<template data-pop="g63-pronostic-pied" data-title="Pronostic du pied après ulcère ou amputation">
<div class="lab">Récidive</div><p>Après un ulcère, le risque de récidive est jusqu’à 36 fois plus élevé ; la récidive atteint jusqu’à 40 % à un ou deux ans.</p>
<div class="lab">Réamputation et mortalité</div><p>La réamputation cumulée atteint 27 % à 1 an, 48 % à 3 ans et 61 % à 5 ans. La mortalité cumulée à 5 ans est de 46 % après amputation.</p>
<div class="lab">Conséquence</div><p>Ces chiffres justifient l’intensité des contrôles des catégories 3a et 3b (au moins quatre par an) et la prévention de la première lésion.</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/Zusatzinfo_Checkliste_Fuss-Management_16-06-02_D_def.pdf" target="_blank" rel="noopener">Société suisse d’endocrinologie et de diabétologie, QualiCCare, informations complémentaires du test de risque, 2016</a>.</p></template>
<template data-pop="g63-pregabaline" data-title="Lyrica (prégabaline) : indication, posologie et précautions">
<div class="lab">Indication</div><p>Douleurs neuropathiques périphériques et centrales de l’adulte.</p>
<div class="lab">Posologie</div><p>Début à 150 mg par jour en 2 à 3 prises ; 300 mg par jour après 3 à 7 jours ; maximum de 600 mg par jour après 7 jours de plus. Clairance de 30 à 60 mL/min : 75 à 300 mg par jour. Au-dessous de 30 mL/min, la prégabaline ne doit pas être utilisée. L’arrêt est progressif, sur plusieurs semaines, voire plusieurs mois.</p>
<div class="lab">Efficacité</div><p>Répondeurs à 50 % : 33 à 46 % à 300 mg et 39 à 48 % à 600 mg, contre 15 à 30 % sous placebo.</p>
<div class="lab">Précautions</div><p>Prise de poids de 7 % ou plus chez 5,2 % des diabétiques ; insuffisance cardiaque rapportée chez des sujets âgés ; à éviter pendant la grossesse sauf bénéfice net, avec contraception efficace. Une étude nordique de plus de 2700 expositions n’a pas montré de risque significatif de malformation.</p>
<div class="lab">Mésusage et association aux opioïdes</div><p>Des cas de mésusage et de dépendance sont rapportés, parfois aux doses thérapeutiques ; le risque est accru en cas d’antécédent d’usage nocif de substances et doit être évalué avant la prescription. L’association aux opioïdes augmente le risque de dépression respiratoire et de décès.</p>
<p class="src">Références : information professionnelle suisse Lyrica, Viatris Pharma GmbH, état de juillet 2026, lue via AmiKo, consultée le 15 octobre 2026.</p></template>
<template data-pop="g63-gabapentine" data-title="Neurontin (gabapentine) : indication, posologie et adaptation rénale">
<div class="lab">Indication</div><p>Douleur neuropathique de l’adulte lors d’une neuropathie diabétique ou d’une névralgie postherpétique. Dans les neuropathies alcoolique, urémique ou chimio-induite, son emploi est hors indication.</p>
<div class="lab">Posologie</div><p>300 mg le premier jour, 600 mg le deuxième, 900 mg le troisième, en trois prises ; entretien de 900 à 3600 mg par jour.</p>
<div class="lab">Adaptation rénale</div><p>Clairance de 50 à 79 mL/min : 600 à 1200 mg par jour ; de 30 à 49 : 300 à 900 ; de 15 à 29 : 150 à 600 ; moins de 15 : 150 à 300 mg par jour. Chez l’hémodialysé jamais traité, une dose de charge de 300 à 400 mg est suivie de 200 à 300 mg après chaque séance de 4 heures.</p>
<div class="lab">Mésusage et association aux opioïdes</div><p>Des cas d’usage nocif et de dépendance sont rapportés ; un antécédent d’usage nocif de substances accroît le risque et se recherche à l’anamnèse. L’association aux opioïdes expose à la dépression respiratoire, à la sédation et au décès.</p>
<p class="src">Références : information professionnelle suisse Neurontin, Viatris Pharma GmbH, état d’avril 2025, lue via AmiKo, consultée le 15 octobre 2026.</p></template>
<template data-pop="g63-duloxetine" data-title="Duloxetin-Mepha (duloxétine) : indication, contre-indications et surveillance">
<div class="lab">Indication</div><p>Douleur neuropathique diabétique.</p>
<div class="lab">Posologie</div><p>60 mg une fois par jour ; aucun bénéfice supplémentaire au-dessus de 60 mg. Évaluation après 2 mois puis au moins tous les 3 mois.</p>
<div class="lab">Contre-indications</div><p>Insuffisance hépatique, clairance de la créatinine inférieure à 30 mL/min, hypertension artérielle non équilibrée à l’instauration, association aux inhibiteurs irréversibles de la monoamine oxydase et aux inhibiteurs du CYP1A2 comme la fluvoxamine, la ciprofloxacine ou l’énoxacine.</p>
<div class="lab">Surveillance</div><p>L’hémoglobine glyquée augmente de 0,3 % à 52 semaines par rapport au placebo. La pression artérielle augmente en moyenne de 1 à 2 mmHg et des crises hypertensives sont rapportées ; elle se surveille chez l’hypertendu. Une hyponatrémie survient surtout chez le sujet âgé.</p>
<div class="lab">Limite</div><p>Il s’agit d’un générique (état de décembre 2024) ; l’information de la spécialité d’origine n’a pas été trouvée.</p>
<p class="src">Références : information professionnelle suisse Duloxetin-Mepha, Mepha Pharma AG, lue via AmiKo, consultée le 15 octobre 2026.</p></template>
<template data-pop="g63-amitriptyline" data-title="Saroten (amitriptyline) : posologie, mécanisme et contre-indications">
<div class="lab">Indication et posologie</div><p>Douleurs neuropathiques de l’adulte. Début à 10 à 25 mg le soir, puis augmentation de 10 à 25 mg tous les 3 à 7 jours, jusqu’à 25 à 75 mg par jour ; au-delà de 100 mg avec prudence. L’effet apparaît en 2 à 4 semaines.</p>
<div class="lab">Mécanisme</div><p>L’effet analgésique est indépendant de l’effet antidépresseur ; il passe par le blocage des canaux sodiques et potassiques et par l’antagonisme du récepteur NMDA.</p>
<div class="lab">Contre-indications</div><p>Infarctus récent, bloc cardiaque de tout degré, trouble du rythme, insuffisance coronarienne, inhibiteurs de la monoamine oxydase, maladie hépatique sévère.</p>
<p class="src">Références : information professionnelle suisse Saroten, Lundbeck (Schweiz) AG, état d’octobre 2022, lue via AmiKo, consultée le 15 octobre 2026.</p></template>
<template data-pop="g63-qutenza" data-title="Qutenza (capsaïcine 8 %) : indication, application et précautions">
<div class="lab">Indication</div><p>Douleurs neuropathiques périphériques.</p>
<div class="lab">Application</div><p>Jusqu’à quatre patchs ; 30 minutes sur les pieds, 60 minutes ailleurs. Le traitement peut être répété tous les 90 jours ; un renouvellement plus précoce exige une évaluation minutieuse et respecte un minimum de 60 jours. L’efficacité se réévalue après 3 traitements.</p>
<div class="lab">Précautions</div><p>Chez le diabétique, inspection minutieuse des pieds avant chaque application ; gants en nitrile pour le personnel.</p>
<p class="src">Références : information professionnelle suisse Qutenza, Grünenthal Pharma AG, état de mars 2024, lue via AmiKo, consultée le 15 octobre 2026.</p></template>
<template data-pop="g63-hydroxocobalamine" data-title="Vitarubine Dépôt (hydroxocobalamine) : posologie et limites">
<div class="lab">Posologie</div><p>Voie intramusculaire. Cas aigus : 1000 µg deux à trois fois par semaine. Entretien de l’anémie pernicieuse : 1000 µg tous les 2 à 3 mois, à vie.</p>
<div class="lab">Limites</div><p>Des troubles de la marche installés depuis plus de 2 ans ne sont pas toujours réversibles. Une réponse insuffisante doit faire penser à une carence associée en fer ou en folates. Une exposition prolongée au protoxyde d’azote peut induire une carence fonctionnelle.</p>
<div class="lab">Surveillance biologique</div><p>L’érythropoïèse relancée augmente fortement le besoin en potassium : la kaliémie se contrôle régulièrement. Une carence en acide folique associée se recherche et se traite. La production plaquettaire transitoirement excessive expose à un risque thromboembolique chez le patient prédisposé.</p>
<p class="src">Références : information professionnelle suisse Vitarubine Dépôt, Streuli Pharma AG, état de juillet 2025, lue via AmiKo, consultée le 15 octobre 2026.</p></template>
<template data-pop="g63-thiamine" data-title="Benerva (thiamine) : posologie selon la gravité">
<div class="lab">Posologie par voie orale</div><p>100 mg tous les 2 jours pour des symptômes légers ; 100 mg par jour pour des symptômes modérés ; 200 à 300 mg par jour pour des symptômes graves.</p>
<div class="lab">Voie parentérale</div><p>Voie intramusculaire ou intraveineuse lente jusqu’à 200 mg par jour dans l’avitaminose sévère (béribéri, encéphalopathie de Wernicke, cardiomyopathie alcoolique).</p>
<div class="lab">Raison</div><p>Environ 0,4 mg de thiamine est nécessaire pour produire environ 4200 kJ par le métabolisme glucidique : le besoin croît avec l’apport glucidique.</p>
<div class="lab">Contentieux de dose</div><p>L’information professionnelle suisse de Benerva (avril 2019) prévoit, dans l’avitaminose sévère, jusqu’à 200 mg par jour par voie intramusculaire ou intraveineuse lente, et réserve la voie intraveineuse aux patients hospitalisés. La recommandation européenne de l’EFNS de 2010 sur l’encéphalopathie de Wernicke propose 200 mg trois fois par jour, de préférence par voie intraveineuse, avant tout glucide (niveau C). Elle recommande aussi de prélever la thiamine sanguine juste avant la première dose et de donner de la thiamine parentérale à tout sujet à risque admis aux urgences.</p>
<div class="lab">Pourquoi avant le glucose</div><p>Le besoin en thiamine dépend de l’apport de glucides : il en faut environ 0,4 mg pour produire 4200 kJ. Un apport de glucose augmente donc le besoin chez un patient déjà carencé.</p>
<div class="lab">Conséquence</div><p>La dose de l’EFNS dépasse le plafond de la monographie suisse. Elle relève d’un emploi hospitalier hors du schéma de l’information professionnelle, à documenter comme tel.</p>
<div class="lab">Limite</div><p>L’information professionnelle date d’avril 2019 ; la recommandation de 2010 n’a été lue qu’en résumé.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1468-1331.2010.03153.x" target="_blank" rel="noopener">Galvin et coll., EFNS guidelines for diagnosis, therapy and prevention of Wernicke encephalopathy, European Journal of Neurology, 2010</a> (résumé) ; information professionnelle suisse Benerva, Teofarma Suisse SA, état d’avril 2019, lue via AmiKo, consultée le 15 octobre 2026.</p></template>
<template data-pop="g63-mnemo" data-title="Trois questions pour ne pas se tromper de cause (aide pédagogique)">
<p><b>Aide pédagogique, non critère officiel.</b></p>
<ol><li>La distribution suit-elle la longueur des nerfs (distale, symétrique), ou s’en écarte-t-elle (asymétrique, aiguë, motrice) ?</li><li>La maladie connue explique-t-elle tout, et ai-je exclu les causes traitables (vitamine B12, alcool, paraprotéine, vasculite, anticorps) ?</li><li>Le pied est-il protégé, et le médicament choisi respecte-t-il le rein, le cœur et l’âge ?</li></ol></template>
<template data-pop="pareto-g63-definition" data-title="Pareto — Définition et fréquence">
<p class="ratio" data-cover="g63-0,g63-1,g63-2"></p><ul><li>G63 est une manifestation ; la maladie de base commande la conduite.</li><li>Polyneuropathie : 5 à 8 % ; première cause : le diabète ; cause non trouvée : jusqu’à 30 %.</li><li>Aucune donnée suisse propre à la catégorie.</li></ul></template>
<template data-pop="pareto-g63-mecanismes" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="g63-3"></p><ul><li>Axones longs dégénérant d’abord : chaussettes puis gants.</li><li>Diabète : polyols, mitochondrie, microangiopathie ; petites fibres puis grosses.</li><li>Alcool lent et sensitif ; thiamine rapide et motrice ; ganglion dorsal : déficit non dépendant de la longueur.</li></ul></template>
<template data-pop="pareto-g63-causes" data-title="Pareto — Causes et risque">

<template data-pop="g63-sm-brulure" data-title="Brûlure distale nocturne : mécanisme, valeur et piège">
<div class="lab">Définition</div><p>La brûlure est une douleur spontanée, distale, souvent nocturne, des deux pieds. Elle est le premier symptôme de l’atteinte des petites fibres dans la neuropathie diabétique (Feldman et coll., 2019).</p>
<div class="lab">Mécanisme</div><p>Les petites fibres sont touchées avant les grosses dans le diabète. Leur atteinte produit la brûlure et la perte de la piqûre et du froid (Feldman et coll., 2019).</p>
<div class="lab">Valeur</div><p>La douleur touche 30 à 50 % des neuropathies diabétiques (Feldman et coll., 2019) et 42 % des neuropathies alcooliques (Julian et coll., 2019). Les sources lues ne chiffrent pas la sensibilité ni la spécificité de la brûlure.</p>
<div class="lab">Piège</div><p>La neurographie reste normale si seules les petites fibres sont atteintes (Feldman et coll., 2019). Un examen des grosses fibres normal n’écarte donc pas la neuropathie.</p></template>
<template data-pop="g63-sm-ataxie" data-title="Ataxie sensitive : mécanisme et orientation">
<div class="lab">Définition</div><p>L’ataxie sensitive est une instabilité liée à la perte de l’information de position. Elle s’aggrave lorsque la vue ne compense plus.</p>
<div class="lab">Mécanisme</div><p>Elle traduit l’atteinte des grosses fibres. Dans la carence en vitamine B12, les cordons postérieurs de la moelle s’y ajoutent (Sommer et coll., 2018).</p>
<div class="lab">Orientation</div><p>Une ataxie avec réflexes vifs et signes pyramidaux désigne une myéloneuropathie combinée, évocatrice d’une carence en vitamine B12 (Sommer et coll., 2018).</p>
<div class="lab">Limite</div><p>Les sources lues ne chiffrent pas la fréquence de l’ataxie dans les polyneuropathies secondaires.</p></template>
<template data-pop="g63-sm-achille" data-title="Aréflexie achilléenne : valeur et limite">
<div class="lab">Valeur</div><p>L’aréflexie distale associée à une baisse de la pallesthésie ou de la piqûre est un signe sensible et spécifique de polyneuropathie (Sommer et coll., 2018). La revue ne donne pas de chiffre.</p>
<div class="lab">Limite</div><p>Le réflexe isolé est moins discriminant. Dans une cohorte de 2022 diabétiques à Vienne, il manquait chez 68,6 % des patients dont la vibration était anormale, mais aussi chez 24,8 % de ceux dont la vibration était normale (Kästenbauer et coll., 2004).</p>
<div class="lab">Conséquence</div><p>Une aréflexie isolée ne suffit pas à poser le diagnostic. Le médecin cherche la baisse de la pallesthésie ou de la piqûre.</p>
<div class="lab">Lacune</div><p>La technique du geste n’est pas décrite dans les sources lues ; elle n’est donc pas détaillée ici.</p></template>
<template data-pop="g63-sm-pouls" data-title="Pouls du pied et index de pression systolique : valeur et limite">
<div class="lab">Technique</div><p>Le médecin palpe les pouls tibial postérieur et pédieux. S’ils manquent, il palpe les pouls poplité et fémoral (QualiCCare, 2013). L’index de pression systolique se mesure au Doppler, couché, après 10 minutes de repos (QualiCCare, 2016).</p>
<div class="lab">Valeur</div><p>Une artériopathie cliniquement importante peut le plus souvent être écartée lorsque les deux pouls du pied sont perçus des deux côtés (QualiCCare, 2016). Un index inférieur à 0,9 est hautement suspect d’artériopathie (QualiCCare, 2016).</p>
<div class="lab">Piège</div><p>Le pouls pédieux manque chez jusqu’à 8 % des sujets sains et le tibial postérieur chez jusqu’à 3 % (QualiCCare, 2016). Des artères calcifiées faussent l’index vers le haut ; un index supérieur à 1,3 se rencontre chez 30 % des patients atteints d’ulcère (QualiCCare, 2016).</p></template>
<template data-pop="g63-sm-pyramidal" data-title="Réflexes vifs et signes pyramidaux : la myéloneuropathie de la carence en vitamine B12">
<div class="lab">Mécanisme</div><p>La carence en vitamine B12 atteint à la fois les grosses fibres et les cordons postérieurs de la moelle. Les réflexes deviennent vifs et des signes pyramidaux apparaissent (Sommer et coll., 2018).</p>
<div class="lab">Valeur</div><p>Près de la moitié des patients ayant des symptômes neurologiques n’ont pas d’anémie macrocytaire (Sommer et coll., 2018). Un hémogramme normal ne rassure donc pas.</p>
<div class="lab">Conduite</div><p>La substitution est rapide. Des troubles de la marche installés depuis plus de 2 ans ne sont pas toujours réversibles (information professionnelle de Vitarubine Dépôt). Le protoxyde d’azote peut produire une carence fonctionnelle malgré des réserves normales (information professionnelle de Vitarubine Dépôt).</p></template>
<template data-pop="pareto-g63-immuno" data-title="Pareto — Immunologie">
