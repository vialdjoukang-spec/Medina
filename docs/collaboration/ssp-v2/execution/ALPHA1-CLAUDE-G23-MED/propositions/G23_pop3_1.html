<template data-pop="g23-sm-chutes" data-title="Chutes et instabilité posturale">
<div class="lab">Définition</div><p>L’instabilité posturale est l’incapacité de corriger un déséquilibre. Elle se distingue de la chute mécanique par trébuchement, qui suppose un obstacle. Le sujet sain se rattrape après une poussée vers l’arrière [S2].</p>
<div class="lab">Mécanisme</div><p>Dans la paralysie supranucléaire progressive, les réflexes posturaux sont altérés ; le patient chute surtout vers l’arrière et s’effondre en s’asseyant [S4, S11].</p>
<div class="lab">Valeur</div><p>Des chutes répétées non provoquées dans les 3 ans définissent le niveau P-1 [S2]. Contre la maladie de Parkinson, l’instabilité posturale dans les 3 ans oriente vers l’atrophie multisystématisée avec une sensibilité de 27 à 45 % et une spécificité de 88,7 % [S1]. La latence médiane avant les chutes est de 24 mois dans l’atrophie multisystématisée, contre 118 mois dans la maladie de Parkinson [S1].</p>
<div class="lab">Piège</div><p>Dans l’atrophie multisystématisée, 28 % des patients tombent dès la première année : une chute précoce ne suffit pas pour conclure à une paralysie supranucléaire progressive [S3].</p>
<p class="src">Références : critères MDS 2017 [S2] ; critères MDS 2022 [S1] ; revue d’Innsbruck 2023 [S3] ; revue de Munich 2026 [S4] ; Parkinson Suisse, fiche PSP [S11]</p></template>

<template data-pop="g23-sm-ho" data-title="Hypotension orthostatique neurogène : mesure et calcul">
<div class="lab">Normal</div><p>Debout, le baroréflexe accélère le cœur et resserre les vaisseaux ; la pression systolique ne chute pas durablement de 20 mmHg [S8].</p>
<div class="lab">Technique</div><p>Le médecin mesure pression et pouls couché, puis debout à 3 minutes et jusqu’à 10 minutes, ou au test d’inclinaison [S1, S3]. La chute systolique d’au moins 20 mmHg suffit ; une chute diastolique isolée ne s’utilise pas seule [S1].</p>
<div class="lab">Calcul</div><p>Le rapport est la hausse du pouls (battements par minute) divisée par la baisse de la pression systolique (mmHg). Un rapport inférieur à 0,5 signe une hypotension neurogène [S1]. Ce rapport sépare l’hypotension neurogène des causes non neurogènes avec une sensibilité de 91,3 % et une spécificité de 88,4 % au test d’inclinaison [S3].</p>
<div class="lab">Piège</div><p>Les bêtabloquants faussent le rapport [S1]. La référence pour affirmer le caractère neurogène reste la durée de récupération de la pression après la manœuvre de Valsalva [S1]. Un patient sur deux présente aussi une hypotension post-prandiale ou une hypertension de décubitus [S3].</p>
<p class="src">Références : critères MDS 2022 [S1] ; revue d’Innsbruck 2023 [S3] ; lignes directrices ESC 2018 [S8]</p></template>

<template data-pop="g23-sm-vessie" data-title="Troubles vésicaux : remplissage et vidange">
<div class="lab">Normal</div><p>Pendant le remplissage, le sphincter urétral est actif et le détrusor inhibé ; pendant la vidange, le détrusor se contracte et le sphincter se relâche [S3].</p>
<div class="lab">Mécanisme</div><p>Tôt dans l’atrophie multisystématisée, l’hyperactivité du détrusor et la faiblesse du sphincter externe donnent impériosité et incontinence ; plus tard, la dyssynergie vésico-sphinctérienne laisse un résidu qui augmente [S3].</p>
<div class="lab">Technique</div><p>Le médecin interroge sur les symptômes de remplissage et de vidange, fait tenir un calendrier mictionnel de 3 jours, réalise un toucher rectal et une échographie prostatique chez l’homme, puis mesure le résidu, de préférence par échographie [S1]. L’urodynamique distingue l’origine neurogène et non neurogène [S3].</p>
<div class="lab">Valeur</div><p>Résidu élevé contre maladie de Parkinson : sensibilité 34 %, spécificité 95 %. Incontinence par impériosité : sensibilité 48 %, spécificité 34 % [S1].</p>
<div class="lab">Piège</div><p>Dans une série d’atrophies multisystématisées probables, 43 % des hommes avaient subi une chirurgie prostatique ou du col vésical inutile avant le diagnostic [S3].</p>
<p class="src">Références : critères MDS 2022 [S1] ; revue d’Innsbruck 2023 [S3]</p></template>

<template data-pop="g23-sm-erectile" data-title="Dysfonction érectile">
<div class="lab">Mécanisme</div><p>Les modifications dégénératives de la région sacrée de la moelle expliquent la dysfonction sexuelle, chez l’homme comme chez la femme [S3].</p>
<div class="lab">Valeur</div><p>Elle précède les troubles vésicaux chez 58 % des hommes atteints d’atrophie multisystématisée probable [S1]. Une sensibilité génitale réduite est rapportée chez 47 à 56 % des femmes atteintes [S3].</p>
<div class="lab">Piège</div><p>Elle est fréquente dans la population âgée pour des causes endocriniennes ou vasculaires. Elle ne compte comme signe de soutien qu’avant 60 ans pour la forme probable, et jamais seule [S1, S3].</p>
<p class="src">Références : critères MDS 2022 [S1] ; revue d’Innsbruck 2023 [S3]</p></template>

<template data-pop="g23-sm-tcsp" data-title="Mise en acte des rêves">
<div class="lab">Mécanisme</div><p>Pendant le sommeil paradoxal normal, des noyaux pontins abolissent le tonus musculaire. Dans les synucléinopathies, ces noyaux sont touchés et le patient agit ses rêves ; ils sont beaucoup moins touchés dans les tauopathies 4R [S4].</p>
<div class="lab">Valeur</div><p>Un trouble établi dans les 4 ans a une sensibilité de 43 % et une spécificité de 100 % pour l’atrophie multisystématisée cérébelleuse face aux ataxies [S1]. La polysomnographie le confirme [S3].</p>
<div class="lab">Piège</div><p>Il marque toutes les synucléinopathies : il ne sépare pas l’atrophie multisystématisée de la maladie de Parkinson [S3].</p>
<p class="src">Références : critères MDS 2022 [S1] ; revue d’Innsbruck 2023 [S3] ; revue de Munich 2026 [S4]</p></template>

<template data-pop="g23-sm-stridor" data-title="Stridor de l’atrophie multisystématisée">
<div class="lab">Définition</div><p>Le stridor est un bruit respiratoire forcé, aigu et rude, surtout inspiratoire, dû à une dysfonction laryngée qui rétrécit la fente glottique. Il survient pendant le sommeil seul, ou pendant le sommeil et la veille [S5].</p>
<div class="lab">Technique</div><p>Le médecin le reconnaît s’il l’entend à l’examen, par la description d’un témoin ou par un enregistrement sonore. Une laryngoscopie écarte une lésion mécanique ; si elle est normale, une endoscopie sous sommeil induit ou une vidéopolysomnographie confirme le stridor nocturne [S5].</p>
<div class="lab">Valeur</div><p>Prévalence de 12 à 42 % ; premier signe chez 4 à 5,2 % des patients [S5]. Le stridor distingue les deux sous-types d’atrophie multisystématisée de leurs imitateurs [S1].</p>
<div class="lab">Conduite</div><p>La ventilation en pression positive continue et la trachéotomie sont proposées comme traitements symptomatiques ; leur effet sur la survie reste incertain [S5].</p>
<div class="lab">Piège</div><p>Le témoin le décrit souvent comme un ronflement aigu ; le ronflement et les apnées obstructives coexistent souvent [S5].</p>
<p class="src">Références : consensus de Bologne 2019 [S5] ; critères MDS 2022 [S1]</p></template>

<template data-pop="g23-sm-bulbaire" data-title="Dysarthrie et dysphagie">
<div class="lab">Sémiologie</div><p>La paralysie supranucléaire progressive donne une dysarthrie hypokinétique spastique et une dysphagie, indices de soutien CC2 et CC3 [S2]. L’atrophie multisystématisée donne une dysarthrie cérébelleuse ou une voix chevrotante, forcée, rauque ou aiguë, de type mixte hypokinétique, ataxique et spastique [S3].</p>
<div class="lab">Gravité</div><p>La dysphagie est la cause principale de morbidité et de mortalité de la paralysie supranucléaire progressive et de la dégénérescence corticobasale et mène à la pneumonie d’aspiration [S4].</p>
<div class="lab">Valeur</div><p>Non chiffrée dans les sources lues.</p>
<p class="src">Références : critères MDS 2017 [S2] ; revue d’Innsbruck 2023 [S3] ; revue de Munich 2026 [S4]</p></template>

<template data-pop="g23-sm-extremites" data-title="Mains et pieds froids et violacés">
<div class="lab">Définition</div><p>Le signe désigne un froid et une coloration violette ou bleue d’apparition récente, qui blanchissent à la pression avec un retour circulatoire lent [S1].</p>
<div class="lab">Valeur</div><p>Sa spécificité dépasse 90 % face aux maladies à corps de Lewy lorsqu’il apparaît au cours de la vie [S1].</p>
<div class="lab">Piège</div><p>Une artériopathie périphérique ou une hypothyroïdie donnent aussi des extrémités froides [S3].</p>
<p class="src">Références : critères MDS 2022 [S1] ; revue d’Innsbruck 2023 [S3]</p></template>
