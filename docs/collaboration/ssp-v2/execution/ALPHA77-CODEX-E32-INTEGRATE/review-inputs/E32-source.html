ales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#e32-1">Une découverte médiastinale : nommer la question</a></li><li><a href="#e32-2">Définitions, périmètre et sous-codes</a></li><li><a href="#e32-3">Épidémiologie : garder le bon dénominateur</a></li><li><a href="#e32-4">Du thymus normal au tissu réactif</a></li><li><a href="#e32-5">Classer les mécanismes et rechercher les causes</a></li><li><a href="#e32-6">Anamnèse : relier le calendrier et les symptômes</a></li><li><a href="#e32-7">Examen clinique et sémiologie</a></li><li><a href="#e32-8">Urgences et complications : changer le niveau de soins</a></li><li><a href="#e32-9">Démarche diagnostique et différentiels</a></li><li><a href="#e32-10">Prise en charge selon la lésion</a></li><li><a href="#e32-11">Pharmacologie : aucune ordonnance universelle E32</a></li><li><a href="#e32-12">Suivi, pronostic et prévention proportionnée</a></li><li><a href="#e32-13">Âges, situations particulières et contexte suisse</a></li><li><a href="#e32-14">Critères formels et pièges à éviter</a></li></ol></nav>
<div class="chap-body">
<section class="ilot" id="e32-1"><h2><span class="n">1</span>Une découverte médiastinale : nommer la question</h2><p>Un garçon fictif de onze ans, traité pour un lymphome de Hodgkin, présente une augmentation du tissu thymique au contrôle. Une femme fictive de vingt-neuf ans avec maladie de Basedow découvre un élargissement médiastinal à l’imagerie. Dans les deux cas, il faut distinguer tissu thymique normal ou réactif, hyperplasie, lésion kystique et tumeur ; la même image de « masse » ne conduit pas automatiquement à une biopsie ou une chirurgie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>].</p>
<p>Le thymus est un organe lymphoïde primaire où se développent des lymphocytes T. Son aspect varie avec l’âge et les événements médicaux. La leçon E32 porte sur les maladies thymiques non tumorales ; elle explique les tumeurs et la myasthénie comme voisins nécessaires au raisonnement, sans les reclasser dans E32 [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">S18</a>].</p>
<p>Les situations suisses de formation <button class="w" data-k="e32-profiles">PROFILES</button> incluent lymphadénopathie, fièvre, fatigue, douleur thoracique, dyspnée, dysphagie et stridor. Elles servent ici de portes d’entrée pédagogiques ; aucun lien officiel entre code E32 et question d’examen fédéral n’est revendiqué. Les vignettes et exercices sont originaux [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
<div class="key"><b>À retenir.</b> La question est d’abord la nature de la lésion et sa conséquence clinique. L’élargissement seul ne prescrit pas un geste [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-2"><h2><span class="n">2</span>Définitions, périmètre et sous-codes</h2><p>Une hyperplasie thymique peut désigner une augmentation de volume avec architecture conservée, mais aussi une prolifération de follicules lymphoïdes sans thymus volumineux. « Hyperplasie », « gros thymus » et « tumeur » ne sont donc pas trois synonymes. Un kyste non tumoral et un abcès sont d’autres mécanismes [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
<table class="t" data-e32-table="1"><thead><tr><th>Rubrique locale suisse 2024</th><th>Portée</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E32.0</a></td><td>Hyperplasie persistante du thymus ; hypertrophie incluse dans les notes allemandes.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E32.1</a></td><td>Abcès du thymus.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E32.8</a></td><td>Autres maladies précisées du thymus : qualification selon diagnostic et index de codage, sans assimiler toute masse.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E32.9</a></td><td>Maladie du thymus sans précision ; pas une justification pour arrêter l’enquête.</td></tr></tbody></table>
<p>La classification allemande exclut explicitement aplasie/hypoplasie avec déficit immunitaire vers <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">D82.1</a> et myasthénie vers <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">G70.0</a>. Les néoplasies thymiques gardent leurs rubriques propres : elles n’entrent pas dans E32 parce qu’elles sont situées dans le thymus. Un diagnostic de kyste thymique doit être distingué d’une lésion tumorale kystisée avant un codage précis [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
<p>Les libellés locaux proviennent de la classification suisse 2024. La leçon n’est ni un certificat de codage 2026 ni une règle de remboursement. Le diagnostic étiologique, le code retenu et la décision thérapeutique sont trois étapes liées mais distinctes [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>].</p>
<div class="key"><b>À retenir.</b> E32 documente une maladie non tumorale ; la topographie médiastinale ne suffit pas à attribuer ce code [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-3"><h2><span class="n">3</span>Épidémiologie : garder le bon dénominateur</h2><p>Aucune incidence suisse contemporaine de l’ensemble E32 n’est établie dans les lectures ciblées. Les études disponibles concernent des patients adressés, opérés ou traités pour une autre maladie. Leurs proportions ne décrivent pas la fréquence de toutes les maladies thymiques dans la population [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12774464/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39294035/" target="_blank" rel="noopener">S22</a>].</p>
<p>Dans une analyse européenne du lymphome de Hodgkin pédiatrique, 291 patients avaient une imagerie adéquate ; 133 présentaient une croissance dans la région thymique après chimiothérapie. Parmi eux, 98 pouvaient être classés comme rebond ou rechute dans l’analyse rapportée. Les 64 rebonds étaient isolés, tandis que 33 des 34 rechutes s’accompagnaient d’autres masses croissantes. Une rechute isolée restait possible ; les 98 cas classés ne représentent pas tous les 133 grossissements [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>].</p>
<p>À Toulouse, une série rétrospective 2012–2025 de 70 patients avec lésions kystiques antérieures pures comptait 26 opérés. Huit de ces 26 avaient une lésion néoplasique ou potentiellement maligne : quatre thymomes et quatre tumeurs germinales, dont trois tératomes matures. Ce résultat ne signifie ni huit cancers ni 30,8%de tous les kystes thymiques cancéreux [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12774464/" target="_blank" rel="noopener">S7</a>].</p>
<p>La forme lymphoépithéliale décrite dans une série de 36 cas était associée à une maladie auto-immune non myasthénique dans 33%des cas et à un lymphome dans 14%. Ce sont des associations dans une série sélectionnée, pas un risque prospectif de transformation pour tout patient ayant un thymus élargi. Les abcès reposent surtout sur des observations isolées [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/18480581/" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8449107/" target="_blank" rel="noopener">S16</a>].</p>
<div class="key"><b>À retenir.</b> Avant un pourcentage, préciser sélection, diagnostic, période et dénominateur. Une série chirurgicale ne donne pas une incidence suisse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12774464/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-4"><h2><span class="n">4</span>Du thymus normal au tissu réactif</h2><p>Le thymus normal associe un réseau épithélial et des cellules lymphoïdes. Les précurseurs T y développent un récepteur, passent des étapes de sélection et quittent l’organe pour la périphérie. Le cortex riche en thymocytes et la médulla moins dense ont des fonctions complémentaires ; le thymus n’est pas un ganglion filtrant la lymphe [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<p>Son tissu se modifie avec l’âge, avec davantage de graisse et une diminution de la production de nouveaux lymphocytes. Une maladie aiguë ou un traitement cytotoxique peut entraîner une involution transitoire puis une repousse. Le volume d’un thymus en récupération ne mesure cependant pas à lui seul la qualité de sa sélection immunitaire ou la récupération complète d’une immunité [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<p>Dans les formes vraies et de rebond, l’architecture peut rester conservée. Dans la forme folliculaire, des centres germinatifs se développent ; la forme lymphoépithéliale comporte en plus une prolifération épithéliale, des lésions lymphoépithéliales et des remaniements kystiques. L’origine de certains mécanismes reste inconnue ; aucun gène unique n’explique toutes ces formes [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>].</p>
<figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Âge, maladie et traitements</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Composition et architecture</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Contexte, image puis décision</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Le contexte influence le tissu, mais la taille ne suffit pas à diagnostiquer le mécanisme [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</figcaption></figure>
<div class="key"><b>À retenir.</b> Une repousse thymique est plausible après un stress ; elle doit rester cohérente avec l’histoire et l’ensemble des examens [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-4">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-5"><h2><span class="n">5</span>Classer les mécanismes et rechercher les causes</h2><table class="t" data-e32-table="1"><thead><tr><th>Profil</th><th>Contexte et structure</th><th>Conséquence</th></tr></thead><tbody><tr><td>Hyperplasie vraie</td><td>Souvent nourrisson/enfant ; architecture adaptée à l’âge, sans follicules significatifs.</td><td>Volume parfois compressif ; diagnostic différentiel spécialisé.</td></tr><tr><td>Rebond</td><td>Après infection, chimiothérapie, radiothérapie ou arrêt d’immunosuppression ; architecture conservée.</td><td>Confronter aux imageries antérieures et à la maladie déclenchante.</td></tr><tr><td>Folliculaire</td><td>Follicules dans plus du tiers des lobules selon revue ; fréquente avec myasthénie précoce à anticorps du récepteur de l’acétylcholine.</td><td>Volume souvent normal ou peu augmenté ; évaluer association clinique.</td></tr><tr><td>Lymphoépithéliale</td><td>Architecture déformée, épithélium proliférant et changements kystiques.</td><td>Rechercher maladie auto-immune ou lymphoprolifération selon contexte.</td></tr><tr><td>Kyste</td><td>Souvent uniloculaire congénital ou multiloculaire acquis ; exceptions.</td><td>Caractériser liquide, paroi et éventuelle composante solide.</td></tr><tr><td>Abcès</td><td>Collection infectieuse ; bactériémie parfois associée.</td><td>Hospitalisation et stratégie médicochirurgicale selon gravité.</td></tr></tbody></table>
<p>Les deux premières formes ne sont pas intrinsèquement des processus folliculaires auto-immuns. Cela n’exclut pas une association endocrine, notamment avec Basedow : mécanismes hormonaux et immunitaires peuvent coexister. Les mots « pas d’auto-immunité » ne doivent pas effacer cette association clinique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25149085/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>].</p>
<p>Pour le rebond, dater l’événement et sa résolution. Pour un kyste, rechercher histoire inflammatoire, chirurgie et maladies associées, sans déduire une cause d’une seule image. La présence d’une maladie connue n’exclut pas une deuxième lésion ; une forme focale, invasive ou discordante demande réévaluation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
<div class="key"><b>À retenir.</b> Le contexte suggère un mécanisme ; l’architecture et l’imagerie doivent rester compatibles [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-5">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-6"><h2><span class="n">6</span>Anamnèse : relier le calendrier et les symptômes</h2><p>Préciser la raison de l’imagerie, la date de première découverte, les examens antérieurs et l’évolution. Documenter chimiothérapie, irradiation, corticoïdes ou autre immunosuppression, infection récente et récupération. Chez un patient oncologique, relire aussi les sites extrathymiques : une croissance ailleurs change l’hypothèse de rebond [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>].</p>
<p>Rechercher maladie de Basedow, traitement et état thyroïdien, symptômes de fatigabilité, diplopie, ptosis, trouble de déglutition ou de voix. La fatigabilité fluctuante fait envisager myasthénie, mais ne prouve ni hyperplasie ni thymome. Les antécédents auto-immuns et les infections répétées orientent une enquête proportionnée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/lab-analyses_voor_vaststellen_paraneoplastische_syndromen.html" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>].</p>
<p>Douleur thoracique, dyspnée, stridor, toux, dysphagie, gonflement facial ou modification de voix peuvent exprimer compression. Fièvre et douleur rétrosternale imposent aussi infection et diagnostics thoraciques urgents ; ne pas attribuer d’emblée une douleur à une masse déjà connue. Sueurs nocturnes, fièvre inexpliquée, amaigrissement et adénopathies orientent également une maladie lymphoproliférative [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/18480581/" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8449107/" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
<p>Enfin, demander le nom, la dose et le début des médicaments. Sous carbimazole, fièvre, mal de gorge ou aphtes font rechercher immédiatement une toxicité hématologique ; ils ne sont pas automatiquement un abcès thymique. L’histoire thérapeutique évite cette confusion [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<div class="key"><b>À retenir.</b> La chronologie de la maladie et des traitements donne son sens à l’image. Les symptômes nouveaux ne sont pas tous expliqués par le thymus [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-6">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-7"><h2><span class="n">7</span>Examen clinique et sémiologie</h2><div data-semiology-clinical="E32"><p>Évaluer état général, température, fréquence respiratoire, oxygénation et hémodynamique selon gravité. Rechercher stridor, travail respiratoire, gêne en décubitus, œdème facial et circulation collatérale. Le thymus profond n’est pas un organe normalement palpable : l’examen recherche surtout les conséquences et les maladies associées [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
<p>Décrire adénopathies, signes d’infection, goitre et signes de thyrotoxicose. Tester la fatigabilité de façon clinique ciblée, rechercher ptosis ou diplopie, voix nasonnée, dysphagie et faiblesse respiratoire. Une atteinte bulbaire ou respiratoire change l’urgence, sans attendre un résultat d’anticorps ; une suspicion de myasthénie relève de son parcours propre [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/lab-analyses_voor_vaststellen_paraneoplastische_syndromen.html" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
<p>Un examen normal n’exclut pas une lésion thymique : beaucoup sont découvertes fortuitement. À l’inverse, une dyspnée ou une douleur thoracique ne démontre pas compression par le thymus. Relier signe, mécanisme, examen et décision est l’objet du premier sous-onglet <button class="w" data-k="e32-semio">Sémiologie fondamentale et analytique</button> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
<p>L’examen est répété selon l’évolution, avec une question explicite. Il ne transforme ni une image ronde en kyste certain ni un marqueur biologique en diagnostic tumoral. Aucun score clinique E32 universel ni sensibilité chiffrée de cet examen n’est inventé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>].</p>
</div><div class="key"><b>À retenir.</b> L’examen cherche gravité, compression et association ; il ne suffit pas à nommer la lésion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-7">Essentiel de cette partie</button></section>

<section class="ilot" id="e32-8"><h2><span class="n">8</span>Urgences et complications : changer le niveau de soins</h2><p>Une détresse respiratoire, un stridor marqué, une dégradation hémodynamique, une compression vasculaire menaçante ou une douleur thoracique aiguë imposent une prise en charge urgente. L’équipe choisit un environnement adapté à une éventuelle masse médiastinale compressive ; un geste diagnostique électif ne précède pas la stabilisation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
<p>Une hémorragie dans une hyperplasie vraie ou un kyste peut accroître rapidement le volume. Une infection thymique peut s’accompagner de bactériémie, de rupture ou d’extension pleurale. Ces complications sont documentées surtout par des cas et petites séries : leur possibilité ne donne pas une fréquence universelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/18480581/" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8449107/" target="_blank" rel="noopener">S16</a>].</p>
<p>La faiblesse bulbaire ou respiratoire dans une myasthénie suspectée est une autre urgence ; elle ne devient pas une simple « grosseur bénigne du thymus ». La recherche d’anticorps peut aider ensuite, mais ne doit pas retarder l’évaluation de la respiration et de la déglutition [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/lab-analyses_voor_vaststellen_paraneoplastische_syndromen.html" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
<p>Sous carbimazole, fièvre, angine, aphtes, malaise, saignements ou hématomes justifient arrêt du médicament et consultation immédiate avec hémogramme selon la FI. Une douleur épigastrique, un ictère ou un prurit généralisé demandent aussi évaluation de toxicité hépatique/pancréatique. L’objectif est de reconnaître le risque, sans attribuer tous ces tableaux à E32 [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<div class="key"><b>À retenir.</b> La gravité clinique décide de l’urgence ; la preuve étiologique peut venir après les premières mesures de soins [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-8">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-9"><h2><span class="n">9</span>Démarche diagnostique et différentiels</h2><p>Relire d’abord l’imagerie disponible et ses comparaisons : âge, forme, distribution, graisse, liquide, rehaussement, contours, invasion et autres sites. Le scanner thoracique injecté est l’examen européen de référence devant suspicion de tumeur épithéliale ; une nouvelle acquisition n’est pas nécessaire si l’examen utile existe déjà. Une lésion kystique ou une hyperplasie incertaine peut être précisée par résonance magnétique [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38565483/" target="_blank" rel="noopener">S8</a>].</p>
<p>Le déplacement chimique recherche une baisse de signal liée à la graisse microscopique. Il est utile dans le bon contexte, mais un thymus jeune pauvre en graisse peut ne pas montrer la baisse attendue. Les excellentes performances d’une série adulte et ses seuils ne garantissent pas le diagnostic chez tout enfant ou tout adulte. Taille et absence de baisse seules ne prouvent pas malignité [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/17463136/" target="_blank" rel="noopener">S10</a>].</p>
<p>Confronter hyperplasie, thymome ou autre tumeur épithéliale, lymphome, tumeur germinale, tissu thyroïdien ectopique et autres kystes médiastinaux. Une composante solide rehaussée, une invasion, des adénopathies ou une croissance discordante justifient une discussion multidisciplinaire experte. L’imagerie seule ne distingue pas fiablement tous les types de tumeurs solides [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
<p>La biopsie n’est pas une étape automatique. Elle peut manquer une zone pertinente ou montrer du thymus normal adjacent ; ponctionner un kyste expose à un faible rendement et à une infection. Une tumeur épithéliale présumée résécable suit un autre raisonnement qu’un lymphome suspecté ou une tumeur non résécable : le choix du prélèvement appartient à l’équipe et à la question diagnostique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/biopt_bij_epitheliale_thymustumoren.html" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
<div class="key"><b>À retenir.</b> Question, comparaison et composition précèdent le prélèvement. Une biopsie négative non représentative n’est pas une garantie de bénignité [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/biopt_bij_epitheliale_thymustumoren.html" target="_blank" rel="noopener">S5</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-9">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-10"><h2><span class="n">10</span>Prise en charge selon la lésion</h2><p>Une hyperplasie compatible avec un contexte réactif peut relever d’une conduite conservatrice après expertise et recherche de discordance. Après Hodgkin, une croissance thymique isolée évoque un rebond ; l’analyse des autres sites et du protocole oncologique reste essentielle. Le résultat européen ne permet pas d’affirmer qu’une rechute isolée est impossible [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>].</p>
<p>Avec Basedow et une image non suspecte, traiter l’hyperthyroïdie et contrôler l’évolution peut éviter une thymectomie inutile. Une absence de régression, une progression, une composante atypique ou des signes inquiétants conduisent à réévaluer. Aucun délai unique de régression n’exclut toute tumeur ; une série de deux cas ne suffit pas à rassurer tous les patients [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25149085/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>].</p>
<p>Pour un kyste simple certain, le module néerlandais 2024 ne recommande pas de suivi spécifique. Pour une lésion indéterminée, atypique ou symptomatique, caractérisation, surveillance ou chirurgie sont discutées avec le patient. Le suivi annuel proposé à Toulouse et sa stratégie de tomographie par émission de positons initiale ne sont pas des règles universelles : données et recommandations divergent [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12774464/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39657307/" target="_blank" rel="noopener">S21</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39294035/" target="_blank" rel="noopener">S22</a>].</p>
<p>L’abcès nécessite une stratégie hospitalière avec prélèvements pertinents, traitement anti-infectieux et contrôle de la collection selon anatomie et gravité. Les observations lues ne fondent ni antibiotique unique ni dose standard pour tout âge. Une hyperplasie massive compressive ou une lésion ne pouvant être classée relève de la chirurgie thoracique/pédiatrique spécialisée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/18480581/" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8449107/" target="_blank" rel="noopener">S16</a>].</p>
<p>La thymectomie pour myasthénie concerne une indication neurologique distincte, tenant compte du phénotype et du contexte tumoral. Elle n’est pas prescrite pour toute hyperplasie folliculaire découverte. Après diagnostic lymphoépithélial, le bilan d’association auto-immune ou lymphoproliférative est ciblé [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/lab-analyses_voor_vaststellen_paraneoplastische_syndromen.html" target="_blank" rel="noopener">S6</a>].</p>
<div class="key"><b>À retenir.</b> Traiter une cause, observer une lésion caractérisée et retirer une lésion suspecte sont des décisions différentes [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-10">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-11"><h2><span class="n">11</span>Pharmacologie : aucune ordonnance universelle E32</h2><p>Aucun médicament n’est indiqué pour faire disparaître toute maladie E32. Une image compatible avec hyperplasie ne justifie pas des corticoïdes empiriques pour réduire la taille : le traitement doit répondre à une cause et à un diagnostic suffisamment établis. Les approches expérimentales de régénération thymique ne sont pas des traitements disponibles de routine [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<p>Le <button class="w" data-k="e32-carbimazole">carbimazole, produit suisse et posologies</button> traite l’hyperthyroïdie biologiquement confirmée, notamment Basedow selon la FI ; l’amélioration thymique éventuelle est indirecte. Le comprimé <button class="w" data-k="e32-carbimazole">Néo-Mercazole</button> contient 5 mg de carbimazole ; sa FI consultée est révisée août 2020, date conservée malgré l’accès en 2026. Le méthimazole utilisé dans des cas étrangers ne se remplace pas milligramme pour milligramme [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<p>Les données de petites séries de kystes ou abcès ne justifient pas une prophylaxie antibiotique permanente ni un protocole commun à tous les patients. L’équipe choisit selon infection, cultures, terrain, geste et recommandations actuelles du lieu de soins. Les médicaments de la myasthénie et des tumeurs relèvent d’autres indications ; ce chapitre ne fabrique pas de schéma oncologique [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/biopt_bij_epitheliale_thymustumoren.html" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/18480581/" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8449107/" target="_blank" rel="noopener">S16</a>].</p>
<p>La sécurité du traitement causal compte autant que l’évolution de la masse. Éducation aux signes d’alarme, vérification grossesse/allaitement, fonction hépatique et interactions sont nécessaires lorsqu’un antithyroïdien est prescrit. La taille thymique ne fixe pas sa dose [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<div class="key"><b>À retenir.</b> Le traitement médicamenteux cible une maladie précise. Une régression thymique n’est pas une indication autonome du produit [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-11">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-12"><h2><span class="n">12</span>Suivi, pronostic et prévention proportionnée</h2><p>Le suivi distingue trois objets : la lésion, sa cause et ses associations. Après exérèse complète d’une hyperplasie vraie ou de rebond avec exclusion histologique des différentiels, la revue 2025 ne propose pas de surveillance thymique spécifique prolongée. Cela n’annule pas le suivi du cancer initial, de l’infection, de l’endocrinopathie ou d’une immunodéficience [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>].</p>
<p>Le module néerlandais ne suit pas spécifiquement un kyste simple ou une hyperplasie certaine caractérisés à l’imagerie. Une étude britannique de 96 patients ne rapportait aucune malignité pendant les suivis observés et concluait qu’une surveillance prolongée peut être inutile après caractérisation adéquate en résonance magnétique. La période de recherche de dix ans n’est pas un suivi de dix ans pour chaque patient [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39294035/" target="_blank" rel="noopener">S22</a>].</p>
<p>À Toulouse, les lésions retenues bénignes étaient surveillées annuellement deux ans puis à la quatrième année ; aucune progression des 26 kystes typiques n’était observée au suivi moyen 26,1 mois. Ce protocole local et cette vérification incomplète ne démontrent ni risque nul à vie ni nécessité d’imagerie répétée chez tous. Si une surveillance est choisie, préciser sa question, son échéance et le critère d’arrêt [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12774464/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39657307/" target="_blank" rel="noopener">S21</a>].</p>
<p>La forme lymphoépithéliale justifie une attention aux symptômes systémiques, adénopathies et nouvelles anomalies immunologiques. La revue suggère un bilan initial orienté et un suivi clinique, par exemple annuel, tout en reconnaissant l’absence de standard validé. Aucun dépistage populationnel d’E32 ni prévention médicamenteuse générale n’est établi dans les sources lues [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> Éviter le suivi sans question autant que l’arrêt de suivi d’une cause persistante. L’incertitude et le plan sont expliqués [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12774464/" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-12">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-13"><h2><span class="n">13</span>Âges, situations particulières et contexte suisse</h2><p>Chez le nourrisson et l’enfant, le thymus peut être naturellement proéminent et pauvre en graisse. La référence d’âge et l’expertise pédiatrique évitent d’appliquer un seuil adulte de volume ou de déplacement chimique. Une forme massive compressive est différente d’un thymus normal visible ; la gêne respiratoire impose son propre niveau de soins [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">S18</a>].</p>
<p>Après traitement oncologique, le rebond est fréquent dans certains groupes pédiatriques, mais l’image doit être confrontée aux autres localisations et à l’évolution. Chez l’adulte âgé, une douleur thoracique fébrile peut avoir une cause cardiaque, vasculaire ou infectieuse ; l’observation ancienne d’un abcès n’est pas un motif de privilégier ce diagnostic rare [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8449107/" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
<p>Grossesse, allaitement, âge et atteinte hépatique changent la vérification du carbimazole. La FI demande une évaluation stricte du bénéfice/risque, une contraception fiable et des précautions particulières ; les schémas étrangers ne deviennent pas automatiquement autorisés en Suisse. Le panneau Pharmacologie détaille les limites propres au produit [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<p>Le corpus priorise les sources suisses disponibles de nosologie, médicament et formation, puis les recommandations européennes. Aucune recommandation suisse dédiée E32 n’a été retrouvée dans cette recherche ciblée ; cela ne prouve pas qu’il n’en existe aucune. Le remboursement, la disponibilité et les modalités d’accord sont vérifiés au cas individuel à la date du soin. Aucun statut administratif 2026 ni obligation déclarative spécifique générale n’est inventé [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
<div class="key"><b>À retenir.</b> L’âge, le terrain et la question médicale déterminent la transposition d’une source. Un chiffre adulte ne devient pas un seuil pédiatrique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-13">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-14"><h2><span class="n">14</span>Critères formels et pièges à éviter</h2><p><b>Critères de structure.</b> La forme vraie conserve l’architecture adaptée à l’âge sans follicules significatifs ; le rebond conserve aussi l’architecture dans un contexte de récupération. La forme folliculaire comporte des follicules dans plus du tiers des lobules selon la revue. Ces critères histologiques ne se lisent pas sur le diamètre d’un scanner ni sur une biopsie non représentative [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>].</p>
<p><b>Paramètres chiffrés.</b> Les poids thymiques historiques dépendent de l’âge, avec de grandes dispersions. Le seuil d’indice de baisse de signal 8,92% provient d’une série adulte, optimisé sur sa population ; il ne constitue pas un critère universel. Les 33/34 rechutes extrathymiques de l’analyse Hodgkin ne signifient pas 34/34. Les 14%d’associations lymphomateuses d’une série lymphoépithéliale ne sont pas 14%de transformation future [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>].</p>
<p><b>Pièges.</b> Diagnostiquer tumeur sur taille seule ; exclure hyperplasie chez un jeune sans baisse de signal ; appeler cancer toute lésion néoplasique d’une série chirurgicale ; appeler consensus une enquête de pratiques ; ponctionner systématiquement un kyste ; imposer une émission de positons de routine malgré la recommandation européenne ; oublier l’agranulocytose devant fièvre sous carbimazole [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12774464/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39657307/" target="_blank" rel="noopener">S21</a>].</p>
<p><b>Décision argumentée.</b> Savoir dire ce qui est établi, ce qui reste incertain, quel examen changerait la conduite et pourquoi le suivi ou le geste est choisi. Aucun score E32 universel ni réponse officielle d’examen n’est inventé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
<div class="key"><b>À retenir.</b> Nommer la population et la méthode avec chaque seuil. Une probabilité n’est ni une certitude ni une permission de perdre le suivi [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-14">Essentiel de cette partie</button></section>
<div class="src"><h3>Sources effectivement consultées</h3><ul data-justification-sources="1"><li><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S1] CIM-10-GM E32 et subdivisions</a> — 2024. Entrées locales E32, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E32.0</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E32.1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E32.8</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E32.9</a>. Limites : Libellés locaux 2024 ; pas certification du codage individuel 2026.</li><li><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">[S2] Notes CIM-10-GM E32</a> — 2024. E32 et sous-codes, exclusions <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">D82.1</a> et <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">G70.0</a>. Limites : Notes allemandes confrontées aux libellés suisses ; pas assimilation de toutes masses médiastinales à E32.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">[S3] Thymic Hyperplasias in Practice: Clinical Context, Histological Clues, and Management Implications</a> — Publié 27 décembre 2025, volume 18 janvier 2026. Introduction, méthodes, sections 3.1–3.4, conclusions, tableaux 1–4 et figures 1–5. Limites : L’abstract parle systématique mais méthodes précisent revue narrative ; un auteur et données hétérogènes. L’absence de lien intrinsèque auto-immun des formes vraies ne nie pas leur association avec Basedow.</li><li><a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">[S4] Imagerie devant suspicion de tumeur thymique</a> — 8 novembre 2024, validité revue 31 août 2024. Recommandations et Overwegingen, forces/limites, indications de tomographie et IRM. Limites : Recommandation européenne pour diagnostic différentiel, pas protocole pédiatrique universel. Preuves faibles ; références NCCN citées par groupe européen, pas guideline américaine directement lue ni seule fondation.</li><li><a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/biopt_bij_epitheliale_thymustumoren.html" target="_blank" rel="noopener">[S5] Place de la biopsie dans les tumeurs épithéliales thymiques</a> — 8 novembre 2024. Recommandations, arguments et absence de comparaison directe des techniques. Limites : Ne pas appliquer le schéma tumeur résécable à tout diagnostic médiastinal, notamment lymphome ou infection.</li><li><a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/lab-analyses_voor_vaststellen_paraneoplastische_syndromen.html" target="_blank" rel="noopener">[S6] Analyses pour syndromes paranéoplasiques</a> — 8 novembre 2024. Recommandations, rationale et absence de preuve comparative. Limites : Mesures d’experts ; ne pas dépister tous les anticorps chez tout thymus physiologique.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12774464/" target="_blank" rel="noopener">[S7] Optimizing Diagnosis and Surgery for Pure Anterior Mediastinal Cysts: Insights from a Single-Centre Study</a> — 2025. Méthodes, résultats, discussion et limites ; tableaux 1–3. Limites : Rétrospective monocentrique, vérification histologique sélective, très larges intervalles ; inclut tératomes matures dans groupe néoplasique. Proposition PET initial contredit approche <button class="w" data-k="e32-nvalt">NVALT</button>, pas nouveau standard européen.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38565483/" target="_blank" rel="noopener">[S8] Making an accurate diagnosis of anterior mediastinal lesions: a proposal for a new diagnostic algorithm from the BTOG Thymic Malignancies Special Interest Group.</a> — 2024. Résumé publié. Limites : Résumé seul ; aucun détail d’algorithme ou intervalle attribué sans lecture.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">[S9] Differentiation of rebound and lymphoid thymic hyperplasia from anterior mediastinal tumors with dual-echo chemical-shift MR imaging in adulthood: reliability of the chemical-shift ratio and signal intensity index.</a> — En ligne 2014, volume 2015. Résumé publié. Limites : Résumé seul, monocentrique ; seuils optimisés sur cette série, pas règle pédiatrique ni garantie 100%.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/17463136/" target="_blank" rel="noopener">[S10] Thymic hyperplasia and thymus gland tumors: differentiation with chemical shift MR imaging.</a> — 2007. Résumé publié. Limites : Résumé seul, petite série hors Europe, confirmation technique et non fondation clinique unique.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">[S11] Differentiation between rebound thymic hyperplasia and thymic relapse after chemotherapy in pediatric Hodgkin lymphoma.</a> — 2023. Résumé publié. Limites : Résumé seul ; 98 des 133 grossissements classés, critères non validés chez tout patient.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25149085/" target="_blank" rel="noopener">[S12] Thymic hyperplasia in patients with Graves&#x27; disease.</a> — En ligne 2014, volume 2015. Résumé publié. Limites : Résumé seul, biais de publication et sélection, pas incidence ni risque 4/107 généralisable.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">[S13] Thymic Hyperplasia and Graves Disease: A Nonincidental Association</a> — 2023. Deux cas, discussion mécanismes et suivi, points pédagogiques. Limites : Publication de cas européenne dans revue américaine ; preuve faible. Expressions générales de bénignité ne permettent pas d’exclure tumeur chez tout Basedow. Pas transposition méthimazole en dose carbimazole.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">[S14] Mediastinal thymic cysts: a narrative review</a> — 2022. Embryologie, histologie, diagnostic, symptômes, traitement et limites. Limites : Revue américaine narrative, complément mécanismes/risques confronté aux sources européennes <button class="w" data-k="e32-nvalt">NVALT</button>/France/Royaume-Uni ; pas fondement américain seul. Pas copie des figures sous licence sans dérivation.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/18480581/" target="_blank" rel="noopener">[S15] Spontaneous rupture of idiopathic thymic abscess with a markedly increased CA-125 level.</a> — 2008. Résumé publié. Limites : Résumé de cas isolé, pas protocole antibiotique ni sensibilité de marqueur.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8449107/" target="_blank" rel="noopener">[S16] Thymic abscess with bacteremia and manubriosternal pyarthrosis in a geriatric patient.</a> — 1993. Résumé publié. Limites : Résumé de cas isolé, littérature ancienne ; antibiotique et dose non lus.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">[S17] Néo-Mercazole comprimés5mg : information professionnelle suisse</a> — Août 2020, version servie 2 novembre 2026. Formulation, indications, doses adultes/enfants, contre-indications, précautions, interactions, grossesse/allaitement, mécanisme. Limites : Date de révision 2020 explicitée, pas inventée 2026. FI pas preuve d’effet thymique direct ni durée de régression. Produit non substitué mg pour mg au méthimazole.</li><li><a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">[S18] Anatomy of the Lymphatic and Immune Systems, thymus</a> — 2 e, chapitre 21, version servie 2026. Section Thymus et comparaison organes lymphoïdes primaires/secondaires. Limites : Manuel américain de science normale uniquement, pas guideline clinique. Pronostic de 120 ans et chiffres de sénescence non repris. Figure 21.7 crédit tiers Michigan, non réutilisée faute licence propre clarifiée.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">[S19] From Development to Aging: Dynamic Roles of the Thymic Medulla in T Cell Biology</a> — 8 avril 2026. Introduction ; 2.1,2.3,2.4,3.1,3.4,3.6 ; résumé et limites de transposition. Limites : Sections réellement lues, non tout article. Observations murines ne deviennent pas critères humains ni traitements disponibles. Auto-immunité non supprimée absolument par sélection.</li><li><a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S20] PROFILES, situations de départ</a> — 2017. p 27–29 : usage des situations ;SSP2,4,6,37,44–49 ; nouvelle lecture ciblée 2 novembre 2026. Limites : Pas correspondance officielle CIM-E32/examen. Les astérisques nosologiques historiques vers SSP156/184 ne sont pas adoptés comme mapping officiel.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39657307/" target="_blank" rel="noopener">[S21] The DETECTION project part 1: An international Delphi survey about diagnostics and treatment of anterior mediastinal cystic lesions.</a> — 2025. Résumé publié. Limites : Résumé seul ; enquête de pratiques et non recommandation consensuelle validée.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39294035/" target="_blank" rel="noopener">[S22] Behaviour of simple thymic cysts over time; is surveillance required?</a> — 2024. Résumé publié. Limites : Résumé seul, sélection sur diagnostic et suivis variables ; dix ans désignent période de recherche, pas dix ans pour chacun.</li></ul><p>Audit différé — auto-relecture par intelligence artificielle, distincte d’une validation médicale humaine. Sources intégrales en cache externe ; texte public par paraphrases, références et limites.</p>
</div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="e32-e-1"><h2><span class="n">e-1</span>Imagerie : composition avant étiquette</h2><table class="t" data-e32-table="1"><thead><tr><th>Question</th><th>Examen orienté</th><th>Limite</th></tr></thead><tbody><tr><td>Qu’a changé le traitement ou le temps ?</td><td>Comparaison avec images antérieures et autres localisations.</td><td>Croissance seule non spécifique ; contexte oncologique indispensable.</td></tr><tr><td>Masse solide suspecte ?</td><td>Scanner thoracique injecté si examen adéquat absent.</td><td>Ne classe pas fiablement tous types tumoraux.</td></tr><tr><td>Kyste ou tissu hyperplasique ?</td><td>Résonance magnétique selon question, séquences et expertise.</td><td>Graisse absente chez jeune ; contenu protéique/hémorragique trompeur au scanner.</td></tr><tr><td>Maladie systémique ou extension ?</td><td>Imagerie complémentaire choisie en équipe.</td><td>Émission de positons non systématique selon <button class="w" data-k="e32-nvalt">NVALT</button> ; captation non preuve de cancer.</td></tr></tbody></table>
<p>Une hyperplasie peut être diffuse, homogène et sans invasion, mais aucune combinaison simplifiée n’écarte toute tumeur. Chez le jeune, la composition et l’âge comptent ; une forte densité ne suffit pas à déclarer un kyste solide. Le compte rendu doit préciser ce qui est certain et ce qui appelle caractérisation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
<div class="key"><b>À retenir.</b> L’image décrit une composition et une extension ; elle ne remplace pas toujours l’histologie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-e-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-e-2"><h2><span class="n">e-2</span>Déplacement chimique : technique et limites</h2><p>Les protons de l’eau et de la graisse ne précessent pas à la même fréquence. En comparant des acquisitions en phase et en opposition de phase, le radiologue recherche une baisse de signal dans un tissu mêlant eau et graisse microscopique. Cette propriété aide à distinguer thymus hyperplasique graisseux et masse solide dans des contextes définis [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/17463136/" target="_blank" rel="noopener">S10</a>].</p>
<p>Dans une série de 92 adultes, l’indice d’intensité avait un seuil optimisé à 8,92%, avec sensibilité/spécificité de 100%rapportées dans cette série. Le rapport de déplacement chimique avait certains chevauchements chez les adultes jeunes. Ces résultats de recherche ne promettent pas 100%pour un autre scanner, une autre séquence, une autre population ou un enfant [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>].</p>
<p>Le module néerlandais souligne la limite du thymus physiologique jeune sans graisse suffisante. Une absence de baisse n’est donc pas synonyme de cancer. La <button class="w" data-k="e32-chimique">fenêtre sur l’interprétation du déplacement chimique</button> rappelle la méthode, la population et la question ; aucun seuil universel pédiatrique n’est proposé [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/17463136/" target="_blank" rel="noopener">S10</a>].</p>
<div class="key"><b>À retenir.</b> La baisse suggère la graisse microscopique ; son absence ne classe pas seule la lésion [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-e-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-e-3"><h2><span class="n">e-3</span>Biologie et prélèvements ciblés</h2><p>Devant une suspicion de tumeur épithéliale thymique, le module européen conseille la recherche d’anticorps du récepteur de l’acétylcholine. Infections répétées orientent immunoglobulines et profil lymphocytaire ; une anémie peut justifier réticulocytes et enquête adaptée. Ces recommandations d’experts concernent une population suspecte, pas toute image de thymus normal [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/lab-analyses_voor_vaststellen_paraneoplastische_syndromen.html" target="_blank" rel="noopener">S6</a>].</p>
<p>Une suspicion de Basedow demande fonction thyroïdienne et examens orientés ; une fièvre ou une collection demande bilan infectieux et prélèvements selon état clinique. Un biomarqueur élevé n’est pas automatiquement tumoral : un cas d’abcès avait une élévation du marqueur <button class="w" data-k="e32-ca125">CA-125</button>. Cette observation n’en fait ni un test d’abcès ni un marqueur à doser de routine [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/18480581/" target="_blank" rel="noopener">S15</a>].</p>
<p>La biopsie doit répondre à une hypothèse et échantillonner la zone pertinente. Du thymus normal prélevé à côté d’une masse ne tranche pas le diagnostic. Pour une tumeur épithéliale présumée résécable, la recommandation néerlandaise évite la biopsie préalable ; une tumeur non résécable ou un autre diagnostic suspecté peut nécessiter un prélèvement différent. Les kystes demandent prudence face à ponction et infection [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/biopt_bij_epitheliale_thymustumoren.html" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
<div class="key"><b>À retenir.</b> Un examen est prescrit pour une décision, pas pour remplir une liste. Le prélèvement doit être représentatif [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/biopt_bij_epitheliale_thymustumoren.html" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/lab-analyses_voor_vaststellen_paraneoplastische_syndromen.html" target="_blank" rel="noopener">S6</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-e-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-e-4"><h2><span class="n">e-4</span>Quatre exercices de raisonnement</h2><div class="quiz ui"><p><b>Cas fictif 1.</b> Après traitement d’un Hodgkin pédiatrique, le thymus grossit seul, sans autre site croissant. Que conclure ?</p>
<button data-ok="1">Rebond plausible ; confronter aux autres sites et au suivi oncologique, sans exclure absolument une rechute isolée.</button><button data-ok="0">Rechute impossible, aucun suivi du lymphome ne reste nécessaire.</button><p class="fb" hidden>Dans la série européenne 64/64 rebonds étaient isolés, mais une des 34 rechutes l’était aussi ; 98 grossissements seulement étaient classés. La règle oriente sans garantir [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>].</p>
</div><div class="quiz ui"><p><b>Cas fictif 2.</b> Un jeune patient a un thymus sans baisse de signal en opposition de phase. Est-ce une preuve de cancer ?</p>
<button data-ok="1">Non ; le manque de graisse du thymus jeune limite cette technique, à interpréter avec le reste.</button><button data-ok="0">Oui ; toute absence de baisse signifie malignité.</button><p class="fb" hidden>Âge et composition font partie de l’interprétation. Les seuils de séries adultes ne sont pas universels [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>].</p>
</div><div class="quiz ui"><p><b>Cas fictif 3.</b> Un kyste simple est certain en résonance magnétique, asymptomatique. Quelle affirmation est défendable ?</p>
<button data-ok="1">Selon la recommandation néerlandaise2024, pas de suivi spécifique ; vérifier la certitude du diagnostic et le contexte.</button><button data-ok="0">Une chirurgie et une émission de positons sont obligatoires pour tout kyste.</button><p class="fb" hidden>La recommandation néerlandaise évite suivi spécifique des kystes simples certains. Les lésions indéterminées ou symptomatiques relèvent d’une autre discussion ; les protocoles locaux diffèrent [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12774464/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39657307/" target="_blank" rel="noopener">S21</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39294035/" target="_blank" rel="noopener">S22</a>].</p>
</div><div class="quiz ui"><p><b>Cas fictif 4.</b> Une personne sous carbimazole a fièvre, angine et aphtes. Que faire ?</p>
<button data-ok="1">Arrêter le médicament et consulter immédiatement pour évaluation et hémogramme.</button><button data-ok="0">Attendre le prochain scanner du thymus car ces signes prouvent un rebond bénin.</button><p class="fb" hidden>La FI suisse alerte sur agranulocytose potentiellement rapide et grave ; les symptômes ne doivent pas attendre un contrôle thymique [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
