<template data-pop="pareto-e32-10" data-title="Essentiel — Prise en charge selon la lésion"><p>Traiter une cause, observer une lésion caractérisée et retirer une lésion suspecte sont des décisions différentes [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>].</p>
<p class="ratio" data-cover="e32-10"></p>
</template>
<template data-pop="pareto-e32-11" data-title="Essentiel — Pharmacologie : aucune ordonnance universelle E32"><p>Le traitement médicamenteux cible une maladie précise. Une régression thymique n’est pas une indication autonome du produit [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<p class="ratio" data-cover="e32-11"></p>
</template>
<template data-pop="pareto-e32-12" data-title="Essentiel — Suivi, pronostic et prévention proportionnée"><p>Éviter le suivi sans question autant que l’arrêt de suivi d’une cause persistante. L’incertitude et le plan sont expliqués [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12774464/" target="_blank" rel="noopener">S7</a>].</p>
<p class="ratio" data-cover="e32-12"></p>
</template>
<template data-pop="pareto-e32-13" data-title="Essentiel — Âges, situations particulières et contexte suisse"><p>L’âge, le terrain et la question médicale déterminent la transposition d’une source. Un chiffre adulte ne devient pas un seuil pédiatrique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<p class="ratio" data-cover="e32-13"></p>
</template>
<template data-pop="pareto-e32-14" data-title="Essentiel — Critères formels et pièges à éviter"><p>Nommer la population et la méthode avec chaque seuil. Une probabilité n’est ni une certitude ni une permission de perdre le suivi [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>].</p>
<p class="ratio" data-cover="e32-14"></p>
</template>
<template data-pop="pareto-e32-e-1" data-title="Essentiel — Imagerie : composition avant étiquette"><p>L’image décrit une composition et une extension ; elle ne remplace pas toujours l’histologie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>].</p>
<p class="ratio" data-cover="e32-e-1"></p>
</template>
<template data-pop="pareto-e32-e-2" data-title="Essentiel — Déplacement chimique : technique et limites"><p>La baisse suggère la graisse microscopique ; son absence ne classe pas seule la lésion [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>].</p>
<p class="ratio" data-cover="e32-e-2"></p>
</template>
<template data-pop="pareto-e32-e-3" data-title="Essentiel — Biologie et prélèvements ciblés"><p>Un examen est prescrit pour une décision, pas pour remplir une liste. Le prélèvement doit être représentatif [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/biopt_bij_epitheliale_thymustumoren.html" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/lab-analyses_voor_vaststellen_paraneoplastische_syndromen.html" target="_blank" rel="noopener">S6</a>].</p>
<p class="ratio" data-cover="e32-e-3"></p>
</template>
<template data-pop="pareto-e32-e-4" data-title="Essentiel — Quatre exercices de raisonnement"><p>Rebond plausible, limite technique, certitude d’un kyste et sécurité médicamenteuse sont quatre décisions différentes [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<p class="ratio" data-cover="e32-e-4"></p>
</template>
<template data-pop="pareto-e32-s-anat-cours" data-title="Essentiel — Anatomie : topographie, âge et conséquences"><p>Topographie et composition expliquent symptômes et limites techniques. L’image histologique humaine illustre l’architecture, pas le diagnostic de tout médiastin [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">S18</a>].</p>
<p class="ratio" data-cover="e32-s-anat-cours"></p>
</template>
<template data-pop="pareto-e32-s-histo-cours" data-title="Essentiel — Histologie : architecture et représentativité"><p>L’architecture et l’échantillon comptent autant que le marqueur. Un résultat partiel doit rester confronté à la masse réelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/biopt_bij_epitheliale_thymustumoren.html" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
<p class="ratio" data-cover="e32-s-histo-cours"></p>
</template>
<template data-pop="pareto-e32-s-physio-cours" data-title="Essentiel — Physiologie : produire, sélectionner et récupérer"><p>Fonction, volume et immunité ne sont pas équivalents. Le rebond peut être réactif sans être une mesure de récupération complète [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<p class="ratio" data-cover="e32-s-physio-cours"></p>
</template>
<template data-pop="pareto-e32-s-bioch-cours" data-title="Essentiel — Biochimie : signaux cellulaires et mesures indirectes"><p>Nommer ce qu’une mesure observe évite de lui attribuer une fonction qu’elle ne mesure pas [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/18480581/" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<p class="ratio" data-cover="e32-s-bioch-cours"></p>
</template>
<template data-pop="pareto-e32-s-gene-cours" data-title="Essentiel — Génétique et immunologie : tolérance et associations"><p>Tolérance, auto-anticorps, clonalité et volume sont des dimensions différentes ; la cohérence clinique et tissulaire les relie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/lab-analyses_voor_vaststellen_paraneoplastische_syndromen.html" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<p class="ratio" data-cover="e32-s-gene-cours"></p>
</template>
<template data-pop="pareto-e32-p-1" data-title="Essentiel — Ce que traite le médicament"><p>Le médicament traite la cause définie. La réponse de l’image ne prouve pas à elle seule le diagnostic [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<p class="ratio" data-cover="e32-p-1"></p>
</template>
<template data-pop="pareto-e32-p-2" data-title="Essentiel — Carbimazole : formulation et populations"><p>Formulation, voie, âge et objectif accompagnent la dose. Les 20–60 mg/j adultes ne s’appliquent pas automatiquement à un enfant [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<p class="ratio" data-cover="e32-p-2"></p>
</template>
<template data-pop="pareto-e32-p-3" data-title="Essentiel — Sécurité : signes d’alarme et interactions"><p>Un contrôle prévu ne neutralise pas une alerte clinique. Fièvre/angine/aphtes sous traitement demandent action immédiate [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<p class="ratio" data-cover="e32-p-3"></p>
</template>
<template data-pop="pareto-e32-p-4" data-title="Essentiel — Grossesse, allaitement et traitement de l’infection"><p>La population change le risque et la dose. Une observation d’abcès ne devient pas un protocole pour tous [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/18480581/" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8449107/" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<p class="ratio" data-cover="e32-p-4"></p>
</template>
