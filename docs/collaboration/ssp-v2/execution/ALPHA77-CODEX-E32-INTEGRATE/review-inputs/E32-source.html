</div><div class="key"><b>À retenir.</b> Rebond plausible, limite technique, certitude d’un kyste et sécurité médicamenteuse sont quatre décisions différentes [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-e-4">Essentiel de cette partie</button></section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="e32-tab-semio" role="tab" data-s="e32-s-semio" aria-controls="e32-s-semio" aria-selected="true">Sémiologie fondamentale et analytique</button><button id="e32-tab-anat" role="tab" data-s="e32-s-anat" aria-controls="e32-s-anat" aria-selected="false">Anatomie</button><button id="e32-tab-histo" role="tab" data-s="e32-s-histo" aria-controls="e32-s-histo" aria-selected="false">Histologie</button><button id="e32-tab-physio" role="tab" data-s="e32-s-physio" aria-controls="e32-s-physio" aria-selected="false">Physiologie</button><button id="e32-tab-bioch" role="tab" data-s="e32-s-bioch" aria-controls="e32-s-bioch" aria-selected="false">Biochimie</button><button id="e32-tab-gene" role="tab" data-s="e32-s-gene" aria-controls="e32-s-gene" aria-selected="false">Génétique et immunologie</button></div><div class="chap-body sci-body"><div class="sci" id="e32-s-semio" role="tabpanel" aria-labelledby="e32-tab-semio"><section class="ilot" id="e32-s-semio-cours"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><div class="key"><p><b>Science → clinique.</b> Relier une gêne respiratoire à sa gravité, sans conclure sur la lésion. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>]</p>
<p><b>Science → examen.</b> Comparer contexte, examen et imagerie utile pour la décision. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>]</p>
<p><b>Science → traitement.</b> Stabiliser une complication avant un geste électif. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>]</p>
<p><b>À retenir.</b> Le volume, la fonction et le mécanisme se confrontent sans se remplacer.</p>
</div><p>Relier le signe à un mécanisme puis à l’examen et à une décision, en gardant l’âge, les traitements et l’incertitude. Les neuf volets ci-dessous constituent la démarche [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
<section class="ilot" id="e32-semio-normal" data-semiology="normal"><h3>Normal : un organe variable</h3><p>Le thymus est profond, dans le médiastin antérieur, habituellement non palpable. Son aspect dépend de l’âge : tissu relativement important et pauvre en graisse chez l’enfant, involution et graisse plus présentes ensuite. Le fonctionnement normal est la production et la sélection de lymphocytes T, pas la filtration de la lymphe comme dans un ganglion. Une image visible ne signifie pas maladie [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
</section>
<section class="ilot" id="e32-semio-signs" data-semiology="signs"><h3>Signes et symptômes</h3><p>Beaucoup de lésions sont fortuites. Douleur thoracique, dyspnée, stridor, dysphagie, dysphonie ou gonflement facial peuvent traduire compression, mais ne sont pas spécifiques. Fièvre et douleur rétrosternale font envisager infection parmi d’autres urgences. Fatigabilité fluctuante, ptosis et diplopie orientent une association neurologique ; l’examen ne conclut pas au type de thymus [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/lab-analyses_voor_vaststellen_paraneoplastische_syndromen.html" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/18480581/" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8449107/" target="_blank" rel="noopener">S16</a>].</p>
</section>
<section class="ilot" id="e32-semio-mechanisms" data-semiology="mechanisms"><h3>Du mécanisme au signe</h3><p>L’expansion tissulaire peut comprimer voies aériennes, vaisseaux ou nerfs voisins. Une hémorragie peut accélérer cette expansion ; une infection produit inflammation et parfois extension. Une hyperplasie folliculaire peut accompagner une maladie auto-immune sans augmentation majeure de taille. La gravité n’est donc pas proportionnelle au seul diamètre et la fatigabilité ne mesure pas ce diamètre [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
</section>
<section class="ilot" id="e32-semio-examination" data-semiology="examination"><h3>Examen expliqué</h3><p>Commencer par respiration, oxygénation et hémodynamique selon le tableau. Décrire stridor, travail respiratoire, œdème facial, circulation collatérale, voix et déglutition. Rechercher adénopathies, goitre et signes de thyrotoxicose. Un examen neurologique ciblé évalue fatigabilité oculaire, bulbaire et respiratoire ; la gêne respiratoire ou de déglutition modifie immédiatement l’orientation [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/lab-analyses_voor_vaststellen_paraneoplastische_syndromen.html" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
</section>
<section class="ilot" id="e32-semio-interpretation" data-semiology="interpretation"><h3>Interprétation contextualisée</h3><p>Un examen normal n’exclut pas une masse ; un symptôme compressif ne prouve pas qu’elle soit thymique. Une croissance isolée après chimiothérapie est compatible avec rebond, mais une rechute isolée reste possible. L’absence de baisse de signal chez un jeune pauvre en graisse ne prouve pas cancer. L’histoire, la composition et les autres sites donnent un sens au signe [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>].</p>
</section>
<section class="ilot" id="e32-semio-differentials" data-semiology="differentials"><h3>Différentiels utiles</h3><p>Comparer thymus normal, hyperplasie, kyste, abcès, tumeur épithéliale, lymphome, tumeur germinale et tissu thyroïdien ectopique. Une douleur thoracique aiguë garde ses causes cardiaques, vasculaires et pulmonaires prioritaires ; la lésion connue ne les exclut pas. Fièvre sous carbimazole fait aussi rechercher toxicité hématologique. Les indices orientent les examens qui changent la décision [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8449107/" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
</section>
<section class="ilot" id="e32-semio-urgency" data-semiology="urgency"><h3>Urgence et orientation</h3><p>Détresse respiratoire, stridor important, instabilité, compression vasculaire menaçante, faiblesse bulbaire/respiratoire ou tableau septique demandent évaluation urgente. Une hémorragie peut changer rapidement le volume. Sous carbimazole, fièvre/angine/aphtes impliquent arrêt et consultation immédiate avec hémogramme selon la FI. L’orientation suit le risque, sans attendre la preuve histologique complète [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
</section>
<section class="ilot" id="e32-semio-limits" data-semiology="limits"><h3>Limites de la sémiologie</h3><p>Aucun score E32 clinique universel n’est validé ici. Ni taille, ni absence de symptômes, ni anticorps seuls ne classent toute lésion. Une biopsie peut manquer la région malade ; une imagerie peut rester indéterminée. Expliquer ce qui est certain, le choix du contrôle ou du geste et les signes de retour urgent permet de gérer cette incertitude avec le patient [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/biopt_bij_epitheliale_thymustumoren.html" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/lab-analyses_voor_vaststellen_paraneoplastische_syndromen.html" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
</section>
<section class="ilot" id="e32-semio-sources" data-semiology="sources"><h3>Sources, populations et portée</h3><p>La nosologie et la FI suisses sont complétées par <button class="w" data-k="e32-nvalt">NVALT</button> 2024, les travaux allemands et britanniques et les données européennes pédiatriques. La série française 2025, l’enquête internationale et la revue américaine de kystes ont des populations et conclusions différentes. Les citations mènent aux sources réellement lues ; aucune auto-relecture n’est une validation médicale humaine [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12774464/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39657307/" target="_blank" rel="noopener">S21</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39294035/" target="_blank" rel="noopener">S22</a>].</p>
</section>
<figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Signe et calendrier</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Mécanisme et risque</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Examen utile puis orientation</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Le signe déclenche une question ; il ne nomme pas seul la lésion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</figcaption></figure>
</section>
</div><div class="sci" id="e32-s-anat" role="tabpanel" aria-labelledby="e32-tab-anat" hidden><div class="key"><p><b>Science → clinique.</b> Les rapports expliquent compression et symptômes, indépendamment de la seule taille. [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">S18</a>]</p>
<p><b>Science → examen.</b> L’imagerie précise les structures concernées avant un geste. [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">S18</a>]</p>
<p><b>Science → traitement.</b> L’équipe adapte observation ou intervention aux rapports et au risque. [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">S18</a>]</p>
<p><b>À retenir.</b> Le volume, la fonction et le mécanisme se confrontent sans se remplacer.</p>
</div><section class="ilot" id="e32-s-anat-cours"><h2><span class="n">s-anat-cours</span>Anatomie : topographie, âge et conséquences</h2><p>Le thymus est un organe bilobé situé dans la partie antérieure du médiastin, derrière le sternum et en avant des structures cardiaques et vasculaires. Une capsule conjonctive l’entoure et des septa délimitent des lobules. Cette topographie explique qu’un organe profond puisse être visible à l’imagerie tout en restant non palpable à l’examen de routine [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">S18</a>].</p>
<p>Au cours du développement, son origine dans la région pharyngée et sa migration expliquent la possibilité de tissu thymique ectopique et de kystes sur un trajet inhabituel. La revue des kystes décrit la troisième poche pharyngée et une descente vers le thorax ; cette description embryologique n’autorise pas à attribuer toute masse cervicale au thymus. Thyroïde, ganglions et autres kystes restent des différentiels [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
<p>Chez l’enfant, le tissu thymique normal peut être important et relativement pauvre en graisse. Avec l’âge, la composition change et le tissu fonctionnel est davantage mêlé de graisse. Un diamètre ou un poids ne se lit donc pas sans âge et méthode. Les poids de séries autopsiques historiques ne sont pas des seuils de tomographie chez une personne vivante [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">S18</a>].</p>
<figure><div data-e32-frame="anatomy"><img src="assets/img/e32/alpha/codex/architecture-human.jpg" alt="Planche histologique humaine d’hyperplasie vraie chez un nourrisson : architecture lobulaire et compartiments conservés ; quatre panneaux originaux." width="750" height="515"><span data-e32-marker="1" data-e32-pin="a1">1</span><span data-e32-marker="1" data-e32-pin="a2">2</span><span data-e32-marker="1" data-e32-pin="a3">3</span></div><figcaption>Original humain : Stefan Porubsky, 2025, figure 1 ; matériel histologique Tissue Bank Mainz ; Creative Commons Attribution 4.0. Cas d’un nourrisson de six mois avec hyperplasie vraie, pas un contrôle sain. Annotations françaises superposées : 1 organisation lobulaire du panneau A ; 2 zone corticale plus dense du panneau B ; 3 zone médullaire plus claire. Panneaux A/B : hématoxyline-éosine ;C : <button class="w" data-k="e32-markers">TdT</button> ;D : <button class="w" data-k="e32-markers">CD5</button>. Grossissements originaux 2 ×,5 ×,10 ×,10 ×, non grossissement d’écran ; pas calibration métrique. Pixels inchangés ; repères Sol 2026, interprétation pédagogique limitée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>].</figcaption></figure>
<p>La planche montre une hyperplasie vraie avec architecture jugée adaptée à l’âge par la source. Elle permet de reconnaître lobules, cortex dense et médulla plus claire ; elle ne représente pas une anatomie grossière du médiastin ni une localisation de nerfs. La présence de tissu normal d’aspect dans une biopsie ne prouve pas que toute une masse soit bénigne : l’échantillon peut être adjacent ou partiel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>].</p>
<p>Lorsqu’une lésion augmente, les conséquences dépendent de ses rapports et pas seulement de sa taille. Voies aériennes, gros vaisseaux et nerfs peuvent être comprimés, donnant stridor, œdème facial ou modification de voix. L’imagerie précise ces rapports pour la décision et la préparation d’un geste ; aucun trajet anatomique dessiné par intelligence artificielle n’est substitué ici à une source originale [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
<div class="key"><b>À retenir.</b> Topographie et composition expliquent symptômes et limites techniques. L’image histologique humaine illustre l’architecture, pas le diagnostic de tout médiastin [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">S18</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-s-anat-cours">Essentiel de cette partie</button></section>
</div><div class="sci" id="e32-s-histo" role="tabpanel" aria-labelledby="e32-tab-histo" hidden><div class="key"><p><b>Science → clinique.</b> Follicules et gros thymus ne sont pas équivalents. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/biopt_bij_epitheliale_thymustumoren.html" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>]</p>
<p><b>Science → examen.</b> Architecture, marqueurs et représentativité accompagnent le prélèvement. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/biopt_bij_epitheliale_thymustumoren.html" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>]</p>
<p><b>Science → traitement.</b> Une association lymphoproliférative change le bilan ; pas traitement sur un marqueur seul. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/biopt_bij_epitheliale_thymustumoren.html" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>]</p>
<p><b>À retenir.</b> Le volume, la fonction et le mécanisme se confrontent sans se remplacer.</p>
</div><section class="ilot" id="e32-s-histo-cours"><h2><span class="n">s-histo-cours</span>Histologie : architecture et représentativité</h2><p>Le thymus normal associe un réseau épithélial, des thymocytes, des cellules dendritiques et des macrophages. Le cortex contient beaucoup de thymocytes et paraît plus dense ; la médulla est moins riche en petites cellules lymphoïdes et comporte notamment des structures épithéliales, dont les corpuscules de Hassall. Cette organisation n’est pas celle d’un ganglion à follicules périphériques [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems" target="_blank" rel="noopener">S18</a>].</p>
<p>Dans l’hyperplasie vraie, l’architecture adaptée à l’âge est conservée sans follicules significatifs ; le rebond peut aussi garder cortex et médulla, avec une involution moindre qu’attendue pour l’âge. Il faut connaître l’histoire de récupération et les traitements. Une corticothérapie ou autre immunosuppression peut modifier les compartiments et compliquer la lecture d’une petite biopsie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>].</p>
<figure><div data-e32-frame="histology"><img src="assets/img/e32/alpha/codex/follicular-human.jpg" alt="Planche histologique humaine d’hyperplasie folliculaire : panneaux HE, CD20, CD23, TdT et CK19 montrant des zones atteintes et préservées." width="743" height="591"><span data-e32-marker="1" data-e32-pin="h1">1</span><span data-e32-marker="1" data-e32-pin="h2">2</span><span data-e32-marker="1" data-e32-pin="h3">3</span></div><figcaption>Original humain : Stefan Porubsky, 2025, figure 3 ; matériel Tissue Bank Mainz ; Creative Commons Attribution 4.0. Repères : 1 follicule avec marquage <button class="w" data-k="e32-markers">CD20</button> dans la partie inférieure du panneau C ; 2 réseau folliculaire <button class="w" data-k="e32-markers">CD23</button> du panneau D ; 3 cortex <button class="w" data-k="e32-markers">TdT</button> positif mieux conservé dans la partie supérieure du panneau E. Le contraste inférieur/supérieur se lit avec la légende originale ; un marqueur seul ne pose pas le diagnostic. Grossissements originaux : panneau A : 2 × et panneaux B–F : 3 × ; absence de calibration pour mesurer à l’écran. Image entière et pixels inchangés ; annotations locales Sol 2026 [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>].</figcaption></figure>
<p>L’hyperplasie folliculaire contient des follicules à centres germinatifs dans plus du tiers des lobules selon la définition de la revue. L’augmentation porte sur ces follicules et ne signifie pas nécessairement gros thymus. Les marquages du réseau épithélial, des lymphocytes et de leur maturation complètent la morphologie ; un signal <button class="w" data-k="e32-markers">CD20</button> ou <button class="w" data-k="e32-markers">TdT</button> isolé ne suffit pas à classer toute lésion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>].</p>
<p>La forme lymphoépithéliale associe des follicules, une prolifération épithéliale, des lésions lymphoépithéliales et des changements kystiques des corpuscules de Hassall. Une architecture folliculaire atypique conduit à une expertise hématopathologique pour rechercher un lymphome associé. Les pourcentages d’association publiés n’établissent pas un risque futur individuel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>].</p>
<p>La représentativité est centrale : un prélèvement peut manquer les lobules atteints ou recueillir du thymus normal à côté d’un processus tumoral. À l’inverse, quelques follicules peuvent être non spécifiques. Le pathologiste confronte étendue, distribution, marqueurs et contexte radiologique ; la lame et le compte rendu ne se remplacent pas par une vignette en ligne [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/biopt_bij_epitheliale_thymustumoren.html" target="_blank" rel="noopener">S5</a>].</p>
<p>Dans un kyste, la paroi et ses éléments thymiques contribuent au diagnostic. Une aspiration de liquide seule peut ne montrer que des lymphocytes et manquer la nature de la paroi ; c’est une raison de ne pas faire d’une ponction non diagnostique une preuve rassurante. Risque d’infection et bénéfice du prélèvement sont discutés [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
<div class="key"><b>À retenir.</b> L’architecture et l’échantillon comptent autant que le marqueur. Un résultat partiel doit rester confronté à la masse réelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/biopt_bij_epitheliale_thymustumoren.html" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-s-histo-cours">Essentiel de cette partie</button></section>
</div><div class="sci" id="e32-s-physio" role="tabpanel" aria-labelledby="e32-tab-physio" hidden><div class="key"><p><b>Science → clinique.</b> Le rebond peut être réactif sans prouver une récupération immunitaire complète. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>]</p>
<p><b>Science → examen.</b> Le volume ne mesure pas la qualité de la sélection ou du répertoire. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>]</p>
<p><b>Science → traitement.</b> Les stratégies régénératives expérimentales ne deviennent pas une prescription courante. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>]</p>
<p><b>À retenir.</b> Le volume, la fonction et le mécanisme se confrontent sans se remplacer.</p>
</div><section class="ilot" id="e32-s-physio-cours"><h2><span class="n">s-physio-cours</span>Physiologie : produire, sélectionner et récupérer</h2><p>Le thymus fournit un environnement spécialisé pour le développement des lymphocytes T. Les précurseurs arrivent par le sang, se différencient et réarrangent les gènes de leur récepteur. Un récepteur fonctionnel doit reconnaître des complexes de peptide et de molécules de présentation du soi ; cette reconnaissance initiale permet une sélection positive. Elle ne signifie pas activation pathologique contre les organes [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<p>Les cellules sélectionnées changent de stade et de position, puis rencontrent notamment les cellules épithéliales médullaires et les cellules dendritiques. Les interactions avec les antigènes du soi participent à l’élimination de cellules dangereusement autoréactives ou à l’orientation de certaines vers une fonction régulatrice. Les étapes ne forment pas une séparation absolue cortex « uniquement positif » et médulla « uniquement négatif » ; plusieurs mécanismes se recouvrent [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<p>Le résultat est un répertoire capable de répondre à des agents étrangers tout en limitant l’attaque du soi. Cette tolérance centrale est importante mais incomplète : des contrôles périphériques restent nécessaires. Un thymus volumineux n’est donc pas un répertoire forcément meilleur, et une taille normale n’exclut pas une anomalie fonctionnelle ou auto-immune [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Développement du récepteur</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Sélection et régulation</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Sortie puis contrôles périphériques</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Enchaînement fonctionnel simplifié, sans carte anatomique ni proportions inventées [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</figcaption></figure>
<p>Le vieillissement entraîne une involution et une diminution de la production de nouveaux lymphocytes, mais l’immunité dépend aussi des cellules périphériques, de leurs renouvellements et des maladies associées. La revue 2026 souligne les limites des preuves reliant directement volume restauré et protection immunitaire humaine. Une image de rebond n’est pas un test de guérison immunologique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<p>Après infection, traitement cytotoxique ou autre stress, le tissu peut récupérer et paraître plus important. Les circuits de réparation étudiés comportent cellules épithéliales, stromales et immunitaires ; beaucoup de résultats proviennent de modèles murins. Les comparer au patient exige prudence : un traitement qui change une taille n’a pas nécessairement démontré bénéfice clinique ou tolérance à long terme [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<p>En pratique, l’histoire de récupération et les autres sites rendent le rebond plausible. Si le tableau est discordant, l’hypothèse est révisée. Observer une image attendue et traiter une détresse respiratoire sont des décisions à des échelles différentes ; la physiologie n’efface pas l’évaluation clinique [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>].</p>
<div class="key"><b>À retenir.</b> Fonction, volume et immunité ne sont pas équivalents. Le rebond peut être réactif sans être une mesure de récupération complète [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-s-physio-cours">Essentiel de cette partie</button></section>
</div><div class="sci" id="e32-s-bioch" role="tabpanel" aria-labelledby="e32-tab-bioch" hidden><div class="key"><p><b>Science → clinique.</b> Un titre d’anticorps ou un indice d’image ne mesure pas toute la maladie. [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>]</p>
<p><b>Science → examen.</b> Chaque signal garde sa méthode et son objet. [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>]</p>
<p><b>Science → traitement.</b> Le carbimazole cible la synthèse thyroïdienne, sa dose ne dépend pas du diamètre thymique. [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>]</p>
<p><b>À retenir.</b> Le volume, la fonction et le mécanisme se confrontent sans se remplacer.</p>
</div><section class="ilot" id="e32-s-bioch-cours"><h2><span class="n">s-bioch-cours</span>Biochimie : signaux cellulaires et mesures indirectes</h2><p>La reconnaissance du complexe peptide-molécule de présentation par le récepteur T déclenche des signaux intracellulaires. Leur intensité, leur durée et les signaux associés influencent survie, sélection et différenciation. Une reconnaissance insuffisante ne soutient pas la même trajectoire qu’une interaction forte ; le devenir ne se réduit pourtant pas à un interrupteur binaire applicable à toutes les cellules [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<p>Les cellules épithéliales et dendritiques présentent des peptides et produisent des signaux qui organisent les rencontres. Des chimiokines orientent le déplacement, notamment le couple récepteur <button class="w" data-k="e32-cytokines">CCR7</button>-ligand <button class="w" data-k="e32-cytokines">CCL21</button> dans les modèles étudiés. Les cytokines participent à la survie et à la génération de lymphocytes régulateurs ; l’interleukine 2 et la voie <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">STAT5</a> sont décrites parmi ces signaux. La plupart des démonstrations mécanistiques ne sont pas des dosages diagnostiques humains de routine [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<p>La biochimie éclaire aussi l’imagerie : eau et graisse ont des comportements de résonance différents. Une baisse en opposition de phase témoigne d’un mélange microscopique dans des conditions techniques données ; ce n’est ni une enzyme tumorale ni une preuve de sélection T normale. L’âge, les séquences, les zones de mesure et les comparaisons conditionnent l’indice [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/17463136/" target="_blank" rel="noopener">S10</a>].</p>
<figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Signal cellulaire ou physique</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Mesure dans une méthode donnée</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Interprétation avec le contexte</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Les deux types de signaux n’ont pas le même objet ; aucune correspondance directe volume-immunité n’est inventée [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</figcaption></figure>
<p>Dans Basedow, des mécanismes hormonaux et immunitaires sont proposés pour l’augmentation thymique. La régression peut accompagner l’euthyroïdie même si des anticorps persistent ; le titre d’anticorps ne devient pas une règle de volume thymique. Les observations expérimentales et les cas ne prouvent pas une voie unique chez tous les patients [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25149085/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>].</p>
<p>Le carbimazole est transformé en thiamazole, qui inhibe la thyroperoxydase et la synthèse hormonale thyroïdienne. Sa pharmacologie concerne la cause endocrine : elle ne démontre pas une action sélective sur une hyperplasie thymique. La surveillance thyroïdienne guide la titration ; diamètre et captation de la masse ne fixent pas la dose [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<p>Enfin, un marqueur sanguin doit répondre à une hypothèse. L’élévation du marqueur <button class="w" data-k="e32-ca125">CA-125</button> dans un cas d’abcès illustre le manque de spécificité possible et non l’existence d’un nouveau test E32. Le résultat biologique conserve méthode, population et limite, comme tout indice d’imagerie [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/18480581/" target="_blank" rel="noopener">S15</a>].</p>
<div class="key"><b>À retenir.</b> Nommer ce qu’une mesure observe évite de lui attribuer une fonction qu’elle ne mesure pas [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/18480581/" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-s-bioch-cours">Essentiel de cette partie</button></section>
</div><div class="sci" id="e32-s-gene" role="tabpanel" aria-labelledby="e32-tab-gene" hidden><div class="key"><p><b>Science → clinique.</b> Auto-immunité, répertoire et clonalité sont des dimensions différentes. [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>]</p>
<p><b>Science → examen.</b> La question clinique guide les analyses ; pas de panel universel E32. [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>]</p>
<p><b>Science → traitement.</b> Le traitement d’une association suit son diagnostic propre. [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>]</p>
<p><b>À retenir.</b> Le volume, la fonction et le mécanisme se confrontent sans se remplacer.</p>
</div><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Diversité du récepteur</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Sélection et régulation</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Contrôles périphériques</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Enchaînement fonctionnel sans anatomie ; les contrôles ne suppriment pas absolument toute autoréactivité [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</figcaption></figure>
<section class="ilot" id="e32-s-gene-cours"><h2><span class="n">s-gene-cours</span>Génétique et immunologie : tolérance et associations</h2><p>Le récepteur des lymphocytes T est construit par réarrangement somatique de segments génétiques. Cette diversité permet de reconnaître de nombreux peptides, mais crée aussi des récepteurs non fonctionnels ou autoréactifs. La sélection thymique et les contrôles périphériques limitent ce risque ; aucun examen du simple volume thymique ne décrit la diversité de ce répertoire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<p>Les cellules épithéliales médullaires peuvent exprimer un large ensemble d’antigènes normalement restreints à d’autres tissus. Le régulateur <button class="w" data-k="e32-aire">AIRE</button> participe à ce programme et à la présentation du soi ; les cellules dendritiques peuvent aussi recevoir et présenter des antigènes. Une anomalie de ces circuits peut altérer la tolérance, mais toutes les maladies auto-immunes ne sont pas une mutation de ce gène [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<p>Les lymphocytes T régulateurs constituent une autre composante de la tolérance. Leur développement dépend de reconnaissance antigénique, co-stimulation et cytokines ; la revue 2026 distingue des voies et des populations. Les résultats humains et murins ne sont pas identiques, ce qui interdit de transformer une observation chez la souris en seuil clinique ou en thérapie humaine acquise [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<p>Dans l’hyperplasie folliculaire associée à certaines myasthénies, les interactions T/B et les centres germinatifs peuvent soutenir la production d’anticorps du récepteur de l’acétylcholine. Ce lien concerne un phénotype et une sérologie ; il n’implique pas que toute hyperplasie folliculaire cause une myasthénie ni que toute myasthénie ait un gros thymus. Le diagnostic neurologique garde ses critères [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/lab-analyses_voor_vaststellen_paraneoplastische_syndromen.html" target="_blank" rel="noopener">S6</a>].</p>
<p>La forme lymphoépithéliale peut être associée à des maladies auto-immunes non myasthéniques et à une lymphoprolifération. Une morphologie folliculaire atypique appelle une analyse spécialisée, éventuellement de clonalité selon le cas. Une association dans une série n’est pas un mécanisme héréditaire ni une probabilité de transformation future pour un patient donné [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>].</p>
<p>Les aplasies ou hypoplasies avec déficit immunitaire, dont certaines anomalies du développement, suivent leur classification distincte. Elles ne se confondent pas avec les hyperplasies réactives E32. Le conseil ou l’analyse génétique est orienté par le tableau, sans panel universel ni mutation unique inventés pour toutes les maladies du thymus [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<div class="key"><b>À retenir.</b> Tolérance, auto-anticorps, clonalité et volume sont des dimensions différentes ; la cohérence clinique et tissulaire les relie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/lab-analyses_voor_vaststellen_paraneoplastische_syndromen.html" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-s-gene-cours">Essentiel de cette partie</button></section>
</div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="e32-p-1"><h2><span class="n">p-1</span>Ce que traite le médicament</h2><p>Une hyperplasie réactive ou un kyste certain n’a pas une ordonnance commune. Les médicaments répondent à la maladie causale ou associée ; la décision de surveiller ou d’opérer n’est pas remplacée par une réduction empirique de taille sous corticoïdes. Les circuits de régénération thymique restent surtout expérimentaux et ne justifient pas une prescription de routine [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
<p>Avec Basedow, l’antithyroïdien traite une hyperthyroïdie prouvée et peut s’accompagner de régression thymique. Les cas espagnols utilisaient du méthimazole ; ils ne fournissent pas une posologie suisse de carbimazole. Le produit retenu ci-dessous est <button class="w" data-k="e32-carbimazole">Néo-Mercazole</button>, comprimés 5 mg, avec information professionnelle révisée août 2020 [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<div class="key"><b>À retenir.</b> Le médicament traite la cause définie. La réponse de l’image ne prouve pas à elle seule le diagnostic [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10580497/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-p-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-p-2"><h2><span class="n">p-2</span>Carbimazole : formulation et populations</h2><p><button class="w" data-k="e32-carbimazole">Néo-Mercazole</button> contient 5 mg de carbimazole par comprimé. Administration orale après confirmation biologique de l’hyperthyroïdie ; la FI mentionne Basedow notamment lorsque radio-iode et thyroïdectomie sont contre-indiqués, ainsi que des contextes de préparation/association. L’élargissement thymique n’est pas une indication propre [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<table class="t" data-e32-table="1"><thead><tr><th>Population / étape FI</th><th>Dose orale et rythme</th><th>Limite</th></tr></thead><tbody><tr><td>Adulte, initial 15–30 jours</td><td>20–60 mg/j en 2–3 prises, selon hyperthyroïdie.</td><td>Borne de plage initiale, pas dose universelle ni dose thymique.</td></tr><tr><td>Adulte, entretien</td><td>Réduction progressive, paliers 5–15 mg/j tous les 10 jours jusqu’à 5–20 mg/j.</td><td>Titration clinique et biologique ; durée générale 6–18 mois dans FI, pas durée du suivi thymique.</td></tr><tr><td>Dès 12 ans</td><td>Initial 0,7–0,8 mg/kg/j en 2–3 prises.</td><td>Maximum 60 mg/j ; entretien adapté à réponse.</td></tr><tr><td>Moins 12 ans</td><td>Initial 0,7–0,8 mg/kg/j, si possible 2–3 prises.</td><td>Maximum 30 mg/j ; données extrêmement limitées, spécialiste particulièrement avant 3 ans.</td></tr><tr><td>Atteinte hépatique/rénale</td><td>Prudence et surveillance, sans dose spécifique chiffrée dans la FI.</td><td>Hépatique sévère contre-indiquée ; données limitées.</td></tr></tbody></table>
<p>Le carbimazole est converti en thiamazole ; sa masse n’est pas une substitution milligramme pour milligramme du méthimazole d’un article. La dose est titrée sur la maladie thyroïdienne et ses mesures, pas sur les centimètres du thymus. Les adolescents et jeunes enfants gardent leurs maxima distincts [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<div class="key"><b>À retenir.</b> Formulation, voie, âge et objectif accompagnent la dose. Les 20–60 mg/j adultes ne s’appliquent pas automatiquement à un enfant [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-p-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-p-3"><h2><span class="n">p-3</span>Sécurité : signes d’alarme et interactions</h2><p>La FI contre-indique notamment hypersensibilité, cancer thyroïdien dépendant de la thyréostimuline, signes de compression trachéale, goitre simple, affection hématologique sévère, insuffisance hépatique sévère et antécédent de pancréatite sous carbimazole/thiamazole. Un symptôme compressif n’est donc pas un prétexte à prescrire ce médicament pour faire diminuer une masse [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<p>Fièvre, malaise, hématomes, saignements, aphtes ou angine : arrêter et consulter immédiatement, avec contrôle sanguin. La FI mentionne un hémogramme initial et, chez les patients de plus de 40 ans, hebdomadaire pendant six premières semaines, particulièrement au début et à doses supérieures à 40 mg/j. Ce calendrier ne remplace pas l’évaluation immédiate des symptômes à tout âge [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<p>Arrêter et évaluer les signes hépatiques ; une pancréatite aiguë impose arrêt et pas réexposition si antécédent lié au produit. Des vascularites avec anticorps anticytoplasme des neutrophiles sont rapportées. Coagulation/anticoagulants, médicaments pouvant entraîner agranulocytose, théophylline, bêtabloquants, digitaliques et état iodé nécessitent vérification ; la normalisation thyroïdienne modifie aussi certains besoins [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<div class="key"><b>À retenir.</b> Un contrôle prévu ne neutralise pas une alerte clinique. Fièvre/angine/aphtes sous traitement demandent action immédiate [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-p-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e32-p-4"><h2><span class="n">p-4</span>Grossesse, allaitement et traitement de l’infection</h2><p>La FI demande contraception fiable et évaluation stricte du bénéfice/risque en grossesse. Si utilisé, choisir la plus faible dose efficace, sans association de blocage-substitution par hormones thyroïdiennes, avec surveillance maternelle et fœtale ; le premier trimestre et l’alternative propylthiouracile relèvent d’une décision spécialisée. Une masse thymique ne justifie pas de copier une dose adulte dans cette situation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<p>La FI recommande de renoncer à l’allaitement, surtout à doses élevées. Si l’allaitement est poursuivi après information, elle limite la dose quotidienne à 20 mg, fractionnée immédiatement après les tétées, et demande surveillance étroite de la fonction thyroïdienne du nourrisson. Cette position datée du produit est conservée, sans la remplacer par une règle étrangère générale [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<p>Pour un abcès thymique, les cas lus ne fournissent pas un schéma anti-infectieux universel. Prélèvements, antibiotique et dose dépendent de l’âge, du terrain, de la gravité et des germes ; drainage ou résection sont discutés pour contrôler la source. Aucun choix de molécule ou maximum non vérifié dans une FI suisse n’est inventé [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/18480581/" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8449107/" target="_blank" rel="noopener">S16</a>].</p>
<div class="key"><b>À retenir.</b> La population change le risque et la dose. Une observation d’abcès ne devient pas un protocole pour tous [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/18480581/" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8449107/" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</div><button class="pareto-btn ui" data-k="pareto-e32-p-4">Essentiel de cette partie</button></section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="e32-semio" data-title="Sémiologie : relier signe et décision"><p>Le thymus profond se juge surtout par conséquences et contexte. Respiration, déglutition, circulation veineuse et fatigabilité orientent la gravité ; un examen normal ne classe pas la lésion. Les neuf volets du premier sous-onglet scientifique développent mécanismes, examens, différentiels, urgence et limites [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/lab-analyses_voor_vaststellen_paraneoplastische_syndromen.html" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
</template>
<template data-pop="e32-carbimazole" data-title="Produit suisse : indication et doses"><table class="t" data-e32-table="1"><thead><tr><th>Population / étape FI</th><th>Dose orale et rythme</th><th>Limite</th></tr></thead><tbody><tr><td>Adulte, initial 15–30 jours</td><td>20–60 mg/j en 2–3 prises, selon hyperthyroïdie.</td><td>Borne de plage initiale, pas dose universelle ni dose thymique.</td></tr><tr><td>Adulte, entretien</td><td>Réduction progressive, paliers 5–15 mg/j tous les 10 jours jusqu’à 5–20 mg/j.</td><td>Titration clinique et biologique ; durée générale 6–18 mois dans FI, pas durée du suivi thymique.</td></tr><tr><td>Dès 12 ans</td><td>Initial 0,7–0,8 mg/kg/j en 2–3 prises.</td><td>Maximum 60 mg/j ; entretien adapté à réponse.</td></tr><tr><td>Moins 12 ans</td><td>Initial 0,7–0,8 mg/kg/j, si possible 2–3 prises.</td><td>Maximum 30 mg/j ; données extrêmement limitées, spécialiste particulièrement avant 3 ans.</td></tr><tr><td>Atteinte hépatique/rénale</td><td>Prudence et surveillance, sans dose spécifique chiffrée dans la FI.</td><td>Hépatique sévère contre-indiquée ; données limitées.</td></tr></tbody></table>
<p>Comprimés 5 mg de carbimazole, voie orale. FI révisée août 2020, consultée en 2026 ; pas indication thymique propre. Ne pas convertir milligramme pour milligramme le méthimazole d’une publication [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
</template>
<template data-pop="e32-chimique" data-title="Déplacement chimique : population et technique"><p>La baisse de signal entre phase et opposition de phase traduit la graisse microscopique dans un tissu. Le thymus jeune peut être trop pauvre en graisse ; une absence de baisse ne prouve pas une tumeur. Seuil 8,92%d’indice de signal dans 92 adultes, optimisé sur cette série, pas seuil pédiatrique universel. Les autres séquences, le contexte et les contours restent nécessaires [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25105246/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/17463136/" target="_blank" rel="noopener">S10</a>].</p>
</template>














<template data-pop="e32-aire" data-title="Régulateur de présentation du soi"><p><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">AIRE</a> participe à l’expression de nombreux antigènes tissulaires dans les cellules épithéliales médullaires. Ce mécanisme ne signifie pas que toutes hyperplasies ou maladies auto-immunes ont une mutation de ce gène [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
</template>




<template data-pop="e32-profiles" data-title="Objectifs suisses de formation"><p><a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">PROFILES</a> est le cadre suisse des objectifs de formation. Douleur thoracique, dyspnée, fièvre et autres situations motivent le raisonnement ici, sans correspondance officielle avec E32 ni question d’examen garantie [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
</template>
<template data-pop="e32-nvalt" data-title="Recommandation européenne datée"><p>Modules néerlandais de la Fédération des spécialistes et <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">NVALT</a> publiés 8 novembre 2024. Diagnostic différentiel des tumeurs épithéliales et découvertes fortuites ; pas protocole pédiatrique universel [<a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/biopt_bij_epitheliale_thymustumoren.html" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/lab-analyses_voor_vaststellen_paraneoplastische_syndromen.html" target="_blank" rel="noopener">S6</a>].</p>
</template>


<template data-pop="e32-markers" data-title="Marqueurs tissulaires"><p><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">CD20</a> et <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">CD23</a> aident à visualiser compartiments B/réseaux folliculaires ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">TdT</a> et <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">CD5</a> participent au profil des thymocytes ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">CK19</a> souligne le réseau épithélial. Leur distribution et l’architecture comptent, pas un marqueur seul [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>].</p>
</template>
<template data-pop="e32-cytokines" data-title="Signaux de migration et régulation"><p><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">CCR7</a>/<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">CCL21</a> participent à migration, interleukine 2 et <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">STAT5</a> à certains parcours régulateurs ; nombreux résultats murins. Pas tests E32 ni traitements de routine déduits de ces modèles [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13062478/" target="_blank" rel="noopener">S19</a>].</p>
</template>
<template data-pop="e32-ca125" data-title="Marqueur biologique non spécifique"><p><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/18480581/" target="_blank" rel="noopener">CA-125</a> est un antigène utilisé dans certains contextes oncologiques. Son élévation dans un cas d’abcès thymique rompu illustre qu’il ne prouve pas un cancer ; ce cas ne justifie pas son dosage de routine pour E32 [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/18480581/" target="_blank" rel="noopener">S15</a>].</p>
</template>

<template data-pop="pareto-e32-1" data-title="Essentiel — Une découverte médiastinale : nommer la question"><p>La question est d’abord la nature de la lésion et sa conséquence clinique. L’élargissement seul ne prescrit pas un geste [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>].</p>
<p class="ratio" data-cover="e32-1"></p>
</template>
<template data-pop="pareto-e32-2" data-title="Essentiel — Définitions, périmètre et sous-codes"><p>E32 documente une maladie non tumorale ; la topographie médiastinale ne suffit pas à attribuer ce code [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>].</p>
<p class="ratio" data-cover="e32-2"></p>
</template>
<template data-pop="pareto-e32-3" data-title="Essentiel — Épidémiologie : garder le bon dénominateur"><p>Avant un pourcentage, préciser sélection, diagnostic, période et dénominateur. Une série chirurgicale ne donne pas une incidence suisse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12774464/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>].</p>
<p class="ratio" data-cover="e32-3"></p>
</template>
<template data-pop="pareto-e32-4" data-title="Essentiel — Du thymus normal au tissu réactif"><p>Une repousse thymique est plausible après un stress ; elle doit rester cohérente avec l’histoire et l’ensemble des examens [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>].</p>
<p class="ratio" data-cover="e32-4"></p>
</template>
<template data-pop="pareto-e32-5" data-title="Essentiel — Classer les mécanismes et rechercher les causes"><p>Le contexte suggère un mécanisme ; l’architecture et l’imagerie doivent rester compatibles [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
<p class="ratio" data-cover="e32-5"></p>
</template>
<template data-pop="pareto-e32-6" data-title="Essentiel — Anamnèse : relier le calendrier et les symptômes"><p>La chronologie de la maladie et des traitements donne son sens à l’image. Les symptômes nouveaux ne sont pas tous expliqués par le thymus [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/37243889/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>].</p>
<p class="ratio" data-cover="e32-6"></p>
</template>
<template data-pop="pareto-e32-7" data-title="Essentiel — Examen clinique et sémiologie"><p>L’examen cherche gravité, compression et association ; il ne suffit pas à nommer la lésion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>].</p>
<p class="ratio" data-cover="e32-7"></p>
</template>
<template data-pop="pareto-e32-8" data-title="Essentiel — Urgences et complications : changer le niveau de soins"><p>La gravité clinique décide de l’urgence ; la preuve étiologique peut venir après les premières mesures de soins [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
<p class="ratio" data-cover="e32-8"></p>
</template>
<template data-pop="pareto-e32-9" data-title="Essentiel — Démarche diagnostique et différentiels"><p>Question, comparaison et composition précèdent le prélèvement. Une biopsie négative non représentative n’est pas une garantie de bénignité [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/biopt_bij_epitheliale_thymustumoren.html" target="_blank" rel="noopener">S5</a>].</p>
<p class="ratio" data-cover="e32-9"></p>
</template>
