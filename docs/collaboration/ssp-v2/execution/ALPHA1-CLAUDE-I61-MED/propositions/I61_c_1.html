<!-- Sources : [S1] Bern Stroke Guidelines 08/2026, doc. p. 44–45 ; [S2] ESO–EANS 2025, PICO 3.3.2.1 -->
Si un critère manque, le protocole bernois n’administre ni andexanet ni concentré de complexe prothrombinique [S1]. La recommandation européenne admet toutefois le concentré après pesée du risque thromboembolique (consensus d’experts) [S2] : la décision se prend alors avec l’hématologie.
