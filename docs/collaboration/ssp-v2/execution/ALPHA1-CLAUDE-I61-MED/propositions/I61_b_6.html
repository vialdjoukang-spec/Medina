<!-- Sources : [S1] Bern 08/2026, doc. p. 44 ; [S2] ESO–EANS 2025, PICO 3.2.1 -->
La transfusion de plaquettes est potentiellement nuisible : elle augmente la probabilité de décès ou de dépendance à 90 jours (rapport de cotes 2,04 ; 1,12 à 3,74) et n’est pas suggérée en Europe [S1, S2]
