<template id="d69-vitropression" data-pop="d69-vitropression" data-title="Vitropression : tester si une tache est un purpura"><p>La vitropression consiste à appuyer une lame de verre sur une lésion rouge de la peau. Si la tache disparaît sous la pression, le sang se trouve dans les vaisseaux et la lésion n’est pas un purpura. Si la tache persiste, le sang a quitté les vaisseaux : c’est un purpura, pétéchial (punctiforme) ou ecchymotique (plus large).</p><p>La conséquence pratique est immédiate : un purpura impose de chercher la cause par l’hémogramme et, devant de la fièvre, d’éliminer un purpura fulminans. Le test n’indique pas l’étiologie : un purpura vasculaire, thrombopénique ou lié à la fragilité de la peau donne le même résultat.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.larevuedupraticien.fr/article/purpuras-chez-ladulte-et-lenfant" target="_blank" rel="noopener">Fain, Mekinian et Dubrel — Purpuras chez l’adulte et l’enfant (Revue du Praticien 2026 ; 76:97-104)</a>.</p></template>
<template id="d69-fulminans" data-pop="d69-fulminans" data-title="Purpura fulminans : urgence infectieuse"><p>Le purpura fulminans est dû à une infection à méningocoque ou à pneumocoque. Les critères cités par la Revue du Praticien sont une extension rapide, au moins un élément nécrotique ou ecchymotique de plus de 3 mm et un syndrome infectieux sévère. Tout purpura fébrile y fait penser.</p><p>La ceftriaxone, citée à 100 mg/kg/j, est administrée sans délai. Le diagnostic différentiel immédiat comprend la thrombopénie profonde, la microangiopathie et la CIVD. Le purpura fulminans est exclu de D69 (codé D65.-) : son traitement relève du cours A39.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.larevuedupraticien.fr/article/purpuras-chez-ladulte-et-lenfant" target="_blank" rel="noopener">Fain, Mekinian et Dubrel — Purpuras chez l’adulte et l’enfant (Revue du Praticien 2026 ; 76:97-104)</a> ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d65-d69.htm" target="_blank" rel="noopener">BfArM — CIM-10-GM 2024, bloc D65–D69 (Stand 15.09.2023)</a>.</p></template>
<template id="d69-mat" data-pop="d69-mat" data-title="Microangiopathie thrombotique : PTT et SHU"><p>La microangiopathie thrombotique réunit le purpura thrombotique thrombocytopénique et le syndrome hémolytique et urémique. Elle associe fièvre, hémolyse, insuffisance rénale et signes neurologiques. Le frottis montre des schizocytes ; leur recherche est à répéter, car ils peuvent manquer au début ; le dosage d’ADAMTS13 est demandé.</p><p>Le purpura thrombotique thrombocytopénique est exclu de D69 (M31.1). Une hémolyse avec test direct à l’antiglobuline négatif impose de chercher des schizocytes. La microangiopathie est une urgence : elle se distingue du PTI par l’hémolyse et les atteintes d’organe.</p><p class="src">Sources : <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d65-d69.htm" target="_blank" rel="noopener">BfArM — CIM-10-GM 2024, bloc D65–D69 (Stand 15.09.2023)</a>.</p></template>
<template id="d69-pti-def" data-pop="d69-pti-def" data-title="PTI : définition et seuil de 100 G/L"><p>Le PTI (thrombopénie immunologique) est une thrombopénie auto-immune. Il ne se diagnostique que si les plaquettes sont inférieures à 100 G/L à plusieurs reprises. Onkopedia a remplacé l’expression « purpura thrombopénique idiopathique » par ce terme.</p><p>Environ 80 % des PTI sont primaires et 20 % secondaires. Le seuil de 100 G/L sert à définir la maladie, pas à décider du traitement : l’indication dépend du saignement et du contexte. Le PTI reste un diagnostic d’exclusion.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a>.</p></template>
<template id="d69-willebrand" data-pop="d69-willebrand" data-title="Maladie de Willebrand de type 2B : le piège"><p>Un saignement disproportionné pour une thrombopénie modérée fait doser le facteur Willebrand, car le type 2B appartient aux diagnostics à écarter avant de conclure à un PTI. Il relève de D68.0 et non de D69. Le bilan complémentaire du PTI persistant inclut sa recherche.</p><p>La conséquence pratique est thérapeutique : la desmopressine est contre-indiquée dans le Willebrand 2B (information professionnelle d’Octostim). Le cours ne détaille pas ses critères diagnostiques, qui relèvent du cours D68.</p><p class="src">Sources : <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527110296" target="_blank" rel="noopener">Swissmedic — Octostim® 15 µg (autorisation 52711 ; novembre 2025), information professionnelle</a>.</p></template>
<template id="d69-auto-anticorps" data-pop="d69-auto-anticorps" data-title="Auto-anticorps du PTI : cibles et conséquences"><p>Les auto-anticorps du PTI se fixent sur des glycoprotéines de la membrane plaquettaire, notamment GPIIb/IIIa et GPIb/IX. La plaquette recouverte d’anticorps est reconnue par les récepteurs Fc des macrophages et détruite dans la rate et le foie.</p><p>Onkopedia cite d’autres mécanismes : désialylation des glycoprotéines, lyse par le complément, inhibition fonctionnelle des récepteurs et anomalies des lymphocytes T. Les anticorps anti-HLA ne sont pas associés au PTI. Le test MAIPA peut détecter les anticorps glycoprotéine-spécifiques, mais sa sensibilité n’est que de 63 %.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a>.</p></template>
<template id="d69-tpo-relatif" data-pop="d69-tpo-relatif" data-title="Déficit relatif en thrombopoïétine"><p>La thrombopoïétine (TPO) stimule la production des plaquettes. Dans une thrombopénie d’une autre cause, son taux monte davantage. Dans le PTI, il est augmenté, mais moins qu’attendu pour un même chiffre plaquettaire : c’est un déficit relatif.</p><p>Ce déficit est la base du développement des agonistes du récepteur de la TPO (romiplostim, eltrombopag, avatrombopag). Il s’associe à la destruction périphérique : la production est donc à la fois insuffisante et inadaptée. Le PNDS décrit ce double mécanisme comme la justification des TRA.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-grades-oms" data-pop="d69-grades-oms" data-title="Grades hémorragiques OMS"><p>Onkopedia mesure le saignement par une échelle de l’OMS reprise de la classification CTCAE v5.0. Le grade 0 correspond à l’absence de saignement. Le grade I regroupe pétéchies, ecchymoses de moins de 10 cm et épistaxis de moins d’une heure sans intervention. Le grade II comprend ecchymoses de plus de 10 cm, épistaxis de plus d’une heure ou avec tamponnement, méléna, hématémèse ou hématurie sans transfusion.</p><p>Le grade III suppose une transfusion. Le grade IV réunit hémorragie rétinienne avec baisse visuelle, hémorragie du système nerveux central et hémorragie menaçant un organe. Les grades III et IV conduisent à ajouter les IgIV aux corticoïdes.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a>.</p></template>
<template id="d69-isth" data-pop="d69-isth" data-title="Saignement critique selon l’ISTH 2021"><p>L’International Society on Thrombosis and Haemostasis qualifie de critiques les saignements intracrâniens, intrarachidiens, intraoculaires, rétropéritonéaux, péricardiques et intramusculaires avec syndrome des loges menaçant, ainsi que toute hémorragie qui entraîne une instabilité hémodynamique ou respiratoire.</p><p>La notion détermine l’escalade : un saignement critique conduit à ajouter les IgIV aux corticoïdes (Onkopedia). Elle s’applique aux adultes et aux enfants.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a>.</p></template>
<template id="d69-khellaf" data-pop="d69-khellaf" data-title="Score hémorragique de Khellaf modifié"><p>Ce score du PNDS pondère l’âge, l’anticoagulation et le siège des saignements. Pour chaque rubrique, seul le score le plus élevé compte ; le total décide entre corticoïdes seuls (8 ou moins) et IgIV avec corticoïdes (plus de 8). Il n’a pas été validé de façon prospective.</p><table class="t"><thead><tr><th scope="col">Rubrique</th><th scope="col">Éléments et points</th></tr></thead><tbody><tr><th scope="row">Âge</th><td>Plus de 75 ans : 2.</td></tr><tr><th scope="row">Anticoagulation</th><td>AVK ou anticoagulant direct efficace : 3.</td></tr><tr><th scope="row">Cutané</th><td>Pétéchial localisé 1 ; ecchymotique 2 ; pétéchial multiple ou généralisé 3 ; ecchymotique généralisé 4.</td></tr><tr><th scope="row">Muqueux</th><td>Épistaxis unilatérale 2 ; bilatérale 3 ; bulles hémorragiques ou gingivorragies spontanées 5.</td></tr><tr><th scope="row">Digestif</th><td>Sans anémie 4 ; avec anémie (plus de 2 g/dL) ou choc 15.</td></tr><tr><th scope="row">Hématurie macroscopique</th><td>Sans anémie 4 ; avec anémie aiguë 10.</td></tr><tr><th scope="row">Métrorragie importante</th><td>Sans anémie 4 ; avec anémie ou choc 10.</td></tr><tr><th scope="row">Système nerveux central ou menace vitale</th><td>15.</td></tr></tbody></table><p>Exemple : un patient de 78 ans (2) sous apixaban (3) avec purpura pétéchial généralisé (3) et épistaxis bilatérale (3) totalise 11, donc plus de 8 : IgIV et corticoïdes. Une femme de 34 ans avec pétéchies multiples (3) et épistaxis bilatérale (3) totalise 6.</p><p class="src">Sources : <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-buchanan" data-pop="d69-buchanan" data-title="Score de Buchanan modifié (enfant)"><p>Le score de Buchanan modifié classe le saignement de l’enfant en grades. Il guide la décision de traiter ; le PNDS note qu’il n’a pas été validé de façon prospective en France.</p><table class="t"><thead><tr><th scope="col">Grade</th><th scope="col">Définition</th></tr></thead><tbody><tr><th scope="row">0</th><td>Aucun saignement.</td></tr><tr><th scope="row">1</th><td>Moins de 100 pétéchies et au plus 5 petites ecchymoses (3 cm ou moins).</td></tr><tr><th scope="row">2</th><td>Plus de 100 pétéchies ou plus de 5 ecchymoses de plus de 3 cm.</td></tr><tr><th scope="row">3a</th><td>Croûtes nasales, pétéchies buccales, épistaxis de 5 minutes au plus.</td></tr><tr><th scope="row">3b</th><td>Épistaxis de plus de 5 minutes, purpura buccal gênant, bulles hémorragiques, hématurie même microscopique, rectorragie, ménorragies.</td></tr><tr><th scope="row">4</th><td>Saignement muqueux ou profond nécessitant un geste.</td></tr><tr><th scope="row">5</th><td>Hémorragie intracrânienne ou menaçant la vie.</td></tr></tbody></table><p>Un enfant de 4 ans avec 40 pétéchies et sans saignement muqueux est de grade 1 : le traitement n’est en général pas nécessaire s’il a plus de 10 G/L.</p><p class="src">Sources : <a data-reference-source="1" href="https://afpa.org/content/uploads/2025/04/HAS-synthese_mg_pti__de_l_enfant_et_de_l_adolescent.pdf" target="_blank" rel="noopener">HAS/CEREVANCE — PNDS PTI de l’enfant et de l’adolescent, synthèse pour le pédiatre de ville et le médecin généraliste (janvier 2025)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a>.</p></template>
<template id="d69-evans" data-pop="d69-evans" data-title="Syndrome d’Evans"><p>Le syndrome d’Evans associe une thrombopénie immunologique et une anémie hémolytique auto-immune. La CIM-10-GM l’inclut dans D69.3. Il se suspecte devant une anémie associée à la thrombopénie ; le bilan comprend les réticulocytes, l’haptoglobine, les LDH, la bilirubine libre et le test direct à l’antiglobuline.</p><p>Le groupe sanguin et la recherche d’anticorps sont demandés si une anémie est présente. Une hémolyse avec test négatif oriente plutôt vers une microangiopathie thrombotique.</p><p class="src">Sources : <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d65-d69.htm" target="_blank" rel="noopener">BfArM — CIM-10-GM 2024, bloc D65–D69 (Stand 15.09.2023)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-pseudothrombopenie" data-pop="d69-pseudothrombopenie" data-title="Pseudothrombopénie à l’EDTA"><p>La pseudothrombopénie est une fausse thrombopénie : le chiffre mesuré est bas, mais le patient n’a pas de déficit réel de plaquettes. Elle concerne 1 à 5 prélèvements sur 1 000. Elle est suspectée devant une thrombopénie sans aucun saignement.</p><p>Le diagnostic repose sur le frottis, qui montre des agrégats, puis sur un contrôle sans EDTA : tube citraté, tube spécial (ThromboExact) ou prélèvement capillaire. Le tube citraté sous-estime la valeur d’environ 10 % : valeur réelle ≈ valeur sur citrate / 0,9. Exemple : 135 / 0,9 = 150 G/L.</p><p class="src">Sources : <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a>.</p></template>
<template id="d69-citrate" data-pop="d69-citrate" data-title="Corriger une numération sur citrate"><p>Grandeur : le nombre de plaquettes par litre de sang, en G/L. Pourquoi corriger : le tube citraté sous-estime la valeur réelle d’environ 10 % (PNDS). Formule : valeur réelle ≈ valeur sur citrate / 0,9.</p><p>Étapes : on prend le chiffre du tube citraté, ici 135 G/L, puis on le divise par 0,9, soit 150 G/L. Interprétation : le patient n’est pas thrombopénique ; la valeur de 22 G/L sur EDTA était une pseudothrombopénie. Limites : approximation, certains laboratoires corrigent déjà le résultat ; vérifier avant d’appliquer.</p><p class="src">Sources : <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-maipa" data-pop="d69-maipa" data-title="MAIPA : sensibilité, spécificité et lecture"><p>Le MAIPA (Monoclonal Antibody Immobilisation of Platelet Antigens) détecte des anticorps dirigés contre des glycoprotéines plaquettaires. Sa spécificité est d’environ 98 % et sa sensibilité d’environ 63 %. Il est réservé aux formes persistantes, chroniques ou atypiques.</p><p>Lecture sur 100 patients atteints de PTI : 63 ont un test positif et 37 un test négatif. Un résultat négatif n’exclut donc pas un PTI. Un résultat positif est rarement un faux positif, puisque la spécificité est de 98 %. Les anticorps anti-HLA ne sont pas associés au PTI.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a>.</p></template>
<template id="d69-hpylori" data-pop="d69-hpylori" data-title="Helicobacter pylori : deux recommandations"><p>Onkopedia, coéditée par la Société suisse d’hématologie, recommande de tester tout adulte atteint de PTI pour Helicobacter pylori par antigène fécal ou test respiratoire au ¹³C, et de traiter si le test est positif. Le PNDS français ne le recommande pas de manière systématique : la prévalence est comparable à celle de la population générale et l’effet de l’éradication est exceptionnel.</p><p>Le PNDS le juge utile en présence d’un point d’appel digestif ou chez un patient originaire d’une zone d’endémie. Ce cours suit la source suisse, avec cette réserve.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-myelogramme-60" data-pop="d69-myelogramme-60" data-title="Myélogramme après 60 ans : divergence"><p>Onkopedia recommande largement le myélogramme à partir de 60 ans, car les myélodysplasies et les cytopénies idiopathiques de signification indéterminée y sont plus fréquentes. Le PNDS 2024 ne le juge plus systématique, y compris après 60 ans, si la thrombopénie est strictement isolée.</p><p>Le cours enseigne la position de la source suisse (Onkopedia) en signalant le désaccord. Dans tous les cas, le myélogramme est indiqué si d’autres lignées sont anormales, en présence d’un syndrome tumoral ou de signes généraux, avant une splénectomie et en l’absence de réponse.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-hemolyse" data-pop="d69-hemolyse" data-title="Hémolyse : réticulocytes, haptoglobine, LDH, bilirubine"><p>L’hémolyse est la destruction des hématies. Le bilan associe les réticulocytes, l’haptoglobine, les LDH et la bilirubine libre. Il cherche un syndrome d’Evans ou une microangiopathie thrombotique devant une thrombopénie.</p><p>Une hémolyse avec test direct à l’antiglobuline négatif impose de répéter la recherche de schizocytes, qui peuvent manquer au début. Les valeurs de référence dépendent du laboratoire et ne sont pas fournies par le dossier de sources.</p><p class="src">Sources : <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-pfa" data-pop="d69-pfa" data-title="PFA et temps de saignement"><p>Le PFA (Platelet Function Analyzer) est un test global de la fonction plaquettaire. Il est anormal dès que les plaquettes sont inférieures à 50 G/L : son résultat ne distingue pas un trouble du nombre d’un trouble de la fonction. Le PNDS le juge sans intérêt dans l’exploration d’une thrombopénie.</p><p>Le temps de saignement est jugé inutile. En revanche, TP, TCA et fibrinogène normaux sur un prélèvement ne suffisent pas à exclure une CIVD débutante, et un saignement disproportionné pour une thrombopénie modérée fait doser le facteur Willebrand.</p><p class="src">Sources : <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-agregometrie" data-pop="d69-agregometrie" data-title="Agrégométrie plaquettaire"><p>L’agrégométrie mesure la capacité des plaquettes à s’agréger après stimulation. Dans la thrombasthénie de Glanzmann, elle montre l’absence d’agrégation. Elle est complétée par la cytométrie en flux, qui quantifie l’intégrine αIIbβ3.</p><p>Dans le syndrome de Bernard-Soulier, la ristocétine n’induit pas d’agglutination plaquettaire. Ces examens répondent à la question de la fonction, alors que l’hémogramme répond à celle du nombre.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.orpha.net/pdfs/data/patho/Emg/Int/fr/ThrombasthenieGlanzmann_FR_fr_EMG_ORPHA849.pdf" target="_blank" rel="noopener">Orphanet Urgences — Thrombasthénie de Glanzmann : bonnes pratiques en cas d’urgence (2022)</a> ; <a data-reference-source="1" href="https://www.orpha.net/fr/disease/detail/274" target="_blank" rel="noopener">Orphanet — Syndrome de Bernard-Soulier (ORPHA:274)</a>.</p></template>
<template id="d69-glanzmann" data-pop="d69-glanzmann" data-title="Thrombasthénie de Glanzmann"><p>Maladie autosomique récessive, rarement acquise au cours de maladies auto-immunes. Elle tient à une anomalie quantitative (type I : moins de 5 % ; type II : 5 à 20 % de l’expression de l’intégrine) ou qualitative (variants à plus de 20 %) de l’intégrine αIIbβ3 (GPIIb-IIIa), récepteur indispensable à l’agrégation plaquettaire.</p><p>Il s’agit d’une thrombopathie isolée avec bilan de coagulation normal. Les saignements cutanéo-muqueux commencent dès la naissance. La fiche d’Orphanet évoque une « thrombocytopénie constitutionnelle » : cette formulation est imprécise, le cours n’affirme pas que la numération est abaissée. Le diagnostic repose sur l’agrégométrie et la cytométrie en flux.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.orpha.net/fr/disease/detail/849" target="_blank" rel="noopener">Orphanet — Thrombasthénie de Glanzmann (ORPHA:849)</a> ; <a data-reference-source="1" href="https://www.orpha.net/pdfs/data/patho/Emg/Int/fr/ThrombasthenieGlanzmann_FR_fr_EMG_ORPHA849.pdf" target="_blank" rel="noopener">Orphanet Urgences — Thrombasthénie de Glanzmann : bonnes pratiques en cas d’urgence (2022)</a>.</p></template>
<template id="d69-bernard-soulier" data-pop="d69-bernard-soulier" data-title="Syndrome de Bernard-Soulier et plaquettes grises"><p>Le syndrome de Bernard-Soulier est une maladie plaquettaire héréditaire rare (moins de 1 pour 1 000 000), avec des saignements légers à sévères, une macrothrombopénie et une absence d’agglutination plaquettaire induite par la ristocétine.</p><p>Le syndrome des plaquettes grises associe une macrothrombopénie, une myélofibrose, une splénomégalie et des plaquettes grises au frottis coloré (moins de 1 pour 1 000 000). Le mécanisme moléculaire n’a pas été lu dans une source datée et n’est pas affirmé.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.orpha.net/fr/disease/detail/274" target="_blank" rel="noopener">Orphanet — Syndrome de Bernard-Soulier (ORPHA:274)</a> ; <a data-reference-source="1" href="https://www.orpha.net/fr/disease/detail/721" target="_blank" rel="noopener">Orphanet — Syndrome des plaquettes grises (ORPHA:721)</a>.</p></template>
<template id="d69-gestationnelle" data-pop="d69-gestationnelle" data-title="Thrombopénie gestationnelle"><p>La thrombopénie gestationnelle représente 70 à 80 % des thrombopénies modérées de la grossesse. Elle apparaît au 3e trimestre, avec des plaquettes en général supérieures à 80 G/L, sans antécédent ni saignement.</p><p>Aucune exploration n’est nécessaire si le chiffre dépasse 100 G/L ; un contrôle est fait après l’accouchement. Au-dessous de 100 G/L, le bilan est celui d’une patiente non enceinte.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-hellp" data-pop="d69-hellp" data-title="HELLP et prééclampsie"><p>HELLP désigne Hemolysis, Elevated Liver enzymes, Low Platelets. Il survient en général au 3e trimestre avec hypertension, protéinurie, cytolyse et hémolyse. La prééclampsie et le HELLP expliquent 15 à 20 % des thrombopénies modérées de la grossesse.</p><p>Le diagnostic repose sur la pression artérielle, la protéinurie, les transaminases, les LDH et le frottis. Il se distingue du PTI (1 à 4 % des cas) par ce contexte et par l’hémolyse.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a>.</p></template>
<template id="d69-tnn" data-pop="d69-tnn" data-title="Thrombopénie néonatale : deux chiffres"><p>L’enfant d’une mère atteinte de PTI peut être thrombopénique. Onkopedia chiffre la thrombopénie néonatale à 5–10 %, avec une hémorragie intracérébrale inférieure à 1,5 %. Le PNDS la chiffre à environ 30 %, dont 10 % de forme sévère (moins de 30 G/L).</p><p>Les deux chiffres décrivent des définitions différentes : le second inclut toute thrombopénie, le premier une forme plus restreinte. La conduite est commune : numération au cordon, puis suivi jusqu’à J5–J7 (nadir jusqu’à une semaine), IgIV et corticoïdes si le nouveau-né a moins de 20 G/L ou saigne.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-iga" data-pop="d69-iga" data-title="Vascularite à IgA"><p>La vascularite à IgA (ancienne maladie de Schoenlein-Henoch, D69.0) est une vascularite des petits vaisseaux par dépôts d’IgA1. Elle associe douleurs abdominales, arthralgies des grosses articulations des membres inférieurs et purpura déclive, sans fièvre en général.</p><p>L’atteinte rénale est identique à la néphropathie à IgA. Le traitement est symptomatique et les corticoïdes sont réservés aux formes sévères. Les critères de classification EULAR, PRINTO et PRES n’ont pas été lus.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.larevuedupraticien.fr/article/purpuras-chez-ladulte-et-lenfant" target="_blank" rel="noopener">Fain, Mekinian et Dubrel — Purpuras chez l’adulte et l’enfant (Revue du Praticien 2026 ; 76:97-104)</a> ; <a data-reference-source="1" href="https://www.larevuedupraticien.fr/article/vascularite-iga-de-ladulte" target="_blank" rel="noopener">Hankard et Audemard-Verger — Vascularite à IgA de l’adulte (Revue du Praticien 2023 ; 73:1124-30)</a> ; <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/30879080/" target="_blank" rel="noopener">Ozen et collaborateurs, initiative SHARE — recommandations européennes sur la vascularite à IgA (Rheumatology 2019 ; 58:1607-16, résumé)</a>.</p></template>
<template id="d69-fragilite" data-pop="d69-fragilite" data-title="Purpura sénile de Bateman et fragilité vasculaire"><p>Le purpura sénile de Bateman survient sur la peau atrophique du sujet âgé. Son aspect est identique sous corticothérapie prolongée à fortes doses. Le scorbut donne un purpura périfolliculaire avec gingivopathie ; l’amylose un purpura périorbitaire ; le purpura mécanique de l’enfant suit un effort de toux ou des vomissements.</p><p>La numération plaquettaire est normale et le diagnostic repose sur le contexte. Le scorbut (E54) et l’amylose (E85) ont leur propre code.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.larevuedupraticien.fr/article/purpuras-chez-ladulte-et-lenfant" target="_blank" rel="noopener">Fain, Mekinian et Dubrel — Purpuras chez l’adulte et l’enfant (Revue du Praticien 2026 ; 76:97-104)</a>.</p></template>
<template id="d69-tih" data-pop="d69-tih" data-title="Thrombopénie induite par l’héparine (TIH)"><p>La TIH est un effet indésirable immunologique, présent chez 0,1 à 5 % des patients sous héparine. Elle est définie par une thrombopénie acquise (moins de 100 G/L ou chute relative d’au moins 30 %) et par des anticorps IgG anti-complexe PF4–héparine. La thrombopénie est de consommation et typiquement modérée (environ 60 G/L).</p><p>Les anticorps activent plaquettes, monocytes, neutrophiles et cellules endothéliales : le sang devient hypercoagulable, d’où des thromboses veineuses ou artérielles. Le traitement commence par l’arrêt de toute héparine et un anticoagulant non héparinique.</p><p class="src">Sources : <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2776/4481/13684" target="_blank" rel="noopener">Working Party Hemostasis de la SGH-SSH — Alberio et collaborateurs, anticoagulants dans la thrombopénie induite par l’héparine en Suisse (Swiss Med Wkly 2020 ; 150:w20210)</a>.</p></template>
<template id="d69-4t" data-pop="d69-4t" data-title="Score des 4T : grille complète"><p>Le score des 4T attribue 0, 1 ou 2 points à chaque critère. Il estime la probabilité de TIH avant les tests de laboratoire. Il provient d’un outil français d’enseignement (Lo et collaborateurs, 2006).</p><table class="t"><thead><tr><th scope="col">Critère</th><th scope="col">2 points</th><th scope="col">1 point</th><th scope="col">0 point</th></tr></thead><tbody><tr><th scope="row">Thrombopénie</th><td>Chute de plus de 50 % et nadir d’au moins 20 G/L.</td><td>Chute de 30 à 50 % ou nadir de 10 à 19 G/L. La chirurgie récente est analysée parmi les autres causes.</td><td>Chute de moins de 30 % ou nadir inférieur à 10 G/L.</td></tr><tr><th scope="row">Timing</th><td>Jours 5 à 10, ou moins de 24 h si héparine dans les 5 à 30 derniers jours.</td><td>Après le jour 10, ou moins de 24 h si héparine dans les 31 à 100 derniers jours.</td><td>Avant le jour 4 sans héparine dans les 100 derniers jours.</td></tr><tr><th scope="row">Thrombose</th><td>Nouvelle thrombose confirmée, nécrose cutanée, réaction systémique après HNF, hémorragie surrénale.</td><td>Extension ou récidive, suspicion, érythème au point d’injection.</td><td>Aucune.</td></tr><tr><th scope="row">Autres causes</th><td>Aucune.</td><td>Possible.</td><td>Probable.</td></tr></tbody></table><p>Interprétation : 0 à 3 correspond habituellement à une faible probabilité, sous réserve de données fiables et du contexte, notamment après circulation extracorporelle ou sous ECMO. Dès 4 points, arrêter toute héparine, demander les tests et organiser avec le spécialiste une anticoagulation alternative adaptée au risque. Calcul de la chute : (pic immédiatement avant la baisse − nadir) / pic immédiatement avant la baisse × 100. Exemple : 250 puis 100 G/L donnent (250 − 100) / 250 × 100 = 60 %. La page source se contredit à la valeur 6 (« entre 4 et 6 » puis « 6 ou plus »).</p><p class="src">Sources : <a data-reference-source="1" href="https://www.larevuedupraticien.fr/outil/evaluer-la-probabilite-pre-test-du-diagnostic-de-thrombopenies-induites-par-lheparine-score" target="_blank" rel="noopener">La Revue du Praticien — score clinicobiologique des 4T (tableau extrait d’une revue sur la thrombopénie induite par l’héparine)</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2776/4481/13684" target="_blank" rel="noopener">Working Party Hemostasis de la SGH-SSH — Alberio et collaborateurs, anticoagulants dans la thrombopénie induite par l’héparine en Suisse (Swiss Med Wkly 2020 ; 150:w20210)</a>.</p></template>
<template id="d69-antipf4" data-pop="d69-antipf4" data-title="Anticorps anti-PF4 et test fonctionnel"><p>Le facteur plaquettaire 4 (PF4) forme avec l’héparine un complexe contre lequel les anticorps IgG de la TIH sont dirigés. L’immunodosage quantitatif (ELISA) est très sensible mais peu spécifique. Un test fonctionnel le confirme : agrégation plaquettaire induite par l’héparine ou libération de sérotonine.</p><p>La combinaison du score des 4T et du titre des anticorps peut rendre le test fonctionnel inutile chez certains patients. Avec un score de 3 ou moins, aucun dosage n’est nécessaire.</p><p class="src">Sources : <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2776/4481/13684" target="_blank" rel="noopener">Working Party Hemostasis de la SGH-SSH — Alberio et collaborateurs, anticoagulants dans la thrombopénie induite par l’héparine en Suisse (Swiss Med Wkly 2020 ; 150:w20210)</a> ; <a data-reference-source="1" href="https://www.larevuedupraticien.fr/outil/evaluer-la-probabilite-pre-test-du-diagnostic-de-thrombopenies-induites-par-lheparine-score" target="_blank" rel="noopener">La Revue du Praticien — score clinicobiologique des 4T (tableau extrait d’une revue sur la thrombopénie induite par l’héparine)</a>.</p></template>
<template id="d69-argatroban-dose" data-pop="d69-argatroban-dose" data-title="Argatroban : deux doses suisses"><p>Deux sources suisses divergent. L’information professionnelle d’Argatra (2020) indique 2 µg/kg/min, ou 0,5 µg/kg/min en cas de Child-Pugh B, de chirurgie cardiaque ou d’état critique. Le Working Party Hemostasis de la Société suisse d’hématologie (2020) recommande 1 µg/kg/min, 2 µg/kg/min seulement si une thrombose menace la vie, 0,5 chez le patient critique et 0,25 en insuffisance hépatique modérée.</p><p>Le cours enseigne la recommandation la plus récente et spécialisée (WPH) comme conduite usuelle, et la dose de l’information professionnelle comme dose autorisée. Dans les deux cas, le TCA cible est de 1,5 à 3 fois la valeur de base, sans dépasser 100 secondes. L’argatroban n’a pas d’antidote ; sa demi-vie est de 40 à 50 minutes.</p><p class="src">Sources : <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2776/4481/13684" target="_blank" rel="noopener">Working Party Hemostasis de la SGH-SSH — Alberio et collaborateurs, anticoagulants dans la thrombopénie induite par l’héparine en Suisse (Swiss Med Wkly 2020 ; 150:w20210)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680628610015" target="_blank" rel="noopener">Swissmedic — Argatra® 100 mg/ml (autorisation 62861 ; juillet 2020), information professionnelle</a>.</p></template>
<template id="d69-argatroban-calcul" data-pop="d69-argatroban-calcul" data-title="Calcul du débit d’argatroban"><p>Grandeurs : la dose se mesure en µg par kg et par minute ; le poids est en kg ; la solution diluée contient 1 mg/mL (concentré à 250 mg/2,5 mL dilué au 1/100). Formule : débit (µg/min) = dose × poids ; débit en mL/h = µg/min × 60 / 1 000.</p><p>Exemple pour 80 kg à 2 µg/kg/min : 160 µg/min, soit 9,6 mg/h, soit 9,6 mL/h, valeur voisine des 10 mL/h du tableau de l’information professionnelle. À 1 µg/kg/min : 80 µg/min, soit 4,8 mL/h. Le résultat se vérifie sur la table de l’information professionnelle.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680628610015" target="_blank" rel="noopener">Swissmedic — Argatra® 100 mg/ml (autorisation 62861 ; juillet 2020), information professionnelle</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2776/4481/13684" target="_blank" rel="noopener">Working Party Hemostasis de la SGH-SSH — Alberio et collaborateurs, anticoagulants dans la thrombopénie induite par l’héparine en Suisse (Swiss Med Wkly 2020 ; 150:w20210)</a>.</p></template>
<template id="d69-danaparoide" data-pop="d69-danaparoide" data-title="Danaparoïde (Orgaran)"><p>Le danaparoïde est indiqué en prévention et en traitement des thromboembolies en cas de TIH ou d’antécédent de TIH. En TIH aiguë, pour prévenir les thromboembolies, la FI donne 750 U anti-Xa trois fois par jour par voie sous-cutanée pendant 7–10 jours si le poids est ≤90 kg, ou 1 250 U au-delà de 90 kg. Sans risque hémorragique élevé, elle conseille un bolus IV associé à la première injection : 750 U, ou 1 250 U si le poids dépasse 90 kg. Les limites anti-Xa sont de 0,8 U/mL, ou 0,4 U/mL en présence de risque hémorragique. Le traitement des thromboembolies établies utilise un schéma IV distinct : bolus de 2 250 U pour 55–90 kg, 1 500 U en dessous de 55 kg, 3 750 U au-dessus de 90 kg, puis perfusion de 400 U/h pendant 4 heures, 300 U/h pendant 4 heures, et entretien 150–200 U/h pendant 5–7 jours selon la FI. Les populations de dialyse et les adaptations rénales requièrent une surveillance spécialisée.</p><p>Dans sa recommandation suisse de 2020, le Working Party Hemostasis emploie des classes de poids différentes de la FI ci-dessus et propose un bolus intraveineux selon le poids (moins de 60 kg : 1 500 U ; 60 à 75 kg : 2 250 U ; 75 à 90 kg : 3 000 U ; plus de 90 kg : 3 750 U), puis 400 U/h pendant 4 h, 300 U/h pendant 4 h, puis 150 à 200 U/h selon la fonction rénale, avec un anti-Xa de 0,5 à 0,8 U/mL. Une réaction croisée avec les anticorps anti-héparine existe (environ 5 % avant, 3 % pendant le traitement) : les plaquettes sont surveillées.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680518090170" target="_blank" rel="noopener">Swissmedic — Orgaran® (autorisation 51809 ; janvier 2024), information professionnelle</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2776/4481/13684" target="_blank" rel="noopener">Working Party Hemostasis de la SGH-SSH — Alberio et collaborateurs, anticoagulants dans la thrombopénie induite par l’héparine en Suisse (Swiss Med Wkly 2020 ; 150:w20210)</a>.</p></template>
<template id="d69-lepirudine" data-pop="d69-lepirudine" data-title="Lépirudine : un passage obsolète"><p>L’information professionnelle de la Liquémine (2023) cite encore le danaparoïde et la lépirudine comme alternatives à l’héparine. Or la lépirudine a été retirée du marché mondial, comme le rappelle le Working Party Hemostasis.</p><p>Ce passage est donc obsolète. Les alternatives enseignées sont l’argatroban, le danaparoïde, le fondaparinux (hors indication en Suisse) et la bivalirudine selon le Working Party Hemostasis. Le fondaparinux est déconseillé dans la TIH par l’information professionnelle d’Arixtra, faute d’études.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680151590587" target="_blank" rel="noopener">Swissmedic — Liquémine® 25 000 UI/5 ml (autorisation 15159 ; avril 2023), information professionnelle</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2776/4481/13684" target="_blank" rel="noopener">Working Party Hemostasis de la SGH-SSH — Alberio et collaborateurs, anticoagulants dans la thrombopénie induite par l’héparine en Suisse (Swiss Med Wkly 2020 ; 150:w20210)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680559370026" target="_blank" rel="noopener">Swissmedic — Arixtra® (autorisation 55937 ; janvier 2026), information professionnelle</a>.</p></template>
<template id="d69-desmopressine" data-pop="d69-desmopressine" data-title="Desmopressine (Octostim) : une tension dans l’information professionnelle"><p>L’information professionnelle d’Octostim indique la desmopressine pour raccourcir le temps de saignement dans les thrombopathies urémiques, à 0,3 µg/kg par voie intraveineuse en 10 à 20 minutes, répétable une à deux fois à 12–24 heures. Elle signale une tachyphylaxie et impose une restriction hydrique.</p><p>Elle contre-indique aussi la desmopressine en cas de clairance de la créatinine inférieure à 50 mL/min, d’hyponatrémie, de SIADH, de Willebrand 2B et d’angor instable ou d’insuffisance cardiaque. La mention de l’urémie ne lève pas la contre-indication si la clairance est inférieure à 50 mL/min : ne pas administrer le produit dans ce cas et adresser à l’équipe spécialisée pour une alternative. Selon la FI, une natrémie inférieure à 130 mmol/L ou une prise de poids progressive impose de restreindre fortement l’apport liquidien et d’interrompre Octostim.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527110296" target="_blank" rel="noopener">Swissmedic — Octostim® 15 µg (autorisation 52711 ; novembre 2025), information professionnelle</a>.</p></template>
<template id="d69-eltrombopag" data-pop="d69-eltrombopag" data-title="Eltrombopag (Revolade) : posologie et interactions"><p>Revolade (autorisation 60122) est indiqué dans le PTI de l’adulte insuffisamment répondeur à d’autres traitements avec risque hémorragique, et chez l’enfant de 6 ans et plus avec PTI depuis au moins 6 mois. La dose initiale est de 50 mg/j (25 mg en cas d’origine asiatique ou d’insuffisance hépatique ; 37,5 mg chez l’enfant de moins de 27 kg). La cible est d’au moins 50 000/µL.</p><p>La dose augmente de 25 mg si les plaquettes restent inférieures à 50 000/µL après 2 semaines au moins, et diminue de 25 mg si elles se situent entre 200 000 et 400 000/µL. Le traitement est interrompu au-delà de 400 000/µL et repris à dose réduite sous 150 000/µL. Le maximum est de 75 mg/j ; il est arrêté si la réponse est insuffisante après 4 semaines à 75 mg. Il se prend au moins 2 heures avant ou 4 heures après les cations polyvalents (Al, Ca, Fe, Mg, Se, Zn).</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680601220019" target="_blank" rel="noopener">Swissmedic — Revolade® (autorisation 60122 ; octobre 2023), information professionnelle</a>.</p></template>
<template id="d69-romiplostim-dose" data-pop="d69-romiplostim-dose" data-title="Romiplostim : dose initiale suisse et française"><p>L’information professionnelle suisse de Nplate (décembre 2025) prévoit 1 µg/kg une fois par semaine par voie sous-cutanée, avec des paliers de 1 µg/kg, une cible supérieure à 50 G/L et un maximum de 10 µg/kg. Le PNDS français indique 3 µg/kg par semaine avec des paliers de 2 µg/kg, et 10 µg/kg d’emblée en urgence vitale, hors autorisation.</p><p>Le cours enseigne la posologie suisse et signale les pratiques françaises. Calcul : pour 70 kg, 1 µg/kg donne 70 µg ; avec 35 G/L au 7e jour, la dose suivante est de 2 µg/kg, soit 140 µg ; un flacon contient 250 µg. Des erreurs de reconstitution et de dosage ont été rapportées : le nom commercial et le lot sont documentés.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680615410017" target="_blank" rel="noopener">Swissmedic — Nplate® (autorisation 61541 ; décembre 2025), information professionnelle</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-anti-d" data-pop="d69-anti-d" data-title="Anti-D : mécanisme et statut"><p>L’anti-D inhibe de façon compétitive la phagocytose splénique des plaquettes chez le patient Rh positif non splénectomisé. Le WinRho a été retiré du marché en 2009 pour hémolyses intravasculaires graves.</p><p>Les anti-D actuels, dont le Rhophylac, ne sont pas autorisés dans le PTI. L’information professionnelle suisse du Rhophylac signale l’usage hors indication dans la thrombopénie immune primaire et des cas d’hémolyse mortelle.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680536090237" target="_blank" rel="noopener">Swissmedic — Rhophylac® 300 (autorisation 53609 ; février 2026), information professionnelle</a>.</p></template>
<template id="d69-fostamatinib" data-pop="d69-fostamatinib" data-title="Fostamatinib : option européenne, sans information suisse"><p>Onkopedia cite le fostamatinib comme option à privilégier si le risque thrombotique est élevé ; il est autorisé dans l’Union européenne. La recherche d’une information professionnelle suisse (« Tavlesse », « fostamatinib ») dans AmiKo n’a donné aucun résultat le 14 octobre 2026.</p><p>Le fostamatinib ne doit donc pas être présenté comme disponible en Suisse. Une lecture ultérieure vérifiera si une information suisse est apparue.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a>.</p></template>
