<section class="ilot" data-semiology="mechanisms" id="n00-semio-mechanisms"><h3>Du mécanisme au signe</h3><p>Une barrière lésée laisse passer les hématies ; leur déformation et leur incorporation dans un cylindre donnent des indices de localisation. Une filtration réduite et une élimination sodée insuffisante favorisent l’expansion extracellulaire, donc poids, œdèmes et pression augmentés. L’atteinte du filtre peut produire une protéinurie sans hypoalbuminémie profonde : l’œdème ne doit pas être attribué automatiquement à une perte d’albumine.</p><p>Une lésion capillaire sévère peut s’accompagner de croissants dans l’espace urinaire et d’une chute rapide de fonction. Si les poumons sont atteints par le même processus, la dyspnée peut traduire une <button class="w" data-k="n00-hemorragie">hémorragie alvéolaire</button>. Le signe respiratoire impose donc de distinguer plusieurs mécanismes urgents, pas de choisir d’emblée « <button class="w" data-k="n00-surcharge">surcharge</button> » sur la seule présence d’œdèmes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">Halfon et coll., Revue Médicale Suisse 2014 — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.253,265–269 ; définition, complications, soutien</a>.</p></section>
<section class="ilot" data-semiology="examination" id="n00-semio-examination"><h3>Observer et mesurer avec une méthode</h3><p>Le sédiment est analysé sur un prélèvement adapté, rapidement acheminé ; noter la méthode morphologique. Une pression artérielle inattendue est vérifiée avec une mesure appropriée au patient. Chez l’enfant, utiliser les références selon âge, taille et sexe ; les règles de confirmation d’une hypertension chronique ne justifient pas d’attendre plusieurs consultations devant une urgence symptomatique.</p><p>Le volume urinaire nécessite un intervalle de recueil fiable : demander « urinez-vous moins ? » ne suffit pas à classer un stade. Le poids est comparé dans des conditions aussi cohérentes que possible. L’examen recherche état respiratoire, signes circulatoires, conscience, œdèmes et indices de maladie générale. L’échographie complète l’examen si l’on doit éliminer une obstruction.</p><figure data-n00-figure="sediment"><div data-n00-frame="wide"><img alt="Quatre photographies originales de cylindres urinaires : épithélial, granuleux, leucocytaire et érythrocytaire" loading="lazy" src="assets/img/n00/alpha/codex/RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg"/><span aria-hidden="true" data-n00-mark="1">1</span><span aria-hidden="true" data-n00-mark="2">2</span><span aria-hidden="true" data-n00-mark="3">3</span><span aria-hidden="true" data-n00-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Panneau a : cylindre de cellules épithéliales tubulaires, selon la légende source.</li><li>Panneau b : cylindre granuleux brun, selon la légende source.</li><li>Panneau c : cylindre leucocytaire, selon la légende source.</li><li>Panneau d : cylindre érythrocytaire, repère pertinent pour une atteinte glomérulaire.</li></ol><p>Original disponible en 567 × 337 pixels ; les cellules ne sont pas reclassées au-delà de la légende publiée. Source utilisée pour la figure, pas comme recommandation américaine de prise en charge.</p><p data-n00-credit="">V. Mohsenin, J Intensive Care 2017;5:57, figure de microscopie · <a href="https://commons.wikimedia.org/wiki/File:RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener" target="_blank">CC BY 4.0</a>. Original inchangé ; repères et légende ajoutés par superposition par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">HUG, médecine de premier recours, 2017 — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://www.paediatrieschweiz.ch/fr/hypertension-arterielle-pendant-lenfance/" rel="noopener" target="_blank">Betti, Stefani-Glücksberg, Simonetti ; pédiatrie suisse,25.12.2020 — Définition, fréquence et mesure de la pression</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.253,265–269 ; définition, complications, soutien</a>.</p></section>
<section class="ilot" data-semiology="interpretation" id="n00-semio-interpretation"><h3>Interpréter un résultat positif et son absence</h3><p>Les cylindres érythrocytaires et les acanthocytes renforcent l’hypothèse glomérulaire. Leur absence peut tenir à la sensibilité du signe, au prélèvement ou à l’évolution : elle ne clôt pas le diagnostic. À l’inverse, la présence d’hématies ne dit pas toute la cause. L’association à la protéinurie et à la baisse de fonction donne sa cohérence au tableau.</p><p>Une natriurèse faible ou une fraction d’excrétion sodée basse peut se voir dans une glomérulonéphrite ; elle ne démontre donc pas une insuffisance rénale exclusivement fonctionnelle. Un complément normal n’exclut pas une atteinte inflammatoire glomérulaire. Une sérologie positive doit être confrontée aux autres données avant de décider d’un traitement exposant à un risque infectieux.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">HUG, médecine de premier recours, 2017 — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">Halfon et coll., Revue Médicale Suisse 2014 — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></section>
<section class="ilot" data-semiology="differentials" id="n00-semio-differentials"><h3>Les indices qui départagent les hypothèses</h3><p>Des caillots et des symptômes mictionnels orientent aussi vers la voie urinaire ; une bandelette sang positive sans hématies vers une hémoprotéine. Un contexte médicamenteux ou hémodynamique peut indiquer une atteinte tubulaire ou interstitielle. Une histoire ancienne familiale, surtout avec surdité, fait rechercher une maladie héréditaire de la membrane basale.</p><p>Dans le groupe glomérulaire, la chronologie infectieuse, le complément, les signes extrarénaux et l’histologie sont réellement discriminants. Une infection active peut mimer une vascularite. Pendant la grossesse, une hypertension nouvelle avec atteinte d’organe impose aussi le diagnostic différentiel de prééclampsie ; ce tableau ne doit pas être rangé automatiquement parmi les suites d’infection.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">HUG, médecine de premier recours, 2017 — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.118–120</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/409725/3594818/RMS_662_1603.pdf" rel="noopener" target="_blank">Mégevand et coll., Revue Médicale Suisse 2019 — pp.1603–1604 ; diagnostic et classification</a>.</p></section>
<section class="ilot" data-semiology="urgency" id="n00-semio-urgency"><h3>Reconnaître ce qui ne peut pas attendre</h3><p>La menace respiratoire, les signes neurologiques, les anomalies électriques d’une <button class="w" data-k="n00-hyperkaliemie">hyperkaliémie</button>, l’<button class="w" data-k="n00-anurie">anurie</button> et une détérioration rénale rapide changent immédiatement le niveau de soins. La biologie et les prélèvements étiologiques sont obtenus sans retarder la stabilisation. Un syndrome réno-pulmonaire exige une collaboration urgente ; l’hémoptysie n’est pas nécessairement présente dès le début.</p><p>Ne pas attendre une créatinine très élevée pour orienter : une hausse rapide depuis une valeur basse peut être significative. Ne pas attendre non plus le contrôle tardif du complément si la trajectoire est défavorable. La comparaison des mesures successives donne le rythme de l’action.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">Halfon et coll., Revue Médicale Suisse 2014 — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.253,265–269 ; définition, complications, soutien</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">Société suisse de néphrologie, 17.03.2025 — Figure 4, orientation néphrologique</a>.</p></section>
<section class="ilot" data-semiology="limits" id="n00-semio-limits"><h3>Populations, méthodes et limites suisses</h3><p>Les critères de laboratoire, la pression de l’enfant, l’état de grossesse et la fonction antérieure modifient l’interprétation. Les sources suisses servent à l’orientation et au contexte ; le CUEN et KDIGO complètent les mécanismes et les tableaux diagnostiques. Les FI suisses exactes gouvernent les informations propres au produit, sans prouver à elles seules le bénéfice d’un traitement dans toutes les causes de syndrome néphritique.</p><p>Un avis de première ligne sur la microhématurie isolée ne remplace pas une conduite d’urgence ; une revue ancienne ne suffit pas à fixer une immunosuppression actuelle. Les limites des figures, des tests et des données épidémiologiques sont explicites. Cette leçon et ses contrôles IA ne constituent pas une validation médicale humaine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">HUG, médecine de premier recours, 2017 — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://www.paediatrieschweiz.ch/fr/hypertension-arterielle-pendant-lenfance/" rel="noopener" target="_blank">Betti, Stefani-Glücksberg, Simonetti ; pédiatrie suisse,25.12.2020 — Définition, fréquence et mesure de la pression</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/409725/3594818/RMS_662_1603.pdf" rel="noopener" target="_blank">Mégevand et coll., Revue Médicale Suisse 2019 — pp.1603–1604 ; diagnostic et classification</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></section>
<section class="ilot" data-semiology="sources" id="n00-semio-sources"><h3>Correspondance des preuves et synthèse</h3><p>HUG 2017 étaye la morphologie et ses limites ; RMS 2014 étaye la reconnaissance de la progression rapide et du syndrome réno-pulmonaire ; CUEN 2025 relie syndromes, histologie et complications aiguës. KDIGO 2021, chapitre 7 et figures 56–57 effectivement visualisées, distingue infection préalable et active, bilan, traitement et suivi. Les références pédiatriques et obstétricales suisses limitent les extrapolations entre populations.</p><p><b>Science → clinique.</b> Une même dyspnée peut être liée à la <button class="w" data-k="n00-surcharge">surcharge</button> ou à une atteinte alvéolaire ; le contexte impose de les distinguer.</p><p><b>Science → examen.</b> Sédiment, fonction, complément et biopsie apportent des informations complémentaires.</p><p><b>Science → traitement.</b> La cause guide le traitement spécifique ; les complications sont traitées immédiatement.</p><div class="key"><b>À retenir.</b> Décrire le signe, expliquer son mécanisme, puis tester ce qui pourrait invalider l’hypothèse.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">HUG, médecine de premier recours, 2017 — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">Halfon et coll., Revue Médicale Suisse 2014 — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></section>
</div><div aria-labelledby="n00-tab-anat" class="sci" hidden="" id="n00-s-anat" role="tabpanel"><section class="ilot" id="n00-s-anat-content"><h2>Du capillaire à l’espace urinaire</h2><p>Le corpuscule rénal comprend un peloton capillaire, le glomérule, et la capsule de Bowman qui recueille le filtrat. Le sang arrive par une artériole afférente et repart par une artériole efférente. L’espace urinaire est séparé de la lumière capillaire par une barrière organisée ; il communique avec le tubule proximal. Cette succession aide à localiser un signe : une hématie ayant franchi le filtre n’est plus dans la circulation, mais dans une voie où elle peut être transportée et incorporée à un cylindre.</p><p>Les cellules endothéliales bordent la lumière vasculaire. La membrane basale se trouve entre cet endothélium et les pédicelles des podocytes. Les cellules épithéliales pariétales tapissent la capsule ; elles ne sont pas les podocytes du versant viscéral. Le mésangium apporte un soutien et participe aux propriétés de filtration. Ces compartiments peuvent être atteints différemment et ne sont pas interchangeables dans un compte rendu.</p><figure data-n00-figure="podocytes"><div data-n00-frame="wide"><img alt="Illustration humaine historique des podocytes et de leurs pédicelles autour d’un capillaire glomérulaire" loading="lazy" src="assets/img/n00/alpha/codex/2613_Podocytes.jpg"/><span aria-hidden="true" data-n00-mark="1">1</span><span aria-hidden="true" data-n00-mark="2">2</span><span aria-hidden="true" data-n00-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Corps d’un podocyte dans le détail de gauche.</li><li>Pédicelles entrelacés : organisation du versant externe du filtre.</li><li>Capillaire dans la représentation de droite.</li></ol><p>Planche normale, non image de patient ; elle ne montre ni dépôts immuns ni lésion inflammatoire. Les repères superposés n’altèrent pas les pixels.</p><p data-n00-credit="">OpenStax College, Anatomy &amp; Physiology, 2013 · <a href="https://commons.wikimedia.org/wiki/File:2613_Podocytes.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/3.0/" rel="noopener" target="_blank">CC BY 3.0</a>. Original inchangé ; repères et légende ajoutés par superposition par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>L’illustration montre l’organisation normale du versant podocytaire. Elle n’est pas un schéma complet de toutes les couches du filtre et n’identifie aucun dépôt. Dans une glomérulonéphrite, la localisation de la lésion explique une partie des anomalies urinaires ; l’examen histologique doit ensuite préciser l’étendue et le mécanisme.</p><p>La membrane basale glomérulaire partage certains composants antigéniques avec la membrane alvéolaire, ce qui permet de comprendre l’association rénale et pulmonaire de la maladie anti-membrane basale. Cette proximité immunologique ne signifie pas que toute dyspnée d’un patient néphritique soit une hémorragie : la surcharge est une autre explication, à évaluer cliniquement.</p><p><b>Science → clinique.</b> Une lésion de la barrière peut associer hématurie et protéinurie.</p><p><b>Science → examen.</b> La microscopie optique localise des lésions, l’<button class="w" data-k="n00-immunofluorescence">immunofluorescence</button> et l’électronique caractérisent d’autres niveaux.</p><p><b>Science → traitement.</b> Un diurétique agit sur le tubule en aval ; il ne répare pas directement une rupture de barrière.</p><div class="key"><b>À retenir.</b> Toujours distinguer lumière capillaire, filtre, espace de Bowman et lumière tubulaire.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax, Anatomy and Physiology, §25.4 — Corpuscule rénal, barrière, tubule proximal, anse et collecteur</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Posologie, contre-indications, précautions et mécanisme</a>.</p></section>
</div><div aria-labelledby="n00-tab-histo" class="sci" hidden="" id="n00-s-histo" role="tabpanel"><section class="ilot" id="n00-s-histo-content"><h2>Lire une prolifération et ses dépôts</h2><p>La microscopie optique montre les cellules, les lumières, la matrice et les cicatrices selon la coloration. Une prolifération endocapillaire correspond à une augmentation cellulaire dans le peloton, notamment par infiltration inflammatoire. Une prolifération extracapillaire occupe l’espace urinaire et forme des croissants. Ces mots décrivent le lieu et le type de lésion ; ils ne suffisent pas à déterminer la cause.</p><figure data-n00-figure="postinfect"><div data-n00-frame="wide"><img alt="Microphotographie humaine PAS de glomérulonéphrite postinfectieuse, diagnostic attribué à la source" loading="lazy" src="assets/img/n00/alpha/codex/Post-infectious_glomerulonephritis_-_high_mag.jpg"/><span aria-hidden="true" data-n00-mark="1">1</span><span aria-hidden="true" data-n00-mark="2">2</span><span aria-hidden="true" data-n00-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Glomérule très cellulaire, dans la moitié supérieure.</li><li>Second glomérule visible : ne pas extrapoler la proportion de glomérules atteints à partir d’un champ.</li><li>Lumière d’un tubule voisin, distincte de l’espace glomérulaire.</li></ol><p>Diagnostic de la source : GN postinfectieuse, coloration PAS. La coupe seule ne prouve ni le germe ni le profil des dépôts ; aucun « hump » électronique n’est identifié sur cette image.</p><p data-n00-credit="">Nephron · <a href="https://commons.wikimedia.org/wiki/File:Post-infectious_glomerulonephritis_-_high_mag.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" rel="noopener" target="_blank">CC BY-SA 3.0</a>. Original inchangé ; repères et légende ajoutés par superposition par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La première coupe, attribuée par sa source à une glomérulonéphrite <button class="w" data-k="n00-postinfectieux">postinfectieuse</button>, montre des glomérules très cellulaires. On ne peut pas y lire la présence d’un streptocoque, ni diagnostiquer un dépôt d’IgG ou de C3 à partir de la couleur rose. L’immunofluorescence recherche les immunoglobulines et le complément ; l’électronique précise notamment la localisation de dépôts sous-épithéliaux. Le terme « humps » désigne leur aspect en bosse, classiquement étudié en microscopie électronique.</p><figure data-n00-figure="crescent"><div data-n00-frame="wide"><img alt="Microphotographie humaine PAS d’une glomérulonéphrite extracapillaire, avec maladie anti-membrane basale documentée par la source" loading="lazy" src="assets/img/n00/alpha/codex/Crescentic_glomerulonephritis_-_high_mag.jpg"/><span aria-hidden="true" data-n00-mark="1">1</span><span aria-hidden="true" data-n00-mark="2">2</span><span aria-hidden="true" data-n00-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Premier glomérule lésé dans la moitié gauche.</li><li>Autre glomérule lésé ; l’évaluation d’activité et de fibrose nécessite toute la biopsie.</li><li>Lumière tubulaire : repère de séparation entre compartiments.</li></ol><p>La source rapporte des dépôts linéaires d’IgG en immunofluorescence ; ce signal n’est pas visible sur cette coloration PAS. Les repères localisent les structures sans prétendre typer chaque cellule ni quantifier les croissants.</p><p data-n00-credit="">Nephron · <a href="https://commons.wikimedia.org/wiki/File:Crescentic_glomerulonephritis_-_high_mag.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" rel="noopener" target="_blank">CC BY-SA 3.0</a>. Original inchangé ; repères et légende ajoutés par superposition par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La seconde coupe est décrite par l’auteur comme une glomérulonéphrite extracapillaire avec maladie anti-membrane basale démontrée par immunofluorescence. L’image présentée est une coloration PAS ; les dépôts linéaires mentionnés dans l’histoire de la figure ne sont pas visibles sur ce panneau. La proportion de glomérules atteints et la part de fibrose nécessitent l’ensemble du prélèvement, pas un champ sélectionné.</p><p>Les dépôts granuleux suggèrent certains mécanismes à complexes immuns, les dépôts linéaires un mécanisme anti-membrane basale et un profil <button class="w" data-k="n00-pauci">pauci-immun</button> une faible quantité de dépôts détectables. « Pauci-immun » ne signifie pas absence de mécanisme immunologique. Le compte rendu doit relier les lésions au contexte et distinguer activité potentiellement traitable et séquelles.</p><p><b>Science → clinique.</b> Des lésions actives sévères peuvent expliquer une chute rapide de fonction, même avec une hématurie peu visible.</p><p><b>Science → examen.</b> Les trois techniques répondent à des questions différentes ; une photographie PAS n’est pas une immunofluorescence.</p><p><b>Science → traitement.</b> Le choix d’une immunosuppression dépend de la cause et de l’activité, tandis que les cicatrices limitent la récupération attendue.</p><div class="key"><b>À retenir.</b> Décrire la lésion avant de nommer la maladie ; confronter chaque technique à ce qu’elle montre réellement.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></section>
</div><div aria-labelledby="n00-tab-physio" class="sci" hidden="" id="n00-s-physio" role="tabpanel"><section class="ilot" id="n00-s-physio-content"><h2>Filtration et excrétion : deux fonctions à séparer</h2><p>La filtration produit un liquide initial ; les tubules récupèrent une grande partie de son eau et de ses solutés et y ajoutent certaines substances par sécrétion. L’urine finale ne correspond donc pas au volume filtré. Une reprise de diurèse sous médicament ne garantit pas une restauration de la filtration et une baisse de diurèse peut avoir plusieurs mécanismes, y compris une obstruction.</p><p>Dans le syndrome néphritique, la lésion glomérulaire peut réduire la filtration pendant que le rein retient du sodium et de l’eau. Si les apports dépassent l’excrétion, le compartiment extracellulaire s’accroît. La prise de poids, la pression et les œdèmes sont les conséquences observables de ce bilan ; la congestion pulmonaire en est une complication grave. Ce mécanisme diffère d’une explication de tous les œdèmes par une baisse profonde de pression oncotique.</p><figure data-n00-figure="nephron"><div data-n00-frame="tall"><img alt="Illustration humaine historique des échanges tubulaires du néphron normal" loading="lazy" src="assets/img/n00/alpha/codex/2618_Nephron_Secretion_Reabsorption.jpg"/><span aria-hidden="true" data-n00-mark="1">1</span><span aria-hidden="true" data-n00-mark="2">2</span><span aria-hidden="true" data-n00-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Tubule proximal : réabsorption et sécrétion modifient le filtrat.</li><li>Branche ascendante : repère de la réabsorption de sodium, potassium et chlorure.</li><li>Canal collecteur : ajustement final de l’eau et des solutés.</li></ol><p>Schéma simplifié normal ; les flèches sont celles de l’original. Il ne mesure pas les flux d’un patient et ne représente pas une glomérulonéphrite.</p><p data-n00-credit="">OpenStax College, Anatomy &amp; Physiology, 2013 · <a href="https://commons.wikimedia.org/wiki/File:2618_Nephron_Secretion_Reabsorption.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/3.0/" rel="noopener" target="_blank">CC BY 3.0</a>. Original inchangé ; repères et légende ajoutés par superposition par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Le furosémide doit atteindre la lumière tubulaire pour agir sur le cotransporteur sodium-potassium-chlorure de l’anse. Il augmente l’excrétion de solutés et d’eau quand les conditions de réponse sont réunies. La dose et la voie se titrent selon la situation, sans multiplier les administrations si l’état exige une autre prise en charge. Hypovolémie et troubles électrolytiques sont des effets possibles qui peuvent eux-mêmes aggraver la fonction.</p><p>La rétention hydrosodée ne prouve pas une activation uniforme du système rénine-angiotensine chez tous les patients. Les formes, le stade et les traitements modifient les réponses hémodynamiques. Une fraction d’excrétion sodée basse peut accompagner une glomérulonéphrite ; elle doit être replacée dans le sédiment et la dynamique clinique.</p><p><b>Science → clinique.</b> Le poids et la respiration renseignent sur la surcharge, tandis que créatinine et diurèse renseignent différemment sur la fonction.</p><p><b>Science → examen.</b> Mesurer les entrées/sorties et suivre la créatinine ; ne pas déduire un débit instantané fiable d’une équation en phase instable.</p><p><b>Science → traitement.</b> Le diurétique traite la surcharge ; l’épuration répond aux complications réfractaires, et le traitement causal vise la lésion.</p><div class="key"><b>À retenir.</b> Une urine plus abondante est une réponse d’excrétion, pas une preuve de guérison glomérulaire.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax, Anatomy and Physiology, §25.4 — Corpuscule rénal, barrière, tubule proximal, anse et collecteur</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.253,265–269 ; définition, complications, soutien</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">Halfon et coll., Revue Médicale Suisse 2014 — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Posologie, contre-indications, précautions et mécanisme</a>.</p></section>
</div><div aria-labelledby="n00-tab-bio" class="sci" hidden="" id="n00-s-bio" role="tabpanel"><section class="ilot" id="n00-s-bio-content"><h2>Concentrations, rapports et équilibres ioniques</h2><p>Une concentration urinaire dépend à la fois de la quantité excrétée et de l’eau qui la dilue. Le rapport protéines/créatinine utilise deux concentrations du même prélèvement pour réduire l’effet de dilution. Il ne supprime pas la variabilité de l’excrétion protéique ni celle de la production de créatinine. C’est pourquoi le moment du prélèvement, la méthode et la répétition cohérente comptent.</p><p>Exemple fictif : protéines urinaires 1200 mg/L et créatinine urinaire 6 mmol/L. Le rapport est 1200 ÷ 6 = 200 mg/mmol. Le litre s’annule ; les milligrammes de protéines restent rapportés aux millimoles de créatinine. Ce résultat ne signifie ni 200 mg/L ni 200 mg par jour. L’<button class="w" data-k="n00-albuminurie">albuminurie</button> ne doit pas être remplacée par la protéinurie totale dans une formule destinée à l’autre grandeur.</p><figure data-n00-figure="nephron"><div data-n00-frame="tall"><img alt="Illustration humaine historique des échanges tubulaires du néphron normal" loading="lazy" src="assets/img/n00/alpha/codex/2618_Nephron_Secretion_Reabsorption.jpg"/><span aria-hidden="true" data-n00-mark="1">1</span><span aria-hidden="true" data-n00-mark="2">2</span><span aria-hidden="true" data-n00-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Tubule proximal : réabsorption et sécrétion modifient le filtrat.</li><li>Branche ascendante : repère de la réabsorption de sodium, potassium et chlorure.</li><li>Canal collecteur : ajustement final de l’eau et des solutés.</li></ol><p>Schéma simplifié normal ; les flèches sont celles de l’original. Il ne mesure pas les flux d’un patient et ne représente pas une glomérulonéphrite.</p><p data-n00-credit="">OpenStax College, Anatomy &amp; Physiology, 2013 · <a href="https://commons.wikimedia.org/wiki/File:2618_Nephron_Secretion_Reabsorption.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/3.0/" rel="noopener" target="_blank">CC BY 3.0</a>. Original inchangé ; repères et légende ajoutés par superposition par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Le potassium plasmatique dépend notamment de son élimination rénale. Lorsque celle-ci devient insuffisante, une hyperkaliémie peut apparaître ; certains médicaments et une acidose peuvent l’aggraver. Le risque cardiaque rend le dosage et l’électrocardiogramme importants. Les bicarbonates et les gaz du sang, selon gravité, aident à caractériser l’acidose ; un déficit d’élimination des acides n’est pas interprété comme un simple problème de chiffre à corriger automatiquement.</p><p>Le complément est un ensemble de protéines impliquées dans la défense immunitaire. Le dosage C3/C4 est une concentration circulante, tandis que l’immunofluorescence rénale recherche une localisation tissulaire. Ces deux observations sont liées mais non équivalentes : une baisse sérique n’indique pas à elle seule le lieu ou la cause des dépôts. L’évolution et les autres tests permettent de préciser l’interprétation.</p><p><b>Science → clinique.</b> Une perturbation ionique peut être grave sans signe urinaire spectaculaire.</p><p><b>Science → examen.</b> Vérifier unités, méthode, cohérence de la trajectoire avant d’interpréter les résultats.</p><p><b>Science → traitement.</b> Ne pas donner du potassium par automatisme parce qu’un diurétique est prescrit ; ajuster aux mesures et au contexte aigu.</p><div class="key"><b>À retenir.</b> Une formule ne protège pas d’une erreur d’unité : nommer chaque grandeur avant de calculer.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Points 1.1.1–1.1.3,1.2.1–1.2.8,1.3.1–1.3.2 ; pp.S30–S33</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.253,265–269 ; définition, complications, soutien</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Posologie, contre-indications, précautions et mécanisme</a>.</p></section>
</div><div aria-labelledby="n00-tab-immuno" class="sci" hidden="" id="n00-s-immuno" role="tabpanel"><section class="ilot" id="n00-s-immuno-content"><h2>Plusieurs voies immunologiques, un même syndrome</h2><p>Dans une glomérulonéphrite liée aux infections, des mécanismes à complexes immuns et activation du complément participent à la lésion. L’infection peut être terminée ou encore active ; cette différence temporelle est déterminante pour la prise en charge. Un profil à prédominance d’IgA peut se rencontrer dans une infection, notamment staphylococcique, et ne doit pas être assimilé automatiquement à une néphropathie à IgA primitive.</p><p>Dans la maladie anti-membrane basale, des anticorps reconnaissent un composant de la membrane glomérulaire, le domaine NC1 de la chaîne alpha 3 du collagène IV, également présent dans la membrane alvéolaire. Cette cible explique la possibilité d’une association rénale et pulmonaire. Dans les vascularites associées aux ANCA, la lésion peut être <button class="w" data-k="n00-pauci">pauci-immun</button>e en histologie tout en étant produite par un processus immunologique. La faible visibilité des dépôts ne signifie donc pas une absence d’inflammation médiée par l’immunité.</p><figure data-n00-figure="postinfect"><div data-n00-frame="wide"><img alt="Microphotographie humaine PAS de glomérulonéphrite postinfectieuse, diagnostic attribué à la source" loading="lazy" src="assets/img/n00/alpha/codex/Post-infectious_glomerulonephritis_-_high_mag.jpg"/><span aria-hidden="true" data-n00-mark="1">1</span><span aria-hidden="true" data-n00-mark="2">2</span><span aria-hidden="true" data-n00-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Glomérule très cellulaire, dans la moitié supérieure.</li><li>Second glomérule visible : ne pas extrapoler la proportion de glomérules atteints à partir d’un champ.</li><li>Lumière d’un tubule voisin, distincte de l’espace glomérulaire.</li></ol><p>Diagnostic de la source : GN postinfectieuse, coloration PAS. La coupe seule ne prouve ni le germe ni le profil des dépôts ; aucun « hump » électronique n’est identifié sur cette image.</p><p data-n00-credit="">Nephron · <a href="https://commons.wikimedia.org/wiki/File:Post-infectious_glomerulonephritis_-_high_mag.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" rel="noopener" target="_blank">CC BY-SA 3.0</a>. Original inchangé ; repères et légende ajoutés par superposition par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La photographie rappelle une conséquence tissulaire de l’inflammation, mais ne permet pas de suivre directement les complexes immuns ou l’activation du complément. Ces mécanismes sont établis par un ensemble clinique, biologique et histologique. Les dépôts granuleux, linéaires ou faibles doivent être interprétés avec la technique utilisée et la qualité du prélèvement.</p><p>Le test immunologique n’est jamais détaché de la probabilité préalable. Une endocardite peut s’accompagner d’ANCA et imiter une vascularite ; rechercher une infection est donc essentiel lorsque le contexte l’évoque. Inversement, une atteinte d’organe menaçante impose une décision spécialisée rapide, sans attendre une démonstration idéale de chaque élément. La difficulté clinique consiste à sécuriser le patient tout en évitant une immunosuppression indifférenciée.</p><p><b>Science → clinique.</b> Purpura, manifestations ORL, symptômes respiratoires et fièvre modifient l’interprétation de l’atteinte rénale.</p><p><b>Science → examen.</b> Croiser anticorps, complément, microbiologie et histologie ; aucun de ces domaines ne remplace les autres.</p><p><b>Science → traitement.</b> L’immunosuppression est spécifique à la cause ; dans l’infection active, son bénéfice et son risque demandent une appréciation spécialisée.</p><div class="key"><b>À retenir.</b> Une inflammation glomérulaire ne signifie pas automatiquement qu’il faut supprimer l’immunité.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">Halfon et coll., Revue Médicale Suisse 2014 — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></section>
</div></div></div>


<div class="panel" hidden="" id="pP"><div class="chap-body"><section class="ilot" id="n00-p-principes"><h2>Prescrire selon l’objectif, la cause et le produit exact</h2><p>Il n’existe pas un médicament universel du syndrome néphritique aigu. Trois objectifs se séparent : soulager les complications hydrosodées, contrôler la pression dans le cadre approprié et traiter la cause. Une infection active, une forme <button class="w" data-k="n00-postinfectieux">postinfectieuse</button> typique et une maladie auto-immune sévère appellent des décisions différentes. Le tableau ci-dessous documente des produits suisses précis ; il n’est pas une ordonnance pour tout patient présentant une hématurie.</p><p>Avant une prescription, vérifier âge, poids, grossesse/allaitement, allergies, fonction rénale et sa dynamique, électrolytes, volémie, médicaments associés et possibilité d’absorption orale. Réévaluer ensuite l’objectif clinique et la tolérance. Les posologies de la FI sont distinguées de la preuve de bénéfice dans la maladie ; une indication réglementaire n’efface pas les limites des études cliniques.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Posologie, contre-indications, précautions et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Posologie, contre-indications et précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Indications, posologie, contre-indications, précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680370570018" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Indications, posologie, contre-indications et précautions</a>.</p></section>
<section class="ilot" id="n00-p-lasix"><h2>Furosémide — Lasix : traiter la surcharge</h2><p>Le furosémide est un diurétique de l’anse. Après transport dans la lumière tubulaire, il agit sur le cotransport sodium-potassium-chlorure et augmente l’excrétion de sodium et d’eau. Son objectif ici est la déplétion d’une <button class="w" data-k="n00-surcharge">surcharge</button> documentée. Une augmentation de la diurèse n’est pas une preuve de réparation glomérulaire et ne dispense pas de suivre créatinine, pression, poids et électrolytes.</p><table class="t"><thead><tr><th>Produit et population</th><th>Posologie de la FI suisse</th><th>Conditions et limites</th></tr></thead><tbody><tr><td>Lasix injectable 20 mg/2 mL ; adulte et adolescent ≥ 15 ans</td><td>Dose initiale 20–40 mg IV ; si réponse insuffisante, augmentation par 20 mg toutes les 2 h selon FI et réévaluation</td><td>Milieu et surveillance adaptés. La voie intramusculaire est exceptionnelle ; elle n’est pas indiquée dans l’œdème pulmonaire aigu.</td></tr><tr><td>Œdème pulmonaire aigu ; même produit</td><td>40 mg IV initialement ; selon l’état, 20–40 mg supplémentaires après 20 min</td><td>Schéma propre à cette indication dans la FI ; ne remplace pas les autres mesures hospitalières.</td></tr><tr><td>Vitesse IV</td><td>≤ 4 mg/min ; ≤ 2,5 mg/min si créatinine &gt; 5 mg/dL, soit environ 442 µmol/L</td><td>Administration lente ; risque auditif notamment si injection trop rapide et insuffisance rénale.</td></tr><tr><td>Enfant &lt; 15 ans ; forme injectable</td><td>1 mg/kg ; maximum 20 mg/j selon cette FI</td><td>Parentéral réservé aux cas critiques ; relais oral dès que possible. Ne pas remplacer ce plafond par une dose adulte.</td></tr><tr><td>Lasix comprimé 40 mg ; adulte</td><td>Début habituel 20–80 mg/j ; entretien 20–40 mg/j selon FI</td><td>Titration à l’effet ; prise orale à jeun.</td></tr><tr><td>Enfant ; forme orale</td><td>2 mg/kg ; maximum 40 mg/j selon FI</td><td>Formulation et faisabilité à vérifier ; dose distincte du schéma injectable.</td></tr></tbody></table><p><b>Contre-indications pertinentes :</b> la FI mentionne notamment défaillance rénale avec <button class="w" data-k="n00-anurie">anurie</button>, hypovolémie/déshydratation, hypokaliémie ou hyponatrémie sévère, hypersensibilité et allaitement. Une anurie ne justifie donc pas l’escalade automatique de ce produit. Une obstruction doit être recherchée et l’écoulement urinaire assuré.</p><p><b>Surveillance :</b> pression, poids, entrées/sorties, créatinine, sodium, potassium et équilibre acido-basique selon la situation. Une déplétion excessive peut aggraver la fonction ; les pertes électrolytiques peuvent provoquer des symptômes et des troubles du rythme. Pendant la grossesse, la FI réserve l’utilisation à une nécessité absolue avec surveillance ; ne pas extrapoler le tableau ci-dessus sans avis adapté.</p><div class="trap"><b>Piège.</b> La FI évoque un apport potassique dans certains traitements par diurétique ; cette consigne générique ne s’applique pas automatiquement au patient oligurique ou hyperkaliémique.</div><p>Les protocoles pédiatriques spécialisés peuvent utiliser d’autres schémas dans des indications précises. Aucune équivalence entre ces protocoles et la FI de Lasix n’est revendiquée ici. Les quatre paramètres — produit, voie, âge et objectif — doivent rester visibles.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Posologie, contre-indications, précautions et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Posologie, contre-indications et précautions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.253,265–269 ; définition, complications, soutien</a>.</p></section>
<section class="ilot" id="n00-p-norvasc"><h2>Amlodipine — Norvasc : une option de fond chez l’adulte</h2><p>L’amlodipine bloque l’entrée du calcium dans les cellules musculaires lisses et relaxe les artérioles. La diminution de résistance périphérique abaisse progressivement la pression. Ce délai d’action explique qu’un comprimé oral ne remplace pas une prise en charge surveillée lorsqu’une hypertension s’accompagne d’une atteinte aiguë d’organe.</p><table class="t"><thead><tr><th>Point</th><th>FI suisse Norvasc GTIN 7680500440174</th></tr></thead><tbody><tr><td>Dose adulte habituelle</td><td>5 mg par voie orale une fois/j ; jusqu’à 10 mg une fois/j selon réponse.</td></tr><tr><td>Sujet âgé</td><td>Dose initiale plus faible parfois nécessaire ; surveillance de tolérance.</td></tr><tr><td>Insuffisance rénale</td><td>Pas d’adaptation habituelle selon FI ; amlodipine non dialysable.</td></tr><tr><td>Insuffisance hépatique</td><td>Prudence ; demi-vie prolongée et absence de recommandation posologique précise.</td></tr><tr><td>Moins de 18 ans</td><td>Données de sécurité et d’efficacité insuffisantes dans cette FI ; aucun schéma pédiatrique déduit du tableau adulte.</td></tr><tr><td>Contre-indications principales</td><td>Hypotension sévère, choc, obstruction sévère de la voie d’éjection du ventricule gauche, certaines instabilités cardiaques et hypersensibilité.</td></tr></tbody></table><p>La pression et les symptômes sont suivis après l’introduction. La grossesse et l’allaitement nécessitent une décision spécifique conforme à la FI ; le produit n’est pas présenté comme traitement obstétrical de référence. Le choix antihypertenseur ne traite pas à lui seul l’inflammation glomérulaire et n’élimine pas la nécessité de corriger une <button class="w" data-k="n00-surcharge">surcharge</button>.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Indications, posologie, contre-indications, précautions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.253,265–269 ; définition, complications, soutien</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/409725/3594818/RMS_662_1603.pdf" rel="noopener" target="_blank">Mégevand et coll., Revue Médicale Suisse 2019 — pp.1603–1604 ; diagnostic et classification</a>.</p></section>
<section class="ilot" id="n00-p-ospen"><h2>Phénoxyméthylpénicilline — Ospen : traiter une infection sensible</h2><p>Ospen est une pénicilline orale qui inhibe la synthèse de la paroi des bactéries sensibles en multiplication. Son intérêt dépend du germe et du foyer ; il ne constitue pas un traitement universel des glomérulonéphrites. Un schéma d’infection pharyngée ne se transpose pas à une <button class="w" data-k="n00-endocardite">endocardite</button>, à une bactériémie ou à un foyer profond.</p><p><b>Produit exact :</b> Ospen 1000 comprimé contient 1 million d’unités internationales, correspondant à 654 mg de phénoxyméthylpénicilline potassique et 590 mg de phénoxyméthylpénicilline. «1000» n’est donc pas une instruction de donner 1000 mg. Les sirops 400 et 750 ont des concentrations et un sel différents ; les volumes ne sont pas interchangeables.</p><table class="t"><thead><tr><th>Situation</th><th>Information de la FI suisse</th></tr></thead><tbody><tr><td>Adulte et adolescent ≥ 12 ans, infection sensible relevant de la voie orale</td><td>En moyenne 1 comprimé Ospen 1000, 3–4 fois/j. Pour une infection streptococcique, durée d’au moins 10 jours selon FI.</td></tr><tr><td>Prise</td><td>À jeun, si possible 1 h et au minimum 30 min avant le repas.</td></tr><tr><td>Insuffisance rénale légère/modérée</td><td>Réduction généralement non nécessaire selon FI ; prudence si atteinte sévère.</td></tr><tr><td>Anurie</td><td>Intervalle recommandé porté à 12 h selon FI ; réévaluation spécialisée de la prescription et du foyer.</td></tr><tr><td>Potassium</td><td>65,8 mg par comprimé Ospen 1000 ; apport à compter en insuffisance rénale ou restriction potassique.</td></tr><tr><td>Allergie</td><td>Hypersensibilité aux pénicillines/bêta-lactamines contre-indiquée ; rechercher l’histoire exacte et les réactions sévères.</td></tr></tbody></table><p>La FI donne des schémas pédiatriques par âge et mesurette de sirop. Ils nécessitent de vérifier la présentation réellement prescrite, le poids, les excipients et la situation rénale ; ils ne sont pas remplacés ici par une conversion improvisée du comprimé adulte. Une diarrhée sévère persistante ou une réaction d’hypersensibilité impose une réévaluation immédiate.</p><div class="trap"><b>Divergence à comprendre.</b> La FI mentionne la prophylaxie de complications streptococciques, dont la glomérulonéphrite. KDIGO précise que l’antibiotique d’une infection sous-jacente ne modifie pas le cours d’une GN <button class="w" data-k="n00-postinfectieux">postinfectieuse</button> déjà établie ; l’éradication d’un streptocoque encore présent vise notamment à limiter sa diffusion. Le cours ne transforme donc pas l’indication réglementaire en preuve de récupération rénale.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680370570018" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Indications, posologie, contre-indications et précautions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></section>
<section class="ilot" id="n00-p-immuno"><h2>Immunosuppression : une indication étiologique</h2><p>Dans une forme postinfectieuse typique, l’utilité des corticoïdes à forte dose n’est pas établie. Dans une glomérulonéphrite associée à une infection active, l’immunosuppression peut comporter des risques importants et ne se prescrit pas automatiquement, même si une lésion à croissants est décrite. Une présentation sévère nécessite un raisonnement spécialisé sur la cause, la maîtrise du foyer, l’activité des lésions et les alternatives.</p><p>Une maladie anti-membrane basale ou une vascularite grave relève d’un traitement spécifique urgent. Cette monographie enseigne leur reconnaissance et le déclenchement de la prise en charge ; elle ne substitue pas un protocole indifférencié à la leçon étiologique et à la prescription spécialisée. Aucune dose de corticoïde, de rituximab ou de cyclophosphamide n’est proposée par extrapolation depuis une maladie différente.</p><p>L’absence de schéma universel est un élément de conduite clinique : prélever, discuter rapidement avec le néphrologue, sécuriser les organes menacés et préciser l’étiologie. Elle ne signifie pas attendre passivement l’ensemble des résultats quand le pronostic est engagé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">Halfon et coll., Revue Médicale Suisse 2014 — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a>.</p></section>
<section class="ilot" id="n00-p-verification"><h2>Vérification de prescription et réévaluation</h2><ol><li>Nommer l’objectif : surcharge, pression de fond, infection documentée ou traitement causal spécialisé.</li><li>Vérifier produit, présentation, unité, voie et population : milligrammes, unités internationales et millilitres ne se substituent pas.</li><li>Réévaluer volémie, diurèse, potassium et fonction rénale ; un résultat ancien ne décrit pas toujours l’état aigu actuel.</li><li>Rechercher contre-indications, allergies, grossesse/allaitement et médicaments associés.</li><li>Définir un critère de réponse et un motif d’arrêt ou d’escalade : absence de déplétion, hypotension, trouble ionique ou aggravation clinique.</li><li>Conserver la distinction entre dose réglementaire du produit et preuve clinique dans cette cause de maladie.</li></ol><div class="key"><b>À retenir.</b> Une prescription sûre reste liée au produit exact et à une question clinique précise.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Posologie, contre-indications, précautions et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Posologie, contre-indications et précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Indications, posologie, contre-indications, précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680370570018" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Indications, posologie, contre-indications et précautions</a>.</p></section>
