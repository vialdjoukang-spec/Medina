<template id="ch-N00"><div class="chap"><div class="chap-head"><div class="code">N00 · Néphrologie</div><h1>Syndrome néphritique aigu</h1><span class="status">Monographie pédagogique · Auto-relecture IA documentée · Sans validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button aria-controls="pA" aria-selected="true" data-p="pA" role="tab">⚕ Pathologie et prise en charge</button><button aria-controls="pE" aria-selected="false" data-p="pE" role="tab">🔬 Examens complémentaires</button><button aria-controls="pS" aria-selected="false" data-p="pS" role="tab">⚛ Sciences fondamentales spécialisées</button><button aria-controls="pP" aria-selected="false" data-p="pP" role="tab">💊 Pharmacologie</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan monographique</b><ol><li><a href="#n00-1">Définition</a></li><li><a href="#n00-2">Épidémiologie</a></li><li><a href="#n00-3">Physiopathologie</a></li><li><a href="#n00-4">Démarche clinique</a></li><li><a href="#n00-5">Anamnèse</a></li><li><a href="#n00-6">Examen clinique</a></li><li><a href="#n00-7">Syndromes</a></li><li><a href="#n00-8">Diagnostic positif</a></li><li><a href="#n00-9">Explorations</a></li><li><a href="#n00-10">Arbre diagnostique et diagnostics différentiels</a></li><li><a href="#n00-11">Prise en charge</a></li><li><a href="#n00-12">Prévention, suivi et pronostic</a></li><li><a href="#n00-13">Points clés</a></li><li><a href="#n00-14">Pièges</a></li></ol></nav><div class="chap-body" data-semiology-clinical="N00"><section class="ilot" id="n00-question"><h2>Une urine sombre, mais quelle urgence ?</h2><p><b>Vignette pédagogique fictive.</b> Une personne de 32 ans consulte pour des urines brunâtres, des paupières gonflées et une baisse des urines depuis trois jours. Une infection pharyngée a précédé ces symptômes d’environ deux semaines. La pression artérielle est de 174/104 mmHg ; la créatinine est passée de 75 à 150 µmol/L en cinq jours. La première question n’est pas le nom du germe : il faut rechercher une dyspnée, une atteinte neurologique, une <button class="w" data-k="n00-hyperkaliemie">hyperkaliémie</button> et l’évolution de la diurèse, puis confirmer l’origine glomérulaire de l’hématurie.</p><p>Ce tableau suggère un syndrome néphritique aigu. Le contexte rend une cause <button class="w" data-k="n00-postinfectieux">postinfectieuse</button> plausible, mais ne la prouve pas. Une infection active, une maladie auto-immune ou une autre cause glomérulaire restent possibles. Les valeurs de la vignette sont construites pour l’apprentissage ; elles ne décrivent pas un patient réel.</p><div class="key"><b>À retenir.</b> Reconnaître le syndrome déclenche une conduite ; identifier la cause détermine le traitement.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">CH-URGENCE — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–171, tableau 1</a>.</p></section>
<section class="ilot" id="n00-1"><h2>1. Définition</h2><p>Le <b>syndrome néphritique aigu</b> est une présentation clinique d’atteinte glomérulaire inflammatoire apparue en quelques jours. Son noyau associe une hématurie d’origine glomérulaire et une protéinurie, avec une baisse variable de la filtration. La rétention de sodium et d’eau explique l’œdème, l’hypertension artérielle et souvent l’oligurie. L’intensité de ces manifestations varie : une hématurie microscopique peut accompagner une atteinte rénale sévère, et l’absence d’œdème visible n’exclut pas le syndrome.</p><p>Il s’agit d’un <b>syndrome, pas d’un diagnostic étiologique</b>. Le terme ne signifie pas automatiquement « infection à streptocoque », « croissants » ou « maladie auto-immune ». La glomérulonéphrite décrit la lésion inflammatoire ; son type doit être établi par le contexte, la biologie et, lorsqu’elle est indiquée, la <button class="w" data-k="n00-biopsie">biopsie</button>. La <button class="w" data-k="n00-nephritique-nephrotique">distinction entre néphritique et néphrotique</button> évite de déduire la maladie de la seule présence d’œdèmes.</p><p>Une détérioration rénale rapide en quelques jours ou semaines fait craindre une glomérulonéphrite rapidement progressive. Cette présentation peut se superposer au syndrome néphritique ; elle rend l’évaluation urgente. Le code N00 sert au classement de la présentation aiguë. Les suffixes morphologiques figurent en annexe, après le raisonnement clinique.</p><div class="key"><b>À retenir.</b> Hématurie glomérulaire + protéinurie + retentissement rénal ou hydrosodé : penser au syndrome néphritique et mesurer sa dynamique.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–171, tableau 1</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">CH-URGENCE — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">CH-CIM — ClasseN00, blocN00–N08, modificateurS14 N00_4 et classes.0–.9</a>.</p><button class="pareto-btn ui" data-k="pareto-n00-1">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n00-2"><h2>2. Épidémiologie : préciser la population</h2><p>La fréquence d’un syndrome dépend de sa définition et du recrutement : patients de premier recours, enfants hospitalisés et adultes biopsiés ne constituent pas le même dénominateur. Les sources suisses consultées ne fournissent pas une incidence nationale récente de l’ensemble des syndromes néphritiques aigus. Aucun chiffre de glomérulonéphrite rapidement progressive ni de microhématurie n’est donc présenté ici comme l’incidence de N00.</p><p>Le CUEN décrit une diminution de l’incidence de la forme <button class="w" data-k="n00-postinfectieux">postinfectieuse</button> typique. KDIGO rappelle cependant que les infections liées aux glomérulonéphrites sont diverses : chez l’adulte, l’infection peut encore être active, notamment dans une <button class="w" data-k="n00-endocardite">endocardite</button> ou une infection staphylococcique sur terrain comorbide. La forme poststreptococcique de l’enfant et la forme associée à une infection active chez l’adulte n’ont ni le même contexte ni le même pronostic.</p><p>La néphropathie à IgA est une autre cause importante d’hématurie glomérulaire, notamment récidivante chez l’adulte jeune. Son importance dans les <button class="w" data-k="n00-biopsie">biopsie</button>s n’autorise pas à lui attribuer une proportion fixe de tous les tableaux néphritiques aigus. En pratique, l’âge, les antécédents rénaux, le diabète, les infections récentes ou persistantes et les signes systémiques modifient les hypothèses avant les tests.</p><div class="key"><b>À retenir.</b> Une fréquence sans population ni dénominateur aide peu à décider ; l’absence de donnée suisse directe reste explicite.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–171, tableau 1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-IGA — pp.179–180 ; néphropathie à IgA</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p><button class="pareto-btn ui" data-k="pareto-n00-2">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n00-3"><h2>3. Physiopathologie : du filtre lésé au tableau clinique</h2><p>Le <button class="w" data-k="n00-filtre">filtre glomérulaire</button> normal sépare le sang de l’espace urinaire grâce à l’endothélium, à la membrane basale et aux podocytes. L’eau et les petits solutés traversent cette barrière, tandis que les cellules sanguines sont retenues. Une lésion inflammatoire rend possible le passage d’hématies et augmente le passage de protéines. Les hématies peuvent se déformer au cours de ce passage ; dans le tubule, elles peuvent être incorporées dans un moulage protéique, formant un <button class="w" data-k="n00-sediment">cylindre érythrocytaire</button>.</p><p>La prolifération endocapillaire et l’infiltration inflammatoire gênent la filtration. Lorsque le rein élimine moins de sodium et d’eau que l’organisme n’en reçoit, le volume extracellulaire augmente : prise de poids, œdèmes et hypertension apparaissent. L’œdème néphritique n’exige donc pas une hypoalbuminémie profonde. Une expansion importante peut se traduire par une congestion pulmonaire. Le degré de protéinurie et l’albuminémie permettent de reconnaître une composante néphrotique associée.</p><p>Si les capillaires sont fortement lésés, une prolifération peut occuper l’espace de Bowman : c’est le <button class="w" data-k="n00-croissant">croissant extracapillaire</button>. Les lésions actives et les cicatrices fibreuses n’ont pas la même signification pronostique. La rapidité de la perte de fonction justifie d’agir avant que la lésion ne devienne irréversible.</p><table class="t"><thead><tr><th>Mécanisme dominant</th><th>Expression clinique ou biologique</th><th>Conséquence pratique</th></tr></thead><tbody><tr><td>Lésion du filtre</td><td>Hématies dysmorphiques, cylindres, protéinurie</td><td>Analyser le sédiment et quantifier la protéinurie.</td></tr><tr><td>Filtration réduite et rétention hydrosodée</td><td>Créatinine ascendante, oligurie, poids et pression augmentés</td><td>Suivre les tendances et rechercher une <button class="w" data-k="n00-surcharge">surcharge</button> pulmonaire.</td></tr><tr><td>Activation immunologique</td><td>Complément consommé dans certaines causes ; auto-anticorps dans d’autres</td><td>Interpréter les tests avec la clinique, sans sérologie universelle.</td></tr><tr><td>Lésion extracapillaire sévère</td><td>Perte rapide de fonction, parfois syndrome réno-pulmonaire</td><td>Organiser une évaluation néphrologique et histologique urgente.</td></tr></tbody></table><p>Les mécanismes ne sont pas interchangeables. Complexes immuns, anticorps anti-membrane basale et vascularite <button class="w" data-k="n00-pauci">pauci-immun</button>e peuvent aboutir à un tableau proche tout en appelant des traitements différents. Les six disciplines de l’onglet Sciences développent ces liens et les limites de leur lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">CH-SEDIMENT — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">CH-URGENCE — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">EU-IRA — pp.253,265–269 ; définition, complications, soutien</a>.</p><button class="pareto-btn ui" data-k="pareto-n00-3">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n00-4"><h2>4. Démarche clinique : gravité, localisation, cause</h2><p><b>Première étape : sécuriser.</b> Rechercher d’emblée détresse respiratoire, signes neurologiques, douleur thoracique, <button class="w" data-k="n00-anurie">anurie</button> ou baisse marquée des urines. Mesurer pression, saturation, fréquence respiratoire et état circulatoire ; obtenir rapidement créatinine, potassium et évaluation acido-basique selon gravité. Une atteinte menaçante justifie une prise en charge hospitalière immédiate et l’avis néphrologique, sans attendre le résultat de tous les anticorps.</p><p><b>Deuxième étape : localiser.</b> La bandelette dépiste, le sédiment confirme les hématies et recherche leur morphologie ainsi que les cylindres. Quantifier la protéinurie et l’<button class="w" data-k="n00-albuminurie">albuminurie</button> lorsque cela aide à caractériser l’atteinte. Une urine rouge avec bandelette positive mais sans hématies fait rechercher une hémoprotéine plutôt qu’affirmer une glomérulonéphrite. L’échographie explore notamment une obstruction lorsqu’une insuffisance rénale aiguë est présente.</p><p><b>Troisième étape : orienter la cause.</b> Reconstituer les délais infectieux, rechercher un foyer encore actif et les manifestations systémiques. Le <button class="w" data-k="n00-complement">complément</button>, les anticorps et les cultures répondent à des hypothèses explicites. Une sérologie positive isolée peut être trompeuse : une <button class="w" data-k="n00-endocardite">endocardite</button> peut s’accompagner d’ANCA. La biopsie se décide selon urgence, incertitude et influence attendue sur le traitement.</p><p><b>Quatrième étape : vérifier la trajectoire.</b> L’amélioration de la couleur des urines ne suffit pas. La diurèse, le poids, la pression, le potassium et la créatinine permettent de juger l’évolution immédiate ; les anomalies urinaires et le <button class="w" data-k="n00-complement">complément</button> participent au suivi de la cause.</p><div class="key"><b>À retenir.</b> Les examens de cause et les mesures de sécurité se conduisent en parallèle lorsque la fonction rénale se dégrade.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-ORIENTATION — Figure 4, orientation néphrologique</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">CH-SEDIMENT — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">EU-IRA — pp.253,265–269 ; définition, complications, soutien</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p><button class="pareto-btn ui" data-k="pareto-n00-4">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n00-5"><h2>5. Anamnèse analytique</h2><p>Faire préciser le début réel : première urine sombre, diminution de volume, gonflement palpébral au réveil, œdèmes déclives, prise de poids et essoufflement. Demander si la coloration intéresse toute la miction, s’il existe des caillots, des douleurs ou des brûlures. Une hématurie glomérulaire est classiquement totale et non caillotante ; ces caractères orientent mais ne remplacent pas l’analyse urinaire.</p><table class="t"><thead><tr><th>Question ciblée</th><th>Ce qu’elle cherche</th><th>Interprétation prudente</th></tr></thead><tbody><tr><td>Infection ORL ou cutanée ? Date, traitement et guérison réelle ?</td><td>Intervalle libre compatible avec une forme postinfectieuse</td><td>Un délai d’environ deux semaines oriente ; il ne prouve ni le streptocoque ni la causalité.</td></tr><tr><td>Hématurie contemporaine d’infections, épisodes antérieurs ?</td><td>Néphropathie à IgA possible</td><td>La récidive et la proximité temporelle renforcent l’hypothèse sans la confirmer.</td></tr><tr><td>Fièvre persistante, frissons, plaie, infection articulaire, matériel implanté ?</td><td>Foyer infectieux toujours actif, notamment endocardite</td><td>Une infection peut être peu bruyante ; la recherche de foyer ne dépend pas d’une fièvre obligatoire.</td></tr><tr><td>Purpura, douleurs articulaires ou abdominales, manifestations ORL, yeux rouges, hémoptysie ?</td><td>Maladie systémique ou atteinte réno-pulmonaire</td><td>Une atteinte extrarénale peut changer l’urgence et le bilan.</td></tr><tr><td>Anciennes créatinines, protéinurie, hypertension, diabète ?</td><td>Atteinte aiguë sur maladie chronique et terrain vulnérable</td><td>Chercher les résultats antérieurs ; un chiffre isolé ne date pas la lésion.</td></tr><tr><td>Maladie rénale ou surdité dans la famille ?</td><td>Atteinte héréditaire alternative</td><td>Une hématurie familiale n’est pas automatiquement bénigne.</td></tr><tr><td>Médicaments, automédication, produits de contraste, anticoagulants ?</td><td>Néphrotoxicité, aggravation hémodynamique, autre lésion ou saignement</td><td>Un anticoagulant ne dispense jamais de rechercher la source de l’hématurie.</td></tr></tbody></table><p>Chez l’enfant, les parents aident à estimer les urines, les boissons et les changements de poids ; une baisse de diurèse peut être sous-estimée si elle n’est pas mesurée. Chez une personne âgée, le tableau peut être dominé par la dyspnée ou l’altération générale : conserver la recherche urinaire et les antécédents biologiques.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">CH-SEDIMENT — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMATURIA — pp.118–120</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-IGA — pp.179–180 ; néphropathie à IgA</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">CH-URGENCE — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p><button class="pareto-btn ui" data-k="pareto-n00-5">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n00-6"><h2>6. Examen clinique : regarder au-delà des œdèmes</h2><p>Commencer par l’état général, la conscience, la respiration et la circulation. Mesurer la pression avec un brassard adapté et vérifier une valeur inattendue sans retarder la prise en charge d’un patient symptomatique. Chez l’enfant, l’interprétation tensionnelle dépend de l’âge, de la taille et du sexe ; un seuil adulte ne constitue pas une référence pédiatrique. Noter le poids actuel et rechercher un poids récent fiable.</p><p>Observer les paupières, les membres inférieurs et les régions déclives ; rechercher le godet et décrire sa distribution. L’examen respiratoire apprécie la fréquence, le travail respiratoire et les crépitants, avec la saturation. Une dyspnée peut correspondre à une <button class="w" data-k="n00-surcharge">surcharge</button>, mais une <button class="w" data-k="n00-hemorragie">hémorragie alvéolaire</button> doit être envisagée devant une atteinte glomérulaire rapide, une anémie ou une hémoptysie. L’absence d’expectoration sanglante ne permet pas, à elle seule, d’éliminer cette dernière.</p><p>L’examen cardiovasculaire recherche les signes de congestion et un souffle pouvant orienter vers une endocardite. Examiner la peau et les articulations, ainsi que la sphère ORL selon les symptômes : porte d’entrée infectieuse, purpura, ulcération ou manifestations inflammatoires orientent des explorations différentes. Une absence de signes extrarénaux n’exclut pas une maladie limitée au rein.</p><p>Enfin, rechercher un globe vésical ou des éléments d’obstruction ; une insuffisance rénale avec urines peu abondantes ne prouve pas un défaut de filtration. L’examen doit aboutir à une description utilisable : état respiratoire et neurologique, pression, poids, volémie estimée, diurèse mesurée et signes orientant la cause. Il ne se réduit pas à « œdèmes présents ».</p><div class="key"><b>À retenir.</b> La gravité se juge sur les organes menacés et la dynamique biologique, pas sur l’importance du gonflement visible.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">CH-URGENCE — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">CH-SEDIMENT — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-RPGN — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">EU-IRA — pp.253,265–269 ; définition, complications, soutien</a>.</p><button class="pareto-btn ui" data-k="pareto-n00-6">▲ Loi de Pareto — Le raisonnement essentiel</button></section>


<section class="ilot" id="n00-7"><h2>7. Syndromes et classifications utiles</h2><p>Nommer le syndrome permet de hiérarchiser le bilan. Les catégories peuvent coexister ; elles ne doivent pas enfermer le raisonnement dans une cause unique.</p><table class="t"><thead><tr><th>Présentation</th><th>Éléments dominants</th><th>Ce qui la distingue</th></tr></thead><tbody><tr><td>Néphritique aiguë</td><td>Hématurie glomérulaire, protéinurie, rétention hydrosodée et baisse variable de filtration</td><td>Installation rapide et recherche d’une inflammation glomérulaire.</td></tr><tr><td>Néphrotique associée</td><td>Protéinurie importante et hypoalbuminémie</td><td>Ajoute des risques propres ; la présence d’hématurie ne l’exclut pas. Les seuils dépendent de l’âge et du référentiel.</td></tr><tr><td>Rapidement progressive</td><td>Créatinine en forte ascension sur jours ou semaines</td><td>Urgence ; histologie et bilan immunologique orientent une thérapeutique spécifique.</td></tr><tr><td>Réno-pulmonaire</td><td>Atteinte glomérulaire avec suspicion d’<button class="w" data-k="n00-hemorragie">hémorragie alvéolaire</button></td><td>Menace vitale ; distinguer hémorragie et congestion sans retarder l’évaluation spécialisée.</td></tr><tr><td>Hématurie isolée</td><td>Sans protéinurie significative, hypertension ni baisse de filtration</td><td>Autre rythme d’exploration si réellement stable ; ne pas y classer par erreur une atteinte aiguë.</td></tr></tbody></table><p>Il n’existe pas, dans les sources retenues, un score universel de gravité propre au syndrome néphritique aigu. On décrit donc séparément l’insuffisance rénale aiguë, les complications hydrosodées et les atteintes extrarénales. La classification histologique distingue activité, dépôts et cicatrices ; les sous-codes administratifs ne remplacent aucune de ces dimensions.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–171, tableau 1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">HUG, médecine de premier recours, 2017 — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024 français — ClasseN00, blocN00–N08, modificateurS14 N00_4 et classes.0–.9</a>.</p><button class="pareto-btn ui" data-k="pareto-n00-7">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n00-8"><h2>8. Diagnostic positif : un faisceau cohérent</h2><p>Le diagnostic clinique repose sur une installation aiguë et des indices d’atteinte glomérulaire : hématurie confirmée, morphologie compatible ou cylindres, protéinurie et retentissement rénal ou hydrosodé. La bandelette seule n’identifie ni la cellule ni la localisation. Les critères morphologiques HUG — notamment plus de 5 % d’acanthocytes ou des cylindres hématiques — sont des repères de laboratoire ; leur sensibilité limitée interdit de conclure à l’absence de maladie sur un résultat négatif.</p><p>La fonction rénale doit être comparée à une valeur antérieure et suivie. Dans la vignette, le passage de 75 à 150 µmol/L correspond à un doublement : 150 ÷ 75 = 2. Ce calcul décrit une dynamique importante, même si le chiffre final paraît moins impressionnant que celui d’une insuffisance chronique avancée. Les équations de <button class="w" data-k="n00-egfr">débit estimé</button> ne donnent pas une mesure fiable de la filtration instantanée lorsque la créatinine change rapidement.</p><p>La cause <button class="w" data-k="n00-postinfectieux">postinfectieuse</button> reste une hypothèse jusqu’à la confrontation des éléments : infection préalable crédible, délai, <button class="w" data-k="n00-complement">complément</button>, recherche d’infection persistante et évolution. Un résultat d’anticorps antistreptococciques témoigne d’une réponse immunologique ; il ne constitue pas à lui seul une preuve que toute lésion rénale est poststreptococcique. Les sérologies, cultures et la <button class="w" data-k="n00-biopsie">biopsie</button> répondent à des questions différentes.</p><p>La <button class="w" data-k="n00-biopsie">biopsie</button> apporte la classification histologique quand son résultat est nécessaire à la décision. Elle est particulièrement importante en cas de progression rapide, de présentation atypique ou de doute causal. Elle n’est pas présentée comme obligatoire pour chaque enfant avec une forme <button class="w" data-k="n00-postinfectieux">postinfectieuse</button> typique favorable ; la décision relève du néphrologue.</p><div class="trap"><b>Piège.</b> Attendre une hématurie macroscopique, tous les signes classiques ou une sérologie positive peut retarder le diagnostic.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">HUG, médecine de premier recours, 2017 — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.253,265–269 ; définition, complications, soutien</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.186–187 ; GN aiguë postinfectieuse et tests</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Points 1.1.1–1.1.3,1.2.1–1.2.8,1.3.1–1.3.2 ; pp.S30–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p><button class="pareto-btn ui" data-k="pareto-n00-8">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n00-9"><h2>9. Explorations : une question par examen</h2><p>Le bilan initial mesure la gravité et confirme la localisation : créatinine, électrolytes dont potassium, analyse d’urines avec sédiment et quantification protéique ; numération et évaluation acido-basique selon le tableau. L’électrocardiogramme recherche le retentissement d’une <button class="w" data-k="n00-hyperkaliemie">hyperkaliémie</button>. L’échographie évalue notamment les voies excrétrices et participe à la préparation d’une éventuelle biopsie. Un examen normal n’efface pas une atteinte glomérulaire.</p><p>Le bilan causal est orienté : C3/C4, anticorps antinucléaires et anti-ADN, ANCA anti-MPO/anti-PR3, anticorps anti-membrane basale, cryoglobulines et sérologies infectieuses selon les indices. Si une infection active ou une <button class="w" data-k="n00-endocardite">endocardite</button> est plausible, les hémocultures et l’évaluation du foyer prennent une place essentielle. Les prélèvements microbiologiques se coordonnent avec l’antibiothérapie et l’urgence clinique.</p><p>L’onglet Examens détaille le prélèvement, ce que chaque test permet de conclure, ses limites et la façon de relier les résultats. Le but est une réponse utile à la décision, sans multiplier des examens dont l’interprétation resterait sans contexte.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">HUG, médecine de premier recours, 2017 — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.253,265–269 ; définition, complications, soutien</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.186–187 ; GN aiguë postinfectieuse et tests</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a>.</p><button class="pareto-btn ui" data-k="pareto-n00-9">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n00-10"><h2>10. Arbre diagnostique et diagnostics différentiels</h2><ol><li><b>Atteinte d’organe menaçante ?</b> Dyspnée sévère, trouble neurologique, <button class="w" data-k="n00-hyperkaliemie">hyperkaliémie</button>, <button class="w" data-k="n00-anurie">anurie</button> ou aggravation rapide imposent l’évaluation hospitalière immédiate. Poursuivre l’enquête pendant la stabilisation.</li><li><b>Hématies réellement présentes ?</b> Confirmer par sédiment. Si bandelette positive sans hématies, explorer hémoglobinurie ou myoglobinurie selon la clinique ; si bandelette négative, considérer notamment pigments alimentaires ou médicamenteux.</li><li><b>Origine glomérulaire ?</b> Morphologie, cylindres, protéinurie et fonction orientent. Caillots, douleur ou symptômes mictionnels font aussi rechercher une cause urologique ; une association reste possible.</li><li><b>Infection active ou antécédent récent ?</b> Rechercher un foyer et documenter la chronologie. Une hématurie synchrone d’une infection ORL évoque aussi l’IgA ; un intervalle libre évoque une forme postinfectieuse.</li><li><b>Complément, atteintes systémiques et vitesse d’évolution ?</b> Un C3 bas oriente vers certaines causes à complexes immuns ou du <button class="w" data-k="n00-complement">complément</button> ; un complément normal n’exclut pas IgA, vascularite ou maladie anti-membrane basale. Croiser avec les tests ciblés et décider de la biopsie.</li></ol><table class="t"><thead><tr><th>Alternative</th><th>Éléments qui la font rechercher</th><th>Ce qui empêche une conclusion trop rapide</th></tr></thead><tbody><tr><td>Infection urinaire ou lithiase</td><td>Dysurie, douleur, culture, imagerie</td><td>Une leucocyturie peut aussi accompagner une inflammation glomérulaire.</td></tr><tr><td>Obstacle urinaire</td><td>Globe, dilatation, <button class="w" data-k="n00-anurie">anurie</button> ou rétention</td><td>La diurèse basse n’est pas synonyme de glomérulonéphrite.</td></tr><tr><td>Néphrite interstitielle ou atteinte tubulaire</td><td>Exposition médicamenteuse, contexte infectieux ou hémodynamique, sédiment différent</td><td>Les profils peuvent se chevaucher ; la biopsie peut être nécessaire.</td></tr><tr><td>Maladie héréditaire de la membrane basale</td><td>Hématurie ancienne ou familiale, surdité</td><td>Une histoire familiale ne prouve pas une évolution bénigne.</td></tr><tr><td>Glomérulopathie chronique décompensée</td><td>Anomalies anciennes, hypertension ou maladie rénale préalable</td><td>La composante aiguë doit être traitée ; le dossier antérieur aide à la distinguer.</td></tr><tr><td>Maladie systémique ou infection imitant une vascularite</td><td>Purpura, signes pulmonaires, infection persistante, sérologies</td><td>Des ANCA peuvent être présents dans une <button class="w" data-k="n00-endocardite">endocardite</button> ; ne pas traiter un résultat isolé.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Le complément trie des hypothèses ; il ne remplace ni la clinique, ni la microbiologie, ni l’histologie.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">HUG, médecine de premier recours, 2017 — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.118–120</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.253,265–269 ; définition, complications, soutien</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p><button class="pareto-btn ui" data-k="pareto-n00-10">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n00-11"><h2>11. Prise en charge suisse : soutenir puis traiter la cause</h2><h3>Stabiliser et organiser le niveau de soins</h3><p>Une forme avec atteinte respiratoire ou neurologique, hyperkaliémie, anurie ou aggravation rapide nécessite un milieu hospitalier capable d’assurer surveillance, néphrologie et épuration si nécessaire. Mesurer les entrées/sorties, le poids, la pression et les paramètres biologiques selon la gravité. Revoir les médicaments et les apports, notamment sodium, potassium et substances potentiellement néphrotoxiques. Une <button class="w" data-k="n00-surcharge">surcharge</button> ne se traite pas par un remplissage liquidien automatique.</p><h3>Corriger la surcharge avec une surveillance rapprochée</h3><p>Le diurétique de l’anse peut être utilisé lorsque la <button class="w" data-k="n00-surcharge">surcharge</button> et la fonction résiduelle le justifient. Il ne guérit pas l’inflammation et ne prouve pas, par l’augmentation des urines, que la filtration a récupéré. Le choix de voie et de dose dépend de l’urgence, de l’absorption, de la réponse et des contre-indications. Les FI suisses exactes de Lasix sont détaillées dans Pharmacologie, y compris les différences enfant/adulte et la contre-indication d’anurie mentionnée par le produit.</p><p>Les apports hydriques et sodés sont ajustés à la diurèse, aux pertes et à l’état circulatoire. Une restriction excessive peut aussi être délétère ; aucun volume fixe n’est imposé à tous les patients. Le potassium se décide sur les résultats : un conseil générique de régime riche en potassium ne s’applique pas à une insuffisance rénale aiguë hyperkaliémique.</p><h3>Contrôler la pression sans confondre traitement de fond et urgence</h3><p>Une pression élevée avec atteinte aiguë d’organe relève d’une prise en charge surveillée et individualisée. L’amlodipine orale est une option de traitement de fond de l’adulte selon sa FI ; elle ne remplace pas le traitement d’une urgence hypertensive. La réduction de protéinurie par blocage du système rénine-angiotensine peut avoir une place après stabilisation dans certaines maladies, mais ne constitue pas un réflexe dans l’oligurie avec créatinine ascendante ou hyperkaliémie.</p><h3>Traiter la cause réellement établie</h3><p>Dans la forme postinfectieuse typique, la prise en charge rénale est surtout symptomatique. Une infection active doit être traitée selon son foyer et la microbiologie ; une endocardite nécessite un schéma propre et ne se traite pas par le simple protocole oral d’une angine. Une antibiothérapie donnée pour éradiquer un streptocoque encore présent vise aussi à limiter la transmission ; elle n’a pas démontré qu’elle renverse le cours d’une glomérulonéphrite déjà installée.</p><p>Les corticoïdes ne sont pas un traitement systématique de toute glomérulonéphrite postinfectieuse. Une forme à croissants ou une détérioration sévère exige une décision spécialisée fondée sur la cause, l’activité histologique, les risques infectieux et les preuves disponibles. Les vascularites et maladies anti-membrane basale ont des traitements spécifiques urgents ; aucun protocole unique d’immunosuppression n’est déduit du seul intitulé N00.</p><p>Une hyperkaliémie menaçante, une acidose sévère ou une surcharge pulmonaire réfractaire peuvent imposer une épuration extrarénale. La décision repose sur le contexte et les complications, pas sur un seuil isolé de créatinine. Les mesures de stabilisation et l’organisation de l’épuration ne doivent pas attendre la fin du bilan étiologique.</p><div class="key"><b>À retenir.</b> Traiter une infection et traiter une inflammation auto-immune ne sont pas des décisions interchangeables ; sécuriser le patient pendant que la cause est précisée.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">Société suisse de néphrologie, 17.03.2025 — Figure 4, orientation néphrologique</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.253,265–269 ; définition, complications, soutien</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.186–187 ; GN aiguë postinfectieuse et tests</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Posologie, contre-indications, précautions et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Posologie, contre-indications et précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Indications, posologie, contre-indications, précautions</a>.</p><button class="pareto-btn ui" data-k="pareto-n00-11">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n00-12"><h2>12. Prévention, suivi et pronostic</h2><p>Le suivi immédiat repose sur la trajectoire : respiration, pression, poids, diurèse, créatinine et électrolytes. Une amélioration clinique doit s’accompagner d’une vérification biologique ; inversement, une hématurie résiduelle n’indique pas à elle seule une aggravation si les autres paramètres évoluent favorablement. La fréquence des contrôles dépend de la sévérité initiale et de la stabilité ; elle n’est pas remplacée par un calendrier identique pour tous.</p><p>Après la phase aiguë, suivre les anomalies urinaires, la protéinurie, la fonction et le complément lorsqu’il était abaissé. KDIGO indique qu’un C3 encore bas au-delà de douze semaines peut motiver une biopsie pour rechercher notamment une glomérulopathie à C3. Ce repère n’autorise pas à attendre trois mois devant une créatinine ascendante, une protéinurie persistante importante ou une autre présentation atypique.</p><p>Le pronostic de la forme poststreptococcique typique de l’enfant est généralement favorable. Chez l’adulte âgé, diabétique ou porteur d’une infection active, la récupération peut être incomplète et la maladie rénale chronique persister. La biopsie renseigne l’activité et les cicatrices, mais son interprétation s’intègre à l’état clinique et aux comorbidités.</p><p>La prévention vise les infections et les expositions évitables, le traitement adapté des foyers identifiés, le bon usage des médicaments et la poursuite du suivi si pression, protéinurie ou fonction restent anormales. L’information au patient doit inclure les motifs de retour urgent : baisse nette des urines, essoufflement, aggravation rapide des œdèmes, symptômes neurologiques ou dégradation de l’état général.</p><h3>Situations particulières</h3><p><b>Enfant :</b> interpréter pression et fonction selon l’âge ; utiliser un recueil urinaire réalisable et distinguer les posologies pédiatriques des protocoles adultes. <b>Personne âgée ou diabétique :</b> rechercher une infection active parfois peu manifeste et une maladie rénale antérieure. <b>Grossesse :</b> toute hypertension avec atteinte rénale nouvelle justifie une évaluation obstétricale et néphrologique ; ne pas attribuer automatiquement le tableau à une infection récente ni transposer une prescription adulte sans vérification de grossesse. <b>Maladie chronique préalable :</b> documenter le niveau antérieur et maintenir le suivi après résolution de l’épisode aigu.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">Société suisse de néphrologie, 17.03.2025 — Figure 4, orientation néphrologique</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Points 1.1.1–1.1.3,1.2.1–1.2.8,1.3.1–1.3.2 ; pp.S30–S33</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Posologie, contre-indications, précautions et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — Indications, posologie, contre-indications, précautions</a>.</p><button class="pareto-btn ui" data-k="pareto-n00-12">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n00-13"><h2>13. Points clés et entraînement fédéral</h2><ol><li>Une urine sombre n’est pas encore une hématurie glomérulaire : confirmer et localiser.</li><li>Le syndrome néphritique est clinique ; la cause peut être infectieuse, immunologique ou différente du premier scénario évoqué.</li><li>La vitesse de variation de créatinine et la diurèse comptent autant que le chiffre isolé.</li><li>Rechercher sans délai surcharge pulmonaire, hyperkaliémie, atteinte neurologique et syndrome réno-pulmonaire.</li><li>Le complément et les anticorps orientent ; aucun résultat isolé ne remplace la confrontation clinique.</li><li>Les diurétiques soulagent la surcharge, les antibiotiques traitent une infection, et l’immunosuppression répond à une indication spécifique.</li><li>La récupération se vérifie par un suivi clinique et biologique, particulièrement si le tableau s’écarte d’une forme typique favorable.</li></ol><p id="n00-federal">La correspondance pédagogique avec <b>PROFILES 2017</b> porte sur les situations SSP 63 (anomalies de diurèse), SSP 64 (notamment hématurie), SSP 161 (marqueurs de fonction rénale), SSP 164 (sédiment anormal) et SSP 173 (protéinurie). Les exigences MEBEKO de l’examen 2026 associent connaissances et compétences cliniques dans un blueprint multidimensionnel. Les exercices ci-dessous sont des créations pédagogiques MEDINA, sans statut de question officielle ni correspondance CIM validée par la commission.</p><p><button class="w" data-k="n00-cas-1">Cas 1 — Quelle priorité devant une dyspnée et des urines sombres ?</button></p><p><button class="w" data-k="n00-cas-2">Cas 2 — ANCA positifs et fièvre persistante : quelle précaution ?</button></p><p><button class="w" data-k="n00-cas-3">Cas 3 — Le C3 reste bas : attendre ou réévaluer ?</button></p><p><button class="w" data-k="n00-cas-4">Cas 4 — Calculer une diurèse pondérale et un rapport urinaire</button></p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" rel="noopener" target="_blank">CIMS, PROFILES 2017 — pp.29 et 33 : SSP63,64,161,164,173</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" rel="noopener" target="_blank">MEBEKO, exigences édictées 03.03.2026 — §1 et 2.1, contenu et blueprint</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">Halfon et coll., Revue Médicale Suisse 2014 — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.253,265–269 ; définition, complications, soutien</a>.</p><button class="pareto-btn ui" data-k="pareto-n00-13">▲ Loi de Pareto — Le raisonnement essentiel</button><div class="quiz ui"><p>Dyspnée et créatinine rapidement ascendante : attendre la sérologie ?</p><button data-ok="1">Non : évaluer immédiatement la gravité et organiser les soins urgents.</button><button data-ok="0">Oui : la sérologie décide de toute l’orientation.</button><p class="fb" hidden="">Le bilan de cause accompagne la stabilisation ; il ne la retarde pas.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">Halfon et coll., Revue Médicale Suisse 2014 — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a>.</p><div class="quiz ui"><p>ANCA positifs avec fièvre et souffle : vascularite certaine ?</p><button data-ok="1">Non : une endocardite peut aussi donner des ANCA.</button><button data-ok="0">Oui : la positivité exclut une infection.</button><p class="fb" hidden="">La microbiologie, le contexte et parfois la biopsie évitent une immunosuppression inadaptée.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p><div class="quiz ui"><p>C3 bas et fonction qui s’aggrave : attendre douze semaines ?</p><button data-ok="1">Non : la trajectoire défavorable justifie une réévaluation précoce.</button><button data-ok="0">Oui : aucun bilan n’est utile avant ce délai.</button><p class="fb" hidden="">Le repère de persistance du complément n’est pas un délai d’attente obligatoire.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p><div class="quiz ui"><p>200 mL en 8 h chez 70 kg : quelle diurèse pondérale ?</p><button data-ok="1">Environ 0,36 mL/kg/h.</button><button data-ok="0">25 mL/kg/h.</button><p class="fb" hidden="">200 ÷ 8 = 25 mL/h ; 25 ÷ 70 ≈ 0,36 mL/kg/h.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2016/10/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2012 — §2.1, tableau 2 ; extrait du fournisseur Parallel réellement lu</a>.</p></section>
<section class="ilot" id="n00-14"><h2>14. Pièges à éviter</h2><table class="t"><thead><tr><th>Erreur</th><th>Pourquoi elle trompe</th><th>Correction du raisonnement</th></tr></thead><tbody><tr><td>Assimiler toute forme aiguë à une GN poststreptococcique</td><td>Le même syndrome a plusieurs causes</td><td>Vérifier chronologie, foyer actif, immunologie et évolution.</td></tr><tr><td>Exclure sur absence de cylindre ou d’œdème</td><td>Sensibilité imparfaite et présentation incomplète</td><td>Croiser sédiment, protéines, fonction et clinique.</td></tr><tr><td>Lire un <button class="w" data-k="n00-egfr">débit estimé</button> comme une mesure instantanée en phase aiguë</td><td>La créatinine n’est pas à l’état stationnaire</td><td>Suivre créatinine et diurèse dans le temps.</td></tr><tr><td>Interpréter ANCA positifs comme preuve suffisante de vascularite</td><td>Une endocardite peut aussi donner des ANCA</td><td>Rechercher l’infection si le contexte l’évoque.</td></tr><tr><td>Donner corticoïdes pour toute inflammation glomérulaire</td><td>Une infection active peut être aggravée ; bénéfice non établi dans la forme postinfectieuse courante</td><td>Fonder l’indication sur la cause et l’évaluation spécialisée.</td></tr><tr><td>Confondre reprise de diurèse sous furosémide et guérison</td><td>Le traitement modifie l’excrétion sans réparer directement le filtre</td><td>Suivre aussi fonction, pression, poids et électrolytes.</td></tr><tr><td>Remplacer une urgence par un traitement de fond oral</td><td>Une atteinte aiguë d’organe exige un environnement surveillé</td><td>Orienter immédiatement au niveau de soins adapté.</td></tr><tr><td>Utiliser un suffixe histologique sans preuve</td><td>Les sous-codes morphologiques ne sont pas des hypothèses</td><td>Conserver la distinction syndrome, cause et lésion documentée.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Une hypothèse cohérente reste une hypothèse tant que ses éléments discriminants ne sont pas vérifiés.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">HUG, médecine de premier recours, 2017 — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.253,265–269 ; définition, complications, soutien</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024 français — ClasseN00, blocN00–N08, modificateurS14 N00_4 et classes.0–.9</a>.</p><button class="pareto-btn ui" data-k="pareto-n00-14">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n00-annexe-cim"><h2>Annexe — Classer après le diagnostic clinique</h2><p>Dans la CIM-10-GM 2024 française diffusée par l’OFS, N00 est le syndrome néphritique aigu. La catégorie exclut notamment la néphrite tubulo-interstitielle aiguë (N10) et le syndrome néphritique sans précision (N05.-). Les subdivisions communes N00–N07 décrivent la morphologie ; .0 à .8 supposent normalement une identification précise par biopsie ou autopsie. Elles ne désignent pas dix maladies aiguës ayant chacune un traitement autonome.</p><table class="t"><thead><tr><th>Code</th><th>Modification morphologique</th><th>Lecture clinique</th></tr></thead><tbody><tr><td>N00.0</td><td>Anomalies glomérulaires mineures</td><td>Libellé morphologique ; ne pas déduire un syndrome néphrotique de ce seul suffixe.</td></tr><tr><td>N00.1</td><td>Lésions glomérulaires segmentaires et focales</td><td>Localisation de la lésion, pas preuve d’une cause.</td></tr><tr><td>N00.2</td><td>Glomérulonéphrite membraneuse diffuse</td><td>Morphologie à confronter au syndrome et au compte rendu.</td></tr><tr><td>N00.3</td><td>Glomérulonéphrite mésangio-proliférative diffuse</td><td>Une prolifération mésangiale n’identifie pas à elle seule l’IgA.</td></tr><tr><td>N00.4</td><td>Glomérulonéphrite proliférative endocapillaire diffuse</td><td>Compatible avec plusieurs causes, dont certaines infectieuses.</td></tr><tr><td>N00.5</td><td>Glomérulonéphrite mésangiocapillaire diffuse</td><td>Profil membranoprolifératif à explorer étiologiquement.</td></tr><tr><td>N00.6</td><td>Maladie à dépôt dense</td><td>Caractérisation spécialisée, non déduite d’un C3 bas isolé.</td></tr><tr><td>N00.7</td><td>Glomérulonéphrite diffuse en croissant</td><td>Lésion extracapillaire ; évaluer la cause et la rapidité clinique.</td></tr><tr><td>N00.8</td><td>Autres modifications morphologiques</td><td>Nécessite une description histologique appropriée.</td></tr><tr><td>N00.9</td><td>Type de modification morphologique non précisé</td><td>Ne transforme pas une hypothèse en preuve histologique.</td></tr></tbody></table><p>Le bloc autorise, selon le dossier, des codes supplémentaires pour certaines atteintes hypertensives, une maladie chronique ou une insuffisance rénale aiguë. Le choix final de codage suit la documentation et les règles applicables ; il ne pilote pas à lui seul le traitement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024 français — ClasseN00, blocN00–N08, modificateurS14 N00_4 et classes.0–.9</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></section>
</div></div>

<div class="panel" hidden="" id="pE"><div class="chap-body"><style>[data-n00-figure]{margin:1.2em 0;padding:1em;border:1px solid #b8c8d9;border-radius:12px;background:#fff}[data-n00-figure] [data-n00-frame]{position:relative;width:100%;max-width:850px;margin:auto;line-height:0}[data-n00-figure] [data-n00-frame="tall"]{max-width:420px}[data-n00-figure] img{display:block;width:100%;height:auto;margin:0}[data-n00-figure] [data-n00-mark]{position:absolute;transform:translate(-50%,-50%);background:#fff4be;color:#172f50;border:2px solid #172f50;border-radius:50%;width:1.6em;height:1.6em;display:flex;align-items:center;justify-content:center;font:bold 16px/1 sans-serif;box-shadow:0 0 0 2px #fff}[data-n00-figure] figcaption{line-height:1.6;margin-top:.8em;overflow-wrap:anywhere}[data-n00-figure] ol{padding-left:1.5em}[data-n00-figure] [data-n00-credit]{font-size:.85em}[data-n00-figure="podocytes"] [data-n00-mark="1"]{left:44%;top:21%}[data-n00-figure="podocytes"] [data-n00-mark="2"]{left:25%;top:57%}[data-n00-figure="podocytes"] [data-n00-mark="3"]{left:70%;top:83%}[data-n00-figure="nephron"] [data-n00-mark="1"]{left:33%;top:31%}[data-n00-figure="nephron"] [data-n00-mark="2"]{left:51%;top:61%}[data-n00-figure="nephron"] [data-n00-mark="3"]{left:75%;top:75%}[data-n00-figure="postinfect"] [data-n00-mark="1"]{left:58%;top:25%}[data-n00-figure="postinfect"] [data-n00-mark="2"]{left:77%;top:72%}[data-n00-figure="postinfect"] [data-n00-mark="3"]{left:40%;top:38%}[data-n00-figure="crescent"] [data-n00-mark="1"]{left:28%;top:46%}[data-n00-figure="crescent"] [data-n00-mark="2"]{left:38%;top:80%}[data-n00-figure="crescent"] [data-n00-mark="3"]{left:47%;top:42%}[data-n00-figure="sediment"] [data-n00-mark="1"]{left:24%;top:19%}[data-n00-figure="sediment"] [data-n00-mark="2"]{left:74%;top:20%}[data-n00-figure="sediment"] [data-n00-mark="3"]{left:25%;top:71%}[data-n00-figure="sediment"] [data-n00-mark="4"]{left:77%;top:75%}</style><section class="ilot" id="n00-e-urine"><h2>Lire l’urine : présence, origine, quantité</h2><p>L’urine répond à trois questions distinctes. <b>Y a-t-il des hématies ?</b> La bandelette détecte une activité liée à l’hème ; la microscopie ou la cytométrie confirme les cellules. <b>D’où viennent-elles ?</b> La morphologie et les cylindres orientent la localisation. <b>Quelle fuite protéique accompagne l’atteinte ?</b> La mesure quantitative apprécie le retentissement et fournit une valeur de suivi.</p><p>Recueillir une urine propre, en évitant la contamination génitale, et l’acheminer rapidement selon les consignes du laboratoire. L’ancienneté du prélèvement et une urine très concentrée peuvent altérer l’analyse morphologique. Le compte rendu doit préciser la méthode et les unités. Une valeur en hématies/µL se compare à la référence de cette méthode ; un résultat « par champ » ne se convertit pas sans connaître les conditions techniques.</p><table class="t"><thead><tr><th>Analyse</th><th>Résultat utile</th><th>Limite</th></tr></thead><tbody><tr><td>Bandelette sang</td><td>Dépistage d’hème</td><td>Hémoglobine ou myoglobine possibles sans hématies ; contamination à considérer.</td></tr><tr><td>Numération urinaire</td><td>Confirmation des hématies</td><td>Le CUEN utilise ≥ 10/mm³, soit ≥ 10000/mL ; la référence suisse du laboratoire prévaut.</td></tr><tr><td>Contraste de phase</td><td>Dysmorphie, notamment acanthocytes</td><td>HUG : &gt; 5 % d’acanthocytes oriente vers le glomérule ; résultat négatif peu sensible.</td></tr><tr><td>Cylindres érythrocytaires</td><td>Origine intrarénale fortement évocatrice d’atteinte glomérulaire</td><td>Absence non excluante ; ne pas confondre avec agrégats de cellules libres.</td></tr><tr><td>Rapport protéines/créatinine</td><td>Quantification sur échantillon</td><td>Variabilité du prélèvement et de l’excrétion de créatinine ; comparer des méthodes cohérentes.</td></tr><tr><td>Rapport albumine/créatinine</td><td>Part albuminurique de l’atteinte</td><td>Albuminurie et protéinurie totale ne sont pas des grandeurs interchangeables.</td></tr></tbody></table><figure data-n00-figure="sediment"><div data-n00-frame="wide"><img alt="Quatre photographies originales de cylindres urinaires : épithélial, granuleux, leucocytaire et érythrocytaire" loading="lazy" src="assets/img/n00/alpha/codex/RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg"/><span aria-hidden="true" data-n00-mark="1">1</span><span aria-hidden="true" data-n00-mark="2">2</span><span aria-hidden="true" data-n00-mark="3">3</span><span aria-hidden="true" data-n00-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Panneau a : cylindre de cellules épithéliales tubulaires, selon la légende source.</li><li>Panneau b : cylindre granuleux brun, selon la légende source.</li><li>Panneau c : cylindre leucocytaire, selon la légende source.</li><li>Panneau d : cylindre érythrocytaire, repère pertinent pour une atteinte glomérulaire.</li></ol><p>Original disponible en 567 × 337 pixels ; les cellules ne sont pas reclassées au-delà de la légende publiée. Source utilisée pour la figure, pas comme recommandation américaine de prise en charge.</p><p data-n00-credit="">V. Mohsenin, J Intensive Care 2017;5:57, figure de microscopie · <a href="https://commons.wikimedia.org/wiki/File:RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener" target="_blank">CC BY 4.0</a>. Original inchangé ; repères et légende ajoutés par superposition par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La figure illustre des types de cylindres, pas une grille diagnostique suffisante à elle seule. Le contexte, les autres cellules, la protéinurie et la fonction rénale déterminent la signification du sédiment. Une leucocyturie ne prouve pas une infection bactérienne et une culture positive ne permet pas d’ignorer une autre atteinte si le tableau reste discordant.</p><p>Pour un rapport urinaire, les unités se simplifient : protéines en mg/L divisées par créatinine en mmol/L donnent des mg/mmol. <button class="w" data-k="n00-calcul-ratio">Un exemple détaillé</button> montre le calcul et ses limites. KDIGO privilégie un rapport du premier matin chez l’enfant ; un recueil de 24 h peut être nécessaire chez l’adulte lorsque le changement de traitement dépend d’une quantification plus précise.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">HUG, médecine de premier recours, 2017 — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.118–120</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Points 1.1.1–1.1.3,1.2.1–1.2.8,1.3.1–1.3.2 ; pp.S30–S33</a>.</p></section>
<section class="ilot" id="n00-e-fonction"><h2>Fonction rénale et paramètres clés chiffrés</h2><p>La créatinine est un marqueur dont la concentration reflète une production et une élimination, pas un débit directement mesuré. Une valeur dans l’intervalle habituel du laboratoire peut déjà être anormale pour un patient si elle a nettement augmenté. Inversement, une valeur élevée ancienne ne démontre pas seule une atteinte aiguë. Rechercher la valeur de base, le délai et la diurèse.</p><p>La définition KDIGO de l’insuffisance rénale aiguë retient l’un des critères suivants : augmentation de créatinine ≥ 26,5 µmol/L en 48 h ; augmentation à ≥ 1,5 fois la valeur de base connue ou présumée dans les 7 jours ; ou diurèse &lt; 0,5 mL/kg/h pendant 6 h. Les seuils sont des critères diagnostiques, pas des limites en deçà desquelles toute atteinte rénale serait exclue.</p><table class="t"><thead><tr><th>Stade KDIGO</th><th>Créatinine</th><th>Diurèse</th></tr></thead><tbody><tr><td>1</td><td>1,5–1,9 fois la base ou hausse ≥ 26,5 µmol/L</td><td>&lt; 0,5 mL/kg/h pendant 6–12 h</td></tr><tr><td>2</td><td>2,0–2,9 fois la base</td><td>&lt; 0,5 mL/kg/h pendant ≥ 12 h</td></tr><tr><td>3</td><td>≥ 3 fois la base ; ou ≥ 353,6 µmol/L dans une atteinte aiguë répondant à la définition ; ou épuration extrarénale</td><td>&lt; 0,3 mL/kg/h pendant ≥ 24 h, ou <button class="w" data-k="n00-anurie">anurie</button>≥ 12 h</td></tr></tbody></table><p>Retenir le critère le plus sévère. Chez les moins de 18 ans, le tableau KDIGO ajoute pour le stade 3 un <button class="w" data-k="n00-egfr">débit estimé</button> &lt; 35 mL/min/1,73 m² ; ce repère pédiatrique s’interprète avec l’équipe spécialisée et ne résout pas les limites des équations en phase instable. La fenêtre initiale de diagnostic et la durée de progression du même épisode ne sont pas confondues.</p><p>Le potassium, les bicarbonates et, selon le contexte, les gaz du sang évaluent les complications. Une <button class="w" data-k="n00-hyperkaliemie">hyperkaliémie</button> avec anomalies électriques exige un traitement immédiat ; l’électrocardiogramme ne remplace pas le dosage. Les intervalles de référence de créatinine et de <button class="w" data-k="n00-complement">complément</button> dépendent du laboratoire et de la population : les lire sur le résultat, avec méthode, âge et unités, plutôt qu’inventer une « norme suisse » unique.</p><div class="key"><b>À retenir.</b> Exemple fictif : 150 ÷ 75 = 2 ; la créatinine a doublé. Pour 200 mL en 8 h chez 70 kg : 200 ÷ 8 ÷ 70 ≈ 0,36 mL/kg/h. La mesure et sa durée doivent être fiables.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.253,265–269 ; définition, complications, soutien</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2016/10/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2012 — §2.1, tableau 2 ; extrait du fournisseur Parallel réellement lu</a>.</p></section>
<section class="ilot" id="n00-e-immuno"><h2>Immunologie et infection : ce que le résultat change</h2><p>Le C3 et le C4 sont dosés pour reconnaître un profil de consommation du <button class="w" data-k="n00-complement">complément</button> et en suivre l’évolution. Une baisse de C3 est fréquente dans une forme <button class="w" data-k="n00-postinfectieux">postinfectieuse</button> ; d’autres maladies peuvent produire le même résultat. Un C3 normal n’exclut pas une atteinte glomérulaire. Une hypocomplémentémie persistante ou une évolution inhabituelle conduit à reconsidérer la cause, sans attendre un délai fixe si la fonction se détériore.</p><table class="t"><thead><tr><th>Hypothèse</th><th>Examens orientés</th><th>Ce qu’ils ne prouvent pas seuls</th></tr></thead><tbody><tr><td>Infection préalable ou persistante</td><td>Cultures du foyer si actif ; hémocultures si infection systémique ; anticorps antistreptococciques selon contexte</td><td>Une réponse sérologique ne prouve ni infection encore active ni causalité rénale exclusive.</td></tr><tr><td>Lupus</td><td>Anticorps antinucléaires, anti-ADN, C3/C4 et signes systémiques</td><td>Un résultat positif ne classe pas la lésion histologique.</td></tr><tr><td>Vascularite</td><td>ANCA avec spécificités anti-MPO/anti-PR3</td><td>Une infection, notamment <button class="w" data-k="n00-endocardite">endocardite</button>, peut donner des ANCA ; négativité et positivité doivent être contextualisées.</td></tr><tr><td>Maladie anti-membrane basale</td><td>Anticorps circulants et <button class="w" data-k="n00-biopsie">biopsie</button> selon urgence</td><td>L’atteinte pulmonaire n’est pas obligatoire ; l’évaluation clinique reste immédiate.</td></tr><tr><td>Cryoglobulinémie ou infection virale</td><td>Cryoglobulines, sérologies orientées et conditions de prélèvement du laboratoire</td><td>Une sérologie isolée ne prouve pas le mécanisme de la lésion rénale.</td></tr></tbody></table><p>Devant une fièvre prolongée, un souffle nouveau, du matériel intracardiaque ou un foyer profond, rechercher une <button class="w" data-k="n00-endocardite">endocardite</button> ou une autre infection active avant d’interpréter un profil immunologique comme une auto-immunité primaire. La <button class="w" data-k="n00-biopsie">biopsie</button>, la microbiologie et l’imagerie cardiaque éventuelle sont complémentaires. Les traitements urgents se coordonnent avec ces prélèvements.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.186–187 ; GN aiguë postinfectieuse et tests</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></section>
<section class="ilot" id="n00-e-biopsie"><h2>Échographie et biopsie : deux niveaux de réponse</h2><p>L’échographie répond à une question anatomique : existe-t-il une obstruction, quelle est l’apparence des reins et peut-on préparer un prélèvement ? Elle ne montre pas les dépôts immuns et ne permet pas d’exclure une glomérulonéphrite si elle paraît normale. La biopsie répond à la question tissulaire : quel compartiment est lésé, quelles lésions sont actives, quels dépôts sont présents et quelles cicatrices limitent la récupération ?</p><p>La décision est prise avec le néphrologue. Une progression rapide, une présentation atypique, un diagnostic incertain ou une décision thérapeutique dépendant de l’histologie renforcent son intérêt. Avant le geste, examiner pression, hémostase, traitements antithrombotiques, anatomie et risque infectieux ; les modalités d’arrêt des médicaments et la voie de prélèvement relèvent du protocole du centre et de l’évaluation du risque individuel.</p><p>L’analyse combine microscopie optique, <button class="w" data-k="n00-immunofluorescence">immunofluorescence</button> et, si nécessaire, microscopie électronique. Une prolifération endocapillaire décrit un aspect ; des dépôts d’IgA, de C3 ou d’IgG linéaires apportent d’autres informations. Une photographie d’une coupe PAS ne permet pas à elle seule de diagnostiquer le type de dépôt. Les complications hémorragiques justifient information, surveillance et réévaluation d’une douleur, d’une hématurie importante ou d’un trouble circulatoire après le geste.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.253,265–269 ; définition, complications, soutien</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Points 1.1.1–1.1.3,1.2.1–1.2.8,1.3.1–1.3.2 ; pp.S30–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></section>
</div></div><div class="panel" hidden="" id="pS"><div class="sci-bar ui" role="tablist"><button aria-controls="n00-s-semio" aria-selected="true" data-s="n00-s-semio" id="n00-tab-semio" role="tab">Sémiologie fondamentale et analytique</button><button aria-controls="n00-s-anat" aria-selected="false" data-s="n00-s-anat" id="n00-tab-anat" role="tab">Anatomie</button><button aria-controls="n00-s-histo" aria-selected="false" data-s="n00-s-histo" id="n00-tab-histo" role="tab">Histologie</button><button aria-controls="n00-s-physio" aria-selected="false" data-s="n00-s-physio" id="n00-tab-physio" role="tab">Physiologie</button><button aria-controls="n00-s-bio" aria-selected="false" data-s="n00-s-bio" id="n00-tab-bio" role="tab">Biochimie</button><button aria-controls="n00-s-immuno" aria-selected="false" data-s="n00-s-immuno" id="n00-tab-immuno" role="tab">Immunologie</button></div><div class="chap-body sci-body"><div aria-labelledby="n00-tab-semio" class="sci" id="n00-s-semio" role="tabpanel"><section class="ilot" data-semiology="normal" id="n00-semio-normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>Le glomérule normal laisse former un filtrat sans cellules sanguines, puis les tubules en modifient la composition. La diurèse finale est donc le résultat d’une filtration, d’une réabsorption et de sécrétions ; elle n’est pas une mesure directe de la filtration. Cette normalité permet de comprendre les signes : hématies urinaires et protéines évoquent une anomalie de barrière, tandis que baisse de diurèse et rétention hydrosodée renseignent sur le fonctionnement global.</p><p>Une pression et un poids habituels, des urines sans hématurie pathologique et une fonction stable servent de points de comparaison. Les références biologiques sont celles du laboratoire avec âge et méthode. Le cours ne définit pas un glomérule malade par un seul chiffre de créatinine ou par la seule couleur des urines.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax, Anatomy and Physiology, §25.4 — Corpuscule rénal, barrière, tubule proximal, anse et collecteur</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–171, tableau 1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.253,265–269 ; définition, complications, soutien</a>.</p></section>
<section class="ilot" data-semiology="signs" id="n00-semio-signs"><h3>Décrire les signes avant de les interpréter</h3><p>Une hématurie peut être microscopique ou visible. La coloration brunâtre, l’absence de caillots et une atteinte de toute la miction sont compatibles avec une origine glomérulaire ; décrire aussi douleur, brûlure, contamination possible et temporalité. L’oligurie est quantifiée sur une durée connue et rapportée au poids quand le critère le demande. Les œdèmes sont localisés, datés et confrontés au poids. La dyspnée et les symptômes neurologiques exigent une appréciation de gravité plutôt qu’une simple liste descriptive.</p><p>La chronologie relie les signes : hématurie contemporaine d’une infection ORL, épisode après intervalle libre, fièvre persistante ou signes systémiques préexistants n’orientent pas de la même manière. Aucun de ces scénarios ne remplace la confirmation du syndrome et l’exclusion d’une complication menaçante.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">HUG, médecine de premier recours, 2017 — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.118–120</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.179–180 ; néphropathie à IgA</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">KDIGO, groupe international, 2021 — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></section>
