<template data-pop="n00-nephritique-nephrotique" data-title="Néphritique et néphrotique : distinguer sans opposer"><p>Le syndrome néphritique met au premier plan une hématurie glomérulaire, une protéinurie et un retentissement inflammatoire rénal ou hydrosodé. Le syndrome néphrotique met au premier plan une protéinurie importante et une hypoalbuminémie. L’œdème peut être présent dans les deux ; il ne suffit donc pas à les séparer.</p><p>Les formes mixtes existent. Mesurer la protéinurie et l’albuminémie permet de reconnaître une composante néphrotique et d’en discuter les risques propres. Les seuils diffèrent selon âge, méthode et référentiel ; un chiffre de protéinurie n’identifie pas à lui seul la cause histologique.</p><p>Conséquence : ne pas appliquer automatiquement le traitement d’un syndrome néphrotique idiopathique à une hématurie avec insuffisance rénale aiguë. Le sédiment et la dynamique de fonction restent déterminants.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–171, tableau 1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="n00-sediment" data-title="Acanthocytes et cylindres : indices de localisation"><p>Un acanthocyte est une hématie dysmorphique dont les protrusions orientent vers un passage glomérulaire. Les HUG retiennent notamment plus de 5 % d’acanthocytes ou des cylindres hématiques comme arguments d’origine glomérulaire. La méthode, la fraîcheur du prélèvement et sa concentration influencent la morphologie.</p><p>Un cylindre érythrocytaire est un moulage tubulaire contenant des hématies. Il apporte un argument fort pour une origine intrarénale de type glomérulaire dans ce contexte. Des cellules libres agglutinées ne constituent pas automatiquement un cylindre.</p><p>L’absence de ces signes n’exclut pas la maladie : leur sensibilité est limitée. La protéinurie, la fonction et la clinique permettent d’interpréter un sédiment pauvre ou équivoque.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">CH-SEDIMENT — pp.1–4 ; définitions et algorithme</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — Points 1.1.1–1.1.3,1.2.1–1.2.8,1.3.1–1.3.2 ; pp.S30–S33</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMATURIA — pp.118–120</a>.</p></template>
<template data-pop="n00-croissant" data-title="Croissant extracapillaire : lieu, activité, conséquence"><p>Le croissant se développe dans l’espace urinaire de Bowman lorsque des lésions capillaires sévères entraînent une réaction cellulaire extracapillaire. Les cellules épithéliales pariétales, les cellules inflammatoires et la fibrine participent à cette lésion. Il ne s’agit pas simplement d’un glomérule « plus gros ».</p><p>Une lésion cellulaire active et une cicatrice fibreuse ne sont pas équivalentes pour le pronostic. La biopsie précise l’étendue des lésions et leurs caractères ; un seul champ photographique ne permet pas de quantifier la proportion de croissants dans tous les reins.</p><p>Plusieurs maladies peuvent produire des croissants. L’immunofluorescence, les anticorps et le contexte infectieux ou systémique orientent la cause et le traitement. Le mot « croissant » n’autorise pas une immunosuppression uniforme.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">CH-URGENCE — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-RPGN — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></template>
<template data-pop="n00-calcul-ratio" data-title="Rapport protéines/créatinine : calcul et limites"><p><b>Grandeurs.</b> La concentration de protéines urinaires est exprimée en mg/L ; la créatinine urinaire en mmol/L. Les deux proviennent du même prélèvement. Leur rapport réduit l’effet de dilution commun, sans supprimer la variabilité biologique.</p><p><b>Formule.</b> Rapport en mg/mmol = protéines en mg/L ÷ créatinine en mmol/L. Le litre est au numérateur et au dénominateur : il s’annule.</p><p><b>Exemple fictif.</b>1200 mg/L ÷ 6 mmol/L = 200 mg/mmol. Le résultat n’est ni une concentration de 200 mg/L, ni une excrétion de 200 mg/24 h. Pour interpréter, préciser protéinurie totale ou albuminurie, âge et contexte.</p><p>Un prélèvement ponctuel peut varier ; chez l’enfant, le premier matin est souvent privilégié. Chez l’adulte, un recueil prolongé peut être nécessaire si la décision d’intensifier un traitement dépend d’une quantification précise. Ne pas comparer des unités différentes sans conversion validée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — Points 1.1.1–1.1.3,1.2.1–1.2.8,1.3.1–1.3.2 ; pp.S30–S33</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–171, tableau 1</a>.</p></template>
<template data-pop="n00-filtre" data-title="Trois couches, une barrière"><p>Endothélium capillaire, membrane basale et pédicelles des podocytes constituent la barrière entre sang et espace urinaire. Le filtre laisse former un liquide initial sans cellules sanguines ; la lésion de ses constituants peut associer hématurie et protéinurie.</p><p>Le filtre n’est pas le tubule : une modification de l’excrétion sous diurétique n’établit pas la réparation de la barrière. La morphologie, la protéinurie et la trajectoire de fonction apportent des informations complémentaires.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-FILTRE — Corpuscule rénal, barrière, tubule proximal, anse et collecteur</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">EU-IRA — pp.253,265–269 ; définition, complications, soutien</a>.</p></template>
<template data-pop="n00-complement" data-title="C3/C4 : concentration circulante et mécanisme"><p>Le dosage sérique du complément apporte un indice de consommation ou de perturbation immunologique. Une baisse de C3 est fréquente dans certaines formes postinfectieuses, mais n’est pas spécifique. Le lupus, une infection active ou une maladie du complément peuvent demander un autre raisonnement.</p><p>La normalité du complément n’exclut pas toutes les glomérulonéphrites. Les dépôts tissulaires et les concentrations circulantes sont deux informations différentes. Un C3 encore bas après douze semaines peut motiver une investigation complémentaire ; une aggravation rénale conduit à agir plus tôt.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-POSTINF — pp.186–187 ; GN aiguë postinfectieuse et tests</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-RPGN — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></template>
<template data-pop="n00-anurie" data-title="Absence d’urine : vérifier le mécanisme et agir"><p>Une absence d’émission d’urine impose de distinguer défaut de production et obstacle ou rétention. L’examen et l’échographie participent à cette distinction. La durée importe pour les critères de sévérité : une anurie d’au moins douze heures est un critère urinaire de stade 3 KDIGO.</p><p>Ne pas attendre cette durée pour prendre en charge un patient instable. Hyperkaliémie, surcharge pulmonaire et acidose peuvent imposer une intervention immédiate. La FI de Lasix mentionne la défaillance rénale avec anurie parmi les contre-indications ; l’escalade automatique du produit n’est pas une réponse universelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">EU-IRA — pp.253,265–269 ; définition, complications, soutien</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2016/10/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">INT-AKI — §2.1, tableau 2 ; extrait du fournisseur Parallel réellement lu</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">FI-LASIX-IV — Posologie, contre-indications, précautions et mécanisme</a>.</p></template>
<template data-pop="n00-hyperkaliemie" data-title="Le potassium : une complication potentiellement silencieuse"><p>La baisse d’élimination rénale du potassium, certains médicaments et les transferts cellulaires peuvent favoriser une élévation plasmatique. Une hématurie discrète n’exclut pas cette complication. Le dosage et l’électrocardiogramme répondent à deux questions : quelle concentration et quel retentissement électrique ?</p><p>Des modifications de conduction exposent à un arrêt circulatoire et justifient un traitement immédiat. La décision d’épuration dépend de la gravité et de la réponse, et non d’un seuil isolé de créatinine. Un conseil alimentaire ou un supplément potassique doit être reconsidéré dans ce contexte.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">EU-IRA — pp.253,265–269 ; définition, complications, soutien</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">FI-LASIX-IV — Posologie, contre-indications, précautions et mécanisme</a>.</p></template>
<template data-pop="n00-biopsie" data-title="Ce que la biopsie ajoute"><p>La biopsie ne sert pas seulement à donner un nom. Elle décrit les lésions actives, les dépôts et les cicatrices, ce qui peut modifier le traitement et le pronostic. Son indication dépend de l’incertitude, de la vitesse d’évolution et de la conséquence attendue pour la décision.</p><p>La préparation vérifie notamment pression, hémostase, traitements, anatomie et infection. Les modalités sont adaptées par le centre. Microscopie optique, immunofluorescence et électronique se complètent ; une coupe sélectionnée n’épuise pas l’information du prélèvement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — Points 1.1.1–1.1.3,1.2.1–1.2.8,1.3.1–1.3.2 ; pp.S30–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></template>
<template data-pop="n00-endocardite" data-title="Une infection peut imiter une vascularite"><p>Une glomérulonéphrite d’endocardite peut associer atteinte rénale, complément bas et parfois ANCA. Une fièvre persistante, un souffle nouveau, une valve prothétique ou un foyer infectieux modifient donc l’interprétation d’une sérologie.</p><p>Rechercher l’infection par les examens adaptés, sans donner automatiquement une immunosuppression sur le seul résultat immunologique. Le traitement du foyer et la prise en charge de la complication rénale sont coordonnés. Le schéma oral d’une pharyngite ne traite pas une endocardite.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680370570018" rel="noopener" target="_blank">FI-OSPEN — Indications, posologie, contre-indications et précautions</a>.</p></template>
<template data-pop="n00-egfr" data-title="Pourquoi l’estimation de filtration devient fragile"><p>Les équations d’estimation reposent notamment sur une créatinine qui reflète un état relativement stable. Lorsque la concentration change rapidement, elle est en transition : le résultat calculé n’est pas une mesure instantanée fiable de la filtration.</p><p>En phase aiguë, suivre la créatinine, son délai de variation, la diurèse et les complications. Une comparaison à la valeur antérieure est souvent plus instructive qu’un nombre de débit isolé. Ne pas dater une atteinte rénale sur ce résultat seul.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">EU-IRA — pp.253,265–269 ; définition, complications, soutien</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2016/10/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">INT-AKI — §2.1, tableau 2 ; extrait du fournisseur Parallel réellement lu</a>.</p></template>
<template data-pop="n00-postinfectieux" data-title="Après infection ou pendant l’infection ?"><p>La forme postinfectieuse classique suit un intervalle libre après une infection. KDIGO décrit aussi des glomérulonéphrites pendant une infection active. Cette distinction est essentielle chez l’adulte, notamment avec comorbidités ou foyer profond.</p><p>La figure 56 de KDIGO rapporte un antécédent de pharyngite résolue une à deux semaines auparavant, ou d’impétigo quatre à six semaines auparavant. Ces délais sont des indices de la forme classique, pas des critères suffisants ni un calendrier valable pour toutes les infections. Rechercher un foyer toujours actif et vérifier la trajectoire.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-POSTINF — pp.186–187 ; GN aiguë postinfectieuse et tests</a>.</p></template>
<template data-pop="n00-albuminurie" data-title="Albumine et protéines totales : deux mesures"><p>La protéinurie totale additionne différentes protéines ; l’albuminurie en mesure une composante. Une prédominance d’albumine oriente vers le filtre glomérulaire, mais ne détermine pas seule la cause. Les rapports urinaires doivent être identifiés par leur numérateur et leur unité.</p><p>Ne pas utiliser une valeur de protéines totales dans un seuil défini pour l’albumine. Une protéinurie abondante avec hypoalbuminémie peut révéler une composante néphrotique associée, dont les risques se discutent séparément.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–171, tableau 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — Points 1.1.1–1.1.3,1.2.1–1.2.8,1.3.1–1.3.2 ; pp.S30–S33</a>.</p></template>
<template data-pop="n00-hemorragie" data-title="La dyspnée n’est pas toujours une surcharge"><p>Dans un syndrome réno-pulmonaire, une atteinte des capillaires alvéolaires peut provoquer un saignement pulmonaire. La dyspnée, l’anémie et parfois l’hémoptysie orientent ; l’expectoration sanglante n’est pas nécessairement présente dès le début.</p><p>Chez un patient glomérulaire, la surcharge hydrosodée est une autre cause de dyspnée. L’évaluation clinique, biologique et thoracique doit distinguer les mécanismes sans retarder les soins urgents. La maladie anti-membrane basale peut atteindre rein et poumon, mais certaines formes restent rénales.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">CH-URGENCE — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-RPGN — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a>.</p></template>
<template data-pop="n00-pauci" data-title="Peu de dépôts visibles, pas absence d’immunité"><p>Le terme pauci-immun décrit une faible quantité de dépôts immunitaires détectables dans le tissu, en contraste avec des dépôts granuleux ou linéaires abondants. Il ne signifie pas que le processus ne soit pas immunologique.</p><p>Les vascularites associées aux ANCA peuvent produire ce profil. L’interprétation relie histologie, sérologies, signes extrarénaux et recherche d’infection. Un nom de profil histologique ne doit pas être transformé en prescription sans contexte.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-RPGN — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">CH-URGENCE — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a>.</p></template>
<template data-pop="n00-dysmorphie" data-title="La forme des hématies comme indice"><p>La morphologie des hématies urinaires peut être modifiée après leur passage par le filtre glomérulaire. Les acanthocytes sont particulièrement utiles dans cette orientation ; les HUG décrivent aussi des profils mixtes ou indéterminés.</p><p>Un échantillon ancien ou concentré rend l’interprétation moins fiable. Préciser la méthode, confronter la morphologie à la protéinurie et à la fonction, et ne pas transformer l’absence de dysmorphie en exclusion définitive.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">CH-SEDIMENT — pp.1–4 ; définitions et algorithme</a>.</p></template>
<template data-pop="n00-surcharge" data-title="Le bilan sodé et hydrique devient visible"><p>Lorsque les apports de sodium et d’eau dépassent l’excrétion, le volume extracellulaire augmente. La prise de poids, les œdèmes et l’hypertension sont des manifestations du bilan positif ; la congestion pulmonaire peut en être une complication grave.</p><p>Ce mécanisme ne requiert pas une hypoalbuminémie profonde. Le traitement vise les apports et l’excrétion sous surveillance, sans déplétion excessive ni remplissage automatique. Une résistance avec menace respiratoire peut conduire à l’épuration extrarénale.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">EU-IRA — pp.253,265–269 ; définition, complications, soutien</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">FI-LASIX-IV — Posologie, contre-indications, précautions et mécanisme</a>.</p></template>
<template data-pop="n00-immunofluorescence" data-title="Voir où se trouvent les protéines immunitaires"><p>Cette technique utilise des anticorps pour rechercher dans le tissu les immunoglobulines, certains composants du complément et d’autres marqueurs. La disposition du signal — granuleuse, linéaire ou peu abondante — contribue à orienter le mécanisme.</p><p>Elle complète la microscopie optique, qui décrit notamment prolifération et cicatrices, et la microscopie électronique, qui précise l’ultrastructure. La coloration PAS d’une photographie ne montre pas directement un signal d’IgG ou de C3.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-RPGN — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></template>


<template data-pop="n00-cas-1" data-title="Cas 1 — La priorité est la menace respiratoire"><p><b>Question originale.</b> Une personne présente des urines sombres, une créatinine ascendante et une dyspnée nouvelle. Faut-il attendre la sérologie antistreptococcique avant d’orienter ?</p><p><b>Réponse raisonnée : non.</b> Évaluer immédiatement respiration, saturation, pression, état circulatoire, diurèse, potassium et fonction. La surcharge pulmonaire est une possibilité ; une hémorragie alvéolaire doit aussi être envisagée dans un contexte glomérulaire rapide. Une atteinte menaçante nécessite une prise en charge hospitalière urgente.</p><p>Les prélèvements de cause se poursuivent en parallèle. Une sérologie ne sécurise pas la respiration et son résultat ne doit pas devenir un préalable à l’orientation. Le raisonnement porte d’abord sur l’organe menacé, puis sur la cause qui déterminera le traitement spécifique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">CH-URGENCE — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-RPGN — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">EU-IRA — pp.253,265–269 ; définition, complications, soutien</a>.</p></template>
<template data-pop="n00-cas-2" data-title="Cas 2 — Des ANCA ne suffisent pas à décider"><p><b>Question originale.</b> Une personne avec hématurie glomérulaire, fièvre prolongée et souffle cardiaque a des ANCA positifs. Peut-on conclure à une vascularite primaire ?</p><p><b>Réponse raisonnée : pas sur ce résultat seul.</b> KDIGO rapporte des ANCA dans certaines glomérulonéphrites d’endocardite. Le contexte impose de rechercher une infection active : microbiologie, foyer et exploration cardiaque selon l’évaluation clinique. La biopsie peut aider à comprendre la lésion rénale.</p><p>Le piège serait une immunosuppression automatique fondée sur un test positif. La conduite correcte articule recherche infectieuse, évaluation rénale urgente et décision spécialisée ; elle ne consiste ni à ignorer la vascularite possible, ni à négliger l’infection.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-RPGN — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a>.</p></template>
<template data-pop="n00-cas-3" data-title="Cas 3 — Suivi du complément et dynamique rénale"><p><b>Question originale.</b> Le C3 reste bas après une hypothèse de glomérulonéphrite postinfectieuse. La créatinine augmente à nouveau. Faut-il attendre douze semaines avant de réévaluer ?</p><p><b>Réponse raisonnée : non.</b> La persistance d’un C3 bas au-delà de douze semaines est un repère pouvant conduire à une biopsie pour rechercher notamment une maladie du complément. Ce repère n’est pas un délai d’attente obligatoire. Une aggravation de fonction ou une présentation atypique justifie une réévaluation plus précoce.</p><p>Suivre conjointement fonction, pression, diurèse et protéinurie. Le complément apporte un indice sur la trajectoire immunologique, mais ne remplace pas les signes d’atteinte active ni les décisions urgentes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-ORIENTATION — Figure 4, orientation néphrologique</a>.</p></template>
<template data-pop="n00-cas-4" data-title="Cas 4 — Deux calculs, deux questions"><p><b>Données fictives.</b> Un adulte de 70 kg émet 200 mL en 8 h ; son échantillon urinaire contient 1200 mg/L de protéines et 6 mmol/L de créatinine.</p><p><b>Diurèse.</b> Diviser le volume par le temps puis par le poids : 200 ÷ 8 = 25 mL/h ; 25 ÷ 70 ≈ 0,36 mL/kg/h. Ce résultat est inférieur à 0,5 mL/kg/h pendant une fenêtre de 8 h, si le recueil est fiable. Il répond à une question de fonction et de sévérité aiguë.</p><p><b>Protéinurie.</b>1200 ÷ 6 = 200 mg/mmol. Le rapport répond à une question de fuite protéique. Il ne donne pas le volume urinaire, et le premier calcul ne quantifie pas les protéines.</p><p><b>Interprétation.</b> Retenir le stade le plus sévère entre critères de créatinine et de diurèse, vérifier la fiabilité des mesures et rechercher la cause. Aucun de ces calculs ne remplace l’examen clinique ou le sédiment.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2016/10/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">INT-AKI — §2.1, tableau 2 ; extrait du fournisseur Parallel réellement lu</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — Points 1.1.1–1.1.3,1.2.1–1.2.8,1.3.1–1.3.2 ; pp.S30–S33</a>.</p></template>
<template data-pop="pareto-n00-1" data-title="Point essentiel 1"><p>Le syndrome associe signes glomérulaires et retentissement aigu ; la cause reste à établir.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–171, tableau 1</a>.</p></template>
<template data-pop="pareto-n00-2" data-title="Point essentiel 2"><p>Ne pas transposer un chiffre de cohorte, de microhématurie ou de progression rapide à tous les syndromes néphritiques suisses.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></template>
<template data-pop="pareto-n00-3" data-title="Point essentiel 3"><p>Lésion du filtre, baisse de filtration et rétention hydrosodée expliquent des signes différents.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="pareto-n00-4" data-title="Point essentiel 4"><p>Sécuriser, localiser, orienter la cause et suivre la dynamique ; mener ces tâches en parallèle si le patient est grave.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">CH-URGENCE — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a>.</p></template>
<template data-pop="pareto-n00-5" data-title="Point essentiel 5"><p>La chronologie infectieuse et les signes extrarénaux orientent ; un scénario plausible n’est pas une preuve.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></template>
<template data-pop="pareto-n00-6" data-title="Point essentiel 6"><p>Décrire respiration, conscience, pression, poids, diurèse et indices de cause ; ne pas s’arrêter aux œdèmes.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">CH-URGENCE — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a>.</p></template>
<template data-pop="pareto-n00-7" data-title="Point essentiel 7"><p>Néphritique, néphrotique, rapidement progressif et réno-pulmonaire peuvent se superposer.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–171, tableau 1</a>.</p></template>
<template data-pop="pareto-n00-8" data-title="Point essentiel 8"><p>Confirmer les hématies et leur origine ; comparer la créatinine à la base et décider de la biopsie selon le contexte.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">CH-SEDIMENT — pp.1–4 ; définitions et algorithme</a>.</p></template>
<template data-pop="pareto-n00-9" data-title="Point essentiel 9"><p>Chaque examen répond à une question : gravité, localisation, mécanisme ou cause.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — Points 1.1.1–1.1.3,1.2.1–1.2.8,1.3.1–1.3.2 ; pp.S30–S33</a>.</p></template>
<template data-pop="pareto-n00-10" data-title="Point essentiel 10"><p>Le complément oriente, les anticorps contextualisent ; une infection peut imiter une vascularite.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></template>
<template data-pop="pareto-n00-11" data-title="Point essentiel 11"><p>Soutenir les fonctions vitales, traiter la surcharge et la cause ; pas de corticothérapie universelle.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></template>
<template data-pop="pareto-n00-12" data-title="Point essentiel 12"><p>Suivre fonction, pression, protéines et complément ; une aggravation n’attend pas le contrôle tardif.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></template>
