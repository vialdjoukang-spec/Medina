<template data-pop="g97-sm-orthostatisme" data-title="Céphalée orthostatique : délai, posture et valeur">
<div class="lab">Technique</div><p>Le médecin interroge le patient sur l’heure de début par rapport à la ponction. Il lui demande ensuite ce qui se passe quand il s’assoit, se lève puis se recouche, et il observe la réponse au changement de position.</p>
<div class="lab">Mécanisme</div><p>La fuite abaisse la pression et le volume du liquide céphalorachidien ; une vasodilatation intracrânienne compensatrice est tenue pour responsable de la douleur, sans que le mécanisme exact soit connu [S8].</p>
<div class="lab">Valeur</div><p>Dans une cohorte danoise de 75 céphalées après 1021 rachianesthésies, 65 % débutaient dans les 24 heures et 92 % dans les 48 heures ; chez les 60 % guéris spontanément, la durée moyenne était de 5 jours (1 à 12 jours) [S31]. Seules 8 parturientes sur 142 n’avaient aucune composante posturale [S5]. Aucune sensibilité ni spécificité n’est publiée dans les sources lues.</p>
<div class="lab">Piège</div><p>La classification précise que l’orthostatisme ne peut pas servir de critère diagnostique [S2]. Le critère est le délai de 5 jours, mais le consensus rappelle qu’une céphalée peut apparaître plus tard ; une céphalée tardive fait alors envisager l’imagerie [S5].</p>
<p class="src">Références : ICHD-3, rubrique 7.2 ; Lybecker et collaborateurs, 1995 ; Uppal et collaborateurs, 2023 ; Thon et collaborateurs, 2024.</p></template>
<template data-pop="g97-sm-signes-associes" data-title="Raideur de nuque, acouphènes et hypoacousie">
<div class="lab">Technique</div><p>Le médecin recherche une raideur à la flexion passive de la nuque. Il demande au patient s’il entend des bourdonnements ou s’il entend moins bien, et il note toute plainte visuelle.</p>
<div class="lab">Valeur</div><p>La classification décrit ces symptômes comme habituels [S3]. Dans une série de 30 formes chroniques de Fribourg-en-Brisgau, on relevait une raideur de nuque chez 30 %, des acouphènes chez 27 % et des nausées chez 47 % [S26] ; ces chiffres ne s’appliquent pas à la forme aiguë.</p>
<div class="lab">Conséquence</div><p>Une hypoacousie ou une atteinte d’un nerf crânien est un symptôme neurologique sévère qui fait envisager un blood patch (grade C) [S5].</p>
<div class="lab">Piège</div><p>La raideur de nuque ne dispense jamais de rechercher un déficit focal, un trouble visuel, une altération de la conscience ou une crise [S5].</p>
<p class="src">Références : ICHD-3, rubrique 7.2.1 ; Uppal et collaborateurs, 2023 ; Kraus et collaborateurs, 2024.</p></template>
<template data-pop="g97-sm-hematome-examen" data-title="Hématome épidural postopératoire : examen répété et daté">
<div class="lab">Technique</div><p>Le médecin cote la force de chaque groupe musculaire des membres inférieurs de 0 à 5, examine la sensibilité et interroge sur la miction et la continence. Il compare chaque résultat au précédent et note l’heure.</p>
<div class="lab">Échelle</div><p>0 : aucune contraction ; 1 : contraction visible ou palpable ; 2 : mouvement sans pesanteur ; 3 : mouvement contre la pesanteur ; 4 : mouvement contre résistance ; 5 : force normale. Les grades 4−, 4 et 4+ indiquent une résistance faible, moyenne ou forte [S33].</p>
<div class="lab">Valeur</div><p>La séquence douleur axiale, radiculalgie, faiblesse puis troubles sphinctériens est typique, le plus souvent dans les 24 à 48 heures [S11]. Elle n’est pas chiffrée en sensibilité.</p>
<div class="lab">Conduite</div><p>Une dégradation impose une IRM en urgence ; une compression confirmée impose une évacuation aussi rapide que possible [S11].</p>
<p class="src">Références : Djurasovic et collaborateurs, 2021 ; Medical Research Council, mémorandum n° 45.</p></template>
<template data-pop="g97-sm-cms" data-title="Syndrome de mutisme cérébelleux : les quatre domaines">
<div class="lab">Définition</div><p>Le syndrome comporte quatre domaines : le trouble de la parole postopératoire, symptôme cardinal, les troubles émotionnels, l’ataxie et l’hypotonie [S18].</p>
<div class="lab">Technique</div><p>La parole est classée en habituelle, réduite ou absente. Une parole réduite se limite à des mots isolés ou à des phrases courtes obtenus seulement sous forte stimulation [S18 ; S16].</p>
<div class="lab">Valeur</div><p>Dans la cohorte européenne de 376 enfants, 30 % présentaient un trouble de la parole ; le mutisme débutait au jour 1 en médiane (0 à 10 jours) et la parole réduite au jour 0 (0 à 4 jours) [S16].</p>
<div class="lab">Piège</div><p>La parole préopératoire sert de référence. Sans elle, un enfant mutique pour une autre raison serait classé à tort.</p>
<p class="src">Références : Grønbæk et collaborateurs, 2021 ; Laustsen et collaborateurs, 2026.</p></template>
<template data-pop="g97-sm-surdrainage" data-title="Surdrainage : signes cliniques et radiologiques">
<div class="lab">Signes</div><p>Céphalée dépendante de la posture, nausées et vomissements, et/ou ventricules fins et collections sous-durales à l’imagerie [S13].</p>
<div class="lab">Limite</div><p>Aucune définition consensuelle n’existe ; l’incidence rapportée varie énormément et le phénomène est probablement sous-estimé [S13].</p>
<p class="src">Références : Hornshoej Pedersen et collaborateurs, 2023.</p></template>
