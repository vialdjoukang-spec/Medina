<template data-pop="g64-sm-paresth" data-title="Fourmillements et engourdissement">
<div class="lab">Définition</div><p>Les paresthésies sont des sensations anormales sans stimulus (fourmillements, picotements) ; l’hypoesthésie est une diminution de la sensibilité au contact [S14][S2].</p>
<div class="lab">Mécanisme</div><p>La polyneuropathie la plus fréquente résulte d’un processus axonal longueur-dépendant qui commence aux jambes [S14]. Les fibres les plus longues, celles des pieds, sont donc touchées en premier.</p>
<div class="lab">Caractérisation</div><p>Le médecin demande le site de début, la symétrie, la vitesse d’extension et le moment de la journée. Il note si la plainte remonte en chaussettes puis atteint les mains [S14].</p>
<div class="lab">Valeur et piège</div><p>Les sources lues ne chiffrent pas la valeur de ce symptôme. Un début aux bras oriente vers une autre cause que le diabète ou l’alcool [S14].</p>
<p class="src">Références : DGN, Diagnostik bei Polyneuropathien, 2025, § 2 et § 3.1 ; Sommer et al., Dtsch Arztebl Int 2018, tableau 1.</p></template>
<template data-pop="g64-sm-douleur" data-title="Douleur neuropathique : brûlures et allodynie">
<div class="lab">Définition</div><p>L’allodynie est une douleur provoquée par un contact normalement indolore, par exemple celui des vêtements [S14].</p>
<div class="lab">Mécanisme</div><p>Elle traduit l’atteinte des petites fibres Aδ et C ; certains variants des canaux sodiques Nav1.7 à 1.9 rendent les nocicepteurs hyperexcitables [S6].</p>
<div class="lab">Valeur</div><p>Environ la moitié des polyneuropathies sont douloureuses [S2].</p>
<div class="lab">Piège</div><p>La douleur domine la neuropathie des petites fibres, dont l’électroneurographie est normale [S16].</p>
<p class="src">Références : DGN 2025, § 3.1 ; Sopacua et al., J Peripher Nerv Syst 2019 (résumé) ; Sommer et al. 2018 ; Théaudin et al., Rev Med Suisse 2022 (résumé).</p></template>
<template data-pop="g64-sm-ataxie" data-title="Instabilité à la marche dans l’obscurité">
<div class="lab">Définition</div><p>Le patient se sent instable debout ou à la marche, surtout dans le noir [S14].</p>
<div class="lab">Mécanisme</div><p>L’atteinte des grosses fibres altère le sens de position [S14]. Le fait que la vue compense ce déficit le jour est une déduction pédagogique, non une phrase des sources lues.</p>
<div class="lab">Technique</div><p>Test de Romberg, marche en ligne et marche les yeux fermés [S14].</p>
<div class="lab">Piège</div><p>Une chute inexpliquée chez la personne âgée peut révéler la polyneuropathie, par trouble de la marche ou par intolérance orthostatique [S14].</p>
<p class="src">Références : DGN 2025, § 3.1 et § 3.6.2.</p></template>
<template data-pop="g64-sm-faiblesse" data-title="Faiblesse distale ou proximale">
<div class="lab">Caractérisation</div><p>Des trébuchements fréquents suggèrent une faiblesse distale ; une difficulté à monter les escaliers ou à se relever d’un siège bas suggère une faiblesse proximale [S14].</p>
<div class="lab">Technique</div><p>Marche sur les talons et les pointes, lever d’une chaise et de l’accroupissement ; recherche d’une faiblesse de l’écartement des orteils et d’une atrophie du court extenseur des orteils, signes précoces [S14].</p>
<div class="lab">Piège</div><p>Une atteinte surtout motrice fait discuter une myopathie, une maladie de la corne antérieure ou un trouble de la jonction neuromusculaire [S14].</p>
<p class="src">Références : DGN 2025, § 3.1.</p></template>
<template data-pop="g64-sm-autonome" data-title="Plaintes autonomes">
<div class="lab">Questions</div><p>Le médecin demande syncopes, intolérance orthostatique, troubles vésicaux ou intestinaux, intolérance à la chaleur, troubles de la sudation et dysfonction érectile [S14].</p>
<div class="lab">Technique</div><p>Pupilles, sécheresse cutanée et test de Schellong couché puis debout [S14]. Le seuil de positivité n’a pas été lu dans les sources de cet audit.</p>
<div class="lab">Orientation</div><p>Une dysautonomie marquée oriente vers l’amylose, le diabète, le syndrome de Guillain-Barré, le syndrome de Sjögren ou une cause paranéoplasique [S14].</p>
<p class="src">Références : DGN 2025, § 3.1 et tableau 1.</p></template>
<template data-pop="g64-sm-plaie" data-title="Plaies indolores des pieds">
<div class="lab">Définition</div><p>Une plaie que le patient ne sent pas, souvent découverte tardivement [S14].</p>
<div class="lab">Mécanisme</div><p>La perte de la sensibilité douloureuse et les troubles trophiques de la dénervation autonome (œdème, ulcère, ostéoarthropathie) y contribuent [S14].</p>
<div class="lab">Conduite</div><p>Le médecin inspecte les pieds à chaque consultation ; chez le diabétique, les soins des pieds font partie de la prise en charge [S2].</p>
<p class="src">Références : DGN 2025, § 3.1 et tableau 1 ; Sommer et al. 2018.</p></template>
<template data-pop="g64-sm-achilleen" data-title="Réflexe achilléen : valeur chiffrée">
<div class="lab">Normal</div><p>Le réflexe est présent et symétrique.</p>
<div class="lab">Pathologique</div><p>Dans la polyneuropathie, les réflexes s’affaiblissent puis disparaissent, en règle d’abord au tendon d’Achille [S14].</p>
<div class="lab">Valeur</div><p>Chez des patients adressés pour neurophysiologie, l’abolition prédit une électroneurographie anormale : sensibilité 72 %, spécificité 91 %, rapport de vraisemblance positif 7,6, négatif 0,3 ; kappa entre examinateurs 0,6 [S19].</p>
<div class="lab">Limite</div><p>Étude australienne lue en résumé, population sélectionnée ; aucune source suisse ou européenne lue ne chiffre ce signe.</p>
<p class="src">Références : DGN 2025, § 3.1 ; Chew et al., Intern Med J 2022 (résumé).</p></template>
<template data-pop="g64-sm-diapason" data-title="Pallesthésie au diapason">
<div class="lab">Technique</div><p>Le diapason gradué de Rydel-Seiffer est posé sur le dos de l’articulation interphalangienne du gros orteil [S20].</p>
<div class="lab">Mécanisme</div><p>La vibration est portée par les grosses fibres [S14].</p>
<div class="lab">Valeur et limite</div><p>Associée à l’aréflexie distale, l’hypopallesthésie forme un signe sensible et spécifique [S2]. Le seuil normal selon l’âge n’a pas été lu ; il reste une lacune de l’audit.</p>
<p class="src">Références : de Simone et al., Diabetes Res Clin Pract 2015 (résumé) ; DGN 2025 ; Sommer et al. 2018.</p></template>
