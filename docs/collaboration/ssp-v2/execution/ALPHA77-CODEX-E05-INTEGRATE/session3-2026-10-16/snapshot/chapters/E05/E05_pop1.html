<template data-pop="e05-cas" data-title="Cas de Mme L. : données complètes et intervalles"><div id="e05-cas"><p>Le cas est <b>entièrement fictif</b> ; les valeurs sont choisies pour rester cohérentes avec les intervalles d’un laboratoire suisse réel. Les intervalles ci-dessous sont ceux du laboratoire Risch pour l’adulte de 20 ans et plus, mesurés par immunodosage à électrochimiluminescence (<b>ECLIA</b>) ; ils sont propres à ce laboratoire et à cette méthode, car aucun intervalle suisse universel n’existe.</p><table class='t'><tr><th>Grandeur</th><th>Mme L.</th><th>Intervalle de référence (adulte ≥ 20 ans)</th><th>Lecture</th></tr><tr><td>TSH</td><td>&lt; 0,01 mU/l</td><td>0,27–4,2 mU/l</td><td>Effondrée, bien sous la borne inférieure</td></tr><tr><td>T4 libre</td><td>48 pmol/l</td><td>12–24,1 pmol/l</td><td>Environ deux fois la borne supérieure (48 / 24,1 ≈ 2,0)</td></tr><tr><td>T3 libre</td><td>16 pmol/l</td><td>3,1–6,8 pmol/l</td><td>Plus de deux fois la borne supérieure (16 / 6,8 ≈ 2,4)</td></tr><tr><td>TRAK</td><td>8,5 UI/l</td><td>&lt; 1,22 UI/l</td><td>Près de sept fois le seuil (8,5 / 1,22 ≈ 7,0)</td></tr></table><p>Le rapport à la borne supérieure sert à juger l’ampleur de l’écart : une T4 libre doublée correspond à une thyrotoxicose franche, non à une simple fluctuation. Les constantes cliniques de Mme L. complètent ce tableau : fréquence cardiaque de 112/min au repos, perte de 5 kg en 3 mois, goitre diffus indolore et rétraction palpébrale.</p><p class="src">Sources : <a href="https://ribook.risch.ch/de/analysen/tsh" target="_blank" rel="noopener">Laboratoire Risch — catalogue Ribook (TSH, T4 libre, T3 libre, TRAK) — modifié le 30 juillet 2026</a>.</p></div></template>
<template data-pop="e05-axe" data-title="Axe thyréotrope : rappel avant la clinique"><div id="e05-axe"><p>La thyroïde est commandée par un circuit en boucle. La <b>TRH</b> hypothalamique stimule la sécrétion de <b>TSH</b> par l’hypophyse ; la TSH stimule la thyroïde, qui libère T4 et T3 ; ces hormones freinent en retour l’hypothalamus et l’hypophyse (rétrocontrôle négatif). Quand la thyroïde produit trop d’hormones, la TSH s’effondre : c’est pourquoi une TSH basse est le premier signe biologique d’une thyrotoxicose, avant même que l’on dose les hormones.</p><p>La relation entre T4 libre et TSH est logarithmique-linéaire inverse : une petite variation de T4 libre provoque une grande variation de TSH. Le cours « Sciences » (S02) détaille ce circuit.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p></div></template>
<template data-pop="e05-t3tox" data-title="T3-thyrotoxicose : TSH basse, T4 libre normale, T3 libre élevée"><div id="e05-t3tox"><p>Dans une hyperthyroïdie légère, la T4 libre peut rester dans l’intervalle de référence alors que seule la T3 libre dépasse la borne supérieure et que la TSH est indétectable. Il s’agit de la T3-thyrotoxicose. Elle est souvent le stade initial des nodules autonomes : le tissu autonome produit d’abord de la T3, l’hormone active, avant que la T4 ne s’élève.</p><p>Conséquence pratique : doser seulement la T4 libre peut faire manquer une thyrotoxicose. C’est la raison pour laquelle le test réflexe suisse ajoute la T3 (libre ou totale) quand la TSH est supprimée.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://doi.org/10.1007/s00259-023-06274-5" target="_blank" rel="noopener">EANM — recommandation 2023 sur la thérapie par l’iode radioactif des maladies thyroïdiennes bénignes (Campennì et coll.) — 2023</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/7_Endokrinologie/72_Empfehlungen_SGED/recommandations_postanalytique_bilan_thyroidien_20251010.pdf" target="_blank" rel="noopener">SSCC (approuvé par la SSED) — test réflexe du bilan thyroïdien initial — octobre 2025</a>.</p></div></template>
<template data-pop="e05-grades" data-title="Hyperthyroïdie infraclinique : grades 1 et 2 (ETA 2015)"><div id="e05-grades"><p>L’hyperthyroïdie infraclinique associe une TSH abaissée de façon persistante à des hormones libres situées dans leurs intervalles de référence. L’ETA la classe en deux grades : le grade 1 correspond à une TSH de 0,1 à 0,39 mU/l, le grade 2 à une TSH inférieure à 0,1 mU/l. La société suisse citée dans ce cours situe la même zone entre « moins de 0,1 et 0,4 mU/l ».</p><p>Ces grades pèsent sur la conduite : le risque cardiovasculaire et osseux concerne surtout le grade 2 (voir la partie suivante) ; le traitement est recommandé au-delà de 65 ans avec une TSH inférieure à 0,1 mU/l persistante, envisagé entre 0,1 et 0,39 chez le plus de 65 ans et chez le moins de 65 ans symptomatique de grade 2, et non proposé au sujet jeune asymptomatique de grade 1.</p><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/26558232/" target="_blank" rel="noopener">ETA — recommandations 2015 sur l’hyperthyroïdie infraclinique (Biondi et coll.) — 26 août 2015, résumé</a> ; <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a>.</p></div></template>
<template data-pop="e05-iode-suisse" data-title="Sel iodé en Suisse : 25 mg d’iode par kilogramme"><div id="e05-iode-suisse"><p>La Suisse iode le sel de cuisine depuis de nombreuses années. La teneur initiale était de 3,75 mg d’iode par kilogramme de sel ; elle atteint aujourd’hui 25 mg par kilogramme. Grâce à cette mesure, le goitre et le crétinisme endémiques ont disparu du pays.</p><p>L’apport reste cependant insuffisant chez les femmes enceintes qui ne prennent pas de supplément iodé : elles n’atteignent pas les valeurs recommandées. L’iode est donc une question de santé publique en deux sens : sa carence provoque des goitres nodulaires qui deviennent plus tard autonomes ; son excès (algues, compléments) peut provoquer une thyrotoxicose.</p><p class="src">Sources : <a href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">OSAV — sel iodé — page consultée le 14 octobre 2026</a>.</p></div></template>
<template data-pop="e05-infraclinique-risques" data-title="Hyperthyroïdie infraclinique : risques à connaître"><div id="e05-infraclinique-risques"><p>Avec une TSH inférieure à 0,1 mU/l, l’ETA rapporte un risque accru de mortalité coronarienne, de fibrillation auriculaire incidente, d’insuffisance cardiaque, de fractures et de surmortalité. Dans la maladie de Basedow infraclinique, la présence d’anticorps anti-récepteur de la TSH s’accompagne d’une progression vers l’hyperthyroïdie manifeste pouvant atteindre 30 % en trois ans.</p><p>Ces chiffres justifient de ne pas banaliser une TSH très basse chez la personne âgée. Ils décrivent une association statistique : ils ne prouvent pas qu’un traitement individuel abaisse chaque risque.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p></div></template>
<template data-pop="e05-trak-mecanisme" data-title="Anticorps stimulants : du récepteur à l’AMPc"><div id="e05-trak-mecanisme"><p>Le récepteur de la TSH est une protéine de la membrane du thyréocyte. Il possède un grand domaine extracellulaire riche en leucine. Dans la maladie de Basedow, des anticorps de classe IgG1 se fixent sur un épitope discontinu de ce domaine (acides aminés 20 à 260 environ). Ils imitent la TSH : le récepteur s’active, la concentration intracellulaire d’<b>AMPc</b> augmente, et la cellule libère davantage d’hormones et se multiplie.</p><p>Ces anticorps échappent au rétrocontrôle. La TSH hypophysaire diminue en réponse à l’excès d’hormones, mais l’anticorps continue de stimuler le récepteur : la thyroïde ne ralentit pas.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p></div></template>
<template data-pop="e05-igf1r" data-title="Récepteur de l’IGF-1 et fibroblastes orbitaires"><div id="e05-igf1r"><p>Le récepteur de la TSH interagit avec le récepteur de l’IGF-1 (<b>IGF-1R</b>) à la surface des thyréocytes et des fibroblastes de l’orbite. Cette interaction, décrite par l’ETA, constitue le lien moléculaire entre la thyroïde et l’orbite : les fibroblastes orbitaires portent les deux récepteurs.</p><p>Le téprotumumab, traitement autorisé en Suisse de l’orbitopathie active modérée à sévère, est présenté dans la partie A10 et dans l’onglet Pharmacologie. Les sources lues pour ce cours ne détaillent pas son mécanisme moléculaire ; il n’est donc pas décrit ici.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680697950012" target="_blank" rel="noopener">Swissmedic — Tepezza (téprotumumab), information professionnelle — mars 2026</a>.</p></div></template>
<template data-pop="e05-autonomie" data-title="Autonomie nodulaire : mutations activatrices"><div id="e05-autonomie"><p>Dans un nodule autonome, une mutation somatique active en permanence le récepteur de la TSH ou la protéine Gsα qui transmet son signal. Le nodule produit alors des hormones sans attendre la TSH. En carence iodée, la stimulation chronique de la glande par la TSH favorise d’abord le goitre, puis l’autonomie ; l’hyperthyroïdie progresse du stade infraclinique au stade manifeste.</p><p>Une surcharge en iode (amiodarone, produit de contraste) déclenche souvent le passage au stade manifeste, parce qu’elle fournit à un nodule déjà autonome le substrat qui lui manquait.</p><p class="src">Sources : <a href="https://doi.org/10.1007/s00259-023-06274-5" target="_blank" rel="noopener">EANM — recommandation 2023 sur la thérapie par l’iode radioactif des maladies thyroïdiennes bénignes (Campennì et coll.) — 2023</a>.</p></div></template>
<template data-pop="e05-jod-basedow" data-title="Surcharge iodée : le mécanisme de l’hyperthyroïdie induite par l’iode"><div id="e05-jod-basedow"><p>Un apport massif d’iode donne du substrat à une thyroïde qui n’est plus freinée : nodule autonome ou maladie de Basedow encore latente. Elle produit alors trop d’hormones. L’ETA décrit cette situation pour les produits de contraste iodés : elle touche surtout les régions carencées en iode et les patients porteurs d’un goitre nodulaire ou d’une maladie de Basedow latente ; la prévalence des dysfonctions thyroïdiennes induites est de 1 à 15 %, et la plupart sont légères et transitoires.</p><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/34395299/" target="_blank" rel="noopener">ETA — recommandations 2021 sur les dysfonctions induites par les produits de contraste iodés (Bednarczuk et coll.) — 16 juin 2021, résumé</a> ; <a href="https://doi.org/10.1007/s00259-023-06274-5" target="_blank" rel="noopener">EANM — recommandation 2023 sur la thérapie par l’iode radioactif des maladies thyroïdiennes bénignes (Campennì et coll.) — 2023</a>.</p></div></template>
<template data-pop="e05-amiodarone" data-title="Amiodarone : deux mécanismes, un profil biologique particulier"><div id="e05-amiodarone"><p>L’amiodarone est très riche en iode. Elle provoque deux atteintes. Le <b>type 1</b> est une hyperthyroïdie induite par l’iode sur un goitre nodulaire ou une maladie de Basedow latente. Le <b>type 2</b> est une thyroïdite destructrice sur une glande saine. Des formes mixtes existent. Il faut écrire « thyrotoxicose induite par l’amiodarone » en toutes lettres.</p><p>Le médicament inhibe aussi la conversion périphérique de T4 en T3. Il en résulte une hormonémie dissociée : T4 libre élevée, T3 libre normale ou légèrement abaissée, sans dysthyroïdie obligatoire. L’interprétation du bilan exige donc de connaître le traitement. La fixation d’iode radioactif est faussée par l’iode de la molécule.</p><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/29594056/" target="_blank" rel="noopener">ETA — recommandations 2018 sur les dysfonctions thyroïdiennes liées à l’amiodarone (Bartalena et coll.) — mars 2018, résumé</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680333930163" target="_blank" rel="noopener">Swissmedic — Cordarone comprimés (amiodarone), information professionnelle — avril 2024</a>.</p></div></template>
<template data-pop="e05-alemtuzumab" data-title="Reconstitution immunitaire : un Basedow induit par le traitement"><div id="e05-alemtuzumab"><p>Après un traitement par l’alemtuzumab, 20 à 30 % des patients développent une maladie de Basedow avec anticorps anti-récepteur, 12 à 24 mois plus tard. Un phénomène analogue s’observe sous trithérapie antirétrovirale efficace et après greffe de moelle osseuse. L’ETA désigne ce mécanisme par le terme de reconstitution immunitaire.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p></div></template>
<template data-pop="e05-checkpoint" data-title="Inhibiteurs de points de contrôle immunitaire : thyroïdite précoce"><div id="e05-checkpoint"><p>Les inhibiteurs de points de contrôle immunitaire provoquent typiquement une thyroïdite 4 à 6 semaines après le début du traitement. Le médecin contrôle la TSH et la T4 libre avant le traitement, puis toutes les 3 à 6 semaines.</p><p>Il s’agit d’une destruction thyroïdienne : la phase hyperthyroïdienne ne se traite pas par antithyroïdien. Un Basedow déclenché par une immunothérapie reste possible ; il n’impose ni l’arrêt de l’immunothérapie ni un traitement définitif.</p><p class="src">Sources : <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a> ; <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p></div></template>
<template data-pop="e05-hcg" data-title="hCG : stimulation transitoire de la thyroïde en début de grossesse"><div id="e05-hcg"><p>La gonadotrophine chorionique humaine (<b>hCG</b>) est produite par le placenta au début de la grossesse. L’hormone stimule le récepteur de la TSH, ce qui abaisse la TSH au premier trimestre : c’est la thyrotoxicose gestationnelle transitoire, première cause d’hyperthyroïdie pendant la grossesse. Elle ne nécessite pas d’antithyroïdien.</p><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/31791071/" target="_blank" rel="noopener">Koehler et coll. — Schilddrüse und Schwangerschaft — décembre 2019, résumé</a>.</p></div></template>
<template data-pop="e05-cas-score" data-title="Score d’activité clinique (CAS) de l’orbitopathie"><div id="e05-cas-score"><p>Le <b>CAS</b> compte sept signes inflammatoires, chacun valant 1 point : douleur rétrobulbaire spontanée, douleur aux mouvements oculaires verticaux, rougeur palpébrale, rougeur conjonctivale, œdème de la caroncule ou du pli semi-lunaire, œdème palpébral et chémosis. L’orbitopathie est dite <b>active</b> si le score atteint 3 sur 7 ou plus.</p><p>Le score mesure l’inflammation, donc la possibilité qu’un traitement anti-inflammatoire agisse ; il ne mesure ni la gravité ni le retentissement fonctionnel, qui relèvent de la classification EUGOGO (partie A10).</p><p class="src">Sources : <a href="https://doi.org/10.1530/EJE-21-0479" target="_blank" rel="noopener">EUGOGO — recommandations 2021 sur le traitement médical de l’orbitopathie basedowienne (Bartalena et coll.) — 27 août 2021</a>.</p></div></template>
<template data-pop="e05-retraction" data-title="Rétraction palpébrale : ce que l’on voit"><div id="e05-retraction"><p>La rétraction de la paupière supérieure découvre la sclère blanche au-dessus de l’iris. La figure 1 en montre un exemple net, associé à une exophtalmie bilatérale. Dans le tableau différentiel de l’exophtalmie (A06), la rétraction palpébrale figure parmi les caractéristiques de l’orbitopathie basedowienne.</p></div></template>
<template data-pop="e05-myxoedeme" data-title="Dermopathie prétibiale et acropachie"><div id="e05-myxoedeme"><p>L’atteinte cutanée de la maladie de Basedow siège surtout sur le tibia : la peau est épaissie, indurée, sur la face antérieure des jambes. La figure 2 montre aussi des doigts tuméfiés chez une femme de 33 ans en hyperthyroïdie.</p><p class="src">Sources : <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a>.</p></div></template>
<template data-pop="e05-paralysie-periodique" data-title="Paralysie périodique thyrotoxique"><div id="e05-paralysie-periodique"><p>Chez un patient hyperthyroïdien, une baisse du potassium sanguin peut déclencher des épisodes de paralysie musculaire : la paralysie périodique thyrotoxique. L’information professionnelle suisse de la prednisone avertit qu’une hypokaliémie induite par ce médicament peut la provoquer. L’ETA range les patients concernés parmi les candidats à l’iode 131, traitement définitif de l’hyperthyroïdie.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680293490370" target="_blank" rel="noopener">Swissmedic — Prednisone Streuli 5, 20 et 50 mg, information professionnelle — juin 2026</a> ; <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p></div></template>
<template data-pop="e05-biotine" data-title="Biotine : un faux profil d’hyperthyroïdie"><div id="e05-biotine"><p>Les immunodosages qui utilisent le couple streptavidine–biotine sont sensibles à la biotine prise en complément (vitamine). L’interférence peut simuler un profil hormonal d’hyperthyroïdie cohérent. Le médecin demande donc toujours si le patient prend de la biotine. Il utilise une autre méthode de dosage, ou répète l’analyse une semaine après l’arrêt de la biotine.</p><p>Le laboratoire suisse de référence du cours dose la TSH, la T4 libre, la T3 libre et le TRAK par une méthode ECLIA ; cette technique repose, selon le fabricant, sur le couple streptavidine–biotine, mais ce dernier point ne figure pas dans la source suisse lue.</p><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/29264498/" target="_blank" rel="noopener">Cas clinique d’interférence de la biotine simulant une maladie de Basedow (hôpital de Bicêtre) — 2017, résumé</a> ; <a href="https://ribook.risch.ch/de/analysen/tsh" target="_blank" rel="noopener">Laboratoire Risch — catalogue Ribook (TSH, T4 libre, T3 libre, TRAK) — modifié le 30 juillet 2026</a>.</p></div></template>
<template data-pop="e05-reflexe" data-title="Test réflexe suisse du bilan thyroïdien initial"><div id="e05-reflexe"><p>La Société suisse de chimie clinique (<b>SSCC</b>), avec l’approbation de la SSED, recommande en octobre 2025 un bilan initial par la TSH seule. Si la TSH est élevée, le laboratoire ajoute automatiquement la T4 libre. Si la TSH est supprimée, il ajoute la T4 libre et la T3 (libre ou totale). Les seuils de déclenchement figurent dans le catalogue de chaque laboratoire : la recommandation ne fixe aucun intervalle de référence.</p><p>Le dépistage systématique d’un patient asymptomatique n’est pas recommandé, sauf en cas de grossesse, de bilan d’infertilité, de trouble du rythme cardiaque ou chez le nouveau-né. La recommandation s’applique à l’adulte hors grossesse.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/7_Endokrinologie/72_Empfehlungen_SGED/recommandations_postanalytique_bilan_thyroidien_20251010.pdf" target="_blank" rel="noopener">SSCC (approuvé par la SSED) — test réflexe du bilan thyroïdien initial — octobre 2025</a>.</p></div></template>
<template data-pop="e05-thyreotrope" data-title="Adénome thyréotrope et résistance aux hormones thyroïdiennes"><div id="e05-thyreotrope"><p>Un adénome hypophysaire sécrétant de la TSH produit des hormones libres élevées (T4 libre et T3 libre) avec une TSH non freinée, normale ou élevée. Le méconnaître expose à une erreur grave : l’ablation de la thyroïde fait croître la tumeur hypophysaire. Le diagnostic repose sur le test de freinage à la T3, le test à la TRH, l’imagerie hypophysaire (IRM) et la génétique, qui distingue la résistance aux hormones thyroïdiennes. Le traitement de choix de l’adénome est chirurgical.</p><p>Règle pratique : devant des hormones libres élevées avec une TSH qui n’est pas effondrée, on écarte d’abord ces diagnostics avant toute ablation thyroïdienne.</p><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/24783044/" target="_blank" rel="noopener">ETA — recommandations 2013 sur les adénomes hypophysaires sécrétant la TSH — 2013, résumé</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/7_Endokrinologie/72_Empfehlungen_SGED/recommandations_postanalytique_bilan_thyroidien_20251010.pdf" target="_blank" rel="noopener">SSCC (approuvé par la SSED) — test réflexe du bilan thyroïdien initial — octobre 2025</a>.</p></div></template>
<template data-pop="e05-factice" data-title="Thyrotoxicose factice : comment la reconnaître"><div id="e05-factice"><p>La thyrotoxicose factice résulte de la prise d’hormones thyroïdiennes, souvent pour maigrir. Elle associe T4 et T3 élevées, TSH indétectable, thyroglobuline basse ou indétectable, fixation d’iode basse, absence de goitre et d’anticorps, et un Doppler sans hypervascularisation. Il faut y penser même chez le sujet âgé. L’information professionnelle suisse de la lévothyroxine précise qu’un surdosage volontaire pour maigrir peut être mortel et que les antithyroïdiens ne sont pas indiqués, la thyroïde étant déjà totalement au repos.</p><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/10195380/" target="_blank" rel="noopener">Bogazzi, Bartalena et coll. — thyrotoxicose factice, séries italiennes — 1996 et 1999, résumés</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">Swissmedic — Euthyrox (lévothyroxine), information professionnelle — février 2023</a>.</p></div></template>
<template data-pop="e05-struma-ovarii" data-title="Struma ovarii : tissu thyroïdien dans l’ovaire"><div id="e05-struma-ovarii"><p>Le struma ovarii est un tératome ovarien composé à plus de 50 % de tissu thyroïdien. C’est une cause rare d’hyperthyroïdie, à évoquer devant une hyperthyroïdie résistante au traitement. L’imagerie pelvienne et l’histologie confirment le diagnostic.</p><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/34387530/" target="_blank" rel="noopener">Podfigurna et coll. — hyperthyroïdie et struma ovarii — 2021, résumé</a>.</p></div></template>
<template data-pop="e05-igg4-orbite" data-title="Exophtalmie qui n’est pas basedowienne : la maladie associée aux IgG4"><div id="e05-igg4-orbite"><p>Toute exophtalmie n’est pas basedowienne. Lorsque les hormones thyroïdiennes sont normales, il faut élargir le diagnostic différentiel. La maladie associée aux IgG4 imite de nombreuses affections inflammatoires, infectieuses ou tumorales de l’orbite. Son diagnostic combine la clinique, la biologie, la radiologie et l’histologie. Un article suisse récent (Praxis, avril 2026) rapporte un cas.</p><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/42021675/" target="_blank" rel="noopener">Praxis — Hösli, Brändle et coll., Orbitopathie nicht immer endokrin bedingt — avril 2026, résumé</a>.</p></div></template>
<template data-pop="e05-bwps" data-title="Calcul du score de Burch-Wartofsky"><div id="e05-bwps"><p class="src">Version utilisée et limites : <a href="https://doi.org/10.1530/ETJ-26-0043" target="_blank" rel="noopener">consensus européen 2026, tableaux 1–3, lu le 15 octobre 2026</a>. Les paliers thermiques diffèrent de présentations historiques ; l’exemple suit uniquement le tableau actuel du cours.</p><p>Le <b>BWPS</b> est une échelle de points qui additionne la gravité de cinq systèmes : la température, la fréquence cardiaque, la fonction cardiaque (fibrillation auriculaire, insuffisance cardiaque), l’atteinte digestive ou hépatique, l’état neurologique, auxquels s’ajoutent 10 points si un facteur déclenchant est identifié. Le médecin additionne les points de chaque ligne : <b>score = somme des points retenus</b>. Selon le consensus européen 2026, un total d’au moins 45 est très évocateur ; 25–44 soutient la suspicion, et moins de 25 rend la crise moins probable. Aucun seuil n’est un test diagnostique définitif.</p><p><b>Exemple fictif.</b> Dans la version du tableau 1 du consensus européen 2026 utilisée ici, un patient a 39,5 °C (15 points), une fréquence cardiaque de 135/min (20), une fibrillation auriculaire (10), de l’agitation (10), une diarrhée (10) et une infection comme déclencheur (10). Le calcul est : 15 + 20 + 10 + 10 + 10 + 10 = 75. Ce total dépasse largement le seuil de 45 : la crise est très probable.</p><p><b>Limites.</b> Il s’agit d’un score d’origine américaine (1993), cité par l’ETA et la JTA. C’est un outil de calcul, non une recommandation thérapeutique : le diagnostic reste clinique, avec thyrotoxicose biologique.</p><p class="src">Sources : <a href="https://www.jstage.jst.go.jp/article/endocrj/63/12/63_EJ16-0336/_pdf" target="_blank" rel="noopener">JTA — recommandations 2016 sur la crise thyrotoxique (Satoh et coll.) — 2016</a> ; <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p></div></template>
<template data-pop="e05-jta" data-title="Critères de crise thyrotoxique de la JTA (TS1 et TS2)"><div id="e05-jta"><p>La JTA exige d’abord une thyrotoxicose (T3 libre ou T4 libre élevée). Cinq groupes de manifestations sont ensuite considérés : système nerveux (agitation, délire, somnolence, coma, score de Glasgow ≤ 14), fièvre ≥ 38 °C, tachycardie ≥ 130/min, insuffisance cardiaque (œdème pulmonaire, choc, classe NYHA IV, Killip ≥ III) et atteinte digestive ou hépatique (nausées, vomissements, diarrhée, bilirubine totale ≥ 3,0 mg/dl).</p><p>Le niveau <b>TS1</b> associe une atteinte du système nerveux et au moins une autre manifestation, ou trois autres manifestations sans atteinte nerveuse. Le niveau <b>TS2</b> associe deux autres manifestations, ou correspond à un TS1 sans dosage hormonal disponible. Les causes alternatives sont recherchées ; une infection peut aussi déclencher une crise et coexister avec elle. Ces critères complètent le jugement clinique. Le consensus européen 2026 précise que la catégorie TS2 sans résultats hormonaux disponibles suppose, en plus du tableau TS1, une histoire thyroïdienne, un goitre et une exophtalmie.</p><p class="src">Sources : <a href="https://www.jstage.jst.go.jp/article/endocrj/63/12/63_EJ16-0336/_pdf" target="_blank" rel="noopener">JTA — recommandations 2016 sur la crise thyrotoxique (Satoh et coll.) — 2016</a>.</p></div></template>
<template data-pop="e05-iodure-crise" data-title="Iodure dans la crise : quand le donner ?"><div id="e05-iodure-crise"><p>Le consensus européen de 2026 demande d’attendre au moins une heure après l’administration de l’antithyroïdien avant l’iodure. L’iode peut aggraver une hypersynthèse s’il est donné trop tôt. Son bénéfice est improbable dans les thyroïdites destructrices et les apports exogènes. Le blocage de libération peut être transitoire : l’équipe arrête l’iodure après stabilisation.</p><p>La formulation et la concentration sont vérifiées par la pharmacie hospitalière. Une dose en gouttes d’une solution donnée ne peut pas être transposée à une autre préparation. Le cours ne revendique pas de FI suisse pour une préparation iodée de crise.</p><p class="src">Source européenne : <a href="https://doi.org/10.1530/ETJ-26-0043" target="_blank" rel="noopener">ETA et sociétés britanniques — consensus sur la crise thyrotoxique, août 2026 ; sections reconnaissance et traitement ; consulté le 15 octobre 2026</a>. Les doses de crise relèvent du spécialiste hospitalier ; les FI suisses sont distinguées dans le texte.</p></div></template>
<template data-pop="e05-hydrocortisone-crise" data-title="Glucocorticoïde dans la crise : doses selon la source"><div id="e05-hydrocortisone-crise"><p>Le consensus européen de 2026 propose 100 mg d’hydrocortisone i.v. en charge puis 50 mg quatre fois par jour. Ce schéma diffère des 300 mg/j de la JTA 2016. Il vise notamment à réduire la conversion T4–T3 et relève de la prise en charge spécialisée.</p><p>La FI suisse de Solu-Cortef, octobre 2025, décrit des doses initiales jusqu’à 100 mg en au moins 30 secondes. Elle ne doit pas être citée comme source du schéma européen de crise. L’équipe surveille notamment la kaliémie ; une paralysie hypokaliémique peut être précipitée par les fortes doses de glucocorticoïdes.</p><p class="src"><a href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">FI suisse Solu-Cortef, posologie, consultée le 15 octobre 2026</a>.</p><p class="src">Source européenne : <a href="https://doi.org/10.1530/ETJ-26-0043" target="_blank" rel="noopener">ETA et sociétés britanniques — consensus sur la crise thyrotoxique, août 2026 ; sections reconnaissance et traitement ; consulté le 15 octobre 2026</a>. Les doses de crise relèvent du spécialiste hospitalier ; les FI suisses sont distinguées dans le texte.</p></div></template>
<template data-pop="e05-esmolol" data-title="Bêtabloquant dans la crise : propranolol ou esmolol ?"><div id="e05-esmolol"><p>Le consensus européen de 2026 recommande d’individualiser la bêtabloquation. L’évaluation de la fonction cardiaque doit être précoce. En cas de cardiomyopathie ou de choc, supprimer le soutien adrénergique peut provoquer un collapsus. L’esmolol a une courte durée d’action et peut être interrompu rapidement ; il exige néanmoins une surveillance étroite.</p><p>La FI de Brevibloc pour le contrôle rapide de fréquence décrit une charge de 500 µg/kg en une minute puis 50 µg/kg/min pendant quatre minutes, avec titration par paliers. La dose d’entretien habituelle est de 100 µg/kg/min ; au-delà de 200 µg/kg/min, aucun bénéfice supplémentaire n’est décrit pour cette indication. Ce cadre ne rend pas la charge obligatoire chez un patient en défaillance circulatoire : la stratégie de crise est spécialisée.</p><p class="src"><a href="https://amiko.oddb.org/fr/fi?gtin=7680495760219" target="_blank" rel="noopener">FI suisse Brevibloc, septembre 2013, posologie et précautions, consultée le 15 octobre 2026</a>.</p><p class="src">Source européenne : <a href="https://doi.org/10.1530/ETJ-26-0043" target="_blank" rel="noopener">ETA et sociétés britanniques — consensus sur la crise thyrotoxique, août 2026 ; sections reconnaissance et traitement ; consulté le 15 octobre 2026</a>. Les doses de crise relèvent du spécialiste hospitalier ; les FI suisses sont distinguées dans le texte.</p></div></template>
<template data-pop="e05-paracetamol-crise" data-title="Fièvre de la crise : paracétamol, refroidissement, pas d’AINS"><div id="e05-paracetamol-crise"><p>Le consensus européen de 2026 associe refroidissement et antipyrèse par paracétamol. Il déconseille l’aspirine, qui déplace les hormones de leurs protéines et peut augmenter transitoirement T4 et T3 libres. Aucune dose de paracétamol n’est proposée ici sans vérification de la FI du produit exact.</p><p class="src">Source européenne : <a href="https://doi.org/10.1530/ETJ-26-0043" target="_blank" rel="noopener">ETA et sociétés britanniques — consensus sur la crise thyrotoxique, août 2026 ; sections reconnaissance et traitement ; consulté le 15 octobre 2026</a>. Les doses de crise relèvent du spécialiste hospitalier ; les FI suisses sont distinguées dans le texte.</p></div></template>
<template data-pop="e05-plasmapherese" data-title="Plasmaphérèse : quand l’envisager ?"><div id="e05-plasmapherese"><p>L’absence de stabilisation en 24–48 heures impose une réévaluation : facteur déclenchant persistant, défaut d’absorption, cardiomyopathie ou traitement insuffisant. Ce délai ne signifie pas que tout patient doit recevoir des échanges plasmatiques. Dans les formes réfractaires malgré le traitement, ils peuvent réduire transitoirement la charge hormonale et servir de pont vers un traitement définitif ; les données proviennent surtout de séries et d’observations. Une thyroïdectomie urgente peut aussi être nécessaire.</p><p class="src">Source européenne : <a href="https://doi.org/10.1530/ETJ-26-0043" target="_blank" rel="noopener">ETA et sociétés britanniques — consensus sur la crise thyrotoxique, août 2026 ; sections reconnaissance et traitement ; consulté le 15 octobre 2026</a>. Les doses de crise relèvent du spécialiste hospitalier ; les FI suisses sont distinguées dans le texte.</p></div></template>
<template data-pop="e05-neuropathie-optique" data-title="Neuropathie optique dysthyroïdienne : délai de décompression"><div id="e05-neuropathie-optique"><p>Une orbitopathie menaçant la vue (neuropathie optique, ulcération cornéenne) est une urgence endocrinienne. Le traitement associe antithyroïdien et méthylprednisolone intraveineuse à forte dose (0,5 à 1 g par jour pendant trois jours consécutifs ou, de préférence, un jour sur deux). Si la réponse est absente ou insuffisante, une décompression orbitaire urgente est indiquée.</p><p><b>Divergence.</b> L’EUGOGO 2021 fixe le délai de réponse à 1 à 2 semaines, l’ETA 2018 à 2 à 4 semaines. <b>Conduite :</b> suivre la source la plus récente (EUGOGO 2021, 1 à 2 semaines).</p><p class="src">Sources : <a href="https://doi.org/10.1530/EJE-21-0479" target="_blank" rel="noopener">EUGOGO — recommandations 2021 sur le traitement médical de l’orbitopathie basedowienne (Bartalena et coll.) — 27 août 2021</a> ; <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p></div></template>
<template data-pop="e05-neomercazole" data-title="Néo-Mercazole : posologie suisse et écart avec l’ETA"><div id="e05-neomercazole"><p>L’information professionnelle suisse de Néo-Mercazole (carbimazole, comprimés de 5 mg, seul dosage commercialisé en Suisse selon la FI) prévoit une dose initiale de 20 à 60 mg par jour en deux ou trois prises pendant 15 à 30 jours, puis une réduction par paliers de 5 à 15 mg par jour tous les 10 jours jusqu’à 5 à 20 mg par jour. La durée habituelle est de 6 à 18 mois. Le traitement ne débute qu’après confirmation biologique.</p><p><b>Écart avec l’ETA.</b> L’ETA 2018 propose le carbimazole à 15–40 mg par jour en une seule prise. La FI suisse demande 20–60 mg en deux ou trois prises. La prise unique de l’ETA s’explique par la longue rétention du médicament dans la thyroïde (environ 20 heures selon la FI). <b>Conduite :</b> prescrire selon la FI suisse et expliquer que la prise unique est possible. Les détails de la monographie figurent en P01.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">Swissmedic — Néo-Mercazole 5 mg (carbimazole), information professionnelle — août 2020</a>.</p></div></template>
<template data-pop="e05-titration" data-title="Titration ou bloquer-remplacer"><div id="e05-titration"><p>Avec la <b>titration</b>, le médecin ajuste la dose d’antithyroïdien sur la T4 libre et la T3 libre jusqu’à l’euthyroïdie, puis l’abaisse. Avec le schéma <b>bloquer-remplacer</b>, il bloque la thyroïde par une forte dose d’antithyroïdien et ajoute de la lévothyroxine. L’ETA indique que bloquer-remplacer n’apporte pas de gain de rémission et préfère la titration. En grossesse, bloquer-remplacer est déconseillé, et la FI suisse de Néo-Mercazole contre-indique l’association carbimazole et hormone thyroïdienne.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">Swissmedic — Néo-Mercazole 5 mg (carbimazole), information professionnelle — août 2020</a>.</p></div></template>
<template data-pop="e05-trak-arret" data-title="TRAK avant l’arrêt du traitement"><div id="e05-trak-arret"><p>Le dosage du TRAK avant l’arrêt est recommandé par l’ETA : un TRAK normal offre la meilleure chance de rémission durable. Si les anticorps restent élevés à 12–18 mois, le patient peut poursuivre le méthimazole et refaire le dosage 12 mois plus tard, ou choisir l’iode 131 ou la chirurgie.</p><p>Exemple (Mme L.) : à 18 mois, TSH normale et TRAK à 0,9 UI/l, sous le seuil de 1,22 UI/l du laboratoire. L’arrêt est raisonnable. Si le TRAK était resté à 3,7 UI/l, soit environ trois fois le seuil (3,7 / 1,22 ≈ 3,0), des anticorps persistants exposeraient à la rechute : le médecin poursuivrait l’antithyroïdien avec un nouveau dosage 12 mois plus tard, ou discuterait l’iode 131 ou la chirurgie.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://ribook.risch.ch/de/analysen/tsh" target="_blank" rel="noopener">Laboratoire Risch — catalogue Ribook (TSH, T4 libre, T3 libre, TRAK) — modifié le 30 juillet 2026</a>.</p></div></template>
<template data-pop="e05-great" data-title="Score GREAT : estimer le risque de rechute"><div id="e05-great"><p>L’ETA 2018 cite un score pronostique nommé <b>GREAT</b>, de rechute après antithyroïdien ; dans le groupe cité par l’ETA, 37 % des patients ont rechuté dans les 2 ans. Les passages lus ne détaillent ni les variables du score ni son développement : ce cours ne les reproduit donc pas.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p></div></template>
<template data-pop="e05-bloquer-remplacer" data-title="Pourquoi le bloquer-remplacer n’est pas préféré"><div id="e05-bloquer-remplacer"><p>Dans le schéma bloquer-remplacer, la thyroïde est freinée par une dose élevée d’antithyroïdien puis la lévothyroxine remplace l’hormone manquante. L’ETA souligne qu’il n’améliore pas le taux de rémission. L’information professionnelle suisse d’Euthyrox contre-indique la lévothyroxine en cas d’hyperthyroïdie, sauf comme traitement associé à un thyréostatique après obtention de l’euthyroïdie, et la contre-indique dans ce rôle pendant la grossesse.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">Swissmedic — Euthyrox (lévothyroxine), information professionnelle — février 2023</a>.</p></div></template>
<template data-pop="e05-great-info" data-title="Rechute après antithyroïdien : chiffres"><div id="e05-great-info"><p>La rechute est la plus probable 6 à 12 mois après l’arrêt. Les facteurs de risque sont une hyperthyroïdie sévère, un gros goitre et des TRAK persistants. La rémission maximale atteint 50 à 55 % après 12 à 18 mois. Une méta-analyse rapporte 52,7 % de rechute après antithyroïdien, contre 15 % après iode 131 et 10 % après chirurgie.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p></div></template>
<template data-pop="e05-info-patient" data-title="Information du patient sous antithyroïdien"><div id="e05-info-patient"><p>L’ETA recommande une information écrite : fièvre, angine, aphtes, ictère, selles décolorées et urines foncées imposent d’arrêter le médicament et de consulter. La FI suisse de Néo-Mercazole va dans le même sens : arrêt immédiat en cas de fièvre, malaise, hématomes, saignements, aphtes ou maux de gorge.</p><p><b>Divergence sur la surveillance.</b> La FI suisse demande une formule sanguine avant le traitement et chaque semaine pendant six semaines chez les patients de plus de 40 ans, surtout pendant les deux premiers mois et à plus de 40 mg par jour. L’ETA juge la surveillance systématique inutile en raison du début brutal de l’agranulocytose et demande une formule en cas de fièvre ou d’angine. <b>Conduite :</b> appliquer la FI sur l’ordonnance suisse et éduquer tous les patients.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">Swissmedic — Néo-Mercazole 5 mg (carbimazole), information professionnelle — août 2020</a>.</p></div></template>
<template data-pop="e05-iode131" data-title="Iode 131 : monographie de la capsule suisse"><div id="e05-iode131"><p>L’information professionnelle suisse de la capsule d’iodure de sodium (iode 131) de Curium précise : carbimazole ou méthimazole à arrêter au moins 2 jours avant, propylthiouracile au moins 2 semaines avant, régime pauvre en iode 3 à 5 jours avant ; bêtabloquant avant et après si l’hyperthyroïdie est sévère, chez le sujet âgé ou en cas de cardiopathie. Elle contre-indique le produit en cas de grossesse, d’allaitement (sevrage au moins 8 semaines avant), de dysphagie, de sténose ou de diverticule œsophagien, de gastrite évolutive, d’ulcère et de ralentissement de la motilité digestive.</p><p>Une aggravation de l’hyperthyroïdie peut survenir 2 à 10 jours après le traitement, voire une crise thyrotoxique. La contraception est exigée 6 mois après le traitement d’une affection bénigne, chez l’homme comme chez la femme, et le patient évite tout contact rapproché avec un jeune enfant pendant au moins une semaine.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">Swissmedic — iodure de sodium (iode 131) en capsules, Curium, information professionnelle — juillet 2022</a>.</p></div></template>
<template data-pop="e05-bag-radioprotection" data-title="Radioprotection suisse : hospitalisation après iode 131"><div id="e05-bag-radioprotection"><p>Le guide de l’Office fédéral de la santé publique (BAG, 2025) impose l’hospitalisation en chambre de thérapie blindée dès 200 mégabecquerels d’iode 131, pour une durée minimale de 48 heures. La sortie est autorisée lorsque le débit de dose est inférieur à 10 µSv/h à 1 mètre, ce qui correspond à une activité résiduelle d’environ 200 mégabecquerels. Le fractionnement en activités plus petites pour éviter l’hospitalisation est interdit. Un traitement ambulatoire de 200 à 400 mégabecquerels n’est possible que sur demande motivée au BAG, au moins 3 jours avant la date prévue. Une information orale et écrite est remise à la sortie.</p><p>Ces règles relèvent de la radioprotection, non de l’indication clinique : elles s’ajoutent à la décision médicale.</p><p class="src">Sources : <a href="https://www.bag.admin.ch/dam/de/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_DE.pdf" target="_blank" rel="noopener">BAG — guide de radioprotection, thérapie par radionucléides, version 2 — 24 juin 2025</a>.</p></div></template>
<template data-pop="e05-delais-iode" data-title="Délais avant iode 131 : points de lecture"><div id="e05-delais-iode"><p>Une surcharge en iode sature la thyroïde et doit faire différer le traitement par l’iode 131 ; le tableau de la partie principale donne les délais de l’EANM. Trois points de lecture. Premièrement, pour l’amiodarone, le texte de l’EANM exige un report d’au moins 6 mois, alors que son tableau indique 3 à 6 mois ou plus : le cours retient la phrase la plus prudente. Deuxièmement, la lévothyroxine (T4) se suspend 3 à 4 semaines et la liothyronine (T3) 10 à 14 jours. Troisièmement, les produits de contraste liposolubles imposent un délai de 3 à 6 mois, plus long que les hydrosolubles (6 à 8 semaines).</p><p class="src">Sources : <a href="https://doi.org/10.1007/s00259-023-06274-5" target="_blank" rel="noopener">EANM — recommandation 2023 sur la thérapie par l’iode radioactif des maladies thyroïdiennes bénignes (Campennì et coll.) — 2023</a>.</p></div></template>
<template data-pop="e05-thyroidectomie" data-title="Thyroïdectomie : préparation et risques"><div id="e05-thyroidectomie"><p>L’ETA recommande la thyroïdectomie totale, qui expose au même risque que la subtotale avec moins de récidive, par un chirurgien réalisant un grand nombre d’interventions par an. L’euthyroïdie est rétablie par antithyroïdien avant l’intervention, et un déficit en vitamine D est corrigé pour limiter l’hypocalcémie postopératoire. Une solution d’iodure de potassium peut être donnée pendant 10 jours avant l’opération pour réduire la vascularisation de la glande. Les risques sont l’hypoparathyroïdie, la paralysie du nerf récurrent et l’hypothyroïdie définitive.</p><p>Indications : gros goitre, hyperparathyroïdie associée, nodule suspect, refus des autres options. Selon l’EANM, la chirurgie peut être de première intention si une grossesse est souhaitée dans moins de 6 mois, en cas de compression ou de goitre ≥ 80 g, de faible fixation, de cancer suspecté ou de nodule non fonctionnel ≥ 4 cm, et en cas d’orbitopathie active modérée à sévère.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://doi.org/10.1007/s00259-023-06274-5" target="_blank" rel="noopener">EANM — recommandation 2023 sur la thérapie par l’iode radioactif des maladies thyroïdiennes bénignes (Campennì et coll.) — 2023</a>.</p></div></template>
<template data-pop="e05-plummer" data-title="Adénome toxique (maladie de Plummer)"><div id="e05-plummer"><p>L’adénome toxique est un nodule solitaire autonome. L’EANM le désigne par le nom de maladie de Plummer et place l’iode 131 en première ligne pour cette indication.</p><p class="src">Sources : <a href="https://doi.org/10.1007/s00259-023-06274-5" target="_blank" rel="noopener">EANM — recommandation 2023 sur la thérapie par l’iode radioactif des maladies thyroïdiennes bénignes (Campennì et coll.) — 2023</a>.</p></div></template>
<template data-pop="e05-iode-delais-conception" data-title="Conception et allaitement après iode 131 : trois sources"><div id="e05-iode-delais-conception"><p>L’ETA retient un délai de conception d’au moins 6 mois pour les hommes et les femmes. L’EANM conseille d’éviter la grossesse environ 4 mois et d’arrêter l’allaitement au moins 6 semaines avant. L’information professionnelle suisse demande une contraception de 6 mois après une affection bénigne, indique d’éviter une grossesse pendant 6 à 12 mois et exige un sevrage d’au moins 8 semaines. <b>Conduite :</b> enseigner la FI suisse comme référence de prescription.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://doi.org/10.1007/s00259-023-06274-5" target="_blank" rel="noopener">EANM — recommandation 2023 sur la thérapie par l’iode radioactif des maladies thyroïdiennes bénignes (Campennì et coll.) — 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">Swissmedic — iodure de sodium (iode 131) en capsules, Curium, information professionnelle — juillet 2022</a>.</p></div></template>
