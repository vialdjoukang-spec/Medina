<template data-pop="e05-eugogo-gravite" data-title="Gravité de l’orbitopathie selon l’EUGOGO"><div id="e05-eugogo-gravite"><p>L’EUGOGO distingue trois degrés de gravité. L’orbitopathie <b>légère</b> n’a qu’un impact mineur sur la vie quotidienne. L’orbitopathie <b>modérée à sévère</b> n’est pas menaçante pour la vue mais a un impact suffisant sur la vie quotidienne. L’orbitopathie <b>menaçant la vue</b> comprend la neuropathie optique dysthyroïdienne et/ou l’ulcération cornéenne. L’activité (CAS) et la gravité relèvent de deux classifications distinctes de l’EUGOGO.</p><p class="src">Sources : <a href="https://doi.org/10.1530/EJE-21-0479" target="_blank" rel="noopener">EUGOGO — recommandations 2021 sur le traitement médical de l’orbitopathie basedowienne (Bartalena et coll.) — 27 août 2021</a>.</p></div></template>
<template data-pop="e05-selenium" data-title="Sélénium dans l’orbitopathie légère"><div id="e05-selenium"><p>L’EUGOGO recommande une supplémentation en sélénium de 6 mois dans l’orbitopathie légère et active de survenue récente, en particulier dans les régions carencées en sélénium (sélénite de sodium 200 µg par jour, soit 91,2 µg de sélénium). Il n’existe pas de preuve de bénéfice dans les formes modérées à sévères. Une revue de 2025 juge le bénéfice incertain dans les zones riches en sélénium.</p><p>Le statut en sélénium de la population suisse n’a pas été caractérisé dans les sources lues : ce cours n’affirme rien à ce sujet. La décision reste donc individuelle.</p><p class="src">Sources : <a href="https://doi.org/10.1530/EJE-21-0479" target="_blank" rel="noopener">EUGOGO — recommandations 2021 sur le traitement médical de l’orbitopathie basedowienne (Bartalena et coll.) — 27 août 2021</a> ; <a href="https://doi.org/10.1530/ETJ-25-0318" target="_blank" rel="noopener">Bartalena et coll. — comparaison EUGOGO 2021 et consensus ATA/ETA 2022 sur l’orbitopathie — 8 décembre 2025</a>.</p></div></template>
<template data-pop="e05-methylprednisolone-iv" data-title="Méthylprednisolone intraveineuse : schéma cumulé"><div id="e05-methylprednisolone-iv"><p>Le schéma de l’EUGOGO 2021 pour l’orbitopathie modérée à sévère et active est une perfusion de 0,5 g de méthylprednisolone une fois par semaine pendant 6 semaines, puis 0,25 g une fois par semaine pendant 6 semaines. <b>Calcul de la dose cumulée</b> : 6 × 0,5 g = 3,0 g, puis 6 × 0,25 g = 1,5 g, soit 4,5 g au total. Le cumul ne doit pas dépasser 8,0 g par cycle ; un schéma de 7,5 g est réservé aux formes plus sévères. Pour la plupart des formes actives modérées à sévères, l’EUGOGO recommande en première ligne l’association de ce schéma avec le mycophénolate sodique, à 0,72 g par jour pendant 24 semaines. Une monothérapie à dose cumulée plus élevée est une alternative dans les formes les plus sévères de ce groupe, comme indiqué en A10. Le mycophénolate relève ici d’un usage spécialisé hors indication de la FI suisse de Myfortic, qui concerne la prévention du rejet de greffe rénale ; sa dose de transplantation ne doit pas être transposée à l’orbitopathie.</p><p><b>Sécurité.</b> L’information professionnelle suisse de Solu-Medrol signale des hépatites aiguës, parfois mortelles, aux fortes doses (généralement à partir de 1 g par jour), quelques semaines après le début. Le risque est plus élevé en cas d’hypothyroïdie ou d’insuffisance hépatique sévère. Les doses hebdomadaires de 0,5 g du schéma EUGOGO restent sous ce seuil quotidien.</p><p class="src">Sources : <a href="https://doi.org/10.1530/EJE-21-0479" target="_blank" rel="noopener">EUGOGO — recommandations 2021 sur le traitement médical de l’orbitopathie basedowienne (Bartalena et coll.) — 27 août 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680351120812" target="_blank" rel="noopener">Swissmedic — Solu-Medrol (méthylprednisolone), information professionnelle — août 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561150029" target="_blank" rel="noopener">Swissmedic — Myfortic, information professionnelle, indications — novembre 2025</a>.</p></div></template>
<template data-pop="e05-teprotumumab" data-title="Téprotumumab (Tepezza) : monographie suisse"><div id="e05-teprotumumab"><p>L’information professionnelle suisse (mars 2026) indique le téprotumumab pour l’orbitopathie thyroïdienne active modérée à sévère de l’adulte. La dose est de 10 mg/kg pour la première perfusion, puis 20 mg/kg toutes les 3 semaines pour 7 perfusions supplémentaires, soit 8 perfusions au total. Il est contre-indiqué pendant la grossesse ; une contraception efficace est exigée jusqu’à 6 mois après la dernière dose.</p><p>Effets à surveiller : hyperglycémie chez 13,2 % des patients des études en double aveugle; parmi ces patients ayant présenté une hyperglycémie, 80 % avaient un diabète ou une intolérance au glucose préexistants, troubles auditifs parfois permanents (audition à contrôler avant, pendant et après), aggravation d’une maladie inflammatoire chronique de l’intestin (MICI), réactions de perfusion (environ 4 %). Dans l’essai nommé OPTIC, la réponse de l’exophtalmie (≥ 2 mm) atteint 82,9 % contre 9,5 % dans l’autre groupe à 24 semaines ; 29,4 % des répondeurs ont rechuté à 48 semaines.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680697950012" target="_blank" rel="noopener">Swissmedic — Tepezza (téprotumumab), information professionnelle — mars 2026</a>.</p></div></template>
<template data-pop="e05-corticoprophylaxie" data-title="Corticoprophylaxie après iode 131"><div id="e05-corticoprophylaxie"><p>Après l’iode 131, la prévention de l’orbitopathie par un glucocorticoïde oral dépend du risque. L’EUGOGO recommande la prednisone à 0,3–0,5 mg/kg au départ, décroissance et arrêt à 3 mois (risque élevé), ou 0,1–0,2 mg/kg avec arrêt à 6 semaines (risque faible). L’EANM propose 0,2 mg/kg pendant 6 semaines ou 0,3–0,5 mg/kg dégressif, débuté 1 à 3 jours après l’iode 131 ; débuté avant, il réduirait la fixation. Le traitement est inutile si l’orbitopathie est inactive ou absente chez un non-fumeur. L’information professionnelle de Prednisone Streuli existe en comprimés de 5, 20 et 50 mg.</p><p><b>Exemple.</b> Pour une patiente de 60 kg à risque élevé, 0,3–0,5 mg/kg correspond à 18–30 mg par jour au départ (60 × 0,3 = 18 ; 60 × 0,5 = 30).</p><p class="src">Sources : <a href="https://doi.org/10.1530/EJE-21-0479" target="_blank" rel="noopener">EUGOGO — recommandations 2021 sur le traitement médical de l’orbitopathie basedowienne (Bartalena et coll.) — 27 août 2021</a> ; <a href="https://doi.org/10.1007/s00259-023-06274-5" target="_blank" rel="noopener">EANM — recommandation 2023 sur la thérapie par l’iode radioactif des maladies thyroïdiennes bénignes (Campennì et coll.) — 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680293490370" target="_blank" rel="noopener">Swissmedic — Prednisone Streuli 5, 20 et 50 mg, information professionnelle — juin 2026</a>.</p></div></template>
<template data-pop="e05-contentieux-orbitopathie" data-title="Contentieux : première ligne de l’orbitopathie active modérée à sévère, et chirurgie"><div id="e05-contentieux-orbitopathie"><p><b>Première ligne.</b> L’EUGOGO 2021 recommande pour la plupart des formes actives modérées à sévères l’association de méthylprednisolone intraveineuse et de mycophénolate sodique en première ligne. Une monothérapie intraveineuse à dose plus élevée est une option dans des formes plus sévères sélectionnées. Le consensus ATA/ETA 2022 place le téprotumumab en première ligne de presque toutes les formes modérées à sévères actives. L’EUGOGO a rédigé ses recommandations sans accès européen au produit, qui n’a reçu son autorisation européenne qu’en juin 2025 ; la Suisse a autorisé Tepezza (information professionnelle de mars 2026). <b>Conduite :</b> décision en centre thyroïde-œil, en exposant le coût, les effets (audition, glycémie) et la durabilité de la réponse. Disponibilité n’est pas accessibilité.</p><p><b>Chirurgie de la thyroïde.</b> Le tableau 5 de l’ETA 2018 déconseille la thyroïdectomie en cas d’orbitopathie active modérée à sévère ; l’EANM 2023 admet la chirurgie de première intention dans cette situation. <b>Conduite :</b> exposer la divergence, donner la priorité au traitement de l’orbitopathie et à une euthyroïdie stable sous antithyroïdien. Source la plus récente applicable : EANM 2023 pour la chirurgie, comparaison de 2025 pour la première ligne.</p><p class="src">Sources : <a href="https://doi.org/10.1530/EJE-21-0479" target="_blank" rel="noopener">EUGOGO — recommandations 2021 sur le traitement médical de l’orbitopathie basedowienne (Bartalena et coll.) — 27 août 2021</a> ; <a href="https://doi.org/10.1530/ETJ-25-0318" target="_blank" rel="noopener">Bartalena et coll. — comparaison EUGOGO 2021 et consensus ATA/ETA 2022 sur l’orbitopathie — 8 décembre 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680697950012" target="_blank" rel="noopener">Swissmedic — Tepezza (téprotumumab), information professionnelle — mars 2026</a> ; <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://doi.org/10.1007/s00259-023-06274-5" target="_blank" rel="noopener">EANM — recommandation 2023 sur la thérapie par l’iode radioactif des maladies thyroïdiennes bénignes (Campennì et coll.) — 2023</a>.</p></div></template>
<template data-pop="e05-apathique" data-title="Thyrotoxicose apathique du sujet âgé"><div id="e05-apathique"><p>Chez le sujet âgé, la thyrotoxicose peut se présenter sans les signes classiques : fatigue, troubles de l’humeur ou dyspnée seules. L’ETA la nomme thyrotoxicose apathique. À l’inverse, la présentation peut être dramatique : fibrillation auriculaire, insuffisance cardiaque ou syndrome coronarien aigu d’origine ischémique. Cette discrétion explique le retard diagnostique ; elle justifie de doser la TSH devant une fibrillation auriculaire inexpliquée.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/7_Endokrinologie/72_Empfehlungen_SGED/recommandations_postanalytique_bilan_thyroidien_20251010.pdf" target="_blank" rel="noopener">SSCC (approuvé par la SSED) — test réflexe du bilan thyroïdien initial — octobre 2025</a>.</p></div></template>
<template data-pop="e05-grossesse-atd" data-title="Antithyroïdiens pendant la grossesse"><div id="e05-grossesse-atd"><p>Le choix de la molécule repose sur l’organogenèse. Au premier trimestre, l’information professionnelle suisse recommande le propylthiouracile si possible. Après l’organogenèse, elle demande de le remplacer par le carbimazole, à cause de l’hépatotoxicité du propylthiouracile ; l’ETA fixe ce passage à 16 semaines. La dose est la plus faible efficace : la TSH reste encore légèrement supprimée et la T3 et la T4 légèrement élevées (FI), ou la T4 libre maternelle à la limite supérieure de l’intervalle propre à la grossesse (ETA). L’association carbimazole et hormone thyroïdienne (bloquer-remplacer) est contre-indiquée pendant la grossesse. Une contraception fiable est exigée sous carbimazole.</p><p>La FI de Propycil rapporte une insuffisance hépatique chez la femme enceinte et chez deux nouveau-nés exposés par le lait ou in utero.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">Swissmedic — Néo-Mercazole 5 mg (carbimazole), information professionnelle — août 2020</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680563000131" target="_blank" rel="noopener">Swissmedic — Propycil 50 (propylthiouracile), information professionnelle — septembre 2024</a>.</p></div></template>
<template data-pop="e05-embryopathie" data-title="Embryopathie aux thionamides"><div id="e05-embryopathie"><p>Le méthimazole et le carbimazole peuvent provoquer une embryopathie chez 2 à 4 % des enfants exposés, surtout pendant les semaines 6 à 10 : aplasie du cuir chevelu, atrésie des choanes ou de l’œsophage, défauts de la paroi, communication interventriculaire. La fréquence des malformations est la même sous propylthiouracile, mais les anomalies sont moins sévères. C’est pourquoi l’ETA informe la patiente de la possibilité d’arrêter l’antithyroïdien entre 6 et 10 semaines, lorsque les doses sont faibles (méthimazole inférieur à 5–10 mg par jour, propylthiouracile inférieur à 50–100 mg par jour).</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p></div></template>
<template data-pop="e05-trak-grossesse" data-title="Calcul : TRAK en grossesse et seuil de 3 fois la valeur de référence"><div id="e05-trak-grossesse"><p><b>Grandeurs.</b> Le TRAK est la concentration d’anticorps anti-récepteur de la TSH, en UI/l ; le seuil du laboratoire (ici 1,22 UI/l chez Risch) sépare les valeurs négatives des positives. La mère transmet ces anticorps au fœtus, qui peut développer une dysthyroïdie ; l’ETA fixe un second seuil de risque fœtal à trois fois le seuil du laboratoire.</p><p><b>Formule.</b> rapport = TRAK mesuré ÷ seuil du laboratoire. <b>Exemple.</b> TRAK à 4,0 UI/l à 18–22 semaines : 4,0 ÷ 1,22 ≈ 3,3. Trois fois le seuil valent 3 × 1,22 = 3,66 UI/l ; 4,0 dépasse cette valeur. <b>Interprétation :</b> le rapport supérieur à 3 déclenche la surveillance fœtale de la fonction thyroïdienne (échographie spécialisée selon le centre) et le risque de dysthyroïdie néonatale. <b>Limites :</b> le seuil du laboratoire dépend de la méthode ; le rapport se calcule avec le seuil du laboratoire qui a mesuré l’anticorps.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://ribook.risch.ch/de/analysen/tsh" target="_blank" rel="noopener">Laboratoire Risch — catalogue Ribook (TSH, T4 libre, T3 libre, TRAK) — modifié le 30 juillet 2026</a>.</p></div></template>
<template data-pop="e05-allaitement" data-title="Allaitement sous carbimazole : deux positions"><div id="e05-allaitement"><p>L’ETA considère les faibles doses comme sûres (méthimazole inférieur à 20 mg par jour, propylthiouracile inférieur à 250 mg) et conseille de les prendre après la tétée en doses fractionnées ; le méthimazole est préféré. L’information professionnelle suisse de Néo-Mercazole recommande de renoncer de préférence à l’allaitement ; sinon, la dose reste inférieure ou égale à 20 mg par jour, fractionnée après la tétée, avec surveillance de la thyroïde du nourrisson. <b>Conduite :</b> information partagée, au plus 20 mg par jour, surveillance du nourrisson. La FI de Propycil indique que le passage lacté vaut environ 10 % de la concentration plasmatique, sans effet observé sur la thyroïde du nourrisson jusqu’à 750 mg par jour.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">Swissmedic — Néo-Mercazole 5 mg (carbimazole), information professionnelle — août 2020</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680563000131" target="_blank" rel="noopener">Swissmedic — Propycil 50 (propylthiouracile), information professionnelle — septembre 2024</a>.</p></div></template>
<template data-pop="e05-propranolol-grossesse" data-title="Propranolol pendant la grossesse et l’allaitement"><div id="e05-propranolol-grossesse"><p>L’ETA admet le propranolol à 10–40 mg trois à quatre fois par jour pendant une courte période, en citant ses risques : retard de croissance intra-utérin, bradycardie fœtale, hypoglycémie néonatale. L’information professionnelle suisse d’Inderal est plus stricte : pas de prise pendant la grossesse sauf nécessité absolue, et pas d’allaitement. <b>Conduite :</b> durée la plus courte possible, surveillance fœtale ; la FI est prioritaire.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680317060015" target="_blank" rel="noopener">Swissmedic — Inderal 10 mg et 40 mg (propranolol), information professionnelle — janvier 2023</a>.</p></div></template>
<template data-pop="e05-enfant-doses" data-title="Calcul : dose pédiatrique d’antithyroïdien (enfant de 30 kg)"><div id="e05-enfant-doses"><p><b>Grandeurs.</b> La dose pédiatrique s’exprime en milligrammes par kilogramme et par jour (mg/kg/j) : on multiplie la dose par la masse de l’enfant. <b>Exemple, enfant de 30 kg.</b> ETA 2022 : méthimazole de 0,15 à 0,5 mg/kg/j, soit de 4,5 à 15 mg/j (0,15 × 30 = 4,5 ; 0,5 × 30 = 15), en une prise ; carbimazole de 0,25 à 0,75 mg/kg/j, soit de 7,5 à 22,5 mg/j. FI Néo-Mercazole : 0,7–0,8 mg/kg/j, soit 21 à 24 mg/j (0,7 × 30 = 21 ; 0,8 × 30 = 24), en 2 à 3 prises, maximum 30 mg/j avant 12 ans.</p><p><b>Divergence.</b> La dose de la FI suisse est plus élevée et fractionnée ; la borne haute de l’ETA reste voisine. Une dose de 0,6 mg de méthimazole équivaut approximativement à 1 mg de carbimazole. Une dose basse est choisie quand la T4 libre est inférieure ou égale à 35 pmol/l ou la T3 libre inférieure ou égale à 12 pmol/l. La prescription pédiatrique est spécialisée. L’ETA recommande d’éviter le propylthiouracile chez l’enfant et l’adolescent (hépatotoxicité), alors que l’information professionnelle de Propycil indique une posologie dès 10 ans. Le bêtabloquant se dose à 0,25–0,5 mg/kg trois à quatre fois par jour (FI Inderal), soit 7,5 à 15 mg par prise pour 30 kg.</p><p class="src">Sources : <a href="https://doi.org/10.1530/ETJ-21-0073" target="_blank" rel="noopener">ETA — recommandations 2022 sur la maladie de Basedow pédiatrique (Mooij, Cheetham et coll.) — janvier 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">Swissmedic — Néo-Mercazole 5 mg (carbimazole), information professionnelle — août 2020</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680563000131" target="_blank" rel="noopener">Swissmedic — Propycil 50 (propylthiouracile), information professionnelle — septembre 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680317060015" target="_blank" rel="noopener">Swissmedic — Inderal 10 mg et 40 mg (propranolol), information professionnelle — janvier 2023</a>.</p></div></template>
<template data-pop="e05-amiodarone-types" data-title="Amiodarone : traitement selon le type et divergence sur l’arrêt"><div id="e05-amiodarone-types"><p>Selon l’ETA, le type 1 se traite par thionamides, éventuellement associés quelques semaines au perchlorate de sodium, puis thyroïdectomie ou iode 131 ; le type 2 par glucocorticoïdes oraux ; la forme mixte par thionamides, avec un corticoïde ajouté d’emblée en cas de doute ou après quelques semaines. Une thyroïdectomie urgente peut s’imposer si la fonction cardiaque se dégrade vite. Aucun produit suisse n’a été identifié pour le perchlorate.</p><p><b>Divergence sur l’arrêt.</b> L’information professionnelle suisse de Cordarone ne traite que de la surveillance : l’hyperthyroïdie peut survenir jusqu’à quelques mois après l’arrêt. L’ETA recommande une décision individualisée entre cardiologue et endocrinologue ; l’experte bâloise rapporte que la longue demi-vie rend l’arrêt peu utile à court terme. <b>Conduite :</b> décision conjointe ; ne jamais arrêter seul une amiodarone vitale. Pratique bâloise : carbimazole 40–60 mg/j plus prednisone 40 mg/j, contrôle thyroïdien à 2 semaines puis décroissance ; supprimer le sel iodé n’apporte rien face à la charge iodée de l’amiodarone.</p><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/29594056/" target="_blank" rel="noopener">ETA — recommandations 2018 sur les dysfonctions thyroïdiennes liées à l’amiodarone (Bartalena et coll.) — mars 2018, résumé</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680333930163" target="_blank" rel="noopener">Swissmedic — Cordarone comprimés (amiodarone), information professionnelle — avril 2024</a> ; <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a>.</p></div></template>
<template data-pop="e05-contraste-prevention" data-title="Contentieux : prévenir une hyperthyroïdie avant un produit de contraste iodé"><div id="e05-contraste-prevention"><p>Trois sources diffèrent. L’experte suisse de Bâle recommande de doser la TSH avant un produit de contraste iodé chez un patient âgé à risque avec nodules autonomes ; si elle est inférieure à 0,4 mU/l, elle donne du carbimazole 10 à 20 mg au moins 2 heures avant puis pendant 7 à 14 jours, et adresse à l’endocrinologue. L’ETA 2021 juge la prévention par méthimazole ou perchlorate débattue et réserve le traitement aux formes sévères, prolongées ou au sujet âgé cardiaque. L’information professionnelle suisse de Néo-Mercazole précise que les hyperthyroïdies induites par l’iode ne sont pas une indication.</p><p><b>Conduite :</b> présenter la pratique suisse comme un avis d’experte, la FI comme le cadre légal et l’ETA comme une incertitude. Le texte le plus récent applicable est l’ETA 2021 pour la recommandation formelle.</p><p class="src">Sources : <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34395299/" target="_blank" rel="noopener">ETA — recommandations 2021 sur les dysfonctions induites par les produits de contraste iodés (Bednarczuk et coll.) — 16 juin 2021, résumé</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">Swissmedic — Néo-Mercazole 5 mg (carbimazole), information professionnelle — août 2020</a>.</p></div></template>
<template data-pop="pareto-e05-patho" data-title="Loi de Pareto — Pathologie et prise en charge"><div id="pareto-e05-patho"><p class="ratio" data-cover="e05-a01,e05-a02,e05-a03,e05-a04,e05-a05,e05-a06,e05-a07,e05-a08,e05-a09,e05-a10,e05-a11,e05-a12"></p><ul><li>La thyrotoxicose franche associe une TSH inférieure à 0,1 mU/l et une T4 libre élevée ; la maladie de Basedow se confirme par un TRAK positif.</li><li>La crise thyrotoxique se reconnaît par le score de Burch-Wartofsky d’au moins 45 ou les critères JTA et se traite en soins intensifs par antithyroïdien, iodure, glucocorticoïde et bêtabloquant.</li><li>L’antithyroïdien dure 12 à 18 mois et l’arrêt exige un TRAK normal ; une fièvre ou une angine sous traitement évoque une agranulocytose.</li><li>L’iode 131 est exclu en grossesse, en allaitement et dans l’orbitopathie active modérée à sévère ; en grossesse, propylthiouracile puis carbimazole après 16 semaines.</li><li>L’orbitopathie est active à partir de CAS 3/7 ; le tabac est le facteur de risque modifiable majeur.</li></ul><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://www.jstage.jst.go.jp/article/endocrj/63/12/63_EJ16-0336/_pdf" target="_blank" rel="noopener">JTA — recommandations 2016 sur la crise thyrotoxique (Satoh et coll.) — 2016</a> ; <a href="https://doi.org/10.1530/EJE-21-0479" target="_blank" rel="noopener">EUGOGO — recommandations 2021 sur le traitement médical de l’orbitopathie basedowienne (Bartalena et coll.) — 27 août 2021</a> ; <a href="https://doi.org/10.1007/s00259-023-06274-5" target="_blank" rel="noopener">EANM — recommandation 2023 sur la thérapie par l’iode radioactif des maladies thyroïdiennes bénignes (Campennì et coll.) — 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">Swissmedic — Néo-Mercazole 5 mg (carbimazole), information professionnelle — août 2020</a>.</p></div></template>
<template data-pop="e05-loglineaire" data-title="Calcul : pourquoi la TSH varie beaucoup quand la T4 libre varie peu"><div id="e05-loglineaire"><p><b>Grandeurs.</b> La T4 libre mesure l’hormone active circulante (en pmol/l) ; la TSH mesure le signal hypophysaire (en mU/l). La relation entre les deux est inverse et logarithmique-linéaire : quand la T4 libre double, la TSH ne baisse pas de moitié, elle est divisée par un facteur bien plus grand. C’est pourquoi une TSH est plus sensible qu’une hormone libre pour détecter une anomalie.</p><p><b>Exemple chiffré avec les intervalles du laboratoire Risch (adulte).</b> L’intervalle de la T4 libre va de 12 à 24,1 pmol/l : sa borne supérieure vaut 2,0 fois la borne inférieure (24,1 ÷ 12 ≈ 2,0). L’intervalle de la TSH va de 0,27 à 4,2 mU/l : sa borne supérieure vaut 15,6 fois la borne inférieure (4,2 ÷ 0,27 ≈ 15,6). Ces rapports comparent les bornes de deux intervalles de population. Ils ne permettent pas de calculer la variation de TSH produite par un doublement de T4 libre chez un individu, ni de déduire la pente de la relation TSH–T4.</p><p><b>Cas de Mme L.</b> Sa T4 libre est à 48 pmol/l, soit 2,0 fois la borne supérieure ; sa TSH, inférieure à 0,01 mU/l, est au moins 27 fois sous la borne inférieure (0,27 ÷ 0,01 = 27). <b>Limites.</b> Les deux intervalles décrivent des populations, non la courbe d’un individu; leurs quotients ne mesurent pas sa réponse physiologique. Le rapport ne s’applique pas aux dysthyroïdies centrales ni à l’adénome thyréotrope, où la TSH ne suit plus la T4 libre.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://ribook.risch.ch/de/analysen/tsh" target="_blank" rel="noopener">Laboratoire Risch — catalogue Ribook (TSH, T4 libre, T3 libre, TRAK) — modifié le 30 juillet 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/7_Endokrinologie/72_Empfehlungen_SGED/recommandations_postanalytique_bilan_thyroidien_20251010.pdf" target="_blank" rel="noopener">SSCC (approuvé par la SSED) — test réflexe du bilan thyroïdien initial — octobre 2025</a>.</p></div></template>
<template data-pop="e05-trak-methodes" data-title="TRAK : méthodes de dosage et chiffres"><div id="e05-trak-methodes"><p>Les immunodosages de liaison (TBII) mesurent la compétition des anticorps avec la TSH sur le récepteur ; ils indiquent la présence d’anticorps, non leur fonction. Les bio-essais cellulaires distinguent les anticorps stimulants (TSAb) des anticorps bloquants. Les TSAb prédisent les atteintes extrathyroïdiennes et l’hyperthyroïdie fœtale ou néonatale ; leur emploi précoce a raccourci de 46 % le délai diagnostique dans une étude citée par l’ETA.</p><p>L’ETA rapporte une sensibilité de 97 % et une spécificité de 98 % pour les tests de liaison de deuxième et troisième génération. Le laboratoire suisse de référence indique que le TRAK est présent dans environ 90 % des maladies de Basedow et dans moins de 10 % des thyroïdites d’Hashimoto, et qu’il n’est pas élevé dans l’autonomie. Les deux chiffres dépendent de la méthode et de la population.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://ribook.risch.ch/de/analysen/tsh" target="_blank" rel="noopener">Laboratoire Risch — catalogue Ribook (TSH, T4 libre, T3 libre, TRAK) — modifié le 30 juillet 2026</a>.</p></div></template>
<template data-pop="e05-heparine-ft4" data-title="Héparine et T4 libre faussement élevée"><div id="e05-heparine-ft4"><p>Chez un patient héparinisé, la T4 libre peut être faussement élevée, car l’héparine déplace la thyroxine de ses protéines de liaison. Le laboratoire suisse de référence le signale dans son interprétation de la T4 libre. Devant une T4 libre isolément élevée chez un patient héparinisé, le médecin confronte le résultat à la TSH et à la clinique avant de conclure.</p><p class="src">Sources : <a href="https://ribook.risch.ch/de/analysen/tsh" target="_blank" rel="noopener">Laboratoire Risch — catalogue Ribook (TSH, T4 libre, T3 libre, TRAK) — modifié le 30 juillet 2026</a>.</p></div></template>
<template data-pop="e05-thyroglobuline" data-title="Thyroglobuline : un indice de thyrotoxicose factice"><div id="e05-thyroglobuline"><p>La thyroglobuline est la protéine sur laquelle l’iode s’organifie dans la thyroïde. Dans la thyrotoxicose factice, la thyroïde est freinée et la thyroglobuline sérique est basse ou indétectable. C’est le critère biologique qui oriente vers un apport exogène, avec la fixation d’iode basse et l’absence d’anticorps.</p><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/10195380/" target="_blank" rel="noopener">Bogazzi, Bartalena et coll. — thyrotoxicose factice, séries italiennes — 1996 et 1999, résumés</a> ; <a href="https://doi.org/10.3390/ijms24043393" target="_blank" rel="noopener">Köhrle — sélénium, iode et fer dans la synthèse des hormones thyroïdiennes — 2023</a>.</p></div></template>
<template data-pop="e05-doppler-vitesses" data-title="Vitesses systoliques au Doppler"><div id="e05-doppler-vitesses"><p>Le Doppler mesure la vitesse du sang dans l’artère thyroïdienne. Les vitesses systoliques de pic sont élevées dans la maladie de Basedow, où la glande est très vascularisée, et abaissées dans la thyroïdite subaiguë et dans la thyrotoxicose à l’amiodarone de type 2, où le débit est réduit. Cette différence de débit sépare l’hyperthyroïdie par hypersécrétion de la thyrotoxicose par destruction. L’ETA décrit aussi un Doppler sans hypervascularisation et à vitesses normales dans la thyrotoxicose factice.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/10195380/" target="_blank" rel="noopener">Bogazzi, Bartalena et coll. — thyrotoxicose factice, séries italiennes — 1996 et 1999, résumés</a>.</p></div></template>
<template data-pop="e05-scinti-lecture" data-title="Scintigraphie : lire les cinq profils"><div id="e05-scinti-lecture"><p>La figure 4 reproduit cinq profils au technétium 99m. <b>A.</b> Thyroïde normale. <b>B.</b> Maladie de Basedow : fixation diffuse, intense. <b>C.</b> Goitre multinodulaire toxique : fixation hétérogène, en foyers. <b>D.</b> Adénome toxique : un nodule chaud, avec parenchyme freiné autour. <b>E.</b> Thyroïdite : fixation quasi nulle.</p><p>La lecture suit la logique du mécanisme. Un tissu stimulé par les anticorps fixe l’iode partout (B). Un tissu autonome fixe en foyers, le reste de la glande étant freiné par la TSH basse (C, D). Un tissu détruit ne fixe plus (E). Le technétium est capté par le même symporteur que l’iodure (onglet Sciences, S03).</p><p class="src">Sources : <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a> ; <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://doi.org/10.3390/ijms24043393" target="_blank" rel="noopener">Köhrle — sélénium, iode et fer dans la synthèse des hormones thyroïdiennes — 2023</a>.</p></div></template>
<template data-pop="e05-nodule-chaud" data-title="Nodule chaud : cytoponction habituellement évitée, exception suspecte"><div id="e05-nodule-chaud"><p>Environ 5 à 10 % des nodules thyroïdiens solitaires ou dominants sont fonctionnels. Un nodule hyperfonctionnel est rarement malin. Selon l’ETA 2023, il n’est habituellement pas ponctionné, sauf s’il est hautement suspect de malignité. La concordance entre scintigraphie et échographie reste donc importante. La scintigraphie, indiquée quand la TSH est infranormale en présence de nodules, permet donc d’éviter une cytoponction inutile et de juger de l’éligibilité à l’iode 131. À l’inverse, un nodule non fonctionnel (froid) aux caractères échographiques suspects est ponctionné.</p><p class="src">Sources : <a href="https://doi.org/10.1530/ETJ-23-0067" target="_blank" rel="noopener">ETA — recommandations 2023 sur les nodules thyroïdiens (Durante et coll.) — 1 octobre 2023</a>.</p></div></template>
<template data-pop="e05-marinelli" data-title="Formule de Marinelli et doses absorbées (FI suisse)"><div id="e05-marinelli"><p>L’information professionnelle suisse de la capsule d’iode 131 vise une dose absorbée de 300 à 400 Gy pour une autonomie unifocale, 150 Gy pour une autonomie multifocale et 200 à 300 Gy pour la maladie de Basedow. Elle cite la formule de Marinelli avec un facteur K de 24,67. La formule elle-même n’est pas reproduite par les passages lus : ce cours ne la détaille donc pas.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">Swissmedic — iodure de sodium (iode 131) en capsules, Curium, information professionnelle — juillet 2022</a>.</p></div></template>
<template data-pop="e05-calc-activite" data-title="Calcul : activité d’iode 131 pour 200 Gy (EANM)"><div id="e05-calc-activite"><p><b>Grandeurs.</b> L’activité administrée s’exprime en mégabecquerels (becquerel : une désintégration par seconde ; un mégabecquerel en vaut un million). La dose absorbée par la thyroïde s’exprime en grays (Gy). La masse de la glande, en grammes, mesurée à l’échographie, et la fixation d’iode radioactif à 24 heures (en fraction de 1) complètent le calcul : plus la glande est grosse, plus il faut d’activité ; plus elle fixe, moins il en faut.</p><p><b>Formule (EANM, équation 3).</b> Pour une dose absorbée de 200 Gy, l’activité est d’environ 8 × masse (g) ÷ fixation à 24 heures. <b>Exemple.</b> Glande de 35 g, fixation de 65 % (0,65) : 8 × 35 = 280 ; 280 ÷ 0,65 ≈ 431, soit environ 430 mégabecquerels. <b>Comparaison :</b> les activités fixes habituelles de la maladie de Basedow sont de 370 à 555 mégabecquerels ; l’exemple (430) tombe dans cette plage.</p><p><b>Interprétation et limites.</b> Une dose absorbée de 100 à 150 Gy vise l’euthyroïdie et de 200 à 300 Gy l’ablation. L’ablation réussit dans plus de 90 % des cas avec une dose calculée, contre moins de 70 % avec une dose fonctionnelle. Le calcul exige la masse et la fixation du patient ; le coefficient 8 correspond à 200 Gy et diffère pour les autres doses cibles.</p><p class="src">Sources : <a href="https://doi.org/10.1007/s00259-023-06274-5" target="_blank" rel="noopener">EANM — recommandation 2023 sur la thérapie par l’iode radioactif des maladies thyroïdiennes bénignes (Campennì et coll.) — 2023</a>.</p></div></template>
<template data-pop="e05-agranulocytose" data-title="Agranulocytose aux antithyroïdiens : définition et conduite"><div id="e05-agranulocytose"><p>L’agranulocytose se définit par des neutrophiles inférieurs à 500/µL (0,5 × 10⁹/L). Elle survient chez 0,1 à 1,0 % des patients, brutalement, dans les trois premiers mois (incidence cumulée de 0,28 % à 100 jours). La FI suisse la range parmi les effets « occasionnels » (au moins 1 pour 1000 et moins de 1 pour 100). Les patients de plus de 40 ans reçoivent une formule sanguine avant le traitement puis chaque semaine pendant 6 semaines (FI) ; l’ETA recommande seulement une formule en cas de fièvre ou d’angine. Dans tous les cas : fièvre, malaise, hématomes, saignements, aphtes ou maux de gorge imposent l’arrêt immédiat et une formule sanguine en urgence. Des facteurs génétiques existent (onglet Sciences, S04).</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">Swissmedic — Néo-Mercazole 5 mg (carbimazole), information professionnelle — août 2020</a>.</p></div></template>
<template data-pop="e05-hepatite-ptu" data-title="Hépatotoxicité du propylthiouracile"><div id="e05-hepatite-ptu"><p>Le propylthiouracile peut provoquer une insuffisance hépatique aiguë, parfois mortelle ou nécessitant une greffe, surtout dans les 6 premiers mois. Les tests hépatiques de surveillance ne permettent pas de prévoir l’accident. Chez l’enfant, l’ETA rapporte une insuffisance hépatique jusqu’à 1 sur 2000 exposés et déconseille le médicament chez l’enfant et l’adolescent. L’ETA cite l’ictère cholestatique pour le carbimazole et le méthimazole.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680563000131" target="_blank" rel="noopener">Swissmedic — Propycil 50 (propylthiouracile), information professionnelle — septembre 2024</a> ; <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p></div></template>
<template data-pop="e05-irm-orbite" data-title="IRM de l’orbite"><div id="e05-irm-orbite"><p>L’imagerie par résonance magnétique de l’orbite figure parmi les examens décisifs de l’exophtalmie : elle est indiquée en cas de doute sur la nature de l’orbitopathie, ou en cas de menace pour le nerf optique. Elle montre l’épaississement des muscles oculomoteurs, en particulier des droits médiaux, qui projette le globe vers l’avant dans l’orbitopathie basedowienne.</p></div></template>
<template data-pop="pareto-e05-exam" data-title="Loi de Pareto — Examens complémentaires"><div id="pareto-e05-exam"><p class="ratio" data-cover="e05-e01,e05-e02,e05-e03"></p><ul><li>Le test réflexe suisse dose la TSH seule, puis ajoute la T4 libre et la T3 si la TSH est supprimée ; les intervalles sont ceux du laboratoire (Risch, adulte : TSH 0,27–4,2 mU/l).</li><li>Le TRAK est positif dans environ 90 % (laboratoire suisse) à 97 % (ETA, sensibilité) des maladies de Basedow ; un TRAK négatif n’exclut pas la maladie.</li><li>L’échographie Doppler avec le TRAK suffit souvent ; la scintigraphie est indiquée avec des nodules, un TRAK négatif ou avant l’iode 131.</li><li>Des neutrophiles inférieurs à 500/µL (0,5 × 10⁹/L) définissent l’agranulocytose ; fièvre ou angine imposent l’arrêt et une formule en urgence.</li></ul><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/7_Endokrinologie/72_Empfehlungen_SGED/recommandations_postanalytique_bilan_thyroidien_20251010.pdf" target="_blank" rel="noopener">SSCC (approuvé par la SSED) — test réflexe du bilan thyroïdien initial — octobre 2025</a> ; <a href="https://ribook.risch.ch/de/analysen/tsh" target="_blank" rel="noopener">Laboratoire Risch — catalogue Ribook (TSH, T4 libre, T3 libre, TRAK) — modifié le 30 juillet 2026</a> ; <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a>.</p></div></template>
<template data-pop="e05-calc-delai" data-title="Calcul : pourquoi l’antithyroïdien met 2 à 3 semaines à agir"><div id="e05-calc-delai"><p><b>Grandeurs.</b> Le stock d’hormone est la réserve de T4 et de T3 déjà iodées, liées à la thyroglobuline dans la colloïde. La demi-vie de la T4 est le temps nécessaire pour que sa concentration sanguine soit divisée par deux. Un antithyroïdien bloque la fabrication de nouvelles hormones ; il ne retire pas ce qui est déjà formé.</p><p><b>Constat de la FI.</b> Le propylthiouracile atteint son plein effet après 2 à 3 semaines, c’est-à-dire lorsque les hormones stockées dans la thyroïde sont épuisées. De plus, la demi-vie de la T4 circulante est de 7 jours chez le sujet sain et de 3 à 4 jours en hyperthyroïdie (FI Euthyrox). <b>Calcul d’ordre de grandeur :</b> 21 jours (3 semaines) représentent de 5 à 7 demi-vies de 3 à 4 jours (21 ÷ 4 ≈ 5,3 ; 21 ÷ 3 = 7).</p><p><b>Interprétation.</b> Il faut le temps d’épuiser le stock puis d’éliminer la T4 circulante : d’où un premier contrôle à 3–4 semaines (ETA) et l’intérêt du bêtabloquant d’emblée pour les symptômes. <b>Limites.</b> Ce cours ne présente pas de courbe chiffrée de décroissance, car aucune source lue n’en fournit.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680563000131" target="_blank" rel="noopener">Swissmedic — Propycil 50 (propylthiouracile), information professionnelle — septembre 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">Swissmedic — Euthyrox (lévothyroxine), information professionnelle — février 2023</a> ; <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p></div></template>
<template data-pop="pareto-e05-sci" data-title="Loi de Pareto — Sciences fondamentales"><div id="pareto-e05-sci"><p class="ratio" data-cover="e05-s01,e05-s02,e05-s03,e05-s04"></p><ul><li>Le Basedow est dû à des anticorps stimulants (surtout IgG1) du récepteur de la TSH : AMPc élevé, hormones libérées, hyperplasie des thyréocytes.</li><li>La relation TSH–T4 libre est logarithmique-linéaire ; la demi-vie de la T4 est de 3 à 4 jours en hyperthyroïdie.</li><li>Le symporteur sodium-iodure et la thyroperoxydase sont les cibles de la scintigraphie, du perchlorate et des thionamides.</li><li>Le récepteur de l’IGF-1 relie thyroïde et orbite.</li></ul><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">Swissmedic — Euthyrox (lévothyroxine), information professionnelle — février 2023</a> ; <a href="https://doi.org/10.3390/ijms24043393" target="_blank" rel="noopener">Köhrle — sélénium, iode et fer dans la synthèse des hormones thyroïdiennes — 2023</a>.</p></div></template>
<template data-pop="e05-m-neomercazole" data-title="Monographie suisse : Néo-Mercazole 5 mg (carbimazole)"><div id="e05-m-neomercazole"><p><b>Produit exact.</b> Néo-Mercazole 5 mg, comprimés de carbimazole, autorisation Swissmedic n° 21037 ; information mise à jour en août 2020.</p><p><b>Mécanisme.</b> Le carbimazole est une prodrogue transformée en thiamazole (méthimazole), qui inhibe la thyroperoxydase et donc la synthèse hormonale. Le thiamazole est absorbé à 90–100 % en 15 à 30 minutes ; le pic est atteint en 1 à 2 heures ; le volume de distribution est d’environ 0,5 l/kg et la liaison aux protéines de 40 %. Il s’accumule dans la thyroïde (rapport thyroïde sur plasma d’environ 100 pour 1) : sa demi-vie plasmatique est de 4 à 12 heures, mais son séjour intrathyroïdien dure environ 20 heures, ce qui définit la durée d’action d’une dose. L’élimination est urinaire à 75–80 % ; le produit passe le placenta et le lait.</p><p><b>Posologie.</b> Dose initiale de 20 à 60 mg par jour en deux ou trois prises pendant 15 à 30 jours, réduite par paliers de 5 à 15 mg tous les 10 jours jusqu’à 5–20 mg par jour ; durée habituelle de 6 à 18 mois. Adolescents dès 12 ans : 0,7 à 0,8 mg/kg/j, maximum 60 mg/j ; enfants de moins de 12 ans : mêmes 0,7–0,8 mg/kg/j, maximum 30 mg.</p><p><b>Contre-indications.</b> Hypersensibilité, cancer de la thyroïde TSH-dépendant, signes de compression trachéale, goitre simple, affections hématologiques sévères (en particulier granulopénie), insuffisance hépatique sévère, antécédent de pancréatite aiguë sous carbimazole ou thiamazole. Les hyperthyroïdies induites par l’iode ne sont pas une indication.</p><p><b>Effets et surveillance.</b> Agranulocytose « occasionnelle » (au moins 1 pour 1000 et moins de 1 pour 100) : formule sanguine avant le traitement et chaque semaine pendant 6 semaines chez les patients de plus de 40 ans, surtout pendant les deux premiers mois et à plus de 40 mg par jour ; arrêt immédiat en cas de fièvre, malaise, hématomes, saignements, aphtes ou maux de gorge. La disponibilité commerciale se revérifie au moment de prescrire.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">Swissmedic — Néo-Mercazole 5 mg (carbimazole), information professionnelle — août 2020</a>.</p><p><b>Fonctions hépatique et rénale.</b> La FI contre-indique Néo-Mercazole en cas d’insuffisance hépatique sévère (Child Pugh C). En Child Pugh A ou B, elle demande de la prudence du fait de l’allongement possible de la demi-vie. En insuffisance rénale, les données sont limitées : précaution particulière et surveillance régulière des paramètres thyroïdiens, sans pourcentage forfaitaire d’adaptation.</p></div></template>
<template data-pop="e05-m-propycil" data-title="Monographie suisse : Propycil 50 (propylthiouracile)"><div id="e05-m-propycil"><p><b>Produit exact.</b> Propycil 50, comprimés de propylthiouracile, autorisation n° 56300 ; information de septembre 2024.</p><p><b>Pharmacocinétique.</b> Biodisponibilité d’environ 80 %, pic en 1 à 2 heures, liaison protéique de 75 %, volume de distribution de 14 litres, peu d’accumulation thyroïdienne, glucuronidation hépatique de 60 %, demi-vie de 1 à 2 heures (d’où trois prises par jour). L’effet complet s’installe en 2 à 3 semaines, quand les hormones stockées sont épuisées.</p><p><b>Posologie.</b> Adultes, adolescents et enfants dès 10 ans : 75 à 100 mg trois fois par jour. Formes graves ou contamination iodée : 300 à 600 mg par jour en 4 à 6 prises. Entretien : 25 à 150 mg par jour.</p><p><b>Contre-indications.</b> Agranulocytose ou trouble grave de l’hématopoïèse, insuffisance hépatique grave, carcinome thyroïdien, hypersensibilité.</p><p><b>Effets et surveillance.</b> Insuffisance hépatique aiguë, parfois mortelle ou nécessitant une greffe, surtout dans les 6 premiers mois et imprévisible par les tests hépatiques : le propylthiouracile est à éviter chez l’enfant et l’adolescent. Vascularite à ANCA rapportée (peau, poumons, reins, articulations) : arrêt et bilan immunologique. L’iode et les produits de contraste diminuent l’efficacité ; le médicament augmente la fraction libre du propranolol et des coumariniques (INR). Il passe dans le lait à environ 10 % de la concentration plasmatique. La disponibilité commerciale se revérifie au moment de prescrire.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680563000131" target="_blank" rel="noopener">Swissmedic — Propycil 50 (propylthiouracile), information professionnelle — septembre 2024</a>.</p></div></template>
<template data-pop="e05-m-inderal" data-title="Monographie suisse : Inderal 10 mg et 40 mg (propranolol)"><div id="e05-m-inderal"><p><b>Produit exact.</b> Inderal 10 mg et 40 mg, autorisation n° 31706 ; information de janvier 2023.</p><p><b>Indication et posologie.</b> L’hyperthyroïdie et les crises thyréotoxiques figurent parmi les indications : 10 à 40 mg trois à quatre fois par jour ; chez l’enfant en thyrotoxicose, 0,25 à 0,5 mg/kg trois à quatre fois par jour. L’ETA cite 20 à 40 mg toutes les 6 heures chez l’adulte et 40 mg quatre fois par jour pour freiner la conversion de T4 en T3.</p><p><b>Contre-indications.</b> Asthme ou bronchospasme (actuel ou passé), bradycardie, hypotension, insuffisance cardiaque décompensée, bloc auriculo-ventriculaire des 2e et 3e degrés, choc cardiogénique, angor de Prinzmetal, artériopathie sévère, maladie du sinus, phéochromocytome non traité, acidose métabolique, jeûne prolongé.</p><p><b>Mises en garde.</b> Le médicament peut masquer une thyrotoxicose et une hypoglycémie ; ne pas l’interrompre brutalement chez le coronarien. Il est déconseillé pendant la grossesse sauf nécessité absolue, et l’allaitement est déconseillé. La disponibilité commerciale se revérifie au moment de prescrire.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680317060015" target="_blank" rel="noopener">Swissmedic — Inderal 10 mg et 40 mg (propranolol), information professionnelle — janvier 2023</a> ; <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p></div></template>
<template data-pop="e05-m-brevibloc" data-title="Monographie suisse : Brevibloc (esmolol)"><div id="e05-m-brevibloc"><p><b>Produit exact.</b> Brevibloc (esmolol), autorisation n° 49’576 ; information de septembre 2013, la plus ancienne des informations lues ; elle ne cite pas la crise thyrotoxique comme indication.</p><p><b>Indication.</b> Abaisser rapidement la fréquence cardiaque dans la fibrillation, le flutter et la tachycardie sinusale. <b>Posologie.</b> Dose de charge de 500 µg/kg/min pendant une minute, puis 50 µg/kg/min pendant 4 minutes, avec titration ; entretien habituel de 100 µg/kg/min ; les doses supérieures à 200 µg/kg/min n’apportent pas d’avantage ; durée maximale de 24 heures. La JTA désigne l’esmolol comme bêtabloquant β1-sélectif de première intention dans la crise thyrotoxique (partie A07). La disponibilité commerciale se revérifie au moment de prescrire.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680495760219" target="_blank" rel="noopener">Swissmedic — Brevibloc (esmolol), information professionnelle — septembre 2013</a> ; <a href="https://www.jstage.jst.go.jp/article/endocrj/63/12/63_EJ16-0336/_pdf" target="_blank" rel="noopener">JTA — recommandations 2016 sur la crise thyrotoxique (Satoh et coll.) — 2016</a>.</p></div></template>
<template data-pop="e05-m-iode131" data-title="Monographie suisse : iodure de sodium (iode 131) en capsules, Curium"><div id="e05-m-iode131"><p><b>Produit exact.</b> Iodure de sodium (iode 131), capsules, Curium, autorisation n° 52728 ; information de juillet 2022.</p><p><b>Dosimétrie.</b> Dose absorbée visée : 300 à 400 Gy pour une autonomie unifocale, 150 Gy pour une autonomie multifocale, 200 à 300 Gy pour la maladie de Basedow (formule de Marinelli, K = 24,67). <b>Préparation.</b> Carbimazole ou méthimazole arrêtés au moins 2 jours avant, propylthiouracile au moins 2 semaines avant ; régime pauvre en iode 3 à 5 jours avant.</p><p><b>Contre-indications.</b> Grossesse, allaitement (sevrage au moins 8 semaines avant), dysphagie, sténose ou diverticule œsophagien, gastrite évolutive, ulcère, ralentissement de la motilité digestive. <b>Surveillance et conseils.</b> Une aggravation de l’hyperthyroïdie est possible 2 à 10 jours après, voire une crise ; contraception 6 mois après le traitement d’une affection bénigne ; éviter tout contact rapproché avec un jeune enfant pendant au moins une semaine. En Suisse, à partir de 200 mégabecquerels, une hospitalisation d’au moins 48 heures est la règle, sous réserve d’une dérogation individuelle OFSP, notamment pour une application ambulatoire entre 200 et 400 mégabecquerels (BAG, partie A09). La disponibilité commerciale se revérifie au moment de prescrire.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">Swissmedic — iodure de sodium (iode 131) en capsules, Curium, information professionnelle — juillet 2022</a> ; <a href="https://www.bag.admin.ch/dam/de/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_DE.pdf" target="_blank" rel="noopener">BAG — guide de radioprotection, thérapie par radionucléides, version 2 — 24 juin 2025</a>.</p></div></template>
<template data-pop="e05-m-tepezza" data-title="Monographie suisse : Tepezza (téprotumumab)"><div id="e05-m-tepezza"><p><b>Produit exact.</b> Tepezza (téprotumumab), perfusion, autorisation n° 69795 ; information de mars 2026.</p><p><b>Indication et posologie.</b> Orbitopathie thyroïdienne active modérée à sévère de l’adulte : 10 mg/kg à la première perfusion, puis 20 mg/kg toutes les 3 semaines pour 7 perfusions supplémentaires. <b>Efficacité.</b> Essai nommé OPTIC : réponse de l’exophtalmie (≥ 2 mm) de 82,9 % contre 9,5 % à 24 semaines ; 29,4 % des répondeurs ont rechuté à 48 semaines. L’année de publication n’est pas donnée par les passages lus.</p><p><b>Sécurité.</b> Contre-indiqué pendant la grossesse ; contraception efficace jusqu’à 6 mois après la dernière dose. Hyperglycémie chez 13,2 % des patients des études en double aveugle; 80 % des patients ayant présenté cette hyperglycémie avaient un diabète ou une intolérance au glucose préexistants ; troubles auditifs parfois permanents (audition à contrôler avant, pendant et après) ; aggravation d’une maladie inflammatoire chronique de l’intestin ; réactions de perfusion chez environ 4 %. La disponibilité commerciale se revérifie au moment de prescrire.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680697950012" target="_blank" rel="noopener">Swissmedic — Tepezza (téprotumumab), information professionnelle — mars 2026</a>.</p></div></template>
<template data-pop="e05-m-methylprednisolone" data-title="Monographie suisse : Solu-Medrol (méthylprednisolone)"><div id="e05-m-methylprednisolone"><p><b>Produit exact.</b> Solu-Medrol (méthylprednisolone), autorisation n° 35112 ; information d’août 2025.</p><p><b>Usage dans l’orbitopathie.</b> Le schéma intraveineux de l’EUGOGO (0,5 g par semaine pendant 6 semaines puis 0,25 g par semaine pendant 6 semaines, soit 4,5 g cumulés) provient de l’EUGOGO ; les passages lus de l’information professionnelle suisse ne le reprennent pas. <b>Sécurité.</b> À forte dose (généralement à partir de 1 g par jour), des atteintes hépatiques, dont des hépatites aiguës parfois mortelles, ont été rapportées après quelques semaines ; l’hypothyroïdie et l’insuffisance hépatique sévère renforcent l’effet. La disponibilité commerciale se revérifie au moment de prescrire.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680351120812" target="_blank" rel="noopener">Swissmedic — Solu-Medrol (méthylprednisolone), information professionnelle — août 2025</a> ; <a href="https://doi.org/10.1530/EJE-21-0479" target="_blank" rel="noopener">EUGOGO — recommandations 2021 sur le traitement médical de l’orbitopathie basedowienne (Bartalena et coll.) — 27 août 2021</a>.</p></div></template>
<template data-pop="e05-m-prednisone" data-title="Monographie suisse : Prednisone Streuli 5, 20 et 50 mg"><div id="e05-m-prednisone"><p><b>Produit exact.</b> Prednisone Streuli, comprimés de 5, 20 et 50 mg, autorisation n° 29349 ; information de juin 2026.</p><p><b>Usage dans l’orbitopathie.</b> Corticoprophylaxie après iode 131 : 0,3–0,5 mg/kg puis décroissance et arrêt à 3 mois (risque élevé) ou 0,1–0,2 mg/kg avec arrêt à 6 semaines (risque faible) selon l’EUGOGO. <b>Sécurité.</b> Chez un patient hyperthyroïdien, une hypokaliémie induite par la prednisone peut provoquer une paralysie périodique thyrotoxique ; le potassium est donc surveillé. La disponibilité commerciale se revérifie au moment de prescrire.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680293490370" target="_blank" rel="noopener">Swissmedic — Prednisone Streuli 5, 20 et 50 mg, information professionnelle — juin 2026</a> ; <a href="https://doi.org/10.1530/EJE-21-0479" target="_blank" rel="noopener">EUGOGO — recommandations 2021 sur le traitement médical de l’orbitopathie basedowienne (Bartalena et coll.) — 27 août 2021</a>.</p></div></template>
<template data-pop="e05-m-solucortef" data-title="Monographie suisse : Solu-Cortef (hydrocortisone)"><div id="e05-m-solucortef"><p><b>Produit exact.</b> Solu-Cortef (hydrocortisone), flacons de 100 et 250 mg, autorisation n° 23533 ; information d’octobre 2025.</p><p><b>Posologie.</b> Doses initiales jusqu’à 100 mg par voie intraveineuse en 30 secondes au minimum. <b>Indications libellées.</b> Notamment la thyroïdite non suppurative et le choc avec insuffisance surrénale présumée. La crise thyrotoxique n’est pas une indication libellée. Le schéma retenu en A07 vient du consensus européen de 2026 : charge intraveineuse de 100 mg, puis 50 mg quatre fois par jour. La FI suisse ne décrit pas ce schéma de crise ; sa prescription relève de l’équipe hospitalière spécialisée. Une divergence historique est conservée et attribuée : la JTA 2016 recommande 300 mg par jour, soit 100 mg par voie intraveineuse toutes les 8 heures. Ce schéma diffère de celui retenu en A07. La disponibilité commerciale se revérifie au moment de prescrire.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">Swissmedic — Solu-Cortef (hydrocortisone), information professionnelle — octobre 2025</a> ; <a href="https://doi.org/10.1530/ETJ-26-0043" target="_blank" rel="noopener">ETA et sociétés britanniques — consensus sur la crise thyrotoxique, traitement par corticostéroïdes — août 2026</a> ; <a href="https://www.jstage.jst.go.jp/article/endocrj/63/12/63_EJ16-0336/_pdf" target="_blank" rel="noopener">JTA — recommandations 2016 sur la crise thyrotoxique (Satoh et coll.) — 2016</a>.</p></div></template>
<template data-pop="e05-pancreatite" data-title="Pancréatite aiguë sous thionamide"><div id="e05-pancreatite"><p>L’information professionnelle suisse de Néo-Mercazole contre-indique le médicament chez un patient qui a développé une pancréatite aiguë sous carbimazole ou thiamazole. Une douleur abdominale intense sous traitement impose d’y penser. Le choix du médicament suivant relève d’un avis spécialisé.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">Swissmedic — Néo-Mercazole 5 mg (carbimazole), information professionnelle — août 2020</a>.</p></div></template>
<template data-pop="e05-anca" data-title="Vascularite à ANCA sous antithyroïdien"><div id="e05-anca"><p>Une vascularite à ANCA a été rapportée sous antithyroïdien, surtout le propylthiouracile et plus rarement le carbimazole ou le thiamazole. Elle atteint la peau, les poumons (hémoptysie, hémorragie alvéolaire), les reins (glomérulonéphrite, insuffisance rénale aiguë) et les articulations. Devant de tels symptômes, le médecin demande un bilan immunologique et arrête le médicament. Un cas suisse publié (Praxis, 2024) décrit une vascularite cutanée après 14 mois de propylthiouracile, résolue à l’arrêt.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680563000131" target="_blank" rel="noopener">Swissmedic — Propycil 50 (propylthiouracile), information professionnelle — septembre 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39530164/" target="_blank" rel="noopener">Praxis — vascularite à ANCA sous propylthiouracile, cas suisse — octobre 2024, résumé</a>.</p></div></template>
<template data-pop="e05-surdosage-levothyroxine" data-title="Lévothyroxine : contre-indication en hyperthyroïdie et surdosage"><div id="e05-surdosage-levothyroxine"><p>L’information professionnelle suisse d’Euthyrox contre-indique la lévothyroxine dans l’hyperthyroïdie de toute origine, sauf en association à un thyréostatique après obtention de l’euthyroïdie (bloquer-remplacer), ce qui est contre-indiqué pendant la grossesse. En cas de surdosage, notamment volontaire pour maigrir, la prise peut être mortelle. Les thyréostatiques ne sont pas indiqués, car la thyroïde est déjà totalement au repos. On utilise un bêtabloquant et, en cas de dose massive, la plasmaphérèse peut être utile.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">Swissmedic — Euthyrox (lévothyroxine), information professionnelle — février 2023</a>.</p></div></template>
<template data-pop="pareto-e05-pharma" data-title="Loi de Pareto — Pharmacologie"><div id="pareto-e05-pharma"><p class="ratio" data-cover="e05-p01,e05-p02"></p><ul><li>Néo-Mercazole : 20–60 mg par jour en 2–3 prises, puis 5–20 mg ; formule sanguine hebdomadaire 6 semaines si plus de 40 ans ; arrêt immédiat en cas de fièvre ou d’angine.</li><li>Propycil : 75–100 mg trois fois par jour ; hépatotoxicité et vascularite à ANCA ; à éviter chez l’enfant.</li><li>Inderal : 10–40 mg trois à quatre fois par jour ; contre-indiqué en cas d’asthme ou d’insuffisance cardiaque décompensée.</li><li>Interactions : théophylline, anticoagulants, digitaliques ; vérapamil et diltiazem avec le propranolol.</li><li>Tepezza : audition, glycémie, grossesse (contre-indiqué).</li></ul><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">Swissmedic — Néo-Mercazole 5 mg (carbimazole), information professionnelle — août 2020</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680563000131" target="_blank" rel="noopener">Swissmedic — Propycil 50 (propylthiouracile), information professionnelle — septembre 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680317060015" target="_blank" rel="noopener">Swissmedic — Inderal 10 mg et 40 mg (propranolol), information professionnelle — janvier 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680697950012" target="_blank" rel="noopener">Swissmedic — Tepezza (téprotumumab), information professionnelle — mars 2026</a>.</p></div></template>
