<template data-pop="g82-sm-niveau" data-title="Niveau sensitif : technique, mécanisme, valeur">
<div class="lab">Définition</div><p>Le niveau sensitif est le dermatome le plus caudal dont la sensibilité est normale au tact léger et à la piqûre, tous les dermatomes situés au-dessus étant normaux [S2]. En clinique, il correspond à la limite supérieure de l’atteinte sensitive [S34].</p>
<div class="lab">Technique</div><p>Le médecin teste 28 points clés de chaque côté, du 2e segment cervical aux 4e et 5e segments sacrés, et cote chacun 0 (absent), 1 (altéré) ou 2 (normal) [S2].</p>
<div class="lab">Mécanisme</div><p>Les voies sensitives montent dans la moelle ; une lésion les interrompt et prive de sensibilité les territoires situés au-dessous [S34].</p>
<div class="lab">Valeur et piège</div><p>Les sources lues ne chiffrent ni sa sensibilité ni sa spécificité. La moelle étant plus courte que le canal, le niveau sensitif n’indique pas directement la vertèbre en cause [S34].</p>
<p class="src">Références : [S2] ISNCSCI 2019 ; [S34] Collège français des enseignants en rhumatologie, 2016, chapitre 2.</p></template>
<template data-pop="g82-sm-pyramidal" data-title="Syndrome pyramidal sous-lésionnel">
<div class="lab">Signes</div><p>Hypertonie élastique, réflexes ostéotendineux vifs, diffusés et polycinétiques, trépidation épileptoïde du pied et signe de Babinski [S34].</p>
<div class="lab">Mécanisme</div><p>La moelle sous la lésion conserve ses arcs réflexes mais perd le contrôle central ; le faisceau pyramidal descend dans le cordon latéral après avoir croisé dans la moelle allongée [S34].</p>
<div class="lab">Valeur</div><p>Aucun signe pyramidal n’est observé lors d’une compression périphérique : sa présence oriente vers la moelle [S34]. Aucune valeur chiffrée n’est donnée par les sources lues.</p>
<p class="src">Références : [S34] Collège français des enseignants en rhumatologie, 2016, chapitre 2.</p></template>
<template data-pop="g82-sm-sphincter" data-title="Troubles génito-sphinctériens">
<div class="lab">Description</div><p>Retard à la miction, envies impérieuses, rétention d’urine, constipation et impuissance accompagnent le syndrome sous-lésionnel [S34]. Dans la queue de cheval, on observe une incontinence ou une rétention, une constipation, une anesthésie en selle et l’abolition des réflexes périnéaux [S34].</p>
<div class="lab">Fréquence</div><p>Selon le niveau de la lésion, l’hyperactivité du détrusor et la dyssynergie atteignent jusqu’à 95 %, l’hypoactivité jusqu’à 83 % [S1, tableau 2].</p>
<div class="lab">Limite</div><p>Le niveau oriente sans trancher : l’urodynamique type la dysfonction [S1].</p>
<p class="src">Références : [S34] Collège français des enseignants en rhumatologie, 2016 ; [S1] EAU 2026.</p></template>
<template data-pop="g82-sm-sacre" data-title="Réflexes du segment sacré et toucher rectal">
<div class="lab">Éléments à tester</div><p>Les recommandations européennes demandent de tester toutes les sensations et tous les réflexes de la région urogénitale : sensibilité des 2e au 5e segments sacrés, réflexes bulbocaverneux et anal, réflexes rotuliens et achilléens, réponse plantaire, tonus et contraction volontaire du sphincter anal [S1, § 3.3.6 et tableau 6].</p>
<div class="lab">Intérêt</div><p>Ces données sont indispensables pour interpréter ensuite l’urodynamique [S1]. La pression anale profonde et la contraction anale volontaire décident de la complétude [S2].</p>
<div class="lab">Piège</div><p>Chez une lésion haute, la pression artérielle peut chuter nettement au passage en position assise ou debout [S1, § 3.3.6].</p>
<p class="src">Références : [S1] EAU 2026 ; [S2] ISNCSCI 2019.</p></template>
