<template id="ch-G36"><div class="chap"><div class="chap-head"><div class="code">G36 · Neurologie · CIM-10-GM 2024</div><h1>G36 — Autres affections démyélinisantes aiguës disséminées</h1><span class="status">Auto-relecture IA de l’auteur · Aucune validation médicale humaine attestée</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><div class="chap-body" data-semiology-clinical="G36"><section class="ilot" id="g36-question"><h2>Une baisse visuelle, une faiblesse ou un coma imposent d’abord une décision clinique</h2><p>Une personne perd la vision en quelques jours, une autre devient paraplégique et une troisième s’enfonce rapidement dans le coma. Ces tableaux ne conduisent pas tous au même diagnostic ou au même traitement. Il faut localiser l’atteinte, mesurer sa gravité et rechercher les causes inflammatoires, infectieuses, vasculaires ou compressives. Une urgence peut précéder la confirmation sérologique.</p><p>G36 regroupe quatre sous-codes de la classification, sans être une maladie unique. La neuromyélite optique constitue le fil principal de la leçon ; la leucoencéphalite hémorragique de Hurst exige un raisonnement propre. La maladie associée aux anticorps anti-MOG est étudiée comme diagnostic distinct : sa présence ne fixe pas automatiquement le sous-code G36.8.</p><div class="key"><b>À retenir.</b> Évaluer vision, motricité, conscience et respiration ; prélever si possible avant traitement sans retarder une prise en charge nécessaire.</div><p>Sources : <button class="w" data-k="g36-r1">[1]</button> · <button class="w" data-k="g36-r2">[2]</button> · <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r13">[13]</button> · <button class="w" data-k="g36-r15">[15]</button></p></section><section class="ilot" id="g36-definition"><h2>Neuromyélite optique, MOGAD et Hurst ne sont pas interchangeables</h2><p>La NMOSD désigne les troubles du spectre de la neuromyélite optique. La forme associée aux IgG anti-aquaporine 4 est une astrocytopathie inflammatoire pouvant léser secondairement la myéline et les neurones. Une névrite optique ou une myélite peut être isolée au premier épisode ; il n’est pas nécessaire d’attendre leur association historique dite de Devic.</p><p>La MOGAD est une maladie associée aux anticorps anti-MOG, distincte de la sclérose en plaques et de la NMOSD AQP4 positive. Elle peut produire névrite, myélite, encéphalomyélite aiguë disséminée ou encéphalite corticale. Hurst est une affection fulminante avec inflammation, œdème et hémorragies, décrite dans une littérature surtout constituée de cas.</p><p><button class="w" data-k="g36-nmosd">NMOSD : syndrome, sérologie et alternatives</button></p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r11">[11]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-codage"><h2>Les quatre sous-codes et les exclusions sont vérifiés dans la classification française</h2><p>G36 est intitulé « Autres affections démyélinisantes aiguës disséminées ». Il ne porte pas d’astérisque dans l’export français consulté. Les règles des codes de manifestation à étoile étudiées dans d’autres leçons ne lui sont pas transposées.</p><p>G36 exclut l’encéphalite et l’encéphalomyélite postinfectieuses sans précision, classées G04.8. G36.0 exclut la névrite optique sans précision H46. L’ADEM est incluse dans G37.8 ; le mot disséminée ne suffit donc pas à la classer G36. Les sous-codes .8 et .9 expriment respectivement une affection précisée ou sans précision ; ils n’autorisent pas une ordonnance commune.</p><table class="t"><thead><tr><th>Code</th><th>Libellé et portée</th><th>Conséquence clinique</th></tr></thead><tbody><tr><td>G36.0</td><td>Neuromyélite optique [Devic] ; inclusion de démyélinisation au cours de névrite optique.</td><td>Documenter le diagnostic moderne et la sérologie ; une névrite SAI ne suffit pas.</td></tr><tr><td>G36.1</td><td>Leucoencéphalite hémorragique aiguë et subaiguë [Hurst].</td><td>Urgence encéphalique, investigations et soins intensifs selon gravité.</td></tr><tr><td>G36.8</td><td>Autres affections démyélinisantes aiguës disséminées précisées.</td><td>Nommer l’entité documentée ; pas de rattachement automatique de toute MOGAD.</td></tr><tr><td>G36.9</td><td>Affection démyélinisante aiguë disséminée, sans précision.</td><td>Poursuivre la clarification et prendre en charge la gravité sans attendre un meilleur code.</td></tr></tbody></table><p><button class="w" data-k="g36-adem">ADEM et codes voisins : lire le libellé complet</button></p><p>Sources : <button class="w" data-k="g36-r1">[1]</button> · <button class="w" data-k="g36-r2">[2]</button></p></section><section class="ilot" id="g36-epidemiologie"><h2>La rareté et les populations des études limitent l’usage des chiffres</h2><p>Aucun taux suisse actuel de G36, ventilé de façon complète par âge et sexe, n’a été établi dans les sources réellement lues. Une publication bâloise et une revue romande documentent un contexte local ; elles ne mesurent pas une incidence nationale. NMOSD, MOGAD, Hurst et catégorie G36 ne sont pas des dénominateurs interchangeables.</p><p>NEMOS décrit une prédominance féminine dans la NMOSD AQP4 positive et une survenue fréquente à l’âge adulte, tout en rappelant les formes de l’enfant et de la personne âgée. La MOGAD touche les deux sexes de façon plus équilibrée et l’ADEM y est plus fréquente chez le jeune enfant. Ces tendances orientent l’attention sans exclure un diagnostic selon âge, sexe ou origine.</p><p><button class="w" data-k="g36-serie">Hurst : ce que permettent 43 cas publiés</button></p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r11">[11]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-causes"><h2>Une cible immunologique ne dispense pas de rechercher une autre cause</h2><p>AQP4 est une protéine des astrocytes impliquée dans les échanges d’eau. Les IgG pathogènes et le complément peuvent provoquer une lésion astrocytaire avec atteinte secondaire des autres éléments du tissu nerveux. Dans la MOGAD, la cible appartient à la myéline oligodendrocytaire ; cette distinction contribue à séparer les maladies et leurs stratégies de prévention.</p><p>Des maladies auto-immunes associées ou des contextes infectieux sont recherchés. Une inflammation du cerveau ne devient pas automatiquement auto-immune : infection, vascularite, tumeur, sarcoïdose ou trouble métabolique restent possibles. Dans Hurst, un mécanisme immunitaire après un épisode infectieux est une hypothèse ; les données de cas ne permettent pas de désigner chaque agent ou vaccin comme cause certaine.</p><div class="key"><b>À retenir.</b> Nommer un anticorps ou un facteur temporel n’établit pas, à lui seul, la cause de tous les symptômes.</div><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r11">[11]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-anamnese"><h2>Interroger la chronologie et les fonctions atteintes</h2><p>Préciser début, progression, épisodes antérieurs et récupération. Demander baisse visuelle, douleur aux mouvements oculaires, couleurs délavées, champ visuel manquant et atteinte d’un ou deux yeux. Rechercher faiblesse, paresthésies, niveau sensitif, rétention ou incontinence, constipation et troubles sexuels. L’absence d’un symptôme n’exclut pas une présentation incomplète.</p><p>Un hoquet, des vomissements ou des nausées persistants sans explication digestive peuvent traduire une atteinte de l’area postrema. Demander aussi diplopie, déglutition, respiration, somnolence, confusion, crises et fièvre. Noter médicaments immunosuppresseurs, infections, vaccinations, maladies auto-immunes et projet de grossesse. Les symptômes anciens et les traitements en cours modifient l’interprétation des tests.</p><p><button class="w" data-k="g36-mnemo">Six territoires : un aide-mémoire local</button></p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r11">[11]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-examen"><h2>Décrire les signes avant de les attribuer à une maladie</h2><p>Mesurer l’acuité avec correction dans chaque œil, puis comparer les couleurs, les champs et les réponses pupillaires. Un déficit afférent relatif se recherche par éclairage alterné si l’atteinte est asymétrique. Examiner le fond d’œil ou organiser l’évaluation ophtalmologique. Un œdème papillaire est plus fréquent dans la MOGAD, mais ne la prouve pas.</p><p>Évaluer force segmentaire, tonus, réflexes, réponse plantaire, sensibilité et niveau, coordination et marche si sûre. Examiner nerfs crâniens, parole, déglutition, conscience et respiration. Rechercher une rétention et les complications d’immobilité. Une faiblesse respiratoire ou une dégradation de conscience change immédiatement le niveau de soins ; l’examen ne doit pas attendre un résultat sérologique.</p><p><button class="w" data-k="g36-myelite">Myélite : localiser et mesurer la gravité</button></p><button class="pareto-btn ui" data-k="pareto-g36-clin">▲ Loi de Pareto — Localiser et hiérarchiser</button><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-diagnostic"><h2>Les critères IPND 2015 distinguent AQP4 positif et AQP4 négatif</h2><p>NEMOS 2023 recommande les critères IPND de 2015. Chez une personne AQP4-IgG positive, au moins une caractéristique cardinale et l’exclusion d’une meilleure explication sont requises. Pour un statut négatif ou inconnu, les conditions sont plus strictes : au moins deux caractéristiques cardinales avec dissémination spatiale, dont une névrite optique, une myélite ou un syndrome de l’area postrema, avec critères IRM propres et exclusion des alternatives.</p><p>Le statut inconnu ne dispense pas de rechercher rapidement les anticorps. Une double positivité AQP4/MOG est exceptionnelle et demande vérification méthodologique. Une personne AQP4 négative répondant aux critères MOGAD reçoit ce diagnostic distinct ; le mot séronégatif ne forme pas une catégorie thérapeutique uniforme.</p><div class="alert"><b>Critères formels.</b> <button class="w" data-k="g36-ipnd">Conditions IPND détaillées</button> AQP4 positif : syndrome cardinal + IgG AQP4 par méthode appropriée + absence de meilleure explication. AQP4 négatif/inconnu : au moins deux caractéristiques, conditions cliniques et IRM supplémentaires IPND, et alternatives exclues. Le tableau détaillé de la source reste nécessaire pour une décision réelle.</div><div class="key"><b>À retenir.</b> Un syndrome de l’area postrema sans lésion IRM demande des symptômes durant au moins 48 h dans les critères cités ; une lésion dorsale bulbaire compatible permet une durée plus courte. Ce repère diagnostique n’est jamais une consigne d’attendre 48 h pour soigner.</div><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button></p></section><section class="ilot" id="g36-mogad-body"><h2>MOGAD : méthode, titre et éléments de soutien doivent rester liés</h2><p>Le consensus international de 2023 requiert A, un événement clinique démyélinisant cardinal ; B, une recherche MOG-IgG positive dans les conditions définies ; C, l’exclusion d’un meilleur diagnostic, notamment SEP. Les manifestations incluent névrite, myélite, ADEM, déficit cérébral mono ou polyfocal, atteinte du tronc ou du cervelet et encéphalite corticale souvent avec crises.</p><p>Un positif clair en sérum par CBA validé n’exige pas d’élément de soutien additionnel. Un faible positif, un résultat positif sans titre ou une positivité limitée au LCR dans les conditions du consensus demandent AQP4 négatif et au moins un élément clinique ou IRM de soutien. Le sérum reste le prélèvement recommandé ; sérum et LCR ne sont pas systématiquement testés ensemble.</p><p><button class="w" data-k="g36-mogad">Critères MOG 2023 : ne pas universaliser le seuil</button></p><div class="alert"><b>MOGAD : A + B + C.</b> La positivité seule ne suffit pas. Un faible titre dans une présentation typique de SEP demande une réévaluation ; le contexte détermine la valeur prédictive du test.</div><p>Sources : <button class="w" data-k="g36-r11">[11]</button> · <button class="w" data-k="g36-r12">[12]</button></p></section>

<section class="ilot" id="g36-differentiel"><h2>Les alternatives se distinguent par chronologie, topographie et cohérence</h2><p>La SEP peut donner névrite et myélite, mais une atteinte chiasmatique ou une longue lésion centrale médullaire est moins habituelle. Les bandes oligoclonales peuvent soutenir SEP sans l’imposer. Une MOGAD est recherchée selon phénotype et CBA. Neurosarcoïdose, vascularite, infection et tumeur peuvent mimer une inflammation apparentée.</p><p>Un déficit dont le maximum apparaît en quelques minutes ou heures évoque notamment une cause vasculaire ; une progression prolongée fait discuter compression, tumeur ou autre processus. Ces repères ne sont pas des exclusions absolues. Revoir le diagnostic devant discordance entre clinique, anticorps, IRM et réponse. Une carence B12 ou cuivre fait partie des alternatives métaboliques d’une myélopathie, sans devenir l’explication de toute lésion.</p><table class="t"><thead><tr><th>Alternative</th><th>Élément qui oriente</th><th>Limite</th></tr></thead><tbody><tr><td>Compression médullaire</td><td>Obstacle et conflit anatomique en IRM ; douleur ou niveau.</td><td>Imagerie urgente selon tableau ; ne pas attendre CBA.</td></tr><tr><td>Vasculaire</td><td>Nadir très rapide ; distribution et diffusion.</td><td>Chronologie seule non suffisante.</td></tr><tr><td>Infection encéphalique</td><td>Fièvre, contexte, LCR et recherche microbiologique ciblée.</td><td>Une immunosuppression peut masquer les signes.</td></tr><tr><td>SEP</td><td>Distribution habituelle de lésions et contexte clinique.</td><td>bandes oligoclonales ou petite lésion ne suffisent pas isolément.</td></tr><tr><td>MOGAD</td><td>Phénotype compatible, CBA et critères 2023.</td><td>Faible positif isolé non diagnostique.</td></tr></tbody></table><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-urgence"><h2>Soigner la menace fonctionnelle et vitale sans attendre la classification finale</h2><p>Perte visuelle importante, déficit moteur progressif, dysfonction sphinctérienne, atteinte cervicale haute, trouble de déglutition, respiration ou conscience justifient une évaluation neurologique urgente. Une présentation fulminante ou une protection des voies aériennes insuffisante demande les soins intensifs. Les prélèvements utiles sont réalisés sans retard dangereux ; une sérologie négative après traitement devra être interprétée dans ce contexte.</p><p>Sous eculizumab ou ravulizumab, une fièvre ou un tableau compatible avec une infection à méningocoque exige une évaluation immédiate, même si la personne est vaccinée. Le vaccin réduit le risque sans l’abolir. La carte du patient et les consignes de contact font partie du traitement ; une nouvelle faiblesse sous immunothérapie peut être une infection ou une toxicité, pas toujours une rechute.</p><div class="key"><b>À retenir.</b> Menace respiratoire, coma ou suspicion de sepsis : action immédiate. Les délais diagnostiques et les intervalles de traitement ne sont pas des délais autorisant l’attente.</div><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r8">[8]</button> · <button class="w" data-k="g36-r9">[9]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-traitement"><h2>La poussée NMOSD et sa prévention sont deux objectifs différents</h2><p>NEMOS recommande de traiter une poussée le plus tôt possible par glucocorticoïdes à forte dose et/ou aphérèse selon gravité et contexte. Le guide décrit généralement méthylprednisolone IV 1000 mg par jour durant 3 à 5 jours. La préparation et sa sécurité sont vérifiées dans la FI suisse Solu-Medrol ; sa rubrique neurologique nomme les poussées SEP, pas NMOSD. La stratégie de maladie est donc attribuée au guide, sans inventer une indication de notice.</p><p>Si la récupération est insuffisante, commencer l’aphérèse précocement. Une myélite sévère ou des réponses antérieures peuvent conduire à une aphérèse de première intention ou concomitante. Il ne faut pas imposer une attente fixe jusqu’à la fin de toute cure si la gravité motive l’escalade. Le relais corticoïde et sa durée dépendent notamment de la stratégie de prévention, de son délai d’effet et du risque individuel.</p><p><button class="w" data-k="g36-attaque">Aphérèse et corticoïdes : une décision de centre</button></p><p>Sources : <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r10">[10]</button></p></section><section class="ilot" id="g36-prevention"><h2>La prévention AQP4 positive se choisit selon le profil et la notice</h2><p>Satralizumab, inébilizumab, eculizumab et ravulizumab ont des indications suisses dans des populations AQP4 positives précisées par leur FI. Ils ciblent respectivement le récepteur IL-6, les cellules B CD19 et le complément C5. Ce sont des traitements de prévention prolongée, pas des substituts universels au sauvetage d’une poussée.</p><p>Le choix prend en compte activité, comorbidités, grossesse, voie, rythme, tolérance, délai d’action, risque infectieux et accès. L’inébilizumab est indiqué en monothérapie chez l’adulte ; le satralizumab peut être utilisé seul ou avec un immunosuppresseur. Soliris nomme la NMOSD récurrente de l’adulte. Ces populations ne sont pas étendues automatiquement aux enfants, MOGAD ou doubles négatifs.</p><p>Certains traitements de SEP sont inefficaces ou peuvent déclencher des poussées dans la NMOSD. NEMOS déconseille notamment l’interféron bêta, le natalizumab, le fingolimod et d’autres agents de SEP dans ce contexte. La vérification du diagnostic doit précéder une transposition de protocole.</p><div class="key"><b>À retenir.</b> Prévenir les rechutes ne signifie pas utiliser le même médicament pour toute affection G36. L’anticorps, l’indication et le risque guident le choix.</div><p>Sources : <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r6">[6]</button> · <button class="w" data-k="g36-r7">[7]</button> · <button class="w" data-k="g36-r8">[8]</button> · <button class="w" data-k="g36-r9">[9]</button></p></section><section class="ilot" id="g36-hurst"><h2>Hurst nécessite une investigation et un traitement propres</h2><p>Une encéphalopathie rapidement progressive, des déficits, des crises et un œdème avec microhémorragies doivent faire discuter la leucoencéphalite hémorragique. L’IRM, le LCR si réalisable en sécurité, les recherches infectieuses et parfois une biopsie contribuent au diagnostic. L’infection encéphalique reste une alternative ou une association importante.</p><p>La revue bâloise décrit surtout des cas avec corticothérapie, parfois aphérèse ou immunoglobulines et autres immunosuppresseurs. Elle ne démontre pas l’efficacité comparative ni une dose standard de Hurst. Les doses intensives d’un cas fatal ne sont pas transformées en prescription pour tous. La prise en charge spécialisée vise aussi pression intracrânienne, crises, voies aériennes et prévention des complications.</p><p><button class="w" data-k="g36-hurst">G36.1 : une preuve de cas ne crée pas un protocole</button></p><p>Sources : <button class="w" data-k="g36-r1">[1]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-suivi"><h2>Le suivi mesure la fonction et les risques, pas seulement les titres</h2><p>La NMOSD peut laisser un handicap important après une seule poussée. Le suivi reprend acuité visuelle, marche, force, sensibilité, sphincters, douleur, fatigue et qualité de vie. NEMOS propose des examens structurés, notamment à l’initiation et au changement de traitement, lors de nouveaux symptômes, puis tous les 6 à 12 mois en l’absence de poussée apparente. Ce rythme ne remplace pas une consultation urgente en cas d’aggravation.</p><p>Les titres AQP4 ne prédisent pas suffisamment les poussées pour guider seuls le traitement. Une négativation ne transforme pas automatiquement une personne auparavant AQP4 positive en maladie sans risque. L’arrêt d’une immunothérapie efficace n’est pas improvisé après une période stable ou pour un projet de grossesse.</p><p>Rééducation, aides visuelles, prévention des chutes, soins vésicaux, douleur et accompagnement psychosocial sont adaptés aux séquelles. Une MOGAD peut être monophasique ou récidivante ; sa prévention prolongée est discutée au cas par cas, sans lui appliquer mécaniquement les indications AQP4.</p><button class="pareto-btn ui" data-k="pareto-g36-suivi">▲ Loi de Pareto — Fonction, maladie et sécurité</button><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r11">[11]</button> · <button class="w" data-k="g36-r12">[12]</button></p></section><section class="ilot" id="g36-particuliers"><h2>Âge, grossesse, rein et foie demandent une décision individualisée</h2><p>La NMOSD doit être considérée à tout âge. Les doses et indications adultes ne deviennent pas pédiatriques parce qu’une autre indication du même médicament comporte un tableau de poids. Enspryng possède une indication adolescente, avec données limitées ; les autres notices citées définissent ici des indications NMOSD adultes. Une ADEM de l’enfant demande un raisonnement pédiatrique propre.</p><p>Planifier la grossesse pendant une phase stable et discuter les risques de la maladie et des produits avant conception. NEMOS déconseille un arrêt ou report improvisé de la prévention. Les FI gardent des règles différentes pour grossesse, contraception, allaitement et nouveau-né ; elles ne sont pas remplacées par une déclaration de sécurité de classe.</p><p>Une insuffisance rénale ou hépatique peut modifier les risques, les examens et le choix global. Les anticorps ne reçoivent pas une réduction de dose calculée comme un médicament éliminé directement par le rein ; les données et limites exactes de chaque FI sont exposées dans Pharmacologie.</p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r6">[6]</button> · <button class="w" data-k="g36-r7">[7]</button> · <button class="w" data-k="g36-r8">[8]</button> · <button class="w" data-k="g36-r9">[9]</button> · <button class="w" data-k="g36-r10">[10]</button> · <button class="w" data-k="g36-r11">[11]</button></p></section><section class="ilot" id="g36-suisse"><h2>Le parcours suisse se prépare sans présumer les droits individuels</h2><p>Les notices suisses, la classification OFS, la revue HUG/CHUV et la publication bâloise constituent les ancrages locaux réellement consultés. Le tableau aigu oriente vers les services d’urgence et le centre neurologique ou ophtalmologique approprié ; le suivi précise qui joindre en cas de symptôme nouveau, infection ou difficulté d’accès au traitement.</p><p>Les obligations détaillées de déclaration OFSP, de prise en charge LAA/Suva, d’aptitude à conduire, d’AI et de remboursement LS/LiMA n’ont pas été établies exhaustivement pour toute catégorie G36. Elles restent une lacune documentaire à vérifier selon l’entité, le produit, le handicap et les règles actuelles. L’absence de règle identifiée n’est pas présentée comme une absence d’obligation.</p><p>Sources : <button class="w" data-k="g36-r1">[1]</button> · <button class="w" data-k="g36-r6">[6]</button> · <button class="w" data-k="g36-r7">[7]</button> · <button class="w" data-k="g36-r8">[8]</button> · <button class="w" data-k="g36-r9">[9]</button> · <button class="w" data-k="g36-r10">[10]</button> · <button class="w" data-k="g36-r11">[11]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-cas"><h2>Quatre exercices : méthode, soutien, LCR et image</h2><p></p><div class="quiz ui" id="g36-q1"><p><b>Cas pédagogique fictif 1.</b> Une myélite étendue est associée à un faible positif AQP4 par ELISA. Quelle démarche convient ?</p><button data-ok="1">Confirmer par un CBA approprié et confronter le résultat au tableau.</button><button data-ok="0">Retenir définitivement NMOSD sur ce seul ELISA.</button><p class="fb" hidden>Les méthodes non cellulaires ne sont pas recommandées en routine. Un résultat faible ou discordant demande confirmation, sans retarder les soins urgents.</p></div><div class="quiz ui" id="g36-q2"><p><b>Cas pédagogique fictif 2.</b> Névrite bilatérale avec œdème papillaire, AQP4 négatif, MOG à 1:40 par CBA fixé et absence de meilleure explication : que conclure ?</p><button data-ok="1">Le faible positif peut satisfaire B avec les soutiens présents, si A et C sont aussi remplis.</button><button data-ok="0">Tout titre inférieur à 1:100 exclut MOGAD.</button><p class="fb" hidden>Le titre faible d’un CBA fixé exige AQP4 négatif et soutien. Le mot fixé est décisif ; les CBA vivants ont leurs seuils propres.</p></div><div class="quiz ui" id="g36-q3"><p><b>Cas pédagogique fictif 3.</b> Un quotient albumine LCR/sérum est augmenté, sans bandes oligoclonales et avec MRZ négative. Ce profil prouve-t-il MOGAD ?</p><button data-ok="1">Non : il peut orienter parmi les maladies inflammatoires et doit être confronté au phénotype et aux anticorps.</button><button data-ok="0">Oui, il suffit à distinguer MOGAD de toutes les autres causes.</button><p class="fb" hidden>Ni l’absence de bandes oligoclonales ni un quotient d’albumine augmenté ne réalise à lui seul les critères MOG 2023. La clinique, les anticorps et les alternatives doivent être confrontés.</p></div><div class="quiz ui" id="g36-q4"><p><b>Cas pédagogique fictif 4.</b> Une lésion périépendymaire présente un rehaussement très fin en trait de crayon. Quelle interprétation convient ?</p><button data-ok="1">Un argument relativement spécifique en faveur de NMOSD AQP4 positive, à confronter aux autres données.</button><button data-ok="0">Une preuve suffisante sans sérologie ni exclusion des alternatives.</button><p class="fb" hidden>NEMOS décrit cette association comme relativement spécifique. Une image isolée ne remplace pas les critères ni le contexte.</p></div><div class="trap"><span class="k">Piège</span> Un profil de LCR ne prouve pas MOGAD à lui seul. Le seuil MOG doit rester lié au type de CBA et à la méthode du laboratoire.</div><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r15">[15]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="g36-e-strategie"><h2>Chaque examen répond à une question</h2><p>L’IRM recherche une lésion expliquant le syndrome et des alternatives urgentes. La sérologie caractérise une maladie immunologique dans un phénotype compatible. Le LCR cherche inflammation, infection et arguments différentiels. L’évaluation ophtalmologique mesure la fonction et les conséquences de la névrite.</p><p>Organiser les examens en parallèle selon la gravité. Prélever le sérum avant corticoïdes, aphérèse ou immunosuppression si immédiatement possible, car le traitement peut rendre certains résultats faussement négatifs ou ambigus. Cette préférence ne doit pas devenir un obstacle à une intervention urgente.</p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-e-serum"><h2>Le compte rendu d’anticorps doit préciser la méthode</h2><p>AQP4 et MOG sont recherchés par tests cellulaires exprimant la protéine humaine complète et correctement conformée. Les méthodes ELISA, immunoblot ou peptides n’ont pas la même pertinence. Le sérum est privilégié ; une positivité AQP4 dans le LCR seul ne suffit pas aux critères usuels et appelle une expertise et une confirmation.</p><p>Documenter prélèvement, date, statut de poussée ou rémission, traitements, laboratoire, CBA vivant ou fixé, résultat, titre et seuil. Un résultat négatif sous traitement peut justifier un nouveau prélèvement selon suspicion et expertise. Les faibles positifs sont particulièrement sensibles à la probabilité préalable et aux discordances de méthode.</p><p><button class="w" data-k="g36-cba">Pourquoi un test positif ne vaut pas toujours le même diagnostic</button></p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button></p></section><section class="ilot" id="g36-e-irm"><h2>Cerveau, moelle entière et orbites selon le tableau</h2><p>L’IRM initiale comprend cerveau et moelle ; une étude orbitaire avec suppression de graisse améliore l’analyse du nerf optique. La moelle doit inclure le conus si possible, avec coupes sagittales et axiales. Rechercher siège, longueur, distribution centrale ou périphérique, gonflement, rehaussement et causes compressives.</p><p>La myélite étendue sur au moins trois segments est fréquente dans NMOSD et MOGAD. Une lésion courte peut être une lésion en évolution ou en résolution ; une seconde IRM peut être utile si la suspicion persiste. Une prise de contraste n’est pas requise pour chaque condition formelle et peut persister après un épisode ; absence ou présence n’est pas équivalente à absence ou présence certaine de poussée.</p><table class="t"><thead><tr><th>Image</th><th>Orientation</th><th>Limite</th></tr></thead><tbody><tr><td>Nerf long ou chiasma</td><td>NMOSD ou MOGAD selon distribution.</td><td>Non exclusif ; technique orbitaire compte.</td></tr><tr><td>Rehaussement périneural</td><td>Favorise MOGAD.</td><td>Ne suffit pas sans critères.</td></tr><tr><td>Atteinte médullaire centrale, conus ou H</td><td>Particulièrement évocatrice MOGAD pour certains aspects.</td><td>Longueur et date modifient la lecture.</td></tr><tr><td>Œdème et microhémorragies</td><td>Discuter Hurst dans contexte fulminant.</td><td>Autres causes vasculaires et infectieuses à exclure.</td></tr></tbody></table><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button></p></section><section class="ilot" id="g36-e-hurst"><h2>IRM de Hurst : lire séquence et date avant de conclure</h2><p>Cette figure clinique humaine provient du cas bâlois réellement lu. Elle illustre une évolution rapide et les séquences complémentaires, pas une signature diagnostique universelle. Une hypersusceptibilité SWI doit être interprétée avec les autres séquences, la clinique et les recherches différentielles.</p><p>Le bas de l’original contient un extrait EEG. Il est conservé et identifié afin de ne pas faire passer ce tracé pour une image anatomique supplémentaire. La publication décrit des décharges épileptiformes ; le cours ne reconstruit pas un diagnostic électroclinique nouveau à partir du seul montage.</p><figure><img src="assets/img/g36/alpha/codex/AHLEBasel2020-Fig2.jpg" alt="Hurst : évolution de l’IRM en trois jours et extrait EEG" loading="lazy"><figcaption>Hurst : évolution de l’IRM en trois jours et extrait EEG. Grzonka et coll., Hôpital universitaire de Bâle, Frontiers in Neurology, 2020, figure 2. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7468463/" target="_blank" rel="noopener noreferrer">Publication originale</a> ; <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">Creative Commons Attribution 4.0</a>. Homme de 59 ans ; les auteurs rapportent un consentement écrit de la famille pour la publication des images et données. Pixels, cadres et flèches de source inchangés ; annotations françaises adjacentes ajoutées.</figcaption><table class="t"><thead><tr><th>Repère de l’original</th><th>Annotation française et portée</th></tr></thead><tbody><tr><td>Colonnes de gauche puis de droite</td><td>IRM un jour puis quatre jours après les premiers symptômes ; intervalle de trois jours, pas un suivi de trois mois.</td></tr><tr><td>Première et deuxième rangées FLAIR</td><td>Extension des hypersignaux de substance blanche, prédominant à gauche ; nouveaux foyers du pédoncule cérébelleux gauche encadrés à droite.</td></tr><tr><td>Troisième rangée SWI</td><td>Petits artéfacts de susceptibilité du splénium ; ils soutiennent des microhémorragies dans le contexte du cas, sans constituer seuls un diagnostic.</td></tr><tr><td>Quatrième rangée T1 avant/après contraste</td><td>Rehaussement pariéto-occipital gauche ; le bas de la figure est un extrait EEG avec activité épileptiforme rapportée, pas une cinquième séquence IRM.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-e-lcr"><h2>Le liquide cérébrospinal soutient le raisonnement et recherche les alternatives</h2><p>NEMOS recommande une ponction lombaire dans la suspicion de NMOSD, même si elle n’est pas formellement exigée par les critères. Sa réalisation dépend de la sécurité clinique et de l’imagerie, notamment en cas d’effet de masse ou de trouble majeur de conscience. L’analyse associe cellules et formule, protéines, glucose avec sérum, lactate et recherche de bandes oligoclonales, avec microbiologie adaptée au contexte.</p><p>Un LCR normal est possible, en particulier dans certaines névrites. Des neutrophiles ou une protéinorachie augmentée peuvent exister dans NMOSD ou MOGAD et ne prouvent pas automatiquement une infection ; l’infection doit néanmoins être recherchée selon le tableau. Les bandes oligoclonales ne sont ni toujours absentes dans NMOSD ni une preuve suffisante de SEP.</p><p><button class="w" data-k="g36-lcs">Albumine, bandes oligoclonales et MRZ : des indices, pas un diagnostic autonome</button></p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-e-vision"><h2>Mesurer les deux yeux et documenter la fonction</h2><p>L’acuité avec correction est évaluée dans les deux yeux, même si la plainte semble unilatérale. Une mesure à faible contraste peut être utile si l’acuité habituelle paraît normale. Couleurs, champ visuel, pupilles et fond d’œil complètent le bilan. Répéter les mesures après traitement et au suivi aide à juger la récupération et une éventuelle escalade.</p><p>L’OCT est un examen non invasif des couches rétiniennes, utile comme soutien et pour suivre les conséquences axonales. Il n’est pas obligatoire pour satisfaire les critères NMOSD. La qualité du scan, les erreurs de segmentation, la phase aiguë et les antécédents influencent l’interprétation ; une valeur de couche isolée n’est pas un seuil universel de diagnostic.</p><p><button class="w" data-k="g36-oct">OCT : comprendre ce qui est mesuré</button></p><p>Sources : <button class="w" data-k="g36-r3">[3]</button></p></section><section class="ilot" id="g36-e-pieges"><h2>Une discordance demande une réévaluation</h2><p>Vérifier erreur de méthode ou d’étiquette, prélèvement après traitement, calendrier d’IRM, qualité du scan et meilleure explication. Le diagnostic NMOSD double négatif est hétérogène et nécessite notamment exclusion de MOGAD et des autres causes. Un test répété n’est utile que si sa question est explicite.</p><p>Dans Hurst, la biopsie peut être discutée devant une dégradation inexpliquée après bilan adapté. Sa décision est spécialisée, tenant compte du risque et du rendement attendu ; le cours ne transforme pas une proposition de revue de cas en obligation de biopsier toutes les personnes G36.</p><button class="pareto-btn ui" data-k="pareto-g36-exam">▲ Loi de Pareto — Une question par examen</button><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="g36-tab-semio" role="tab" aria-selected="true" aria-controls="g36-s-semio" data-s="g36-s-semio">Sémiologie fondamentale et analytique</button><button id="g36-tab-anat" role="tab" aria-selected="false" aria-controls="g36-s-anat" data-s="g36-s-anat">Anatomie et histologie</button><button id="g36-tab-physio" role="tab" aria-selected="false" aria-controls="g36-s-physio" data-s="g36-s-physio">Physiologie et physiopathologie</button><button id="g36-tab-bio" role="tab" aria-selected="false" aria-controls="g36-s-bio" data-s="g36-s-bio">Biochimie et méthodes analytiques</button><button id="g36-tab-micro" role="tab" aria-selected="false" aria-controls="g36-s-micro" data-s="g36-s-micro">Immunologie et risque infectieux</button><button id="g36-tab-pharma" role="tab" aria-selected="false" aria-controls="g36-s-pharma" data-s="g36-s-pharma">Pharmacologie fondamentale</button></div><div class="chap-body sci-body"><div class="sci" id="g36-s-semio" role="tabpanel" aria-labelledby="g36-tab-semio"><section class="ilot" id="g36-s-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>La vision, la force, la sensibilité, les fonctions sphinctériennes et la vigilance dépendent de réseaux différents. Le normal est un repère fonctionnel : acuité corrigée de chaque œil, perception des couleurs, champ, puissance et coordination, sensibilité et continence. Une plainte visuelle n’est pas équivalente à une parésie et une faiblesse ne localise pas, à elle seule, toute la lésion.</p><p>La sémiologie fondamentale décrit comment une fonction se manifeste et se mesure ; l’analyse relie les anomalies à une topographie puis à des mécanismes possibles. Dans ce cours, la description précède l’étiquette NMOSD, MOGAD ou Hurst. Un signe normal doit être documenté lorsqu’il aide à distinguer les fonctions préservées et atteintes, sans devenir une exclusion universelle.</p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-s-semio-signs" data-semiology="signs"><h3>Nommer symptôme, signe et syndrome</h3><p>Le symptôme est ce que rapporte la personne : vision brouillée, douleur oculaire, engourdissement, jambes faibles ou nausées. Le signe est observé ou mesuré : baisse d’acuité, déficit afférent pupillaire, parésie, niveau sensitif ou trouble de conscience. Le syndrome organise une association cohérente sans encore prouver une cause.</p><p>Une névrite optique associe des éléments de dysfonction visuelle et souvent une douleur ; une myélite peut toucher motricité, sensibilité et sphincters. Le syndrome de l’area postrema comporte nausées, vomissements et/ou hoquet inexpliqués dans des conditions définies. Une encéphalopathie avec crises et déficit focal appelle d’autres urgences et ne devient pas un simple équivalent de névrite.</p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-s-semio-mechanisms" data-semiology="mechanisms"><h3>Relier le mécanisme au déficit sans sauter les étapes</h3><p>Une inflammation peut altérer la conduction et produire un déficit fonctionnel ; une lésion tissulaire plus importante peut laisser une séquelle. Dans NMOSD AQP4 positive, l’atteinte astrocytaire et l’activation du complément favorisent une destruction secondaire. Dans MOGAD, la cible et l’organisation pathologique sont différentes, même si certains symptômes se ressemblent.</p><p>L’étendue du déficit dépend du siège, de la sévérité et du temps. Une myélite cervicale haute peut menacer la respiration ; une atteinte du nerf optique diminue la fonction visuelle ; un œdème encéphalique peut altérer la vigilance. Ces relations expliquent les décisions urgentes mais ne donnent pas une correspondance unique entre un signe et un anticorps.</p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-s-semio-examination" data-semiology="examination"><h3>Examiner de façon comparative et sûre</h3><p>Tester l’acuité avec la correction habituelle dans chaque œil et noter la méthode. Comparer les couleurs et le champ, rechercher un déficit afférent si l’asymétrie le permet et organiser le fond d’œil. Une atteinte bilatérale peut réduire la valeur d’un signe fondé sur la comparaison entre deux côtés ; ne pas transformer son absence en preuve d’intégrité.</p><p>L’examen moteur précise les groupes musculaires, la force et les réflexes. L’examen sensitif cherche une distribution et un niveau ; la marche n’est testée que si sûre. Déglutition, respiration et conscience sont réévaluées selon évolution. Les mêmes conditions améliorent la comparaison dans le temps ; fatigue, douleur, coopération et traitements sont notés.</p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-s-semio-interpretation" data-semiology="interpretation"><h3>Interpréter un faisceau cohérent</h3><p>Une baisse visuelle douloureuse oriente vers une névrite mais n’identifie pas seule AQP4 ou MOG. Un œdème papillaire marqué ou une atteinte bilatérale rend MOGAD plus plausible dans un contexte adapté. Une longue lésion médullaire ou chiasmatique renforce certaines hypothèses, sans être exclusive.</p><p>Le raisonnement vérifie d’abord la localisation, puis les causes capables d’expliquer l’ensemble. Une sérologie faible n’efface pas une imagerie typique d’une autre maladie. Inversement, une IRM précoce ou un test après traitement peut sous-estimer une affection. La conclusion indique ce qui est établi, probable ou à réévaluer, au lieu de confondre certitude clinique et catégorie administrative.</p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button></p></section><section class="ilot" id="g36-s-semio-differentials" data-semiology="differentials"><h3>Chercher le signe qui change l’hypothèse</h3><p>Un déficit très rapide fait discuter une origine vasculaire ; une compression en IRM impose une autre priorité qu’une recherche d’anticorps. Fièvre, contexte infectieux et données du LCR peuvent modifier les investigations et les traitements. Un tableau progressif inhabituel pour NMOSD conduit à rechercher tumeur, sarcoïdose ou autre processus.</p><p>SEP et MOGAD restent des diagnostics majeurs devant névrite ou myélite. La topographie, les bandes oligoclonales et le CBA sont combinés plutôt que mis en concurrence comme tests souverains. L’absence de bande n’est pas la présence de MOGAD, pas plus qu’un symptôme après vaccination ne prouve une cause vaccinale.</p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-s-semio-urgency" data-semiology="urgency"><h3>Reconnaître le moment où le signe impose une action</h3><p>Une chute de vision importante, un déficit moteur qui progresse, une rétention, une atteinte cervicale haute ou une dégradation de conscience justifient une prise en charge urgente. Les signes respiratoires et de protection des voies aériennes décident du niveau de surveillance. Prélever immédiatement si possible, mais ne pas attendre le résultat de l’anticorps pour discuter le traitement de poussée.</p><p>Le repère de 48 heures de symptômes dans certaines conditions de syndrome de l’area postrema sert au diagnostic ; il ne demande pas d’attendre avant l’évaluation. Sous anti-C5, une suspicion d’infection à méningocoque est une urgence malgré vaccination. La sémiologie du danger prime sur la stabilité supposée d’un code ou d’un titre.</p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r8">[8]</button> · <button class="w" data-k="g36-r9">[9]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-s-semio-limits" data-semiology="limits"><h3>Énoncer les limites de l’examen</h3><p>L’acuité habituelle peut manquer certaines atteintes à faible contraste ; un déficit pupillaire relatif dépend de l’asymétrie. L’IRM et l’OCT ont leurs limites de date et de qualité. Les traitements peuvent modifier les anticorps et la réponse inflammatoire. Aucun de ces éléments n’est une raison d’abandonner l’examen ; ils précisent sa portée.</p><p>Les fréquences de cohortes et les descriptions de cas ne sont pas la sensibilité ou la spécificité d’un signe dans tout service. La revue Hurst fournit un niveau de preuve faible. L’absence de statistiques suisses G36 et de règles administratives exhaustives est conservée comme lacune. Une conclusion honnête associe résultat, conditions de mesure et incertitude.</p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-s-semio-sources" data-semiology="sources"><h3>Relier la sémiologie aux passages réellement lus</h3><p>Les descriptions cliniques, les conditions de tests et l’examen visuel proviennent des sections ciblées de NEMOS 2023. La distinction MOGAD et les critères de méthode sont confrontés au consensus primaire 2023 et à sa revue suisse 2024. La forme Hurst est reliée au cas et à la revue bâlois 2020, sans leur attribuer la force d’un essai.</p><p>La démarche pédagogique suit un raisonnement local de situations cliniques, compatible avec le cadre PROFILES réutilisé. Elle ne constitue ni une liste fédérale officielle de codes ni une certification humaine. Les fenêtres de sources précisent versions, passages et limites et permettent un audit ultérieur.</p><p><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener noreferrer">NEMOS : sémiologie clinique, anticorps et examen visuel</a></p><figure id="g36-science-links-semio"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g36-diag-semio"><title id="g36-diag-semio">Fonction mesurée puis Signe interprété puis Décision adaptée</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Fonction mesurée</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Signe interprété</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Décision adaptée</text></svg><figcaption>Schéma conceptuel non anatomique. Les relations et leurs limites sont expliquées dans le tableau ; aucune structure anatomique n’est dessinée.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation</th></tr></thead><tbody><tr><td>Mesure → signe</td><td>La méthode et les facteurs limitants sont explicités.</td></tr><tr><td>Signe → décision</td><td>Topographie et gravité orientent la conduite ; aucun signe ne prouve seul la cible.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Science → clinique. Les réseaux expliquent les fonctions atteintes. Science → examen. Mesurer séparément les domaines et comparer. Science → traitement. Le danger et le mécanisme orientent des soins différents.</div><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r11">[11]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button> · <button class="w" data-k="g36-r15">[15]</button></p></section></div><div class="sci" id="g36-s-anat" role="tabpanel" aria-labelledby="g36-tab-anat" hidden><section class="ilot" id="g36-s-anat-body"><h2>Les voies normales et la topographie donnent un sens au déficit</h2><p>Une voie motrice descendante relie des régions corticales aux circuits médullaires. L’illustration historique ci-dessous montre notamment capsule interne, décussation et faisceau corticospinal croisé. Elle est utile pour comprendre une distribution du déficit ; elle ne représente pas toutes les voies sensitives, le système visuel ni une lésion de NMOSD.</p><p>Le nerf optique, la moelle, le tronc et l’encéphale sont des territoires distincts. Une atteinte multifocale peut les associer, sans exiger qu’ils soient touchés tous ensemble. Le siège d’une myélite influence force, sensibilité, sphincters et parfois respiration. Une atteinte du conus rend certains troubles sphinctériens particulièrement pertinents et peut orienter vers MOGAD dans le contexte approprié.</p><p>L’IRM sagittale renseigne sur la longueur ; les coupes axiales précisent les tissus et la distribution. Une lésion longue ne décrit pas tout son effet fonctionnel et un même déficit peut venir de plusieurs sièges. Une carte anatomique aide à poser une question d’imagerie mais ne remplace pas l’examen comparatif.</p><p>L’AQP4 appartient aux astrocytes et la MOG à la myéline oligodendrocytaire ; une image de substance blanche n’identifie pas visuellement l’anticorps responsable. La topographie et le mécanisme sont reliés par des données complémentaires. Dans Hurst, l’œdème et les hémorragies peuvent s’ajouter à l’inflammation et aux lésions de myéline.</p><p>Science → clinique. Décrire territoire et fonctions explique pourquoi une parésie et une névrite ne donnent pas les mêmes plaintes. Science → examen. Comparer examen neurologique et IRM dans plusieurs plans, avec attention aux limites. Science → traitement. Une compression, une atteinte respiratoire ou un œdème menaçant change l’urgence et les interventions. À retenir. L’anatomie guide la localisation ; elle ne fournit pas seule la cause immunologique.</p><figure id="g36-science-links-anat"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g36-diag-anat"><title id="g36-diag-anat">Siège de la lésion puis Fonctions atteintes puis Examen ciblé</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Siège de la lésion</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Fonctions atteintes</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Examen ciblé</text></svg><figcaption>Schéma conceptuel non anatomique. Les relations et leurs limites sont expliquées dans le tableau ; aucune structure anatomique n’est dessinée.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation</th></tr></thead><tbody><tr><td>Première relation</td><td>Le mécanisme décrit oriente une question clinique, sans équivalence automatique.</td></tr><tr><td>Deuxième relation</td><td>Le résultat est confronté au contexte et aux limites de la source.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button> · <button class="w" data-k="g36-r14">[14]</button></p></section><section class="ilot" id="g36-s-anat-figure"><h2>Voies motrices : planche humaine normale</h2><p>La planche ancienne sert de repère de normalité et non de modèle de lésion. Les quatre annotations françaises identifient seulement les structures lisibles et pertinentes. Les voies visuelles et tous les circuits sensitifs n’y sont pas représentés ; leur absence sur cette image ne signifie pas leur absence dans le raisonnement clinique.</p><figure><img src="assets/img/g36/alpha/codex/Gray764.png" alt="Voies motrices normales : illustration humaine historique" loading="lazy"><figcaption>Voies motrices normales : illustration humaine historique. Gray, Anatomy of the Human Body, 1918, illustration attribuée à Henry Vandyke Carter. <a href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener noreferrer">Source et notice du domaine public</a>. Pixels inchangés ; annotations françaises adjacentes ajoutées.</figcaption><table class="t"><thead><tr><th>Repère de l’original</th><th>Annotation française et portée</th></tr></thead><tbody><tr><td>Motor area</td><td>Aire motrice : origine corticale représentée des voies motrices descendantes.</td></tr><tr><td>Internal capsule</td><td>Capsule interne : regroupement de fibres motrices ; une lésion donne une distribution dépendant du siège.</td></tr><tr><td>Decussation of pyramids</td><td>Décussation des pyramides : croisement représenté des voies corticospinales.</td></tr><tr><td>Crossed pyramidal tract</td><td>Faisceau corticospinal croisé : voie motrice médullaire ; cette planche ne représente pas toutes les voies sensitives ni le nerf optique.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r14">[14]</button></p></section></div><div class="sci" id="g36-s-physio" role="tabpanel" aria-labelledby="g36-tab-physio" hidden><section class="ilot" id="g36-s-physio-body"><h2>De la fonction à sa perte : conduction, inflammation et séquelles</h2><p>Une fonction nerveuse dépend de la transmission des signaux et de l’intégrité des cellules qui la soutiennent. La myéline et les interactions entre cellules contribuent à cette organisation. L’inflammation peut produire un déficit par perturbation de la conduction ; une destruction tissulaire plus importante peut laisser une perte durable. Le cours distingue ainsi amélioration d’un épisode et prévention du suivant.</p><p>Dans la NMOSD AQP4 positive, la lésion astrocytaire peut s’accompagner d’une atteinte secondaire de myéline et d’axones. Une perte visuelle ou une faiblesse peut survenir rapidement pendant une poussée. L’importance du handicap résiduel dépend notamment de la sévérité et de la prise en charge, sans seuil permettant de promettre une récupération complète.</p><p>Le syndrome de l’area postrema relie une atteinte bulbaire à des nausées, vomissements et hoquet. La fonction digestive ressentie ne prouve pas une cause digestive. Les conditions du syndrome exigent pourtant exclusion des alternatives et, selon l’imagerie, une durée minimale ; ce niveau diagnostique ne diffère pas l’évaluation d’un symptôme grave.</p><p>La MOGAD peut partager certaines manifestations et répondre à des traitements d’attaque, tout en restant une maladie distincte avec un cours monophasique ou récidivant. L’absence de poussées apparentes n’équivaut pas à une preuve que toute atteinte tissulaire a disparu. Le suivi porte sur fonctions, symptômes et tolérance.</p><p>Science → clinique. Distinguer épisode, séquelle et aggravation provoquée par une autre cause. Science → examen. Reprendre les mêmes mesures et leur chronologie ; une IRM précoce peut sous-estimer l’évolution. Science → traitement. La thérapie de poussée cherche à limiter la lésion actuelle, la prévention cherche à réduire les événements futurs. À retenir. Le même mot amélioration ne décrit pas tous les mécanismes ni tous les objectifs.</p><figure id="g36-science-links-physio"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g36-diag-physio"><title id="g36-diag-physio">Inflammation aiguë puis Déficit fonctionnel puis Récupération évaluée</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Inflammation aiguë</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Déficit fonctionnel</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Récupération évaluée</text></svg><figcaption>Schéma conceptuel non anatomique. Les relations et leurs limites sont expliquées dans le tableau ; aucune structure anatomique n’est dessinée.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation</th></tr></thead><tbody><tr><td>Première relation</td><td>Le mécanisme décrit oriente une question clinique, sans équivalence automatique.</td></tr><tr><td>Deuxième relation</td><td>Le résultat est confronté au contexte et aux limites de la source.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r11">[11]</button> · <button class="w" data-k="g36-r12">[12]</button></p></section></div><div class="sci" id="g36-s-bio" role="tabpanel" aria-labelledby="g36-tab-bio" hidden><section class="ilot" id="g36-s-bio-body"><h2>Une protéine cible et un résultat analytique ne sont pas une maladie à eux seuls</h2><p>Les anticorps se lient à des structures moléculaires. Pour une recherche AQP4 ou MOG pertinente, la conformation de la protéine compte : les CBA utilisent une protéine humaine complète exprimée par des cellules. Des peptides ou une technique différente ne présentent pas exactement les mêmes déterminants. Une valeur obtenue par une méthode ne se transpose pas sans précaution dans une autre.</p><p>Le laboratoire décrit sérum ou LCR, résultat qualitatif, titre ou rapport de fluorescence et référence. Un titre exprime les conditions d’un test ; il ne mesure pas directement le volume de tissu lésé. Les CBA vivants et fixés diffèrent par leurs propriétés et leurs seuils. Dans le consensus MOG 2023, le repère fixé 1:100 ne devient donc pas le seuil de tous les laboratoires.</p><p>Une faible positivité est plus difficile à interpréter quand le tableau ne ressemble pas à la maladie recherchée. La probabilité avant le test et les alternatives influencent la valeur prédictive. Une double positivité AQP4/MOG exceptionnelle est une raison de vérifier, pas de créer sans contrôle une troisième maladie combinée.</p><p>Corticoïdes, aphérèse et immunothérapie peuvent influencer la détection. Prélever avant traitement si possible et transmettre le calendrier au laboratoire. Si le résultat est négatif mais la suspicion forte, le centre discute méthode et répétition ; une négativité isolée après traitement ne tranche pas toujours.</p><p>Science → clinique. Une molécule détectée doit s’accorder avec un événement compatible. Science → examen. Exiger méthode, seuil, date et contexte avant de lire positif ou négatif. Science → traitement. Une décision durable ne se fonde pas sur un résultat faible ou discordant non confirmé. À retenir. Le compte rendu analytique fait partie de la preuve clinique, avec ses conditions et ses limites.</p><figure id="g36-science-links-bio"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g36-diag-bio"><title id="g36-diag-bio">Méthode documentée puis Résultat contextualisé puis Diagnostic confronté</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Méthode documentée</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Résultat contextualisé</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Diagnostic confronté</text></svg><figcaption>Schéma conceptuel non anatomique. Les relations et leurs limites sont expliquées dans le tableau ; aucune structure anatomique n’est dessinée.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation</th></tr></thead><tbody><tr><td>Première relation</td><td>Le mécanisme décrit oriente une question clinique, sans équivalence automatique.</td></tr><tr><td>Deuxième relation</td><td>Le résultat est confronté au contexte et aux limites de la source.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button></p></section></div><div class="sci" id="g36-s-micro" role="tabpanel" aria-labelledby="g36-tab-micro" hidden><section class="ilot" id="g36-s-micro-body"><h2>Cibler une voie immunitaire modifie aussi les défenses</h2><p>Le système immunitaire participe à la reconnaissance et à l’élimination des agents infectieux. Dans une maladie auto-immune, certains anticorps et voies effectrices contribuent à une lésion de tissus de l’organisme. AQP4 positive et MOGAD ne décrivent pas le même processus ; les traitements ne se choisissent pas à partir du seul mot inflammation.</p><p>L’activation terminale du complément contribue à la lésion astrocytaire dans NMOSD AQP4 positive. Eculizumab et ravulizumab bloquent C5 ; cette action réduit une voie délétère mais accroît la susceptibilité à certaines infections, notamment méningococciques. Le risque peut persister malgré vaccination et exige information, carte et accès rapide aux soins.</p><p>L’inébilizumab réduit les cellules B CD19 positives, avec effet sur certaines cellules productrices d’anticorps et les immunoglobulines. Le satralizumab agit sur le récepteur de l’IL-6. La surveillance n’est donc pas identique : immunoglobulines et infections, cellules sanguines, foie ou interactions sont prises en compte selon le produit.</p><p>Une vaccination ne constitue ni une autorisation sans précaution ni une cause certaine de poussée. Les recommandations et FI organisent son calendrier en tenant compte de la maladie active et de l’immunosuppression. Les vaccins vivants demandent des conditions propres et ne se donnent pas arbitrairement pendant une immunosuppression.</p><p>Science → clinique. Une fièvre sous traitement peut être une complication infectieuse urgente. Science → examen. Rechercher infection et déficits immunitaires avant et pendant le traitement selon la FI. Science → traitement. Associer le bénéfice attendu aux mesures de réduction des risques, sans interrompre soi-même une prévention nécessaire. À retenir. Le mécanisme utile et le risque infectieux sont deux conséquences de la même cible.</p><figure id="g36-science-links-micro"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g36-diag-micro"><title id="g36-diag-micro">Cible immunitaire puis Effet thérapeutique puis Risque surveillé</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Cible immunitaire</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Effet thérapeutique</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Risque surveillé</text></svg><figcaption>Schéma conceptuel non anatomique. Les relations et leurs limites sont expliquées dans le tableau ; aucune structure anatomique n’est dessinée.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation</th></tr></thead><tbody><tr><td>Première relation</td><td>Le mécanisme décrit oriente une question clinique, sans équivalence automatique.</td></tr><tr><td>Deuxième relation</td><td>Le résultat est confronté au contexte et aux limites de la source.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r6">[6]</button> · <button class="w" data-k="g36-r7">[7]</button> · <button class="w" data-k="g36-r8">[8]</button> · <button class="w" data-k="g36-r9">[9]</button></p></section></div><div class="sci" id="g36-s-pharma" role="tabpanel" aria-labelledby="g36-tab-pharma" hidden><section class="ilot" id="g36-s-pharma-body"><h2>Dose, concentration et intervalle expriment des décisions différentes</h2><p>La méthylprednisolone est fournie dans Solu-Medrol sous forme de succinate sodique, avec masse de méthylprednisolone base indiquée. L’ester hydrosoluble permet la préparation injectable et est hydrolysé. Son action implique la synthèse de protéines et comporte un délai même par voie parentérale. Une injection IV ne signifie donc pas une réparation instantanée du tissu nerveux.</p><p>Les anticorps thérapeutiques sont de grandes protéines avec une élimination différente de nombreux petits médicaments. L’absence d’ajustement rénal dans une notice ne signifie pas que le rein et les comorbidités sont sans importance. Elle ne permet pas non plus d’extrapoler une règle d’un produit à un autre ou à une population non étudiée.</p><p>Une dose en milligrammes ne donne pas le volume sans connaître la concentration et la dilution. Ultomiris existe en formulations 10 et 100 mg/ml : confondre les volumes peut provoquer une erreur majeure. La dose de charge, la première maintenance et les intervalles ultérieurs doivent rester distincts ; la correction NEMOS 2024 confirme ce point pour ravulizumab.</p><p>La prévention agit dans la durée, avec des délais propres. Une poussée peut demander un traitement d’attaque même chez une personne sous immunothérapie. Aphérèse, autres anticorps et immunoglobulines peuvent modifier l’exposition ou les risques ; la pharmacie et la notice guident la coordination, sans calendrier universel inventé.</p><p>Science → clinique. Identifier si l’objectif est la poussée actuelle ou une prévention prolongée. Science → examen. Surveiller fonction, infection, organes et paramètres du produit. Science → traitement. Écrire nom, indication, voie, masse, rythme et conditions de sécurité. À retenir. Ni les milligrammes, ni les millilitres, ni l’intervalle seul ne constituent une prescription complète.</p><figure id="g36-science-links-pharma"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g36-diag-pharma"><title id="g36-diag-pharma">Produit et indication puis Dose et calendrier puis Tolérance et réponse</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Produit et indication</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Dose et calendrier</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Tolérance et réponse</text></svg><figcaption>Schéma conceptuel non anatomique. Les relations et leurs limites sont expliquées dans le tableau ; aucune structure anatomique n’est dessinée.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation</th></tr></thead><tbody><tr><td>Première relation</td><td>Le mécanisme décrit oriente une question clinique, sans équivalence automatique.</td></tr><tr><td>Deuxième relation</td><td>Le résultat est confronté au contexte et aux limites de la source.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r5">[5]</button> · <button class="w" data-k="g36-r6">[6]</button> · <button class="w" data-k="g36-r7">[7]</button> · <button class="w" data-k="g36-r8">[8]</button> · <button class="w" data-k="g36-r9">[9]</button> · <button class="w" data-k="g36-r10">[10]</button></p></section></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="g36-p-cadre"><h2>La préparation exacte et l’indication sont vérifiées avant toute dose</h2><p>Les notices ci-dessous ont été obtenues avec l’outil Swissmedic FI du dépôt et leurs dates réellement servies ont été lues. Leurs indications et populations restent celles du produit. Le guide NEMOS organise la stratégie de NMOSD ; une recommandation clinique et une indication réglementaire ne sont pas fondues.</p><p>Ces repères ne décrivent pas une ordonnance individuelle. Le centre vérifie prémedication, dilution, débit, calendrier, vaccins, infections et organes dans la notice complète et le protocole adapté. Les doses d’autres indications présentes sur la même page ne sont pas reprises pour NMOSD.</p><p>Sources : <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r6">[6]</button> · <button class="w" data-k="g36-r7">[7]</button> · <button class="w" data-k="g36-r8">[8]</button> · <button class="w" data-k="g36-r9">[9]</button> · <button class="w" data-k="g36-r10">[10]</button></p></section><section class="ilot" id="g36-p-solumedrol"><h2>Solu-Medrol : masse de base et perfusion lente</h2><p>La FI d’août 2025 décrit notamment les flacons 500 mg et 1 g de méthylprednisolone, sous forme de succinate sodique. La masse est donnée comme méthylprednisolone base. Pour les poussées SEP, la notice décrit 500 à 1000 mg IV sur 30 minutes durant 3 à 5 jours ; elle ne nomme pas NMOSD dans cette indication. Le schéma NMOSD 1000 mg/jour durant 3 à 5 jours est attribué à NEMOS, avec préparation et précautions de FI.</p><p>Au-delà de 250 mg, la perfusion dure au minimum 30 minutes ; les administrations plus faibles ont leurs règles propres. Surveiller pression, glycémie, électrolytes, infection et tolérance. Les vaccins vivants sont contre-indiqués sous dose immunosuppressive. Mycose systémique et hypersensibilité font partie des contre-indications ; les excipients, notamment alcool benzylique, imposent des restrictions pédiatriques.</p><p><button class="w" data-k="g36-solumedrol">Méthylprednisolone : risques et limites du schéma</button></p><p>Sources : <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r10">[10]</button></p></section><section class="ilot" id="g36-p-enspryng"><h2>Enspryng : semaines 0, 2, 4 puis entretien dès la semaine 8</h2><p>Enspryng contient satralizumab 120 mg dans une seringue préremplie de 1 ml pour voie sous-cutanée. La FI de janvier 2023 indique son usage seul ou avec un immunosuppresseur chez les adultes et adolescents AQP4 positifs. Le schéma est 120 mg aux semaines 0, 2 et 4, puis 120 mg toutes les 4 semaines à partir de la semaine 8.</p><p>Avant début : dépistage VHB/tuberculose, bilan hépatique, statut vaccinal et information. Une infection active conduit à reporter l’administration jusqu’à résolution. VHB active, tuberculose active ou latente non traitée et hypersensibilité sont contre-indiquées. Les paramètres hépatiques et neutrophiles sont surveillés ; les règles d’interruption et reprise dépendent des résultats et ne sont pas résumées en une simple dose réduite.</p><p><button class="w" data-k="g36-enspryng">Satralizumab : surveillance et populations</button></p><p>Sources : <button class="w" data-k="g36-r6">[6]</button></p></section><section class="ilot" id="g36-p-uplizna"><h2>Uplizna : deux doses initiales puis entretien tous les six mois</h2><p>La FI d’octobre 2023 indique l’inébilizumab en monothérapie chez l’adulte AQP4-IgG positif. Un flacon contient 100 mg/10 ml ; le produit est dilué pour perfusion. Le schéma comporte 300 mg IV, puis 300 mg deux semaines plus tard, puis 300 mg tous les six mois. Aucun ancrage calendaire supplémentaire n’est inventé ici pour cet entretien.</p><p>Avant début : NFS, immunoglobulines, cellules B et dépistage VHB, VHC, tuberculose ; vaccinations selon la FI au moins 4 semaines avant. Une infection significative reporte la perfusion. Une prémédication et une surveillance sont requises ; observer pendant et au moins une heure après. Infection active sévère, tuberculose non traitée, antécédent LEMP, déficit immunitaire sévère et malignité évolutive font partie des contre-indications.</p><p><button class="w" data-k="g36-uplizna">Inébilizumab : la déplétion B persiste</button></p><p>Sources : <button class="w" data-k="g36-r7">[7]</button></p></section><section class="ilot" id="g36-p-soliris"><h2>Soliris : 900 mg hebdomadaires puis 1200 mg toutes les deux semaines</h2><p>La FI d’avril 2026 indique eculizumab pour la NMOSD récurrente de l’adulte AQP4 positif. Le flacon contient 300 mg/30 ml, soit 10 mg/ml avant dilution. Le schéma NMOSD est 900 mg IV chaque semaine pendant 4 semaines, 1200 mg la cinquième semaine, puis 1200 mg tous les 14 jours avec la marge propre de notice. Les doses HPN et âges MG présents dans la même FI ne sont pas transposés.</p><p>L’infection méningococcique non résolue, l’absence de vaccination à jour sans antibioprophylaxie appropriée et les déficits héréditaires du complément font partie des contre-indications. La réduction du risque infectieux et l’information du patient sont détaillées dans la fenêtre commune anti-C5, avec les formulations propres à chaque produit.</p><p><button class="w" data-k="g36-soliris">Eculizumab : organes et grossesse</button></p><p>Sources : <button class="w" data-k="g36-r9">[9]</button></p></section><section class="ilot" id="g36-p-ultomiris"><h2>Ultomiris : une charge, puis première maintenance deux semaines après</h2><p>La FI de février 2026 concerne ici l’adulte AQP4 positif. Les doses IV dépendent du poids au moment du traitement. La charge est administrée une seule fois au départ ; la première maintenance vient deux semaines après, puis les maintenances toutes les 8 semaines. La correction NEMOS 2024 a précisément corrigé une ancienne confusion faisant répéter une dose de charge au jour 15.</p><p>Ultomiris existe en solutions 10 mg/ml et 100 mg/ml avant dilution, donnant des concentrations finales différentes. Les volumes ne sont pas interchangeables. Les tableaux pédiatriques d’HPN ou SHUa ne deviennent pas un schéma NMOSD de l’enfant. La tolérance de calendrier, les doses supplémentaires après aphérèse et les dilutions sont revues dans la FI pour le cas réel.</p><table class="t"><thead><tr><th>Poids adulte</th><th>Charge IV</th><th>Maintenance IV</th></tr></thead><tbody><tr><td>40 kg à moins de 60 kg</td><td>2400 mg</td><td>3000 mg</td></tr><tr><td>60 kg à moins de 100 kg</td><td>2700 mg</td><td>3300 mg</td></tr><tr><td>100 kg ou plus</td><td>3000 mg</td><td>3600 mg</td></tr></tbody></table><p><button class="w" data-k="g36-ultomiris">Ravulizumab : calendrier corrigé et preuve clinique</button></p><p>Sources : <button class="w" data-k="g36-r5">[5]</button> · <button class="w" data-k="g36-r8">[8]</button></p></section><section class="ilot" id="g36-p-infections"><h2>Sous anti-C5, le vaccin ne supprime pas l’urgence méningococcique</h2><p>Eculizumab et ravulizumab augmentent la susceptibilité aux infections à méningocoque, parfois graves ou fatales malgré vaccination. Informer sur les symptômes, remettre carte et brochure et organiser une évaluation immédiate en cas de suspicion. D’autres infections à Neisseria ou bactéries encapsulées sont possibles.</p><p>Les FI demandent une vaccination méningococcique à jour au moins deux semaines avant début, sauf si le risque du report l’emporte. Quand le traitement commence moins de deux semaines après vaccination, une antibioprophylaxie appropriée est requise jusqu’à deux semaines après cette vaccination. Le choix d’antibiotique et les rappels suivent les recommandations et la situation réelle ; aucun schéma antibiotique non relu n’est inventé.</p><p><button class="w" data-k="g36-complement">Prévenir le risque sans promettre son abolition</button></p><button class="pareto-btn ui" data-k="pareto-g36-pharma">▲ Loi de Pareto — Produit, calendrier et sécurité</button><p>Sources
