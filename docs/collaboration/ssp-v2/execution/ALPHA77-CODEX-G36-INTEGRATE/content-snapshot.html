 : <button class="w" data-k="g36-r8">[8]</button> · <button class="w" data-k="g36-r9">[9]</button></p></section><section class="ilot" id="g36-sources"><h2>Sources réellement lues et limites de leur utilisation</h2><p>La classification et les notices suisses, la revue HUG/CHUV et la publication bâloise sont distinguées des recommandations NEMOS et du consensus MOG international. Les lectures sont ciblées ; les fenêtres précisent leurs passages, versions, populations et limites. Les textes intégraux restent hors Git et les sources publiques sont liées pour l’audit différé.</p><ol><li><button class="w" data-k="g36-r1">[1] OFS CIM-10-GM française</button></li><li><button class="w" data-k="g36-r2">[2] BfArM bloc G35–G37</button></li><li><button class="w" data-k="g36-r3">[3] NEMOS partie I</button></li><li><button class="w" data-k="g36-r4">[4] NEMOS partie II</button></li><li><button class="w" data-k="g36-r5">[5] Correction NEMOS partie II</button></li><li><button class="w" data-k="g36-r6">[6] Enspryng information professionnelle suisse</button></li><li><button class="w" data-k="g36-r7">[7] Uplizna information professionnelle suisse</button></li><li><button class="w" data-k="g36-r8">[8] Ultomiris information professionnelle suisse</button></li><li><button class="w" data-k="g36-r9">[9] Soliris information professionnelle suisse</button></li><li><button class="w" data-k="g36-r10">[10] Solu-Medrol information professionnelle suisse</button></li><li><button class="w" data-k="g36-r11">[11] Lerusse et coll., Revue médicale suisse, HUG/CHUV</button></li><li><button class="w" data-k="g36-r12">[12] Banwell et coll., Lancet Neurology ; reprint public Sumaira</button></li><li><button class="w" data-k="g36-r13">[13] Grzonka et coll., Hôpital universitaire de Bâle, Front Neurol</button></li><li><button class="w" data-k="g36-r14">[14] Gray764 : voies motrices normales</button></li><li><button class="w" data-k="g36-r15">[15] PROFILES : cadre des situations et raisonnement clinique</button></li></ol><p>Sources : <button class="w" data-k="g36-r1">[1]</button> · <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r5">[5]</button> · <button class="w" data-k="g36-r11">[11]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="g36-nmosd" data-k="g36-nmosd"><h3>NMOSD : syndrome, sérologie et alternatives</h3><p>Les six caractéristiques cardinales concernent nerf optique, moelle, area postrema, autre tronc cérébral, diencéphale et cerveau. La sérologie AQP4 positive et la négativité ne conduisent pas au même niveau d’exigence diagnostique. Les patients qui remplissent les critères de MOGAD ne doivent pas être conservés sous une étiquette NMOSD séronégative par habitude.</p><p>La catégorie de classification et la définition immunologique moderne répondent à des questions différentes. Le diagnostic repose sur la clinique, l’IRM et la méthode d’anticorps, avec exclusion des alternatives. Le traitement de prévention étudié chez AQP4 positifs n’est pas transféré à tous les tableaux inflammatoires.</p><p>Sources : <button class="w" data-k="g36-r1">[1]</button> · <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button></p></template>
<template data-pop="g36-adem" data-k="g36-adem"><h3>ADEM et codes voisins : lire le libellé complet</h3><p>G37.8 inclut l’encéphalomyélite aiguë disséminée, appelée ADEM ou EMAD. G37.3 comprend la myélite transverse aiguë sans précision mais exclut sclérose en plaques et neuromyélite optique. G04.8 inclut l’encéphalite et l’encéphalomyélite postinfectieuses SAI.</p><p>G04.0 concerne l’encéphalite aiguë disséminée avec inclusions postvaccinales. La note demande au besoin un code supplémentaire de cause externe pour identifier le vaccin ; ce n’est pas un ajout imposé sans lecture du cas. Une association temporelle après vaccination ne démontre pas un mécanisme causal. Le codage individuel actuel et les règles administratives sont vérifiés auprès des professionnels compétents.</p><p>Sources : <button class="w" data-k="g36-r1">[1]</button> · <button class="w" data-k="g36-r2">[2]</button></p></template>
<template data-pop="g36-serie" data-k="g36-serie"><h3>Hurst : ce que permettent 43 cas publiés</h3><p>La revue bâloise de 2020 a retenu 43 publications de cas adultes depuis 2000, chacune apportant une personne. Les hommes représentaient 67 % et l’âge moyen était 38 ans. La mortalité rapportée était 46, 5 %, avec des issues et traitements hétérogènes.</p><p>Il ne s’agit ni d’une cohorte nationale ni d’un essai comparatif. Le biais de publication, les données manquantes et les formes autopsiques influencent la sélection. Les associations avec infections, maladies auto-immunes ou vaccinations ne prouvent pas une causalité. Le taux de décès n’est pas une prédiction individuelle et les traitements observés ne démontrent pas leur efficacité.</p><p>Sources : <button class="w" data-k="g36-r13">[13]</button></p></template>
<template data-pop="g36-mnemo" data-k="g36-mnemo"><h3>Six territoires : un aide-mémoire local</h3><p>Nerf optique, Moelle, Area postrema, autre Tronc, Diencéphale et Cerveau constituent les six territoires des caractéristiques cardinales IPND. L’aide-mémoire NMATDC est une construction pédagogique locale, pas un score validé ni un critère officiel supplémentaire.</p><p>Une atteinte extra-opticospinale n’écarte pas NMOSD. Cependant les symptômes ont plusieurs causes possibles et certaines manifestations demandent une IRM typique pour satisfaire les critères. L’aide-mémoire guide les questions ; il ne remplace ni les conditions diagnostiques ni l’exclusion des alternatives.</p><p>Sources : <button class="w" data-k="g36-r3">[3]</button></p></template>
<template data-pop="g36-myelite" data-k="g36-myelite"><h3>Myélite : localiser et mesurer la gravité</h3><p>Une atteinte médullaire peut associer déficit moteur, trouble sensitif et dysfonction vésicale, intestinale ou sexuelle. La présentation peut être partielle. Le niveau clinique et le siège IRM ne se superposent pas toujours exactement ; l’examen et l’imagerie sont confrontés.</p><p>Une lésion étendue sur au moins trois segments vertébraux contigus constitue un repère de myélite longitudinalement étendue. Elle oriente vers NMOSD ou MOGAD mais n’est pas spécifique. Des lésions courtes existent aussi, notamment selon la date d’IRM ; elles n’excluent pas à elles seules NMOSD. Une compression doit être recherchée rapidement, surtout si douleur, niveau ou dysfonction sphinctérienne.</p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button></p></template>
<template data-pop="pareto-g36-clin" data-k="pareto-g36-clin"><h3>Localiser et hiérarchiser</h3><p>Décrire vision, moelle, conscience et respiration ; rechercher les six territoires. Les signes orientent, la sérologie et l’IRM se confrontent au contexte. Un terrain atypique n’est pas une exclusion.</p></template>
<template data-pop="g36-mogad" data-k="g36-mogad"><h3>Critères MOG 2023 : ne pas universaliser le seuil</h3><p>Pour un CBA fixé, le consensus définit un résultat clair à titre ≥ 1:100 et un faible positif à titre ≥ 1:10 et < 1:100. Pour un CBA vivant, les seuils sont ceux de la méthode validée, par titre ou rapport de fluorescence ; le chiffre 1:100 n’est pas un seuil universel.</p><p>Les soutiens d’une névrite incluent atteinte bilatérale simultanée, lésion sur plus de la moitié du nerf, rehaussement périneural et œdème papillaire. Les soutiens médullaires incluent lésion étendue, atteinte centrale ou signe en H et conus. Les lésions cérébrales compatibles et leurs limites sont détaillées dans la source primaire.</p><p>La Box 5 du guide NEMOS diagnostique cite encore les critères MOG de 2018. Elle n’est pas présentée ici comme le panel 2023. La revue suisse 2024 adapte ce dernier ; sa simplification du tableau ne remplace pas les distinctions de méthode du texte primaire.</p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r11">[11]</button> · <button class="w" data-k="g36-r12">[12]</button></p></template>
<template data-pop="g36-attaque" data-k="g36-attaque"><h3>Aphérèse et corticoïdes : une décision de centre</h3><p>Échanges plasmatiques et immunoadsorption sont les techniques proposées dans le guide. Les données rétrospectives associent traitement précoce et meilleure récupération ; elles ne garantissent pas une guérison individuelle ni une comparaison causale parfaite.</p><p>Le choix dépend de la sévérité, des contre-indications, de la réponse antérieure et des ressources du centre. L’aphérèse peut modifier les concentrations de certains anticorps thérapeutiques ; une dose supplémentaire ou une coordination des perfusions doit suivre la FI concernée, sans inventer une règle unique pour tous les produits.</p><p>La surveillance comprend fonction neurologique, état infectieux, pression, glycémie, électrolytes et tolérance. La corticothérapie n’exclut pas une infection associée et peut masquer ses signes. Les traitements de soutien et de rééducation commencent en parallèle selon les possibilités et la sécurité.</p><p>Sources : <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r8">[8]</button> · <button class="w" data-k="g36-r9">[9]</button> · <button class="w" data-k="g36-r10">[10]</button></p></template>
<template data-pop="g36-hurst" data-k="g36-hurst"><h3>G36.1 : une preuve de cas ne crée pas un protocole</h3><p>Le cas publié à Bâle concernait un homme de 59 ans avec aphasie et déficit droit, puis mutisme, hémiplégie et coma en quelques jours. Le scanner initial était peu contributif ; l’IRM a révélé une progression de lésions et de petites hémorragies. La biopsie puis l’autopsie étaient compatibles avec Hurst.</p><p>Malgré une immunosuppression intensive, l’évolution fut fatale. Le cas illustre l’urgence et les limites du diagnostic, sans établir qu’un traitement est inutile ou bénéfique pour tous. La revue systématique repose sur des cas sélectionnés et non sur un essai. Une décision de biopsie ou d’escalade thérapeutique relève d’un centre spécialisé après confrontation des risques et alternatives.</p><p>Sources : <button class="w" data-k="g36-r13">[13]</button></p></template>
<template data-pop="pareto-g36-suivi" data-k="pareto-g36-suivi"><h3>Fonction, maladie et sécurité</h3><p>Rechercher un événement clinique nouveau et les effets indésirables ; utiliser les mêmes mesures fonctionnelles autant que possible. Un titre, une IRM ou une période stable ne décide pas seul d’un arrêt.</p></template>
<template data-pop="g36-cba" data-k="g36-cba"><h3>Pourquoi un test positif ne vaut pas toujours le même diagnostic</h3><p>Un test très spécifique peut néanmoins donner des faux positifs lorsque la maladie recherchée est rare ou le dépistage non ciblé. NEMOS déconseille le dépistage indiscriminé de personnes ayant une SEP typique sans éléments évocateurs de NMOSD. Le consensus MOG insiste également sur la sélection clinique.</p><p>Un résultat AQP4 faible, un test non standard ou un tableau inhabituel motivent une confirmation par CBA différent ou un nouveau prélèvement selon disponibilité. Pour MOG, les seuils et les soutiens supplémentaires dépendent de la catégorie du résultat et de la méthode. La positivité est interprétée avec le tableau ; elle n’efface pas une meilleure explication.</p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button></p></template>
<template data-pop="g36-lcs" data-k="g36-lcs"><h3>Albumine, bandes oligoclonales et MRZ : des indices, pas un diagnostic autonome</h3><p>Le quotient albumine LCR/sérum renseigne sur la barrière et s’interprète selon méthode, âge et référence du laboratoire. Un quotient augmenté n’identifie pas la cible AQP4 ou MOG. Les bandes restreintes au LCR soutiennent une synthèse intrathécale, fréquente dans la SEP mais possible dans d’autres maladies.</p><p>La réaction MRZ recherche une réponse intrathécale contre au moins deux des virus rougeole, rubéole et zona dans la définition citée. Sa fréquence diffère entre populations de SEP et maladies apparentées. Une réaction négative n’est pas un test positif pour MOGAD et n’exclut pas toute SEP.</p><p>Ces paramètres sont combinés à la clinique, l’IRM et aux anticorps appropriés. Aucun seuil unique de quotient n’est présenté comme une preuve de MOGAD. Les valeurs normales du laboratoire et les dénominateurs des cohortes doivent être conservés avant toute comparaison.</p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button></p></template>
<template data-pop="g36-oct" data-k="g36-oct"><h3>OCT : comprendre ce qui est mesuré</h3><p>L’OCT fournit une représentation des couches rétiniennes. La couche des fibres nerveuses péripapillaires et l’ensemble cellules ganglionnaires/plexiforme interne sont des paramètres utiles. Leur amincissement après névrite peut refléter une perte tissulaire ; la comparaison exige une technique et une qualité adéquates.</p><p>Les moyennes des groupes NMOSD, MOGAD et SEP peuvent différer, mais leurs distributions se recouvrent. Des antécédents de névrite et la date du test modifient le résultat. L’OCT complète l’examen et le suivi ; il ne remplace pas le diagnostic immunoclinique ni une prise en charge urgente de perte visuelle.</p><p>Sources : <button class="w" data-k="g36-r3">[3]</button></p></template>
<template data-pop="pareto-g36-exam" data-k="pareto-g36-exam"><h3>Une question par examen</h3><p>IRM localise et cherche les alternatives ; CBA caractérise dans un phénotype compatible ; LCR et OCT apportent des informations complémentaires. La méthode, le temps et le traitement font partie du résultat.</p></template>
<template data-pop="g36-solumedrol" data-k="g36-solumedrol"><h3>Méthylprednisolone : risques et limites du schéma</h3><p>Le médicament peut accroître, aggraver ou masquer les infections. Une tuberculose, une exposition parasitaire à risque et les traitements associés sont recherchés selon contexte. Des effets psychiatriques, métaboliques et musculaires peuvent compliquer le suivi ; une aggravation n’est pas systématiquement une poussée inflammatoire.</p><p>La FI demande prudence rénale sans ajustement posologique spécifique ; une insuffisance hépatique sévère peut ralentir le métabolisme et nécessiter adaptation individuelle. Grossesse après balance rigoureuse ; la notice demande de ne pas allaiter pendant utilisation. Les restrictions de prématuré et nouveau-né tiennent aussi à l’alcool benzylique.</p><p>Le schéma de traumatisme médullaire et les doses 2 g d’un cas Hurst ne sont pas utilisés comme règle NMOSD. Le relais et la décroissance dépendent de l’ensemble du traitement et du risque de sevrage, selon centre et notice ; pas d’arrêt improvisé après traitement prolongé.</p><p>Sources : <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r10">[10]</button></p></template>
<template data-pop="g36-enspryng" data-k="g36-enspryng"><h3>Satralizumab : surveillance et populations</h3><p>La FI demande ALAT/ASAT toutes les 4 semaines durant les 3 premiers mois, puis tous les 3 mois pendant un an et ensuite selon clinique. Les neutrophiles sont contrôlés après 4 à 8 semaines puis selon contexte. Les vaccins vivants ne sont pas coadministrés ; le statut vaccinal est mis à jour selon recommandations.</p><p>Les interactions via variation de l’expression CYP peuvent concerner des médicaments ajustés individuellement ; surveiller au début et à l’arrêt. Une atteinte hépatique n’a pas été étudiée ; la dégradation des anticorps ne fait pas attendre d’adaptation rénale systématique, mais les données sévères sont limitées. Les données adolescentes sont peu nombreuses et ne permettent pas un usage pédiatrique général.</p><p>Grossesse seulement si bénéfice pour la mère prédomine ; contraception envisagée pendant et jusqu’à 5 mois après la dernière dose. La FI demande de ne pas allaiter sous traitement et de mettre en balance les bénéfices. Ces règles ne deviennent pas celles de tous les anticorps.</p><p>Sources : <button class="w" data-k="g36-r6">[6]</button></p></template>
<template data-pop="g36-uplizna" data-k="g36-uplizna"><h3>Inébilizumab : la déplétion B persiste</h3><p>Suivre NFS et immunoglobulines périodiquement pendant et après traitement jusqu’à repopulation B, et rechercher infections avant chaque perfusion. Des infections opportunistes, une neutropénie tardive ou une hypogammaglobulinémie peuvent modifier la stratégie. Les vaccins vivants ne sont pas recommandés pendant traitement et jusqu’à repopulation.</p><p>Les fonctions rénale et hépatique ne sont pas les principales voies d’élimination attendues de l’anticorps ; les formes sévères sont peu ou non étudiées. Cela n’autorise pas à ignorer une maladie d’organe. La population NMOSD de la FI est adulte ; ne pas extrapoler l’entretien à tout enfant.</p><p>Grossesse à éviter sauf bénéfice supérieur au risque ; contraception pendant traitement et 6 mois après. Une exposition gestationnelle demande surveillance des cellules B du nouveau-né et adaptation des vaccins vivants. L’allaitement comporte une nuance des premiers jours et de l’exposition en fin de grossesse ; la décision suit la FI et le spécialiste plutôt qu’une interdiction ou autorisation de classe simplifiée.</p><p>Sources : <button class="w" data-k="g36-r7">[7]</button></p></template>
<template data-pop="g36-soliris" data-k="g36-soliris"><h3>Eculizumab : organes et grossesse</h3><p>La FI ne demande pas d’ajustement rénal ; sécurité et efficacité hépatiques ne sont pas étudiées. Une expérience limitée chez les personnes âgées n’équivaut pas à une preuve d’absence de risque. La traçabilité du nom commercial et du lot est conservée.</p><p>Pendant grossesse, évaluer individuellement nécessité claire et bénéfice-risque, avec surveillance mère et fœtus. Une contraception adéquate doit être envisagée pendant et au moins 5 mois après. Les données limitées d’allaitement demandent une balance bénéfices et risques ; ne pas recopier l’interdiction 8 mois du ravulizumab sur eculizumab.</p><p>Les perfusions et les éventuels traitements par aphérèse sont coordonnés selon notice. Une absence de réponse ou une interruption requiert un avis spécialisé ; une règle d’arrêt 12 semaines propre à la myasthénie n’est pas appliquée à NMOSD.</p><p>Sources : <button class="w" data-k="g36-r9">[9]</button></p></template>
<template data-pop="g36-ultomiris" data-k="g36-ultomiris"><h3>Ravulizumab : calendrier corrigé et preuve clinique</h3><p>L’essai NMOSD cité dans la FI inclut 58 adultes AQP4 positifs avec au moins une poussée l’année précédente. L’étude est ouverte ; NEMOS décrit un comparateur externe issu du bras placebo PREVENT. Il ne s’agit pas d’une comparaison contemporaine randomisée entre tous les anticorps, ni d’un classement universel de leur efficacité.</p><p>La FI ne demande pas d’ajustement rénal. L’hépatique n’est pas étudiée, même si les données PK suggèrent absence d’ajustement. Infection méningococcique non résolue et défaut de vaccination sans prophylaxie appropriée sont contre-indiqués, ainsi que déficits héréditaires du complément.</p><p>Contraception pendant et jusqu’à 8 mois après fin du traitement. Grossesse après balance bénéfice-risque ; la FI demande interruption d’allaitement pendant et jusqu’à 8 mois après. Un arrêt du traitement NMOSD impose surveillance des signes de poussée.</p><p>Sources : <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r5">[5]</button> · <button class="w" data-k="g36-r8">[8]</button></p></template>
<template data-pop="g36-complement" data-k="g36-complement"><h3>Prévenir le risque sans promettre son abolition</h3><p>Les sérogroupes A, C, Y, W135 et B lorsque disponible sont visés selon la FI et recommandations vaccinales. Le statut peut devoir être revu lors d’un changement d’inhibiteur. Une prophylaxie antibiotique ou un vaccin n’autorise pas à attendre devant fièvre, malaise important, céphalées ou tableau compatible avec sepsis.</p><p>La décision d’instaurer rapidement une prévention chez une maladie active doit être coordonnée avec les mesures de sécurité du produit. Le guide NEMOS et les FI ont leurs champs ; une recommandation de ne pas retarder indûment l’immunothérapie n’est pas une permission d’ignorer les contre-indications.</p><p>La vaccination et les antibiotiques réduisent certains risques, sans preuve d’une protection complète individuelle. La personne connaît le traitement reçu et sa conduite à tenir. Cette information est réévaluée au suivi, et non remise une seule fois sans vérifier sa compréhension.</p><p>Sources : <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r8">[8]</button> · <button class="w" data-k="g36-r9">[9]</button></p></template>
<template data-pop="pareto-g36-pharma" data-k="pareto-g36-pharma"><h3>Produit, calendrier et sécurité</h3><p>Vérifier l’indication AQP4, la voie, la concentration et le calendrier exact. Distinguer charge et maintenance ; vaccins, infections et organes appartiennent à la prescription.</p></template>
<template data-pop="g36-ipnd" data-k="g36-ipnd"><h3>Critères IPND 2015 : conditions cliniques et IRM</h3><p>Les six caractéristiques sont névrite optique, myélite aiguë, syndrome de l’area postrema, autre syndrome du tronc, narcolepsie ou syndrome diencéphalique avec IRM typique, et syndrome cérébral avec IRM typique. AQP4-IgG positif : au moins une caractéristique et absence de meilleure explication.</p><p>AQP4 négatif ou inconnu : au moins deux caractéristiques après un ou plusieurs épisodes, dissémination spatiale et au moins une névrite, une myélite ou un syndrome de l’area postrema. Les conditions IRM supplémentaires sont nécessaires : pour névrite, cerveau normal ou non spécifique, ou nerf optique atteint sur au moins la moitié de sa longueur ou chiasma ; pour myélite, lésion sur au moins trois segments contigus, ou atrophie focale sur au moins trois segments avec antécédent de myélite ; pour area postrema, lésion dorsale bulbaire ; pour syndrome aigu du tronc, lésion périépendymaire du tronc. Les autres diagnostics doivent être exclus.</p><p>Les conditions sont confrontées au tableau complet de la source et au cas réel. Une suspicion clinique urgente est prise en charge avant confirmation complète si nécessaire ; le statut inconnu motive une recherche précoce et ne devient pas une dispense de test.</p><p>Source : <button class="w" data-k="g36-r3">[3] NEMOS, tableaux des critères</button></p></template>

<template data-pop="g36-r1" data-k="g36-r1"><h3>[1] OFS : CIM-10-GM française 2024</h3><p>G36 est sans astérisque et comporte G36.0, G36.1, G36.8 et G36.9. Les exclusions distinguent G04.8 et H46. G37.8 inclut l’EMAD ; les mots du titre G36 ne classent pas automatiquement toute ADEM ou MOGAD.</p><p><b>Passages lus :</b> G36 et ses quatre sous-codes complets ; G04.0, G04.8, G37.3 et G37.8. <b>Version :</b> 2024, export du 31 octobre. <b>Limites :</b> Édition de classification explicitée ; pas certification du codage ou de la facturation d’un dossier individuel.</p><p>Lecture ciblée attribuée à Sol ; les deux lectures antérieures réutilisées sont indiquées dans le journal. Une heure de journalisation ne certifie pas une lecture intégrale.</p><p><a data-reference-source href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener noreferrer">Consulter la source — Office fédéral de la statistique</a></p></template>
<template data-pop="g36-r2" data-k="g36-r2"><h3>[2] BfArM : bloc G35–G37</h3><p>La version allemande confirme les quatre sous-codes, les exclusions et l’inclusion ADEM dans G37.8. La myélite transverse G37.3 ne remplace pas une neuromyélite optique établie.</p><p><b>Passages lus :</b> G36 entier et voisins G37. <b>Version :</b> ICD-10-GM 2024. <b>Limites :</b> Classification allemande, sans protocole thérapeutique suisse.</p><p>Lecture ciblée attribuée à Sol ; les deux lectures antérieures réutilisées sont indiquées dans le journal. Une heure de journalisation ne certifie pas une lecture intégrale.</p><p><a data-reference-source href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g35-g37.htm" target="_blank" rel="noopener noreferrer">Consulter la source — Institut fédéral allemand BfArM</a></p></template>
<template data-pop="g36-r3" data-k="g36-r3"><h3>[3] NEMOS : diagnostic et diagnostic différentiel</h3><p>Les critères IPND 2015, l’examen clinique, l’IRM, les CBA et le LCR se confrontent. La vision est mesurée dans les deux yeux ; OCT et champ apportent un soutien. Une courte lésion médullaire ou un LCR normal ne suffit pas à exclure. Les résultats faibles et les discordances demandent une vérification adaptée.</p><p><b>Passages lus :</b> Résumé ; sections 3, 5, 6, 7, 8 et 11 ; section 4 paragraphes 0–3 et 5–6 ; section 10 paragraphes 0–4 et 9–10 ; tableaux 1, 2 et 5 ; références des critères MOG 2018. <b>Version :</b> 2023 ; DOI 10.1007/s00415-023-11634-0. <b>Limites :</b> Les critères MOG de la Box 5 sont de 2018 ; le cours utilise le consensus 2023 lu séparément. Les fréquences de cohortes ne sont pas des performances universelles de test.</p><p>Lecture ciblée attribuée à Sol ; les deux lectures antérieures réutilisées sont indiquées dans le journal. Une heure de journalisation ne certifie pas une lecture intégrale.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener noreferrer">Consulter la source — Jarius et coll., Journal of Neurology</a></p></template>
<template data-pop="g36-r4" data-k="g36-r4"><h3>[4] NEMOS : traitement de poussée et prévention</h3><p>La poussée est traitée précocement ; méthylprednisolone et aphérèse sont adaptées à la gravité. La prévention AQP4 positive est distincte du groupe double négatif et de MOGAD. Le ravulizumab a été étudié en ouvert avec comparateur externe ; le texte général ne doit pas transformer tous les essais en randomisations contemporaines. La surveillance comprend activité, handicap et risques.</p><p><b>Passages lus :</b> Sections 3, 5, 6, 17, 23, 24, 26, 31, 32, 35, 36 et 37 ; deux premiers paragraphes des sections 14 et 20. <b>Version :</b> 2024 ; DOI 10.1007/s00415-023-11910-z. <b>Limites :</b> Recommandation de maladie, pas FI suisse. La correction 2024 et les notices de produits sont consultées. Les décisions de grossesse et de vaccination sont individualisées sans effacer les restrictions de notice.</p><p>Lecture ciblée attribuée à Sol ; les deux lectures antérieures réutilisées sont indiquées dans le journal. Une heure de journalisation ne certifie pas une lecture intégrale.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770020/" target="_blank" rel="noopener noreferrer">Consulter la source — Kümpfel et coll., Journal of Neurology</a></p></template>
<template data-pop="g36-r5" data-k="g36-r5"><h3>[5] Correction NEMOS : ravulizumab</h3><p>La charge ravulizumab est unique au jour 1 ; la première maintenance suit deux semaines après, puis toutes les huit semaines. L’inclusion du tableau d’essai est corrigée en au moins une poussée dans les douze mois précédents.</p><p><b>Passages lus :</b> Paragraphes de correction des tableaux 1 et 2. <b>Version :</b> 2024 ; DOI 10.1007/s00415-024-12288-2. <b>Limites :</b> Anciennes erreurs conservées comme comparaison documentaire, sans les reproduire comme schéma correct.</p><p>Lecture ciblée attribuée à Sol ; les deux lectures antérieures réutilisées sont indiquées dans le journal. Une heure de journalisation ne certifie pas une lecture intégrale.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11136799/" target="_blank" rel="noopener noreferrer">Consulter la source — Kümpfel et coll., Journal of Neurology</a></p></template>
<template data-pop="g36-r6" data-k="g36-r6"><h3>[6] Enspryng : information professionnelle suisse</h3><p>Satralizumab 120 mg/1 ml SC ; semaines 0, 2 et 4 puis toutes les quatre semaines dès semaine 8. Indication adulte et adolescente AQP4 positive, seul ou avec immunosuppresseur. Dépistage VHB et tuberculose ; surveillance hépatique et sanguine. Grossesse et allaitement ont leurs restrictions propres.</p><p><b>Passages lus :</b> Composition, indication, doses, bilans avant traitement, ajustements, contre-indications, infections, vaccins, foie, neutrophiles, interactions et grossesse/allaitement ; date de notice. <b>Version :</b> Janvier 2023, version réellement servie. <b>Limites :</b> Données adolescentes limitées ; pas extrapolation à Hurst ou à toute MOGAD. Les règles de reprise après anomalie ou oubli dépendent du contexte et du tableau de notice.</p><p>Lecture ciblée attribuée à Sol ; les deux lectures antérieures réutilisées sont indiquées dans le journal. Une heure de journalisation ne certifie pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680676170011" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic/AIPS via l’outil AmiKo du dépôt</a></p></template>
<template data-pop="g36-r7" data-k="g36-r7"><h3>[7] Uplizna : information professionnelle suisse</h3><p>Inébilizumab 300 mg IV puis 300 mg deux semaines après, puis 300 mg tous les six mois ; monothérapie adulte AQP4 positive. Surveiller immunoglobulines, numération et infections ; la déplétion B persiste. Les restrictions de vaccins vivants et de grossesse sont propres au produit.</p><p><b>Passages lus :</b> Composition, indication, doses, prémédication, surveillance, fonctions d’organes, contre-indications, infections, VHB/VHC, tuberculose, vaccins, grossesse/allaitement ; pharmacocinétique rénale et hépatique ciblée ; date. <b>Version :</b> Octobre 2023, version réellement servie. <b>Limites :</b> Aucun ancrage supplémentaire d’entretien inventé. Formes sévères d’insuffisance d’organe peu ou non étudiées. L’allaitement conserve les nuances de la notice ; ne pas réduire à une règle commune à tous les anticorps.</p><p>Lecture ciblée attribuée à Sol ; les deux lectures antérieures réutilisées sont indiquées dans le journal. Une heure de journalisation ne certifie pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680693220010" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic/AIPS via l’outil AmiKo du dépôt</a></p></template>
<template data-pop="g36-r8" data-k="g36-r8"><h3>[8] Ultomiris : information professionnelle suisse</h3><p>Ravulizumab chez l’adulte AQP4 positif : charge pondérale unique, maintenance deux semaines après puis toutes les huit semaines. Formulations 10 et 100 mg/ml non interchangeables en volume. La vaccination ne supprime pas le risque méningococcique ; prophylaxie et urgence répondent aux conditions de notice. Contraception et interruption d’allaitement jusqu’à huit mois après.</p><p><b>Passages lus :</b> Composition, indication NMOSD, doses adultes, fonctions rénale/hépatique, contre-indications, infection méningococcique, interruption NMOSD, interactions, grossesse/allaitement ; présentation de l’étude ALXN1210-NMO-307 ; date. <b>Version :</b> Février 2026, version réellement servie. <b>Limites :</b> Ne pas appliquer les tableaux pédiatriques HPN/SHUa à NMOSD. Étude NMOSD ouverte, 58 adultes ; absence d’événements dans un essai ne garantit pas une protection individuelle absolue.</p><p>Lecture ciblée attribuée à Sol ; les deux lectures antérieures réutilisées sont indiquées dans le journal. Une heure de journalisation ne certifie pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680672780016" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic/AIPS via l’outil AmiKo du dépôt</a></p></template>
<template data-pop="g36-r9" data-k="g36-r9"><h3>[9] Soliris : information professionnelle suisse</h3><p>Eculizumab pour NMOSD récurrente adulte AQP4 positive : 900 mg IV hebdomadaires quatre semaines, 1200 mg semaine 5 puis tous les quatorze jours. Vaccination et prophylaxie conditionnelle réduisent sans abolir le risque méningococcique. Pas ajustement rénal, hépatique non étudiée.</p><p><b>Passages lus :</b> Composition, indication et doses NMOSD, fonctions rénale/hépatique, contre-indications, méningocoque et autres infections, grossesse/allaitement ; date. <b>Version :</b> Avril 2026, version réellement servie. <b>Limites :</b> Ne pas transférer doses HPN, âges de myasthénie ou règle d’arrêt de cette autre indication. Grossesse et allaitement gardent leur balance individuelle, différente de la notice ravulizumab.</p><p>Lecture ciblée attribuée à Sol ; les deux lectures antérieures réutilisées sont indiquées dans le journal. Une heure de journalisation ne certifie pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680592820014" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic/AIPS via l’outil AmiKo du dépôt</a></p></template>
<template data-pop="g36-r10" data-k="g36-r10"><h3>[10] Solu-Medrol : information professionnelle suisse</h3><p>Les flacons 500 mg et 1 g indiquent la masse de méthylprednisolone base sous forme de succinate sodique. Au-delà de 250 mg, perfuser au moins trente minutes. La FI cite la poussée SEP avec 500–1000 mg durant trois à cinq jours ; la stratégie NMOSD est attribuée au guide NEMOS. Risques infectieux, métaboliques et liés aux excipients à surveiller.</p><p><b>Passages lus :</b> Composition, indications, doses et voie, fonctions d’organes, contre-indications, début des précautions, infections, grossesse/allaitement, mécanisme et début de pharmacocinétique ; date. <b>Version :</b> Août 2025, version réellement servie. <b>Limites :</b> La notice ne nomme pas une indication NMOSD. Ni schéma de traumatisme médullaire ni dose de 2 g d’un cas Hurst généralisés. Grossesse après balance ; pas allaitement selon cette notice.</p><p>Lecture ciblée attribuée à Sol ; les deux lectures antérieures réutilisées sont indiquées dans le journal. Une heure de journalisation ne certifie pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680351120812" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic/AIPS via l’outil AmiKo du dépôt</a></p></template>
<template data-pop="g36-r11" data-k="g36-r11"><h3>[11] MOGAD : revue suisse HUG/CHUV</h3><p>La MOGAD est distincte de SEP et de NMOSD AQP4 positive. Le CBA vivant est privilégié quand disponible ; l’adaptation des critères diagnostiques et les soutiens cliniques sont exposés. La prévention prolongée est discutée selon l’évolution et les données disponibles.</p><p><b>Passages lus :</b> Introduction et clinique initiale ; page 829 laboratoire/CBA ; tableaux 1 et 2 pages 829–830 ; traitement ciblé pages 830–831. <b>Version :</b> 24 avril 2024 ; identifiant éditorial RMS 2024 vérifié dans la source. <b>Limites :</b> Lecture par sections, pas lecture intégrale revendiquée. Le tableau simplifie les seuils ; les distinctions de méthode sont vérifiées dans le primaire 2023. Doses ambiguës ou sans FI suisse correspondante non recopiées.</p><p>Lecture ciblée attribuée à Sol ; les deux lectures antérieures réutilisées sont indiquées dans le journal. Une heure de journalisation ne certifie pas une lecture intégrale.</p><p><a data-reference-source href="https://iris.unil.ch/bitstreams/88317535-9cf5-4d19-997d-ed1f2f63348d/download" target="_blank" rel="noopener noreferrer">Consulter la source — Lerusse et coll., Revue médicale suisse</a></p></template>
<template data-pop="g36-r12" data-k="g36-r12"><h3>[12] MOGAD : critères proposés par le panel international</h3><p>A : événement clinique cardinal ; B : MOG-IgG par CBA dans les conditions définies ; C : meilleur diagnostic exclu. En CBA fixé, clair ≥ 1:100, faible ≥ 1:10 et < 1:100. Les CBA vivants ont leurs seuils propres. Un faible positif, résultat sans titre ou LCR seul impose AQP4 négatif et au moins un soutien.</p><p><b>Passages lus :</b> Page 7 : tests et panel 1 ; figure 3 page 10 avec toutes ses notes. <b>Version :</b> 2023 ; identifiant éditorial Lancet Neurology 2023 vérifié dans la source. <b>Limites :</b> Consensus diagnostique international, pas fondement américain d’une conduite thérapeutique. Ne pas dépister indiscriminément ni généraliser 1:100 aux tests vivants. Sérum recommandé ; LCR dans des situations sélectionnées.</p><p>Lecture ciblée attribuée à Sol ; les deux lectures antérieures réutilisées sont indiquées dans le journal. Une heure de journalisation ne certifie pas une lecture intégrale.</p><p><a data-reference-source href="https://www.sumairafoundation.org/wp-content/uploads/2023/02/International-MOGAD-Panel-Proposed-Criteria.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — Banwell et coll., Lancet Neurology ; reprint public Fondation Sumaira</a></p></template>
<template data-pop="g36-r13" data-k="g36-r13"><h3>[13] Hurst : cas et revue systématique de Bâle</h3><p>Le cas de 59 ans montre déficit, coma, IRM progressive, microhémorragies et histologie compatible. La revue de 43 cas adultes publiés rapporte 46, 5 % de décès, sans démonstration d’efficacité comparative. Le diagnostic et les soins sont spécialisés et urgents. Les auteurs rapportent un consentement écrit familial pour publication des données et images.</p><p><b>Passages lus :</b> Résumé, affiliations et licence ; sections 3–7 entières avec tableaux 1 et 2 ; légende entière figure 2 ; original inspecté. <b>Version :</b> 2020 ; DOI 10.3389/fneur.2020.00899. <b>Limites :</b> Cas sélectionnés, pas incidence suisse ni pronostic individuel. La figure 2 est sous licence CC BY 4.0 ; les images et cadres restent inchangés, annotations françaises adjacentes ajoutées.</p><p>Lecture ciblée attribuée à Sol ; les deux lectures antérieures réutilisées sont indiquées dans le journal. Une heure de journalisation ne certifie pas une lecture intégrale.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7468463/" target="_blank" rel="noopener noreferrer">Consulter la source — Grzonka et coll., Hôpital universitaire de Bâle, Frontiers in Neurology</a></p></template>
<template data-pop="g36-r14" data-k="g36-r14"><h3>[14] Gray764 : voies motrices normales</h3><p>Illustration historique humaine des voies motrices et décussation, non carte des voies visuelles ou de toutes sensibilités.</p><p><b>Passages lus :</b> Notice licence et original effectivement lus et inspectés antérieurement par Sol, réutilisés explicitement. <b>Version :</b> 1918 et notice consultée en 2026. <b>Limites :</b> Domaine public ; annotations françaises adjacentes ajoutées, pixels inchangés.</p><p>Lecture ciblée attribuée à Sol ; les deux lectures antérieures réutilisées sont indiquées dans le journal. Une heure de journalisation ne certifie pas une lecture intégrale.</p><p><a data-reference-source href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener noreferrer">Consulter la source — Gray, 1918, Carter ; Wikimedia Commons</a></p></template>
<template data-pop="g36-r15" data-k="g36-r15"><h3>[15] PROFILES : cadre des situations et raisonnement clinique</h3><p>Le cours relie symptômes visuels, parésie, sensibilité, conscience et décision urgente à des exercices pédagogiques locaux.</p><p><b>Passages lus :</b> Pages 96–105 effectivement lues antérieurement par Sol ; réutilisation du cadre de situations SSP. <b>Version :</b> 2017. <b>Limites :</b> Pas liste officielle des codes G36 ni numéros d’objectifs inventés ; correspondance locale.</p><p>Lecture ciblée attribuée à Sol ; les deux lectures antérieures réutilisées sont indiquées dans le journal. Une heure de journalisation ne certifie pas une lecture intégrale.</p><p><a data-reference-source href="https://www.profilesmed.ch/" target="_blank" rel="noopener noreferrer">Consulter la source — Commission interfacultaire médicale suisse</a></p></template>
