<template data-pop="g23-ams-criteres" data-title="Critères MDS 2022 de l’AMS">
<div class="lab">Catégories</div><p>Neuropathologiquement établie ; cliniquement établie (spécificité maximale) ; cliniquement probable (sensibilité accrue) ; prodromale possible (recherche). Caractéristique essentielle : maladie sporadique, progressive, de début adulte après 30 ans (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>).</p>
<div class="lab">Critères autonomes (au moins un)</div><p>Établie : difficultés mictionnelles inexpliquées avec un résidu post-mictionnel supérieur à 100 mL, ou incontinence urinaire par impériosité inexpliquée, ou hypotension orthostatique neurogène avec chute systolique d’au moins 20 mmHg dans les 3 minutes. Probable : résidu de tout volume, incontinence par impériosité, ou hypotension neurogène dans les 10 minutes. L’impériosité sans fuite ne suffit pas. Pour le résidu, une obstruction par hypertrophie prostatique est exclue ; pour l’incontinence, une chirurgie pelvienne antérieure ou un prolapsus pelvien sont exclus (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>).</p>
<div class="lab">Critères moteurs</div><p>Parkinsonisme (bradykinésie avec rigidité ou tremblement) peu sensible à la lévodopa (moins de 30 % d’amélioration du MDS-UPDRS III jusqu’à 1000 mg par jour) pour la forme établie ; syndrome cérébelleux d’au moins 2 signes (établie) ou 1 signe (probable).</p>
<div class="lab">Signes de soutien (dans les 3 ans)</div><p>Moteurs : progression rapide, instabilité posturale modérée à sévère, dystonie cranio-cervicale induite ou aggravée par la lévodopa sans dyskinésie des membres, dysarthrie sévère, dysphagie sévère, Babinski inexpliqué, tremblement myoclonique, déformations posturales. Non moteurs : stridor, soupirs inspiratoires, mains et pieds froids et violacés, dysfonction érectile (avant 60 ans pour la forme probable), rires ou pleurs pathologiques.</p>
<div class="lab">Exclusions</div><p>Réponse dopaminergique substantielle et durable ; anosmie inexpliquée ; cognition fluctuante avec déclin visuoperceptif précoce ; hallucinations visuelles récurrentes non médicamenteuses dans les 3 ans ; démence dans les 3 ans ; paralysie supranucléaire du regard vers le bas ou saccades verticales ralenties ; IRM évocatrice d’un autre diagnostic ; affection mimant l’AMS.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a></p></template>
<template data-pop="g23-psp-criteres" data-title="Critères MDS 2017 de la PSP : combinaisons et exclusions">
<div class="lab">Notation</div><p>Les niveaux des domaines sont notés O-1 à O-3, P-1 à P-3, A-1 à A-3 et C-1 à C-3 ; la publication les écrit sans tiret ; le tiret est ajouté ici pour ne pas les confondre avec d’autres codes.</p>
<div class="lab">Inclusion</div><p>Sporadique, début à 40 ans ou plus, progression graduelle (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>).</p>
<div class="lab">Exclusions cliniques</div><p>Trouble mnésique épisodique prédominant ; dysautonomie prédominante, par exemple une hypotension orthostatique d’au moins 30 mmHg de systolique ou 15 mmHg de diastolique après 3 minutes debout ; hallucinations visuelles ou vigilance fluctuante prédominantes ; atteinte multisegmentaire du motoneurone central et périphérique ; évolution soudaine, par paliers ou rapide ; antécédent d’encéphalite ; ataxie appendiculaire marquée ; cause identifiable d’instabilité posturale. À l’imagerie : leucoencéphalopathie sévère ou lésion structurelle pertinente. Avant 45 ans, la maladie de Wilson, la maladie de Niemann-Pick de type C, l’hypoparathyroïdie, la neuroacanthocytose et la neurosyphilis sont à exclure (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>).</p>
<div class="lab">Niveaux de certitude</div><p>Probable : O-1 ou O-2 avec P-1 ou P-2 (PSP-RS) ; O-1 ou O-2 avec A-1 (PSP-PGF) ; O-1 ou O-2 avec A-2 ou A-3 (PSP-P) ; O-1 ou O-2 avec C-2 (PSP-F). Possible : O-1 seul (PSP-OM) ; O-2 avec P-3 (PSP-RS) ; A-1 seul (PSP-PGF) ; O-1 ou O-2 avec C-1 (PSP-SL) ; O-1 ou O-2 avec C-3 (PSP-CBS). Une catégorie « évocatrice » existe pour les stades précoces ; les indices d’imagerie IF1 et IF2 donnent la mention « soutenu par l’imagerie ».</p>
<div class="lab">Indices de soutien</div><p>CC1 résistance à la lévodopa (amélioration de 30 % ou moins du score moteur) ; CC2 dysarthrie hypokinétique spastique ; CC3 dysphagie ; CC4 photophobie ; IF1 atrophie ou hypométabolisme mésencéphalique ; IF2 dégénérescence dopaminergique striatale post-synaptique.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a></p></template>
<template data-pop="g23-scb-criteres" data-title="Critères du syndrome corticobasal et de la DCB">
<div class="lab">Syndrome corticobasal</div><p>Tous : sporadique, progressif, durée d’au moins 1 an, pas d’argument pour la maladie d’Alzheimer. Probable : au moins 50 ans, asymétrique, au moins 2 signes corticaux et 2 signes sous-corticaux. Possible : pas de limite d’âge, symétrique ou asymétrique, au moins 1 signe de chaque liste (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<div class="lab">Dégénérescence corticobasale (Armstrong 2013)</div><p>Quatre phénotypes : syndrome corticobasal, syndrome frontal comportemental-spatial, variante non fluente de l’aphasie primaire progressive, syndrome de PSP. DCB probable : début insidieux, progression d’au moins 1 an, au moins 50 ans, sans histoire familiale ni mutation connue de la protéine tau (<a href="https://doi.org/10.1212/WNL.0b013e31827f0fd1" target="_blank" rel="noopener">critères d’Armstrong, dégénérescence corticobasale, 2013 (résumé)</a>).</p>
<div class="lab">Limite</div><p>Critère de classification, non de conduite thérapeutique ; résumé seul lu.</p>
<p class="src">Références : <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a> ; <a href="https://doi.org/10.1212/WNL.0b013e31827f0fd1" target="_blank" rel="noopener">critères d’Armstrong, dégénérescence corticobasale, 2013 (résumé)</a></p></template>
<template data-pop="g23-essais" data-title="Molécules en essai pour la PSP et la DCB">
<div class="lab">Contenu</div><p>La revue de Munich liste comme pistes en essai le NIO752, le bépranémab, l’AADvac1, le FNP-223, le phénylbutyrate de glycérol et l’AZP2006 (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>). Aucune n’est approuvée ; ces noms servent à situer la recherche et non la pratique. Pour l’AMS, les revues de 2022 et 2024 ne retiennent aucun traitement modificateur approuvé (<a href="https://doi.org/10.1016/S1474-4422(24)00396-X" target="_blank" rel="noopener">Lancet Neurology 2024 (résumé)</a> ; <a href="https://doi.org/10.1038/s41572-022-00382-6" target="_blank" rel="noopener">Nature Reviews Disease Primers 2022 (résumé)</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a> ; <a href="https://doi.org/10.1016/S1474-4422(24)00396-X" target="_blank" rel="noopener">Lancet Neurology 2024 (résumé)</a> ; <a href="https://doi.org/10.1038/s41572-022-00382-6" target="_blank" rel="noopener">Nature Reviews Disease Primers 2022 (résumé)</a></p></template>
<template data-pop="g23-amantadine-sevrage" data-title="Sevrage brutal d’amantadine">
<div class="lab">Risque</div><p>L’arrêt brutal peut provoquer une aggravation extrapyramidale pouvant aller jusqu’à la crise akinétique, avec possible délire (<a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse PK-Merz®, février 2025</a>).</p>
<div class="lab">Conduite</div><p>L’information professionnelle suisse demande de ne pas arrêter brutalement ; les doses sont réduites en insuffisance rénale (<a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse PK-Merz®, février 2025</a>).</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse PK-Merz®, février 2025</a></p></template>
<template data-pop="g23-mnemo" data-title="Moyen mnémotechnique des domaines de la PSP">
<div class="lab">Aide pédagogique, non critère officiel</div><p>Les quatre domaines des critères MDS 2017 se retiennent par leurs initiales : <b>O</b>culomoteur, <b>P</b>osture (instabilité posturale), <b>A</b>kinésie, <b>C</b>ognition. Une PSP probable associe un domaine O à un domaine P, A ou C selon le phénotype (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>). Cette association est un support de mémoire ; seuls les critères officiels font foi.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a></p></template>
<template data-pop="g23-irm" data-title="IRM : marqueurs par entité">
<div class="lab">Définition</div><p>L’imagerie par résonance magnétique recherche des marqueurs d’atrophie, de signal et de diffusion, et écarte des lésions structurelles (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>).</p>
<div class="lab">Interprétation</div><p>AMS : atrophie putaminale, du pédoncule cérébelleux moyen, du pont ou du cervelet, signe de la croix, diffusivité accrue. PSP : atrophie mésencéphalique. DCB : atrophie fronto-pariétale asymétrique. NBIA : fer et œil de tigre. Calcifications : bilatérales (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a> ; <a href="https://doi.org/10.3390/ijms241310886" target="_blank" rel="noopener">revue génétique de la calcification cérébrale primaire familiale, 2023 (résumé)</a>).</p>
<div class="lab">Erreur fréquente</div><p>Considérer l’œil de tigre comme obligatoire : il est absent chez certains patients (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a> ; <a href="https://doi.org/10.3390/ijms241310886" target="_blank" rel="noopener">revue génétique de la calcification cérébrale primaire familiale, 2023 (résumé)</a></p></template>
<template data-pop="g23-imagerie-fonctionnelle" data-title="Imagerie fonctionnelle">
<div class="lab">Contenu</div><p>La TEP au fluorodésoxyglucose montre un hypométabolisme du putamen, du tronc cérébral et du cervelet dans l’AMS parkinsonienne (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>). L’imagerie dopaminergique post-synaptique (IBZM, DMFP) explore la voie qui explique la mauvaise réponse à la lévodopa. Elle est rarement indiquée dans les tauopathies 4R (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a></p></template>
<template data-pop="g23-biomarqueurs" data-title="Biomarqueurs : liquide cérébrospinal, amplification, amyloïde">
<div class="lab">Contenu</div><p>Neurofilaments légers du liquide cérébrospinal supérieurs à 1400 pg/mL : distinguent l’AMS des maladies à corps de Lewy. Tests d’amplification de l’α-synucléine (RT-QuIC, PMCA) : cinétique particulière dans l’AMS (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>). Liquide cérébrospinal ou TEP amyloïde : écartent la maladie d’Alzheimer avant de retenir un syndrome corticobasal. TEP tau 4R et tests d’amplification de la tau : recherche (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a></p></template>
<template data-pop="g23-genetique-examens" data-title="Examens génétiques">
<div class="lab">Contenu</div><p>NBIA : gène ciblé, panel ou exome (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a>). Patients ataxiques : gènes d’ataxie spinocérébelleuse et <i>FMR1</i> chez certains (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>). Calcification familiale : sept gènes, environ 50 % sans variant identifié (<a href="https://doi.org/10.3390/ijms241310886" target="_blank" rel="noopener">revue génétique de la calcification cérébrale primaire familiale, 2023 (résumé)</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a> ; <a href="https://doi.org/10.3390/ijms241310886" target="_blank" rel="noopener">revue génétique de la calcification cérébrale primaire familiale, 2023 (résumé)</a></p></template>
<template data-pop="g23-mrpi" data-title="Index morphométrique et cartographie de susceptibilité">
<div class="lab">Contenu</div><p>L’index morphométrique du pédoncule et du mésencéphale a une excellente précision pour distinguer la maladie de Parkinson de la PSP, mais ne sépare pas la maladie de Parkinson de l’AMS parkinsonienne. La cartographie de susceptibilité quantitative du noyau rouge et de la substance noire est en développement (<a href="https://doi.org/10.1111/ene.15447" target="_blank" rel="noopener">imagerie morphométrique et cartographie de susceptibilité, 2022 (résumé)</a>).</p>
<div class="lab">Limite</div><p>Résumé seul lu ; seuils non relevés.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/ene.15447" target="_blank" rel="noopener">imagerie morphométrique et cartographie de susceptibilité, 2022 (résumé)</a></p></template>
<template data-pop="g23-levodopa-essai" data-title="Essai de lévodopa : protocole et lecture">
<div class="lab">Protocole</div><p>Essai chronique jusqu’à 1000 mg par jour pendant au moins un mois ; le test aigu est à éviter en pratique dans l’AMS (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<div class="lab">Lecture</div><p>Moins de 30 % d’amélioration du MDS-UPDRS III : parkinsonisme peu dopa-sensible (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>). Pour la PSP, une résistance à la lévodopa (30 % ou moins) est un indice de soutien (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>).</p>
<div class="lab">Limite</div><p>Les sources lues ne décrivent pas la conduite après un essai négatif.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a></p></template>
<template data-pop="g23-madopar" data-title="Madopar® (lévodopa/bensérazide)">
<div class="lab">Indication suisse</div><p>Traitement du syndrome parkinsonien sous toutes ses formes, à l’exception du syndrome parkinsonien d’origine médicamenteuse, et syndrome des jambes sans repos. Le parkinsonisme de l’AMS, de la PSP ou de la DCB entre donc dans ce libellé (<a href="https://amiko.oddb.org/fr/fi?gtin=7680380960953" target="_blank" rel="noopener">information professionnelle suisse Madopar®, juin 2023</a>).</p>
<div class="lab">Posologie</div><p>Prise 30 minutes avant ou 1 heure après le repas, car la lévodopa entre en compétition avec les protéines. Titration lente. Une unité Madopar® « 125 » contient 100 mg de lévodopa et 25 mg de bensérazide ; l’entretien habituel est d’une unité trois à six fois par jour, soit 300 à 600 mg de lévodopa. L’essai diagnostique de 1000 mg de lévodopa par jour correspond donc à dix unités « 125 ». Madopar LIQ convient en cas de dysphagie.</p>
<div class="lab">Contre-indication</div><p>Moins de 25 ans.</p>
<div class="lab">Limite</div><p>La liste complète des contre-indications n’a pas été relevée. Information professionnelle mise à jour en juin 2023.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse Madopar®, juin 2023</a></p></template>
<template data-pop="g23-pkmerz" data-title="PK-Merz® (sulfate d’amantadine)">
<div class="lab">Posologie</div><p>Comprimé de 100 mg : 1 comprimé par jour pendant 3 jours, puis 2 comprimés par jour, avec 1 comprimé de plus par semaine, jusqu’à 6 comprimés par jour au maximum (<a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse PK-Merz®, février 2025</a>). La revue de Munich cite jusqu’à 600 mg par jour pour la marche et la dysarthrie dans la PSP et la DCB (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<div class="lab">Surveillance</div><p>Électrocardiogramme avant, à 1 et 3 semaines (QTc de Bazett) ; annuel ensuite.</p>
<div class="lab">Indication suisse</div><p>Les comprimés sont autorisés pour le traitement de la maladie de Parkinson quelle que soit son origine. La PSP et la DCB, maladies distinctes de la maladie de Parkinson, n’y figurent pas : leur traitement par PK-Merz® est un usage hors indication, à documenter comme tel (<a href="https://amiko.oddb.org/fr/fi?gtin=7680441350273" target="_blank" rel="noopener">information professionnelle suisse PK-Merz®, février 2025</a>).</p>
<div class="lab">Contre-indications</div><p>L’amantadine est contre-indiquée en cas d’insuffisance cardiaque sévère non compensée de stade NYHA IV, de cardiomyopathie ou de myocardite, de bloc auriculo-ventriculaire de degré II ou III, de bradycardie connue inférieure à 55 par minute, de QTc de Bazett supérieur à 420 ms, d’ondes U manifestes ou de syndrome du QT long congénital familial, d’antécédent d’arythmie ventriculaire grave, de traitement par un médicament allongeant le QT, d’état d’excitation ou de confusion, d’antécédent de délire ou de psychose exogène, de glaucome à angle fermé et de grossesse. Le traitement est exclu si le QTc s’allonge de plus de 60 ms ou dépasse 480 ms sous traitement. La prudence s’impose en cas d’hypertrophie prostatique et d’insuffisance rénale (<a href="https://amiko.oddb.org/fr/fi?gtin=7680441350273" target="_blank" rel="noopener">information professionnelle suisse PK-Merz®, février 2025</a>). La dose se réduit en insuffisance rénale, et le traitement ne s’arrête jamais brutalement. Information professionnelle mise à jour en février 2025.</p>
<p class="src">Références : <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse PK-Merz®, février 2025</a></p></template>
<template data-pop="g23-gutron" data-title="Gutron® (midodrine)">
<div class="lab">Indication suisse</div><p>Formes sévères d’hypotension orthostatique asympathicotonique, dont l’hypotension orthostatique idiopathique avec manifestation neurologique (« syndrome de Shy-Drager »), chez l’adulte et à partir de 12 ans ; l’indication couvre aussi les formes fonctionnelles et les hypotensions orthostatiques dues aux neuroleptiques et aux antidépresseurs. Un générique suisse existe, Midodrin Substipharm (<a href="https://amiko.oddb.org/fr/fi?gtin=7680693840058" target="_blank" rel="noopener">information professionnelle suisse Midodrin Substipharm, mai 2024</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse Gutron®, mars 2021</a>).</p>
<div class="lab">Posologie</div><p>Forme sévère : 3 fois 2,5 mg par jour, titration hebdomadaire, au plus 30 mg par jour en 3 prises, 30 à 45 minutes avant le lever, dernière dose au moins 4 heures avant le coucher. Pression couchée et assise au moins 2 fois par semaine au début.</p>
<div class="lab">Contre-indications</div><p>La midodrine est contre-indiquée en cas de rétention urinaire, y compris mécanique, de troubles mictionnels, notamment en cas d’hypertrophie prostatique avec résidu, de cardiopathie organique sévère, d’hypertension, d’arythmie, de réaction hypertonique au test de la station debout, de maladie vasculaire oblitérante, spastique ou scléreuse sévère, de maladie rénale aiguë ou d’insuffisance rénale sévère, de rétinopathie diabétique proliférante, de phéochromocytome, d’hyperthyroïdie, de glaucome à angle fermé, de grossesse et d’allaitement.</p>
<div class="lab">Hypertension de décubitus</div><p>Aux fortes doses, une hausse de la pression couchée est souvent observée, surtout en association avec la fludrocortisone ; la dose s’ajuste pour l’éviter. Le médecin contrôle la pression couchée et assise au moins deux fois par semaine au début et arrête la midodrine si la pression couchée monte excessivement (<a href="https://amiko.oddb.org/fr/fi?gtin=7680449770288" target="_blank" rel="noopener">information professionnelle suisse Gutron®, mars 2021</a>).</p>
<div class="lab">Application</div><p>La rétention est très spécifique de l’AMS : le résidu post-mictionnel se mesure avant de prescrire (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>). Information professionnelle mise à jour en mars 2021.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse Gutron®, mars 2021</a></p></template>
<template data-pop="g23-xeomin" data-title="Xeomin® (incobotulinumtoxine A)">
<div class="lab">Indications suisses</div><p>Chez l’adulte : blépharospasme, dystonie cervicale à prédominance rotationnelle, spasticité focale des membres et sialorrhée chronique ; chez l’enfant de 2 à 17 ans : sialorrhée chronique d’origine neurologique (<a href="https://amiko.oddb.org/fr/fi?gtin=7680620800018" target="_blank" rel="noopener">information professionnelle suisse Xeomin®, mars 2026</a>).</p>
<div class="lab">Usage dans ce cours</div><p>La toxine botulique A, renouvelée tous les trois mois, est proposée pour la dystonie, l’apraxie d’ouverture des paupières et la sialorrhée de la PSP et de la DCB (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>). L’apraxie d’ouverture des paupières ne figure pas parmi les indications suisses lues.</p>
<div class="lab">Mise en garde</div><p>Une dysphagie peut persister deux à trois semaines après l’injection. Des effets à distance, parfois mortels, associés à une dysphagie ou à une pneumonie, ont été rapportés ; les patients qui ont des antécédents de dysphagie ou d’aspiration se traitent avec prudence (<a href="https://amiko.oddb.org/fr/fi?gtin=7680620800018" target="_blank" rel="noopener">information professionnelle suisse Xeomin®, mars 2026</a>). La revue de Munich signale aussi une aggravation transitoire possible de la dysphagie et réserve l’injection intraglandulaire à des médecins expérimentés (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<div class="lab">Limite</div><p>La posologie propre à chaque indication n’est pas reprise ici.</p>
<p class="src">Références : <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse Xeomin® (indications)</a></p></template>
<template data-pop="g23-florinef" data-title="Florinef® (fludrocortisone)">
<div class="lab">Indication suisse</div><p>Traitement substitutif de l’insuffisance corticosurrénale prononcée, notamment de la maladie d’Addison, et syndrome de perte de sel du syndrome adrénogénital (<a href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">information professionnelle suisse Florinef®, mars 2026</a>). L’usage dans l’hypotension orthostatique neurogène (0,1 à 0,3 mg par jour) est hors indication (<a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">lignes directrices ESC sur la syncope, 2018</a>).</p>
<div class="lab">Limite</div><p>Seules les sections Indications et Mise à jour de l’information professionnelle ont été relues ; aucune posologie suisse ne couvre l’hypotension orthostatique.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">lignes directrices ESC sur la syncope, 2018</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse Florinef® (indication)</a></p></template>
<template data-pop="g23-ferriprox" data-title="Ferriprox® (défériprone)">
<div class="lab">Indication suisse</div><p>Surcharge en fer de la thalassémie majeure. L’usage dans la PKAN est hors indication (<a href="https://amiko.oddb.org/fr/fi?gtin=7680556790025" target="_blank" rel="noopener">information professionnelle suisse Ferriprox®, mars 2022</a>).</p>
<div class="lab">Preuve</div><p>Essai TIRCON : 88 patients, 30 mg/kg par jour pendant 18 mois (<button class="w" data-k="g23-tircon">essai TIRCON</button>).</p>
<div class="lab">Sécurité</div><p>La défériprone provoque des neutropénies et des agranulocytoses, parfois mortelles. L’information professionnelle impose une numération des neutrophiles chaque semaine pendant la première année et l’arrêt immédiat en cas de fièvre ou d’infection. Elle contre-indique le médicament après une agranulocytose, en cas de neutropénies récidivantes et avec un autre médicament neutropéniant (<a href="https://amiko.oddb.org/fr/fi?gtin=7680556790025" target="_blank" rel="noopener">information professionnelle suisse Ferriprox®, mars 2022</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(19)30142-5" target="_blank" rel="noopener">essai TIRCON, défériprone, 2019 (résumé)</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse Ferriprox® (indication)</a></p></template>
<template data-pop="g23-tircon" data-title="Essai TIRCON : défériprone dans la PKAN">
<div class="lab">Plan</div><p>Essai randomisé en double aveugle, contrôlé, suivi d’une extension ouverte, chez 88 patients de 4 ans ou plus atteints de PKAN, traités par défériprone à 30 mg/kg par jour pendant 18 mois (<a href="https://doi.org/10.1016/S1474-4422(19)30142-5" target="_blank" rel="noopener">essai TIRCON, défériprone, 2019 (résumé)</a>).</p>
<div class="lab">Résultats</div><p>Le fer pallidal a diminué. Le ralentissement de l’évolution sur l’échelle de dystonie n’était pas significatif (différence de −1,51 ; p = 0,076). Une anémie est survenue chez 21 % des patients ; deux décès par aspiration sont rapportés.</p>
<div class="lab">Limite</div><p>Résumé seul lu ; le critère principal n’est pas atteint. Le bénéfice de la chélation reste incertain (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a>).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a> ; <a href="https://doi.org/10.1016/S1474-4422(19)30142-5" target="_blank" rel="noopener">essai TIRCON, défériprone, 2019 (résumé)</a></p></template>
<template data-pop="pareto-g23-definitions" data-title="Pareto — Définitions et classification">
<p class="ratio" data-cover="g23-0,g23-1"></p><ul><li>Cinq entités : AMS (G23.2, G23.3), PSP (G23.1), NBIA (G23.0), calcification (G23.8) ; DCB non codée avec certitude.</li><li>AMS : synucléinopathie oligodendrogliale ; PSP et DCB : tauopathies 4R.</li><li>Le diagnostic définitif est neuropathologique ; le code CIM ne remplace pas les critères.</li></ul></template>
<template data-pop="pareto-g23-mecanismes" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="g23-3"></p><ul><li>La lévodopa échoue car les neurones post-synaptiques dégénèrent.</li><li>L’atteinte autonome de l’AMS est préganglionnaire : MIBG et noradrénaline normales.</li><li>La topographie de la tau 4R explique les signes : tronc cérébral pour la PSP, cortex pour la DCB.</li></ul></template>
<template data-pop="pareto-g23-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g23-5,g23-6"></p><ul><li>AMS : dysautonomie précoce, rétention urinaire, réponse médiocre à la lévodopa.</li><li>PSP : chutes en arrière précoces, regard vertical.</li><li>Pression couchée-debout jusqu’à 10 minutes ; test de traction ; recherche des signes cérébelleux et corticaux.</li></ul></template>
<template data-pop="pareto-g23-diagnostic" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="g23-7"></p><ul><li>Trois jeux de critères MDS : AMS (2022), PSP (2017), syndrome corticobasal.</li><li>AMS établie : critère autonome, syndrome moteur, 2 soutiens, imagerie ; probable : 2 critères cardinaux et 1 soutien.</li><li>Différentiel dangereux : Wilson et Niemann-Pick avant 45 ans, encéphalite paranéoplasique, maladie à prions.</li></ul></template>
<template data-pop="pareto-g23-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="g23-8"></p><ul><li>La dysphagie est la première cause de mortalité de la PSP et de la DCB.</li><li>L’amantadine ne s’arrête jamais brutalement.</li><li>Il faut dépister le stridor et la rétention ; la prise en charge détaillée n’a pas été lue.</li></ul></template>
<template data-pop="pareto-g23-prise-en-charge" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g23-9"></p><ul><li>Aucun traitement modificateur n’est approuvé.</li><li>Essai chronique de lévodopa jusqu’à 1000 mg par jour pendant un mois ; rééducation et soins palliatifs.</li><li>Midodrine contre-indiquée en cas de rétention urinaire ; défériprone hors indication dans la PKAN.</li></ul></template>
<template data-pop="pareto-g23-examens" data-title="Pareto — Examens">
<p class="ratio" data-cover="g23-e-1,g23-e-2,g23-e-3,g23-e-4,g23-e-5"></p><ul><li>Référence diagnostique : examen neuropathologique post mortem.</li><li>Pression couchée-debout, résidu post-mictionnel, IRM en première ligne.</li><li>MIBG normale et noradrénaline normale orientent vers l’AMS.</li></ul></template>
<template data-pop="pareto-g23-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g23-s-anat-cours"></p><ul><li>Striato-nigrique : parkinsonisme ; olive, pont, cervelet : ataxie ; mésencéphale : regard vertical ; cortex asymétrique : apraxie.</li></ul></template>
<template data-pop="pareto-g23-histo" data-title="Pareto — Neuropathologie">
<p class="ratio" data-cover="g23-s-histo-cours"></p><ul><li>AMS : oligodendrocytes ; Parkinson : neurones ; PSP : tau 4R avec astrocytes touffus et coiled bodies ; DCB : plaques astrocytaires.</li><li>Aucun traitement ne cible encore la tau 4R ni l’α-synucléine oligodendrogliale.</li></ul></template>
<template data-pop="pareto-g23-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g23-s-physio-cours"></p><ul><li>Lésion préganglionnaire dans l’AMS, post-ganglionnaire dans la maladie de Parkinson ; lévodopa inefficace si les neurones post-synaptiques sont perdus.</li><li>Rapport hausse du pouls / baisse de la pression systolique inférieur à 0,5 : hypotension neurogène ; mesure prolongée à 10 minutes.</li></ul></template>
<template data-pop="pareto-g23-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g23-s-bioch-cours"></p><ul><li>α-synucléine dans l’AMS, tau 4R dans la PSP et la DCB, coenzyme A dans la PKAN, phosphate dans la calcification ; lévodopa en compétition avec les protéines.</li></ul></template>
<template data-pop="pareto-g23-gene" data-title="Pareto — Génétique">
<p class="ratio" data-cover="g23-s-gene-cours"></p><ul><li>PANK2 pour la PKAN ; sept gènes pour la calcification ; AMS, PSP et DCB sporadiques.</li><li>Homozygotie pour l’haplotype H1 de MAPT : principal facteur de risque génétique de la PSP et de la DCB.</li></ul></template>
<template data-pop="pareto-g23-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g23-p-1,g23-p-2,g23-p-3,g23-p-4"></p><ul><li>Madopar® en essai chronique, PK-Merz® avec électrocardiogramme, Gutron® si pas de rétention, Xeomin® pour dystonie et sialorrhée.</li><li>Florinef® et Ferriprox® hors indication suisse ; PK-Merz® hors indication dans la PSP et la DCB.</li><li>Ferriprox® : neutrophiles chaque semaine la première année ; Xeomin® : dysphagie possible.</li></ul></template>
<template data-pop="g23-sm-chutes" data-title="Chutes et instabilité posturale">
<div class="lab">Définition</div><p>Les critères définissent l’instabilité posturale par une perte spontanée de l’équilibre en station debout, par des chutes répétées non provoquées ou par une tendance à la chute au test de traction. Un retour seul à l’équilibre en deux pas au plus n’entre dans aucun niveau P (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la PSP, 2017</a>).</p>
<div class="lab">Mécanisme</div><p>Dans la paralysie supranucléaire progressive, les réflexes posturaux sont altérés ; le patient chute surtout vers l’arrière et s’effondre en s’asseyant (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich, 2026</a> ; <a href="https://www.parkinson.ch/fileadmin/parkinson/docs/diverse_fr/paralysie_supranucleaire_progressive_f_psp_130_27_parkinson.pdf" target="_blank" rel="noopener">Parkinson Suisse, fiche PSP (professeur Ghika)</a>).</p>
<div class="lab">Valeur</div><p>Des chutes répétées non provoquées dans les 3 ans définissent le niveau P-1 (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la PSP, 2017</a>). Contre la maladie de Parkinson, l’instabilité posturale dans les 3 ans oriente vers l’atrophie multisystématisée avec une sensibilité de 27 à 45 % et une spécificité de 88,7 % (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>). La latence médiane avant les chutes est de 24 mois dans l’atrophie multisystématisée, contre 118 mois dans la maladie de Parkinson (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>).</p>
<div class="lab">Piège</div><p>Dans l’atrophie multisystématisée, 28 % des patients tombent dès la première année : une chute précoce ne suffit pas pour conclure à une paralysie supranucléaire progressive (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a> ; <a href="https://www.parkinson.ch/fileadmin/parkinson/docs/diverse_fr/paralysie_supranucleaire_progressive_f_psp_130_27_parkinson.pdf" target="_blank" rel="noopener">Parkinson Suisse, fiche PSP (professeur Ghika)</a></p></template>

<template data-pop="g23-sm-ho" data-title="Hypotension orthostatique neurogène : mesure et calcul">
<div class="lab">Normal</div><p>Debout, le baroréflexe accélère le cœur et resserre les vaisseaux ; la pression systolique ne chute pas durablement de 20 mmHg (<a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">ESC syncope, 2018</a>).</p>
<div class="lab">Technique</div><p>Le médecin mesure pression et pouls couché, puis debout à 3 minutes et jusqu’à 10 minutes, ou au test d’inclinaison (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>). La chute systolique d’au moins 20 mmHg suffit ; une chute diastolique isolée ne s’utilise pas seule (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>).</p>
<div class="lab">Calcul</div><p>Le rapport est la hausse du pouls (battements par minute) divisée par la baisse de la pression systolique (mmHg). Un rapport inférieur à 0,5 signe une hypotension neurogène (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>). Ce rapport sépare l’hypotension neurogène des causes non neurogènes avec une sensibilité de 91,3 % et une spécificité de 88,4 % au test d’inclinaison (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</p>
<div class="lab">Piège</div><p>Les bêtabloquants faussent le rapport (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>). La référence pour affirmer le caractère neurogène reste la durée de récupération de la pression après la manœuvre de Valsalva (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>). Un patient sur deux présente aussi une hypotension post-prandiale ou une hypertension de décubitus (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">lignes directrices ESC sur la syncope, 2018</a></p></template>

<template data-pop="g23-sm-vessie" data-title="Troubles vésicaux : remplissage et vidange">
<div class="lab">Normal</div><p>Pendant le remplissage, le sphincter urétral est actif et le détrusor inhibé ; pendant la vidange, le détrusor se contracte et le sphincter se relâche (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</p>
<div class="lab">Mécanisme</div><p>Tôt dans l’atrophie multisystématisée, l’hyperactivité du détrusor et la faiblesse du sphincter externe donnent impériosité et incontinence ; plus tard, la dyssynergie vésico-sphinctérienne laisse un résidu qui augmente (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</p>
<div class="lab">Technique</div><p>Le médecin interroge sur les symptômes de remplissage et de vidange, fait tenir un calendrier mictionnel de 3 jours, réalise un toucher rectal et une échographie prostatique chez l’homme, puis mesure le résidu, de préférence par échographie (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>). L’urodynamique distingue l’origine neurogène et non neurogène (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</p>
<div class="lab">Valeur</div><p>Contre la maladie de Parkinson, un résidu élevé a une sensibilité de 34 % et une spécificité de 95 %. L’incontinence par impériosité a une sensibilité de 48 % et une spécificité de 34 % (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>).</p>
<div class="lab">Piège</div><p>Dans une série d’atrophies multisystématisées probables, 43 % des hommes avaient subi une chirurgie prostatique ou du col vésical inutile avant le diagnostic (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a></p></template>

<template data-pop="g23-sm-erectile" data-title="Dysfonction érectile">
<div class="lab">Mécanisme</div><p>Les modifications dégénératives de la région sacrée de la moelle expliquent la dysfonction sexuelle, chez l’homme comme chez la femme (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</p>
<div class="lab">Valeur</div><p>Elle précède les troubles vésicaux chez 58 % des hommes atteints d’atrophie multisystématisée probable (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>). Une sensibilité génitale réduite est rapportée chez 47 à 56 % des femmes atteintes (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</p>
<div class="lab">Piège</div><p>Elle est fréquente dans la population âgée pour des causes endocriniennes ou vasculaires. Comme signe de soutien non moteur de la forme probable, elle ne compte qu’avant 60 ans (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a></p></template>

<template data-pop="g23-sm-tcsp" data-title="Mise en acte des rêves">
<div class="lab">Mécanisme</div><p>Pendant le sommeil paradoxal normal, des noyaux pontins abolissent le tonus musculaire. Dans les synucléinopathies, ces noyaux sont touchés et le patient met ses rêves en actes ; ils sont beaucoup moins touchés dans les tauopathies 4R (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich, 2026</a>).</p>
<div class="lab">Valeur</div><p>Un trouble établi dans les 4 ans a une sensibilité de 43 % et une spécificité de 100 % pour l’atrophie multisystématisée cérébelleuse face aux ataxies (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>). La polysomnographie le confirme (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</p>
<div class="lab">Piège</div><p>Il marque toutes les synucléinopathies : il ne sépare pas l’atrophie multisystématisée de la maladie de Parkinson (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a></p></template>

<template data-pop="g23-sm-stridor" data-title="Stridor de l’atrophie multisystématisée">
<div class="lab">Définition</div><p>Le stridor est un bruit respiratoire forcé, aigu et rude, surtout inspiratoire, dû à une dysfonction laryngée qui rétrécit la fente glottique. Il survient pendant le sommeil seul, ou pendant le sommeil et la veille (<a href="https://doi.org/10.1212/WNL.0000000000008208" target="_blank" rel="noopener">consensus de Bologne, 2019</a>).</p>
<div class="lab">Technique</div><p>Le médecin le reconnaît s’il l’entend à l’examen, par la description d’un témoin ou par un enregistrement sonore. Une laryngoscopie écarte une lésion mécanique ; si elle est normale, une endoscopie sous sommeil induit ou une vidéopolysomnographie confirme le stridor nocturne (<a href="https://doi.org/10.1212/WNL.0000000000008208" target="_blank" rel="noopener">consensus de Bologne, 2019</a>).</p>
<div class="lab">Valeur</div><p>Le stridor touche 12 à 42 % des patients ; il est le premier signe chez 4 à 5,2 % d’entre eux (<a href="https://doi.org/10.1212/WNL.0000000000008208" target="_blank" rel="noopener">consensus de Bologne, 2019</a>). Le stridor est un signe de soutien des deux sous-types d’atrophie multisystématisée (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>).</p>
<div class="lab">Conduite</div><p>La ventilation en pression positive continue et la trachéotomie sont proposées comme traitements symptomatiques ; leur effet sur la survie reste incertain (<a href="https://doi.org/10.1212/WNL.0000000000008208" target="_blank" rel="noopener">consensus de Bologne, 2019</a>).</p>
<div class="lab">Piège</div><p>Le témoin le décrit souvent comme un ronflement aigu ; le ronflement et les apnées obstructives coexistent souvent (<a href="https://doi.org/10.1212/WNL.0000000000008208" target="_blank" rel="noopener">consensus de Bologne, 2019</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1212/WNL.0000000000008208" target="_blank" rel="noopener">consensus de Bologne sur le stridor dans l’atrophie multisystématisée, 2019</a> ; <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a></p></template>

<template data-pop="g23-sm-bulbaire" data-title="Dysarthrie et dysphagie">
<div class="lab">Sémiologie</div><p>La paralysie supranucléaire progressive donne une dysarthrie hypokinétique spastique et une dysphagie, indices de soutien CC2 et CC3 (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la PSP, 2017</a>). L’atrophie multisystématisée donne une dysarthrie cérébelleuse ou une voix chevrotante, forcée, rauque ou aiguë, de type mixte hypokinétique, ataxique et spastique (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</p>
<div class="lab">Gravité</div><p>La dysphagie est une cause majeure de morbidité et de mortalité de la paralysie supranucléaire progressive et de la dégénérescence corticobasale et mène à la pneumonie d’aspiration (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich, 2026</a>).</p>
<div class="lab">Valeur</div><p>Les sources lues ne chiffrent pas la fréquence de la dysarthrie ni de la dysphagie.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a></p></template>

<template data-pop="g23-sm-extremites" data-title="Mains et pieds froids et violacés">
<div class="lab">Définition</div><p>Le signe désigne un froid et une coloration violette ou bleue d’apparition récente, qui blanchissent à la pression avec un retour circulatoire lent (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>).</p>
<div class="lab">Valeur</div><p>Sa spécificité dépasse 90 % face aux maladies à corps de Lewy lorsqu’il apparaît au cours de la vie (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>).</p>
<div class="lab">Piège</div><p>Le signe ne compte que s’il est d’apparition récente ; les sources lues ne détaillent pas les autres causes d’extrémités froides.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a></p></template>
