<template data-pop="g23-cim" data-title="Sous-codes G23 : inclusions et limites du codage">
<div class="lab">Contenu</div><p>La catégorie G23 de la CIM-10-GM 2024 comprend six sous-codes, de G23.0 à G23.9. La classification allemande précise que G23.0 inclut la dégénérescence pigmentaire du pallidum, que G23.1 inclut la paralysie supranucléaire progressive, et que G23.8 inclut la calcification des noyaux gris centraux et l’hypotension orthostatique neurogène (syndrome de Shy-Drager). Elle exclut l’hypotension orthostatique sans précision, codée I95.1 (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM)</a>). Les libellés français sont ceux de l’Office fédéral de la statistique (<a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024, libellés français (OFS)</a>).</p>
<div class="lab">Limite</div><p>La dégénérescence corticobasale n’a pas de sous-code nommé. Son rattachement à G23.8 est une inférence qui n’a pas été vérifiée dans l’index alphabétique. Le code sert au codage et à la statistique ; il ne remplace pas les critères cliniques.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM)</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024, libellés français (OFS)</a></p></template>
<template data-pop="g23-ams" data-title="Atrophie multisystématisée">
<div class="lab">Définition</div><p>Maladie neurodégénérative sporadique, progressive, de l’adulte de plus de 30 ans. Elle associe une perte neuronale et une gliose dans les systèmes striato-nigrique, olivo-ponto-cérébelleux et autonome. Le marqueur histologique est l’inclusion cytoplasmique oligodendrogliale d’α-synucléine (<a href="https://doi.org/10.1038/s41572-022-00382-6" target="_blank" rel="noopener">Nature Reviews Disease Primers 2022 (résumé)</a> ; <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>).</p>
<div class="lab">Sous-types</div><p>La forme parkinsonienne (AMS-P, G23.2) domine en Europe ; la forme cérébelleuse (AMS-C, G23.3) atteint jusqu’à 73 % des cas en Asie de l’Est (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>). Le type dépend de la présentation motrice dominante.</p>
<div class="lab">Limite</div><p>Les critères de 2022 sont à valider de façon prospective et par des corrélations clinico-pathologiques (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://doi.org/10.1038/s41572-022-00382-6" target="_blank" rel="noopener">Nature Reviews Disease Primers 2022 (résumé)</a></p></template>
<template data-pop="g23-psp" data-title="Paralysie supranucléaire progressive">
<div class="lab">Définition</div><p>Tauopathie définie sur le plan neuropathologique par l’agrégation de tau, surtout de l’isoforme 4R, sous forme de dégénérescences neurofibrillaires, de <i>coiled bodies</i> oligodendrogliaux et d’astrocytes touffus. Les dépôts prédominent dans les noyaux gris centraux et le tronc cérébral (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<div class="lab">Clinique</div><p>Le syndrome de Richardson associe chutes en arrière précoces et paralysie verticale du regard. D’autres phénotypes existent (<button class="w" data-k="g23-phenotypes-psp">phénotypes</button>). Le diagnostic est typiquement posé trois à quatre ans après le début des symptômes (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a></p></template>
<template data-pop="g23-dcb" data-title="Dégénérescence corticobasale et syndrome corticobasal">
<div class="lab">Définition</div><p>Tauopathie 4R primaire avec plaques astrocytaires et neurones ballonnés, dont l’atteinte corticale est plus fréquente. Le terme DCB désigne un diagnostic neuropathologique ; le tableau clinique est le syndrome corticobasal (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<div class="lab">Application</div><p>Un syndrome corticobasal clinique peut relever d’une autre pathologie : environ un quart des cas relèvent d’une PSP, un quart d’une maladie d’Alzheimer, plus rarement d’une synucléinopathie ou d’une pathologie TDP-43. Les critères d’Armstrong de 2013 décrivent quatre phénotypes de DCB (<a href="https://doi.org/10.1212/WNL.0b013e31827f0fd1" target="_blank" rel="noopener">critères d’Armstrong, dégénérescence corticobasale, 2013 (résumé)</a>).</p>
<div class="lab">Limite</div><p>Le rattachement de la DCB au code G23.8 n’est pas vérifié (<button class="w" data-k="g23-cim">sous-codes</button>).</p>
<p class="src">Références : <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a> ; <a href="https://doi.org/10.1212/WNL.0b013e31827f0fd1" target="_blank" rel="noopener">critères d’Armstrong, dégénérescence corticobasale, 2013 (résumé)</a></p></template>
<template data-pop="g23-nbia" data-title="Neurodégénérescence avec accumulation cérébrale de fer et PKAN">
<div class="lab">Définition</div><p>Groupe hétérogène de maladies génétiques rares avec accumulation de fer dans les noyaux gris centraux à l’IRM. Prévalence estimée à environ 1 pour 500 000 ; la PKAN représente environ la moitié des cas (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a>).</p>
<div class="lab">Traitement</div><p>Aucun traitement curatif ni modificateur ; le bénéfice de la chélation du fer est incertain (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a> ; <button class="w" data-k="g23-tircon">essai TIRCON</button>).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a></p></template>
<template data-pop="g23-pfbc" data-title="Calcification cérébrale primaire familiale">
<div class="lab">Définition</div><p>Ancienne « maladie de Fahr » : calcifications bilatérales des noyaux gris centraux, parfois du thalamus, du cervelet et de la substance blanche. Environ un tiers des porteurs sont asymptomatiques (<a href="https://doi.org/10.3390/ijms241310886" target="_blank" rel="noopener">revue génétique de la calcification cérébrale primaire familiale, 2023 (résumé)</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.3390/ijms241310886" target="_blank" rel="noopener">revue génétique de la calcification cérébrale primaire familiale, 2023 (résumé)</a></p></template>
<template data-pop="g23-gci" data-title="Inclusions oligodendrogliales d’α-synucléine">
<div class="lab">Définition</div><p>Dans l’AMS, l’α-synucléine s’agrège dans le cytoplasme des oligodendrocytes (<a href="https://doi.org/10.1038/s41572-022-00382-6" target="_blank" rel="noopener">Nature Reviews Disease Primers 2022 (résumé)</a> ; <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>).</p>
<div class="lab">Application</div><p>Cette localisation oligodendrogliale distingue l’AMS de la maladie de Parkinson et de la démence à corps de Lewy, où les corps de Lewy siègent dans les neurones (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>). Elle sert de marqueur histologique pour le diagnostic neuropathologique de l’AMS.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://doi.org/10.1038/s41572-022-00382-6" target="_blank" rel="noopener">Nature Reviews Disease Primers 2022 (résumé)</a></p></template>
<template data-pop="g23-epidemio-limites" data-title="Limites des chiffres épidémiologiques">
<div class="lab">Limites</div><p>Aucune étude épidémiologique suisse n’a été lue ; les fiches de Parkinson Suisse donnent des estimations d’experts sans population ni méthode décrites (<a href="https://www.parkinson.ch/fileadmin/parkinson/docs/diverse_fr/latrophie_multi-systematisee_f_ams_129_27_parkinson.pdf" target="_blank" rel="noopener">Parkinson Suisse, fiche AMS (professeur Sturzenegger)</a> ; <a href="https://www.parkinson.ch/fileadmin/parkinson/docs/diverse_fr/paralysie_supranucleaire_progressive_f_psp_130_27_parkinson.pdf" target="_blank" rel="noopener">Parkinson Suisse, fiche PSP (professeur Ghika)</a>). Les chiffres de l’AMS (prévalence de 1,9 à 3,4 pour 100 000, âge moyen de 55 ans, espérance de vie d’environ 7 ans) sont cités de seconde main par une étude américaine monocentrique de 30 patients, rétrospective (<a href="https://doi.org/10.1007/s10286-017-0500-0" target="_blank" rel="noopener">cohorte de 30 patients, premiers symptômes, 2018</a>). Les proportions de phénotypes de PSP viennent de cohortes différentes : 76 % de phénotypes autres que Richardson dans une série autopsique (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>), environ 25 % de Richardson dans la revue de Munich (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>). Ces nombres ne se comparent pas directement.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a> ; <a href="https://doi.org/10.1007/s10286-017-0500-0" target="_blank" rel="noopener">cohorte de 30 patients, premiers symptômes, 2018</a></p></template>
<template data-pop="g23-synucleine" data-title="Agrégation et ensemencement d’α-synucléine">
<div class="lab">Mécanisme</div><p>Dans l’AMS, l’α-synucléine s’agrège dans les oligodendrocytes. Les revues décrivent des souches spécifiques et un mécanisme d’ensemencement par lequel l’agrégat induit l’agrégation de la protéine normale (<a href="https://doi.org/10.1016/S1474-4422(24)00396-X" target="_blank" rel="noopener">Lancet Neurology 2024 (résumé)</a> ; <a href="https://doi.org/10.1038/s41572-022-00382-6" target="_blank" rel="noopener">Nature Reviews Disease Primers 2022 (résumé)</a>).</p>
<div class="lab">Conséquence</div><p>Perte neuronale striato-nigrique, olivo-ponto-cérébelleuse et autonome (<a href="https://doi.org/10.1038/s41572-022-00382-6" target="_blank" rel="noopener">Nature Reviews Disease Primers 2022 (résumé)</a>).</p>
<div class="lab">Limite</div><p>Ces deux revues n’ont été lues qu’en résumé.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(24)00396-X" target="_blank" rel="noopener">Lancet Neurology 2024 (résumé)</a> ; <a href="https://doi.org/10.1038/s41572-022-00382-6" target="_blank" rel="noopener">Nature Reviews Disease Primers 2022 (résumé)</a></p></template>
<template data-pop="g23-preganglionnaire" data-title="Atteinte préganglionnaire : conséquences pour les examens">
<div class="lab">Mécanisme</div><p>Dans l’AMS, la lésion siège sur la voie autonome en amont du ganglion. Dans la maladie de Parkinson, elle est post-ganglionnaire (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>).</p>
<div class="lab">Application</div><p>La scintigraphie cardiaque MIBG est habituellement normale dans l’AMS, et la noradrénaline plasmatique de repos est normale (supérieure à 100 pg/mL) ; ces résultats orientent vers l’AMS plutôt que vers la maladie de Parkinson (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a></p></template>
<template data-pop="g23-post-synaptique" data-title="Atteinte post-synaptique et réponse à la lévodopa">
<div class="lab">Mécanisme</div><p>La lévodopa est un précurseur de la dopamine. Elle ne peut agir que sur des neurones striataux qui répondent à la dopamine. Dans l’AMS parkinsonienne et la PSP, ces neurones post-synaptiques dégénèrent (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<div class="lab">Application</div><p>La dégénérescence dopaminergique striatale post-synaptique est l’indice d’imagerie IF2 de la PSP ; l’imagerie dopaminergique post-synaptique (IBZM, DMFP) l’explore. Une réponse faible à la lévodopa est donc attendue, mais pas exclue : une réponse transitoire existe chez 42 à 57 % des AMS parkinsoniennes (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a></p></template>
<template data-pop="g23-tau4r" data-title="Tauopathies 4R : topographie et signes">
<div class="lab">Mécanisme</div><p>L’agrégation de tau 4R touche le tronc cérébral et les noyaux gris centraux dans la PSP, le cortex dans la DCB. Il n’y a ni dépôt de β-amyloïde ni tau mixte 3R/4R (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<div class="lab">Conséquence</div><p>La PSP donne des troubles de l’oculomotricité verticale et des chutes ; la DCB, une apraxie et des signes corticaux asymétriques (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>). La dysphagie est la principale cause de morbidité et de mortalité.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a></p></template>
<template data-pop="g23-pkan-meca" data-title="PKAN : mécanisme et hypothèse">
<div class="lab">Mécanisme</div><p><i>PANK2</i> code une pantothénate kinase mitochondriale. La PKAN est une erreur innée du métabolisme du coenzyme A, avec lésions surtout du globus pallidus et parfois de la substance noire (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9970616/" target="_blank" rel="noopener">pathogénie de la PKAN, 2022</a>).</p>
<div class="lab">Limite</div><p>Le mécanisme exact n’est pas résolu. Une hypothèse invoque l’activation insuffisante de la protéine porteuse d’acyles mitochondriale dépendante du coenzyme A. Cette source n’apporte aucune donnée clinique ou thérapeutique utilisée ici.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9970616/" target="_blank" rel="noopener">pathogénie de la PKAN, 2022</a></p></template>
<template data-pop="g23-pfbc-meca" data-title="Calcification familiale : gènes et hypothèses">
<div class="lab">Gènes</div><p>Sept gènes : quatre dominants (<i>SLC20A2, PDGFRB, PDGFB, XPR1</i>) et trois récessifs (<i>MYORG, JAM2, CMPK2</i>). Environ 50 % des patients n’ont pas de variant identifié (<a href="https://doi.org/10.3390/ijms241310886" target="_blank" rel="noopener">revue génétique de la calcification cérébrale primaire familiale, 2023 (résumé)</a>).</p>
<div class="lab">Hypothèses</div><p>Dysfonction de l’unité neurovasculaire, homéostasie du phosphate, mitochondrie (<a href="https://doi.org/10.3390/ijms241310886" target="_blank" rel="noopener">revue génétique de la calcification cérébrale primaire familiale, 2023 (résumé)</a>).</p>
<div class="lab">Limite</div><p>Source lue en résumé ; revue non européenne.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/ijms241310886" target="_blank" rel="noopener">revue génétique de la calcification cérébrale primaire familiale, 2023 (résumé)</a></p></template>
<template data-pop="g23-phenotypes-psp" data-title="Phénotypes de la PSP">
<div class="lab">Phénotypes</div><p>Les critères MDS de 2017 distinguent : PSP-RS (Richardson), PSP-PGF (freezing de la marche), PSP-P (parkinsonisme), PSP-F (présentation frontale), PSP-OM (prédominance oculomotrice), PSP-SL (troubles du langage), PSP-CBS (syndrome corticobasal) ; ils décrivent aussi la PSP à prédominance d’instabilité posturale (PSP-PI), retenue au niveau « évocateur » (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>).</p>
<div class="lab">Fréquence</div><p>Environ 76 % des PSP autopsiées avaient un phénotype autre que Richardson (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>) ; la revue de Munich estime le syndrome de Richardson à environ 25 % des cas, ce qui en fait encore le phénotype le plus fréquent ; la plupart des patients passent, en moyenne en 3,6 ans, d’une PSP évocatrice ou possible à une PSP probable (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>). Les cohortes diffèrent.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a></p></template>
<template data-pop="g23-ho" data-title="Hypotension orthostatique neurogène : technique et seuils">
<div class="lab">Définition</div><p>En population générale, l’hypotension orthostatique est une chute de la pression systolique d’au moins 20 mmHg ou de la pression diastolique d’au moins 10 mmHg, ou une pression systolique inférieure à 90 mmHg (<a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">lignes directrices ESC sur la syncope, 2018</a>). Dans l’AMS, le critère est une chute de la pression systolique d’au moins 20 mmHg, habituellement accompagnée d’une chute diastolique d’au moins 10 mmHg. La chute systolique seule suffit, car elle reconnaît 95 % des hypotensions neurogènes ; la chute diastolique isolée n’est pas spécifique et ne s’utilise pas seule. La chute doit survenir dans les 3 minutes pour la forme cliniquement établie, et dans les 10 minutes pour la forme probable ; ce délai de 10 minutes ajoute les hypotensions retardées, survenues entre 3 et 10 minutes. Elle est dite neurogène si le rapport variation de fréquence cardiaque sur variation de pression systolique est inférieur à 0,5 battement par minute et par mmHg (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>).</p>
<div class="lab">Technique</div><p>Le médecin mesure la pression couchée puis debout (station active) ou réalise un test d’inclinaison. Les deux épreuves objectivent l’hypotension. Le rapport entre la hausse de la fréquence cardiaque et la baisse de la pression systolique, inférieur à 0,5 battement par minute et par mmHg après 3 minutes, distingue ensuite l’hypotension neurogène des causes non neurogènes, comme l’hypovolémie ou les antihypertenseurs : sensibilité 91,3 % et spécificité 88,4 % au test d’inclinaison, sensibilité 79 % en station active. Prolonger l’épreuve de 3 à 10 minutes augmente de 18 % la sensibilité pour l’hypotension neurogène (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>).</p>
<div class="lab">Piège</div><p>Des médicaments (antihypertenseurs, dérivés nitrés, diurétiques, dopaminergiques) peuvent provoquer ou aggraver la chute (<a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">lignes directrices ESC sur la syncope, 2018</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">lignes directrices ESC sur la syncope, 2018</a></p></template>
<template data-pop="g23-retention" data-title="Rétention et incontinence urinaire par impériosité">
<div class="lab">Définition</div><p>Des difficultés mictionnelles inexpliquées avec un résidu post-mictionnel supérieur à 100 mL, ou une incontinence urinaire par impériosité inexpliquée, sont des critères autonomes d’AMS établie ; un résidu de tout volume suffit pour l’AMS probable. L’impériosité sans fuite ne suffit pas ; une hypertrophie prostatique obstructive, une chirurgie pelvienne antérieure ou un prolapsus pelvien doivent être exclus (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>).</p>
<div class="lab">Spécificité</div><p>La rétention est très spécifique de l’AMS par rapport à la maladie de Parkinson (spécificité 95 %), mais elle ne la distingue pas de la PSP (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>) ; l’urodynamique est la référence pour distinguer vessie neurogène et non neurogène (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>).</p>
<div class="lab">Conséquence thérapeutique</div><p>Elle contre-indique la midodrine (<a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse Gutron®, mars 2021</a>). Le traitement urologique (autosondage, traitement de l’hyperactivité vésicale) n’a pas été lu dans une source suisse ou européenne.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse Gutron®, mars 2021</a></p></template>
<template data-pop="g23-tcsp" data-title="Trouble du comportement en sommeil paradoxal">
<div class="lab">Définition</div><p>Mise en acte des rêves, rapportée par 77 % des 30 patients d’AMS d’une étude américaine (<a href="https://doi.org/10.1007/s10286-017-0500-0" target="_blank" rel="noopener">cohorte de 30 patients, premiers symptômes, 2018</a>).</p>
<div class="lab">Application</div><p>Rare dans la PSP et la DCB, donc évocateur d’une synucléinopathie (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>). La polysomnographie le confirme (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a> ; <a href="https://doi.org/10.1007/s10286-017-0500-0" target="_blank" rel="noopener">cohorte de 30 patients, premiers symptômes, 2018</a></p></template>
<template data-pop="g23-stridor" data-title="Stridor et troubles respiratoires du sommeil">
<div class="lab">Signes</div><p>Le stridor et les soupirs inspiratoires sont des signes de soutien non moteurs de l’AMS ; le ronflement est rapporté par 57 % des patients de la cohorte de 30 (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1007/s10286-017-0500-0" target="_blank" rel="noopener">cohorte de 30 patients, premiers symptômes, 2018</a>). Des anomalies laryngées sont observées à la fibroscopie dans plus de 90 % des cas (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>).</p>
<div class="lab">Définition et examen</div><p>Le stridor est un bruit respiratoire forcé, aigu et rude, surtout inspiratoire, causé par un rétrécissement de la fente glottique ; il touche 12 à 42 % des patients. Une laryngoscopie écarte une lésion mécanique ; une endoscopie sous sommeil induit ou une vidéopolysomnographie le confirme si la laryngoscopie de veille est normale (<a href="https://doi.org/10.1212/WNL.0000000000008208" target="_blank" rel="noopener">consensus de Bologne sur le stridor dans l’atrophie multisystématisée, 2019</a>).</p>
<div class="lab">Conduite</div><p>La ventilation en pression positive continue convient au stridor léger ou modéré du sommeil ; la trachéotomie est préférée au stade avancé, pour un stridor sévère ou diurne avec cordes immobiles. Leur effet sur la survie reste incertain (<a href="https://doi.org/10.1212/WNL.0000000000008208" target="_blank" rel="noopener">consensus de Bologne sur le stridor dans l’atrophie multisystématisée, 2019</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <a href="https://doi.org/10.1007/s10286-017-0500-0" target="_blank" rel="noopener">cohorte de 30 patients, premiers symptômes, 2018</a> ; <a href="https://doi.org/10.1212/WNL.0000000000008208" target="_blank" rel="noopener">consensus de Bologne sur le stridor dans l’atrophie multisystématisée, 2019</a></p></template>
<template data-pop="g23-premiers-sympt" data-title="Premiers symptômes de l’AMS">
<div class="lab">Données</div><p>Dans une série de 30 patients, le premier symptôme était autonome chez 73 %, lié au sommeil chez 17 %, moteur chez 10 %. La dysfonction érectile précédait le diagnostic d’environ 4 ans chez tous les hommes interrogés (<a href="https://doi.org/10.1007/s10286-017-0500-0" target="_blank" rel="noopener">cohorte de 30 patients, premiers symptômes, 2018</a>).</p>
<div class="lab">Limite</div><p>Étude rétrospective monocentrique américaine, effectif de 30 ; indicatif.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s10286-017-0500-0" target="_blank" rel="noopener">cohorte de 30 patients, premiers symptômes, 2018</a></p></template>
<template data-pop="g23-levodopa-reponse" data-title="Réponse à la lévodopa : mesure et interprétation">
<div class="lab">Mesure</div><p>Le parkinsonisme est dit peu dopa-sensible si l’amélioration du score moteur MDS-UPDRS III est inférieure à 30 % jusqu’à 1000 mg par jour (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>).</p>
<div class="lab">Interprétation</div><p>Dans l’AMS, la réponse est médiocre chez 74 % ; transitoire chez 42 à 57 % des AMS parkinsoniennes, épuisée vers 3,5 ans (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>). Une réponse substantielle et durable est un critère d’exclusion de l’AMS (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a></p></template>
<template data-pop="g23-pulltest" data-title="Test de traction (pull test)">
<div class="lab">Lecture</div><p>Dans les critères de la PSP, une tendance à la chute au test de traction est le niveau P-2 de l’instabilité posturale ; plus de deux pas en arrière, le niveau P-3. Le niveau P-1 correspond à des chutes répétées non provoquées dans les 3 ans (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a></p></template>
<template data-pop="g23-oculomoteur" data-title="Signes oculomoteurs">
<div class="lab">Niveaux</div><p>O-1 : paralysie supranucléaire verticale. O-2 : saccades verticales lentes. O-3 : ondes carrées fréquentes ou apraxie d’ouverture des paupières (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>).</p>
<div class="lab">Application</div><p>La paralysie verticale du regard est spécifique de la PSP (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>) ; une paralysie du regard vers le bas ou des saccades verticales ralenties excluent l’AMS (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>). Les aides visuelles sont décrites à la section 9.4.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a></p></template>
<template data-pop="g23-cerebelleux" data-title="Signes cérébelleux">
<div class="lab">Critère</div><p>Le syndrome cérébelleux de l’AMS comprend au moins deux signes parmi l’ataxie de la marche, l’ataxie des membres, la dysarthrie cérébelleuse et les signes oculomoteurs pour la forme établie, au moins un pour la forme probable (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>).</p>
<div class="lab">Piège</div><p>Une ataxie peut être toxique (alcool, carbamazépine, phénytoïne, lithium) (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a></p></template>
<template data-pop="g23-corticaux" data-title="Signes corticaux : apraxie, perte sensitive, membre étranger">
<div class="lab">Critère</div><p>Le syndrome corticobasal probable exige au moins deux signes corticaux (apraxie bucco-faciale ou des membres, déficit sensitif cortical, membre étranger) et au moins deux signes sous-corticaux (rigidité ou akinésie, dystonie, myoclonies d’un membre), de façon asymétrique (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a></p></template>
<template data-pop="g23-dystonie" data-title="Rigidité, akinésie, dystonie">
<div class="lab">Application</div><p>Une dystonie cranio-cervicale induite ou aggravée par la lévodopa sans dyskinésie des membres est un signe de soutien d’AMS (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>). Dans la PKAN classique, la dystonie touche d’abord les membres inférieurs (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a>). La toxine botulique est proposée dans la PSP et la DCB (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a></p></template>
<template data-pop="g23-babinski-myoclonie" data-title="Signe de Babinski et tremblement myoclonique">
<div class="lab">Application</div><p>Un signe de Babinski inexpliqué et un tremblement myoclonique postural ou cinétique saccadé sont des signes de soutien moteurs de l’AMS dans les trois ans (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>). Les myoclonies d’un membre sont un signe sous-cortical du syndrome corticobasal (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a></p></template>
<template data-pop="g23-cognition" data-title="Langage et fonctions exécutives">
<div class="lab">Application</div><p>Dans la PSP, le domaine cognitif comprend l’aphasie non fluente ou l’apraxie de la parole (C-1), la présentation frontale avec au moins 3 éléments (apathie, bradyphrénie, trouble dysexécutif, fluence phonémique réduite, impulsivité ou persévération) (C-2) et le syndrome corticobasal (C-3) (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>). Une démence dans les 3 ans exclut l’AMS (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>) ; dans la DCB, elle survient chez plus de la moitié aux stades avancés, avec mémoire sémantique habituellement préservée (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a></p></template>
<template data-pop="g23-dysphagie" data-title="Dysphagie et dysarthrie">
<div class="lab">Gravité</div><p>La dysphagie est la cause majeure de morbidité et de mortalité dans la PSP et la DCB ; la déglutition est évaluée régulièrement (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>). Une dysarthrie ou une dysphagie sévère est un signe de soutien d’AMS dans les trois ans (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>). Pour les patients qui avalent mal, Madopar® existe sous forme liquide (<a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse Madopar®, juin 2023</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse Madopar®, juin 2023</a></p></template>
<template data-pop="g23-signes-peripheriques" data-title="Mains et pieds froids et violacés">
<div class="lab">Application</div><p>Les mains et les pieds froids et violacés sont un signe de soutien non moteur de l’AMS (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a></p></template>
<template data-pop="g23-pkan-clinique" data-title="PKAN : clinique">
<div class="lab">Formes</div><p>Forme classique : début vers 3 ans, troubles de la marche, dystonie des membres inférieurs, rétinopathie pigmentaire fréquente, acanthocytes chez une minorité. Forme atypique : début plus tardif, parkinsonisme, troubles neuropsychiatriques et de la parole précoces (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a>).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a></p></template>
