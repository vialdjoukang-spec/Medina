<template id="ch-G06"><div class="chap"><div class="chap-head"><div class="code">G06 · Neurologie</div><h1>G06 — Abcès et granulome intracrâniens et intrarachidiens</h1><span class="status">Auto-relecture IA de l’auteur · Aucune validation médicale humaine attestée</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><div class="chap-body" data-semiology-clinical="G06"><section class="ilot" id="g06-question"><h2>Une collection infectieuse est d’abord une question de territoire et d’urgence</h2><p>Une céphalée nouvelle avec déficit, une crise ou une dégradation de la vigilance fait rechercher une infection focale intracrânienne. Une douleur rachidienne inhabituelle avec faiblesse, troubles sensitifs ou dysfonction vésicosphinctérienne fait rechercher une infection rachidienne compressive. La fièvre peut manquer dans les deux situations. La première décision n’est pas le choix d’une durée antibiotique : il faut reconnaître le territoire menacé, obtenir une imagerie adaptée et mobiliser l’équipe capable de prélever et de drainer.</p><p>Cette leçon explique les abcès et granulomes intracrâniens et intrarachidiens. Un abcès contient du pus ; un granulome est une organisation inflammatoire dont la cause peut être infectieuse ou non. Le code G06 ne transforme pas ces lésions en une maladie unique. Certaines infections et maladies granulomateuses ont un code causal propre et relèvent d’une autre catégorie. Le raisonnement clinique précède le codage.</p><div class="key"><b>À retenir.</b> Localiser, chercher la gravité, imager, prélever et traiter avec les spécialistes ; ne pas attendre la triade complète ni un résultat inflammatoire spectaculaire.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r9">[9]</button> · <button class="w" data-k="g06-r15">[15]</button> · <button class="w" data-k="g06-r16">[16]</button> · <button class="w" data-k="g06-r17">[17]</button></p></section><section class="ilot" id="g06-definition"><h2>Distinguer l’abcès, l’empyème et le granulome</h2><p>L’abcès cérébral résulte d’une infection focale du parenchyme. Une phase de cérébrite peut évoluer vers une collection purulente entourée d’une capsule conjonctive et de tissu réactionnel. L’empyème correspond à une collection purulente dans un espace préexistant ou potentiel, notamment sous-dural ou épidural. Un granulome rassemble des cellules inflammatoires organisées ; son caractère caséeux, non caséeux ou nécrosant oriente, sans fournir seul une cause certaine.</p><table class="t"><thead><tr><th>Terme</th><th>Territoire</th><th>Conséquence pratique</th></tr></thead><tbody><tr><td>Abcès cérébral</td><td>Parenchyme encéphalique.</td><td>Effet de masse, œdème et preuve microbiologique à rechercher.</td></tr><tr><td>Empyème sous-dural intracrânien</td><td>Entre dure-mère et arachnoïde.</td><td>Extension rapide possible ; urgence neurochirurgicale.</td></tr><tr><td>Collection épidurale rachidienne</td><td>En dehors de la dure-mère, dans le canal rachidien.</td><td>Compression de la moelle ou des racines ; déficit et sphincters guident l’urgence.</td></tr><tr><td>Abcès intramédullaire ou sous-dural rachidien</td><td>Moelle elle-même ou compartiment sous-dural spinal.</td><td>Formes rares, traitement spécialisé ; ne pas appliquer automatiquement le protocole d’une spondylodiscite.</td></tr><tr><td>Granulome</td><td>Tissu organisé, parfois lésion expansive.</td><td>Chercher la cause ; ne pas donner un immunosuppresseur sur le seul mot granulome.</td></tr></tbody></table><p>Le compartiment détermine l’accès chirurgical et le risque immédiat, alors que la microbiologie détermine l’antibiotique. La taille n’épuise pas la décision : proximité ventriculaire, profondeur, multiplicité, état neurologique, immunité et faisabilité du prélèvement comptent. Aucun seuil de diamètre isolé n’est présenté ici comme une règle universelle. Une capsule ne garantit ni stabilité ni stérilité.</p><div class="key"><b>À retenir.</b> La même image annulaire peut correspondre à des maladies différentes ; « collection », « abcès » et « granulome » ne sont pas synonymes.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r4">[4]</button> · <button class="w" data-k="g06-r9">[9]</button></p></section><section class="ilot" id="g06-codage"><h2>G06 : trois sous-codes, avec des exclusions causales</h2><p><button class="w" data-k="g06-codage">Lire les sous-codes sans les transformer en conduite clinique</button></p><table class="t"><thead><tr><th>Sous-code</th><th>Ce qu’il faut documenter</th></tr></thead><tbody><tr><td>G06.0</td><td>Localisation intracrânienne et compartiment, caractère probable ou confirmé.</td></tr><tr><td>G06.1</td><td>Niveau rachidien, territoire médullaire/radiculaire et éventuelle collection extramédullaire.</td></tr><tr><td>G06.2</td><td>Absence réelle de précision dans le dossier ; ce code ne dispense pas de localiser pour soigner.</td></tr></tbody></table><p>Un tuberculome est un granulome cérébral dans le langage descriptif, mais ce mot ne justifie pas à lui seul le code G06. Une inflammation granulomateuse non infectieuse peut relever d’une autre maladie. Les inclusions administratives n’autorisent donc pas une antibiothérapie identique de toutes ces situations.</p><div class="key"><b>À retenir.</b> Faire apparaître dans le dossier le territoire, le degré de certitude et l’étiologie ; appliquer ensuite les inclusions et exclusions du code.</div><p>Sources : <button class="w" data-k="g06-r9">[9]</button> · <button class="w" data-k="g06-r15">[15]</button></p></section><section class="ilot" id="g06-epidemio"><h2>Épidémiologie : une donnée locale ne devient pas une incidence nationale</h2><p>Les lectures réalisées ne donnent pas d’incidence nationale suisse actuelle de tout G06, ni une répartition exhaustive par âge et sexe. Le guide européen des abcès cérébraux cite des estimations annuelles de 0,4 à 1,3 pour 100000 habitants dans les populations étudiées. Cet ordre de grandeur ne décrit ni la Suisse spécifiquement, ni les collections spinales, ni l’ensemble des granulomes.</p><p>Une étude prospective bâloise publiée en 2011 décrit 36 patients avec abcès épidural spinal, pris en charge entre 2004 et 2008. Elle confirme l’importance clinique des douleurs rachidiennes, des comorbidités, des gestes antérieurs et des infections à staphylocoques dans cette population hospitalière. Ses dénominateurs et sa sélection ne permettent pas d’en déduire une incidence suisse actuelle. Certains totaux de microbiologie et de récupération diffèrent entre résumé, texte et tableau ; les pourcentages correspondants ne sont pas repris comme des résultats stables.</p><table class="t"><thead><tr><th>Donnée</th><th>Population</th><th>Usage raisonnable</th></tr></thead><tbody><tr><td>0,4–1,3/100000/an</td><td>Estimations citées dans ESCMID pour l’abcès cérébral.</td><td>Dire la rareté et garder l’origine étrangère/européenne.</td></tr><tr><td>36 patients</td><td>Cohorte neurochirurgicale bâloise ancienne d’abcès épidural spinal.</td><td>Illustrer les présentations et limites de la triade, sans prédiction individuelle.</td></tr><tr><td>27 patients</td><td>Série chinoise d’IRM avec confirmation opératoire/pathologique.</td><td>Décrire des aspects possibles du phlegmon et de l’abcès, sans sensibilité générale.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Le contexte et les signes de gravité commandent la décision ; l’absence d’une statistique suisse exhaustive doit rester explicite.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r7">[7]</button> · <button class="w" data-k="g06-r8">[8]</button></p></section><section class="ilot" id="g06-causes"><h2>Chercher une porte d’entrée et un terrain</h2><p>Une infection cérébrale peut venir d’un foyer voisin, notamment dentaire ou ORL, d’une dissémination sanguine, ou d’une inoculation directe après traumatisme ou chirurgie. Les streptocoques oraux et les anaérobies orientent vers une origine buccodentaire ou ORL ; un staphylocoque peut être lié à une bactériémie ou à un contexte postopératoire. Ces associations orientent les prélèvements et la couverture initiale ; elles ne prouvent pas la source chez un patient donné.</p><table class="t"><thead><tr><th>Contexte</th><th>Questions utiles</th><th>Conséquence</th></tr></thead><tbody><tr><td>Foyer dentaire ou ORL</td><td>Douleur, soins, sinusite/otite, examen ciblé.</td><td>Consultation adaptée et contrôle du foyer avec les spécialistes.</td></tr><tr><td>Bactériémie ou foyer distant</td><td>Cultures sanguines, peau, matériel, arguments d’endocardite.</td><td>Explorer selon germe et clinique, sans échographie transœsophagienne systématique chez tous.</td></tr><tr><td>Chirurgie ou traumatisme</td><td>Date, voie d’accès, matériel, brèche, germes et antibiotiques antérieurs.</td><td>Microbiologie et résistances différentes ; protocole postopératoire local.</td></tr><tr><td>Immunodépression importante</td><td>Transplantation, chimiothérapie, hémopathie, traitements biologiques, statut VIH pertinent.</td><td>Spectre élargi, toxoplasmose et agents opportunistes dans le différentiel.</td></tr><tr><td>Infection rachidienne</td><td>Geste récent, infection sanguine, porte cutanée, discite/ostéite.</td><td>Documenter la collection et l’atteinte osseuse ; le contexte de novo n’est pas le contexte postopératoire.</td></tr></tbody></table><p>L’ESCMID suggère de considérer un test VIH dans les abcès cérébraux non traumatiques. La recherche d’un foyer doit être orientée : l’échographie transœsophagienne concerne particulièrement une bactériémie monomicrobienne à streptocoque ou staphylocoque sans autre facteur évident. Un examen ciblé vaut mieux qu’une batterie identique chez tous. Pour un granulome, expositions, immunité, manifestations systémiques et tissu accessible peuvent guider la recherche d’agent ou de maladie inflammatoire.</p><div class="key"><b>À retenir.</b> La porte d’entrée et le terrain modifient la probabilité et le traitement empirique ; la preuve microbiologique peut ensuite déplacer le diagnostic.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r7">[7]</button> · <button class="w" data-k="g06-r9">[9]</button> · <button class="w" data-k="g06-r16">[16]</button></p></section><section class="ilot" id="g06-anamnese"><h2>Construire une chronologie clinique exploitable</h2><p>Préciser le début, la vitesse d’aggravation et le caractère nouveau de la céphalée ou de la douleur rachidienne. Rechercher vomissements, crise, faiblesse, maladresse, trouble du langage, confusion et changement de marche. Demander une rétention ou une incontinence urinaire nouvelle, une modification du transit ou une gêne sensitive périnéale lorsqu’une compression rachidienne est possible. L’absence de plainte spontanée ne remplace pas ces questions ciblées.</p><p>Documenter fièvre mesurée ou ressentie, frissons, perte fonctionnelle, foyer dentaire/ORL, plaie, infection récente, chirurgie, geste rachidien et matériel. Relever antibiotiques déjà reçus, heure et dose : un prétraitement peut diminuer le rendement des cultures. Examiner la liste des médicaments, la fonction rénale connue et les traitements immunosuppresseurs. L’entourage peut préciser une modification de comportement ou une chronologie lorsque le patient est confus.</p><p><button class="w" data-k="g06-chronologie">Quand une histoire rachidienne doit changer de priorité</button></p><div class="key"><b>À retenir.</b> La chronologie de la douleur, du déficit, des prélèvements et des antibiotiques doit pouvoir être relue par l’équipe suivante.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r7">[7]</button> · <button class="w" data-k="g06-r16">[16]</button></p></section><section class="ilot" id="g06-clinique"><h2>Examiner le cerveau, la moelle et les racines</h2><p>Commencer par respiration, circulation, perfusion, température et état de conscience. Un patient instable nécessite stabilisation et soins urgents en parallèle du diagnostic. Examiner ensuite orientation, attention, langage, nerfs crâniens, motricité et sensibilité. Un déficit latéralisé ou une crise récente peut traduire une atteinte focale intracrânienne ; sa présence ne permet pas d’en attribuer la cause à une infection sans imagerie et bilan.</p><p>Si le rachis est concerné, rechercher douleur provoquée, déficit radiculaire ou médullaire, niveau sensitif et troubles vésicosphinctériens. Mesurer la force avec la même méthode et le même territoire lors des contrôles. La comparaison dans le temps est essentielle : une légère faiblesse ancienne et un déficit rapidement progressif n’ont pas la même portée. Une douleur, une fatigue ou une coopération insuffisante doivent être décrites plutôt que masquées par un chiffre.</p><p><button class="w" data-k="g06-mrc">Force musculaire : comprendre les grades 0à 5</button></p><div class="key"><b>À retenir.</b> Un examen normal à un instant ne protège pas d’une aggravation ; consigner un état de référence et répéter l’examen selon le risque.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r14">[14]</button> · <button class="w" data-k="g06-r16">[16]</button></p></section><section class="ilot" id="g06-urgence"><h2>Reconnaître les situations où le temps compte</h2><p>Une altération progressive de vigilance, des signes d’engagement, un sepsis, une aggravation focale ou une nouvelle crise imposent une prise en charge urgente et une imagerie adaptée. Un empyème sous-dural intracrânien peut s’étendre rapidement et nécessite une évaluation neurochirurgicale immédiate en vue d’évacuation. Une collection rachidienne accompagnée d’un déficit ou de troubles sphinctériens demande une évaluation chirurgicale urgente ; ne pas attendre une CRP élevée ou la fin d’un bilan étiologique.</p><p><button class="w" data-k="g06-attente">Le report de l’antibiotique n’est pas une attente systématique de 24 heures</button></p><table class="t"><thead><tr><th>Situation</th><th>Décision initiale</th></tr></thead><tbody><tr><td>Sepsis ou détresse neurologique</td><td>Stabiliser, cultures sans délai évitable, antibiothérapie et avis chirurgical urgents.</td></tr><tr><td>Patient cérébral sélectionné non grave, prélèvement rapidement faisable</td><td>Discuter explicitement le bref report pour prélèvement, sans automatisme.</td></tr><tr><td>Empyème épidural spinal avec déficit</td><td>Décompression clairement indiquée dans le consensus EANS ; organisation urgente.</td></tr><tr><td>Collection épidurale sans déficit</td><td>Pas de consensus pour une chirurgie quasi systématique ; décision spécialisée et surveillance, jamais simple réassurance.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Le délai de prélèvement est une décision conditionnelle ; la gravité annule une stratégie d’attente.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r4">[4]</button></p></section>

<section class="ilot" id="g06-diagnostic"><h2>Établir la localisation et le degré de certitude</h2><p>L’IRM cérébrale avec diffusion, carte de coefficient apparent de diffusion et séquences avant/après contraste est l’examen privilégié pour l’abcès cérébral. Si elle n’est pas disponible, le scanner cérébral injecté est une alternative initiale. L’image doit décrire siège, nombre, taille, œdème, effet de masse et rapports ventriculaires. Pour une infection rachidienne, l’IRM de la région suspecte avec et sans contraste recherche collection, compression et atteinte osseuse/discale.</p><p>La preuve microbiologique repose sur le sang et, lorsque possible, le pus ou le tissu. Adresser des cultures aérobies et anaérobies ainsi qu’une histopathologie. En cas de cultures négatives, les techniques moléculaires peuvent améliorer l’identification ; elles ne remplacent ni un prélèvement correctement préparé ni l’interprétation du contexte. Certaines analyses spécifiques dépendent des expositions, du terrain et du diagnostic différentiel.</p><p><button class="w" data-k="g06-certitude">Distinguer suspicion radiologique et cause confirmée</button></p><div class="key"><b>À retenir.</b> Décrire ce qui est démontré : syndrome, localisation, collection probable, histologie et agent ; ne pas fondre ces niveaux en une certitude artificielle.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r8">[8]</button> · <button class="w" data-k="g06-r9">[9]</button></p></section><section class="ilot" id="g06-differentiel"><h2>Comparer les diagnostics qui changent la conduite</h2><p>Le différentiel dépend de la localisation et du terrain. Une tumeur nécrotique peut se rehausser en couronne et produire œdème, déficit ou crise. Une toxoplasmose doit être considérée devant des lésions cérébrales chez une personne immunodéprimée ; son traitement et la place du prélèvement ne se confondent pas avec l’aspiration systématique d’un abcès pyogène. Une granulomatose infectieuse ou inflammatoire peut nécessiter une preuve tissulaire et un traitement causal différent.</p><table class="t"><thead><tr><th>Hypothèse</th><th>Élément discriminant à rechercher</th><th>Piège</th></tr></thead><tbody><tr><td>Tumeur nécrotique</td><td>Contexte, séquences IRM et tissu lorsque indiqué.</td><td>Déduire infection du seul anneau ou cancer du seul antécédent.</td></tr><tr><td>Toxoplasmose / autre infection opportuniste</td><td>Type d’immunodépression, documentation spécifique et avis spécialisé.</td><td>Appliquer à toutes lésions la même stratégie opératoire.</td></tr><tr><td>Granulome infectieux ou inflammatoire</td><td>Expositions, atteinte systémique, histologie et recherche d’agent.</td><td>Commencer une immunosuppression sur la seule image granulomateuse.</td></tr><tr><td>Lombalgie mécanique ou lésion non infectieuse</td><td>Examen neurologique, histoire infectieuse, IRM si suspicion.</td><td>Fièvre absente ou premier examen sans déficit pris comme exclusion.</td></tr><tr><td>Toxicité antibiotique en cours de traitement</td><td>Temporalité, rein, molécules, concentrations si pertinentes, imagerie clinique adaptée.</td><td>Attribuer toute confusion à l’infection ou tout déficit au médicament.</td></tr></tbody></table><p>Les comparaisons ne sont pas des tests absolus. Un contexte de cancer n’exclut pas une infection, et une amélioration partielle sous antibiotique ne démontre pas à elle seule l’agent. Lorsque le traitement envisagé est potentiellement opposé, par exemple immunosuppression versus contrôle d’une infection, documenter les incertitudes et discuter une stratégie de preuve.</p><div class="key"><b>À retenir.</b> Le diagnostic différentiel sert à choisir un examen ou un prélèvement susceptible de modifier le traitement.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r6">[6]</button> · <button class="w" data-k="g06-r9">[9]</button> · <button class="w" data-k="g06-r11">[11]</button></p></section><section class="ilot" id="g06-traitement"><h2>Traiter avec les équipes capables de contrôler le foyer</h2><p>La prise en charge est hospitalière et coordonne neurochirurgie, infectiologie, radiologie et microbiologie. Elle associe traitement anti-infectieux adapté, drainage ou exérèse lorsque indiqué, traitement de la porte d’entrée et surveillance neurologique. Le prélèvement n’est pas seulement un geste thérapeutique : il peut rendre possible une réduction du spectre et révéler un autre diagnostic. L’état clinique, l’anatomie et les possibilités techniques déterminent la stratégie.</p><p>Pour un abcès cérébral communautaire chez l’immunocompétent, l’ESCMID recommande une céphalosporine de troisième génération associée au métronidazole. Les directives locales du Spital Thurgau AG, datées du 19août 2026, précisent ceftriaxone 2 g deux fois par jour IV et métronidazole 500 mg trois fois par jour IV. Ces doses sont un exemple de protocole hospitalier suisse ; elles ne dispensent pas de vérifier produit, fonctions d’organe et protocole de l’établissement. Les différences avec les notices exactes sont exposées en Pharmacologie.</p><p>Après neurochirurgie, le même guide suisse propose céfépime 2 g trois fois par jour IV et vancomycine 20 mg/kg toutes les 12 heures IV. L’ESCMID propose pour l’abcès postopératoire méropénème associé à vancomycine ou linézolide. Ces versions ne sont pas fusionnées : écologie locale, terrain et documentation microbiologique conduisent l’équipe à choisir. Une immunodépression sévère élargit encore le raisonnement ; l’ajout de triméthoprime-sulfaméthoxazole et voriconazole décrit par ESCMID reste une décision spécialisée, sans dose inventée ici.</p><p><button class="w" data-k="g06-duree">Durée cérébrale : distinguer aspiration, excision et exceptions</button></p><div class="key"><b>À retenir.</b> Un protocole local donne un point de départ ; les prélèvements, le terrain et la tolérance déterminent son adaptation.</div><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r5">[5]</button> · <button class="w" data-k="g06-r6">[6]</button> · <button class="w" data-k="g06-r11">[11]</button> · <button class="w" data-k="g06-r12">[12]</button> · <button class="w" data-k="g06-r13">[13]</button></p></section><section class="ilot" id="g06-spinal"><h2>Une infection rachidienne exige une décision propre</h2><p>L’IRM doit préciser collection, compression, discite ou atteinte osseuse. Les hémocultures précèdent si possible l’antibiotique ; le sepsis impose de traiter rapidement après prélèvement sans délai dangereux. Si le patient est stable et le prélèvement tissulaire nécessaire, la séquence se discute avec les équipes. Le consensus EANS porte sur la spondylodiscite de novo non spécifique chez l’adulte : il éclaire ce contexte, pas toutes les formes G06.1.</p><p>Un déficit nouveau, une faiblesse radiculaire inférieure à 4/5, des signes médullaires ou une dysfonction vésicosphinctérienne neurogène sont des arguments de décompression dans ce consensus. Pour un empyème épidural avec déficit, l’indication est claire. En l’absence de déficit, les experts ne se sont pas accordés sur une opération presque systématique. Une stratégie conservatrice éventuelle exige sélection et surveillance spécialisées ; elle ne signifie pas que la collection est bénigne.</p><p>Le guide Spital Thurgau 2026 indique co-amoxicilline 2,2 g quatre fois par jour IV pour l’abcès épidural spontané et céfépime plus vancomycine en postopératoire. La co-amoxicilline 2,2 g contient 2 g d’amoxicilline et 200 mg de clavulanate : ne pas remplacer mécaniquement par deux flacons de 1,2 g. L’antibiogramme, la fonction rénale et l’avis infectiologique modifient le traitement. Les durées de 6ou 12 semaines du consensus EANS concernent des catégories de spondylodiscite, avec une phase IV initiale ; elles ne sont ni une durée universelle de tout abcès spinal ni la règle cérébrale 6–8 semaines.</p><div class="key"><b>À retenir.</b> Ne pas transposer le traitement cérébral au rachis, ni la spondylodiscite de novo aux infections postopératoires ou intramédullaires rares.</div><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r10">[10]</button> · <button class="w" data-k="g06-r11">[11]</button> · <button class="w" data-k="g06-r13">[13]</button></p></section><section class="ilot" id="g06-adjuvants"><h2>Œdème, crises et foyers associés : garder une indication explicite</h2><p>Les corticoïdes ne sont pas un traitement systématique de tout abcès cérébral. L’ESCMID les recommande devant un œdème périfocal sévère ou une menace d’engagement. La dose et la durée ne sont pas uniformisées par les passages lus ; elles doivent être prescrites par l’équipe selon l’état clinique. Une amélioration sous corticoïde ne prouve pas que la lésion est non infectieuse.</p><p>Le même guide déconseille la prophylaxie antiépileptique primaire habituelle, avec une recommandation conditionnelle et un niveau de preuve très faible. Une crise réellement survenue doit être prise en charge selon son contexte ; l’absence d’indication de prophylaxie n’est pas une consigne de laisser une crise sans traitement. Les interactions comptent : le méropénème peut faire chuter fortement le valproate, ce qui impose de revoir l’association plutôt que d’augmenter simplement le valproate.</p><p>Le contrôle du foyer comprend le traitement des sources dentaires, ORL, cardiaques ou liées à un matériel lorsque indiquées. Pour le rachis, une instabilité ou une destruction osseuse peut participer à la décision chirurgicale. Le repos strict au lit n’est pas une règle générale du consensus EANS ; la mobilisation et l’éventuel corset sont individualisés. Les limitations fonctionnelles nécessitent rééducation et adaptation de la vie quotidienne.</p><div class="key"><b>À retenir.</b> Chaque traitement associé doit répondre à une complication ou à un risque identifié ; ni corticoïde ni antiépileptique ne devient automatique par le seul diagnostic.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r12">[12]</button></p></section><section class="ilot" id="g06-complications"><h2>Anticiper les complications et les séquelles</h2><p>Un abcès cérébral peut se compliquer d’une rupture dans les ventricules ou les espaces sous-arachnoïdiens, avec méningite fulminante et dégradation rapide. Une obstruction de la circulation du liquide peut nécessiter une prise en charge de l’hydrocéphalie ; les gestes relèvent de l’équipe neurochirurgicale. La proximité ventriculaire et une lésion multiloculaire comptent dans l’évaluation, sans constituer seules un score universel de rupture.</p><p>Les complications comprennent aussi effet de masse, engagement, crises et déficits persistants. Une épilepsie peut apparaître au cours du suivi ; cette possibilité ne modifie pas la recommandation contre une prophylaxie primaire habituelle. Le pronostic dépend du territoire, de la gravité initiale, de l’agent, du contrôle du foyer et du terrain. Les proportions de récupération d’une petite série ancienne ne prédisent pas l’issue individuelle.</p><p>Au rachis, une compression peut laisser des séquelles motrices, sensitives ou vésicosphinctériennes ; une atteinte osseuse peut ajouter une instabilité ou une déformation. La surveillance clinique et la rééducation s’organisent à partir des déficits réels. La récupération neurologique et le contrôle microbiologique sont deux résultats distincts : une infection contrôlée peut laisser un handicap qui nécessite un suivi prolongé.</p><div class="key"><b>À retenir.</b> Prévenir une aggravation immédiate et préparer le suivi fonctionnel ; ni amélioration radiologique ni stérilisation ne garantit une récupération complète.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r7">[7]</button></p></section><section class="ilot" id="g06-suivi"><h2>Suivre la clinique, les images et la toxicité</h2><p>Le suivi documente douleur, vigilance, déficit, crises, autonomie et tolérance. Une aggravation impose une imagerie cérébrale immédiate et une réévaluation du drainage et de l’antibiothérapie. Après aspiration ou excision, l’ESCMID décrit une surveillance radiologique régulière, par exemple toutes les deux semaines selon le contexte. Une absence de réduction importante pendant les premières semaines ne suffit pas à conclure à un échec ; une aggravation, une augmentation ou l’absence d’amélioration vers quatre semaines doit faire rediscuter le prélèvement et le contrôle du foyer.</p><p>Un rehaussement résiduel peut persister trois à six mois. Il ne justifie pas, à lui seul, de prolonger les antibiotiques jusqu’à disparition complète. L’inverse est également vrai : une image partiellement améliorée ne suffit pas à arrêter un traitement si le patient se détériore. Pour la spondylodiscite, douleur et CRP sont suivies ; les anomalies IRM peuvent persister au-delà de l’amélioration clinique et les rythmes proposés par l’EANS ne sont pas transposables à toutes les collections.</p><p>La surveillance du traitement associe fonctions rénale et hépatique, hémogramme selon les molécules et la durée, concentrations lorsque nécessaires, recherche de neurotoxicité et de troubles auditifs sous vancomycine. Une nouvelle confusion sous céfépime ou une ataxie sous métronidazole impose une évaluation médicamenteuse ; l’équipe doit simultanément considérer une progression infectieuse, une crise ou une complication structurale. Après la phase aiguë, déficits, cognition et autonomie guident la rééducation.</p><div class="key"><b>À retenir.</b> L’évolution clinique prime sur une image isolée ; le traitement prolongé doit être justifié et surveillé, pas reconduit mécaniquement.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r5">[5]</button> · <button class="w" data-k="g06-r6">[6]</button> · <button class="w" data-k="g06-r10">[10]</button> · <button class="w" data-k="g06-r11">[11]</button> · <button class="w" data-k="g06-r13">[13]</button></p></section><section class="ilot" id="g06-situations"><h2>Adapter la prise en charge sans extrapoler la dose adulte</h2><p>Les exemples chiffrés de cette leçon concernent l’adulte hospitalisé, avec fonctions d’organe compatibles et après validation du protocole. Ils ne constituent pas des doses pédiatriques. L’ESCMID inclut enfants et adultes, mais l’âge, le poids et les formulations changent la prescription. La présence d’un tableau pédiatrique dans une notice ne démontre pas une dose adulte d’abcès cérébral : c’est notamment un piège de lecture du méropénème.</p><p>L’insuffisance rénale exige une attention particulière au céfépime, à la vancomycine, au méropénème et à la co-amoxicilline. La ceftriaxone a elle aussi une limite de dose dans l’insuffisance rénale très sévère et la dialyse selon la notice Labatec lue. Une atteinte hépatique sévère modifie la gestion du métronidazole. Chez la personne âgée, fonction rénale réelle, interactions et cognition sont à réévaluer ; l’âge seul ne fournit pas un schéma sûr.</p><p>Grossesse et allaitement nécessitent une concertation infectiologique et obstétricale tenant compte du danger de l’infection et du produit précis. La notice Metronidazol i.v. B. Braun contre-indique le premier trimestre. Les notices Labatec de ceftriaxone et co-amoxicilline ainsi que celle de vancomycine portent des restrictions propres à la grossesse et à l’allaitement ; elles ne sont pas remplacées par une affirmation générale de sécurité de classe. Aucun schéma unique grossesse G06 n’est inventé.</p><p>Les droits aux prestations, la déclaration obligatoire, l’assurance-accidents, le remboursement et l’aptitude à conduire ne peuvent pas être déduits du seul code G06. Les sources administratives spécifiques n’ont pas été suffisamment établies dans cette recherche : demander l’évaluation pertinente selon l’agent causal, les crises, les déficits et la situation professionnelle. Cette limite ne signifie pas absence d’obligation ou de couverture.</p><div class="key"><b>À retenir.</b> Nommer la population et le produit avant le chiffre ; une lacune administrative ou une adaptation non vérifiée reste explicite.</div><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r5">[5]</button> · <button class="w" data-k="g06-r6">[6]</button> · <button class="w" data-k="g06-r10">[10]</button> · <button class="w" data-k="g06-r11">[11]</button> · <button class="w" data-k="g06-r12">[12]</button> · <button class="w" data-k="g06-r13">[13]</button></p></section><section class="ilot" id="g06-criteres"><h2>Critères formels et paramètres utiles : dire aussi ce qui manque</h2><div class="alert"><b>Diagnostic et certitude.</b> Aucun critère numérique unique ne valide toutes les catégories G06. Associer syndrome compatible, localisation à l’imagerie et preuve microbiologique ou histopathologique lorsque obtenue. Distinguer lésion probable et agent confirmé. Une couronne de contraste ne suffit pas à définir l’étiologie ; un granulome ne prouve ni tuberculose ni maladie inflammatoire. Les sous-codes suivent le territoire et les exclusions causales, pas la dose choisie.</div><table class="t"><thead><tr><th>Paramètre</th><th>Portée exacte</th></tr></thead><tbody><tr><td>Force 0à 5</td><td>Échelle clinique ordinale ; déficit nouveau et sphincters ont une portée urgente indépendamment du score isolé.</td></tr><tr><td>Prélèvement rapide, de préférence<24h</td><td>Option de bref report antibiotique seulement chez patient cérébral sélectionné non grave.</td></tr><tr><td>6–8 semaines IV</td><td>Proposition ESCMID pour abcès cérébral aspiré ou traité conservativement, hors schémas spécifiques.</td></tr><tr><td>3–6 mois</td><td>Persistance possible du rehaussement résiduel, pas objectif automatique de durée antibiotique.</td></tr><tr><td>Deux fois 2 g de ceftriaxone et trois fois 500 mg de métronidazole/j</td><td>Exemple local Spital Thurgau 2026, différent de certains rythmes des FI exactes.</td></tr><tr><td>ClCr et concentrations</td><td>Mesures nécessaires aux adaptations ; ne pas confondre seuils propres aux produits.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Pour l’examen : reconnaître la collection, localiser le danger, éviter une PL de routine, choisir l’imagerie, obtenir une preuve et organiser le contrôle du foyer. Relier céphalée, cognition, parésie, sensibilité et crises aux situations PROFILES ; aucun automatisme de 24 heures, de taille ou de dose. </div><button class="pareto-btn ui" data-k="pareto-g06-path">▲ Loi de Pareto — Territoire, gravité et contrôle du foyer</button><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r9">[9]</button> · <button class="w" data-k="g06-r14">[14]</button> · <button class="w" data-k="g06-r15">[15]</button> · <button class="w" data-k="g06-r17">[17]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="g06-e-imagerie"><h2>Choisir l’imagerie qui répond au territoire suspect</h2><p>Pour l’abcès cérébral, demander une IRM avec diffusion, carte de coefficient apparent de diffusion et séquences T1 avant/après contraste. La diffusion explore le comportement de l’eau dans la lésion ; la concordance avec le signal, le contraste et la clinique oriente vers une collection purulente. Elle ne donne ni l’antibiogramme ni une exclusion absolue de toutes les tumeurs. Le scanner injecté est une alternative lorsque l’IRM n’est pas disponible ; il ne doit pas retarder la prise en charge d’un patient instable.</p><p><button class="w" data-k="g06-irm">Diffusion, contraste et localisation : trois informations différentes</button></p><p>Pour la spondylodiscite de novo, l’EANS recommande l’IRM de la région suspecte avec et sans contraste. Une IRM de tout le rachis peut être envisagée selon l’histoire, la suspicion multifocale et les ressources, mais n’a obtenu que 77% d’accord, donc pas de consensus. Le scanner ciblé peut compléter l’analyse de destruction osseuse ; il ne remplace pas l’IRM de la compression neurologique.</p><div class="key"><b>À retenir.</b> Prescrire l’IRM avec une question clinique et un territoire, puis lire séparément lésion, effet de masse et hypothèse causale.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r8">[8]</button></p></section><section class="ilot" id="g06-e-prelevement"><h2>Prélever pour identifier, sans retarder les soins urgents</h2><p>Prélever les hémocultures avant l’antibiothérapie lorsque cela ne crée pas un délai dangereux. Lors d’une aspiration ou d’une exérèse, organiser avec le laboratoire les cultures aérobies et anaérobies et l’examen histopathologique. Les analyses ciblées, notamment mycobactériennes, dépendent de l’exposition et du terrain. Préserver du matériel supplémentaire peut permettre d’élargir les recherches si la cause reste inconnue.</p><table class="t"><thead><tr><th>Prélèvement / examen</th><th>Question</th><th>Limite</th></tr></thead><tbody><tr><td>Hémocultures</td><td>Bactériémie et agent possible.</td><td>Un résultat négatif n’exclut pas une infection focale.</td></tr><tr><td>Pus ou tissu</td><td>Agent, histologie, autre diagnostic.</td><td>Antibiotiques préalables et conditions de transport peuvent diminuer le rendement.</td></tr><tr><td>Méthodes moléculaires</td><td>Cause non identifiée par culture.</td><td>Cibles et contamination à discuter avec le laboratoire.</td></tr><tr><td>CRP, leucocytes, procalcitonine</td><td>Inflammation et suivi contextualisé.</td><td>Ne peuvent exclure ni confirmer seuls un abcès cérébral.</td></tr><tr><td>Bilan rénal/hépatique/hématologique</td><td>Tolérance et adaptation avant traitement prolongé.</td><td>Aucun seuil « normal » universel ne remplace le laboratoire et le patient.</td></tr></tbody></table><p>Dans une spondylodiscite sans hémoculture positive, une biopsie ciblée est discutée si la documentation manque et qu’aucune chirurgie immédiate n’est prévue. La séquence dépend de la gravité et des possibilités de prélèvement. Pour une infection postopératoire, tenir compte des prélèvements anciens et de leur pertinence sans les considérer automatiquement comme l’agent actuel.</p><div class="key"><b>À retenir.</b> Le prélèvement doit être pertinent et exploitable ; un examen négatif après traitement ne met pas fin au raisonnement.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r5">[5]</button> · <button class="w" data-k="g06-r6">[6]</button> · <button class="w" data-k="g06-r10">[10]</button> · <button class="w" data-k="g06-r11">[11]</button> · <button class="w" data-k="g06-r13">[13]</button></p></section><section class="ilot" id="g06-e-pl"><h2>La ponction lombaire n’est pas le prélèvement de routine d’un abcès cérébral</h2><p><button class="w" data-k="g06-pl">Pourquoi la PL est généralement évitée dans cette situation</button></p><p>Ne pas chercher à confirmer une image évocatrice par une PL réflexe avant discussion spécialisée. Une absence de signes méningés ne diminue pas le besoin d’imagerie devant une focalisation. De même, un syndrome méningé associé à un déficit ou à une vigilance altérée impose de considérer une complication ou une lésion focale, au-delà du diagnostic de méningite simple.</p><div class="key"><b>À retenir.</b> Le prélèvement le plus facile n’est pas nécessairement le plus sûr ni le plus informatif.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r16">[16]</button></p></section><section class="ilot" id="g06-e-foyer"><h2>Explorer le foyer et réévaluer en fonction des résultats</h2><p>L’examen ORL et dentaire est particulièrement utile lorsqu’une porte d’entrée voisine ou des germes oraux sont suspectés. Une bactériémie appelle une recherche de foyer adaptée à l’agent et au contexte. L’échographie transœsophagienne n’est pas automatique chez tous : le guide européen la réserve notamment à certaines bactériémies monomicrobiennes à streptocoque ou staphylocoque sans autre facteur évident. Les examens doivent avoir une conséquence prévisible sur le traitement ou le contrôle du foyer.</p><p>Pour la spondylodiscite, le consensus EANS envisage une recherche de source cardiaque, cutanée, dentaire ou autre selon le cas ; une tomographie par émission de positons peut être pertinente dans une question sélectionnée, pas comme routine identique chez tous. La recherche de multifocalité dépend de l’histoire et des données disponibles. Le fait qu’une source ne soit pas immédiatement trouvée n’annule pas une collection documentée.</p><p>Répéter les examens doit répondre à une question : aggravation, contrôle de drainage, réponse insuffisante, toxicité ou recherche de cause restée inconnue. Une nouvelle imagerie urgente est nécessaire en cas de détérioration, alors qu’un contrôle programmé d’un patient qui va mieux se planifie avec l’équipe. Une prise de contraste persistante et une CRP isolée doivent être interprétées dans l’ensemble clinique.</p><div class="key"><b>À retenir.</b> Chaque examen doit préciser ce qui changerait si le résultat était positif ou négatif.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button></p></section><section class="ilot" id="g06-e-cas"><h2>Quatre décisions cliniques à expliquer</h2><div class="quiz ui" id="g06-q1"><p><b>Cas pédagogique fictif 1.</b> Une lésion cérébrale évocatrice d’abcès est découverte chez un patient en sepsis avec aggravation de vigilance. Le prélèvement opératoire est envisagé demain. Quelle conduite est adaptée ?</p><button data-ok="0">Attendre 24 heures pour améliorer les cultures.</button><button data-ok="1">Prélever rapidement sans délai dangereux, traiter et organiser le contrôle du foyer en urgence.</button><button data-ok="0">Réaliser une PL avant toute décision.</button><p class="fb" hidden>Le bref report décrit par ESCMID concerne une sélection sans maladie grave et un prélèvement rapide ; il ne s’applique pas au sepsis ou à une menace neurologique. <p>Sources : <button class="w" data-k="g06-r2">[2]</button></p></p></div><div class="quiz ui" id="g06-q2"><p><b>Cas pédagogique fictif 2.</b> Une personne a une douleur rachidienne inhabituelle après un épisode infectieux. Elle n’a pas de fièvre mesurée, mais présente une faiblesse récente et une rétention urinaire. Que faire ?</p><button data-ok="0">Exclure l’abcès parce que la triade est incomplète.</button><button data-ok="1">Organiser une évaluation urgente avec IRM et avis rachidien/chirurgical.</button><button data-ok="0">Attendre une CRP élevée avant d’imager.</button><p class="fb" hidden>Un déficit nouveau et un trouble vésicosphinctérien modifient l’urgence. Fièvre absente et bilan inflammatoire peu marqué ne dispensent pas de l’évaluation. <p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r7">[7]</button></p></p></div><div class="quiz ui" id="g06-q3"><p><b>Cas pédagogique fictif 3.</b> Après un abcès cérébral aspiré et traité, la clinique s’améliore mais un rehaussement résiduel persiste. Quelle interprétation est correcte ?</p><button data-ok="0">Prolonger automatiquement jusqu’à disparition complète du contraste.</button><button data-ok="1">Intégrer clinique, agent, drainage et calendrier ; le rehaussement peut persister plusieurs mois.</button><button data-ok="0">Arrêter immédiatement tout antibiotique dès amélioration.</button><p class="fb" hidden>Un rehaussement peut persister 3–6 mois et ne décide pas seul la durée. Le schéma 6–8 semaines est contextualisé, et toute aggravation impose une nouvelle évaluation. <p>Sources : <button class="w" data-k="g06-r2">[2]</button></p></p></div><div class="quiz ui" id="g06-q4"><p><b>Cas pédagogique fictif 4.</b> Sous céfépime, un patient âgé dont la fonction rénale se dégrade devient confus avec myoclonies. Quelle démarche est justifiée ?</p><button data-ok="0">Attribuer la confusion uniquement à l’abcès.</button><button data-ok="1">Rechercher à la fois toxicité médicamenteuse, crise et complication infectieuse ; réviser traitement et imagerie selon la clinique.</button><button data-ok="0">Augmenter systématiquement la dose de céfépime.</button><p class="fb" hidden>La notice décrit une neurotoxicité du céfépime favorisée par le rein et l’âge. Ce signal ne permet pas d’exclure une progression de l’infection ou une complication. <p>Sources : <button class="w" data-k="g06-r11">[11]</button> · <button class="w" data-k="g06-r2">[2]</button></p></p></div><button class="pareto-btn ui" data-k="pareto-g06-exam">▲ Loi de Pareto — Une question pour chaque examen</button><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r11">[11]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="g06-tab-semio" role="tab" aria-selected="true" aria-controls="g06-s-semio" data-s="g06-s-semio">Sémiologie fondamentale et analytique</button><button id="g06-tab-anat" role="tab" aria-selected="false" aria-controls="g06-s-anat" data-s="g06-s-anat">Anatomie et localisation</button><button id="g06-tab-physio" role="tab" aria-selected="false" aria-controls="g06-s-physio" data-s="g06-s-physio">Physiologie et perturbations</button><button id="g06-tab-histo" role="tab" aria-selected="false" aria-controls="g06-s-histo" data-s="g06-s-histo">Histologie et immunité</button><button id="g06-tab-micro" role="tab" aria-selected="false" aria-controls="g06-s-micro" data-s="g06-s-micro">Microbiologie et preuves</button><button id="g06-tab-pk" role="tab" aria-selected="false" aria-controls="g06-s-pk" data-s="g06-s-pk">Pharmacocinétique et sécurité</button></div><div class="chap-body sci-body"><div class="sci" id="g06-s-semio" role="tabpanel" aria-labelledby="g06-tab-semio"><section class="ilot" id="g06-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>La sémiologie relie une fonction normale à une anomalie observée, puis à une décision. En situation normale, les voies motrices permettent un mouvement volontaire coordonné, les voies sensitives transmettent une information située et la vigilance permet une interaction cohérente. Les enveloppes et le parenchyme sont distincts : une collection hors du tissu nerveux peut pourtant en perturber la fonction par compression. Une anomalie neurologique n’indique donc pas toujours le lieu exact du pus, mais elle précise le territoire à explorer.</p><p>Le point de départ est un état de référence : langage, conscience, force par groupes musculaires, sensibilité et fonction vésicosphinctérienne. Comparer les côtés et l’évolution est plus informatif qu’écrire seulement « neurologie normale ». La plainte de douleur ou de céphalée est un signal à analyser ; elle ne localise pas à elle seule l’agent. La normalité clinique et les valeurs biologiques doivent être distinguées : une CRP dans l’intervalle du laboratoire ne signifie pas que tout tissu est indemne d’infection.</p><div class="key"><b>À retenir.</b> Décrire la fonction attendue, l’écart observé et son évolution ; l’examen n’est pas une simple liste de signes positifs.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r14">[14]</button> · <button class="w" data-k="g06-r18">[18]</button> · <button class="w" data-k="g06-r19">[19]</button></p></section><section class="ilot" id="g06-semio-signs" data-semiology="signs"><h3>Décrire les symptômes et les signes sans exiger une triade</h3><p>Les symptômes rapportés comprennent céphalée, douleur rachidienne, faiblesse, troubles sensitifs, vomissements ou changements cognitifs. Les signes examinés comprennent déficit moteur, asymétrie, trouble du langage, altération de conscience et anomalie vésicosphinctérienne. Une crise est un événement clinique important dont il faut préciser la description et la récupération. Dans l’infection focale cérébrale, la fièvre peut être inconstante ; dans l’abcès épidural spinal, la douleur peut précéder le déficit.</p><p>La distinction symptôme/signe évite de confondre « se sent faible » et une force objectivement diminuée. Les deux informations comptent, mais la seconde exige un examen reproductible. Décrire territoire et tempo : une faiblesse progressive d’une jambe avec trouble sphinctérien ne se résume pas à une fatigue générale. La cohorte bâloise illustre des présentations incomplètes, sans fournir une sensibilité universelle de chaque signe. L’absence de douleur très intense, de fièvre ou de raideur ne clôt pas une suspicion fondée.</p><div class="key"><b>À retenir.</b> Une combinaison incomplète peut être grave ; l’évolution et la focalisation comptent plus qu’une triade récitée.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r7">[7]</button> · <button class="w" data-k="g06-r16">[16]</button></p></section><section class="ilot" id="g06-semio-mechanisms" data-semiology="mechanisms"><h3>Relier le mécanisme au signe, sans déduire trop vite la cause</h3><p>Une infection focale produit inflammation, lésion locale et parfois œdème. Une atteinte des voies motrices peut se manifester par une parésie ; l’irritation d’un territoire cortical peut s’accompagner de crises. L’augmentation de volume et la compression peuvent aggraver les fonctions au-delà du seul centre de la collection. Dans le canal rachidien, une collection extramédullaire peut perturber moelle ou racines, avec faiblesse, trouble sensitif ou dysfonction sphinctérienne.</p><p>Ces relations expliquent le signe, sans identifier automatiquement la bactérie. Une tumeur ou une autre lésion compressive peut affecter les mêmes voies. De même, une réponse inflammatoire granulomateuse ne produit pas un signe exclusivement spécifique : son siège et son volume déterminent une part de la présentation. Le mécanisme doit guider la localisation et l’imagerie, puis la cause doit être documentée séparément.</p><figure id="g06-science-links-semio"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g06-diag-semio"><title id="g06-diag-semio">Fonction perturbée puis Territoire à préciser puis Imagerie et décision</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Fonction perturbée</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Territoire à préciser</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Imagerie et décision</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Parésie ou trouble sensitif → territoire</td><td>La voie atteinte guide l’examen, sans identifier à elle seule le siège exact de la collection.</td></tr><tr><td>Territoire et aggravation → examen urgent</td><td>La compression possible impose une décision avant la triade complète.</td></tr><tr><td>Image et prélèvement → cause</td><td>La preuve morphologique ne remplace pas la microbiologie ou l’histologie.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r9">[9]</button> · <button class="w" data-k="g06-r19">[19]</button></p></section><section class="ilot" id="g06-semio-examination" data-semiology="examination"><h3>Examiner et mesurer de manière reproductible</h3><p>Tester un mouvement isolé en limitant les compensations, comparer les côtés et noter douleur ou coopération. L’échelle du Medical Research Council comporte six grades de 0à 5 : absence de contraction, ébauche, mouvement pesanteur supprimée, contre pesanteur, contre résistance, puis force normale. Le grade 4 n’est pas une quantité unique de force ; la comparaison dans le même contexte importe. Les contrôles doivent répéter des muscles et territoires comparables.</p><p>Compléter par conscience, langage, nerfs crâniens, sensibilité et signes médullaires ou radiculaires selon le cas. Rechercher explicitement les troubles urinaires et intestinaux nouveaux lorsqu’une atteinte rachidienne est possible. Une évaluation longue ne doit pas retarder l’IRM et l’avis urgent d’un patient qui se dégrade. La fiche doit distinguer un signe absent, un examen non réalisable et un résultat incertain. L’attribution MRC officielle figure dans la fenêtre de force ; le contenu est une paraphrase française, sans reproduction des planches du manuel.</p><div class="key"><b>À retenir.</b> Mesurer pour comparer et décider ; le chiffre ne remplace ni l’anatomie fonctionnelle ni le tempo.</div><p>Sources : <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r14">[14]</button> · <button class="w" data-k="g06-r16">[16]</button></p></section><section class="ilot" id="g06-semio-interpretation" data-semiology="interpretation"><h3>Interpréter un résultat avec sa probabilité et ses limites</h3><p>Une lésion compatible à l’IRM augmente la probabilité d’un abcès dans le contexte approprié. Une culture pertinente ou un tissu peut en préciser la cause. À l’inverse, une culture négative après antibiotique ne suffit pas à exclure une infection. La diffusion et le rehaussement se lisent ensemble avec les autres séquences et la clinique. L’interprétation doit dire ce qui est probable et ce qui reste inconnu.</p><p>Les leucocytes, la CRP et la procalcitonine ne peuvent ni confirmer ni exclure seuls un abcès cérébral dans le guide ESCMID. Il n’existe donc pas ici de seuil biologique « rassurant » applicable à tous. Dans la spondylodiscite, la CRP sert notamment au suivi et les leucocytes peuvent être normaux. Un examen neurologique conservé à un moment donné ne garantit pas l’absence d’une collection ni la stabilité future ; il sert de référence pour la surveillance.</p><div class="key"><b>À retenir.</b> Un résultat n’est pas une conclusion autonome. Préciser contexte, moment, technique et conséquence pour le patient.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r8">[8]</button></p></section><section class="ilot" id="g06-semio-differentials" data-semiology="differentials"><h3>Comparer les mécanismes qui produisent le même signe</h3><p>Une parésie peut résulter d’une infection, d’une tumeur ou d’une autre lésion du système nerveux. Une couronne de rehaussement peut être infectieuse ou tumorale. Une atteinte granulomateuse peut être infectieuse ou non. L’examen organise ces hypothèses par territoire et tempo, mais ne les sépare pas toujours. La preuve utile dépend de l’alternative qui changerait la conduite : tissu, culture, séquences d’imagerie ou recherche d’agent ciblée.</p><p>Sous traitement, une nouvelle ataxie ou confusion peut correspondre à une toxicité, notamment du métronidazole ou du céfépime, mais aussi à une complication de l’infection ou à une crise. L’existence d’un effet indésirable connu ne permet pas d’ignorer une aggravation structurale. Examiner, vérifier la fonction rénale et la chronologie, revoir le traitement puis imager selon le tableau est une démarche cohérente. La comparaison doit déboucher sur une action, pas une liste sans hiérarchie.</p><div class="key"><b>À retenir.</b> Le même signe peut avoir plusieurs mécanismes ; rechercher le test ou la décision qui les distingue utilement.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r6">[6]</button> · <button class="w" data-k="g06-r9">[9]</button> · <button class="w" data-k="g06-r11">[11]</button></p></section><section class="ilot" id="g06-semio-urgency" data-semiology="urgency"><h3>Transformer la sémiologie de gravité en action</h3><p>Aggravation de vigilance, menace d’engagement, sepsis, nouveau déficit ou troubles sphinctériens imposent une réponse rapide. La prise en charge associe stabilisation, imagerie et concertation chirurgicale/anti-infectieuse. Pour un empyème épidural avec déficit dans le périmètre EANS, la décompression est clairement indiquée. Pour l’empyème sous-dural intracrânien, le risque d’extension rapide justifie l’urgence neurochirurgicale.</p><p>Le report antibiotique envisagé par ESCMID avant prélèvement n’est possible que chez un patient sélectionné sans maladie grave et si l’aspiration ou l’excision est rapidement faisable. La préférence pour un prélèvement dans les 24 heures n’autorise pas 24 heures d’inaction. Un changement de l’examen doit faire réviser la sélection immédiatement. Documenter les heures de symptômes, d’examens et de traitement facilite la continuité des soins.</p><div class="key"><b>À retenir.</b> La sémiologie est utile lorsqu’elle déclenche la bonne action ; une règle de calendrier ne doit pas neutraliser une aggravation.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r4">[4]</button></p></section><section class="ilot" id="g06-semio-limits" data-semiology="limits"><h3>Connaître ce que l’examen et les sources ne prouvent pas</h3><p>Aucun signe isolé, aucune valeur de CRP et aucun anneau de contraste ne couvre toutes les formes G06. Les patients immunodéprimés, âgés ou déjà traités peuvent avoir une présentation moins typique. Douleur, fatigue et coopération influencent l’examen. Les séries hospitalières sélectionnées ne fournissent pas automatiquement une sensibilité ou un pronostic utilisable dans toute consultation.</p><p>Les sources de cette leçon sont ciblées et de portée différente : guide européen cérébral, protocole suisse local, consensus de spondylodiscite de novo, cohorte ancienne et revue de granulomes. Les formes intramédullaires ou sous-durales spinales rares n’ont pas dans ces lectures un protocole uniforme démontré. La source DGN 2021 est échue et limitée à des extraits réellement lus ; elle ne remplace pas les recommandations actuelles de traitement. Ces bornes sont des raisons de préciser la décision spécialisée, pas d’inventer une règle.</p><div class="key"><b>À retenir.</b> Nommer une limite permet de garder une décision proportionnée ; cela n’annule pas une urgence clinique.</div><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r4">[4]</button> · <button class="w" data-k="g06-r7">[7]</button> · <button class="w" data-k="g06-r9">[9]</button></p></section><section class="ilot" id="g06-semio-sources" data-semiology="sources"><h3>Retrouver les passages qui soutiennent l’analyse</h3><p>Les sources principales de la sémiologie sont l’ESCMID pour l’abcès cérébral, l’EANS pour le territoire rachidien dans son périmètre et le manuel officiel du Medical Research Council pour la force. La cohorte bâloise et le support du Collège de neurologie complètent les présentations. Les deux originaux historiques illustrent l’anatomie normale et non une lésion réelle.</p><p>Liens directs : <a href="https://vbn.aau.dk/ws/portalfiles/portal/649326266/Bodilsen_et_al._2024_._European_society_of_Clinical_Microbiology_and_Infectious_Diseases_guidelines_on_diagnosis_and_treatment_of_brain_abscess_in_children_and_adults.pdf" target="_blank" rel="noopener noreferrer">ESCMID 2024, tableau 1 et pratique générale</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11763570/" target="_blank" rel="noopener noreferrer">EANS, tableaux 1–2 et 4–5</a> ; <a href="https://www.ukri.org/councils/mrc/facilities-and-resources/find-an-mrc-facility-or-resource/mrc-muscle-scale/" target="_blank" rel="noopener noreferrer">MRC, source officielle de l’échelle</a>.</p><p>Les fiches numérotées donnent les sections, populations, versions et limites réellement lues. Elles distinguent la date de lecture de la date de téléchargement ou d’acquisition du service. Une lecture ciblée n’est pas présentée comme une lecture intégrale, et une auto-relecture ne constitue pas une certification humaine.</p><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r7">[7]</button> · <button class="w" data-k="g06-r14">[14]</button> · <button class="w" data-k="g06-r16">[16]</button> · <button class="w" data-k="g06-r18">[18]</button> · <button class="w" data-k="g06-r19">[19]</button></p></section><p><b>Science → clinique.</b> Le déficit et son évolution localisent une fonction menacée, même sans fièvre.</p><p><b>Science → examen.</b> Comparer l’examen répété à l’IRM et aux prélèvements ; un marqueur normal ne suffit pas à exclure.</p><p><b>Science → traitement.</b> La gravité déclenche traitement et contrôle du foyer sans attente arbitraire.</p></div><div class="sci" id="g06-s-anat" role="tabpanel" aria-labelledby="g06-tab-anat" hidden><section class="ilot" id="g06-s-anatomie"><h2>Enveloppes et voies : comprendre ce qui peut être comprimé</h2><p>La dure-mère, l’arachnoïde et la pie-mère sont des enveloppes distinctes. L’original de Gray montre leur rapport au crâne et au sinus sagittal supérieur. Il permet de distinguer le tissu cérébral des compartiments méningés sans dessiner une anatomie artificielle. L’espace sous-dural se situe entre dure-mère et arachnoïde ; une collection y est différente d’un abcès du parenchyme. La planche ne représente pas de pus et ne montre pas le rachis.</p><figure><img src="assets/img/g06/alpha/codex/Gray1196.png" alt="Rapports normaux des enveloppes crâniennes et du sinus sagittal supérieur" loading="lazy"><figcaption>Rapports normaux des enveloppes crâniennes et du sinus sagittal supérieur. Gray, <i>Anatomy of the Human Body</i>, 1918, illustrations attribuées à Henry Vandyke Carter ; domaine public. Original humain historique, pixels inchangés, repères français dans le tableau adjacent.</figcaption><table class="t"><thead><tr><th>Repère de l’original</th><th>Annotation française et portée clinique</th></tr></thead><tbody><tr><td>Cranial bone</td><td>Os crânien ; repère pour distinguer une collection située sous l’os d’une lésion du parenchyme.</td></tr><tr><td>Dura mater</td><td>Dure-mère, enveloppe externe ; une collection épidurale est extérieure à celle-ci.</td></tr><tr><td>Arachnoid / Pia mater</td><td>Arachnoïde et pie-mère ; le sous-dural est entre dure-mère et arachnoïde, distinct de l’espace contenant le liquide.</td></tr><tr><td>Superior sagittal sinus</td><td>Sinus sagittal supérieur, structure veineuse visible ; la proximité anatomique ne prouve pas une thrombose chez un patient.</td></tr></tbody></table></figure><p>Dans le crâne, une collection épidurale peut être plus limitée, tandis qu’un empyème sous-dural peut se diffuser en nappe. Cette description classique guide la lecture, mais la forme seule ne détermine ni germe ni indication précise. L’imagerie du patient doit décrire l’extension réelle. Dans le canal rachidien, le territoire épidural est hors de la dure-mère ; une collection peut comprimer les structures nerveuses même sans abcès dans la moelle.</p><p>La voie motrice figurée sur la deuxième planche relie cortex, capsule interne, décussation et trajet descendant. Elle aide à expliquer qu’une lésion cérébrale ou une compression médullaire puisse produire une parésie. Le lieu du déficit doit être confronté à tout l’examen ; la planche historique n’est ni une carte opératoire ni un test diagnostique. La comparaison entre motricité, sensibilité et sphincters précise le territoire susceptible d’être menacé.</p><figure><img src="assets/img/g06/alpha/codex/Gray764.png" alt="Trajet moteur normal, planche historique modifiée de Poirier" loading="lazy"><figcaption>Trajet moteur normal, planche historique modifiée de Poirier. Gray, <i>Anatomy of the Human Body</i>, 1918, illustrations attribuées à Henry Vandyke Carter ; domaine public. Original humain historique, pixels inchangés, repères français dans le tableau adjacent.</figcaption><table class="t"><thead><tr><th>Repère de l’original</th><th>Annotation française et portée clinique</th></tr></thead><tbody><tr><td>Motor area of cortex</td><td>Aire motrice corticale ; un territoire cortical atteint peut produire une faiblesse focale et des crises selon le contexte.</td></tr><tr><td>Internal capsule</td><td>Capsule interne ; les fibres regroupées expliquent la possibilité d’un déficit important dans un territoire limité.</td></tr><tr><td>Decussation of pyramids</td><td>Décussation des pyramides ; repère du croisement des voies, à interpréter avec le niveau lésionnel.</td></tr><tr><td>Lateral cerebrospinal fasciculus</td><td>Faisceau corticospinal latéral selon la terminologie actuelle ; une compression médullaire peut perturber la commande descendante.</td></tr></tbody></table></figure><figure id="g06-science-links-anatomie"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g06-diag-anatomie"><title id="g06-diag-anatomie">Compartiment atteint puis Fonction menacée puis Examen du territoire</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Compartiment atteint</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Fonction menacée</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Examen du territoire</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Collection → pression ou lésion</td><td>Le déficit ne requiert pas que le pus soit au centre de la voie motrice.</td></tr><tr><td>Voie motrice → parésie</td><td>Une observation fonctionnelle oriente la localisation, sans démontrer l’infection.</td></tr><tr><td>Territoire → IRM adaptée</td><td>La région suspecte et les signes guident la prescription.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Les originaux montrent le normal ; l’IRM du patient montre l’extension pathologique. Ne pas attribuer aux planches un diagnostic qu’elles ne contiennent pas.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r4">[4]</button> · <button class="w" data-k="g06-r18">[18]</button> · <button class="w" data-k="g06-r19">[19]</button></p></section><p><b>Science → clinique.</b> Une collection hors du parenchyme peut comprimer les voies et donner un déficit.</p><p><b>Science → examen.</b> Les originaux normaux éclairent les compartiments ; l’IRM du patient délimite la lésion réelle.</p><p><b>Science → traitement.</b> Le compartiment et l’extension orientent l’accès chirurgical, sans fournir seuls la molécule.</p></div><div class="sci" id="g06-s-physio" role="tabpanel" aria-labelledby="g06-tab-physio" hidden><section class="ilot" id="g06-s-physio-body"><h2>Une fonction conservée peut se dégrader par inflammation et compression</h2><p>Le mouvement volontaire suppose une commande transmise par des voies intactes et un muscle capable de répondre. L’examen moteur éprouve cette fonction, en tenant compte de la gravité, de la résistance, de la douleur et des compensations. La sensibilité et le contrôle vésicosphinctérien explorent d’autres fonctions du système nerveux. Une force encore normale ne démontre pas qu’il n’existe aucune collection : la perturbation peut être précoce, située ailleurs ou encore compensée.</p><p>Lorsqu’une infection focale évolue, le tissu inflammatoire, le pus et l’œdème peuvent produire une lésion locale ou une compression. La fonction peut se dégrader sans que le diamètre mesuré soit le seul déterminant. Dans le cerveau, effet de masse, rapports ventriculaires et état de conscience ont une portée clinique. Dans le rachis, niveau et extension de la compression modifient les fonctions menacées ; une dysfonction vésicosphinctérienne nouvelle est donc une information essentielle.</p><table class="t"><thead><tr><th>Fonction normale</th><th>Perturbation possible</th><th>Conséquence examinée</th></tr></thead><tbody><tr><td>Commande motrice transmise</td><td>Atteinte de voie motrice par lésion ou compression.</td><td>Force, distribution et évolution du déficit.</td></tr><tr><td>Transmission sensitive cohérente</td><td>Atteinte médullaire ou radiculaire.</td><td>Territoire sensitif, niveau éventuel et concordance.</td></tr><tr><td>Interaction consciente et langage</td><td>Atteinte focale, effet de masse, crise ou trouble systémique.</td><td>Vigilance, attention, langage et changement dans le temps.</td></tr><tr><td>Contrôle vésicosphinctérien</td><td>Atteinte neurologique rachidienne possible.</td><td>Rétention/incontinence nouvelle et contexte, sans conclure sur ce signe seul.</td></tr></tbody></table><p>Les mécanismes sont des ponts vers la décision. Une faiblesse récente doit être localisée, une aggravation doit être reconnue et une cause doit être recherchée. Aucune chaîne physiologique ne permet de remplacer l’imagerie par une hypothèse simple. Une douleur mécanique et une douleur infectieuse peuvent partager des caractères ; les signes neurologiques, l’histoire et les facteurs de risque orientent le degré d’urgence.</p><p>L’œdème explique pourquoi un traitement associé peut être nécessaire devant une menace d’engagement, mais ne justifie pas des corticoïdes systématiques. La recommandation d’ESCMID conserve une indication de gravité. De la même manière, le risque de crise ne justifie pas une prophylaxie primaire habituelle selon ce guide. Un mécanisme plausible n’équivaut pas à un bénéfice démontré de chaque intervention.</p><figure id="g06-science-links-physio"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g06-diag-physio"><title id="g06-diag-physio">Inflammation et volume puis Fonction qui se dégrade puis Décision sans retard</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Inflammation et volume</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Fonction qui se dégrade</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Décision sans retard</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Œdème/collection → dysfonction</td><td>La pression et la lésion peuvent agir au-delà du centre du foyer.</td></tr><tr><td>Examen répété → changement</td><td>Le tempo peut signaler une complication même avant une nouvelle mesure de taille.</td></tr><tr><td>Gravité → traitement ciblé</td><td>Corticoïdes réservés au contexte sévère indiqué, contrôle du foyer à organiser.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Passer du mécanisme au signe puis à l’action, tout en conservant la différence entre plausibilité et recommandation clinique.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r14">[14]</button> · <button class="w" data-k="g06-r16">[16]</button> · <button class="w" data-k="g06-r19">[19]</button></p></section><p><b>Science → clinique.</b> Inflammation, volume et œdème expliquent une dégradation fonctionnelle.</p><p><b>Science → examen.</b> L’examen répété mesure le changement ; l’image évalue effet de masse et compression.</p><p><b>Science → traitement.</b> Corticoïdes réservés à l’indication sévère, pas déduits du seul mécanisme plausible.</p></div><div class="sci" id="g06-s-histo" role="tabpanel" aria-labelledby="g06-tab-histo" hidden><section class="ilot" id="g06-s-histo-body"><h2>Collection purulente et granulome : deux organisations différentes</h2><p>La cérébrite est une infection inflammatoire focale du parenchyme qui peut évoluer vers une collection de pus entourée d’une capsule conjonctive. Cette organisation n’élimine pas l’infection ; une cavité peut rester active et son voisinage peut être œdématié. La capsule visible à l’imagerie n’est pas une preuve histologique complète et le rehaussement ne mesure pas directement la viabilité de chaque agent. Une prise de contraste persistante peut subsister après l’amélioration.</p><p>Le granulome correspond à une réponse inflammatoire organisée associant notamment macrophages et cellules T face à un stimulus persistant. Des formes épithélioïdes, caséeuses, non caséeuses, nécrosantes ou liées à un corps étranger sont décrites. Le motif histologique oriente un diagnostic, mais il n’est pas toujours spécifique. Une cause infectieuse et une maladie inflammatoire peuvent partager des aspects ; le prélèvement doit être interprété avec cultures, techniques ciblées et contexte.</p><table class="t"><thead><tr><th>Observation</th><th>Ce qu’elle apporte</th><th>Ce qu’elle ne démontre pas</th></tr></thead><tbody><tr><td>Pus dans un prélèvement</td><td>Argument direct pour collection purulente, matériel pour microbiologie.</td><td>Agent précis sans identification.</td></tr><tr><td>Capsule et tissu réactionnel</td><td>Organisation locale de la lésion.</td><td>Stérilité ni garantie contre rupture/aggravation.</td></tr><tr><td>Granulome caséeux ou non caséeux</td><td>Orientation morphologique.</td><td>Étiologie certaine sur ce mot seul.</td></tr><tr><td>Rehaussement résiduel</td><td>Persistance d’une anomalie morphologique.</td><td>Échec antibiotique isolé ou nécessité de prolonger jusqu’à disparition.</td></tr></tbody></table><p>Une immunodépression modifie les agents probables et peut rendre la présentation moins typique. Le guide européen propose d’élargir la couverture initiale dans certaines immunodépressions sévères, mais cela ne dispense pas de preuve. La revue granulomateuse souligne l’intérêt d’une approche interdisciplinaire et parfois du tissu. Elle ne fournit pas une dose universelle d’immunosuppresseur pour toutes les lésions granulomateuses ; cette leçon n’en invente pas.</p><p>La décision clinique découle du risque de se tromper de mécanisme. Donner un traitement immunosuppresseur sur une image présumée inflammatoire peut être inadapté si une infection persiste. À l’inverse, prolonger une antibiothérapie sans reconsidérer le diagnostic peut laisser une tumeur ou une autre maladie sans traitement. Histopathologie et microbiologie répondent à des questions complémentaires ; préparer le prélèvement avec les laboratoires évite de perdre l’une de ces possibilités.</p><figure id="g06-science-links-histo"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g06-diag-histo"><title id="g06-diag-histo">Tissu ou pus prélevé puis Morphologie et agents puis Cause mieux documentée</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Tissu ou pus prélevé</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Morphologie et agents</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Cause mieux documentée</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Prélèvement → deux analyses</td><td>Histologie et microbiologie se complètent.</td></tr><tr><td>Granulome → hypothèses</td><td>Le motif ne suffit pas à décider infection versus inflammation non infectieuse.</td></tr><tr><td>Cause → traitement</td><td>Une preuve peut réorienter ou réduire le traitement empirique.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> La morphologie décrit une organisation ; l’étiologie demande des éléments supplémentaires. Une capsule ou un granulome n’est pas une ordonnance.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r4">[4]</button> · <button class="w" data-k="g06-r9">[9]</button></p></section><p><b>Science → clinique.</b> Une capsule et un granulome correspondent à des organisations différentes.</p><p><b>Science → examen.</b> Histologie et recherche microbiologique doivent être préparées ensemble.</p><p><b>Science → traitement.</b> Une morphologie granulomateuse seule ne justifie pas un immunosuppresseur.</p></div><div class="sci" id="g06-s-micro" role="tabpanel" aria-labelledby="g06-tab-micro" hidden><section class="ilot" id="g06-s-micro-body"><h2>De la porte d’entrée à l’agent, puis à son interprétation</h2><p>Les voies de contamination comprennent extension d’un foyer
