proche, dissémination sanguine et inoculation directe. Les abcès cérébraux liés à une origine orale ou ORL peuvent associer streptocoques et anaérobies. Le contexte postopératoire et le matériel changent l’écologie possible. Les staphylocoques ont une place importante dans les infections spinales et la série bâloise. Ces données structurent la probabilité initiale, sans remplacer culture ni antibiogramme.</p><p>Un prélèvement de pus ou de tissu doit permettre recherche aérobie et anaérobie et examen histologique. Une analyse spécifique peut être indiquée selon l’exposition ou l’immunité. Une culture négative peut refléter un prétraitement, des conditions de prélèvement ou un agent non identifié par la méthode utilisée. Les techniques moléculaires sont proposées lorsque les cultures sont négatives et que les ressources le permettent. Leur résultat doit être confronté à la pertinence du site, au risque de contamination et au tableau clinique.</p><table class="t"><thead><tr><th>Résultat</th><th>Interprétation raisonnable</th><th>Étape suivante possible</th></tr></thead><tbody><tr><td>Agent dans un prélèvement pertinent</td><td>Étiologie documentée dans le bon contexte.</td><td>Adapter spectre et durée avec l’équipe.</td></tr><tr><td>Hémoculture positive</td><td>Source ou dissémination sanguine possible.</td><td>Chercher foyer selon agent, vérifier concordance avec lésion.</td></tr><tr><td>Culture négative après antibiotique</td><td>Rendement possiblement diminué.</td><td>Discuter moléculaire, tissu et autres causes sans conclure trop vite.</td></tr><tr><td>Plusieurs germes oraux</td><td>Origine buccodentaire/ORL plausible.</td><td>Évaluer et contrôler le foyer ; conserver l’interprétation clinique.</td></tr></tbody></table><p>Le report bref de l’antibiotique avant aspiration peut améliorer le rendement chez certains patients non graves, mais la microbiologie ne doit pas être obtenue au prix d’un risque clinique. Ce compromis est conditionnel et dépend de la disponibilité rapide du geste. Un patient septicémique ou menacé neurologiquement n’est pas candidat à une attente systématique. Les heures de prélèvement et d’antibiotique sont utiles pour interpréter ensuite les cultures.</p><p>L’identification d’un agent peut aussi modifier le codage ou révéler un traitement causal différent. Les infections tuberculeuses, toxoplasmiques, fongiques ou à Nocardia ne sont pas automatiquement couvertes par la durée standard d’un abcès pyogène. Le nom G06 n’est pas un test microbiologique. La distinction entre protocole empirique et traitement documenté doit rester visible dans la prescription et dans le compte rendu.</p><figure id="g06-science-links-micro"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g06-diag-micro"><title id="g06-diag-micro">Contexte et prélèvements puis Agent et sensibilité puis Traitement adapté</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Contexte et prélèvements</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Agent et sensibilité</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Traitement adapté</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Porte d’entrée → hypothèses</td><td>Oriente couverture et recherche, sans certitude absolue.</td></tr><tr><td>Culture/tissu → preuve</td><td>La qualité et la temporalité modifient le rendement.</td></tr><tr><td>Preuve → adaptation</td><td>Spectre et stratégie peuvent être révisés, avec contrôle de la source.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> L’antibiothérapie empirique couvre une probabilité ; le prélèvement permet d’en sortir lorsque la cause devient connue.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r7">[7]</button> · <button class="w" data-k="g06-r15">[15]</button> · <button class="w" data-k="g06-r16">[16]</button></p></section><p><b>Science → clinique.</b> Le terrain et la porte d’entrée modifient la probabilité des agents.</p><p><b>Science → examen.</b> Sang, pus et tissu documentent des niveaux complémentaires de preuve.</p><p><b>Science → traitement.</b> Adapter l’empirique à l’agent et à sa sensibilité, tout en traitant le foyer.</p></div><div class="sci" id="g06-s-pk" role="tabpanel" aria-labelledby="g06-tab-pk" hidden><section class="ilot" id="g06-s-pk-body"><h2>La dose ne résume pas l’exposition dans le foyer</h2><p>Une concentration sanguine, une concentration dans le liquide céphalorachidien et une concentration dans le pus ne mesurent pas le même compartiment. Le guide ESCMID souligne que les données de concentrations dans les cavités d’abcès sont limitées, souvent issues de petites séries. On ne peut donc pas convertir silencieusement une donnée de pénétration dans le liquide en preuve d’exposition efficace dans toute collection. Site, agent, sensibilité et contrôle chirurgical interviennent dans la réponse.</p><p>La fonction rénale influence fortement l’exposition de plusieurs antibiotiques utilisés. Le céfépime peut provoquer encéphalopathie, myoclonies et crises, surtout en cas d’insuffisance rénale ou chez le patient âgé. La vancomycine exige adaptation et suivi des concentrations ; ses effets rénaux et auditifs imposent une surveillance. La co-amoxicilline a des présentations de composition différente et la dose 2,2 g n’est pas utilisable de la même façon quand le rein se dégrade. La notice de chaque produit fournit ses propres seuils ; il n’existe pas un seuil rénal unique pour toute la combinaison.</p><p>La durée globale d’un abcès cérébral peut être longue, alors qu’une notice de métronidazole décrit habituellement une durée courte et limite normalement le traitement à dix jours. Le guide et la notice répondent à des niveaux différents. Cela exige une justification explicite de la prolongation, une surveillance hématologique et neurologique et une réévaluation spécialisée. La divergence ne se résout ni par un arrêt automatique au dixième jour d’une infection profonde, ni par six semaines sans contrôle.</p><table class="t"><thead><tr><th>Situation</th><th>Risque d’erreur</th><th>Bonne lecture</th></tr></thead><tbody><tr><td>Spital Thurgau ceftriaxone 2 g×2</td><td>Présenter la fréquence comme identique à FI Labatec dose unique quotidienne.</td><td>Nommer le protocole hospitalier et la divergence.</td></tr><tr><td>Métronidazole prolongé</td><td>Ignorer les précautions de neurotoxicité et durée de FI.</td><td>Justifier, surveiller et réévaluer.</td></tr><tr><td>Vancomycine 2 g</td><td>Administrer en 60 min par habitude.</td><td>La limite≤10 mg/min impose au moins 200 min, en plus du minimum 60 min.</td></tr><tr><td>Méropénème et valproate</td><td>Corriger uniquement en augmentant le valproate.</td><td>Interaction majeure, revoir l’association avec spécialiste.</td></tr><tr><td>Deux flacons 1,2 g co-amoxicilline</td><td>Croire identique à un 2,2 g.</td><td>Comparer les quantités de chaque composant.</td></tr></tbody></table><p>La surveillance relie la pharmacologie à l’examen. Une nouvelle confusion, ataxie ou myoclonie mérite de revoir molécules, rein, interactions et concentrations pertinentes tout en recherchant une complication infectieuse. Une concentration n’est utile que si son moment et sa méthode sont interprétables. Aucune cible universelle de suivi de tous les antibiotiques n’est inventée ici ; la vancomycine demande le protocole du centre et le suivi spécialisé.</p><figure id="g06-science-links-pk"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g06-diag-pk"><title id="g06-diag-pk">Dose et fonctions rénales puis Exposition et toxicité puis Contrôle et adaptation</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Dose et fonctions rénales</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Exposition et toxicité</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Contrôle et adaptation</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Dose + élimination → exposition</td><td>Une dégradation rénale peut modifier l’équilibre sans nouvelle dose prescrite.</td></tr><tr><td>Exposition → signes cliniques</td><td>Neurotoxicité et progression infectieuse sont à considérer ensemble.</td></tr><tr><td>Suivi → décision</td><td>Adapter avec la FI exacte et le protocole, sans substitution de formulation.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Rendre visibles population, produit, voie, fréquence, durée, rein et surveillance ; une donnée de liquide céphalorachidien ne prouve pas une concentration de pus.</div><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r5">[5]</button> · <button class="w" data-k="g06-r6">[6]</button> · <button class="w" data-k="g06-r10">[10]</button> · <button class="w" data-k="g06-r11">[11]</button> · <button class="w" data-k="g06-r12">[12]</button> · <button class="w" data-k="g06-r13">[13]</button></p></section><button class="pareto-btn ui" data-k="pareto-g06-sci">▲ Loi de Pareto — Du normal au signe, puis à la décision</button><p><b>Science → clinique.</b> Une dégradation rénale peut favoriser confusion ou myoclonies sous traitement.</p><p><b>Science → examen.</b> Contrôler fonction d’organe et concentrations pertinentes, sans confondre liquide et pus.</p><p><b>Science → traitement.</b> Vérifier produit, composition, rythme, vitesse et surveillance avant toute prolongation.</p></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="g06-p-regimes"><h2>Lire les protocoles suisses avec leurs conditions</h2><p>Les exemples suivants viennent des directives antimicrobiennes Spital Thurgau AG du 19août 2026 et sont destinés au contexte hospitalier adulte, après évaluation du patient. Ils illustrent une pratique suisse locale, pas une recommandation nationale unique. L’antibiothérapie doit être validée avec infectiologie et neurochirurgie, puis adaptée aux prélèvements et aux fonctions d’organe. Les doses pédiatriques et les situations de grossesse, dialyse ou défaillance combinée ne se déduisent pas de ce tableau.</p><table class="t"><thead><tr><th>Situation selon Spital Thurgau 2026</th><th>Schéma local IV</th><th>Ce qui reste à individualiser</th></tr></thead><tbody><tr><td>Abcès cérébral communautaire</td><td>Ceftriaxone 2 g deux fois/j + métronidazole 500 mg trois fois/j.</td><td>Terrain, rein/foie, allergies, prélèvement et durée.</td></tr><tr><td>Abcès cérébral postopératoire</td><td>Céfépime 2 g trois fois/j + vancomycine 20 mg/kg toutes 12 h.</td><td>Écologie locale, concentrations, fonction rénale et documentation.</td></tr><tr><td>Abcès épidural spontané</td><td>Co-amoxicilline 2,2 g quatre fois/j.</td><td>Composition exacte du flacon, rein et stratégie chirurgicale.</td></tr><tr><td>Abcès épidural postopératoire</td><td>Céfépime 2 g trois fois/j + vancomycine 20 mg/kg toutes 12 h.</td><td>Contexte opératoire, matériel, prélèvements et réponse.</td></tr></tbody></table><p>L’ESCMID propose céphalosporine de troisième génération plus métronidazole pour l’abcès cérébral communautaire immunocompétent, et méropénème plus vancomycine ou linézolide en postopératoire. Les recommandations européennes et le protocole local ne sont pas présentés comme des textes interchangeables. Les alternatives ne s’additionnent pas toutes. Une immunodépression sévère impose un raisonnement spécifique, qui peut inclure triméthoprime-sulfaméthoxazole et voriconazole ; leurs doses ne sont pas publiées ici faute de lecture de leurs notices exactes pour ce scénario.</p><div class="key"><b>À retenir.</b> Choisir un schéma contextualisé, puis l’adapter ; ne pas assembler plusieurs alternatives par addition.</div><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r5">[5]</button> · <button class="w" data-k="g06-r6">[6]</button> · <button class="w" data-k="g06-r10">[10]</button> · <button class="w" data-k="g06-r11">[11]</button> · <button class="w" data-k="g06-r12">[12]</button> · <button class="w" data-k="g06-r13">[13]</button></p></section><section class="ilot" id="g06-p-mecanismes"><h2>Comprendre les cibles, puis vérifier la sensibilité</h2><p>Les notices relues décrivent une inhibition de la synthèse de la paroi bactérienne pour ceftriaxone, céfépime et méropénème. L’amoxicilline agit aussi sur cette synthèse ; le clavulanate inhibe de nombreuses bêta-lactamases et peut protéger l’amoxicilline contre certaines résistances enzymatiques. Cette protection n’est pas universelle et le choix final doit tenir compte de la sensibilité du germe.</p><p>La vancomycine se lie à une terminaison précise des précurseurs de la paroi et entrave sa synthèse chez les bactéries sensibles. Son spectre ne remplace pas celui d’une combinaison empirique complète. Le métronidazole est activé dans les microorganismes en conditions anaérobies ; ses produits réactifs altèrent l’acide désoxyribonucléique. Cela explique l’intérêt d’une couverture anaérobie dans certains abcès, sans rendre le métronidazole efficace contre toutes les bactéries.</p><p>Le mécanisme d’action ne dispense ni d’antibiogramme ni de contrôle du foyer. Une molécule peut avoir une cible pertinente mais être inactive sur le germe résistant, insuffisamment exposée ou mal tolérée. Les notices de chaque spécialité et les recommandations cliniques répondent à ces dimensions complémentaires.</p><div class="key"><b>À retenir.</b> Cible bactérienne, sensibilité de l’agent, exposition du patient et contrôle du foyer doivent rester concordants.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r5">[5]</button> · <button class="w" data-k="g06-r6">[6]</button> · <button class="w" data-k="g06-r10">[10]</button> · <button class="w" data-k="g06-r11">[11]</button> · <button class="w" data-k="g06-r12">[12]</button> · <button class="w" data-k="g06-r13">[13]</button></p></section><section class="ilot" id="g06-p-ceftriaxone"><h2>Ceftriaxone : rendre la divergence de fréquence explicite</h2><p><button class="w" data-k="g06-ceftriaxone">Ceftriaxon Labatec : produit, rythme et limite rénale</button></p><p>Le point de sécurité n’est pas de choisir arbitrairement entre une fréquence et l’autre au lit du malade. Il consiste à reconnaître ce que chaque document dit, à utiliser le protocole spécialisé du centre et à vérifier les contre-indications et limites du patient. Une indication de méningite dans une notice ne fournit pas à elle seule la durée d’un abcès profond.</p><div class="key"><b>À retenir.</b> Même quantité quotidienne ne signifie pas même rythme ; une dose de protocole reste soumise aux limites de la notice et à l’arbitrage spécialisé.</div><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r5">[5]</button></p></section><section class="ilot" id="g06-p-metronidazole"><h2>Métronidazole : prolongation justifiée et surveillance neurologique</h2><p><button class="w" data-k="g06-metronidazole">Metronidazol i.v. B. Braun : dose, durée et signaux d’alerte</button></p><p>La notice privilégie le relais oral lorsque la voie IV n’est plus nécessaire, alors que l’ESCMID ne recommande pas un relais oral précoce de tout le traitement d’abcès faute de données. Ce n’est pas une autorisation de convertir seul le schéma complet ou une spécialité orale. Le produit, la dose, l’agent et la décision de l’équipe doivent rester explicites.</p><div class="key"><b>À retenir.</b> Une longue durée requiert une justification clinique et une surveillance active ; la toxicité neurologique peut imiter une complication de la maladie.</div><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r6">[6]</button></p></section><section class="ilot" id="g06-p-coamoxicilline"><h2>Co-amoxicilline : comparer les deux composants</h2><p><button class="w" data-k="g06-coamoxicilline">Pourquoi deux flacons de 1,2 g ne remplacent pas un flacon de 2,2 g</button></p><div class="key"><b>À retenir.</b> Décomposer une association en milligrammes de chaque substance avant toute substitution de flacon.</div><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r10">[10]</button></p></section><section class="ilot" id="g06-p-cefepime"><h2>Céfépime : le rein et la neurotoxicité doivent être visibles</h2><p><button class="w" data-k="g06-cefepime">Céfépime OrPha : dose sévère et adaptation rénale</button></p><div class="key"><b>À retenir.</b> Une fonction rénale qui se dégrade peut rendre dangereuse une dose initialement adaptée ; revoir le traitement dès le changement clinique.</div><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r11">[11]</button></p></section><section class="ilot" id="g06-p-vancomycine"><h2>Vancomycine : la dose et la vitesse sont deux prescriptions</h2><p><button class="w" data-k="g06-vancomycine">Vancomycine Sandoz IV : calculer une durée minimale</button></p><p>Le suivi des concentrations doit être organisé par l’équipe et interprété avec le moment de prélèvement et la fonction rénale. Aucune cible numérique universelle n’est ajoutée de mémoire. Les autres médicaments néphrotoxiques et l’état d’hydratation doivent être considérés dans le risque. Une réaction de perfusion ne se prévient pas en ignorant le débit maximal.</p><div class="key"><b>À retenir.</b> Vérifier dose par prise, intervalle, durée de perfusion, dilution et suivi : ces éléments ne se résument pas à « vancomycine deux fois/j ». </div><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r13">[13]</button></p></section><section class="ilot" id="g06-p-meropenem"><h2>Méropénème : une alternative européenne avec une interaction majeure</h2><p><button class="w" data-k="g06-meropenem">Méropénème et valproate : ne pas corriger par une simple augmentation</button></p><div class="key"><b>À retenir.</b> Une alternative est un choix motivé, pas une molécule supplémentaire ; vérifier population, indication et interaction avant de reprendre une dose.</div><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r12">[12]</button></p></section><section class="ilot" id="g06-p-reconciliation"><h2>Rendre la prescription révisable</h2><p>Avant chaque prolongation, vérifier : cause encore probable ou confirmée, contrôle du foyer, réponse neurologique, rein/foie, hémogramme, effets indésirables et interactions. Les écarts entre protocole et notice doivent être identifiés et arbitrés par l’équipe. L’information reste traçable : produit exact, date de FI, voie, dose de chaque substance, fréquence et durée. Le suivi doit pouvoir montrer pourquoi un traitement continue ou change.</p><p>Les corticoïdes restent réservés à l’œdème sévère ou à la menace d’engagement ; les passages lus ne fournissent pas un schéma chiffré unique. L’absence de prophylaxie antiépileptique primaire habituelle ne concerne pas le traitement d’une crise survenue. Une imagerie améliorée ne dispense pas d’évaluer les toxicités, et une toxicité supposée ne dispense pas de rechercher un nouvel effet de masse.</p><button class="pareto-btn ui" data-k="pareto-g06-pharm">▲ Loi de Pareto — Produit, population et surveillance</button><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r5">[5]</button> · <button class="w" data-k="g06-r6">[6]</button> · <button class="w" data-k="g06-r10">[10]</button> · <button class="w" data-k="g06-r11">[11]</button> · <button class="w" data-k="g06-r12">[12]</button> · <button class="w" data-k="g06-r13">[13]</button></p></section><section class="ilot" id="g06-src"><h2>Sources réellement consultées et portée des lectures</h2><p>Sources suisses prioritaires, complétées par les recommandations européennes et les références pédagogiques. Les lectures sont ciblées. Un PDF bloqué n’est pas présenté comme lu ; la DGN 2021 n’est utilisée que pour les extraits de définition et d’empyème, avec son statut échu. Les chiffres de séries étrangères ou locales ne deviennent pas une incidence suisse.</p><ol><li><button class="w" data-k="g06-r1">[1] Directives antimicrobiennes Spital Thurgau AG</button></li><li><button class="w" data-k="g06-r2">[2] ESCMID guideline: brain abscess in children and adults</button></li><li><button class="w" data-k="g06-r3">[3] EANS Delphi: de novo non-specific spinal infections</button></li><li><button class="w" data-k="g06-r4">[4] Hirnabszess, DGN S1, source échue</button></li><li><button class="w" data-k="g06-r5">[5] Ceftriaxon Labatec, information professionnelle</button></li><li><button class="w" data-k="g06-r6">[6] Metronidazol i.v. B. Braun, information professionnelle</button></li><li><button class="w" data-k="g06-r7">[7] Spinal epidural abscess: prospective 36 patients</button></li><li><button class="w" data-k="g06-r8">[8] Primary spinal epidural abscess: MRI characteristics</button></li><li><button class="w" data-k="g06-r9">[9] Granulomatous diseases of the CNS: neuroradiological differential diagnosis</button></li><li><button class="w" data-k="g06-r10">[10] Co-Amoxicillin Labatec, information professionnelle</button></li><li><button class="w" data-k="g06-r11">[11] Céfépime OrPha, information professionnelle</button></li><li><button class="w" data-k="g06-r12">[12] Meropenem Fresenius, information professionnelle</button></li><li><button class="w" data-k="g06-r13">[13] Vancomycine Sandoz IV, information professionnelle</button></li><li><button class="w" data-k="g06-r14">[14] MRC muscle scale / Aids to examination peripheral nervous system</button></li><li><button class="w" data-k="g06-r15">[15] ICD-10-GM G00–G09, G06/G07</button></li><li><button class="w" data-k="g06-r16">[16] Item 151, méningites/méningoencéphalites/abcès</button></li><li><button class="w" data-k="g06-r17">[17] PROFILES, SSP neurologiques et urgences</button></li><li><button class="w" data-k="g06-r18">[18] Gray 1918, planche 1196</button></li><li><button class="w" data-k="g06-r19">[19] Gray 1918, planche 764</button></li></ol><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r4">[4]</button> · <button class="w" data-k="g06-r15">[15]</button> · <button class="w" data-k="g06-r17">[17]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="g06-codage" data-k="g06-codage"><h3>Lire les sous-codes sans les transformer en conduite clinique</h3><p>Dans la classification GM 2024 du BfArM, G06.0 couvre les abcès et granulomes intracrâniens, y compris cérébraux et les collections intracrâniennes épidurales, extradurales ou sous-durales. G06.1 couvre les formes intrarachidiennes, médullaires et épidurales, extradurales ou sous-durales spinales. G06.2 décrit un abcès extradural ou sous-dural sans précision.</p><p>La note permet un code complémentaire B95–B98 pour l’agent identifié. Une maladie classée ailleurs peut exiger un code causal et G07* plutôt que G06 : abcès amibien, gonococcique, certaines atteintes tuberculeuses ou parasitaires. Le compte rendu doit préciser site, preuve et cause avant codage ; ce tableau allemand 2024 ne certifie pas une facture suisse 2026.</p><p>Sources : <button class="w" data-k="g06-r15">[15]</button></p></template>
<template data-pop="g06-chronologie" data-k="g06-chronologie"><h3>Quand une histoire rachidienne doit changer de priorité</h3><p>Une douleur persistante ou inhabituelle associée à une infection récente, un geste, un terrain à risque ou une anomalie neurologique doit faire envisager l’infection rachidienne. Un déficit peut apparaître après une phase douloureuse. Attendre l’association douleur-fièvre-paralysie expose à une perte de temps.</p><p>Noter l’heure du dernier état neurologique stable, l’apparition de la faiblesse et des troubles sphinctériens. Cette précision aide l’équipe chirurgicale, sans créer un délai chiffré de tolérance. Une aggravation nouvelle exige réévaluation et imagerie urgente, même si une première consultation avait conclu à une cause mécanique.</p><p>Sources : <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r7">[7]</button></p></template>
<template data-pop="g06-mrc" data-k="g06-mrc"><h3>Force musculaire : comprendre les grades 0à 5</h3><table class="t"><thead><tr><th>Grade</th><th>Réponse observée</th></tr></thead><tbody><tr><td>0</td><td>Aucune contraction.</td></tr><tr><td>1</td><td>Ébauche de contraction, sans mouvement utile.</td></tr><tr><td>2</td><td>Mouvement possible lorsque la pesanteur est supprimée.</td></tr><tr><td>3</td><td>Mouvement possible contre la pesanteur.</td></tr><tr><td>4</td><td>Mouvement contre la pesanteur et une résistance.</td></tr><tr><td>5</td><td>Force normale pour le muscle et le contexte.</td></tr></tbody></table><p>Isoler l’action musculaire, limiter les mouvements de compensation et comparer les côtés. Le grade 4 recouvre une gamme large ; il ne mesure pas à lui seul la vitesse de dégradation. L’EANS considère notamment un déficit radiculaire inférieur à 4/5, une dysfonction vésicosphinctérienne neurogène ou des signes sensitifs médullaires comme des indications de décompression dans son périmètre de spondylodiscite.</p><p>Paraphrase française du manuel officiel. ©Crown, Open Government Licence 3.0. Used with the permission of the Medical Research Council. Cette attribution ne signifie aucune approbation du cours.</p><p>Sources : <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r14">[14]</button></p></template>
<template data-pop="g06-attente" data-k="g06-attente"><h3>Le report de l’antibiotique n’est pas une attente systématique de 24 heures</h3><p>L’ESCMID permet conditionnellement de différer l’antibiothérapie avant aspiration ou excision chez certains patients sans maladie grave, si le prélèvement peut être réalisé rapidement, de préférence dans les 24 heures suivant le diagnostic radiologique. Le but est d’améliorer le rendement microbiologique. Cette option exclut notamment sepsis, rupture imminente et menace d’engagement.</p><p>Elle ne signifie pas attendre 24 heures chez un patient qui se dégrade, ni différer un traitement parce que le bloc est indisponible. Chez le patient grave, obtenir rapidement les hémocultures si cela ne retarde pas les soins, puis débuter le traitement indiqué et organiser le contrôle du foyer. La sélection doit être discutée avec neurochirurgie et infectiologie, avec surveillance et possibilité de changer immédiatement de stratégie.</p><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button></p></template>
<template data-pop="g06-certitude" data-k="g06-certitude"><h3>Distinguer suspicion radiologique et cause confirmée</h3><p>Un syndrome compatible associé à une lésion évocatrice permet de parler de diagnostic probable et d’agir. L’identification d’un microorganisme dans un prélèvement pertinent peut documenter l’étiologie. Un tissu peut aussi révéler une tumeur, une inflammation granulomateuse ou une autre cause. Le degré de certitude doit donc être formulé séparément pour la lésion et pour sa cause.</p><p>Un rehaussement en couronne n’est pas une signature microbiologique. Une diffusion restreinte peut être très utile dans le bon contexte, mais ne dispense pas d’évaluer les diagnostics alternatifs. L’absence de bactérie cultivée après traitement n’est pas une preuve d’absence d’infection. Aucun score unique validé ne couvre toutes les catégories G06.</p><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r8">[8]</button> · <button class="w" data-k="g06-r9">[9]</button></p></template>
<template data-pop="g06-duree" data-k="g06-duree"><h3>Durée cérébrale : distinguer aspiration, excision et exceptions</h3><p>L’ESCMID propose 6à 8 semaines de traitement IV pour l’abcès cérébral aspiré ou pris en charge sans chirurgie. Une durée plus courte après excision, par exemple 4 semaines, repose sur avis d’experts et ne constitue pas une règle automatique. La réponse clinique, les images, l’agent et la qualité du contrôle du foyer doivent être intégrés.</p><p>Le guide ne formule pas de recommandation pour un relais oral précoce faute de données suffisantes. Il ne recommande pas habituellement une consolidation orale après au moins 6 semaines IV, mais réserve des exceptions, notamment certaines anomalies neuroanatomiques permanentes et les infections tuberculeuses, à Nocardia, toxoplasmiques ou fongiques. Cette durée globale n’annule pas les précautions de prolongation de chaque produit.</p><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r6">[6]</button></p></template>
<template data-pop="pareto-g06-path" data-k="pareto-g06-path"><h3>Territoire, gravité et contrôle du foyer</h3><p>Fièvre absente ne rassure pas. IRM adaptée, hémocultures et prélèvement du foyer lorsque possible. Patient grave traité sans délai dangereux ; report antibiotique seulement sélectionné. Déficit spinal et troubles sphinctériens imposent décision urgente. Les protocoles cérébraux et rachidiens ne sont pas interchangeables.</p></template>
<template data-pop="g06-irm" data-k="g06-irm"><h3>Diffusion, contraste et localisation : trois informations différentes</h3><p>La restriction de diffusion peut soutenir la présence de pus dans un abcès cérébral. Le rehaussement en couronne montre une zone de prise de contraste, mais n’identifie pas à lui seul une bactérie. L’effet de masse et les rapports avec les ventricules apportent une information de gravité distincte de la cause.</p><p>Dans les infections épidurales, le phlegmon peut présenter un rehaussement plus homogène, tandis qu’une collection organisée peut présenter un rehaussement périphérique. La série IRM lue ne comporte que 27 patients sélectionnés avec confirmation opératoire/pathologique et ne valide pas une sensibilité générale. Une image atypique ne doit pas être résumée par une règle visuelle unique.</p><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r8">[8]</button></p></template>
<template data-pop="g06-pl" data-k="g06-pl"><h3>Pourquoi la PL est généralement évitée dans cette situation</h3><p>Dans le guide ESCMID, la ponction lombaire est relativement contre-indiquée et habituellement de faible rendement dans l’abcès cérébral. Une lésion expansive avec œdème ou effet de masse modifie la sécurité du geste. Le liquide lombaire ne prélève pas directement le pus parenchymateux.</p><p>La conduite initiale repose donc sur l’imagerie, les hémocultures et le prélèvement du foyer lorsque possible. Cette formulation ne signifie pas qu’aucun patient ne pourra jamais avoir de PL : une autre question diagnostique peut exister, mais sa justification et sa sécurité relèvent de l’équipe après évaluation. La stratégie d’une méningite sans lésion expansive ne se transpose pas automatiquement à une infection focale.</p><p>Sources : <button class="w" data-k="g06-r2">[2]</button></p></template>
<template data-pop="pareto-g06-exam" data-k="pareto-g06-exam"><h3>Une question pour chaque examen</h3><p>IRM pour territoire et gravité ; sang et pus/tissu pour preuve ; méthodes moléculaires si cultures négatives selon contexte. CRP et fièvre ne sont pas des tests d’exclusion. PL non routinière dans l’abcès cérébral. Dégradation clinique : réévaluation urgente.</p></template>
<template data-pop="g06-ceftriaxone" data-k="g06-ceftriaxone"><h3>Ceftriaxon Labatec : produit, rythme et limite rénale</h3><p>La notice de juin 2025 concerne notamment le flacon IV de 2 g. Elle décrit chez l’adulte et l’enfant de plus de 12 ans une dose habituelle de 1à 2 g une fois par jour ; dans les infections sévères, jusqu’à 4 g en une dose quotidienne unique. Le guide Spital Thurgau prescrit 2 g deux fois par jour pour l’abcès cérébral : la dose journalière est 4 g, mais la fréquence diffère de la notice. Cette différence doit être attribuée au protocole hospitalier, pas effacée.</p><p>Dans cette FI, une clairance de créatinine inférieure à 10 ml/min et la dialyse imposent un maximum de 2 g par jour. Le schéma Spital Thurgau de 4 g/j ne peut donc pas être repris sans réévaluation. Une atteinte combinée hépatique et rénale demande une surveillance adaptée. La perfusion dure au moins 30 minutes. Ne pas reconstituer ni mélanger avec une solution contenant du calcium ; les modalités de lignes et de rinçage doivent suivre la notice et le protocole.</p><p>Le flacon 2 g contient 166 mg de sodium. La notice ne nomme pas une indication spécifique d’abcès cérébral ; le choix de cette indication vient des recommandations cliniques. Pendant la grossesse, l’indication doit être formelle ; si le traitement est indispensable pendant l’allaitement, la FI demande d’interrompre celui-ci. Ces informations sont propres au produit lu.</p><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r5">[5]</button></p></template>
<template data-pop="g06-metronidazole" data-k="g06-metronidazole"><h3>Metronidazol i.v. B. Braun : dose, durée et signaux d’alerte</h3><p>La préparation contient 500 mg dans 100 ml, soit 5 mg/ml, et 311 mg de sodium par 100 ml. Sa FI de février 2026 inclut l’abcès cérébral parmi les indications. Elle décrit une charge de 15 mg/kg puis 7,5 mg/kg toutes les 6 heures pendant trois jours et ensuite toutes les 12 heures, avec un maximum de 4 g/j. Ce schéma n’est pas le rythme fixe 500 mg trois fois/j du guide Spital Thurgau. Ne pas combiner les deux sans prescription explicite.</p><p>La FI décrit habituellement 5à 7 jours et normalement pas plus de 10 jours ; une prolongation est exceptionnelle, justifiée et accompagnée de contrôles, notamment hémogramme et recherche d’effets neurologiques. Le traitement global d’un abcès selon ESCMID peut durer 6à 8 semaines IV. La prise en charge spécialisée doit réconcilier ces exigences et documenter la surveillance, sans arrêt arbitraire de l’infection profonde ni reconduction sans contrôle.</p><p>Ataxie, paresthésies, confusion, vertiges inhabituels, myoclonies ou convulsions font rechercher une neurotoxicité et imposent interruption/réévaluation selon la notice. Une progression infectieuse reste à exclure. L’atteinte hépatique sévère demande réduction/surveillance ; une clairance<10ml/min peut favoriser l’accumulation de métabolites. Le premier trimestre de grossesse et le syndrome de Cockayne sont contre-indiqués. Les coumarines nécessitent surveillance de l’INR, le lithium une attention spécifique ; éviter l’alcool pendant le traitement et le lendemain selon cette FI.</p><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r6">[6]</button></p></template>
<template data-pop="g06-coamoxicilline" data-k="g06-coamoxicilline"><h3>Pourquoi deux flacons de 1,2 g ne remplacent pas un flacon de 2,2 g</h3><p>Co-Amoxicillin Labatec 2,2 g contient 2000 mg d’amoxicilline et 200 mg d’acide clavulanique. Le flacon 1,2 g contient 1000 mg et 200 mg. Deux flacons 1,2 g apporteraient donc 2000 mg d’amoxicilline et 400 mg de clavulanate : ce n’est pas la même composition. La masse totale du nom ne suffit pas à choisir une présentation.</p><p>La FI d’octobre 2024 décrit dans les infections sévères de l’adulte et du patient>40 kg 2,2 g trois à quatre fois/j, en perfusion d’au moins 30 minutes. Le schéma Spital Thurgau quatre fois/j se situe dans cette plage pour un patient adapté. La présentation 2,2 g n’est pas indiquée si ClCr<30ml/min ; le tableau rénal de la FI comporte une ligne10–30ml/min avec charge1,2g puis600mg toutes12h et une ligne<10 avec600mg toutes24h après charge. Le libellé au point30 doit être vérifié individuellement, sans arrondi improvisé.</p><p>Allergie pertinente aux bêta-lactamines et antécédent d’ictère ou d’atteinte hépatique liée à cette association sont des contre-indications. Contrôler rein, foie et hémogramme lors du traitement prolongé, et l’INR avec anticoagulants coumariniques. Grossesse : nécessité absolue ; la notice demande de ne pas allaiter pendant ce traitement. La dose de l’abcès épidural vient du protocole Spital Thurgau, pas d’une indication épidurale explicitement nommée dans la FI.</p><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r10">[10]</button></p></template>
<template data-pop="g06-cefepime" data-k="g06-cefepime"><h3>Céfépime OrPha : dose sévère et adaptation rénale</h3><p>La FI de septembre 2025 présente un flacon 2 g pour voie IV. Pour l’adulte et le patient de plus de 40 kg, une infection très grave peut recevoir 2 g toutes les 8 heures, maximum 6 g/j. Ce rythme correspond à l’exemple postopératoire Spital Thurgau. La notice prévoit une adaptation lorsque la clairance de créatinine est≤50 ml/min. Aucun tableau de paliers non relu n’est reconstruit ici ; la prescription doit consulter le tableau exact du produit.</p><p>Encéphalopathie, myoclonies, convulsions et état de mal non convulsif sont décrits, en particulier chez le patient âgé, en cas de rein altéré ou d’exposition excessive. Des cas peuvent survenir à une dose usuelle en présence d’insuffisance rénale. Une confusion nouvelle doit donc faire revoir immédiatement fonction rénale et prescription, sans omettre l’évaluation de l’infection ou d’une crise.</p><p>Les indications pédiatriques de méningite ne démontrent pas une indication adulte d’abcès cérébral dans la notice. Le contexte postopératoire de la leçon est attribué au protocole hospitalier. Vérifier allergies et autres précautions dans la notice complète avant prescription ; la lecture ciblée du cours n’est pas une substitution à cette consultation.</p><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r11">[11]</button></p></template>
<template data-pop="g06-vancomycine" data-k="g06-vancomycine"><h3>Vancomycine Sandoz IV : calculer une durée minimale</h3><p>La FI de mars 2026 décrit chez les patients≥12 ans 15à 20 mg/kg toutes les 8à 12 heures, avec un maximum de 2 g par dose. Spital Thurgau indique 20 mg/kg toutes 12 heures en contexte postopératoire. Ces chiffres ne constituent pas un schéma fixe pour tout insuffisant rénal : adaptation, concentrations et fonction rénale doivent être suivies, avec gestion particulière de la dialyse.</p><p>La perfusion doit durer au moins 60 minutes et respecter un débit maximal de 10 mg/min, en retenant la durée la plus longue. Exemple calculé : pour 2000 mg,2000÷10=200 minutes au minimum. Une poche de 2 g ne doit donc pas être administrée en 60 minutes sur la seule base du minimum d’une heure. La dilution et la concentration suivent également la FI et le protocole du centre ; ne pas administrer en bolus.</p><p>Surveiller néphrotoxicité, ototoxicité, réactions de perfusion et réactions cutanées sévères. Un acouphène est un signal à évaluer ; une réaction cutanée sévère impose l’arrêt selon la notice. Les traitements prolongés exigent notamment suivi sanguin et rénal. La voie orale utilisée pour certaines infections intestinales ne remplace pas la voie IV systémique. La grossesse et l’allaitement nécessitent une nécessité absolue selon ce produit.</p><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r13">[13]</button></p></template>
<template data-pop="g06-meropenem" data-k="g06-meropenem"><h3>Méropénème et valproate : ne pas corriger par une simple augmentation</h3><p>Le méropénème figure dans les propositions ESCMID d’abcès cérébral postopératoire, associé à vancomycine ou linézolide. La FI Fresenius de février 2026 décrit les doses adultes générales et une adaptation rénale ; la mention adulte 2 g toutes 8 heures pour méningite repose sur une expérience très limitée. Le tableau « méningite, abcès cérébral » de l’annexe SwissPedDose concerne l’enfant et ne doit pas être lu comme une validation de dose adulte d’abcès.</p><p>La notice décrit une baisse de 60à 100% des concentrations de valproate en environ deux jours sous carbapénème. L’association doit être évitée ; augmenter simplement la dose de valproate ne permet pas de gérer sûrement cette interaction. L’équipe doit revoir le traitement anti-infectieux ou antiépileptique selon les possibilités et surveiller les crises. Cette question compte particulièrement chez un patient ayant déjà une atteinte cérébrale.</p><p>Le schéma rénal commence à être adapté sous 51 ml/min dans cette notice. La dose adulte précise d’abcès n’est pas inventée à partir d’une annexe pédiatrique ; consulter protocole et infectiologue. La lecture ciblée ne justifie pas d’ajouter automatiquement cet antibiotique au schéma Spital Thurgau déjà choisi.</p><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r12">[12]</button></p></template>
<template data-pop="pareto-g06-pharm" data-k="pareto-g06-pharm"><h3>Produit, population et surveillance</h3><p>Protocoles Spital Thurgau 2026 nommés ; fréquences des FI distinctes visibles. Ne pas convertir 2,2 g en deux 1,2 g, ni donner 2 g de vancomycine en 60 min. Fonction rénale et neurotoxicité à réévaluer. Durée cérébrale longue réconciliée avec les précautions de chaque molécule ; aucune dose pédiatrique présentée comme adulte.</p></template>
<template data-pop="pareto-g06-sci" data-k="pareto-g06-sci"><h3>Du normal au signe, puis à la décision</h3><p>Anatomie normale sur originaux humains ; inflammation/œdème/compression expliquent les signes, pas l’agent. Histologie et microbiologie se complètent. Diffusion/rehaussement ne remplacent pas preuve et clinique. Exposition dans le liquide céphalorachidien≠exposition dans le pus. Les limites des sources sont conservées.</p></template>

<template data-pop="g06-r1" data-k="g06-r1"><h3>[1] Directives antimicrobiennes Spital Thurgau AG</h3><p>Guide local : cerveau communautaire ceftriaxone 2 g×2 IV + métronidazole 500 mg×3 IV ; postopératoire céfépime 2 g×3 IV + vancomycine 20 mg/kg q 12 h ; épidural spontané co-amoxicilline 2,2 g×4 IV, postopératoire même association céfépime/vancomycine. Concertation neurochirurgie/infectiologie, durée individualisée.</p><p><b>Passage lu :</b> Introduction et page 22, abcès cérébral et épidural, spontané/postopératoire. <b>Population :</b> Contexte hospitalier suisse local, recommandations Spital Thurgau AG 2026. <b>Version :</b> 19.08.2026. <b>Limites :</b> Adultes du réseau hospitalier suisse ; non directive nationale, non extrapolable sans adaptation au rein/foie/âge/terrain. Différences FI conservées</p><p>Lecture ciblée réelle de Sol le 2 novembre 2026 ; journalisation après lecture, pas lecture intégrale prétendue.</p><p><a data-reference-source href="https://www.stgag.ch/ext/tx_docs/stgag-antibiotika-richtlinien-6a86f7bc9783e.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — Spital Thurgau AG</a></p></template>
<template data-pop="g06-r2" data-k="g06-r2"><h3>[2] ESCMID guideline: brain abscess in children and adults</h3><p>IRM diffusion/ADC et T1 avant/après contraste ; scanner injecté si IRM indisponible. Prélèvement chirurgical dès que possible sauf toxoplasmose. Report antibiotique seulement chez sélection non grave et prélèvement rapide, de préférence<24h, pas attente systématique. C3G+metro communautaire immunocompétent ; sévèrement immunodéprimé ajouter TMP-SMX/voriconazole ; postopératoire meropenem+vanco ou linezolide.6–8semaines IV après aspiration/traitement conservateur ;4semaines après excision seulement avis expert. Pas de recommandation de relais oral précoce, pas de consolidation orale habituelle après≥6semaines IV hors exceptions. Corticoïdes pour œdème sévère/menace engagement, pas prophylaxie antiépileptique primaire habituelle. CRP/PCT/leucocytes non exclusifs ; PL relativement contre-indiquée/faible rendement. Pus cultures aérobie/anaérobie/histopathologie, méthodes moléculaires si cultures négatives ; hémocultures. IRM immédiate si aggravation, sinon p.ex toutes2semaines ; rehaussement3–6mois non seul motif prolongation. Concentrations LCR≠pus.</p><p><b>Passage lu :</b> Couverture/licence, introduction, tableau 1 dix recommandations, question 5/tableaux 3–4 et pratique générale p 83–84 ; pas tous suppléments. <b>Population :</b> Abcès cérébraux des enfants et adultes dans un guide européen ; doses détaillées du cours limitées à l’adulte. <b>Version :</b> 2024;30:66–89, doi 10.1016/j.cmi.2023.08.016. <b>Limites :</b> Enfants/adultes, guide européen ; lecture ciblée, preuves souvent observationnelles et certitude différemment libellée dans tableau 1/corps. Pas de seuil de taille unique ni dose de stéroïde inventée. Incidence 0,4–1,3/100000/an européenne/étrangère, non suisse</p><p>Lecture ciblée réelle de Sol le 2 novembre 2026 ; journalisation après lecture, pas lecture intégrale prétendue.</p><p><a data-reference-source href="https://vbn.aau.dk/ws/portalfiles/portal/649326266/Bodilsen_et_al._2024_._European_society_of_Clinical_Microbiology_and_Infectious_Diseases_guidelines_on_diagnosis_and_treatment_of_brain_abscess_in_children_and_adults.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — European Society of Clinical Microbiology and Infectious Diseases / CMI</a></p></template>
<template data-pop="g06-r3" data-k="g06-r3"><h3>[3] EANS Delphi: de novo non-specific spinal infections</h3><p>Spondylodiscite de novo : IRM région suspecte avant/après contraste, hémocultures avant antibiotiques et prélèvement tissulaire lorsque indiqué ; IRM tout rachis 77% accord sans consensus. Déficit nouveau, MRC<4/5, signes médullaires ou troubles vésicosphinctériens : décompression. Empyème épidural avec déficit indication claire, sans déficit pas consensus à opérer presque tous. Sepsis : hémocultures puis antibiothérapie sans délai. Durée6semaines non compliquée,12compliquée avec≥2semaines IV dans ce consensus, non règle de tout abcès spinal ; réévaluation clinique/CRP, IRM anomalies peuvent persister.</p><p><b>Passage lu :</b> Résumé/introduction/méthodes, tableaux 1,2,4,5 et fin tableau 3. <b>Population :</b> Adultes atteints de spondylodiscite non spécifique de novo, hors extrapolation à toutes les collections spinales. <b>Version :</b> 2025, publication 31.12.2024, doi 10.1016/j.bas.2024.104178. <b>Limites :</b> Adultes spondylodiscite non spécifique de novo ; non protocole de toutes collections isolées, intramédullaires, tuberculeuses ou postopératoires. Consensus experts≠essai randomisé</p><p>Lecture ciblée réelle de Sol le 2 novembre 2026 ; journalisation après lecture, pas lecture intégrale prétendue.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11763570/" target="_blank" rel="noopener noreferrer">Consulter la source — EANS Spine Section / Brain and Spine</a></p></template>
<template data-pop="g06-r4" data-k="g06-r4"><h3>[4] Hirnabszess, DGN S1, source échue</h3><p>Cérébrite focale évoluant vers collection purulente et capsule conjonctive ; voies contiguë, hématogène, directe. Épidural entre os et dure-mère, sous-dural diffusion en nappe. Empyème sous-dural peut se dégrader en heures et impose avis/évacuation neurochirurgicale urgente.</p><p><b>Passage lu :</b> Définitions 1, clinique 2 partielle, empyèmes 5.6 via extraits du service acquis 18.09.2026. <b>Population :</b> Source allemande 2021 de définition et d’empyèmes, devenue échue. <b>Version :</b> 2021, adresse du document marquée abgelaufen. <b>Limites :</b> Guide allemand expiré ; PDF direct challenge Anubis non lu, seuls extraits indiqués réellement lus. Pas fondement actuel de doses, seuil 2,5cm ou prophylaxie</p><p>Lecture ciblée réelle de Sol le 2 novembre 2026 ; journalisation après lecture, pas lecture intégrale prétendue.</p><p><a data-reference-source href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — Deutsche Gesellschaft für Neurologie / AWMF</a></p></template>
<template data-pop="g06-r5" data-k="g06-r5"><h3>[5] Ceftriaxon Labatec, information professionnelle</h3><p>Flacon 2 g IV,166 mg sodium. Adulte et>12 ans,1–2 g/j habituels, cas sévères jusqu’à 4 g en dose unique quotidienne. ClCr<10ml/min ou dialyse max2g/j. Ne pas diluer/administrer avec solutions calciques, rinçage si séquentiel adulte ; perfusion≥30min. Grossesse indication formelle, allaitement à interrompre si traitement indispensable selon cette FI.</p><p><b>Passage lu :</b> Composition, indications, doses adultes, durée, rein/foie, contre-indications calcium, grossesse/allaitement, date ; propriétés/effets, mécanisme d’action relu lors de la relecture finale. <b>Population :</b> Adultes et enfants>12 ans selon cette notice ; exemples du cours réservés à l’adulte. <b>Version :</b> juin 2025. <b>Limites :</b> Produit exact, non indication abscess nommée ; Spital Thurgau 2 g q 12 h fréquence différente, protocole hospitalier spécialisé non prétendu conforme en fréquence à FI. Pas adaptation unique si atteinte combinée foie/reins</p><p>Lecture ciblée réelle de Sol le 2 novembre 2026 ; journalisation après lecture, pas lecture intégrale prétendue.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680598760031" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic/AIPS via AmiKo</a></p></template>
<template data-pop="g06-r6" data-k="g06-r6"><h3>[6] Metronidazol i.v. B. Braun, information professionnelle</h3><p>500 mg/100 ml,311 mg sodium. FI : charge 15 mg/kg puis 7,5 mg/kgq 6 h 3 jours puisq 12 h, max 4 g/j ; durée habituelle 5–7 j, normalement≤10 j, prolongation exceptionnellement justifiée avec contrôles hématologiques/neurocliniques. Spital Thurgau 500 mg trois fois/j distinct. Neurotoxicité ataxie/paresthésies/confusion/convulsions implique interruption et réévaluation. Coumarines INR, lithium ; éviter alcool pendant et lendemain. Premier trimestre et syndrome Cockayne contre-indiqués ; foie sévère réduire/surveiller ; ClCr<10 accumulation métabolites.</p><p><b>Passage lu :</b> Composition, indications, doses, durée, rein/foie, contre-indications, neurotoxicité, interactions, grossesse/allaitement, date ; propriétés/effets, mécanisme d’action relu lors de la relecture finale. <b>Population :</b> Adultes et enfants≥12 ans pour les doses citées de cette notice ; exemples du cours réservés à l’adulte. <b>Version :</b> février 2026. <b>Limites :</b> Produit IV exact ; durée 6–8 semaines de traitement de l’abcès selon ESCMID ne supprime pas précautions de prolongation FI, pas conversion orale automatique</p><p>Lecture ciblée réelle de Sol le 2 novembre 2026 ; journalisation après lecture, pas lecture intégrale prétendue.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680480180251" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic/AIPS via AmiKo</a></p></template>
<template data-pop="g06-r7" data-k="g06-r7"><h3>[7] Spinal epidural abscess: prospective 36 patients</h3><p>Série bâloise 36 patients 2004–2008,16primaires 20secondaires ; douleur rachidienne/tendresse, fièvre parfois absente, signes moteurs/sensitifs, IRM injectée. S.aureus important. Collaboration chirurgicale et anti-infectieuse, adaptation aux prélèvements.</p><p><b>Passage lu :</b> Résumé, introduction, méthodes, symptômes, microbiologie ciblée et évolution/tableau 6. <b>Population :</b> 36 patients d’une cohorte hospitalière bâloise ancienne,2004–2008. <b>Version :</b> 2011, doi 10.1007/s 00586-011-1838-y. <b>Limites :</b> Petite cohorte suisse ancienne sélectionnée ; nombres S.aureus et récupérations discordants résumé/corps/tableau, pas pourcentages stables ni incidence nationale repris. extraction du texte structuré direct échoué, texte extrait du service effectivement lu</p><p>Lecture ciblée réelle de Sol le 2 novembre 2026 ; journalisation après lecture, pas lecture intégrale prétendue.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3229722/" target="_blank" rel="noopener noreferrer">Consulter la source — Zimmerer etal., University Hospital Basel, Eur Spine J</a></p></template>
<template data-pop="g06-r8" data-k="g06-r8"><h3>[8] Primary spinal epidural abscess: MRI characteristics</h3><p>27 patients chinois sélectionnés avec confirmation chirurgicale/pathologique ; phlegmon peut rehausser homogène, abcès peut avoir couronne ; aspect IRM dépend stade. Donnée descriptive ne donne pas sensibilité générale.</p><p><b>Passage lu :</b> Résumé, méthodes, résultats ciblés, légendes 1–4, éthique et licence extraction du texte structuré. <b>Population :</b> 27 patients chinois sélectionnés, confirmation opératoire et pathologique. <b>Version :</b> 17.10.2024, doi 10.1186/s 12880-024-01458-3. <b>Limites :</b> Population chinoise sélectionnée ; figures CC BY-non commerciale et sans modification, version 4.0 non retenues pour réutilisation selon protocole de provenance des figures. Paraphrases factuelles uniquement, aucune image copiée</p><p>Lecture ciblée réelle de Sol le 2 novembre 2026 ; journalisation après lecture, pas lecture intégrale prétendue.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11487751/" target="_blank" rel="noopener noreferrer">Consulter la source — Jiang etal., BMC Medical Imaging</a></p></template>
<template data-pop="g06-r9" data-k="g06-r9"><h3>[9] Granulomatous diseases of the CNS: neuroradiological differential diagnosis</h3><p>Granulomes réponse persistante à antigène, macrophages et cellules T ; épithélioïdes, caséeux/non caséeux/nécrosants/corps étranger selon cause. Causes infectieuses et inflammatoires ; imagerie seule insuffisante, tissu et recherche d’agent peuvent orienter.</p><p><b>Passage lu :</b> Résumé, introduction, histologie et démarche générale ciblées. <b>Population :</b> Revue des maladies granulomateuses du système nerveux central, infectieuses et non infectieuses. <b>Version :</b> 02.06.2026, doi 10.1007/s 00062-026-01672-2. <b>Limites :</b> Revue européenne, pas essai ni guide de doses ; toutes maladies granulomateuses SNC ne relèvent pas de G06 ; pas critères contestables de sous-types repris</p><p>Lecture ciblée réelle de Sol le 2 novembre 2026 ; journalisation après lecture, pas lecture intégrale prétendue.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13522057/" target="_blank" rel="noopener noreferrer">Consulter la source — Weidauer / Klingebiel, Clinical Neuroradiology</a></p></template>
<template data-pop="g06-r10" data-k="g06-r10"><h3>[10] Co-Amoxicillin Labatec, information professionnelle</h3><p>2,2 g=2 g amoxicilline+0,2 g clavulanate ;1,2 g=1 g+0,2 g, deux flacons 1,2 g≠un 2,2 g. Adultes/>40 kg grave 2,2 g 3–4/j IV≥30 min. Si ClCr<30 ne pas2,2g ; tableau10–30 charge1,2g puis600mgq12h, <10 puis600q24h, dose supplémentaire dialyse. Allergie bêta-lactame ou antécédent ictère/hépatopathie liée contre-indiquent ; contrôles rein/foie/sang/INR prolongés. Grossesse nécessité absolue ; pas allaiter selon cette FI.</p><p><b>Passage lu :</b> Composition, indications, doses adultes, rein, contre-indications, surveillance, grossesse/allaitement, date ; propriétés/effets, mécanisme d’action relu lors de la relecture finale. <b>Population :</b> Adultes et patients>40 kg pour les doses citées ; adaptation rénale du produit exact. <b>Version :</b> octobre 2024. <b>Limites :</b> Produit exact ; seuil 30 formulation prose/tableau à réconcilier individuellement, pas arrondi inventé. Indication épidurale vient Spital Thurgau et non libellé spécifique FI</p><p>Lecture ciblée réelle de Sol le 2 novembre 2026 ; journalisation après lecture, pas lecture intégrale prétendue.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680685110015" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic/AIPS via AmiKo</a></p></template>
<template data-pop="g06-r11" data-k="g06-r11"><h3>[11] Céfépime OrPha, information professionnelle</h3><p>Flacon 2 g IV ; adulte/>40 kg infections très graves 2gq 8 h max 6 g/j ; adaptation si ClCr≤50 ml/min. Encéphalopathie,myoclonies,convulsions/état non convulsif, surtout rein/âge ; peut survenir même dose usuelle si insuffisance rénale.</p><p><b>Passage lu :</b> Composition, indications, dose adulte, principe adaptation rénale et neurotoxicité, date ; propriétés/effets, mécanisme d’action relu lors de la relecture finale. <b>Population :</b> Adultes et patients>40 kg pour la dose sévère citée. <b>Version :</b> septembre 2025. <b>Limites :</b> Produit exact ; tableau rénal complet non relu donc pas chiffres de paliers publiés ; dose Spital Thurgau postopératoire attribuée à protocole, pas indication adulte méningite de l’annexe pédiatrique</p><p>Lecture ciblée réelle de Sol le 2 novembre 2026 ; journalisation après lecture, pas lecture intégrale prétendue.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680696420028" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic/AIPS via AmiKo</a></p></template>
<template data-pop="g06-r12" data-k="g06-r12"><h3>[12] Meropenem Fresenius, information professionnelle</h3><p>Adulte usuel 500 mg/1gq 8 h,6 g/j max ;2gq 8 h adulte méningite expérience très limitée. Réduire/espacer si ClCr<51. Valproate baisse60–100% en environ2j : association à éviter, augmentation simple ne suffit pas à contrôler interaction.</p><p><b>Passage lu :</b> Posologie adulte, adaptation rénale, interaction valproate, date ; propriétés/effets, mécanisme d’action relu lors de la relecture finale. <b>Population :</b> Adultes pour les doses générales et interaction citées ; annexe pédiatrique non extrapolée. <b>Version :</b> février 2026. <b>Limites :</b> Produit exact ; tableau abcès cérébral de l’annexe SwissPedDose est pédiatrique et ne prouve pas dose adulte G06. Pas dose adulte abcès inventée ni tous effets relus</p><p>Lecture ciblée réelle de Sol le 2 novembre 2026 ; journalisation après lecture, pas lecture intégrale prétendue.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680624190016" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic/AIPS via AmiKo</a></p></template>
<template data-pop="g06-r13" data-k="g06-r13"><h3>[13] Vancomycine Sandoz IV, information professionnelle</h3><p>Les flacons contiennent 500 mg ou 1 g. Dès 12 ans, la FI décrit 15à 20 mg/kg toutes les 8à 12 heures, avec un maximum de 2 g par dose. Le schéma Spital Thurgau 20 mg/kg toutes les 12 heures se situe dans cette plage, sous réserve du patient. La fonction rénale, la dialyse et les concentrations imposent une adaptation individuelle. La perfusion dure au moins 60 minutes et respecte un maximum de 10 mg/min : pour 2 g, retenir au moins 200 minutes. Ne pas administrer en bolus. Surveiller le rein, les concentrations et l’hémogramme lors du traitement prolongé. La toxicité rénale et auditive, un acouphène ou une réaction cutanée sévère doivent être évalués ; la réaction sévère impose l’arrêt selon la FI. Grossesse et allaitement : nécessité absolue selon cette notice.</p><p><b>Passage lu :</b> Composition, indication, doses≥12 ans, rein/TDM, perfusion, toxicités rénale/auditive/cutanée, grossesse/allaitement, date ; propriétés/effets, mécanisme d’action relu lors de la relecture finale. <b>Population :</b> Patients≥12 ans selon la notice ; exemples du cours réservés à l’adulte, avec suivi spécialisé. <b>Version :</b> mars 2026. <b>Limites :</b> Produit IV exact, voie orale destinée notamment C.difficile non substituable à IV systémique ; dose de charge et cible AUC numérique non reproduites sans arbitrage</p><p>Lecture ciblée réelle de Sol le 2 novembre 2026 ; journalisation après lecture, pas lecture intégrale prétendue.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680572360035" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic/AIPS via AmiKo</a></p></template>
<template data-pop="g06-r14" data-k="g06-r14"><h3>[14] MRC muscle scale / Aids to examination peripheral nervous system</h3><p>Force 0pas contraction,1ébauche,2mouvement pesanteur supprimée,3contre pesanteur,4contre pesanteur/résistance,5normale. Isoler action, éviter compensations/fatigue, comparer. Pas délai d’imagerie urgente pour compléter long examen.</p><p><b>Passage lu :</b> Page officielle provenance/licence et manuel introduction/motor testing ; page PDF 7 (page imprimée 1) rendue et inspectée, grades 0–5 confirmés malgré pertes de reconnaissance du texte. <b>Population :</b> Examen moteur clinique, échelle ordinale de force ; pas critère étiologique. <b>Version :</b> site 16.06.2026 ; memorandum 45,1976. <b>Limites :</b> Échelle ordinale et référence d’examen moteur, pas diagnostic étiologique ; paraphrase française. ©Crown, manuel Open Government Licence 3.0, Used with the permission of the Medical Research Council ; aucune image anatomique du manuel reproduite</p><p>Lecture ciblée réelle de Sol le 2 novembre 2026 ; journalisation après lecture, pas lecture intégrale prétendue.</p><p><a data-reference-source href="https://www.ukri.org/councils/mrc/facilities-and-resources/find-an-mrc-facility-or-resource/mrc-muscle-scale/" target="_blank" rel="noopener noreferrer">Consulter la source — Medical Research Council / UKRI</a></p></template>
<template data-pop="g06-r15" data-k="g06-r15"><h3>[15] ICD-10-GM G00–G09, G06/G07</h3><p>G06.0 intracrânien cérébral et épi/extra/sous-dural ;G06.1 intrarachidien médullaire et épi/extra/sous-dural ;G06.2 extra/sous-dural sans précision. Agent B95–B98 si identifié selon note. Maladies classées ailleurs notamment tuberculose/parasitoses/amibiase/gonocoque : codage causal et G07* lorsque approprié.</p><p><b>Passage lu :</b> G06.0, G06.1, G06.2 et exclusions G07*. <b>Population :</b> Classification administrative allemande GM 2024, pas protocole thérapeutique. <b>Version :</b> GM 2024. <b>Limites :</b> Classification officielle allemande 2024 ; pas certification suisse 2026 de facturation, code administratif ne décide ni traitement ni causalité</p><p>Lecture ciblée réelle de Sol le 2 novembre 2026 ; journalisation après lecture, pas lecture intégrale prétendue.</p><p><a data-reference-source href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener noreferrer">Consulter la source — BfArM</a></p></template>
<template data-pop="g06-r16" data-k="g06-r16"><h3>[16] Item 151, méningites/méningoencéphalites/abcès</h3><p>Céphalée sous-aiguë, hypertension intracrânienne, déficit/crises ; fièvre inconstante. Streptocoques oraux/anaérobies ORL/dentaires, staphylocoques post-traumatiques/postop. Prélèvement lorsque possible puis antibiothérapie adaptée et traitement du foyer.</p><p><b>Passage lu :</b> Abcès : clinique sous-aiguë, agents/porte entrée, prélèvement et traitement ciblé, points finaux dans leur contexte. <b>Population :</b> Support pédagogique de neurologie adulte et enfant, passages abcès ciblés. <b>Version :</b> page version non établie. <b>Limites :</b> Support pédagogique français ; pas fondement suisse de doses, ni descriptions d’images générées automatiquement, ni recommandation PL de la partie méningite transposée à abcès</p><p>Lecture ciblée réelle de Sol le 2 novembre 2026 ; journalisation après lecture, pas lecture intégrale prétendue.</p><p><a data-reference-source href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-24-item-151-meningites-meningo-encephalites-abces-cerebral-chez-ladulte-et-lenfant" target="_blank" rel="noopener noreferrer">Consulter la source — Collège des enseignants de neurologie</a></p></template>
