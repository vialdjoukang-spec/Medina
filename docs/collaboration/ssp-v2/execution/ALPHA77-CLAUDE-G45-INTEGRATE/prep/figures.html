<figure><a href="assets/img/cycle2/g45/g45-09.gif" target="_blank" rel="noopener" aria-label="Ouvrir la figure en taille complète"><img src="assets/img/cycle2/g45/g45-09.gif" alt="Montage de deux figures publiées séparant les voies visuelles et les circuits hippocampiques." width="820" loading="lazy"></a><figcaption><p>Deux panneaux de sources publiées, juxtaposés par MEDINA ; les modifications sont la conversion en image matricielle, la mise à l’échelle et la juxtaposition. Dans ce rendu, les pointes de flèche et la police du panneau droit ont été perdues : le sens des connexions se lit sur l’original lié ci-dessous. À gauche les voies visuelles ; à droite les connexions hippocampiques, libellées en allemand. Dans le panneau droit, cortex entorhinal, gyrus denté, champs CA3/CA1, subiculum et fornix sont distincts. La comparaison ne démontre pas une cause unique de la perte visuelle et de l’amnésie.</p><p><a href="assets/img/cycle2/g45/g45-09.gif" target="_blank" rel="noopener">Ouvrir l’image en taille originale</a></p><p class="src">Panneau gauche : <a href="https://commons.wikimedia.org/wiki/File:Human_visual_pathway.svg" target="_blank" rel="noopener">« Human visual pathway »</a>, Miquel Perello Nieto, Wikimedia Commons, version du 22 septembre 2022 — <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>. Panneau droit : <a href="https://commons.wikimedia.org/wiki/File:Hippocampus_connections.svg" target="_blank" rel="noopener">« Hippocampus connections »</a>, Rainald62, Wikimedia Commons, 18 décembre 2016 — <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>, licence choisie parmi celles que propose l’auteur. Montage : œuvre dérivée réalisée par MEDINA, diffusée sous la même licence <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>.</p></figcaption></figure>
