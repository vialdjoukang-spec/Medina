Le seuil le plus utilisé de l’élastase fécale-1 est 200 µg/g de selles, sans consensus. Le test n’exclut pas une insuffisance légère à modérée, où sa sensibilité n’est que de 54 à 75 %, et des selles diarrhéiques diluées peuvent donner un faux positif (HaPanEU 2017, énoncé 3-6 [S8]).
