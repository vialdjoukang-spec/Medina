<template data-pop="e12-dpp4" data-title="Inhibiteurs de la DPP-4">
<div class="lab">Position</div><p>Consensus 2025 : sûrs, mais peut-être insuffisants vu la carence insulinique. FCPD : incrétines non recommandées en raison du lien discuté avec la pancréatite (Endotext 2024 ; HaPanEU 2017) ; revue suisse : question ouverte.</p>
<div class="lab">Information professionnelle (Januvia®, sitagliptine, avril 2024)</div><p>Indication suisse : diabète de type 2 ; l’usage dans E12 est hors indication. Dose : 100 mg une fois par jour ; 50 mg si DFGe de 30 à moins de 45 mL/min/1,73 m² ; 25 mg si DFGe inférieur à 30 mL/min/1,73 m². Des pancréatites aiguës, parfois nécrosantes ou mortelles, ont été rapportées : le patient apprend à reconnaître une douleur abdominale sévère et persistante, et le traitement est arrêté en cas de suspicion. En monothérapie, les hypoglycémies sont proches du placebo ; elles augmentent en association avec une sulfonylurée ou l’insuline.</p>
<div class="lab">Conséquence</div><p>Dans la FCPD, maladie pancréatique douloureuse, cette mise en garde renforce la position d’Endotext : l’inhibiteur de la DPP-4 n’y a pas sa place.</p>
</template>
