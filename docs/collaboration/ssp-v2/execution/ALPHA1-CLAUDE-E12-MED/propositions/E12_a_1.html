Elle en exclut le diabète de la grossesse, de l’accouchement et de la puerpéralité (O24.-), la glycosurie sans précision (R81) ou rénale (E74.8), l’intolérance au glucose (R73.0), le diabète néonatal (P70.2) et l’hypo-insulinémie post-opératoire (E89.1) (OMS 2019 [S1]).
