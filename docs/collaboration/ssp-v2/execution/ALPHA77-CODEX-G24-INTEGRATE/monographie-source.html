<div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="g24-tab-semio" role="tab" data-s="g24-s-semio" aria-controls="g24-s-semio" aria-selected="true">Sémiologie fondamentale et analytique</button><button id="g24-tab-anat" role="tab" data-s="g24-s-anat" aria-controls="g24-s-anat" aria-selected="false">Anatomie</button><button id="g24-tab-histo" role="tab" data-s="g24-s-histo" aria-controls="g24-s-histo" aria-selected="false">Histologie</button><button id="g24-tab-physio" role="tab" data-s="g24-s-physio" aria-controls="g24-s-physio" aria-selected="false">Physiologie</button><button id="g24-tab-bio" role="tab" data-s="g24-s-bio" aria-controls="g24-s-bio" aria-selected="false">Biochimie</button><button id="g24-tab-immuno" role="tab" data-s="g24-s-immuno" aria-controls="g24-s-immuno" aria-selected="false">Immunologie et physiopathologie</button></div><div class="chap-body sci-body"><div class="sci" id="g24-s-semio" role="tabpanel" aria-labelledby="g24-tab-semio"><section class="ilot" id="g24-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>Un geste normal dépend de la sélection d’une action, de sa commande et de son exécution, avec ajustement sensorimoteur. La force, la précision, la vitesse, le tonus et la posture sont des dimensions différentes. Une difficulté à écrire n’est pas expliquée d’emblée par une faiblesse ou une seule articulation.</p><p>Le muscle répond normalement à un signal du motoneurone par la transmission cholinergique et le couplage excitation-contraction. La dystonie peut perturber un motif de commande sans exiger une maladie primitive du muscle. Il faut observer l’action dans ses conditions réelles, en respectant douleur et sécurité ; une photographie ne mesure pas cette dynamique.</p><figure data-g24-figure="clinical"><div data-g24-frame="wide"><img src="assets/img/g24/alpha/codex/dystonia.jpg" alt="Photographie réelle d’une personne décrite par l’auteur avec dystonie médicamenteuse, tête tournée et positions des bras et mains visibles" loading="lazy"><span data-g24-mark="1" aria-hidden="true">1</span><span data-g24-mark="2" aria-hidden="true">2</span><span data-g24-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Position de la tête sur la photographie : description statique, pas identification du médicament.</li><li>Membre supérieur relevé : la posture s’interprète avec l’examen et la chronologie.</li><li>Position de la main et des doigts : une image ne teste ni la tâche, ni la répétition, ni un geste atténuateur.</li></ol><p>L’auteur décrit une dystonie médicamenteuse ; agent exact, dose, chronologie et génotype ne sont pas précisés. Ne pas transformer ce cas en forme universelle, en preuve de crampe de l’écrivain ou en diagnostic génétique. Consentement de publication déclaré par l’auteur, sans identité inférée.</p><p data-g24-credit>James Heilman, MD, photographie humaine publiée en 2010 ; consentement verbal et écrit de publication et de licence déclaré sur la page de provenance · <a href="https://commons.wikimedia.org/wiki/File:Dystonia2010.JPG" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DEF — Définition et méthode</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/10-3-muscle-fiber-contraction-and-relaxation" target="_blank" rel="noopener">NORMAL-MUSCLE — Début chapitre 10.3, transmission et contraction</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, mouvements involontaires et situations urgentes</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Dystonia2010.JPG" target="_blank" rel="noopener">IMG-CLINICAL — Provenance, description, droits et pixels originaux</a>.</p></section>
<section class="ilot" id="g24-semio-signs" data-semiology="signs"><h3>Signes et symptômes : distinguer plainte, motif et retentissement</h3><p>La plainte peut être une crampe, une gêne d’écriture, une tête qui tourne, une voix contrainte ou des paupières qui se ferment. Rechercher un mouvement ou une posture répétitif, soutenu ou intermittent, parfois tremblant ou saccadé. La torsion visible n’est pas nécessaire dans toutes les formes.</p><p>Décrire région, direction, déclencheur, durée et conséquences : vision, parole, déglutition, marche, douleur, travail et autonomie. Un mouvement tremblant appartenant au motif dystonique n’est pas automatiquement un tremblement indépendant ; des phénomènes distincts peuvent néanmoins coexister.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DEF — Définition et méthode</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/dystonie/" target="_blank" rel="noopener">CH-USZ-CLIN — Formes, symptômes, examen</a> ; <a data-reference-source="1" href="https://www.hug.ch/neurologie/unite-troubles-mouvement" target="_blank" rel="noopener">CH-HUG — Mission, démarche clinique et suivi</a>.</p></section>
<section class="ilot" id="g24-semio-mechanisms" data-semiology="mechanisms"><h3>Du mécanisme au signe : réseau, neurotransmetteur et effecteur</h3><p>Des causes différentes peuvent perturber un réseau sensorimoteur et aboutir à des postures ressemblantes. Un trouble de synthèse dopaminergique, une exposition médicamenteuse et une lésion anatomique ne constituent pas un mécanisme unique. L’imagerie peut rester sans anomalie détectable dans certaines formes idiopathiques.</p><p>La toxine agit sur la libération périphérique d’acétylcholine et peut réduire le mouvement local ; cela ne prouve pas que le muscle était la source centrale du trouble. À l’inverse, GCH1/BH4 et la synthèse deL-DOPA illustrent une cause où un traitement mécanistique peut modifier le tableau. Aucun mécanisme n’est déduit du seul aspect d’une photo.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">BOT-MECH — Mécanisme d’action</a> ; <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/P30793.txt" target="_blank" rel="noopener">NORMAL-GCH1 — Entrée humaine, voie enzymatique et lienDRD</a> ; <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/P07101.txt" target="_blank" rel="noopener">NORMAL-TH — Fonction/catalyse humaine</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a>.</p></section>
<section class="ilot" id="g24-semio-examination" data-semiology="examination"><h3>Examen : varier repos, action, tâche et mobilité passive</h3><p>Observer au repos puis en posture et pendant la tâche atteinte si possible. Rechercher répétition du motif, débordement vers une région voisine et modification par un geste atténuateur. Tester une tâche controlatérale peut faire apparaître une dystonie en miroir dans le membre atteint au repos ; ce n’est pas un simple mouvement en miroir.</p><p>La mobilisation passive aide à décrire une posture soutenue ou fixée. Compléter par force, réflexes, tonus, coordination, nerfs crâniens et signes associés. Les régions et les dimensions temporelles se notent en mots, pas seulement avec « sévère ». Une dégradation respiratoire ou générale impose de stabiliser avant de détailler la classification.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, mouvements involontaires et situations urgentes</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a>.</p></section>
<section class="ilot" id="g24-semio-interpretation" data-semiology="interpretation"><h3>Interprétation : un signe oriente sans expliquer seul la cause</h3><p>Un geste atténuateur soutient la description, mais son absence n’exclut pas toute dystonie. Une histoire familiale négative ne supprime pas une cause génétique. Un début tardif ou une distribution focale est un indice, pas une démonstration d’idiopathie.</p><p>Un signe supplémentaire doit être caractérisé avant de classer « combinée ». Une douleur ou une anxiété associée à une dystonie cervicale isolée ne suffit pas à changer cette catégorie. La normalité de l’IRM ne permet pas d’affirmer une origine fonctionnelle ; un résultat génétique nécessite une interprétation clinique et familiale.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a>.</p></section>
<section class="ilot" id="g24-semio-differentials" data-semiology="differentials"><h3>Différentiels : les ressemblances ne partagent pas toutes le même traitement</h3><p>Discuter tremblement indépendant, myoclonies, tics, spasticité, faiblesse pyramidale, rétraction mécanique et torticolis non dystonique. Une posture fixée ne tranche pas seule entre cause acquise, fonctionnelle ou autre. Les diagnostics concurrents se recherchent avec tout l’examen.</p><p>Après médicament, distinguer dystonie aiguë, akathisie, parkinsonisme, dyskinésie tardive et syndrome malin. Le bipéridène peut être choisi pour certains troubles extrapyramidaux, mais peut aggraver une dyskinésie tardive. Une inclusion administrative dans G24.0 n’est pas un protocole commun à tous ces phénomènes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G24 et G24.0/.1/.2/.3/.4/.5/.8/.9</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G24 exclusion G80.3, G24.3 exclusion M43.6</a>.</p></section>
<section class="ilot" id="g24-semio-urgency" data-semiology="urgency"><h3>Urgence : voies aériennes, crise diffuse et complications de traitement</h3><p>Difficulté à respirer, à déglutir ou à parler après une exposition ou une injection demande une évaluation immédiate. Une crise diffuse croissante et épuisante peut nécessiter une prise en charge intensive ; le schéma ERN distingue explicitement la crise dystonique des formes stables.</p><p>Rechercher le déclencheur et les défaillances avec l’équipe. Une personne rigide, confuse et fébrile sous médicament peut avoir un syndrome malin ou une autre urgence ; l’anticholinergique n’est pas donné automatiquement devant toute rigidité. La réponse à une première mesure ne dispense pas de surveiller et de reprendre l’enquête.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/08/Final-treatment-algorithm-dystonia_2025_en.pdf" target="_blank" rel="noopener">EU-ERN-TX — p 1,3–6 et algorithme p 6 réellement vu</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a>.</p></section>
<section class="ilot" id="g24-semio-limits" data-semiology="limits"><h3>Limites : image, score et mécanisme ne sont pas le diagnostic entier</h3><p>La photographie de dystonie médicamenteuse ne précise pas l’agent ni sa dose. La coupe du cou montre une anatomie de référence, pas le muscle responsable chez ce patient. Une cellule pigmentée ne mesure pas la dopamine ou le déficit en BH4.</p><p>Les classifications sont des consensus, les preuves thérapeutiques varient selon cause et produit, et une moyenne de groupe ne promet pas une réponse individuelle. Les échelles complètent la fonction et les souhaits du patient. Les auto-relectures IA de ce cours et les contrôles de structure sont distincts d’une validation médicale humaine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Dystonia2010.JPG" target="_blank" rel="noopener">IMG-CLINICAL — Provenance, description, droits et pixels originaux</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray384.png" target="_blank" rel="noopener">IMG-NECK — Provenance, description, droits et pixels originaux</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Neuromelanin_in_a_neuron_of_the_substantia_nigra.jpg" target="_blank" rel="noopener">IMG-HISTO — Provenance, description, droits et pixels originaux</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-LIMIT — Méthode, discussion et droits</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-LIMIT — Limites et conclusion ciblées</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/06/Final-Clinical-Scale-Dystonia_2025-fr.pdf" target="_blank" rel="noopener">EU-ERN-SCALES — p 6 échelles recommandées</a>.</p></section>
<section class="ilot" id="g24-semio-sources" data-semiology="sources"><h3>Sources lues : versions et populations conservées</h3><p>OFS 2024 fournit la nomenclature. HUG/USZ cadrent la pratique et l’organisation suisses. Le consensus international 2025 précise définition et classification. Les arbres ERN publiés en 2026 et le schéma thérapeutique actualisé en 2025 ont des références historiques identifiées, sans les transformer en nouveaux essais.</p><p>Les FI suisses exactes fondent les produits : BOTOX mai 2025, Xeomin mars 2026, Dysport mai 2026, Akineton mai 2022 ; Madopar juin 2023 expose une limite d’âge/indication, Paspertin janvier 2020 une cause médicamenteuse. EASL 2025 concerne Wilson et la revue européenne 2026 les dystonies monogéniques avant stimulation. Les liens suivants permettent de retrouver les sources ; les textes complets restent hors Git.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G24 et G24.0/.1/.2/.3/.4/.5/.8/.9</a> ; <a data-reference-source="1" href="https://www.hug.ch/neurologie/unite-troubles-mouvement" target="_blank" rel="noopener">CH-HUG — Mission, démarche clinique et suivi</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/dystonie/" target="_blank" rel="noopener">CH-USZ-CLIN — Formes, symptômes, examen</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DEF — Définition et méthode</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-CHILD — p 9 arbre enfant/adolescent, réellement vu</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/08/Final-treatment-algorithm-dystonia_2025_en.pdf" target="_blank" rel="noopener">EU-ERN-TX — p 1,3–6 et algorithme p 6 réellement vu</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Indications et contre-indications âge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://easlcampus.eu/sites/default/files/2025-03/EASL-ERN_CPG_on_Wilson%27s_Disease.pdf" target="_blank" rel="noopener">EU-EASL-SYM — p 708 texte et page réellement vus</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-COUNSEL — Résumé, discussion et recommandations ciblées</a>.</p></section>
<section class="ilot" id="g24-semio-bridges" ><h2>Du signe à l’action</h2><p><b>Science → clinique.</b> Décrire motif, tâche et signes associés avant de choisir une étiologie.</p><p><b>Science → examen.</b> Poser une question à l’imagerie, au laboratoire ou à la génétique, avec âge et contexte.</p><p><b>Science → traitement.</b> Distinguer mécanisme causal, soulagement local et prise en charge d’une urgence.</p><div class="key"><b>À retenir.</b> Le signe prend son sens dans un syndrome, une trajectoire et une décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/08/Final-treatment-algorithm-dystonia_2025_en.pdf" target="_blank" rel="noopener">EU-ERN-TX — p 1,3–6 et algorithme p 6 réellement vu</a>.</p></section>
</div><div class="sci" id="g24-s-anat" role="tabpanel" aria-labelledby="g24-tab-anat" hidden><section class="ilot" id="g24-s-anatomy" ><h2>Boucles motrices, voies de commande et anatomie cervicale</h2><p>Le striatum, le pallidum, le noyau sous-thalamique, la substance noire, le thalamus et le cortex participent à la régulation du mouvement. La dystonie ne se résume pas à une lésion obligatoire d’un seul noyau. Le consensus 2025 reconnaît des lésions possibles dans plusieurs composantes du réseau, y compris substance blanche et tronc cérébral, et des formes sans lésion visible.</p><figure data-g24-figure="basal"><div data-g24-frame="wide"><img src="assets/img/g24/alpha/codex/basal.png" alt="Schéma humain de deux niveaux de coupe coronale des noyaux gris, avec striatum, pallidum, noyau sous-thalamique et substance noire" loading="lazy"><span data-g24-mark="1" aria-hidden="true">1</span><span data-g24-mark="2" aria-hidden="true">2</span><span data-g24-mark="3" aria-hidden="true">3</span><span data-g24-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Striatum, nommé sur l’original : territoire d’entrée et de modulation de la boucle.</li><li>GPi : segment interne du globus pallidus, distinct du segment externe GPe nommé juste au-dessus.</li><li>STN : noyau sous-thalamique, nommé dans le second niveau de coupe.</li><li>SN : substance noire dans le second niveau ; la figure ne sépare pas une mesure de dopamine ou un récepteur.</li></ol><p>Deux niveaux coronaux normaux du cerveau humain, pas un résultat d’imagerie ou une lésion G24. La localisation du GPi aide à comprendre une cible de stimulation, sans prédire un bénéfice individuel.</p><p data-g24-credit>Andrew Gillies, schéma humain créé et publié en 2005 · <a href="https://commons.wikimedia.org/wiki/File:Basal-ganglia-coronal-sections.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La voie corticospinale transmet une commande et se distingue de cette régulation. Force, réflexes et signes pyramidaux sont examinés séparément ; leur présence pertinente peut contribuer à une forme combinée ou à l’hypothèse d’une cause structurale. Une planche normale ne remplace pas une concordance anatomoclinique chez le patient.</p><p>Le cou associe de nombreux muscles, organes et structures vasculaires. Une direction visible de tête ne suffit pas à attribuer le phénomène à un seul muscle ; les patterns et l’activation peuvent varier. La connaissance de l’anatomie individuelle et de ses modifications, avec guidage lorsque nécessaire, fait partie du traitement spécialisé.</p><figure data-g24-figure="neck"><div data-g24-frame="tall"><img src="assets/img/g24/alpha/codex/neck.png" alt="Coupe historique humaine du cou au niveau C6, muscles cervicaux, artère carotide, veines et œsophage étiquetés" loading="lazy"><span data-g24-mark="1" aria-hidden="true">1</span><span data-g24-mark="2" aria-hidden="true">2</span><span data-g24-mark="3" aria-hidden="true">3</span><span data-g24-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Sterno-cléido-mastoïdien, nommé sur l’original : muscle cervical à distinguer des structures voisines.</li><li>Artère carotide commune : structure vasculaire, pas une cible musculaire.</li><li>Œsophage, voisin des muscles cervicaux : repère pour comprendre le risque de dysphagie, sans prédire sa survenue.</li><li>Trapèze, nommé sur la coupe : un muscle parmi plusieurs pouvant participer à une posture.</li></ol><p>Anatomie humaine normale de référence ; la coupe n’identifie pas le muscle responsable chez un patient. Aucun trajet d’aiguille ni plan d’injection n’est dessiné ; l’injection exige anatomie individuelle, formation et guidage adaptés.</p><p data-g24-credit>Gray/Carter, Anatomy of the Human Body, édition 1918, planche 384 · <a href="https://commons.wikimedia.org/wiki/File:Gray384.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La proximité de musculature cervicale et de l’œsophage aide à comprendre le risque de dysphagie après diffusion d’une toxine. La carotide n’est pas une cible musculaire. Les figures n’exposent aucun trajet d’aiguille ni plan de traitement du patient ; les pixels sont ceux des originaux humains.</p><p>Le GPi est une cible possible de stimulation dans des situations sélectionnées. Sa localisation ne détermine pas à elle seule l’indication ni la réponse ; cause, phénotype, retentissement et alternatives restent indispensables. Les recommandations monogéniques 2026 demandent une sélection et une évaluation multidisciplinaires.</p><p><b>Science → clinique.</b> Séparer dystonie, faiblesse, spasticité et douleur dans l’examen.</p><p><b>Science → examen.</b> Rechercher une lésion seulement avec une question et sa concordance ; une IRM normale peut être compatible.</p><p><b>Science → traitement.</b> Une cible anatomique normale ne prescrit ni toxine, ni électrode, ni dose.</p><div class="key"><b>À retenir.</b> Un noyau, une voie et un muscle sont des niveaux distincts du raisonnement.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-COUNSEL — Résumé, discussion et recommandations ciblées</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Basal-ganglia-coronal-sections.png" target="_blank" rel="noopener">IMG-BASAL — Provenance, description, droits et pixels originaux</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray384.png" target="_blank" rel="noopener">IMG-NECK — Provenance, description, droits et pixels originaux</a>.</p></section>
</div><div class="sci" id="g24-s-histo" role="tabpanel" aria-labelledby="g24-tab-histo" hidden><section class="ilot" id="g24-s-histology" ><h2>Morphologie du tissu nerveux et limites d’une coupe</h2><p>Le tissu nerveux contient neurones et glies. Le neurone possède un soma, un noyau et des prolongements ; la myéline et l’environnement extracellulaire dépendent aussi de cellules gliales. Une coloration histologique donne des informations morphologiques, pas toutes les propriétés électriques ou biochimiques.</p><figure data-g24-figure="histo"><div data-g24-frame="wide"><img src="assets/img/g24/alpha/codex/neuromelanin.jpg" alt="Microphotographie humaine H&amp;E d’un neurone de substance noire avec pigment brun de neuromélanine et barre de20micromètres" loading="lazy"><span data-g24-mark="1" aria-hidden="true">1</span><span data-g24-mark="2" aria-hidden="true">2</span><span data-g24-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Matériel brun de neuromélanine dans le cytoplasme du neurone, identifié par la provenance.</li><li>Région nucléaire et nucléole visibles : coloration morphologique, pas test d’un récepteur.</li><li>Barre d’échelle originale de 20 µm, soit 0,02 mm ; ne pas mesurer la cellule sur une capture redimensionnée.</li></ol><p>Statut clinique du donneur inconnu ; la photographie n’est pas un cas G24 identifié. Le pigment ne mesure ni dopamine, ni BH4, ni expression de GCH1 ; aucune lésion histologique universelle de dystonie n’est affirmée.</p><p data-g24-credit>Tulemo, microphotographie humaine personnelle, 24 janvier 2021, H&E · <a href="https://commons.wikimedia.org/wiki/File:Neuromelanin_in_a_neuron_of_the_substantia_nigra.jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La provenance identifie un neurone humain de substance noire, coloré en H&E, avec neuromélanine brune. Le statut clinique du donneur n’est pas indiqué. Il ne faut donc pas qualifier cette image de cerveau sain certifié, de maladie de Parkinson ou de dystonie médicamenteuse. La barre originale sert de repère, sans autoriser une mesure sur une capture redimensionnée non étalonnée.</p><p>Il n’existe pas, dans ce cours, de lésion histologique unique présentée comme signature de toutes les dystonies. Certaines formes impliquent une anomalie de signal ou de synthèse, d’autres une lésion acquise. La photographie ne démontre ni expression de GCH1, ni teneur en BH4, ni occupation d’un récepteur.</p><p>Le muscle est l’effecteur d’une commande ; une dystonie ne se définit pas comme une myopathie primitive. Une posture prolongée peut toutefois avoir des conséquences mécaniques, douloureuses et fonctionnelles. Distinguer phénomène moteur et rétraction aide à comprendre pourquoi un traitement symptomatique peut avoir des effets limités sur une déformation fixée.</p><p>La clinique et le bilan ciblé restent premiers. Une biopsie cérébrale ou musculaire n’est pas une exploration de routine de toute dystonie. Un examen tissulaire éventuel répond à une hypothèse précise et appartient à une démarche spécialisée.</p><p><b>Science → clinique.</b> Une image statique ne mesure ni tâche, ni répétition, ni effet d’un geste atténuateur.</p><p><b>Science → examen.</b> Choisir les examens selon la cause recherchée ; ne pas demander une biopsie pour obtenir une étiquette morphologique universelle.</p><p><b>Science → traitement.</b> La présence de pigment ne justifie pas automatiquement lévodopa ou immunothérapie.</p><div class="key"><b>À retenir.</b> Décrire ce que l’on voit et ce que la méthode ne peut pas démontrer.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/12-2-nervous-tissue" target="_blank" rel="noopener">NORMAL-TISSUE — Neurone et glies, réouverture explicite</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/10-3-muscle-fiber-contraction-and-relaxation" target="_blank" rel="noopener">NORMAL-MUSCLE — Début chapitre 10.3, transmission et contraction</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a> ; <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/P30793.txt" target="_blank" rel="noopener">NORMAL-GCH1 — Entrée humaine, voie enzymatique et lienDRD</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Neuromelanin_in_a_neuron_of_the_substantia_nigra.jpg" target="_blank" rel="noopener">IMG-HISTO — Provenance, description, droits et pixels originaux</a>.</p></section>
</div><div class="sci" id="g24-s-physio" role="tabpanel" aria-labelledby="g24-tab-physio" hidden><section class="ilot" id="g24-s-physiology" ><h2>Sélection du geste, régulation et jonction neuromusculaire</h2><p>Une action efficace exige d’activer les effecteurs appropriés au bon moment et d’ajuster le résultat. Le réseau sensorimoteur intègre commande et informations sensitives. Les mécanismes de dystonie sont divers : neurotransmission, plasticité, voies intracellulaires ou lésions peuvent être impliquées selon maladie. Ce sont des niveaux explicatifs, pas un test unique disponible pour chaque patient.</p><figure data-g24-figure="basal"><div data-g24-frame="wide"><img src="assets/img/g24/alpha/codex/basal.png" alt="Schéma humain de deux niveaux de coupe coronale des noyaux gris, avec striatum, pallidum, noyau sous-thalamique et substance noire" loading="lazy"><span data-g24-mark="1" aria-hidden="true">1</span><span data-g24-mark="2" aria-hidden="true">2</span><span data-g24-mark="3" aria-hidden="true">3</span><span data-g24-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Striatum, nommé sur l’original : territoire d’entrée et de modulation de la boucle.</li><li>GPi : segment interne du globus pallidus, distinct du segment externe GPe nommé juste au-dessus.</li><li>STN : noyau sous-thalamique, nommé dans le second niveau de coupe.</li><li>SN : substance noire dans le second niveau ; la figure ne sépare pas une mesure de dopamine ou un récepteur.</li></ol><p>Deux niveaux coronaux normaux du cerveau humain, pas un résultat d’imagerie ou une lésion G24. La localisation du GPi aide à comprendre une cible de stimulation, sans prédire un bénéfice individuel.</p><p data-g24-credit>Andrew Gillies, schéma humain créé et publié en 2005 · <a href="https://commons.wikimedia.org/wiki/File:Basal-ganglia-coronal-sections.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La phénoménologie se teste en faisant varier la condition : repos, action générale ou tâche précise. Un geste atténuateur modifie parfois temporairement la posture ; la dystonie en miroir et le débordement illustrent l’intérêt d’observer au-delà du segment immédiatement gênant. Ces observations n’identifient pas seules le gène ou la cause acquise.</p><p>À la jonction neuromusculaire, la libération d’acétylcholine entraîne une dépolarisation de la fibre puis une mobilisation du calcium qui permet la contraction. L’arrêt du signal et la recapture du calcium participent à la relaxation. La force peut être conservée alors que le motif est anormal ; inversement une faiblesse peut limiter une tâche sans dystonie.</p><p>Une toxine A inhibe la libération périphérique du neurotransmetteur. L’amélioration locale ne signifie pas guérison du trouble de réseau ; une faiblesse excessive peut devenir un effet indésirable. La récupération de la transmission et les besoins individuels expliquent la nécessité d’un suivi, sans rendre identiques les intervalles des différents produits.</p><p>Des anomalies de synthèse dopaminergique peuvent modifier le fonctionnement sans exiger une destruction neuronale. La réponse à un traitement spécialisé se mesure sur les symptômes et la fonction. Ni une seule amélioration ni une absence d’effet à une dose improvisée ne remplace l’enquête étiologique.</p><p><b>Science → clinique.</b> Comparer tâches, conditions et fonction, en séparant faiblesse et motif dystonique.</p><p><b>Science → examen.</b> L’examen répété et les outils ciblés sont complémentaires ; un signal musculaire n’est pas tout le réseau.</p><p><b>Science → traitement.</b> Soulager un effecteur périphérique et traiter une cause biochimique sont des stratégies différentes, parfois complémentaires.</p><div class="key"><b>À retenir.</b> Un mécanisme aide à formuler une question ; il ne dispense pas de vérifier l’indication.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DEF — Définition et méthode</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/10-3-muscle-fiber-contraction-and-relaxation" target="_blank" rel="noopener">NORMAL-MUSCLE — Début chapitre 10.3, transmission et contraction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">BOT-MECH — Mécanisme d’action</a> ; <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/P30793.txt" target="_blank" rel="noopener">NORMAL-GCH1 — Entrée humaine, voie enzymatique et lienDRD</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/08/Final-treatment-algorithm-dystonia_2025_en.pdf" target="_blank" rel="noopener">EU-ERN-TX — p 1,3–6 et algorithme p 6 réellement vu</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Basal-ganglia-coronal-sections.png" target="_blank" rel="noopener">IMG-BASAL — Provenance, description, droits et pixels originaux</a>.</p></section>
</div><div class="sci" id="g24-s-bio" role="tabpanel" aria-labelledby="g24-tab-bio" hidden><section class="ilot" id="g24-s-biochemistry" ><h2>Cofacteur, précurseur, vésicule et unités du produit</h2><p>GCH1 code une GTP cyclohydrolase intervenant dans la biosynthèse du cofacteur tétrahydrobioptérine, BH4. La tyrosinehydroxylase utilise BH4 et l’oxygène pour former L-DOPA à partir de tyrosine. Cette étape appartient à la synthèse des catécholamines. Un déficit de voie peut être pertinent dans une dystonie dopa-sensible ; toutes les dystonies ne partagent pas ce mécanisme.</p><p>La base humaine UniProt/Swiss-Prot documente ces fonctions et leurs sources ; elle n’est pas un protocole de traitement. Un profil diurne, la marche ou des antécédents orientent, mais ne remplacent ni la démarche clinique ni l’interprétation génétique. La présence d’un neurone pigmenté n’établit pas le contenu du cofacteur.</p><figure data-g24-figure="histo"><div data-g24-frame="wide"><img src="assets/img/g24/alpha/codex/neuromelanin.jpg" alt="Microphotographie humaine H&amp;E d’un neurone de substance noire avec pigment brun de neuromélanine et barre de20micromètres" loading="lazy"><span data-g24-mark="1" aria-hidden="true">1</span><span data-g24-mark="2" aria-hidden="true">2</span><span data-g24-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Matériel brun de neuromélanine dans le cytoplasme du neurone, identifié par la provenance.</li><li>Région nucléaire et nucléole visibles : coloration morphologique, pas test d’un récepteur.</li><li>Barre d’échelle originale de 20 µm, soit 0,02 mm ; ne pas mesurer la cellule sur une capture redimensionnée.</li></ol><p>Statut clinique du donneur inconnu ; la photographie n’est pas un cas G24 identifié. Le pigment ne mesure ni dopamine, ni BH4, ni expression de GCH1 ; aucune lésion histologique universelle de dystonie n’est affirmée.</p><p data-g24-credit>Tulemo, microphotographie humaine personnelle, 24 janvier 2021, H&E · <a href="https://commons.wikimedia.org/wiki/File:Neuromelanin_in_a_neuron_of_the_substantia_nigra.jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>À l’autre extrémité de la chaîne, la libération d’acétylcholine nécessite des protéines de la terminaison présynaptique. La toxine A clive SNAP-25 et diminue cette libération. Son action périphérique n’est pas celle d’un antagoniste muscarinique central comme le bipéridène. Les indications, effets indésirables et populations de ces classes doivent rester distincts.</p><p>Les unités d’activité d’une toxine sont définies par le produit et ses méthodes ; elles ne sont pas une masse universelle convertible d’une marque à l’autre. Après reconstitution d’un flacon identifié, la concentration permet un calcul de volume. Exemple fictif de vérification : Dysport 500 U reconstitué avec 2,5 mL de solvant donne 200 U/mL ; une quantité déjà retenue de 40 U correspond mathématiquement à 0,2 mL. Cela ne choisit pas la dose, les muscles ni les sites et ne crée pas une équivalence avec BOTOX ou Xeomin.</p><p>Les consignes de solvant et de préparation proviennent de la FI exacte ; ce calcul ne permet pas de substituer une autre concentration ou de réutiliser un flacon de façon non conforme. Les produits, quantités et intervalles sont documentés pour assurer traçabilité et sécurité.</p><p><b>Science → clinique.</b> Une anomalie de synthèse et une réduction locale de transmission expliquent des tableaux et des réponses différents.</p><p><b>Science → examen.</b> Choisir bilan métabolique/génétique selon syndrome ; ne pas doser un neurotransmetteur à partir d’une photo.</p><p><b>Science → traitement.</b> Vérifier indication, statut d’âge, unités, concentration et intervalle avant toute conversion numérique.</p><div class="key"><b>À retenir.</b> Le calcul vérifie une prescription ; il ne la décide pas.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/P30793.txt" target="_blank" rel="noopener">NORMAL-GCH1 — Entrée humaine, voie enzymatique et lienDRD</a> ; <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/P07101.txt" target="_blank" rel="noopener">NORMAL-TH — Fonction/catalyse humaine</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">BOT-MECH — Mécanisme d’action</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Indications et contre-indications âge</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Neuromelanin_in_a_neuron_of_the_substantia_nigra.jpg" target="_blank" rel="noopener">IMG-HISTO — Provenance, description, droits et pixels originaux</a>.</p></section>
</div><div class="sci" id="g24-s-immuno" role="tabpanel" aria-labelledby="g24-tab-immuno" hidden><section class="ilot" id="g24-s-immunology" ><h2>Glies, causes inflammatoires et anticorps après toxine</h2><p>Les astrocytes soutiennent l’environnement nerveux, les oligodendrocytes participent à la myéline et la microglie à la surveillance tissulaire. Le système nerveux n’est pas isolé de toute interaction immunitaire. Une fonction gliale normale ne doit pas être décrite comme une inflammation pathologique par défaut.</p><p>Le consensus 2025 reconnaît des mécanismes immunitaires/inflammatoires parmi les voies étiopathogéniques possibles. Ils ne constituent pas une explication universelle d’une dystonie. L’histoire, les signes nouveaux et le syndrome déterminent la pertinence d’un bilan infectieux ou immunologique ; aucune immunothérapie ne découle du seul code G24.</p><figure data-g24-figure="motor"><div data-g24-frame="tall"><img src="assets/img/g24/alpha/codex/motor.png" alt="Schéma historique humain de la voie corticospinale, capsule interne et décussation des pyramides, comparaison avec la régulation des noyaux gris" loading="lazy"><span data-g24-mark="1" aria-hidden="true">1</span><span data-g24-mark="2" aria-hidden="true">2</span><span data-g24-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Aire motrice corticale : commande volontaire dans le schéma.</li><li>Capsule interne : passage de fibres, distinct des noyaux striataux voisins.</li><li>Décussation des pyramides : repère de voie corticospinale, pas de la boucle dopaminergique.</li></ol><p>Voie corticospinale humaine normale simplifiée ; dystonie, faiblesse pyramidale et spasticité ne sont pas des synonymes. Cette figure ne démontre pas une inflammation ou une cause acquise chez le patient.</p><p data-g24-credit>Gray 1918, planche 764, trajet moteur humain modifié d’après Poirier · <a href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Une atteinte de voies de commande peut ajouter faiblesse, signes pyramidaux ou autres anomalies à une dystonie. Cette association conduit à examiner plusieurs compartiments et maladies possibles. La planche corticospinale normale ne montre pas d’anticorps, de myélinite ni d’activation microgliale chez le patient.</p><p>Une autre question immunitaire concerne la protéine thérapeutique. Des anticorps neutralisants peuvent contribuer à une diminution de réponse après toxine ; les FI conseillent d’éviter doses ou fréquences inadaptées. Une baisse d’efficacité exige toutefois d’abord une réévaluation complète : diagnostic, sélection des muscles, dose, technique, calendrier et évolution. Elle n’est pas synonyme automatique d’immunisation.</p><p>Une diffusion de toxine entraînant faiblesse, trouble de déglutition ou respiration ne se confond pas avec une inefficacité par anticorps. Le premier problème relève d’une évaluation urgente. Hypersensibilité et anaphylaxie constituent encore d’autres risques, décrits dans les FI, avec une prise en charge propre.</p><p>La tolérance et la réponse se discutent avec le patient et se mesurent. Une maladie causale telle que Wilson demande une stratégie spécifique ; un traitement symptomatique ne suffit pas à couvrir l’étiologie. Les données de stimulation monogénique restent hétérogènes et ne remplacent pas cette distinction.</p><p><b>Science → clinique.</b> Identifier signe nouveau, effet indésirable et évolution de la maladie avant de nommer un mécanisme immunitaire.</p><p><b>Science → examen.</b> Rechercher une cause inflammatoire seulement sur une hypothèse et ne pas déduire des anticorps d’une simple réponse moindre.</p><p><b>Science → traitement.</b> Sécuriser la toxine et traiter une cause active démontrée ; ni immunothérapie ni changement automatique de marque sur le code seul.</p><div class="key"><b>À retenir.</b> Cause inflammatoire, immunisation thérapeutique et diffusion toxique sont trois questions distinctes.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/12-2-nervous-tissue" target="_blank" rel="noopener">NORMAL-TISSUE — Neurone et glies, réouverture explicite</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://easlcampus.eu/sites/default/files/2025-03/EASL-ERN_CPG_on_Wilson%27s_Disease.pdf" target="_blank" rel="noopener">EU-EASL-SYM — p 708 texte et page réellement vus</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-LIMIT — Limites et conclusion ciblées</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">IMG-MOTOR — Provenance, description, droits et pixels originaux</a>.</p></section>
</div></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="g24-p-plan" ><h2>Produit, indication, population et objectif</h2><p>Le traitement d’une dystonie ne se résume pas à relâcher un muscle. Revoir une exposition, traiter une cause, soulager un symptôme et restaurer une fonction sont des objectifs différents. Les choix locaux, oraux et neurochirurgicaux dépendent de la distribution, du mécanisme et du retentissement.</p><p>Les trois produits injectables ci-dessous ont des <b>unités spécifiques non interchangeables</b>. BOTOX n’est pas le nom de toute toxine botulique. Une même quantité chiffrée, une dilution identique ou un délai moyen d’effet ne permet pas une substitution. Les injections relèvent d’un médecin formé, avec anatomie individuelle et indication propres ; aucune planche de ce cours n’est un plan d’injection.</p><p>Cinq FI thérapeutiques principales ont été lues : BOTOX mai 2025, Xeomin mars 2026, Dysport mai 2026, Akineton mai 2022 et Madopar juin 2023. Une sixième FI, Paspertin janvier 2020, documente une cause médicamenteuse. Les dates concernent l’information professionnelle, sans affirmation de disponibilité de chaque emballage.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.usz.ch/fachbereich/neurologie/angebot/dystonie/" target="_blank" rel="noopener">CH-USZ-TX — Toxine, oral, stimulation et mesures associées</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/08/Final-treatment-algorithm-dystonia_2025_en.pdf" target="_blank" rel="noopener">EU-ERN-TX — p 1,3–6 et algorithme p 6 réellement vu</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Indications et contre-indications âge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a>.</p></section>
<section class="ilot" id="g24-p-botox" ><h2>BOTOX : doses suisses et âge de l’indication</h2><p><b>FI mai 2025</b>, AbbVieAG, GTIN 7680524330017, poudre pour solution injectable, unités propres à BOTOX. La toxine A inhibe la libération présynaptique périphérique d’acétylcholine par clivage de SNAP-25. Son bénéfice local ne démontre pas une guérison de la cause centrale.</p><table class="t"><thead><tr><th>Indication FI</th><th>Début et limites</th><th>Intervalle</th></tr></thead><tbody><tr><td>Blépharospasme/hémispasme facial, patients de plus de 12 ans</td><td>Début 1,25–2,5 U par site ; initial ≤ 25 U par œil ; dose totale ≤ 100 U par 12 semaines</td><td>Pas de bénéfice supplémentaire démontré à raccourcir sous trois mois dans cette rubrique</td></tr><tr><td>Dystonie cervicale, adultes seulement</td><td>Première séance ≤ 200 U ; séances ultérieures adaptées, total ≤ 300 U ;≤ 50 U/site ; sterno-cléido-mastoïdien ≤ 100 U et éviter bilatéralité</td><td>Ne pas répéter à moins de 10 semaines</td></tr></tbody></table><p>Les chiffres par site, par muscle et par séance sont des limites différentes, pas des objectifs à atteindre. La FI privilégie la dose minimale efficace chez une personne jamais traitée ; masse musculaire, hypertrophie/atrophie et réponse antérieure comptent. Le guidage électromyographique peut être nécessaire si le muscle atteint est difficile à identifier.</p><p>Le schéma d’un blépharospasme de plus de douze ans n’autorise pas une dose cervicale pédiatrique. Les autres indications de spasticité, migraine ou vessie ont des populations et doses propres, non transposées ici. La durée moyenne de réponse n’efface pas les intervalles minimaux de la rubrique choisie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">BOT-MECH — Mécanisme d’action</a>.</p></section>
<section class="ilot" id="g24-p-xeomin" ><h2>Xeomin : contre-indications et intervalle propres</h2><p><b>FI mars 2026</b>, MerzPharma(Schweiz)AG, GTIN 7680620800025. Flacons 50,100 ou 200 unités DL50 spécifiques à Xeomin ; la toxine A 150 kD est sans protéines complexantes. Cela ne prouve pas une absence de tout risque immunologique.</p><table class="t"><thead><tr><th>Indication dystonique adulte</th><th>Doses FI</th><th>Intervalle minimal</th></tr></thead><tbody><tr><td>Blépharospasme</td><td>Début 1,25–2,5 U/site ; initial ≤ 25 U/œil ; total recommandé ≤ 100 U</td><td>Au moins 8 semaines, adapté au besoin réel</td></tr><tr><td>Torticolis spasmodique à prédominance rotationnelle</td><td>Habituellement total ≤ 200 U ; maximum 300 U ;≤ 50 U/site ; début généralement plus bas si jamais traité</td><td>Au moins 8 semaines, adapté au besoin réel</td></tr></tbody></table><p>Éviter l’injection bilatérale du sterno-cléido-mastoïdien ; la FI décrit un risque accru de dysphagie en cas de bilatéralité ou de dose supérieure à 100 U dans ce muscle. Le plan dépend du phénotype et de l’anatomie, avec guidage électromyographique ou échographique si nécessaire.</p><p><b>Contre-indications</b> : hypersensibilité, troubles généralisés d’activité musculaire tels que myasthénie grave ou syndrome de Lambert-Eaton, infection ou inflammation du point prévu. Ces libellés ne doivent pas être harmonisés silencieusement avec les précautions des autres produits.</p><p>L’indication pédiatrique de Xeomin concerne notamment la sialorrhée chronique gênante de deux à dix-sept ans dans des conditions définies. Elle ne rend pas ces doses autorisées pour une dystonie cervicale de l’enfant ; la FI ne fournit pas de recommandation pédiatrique dystonique à recopier.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a>.</p></section>
<section class="ilot" id="g24-p-dysport" ><h2>Dysport : un plafond cervical différent dans la FI suisse</h2><p><b>FI mai 2026</b>, IpsenPharmaSchweizGmbH, GTIN 7680550570029. Flacons 300 U ou 500 U propres à Dysport. Les unités ne sont ni équivalentes ni interchangeables avec celles d’autres toxines.</p><table class="t"><thead><tr><th>Indication adulte</th><th>Début et adaptation FI</th><th>Délai</th></tr></thead><tbody><tr><td>Torticolis spasmodique</td><td>Initial 500 U IM ; ensuite 250–500 U selon réponse, ajustements progressifs de 100–250 U ; maximum total 500 U ; sterno-cléido-mastoïdien ≤ 300 U</td><td>Habituellement autour de 16 semaines si besoin ; jamais plus fréquemment que 12 semaines</td></tr><tr><td>Blépharospasme</td><td>Initial 40 U/œil ; doses ultérieures 60 ou 80 U selon besoin et tolérance ; maximum 120 U/œil</td><td>Habituellement autour de 12 semaines ; pas plus fréquemment que 12 semaines</td></tr></tbody></table><p>Les doses cervicales sont celles d’un adulte de poids normal sans hypotrophie de la nuque. La FI demande une diminution si amaigrissement ou chez une personne âgée dont la musculature est hypotrophiée. Aucun facteur de réduction arbitraire n’est inventé.</p><p><b>Ne pas importer un plafond de 1000 U cervical d’un autre référentiel.</b> Le plafond de cette FI suisse est 500 U pour ce contexte, distinct des doses de spasticité d’autres régions. Les indications pédiatriques de spasticité dès deux ans ne sont pas une posologie générale de dystonie pédiatrique.</p><p>La contre-indication générale est l’hypersensibilité. Les troubles de transmission neuromusculaire, dont myasthénie, relèvent ici d’une surveillance spécialisée et d’une balance bénéfice/risque, avec vigilance pour faiblesse, dysphagie et respiration. Infection/inflammation du site et trouble de coagulation imposent aussi les précautions spécifiques de la FI ; ne pas les réécrire comme une liste identique à Xeomin.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a>.</p></section>
<section class="ilot" id="g24-p-toxin-safety" ><h2>Toxines : sécurité, interactions, organes et reproduction</h2><p>Les produits peuvent provoquer faiblesse locale, ptose, diplopie, trouble de protection cornéenne ou douleur selon région. Une diffusion à distance peut entraîner faiblesse importante, dysphagie, pneumonie d’aspiration ou dyspnée. Informer le patient et l’entourage : difficulté nouvelle à avaler, parler ou respirer exige une prise en charge immédiate, même si le traitement visait une autre région.</p><p>Avant injection, évaluer déglutition/respiration préexistantes, faiblesse/atrophie, atteinte neuromusculaire, anticoagulation et anatomie modifiée. BOTOX est contre-indiqué en cas d’infection du site ; myasthénie et Lambert-Eaton y constituent une précaution sous spécialiste, tandis queXeomin les cite comme contre-indications. Les différences de rédaction des FI sont conservées.</p><p>Les aminoglycosides, certains myorelaxants et autres agents de transmission neuromusculaire peuvent potentialiser l’effet. Les effets de l’association rapprochée de différentes toxines sont insuffisamment connus et une faiblesse peut être majorée avant disparition de l’effet précédent. L’absence d’étude d’interaction complète n’équivaut pas à absence de risque.</p><p>Aucune table universelle de réduction rénale ou hépatique par clairance n’est inventée pour ces injections locales. Les comorbidités et la faiblesse influencent la décision clinique ; les unités d’une autre voie ou indication ne deviennent pas un ajustement d’organe. Chez l’enfant, indication exacte, poids, âge et risques d’aspiration sont vérifiés, sans extrapolation de doses cervicales adultes.</p><p><b>Grossesse/allaitement.</b> BOTOX et Dysport ne sont pas proposés pendant grossesse sauf nécessité absolue selon leurs FI ; Xeomin demande nécessité claire et avantages justifiant le risque. L’allaitement est déconseillé ou non recommandé dans ces informations. Il s’agit d’une décision individuelle sur le produit, distincte de la gestion d’une maladie causale et sans consigne autonome d’arrêt d’autres médicaments.</p><p>Des injections trop fréquentes ou doses inadéquates peuvent favoriser les anticorps et une réduction de réponse. Une réponse insuffisante conduit toutefois à revoir diagnostic, muscles, dose, technique, intervalle et objectifs avant de conclure à une immunisation. Documenter nom commercial et lot à chaque séance.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a> ; <a data-reference-source="1" href="https://easlcampus.eu/sites/default/files/2025-03/EASL-ERN_CPG_on_Wilson%27s_Disease.pdf" target="_blank" rel="noopener">EU-EASL-SYM — p 708 texte et page réellement vus</a>.</p></section>
<section class="ilot" id="g24-p-akineton" ><h2>Bipéridène : aigu médicamenteux et titration orale distingués</h2><p><b>Akineton, FI mai 2022</b>, LaboratorioFarmaceuticoS.I.T.S.r.l., GTIN 7680240360220. La FI mentionne troubles extrapyramidaux médicamenteux et autres troubles dont dystonies généralisées/segmentaires, syndrome de Meige, blépharospasme et torticolis spasmodique. Le blocage anticholinergique central diffère du mécanisme périphérique d’une toxine.</p><table class="t"><thead><tr><th>Forme et contexte</th><th>Schéma FI attribué</th></tr></thead><tbody><tr><td>Adulte, trouble extrapyramidal nécessitant effet rapide</td><td>2,5–5 mg par dose IM ou IV très lente ; répétition possible 30 minutes plus tard selon besoin ; maximum journalier 10–20 mg</td></tr><tr><td>Comprimé immédiat 2 mg, trouble médicamenteux adulte</td><td>1–4 mg par prise, une à quatre fois/j selon symptômes ; pas début systématique à dose élevée</td></tr><tr><td>Trouble non médicamenteux, oral adulte</td><td>Début faible 2 mg, augmentation progressive de 2 mg par semaine ; entretien spécialisé individualisé</td></tr><tr><td>Retard 4 mg</td><td>Déterminer d’abord besoin avec immédiat ; habituellement 1–2 comprimés/j ; maximum 3 comprimés= 12 mg/j ; ne pas diviser/écraser/mâcher</td></tr></tbody></table><p>Le maximum 16 mg/j de la rubrique Parkinson ne doit pas être transformé en plafond universel de toute dystonie non médicamenteuse. Inversement, le texte de titration spécialisée ne justifie pas une très haute dose automatique. La tolérance, les organes et l’objectif doivent être réévalués.</p><p>La solution contient 5 mg par 1 mL. Exemple de vérification d’une dose adulte déjà choisie :2,5 mg correspondent à 0,5 mL de cette solution, pas à un demi-volume d’une autre concentration. L’injection reste un geste professionnel surveillé ; aucun traitement à domicile n’est déduit de ce calcul.</p><p>Contre-indications : hypersensibilité, glaucome à angle étroit, sténose digestive mécanique, mégacôlon et iléus. Prudence si tachycardie, tendance convulsive, trouble de vidange vésicale/prostate et vulnérabilité cognitive. Confusion, troubles mnésiques et charge anticholinergique sont particulièrement importants chez la personne âgée. Les données en insuffisance rénale/hépatique sont absentes : aucun ajustement chiffré n’est fabriqué.</p><p>Les autres anticholinergiques majorent effets centraux/périphériques ; vérifier psychotropes, antihistaminiques, alcool et autres associations. Akineton peut aggraver une dyskinésie tardive, malgré l’inclusion de celle-ci dans G24.0. Une rigidité confuse et fébrile ne devient pas automatiquement une indication de bipéridène.</p><p>Les données pédiatriques sont limitées et surtout temporaires dans les dystonies médicamenteuses ; doses adultes et forme retard ne s’extrapolent pas. Grossesse : prudence. Allaitement : emploi déconseillé. Sauf urgence, éviter arrêt brusque et réduire progressivement avec prescripteur.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G24 et G24.0/.1/.2/.3/.4/.5/.8/.9</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a>.</p></section>
<section class="ilot" id="g24-p-causal" ><h2>Dopa-sensibilité, Wilson et médicaments responsables</h2><p><b>Essai de dopa-sensibilité.</b> Le parcours européen pédiatrique prévoit un essai spécialisé dans certaines démarches de causes traitables. La FI suisse Madopar juin 2023, RochePharma(Schweiz)AG, GTIN 7680523770487, indique des syndromes parkinsoniens sauf origine médicamenteuse et contre-indique les moins de 25 ans. Il ne faut donc pas présenter un essai pédiatrique de dystonie comme application automatique de cette FI. Produit, indication, statut hors indication, dose et suivi relèvent du centre ; aucun schéma universel n’est donné ici.</p><p><b>Wilson.</b> EASL 2025 distingue traitement anti-cuivre causal et traitements symptomatiques, parfois nécessaires malgré contrôle de la maladie. La toxine peut soulager une forme focale sans remplacer la stratégie de Wilson. Un chélateur n’est pas prescrit au seul code G24 ; ses indications, formulation et surveillance sont propres à la maladie. La poursuite d’un traitement causal pendant grossesse se discute dans ce cadre et ne se déduit pas des précautions d’une toxine.</p><p><b>Métoclopramide causal.</b> Paspertin, FI janvier 2020, ViatrisPharmaGmbH, GTIN 7680327350380 : dystonie aiguë/crise oculogyre et autres troubles extrapyramidaux possibles même après une seule dose, surtout enfant/adulte jeune. Dyskinésie tardive potentiellement irréversible et syndrome malin sont aussi rapportés. La FI limite généralement le traitement à cinq jours et contre-indique avant un an ; certaines indications pédiatriques ont un cadre et une durée propres. Cette molécule n’est pas un traitement de la dystonie et aucune dose antiémétique n’est proposée ici.</p><p>Une suspicion médicamenteuse entraîne réévaluation de l’exposition, de la sécurité et du relais. Dystonie aiguë, syndrome malin et dyskinésie tardive ne doivent pas être traités comme des synonymes. Les cas/quiz de MEDINA restent des exercices fictifs originaux, sans statut d’items officiels de l’examen fédéral.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-CHILD — p 9 arbre enfant/adolescent, réellement vu</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Indications et contre-indications âge</a> ; <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/P30793.txt" target="_blank" rel="noopener">NORMAL-GCH1 — Entrée humaine, voie enzymatique et lienDRD</a> ; <a data-reference-source="1" href="https://easlcampus.eu/sites/default/files/2025-03/EASL-ERN_CPG_on_Wilson%27s_Disease.pdf" target="_blank" rel="noopener">EU-EASL-SYM — p 708 texte et page réellement vus</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction et CK/CS</a>.</p></section>
<section class="ilot" id="g24-p-calculation" ><h2>Calcul et traçabilité : le produit reste dans chaque ligne</h2><p><b>Exercice fictif, après choix clinique de la quantité.</b> La FI Dysport permet de reconstituer un flacon 500 U avec 2,5 mL de solution injectable de NaCl 0,9% sans conservateur pour obtenir 200 U/mL. Pour une quantité déjà retenue de 40 U :40 U÷ 200 U/mL= 0,2 mL. Avec une autre concentration, le volume change ; avec une autre marque, les unités elles-mêmes ne sont pas équivalentes.</p><p>Ce calcul ne choisit ni indication, ni dose, ni muscles, ni sites, ni fréquence. Les flacons 300 U et 500 U et les différentes indications ont des consignes de préparation propres. La FI prévoit utilisation immédiate du point de vue microbiologique ; toute conservation doit suivre ses conditions et responsabilités, sans protocole improvisé.</p><p>Documenter avant la séance : produit et lot, indication, dose en unités du produit, concentration, volume correspondant, sites réellement traités et délai depuis séance précédente. Après : réponse, durée, retentissement fonctionnel, effets indésirables et prochain plan. Une auto-relecture IA de ce cours ne remplace pas une validation médicale humaine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/06/Final-Clinical-Scale-Dystonia_2025-fr.pdf" target="_blank" rel="noopener">EU-ERN-SCALES — p 6 échelles recommandées</a>.</p></section>
