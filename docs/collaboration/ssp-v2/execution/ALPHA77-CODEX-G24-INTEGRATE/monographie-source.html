<template data-pop="g24-definition" data-title="Dystonie : décrire le phénomène"><p>Mouvements ou postures anormaux, soutenus ou intermittents, souvent organisés en motifs répétitifs ; ils peuvent être tremblants ou saccadés. L’action peut les déclencher ou les aggraver.</p><p>La torsion n’est pas indispensable dans chaque forme. Le terme décrit un trouble du mouvement et ne prouve ni lésion musculaire primitive, ni cause génétique unique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DEF — Définition et méthode</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a>.</p></template>
<template data-pop="g24-pattern" data-title="Un motif moteur répétitif"><p>Décrire direction, régions et conditions de survenue, avec une tâche sûre et reproductible. Un mouvement organisé en motif n’est pas simplement toute secousse ou toute douleur.</p><p>Observer aussi les autres dimensions : force, tonus, réflexes, coordination et retentissement. La description aide au diagnostic sans identifier seule une cause.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DEF — Définition et méthode</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, mouvements involontaires et situations urgentes</a>.</p></template>
<template data-pop="g24-geste" data-title="Geste atténuateur"><p>Certaines manœuvres volontaires améliorent brièvement une posture ; un contact léger au menton peut illustrer une forme cervicale. Décrire l’effet observé et sa durée.</p><p>Ce signe peut aider mais n’est pas obligatoire ni une preuve étiologique universelle. Une photo ne montre pas l’avant/après ; l’examen dynamique reste nécessaire.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/dystonie/" target="_blank" rel="noopener">CH-USZ-CLIN — Formes, symptômes, examen</a>.</p></template>
<template data-pop="g24-overflow" data-title="Débordement"><p>Un mouvement dystonique peut s’étendre à un segment voisin apparemment non concerné et sans rapport approprié avec le geste voulu. Il faut examiner au-delà de la région dont le patient se plaint.</p><p>Le phénomène contribue à la description clinique ; il ne signifie pas automatiquement progression à une forme généralisée ni atteinte d’un gène particulier.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DISTR — Distribution corporelle</a>.</p></template>
<template data-pop="g24-mirror" data-title="Dystonie en miroir"><p>Une tâche réalisée du côté non atteint peut provoquer une posture dystonique dans le membre atteint au repos, souvent avec la tâche habituellement gênante.</p><p>Cela diffère d’un mouvement en miroir reproduisant simplement le mouvement controlatéral. Le mot miroir doit correspondre à ce qui est réellement observé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a>.</p></template>
<template data-pop="g24-fixed" data-title="Posture soutenue ou fixée"><p>Le consensus distingue une posture soutenue au repos mais mobilisable passivement et une posture persistante peu modifiable par mobilisation passive. Respecter douleur et sécurité.</p><p>Le caractère fixé ne démontre pas seul une cause fonctionnelle ou mécanique. L’ensemble du tableau et les diagnostics concurrents doivent être examinés.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a>.</p></template>
<template data-pop="g24-classification" data-title="Deux axes, deux questions"><p>L’axeI décrit âge de début, famille, distribution, temporalité, phénoménologie et signes associés. L’axeII organise causes génétiques/acquises, anatomie et mécanismes.</p><p>Ces axes ne dictent pas seuls le code. La CIM suisse conserve des libellés et inclusions propres, dont la dyskinésie tardive enG24.0 et les frontièresG80.3/M43.6.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G24 et G24.0/.1/.2/.3/.4/.5/.8/.9</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G24 exclusion G80.3, G24.3 exclusion M43.6</a>.</p></template>
<template data-pop="g24-distribution" data-title="Distribution révisée2025"><p>Focale : une région ; segmentaire : deux ou trois contiguës ; multifocale : deux ou trois non contiguës ; hémidystonie : membres supérieur et inférieur d’un même côté.</p><p>Généralisée dépasse les schémas précédents sans être hémidystonie. Tronc avec deux autres régions ou trois/quatre membres sans tronc sont des exemples ; une règle mécanique>3 régions est insuffisante.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DISTR — Distribution corporelle</a>.</p></template>
<template data-pop="g24-combined" data-title="Isolée ou combinée"><p>Des signes neurologiques ou systémiques pertinents peuvent faire classer combinée : autre mouvement distinct, signes pyramidaux, développement ou atteinte hépatique, par exemple.</p><p>Une douleur ou une anxiété ne change pas à elle seule une dystonie cervicale isolée en combinée. Un mouvement dystonique tremblant peut aussi être différent d’un tremblement indépendant.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a>.</p></template>
<template data-pop="g24-etiology" data-title="Étiologie : cause et niveau de preuve"><p>Une dystonie peut être liée à une cause génétique, une exposition, une lésion, une maladie métabolique ou un autre mécanisme. Des catégories peuvent se recouvrir.</p><p>Une imagerie normale ou une histoire familiale négative ne suffisent pas à expliquer la cause. Décrire l’hypothèse, les arguments et les incertitudes puis choisir des investigations utiles.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a>.</p></template>
<template data-pop="g24-history" data-title="Le premier symptôme moteur"><p>Dater région initiale, tâche, installation et évolution, en distinguant âge actuel et âge du début moteur. Rechercher variations diurnes, effet du sommeil, famille et signes associés.</p><p>Reprendre aussi tous les médicaments, les changements et dernières prises réelles. Une ordonnance ou une photo isolée ne donne pas la chronologie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://www.hug.ch/neurologie/unite-troubles-mouvement" target="_blank" rel="noopener">CH-HUG — Mission, démarche clinique et suivi</a>.</p></template>
<template data-pop="g24-task" data-title="Spécifique d’une tâche"><p>Certaines formes surviennent surtout pendant écriture, jeu instrumental ou une autre activité précise. Observer la tâche quand cela est possible et sûr.</p><p>La difficulté ne se résume pas à une faiblesse ou un manque d’entraînement. Décrire le motif, sa reproductibilité et le retentissement ; une adaptation de tâche fait partie du plan individualisé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/dystonie/" target="_blank" rel="noopener">CH-USZ-CLIN — Formes, symptômes, examen</a> ; <a data-reference-source="1" href="https://www.usz.ch/fachbereich/neurologie/angebot/dystonie/" target="_blank" rel="noopener">CH-USZ-TX — Toxine, oral, stimulation et mesures associées</a>.</p></template>
<template data-pop="g24-exam" data-title="Comparer des conditions"><p>Observer repos, posture et action ; rechercher geste atténuateur, débordement et signes associés. Examiner aussi force, réflexes, tonus, coordination et nerfs crâniens.</p><p>En cas d’instabilité, la sécurité précède une classification détaillée. Documenter les limites de l’examen et refaire une évaluation utile dans la trajectoire.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, mouvements involontaires et situations urgentes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a>.</p></template>
<template data-pop="g24-drug" data-title="Médicament causal"><p>Les neuroleptiques et certains autres agents peuvent provoquer des troubles extrapyramidaux. La FI du métoclopramide décrit dystonie aiguë et crise oculogyre même après une dose, particulièrement chez enfant/adulte jeune.</p><p>Nom, indication, dose, durée et chronologie doivent être retrouvés. Le produit responsable n’est pas toujours prescrit pour une maladie neurologique ou psychiatrique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a>.</p></template>
<template data-pop="g24-acute" data-title="Dystonie aiguë médicamenteuse"><p>Une posture cervicale, faciale, linguale ou une crise oculogyre après exposition impose d’évaluer la sécurité et l’hypothèse causale. Une difficulté de déglutition ou respiration change le circuit urgent.</p><p>Revoir le produit avec l’équipe ; le bipéridène peut relever de sa FI dans un contexte évalué. Cela ne constitue pas le traitement universel d’une dyskinésie tardive ou d’un syndrome malin.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a>.</p></template>
<template data-pop="g24-tardive" data-title="Dyskinésie tardive etG24.0"><p>La nomenclature inclut dyskinésie tardive sousG24.0. Cette inclusion ne signifie pas que tous les phénomènes médicamenteux ont la même temporalité, le même mécanisme ou le même traitement.</p><p>La FI Akineton précise qu’il peut aggraver une dyskinésie tardive. Le métoclopramide peut aussi entraîner un syndrome tardif potentiellement irréversible ; réévaluer la conduite avec expertise.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G24 et G24.0/.1/.2/.3/.4/.5/.8/.9</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a>.</p></template>
<template data-pop="g24-storm" data-title="Crise dystonique sévère"><p>Le schéma thérapeutique ERN distingue la crise dystonique des formes stables et prévoit une prise en charge intensive, avec options spécialisées de secours.</p><p>Une aggravation diffuse épuisante, un problème respiratoire ou une défaillance générale ne doit pas attendre une visite de routine. Chercher aussi déclencheur, exposition et diagnostics concurrents.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/08/Final-treatment-algorithm-dystonia_2025_en.pdf" target="_blank" rel="noopener">EU-ERN-TX — p 1,3–6 et algorithme p 6 réellement vu</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a>.</p></template>
<template data-pop="g24-airway" data-title="Respirer et déglutir"><p>Évaluer rapidement une difficulté nouvelle à parler, avaler ou respirer. Le contexte peut être une réaction médicamenteuse, une complication de toxine ou une autre maladie urgente.</p><p>Après injection, une diffusion peut affecter des muscles à distance et entraîner aspiration ou détresse respiratoire. Le patient et l’entourage doivent connaître les signes à signaler immédiatement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a>.</p></template>
<template data-pop="g24-imaging" data-title="Imagerie orientée"><p>L’imagerie recherche une lésion pertinente selon âge, début et signes associés. Certaines dystonies idiopathiques n’ont pas d’anomalie détectable en imagerie clinique.</p><p>La normalité ne prouve pas une origine fonctionnelle ; une lésion doit aussi être concordante. Le parcours pédiatrique et la démarche adulte n’imposent pas le même bilan automatique à tout patient.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-CHILD — p 9 arbre enfant/adolescent, réellement vu</a>.</p></template>
<template data-pop="g24-genetics" data-title="Génétique et conseil"><p>Âge, famille, distribution et signes associés orientent les analyses. Une histoire familiale négative n’exclut pas une cause génétique ; un variant s’interprète avec le phénotype et le conseil.</p><p>La revue monogénique européenne 2026 soutient la génétique avant stimulation et une mesure systématique des résultats. Elle n’offre pas une prédiction individuelle universelle à partir d’un seul nom de gène.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-COUNSEL — Résumé, discussion et recommandations ciblées</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-LIMIT — Limites et conclusion ciblées</a>.</p></template>
<template data-pop="g24-wilson" data-title="Wilson : traiter la maladie et ses symptômes"><p>Une dystonie, notamment avec signes hépatiques ou neuropsychiatriques, peut justifier une démarche spécialisée de Wilson. Plusieurs examens et arguments s’intègrent ; un seul dosage ne décide pas.</p><p>Le traitement causal anti-cuivre et les traitements symptomatiques peuvent être complémentaires. Une injection locale ne remplace pas le traitement de la maladie, et un chélateur ne se prescrit pas au seul code G24.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://easlcampus.eu/sites/default/files/2025-03/EASL-ERN_CPG_on_Wilson%27s_Disease.pdf" target="_blank" rel="noopener">EU-EASL-DX — p 695–696 diagnostic, passages ciblés réouverts</a> ; <a data-reference-source="1" href="https://easlcampus.eu/sites/default/files/2025-03/EASL-ERN_CPG_on_Wilson%27s_Disease.pdf" target="_blank" rel="noopener">EU-EASL-SYM — p 708 texte et page réellement vus</a>.</p></template>
<template data-pop="g24-dopa" data-title="Dopa-sensibilité : une cause traitable"><p>Un trouble de synthèse dopaminergique peut produire un tableau dystonique, parfois avec marche et variation diurne. Le parcours pédiatrique européen prévoit un essai spécialisé dans une démarche de causes traitables.</p><p>Produit, protocole et statut réglementaire sont vérifiés. La FI suisse Madopar contre-indique les moins de 25 ans : un essai pédiatrique n’est donc pas une application automatique de cette FI.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/P30793.txt" target="_blank" rel="noopener">NORMAL-GCH1 — Entrée humaine, voie enzymatique et lienDRD</a> ; <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/P07101.txt" target="_blank" rel="noopener">NORMAL-TH — Fonction/catalyse humaine</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-CHILD — p 9 arbre enfant/adolescent, réellement vu</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Indications et contre-indications âge</a>.</p></template>
<template data-pop="g24-gch1" data-title="GCH1, BH4 et tyrosinehydroxylase"><p>La GTP cyclohydrolase1 participe à la biosynthèse du cofacteur BH4. La tyrosinehydroxylase utilise ce cofacteur et l’oxygène pour produire L-DOPA à partir de tyrosine.</p><p>C’est un exemple mécanistique, pas une explication de toutes les dystonies. Une photographie de neurone ne mesure ni cette voie ni un déficit ; aucune dose de médicament ne se déduit de l’équation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/P30793.txt" target="_blank" rel="noopener">NORMAL-GCH1 — Entrée humaine, voie enzymatique et lienDRD</a> ; <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/P07101.txt" target="_blank" rel="noopener">NORMAL-TH — Fonction/catalyse humaine</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Neuromelanin_in_a_neuron_of_the_substantia_nigra.jpg" target="_blank" rel="noopener">IMG-HISTO — Provenance, description, droits et pixels originaux</a>.</p></template>
<template data-pop="g24-toxin" data-title="Une action périphérique locale"><p>La toxine botuliqueA diminue la libération d’acétylcholine par action sur une terminaison présynaptique, notamment clivage de SNAP-25. Le muscle reçoit moins de signal.</p><p>Le traitement peut soulager un phénomène focal sans guérir sa cause centrale. Une faiblesse excessive ou une diffusion peut être indésirable ; produit, indication, anatomie et surveillance comptent.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">BOT-MECH — Mécanisme d’action</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a>.</p></template>
<template data-pop="g24-units" data-title="Les unités restent celles du produit"><p>Les méthodes et unités d’activité des toxines sont spécifiques. Une même valeur numérique de BOTOX, Xeomin et Dysport ne représente pas une prescription interchangeable.</p><p>Les plafonds et intervalles sont aussi propres à l’indication. Pour cervicale dans les FI lues : BOTOX ≤ 300 U avec ≥ 10 semaines, Xeomin ≤ 300 U avec ≥ 8 semaines, Dysport ≤ 500 U avec ≥ 12 semaines ; début et précautions restent à vérifier.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a>.</p></template>
<template data-pop="g24-dilution" data-title="Concentration et volume, après choix clinique"><p>Exemple fictif attribué à Dysport :500 U reconstituées avec 2,5 mL de solvant donnent 200 U/mL. Une quantité déjà retenue de 40 U correspond à 40 ÷ 200 = 0,2 mL.</p><p>Le calcul ne choisit pas dose, muscles, sites ou intervalle. Une autre concentration change le volume ; une autre marque change aussi le sens des unités. Suivre préparation, solvant et conservation propres au flacon.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a>.</p></template>
<template data-pop="g24-akineton" data-title="Bipéridène : indication et limites"><p>Akineton a des indications extrapyramidales, avec schéma aigu injectable adulte et titration orale distincts. La FI précise formes et populations, cognition et risques anticholinergiques.</p><p>Ne pas traiter automatiquement toute posture avec lui : dyskinésie tardive peut être aggravée, données pédiatriques limitées, rein/foie sans expérience chiffrée, grossesse/allaitement à vérifier.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G24 et G24.0/.1/.2/.3/.4/.5/.8/.9</a>.</p></template>
<template data-pop="g24-dbs" data-title="Stimulation : sélectionner et mesurer"><p>La stimulation peut être discutée pour des formes gênantes sélectionnées après insuffisance des traitements adaptés. Le choix ne repose pas uniquement sur le nom du noyau cible.</p><p>La revue européenne 2026 des dystonies monogéniques souligne génétique, hétérogénéité et résultats rapportés par patient. Aucun pourcentage unique ne garantit le résultat pour toutes les causes deG24.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-COUNSEL — Résumé, discussion et recommandations ciblées</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-LIMIT — Limites et conclusion ciblées</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/08/Final-treatment-algorithm-dystonia_2025_en.pdf" target="_blank" rel="noopener">EU-ERN-TX — p 1,3–6 et algorithme p 6 réellement vu</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Basal-ganglia-coronal-sections.png" target="_blank" rel="noopener">IMG-BASAL — Provenance, description, droits et pixels originaux</a>.</p></template>
<template data-pop="g24-antibodies" data-title="Réponse moindre : plusieurs explications"><p>Des anticorps peuvent contribuer à une baisse de réponse à une toxine et des injections trop rapprochées peuvent favoriser leur formation. Ce n’est pas la seule explication.</p><p>Revoir diagnostic, muscles, dose, technique, délai et évolution. Une difficulté respiratoire ou de déglutition correspond à une question de sécurité urgente, pas à une simple inefficacité immunologique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a>.</p></template>
<template data-pop="g24-pregnancy" data-title="Grossesse et allaitement : plusieurs décisions"><p>Les FI des toxines déconseillent l’usage pendant grossesse sauf nécessité clairement évaluée et ne recommandent pas l’allaitement sous ces produits. Les mots exacts diffèrent selon préparation.</p><p>Une maladie causale telle que Wilson a son propre plan ; la gestion du traitement anti-cuivre ne se déduit pas des précautions d’une toxine. Décider avec les équipes plutôt qu’appliquer une consigne uniforme à tous médicaments.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://easlcampus.eu/sites/default/files/2025-03/EASL-ERN_CPG_on_Wilson%27s_Disease.pdf" target="_blank" rel="noopener">EU-EASL-SYM — p 708 texte et page réellement vus</a>.</p></template>
<template data-pop="g24-child" data-title="Enfant : âge et indication"><p>Le début précoce appelle une démarche neuropédiatrique avec causes acquises, métaboliques traitables et génétiques. Le document ERN 2026 reprend une branche pédiatrique issue de 2015, distincte de sa révision adulte.</p><p>Une indication pédiatrique de spasticité ou de sialorrhée n’est pas une autorisation générale de dose cervicale adulte. Vérifier chaque produit et le statut de l’essai de lévodopa.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-CHILD — p 9 arbre enfant/adolescent, réellement vu</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Indications et contre-indications âge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a>.</p></template>
<template data-pop="g24-scales" data-title="Score et fonction"><p>TWSTRS etTsui décrivent la dystonie cervicale ; Fahn-Marsden et outils adaptés concernent d’autres distributions ou âges. Choisir le bon outil et des conditions comparables.</p><p>Ajouter objectifs du patient, autonomie, douleur, participation et effets indésirables. Des points gagnés ne deviennent pas automatiquement une guérison ni un pourcentage comparable entre échelles.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/06/Final-Clinical-Scale-Dystonia_2025-fr.pdf" target="_blank" rel="noopener">EU-ERN-SCALES — p 6 échelles recommandées</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-COUNSEL — Résumé, discussion et recommandations ciblées</a>.</p></template>
<template data-pop="g24-follow" data-title="Une trajectoire réévaluable"><p>Suivre distribution, tâche, retentissement et tolérance. Après toxine, noter intensité de réponse, durée et effets ; après stimulation, mesurer aussi les résultats rapportés par le patient.</p><p>Une réponse incomplète demande réévaluation plutôt que surenchère automatique. La cause, les comorbidités et la faisabilité du plan peuvent évoluer.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/neurologie/unite-troubles-mouvement" target="_blank" rel="noopener">CH-HUG — Mission, démarche clinique et suivi</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/06/Final-Clinical-Scale-Dystonia_2025-fr.pdf" target="_blank" rel="noopener">EU-ERN-SCALES — p 6 échelles recommandées</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-COUNSEL — Résumé, discussion et recommandations ciblées</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a>.</p></template>
<template data-pop="g24-prevention" data-title="Prévenir ce qui est évitable"><p>Il n’existe pas de prévention universelle de toutes les dystonies. On peut reconnaître des expositions à risque, détecter des effets précoces et organiser une prescription plus sûre.</p><p>La FI Paspertin limite ses indications/durées et décrit des réactions même après une dose. Une limite propre à ce produit ne se transfère pas à tous les médicaments neurologiques.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/dystonie/" target="_blank" rel="noopener">CH-USZ-EPI — Fréquence, âge, évolution et métadonnées</a> ; <a data-reference-source="1" href="https://www.hug.ch/neurologie/unite-troubles-mouvement" target="_blank" rel="noopener">CH-HUG — Mission, démarche clinique et suivi</a>.</p></template>

<template data-pop="g24-exp-1" data-title="Comprendre — 1. Définition : un trouble du mouvement, puis une étiologie et un code"><p><b>Lecture expliquée.</b> Décrire le mouvement puis établir cause et code.</p><p>Selon le consensus international 2025, la <button class="w" data-k="g24-definition">dystonie</button> se manifeste par des mouvements ou postures anormaux, soutenus ou intermittents, souvent organisés en un <button class="w" data-k="g24-pattern">motif répétitif</button>. Ils peuvent être tremblants ou saccadés, être déclenchés ou aggravés par l’action et s’accompagner d’un débordement. La torsion est fréquente, mais n’est pas indispensable : les spasmes palpébraux ou laryngés en font partie.</p><p>Ce n’est ni le nom d’une maladie musculaire unique ni une preuve d’étiologie génétique. Une contraction involontaire produit la posture ; la localisation du mécanisme peut être un réseau nerveux. Une rétraction mécanique, une spasticité ou un autre mouvement anormal peuvent lui ressembler.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DEF — Définition et méthode</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G24 et G24.0/.1/.2/.3/.4/.5/.8/.9</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G24 exclusion G80.3, G24.3 exclusion M43.6</a>.</p></template>
<template data-pop="pareto-g24-1" data-title="Essentiel — 1. Définition : un trouble du mouvement, puis une étiologie et un code"><p>Décrire le mouvement puis établir cause et code.</p><div class="key"><b>À retenir.</b> Décrire le phénomène, la cause et la décision avec leurs limites.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DEF — Définition et méthode</a>.</p></template>
<template data-pop="g24-exp-2" data-title="Comprendre — 2. Épidémiologie : distinguer une estimation générale et une enquête historique"><p><b>Lecture expliquée.</b> Prévalences historiques et estimations générales ne sont pas une incidence suisse actuelle.</p><p>L’étude ESDE publiée en 2000 a recherché les cas de dystonie primaire identifiés par des neurologues d’adultes spécialisés dans huit pays européens. Pour1996–1997, la prévalence brute annuelle de période était de 152par million, soit 15,2pour100000 ; les auteurs la considèrent sous-estimée en raison de cas non repérés. Le résumé primaire, et non l’article intégral sous abonnement, a été lu.</p><p>La page d’information USZ mise à jour en février 2026 donne un ordre de grandeur général de 40pour100000. Elle n’expose pas une enquête suisse récente de code G24. Ces valeurs ont des populations, des méthodes et des époques différentes : elles ne forment pas deux mesures interchangeables d’une incidence nationale.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/11127535/" target="_blank" rel="noopener">EU-ESDE — Résumé primaire viaEuropePMC</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/dystonie/" target="_blank" rel="noopener">CH-USZ-EPI — Fréquence, âge, évolution et métadonnées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a>.</p></template>
<template data-pop="pareto-g24-2" data-title="Essentiel — 2. Épidémiologie : distinguer une estimation générale et une enquête historique"><p>Prévalences historiques et estimations générales ne sont pas une incidence suisse actuelle.</p><div class="key"><b>À retenir.</b> Décrire le phénomène, la cause et la décision avec leurs limites.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/11127535/" target="_blank" rel="noopener">EU-ESDE — Résumé primaire viaEuropePMC</a>.</p></template>
<template data-pop="g24-exp-3" data-title="Comprendre — 3. Physiopathologie : une commande en réseau et un effecteur périphérique"><p><b>Lecture expliquée.</b> Réseau central, voie biochimique et effecteur périphérique sont des niveaux distincts.</p><p>Le contrôle d’un geste associe cortex, noyaux gris, thalamus et autres voies sensorimotrices. Les mécanismes de dystonie sont hétérogènes ; une IRM normale n’exclut pas le phénomène. Une dystonie ne suppose donc pas une lésion visible du pallidum ni une destruction dopaminergique universelle.</p><p>Au muscle normal, l’acétylcholine libérée par le motoneurone déclenche une activité électrique, la mobilisation du calcium puis la contraction. Une toxine botuliqueA peut diminuer cette transmission périphérique par clivage de SNAP-25. Elle réduit un effet moteur local sans démontrer ni corriger automatiquement la cause centrale.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/10-3-muscle-fiber-contraction-and-relaxation" target="_blank" rel="noopener">NORMAL-MUSCLE — Début chapitre 10.3, transmission et contraction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">BOT-MECH — Mécanisme d’action</a> ; <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/P30793.txt" target="_blank" rel="noopener">NORMAL-GCH1 — Entrée humaine, voie enzymatique et lienDRD</a> ; <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/P07101.txt" target="_blank" rel="noopener">NORMAL-TH — Fonction/catalyse humaine</a> ; <a data-reference-source="1" href="https://easlcampus.eu/sites/default/files/2025-03/EASL-ERN_CPG_on_Wilson%27s_Disease.pdf" target="_blank" rel="noopener">EU-EASL-SYM — p 708 texte et page réellement vus</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray384.png" target="_blank" rel="noopener">IMG-NECK — Provenance, description, droits et pixels originaux</a>.</p></template>
<template data-pop="pareto-g24-3" data-title="Essentiel — 3. Physiopathologie : une commande en réseau et un effecteur périphérique"><p>Réseau central, voie biochimique et effecteur périphérique sont des niveaux distincts.</p><div class="key"><b>À retenir.</b> Décrire le phénomène, la cause et la décision avec leurs limites.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a>.</p></template>
<template data-pop="g24-exp-4" data-title="Comprendre — 4. Démarche clinique : trier avant de classer"><p><b>Lecture expliquée.</b> Sécurité et urgence précèdent le détail de la classification.</p><p>Une <button class="w" data-k="g24-acute">dystonie aiguë médicamenteuse</button> et une <button class="w" data-k="g24-storm">crise dystonique sévère</button> ne se confondent pas avec une dystonie focale stable. Après une injection de toxine, une faiblesse, dysphagie ou dyspnée nouvelle peut aussi signaler une diffusion et nécessite une évaluation immédiate.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-CHILD — p 9 arbre enfant/adolescent, réellement vu</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/08/Final-treatment-algorithm-dystonia_2025_en.pdf" target="_blank" rel="noopener">EU-ERN-TX — p 1,3–6 et algorithme p 6 réellement vu</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a> ; <a data-reference-source="1" href="https://www.hug.ch/neurologie/unite-troubles-mouvement" target="_blank" rel="noopener">CH-HUG — Mission, démarche clinique et suivi</a>.</p></template>
<template data-pop="pareto-g24-4" data-title="Essentiel — 4. Démarche clinique : trier avant de classer"><p>Sécurité et urgence précèdent le détail de la classification.</p><div class="key"><b>À retenir.</b> Décrire le phénomène, la cause et la décision avec leurs limites.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/08/Final-treatment-algorithm-dystonia_2025_en.pdf" target="_blank" rel="noopener">EU-ERN-TX — p 1,3–6 et algorithme p 6 réellement vu</a>.</p></template>
<template data-pop="g24-exp-5" data-title="Comprendre — 5. Anamnèse : le début moteur, la tâche et les expositions réelles"><p><b>Lecture expliquée.</b> La chronologie inclut tâche, âge du début, famille et médicaments réels.</p><p>L’<button class="w" data-k="g24-history">histoire chronologique</button> précise première région atteinte, âge du début moteur, installation aiguë/subaiguë/progressive et évolution. Rechercher variations diurnes, effet du sommeil, activités déclenchantes et <button class="w" data-k="g24-task">spécificité d’une tâche</button>. Une douleur ou une gêne peut précéder le diagnostic, mais ne date pas nécessairement le début du phénomène moteur.</p><p>Noter antécédents familiaux et signes pouvant passer inaperçus chez les proches. Une histoire négative ne supprime pas une cause génétique : expression variable, cas sporadique ou variant de novo peuvent expliquer ce constat. Le conseil génétique ne repose pas seulement sur un ancien numéroDYT.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/dystonie/" target="_blank" rel="noopener">CH-USZ-CLIN — Formes, symptômes, examen</a> ; <a data-reference-source="1" href="https://www.hug.ch/neurologie/unite-troubles-mouvement" target="_blank" rel="noopener">CH-HUG — Mission, démarche clinique et suivi</a>.</p></template>
<template data-pop="pareto-g24-5" data-title="Essentiel — 5. Anamnèse : le début moteur, la tâche et les expositions réelles"><p>La chronologie inclut tâche, âge du début, famille et médicaments réels.</p><div class="key"><b>À retenir.</b> Décrire le phénomène, la cause et la décision avec leurs limites.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a>.</p></template>
<template data-pop="g24-exp-6" data-title="Comprendre — 6. Examen clinique : observer le motif dans plusieurs conditions"><p><b>Lecture expliquée.</b> Observer plusieurs conditions et rechercher les signes associés.</p><p>L’<button class="w" data-k="g24-exam">examen du mouvement</button> commence au repos puis pendant posture et action. Observer la tâche concernée si elle est possible et sûre : écriture, geste instrumental, parole ou marche. Comparer régions, côté, amplitude, rythme et direction ; rechercher répétition du même motif plutôt que tout appeler spasme.</p><p>Un <button class="w" data-k="g24-geste">geste atténuateur</button> peut réduire brièvement la posture sans force mécanique importante ; il soutient la description sans être obligatoire ni absolument spécifique. Chercher <button class="w" data-k="g24-overflow">débordement</button> vers une région voisine et <button class="w" data-k="g24-mirror">dystonie en miroir</button> lors d’une tâche controlatérale. Ce dernier phénomène diffère d’un simple mouvement en miroir.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, mouvements involontaires et situations urgentes</a> ; <a data-reference-source="1" href="https://www.hug.ch/neurologie/unite-troubles-mouvement" target="_blank" rel="noopener">CH-HUG — Mission, démarche clinique et suivi</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Dystonia2010.JPG" target="_blank" rel="noopener">IMG-CLINICAL — Provenance, description, droits et pixels originaux</a>.</p></template>
<template data-pop="pareto-g24-6" data-title="Essentiel — 6. Examen clinique : observer le motif dans plusieurs conditions"><p>Observer plusieurs conditions et rechercher les signes associés.</p><div class="key"><b>À retenir.</b> Décrire le phénomène, la cause et la décision avec leurs limites.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a>.</p></template>
<template data-pop="g24-exp-7" data-title="Comprendre — 7. Syndromes : distribution, temporalité et signes associés"><p><b>Lecture expliquée.</b> La distribution révisée ne se réduit pas à>3 régions et les signes associés sont décrits.</p><p>La <button class="w" data-k="g24-distribution">distribution2025</button> utilise sept régions de référence : face supérieure, face inférieure, cou avec épaules, larynx, membres supérieurs, tronc et membres inférieurs. Focale : une région. Segmentaire : deux ou trois régions contiguës, hors hémidystonie. Multifocale : deux ou trois régions non contiguës, dont deux bras ou deux jambes.</p><p>Hémidystonie : membre supérieur et inférieur d’un même côté, avec ou sans autres régions. Généralisée : distribution dépassant les schémas segmentaire/multifocal sans être hémidystonie. Les exemples du consensus comprennent <b>tronc avec deux autres régions</b>, ou <b>trois/quatre membres sans tronc</b>. Une règle mécanique « plus de trois régions » serait incorrecte. La convention de dystonie cervicale focale malgré épaules est conservée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DISTR — Distribution corporelle</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G24 et G24.0/.1/.2/.3/.4/.5/.8/.9</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">IMG-MOTOR — Provenance, description, droits et pixels originaux</a>.</p></template>
<template data-pop="pareto-g24-7" data-title="Essentiel — 7. Syndromes : distribution, temporalité et signes associés"><p>La distribution révisée ne se réduit pas à>3 régions et les signes associés sont décrits.</p><div class="key"><b>À retenir.</b> Décrire le phénomène, la cause et la décision avec leurs limites.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DISTR — Distribution corporelle</a>.</p></template>
<template data-pop="g24-exp-8" data-title="Comprendre — 8. Diagnostic positif : clinique, avec un niveau de certitude explicite"><p><b>Lecture expliquée.</b> Le diagnostic du phénomène est clinique ; la cause demande ses propres arguments.</p><p>Le diagnostic de dystonie s’appuie sur un motif moteur compatible, observé dans ses conditions de survenue et relié à l’histoire. Geste atténuateur, action, débordement ou répétition aident ; aucun n’est exigé dans toutes les formes. Un blépharospasme peut être fait de spasmes brefs et une dystonie laryngée ne présente pas nécessairement une torsion visible.</p><p>La <button class="w" data-k="g24-etiology">cause étiologique</button> vient ensuite. Une exposition pertinente, une maladie documentée, une lésion concordante ou un résultat génétique interprété peuvent soutenir l’étiologie. Ni imagerie normale, ni simple variant de signification incertaine, ni âge adulte ne démontrent une origine unique. Les qualificatifs idiopathique, génétique, acquis et combiné ont des sens distincts.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DEF — Définition et méthode</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G24 exclusion G80.3, G24.3 exclusion M43.6</a>.</p></template>
<template data-pop="pareto-g24-8" data-title="Essentiel — 8. Diagnostic positif : clinique, avec un niveau de certitude explicite"><p>Le diagnostic du phénomène est clinique ; la cause demande ses propres arguments.</p><div class="key"><b>À retenir.</b> Décrire le phénomène, la cause et la décision avec leurs limites.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a>.</p></template>
<template data-pop="g24-exp-9" data-title="Comprendre — 9. Explorations : adaptées au syndrome et aux causes traitables"><p><b>Lecture expliquée.</b> Choisir les examens qui changent la conduite, selon âge et syndrome.</p><p>L’<button class="w" data-k="g24-imaging">IRM cérébrale</button> recherche une cause structurale selon âge, début et signes associés. Une forme focale idiopathique peut avoir une imagerie sans anomalie détectable. Le circuit pédiatrique ERN comporte une IRM puis un bilan orienté ; la version documentaire2026 reprend une branche issue de 2015, distincte de la révision adulte.</p><p>La <button class="w" data-k="g24-genetics">génétique</button> se choisit avec phénotype, âge, famille et conseil adapté. Un panel ou séquençage n’est pas un diagnostic à interpréter sans contexte. Avant stimulation dans une dystonie monogénique suspectée, la revue européenne 2026 soutient une place systématique de l’évaluation génétique dans un bilan multidisciplinaire.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-CHILD — p 9 arbre enfant/adolescent, réellement vu</a> ; <a data-reference-source="1" href="https://easlcampus.eu/sites/default/files/2025-03/EASL-ERN_CPG_on_Wilson%27s_Disease.pdf" target="_blank" rel="noopener">EU-EASL-DX — p 695–696 diagnostic, passages ciblés réouverts</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-COUNSEL — Résumé, discussion et recommandations ciblées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a>.</p></template>
<template data-pop="pareto-g24-9" data-title="Essentiel — 9. Explorations : adaptées au syndrome et aux causes traitables"><p>Choisir les examens qui changent la conduite, selon âge et syndrome.</p><div class="key"><b>À retenir.</b> Décrire le phénomène, la cause et la décision avec leurs limites.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a>.</p></template>
<template data-pop="g24-exp-10" data-title="Comprendre — 10. Arbre diagnostique et diagnostics différentiels"><p><b>Lecture expliquée.</b> Distinguer phénomène, mimic, exposition et cause traitable.</p><p>Spasticité, faiblesse pyramidale, tremblement indépendant, myoclonies, tics, rétraction et torticolis non dystonique se discutent selon examen. Une crise oculogyre après médicament et un blépharospasme chronique ne sont pas la même situation. Un état rigide confus/fébrile impose aussi de rechercher syndrome malin et autres défaillances.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-CHILD — p 9 arbre enfant/adolescent, réellement vu</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G24 exclusion G80.3, G24.3 exclusion M43.6</a>.</p></template>
<template data-pop="pareto-g24-10" data-title="Essentiel — 10. Arbre diagnostique et diagnostics différentiels"><p>Distinguer phénomène, mimic, exposition et cause traitable.</p><div class="key"><b>À retenir.</b> Décrire le phénomène, la cause et la décision avec leurs limites.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-CHILD — p 9 arbre enfant/adolescent, réellement vu</a>.</p></template>
<template data-pop="g24-exp-11" data-title="Comprendre — 11. Prise en charge : cause, symptômes et fonction"><p><b>Lecture expliquée.</b> Cause, symptômes et fonction guident des options différentes.</p><p><b>Cause acquise.</b> Revoir le produit responsable avec l’équipe et traiter une maladie identifiée. En dystonie aiguë médicamenteuse, le <button class="w" data-k="g24-akineton">bipéridène</button> peut relever de la FI suisse dans un cadre évalué et surveillé ; il ne constitue pas une réponse universelle à toute dyskinésie tardive, qu’il peut aggraver.</p><p><b>Forme focale gênante.</b> Les injections de <button class="w" data-k="g24-toxin">toxine botulique</button> sont une option majeure, avec sélection des muscles, indication et compétences adaptées. Les <button class="w" data-k="g24-units">unités propres au produit</button> et les intervalles ne se convertissent pas mécaniquement. La <button class="w" data-k="g24-dilution">concentration après reconstitution</button> permet seulement de vérifier un volume après choix clinique, pas d’inventer une dose.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Indications et contre-indications âge</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/08/Final-treatment-algorithm-dystonia_2025_en.pdf" target="_blank" rel="noopener">EU-ERN-TX — p 1,3–6 et algorithme p 6 réellement vu</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-COUNSEL — Résumé, discussion et recommandations ciblées</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-LIMIT — Limites et conclusion ciblées</a> ; <a data-reference-source="1" href="https://easlcampus.eu/sites/default/files/2025-03/EASL-ERN_CPG_on_Wilson%27s_Disease.pdf" target="_blank" rel="noopener">EU-EASL-SYM — p 708 texte et page réellement vus</a> ; <a data-reference-source="1" href="https://www.usz.ch/fachbereich/neurologie/angebot/dystonie/" target="_blank" rel="noopener">CH-USZ-TX — Toxine, oral, stimulation et mesures associées</a>.</p></template>
<template data-pop="pareto-g24-11" data-title="Essentiel — 11. Prise en charge : cause, symptômes et fonction"><p>Cause, symptômes et fonction guident des options différentes.</p><div class="key"><b>À retenir.</b> Décrire le phénomène, la cause et la décision avec leurs limites.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/08/Final-treatment-algorithm-dystonia_2025_en.pdf" target="_blank" rel="noopener">EU-ERN-TX — p 1,3–6 et algorithme p 6 réellement vu</a>.</p></template>
<template data-pop="g24-exp-12" data-title="Comprendre — 12. Prévention, suivi et pronostic : mesurer ce qui compte"><p><b>Lecture expliquée.</b> Mesurer symptômes, autonomie, tolérance et objectifs du patient.</p><p>Une <button class="w" data-k="g24-prevention">prévention</button> universelle de toutes les dystonies n’est pas disponible. Il reste utile de reconnaître les expositions évitables, les effets précoces et les indications inadaptées, puis de documenter clairement l’événement et son relais. Les limites de durée de la FI du métoclopramide concernent ce produit et ses indications, pas tous les traitements neurologiques.</p><p>Le <button class="w" data-k="g24-follow">suivi</button> décrit douleur, autonomie, tâches, voix/déglutition, participation sociale, effets indésirables et évolution de distribution. Des <button class="w" data-k="g24-scales">échelles adaptées</button> comme TWSTRS/Tsui cervicales ou Fahn-Marsden dans des formes généralisées aident à comparer ; elles ne remplacent pas le récit et les objectifs du patient.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.usz.ch/krankheit/dystonie/" target="_blank" rel="noopener">CH-USZ-EPI — Fréquence, âge, évolution et métadonnées</a> ; <a data-reference-source="1" href="https://www.hug.ch/neurologie/unite-troubles-mouvement" target="_blank" rel="noopener">CH-HUG — Mission, démarche clinique et suivi</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/06/Final-Clinical-Scale-Dystonia_2025-fr.pdf" target="_blank" rel="noopener">EU-ERN-SCALES — p 6 échelles recommandées</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-COUNSEL — Résumé, discussion et recommandations ciblées</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://easlcampus.eu/sites/default/files/2025-03/EASL-ERN_CPG_on_Wilson%27s_Disease.pdf" target="_blank" rel="noopener">EU-EASL-SYM — p 708 texte et page réellement vus</a>.</p></template>
<template data-pop="pareto-g24-12" data-title="Essentiel — 12. Prévention, suivi et pronostic : mesurer ce qui compte"><p>Mesurer symptômes, autonomie, tolérance et objectifs du patient.</p><div class="key"><b>À retenir.</b> Décrire le phénomène, la cause et la décision avec leurs limites.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/06/Final-Clinical-Scale-Dystonia_2025-fr.pdf" target="_blank" rel="noopener">EU-ERN-SCALES — p 6 échelles recommandées</a>.</p></template>

<template data-pop="pareto-g24-13" data-title="Essentiel — 13. Points clés"><p>Conserver produit, indication, population et unités dans chaque décision.</p><div class="key"><b>À retenir.</b> Décrire le phénomène, la cause et la décision avec leurs limites.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a>.</p></template>

ile:Dystonia2010.JPG" target="_blank" rel="noopener">IMG-CLINICAL — Provenance, description, droits et pixels originaux</a>.</p></template>

<template data-pop="g24-cas-1" data-title="Cas 1 — Une main pendant écriture"><p><b>Exercice fictif original.</b></p><p>Une personne ne peut plus écrire sans une position anormale répétitive des doigts, alors que d’autres gestes restent possibles. Décrire la tâche et observer le motif avant de conclure à une compression nerveuse ou à une faiblesse.</p><p>Examiner aussi force, réflexes, autres régions et médicaments. L’adaptation de tâche et les traitements symptomatiques se choisissent selon diagnostic et retentissement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DEF — Définition et méthode</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, mouvements involontaires et situations urgentes</a> ; <a data-reference-source="1" href="https://www.usz.ch/fachbereich/neurologie/angebot/dystonie/" target="_blank" rel="noopener">CH-USZ-TX — Toxine, oral, stimulation et mesures associées</a>.</p></template>
<template data-pop="g24-cas-2" data-title="Cas 2 — Un antiémétique et une posture cervicale"><p><b>Exercice fictif original.</b></p><p>Après un antiémétique, une personne présente une posture cervicale et une gêne linguale. Le métoclopramide peut provoquer une dystonie même après une dose.</p><p>Évaluer immédiatement déglutition et respiration, revoir l’exposition et traiter avec l’équipe. Ne pas confondre cet aigu avec une dyskinésie tardive pour laquelle un anticholinergique peut être défavorable.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G24 et G24.0/.1/.2/.3/.4/.5/.8/.9</a>.</p></template>
<template data-pop="g24-cas-3" data-title="Cas 3 — Un enfant moins à l’aise le soir"><p><b>Exercice fictif original.</b></p><p>Un enfant présente un trouble de marche avec posture anormale plus marquée en fin de journée. Un profil dopa-sensible peut être discuté, sans être prouvé par cette seule histoire.</p><p>Parcours neuropédiatrique, examen et bilan de causes traitables/génétiques. Un essai spécialisé ne devient pas une prescription automatique deMadopar, contre-indiqué avant 25 ans dans la FI suisse lue.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/P30793.txt" target="_blank" rel="noopener">NORMAL-GCH1 — Entrée humaine, voie enzymatique et lienDRD</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-CHILD — p 9 arbre enfant/adolescent, réellement vu</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Indications et contre-indications âge</a>.</p></template>
<template data-pop="g24-cas-4" data-title="Cas 4 — Dysphagie après toxine"><p><b>Exercice fictif original.</b></p><p>Une personne traitée pour dystonie cervicale signale une difficulté nouvelle à avaler. Il faut envisager une complication et rechercher respiration, faiblesse et risque d’aspiration.</p><p>Faire évaluer immédiatement ; ne pas simplement avancer une nouvelle injection ou convertir les unités d’une autre marque. Reprendre produit, dose, muscles, date et tolérance.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a>.</p></template>
