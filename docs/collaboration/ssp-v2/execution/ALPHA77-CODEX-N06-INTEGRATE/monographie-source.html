<template data-pop="n06-exp-1" data-title="1. Définition : un signe urinaire, puis une lésion à préciser"><p>La protéinurie est l’excrétion de protéines dans l’urine. L’adulte sain en excrète une petite quantité ; les références retenues situent la limite physiologique autour de 150 mg/j. L’albumine n’est qu’une partie de ces protéines : son excrétion habituelle est inférieure à 30 mg/j. Une anomalie peut porter sur la quantité et sur la nature des protéines.</p><p>Une présentation dite <b>isolée</b> signifie que la découverte de protéines n’est pas accompagnée d’un autre tableau rénal évident. Ce caractère doit être vérifié : pression, sédiment, fonction, albumine sanguine et examen clinique recherchent ce qui pourrait modifier cette qualification. Une personne asymptomatique peut avoir une albuminurie pathologique persistante et une maladie rénale avec filtration conservée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML classe N06 etmodificateurS14N00_4 relus pour N06</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="pareto-n06-1" data-title="Raisonnement essentiel — 1. Définition : un signe urinaire, puis une lésion à préciser"><p>Quantité, composition, persistance et contexte précèdent le code ; N06 ajoute une morphologie précisée.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML classe N06 etmodificateurS14N00_4 relus pour N06</a>.</p></template>
<template data-pop="n06-exp-2" data-title="2. Épidémiologie : distinguer dépistage, maladie et code"><p>Aucune incidence suisse directe N06 n’a été retenue dans les sources consultées. Le nombre de bandelettes positives dépend de l’âge, du dépistage, des circonstances de recueil et de la confirmation. Une première positivité n’a pas la même signification qu’une protéinurie persistante avec une lésion biopsique.</p><p>Le guide SGN 2025 estime qu’environ un adulte sur dix en Suisse présente une maladie rénale chronique. Ce chiffre ne mesure ni la protéinurie isolée ni N06. Les séries de biopsies décrivent des personnes sélectionnées pour cet examen ; elles ne représentent pas toutes les anomalies urinaires de la population.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a>.</p></template>
<template data-pop="pareto-n06-2" data-title="Raisonnement essentiel — 2. Épidémiologie : distinguer dépistage, maladie et code"><p>Aucune incidenceN06 directe ; le chiffre MRC global et les biopsies sélectionnées ne mesurent pas cette présentation.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a>.</p></template>
<template data-pop="n06-exp-3" data-title="3. Physiopathologie : filtre, réabsorption et surcharge"><p>Le filtre glomérulaire associe endothélium, membrane basale et podocytes. Il limite le passage des cellules et de nombreuses protéines ; le tubule proximal récupère une grande partie des protéines filtrées. L’urine finale contient aussi des protéines sécrétées, notamment l’uromoduline. Une excrétion physiologique ne correspond donc pas à une fuite pathologique d’albumine.</p><p>Planche normale, non image de patient ; elle ne montre ni dépôts immuns ni lésion inflammatoire. Les repères HTML n’altèrent pas les pixels.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax, Anatomy andPhysiology 2e — Corpuscule, barrière, tubules ; cortex, médulla, voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 chapitre 8 — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a>.</p></template>
<template data-pop="pareto-n06-3" data-title="Raisonnement essentiel — 3. Physiopathologie : filtre, réabsorption et surcharge"><p>Filtre, réabsorption et surcharge produisent des profils différents ; la composition aide à les distinguer.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a>.</p></template>
<template data-pop="n06-exp-4" data-title="4. Démarche clinique : confirmer sans perdre les signes d’alerte"><p><b>Vérifier la gravité.</b> Une dyspnée, une oligurie, une dégradation rapide de fonction, une hypertension avec retentissement ou des signes systémiques sortent du simple constat isolé. Un sédiment néphritique associé à une perte rapide de fonction impose un bilan accéléré. La répétition d’un prélèvement ne doit pas retarder cette démarche.</p><p><b>Confirmer la mesure.</b> Préciser produit de bandelette, recueil, effort, fièvre, infection, menstruations et contamination. Confirmer une positivité semi-quantitative par une mesure de laboratoire exprimée en rapport à la créatinine, avec analyte et unité visibles. Le premier prélèvement du matin à mi-jet est préféré pour comparer et confirmer.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 chapitre 8 — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="pareto-n06-4" data-title="Raisonnement essentiel — 4. Démarche clinique : confirmer sans perdre les signes d’alerte"><p>Vérifier la gravité, confirmer, caractériser puis établir la cause et le plan ; la répétition ne retarde pas une urgence.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a>.</p></template>
<template data-pop="n06-exp-5" data-title="5. Anamnèse : expliquer le résultat avant de nommer la maladie"><p>Le patient peut ne ressentir aucun symptôme. L’anamnèse ne consiste donc pas seulement à rechercher une plainte : elle restitue les conditions de mesure et la trajectoire. Une ancienne mention de « lésion minime » ou « sclérose » demande le compte rendu exact, sa date et les techniques utilisées ; une mémoire résumée ne remplace pas le tissu documenté.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="pareto-n06-5" data-title="Raisonnement essentiel — 5. Anamnèse : expliquer le résultat avant de nommer la maladie"><p>Conditions de recueil, résultats datés, terrain, famille et produits pris sont des données diagnostiques.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="n06-exp-6" data-title="6. Examen clinique : éprouver le caractère isolé"><p>Mesurer la pression avec une méthode reproductible, rechercher œdèmes, variations pondérales, congestion et état d’hydratation. Une fonction dite normale dans le dossier ne dispense pas d’une mesure actuelle. Les signes de maladie systémique sont recherchés selon l’histoire : peau, articulations, manifestations infectieuses, respiratoires ou autres.</p><p>La présence d’une hypertension, d’une hématurie, d’une baisse de fonction ou d’une hypoalbuminémie change la synthèse. Il faut alors qualifier le syndrome réellement présent plutôt que maintenir « isolée » par habitude. Une absence d’œdèmes n’exclut ni une perte protéique importante ni une maladie rénale débutante.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="pareto-n06-6" data-title="Raisonnement essentiel — 6. Examen clinique : éprouver le caractère isolé"><p>Pression, sédiment, fonction et albumine éprouvent le caractère isolé ; toute anomalie associée requalifie le profil.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a>.</p></template>
<template data-pop="n06-exp-7" data-title="7. Syndromes et classifications : ne pas mélanger les seuils"><p>Les catégories de débit de la MRC sont G1 ≥ 90, G2 60–89, G3a 45–59, G3b 30–44, G4 15–29 et G5 &lt; 15 mL/min/1,73 m². Elles s’interprètent avec marqueurs et durée. Une albuminurie pathologique persistante peut établir une maladie avec un débit G1 ; l’absence de baisse de fonction ne prouve pas l’absence de dommage.</p><p>Le débit de protéines, leur composition et l’albuminémie décrivent encore des informations distinctes. Les seuils de consultation ou de biopsie ne sont pas automatiquement les mêmes que les seuils définissant normalité, catégorie de risque ou syndrome néphrotique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="pareto-n06-7" data-title="Raisonnement essentiel — 7. Syndromes et classifications : ne pas mélanger les seuils"><p>Normalité, albuminurie, protéinurie clinique, syndrome néphrotique, MRC et morphologie sont des axes distincts.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a>.</p></template>
<template data-pop="n06-exp-8" data-title="8. Diagnostic positif : cinq questions de preuve"><p><b>Le résultat est-il réel ?</b> Confirmer une bandelette par une mesure quantitative ; vérifier dilution, recueil et facteurs transitoires. Une bandelette négative peut manquer une albuminurie modérée ou une protéinurie non albuminurique. Une valeur de concentration seule dépend de la dilution.</p><p><b>Quelle composition ?</b> L’ACR mesure l’albumine et le RPC les protéines totales. Un total élevé avec peu d’albumine fait rechercher notamment une composante tubulaire ou de surcharge, selon le contexte et les examens adaptés. Il ne faut ni banaliser cette discordance ni la nommer automatiquement glomérulaire.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML classe N06 etmodificateurS14N00_4 relus pour N06</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 chapitre 8 — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="pareto-n06-8" data-title="Raisonnement essentiel — 8. Diagnostic positif : cinq questions de preuve"><p>Confirmer le résultat, préciser la composition, durée, posture et anomalies associées, puis vérifier la preuve morphologique.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>

<template data-pop="n06-exp-9" data-title="9. Explorations : de la mesure au tissu"><p>Le néphrologue confronte le débit protéique, les anomalies associées et le bénéfice attendu du prélèvement. Les principes glomérulaires KDIGO recommandent une quantification précise, parfois 24 h chez l’adulte lorsqu’une décision d’immunosuppression en dépend. Le recueil 24 h n’est donc ni obligatoire pour toute découverte ni inutile dans toutes les situations.</p><p>Optique, immunofluorescence et électronique interrogent des dimensions différentes. Un aspect FSGS peut être primaire, secondaire ou associé à une maladie génétique. Une photographie ou une ligne du compte rendu ne décide pas seule d’une immunosuppression. Une hypothèseIgA possède aussi ses propres critères de discussion biopsique ; elle ne transforme pas un seuil en règle universelle de toute protéinurie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">KDIGO, consensus international 2025 — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 chapitre 8 — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a>.</p></template>
<template data-pop="pareto-n06-9" data-title="Raisonnement essentiel — 9. Explorations : de la mesure au tissu"><p>Chaque examen doit répondre à une question ; la biopsie sert une décision clinique, pas un code.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a>.</p></template>
<template data-pop="n06-exp-10" data-title="10. Arbre diagnostique et diagnostics différentiels"><p>Une protéinurie tubulaire ou de surcharge peut être discrète à la bandelette. Une maladie systémique, une gammapathie, une atteinte médicamenteuse ou une maladie héréditaire fait partie des alternatives orientées par le dossier. Le diagnostic ne se réduit pas à « albumine absente, donc pas de problème ».</p><p>Les anomalies nouvelles chez une personne déjà biopsiée ne sont pas forcément la simple poursuite de la lésion ancienne. Une infection, une modification hémodynamique ou une maladie associée peut changer l’évolution. La discordance entre profil attendu et données actuelles justifie une reprise du raisonnement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="pareto-n06-10" data-title="Raisonnement essentiel — 10. Arbre diagnostique et diagnostics différentiels"><p>La discordance albumine/protéines totales ou ancien profil/évolution actuelle rouvre le diagnostic.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a>.</p></template>
<template data-pop="n06-exp-11" data-title="11. Prise en charge : traiter une cause et un risque établis"><p><b>Pas de prescription sur la seule bandelette.</b> Une protéinurie transitoire se réévalue après disparition du facteur déclenchant. Une orthostatique confirmée avec un profil concordant n’appelle pas automatiquement une biopsie ou une immunosuppression. Une protéinurie permanente ou une anomalie associée demande une démarche de cause et de risque.</p><p><b>Orientation spécialisée.</b> La fiche suisseThurgau propose notamment une exploration néphrologique devant albuminurie persistante &gt; 300 mg/j ou protéines &gt; 0,5–1 g/j ; le CUEN retient un avis devant protéinurie permanente &gt; 0,5 g/j. La SGN2025 ajoute cause inconnue, hématurie glomérulaire, progression et autres critères MRC. Il s’agit de repères de consultation, pas de seuils automatiques de biopsie. Une dégradation rapide ou un retentissement grave accélère les soins.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">Information professionnelle suisse viaAmiKo : Ramipril Zentiva, décembre 2021 — Indications, posologie, organes, contre-indications, mises en garde, interactions, grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI suisseCosaar, avril 2025 — Indications, posologie, organes, contre-indications, interactions, grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI suisse Forxiga, août 2026 — Indication MRC, posologie rénale/hépatique, mises en garde, interactions, grossesse</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo ; Lasix 40 mg, mai 2025 — Posologie, contre-indications et précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo ; Norvasc, avril 2023 — Indications, posologie, contre-indications, précautions</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="pareto-n06-11" data-title="Raisonnement essentiel — 11. Prise en charge : traiter une cause et un risque établis"><p>Traiter une cause et un risque établis ; recommandations suisses et FI exactes limitent chaque produit.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a>.</p></template>
<template data-pop="n06-exp-12" data-title="12. Prévention, suivi et pronostic : suivre une trajectoire"><p>Le suivi vérifie la persistance, l’évolution de la quantité et de la composition, la pression, la fonction et l’apparition d’autres signes. Comparer des prélèvements réalisés dans des conditions cohérentes, avec le même analyte et les unités visibles. Une normalisation isolée peut refléter un changement de dilution ou de contexte ; elle se confronte aux autres données.</p><p>Le risque dépend de la cause, des lésions, de la fonction, de l’albuminurie et de leur trajectoire. Une morphologie ne donne pas un pronostic individuel certain. Dans la MRC, contrôler débit et albuminurie au moins annuellement, plus souvent selon risque ou changement de traitement. Une variation DFG &gt; 20 %, une baisse &gt; 30 % après thérapie hémodynamique ou un doublement ACR appelle une évaluation ; ces repères ne remplacent pas les soins d’une aggravation symptomatique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="pareto-n06-12" data-title="Raisonnement essentiel — 12. Prévention, suivi et pronostic : suivre une trajectoire"><p>Suivre la trajectoire avec prélèvements comparables ; aucun marqueur seul ne prouve la guérison.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a>.</p></template>
<template data-pop="n06-exp-13" data-title="13. Points clés pour l’examen fédéral"><p>Décrire une protéinurie par quantité, composition, persistance et contexte ; vérifier fonction, pression et sédiment avant de la dire isolée. Expliquer pourquoi l’ACR et le RPC répondent à des questions différentes, pourquoi le premier matin est utile et pourquoi une bandelette négative ne ferme pas toutes les causes.</p><p>Dans PROFILES 2017, la tâche 173 concerne la protéinurie,161 la fonction,164 le sédiment et 159 les investigations tissulaires/génétiques. Les directives MEBEKO 2026 relient connaissances et compétences cliniques. Les cas et quiz ci-dessous sont originaux MEDINA, sans statut de questions officielles.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" rel="noopener" target="_blank">CIMS, PROFILES 2017 — pp.29,32 : SSP64,159,161,164,173</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" rel="noopener" target="_blank">MEBEKO,3mars 2026 — Introduction et§2.1</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a>.</p></template>
<template data-pop="pareto-n06-13" data-title="Raisonnement essentiel — 13. Points clés pour l’examen fédéral"><p>Décrire quantité, composition, persistance, contexte etplan ; cas MEDINA sans statut officiel.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" rel="noopener" target="_blank">CIMS, PROFILES 2017 — pp.29,32 : SSP64,159,161,164,173</a>.</p></template>
<template data-pop="n06-exp-14" data-title="14. Pièges : protéger la mesure et le raisonnement"><p></p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML classe N06 etmodificateurS14N00_4 relus pour N06</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="pareto-n06-14" data-title="Raisonnement essentiel — 14. Pièges : protéger la mesure et le raisonnement"><p>Protéinurie isolée ne signifie ni absence de risque ni indication automatique de N06/biopsie/traitement.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML classe N06 etmodificateurS14N00_4 relus pour N06</a>.</p></template>
<template data-pop="n06-calcul-ratio" data-title="Rapport urinaire : le litre s’annule, pas l’analyte"><p>Données fictives du même prélèvement : albumine 60 mg/L, créatinine 1 g/L. Le rapport albumine/créatinine est 60 ÷ 1 = 60 mg/g. Les litres s’annulent. Il s’agit d’albuminurie A2 selon les bornes du référentiel ; il ne s’agit pas d’une excrétion de 60 g/j.</p><p>Si les protéines totales sont à 1,2 g/L avec la même créatinine, le rapport protéines/créatinine est 1,2 g/g. Les deux résultats ne sont pas interchangeables : le premier quantifie l’albumine, le second toutes les protéines mesurées.</p><p>Le calcul ne prouve pas la chronicité. Vérifier conditions, répétition, contexte et évolution. Un seuil de traitement donné en protéines totales ne se lit pas avec un rapport d’albumine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a>.</p></template>
<template data-pop="n06-calcul-variation" data-title="Variation relative : préciser le sens, la base et le délai"><p>Débit fictif passant de 68à 51 mL/min/1,73 m² : baisse absolue 68−51 = 17 ; baisse relative 17 ÷ 68 × 100 = 25 %. Elle dépasse le repère de 20 % qui appelle une évaluation selon KDIGO. Cela ne suffit pas à établir une progression irréversible.</p><p>Créatinine fictive passant de 100à 140 µmol/L après modification d’un IEC : hausse relative(140−100) ÷ 100 × 100 = 40 %. Si elle survient dans les quatre semaines, elle dépasse le repère de 30 % discuté pour la sécurité de l’IEC/ARA. Il faut chercher état volémique, médicaments, potassium et autres causes selon la clinique.</p><p>Ces exemples sont indépendants. Une hausse de créatinine de 30 % n’est pas mathématiquement la même chose qu’une baisse de débit de 30 %. Ne pas interchanger les deux seuils ni ignorer une aggravation clinique qui reste sous une borne.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a>.</p></template>
<template data-pop="n06-cas-1" data-title="Cas 1 — Après effort, confirmer avant de conclure"><p><b>Exercice fictif original.</b></p><p>Une personne asymptomatique présente des protéines à la bandelette après un exercice intense. Vérifier les conditions et confirmer par une mesure quantitative, de préférence au premier matin dans un contexte comparable. Une première positivité ne prouve ni maladie permanente ni morphologie N06.</p><p>Chez un adolescent, la disparition en décubitus peut orienter une orthostatique après confirmation du profil. Pression, sédiment etfonction doivent rester cohérents ; une anomalie associée modifie la démarche.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML classe N06 etmodificateurS14N00_4 relus pour N06</a>.</p></template>
<template data-pop="n06-cas-2" data-title="Cas 2 — Le total et l’albumine racontent deux informations"><p><b>Exercice fictif original.</b></p><p>Le RPC est nettement élevé mais l’ACR peu augmenté. La bandelette presque négative ne permet pas de conclure à l’absence de maladie : elle détecte surtout l’albumine. Rechercher une composante tubulaire ou de surcharge selon le contexte et les examens appropriés.</p><p>La discordance ne donne pas seule une cause. Vérifier unités, prélèvement et répétition puis orienter les investigations ; ne pas assimiler automatiquement toutes les protéines à une fuite glomérulaire.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a>.</p></template>
<template data-pop="n06-cas-3" data-title="Cas 3 — Une filtration conservée n’efface pas le dommage"><p><b>Exercice fictif original.</b></p><p>Une personne a un débit estimé à 95 mL/min/1,73 m² et une albuminurie pathologique documentée depuis six mois. Une filtration G1 n’exclut pas une MRC : la persistance du marqueur apporte une autre voie diagnostique.</p><p>Le diagnostic de cause et le risque restent à préciser. En l’absence de lésion morphologique documentée, on ne déduit pas N06 du seul dosage ; le codage suit le dossier et les exclusions OFS.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML classe N06 etmodificateurS14N00_4 relus pour N06</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a>.</p></template>
<template data-pop="n06-cas-4" data-title="Cas 4 — Une recommandation de classe ne remplace pas uneFI"><p><b>Exercice fictif original.</b></p><p>Chez un adulte dont le débit est 22 mL/min/1,73 m², une recommandation de classe évoque un inhibiteurSGLT2 dès 20. La FI Forxiga consultée ne recommande pas l’introduction sous 25. Ce produit ne se débute donc pas simplement en recopiant le seuil declasse.</p><p>Une poursuite après début antérieur est une autre décision. Vérifier indication, volume, autres médicaments et restrictions, notamment immunosuppresseur, greffe ou dialyse.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI suisse Forxiga, août 2026 — Indication MRC, posologie rénale/hépatique, mises en garde, interactions, grossesse</a>.</p></template>
