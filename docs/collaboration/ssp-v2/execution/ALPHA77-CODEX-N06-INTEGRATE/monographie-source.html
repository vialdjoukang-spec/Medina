<template id="ch-N06"><div class="chap"><div class="chap-head"><div class="code">N06 · N-07-Néphrologie</div><h1>Protéinurie isolée avec lésions morphologiques précisées</h1><span class="status">Monographie pédagogique · Auto-relecture IA documentée · Sans validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button aria-controls="pA" aria-selected="true" data-p="pA" role="tab">⚕ Pathologie et prise en charge</button><button aria-controls="pE" aria-selected="false" data-p="pE" role="tab">🔬 Examens complémentaires</button><button aria-controls="pS" aria-selected="false" data-p="pS" role="tab">⚛ Sciences fondamentales spécialisées</button><button aria-controls="pP" aria-selected="false" data-p="pP" role="tab">💊 Pharmacologie</button></div><style>[data-n06-figure]{margin:1.2em 0;padding:1em;border:1px solid #b8c8d9;border-radius:12px;background:#fff}[data-n06-figure] [data-n06-frame]{position:relative;width:100%;max-width:850px;margin:auto;line-height:0}[data-n06-figure] [data-n06-frame="tall"]{max-width:420px}[data-n06-figure] img{display:block;width:100%;height:auto;margin:0}[data-n06-figure] [data-n06-mark]{position:absolute;transform:translate(-50%,-50%);background:#fff4be;color:#172f50;border:2px solid #172f50;border-radius:50%;width:1.6em;height:1.6em;display:flex;align-items:center;justify-content:center;font:bold 16px/1 sans-serif;box-shadow:0 0 0 2px #fff}[data-n06-figure] figcaption{line-height:1.6;margin-top:.8em;overflow-wrap:anywhere}[data-n06-figure] ol{padding-left:1.5em}[data-n06-figure] [data-n06-credit]{font-size:.85em}[data-n06-figure="podocytes"] [data-n06-mark="1"]{left:44%;top:21%}[data-n06-figure="podocytes"] [data-n06-mark="2"]{left:25%;top:57%}[data-n06-figure="podocytes"] [data-n06-mark="3"]{left:70%;top:83%}[data-n06-figure="nephron"] [data-n06-mark="1"]{left:33%;top:31%}[data-n06-figure="nephron"] [data-n06-mark="2"]{left:51%;top:61%}[data-n06-figure="nephron"] [data-n06-mark="3"]{left:75%;top:75%}[data-n06-figure="sediment"] [data-n06-mark="1"]{left:24%;top:19%}[data-n06-figure="sediment"] [data-n06-mark="2"]{left:74%;top:20%}[data-n06-figure="sediment"] [data-n06-mark="3"]{left:25%;top:71%}[data-n06-figure="sediment"] [data-n06-mark="4"]{left:77%;top:75%}[data-n06-figure="kidney"] [data-n06-mark="1"]{left:23%;top:39%}[data-n06-figure="kidney"] [data-n06-mark="2"]{left:46%;top:31%}[data-n06-figure="kidney"] [data-n06-mark="3"]{left:65%;top:61%}[data-n06-figure="kidney"] [data-n06-mark="4"]{left:87%;top:87%}[data-n06-figure="fsgs"] [data-n06-mark="1"]{left:55%;top:43%}[data-n06-figure="fsgs"] [data-n06-mark="2"]{left:74%;top:49%}[data-n06-figure="fsgs"] [data-n06-mark="3"]{left:23%;top:25%}[data-n06-figure="fsgs"] [data-n06-mark="4"]{left:39%;top:61%}</style><div class="panel" id="pA"><nav class="toc ui"><b>Plan monographique</b><ol><li><a href="#n06-1">Définition</a></li><li><a href="#n06-2">Épidémiologie</a></li><li><a href="#n06-3">Physiopathologie</a></li><li><a href="#n06-4">Démarche clinique</a></li><li><a href="#n06-5">Anamnèse</a></li><li><a href="#n06-6">Examen clinique</a></li><li><a href="#n06-7">Syndromes</a></li><li><a href="#n06-8">Diagnostic positif</a></li><li><a href="#n06-9">Explorations</a></li><li><a href="#n06-10">Arbre diagnostique et diagnostics différentiels</a></li><li><a href="#n06-11">Prise en charge</a></li><li><a href="#n06-12">Prévention, suivi et pronostic</a></li><li><a href="#n06-13">Points clés</a></li><li><a href="#n06-14">Pièges</a></li></ol></nav><div class="chap-body" data-semiology-clinical="N06"><section class="ilot" id="n06-question"><h2>Des protéines dans l’urine, sans plainte : que faut-il vérifier ?</h2><p><b>Vignette fictive.</b> Une personne se sent en bonne santé. Une bandelette faite après une course montre des protéines ; un autre dossier mentionne une protéinurie persistante et une lésion segmentaire sur une ancienne biopsie. Ces observations appellent-elles la même décision ? Le mot « protéinurie » ne précise ni quantité, ni composition, ni durée, et une lésion ancienne ne dit pas tout de son activité actuelle.</p><p>Il faut confirmer une anomalie mesurée correctement, vérifier qu’elle est réellement isolée, puis établir son mécanisme et son risque. Une protéinurie transitoire après effort, une perte tubulaire de petites protéines et une atteinte glomérulaire ne se traitent pas de la même manière. Une absence de symptômes n’écarte pas une maladie.</p><div class="key"><b>À retenir.</b> Commencer par la mesure, puis relier quantité, composition, persistance et contexte à une décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a>.</p></section>
<section class="ilot" id="n06-1"><h2>1. Définition : un signe urinaire, puis une lésion à préciser</h2><p>La protéinurie est l’excrétion de protéines dans l’urine. L’adulte sain en excrète une petite quantité ; les références retenues situent la limite physiologique autour de 150 mg/j. L’albumine n’est qu’une partie de ces protéines : son excrétion habituelle est inférieure à 30 mg/j. Une anomalie peut porter sur la quantité et sur la nature des protéines.</p><p>Une présentation dite <b>isolée</b> signifie que la découverte de protéines n’est pas accompagnée d’un autre tableau rénal évident. Ce caractère doit être vérifié : pression, sédiment, fonction, albumine sanguine et examen clinique recherchent ce qui pourrait modifier cette qualification. Une personne asymptomatique peut avoir une albuminurie pathologique persistante et une maladie rénale avec filtration conservée.</p><p>L’intitulé suisse N06 ajoute une condition : <b>des lésions morphologiques précisées</b>. Une protéinurie isolée sans autre indication n’est pas automatiquement N06. La nomenclature distingue notammentR80 pour protéinurie SAI/isolée SAI ou de Bence Jones, N39.1 pour persistante SAI, N39.2 pour orthostatique SAI etO12.1 pour gestationnelle. Le diagnostic clinique et la documentation du tissu précèdent le choix du code.</p><p>Une morphologie ne nomme pas toujours la cause. Segmentaire, focale, membranoproliférative ou autre décrit une lésion ou une distribution ; il faut encore comprendre son mécanisme, son activité et sa conséquence pour le patient.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML classe N06 etmodificateurS14N00_4 relus pour N06</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p><p><button class="w" data-k="n06-exp-1">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-1">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-2"><h2>2. Épidémiologie : distinguer dépistage, maladie et code</h2><p>Aucune incidence suisse directe N06 n’a été retenue dans les sources consultées. Le nombre de bandelettes positives dépend de l’âge, du dépistage, des circonstances de recueil et de la confirmation. Une première positivité n’a pas la même signification qu’une protéinurie persistante avec une lésion biopsique.</p><p>Le guide SGN 2025 estime qu’environ un adulte sur dix en Suisse présente une maladie rénale chronique. Ce chiffre ne mesure ni la protéinurie isolée ni N06. Les séries de biopsies décrivent des personnes sélectionnées pour cet examen ; elles ne représentent pas toutes les anomalies urinaires de la population.</p><p>Le CUEN décrit la protéinurie orthostatique surtout à la période pubertaire. Cette orientation d’âge aide à choisir un prélèvement ; elle ne permet pas de conclure à la bénignité d’une protéinurie persistante chez un jeune sans vérifier le profil. Les maladies associées, le terrain familial, les médicaments et la trajectoire changent la probabilité des causes. Aucune fréquence individuelle d’un signe n’est inventée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a>.</p><p><button class="w" data-k="n06-exp-2">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-2">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-3"><h2>3. Physiopathologie : filtre, réabsorption et surcharge</h2><p>Le filtre glomérulaire associe endothélium, membrane basale et podocytes. Il limite le passage des cellules et de nombreuses protéines ; le tubule proximal récupère une grande partie des protéines filtrées. L’urine finale contient aussi des protéines sécrétées, notamment l’uromoduline. Une excrétion physiologique ne correspond donc pas à une fuite pathologique d’albumine.</p><figure data-n06-figure="podocytes"><div data-n06-frame="wide"><img alt="Illustration humaine historique des podocytes et de leurs pédicelles autour d’un capillaire glomérulaire" loading="lazy" src="assets/img/n06/alpha/codex/2613_Podocytes.jpg"/><span aria-hidden="true" data-n06-mark="1">1</span><span aria-hidden="true" data-n06-mark="2">2</span><span aria-hidden="true" data-n06-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Corps d’un podocyte dans le détail de gauche.</li><li>Pédicelles entrelacés : organisation du versant externe du filtre.</li><li>Capillaire dans la représentation de droite.</li></ol><p>Planche normale, non image de patient ; elle ne montre ni dépôts immuns ni lésion inflammatoire. Les repères HTML n’altèrent pas les pixels.</p><p data-n06-credit="">OpenStax College, Anatomy &amp; Physiology, 2013 · <a href="https://commons.wikimedia.org/wiki/File:2613_Podocytes.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/3.0/" rel="noopener" target="_blank">CC BY 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Une atteinte glomérulaire augmente le passage de protéines plasmatiques, souvent à prédominance albuminurique. Une atteinte tubulaire diminue la réabsorption de protéines de faible poids moléculaire. Une protéinurie de surcharge apparaît lorsque des protéines circulantes abondantes dépassent les capacités de réabsorption, par exemple des chaînes légères d’immunoglobulines ou de la myoglobine. Ces mécanismes peuvent se combiner ; la présence d’albumine n’exclut pas toute participation tubulaire.</p><p>La composition donne ainsi une information que la bandelette ou le total ne fournissent pas seuls. Une protéinurie peut aussi être transitoire dans un contexte d’effort, de fièvre ou de variation hémodynamique. La confirmation et les anomalies associées évitent de confondre cette situation avec une maladie persistante.</p><p>Les protéines filtrées en excès peuvent participer à une réponse tubulo-interstitielle inflammatoire et à la fibrose ; elles sont aussi un marqueur de lésion et de risque. Diminuer une protéinurie ne prouve toutefois pas que toute cause ou toute cicatrice ait disparu. L’original PAS ci-dessous montre une lésion attribuée par sa provenance à une variante hilaire de sclérose segmentaire et focale ; il n’établit ni cause primitive ni indication de corticoïdes.</p><figure data-n06-figure="fsgs"><div data-n06-frame="wide"><img alt="Microphotographie humaine PAS d’une lésion de sclérose segmentaire et focale, variante hilaire selon la provenance" loading="lazy" src="assets/img/n06/alpha/codex/Focal_segmental_glomerulosclerosis_-_high_mag.jpg"/><span aria-hidden="true" data-n06-mark="1">1</span><span aria-hidden="true" data-n06-mark="2">2</span><span aria-hidden="true" data-n06-mark="3">3</span><span aria-hidden="true" data-n06-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Peloton capillaire du glomérule central : repère du compartiment glomérulaire.</li><li>Région plus dense à droite du glomérule ; la source attribue le champ à une variante hilaire de sclérose segmentaire et focale.</li><li>Tubules voisins : compartiment distinct du glomérule central.</li><li>Limite externe du glomérule et espace périphérique : repère topographique.</li></ol><p>Un champ PAS ne détermine ni proportion de glomérules lésés, ni cause primaire/secondaire/génétique, ni indication d’immunosuppression. La lésion illustrée n’est pas une preuve d’un diagnostic N06 chez un patient donné.</p><p data-n06-credit="">Nephron · <a href="https://commons.wikimedia.org/wiki/File:Focal_segmental_glomerulosclerosis_-_high_mag.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0" rel="noopener" target="_blank">CC BY-SA 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax, Anatomy andPhysiology 2e — Corpuscule, barrière, tubules ; cortex, médulla, voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a>.</p><p><button class="w" data-k="n06-exp-3">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-3">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-4"><h2>4. Démarche clinique : confirmer sans perdre les signes d’alerte</h2><p><b>Vérifier la gravité.</b> Une dyspnée, une oligurie, une dégradation rapide de fonction, une hypertension avec retentissement ou des signes systémiques sortent du simple constat isolé. Un sédiment néphritique associé à une perte rapide de fonction impose un bilan accéléré. La répétition d’un prélèvement ne doit pas retarder cette démarche.</p><p><b>Confirmer la mesure.</b> Préciser produit de bandelette, recueil, effort, fièvre, infection, menstruations et contamination. Confirmer une positivité semi-quantitative par une mesure de laboratoire exprimée en rapport à la créatinine, avec analyte et unité visibles. Le premier prélèvement du matin à mi-jet est préféré pour comparer et confirmer.</p><p><b>Caractériser.</b> Confronter albumine et protéines totales, sédiment, pression et fonction rénale. Rechercher une dépendance posturale lorsque le contexte s’y prête ; ne pas appeler orthostatique toute protéinurie d’un adolescent. La persistance doit être documentée sur des contrôles appropriés.</p><p><b>Établir cause et plan.</b> Examiner le terrain, les examens antérieurs et l’éventuel compte rendu de biopsie. Le néphrologue choisit les investigations susceptibles de changer le traitement. Le suivi doit préciser qui contrôle, à quel délai et quels signes nécessitent un contact anticipé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a>.</p><p><button class="w" data-k="n06-exp-4">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-4">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-5"><h2>5. Anamnèse : expliquer le résultat avant de nommer la maladie</h2><table class="t"><thead><tr><th>Domaine</th><th>Questions</th><th>Conséquence</th></tr></thead><tbody><tr><td>Recueil</td><td>Heure, posture, effort, fièvre, menstruations, infection, qualité de collecte</td><td>Chercher une variation transitoire ou une contamination.</td></tr><tr><td>Chronologie</td><td>Résultats normaux ou anormaux datés, répétitions, ancienne biopsie</td><td>Prouver persistance et évolution ; ne pas supposer une durée.</td></tr><tr><td>Signes urinaires</td><td>Sang visible, dysurie, diurèse, urine mousseuse</td><td>La mousse ne quantifie pas ; sang et symptômes réorientent le bilan.</td></tr><tr><td>Retentissement</td><td>Œdèmes, poids, dyspnée, symptômes tensionnels</td><td>Vérifier que la présentation soit encore isolée.</td></tr><tr><td>Terrain</td><td>Diabète, hypertension, maladie systémique, infection ou gammapathie connue</td><td>Orienter la cause sans attribution automatique.</td></tr><tr><td>Famille</td><td>Protéinurie, hématurie, insuffisance rénale, audition et yeux</td><td>Discuter une maladie génétique et une atteinte associée.</td></tr><tr><td>Médicaments</td><td>AINS, traitements récents, produits naturels, compléments et observance</td><td>Chercher toxicité, interaction et modification fonctionnelle.</td></tr><tr><td>Population</td><td>Croissance, grossesse/projet, fragilité, masse musculaire, alimentation</td><td>Adapter références, estimation et sécurité des traitements.</td></tr></tbody></table><p>Le patient peut ne ressentir aucun symptôme. L’anamnèse ne consiste donc pas seulement à rechercher une plainte : elle restitue les conditions de mesure et la trajectoire. Une ancienne mention de « lésion minime » ou « sclérose » demande le compte rendu exact, sa date et les techniques utilisées ; une mémoire résumée ne remplace pas le tissu documenté.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p><p><button class="w" data-k="n06-exp-5">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-5">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-6"><h2>6. Examen clinique : éprouver le caractère isolé</h2><p>Mesurer la pression avec une méthode reproductible, rechercher œdèmes, variations pondérales, congestion et état d’hydratation. Une fonction dite normale dans le dossier ne dispense pas d’une mesure actuelle. Les signes de maladie systémique sont recherchés selon l’histoire : peau, articulations, manifestations infectieuses, respiratoires ou autres.</p><p>La présence d’une hypertension, d’une hématurie, d’une baisse de fonction ou d’une hypoalbuminémie change la synthèse. Il faut alors qualifier le syndrome réellement présent plutôt que maintenir « isolée » par habitude. Une absence d’œdèmes n’exclut ni une perte protéique importante ni une maladie rénale débutante.</p><p>Chez l’enfant, croissance et pression demandent des références pédiatriques. Chez la personne âgée ou sarcopénique, masse musculaire, nutrition et fragilité influencent l’interprétation de la créatinine et des rapports urinaires. L’examen vérifie également la tolérance des traitements déjà pris.</p><p>Une cible tensionnelle est un objectif thérapeutique dans un cadre défini, non un critère de N06. Si une MRC est établie, la SGN2025 propose une systolique 120–129mmHg individualisée ; la différence avec KDIGO &lt; 120 en mesure standardisée est attribuée. Aucun antihypertenseur n’est choisi sur le seul nom du code.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a>.</p><p><button class="w" data-k="n06-exp-6">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-6">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-7"><h2>7. Syndromes et classifications : ne pas mélanger les seuils</h2><table class="t"><thead><tr><th>Dimension</th><th>Repères</th><th>Limite</th></tr></thead><tbody><tr><td>Protéines physiologiques</td><td>Adulte : environ 100–150 mg/j</td><td>Toutes les protéines ne sont pas de l’albumine.</td></tr><tr><td>Albuminurie</td><td>A1 &lt; 30, A2 30–300, A3 &gt; 300 mg/g ; bornes approximatives 3/30 mg/mmol</td><td>Un rapport n’est pas une collecte 24 h mesurée.</td></tr><tr><td>Protéinurie clinique</td><td>CUEN :&gt; 500 mg/j ou &gt; 500 mg/g comme repère</td><td>Différent de la limite physiologique 150 mg/j.</td></tr><tr><td>Persistance/posture</td><td>Transitoire, orthostatique ou permanente</td><td>À démontrer ; âge ou absence de plainte insuffisants.</td></tr><tr><td>Syndrome néphrotique</td><td>CUEN adulte : protéines &gt; 3 g/j ou g/g et albumine &lt; 30 g/L</td><td>Thurgau utilise 3,5 g/j pour protéinurie néphrotique ; référentiels attribués.</td></tr><tr><td>MRC</td><td>Anomalie ≥ 3 mois ; cause, catégorie G et albuminurie A</td><td>G1/G2 sans marqueur de dommage ne suffisent pas.</td></tr><tr><td>Morphologie</td><td>Distribution, lésion, dépôts, activité et fibrose</td><td>Pas une étiologie ou une prescription complète.</td></tr></tbody></table><p>Les catégories de débit de la MRC sont G1 ≥ 90, G2 60–89, G3a 45–59, G3b 30–44, G4 15–29 et G5 &lt; 15 mL/min/1,73 m². Elles s’interprètent avec marqueurs et durée. Une albuminurie pathologique persistante peut établir une maladie avec un débit G1 ; l’absence de baisse de fonction ne prouve pas l’absence de dommage.</p><p>Le débit de protéines, leur composition et l’albuminémie décrivent encore des informations distinctes. Les seuils de consultation ou de biopsie ne sont pas automatiquement les mêmes que les seuils définissant normalité, catégorie de risque ou syndrome néphrotique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p><p><button class="w" data-k="n06-exp-7">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-7">▲ Loi de Pareto — Le raisonnement essentiel</button></section>

<section class="ilot" id="n06-8"><h2>8. Diagnostic positif : cinq questions de preuve</h2><p><b>Le résultat est-il réel ?</b> Confirmer une bandelette par une mesure quantitative ; vérifier dilution, recueil et facteurs transitoires. Une bandelette négative peut manquer une albuminurie modérée ou une protéinurie non albuminurique. Une valeur de concentration seule dépend de la dilution.</p><p><b>Quelle composition ?</b> L’ACR mesure l’albumine et le RPC les protéines totales. Un total élevé avec peu d’albumine fait rechercher notamment une composante tubulaire ou de surcharge, selon le contexte et les examens adaptés. Il ne faut ni banaliser cette discordance ni la nommer automatiquement glomérulaire.</p><p><b>Quelle durée et quelle posture ?</b> Confirmer au premier matin et sur contrôles comparables. Dans un contexte pubertaire compatible, une disparition après décubitus avec absence d’autres anomalies soutient une protéinurie orthostatique ; le protocole et la concordance clinique sont vérifiés. Une anomalie permanente demande une recherche de cause.</p><p><b>Est-elle isolée ?</b> Vérifier pression, sédiment, fonction, albumine et manifestations systémiques. Une albuminurie persistante peut constituer un marqueur de MRC même avec filtration conservée. L’intervalle de trois mois ne justifie aucune attente en cas de signes d’alerte.</p><p><b>Quelle morphologie est prouvée ?</b> N06 ne se déduit pas du seul dosage. Reprendre la biopsie lorsqu’elle existe et discuter sa nécessité pour une décision clinique, sans geste invasif destiné au codage. Cause et activité restent à interpréter avec le dossier.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML classe N06 etmodificateurS14N00_4 relus pour N06</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a>.</p><p><button class="w" data-k="n06-exp-8">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-8">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-9"><h2>9. Explorations : de la mesure au tissu</h2><table class="t"><thead><tr><th>Outil</th><th>Question</th><th>Limite</th></tr></thead><tbody><tr><td>ACR et RPC</td><td>Quantité et fraction d’albumine ?</td><td>Prélèvement et excrétion decréatinine variables ; unités indispensables.</td></tr><tr><td>Sédiment/ECBU selon contexte</td><td>Hématurie, cellules, cylindres, infection ?</td><td>Un autre profil peut invalider le caractère isolé.</td></tr><tr><td>Créatinine/débit, albumine, biologie orientée</td><td>Fonction, syndrome, retentissement ou cause ?</td><td>Valeur unique ne prouve durée oumécanisme.</td></tr><tr><td>Électrophorèse/immunofixation selon hypothèse</td><td>Petites protéines ou composant monoclonal ?</td><td>Indication etinterprétation guidées parcontexte, pas par BU seule.</td></tr><tr><td>Échographie</td><td>Structure, taille, voies urinaires ?</td><td>Ne montre pas dépôts ou pédicelles.</td></tr><tr><td>Immunologie, génétique</td><td>Cause immune, familiale ou structurale plausible ?</td><td>Positivité isolée et variant incertain ne donnent pas tout le diagnostic.</td></tr><tr><td>Biopsie</td><td>Étiologie, activité, chronicité et changement de prise en charge ?</td><td>Échantillon limité, risques et techniques complémentaires.</td></tr></tbody></table><p>Le néphrologue confronte le débit protéique, les anomalies associées et le bénéfice attendu du prélèvement. Les principes glomérulaires KDIGO recommandent une quantification précise, parfois 24 h chez l’adulte lorsqu’une décision d’immunosuppression en dépend. Le recueil 24 h n’est donc ni obligatoire pour toute découverte ni inutile dans toutes les situations.</p><p>Optique, immunofluorescence et électronique interrogent des dimensions différentes. Un aspect FSGS peut être primaire, secondaire ou associé à une maladie génétique. Une photographie ou une ligne du compte rendu ne décide pas seule d’une immunosuppression. Une hypothèseIgA possède aussi ses propres critères de discussion biopsique ; elle ne transforme pas un seuil en règle universelle de toute protéinurie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">KDIGO, consensus international 2025 — §1.2–1.3, pp.S15–S17 etS32–S33</a>.</p><p><button class="w" data-k="n06-exp-9">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-9">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-10"><h2>10. Arbre diagnostique et diagnostics différentiels</h2><table class="t"><thead><tr><th>Étape</th><th>Observation</th><th>Décision</th></tr></thead><tbody><tr><td>1. Gravité/anomalies associées</td><td>Retentissement, dégradation rapide de fonction, sédiment néphritique</td><td>Bilan accéléré ; requalifier le syndrome.</td></tr><tr><td>2. Confirmation</td><td>Mesure quantitative, unité, premier matin, conditions</td><td>Écarter erreur, contamination et facteur transitoire.</td></tr><tr><td>3. Posture/persistance</td><td>Normalisation en décubitus ou anomalie permanente</td><td>Protocole adapté ; éviter une biopsie d’une orthostatique confirmée et concordante.</td></tr><tr><td>4. Composition</td><td>Albumine majoritaire ou discordance ACR/RPC</td><td>Chercher une origine glomérulaire, tubulaire ou de surcharge.</td></tr><tr><td>5. Cause/risque</td><td>Terrain, famille, maladies associées, tissu</td><td>Investigations orientées, avis néphrologique et plan.</td></tr></tbody></table><p>Une protéinurie tubulaire ou de surcharge peut être discrète à la bandelette. Une maladie systémique, une gammapathie, une atteinte médicamenteuse ou une maladie héréditaire fait partie des alternatives orientées par le dossier. Le diagnostic ne se réduit pas à « albumine absente, donc pas de problème ».</p><p>Les anomalies nouvelles chez une personne déjà biopsiée ne sont pas forcément la simple poursuite de la lésion ancienne. Une infection, une modification hémodynamique ou une maladie associée peut changer l’évolution. La discordance entre profil attendu et données actuelles justifie une reprise du raisonnement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a>.</p><p><button class="w" data-k="n06-exp-10">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-10">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-11"><h2>11. Prise en charge : traiter une cause et un risque établis</h2><p><b>Pas de prescription sur la seule bandelette.</b> Une protéinurie transitoire se réévalue après disparition du facteur déclenchant. Une orthostatique confirmée avec un profil concordant n’appelle pas automatiquement une biopsie ou une immunosuppression. Une protéinurie permanente ou une anomalie associée demande une démarche de cause et de risque.</p><p><b>Orientation spécialisée.</b> La fiche suisseThurgau propose notamment une exploration néphrologique devant albuminurie persistante &gt; 300 mg/j ou protéines &gt; 0,5–1 g/j ; le CUEN retient un avis devant protéinurie permanente &gt; 0,5 g/j. La SGN2025 ajoute cause inconnue, hématurie glomérulaire, progression et autres critères MRC. Il s’agit de repères de consultation, pas de seuils automatiques de biopsie. Une dégradation rapide ou un retentissement grave accélère les soins.</p><p><b>Traitement de cause.</b> La maladie démontrée, l’activité et les dommages orientent une éventuelle intervention spécifique. Une sclérose ne se confond pas avec une inflammation ; une infection et une maladie immune n’appellent pas la même stratégie. Aucun corticoïde universel n’est indiqué par le seul N06.</p><p><b>Néphroprotection lorsque indiquée.</b> Dans une MRC établie, considérer cause, albuminurie, filtration, pression et tolérance. IEC/ARA et éventuel iSGLT2 suivent les recommandations et les FI exactes, dont les indications et restrictions diffèrent. La recommandation de classe dès DFG 20 ne modifie pas l’introduction Forxiga nonrecommandée sous 25. Revoir AINS, interactions, grossesse et risque de déplétion ; toute pause comporte un plan de contrôle et de reprise.</p><p>Une pression normale et l’absence d’œdèmes n’imposent pas amlodipine ou furosémide. Si ces signes apparaissent et justifient leur emploi, il faut réviser la qualification de la présentation et traiter leur mécanisme. Les schémas du volet pharmacologique sont conditionnels, jamais une ordonnance de N06.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">Information professionnelle suisse viaAmiKo : Ramipril Zentiva, décembre 2021 — Indications, posologie, organes, contre-indications, mises en garde, interactions, grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI suisseCosaar, avril 2025 — Indications, posologie, organes, contre-indications, interactions, grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI suisse Forxiga, août 2026 — Indication MRC, posologie rénale/hépatique, mises en garde, interactions, grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo ; Norvasc, avril 2023 — Indications, posologie, contre-indications, précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo ; Lasix 40 mg, mai 2025 — Posologie, contre-indications et précautions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p><p><button class="w" data-k="n06-exp-11">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-11">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-12"><h2>12. Prévention, suivi et pronostic : suivre une trajectoire</h2><p>Le suivi vérifie la persistance, l’évolution de la quantité et de la composition, la pression, la fonction et l’apparition d’autres signes. Comparer des prélèvements réalisés dans des conditions cohérentes, avec le même analyte et les unités visibles. Une normalisation isolée peut refléter un changement de dilution ou de contexte ; elle se confronte aux autres données.</p><p>Le risque dépend de la cause, des lésions, de la fonction, de l’albuminurie et de leur trajectoire. Une morphologie ne donne pas un pronostic individuel certain. Dans la MRC, contrôler débit et albuminurie au moins annuellement, plus souvent selon risque ou changement de traitement. Une variation DFG &gt; 20 %, une baisse &gt; 30 % après thérapie hémodynamique ou un doublement ACR appelle une évaluation ; ces repères ne remplacent pas les soins d’une aggravation symptomatique.</p><p>Les équations validées de risque rénal s’utilisent dans leur population, principalement G3–G5 ; ne pas les extrapoler automatiquement à G1/G2 ou à une fonction instable. La prévention associe revue des médicaments, mode de vie adapté et organisation des contrôles. Les recommandations alimentaires d’adulte MRC ne se transposent pas automatiquement à l’enfant ou à la personne fragile.</p><p>Expliquer au patient la signification des mesures, le prochain rendez-vous et les signes de contact anticipé : baisse de diurèse, dyspnée, œdèmes nouveaux, sang visible ou altération générale selon le contexte. Le suivi doit rester proportionné et compréhensible.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p><p><button class="w" data-k="n06-exp-12">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-12">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-13"><h2>13. Points clés pour l’examen fédéral</h2><p>Décrire une protéinurie par quantité, composition, persistance et contexte ; vérifier fonction, pression et sédiment avant de la dire isolée. Expliquer pourquoi l’ACR et le RPC répondent à des questions différentes, pourquoi le premier matin est utile et pourquoi une bandelette négative ne ferme pas toutes les causes.</p><p>Dans PROFILES 2017, la tâche 173 concerne la protéinurie,161 la fonction,164 le sédiment et 159 les investigations tissulaires/génétiques. Les directives MEBEKO 2026 relient connaissances et compétences cliniques. Les cas et quiz ci-dessous sont originaux MEDINA, sans statut de questions officielles.</p><p>Une synthèse utile relie le résultat confirmé, le mécanisme probable, le risque et le plan. Le code et la morphologie apparaissent après cette conclusion ; ils ne remplacent pas une explication au patient.</p><p><button class="w" data-k="n06-cas-1">Cas clinique 1</button> <button class="w" data-k="n06-cas-2">Cas clinique 2</button> <button class="w" data-k="n06-cas-3">Cas clinique 3</button> <button class="w" data-k="n06-cas-4">Cas clinique 4</button> </p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" rel="noopener" target="_blank">CIMS, PROFILES 2017 — pp.29,32 : SSP64,159,161,164,173</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" rel="noopener" target="_blank">MEBEKO,3mars 2026 — Introduction et§2.1</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a>.</p><p><button class="w" data-k="n06-exp-13">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-13">▲ Loi de Pareto — Le raisonnement essentiel</button><div class="quiz ui"><p>Une bandelette négative exclut-elle toute protéinurie ?</p><button data-ok="1">Non, elle peut manquer une albuminurie modérée ou des protéines non albuminiques.</button><button data-ok="0">Oui, le test mesure toutes les protéines.</button><p class="fb" hidden="">La quantification et la composition répondent àune question différente de la détection semi-quantitative.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a>.</p><div class="quiz ui"><p>Albumine 60 mg/L etcréatinine 1 g/L donnent quel ACR ?</p><button data-ok="1">60 mg/g.</button><button data-ok="0">60 g/j.</button><p class="fb" hidden="">Les litres s’annulent :60 ÷ 1 = 60 mg/g ; ce n’est pas une collecte 24 h mesurée.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p><div class="quiz ui"><p>Multiplier un rapportmg/mmol par 10 donne-t-il une mesure exacte enmg/j ?</p><button data-ok="1">Non, c’est une estimationavec une excrétion de créatinine présumée.</button><button data-ok="0">Oui, c’est une identité d’unité.</button><p class="fb" hidden="">La créatininurie quotidienne varie ; une collecte chronométrée et un rapport sont des mesures différentes.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a>.</p><div class="quiz ui"><p>Toute protéinurie isolée impose-t-elle N06 et une biopsie ?</p><button data-ok="1">Non, la morphologie et les exclusions comptent ; la biopsie répond àune questionclinique.</button><button data-ok="0">Oui, le code décide du geste.</button><p class="fb" hidden="">Protéinurie isolée SAI, persistante SAI, orthostatique SAI etgestationnelle ont des distinctions OFS.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML classe N06 etmodificateurS14N00_4 relus pour N06</a>.</p></section>
<section class="ilot" id="n06-14"><h2>14. Pièges : protéger la mesure et le raisonnement</h2><table class="t"><thead><tr><th>Raccourci</th><th>Correction</th><th>Conséquence</th></tr></thead><tbody><tr><td>Bandelette négative = tout normal</td><td>Sensibilité à l’albumine et protéines non albuminiques limitée</td><td>Quantifier selon question et contexte.</td></tr><tr><td>Concentration = perte quotidienne</td><td>La dilution modifie g/L</td><td>Rapport avec unité ou collecte adaptée.</td></tr><tr><td>× 10 = conversion exacte</td><td>Estimation avec excrétion de créatinine présumée</td><td>Ne pas annoncer une collecte 24 h mesurée.</td></tr><tr><td>Albumine = protéines totales</td><td>Analytes différents</td><td>Confronter ACR/RPC et qualifier les discordances.</td></tr><tr><td>Adolescent = orthostatique</td><td>Posture et profil à démontrer</td><td>Pas de conclusion sur l’âge seul.</td></tr><tr><td>Isolée = sans risque</td><td>Un marqueur persistant peut établir une MRC avec G1</td><td>Rechercher la cause et organiser la surveillance.</td></tr><tr><td>FSGS = cause primitive</td><td>Pattern avec plusieurs mécanismes</td><td>Pas de corticoïdes sur image ou code.</td></tr><tr><td>Toute protéinurie = N06</td><td>Morphologie et exclusions OFS comptent</td><td>Pas de biopsie administrative.</td></tr><tr><td>Baisse des protéines = guérison</td><td>Marqueur, activité et cicatrices distincts</td><td>Suivre fonction, clinique et cause.</td></tr></tbody></table><div class="key"><b>À retenir.</b> La bonne mesure précise le signe ; le contexte lui donne sa signification.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML classe N06 etmodificateurS14N00_4 relus pour N06</a>.</p><p><button class="w" data-k="n06-exp-14">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-14">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-annexe-cim"><h2>Après la conclusion clinique : sous-codes morphologiques</h2><p>N06 porte une exigence de lésion morphologique précisée. Les suffixes .0–.8 nécessitent normalement une preuve tissulaire ; les dix entrées du modificateur commun sont reproduites ci-dessous. Le suffixe.9 proposé ne transforme pas une simple bandelette positive en N06 et ne supprime pas les conditions de catégorie. Le choix final suit le dossier et les règles applicables.</p><table class="t"><thead><tr><th>Sous-code</th><th>Libellé morphologique OFS</th></tr></thead><tbody><tr><td>N06.0</td><td>Anomalies glomérulaires mineures</td></tr><tr><td>N06.1</td><td>Lésions glomérulaires segmentaires et focales</td></tr><tr><td>N06.2</td><td>Glomérulonéphrite membraneuse diffuse</td></tr><tr><td>N06.3</td><td>Glomérulonéphrite mésangio-proliférative diffuse</td></tr><tr><td>N06.4</td><td>Glomérulonéphrite proliférative endocapillaire diffuse</td></tr><tr><td>N06.5</td><td>Glomérulonéphrite mésangiocapillaire diffuse</td></tr><tr><td>N06.6</td><td>Maladie à dépôt dense</td></tr><tr><td>N06.7</td><td>Glomérulonéphrite diffuse en croissant</td></tr><tr><td>N06.8</td><td>Autres modifications morphologiques</td></tr><tr><td>N06.9</td><td>Type de modification morphologique non précisé</td></tr></tbody></table><p>Exclusions : protéinurie de Bence Jones, isolée SAI ou SAI R80 ; orthostatique SAI N39.2 ; persistante SAI N39.1 ; gestationnelleO12.1. L’inclusion vise les présentations isolée/orthostatique/persistante avec morphologie précisée. Il ne faut jamais pratiquer une biopsie dans le seul but de remplir un code ; la cause et la décision clinique précèdent la nomenclature.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML classe N06 etmodificateurS14N00_4 relus pour N06</a>.</p></section>
</div></div>

<div class="panel" hidden="" id="pE"><div class="chap-body"><section class="ilot" id="n06-e-urines"><h2>Urines : quantifier une fuite, caractériser un sédiment</h2><table class="t"><thead><tr><th>Question</th><th>Examen</th><th>Interprétation et limite</th></tr></thead><tbody><tr><td>Combien d’albumine ?</td><td>Rapport albumine/créatinine, analyte et unité précisés</td><td>A1 &lt; 30, A2 30–300, A3 &gt; 300 mg/g ; ne mesure pas toutes les protéines.</td></tr><tr><td>Combien de protéines ?</td><td>Rapport protéines/créatinine ou recueil quantitatif</td><td>Pertinent pour certaines décisions glomérulaires ; recueil 24 h adulte si introduction/intensification d’immunosuppression.</td></tr><tr><td>Quel compartiment saigne ?</td><td>Numération et morphologie des hématies, acanthocytes, cylindres</td><td>Indices glomérulaires selon méthode ; absence non excluante.</td></tr><tr><td>Le résultat est-il fiable ?</td><td>Conditions de recueil, infection, sang visible, évolution</td><td>Un résultat ponctuel varie ; confirmer ce qui change une décision.</td></tr><tr><td>Et chez l’enfant ?</td><td>Premier prélèvement du matin pour le rapport protéines/créatinine</td><td>Équations et objectifs pédiatriques ; recueil 24 h souvent difficile.</td></tr></tbody></table><p>La bandelette dite « sang » ne compte pas les hématies : elle réagit aussi aux hémoprotéines libres. Le seuil local HUG de 26 millions/L correspond à 26 cellules/µL ; l’équivalence en nombre par champ dépend de la technique. Le seuil français CUEN de 10/µL est attribué à son référentiel ; ces deux nombres ne constituent pas deux stades de N06.</p><p>Le premier prélèvement du matin à mi-jet est préféré ; chez l’enfant, ACR et RPC se complètent. Effort, infection, menstruations et excrétion de créatinine influencent la mesure. Le rapport albumine/créatinine et le rapport protéines/créatinine ont des numérateurs différents. Écrire mg/g, mg/mmol ou g/g est indispensable avant toute comparaison. Pour discuter une évolution, utiliser des prélèvements comparables et tenir compte du contexte. Le doublement de l’ACR appelle une évaluation ; il ne démontre pas automatiquement une poussée immune.</p><p>Dans une glomérulopathie, une quantification prolongée peut être nécessaire lorsque la décision d’intensifier un traitement dépend d’une mesure précise. Le choix ne consiste pas à demander tous les types de collecte à chaque consultation. Il suit une question et une population.</p><figure data-n06-figure="sediment"><div data-n06-frame="wide"><img alt="Quatre photographies originales de cylindres urinaires : épithélial, granuleux, leucocytaire et érythrocytaire" loading="lazy" src="assets/img/n06/alpha/codex/RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg"/><span aria-hidden="true" data-n06-mark="1">1</span><span aria-hidden="true" data-n06-mark="2">2</span><span aria-hidden="true" data-n06-mark="3">3</span><span aria-hidden="true" data-n06-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Panneau a : cylindre de cellules épithéliales tubulaires, selon la légende source.</li><li>Panneau b : cylindre granuleux brun, selon la légende source.</li><li>Panneau c : cylindre leucocytaire, selon la légende source.</li><li>Panneau d : cylindre érythrocytaire, repère pertinent pour une atteinte glomérulaire.</li></ol><p>Original disponible en 567 × 337 pixels ; les cellules ne sont pas reclassées au-delà de la légende publiée. Source utilisée pour la figure, pas comme recommandation américaine de prise en charge. La page Commons fournit les droits propres ; l’accès direct PMC a renvoyé une vérification de navigateur, sans lecture de l’article intégral.</p><p data-n06-credit="">V. Mohsenin, J Intensive Care 2017;5:57, figure de microscopie · <a href="https://commons.wikimedia.org/wiki/File:RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener" target="_blank">CC BY 4.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie microhématurie 2024 — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">CUEN,12e édition 2025 — pp.118–123, texte hors arbre p 122 mal extrait</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a>.</p></section>
<section class="ilot" id="n06-e-fonction"><h2>Fonction rénale : interpréter une valeur et sa variation</h2><p>La créatinine est un marqueur indirect de filtration influencé notamment par sa production ; le débit estimé n’est pas une mesure de toutes les fonctions rénales. Une masse musculaire faible ou inhabituelle, une situation non stable et certains traitements limitent son interprétation. Quand la précision est déterminante, une estimation combinée créatinine–cystatine C ou une mesure de filtration peut être indiquée.</p><p>Dans la maladie rénale chronique, la variation relative aide à reconnaître ce qui dépasse les fluctuations attendues. Une baisse de débit supérieure à 20 % sur un contrôle appelle une évaluation ; après une thérapie hémodynamique, une baisse supérieure à 30 % constitue un autre repère. Pour un IEC/ARA, la recommandation de sécurité se formule aussi comme une hausse de créatinine supérieure à 30 % dans les quatre semaines après introduction ou titration. Ces formulations ne sont pas des transformations mathématiques exactement équivalentes.</p><p>Le calcul de variation doit préciser la valeur de départ, le délai et le sens de la variation. Une créatinine qui augmente et un débit qui diminue ne se soustraient pas dans le même ordre. L’analyse recherche ensuite déplétion, médicaments, obstacle et maladie active. Une aggravation symptomatique ne doit pas attendre de franchir un seuil.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a>.</p><p><button class="w" data-k="n06-calcul-variation">Calculer une variation relative</button></p></section>
<section class="ilot" id="n06-e-cause"><h2>Cause et activité : organiser les preuves</h2><table class="t"><thead><tr><th>Outil</th><th>Question</th><th>Limite</th></tr></thead><tbody><tr><td>Immunologie orientée</td><td>Auto-immunité, complément, immunoglobulines selon présentation</td><td>Un anticorps ou un C3 bas isolé ne donne pas toute la cause.</td></tr><tr><td>Recherche infectieuse</td><td>Infection active ou persistante selon histoire et tableau</td><td>Une infection peut modifier la stratégie d’immunosuppression.</td></tr><tr><td>Échographie</td><td>Taille, parenchyme, obstacle, anomalies structurales</td><td>Ne démontre pas dépôts ou intégrité de la membrane basale.</td></tr><tr><td>Génétique</td><td>Maladie familiale ou phénotype évocateur, notamment COL4A3/4/5</td><td>Variant incertain et panel négatif ont des limites ; corrélation familiale et clinique.</td></tr><tr><td>Biopsie</td><td>Étiologie, activité, cicatrices et bénéfice possible d’un traitement</td><td>Risque et utilité individualisés ; prélèvement limité, techniques complémentaires.</td></tr></tbody></table><p>La biopsie rénale a une valeur diagnostique, pronostique et parfois thérapeutique. Une répétition n’est utile que si l’information attendue peut modifier le plan ou l’estimation du pronostic. Contrôler les conditions du geste et les traitements influençant le saignement selon le centre ; les délais d’arrêt ne doivent pas être improvisés à partir d’une règle unique.</p><p>Le compte rendu précise le compartiment, la distribution, les dépôts, les lésions actives et les cicatrices. Une fluorescence à dominante complément ou immunoglobuline change les hypothèses ; elle ne se voit pas sur une simple photographie PAS. Le patient reçoit une explication de ce que le tissu établit et de ce qui reste incertain.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 chapitre 8 — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">KDIGO, consensus international 2025 — §1.2–1.3, pp.S15–S17 etS32–S33</a>.</p></section>
</div></div><div class="panel" hidden="" id="pS"><div class="sci-bar ui" role="tablist"><button aria-controls="n06-s-semio" aria-selected="true" data-s="n06-s-semio" id="n06-tab-semio" role="tab">Sémiologie fondamentale et analytique</button><button aria-controls="n06-s-anat" aria-selected="false" data-s="n06-s-anat" id="n06-tab-anat" role="tab">Anatomie</button><button aria-controls="n06-s-histo" aria-selected="false" data-s="n06-s-histo" id="n06-tab-histo" role="tab">Histologie</button><button aria-controls="n06-s-physio" aria-selected="false" data-s="n06-s-physio" id="n06-tab-physio" role="tab">Physiologie</button><button aria-controls="n06-s-bio" aria-selected="false" data-s="n06-s-bio" id="n06-tab-bio" role="tab">Biochimie</button><button aria-controls="n06-s-immuno" aria-selected="false" data-s="n06-s-immuno" id="n06-tab-immuno" role="tab">Immunologie et physiopathologie</button></div><div class="chap-body sci-body"><div aria-labelledby="n06-tab-semio" class="sci" id="n06-s-semio" role="tabpanel"><section class="ilot" data-semiology="normal" id="n06-semio-normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>Le filtre normal limite le passage des protéines, puis le tubule proximal récupère une grande partie des protéines filtrées. L’urine contient aussi des protéines sécrétées, dont l’uromoduline. Chez l’adulte, la limite physiologique de protéines totales est autour de 150 mg/j ; l’albumine est normalement inférieure à 30 mg/j. Ces repères ne sont pas interchangeables.</p><p>La normalité précise analyte, unité, méthode et population. Un débit G1 ou G2 ne démontre pas l’intégrité du filtre ; une albuminurie pathologique persistante peut établir un dommage malgré filtration conservée. Inversement, G2 isolé sans marqueur ne suffit pas à définir une MRC.</p><figure data-n06-figure="sediment"><div data-n06-frame="wide"><img alt="Quatre photographies originales de cylindres urinaires : épithélial, granuleux, leucocytaire et érythrocytaire" loading="lazy" src="assets/img/n06/alpha/codex/RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg"/><span aria-hidden="true" data-n06-mark="1">1</span><span aria-hidden="true" data-n06-mark="2">2</span><span aria-hidden="true" data-n06-mark="3">3</span><span aria-hidden="true" data-n06-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Panneau a : cylindre de cellules épithéliales tubulaires, selon la légende source.</li><li>Panneau b : cylindre granuleux brun, selon la légende source.</li><li>Panneau c : cylindre leucocytaire, selon la légende source.</li><li>Panneau d : cylindre érythrocytaire, repère pertinent pour une atteinte glomérulaire.</li></ol><p>Original disponible en 567 × 337 pixels ; les cellules ne sont pas reclassées au-delà de la légende publiée. Source utilisée pour la figure, pas comme recommandation américaine de prise en charge. La page Commons fournit les droits propres ; l’accès direct PMC a renvoyé une vérification de navigateur, sans lecture de l’article intégral.</p><p data-n06-credit="">V. Mohsenin, J Intensive Care 2017;5:57, figure de microscopie · <a href="https://commons.wikimedia.org/wiki/File:RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener" target="_blank">CC BY 4.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a>.</p></section>
<section class="ilot" data-semiology="signs" id="n06-semio-signs"><h3>Décrire un résultat avant de le qualifier d’isolé</h3><p>Noter quantité, composition, recueil et dates. Une urine mousseuse ne quantifie pas les protéines ; une bandelette positive ne donne ni perte quotidienne ni cause. La présentation peut être sans plainte. Rechercher sang visible, baisse de diurèse, œdèmes, variation de poids, dyspnée ou symptômes systémiques.</p><p>Le caractère isolé se vérifie avec pression, fonction, sédiment et albumine sanguine. Une anomalie associée oblige à requalifier le syndrome. Effort, fièvre, infection, posture et contamination peuvent modifier un prélèvement ; une seule mesure ne prouve ni persistance ni bénignité.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a>.</p></section>
<section class="ilot" data-semiology="mechanisms" id="n06-semio-mechanisms"><h3>Relier composition et compartiment</h3><p>La fuite glomérulaire produit souvent une protéinurie à prédominance albuminurique. Un défaut de réabsorption proximale augmente les petites protéines ; une surcharge circulante, par exemple en chaînes légères, peut saturer cette récupération. Ces mécanismes peuvent se combiner. Une faible fraction d’albumine n’exclut donc pas une maladie importante.</p><p>La composition explique pourquoi une bandelette centrée sur l’albumine peut manquer une protéinurie de surcharge. Une lésion de sclérose ne se confond pas avec une inflammation ; le mécanisme, le tissu et la trajectoire déterminent la suite plutôt que le seul total.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></section>
