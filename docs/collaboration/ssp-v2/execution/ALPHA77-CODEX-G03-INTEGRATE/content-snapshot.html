errain hépatique/nutritionnel à risque décrit</td><td>Réduire/espacer ; maximum 2 g/j ; atteinte grave contre-indiquée.</td></tr></tbody></table><p>La FI ne fixe pas une durée universelle de traitement de méningite chez l’adulte. Réévaluer douleur, fièvre, hydratation et diagnostic, employer la dose efficace minimale aussi brièvement que nécessaire. En grossesse, la FI retient la dose efficace la plus faible, la durée la plus courte et la fréquence la plus basse si le traitement est cliniquement nécessaire.</p><div class="key"><b>À retenir.</b> Additionner tout le paracétamol ingéré et respecter l’adaptation la plus contraignante ; la suspicion de surdosage exige une évaluation urgente.</div><p>Sources : <button class="w" data-k="g03-r10">[R10]</button></p></section><section class="ilot" id="g03-p-metabolisme"><h2>Mécanisme, interactions et surveillance du paracétamol</h2><p>Le paracétamol agit comme antalgique et antipyrétique ; son mécanisme n’est pas entièrement élucidé. Son métabolisme hépatique repose surtout sur la conjugaison ; une petite fraction forme un métabolite réactif habituellement détoxifié par le glutathion. Un surdosage ou un terrain à faibles réserves accroît le risque de toxicité hépatique. L’absence de symptôme immédiat ne garantit pas l’absence de lésion.</p><p>Vérifier notamment inducteurs enzymatiques, autres médicaments hépatotoxiques, alcool, probénécide et prise prolongée avec anticoagulants coumariniques. La FI attire aussi l’attention sur l’acidose métabolique à trou anionique augmenté associée à une acidose pyroglutamique, surtout en terrain fragile et lors d’association à la flucloxacilline. Ces situations nécessitent une réévaluation clinique, pas une simple augmentation de dose pour une céphalée persistante.</p><p>Une réaction cutanée sévère ou une hypersensibilité impose l’arrêt et une prise en charge adaptée. Le suivi de la maladie reste prioritaire : une fièvre ou une douleur croissante malgré traitement peut signaler une complication ou un diagnostic initial incomplet.</p><div class="key"><b>À retenir.</b> Un médicament symptomatique courant conserve des contre-indications et interactions ; son effet ne valide pas l’étiquette diagnostique.</div><p>Sources : <button class="w" data-k="g03-r10">[R10]</button></p></section><section class="ilot" id="g03-p-suspects"><h2>IgIV et AINS : savoir reconnaître le signal</h2><p>Privigen et Ibuprofen-Mepha Teva possèdent des mises en garde explicites concernant la méningite aseptique. Leurs informations ne prouvent pas que tout événement survenant après prise est causé par le produit. La recherche d’une infection et d’une autre cause reste nécessaire, puis la décision d’arrêt se coordonne avec l’indication initiale.</p><p><button class="w" data-k="g03-privigen">Privigen : signal documenté, pas traitement de G03</button></p><p><button class="w" data-k="g03-ibuprofene">Ibuprofène : méningite aseptique avec ou sans lupus</button></p><div class="key"><b>À retenir.</b> Une classe peut être un suspect causal et un produit peut masquer une infection ; la chronologie doit être analysée sans raccourci.</div><p>Sources : <button class="w" data-k="g03-r9">[R9]</button> · <button class="w" data-k="g03-r11">[R11]</button> · <button class="w" data-k="g03-r12">[R12]</button></p></section><section class="ilot" id="g03-p-antiviraux"><h2>Antiviraux et corticoïdes : séparer les indications</h2><p><button class="w" data-k="g03-suppression">Valaciclovir suppressif : ce que l’essai permet de dire</button></p><p>Une suspicion d’encéphalite herpétique exige un antiviral intraveineux urgent selon les recommandations et le terrain ; elle sort du tableau d’une simple méningite virale sans trouble de conscience ni focalisation. Les prescriptions d’aciclovir/valaciclovir demandent notamment une vérification rénale et du produit exact ; aucun nouveau schéma chiffré n’est importé ici d’une source non suisse non relue.</p><p>La corticothérapie adjuvante empirique d’une méningite bactérienne se réévalue avec le LCR et l’agent. Elle n’est pas un traitement automatique d’une méningite virale, médicamenteuse ou chronique indéterminée. Une corticothérapie immunomodulatrice pour une cause systémique relève d’un diagnostic et d’un plan spécialisés distincts.</p><button class="pareto-btn ui" data-k="pareto-g03-pharmaco">▲ Loi de Pareto — Pharmacologie</button><p>Sources : <button class="w" data-k="g03-r1">[R1]</button> · <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r6">[R6]</button> · <button class="w" data-k="g03-r10">[R10]</button> · <button class="w" data-k="g03-r15">[R15]</button></p></section><section class="ilot" id="g03-src"><h2>Sources consultées et portée des lectures</h2><p>Sources suisses prioritaires, complétées par recommandations européennes et OMS. Les lectures sont ciblées et leurs populations sont conservées. Le résumé primaire de l’essai ne devient pas une lecture intégrale. Les chiffres de cohorte ou de pharmacovigilance ne sont pas des incidences suisses.</p><ol><li><button class="w" data-k="g03-r1">[R1] SSI : addendum suisse à ESCMID, 28 décembre 2017</button></li><li><button class="w" data-k="g03-r2">[R2] Syndrome méningé fébrile aux urgences, 2016</button></li><li><button class="w" data-k="g03-r3">[R3] Méningite chronique : étiologies et approche diagnostique, 2021</button></li><li><button class="w" data-k="g03-r4">[R4] WHO guidelines on meningitis diagnosis, treatment and care, 2025</button></li><li><button class="w" data-k="g03-r5">[R5] German guidelines on acute bacterial meningitis in adults, 2023</button></li><li><button class="w" data-k="g03-r6">[R6] DGN : Virale Meningoenzephalitis, version 7, 2025</button></li><li><button class="w" data-k="g03-r7">[R7] S1 guideline lumbar puncture and cerebrospinal fluid analysis, traduction 2020</button></li><li><button class="w" data-k="g03-r8">[R8] Mollaret au Danemark : cohorte nationale, 2024</button></li><li><button class="w" data-k="g03-r9">[R9] Méningite aseptique médicamenteuse : 329 cas français, 2019</button></li><li><button class="w" data-k="g03-r10">[R10] DAFALGAN comprimés 500 mg, FI septembre 2025</button></li><li><button class="w" data-k="g03-r11">[R11] Privigen : FI juillet 2025</button></li><li><button class="w" data-k="g03-r12">[R12] Ibuprofen-Mepha Teva : FI décembre 2024</button></li><li><button class="w" data-k="g03-r13">[R13] CIM-10-GM 2024 : G03</button></li><li><button class="w" data-k="g03-r14">[R14] CEN : méningites et méningo-encéphalites, item 151</button></li><li><button class="w" data-k="g03-r15">[R15] Essai randomisé valaciclovir suppressif après méningite HSV-2, 2012</button></li><li><button class="w" data-k="g03-r16">[R16] Gray Anatomy 1918, planche 1196 : enveloppes et sinus</button></li><li><button class="w" data-k="g03-r17">[R17] Gray Anatomy 1918, planche 764 : voie motrice</button></li><li><button class="w" data-k="g03-r18">[R18] PROFILES 2017 : urgence céphalée sévère et méningisme</button></li></ol><p>Sources : <button class="w" data-k="g03-r1">[R1]</button> · <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r15">[R15]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="g03-aseptique" data-k="g03-aseptique"><h3>« Aseptique » : préciser ce que le mot signifie</h3><p>Dans l’usage syndromique, une méningite aseptique désigne souvent une inflammation méningée sans bactérie identifiée par les méthodes usuelles ; une cause virale reste possible. Dans la série française de méningites médicamenteuses, la définition de recherche excluait aussi les microorganismes viraux détectés. Ces usages ne sont donc pas interchangeables.</p><p>Une culture stérile peut résulter d’antibiotiques déjà administrés, d’un agent exigeant ou d’une technique insuffisante. Le mot ne constitue ni une preuve d’innocuité ni une indication à arrêter immédiatement toute couverture empirique.</p><p>Sources : <button class="w" data-k="g03-r2">[R2]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r9">[R9]</button></p></template>
<template data-pop="g03-medic" data-k="g03-medic"><h3>Reconstituer une chronologie médicamenteuse exploitable</h3><p>Lister prescriptions, automédication, produits injectés et perfusions récentes, changements de dose, médicaments intermittents et traitements intrathécaux. Pour chaque produit suspect, relever début, dernière administration, délai avant les symptômes, évolution après arrêt et épisodes antérieurs involontaires de réexposition.</p><p>La temporalité d’une méningite médicamenteuse est variable. Pour Privigen, la FI situe habituellement le début dans les heures à deux jours suivant l’administration. Cet intervalle est spécifique à ce signal et ne devient pas une fenêtre obligatoire pour tous les médicaments. Une réexposition volontaire pour « confirmer » n’est pas proposée.</p><p>Sources : <button class="w" data-k="g03-r9">[R9]</button> · <button class="w" data-k="g03-r11">[R11]</button> · <button class="w" data-k="g03-r12">[R12]</button></p></template>
<template data-pop="g03-meningisme" data-k="g03-meningisme"><h3>Raideur, Kernig et Brudzinski : technique et limite</h3><p>Chez un patient coopérant et sans contre-indication à la mobilisation, la flexion douce de la nuque recherche une résistance douloureuse compatible avec une irritation méningée. Le signe de Brudzinski correspond à une flexion involontaire des membres inférieurs lors de la flexion cervicale. Le signe de Kernig recherche une résistance douloureuse à l’extension du genou avec la hanche fléchie.</p><p>Ces manœuvres ne doivent pas être forcées et ne remplacent pas la recherche de gravité. Une douleur mécanique, une limitation articulaire ou une coopération insuffisante peuvent gêner l’examen. Leur absence n’exclut pas une méningite et leur présence ne distingue pas bactérie, virus ou autre inflammation.</p><p>Sources : <button class="w" data-k="g03-r2">[R2]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r14">[R14]</button></p></template>
<template data-pop="g03-ct" data-k="g03-ct"><h3>OMS 2025 : quand imager avant la PL ?</h3><p>L’OMS recommande une imagerie avant la PL en cas de Glasgow <10, signe neurologique focal, atteinte d’un nerf crânien, œdème papillaire, crise d’apparition récente chez l’adulte ou immunodépression sévère. La PL est différée si l’imagerie nécessaire n’est pas disponible. Les recommandations sont fortes malgré une certitude très faible pour plusieurs critères.</p><p>Des troubles hémorragiques, une infection au site de ponction ou une instabilité nécessitant stabilisation peuvent également conduire à reporter la PL. Les seuils biologiques et délais liés aux anticoagulants dépendent du contexte et du protocole spécialisé : aucune valeur unique n’est inventée ici.</p><p>Exception importante : devant une première suspicion de méningite cryptococcique liée au VIH, la PL avec pression d’ouverture et test antigénique rapide est centrale ; l’immunodépression ne doit pas devenir un motif automatique de retard. La décision tient compte des autres contre-indications. Chez l’enfant, une crise fébrile isolée sans autre signe de risque ne justifie pas à elle seule un scanner.</p><p>Sources : <button class="w" data-k="g03-r4">[R4]</button></p></template>
<template data-pop="g03-mollaret" data-k="g03-mollaret"><h3>Mollaret : récidives et lien avec HSV-2</h3><p>Des épisodes aigus douloureux alternent avec des intervalles libres. HSV-2 est une association importante, mais la documentation peut varier entre épisodes ; les cellules historiquement dites de Mollaret ne sont pas spécifiques. La DGN rappelle qu’une méningite médicamenteuse peut reproduire le tableau.</p><p>La cohorte danoise associait au moins deux épisodes à une preuve de HSV-2 lors d’un épisode, selon ses définitions. Elle retrouvait un pronostic fonctionnel global favorable, avec une possibilité persistante de nouvelle hospitalisation. L’évaluation utilisée peut manquer fatigue et troubles cognitifs subtils.</p><p>Sources : <button class="w" data-k="g03-r6">[R6]</button> · <button class="w" data-k="g03-r8">[R8]</button></p></template>
<template data-pop="g03-chronique" data-k="g03-chronique"><h3>PL répétées et biopsie : pourquoi et dans quelles limites ?</h3><p>Une première PL négative ne clôt pas nécessairement le bilan chronique. Répéter des prélèvements orientés peut augmenter le rendement microbiologique ou cytologique, après réévaluation de la sécurité. Le volume, les tubes, le transport et les analyses sont discutés en amont avec le laboratoire ; il n’existe pas de volume ou de nombre universel de PL à appliquer à tout patient.</p><p>L’IRM avec contraste recherche le siège du rehaussement, les atteintes des nerfs crâniens, l’hydrocéphalie et d’autres lésions. Une biopsie peut être discutée lorsque le bilan reste non concluant et que le résultat modifierait les soins. Un site extraneural accessible est recherché ; si une biopsie méningée est retenue, cibler une région anormale à l’imagerie peut améliorer le rendement, sans garantir un diagnostic.</p><p>La décision associe neurologue, infectiologue et, selon les hypothèses, interniste, immunologue, ophtalmologue ou oncologue. Les faibles rendements de certaines techniques et les risques du geste sont explicités au patient.</p><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r7">[R7]</button></p></template>
<template data-pop="pareto-g03-clinique" data-k="pareto-g03-clinique"><h3>Raisonnement clinique</h3><p>Une méningite est une urgence potentielle avant son étiquette. Distinguer aiguë, persistante et récurrente ; interpréter ensemble clinique, LCR et microbiologie. Retirer un médicament suspect avec traçabilité, rechercher les causes chroniques et réviser tout diagnostic acquis.</p></template>
<template data-pop="g03-lcr" data-k="g03-lcr"><h3>Lire ensemble cellules, glucose, protéines et lactate</h3><p>Chez l’adulte, la recommandation de diagnostic du LCR cite notamment moins de 5 leucocytes/µl, protéines totales inférieures à 500 mg/l et rapport glucose LCR/sérum supérieur à 0,50 comme repères usuels, avec variation selon âge, site et méthode. Ils doivent être confrontés aux valeurs du laboratoire. Les seuils pédiatriques ne sont pas extrapolés.</p><p>Une pléiocytose traduit un excès de cellules nucléées ; la formule indique leur répartition. Une prédominance neutrophile peut se voir au début d’une virose ou dans une méningite médicamenteuse. Une faible cellularité n’élimine pas une infection grave, surtout en début d’évolution ou en immunodépression.</p><p>Un glucose abaissé peut accompagner une infection bactérienne, tuberculeuse ou fongique et une infiltration tumorale. Les protéines renseignent sur perméabilité, circulation et inflammation, sans fournir une cause unique. Le lactate est un argument d’orientation, affecté notamment par un prétraitement et par d’autres atteintes neurologiques.</p><p>Sources : <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r9">[R9]</button></p></template>
<template data-pop="pareto-g03-examens" data-k="pareto-g03-examens"><h3>Explorations</h3><p>La sécurité précède le geste ; le prélèvement apparié et le transport conditionnent le résultat. Les profils du LCR se chevauchent. Choisir microbiologie, immunologie, cytologie et imagerie selon une hypothèse réévaluée.</p></template>
<template data-pop="pareto-g03-semio" data-k="pareto-g03-semio"><h3>Sémiologie</h3><p>Décrire avant de conclure. Relier enveloppes, douleur, LCR et fonction neurologique ; reconnaître les signes qui dépassent une méningite simple. Une triade absente ou un test négatif isolé n’excluent pas une cause grave.</p></template>
<template data-pop="g03-pression" data-k="g03-pression"><h3>Pression d’ouverture : mesure, sécurité et exception cryptococcique</h3><p>La pression d’ouverture est mesurée en décubitus latéral avant retrait significatif de liquide, avec un dispositif adapté. Le guide européen cite 100–250 mm d’eau comme intervalle de référence dépendant notamment de la corpulence ; il ne s’agit pas d’un seuil universel isolé de maladie. L’indication et la sécurité de la PL sont évaluées auparavant.</p><p>Une masse avec effet de pression et risque d’engagement peut imposer de différer le geste. À l’inverse, la suspicion de méningite cryptococcique liée au VIH rend la PL avec pression d’ouverture essentielle selon OMS 2025, sous réserve des autres contre-indications. La mesure et une éventuelle gestion thérapeutique de la pression relèvent du protocole spécialisé.</p><p>Sources : <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r7">[R7]</button></p></template>
<template data-pop="g03-cellules" data-k="g03-cellules"><h3>Cellules de Mollaret : une observation non spécifique</h3><p>Des cellules historiquement décrites dans la méningite récurrente ont donné leur nom à une description cytologique. La DGN 2025 précise qu’elles ne sont pas pathognomoniques. Leur présence ne suffit ni à identifier HSV-2 ni à exclure une cause médicamenteuse ou une autre inflammation.</p><p>La cohorte danoise récente a défini ses cas à partir des épisodes cliniques et de l’association documentée à HSV-2, sans exiger ces cellules. Le diagnostic moderne repose sur un faisceau clinique et microbiologique, avec des définitions variables entre études.</p><p>Sources : <button class="w" data-k="g03-r6">[R6]</button> · <button class="w" data-k="g03-r8">[R8]</button></p></template>
<template data-pop="g03-paracetamol" data-k="g03-paracetamol"><h3>DAFALGAN 500 mg : schéma adulte et adaptations vérifiées</h3><p>FI suisse septembre 2025, autorisation 69266 : chaque comprimé contient 500 mg de paracétamol. Pour l’adulte de plus de 40 kg, la FI décrit 500–1000 mg par prise, avec intervalle de 4–8 heures et maximum 4000 mg par jour toutes spécialités confondues. Ce plafond n’est pas une dose à atteindre systématiquement.</p><p>Insuffisance rénale : clairance de créatinine 10–50 ml/min, intervalle minimal 6 heures et maximum 3000 mg/j ; clairance <10 ml/min, intervalle minimal 8 heures et maximum 2000 mg/j. En maladie hépatique chronique ou compensée active, alcoolisme chronique, déficit alimentaire, déshydratation ou cachexie, réduire la dose ou espacer, sans dépasser 2000 mg/j selon la FI.</p><p>Contre-indications de cette présentation : hypersensibilité, atteinte hépatique grave/hépatite aiguë ou maladie décompensée active, et maladie de Gilbert mentionnée par cette FI. Vérifier le terrain avant toute proposition. Les schémas pédiatriques et les données SwissPedDose ajoutées à la page ne sont pas extrapolés ici.</p><p>Sources : <button class="w" data-k="g03-r10">[R10]</button></p></template>
<template data-pop="g03-privigen" data-k="g03-privigen"><h3>Privigen : signal documenté, pas traitement de G03</h3><p>FI juillet 2025 : syndrome habituellement dans les heures à deux jours, parfois avec forte pléiocytose majoritairement granulocytaire et protéines augmentées. Une dose élevée et/ou un débit élevé sont associés à un risque plus fréquent. Les patients symptomatiques doivent recevoir une évaluation neurologique avec analyse du LCR afin d’exclure d’autres causes.</p><p>La FI rapporte une rémission généralement en quelques jours après arrêt. Cette évolution habituelle n’est ni garantie individuelle ni motif pour attendre sans bilan. Enregistrer produit et lot ; déclarer l’effet nouveau ou grave suspect selon les modalités suisses. Aucune dose d’IgIV n’est proposée comme traitement de la méningite.</p><p>Sources : <button class="w" data-k="g03-r11">[R11]</button></p></template>
<template data-pop="g03-ibuprofene" data-k="g03-ibuprofene"><h3>Ibuprofène : méningite aseptique avec ou sans lupus</h3><p>FI décembre 2024 d’Ibuprofen-Mepha Teva : des cas de méningite aseptique sont rapportés. Lupus et collagénoses semblent prédisposer, mais des cas surviennent aussi sans ces maladies. L’ibuprofène peut masquer les symptômes d’une infection sous-jacente et retarder la reconnaissance de son aggravation.</p><p>Rechercher l’automédication et les prises intermittentes. En cas de suspicion, discuter retrait et alternative, documenter l’imputabilité et éviter une réexposition provocatrice. Aucun schéma d’AINS n’est proposé ici pour traiter G03.</p><p>Sources : <button class="w" data-k="g03-r12">[R12]</button></p></template>
<template data-pop="g03-suppression" data-k="g03-suppression"><h3>Valaciclovir suppressif : ce que l’essai permet de dire</h3><p>L’essai suédois de 2012 a randomisé 101 patients après méningite HSV-2 vers placebo ou valaciclovir 500 mg deux fois/j pendant un an. Aucune réduction significative des récidives n’a été montrée la première année. Le résumé conclut que ce schéma ne peut pas être recommandé en prévention générale des récidives méningées.</p><p>Il s’agit du schéma testé, pas d’une démonstration que toute stratégie antivirale est inefficace. Le traitement aigu, l’herpès génital et l’encéphalite sont des indications différentes. Le texte intégral n’a pas été lu ; le résumé indexé contient une incohérence dans un intervalle de confiance de deuxième année, qui n’est pas reproduit.</p><p>Sources : <button class="w" data-k="g03-r15">[R15]</button></p></template>
<template data-pop="pareto-g03-pharmaco" data-k="pareto-g03-pharmaco"><h3>Pharmacologie</h3><p>Traiter une indication précise. Pour le symptôme adulte, vérifier le comprimé 500 mg, les intervalles et les plafonds rénaux/hépatiques. Rechercher les médicaments suspects, ne pas provoquer de réexposition et ne pas convertir un résultat d’essai de suppression en règle sur tout antiviral.</p></template>

<template data-pop="g03-r1" data-k="g03-r1"><h3>[R1] SSI : addendum suisse à ESCMID, 28 décembre 2017</h3><p>L’addendum contextualise le lactate, la sécurité de la PL et les choix antibiotiques en Suisse. Le choix distingue notamment amoxicilline et pénicilline G ; la dexaméthasone adulte est arrêtée si la cause n’est pas bactérienne ou n’est pas pneumococcique.</p><p><b>Passage lu :</b> Deux pages : lactate, sécurité de PL, traitement empirique et corticothérapie. <b>Population :</b> Méningites bactériennes, adultes et enfants, selon rubriques. <b>Limites :</b> Addendum daté 2017 ; aucune version 2026 du guide dynamique SSI établie. Les particularités pédiatriques et les seuils de coagulation ne deviennent pas règles universelles.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode document.</p><p><a data-reference-source href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener noreferrer">Consulter la source — Swiss Society for Infectious Diseases</a></p></template>
<template data-pop="g03-r2" data-k="g03-r2"><h3>[R2] Syndrome méningé fébrile aux urgences, 2016</h3><p>Les signes cliniques sont insuffisants pour exclure une méningite ; une antibiothérapie préalable modifie le rendement et le profil du liquide. La PL est centrale, sans retarder le traitement si elle est différée.</p><p><b>Passage lu :</b> Narration clinique : urgence, clinique, PL, microbiologie, PCT et lactate. <b>Population :</b> Patients des urgences, méningites aiguës. <b>Limites :</b> Revue suisse ancienne ; pas protocole actuel exclusif. Tableaux illustrés non intégralement relus. Le chiffre américain cité dans son introduction ne constitue pas incidence suisse.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://www.revmed.ch/revue-medicale-suisse/2016/revue-medicale-suisse-526/syndrome-meninge-febrile-au-service-des-urgences-prise-en-charge" target="_blank" rel="noopener noreferrer">Consulter la source — Degraeve et al., Revue médicale suisse</a></p></template>
<template data-pop="g03-r3" data-k="g03-r3"><h3>[R3] Méningite chronique : étiologies et approche diagnostique, 2021</h3><p>Une inflammation persistant au-delà de quatre semaines diffère d’épisodes aigus séparés par récupération. Terrain immunitaire, expositions, examen systémique, IRM et analyses orientées du LCR organisent un bilan séquentiel ; une biopsie accessible extraneurale peut aider.</p><p><b>Passage lu :</b> Narration complète : cas, définition, clinique, bilan, PL répétées, biopsie, causes, discussion et conclusion. <b>Population :</b> Méningites chroniques ; observation suisse d’une patiente de 62 ans. <b>Limites :</b> Revue 2021 et cas clinique, non essai ni incidence nationale. Tableaux/images seulement légendés, non utilisés pour critères détaillés. Les propositions empiriques et rendements issus de petites séries ne sont pas des prescriptions universelles.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://www.revmed.ch/revue-medicale-suisse/2021/revue-medicale-suisse-748/meningite-chronique-etiologies-et-approche-diagnostique" target="_blank" rel="noopener noreferrer">Consulter la source — Ammann et al., Revue médicale suisse</a></p></template>
<template data-pop="g03-r4" data-k="g03-r4"><h3>[R4] WHO guidelines on meningitis diagnosis, treatment and care, 2025</h3><p>Pas d’imagerie systématique avant PL ; critères de risque précisés, sans retarder le traitement. Corticoïdes avec les premiers antibiotiques si suspicion bactérienne, arrêt si LCR non compatible. Dépistage auditif avant sortie ou dans les quatre semaines. Un second test formel est prévu après un premier dépistage avant sortie normal.</p><p><b>Passage lu :</b> Chapitre 3 : diagnostic A1–A4, admission B1, corticoïdes B3 et dépistage auditif C4. <b>Population :</b> Méningite aiguë communautaire, enfants de plus d’un mois et adultes. <b>Limites :</b> Guide mondial, adaptation suisse nécessaire ; plusieurs recommandations fortes reposent sur certitude faible ou très faible. Les chapitres de traitement étiologique spécialisés ne sont pas tous lus. Exception cryptococcose/VIH : PL avec pression d’ouverture malgré immunodépression selon contexte.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://www.ncbi.nlm.nih.gov/books/NBK614844/" target="_blank" rel="noopener noreferrer">Consulter la source — Organisation mondiale de la santé</a></p></template>
<template data-pop="g03-r5" data-k="g03-r5"><h3>[R5] German guidelines on acute bacterial meningitis in adults, 2023</h3><p>L’absence d’un signe cardinal n’exclut pas la maladie. Les profils du LCR se chevauchent ; PCR multiplex ne remplace pas Gram, culture et antibiogramme. Si PL différée, prélèvements sanguins puis traitement avant imagerie.</p><p><b>Passage lu :</b> Recommandations initiales, clinique, paramètres LCR, microbiologie, imagerie et complications. <b>Population :</b> Adultes, méningite bactérienne communautaire. <b>Limites :</b> Version allemande abrégée/traduite, non prescription suisse. Incohérence d’unité protéique entre narration et tableau évitée ; aucun seuil protéique isolé n’est employé pour exclure une bactérie.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener noreferrer">Consulter la source — DGN/AWMF, traduction publiée Klein et al.</a></p></template>
<template data-pop="g03-r6" data-k="g03-r6"><h3>[R6] DGN : Virale Meningoenzephalitis, version 7, 2025</h3><p>Une méningite virale simple ne comporte pas de déficit focal ni de trouble de conscience ; leur présence change le niveau d’urgence. Mollaret peut récidiver sur plusieurs années ; ses cellules ne sont pas pathognomoniques. Une forme simple reçoit un traitement symptomatique.</p><p><b>Passage lu :</b> Recommandations clés, classification 1.2 et Mollaret 3.2.6. <b>Population :</b> Syndromes viraux neurologiques, surtout adultes européens. <b>Limites :</b> Consensus S1 allemand, lecture ciblée ; pas preuve contrôlée de tout antiviral ni règle diagnostique internationale de Mollaret.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — Deutsche Gesellschaft für Neurologie</a></p></template>
<template data-pop="g03-r7" data-k="g03-r7"><h3>[R7] S1 guideline lumbar puncture and cerebrospinal fluid analysis, traduction 2020</h3><p>Associer sérum et LCR pour glucose et quotients ; acheminer rapidement, interpréter selon âge, site et méthode. Des bandes oligoclonales spécifiques du LCR soutiennent une réponse intrathécale sans en identifier la cause. Un profil peu cellulaire n’exclut pas une infection.</p><p><b>Passage lu :</b> Indications, contre-indications, préanalytique, pression, tableau 4, protéines, albumine, Ig et diagnostic infectieux. <b>Population :</b> Exploration neurologique par LCR, normes surtout adultes. <b>Limites :</b> Consensus S1 de 2019 traduit 2020. Normes européennes indicatives, à confronter au laboratoire ; seuils de coagulation variables entre sources et non érigés en prescription universelle.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7650145/" target="_blank" rel="noopener noreferrer">Consulter la source — DGN et DGLN, Tumani et al.</a></p></template>
<template data-pop="g03-r8" data-k="g03-r8"><h3>[R8] Mollaret au Danemark : cohorte nationale, 2024</h3><p>L’incidence estimée est 1,2/million d’adultes/an au Danemark ; le risque de progression après HSV-2 est 22 % (IC95 % 15–30). Les épisodes récidivent malgré une présentation souvent favorable ; les critères d’étude exigent au moins deux épisodes et une association documentée à HSV-2.</p><p><b>Passage lu :</b> Résumé, définition de cohorte, méthodes, résultats, tableaux 1–2, discussion et limites. <b>Population :</b> 47 adultes hospitalisés pour méningite récurrente associée à HSV-2, Danemark 2015–2020. <b>Limites :</b> Population hospitalière et épisodes antérieurs parfois rétrospectifs ; estimation non suisse, non tous G03. Le score fonctionnel peut manquer des troubles cognitifs fins. Critères d’étude, non critères universels.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11235955/" target="_blank" rel="noopener noreferrer">Consulter la source — Petersen et al., European Journal of Neurology</a></p></template>
<template data-pop="g03-r9" data-k="g03-r9"><h3>[R9] Méningite aseptique médicamenteuse : 329 cas français, 2019</h3><p>Les classes incluent IgIV, AINS et antimicrobiens. Le LCR peut être neutrophilique ou lymphocytaire ; l’arrêt du médicament suspect est central. Dans les dossiers détaillés, 44,8 % étaient dits purulents et 33 % lymphocytaires.</p><p><b>Passage lu :</b> Résumé, méthodes et définitions, analyse de 203 dossiers, évolution, discussion et limites. <b>Population :</b> Notifications françaises 1985–2017 ; 203 cas bien documentés, 282 médicaments suspects. <b>Limites :</b> Pharmacovigilance spontanée : sous-notification, biais de notoriété et protopathique, causalité non certaine et aucune incidence. La définition d’aseptique propre à cette série exclut les agents viraux détectés, contrairement à certains usages syndromiques.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6848896/" target="_blank" rel="noopener noreferrer">Consulter la source — Bihan et al., British Journal of Clinical Pharmacology</a></p></template>
<template data-pop="g03-r10" data-k="g03-r10"><h3>[R10] DAFALGAN comprimés 500 mg, FI septembre 2025</h3><p>La FI autorise 500–1000 mg par prise, intervalle adulte 4–8 h, maximum 4 g/j pour >40 kg ; elle réduit plafonds et/ou espace en insuffisance rénale et terrains hépatiques. Le surdosage provoque une toxicité hépatique.</p><p><b>Passage lu :</b> Composition, indications, dose, reins/foie, contre-indications, interactions, grossesse, pharmacodynamie et métabolisme. <b>Population :</b> Présentation comprimés autorisation 69266 ; adulte dans cette leçon. <b>Limites :</b> Aucune dose pédiatrique de cette page ni donnée SwissPedDose ajoutée ne sont transposées. Le plafond 4 g n’est pas un objectif ; durée minimale et réévaluation clinique, absence de durée fixe de traitement d’une méningite.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680692660022" target="_blank" rel="noopener noreferrer">Consulter la source — UPSA Switzerland, information professionnelle suisse via AmiKo</a></p></template>
<template data-pop="g03-r11" data-k="g03-r11"><h3>[R11] Privigen : FI juillet 2025</h3><p>Le syndrome débute habituellement dans les heures à deux jours ; LCR parfois fortement granulocytaire. Il faut exclure les autres causes ; arrêt associé à rémission habituelle en quelques jours. Forte dose ou débit élevé favorisent le risque.</p><p><b>Passage lu :</b> Mise en garde syndrome de méningite aseptique, effets indésirables, annonce ElViS et version. <b>Population :</b> Patients recevant des immunoglobulines intraveineuses. <b>Limites :</b> Pas critère permettant de conclure au seul délai ; aucune posologie d’IgIV prescrite pour G03. Le syndrome après perfusion reste une urgence diagnostique.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680583140015" target="_blank" rel="noopener noreferrer">Consulter la source — CSL Behring, information professionnelle suisse via AmiKo</a></p></template>
<template data-pop="g03-r12" data-k="g03-r12"><h3>[R12] Ibuprofen-Mepha Teva : FI décembre 2024</h3><p>Une méningite aseptique est rapportée, notamment en lupus/collagénose mais aussi sans ces maladies. Le médicament peut masquer les signes infectieux ; un effet nouveau ou grave suspect est à déclarer via ElViS.</p><p><b>Passage lu :</b> Mise en garde méningite aseptique, masquage infectieux, effets indésirables et déclaration. <b>Population :</b> Utilisateurs d’ibuprofène. <b>Limites :</b> Pas incidence mesurée par notification ; pas exclusivité du terrain lupique. Aucun schéma d’ibuprofène comme traitement de G03 n’est publié ici.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680491560011" target="_blank" rel="noopener noreferrer">Consulter la source — Mepha Pharma, information professionnelle suisse via AmiKo</a></p></template>
<template data-pop="g03-r13" data-k="g03-r13"><h3>[R13] CIM-10-GM 2024 : G03</h3><p>G03.0 non purulente, G03.1 chronique, G03.2 récurrente bénigne de Mollaret, G03.8 autres causes précisées, G03.9 non précisée. L’encéphalite et la myélite associées sortent vers G04 selon rubrique.</p><p><b>Passage lu :</b> Bloc G03 et exclusions voisines G04. <b>Population :</b> Classification allemande GM 2024. <b>Limites :</b> Source de définition du code, non diagnostic clinique ni preuve d’un codage de facturation suisse actuel ; l’étiologie établie peut imposer une rubrique spécifique.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener noreferrer">Consulter la source — BfArM</a></p></template>
<template data-pop="g03-r14" data-k="g03-r14"><h3>[R14] CEN : méningites et méningo-encéphalites, item 151</h3><p>Raideur, Kernig et Brudzinski traduisent une irritation sans identifier la cause. Le nourrisson peut avoir hypotonie et signes généraux ; l’adulte âgé des signes frustes. Les causes chroniques comprennent infections, inflammation et infiltration tumorale.</p><p><b>Passage lu :</b> Syndromes méningé/encéphalitique, âges extrêmes, causes chroniques, médicaments, inflammations et carcinose. <b>Population :</b> Enseignement clinique adulte et enfant. <b>Limites :</b> Page pédagogique sans date clinique de version assurée ; descriptions automatiques d’images non utilisées. Ne pas reprendre sa liste où Nocardia figure parmi les champignons : bactérie.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-24-item-151-meningites-meningo-encephalites-abces-cerebral-chez-ladulte-et-lenfant" target="_blank" rel="noopener noreferrer">Consulter la source — Collège des enseignants de neurologie, France</a></p></template>
<template data-pop="g03-r15" data-k="g03-r15"><h3>[R15] Essai randomisé valaciclovir suppressif après méningite HSV-2, 2012</h3><p>500 mg deux fois/j pendant un an n’a pas montré de prévention des récidives dans cet essai. Cette dose de suppression ne doit pas être recommandée de routine pour ce but.</p><p><b>Passage lu :</b> Résumé primaire : méthodes, résultat première année et conclusion. <b>Population :</b> 101 patients après méningite HSV-2 primaire ou récurrente. <b>Limites :</b> Résumé ciblé uniquement, pas texte intégral. L’intervalle de confiance du signal de deuxième année est manifestement incohérent dans le résumé indexé : non reproduit. Ce résultat ne démontre pas l’inefficacité de tout schéma ni ne prescrit le traitement aigu.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode abstract.</p><p><a data-reference-source href="https://pubmed.ncbi.nlm.nih.gov/22460966/" target="_blank" rel="noopener noreferrer">Consulter la source — Aurelius et al., essai multicentrique suédois</a></p></template>
<template data-pop="g03-r16" data-k="g03-r16"><h3>[R16] Gray Anatomy 1918, planche 1196 : enveloppes et sinus</h3><p>Dure-mère, arachnoïde, pie-mère et sinus sagittal supérieur sont distingués sur l’original. Des annotations françaises adjacentes relient enveloppes, LCR et raisonnement clinique.</p><p><b>Passage lu :</b> Description, auteur, provenance et notice de domaine public ; original affiché et inspecté. <b>Population :</b> Anatomie humaine normale historique. <b>Limites :</b> Original humain historique, pixels inchangés ; pas image d’inflammation ni preuve diagnostique. Notice relue pour G03, cache antérieur.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://commons.wikimedia.org/wiki/File:Gray1196.png" target="_blank" rel="noopener noreferrer">Consulter la source — Wikimedia Commons, Gray/Carter</a></p></template>
<template data-pop="g03-r17" data-k="g03-r17"><h3>[R17] Gray Anatomy 1918, planche 764 : voie motrice</h3><p>Le trajet cortical, capsulaire et corticospinal rappelle pourquoi un déficit moteur focal indique une atteinte dépassant une simple irritation méningée.</p><p><b>Passage lu :</b> Description, auteur, date, licence et original affiché/inspecté. <b>Population :</b> Voie motrice humaine normale simplifiée. <b>Limites :</b> Planche historique simplifiée, sans maladie ni procédure de PL représentée ; ne localise pas à elle seule une lésion. Pixels inchangés.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener noreferrer">Consulter la source — Wikimedia Commons, schéma historique modifié de Poirier, Gray/Carter</a></p></template>
<template data-pop="g03-r18" data-k="g03-r18"><h3>[R18] PROFILES 2017 : urgence céphalée sévère et méningisme</h3><p>La céphalée aiguë sévère et le méningisme constituent une situation de départ et d’urgence ; reconnaître, explorer et initier la prise en charge doit s’apprendre ensemble.</p><p><b>Passage lu :</b> EPA 6d et SSP 207, avec SSP 205 déficit neurologique aigu. <b>Population :</b> Formation médicale suisse. <b>Limites :</b> Référentiel 2017 ; rattachement pédagogique proposé pour G03, aucun crosswalk fédéral officiel CIM-10/SSP ni affirmation de version 2026.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://www.siwf.ch/files/pdf24/profiles_2017-broschuere.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — Joint Commission of Swiss Medical Schools, SIWF/ISFM</a></p></template>
