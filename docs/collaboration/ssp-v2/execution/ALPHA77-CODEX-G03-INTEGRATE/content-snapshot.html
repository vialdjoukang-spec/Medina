<template id="ch-G03"><div class="chap"><div class="chap-head"><div class="code">G03 · N-05-Neurologie</div><h1>G03 — Méningite due à des causes autres et non précisées</h1><span class="status">Auto-relecture IA de l’auteur · Aucune validation médicale humaine attestée</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><div class="chap-body" data-semiology-clinical="G03"><section class="ilot" id="g03-intro"><h2>Un syndrome méningé impose d’abord une décision clinique</h2><p>Une céphalée inhabituelle accompagnée de fièvre, de photophobie ou de raideur de nuque peut annoncer une méningite. La première décision porte sur la gravité et sur la possibilité d’une ponction lombaire rapide. Le diagnostic causal vient ensuite : une infection bactérienne reste possible tant que le bilan et l’évolution ne permettent pas de l’écarter. Un liquide clair ou une culture négative après antibiotiques ne suffisent pas à rassurer.</p><p>Cette leçon étudie les méningites dues à d’autres causes ou non encore précisées, notamment les formes non purulentes, chroniques, récurrentes et médicamenteuses. Elle apprend à passer du syndrome à une cause probable, puis à réviser le diagnostic. Le code G03 décrit une catégorie administrative ; il ne regroupe pas automatiquement toutes les méningites virales, toutes les inflammations non infectieuses ou toutes les atteintes encéphaliques.</p><div class="key"><b>À retenir.</b> Reconnaître le syndrome, rechercher l’urgence, prélever sans retard dangereux, traiter une cause grave probable puis réévaluer l’étiquette diagnostique.</div><p>Sources : <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r13">[R13]</button> · <button class="w" data-k="g03-r18">[R18]</button></p></section><section class="ilot" id="g03-definitions"><h2>Définir l’inflammation, sa durée et son territoire</h2><p>Une méningite est une inflammation des enveloppes du système nerveux central, généralement des leptoméninges et du compartiment contenant le liquide céphalorachidien. Le syndrome méningé décrit des symptômes et des signes d’irritation ; il ne démontre pas à lui seul une inflammation du liquide ni sa cause. Un méningisme peut reproduire certains signes sans méningite démontrée. Une atteinte de la conscience, du comportement ou une focalisation fait rechercher une atteinte encéphalique ou une complication.</p><p><button class="w" data-k="g03-aseptique">« Aseptique » : préciser ce que le mot signifie</button></p><table class="t"><thead><tr><th>Temporalité</th><th>Description utile</th><th>Conséquence</th></tr></thead><tbody><tr><td>Aiguë</td><td>Installation en heures ou quelques jours.</td><td>Écarter en priorité une infection bactérienne ou une autre urgence.</td></tr><tr><td>Chronique</td><td>Inflammation persistante au-delà de quatre semaines dans la revue suisse.</td><td>Bilan séquentiel infectieux, inflammatoire et tumoral ; ne pas attendre ce délai pour explorer un patient qui s’aggrave.</td></tr><tr><td>Récurrente</td><td>Épisodes distincts séparés par des intervalles de récupération.</td><td>Rechercher une cause documentable à chaque nouvel épisode ; Mollaret est une possibilité, pas une dispense de bilan.</td></tr></tbody></table><p>La durée et le territoire sont deux axes distincts. Une pachyméningite concerne surtout la dure-mère ; une leptoméningite concerne arachnoïde et pie-mère. Un rehaussement à l’IRM décrit une anomalie anatomique et ne détermine pas à lui seul le mécanisme infectieux, tumoral ou inflammatoire.</p><div class="key"><b>À retenir.</b> Distinguer syndrome, inflammation objectivée, temporalité et étiologie ; aucun de ces niveaux ne remplace les autres.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r6">[R6]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r13">[R13]</button> · <button class="w" data-k="g03-r14">[R14]</button> · <button class="w" data-k="g03-r16">[R16]</button></p></section><section class="ilot" id="g03-epidemio"><h2>Épidémiologie : attribuer chaque chiffre à sa population</h2><p>Les méningites chroniques sont rares et leur incidence exacte reste indéterminée dans la revue suisse de 2021. Les lectures réalisées ne fournissent pas d’incidence nationale actuelle propre à l’ensemble G03. Les séries de méningites virales, de récidives HSV-2 ou de pharmacovigilance décrivent des populations différentes ; leurs fréquences ne doivent pas être additionnées.</p><table class="t"><thead><tr><th>Donnée lue</th><th>Population et mesure</th><th>Limite</th></tr></thead><tbody><tr><td>1,2 cas/million d’adultes/an</td><td>Méningite lymphocytaire récurrente associée à HSV-2, cohorte nationale danoise 2015–2020.</td><td>Estimation fondée sur 28 cas incidents hospitalisés ; pas incidence suisse ni de tout G03.</td></tr><tr><td>22 % ; IC95 % 15–30 %</td><td>Risque estimé de progression vers une forme récurrente après méningite HSV-2 dans cette cohorte.</td><td>Critères d’étude et suivi propres au dispositif danois.</td></tr><tr><td>329 notifications ; 203 dossiers détaillés</td><td>Pharmacovigilance française, 1985–2017.</td><td>Ni dénominateur de personnes exposées ni incidence ; sous-notification et biais de déclaration.</td></tr></tbody></table><p>Dans une consultation suisse, la probabilité dépend davantage du terrain, des médicaments, des voyages, de l’immunité et du contexte épidémique que d’un pourcentage général non applicable. Une donnée étrangère reste utile lorsqu’elle est nommée et que son incertitude est conservée.</p><div class="key"><b>À retenir.</b> Un taux danois de récidives et une proportion de notifications françaises ne deviennent pas une incidence suisse.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r8">[R8]</button> · <button class="w" data-k="g03-r9">[R9]</button></p></section><section class="ilot" id="g03-causes"><h2>Organiser les causes par mécanisme et par contexte</h2><p>Les méningites à liquide clair ou lymphocytaire peuvent être infectieuses. Les virus sont fréquents dans les syndromes aigus, mais une tuberculose, une cryptococcose, une neuroborréliose ou une syphilis peuvent produire une évolution plus lente. Une infection bactérienne prétraitée reste un diagnostic important. Les causes non infectieuses comprennent les médicaments, les maladies inflammatoires systémiques et l’infiltration tumorale des méninges.</p><table class="t"><thead><tr><th>Contexte</th><th>Hypothèses orientées</th><th>Information à rechercher</th></tr></thead><tbody><tr><td>Immunodépression, exposition tuberculeuse ou séjour en zone d’endémie</td><td>Tuberculose, cryptococcose et autres agents adaptés au terrain.</td><td>Type d’immunosuppression, VIH, traitement et expositions ; examens microbiologiques ciblés.</td></tr><tr><td>Douleurs radiculaires, paralysie faciale et exposition aux tiques</td><td>Neuroborréliose parmi les possibilités.</td><td>Syndrome compatible et analyse conjointe sang/LCR ; une sérologie sanguine positive isolée ne suffit pas.</td></tr><tr><td>Aphtose, uvéite, atteinte pulmonaire, cutanée ou articulaire</td><td>Behçet, sarcoïdose, lupus et autres inflammations systémiques.</td><td>Examen général et éventuel site de prélèvement extraneural.</td></tr><tr><td>Cancer ou hémopathie, atteinte de plusieurs nerfs crâniens ou racines</td><td>Infiltration leptoméningée.</td><td>Imagerie et cytologie/cytométrie choisies selon l’hypothèse.</td></tr><tr><td>Nouvelle prise ou perfusion de médicament</td><td>Méningite médicamenteuse possible.</td><td>Chronologie complète ; rechercher aussi les causes qui ont motivé le médicament.</td></tr></tbody></table><p>L’examen doit préserver les hypothèses concurrentes. Par exemple, un AINS pris pour une céphalée débutante peut sembler précéder une méningite alors qu’il répondait déjà à ses premiers symptômes : c’est un biais protopathique. Une relation temporelle mérite une investigation et ne prouve pas une causalité.</p><div class="key"><b>À retenir.</b> Le terrain sélectionne les recherches ; il n’autorise pas à exclure les autres causes graves.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r9">[R9]</button> · <button class="w" data-k="g03-r11">[R11]</button> · <button class="w" data-k="g03-r12">[R12]</button> · <button class="w" data-k="g03-r14">[R14]</button></p></section><section class="ilot" id="g03-anamnese"><h2>Analyser l’histoire de la plainte</h2><p>Décrire le début, la vitesse d’installation, l’intensité et le caractère inhabituel de la céphalée. Rechercher vomissements, lumière ou bruit pénibles, fièvre ressentie ou mesurée et douleur à la mobilisation du cou. Préciser l’état fonctionnel entre les épisodes : récupération complète, symptômes résiduels ou dégradation continue. Une céphalée explosive fait aussi rechercher une hémorragie sous-arachnoïdienne ; une évolution lente avec troubles cognitifs ou marche instable peut révéler une forme chronique sans triade classique.</p><p>Interroger directement le patient et, si la vigilance ou la mémoire le justifie, son entourage. Noter les antibiotiques déjà reçus et leur heure, les voyages, contacts infectieux, exposition aux tiques ou animaux, pratiques sexuelles pertinentes, immunosuppression, cancer et manifestations systémiques. Les informations sensibles sont recueillies avec discrétion et selon leur utilité clinique.</p><p><button class="w" data-k="g03-medic">Reconstituer une chronologie médicamenteuse exploitable</button></p><div class="key"><b>À retenir.</b> La chronologie distingue persistance, récidive et effet médicamenteux possible ; elle doit rester vérifiable et être réévaluée.</div><p>Sources : <button class="w" data-k="g03-r2">[R2]</button> · <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r8">[R8]</button> · <button class="w" data-k="g03-r9">[R9]</button> · <button class="w" data-k="g03-r14">[R14]</button></p></section><section class="ilot" id="g03-examen"><h2>Examiner le syndrome et rechercher ce qui le dépasse</h2><p>Évaluer d’abord respiration, circulation, température, perfusion et vigilance. Quantifier l’état de conscience avec l’échelle de Glasgow lorsqu’elle est applicable ; observer langage, attention, comportement et capacité à suivre les consignes. Rechercher déficit moteur ou sensitif, asymétrie, atteinte des nerfs crâniens et crises. Un déficit focal n’appartient pas au tableau attendu d’une simple méningite virale ; il modifie le bilan et l’urgence.</p><p><button class="w" data-k="g03-meningisme">Raideur, Kernig et Brudzinski : technique et limite</button></p><p>Examiner la peau, les muqueuses et les sites d’infection possibles ; un purpura rapidement extensif ou un état de choc impose une prise en charge urgente. Dans les formes chroniques, rechercher signes oculaires, pulmonaires, articulaires et cutanés. Une plainte visuelle justifie un examen ophtalmologique adapté. Le fond d’œil peut contribuer au bilan, mais l’absence d’œdème papillaire ne suffit pas à garantir la sécurité d’une PL.</p><div class="key"><b>À retenir.</b> Une sémiologie méningée négative ne clôt pas le raisonnement ; une focalisation ou une altération de vigilance augmente l’urgence.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r14">[R14]</button></p></section><section class="ilot" id="g03-urgent"><h2>Décider immédiatement : ponction rapide ou report motivé</h2><p>Toute suspicion de méningite aiguë nécessite une évaluation hospitalière urgente. Prélever les hémocultures et les examens sanguins utiles, puis réaliser rapidement la PL lorsqu’elle est sûre. Une imagerie préalable systématique peut retarder les soins sans bénéfice démontré. En présence d’un risque de lésion expansive ou d’engagement, l’imagerie précède la PL ; elle ne doit jamais faire attendre le traitement d’une infection bactérienne probable.</p><p><button class="w" data-k="g03-ct">OMS 2025 : quand imager avant la PL ?</button></p><table class="t"><thead><tr><th>Situation</th><th>Action initiale</th></tr></thead><tbody><tr><td>PL immédiatement réalisable et sûre</td><td>Examen clinique, hémocultures et prélèvements ; PL rapide, puis traitement indiqué sans délai évitable.</td></tr><tr><td>PL différée pour imagerie ou autre risque</td><td>Hémocultures si obtenues sans retard, traitement empirique indiqué et stabilisation avant le scanner ; PL dès qu’elle devient sûre.</td></tr><tr><td>Purpura extensif, choc ou détresse neurologique</td><td>Réanimation et traitement urgents ; la séquence des examens s’adapte à la stabilité.</td></tr></tbody></table><p>Un scanner rassurant n’annule pas une instabilité ou une anomalie de coagulation et ne remplace pas la réévaluation clinique. Le motif du report et l’heure des traitements doivent être documentés.</p><div class="key"><b>À retenir.</b> Ne pas choisir entre diagnostic et soin : prélever vite lorsque possible, traiter sans attendre si la PL est différée.</div><p>Sources : <button class="w" data-k="g03-r1">[R1]</button> · <button class="w" data-k="g03-r2">[R2]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r7">[R7]</button></p></section><section class="ilot" id="g03-positive"><h2>Établir le diagnostic puis en mesurer la solidité</h2><p>Le diagnostic associe un syndrome compatible et une inflammation du LCR, puis la recherche d’une étiologie. Les leucocytes, leur formule, le glucose associé au sérum, les protéines et le lactate orientent ; aucun profil ne sépare parfaitement les causes. Une inflammation débutante, une immunodépression ou un prétraitement peuvent modifier la présentation attendue.</p><p>Une culture, une PCR ou un autre test positif n’a de sens qu’avec le syndrome, le prélèvement et les limites de la méthode. Inversement, une PCR multiplex négative ne recherche pas tous les agents et ne remplace pas les cultures. Si la probabilité clinique reste élevée, discuter la répétition ou l’élargissement du bilan avec le laboratoire et les spécialistes.</p><table class="t"><thead><tr><th>Étiquette envisagée</th><th>Éléments qui la soutiennent</th><th>Ce qui ne suffit pas</th></tr></thead><tbody><tr><td>Chronique</td><td>Symptômes et inflammation persistants au-delà de quatre semaines.</td><td>Une céphalée prolongée sans preuve d’inflammation.</td></tr><tr><td>Mollaret / forme récurrente lymphocytaire</td><td>Épisodes séparés par récupération, LCR inflammatoire et documentation étiologique adaptée.</td><td>Un ancien diagnostic rapporté ou des cellules de Mollaret seules.</td></tr><tr><td>Médicamenteuse</td><td>Exclusion raisonnée des autres causes, chronologie et évolution après retrait compatibles.</td><td>Culture stérile, association temporelle isolée ou terrain lupique seul.</td></tr><tr><td>Inflammatoire systémique</td><td>Syndrome compatible, arguments systémiques et investigations ciblées, parfois tissu.</td><td>Un autoanticorps isolé ou une amélioration sous corticoïde.</td></tr></tbody></table><p>Les définitions de recherche ne sont pas des critères universels. La cohorte danoise exigeait au moins deux épisodes et un lien documenté avec HSV-2 ; d’autres études utilisent une définition différente. L’absence de critères internationaux uniques doit être dite, sans empêcher une démarche clinique structurée.</p><div class="key"><b>À retenir.</b> Exprimer le degré de certitude : syndrome établi, cause probable, cause documentée ou cause encore indéterminée.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r8">[R8]</button> · <button class="w" data-k="g03-r9">[R9]</button></p></section>

<section class="ilot" id="g03-mollaret"><h2>Méningite récurrente de Mollaret : reconnaître et réévaluer</h2><p><button class="w" data-k="g03-mollaret">Mollaret : récidives et lien avec HSV-2</button></p><p>Chaque nouvel épisode doit être évalué selon sa gravité et son contexte actuel. Un changement de présentation, un déficit focal, une altération de vigilance ou une immunodépression impose de rouvrir le diagnostic. Le mot « bénigne » décrit une évolution souvent favorable ; il ne dispense ni de prise en charge antalgique ni de recherche d’une autre cause.</p><p>La décision d’un antiviral lors d’une méningite HSV-2 se discute avec les spécialistes selon la sévérité, le terrain et les recommandations applicables. Elle ne doit pas être confondue avec la prise en charge urgente d’une encéphalite herpétique. Une suppression par valaciclovir 500 mg deux fois par jour pendant un an n’a pas montré de réduction significative des récidives la première année dans un essai suédois ; ce résultat ne démontre pas l’inefficacité de tout schéma antiviral.</p><div class="key"><b>À retenir.</b> Récidive connue ne signifie pas diagnostic acquis pour toujours ; rechercher ce qui a changé.</div><p>Sources : <button class="w" data-k="g03-r6">[R6]</button> · <button class="w" data-k="g03-r8">[R8]</button> · <button class="w" data-k="g03-r15">[R15]</button></p></section><section class="ilot" id="g03-chronique"><h2>Méningite chronique : construire un bilan séquentiel</h2><p>Une évolution insidieuse peut associer céphalées modérées, troubles cognitifs, instabilité de marche, atteinte de nerfs crâniens ou radiculalgies, sans fièvre ni raideur marquée. La revue suisse privilégie une anamnèse précise, un examen neurologique et général complet, une évaluation immunitaire et des investigations orientées. La recherche d’une cause conditionne le traitement et le pronostic.</p><p><button class="w" data-k="g03-chronique">PL répétées et biopsie : pourquoi et dans quelles limites ?</button></p><p>Une sérologie positive pour Borrelia isolée n’établit pas une neuroborréliose ; il faut un syndrome compatible et une analyse contextualisée du LCR et du sérum. Un test tuberculeux sanguin négatif n’exclut pas une méningite tuberculeuse. Une cytologie négative unique n’élimine pas toute infiltration tumorale. Le bilan est ajusté aux probabilités, sans multiplier des examens sans question clinique.</p><p>Une corticothérapie empirique peut masquer ou aggraver une infection et compliquer certaines investigations. Elle n’est pas un traitement par défaut d’une inflammation de cause inconnue. Dans des situations sélectionnées après bilan, une stratégie d’observation ou un traitement d’épreuve relève d’une discussion spécialisée avec suivi clinique et biologique précis.</p><div class="key"><b>À retenir.</b> L’étiquette idiopathique se construit après un bilan adapté et reste révisable ; elle ne signifie pas « cause impossible à rechercher ».</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r14">[R14]</button></p></section><section class="ilot" id="g03-diam"><h2>Méningite médicamenteuse : retirer une cause possible avec prudence</h2><p>Les médicaments peuvent provoquer une irritation directe après administration intrathécale ou une réaction inflammatoire après administration systémique. IgIV, AINS et plusieurs antimicrobiens sont des classes signalées. Le LCR peut être très neutrophilique ; il ne faut donc pas confondre aspect puriforme et preuve bactérienne, ni culture stérile et preuve médicamenteuse.</p><p>En concertation avec l’équipe prescriptrice, interrompre le médicament suspect lorsque cela est possible et prévoir une alternative si son indication reste nécessaire. Documenter le produit, le lot pour une perfusion biologique, la chronologie et l’évolution. Le traitement initial d’une infection grave possible ne doit pas être retardé par cette hypothèse.</p><table class="t"><thead><tr><th>Produit exact relu</th><th>Signal de la FI suisse</th><th>Conséquence</th></tr></thead><tbody><tr><td>Privigen, juillet 2025</td><td>Début habituel dans les heures à deux jours ; parfois pléiocytose granulocytaire importante.</td><td>Bilan neurologique et LCR pour exclure d’autres causes ; discussion de l’arrêt.</td></tr><tr><td>Ibuprofen-Mepha Teva, décembre 2024</td><td>Méningite aseptique rapportée, avec ou sans lupus/collagénose.</td><td>Rechercher aussi l’automédication ; pas d’exclusion sur absence de maladie systémique.</td></tr></tbody></table><p>L’amélioration après arrêt renforce l’imputabilité sans constituer une preuve absolue. Éviter une réexposition provocatrice. Transmettre clairement la suspicion au patient et aux soignants et déclarer en Suisse les effets nouveaux ou graves suspectés via ElViS, conformément aux informations professionnelles. Ne pas transformer sans analyse toute suspicion en allergie certaine à une classe entière.</p><div class="key"><b>À retenir.</b> L’hypothèse médicamenteuse exige une exclusion raisonnée et une traçabilité ; elle ne remplace pas la prise en charge initiale d’une urgence infectieuse.</div><p>Sources : <button class="w" data-k="g03-r9">[R9]</button> · <button class="w" data-k="g03-r11">[R11]</button> · <button class="w" data-k="g03-r12">[R12]</button></p></section><section class="ilot" id="g03-traitement"><h2>Traiter selon la gravité et la cause, puis désescalader</h2><p>La prise en charge initiale corrige les défaillances respiratoires et circulatoires, surveille vigilance, crises et complications, et administre rapidement les traitements empiriques indiqués. En cas de suspicion bactérienne, suivre le protocole hospitalier suisse adapté au terrain et à l’écologie locale. L’addendum SSI de 2017 renseigne les particularités helvétiques, mais ne remplace pas la vérification du protocole courant.</p><p>Les corticoïdes adjoints sont liés à la suspicion de méningite bactérienne, non au code G03. L’OMS 2025 recommande leur initiation avec les premiers antibiotiques dans les conditions prévues, puis leur arrêt si le LCR n’est pas compatible avec une cause bactérienne. Une prescription empirique doit donc être réexaminée dès les premiers résultats. Les causes tuberculeuses et les inflammations systémiques nécessitent leurs stratégies propres.</p><p>Après exclusion suffisante des causes graves et devant une méningite virale simple, les soins sont principalement symptomatiques : antalgie, correction d’une déshydratation et surveillance adaptée. Une sortie ne repose pas sur un liquide clair seul ; elle dépend de l’état neurologique et général, du diagnostic, du terrain, de la capacité à s’hydrater et des possibilités de réévaluation. Les causes documentées suivent leur traitement spécialisé, sans schéma universel de « traitement de G03 ».</p><div class="key"><b>À retenir.</b> Le traitement empirique est une décision temporaire et réévaluée ; la désescalade se fonde sur le faisceau clinique, biologique et microbiologique.</div><p>Sources : <button class="w" data-k="g03-r1">[R1]</button> · <button class="w" data-k="g03-r2">[R2]</button> · <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r6">[R6]</button> · <button class="w" data-k="g03-r10">[R10]</button></p></section><section class="ilot" id="g03-suivi"><h2>Suivre le retentissement et prévenir les récidives évitables</h2><p>Avant la sortie, expliquer les résultats acquis et ceux encore attendus, fixer le rendez-vous et transmettre les signes qui imposent une réévaluation : nouvelle confusion, déficit, crise, aggravation des céphalées, fièvre persistante, vomissements empêchant l’hydratation ou nouvelle dégradation générale. Rechercher fatigue, mémoire, attention, équilibre et retentissement sur les activités ; une évolution dite favorable ne garantit pas l’absence de séquelles fines.</p><p>L’OMS 2025 recommande un dépistage audiologique formel avant la sortie après une méningite aiguë de toute cause ; s’il n’est pas possible, le prévoir dans les quatre semaines. Un déficit auditif appelle une orientation rapide. Même si le dépistage réalisé avant la sortie est normal, l’OMS prévoit un second test audiologique formel, car une baisse auditive peut apparaître plus tard ; son organisation relève du suivi adapté. La force de cette recommandation repose notamment sur la gravité potentielle et sur des données indirectes ; elle n’est pas présentée comme un essai suisse spécifique à G03.</p><p>La prévention dépend de la cause : éviter le médicament suspect après analyse, corriger une brèche ou un facteur identifié lorsque pertinent, appliquer les vaccinations et mesures de santé publique indiquées par un agent précis. Il n’existe ni vaccin ni chimioprophylaxie des contacts « contre G03 » en général. Une récidive HSV-2 ne justifie pas automatiquement une suppression antivirale chronique.</p><div class="key"><b>À retenir.</b> Organiser le suivi avant la sortie et adapter la prévention à l’étiologie ; ne pas appliquer à tout G03 les mesures d’un méningocoque documenté.</div><p>Sources : <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r8">[R8]</button> · <button class="w" data-k="g03-r9">[R9]</button> · <button class="w" data-k="g03-r11">[R11]</button> · <button class="w" data-k="g03-r12">[R12]</button> · <button class="w" data-k="g03-r15">[R15]</button></p></section><section class="ilot" id="g03-populations"><h2>Adapter le raisonnement aux situations particulières</h2><p>Chez le nourrisson, une hypotonie, une irritabilité, une mauvaise alimentation ou une somnolence peuvent remplacer la raideur de nuque. Chez la personne âgée, les signes infectieux peuvent être discrets et les troubles cognitifs ou focaux dominer. Les recommandations pédiatriques ne se déduisent pas de doses adultes ; l’OMS 2025 citée ici concerne les enfants de plus d’un mois et les adultes, pas la prise en charge néonatale complète.</p><p>L’immunodépression élargit le spectre infectieux et peut atténuer la réaction du LCR. Le type de déficit immunitaire importe davantage qu’une étiquette globale. La grossesse, une insuffisance rénale ou hépatique et les interactions médicamenteuses modifient les prescriptions ; le produit exact et son information suisse doivent être vérifiés. Le seul schéma symptomatique chiffré de cette leçon est limité à l’adulte et accompagné de ses adaptations.</p><div class="key"><b>À retenir.</b> Un examen peu bruyant ou un LCR peu inflammatoire peut tromper dans les terrains fragiles ; ajuster le seuil de vigilance et le bilan.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r10">[R10]</button> · <button class="w" data-k="g03-r14">[R14]</button></p></section><section class="ilot" id="g03-codage"><h2>G03 : utiliser le code après le diagnostic clinique</h2><p>La CIM-10-GM 2024 consultée inclut dans G03 des méningites, arachnoïdites, leptoméningites et pachyméningites dues à d’autres causes ou non précisées. Elle distingue les formes ci-dessous. Le choix final dépend des informations disponibles, des exclusions et de l’étiologie établie ; ce tableau n’est pas une règle suisse actuelle de facturation.</p><table class="t"><thead><tr><th>Code</th><th>Libellé ou inclusion du référentiel consulté</th></tr></thead><tbody><tr><td>G03.0</td><td>Méningite non purulente, notamment abactérienne.</td></tr><tr><td>G03.1</td><td>Méningite chronique.</td></tr><tr><td>G03.2</td><td>Méningite récurrente bénigne [Mollaret].</td></tr><tr><td>G03.8</td><td>Méningite due à d’autres causes précisées.</td></tr><tr><td>G03.9</td><td>Méningite sans précision ; notamment arachnoïdite spinale non précisée.</td></tr></tbody></table><p>L’association à une encéphalite ou une myélite relève des exclusions vers G04 dans cette rubrique. Une cause virale ou une maladie classée ailleurs peut imposer une autre catégorie. « Non purulente » est un libellé de classification : on ne code pas à partir de la seule transparence du tube.</p><button class="pareto-btn ui" data-k="pareto-g03-clinique">▲ Loi de Pareto — Raisonnement clinique</button><p>Sources : <button class="w" data-k="g03-r13">[R13]</button></p></section><section class="ilot" id="g03-cas"><h2>Quatre décisions à exercer</h2><div class="quiz ui" id="g03-q1"><p><b>Cas 1.</b> Un adulte fébrile présente une confusion sévère, une faiblesse focale et une suspicion de méningite. La PL doit attendre une imagerie. Quelle séquence convient ?</p><button data-ok="0">Attendre scanner puis PL avant tout traitement.</button><button data-ok="1">Prélever rapidement le sang, stabiliser et traiter l’infection probable avant l’imagerie.</button><p class="fb" hidden>La PL différée ne doit pas retarder le traitement indiqué ; le déficit et la vigilance imposent un bilan urgent.</p></div><div class="quiz ui" id="g03-q2"><p><b>Cas 2.</b> Un liquide clair contient surtout des lymphocytes ; le patient a reçu un antibiotique avant le prélèvement. Peut-on exclure une bactérie ?</p><button data-ok="0">Oui, le liquide clair est discriminant.</button><button data-ok="1">Non, prétraitement et chevauchement des profils imposent une interprétation globale.</button><p class="fb" hidden>Aspect, formule et culture isolés ne suffisent pas ; intégrer le contexte et les recherches microbiologiques.</p></div><div class="quiz ui" id="g03-q3"><p><b>Cas 3.</b> Des céphalées et une raideur débutent le lendemain d’une perfusion de Privigen. Quelle conclusion est justifiée ?</p><button data-ok="0">La FI prouve que la perfusion est la cause ; aucun autre bilan.</button><button data-ok="1">Le délai est compatible avec un effet suspect, mais une méningite d’autre cause doit être recherchée.</button><p class="fb" hidden>La FI décrit cette fenêtre habituelle et demande une évaluation neurologique avec analyse du LCR ; temporalité n’est pas causalité certaine.</p></div><div class="quiz ui" id="g03-q4"><p><b>Cas 4.</b> Des troubles cognitifs et une marche instable évoluent depuis plusieurs mois, avec inflammation du LCR et première microbiologie négative. Quelle conduite ?</p><button data-ok="0">Conclure immédiatement à une forme idiopathique et prescrire un corticoïde.</button><button data-ok="1">Organiser un bilan chronique séquentiel selon terrain, IRM, examens orientés et éventuels nouveaux prélèvements.</button><p class="fb" hidden>Les causes infectieuses, tumorales et inflammatoires sont multiples ; les tests négatifs uniques et une triade absente ne clôturent pas le bilan.</p></div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r9">[R9]</button> · <button class="w" data-k="g03-r11">[R11]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="g03-e-prelev"><h2>Ponction lombaire : préparer un prélèvement interprétable</h2><p>Vérifier indication, consentement adapté à la situation, stabilité, risque hémorragique, médicaments et conditions locales. La technique est réalisée par une équipe formée selon le protocole, avec une aiguille atraumatique lorsque appropriée. Noter l’heure, les antibiotiques et autres traitements déjà administrés. Si une pression d’ouverture est nécessaire, la mesurer avant retrait significatif de liquide, en position latérale et dans les conditions techniques requises.</p><p>Prélever le glucose sanguin à proximité immédiate de la PL pour interpréter le rapport LCR/sérum ; coordonner également les prélèvements appariés destinés aux quotients protéiques et immunologiques. Organiser avec le laboratoire répartition des tubes, volumes et délai de transport. La recommandation européenne insiste sur l’acheminement rapide, souvent dans les deux heures pour l’analyse de base ; les exigences d’un examen spécialisé peuvent différer.</p><p><button class="w" data-k="g03-lcr">Lire ensemble cellules, glucose, protéines et lactate</button></p><div class="key"><b>À retenir.</b> Un résultat est lié à ses conditions de prélèvement ; transmettre le contexte au laboratoire améliore sa valeur clinique.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r7">[R7]</button></p></section><section class="ilot" id="g03-e-profils"><h2>Profils du LCR : des orientations qui se chevauchent</h2><p>Le tableau compare des tendances, non des critères suffisants. Une méningite bactérienne peut avoir moins de cellules que prévu et une méningite virale initiale davantage de neutrophiles. Dans la série médicamenteuse française, les profils neutrophiliques étaient fréquents. Une discordance avec le tableau doit rouvrir le raisonnement, pas être effacée.</p><table class="t"><thead><tr><th>Profil</th><th>Cellules et biochimie souvent observées</th><th>Prudence</th></tr></thead><tbody><tr><td>Bactérien aigu</td><td>Souvent neutrophiles, protéines et lactate augmentés, glucose abaissé.</td><td>Profil atypique ou peu cellulaire possible ; traiter selon probabilité et gravité.</td></tr><tr><td>Viral simple</td><td>Souvent lymphocytes, glucose conservé, protéines modérément augmentées.</td><td>Neutrophiles possibles au début ; le profil ne désigne pas un virus précis.</td></tr><tr><td>Tuberculeux / fongique</td><td>Souvent inflammation subaiguë, protéines augmentées, glucose abaissé.</td><td>Tests ciblés et contexte immunitaire nécessaires ; test négatif unique parfois insuffisant.</td></tr><tr><td>Médicamenteux</td><td>Lymphocytes, neutrophiles ou mélange ; protéines parfois élevées.</td><td>Aucun profil spécifique ; diagnostic d’exclusion et d’imputabilité.</td></tr><tr><td>Tumoral / inflammatoire</td><td>Variations des cellules, protéines et glucose selon la cause.</td><td>Cytologie, cytométrie ou immunologie répondent à une hypothèse précise.</td></tr></tbody></table><p>Les seuils de lactate diffèrent selon les références et les conditions : SSI 2017 évoque une forte spécificité à partir de 4 mmol/l, tandis que d’autres recommandations discutent environ 3,5 mmol/l. Cette variation et le prétraitement interdisent d’en faire une barrière universelle excluant une bactérie. La procalcitonine sanguine peut aider, mais elle ne doit ni retarder la PL ni décider seule de la présence ou de l’absence d’une infection.</p><div class="key"><b>À retenir.</b> Les tendances guident la recherche d’un agent ; elles ne remplacent ni microbiologie ni surveillance.</div><p>Sources : <button class="w" data-k="g03-r1">[R1]</button> · <button class="w" data-k="g03-r2">[R2]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r9">[R9]</button></p></section><section class="ilot" id="g03-e-micro"><h2>Microbiologie et immunologie : choisir la bonne question</h2><p>Demander Gram, cultures et tests moléculaires selon le syndrome et le contexte. Le panel multiplex accélère la recherche de certaines cibles mais laisse hors champ des agents et ne fournit pas toujours l’antibiogramme. Le délai de maladie, le traitement préalable et la qualité de l’échantillon influencent sensibilité et interprétation. Une PCR négative n’autorise pas une conclusion générale « absence d’infection ».</p><p>Dans les formes chroniques, discuter recherches mycobactériennes et fongiques, antigènes, sérologies appariées ou indices de synthèse intrathécale selon les hypothèses. La présence d’anticorps dans le LCR peut résulter d’un passage depuis le sang ; les quotients et le prélèvement sanguin associé aident à distinguer cette situation d’une production locale. Une bande oligoclonale n’identifie pas à elle seule une maladie.</p><p>Si une infiltration tumorale est suspectée, coordonner cytologie et éventuellement cytométrie avec un acheminement et un volume adaptés. Les analyses spécialisées et leur répétition sont planifiées avec le laboratoire. Un examen non demandé, mal conservé ou hors cible ne devient pas négatif par défaut.</p><div class="key"><b>À retenir.</b> Nommer ce que le test recherche, ce qu’il manque et dans quelles conditions son résultat est fiable.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r7">[R7]</button></p></section><section class="ilot" id="g03-e-imagerie"><h2>Imagerie et examens de deuxième intention</h2><p>La tomodensitométrie urgente recherche surtout les anomalies qui modifient la sécurité de la PL et la prise en charge immédiate. L’IRM décrit mieux les méninges, le parenchyme, les nerfs crâniens et certaines complications. Un rehaussement méningé reflète une anomalie de barrière et de tissu ; il n’est pas une signature étiologique. L’IRM peut aussi être normale dans une méningite.</p><p>Selon le tableau, rechercher hydrocéphalie, ventriculite, infarctus, thrombose veineuse, abcès ou autre processus expansif. Une atteinte de plusieurs territoires, des signes radiculaires ou un cancer peuvent conduire à compléter l’imagerie de l’axe nerveux après discussion. Un bilan systémique peut mettre en évidence un site plus accessible à la biopsie, par exemple ganglionnaire ; le bénéfice attendu guide le choix du geste.</p><p>Un EEG est pertinent si le syndrome comporte des troubles de conscience ou des crises faisant discuter une atteinte encéphalitique. Il n’est pas un examen systématique d’une méningite simple. La biopsie méningée est une décision spécialisée après évaluation des alternatives et de la probabilité de changer les soins.</p><button class="pareto-btn ui" data-k="pareto-g03-examens">▲ Loi de Pareto — Explorations</button><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r6">[R6]</button> · <button class="w" data-k="g03-r7">[R7]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="g03-tab-semio" role="tab" aria-selected="true" aria-controls="g03-s-semio" data-s="g03-s-semio">Sémiologie fondamentale et analytique</button><button id="g03-tab-anat" role="tab" aria-selected="false" aria-controls="g03-s-anat" data-s="g03-s-anat">Anatomie</button><button id="g03-tab-physio" role="tab" aria-selected="false" aria-controls="g03-s-physio" data-s="g03-s-physio">Physiologie</button><button id="g03-tab-cyto" role="tab" aria-selected="false" aria-controls="g03-s-cyto" data-s="g03-s-cyto">Cytologie et histologie</button><button id="g03-tab-biochim" role="tab" aria-selected="false" aria-controls="g03-s-biochim" data-s="g03-s-biochim">Biochimie</button><button id="g03-tab-immuno" role="tab" aria-selected="false" aria-controls="g03-s-immuno" data-s="g03-s-immuno">Immunologie et microbiologie</button></div><div class="chap-body sci-body"><div class="sci" id="g03-s-semio" role="tabpanel" aria-labelledby="g03-tab-semio"><section class="ilot" id="g03-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>La sémiologie relie un fonctionnement normal à sa perturbation, puis à un signe observé et à une décision. Normalement, les enveloppes et le LCR protègent le système nerveux ; la nuque se mobilise sans défense douloureuse et les fonctions d’attention, de langage et de motricité restent adaptées. Le LCR adulte contient peu de cellules et peu de protéines par rapport au plasma, avec des valeurs dépendant de l’âge et du laboratoire.</p><p>Dans G03, une irritation méningée peut provoquer céphalée, photophobie et défense cervicale. La présence d’un déficit focal ou d’une altération de conscience demande un niveau d’analyse supplémentaire : atteinte parenchymateuse, complication ou autre diagnostic. Le raisonnement ne consiste donc pas à compter une triade, mais à identifier territoire, temporalité et gravité.</p><div class="key"><b>À retenir.</b> Normalité utile → perturbation → signe → examen → implication ; une chaîne expliquée est plus fiable qu’une étiquette isolée.</div><p>Sources : <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r14">[R14]</button> · <button class="w" data-k="g03-r16">[R16]</button></p></section><section class="ilot" id="g03-semio-signs" data-semiology="signs"><h3>Décrire la plainte, sa temporalité et son retentissement</h3><p>Une céphalée doit être qualifiée par son début, son évolution, sa diffusion, son caractère inhabituel et les facteurs qui l’aggravent. La photophobie désigne une gêne à la lumière ; la phonophobie une gêne au bruit. Elles soutiennent un syndrome mais ne sont pas spécifiques, puisqu’une migraine peut aussi les produire. Les vomissements sont inconstants et ne désignent pas seuls une hypertension intracrânienne.</p><p>L’installation en heures, la persistance sur plusieurs semaines et les épisodes séparés par récupération correspondent à des histoires différentes. Dans une forme chronique, un ralentissement cognitif, une modification comportementale ou une ataxie peuvent dominer sans céphalée ni fièvre évidente. Dans Mollaret, les périodes libres et la documentation des anciens épisodes comptent autant que la douleur actuelle.</p><div class="key"><b>À retenir.</b> Décrire précisément évite de confondre un symptôme partagé avec une cause démontrée.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r8">[R8]</button> · <button class="w" data-k="g03-r14">[R14]</button></p></section><section class="ilot" id="g03-semio-mechanisms" data-semiology="mechanisms"><h3>Relier le mécanisme au signe puis à l’action</h3><p>L’inflammation irrite les enveloppes et favorise une douleur avec défense musculaire à la mobilisation. L’altération des échanges et le recrutement de cellules se traduisent dans le LCR par une pléiocytose et des modifications des protéines ou du glucose. Ces phénomènes indiquent un processus biologique mais plusieurs causes peuvent les déclencher. La localisation et les fonctions atteintes complètent donc la lecture du prélèvement.</p><figure id="g03-science-links-semio"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g03-diag-semio"><title id="g03-diag-semio">Inflammation puis Signe ou analyse anormale puis Décision contextualisée</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Inflammation</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Signe ou analyse anormale</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Décision contextualisée</text></svg><figcaption>Chaîne causale pédagogique non anatomique ; les flèches expriment les relations expliquées dans le texte et le tableau.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation et limite</th></tr></thead><tbody><tr><td>Irritation → défense cervicale</td><td>Soutient un syndrome méningé, sans identifier un agent.</td></tr><tr><td>Réponse cellulaire → pléiocytose</td><td>Confirme une anomalie du liquide selon norme et contexte ; ne distingue pas seule les causes.</td></tr><tr><td>Focalisation → bilan urgent</td><td>Une fonction localisée anormale dépasse une simple irritation ; rechercher complication ou atteinte encéphalique.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Un même mécanisme peut avoir plusieurs causes ; une même cause peut produire des signes variables selon le terrain.</div><p>Sources : <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r14">[R14]</button></p></section><section class="ilot" id="g03-semio-examination" data-semiology="examination"><h3>Observer et examiner sans forcer une conclusion</h3><p>Commencer par l’aspect général, les constantes, la vigilance et la capacité à communiquer. Comparer les côtés pour la motricité et examiner les nerfs crâniens selon la plainte. Rechercher une défense cervicale par un mouvement prudent, en tenant compte d’une douleur mécanique, d’un traumatisme ou d’une limitation antérieure. Kernig et Brudzinski peuvent compléter l’examen sans être obligatoirement présents.</p><p>Consigner ce qui a réellement été testé et les conditions : patient peu coopérant, sédation, douleur ou mobilité limitée. Une manœuvre non interprétable ne doit pas être inscrite comme négative. Chez le nourrisson, observer tonus, alimentation, comportement et fontanelle ; chez le sujet âgé, rechercher un changement cognitif ou fonctionnel par rapport à l’état habituel.</p><div class="key"><b>À retenir.</b> La qualité de l’observation et la comparaison à l’état antérieur déterminent la valeur d’un signe.</div><p>Sources : <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r14">[R14]</button></p></section><section class="ilot" id="g03-semio-interpretation" data-semiology="interpretation"><h3>Interpréter une présence, une absence et un résultat discordant</h3><p>La raideur de nuque présente renforce l’hypothèse d’irritation mais n’en indique pas la cause. Son absence ne suffit pas à exclure une méningite, surtout aux âges extrêmes ou dans une forme chronique. Une triade incomplète est donc une information clinique, pas une règle d’arrêt du bilan. La probabilité avant les tests dépend du terrain et de l’histoire.</p><p>Un LCR lymphocytaire oriente sans certitude vers certaines causes. Une bactérie prétraitée, une infection opportuniste ou une méningite médicamenteuse peuvent sortir du profil attendu. Lorsqu’une observation et un résultat divergent, vérifier chronologie, préanalytique, couverture du test et hypothèses concurrentes avant de choisir une explication commode. Une évolution défavorable impose une réévaluation même après un bilan initial rassurant.</p><div class="key"><b>À retenir.</b> Le sens d’un résultat dépend de ce qui était probable et de ce que la méthode pouvait réellement détecter.</div><p>Sources : <button class="w" data-k="g03-r2">[R2]</button> · <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r9">[R9]</button></p></section><section class="ilot" id="g03-semio-differentials" data-semiology="differentials"><h3>Discriminer syndrome, territoire et étiologie</h3><p>Une migraine partage céphalée, photophobie et nausées, mais une fièvre ou un changement inhabituel appelle une autre analyse. Une hémorragie sous-arachnoïdienne peut provoquer un syndrome méningé, surtout après céphalée brutale. Un abcès ou une autre lésion expansive peut associer céphalée et déficit ; le risque et l’imagerie s’apprécient avant la PL. L’examen clinique guide ces bifurcations sans garantir une séparation parfaite.</p><p>Dans les tableaux chroniques, l’atteinte de plusieurs nerfs crâniens, les radiculalgies, les signes systémiques et l’immunité orientent vers des mécanismes infectieux, inflammatoires ou tumoraux. Une association temporelle à un médicament constitue une hypothèse supplémentaire. Le diagnostic différentiel s’organise avec ces indices, puis se vérifie par des examens adaptés ; il ne se réduit pas à un catalogue de causes rares.</p><div class="key"><b>À retenir.</b> Les éléments discriminants organisent les priorités et les tests ; ils ne remplacent pas la démonstration de la cause.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r9">[R9]</button> · <button class="w" data-k="g03-r14">[R14]</button></p></section><section class="ilot" id="g03-semio-urgency" data-semiology="urgency"><h3>Identifier le signe qui change immédiatement la conduite</h3><p>Purpura extensif, choc, altération importante de vigilance, déficit focal ou crise nouvelle signalent une menace. Stabiliser et traiter les causes urgentes probables pendant le bilan. L’OMS 2025 précise les critères conduisant à imager avant PL ; le scanner ne doit pas retarder les antimicrobiens indiqués. Une absence de scanner disponible ne justifie pas une attente thérapeutique passive.</p><p>L’urgence est aussi évolutive : un patient supposé avoir une forme simple qui devient confus ou faible doit être réévalué. Une pression d’ouverture peut être un élément essentiel dans une suspicion cryptococcique liée au VIH ; l’immunodépression ne doit pas être appliquée mécaniquement comme interdiction de PL. Les situations pédiatriques exigent leurs critères propres, notamment pour les crises fébriles isolées.</p><div class="key"><b>À retenir.</b> La conduite dépend de la gravité actuelle et du risque du geste, avec réévaluation continue.</div><p>Sources : <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r14">[R14]</button></p></section><section class="ilot" id="g03-semio-limits" data-semiology="limits"><h3>Respecter les populations, les méthodes et les incertitudes</h3><p>Les normes de LCR adulte ne sont pas des normes néonatales ; le site de prélèvement, l’âge, la méthode et les traitements modifient l’interprétation. La coagulation et les anticoagulants requièrent une décision adaptée et un protocole spécialisé. Un fond d’œil normal ou un scanner sans masse visible ne dispense pas de cette évaluation complète.</p><p>Les sources suisses de prise en charge aiguë lues sont datées de 2016–2017, complétées par OMS 2025 et DGN 2023/2025. La revue chronique suisse date de 2021 et s’appuie surtout sur séries et avis d’experts. Les données danoises de Mollaret et françaises de pharmacovigilance gardent leurs populations. Ces limites bornent les affirmations sans les remplacer par des recommandations non lues.</p><div class="key"><b>À retenir.</b> Nommer l’incertitude utile : version, population, technique et niveau de preuve.</div><p>Sources : <button class="w" data-k="g03-r1">[R1]</button> · <button class="w" data-k="g03-r2">[R2]</button> · <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r8">[R8]</button> · <button class="w" data-k="g03-r9">[R9]</button></p></section><section class="ilot" id="g03-semio-sources" data-semiology="sources"><h3>Correspondance entre signes et passages réellement lus</h3><p>Les sources sont liées à chaque chaîne explicative. La correspondance suivante indique les passages utilisés, et les fiches vertes en donnent population et limites. Une présence dans une bibliographie ou un cache n’a pas été comptée comme lecture. Le <a href="https://www.ncbi.nlm.nih.gov/books/NBK614844/" target="_blank" rel="noopener noreferrer">chapitre clinique OMS 2025, sections A1–A4, B3 et C4</a> permet de retrouver directement les passages sur la PL, le traitement initial et le suivi auditif.</p><table class="t"><thead><tr><th>Assertion ou décision</th><th>Passage effectivement lu</th></tr></thead><tbody><tr><td>Raideur, Kernig, Brudzinski ; signes frustes aux âges extrêmes</td><td>R14, syndromes méningé/encéphalitique et particularités d’âge ; R2, démarche aux urgences.</td></tr><tr><td>CT/PL et traitement sans retard</td><td>R4, chapitre 3 A1–A4 ; R5, recommandations initiales.</td></tr><tr><td>Glucose apparié, cellules et limites des profils</td><td>R7, préanalytique et tableau 4 ; R4 diagnostic ; R5 LCR.</td></tr><tr><td>Temporalité chronique et bilan séquentiel</td><td>R3, rappel, clinique, bilan, PL répétées et discussion de biopsie.</td></tr><tr><td>Récidives et critères de cohorte Mollaret</td><td>R8, méthodes, résultats et limites ; R6, section 3.2.6.</td></tr><tr><td>Effet médicamenteux possible</td><td>R9, analyse et limites ; R11/R12, mises en garde exactes des FI suisses.</td></tr></tbody></table><button class="pareto-btn ui" data-k="pareto-g03-semio">▲ Loi de Pareto — Sémiologie</button><p>Sources : <button class="w" data-k="g03-r2">[R2]</button> · <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r6">[R6]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r8">[R8]</button> · <button class="w" data-k="g03-r9">[R9]</button> · <button class="w" data-k="g03-r11">[R11]</button> · <button class="w" data-k="g03-r12">[R12]</button> · <button class="w" data-k="g03-r14">[R14]</button></p></section><p><b>Science → clinique.</b> Distinguer douleur méningée et déficit focal détermine le niveau d’urgence.</p><p><b>Science → examen.</b> La PL objective l’inflammation ; son résultat est confronté au syndrome et au terrain.</p><p><b>Science → traitement.</b> Une suspicion bactérienne grave se traite sans attendre une PL différée.</p></div><div class="sci" id="g03-s-anat" role="tabpanel" aria-labelledby="g03-tab-anat" hidden><section class="ilot" id="g03-anat"><h2>Enveloppes et fonctions : distinguer les territoires</h2><p>La dure-mère, l’arachnoïde et la pie-mère ne sont pas une enveloppe unique. Leur distinction explique les termes pachyméningé et leptoméningé et évite de confondre un rehaussement dural avec toute inflammation du LCR. Le compartiment sous-arachnoïdien contient le liquide ; le parenchyme nerveux constitue un autre territoire fonctionnel. Une atteinte peut cependant franchir ces frontières ou se compliquer.</p><figure><img src="assets/img/g03/alpha/codex/Gray1196.png" alt="Méninges et sinus sagittal supérieur" loading="lazy"><figcaption>Méninges et sinus sagittal supérieur. Original humain, Gray, <i>Anatomy of the Human Body</i>, 1918, illustrations attribuées à Henry Vandyke Carter ; domaine public. Pixels inchangés, repères français adjacents.</figcaption><table class="t"><thead><tr><th>Repère de l’original</th><th>Annotation française et intérêt clinique</th></tr></thead><tbody><tr><td>Dura mater</td><td>Dure-mère sous l’os ; son inflammation ou épaississement correspond au territoire pachyméningé.</td></tr><tr><td>Arachnoid</td><td>Arachnoïde : enveloppe distincte de la dure-mère, au voisinage du compartiment sous-arachnoïdien contenant le LCR.</td></tr><tr><td>Pia mater</td><td>Pie-mère appliquée sur la surface cérébrale ; avec l’arachnoïde, elle constitue les leptoméninges.</td></tr><tr><td>Superior sagittal sinus</td><td>Sinus sagittal supérieur : collecteur veineux ; une complication veineuse ne se confond pas avec l’irritation méningée seule.</td></tr></tbody></table></figure><p>La planche représente une anatomie normale historique avec ses limites de précision ; les repères français sont ajoutés dans le texte et les pixels restent inchangés. Elle ne démontre pas une inflammation. L’observation clinique doit rechercher si seules les enveloppes semblent en cause ou si une fonction localisée est atteinte.</p><figure><img src="assets/img/g03/alpha/codex/Gray764.png" alt="Voie motrice normale, schéma humain historique modifié de Poirier" loading="lazy"><figcaption>Voie motrice normale, schéma humain historique modifié de Poirier. Original humain, Gray, <i>Anatomy of the Human Body</i>, 1918, illustrations attribuées à Henry Vandyke Carter ; domaine public. Pixels inchangés, repères français adjacents.</figcaption><table class="t"><thead><tr><th>Repère de l’original</th><th>Annotation française et intérêt clinique</th></tr></thead><tbody><tr><td>Motor area of cortex</td><td>Cortex moteur : l’apparition d’une faiblesse latéralisée demande une recherche de lésion ou de complication.</td></tr><tr><td>Internal capsule</td><td>Capsule interne : les fibres motrices y sont regroupées ; la motricité localise une fonction, sans désigner une étiologie.</td></tr><tr><td>Decussation of pyramids</td><td>Décussation bulbaire : croisement de la majorité des fibres ; le niveau de l’atteinte compte dans l’interprétation du côté du déficit.</td></tr><tr><td>Lateral cerebrospinal fasciculus</td><td>Faisceau corticospinal latéral : voie descendante médullaire ; la planche n’est ni une image de méningite ni un guide de ponction.</td></tr></tbody></table></figure><p>Une parésie nouvelle, une aphasie ou une atteinte d’un nerf crânien ne permettent pas de nommer un agent. Elles signalent que la description « céphalée méningée simple » est insuffisante et peuvent modifier la séquence imagerie/PL. La localisation sert ainsi à choisir le bilan et à prévenir un geste risqué, tout en maintenant la recherche d’une infection traitable.</p><figure id="g03-science-links-anat"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g03-diag-anat"><title id="g03-diag-anat">Territoire atteint puis Fonction perturbée puis Bilan adapté</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Territoire atteint</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Fonction perturbée</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Bilan adapté</text></svg><figcaption>Chaîne causale pédagogique non anatomique ; les flèches expriment les relations expliquées dans le texte et le tableau.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation et limite</th></tr></thead><tbody><tr><td>Enveloppes → syndrome méningé</td><td>Douleur et défense possibles, sans spécificité causale.</td></tr><tr><td>Parenchyme ou complication → focalisation</td><td>IRM et autres explorations selon urgence ; CT préalable à la PL si critères de risque.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Nommer le territoire clarifie le symptôme, l’imagerie et la décision ; aucune planche normale ne diagnostique une méningite.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r14">[R14]</button> · <button class="w" data-k="g03-r16">[R16]</button> · <button class="w" data-k="g03-r17">[R17]</button></p></section><p><b>Science → clinique.</b> Une fonction motrice ou un nerf crânien anormal signale une atteinte localisée à explorer.</p><p><b>Science → examen.</b> L’imagerie précise territoire et complications et peut précéder la PL lorsque des critères de risque sont présents.</p><p><b>Science → traitement.</b> La localisation guide la sécurité des gestes ; elle ne doit pas retarder un traitement urgent indiqué.</p></div><div class="sci" id="g03-s-physio" role="tabpanel" aria-labelledby="g03-tab-physio" hidden><section class="ilot" id="g03-physio"><h2>LCR, circulation et pression : comprendre les conditions de mesure</h2><p>Le LCR participe à l’environnement protecteur du cerveau et de la moelle. Sa circulation et ses échanges avec le sang déterminent une composition différente du plasma. Une faible cellularité et une concentration protéique relativement basse constituent la situation de référence adulte, avec des variations liées à l’âge, au lieu de prélèvement et au laboratoire. La norme sert de comparaison ; elle ne suffit pas à déterminer un mécanisme.</p><p>Une inflammation peut modifier les échanges, la circulation et la résorption. L’augmentation des protéines ne signifie donc pas simplement « fuite de la barrière », et une hydrocéphalie ou une pression élevée doit être analysée avec l’imagerie et la clinique. Une pression lombaire est une mesure dans des conditions précises ; position, agitation et technique peuvent gêner sa lecture. Une valeur ne se transpose pas d’un contexte à un autre sans précaution.</p><p><button class="w" data-k="g03-pression">Pression d’ouverture : mesure, sécurité et exception cryptococcique</button></p><figure id="g03-science-links-physio"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g03-diag-physio"><title id="g03-diag-physio">Circulation perturbée puis Pression ou échanges puis Clinique et mesure</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Circulation perturbée</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Pression ou échanges</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Clinique et mesure</text></svg><figcaption>Chaîne causale pédagogique non anatomique ; les flèches expriment les relations expliquées dans le texte et le tableau.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation et limite</th></tr></thead><tbody><tr><td>Inflammation → circulation modifiée</td><td>Hydrocéphalie possible ; la céphalée seule ne l’établit pas.</td></tr><tr><td>Pression mesurée → interprétation</td><td>Vérifier position, unité et contexte ; ne pas réduire la sécurité du geste à un chiffre.</td></tr></tbody></table></figure><table class="t"><thead><tr><th>Question</th><th>Conséquence pratique</th></tr></thead><tbody><tr><td>Une pression élevée prouve-t-elle la cause ?</td><td>Non ; elle guide le bilan et parfois le traitement spécialisé.</td></tr><tr><td>Un fond d’œil normal garantit-il une PL sûre ?</td><td>Non ; il faut intégrer symptômes, terrain, coagulation et risque de masse.</td></tr><tr><td>Une mesure normale exclut-elle une méningite ?</td><td>Non ; inflammation et pression sont des dimensions distinctes.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Comprendre la physiologie évite d’utiliser une pression ou une norme de LCR comme verdict étiologique.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r7">[R7]</button></p></section><p><b>Science → clinique.</b> La céphalée et les troubles de vigilance peuvent accompagner une perturbation de circulation sans en prouver le mécanisme.</p><p><b>Science → examen.</b> La pression d’ouverture exige position, unité et technique adaptées ; elle ne nomme pas la cause.</p><p><b>Science → traitement.</b> Une hydrocéphalie ou une hypertension intracrânienne nécessite un plan spécialisé ; une PL risquée est différée.</p></div><div class="sci" id="g03-s-cyto" role="tabpanel" aria-labelledby="g03-tab-cyto" hidden><section class="ilot" id="g03-cyto"><h2>Les cellules renseignent sur la réponse, puis sur une cause possible</h2><p>Le LCR normal adulte contient peu de leucocytes ; les cellules présentes sont principalement lymphocytaires et monocytaires. Une augmentation de leur nombre décrit une pléiocytose. La formule précise les proportions, tandis que la cytologie étudie la morphologie. Ces informations ne répondent pas toutes à la même question : quantité, type et aspect doivent être distingués.</p><p>Les neutrophiles sont fréquents dans une infection bactérienne aiguë, mais ils peuvent dominer au début d’une virose et dans une méningite médicamenteuse. Dans la série française détaillée, 44,8 % des cas médicamenteux avaient un profil dit purulent et 33 % un profil lymphocytaire. Ces termes suivent les définitions de l’étude, pas un critère universel de diagnostic. La formule seule ne doit donc pas décider l’arrêt d’un traitement urgent.</p><p><button class="w" data-k="g03-cellules">Cellules de Mollaret : une observation non spécifique</button></p><p>Une suspicion tumorale demande une lecture cytologique ciblée, parfois complétée par une cytométrie selon l’hypothèse. Un résultat négatif isolé ne vaut pas exclusion absolue : quantité de cellules, délai, conservation et site de l’atteinte peuvent limiter le rendement. La discussion avec le laboratoire permet d’anticiper la technique et, si utile, un nouveau prélèvement.</p><figure id="g03-science-links-cyto"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g03-diag-cyto"><title id="g03-diag-cyto">Cellules observées puis Réponse ou infiltration puis Vérification ciblée</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Cellules observées</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Réponse ou infiltration</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Vérification ciblée</text></svg><figcaption>Chaîne causale pédagogique non anatomique ; les flèches expriment les relations expliquées dans le texte et le tableau.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation et limite</th></tr></thead><tbody><tr><td>Neutrophiles → orientation</td><td>Ni spécificité bactérienne absolue ni exclusion d’un médicament.</td></tr><tr><td>Morphologie suspecte → examens complémentaires</td><td>Cytologie/cytométrie répondent à une question ; une seule analyse négative peut manquer une atteinte.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Décrire les cellules avant d’en déduire une cause ; la morphologie et la formule restent dépendantes de la méthode et du contexte.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r6">[R6]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r8">[R8]</button> · <button class="w" data-k="g03-r9">[R9]</button></p></section><p><b>Science → clinique.</b> Le nombre et le type de cellules éclairent une inflammation dont les signes peuvent être incomplets.</p><p><b>Science → examen.</b> La formule, la morphologie et la cytométrie répondent à des questions distinctes et dépendent du prélèvement.</p><p><b>Science → traitement.</b> Un profil lymphocytaire ou neutrophilique ne décide pas seul de l’arrêt d’une couverture empirique.</p></div><div class="sci" id="g03-s-biochim" role="tabpanel" aria-labelledby="g03-tab-biochim" hidden><section class="ilot" id="g03-biochim"><h2>Glucose, protéines et lactate : relier les compartiments</h2><p>Le glucose du LCR s’interprète avec la glycémie et le contexte temporel du prélèvement. Un rapport abaissé indique une anomalie des échanges ou de l’utilisation du glucose, mais n’identifie pas à lui seul une bactérie. Tuberculose, infection fongique et infiltration tumorale peuvent également s’accompagner d’hypoglycorachie. Une valeur brute isolée perd une partie de son sens si la glycémie associée manque.</p><p>Les protéines totales sont un indicateur global. Le quotient albumine LCR/sérum aide à analyser les échanges entre compartiments, car l’albumine est d’origine sanguine. Son interprétation dépend notamment de l’âge et du laboratoire. Les immunoglobulines requièrent leur propre analyse avec le sérum associé ; une augmentation totale ne démontre pas à elle seule une production intrathécale.</p><p>Le lactate du LCR reflète une activité métabolique locale et peut orienter entre profils. Les seuils discutés varient et un traitement préalable ou d’autres lésions neurologiques compliquent leur valeur. La recommandation OMS demande de l’interpréter avec les autres caractéristiques du liquide. La procalcitonine sanguine est un autre compartiment et un autre signal ; aucun de ces marqueurs ne doit devenir un test d’exclusion autonome.</p><table class="t"><thead><tr><th>Mesure</th><th>Question utile</th><th>Limite</th></tr></thead><tbody><tr><td>Glucose LCR + sérum</td><td>Le rapport est-il anormal dans ce contexte ?</td><td>Prélèvement apparié et interprétation clinique nécessaires.</td></tr><tr><td>Protéines / quotient albumine</td><td>Existe-t-il une anomalie d’échange ou de circulation ?</td><td>Pas d’étiologie unique ; normes dépendantes de l’âge.</td></tr><tr><td>Lactate LCR</td><td>Le profil soutient-il une infection bactérienne parmi les hypothèses ?</td><td>Prétraitement, causes concurrentes et seuils variables.</td></tr><tr><td>PCT sanguine</td><td>Le contexte biologique renforce-t-il une hypothèse ?</td><td>Une valeur isolée ne confirme ni n’exclut une méningite.</td></tr></tbody></table><figure id="g03-science-links-biochim"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g03-diag-biochim"><title id="g03-diag-biochim">Compartiments appariés puis Anomalie biochimique puis Interprétation globale</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Compartiments appariés</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Anomalie biochimique</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Interprétation globale</text></svg><figcaption>Chaîne causale pédagogique non anatomique ; les flèches expriment les relations expliquées dans le texte et le tableau.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation et limite</th></tr></thead><tbody><tr><td>Sang + LCR → rapport</td><td>La valeur de comparaison évite certaines erreurs d’interprétation.</td></tr><tr><td>Marqueur → probabilité</td><td>Un marqueur modifie une hypothèse ; il ne remplace pas clinique et microbiologie.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Le prélèvement apparié et l’unité comptent autant que le chiffre ; les marqueurs se complètent sans fournir une signature unique.</div><p>Sources : <button class="w" data-k="g03-r1">[R1]</button> · <button class="w" data-k="g03-r2">[R2]</button> · <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r7">[R7]</button></p></section><p><b>Science → clinique.</b> Glucose et lactate modifient les probabilités d’une cause sans remplacer l’histoire du patient.</p><p><b>Science → examen.</b> Associer sérum et LCR, normes du laboratoire et chronologie du traitement.</p><p><b>Science → traitement.</b> Une discordance biochimique impose une réévaluation ; un marqueur isolé ne doit pas retarder les soins.</p></div><div class="sci" id="g03-s-immuno" role="tabpanel" aria-labelledby="g03-tab-immuno" hidden><section class="ilot" id="g03-immuno"><h2>Inflammation, agent et réponse intrathécale : trois niveaux distincts</h2><p>Une inflammation méningée peut résulter d’un agent infectieux, d’une réaction à un médicament, d’une maladie systémique ou d’une infiltration tumorale. La réponse cellulaire et protéique n’est donc pas équivalente à la présence d’un microorganisme. À l’inverse, une immunodépression peut atténuer certains signes tout en augmentant la probabilité d’un agent opportuniste ; une faible réaction ne signifie pas nécessairement un faible risque.</p><p>La PCR recherche un matériel génétique ciblé. Sa performance dépend du prélèvement, du moment de la maladie et des cibles incluses. La culture recherche un organisme viable et peut permettre une étude de sensibilité ; elle est affectée par les traitements antérieurs. Le choix entre ces méthodes est complémentaire, non concurrent. Un panel négatif laisse ouvertes les causes hors panel et certaines infections difficiles à documenter.</p><p>Les anticorps présents dans le LCR peuvent provenir du sang ou d’une synthèse locale. Des indices utilisant des prélèvements appariés et les quotients adaptés aident à les distinguer. Des bandes oligoclonales spécifiques du LCR soutiennent une production intrathécale d’immunoglobulines, sans nommer un agent ou une maladie. Des bandes identiques dans le sérum et le LCR ne s’interprètent pas de la même manière. La sérologie sanguine Borrelia positive doit être confrontée à un syndrome et à des arguments du compartiment nerveux.</p><p>Pour la méningite médicamenteuse, les mécanismes proposés comprennent une irritation directe et une hypersensibilité. Ils ne fournissent pas un biomarqueur clinique universel. L’imputabilité reste fondée sur la chronologie, l’exclusion des autres causes et l’évolution après retrait. Le lupus peut être associé à une susceptibilité à certains effets des AINS, mais son absence n’exclut pas le signal.</p><figure id="g03-science-links-immuno"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g03-diag-immuno"><title id="g03-diag-immuno">Déclencheur possible puis Réponse inflammatoire puis Preuve contextualisée</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Déclencheur possible</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Réponse inflammatoire</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Preuve contextualisée</text></svg><figcaption>Chaîne causale pédagogique non anatomique ; les flèches expriment les relations expliquées dans le texte et le tableau.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation et limite</th></tr></thead><tbody><tr><td>Infection ou autre cause → inflammation</td><td>Un profil cellulaire commun peut venir de plusieurs mécanismes.</td></tr><tr><td>Test ciblé → argument causal</td><td>Vérifier couverture et timing ; l’imputabilité médicamenteuse ne repose pas sur un test unique.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Distinguer preuve d’inflammation, détection d’un agent et production d’anticorps ; les trois niveaux répondent à des questions différentes.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r9">[R9]</button> · <button class="w" data-k="g03-r12">[R12]</button></p></section><p><b>Science → clinique.</b> L’immunodépression peut accroître le risque tout en atténuant la réaction observée.</p><p><b>Science → examen.</b> Distinguer détection ciblée d’un agent et preuve d’une réponse intrathécale.</p><p><b>Science → traitement.</b> Traiter la cause probable urgente puis adapter selon la preuve ; une inflammation inexpliquée ne justifie pas automatiquement un immunosuppresseur.</p></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="g03-p-principes"><h2>Une prescription répond à une indication précise</h2><p>G03 ne désigne pas une cible pharmacologique unique. Les traitements anti-infectieux ou immunomodulateurs répondent à une cause et à un degré d’urgence ; ils demandent un protocole adapté et le contrôle du produit suisse exact. Cette leçon détaille un traitement symptomatique adulte et les médicaments suspects vérifiés, sans transposer un schéma d’encéphalite à une méningite simple.</p><p>La douleur et la fièvre doivent être soulagées tout en surveillant l’évolution. Une amélioration sous antalgique n’élimine pas une infection. Vérifier poids, fonction hépatique et rénale, consommation d’alcool, nutrition, autres produits contenant la même substance et interactions avant de prescrire. La durée la plus courte nécessaire est recherchée avec réévaluation, sans masquer une aggravation.</p><div class="key"><b>À retenir.</b> Indication, produit, dose, intervalle, durée et surveillance doivent rester explicites.</div><p>Sources : <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r6">[R6]</button> · <button class="w" data-k="g03-r10">[R10]</button> · <button class="w" data-k="g03-r11">[R11]</button> · <button class="w" data-k="g03-r12">[R12]</button></p></section><section class="ilot" id="g03-p-paracetamol"><h2>Paracétamol : DAFALGAN comprimés à 500 mg</h2><p><button class="w" data-k="g03-paracetamol">DAFALGAN 500 mg : schéma adulte et adaptations vérifiées</button></p><table class="t"><thead><tr><th>Adulte et contexte</th><th>Dose, intervalle et plafond de la FI</th></tr></thead><tbody><tr><td>>40 kg, sans facteur imposant réduction</td><td>500–1000 mg par prise ; intervalle 4–8 h ; maximum 4 g/j.</td></tr><tr><td>Clairance 10–50 ml/min</td><td>Espacer d’au moins 6 h ; maximum 3 g/j.</td></tr><tr><td>Clairance <10 ml/min</td><td>Espacer d’au moins 8 h ; maximum 2 g/j.</td></tr><tr><td>T
