<template data-pop="g83-sm-retention" data-title="Rétention urinaire indolore : le symptôme qui décide">
<div class="lab">Définition</div><p>La rétention est l’impossibilité de vider la vessie. Dans le syndrome de la queue de cheval, elle est indolore et peut s’accompagner d’un écoulement par regorgement, que le patient décrit parfois comme une incontinence [S5].</p>
<div class="lab">Normal</div><p>Le sujet sain perçoit le besoin, déclenche la miction volontairement et vide sa vessie.</p>
<div class="lab">Technique</div><p>Le médecin interroge la sensation de besoin, la force du jet, la nécessité de pousser et la fréquence des mictions ; il ne se contente pas de demander si le patient est incontinent [S5]. Il mesure ensuite le résidu post-mictionnel avant tout sondage [S5 ; S10].</p>
<div class="lab">Mécanisme</div><p>Les racines de la 2e à la 5e sacrée portent l’information de remplissage et la commande de la miction ; leur interruption laisse la vessie se remplir sans signal, puis déborder [S5].</p>
<div class="lab">Valeur</div><p>Sensibilité de près de 90 % ; en son absence, la probabilité d’un syndrome de la queue de cheval chez un lombalgique est d’environ 1 sur 10 000 [S3]. La spécificité n’est pas donnée dans les sources lues.</p>
<div class="lab">Piège</div><p>Un sondage posé avant l’évaluation empêche la distension et le regorgement qui caractérisent le stade avec rétention [S5].</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Selz Amaudruz et coll., Rev Med Suisse 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8782783/" target="_blank" rel="noopener">Lavy et coll., Int Orthop 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32475252/" target="_blank" rel="noopener">Katzouraki et coll., Bone Joint J 2020</a>, consultées le 16 octobre 2026.</p></template>
<template data-pop="g83-sm-selle" data-title="Hypoesthésie en selle">
<div class="lab">Définition</div><p>Diminution de la sensibilité du périnée, de la région périanale et des organes génitaux, territoire des racines sacrées [S5].</p>
<div class="lab">Technique</div><p>La sensibilité est évaluée de façon subjective, par la plainte du patient, et objective, par l’examen [S5]. Les sources lues ne précisent ni la modalité testée ni la cartographie dermatomale à employer.</p>
<div class="lab">Valeur</div><p>Les neuf recommandations internationales revues la retiennent comme drapeau rouge [S6]. Sa sensibilité n’est pas chiffrée dans les sources lues. Dans un centre britannique, son association avec une compression n’a pas persisté après ajustement [S33].</p>
<div class="lab">Piège</div><p>Elle n’est pas indispensable au stade incomplet : des compressions confirmées par IRM existent sans perte de sensibilité périnéale [S5].</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8782783/" target="_blank" rel="noopener">Lavy et coll., Int Orthop 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40000448/" target="_blank" rel="noopener">Hennessy et coll., Eur Spine J 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34796788/" target="_blank" rel="noopener">Curtis Lopez et coll., Br J Neurosurg 2024</a>, consultées le 16 octobre 2026.</p></template>
<template data-pop="g83-sm-sciatique" data-title="Sciatique bilatérale : un drapeau faible">
<div class="lab">Valeur</div><p>Dans 260 suspicions prospectives, la sciatique bilatérale avait une sensibilité de 32,4 %, une valeur prédictive positive de 17,2 % et une valeur prédictive négative de 88,3 % [S10].</p>
<div class="lab">Lecture</div><p>Le calcul de l’audit retrouve un tableau unique compatible avec ces indices : 11 vrais positifs sur 34 malades et 53 faux positifs sur 226 non-malades, soit une spécificité déduite d’environ 76 % (calculs/verifier.py, F11). Plus de quatre patients sur cinq qui ont une sciatique bilatérale n’ont donc pas de syndrome (53 sur 64), et deux malades sur trois n’ont pas de sciatique bilatérale (23 sur 34).</p>
<div class="lab">Conséquence</div><p>La sciatique bilatérale impose les questions sphinctériennes ; elle ne remplace pas leur réponse.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/32475252/" target="_blank" rel="noopener">Katzouraki et coll., Bone Joint J 2020</a>, consultée le 16 octobre 2026.</p></template>
<template data-pop="g83-sm-tonus" data-title="Toucher rectal : ce que vaut le tonus anal">
<div class="lab">Valeur</div><p>Une méta-analyse de six études (741 patients) trouve une sensibilité du tonus anal de 0,23 à 0,53 ; le serrage volontaire a une sensibilité de 0,29 et une spécificité de 0,96 ; les réflexes anaux, une sensibilité de 0,38 et une spécificité de 0,6 [S31]. Sur 1 005 suspicions, un tonus diminué était noté chez 35 % des patients avec compression et 31 % de ceux sans compression [S33].</p>
<div class="lab">Conséquence</div><p>Les auteurs de la méta-analyse déconseillent le toucher rectal du tonus pour détecter une compression, car il expose à une fausse réassurance [S31]. Le parcours britannique actuel ne le requiert plus en routine pour ce seul but [S32].</p>
<div class="lab">Piège</div><p>Un tonus jugé normal n’écarte pas le syndrome ; la décision d’IRM repose sur les symptômes sacrés [S5 ; S6].</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35180641/" target="_blank" rel="noopener">Tabrah et coll., Musculoskelet Sci Pract 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34796788/" target="_blank" rel="noopener">Curtis Lopez et coll., Br J Neurosurg 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42709243/" target="_blank" rel="noopener">Pammi et coll., Eur J Orthop Surg Traumatol 2026</a>, consultées le 16 octobre 2026.</p></template>
<template data-pop="g83-sm-lasegue" data-title="Signe de Lasègue et Lasègue croisé">
<div class="lab">Valeur</div><p>Dans la compression radiculaire, le signe de Lasègue a une sensibilité de 0,88 à 1 et une spécificité basse de 0,11 à 0,44 ; le Lasègue croisé a une sensibilité de 0,23 à 0,44 et une spécificité de 0,86 à 0,95 [S3].</p>
<div class="lab">Lecture</div><p>Un Lasègue négatif rend une compression radiculaire peu probable ; un Lasègue croisé positif la rend probable. Aucun des deux ne renseigne sur les racines sacrées.</p>
<div class="lab">Lien</div><p>La même revue suisse décrit, pour la racine L5, une chute du bassin à la marche qui révèle la faiblesse des moyens et petits fessiers controlatéraux [S3].</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Selz Amaudruz et coll., Rev Med Suisse 2010, encadré sur le signe de Lasègue</a>, consultée le 16 octobre 2026.</p></template>
<template data-pop="g83-sm-regard" data-title="Regard vertical et clignement : la preuve de conscience">
<div class="lab">Mécanisme</div><p>Les mouvements verticaux des yeux et le releveur de la paupière dépendent du mésencéphale ; une lésion de la base du pont les épargne alors qu’elle interrompt les faisceaux corticospinaux et corticobulbaires [S17].</p>
<div class="lab">Technique</div><p>L’examen est répété et standardisé ; il recherche une réponse volontaire et reproductible du regard vertical ou des paupières à une consigne [S17].</p>
<div class="lab">Valeur et limite</div><p>Dans la forme complète, aucun mouvement volontaire ne persiste : l’IRM fonctionnelle ou des paradigmes d’EEG actifs deviennent nécessaires [S17]. L’échelle CRS-R manque les patients sans sortie comportementale [S17].</p>
<div class="lab">Piège</div><p>Automatismes oraux, spasmes, bâillements et pleurs peuvent persister ; ils ne sont pas volontaires [S17].</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10064471/" target="_blank" rel="noopener">Schnetzer et coll., Ther Adv Neurol Disord 2023</a>, consultée le 16 octobre 2026.</p></template>
<template data-pop="g83-sm-front" data-title="Paralysie faciale : lire le front">
<div class="lab">Normal</div><p>Le sujet sain plisse le front, fronce les sourcils et ferme fortement les yeux des deux côtés.</p>
<div class="lab">Mécanisme</div><p>La partie du noyau facial qui commande le front reçoit une commande des deux hémisphères [S26]. C’est pourquoi le front reste mobile quand la lésion siège au-dessus du noyau.</p>
<div class="lab">Interprétation</div><p>Un front qui se plisse normalement, alors que la face moyenne et inférieure est faible, oriente vers une lésion centrale (premier motoneurone, G83.6) [S26 ; S1]. Un front immobile, un sourcil abaissé, une fermeture incomplète de la paupière avec signe de Bell, une commissure tombante et un sillon nasogénien effacé orientent vers une paralysie périphérique (G51.0) [S26 ; S1]. La difficulté à enfouir les cils (signe des cils de Souques) oriente aussi vers l’atteinte périphérique [S36].</p>
<div class="lab">Piège</div><p>Une évolution progressive, un nystagmus, une baisse d’audition, un déficit sensitif, une diplopie ou un autre nerf crânien atteint imposent une imagerie urgente [S26]. Dans la région, la borréliose est une cause secondaire à rechercher [S35].</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6865187/" target="_blank" rel="noopener">Heckmann et coll., Dtsch Arztebl Int 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37493118/" target="_blank" rel="noopener">Schroeter et coll., Rev Med Suisse 2023</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2025/revue-medicale-suisse-939/c-est-bon-signe.-paralysie-faciale-centrale-ou-peripherique" target="_blank" rel="noopener">von Boehn et coll., Rev Med Suisse 2025</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g80-g83.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024</a>, consultées le 16 octobre 2026.</p></template>
<template data-pop="g83-sm-todd" data-title="Parésie postcritique de Todd">
<div class="lab">Fréquence et durée</div><p>Chez 328 patients en vidéo-EEG pour une épilepsie focale, une parésie postcritique est survenue chez 44 (13,4 %). Elle était toujours unilatérale et controlatérale au foyer, d’une durée médiane de 173,5 secondes (11 secondes à 22 minutes), plus longue après une activité clonique ou une crise tonico-clonique [S30].</p>
<div class="lab">Mécanisme</div><p>La fréquence d’une posture dystonique et d’une immobilité du membre pendant la crise fait évoquer aux auteurs un processus inhibiteur actif [S30].</p>
<div class="lab">Conduite</div><p>Pour un AVC ischémique de moins de 4,5 heures avec crise au début, sans suspicion de simulateur ni traumatisme crânien significatif, la recommandation européenne suggère la thrombolyse (certitude très faible, recommandation faible) [S29].</p>
<div class="lab">Limite</div><p>Ces durées viennent de patients monitorés pour une chirurgie de l’épilepsie ; elles ne valent pas pour toutes les crises vues aux urgences [S30].</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/15210875/" target="_blank" rel="noopener">Gallmetzer et coll., Neurology 2004</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener">Berge et coll., recommandation ESO 2021, PICO 14.2</a>, consultées le 16 octobre 2026.</p></template>
