<section class="ilot" id="g25-semio-signs" data-semiology="signs"><h3>Signes et symptômes : rythme, durée et contexte</h3><p>Un tremblement est une oscillation rythmique. Préciser repos, posture, action, intention ou condition debout. Une myoclonie est une secousse brève positive, ou une interruption négative ; elle est souvent irrégulière mais peut être rythmique. Une chorée associe des mouvements irréguliers imprévisibles, tandis qu’un tic est récurrent et souvent lié à un besoin prémonitoire ou une suppression transitoire.</p><p>Les symptômes ne sont pas tous des mouvements visibles. Dans les jambes sans repos, l’envie de bouger et son lien au repos, au soir et au soulagement sont centraux. Dans l’akathisie, l’agitation et l’impossibilité de rester immobile imposent une histoire médicamenteuse. Une raideur axiale avec spasmes déclenchés constitue encore une autre question.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-DX — Phénoménologie et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-AKA — Akathisie et tremblement médicamenteux</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></section>
<section class="ilot" id="g25-semio-mechanisms" data-semiology="mechanisms"><h3>Mécanismes : relier le signe sans réduire toutes les causes</h3><p>Une myoclonie positive ajoute une activité musculaire ; une négative interrompt une activité de maintien. Le même résultat visible peut venir de plusieurs niveaux nerveux, d’où l’intérêt d’une neurophysiologie adaptée. L’astérixis illustre une interruption, mais ne nomme pas toutes les myoclonies négatives.</p><p>Le syndrome des jambes sans repos implique régulation du fer et transmission dopaminergique, avec facteurs génétiques et comorbidités. La réponse dopaminergique ne démontre pas un déficit identique à Parkinson. Dans la personne raide, la dysfonction inhibitrice et l’auto-immunité orientent un autre mécanisme. Ces liens expliquent pourquoi une dose symptomatique uniforme pour G25 serait inadaptée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MECH — Pathophysiology et comorbidités</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-MECH — Introduction et physiopathologie</a>.</p></section>
<section class="ilot" id="g25-semio-examination" data-semiology="examination"><h3>Examen : observer puis provoquer seulement ce qui est sûr</h3><p>Commencer par les fonctions vitales et le contexte urgent. Si la situation le permet, observer au repos soutenu, bras maintenus et pendant une tâche comme doigt-nez ou manipulation d’un objet. Noter latéralité, distribution, régularité et signes associés. Une augmentation d’oscillation à l’approche de la cible diffère d’une erreur de trajectoire sans oscillation.</p><p>Tester force, réflexes, tonus, sensibilité et coordination, puis marche/équilibre selon sécurité. Pour un phénomène exclusivement debout, comparer assis et marche avec aide adaptée. Une observation consentie hors cabinet peut compléter un épisode fluctuant ; demander aussi au patient les sensations et les conditions que l’examinateur ne voit pas.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, lignes1404–1406 du texte extrait réouvert</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-CEREB — p81–82, syndrome cérébelleux</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-EXAM — Physical examination et examen multiforme</a>.</p></section>
<section class="ilot" id="g25-semio-interpretation" data-semiology="interpretation"><h3>Interprétation : ce qui soutient et ce qui ne prouve pas</h3><p>La fréquence d’un tremblement, une amélioration après alcool, une histoire familiale ou une image normale n’identifie pas seule une cause. Les critères du tremblement essentiel demandent une description et une durée ; les signes discrets d’essentiel plus se distinguent d’un autre syndrome neurologique établi.</p><p>Pour une myoclonie, enregistrer les muscles et l’EEG ensemble peut aider ; un tracé bref négatif ne tranche pas tous les épisodes. Dans la personne raide, un anti-GAD65 isolé ne suffit pas. Le titre, le contexte clinique, l’électrophysiologie et parfois le liquide cérébrospinal sont interprétés ensemble par l’équipe spécialisée. Dire « probable » ou « à préciser » est plus exact que surinterpréter un indice.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></section>
<section class="ilot" id="g25-semio-differentials" data-semiology="differentials"><h3>Différentiels : comparer le profil complet</h3><p>Crampes, gêne positionnelle, neuropathie, douleur articulaire, claudication, akathisie et tremblement orthostatique peuvent être décrits comme des « jambes agitées ». Rechercher les cinq critères RLS et distinguer les symptômes coexistants. Une crampe contracte douloureusement un muscle ; une claudication augmente à la marche ; une instabilité orthostatique se manifeste surtout debout.</p><p>Une dystonie ou un parkinsonisme peuvent accompagner un tremblement et en modifier la classification. Les signes positifs de tremblement fonctionnel s’évaluent dans un ensemble ; anxiété seule ou absence de lésion ne suffisent pas. Une maladie neurologique et un trouble fonctionnel peuvent coexister. L’imputabilité médicamenteuse exige aussi une chronologie cohérente.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MIMIC — Table2 et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-FUNC — p98–99, signes positifs et explication</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-AKA — Akathisie et tremblement médicamenteux</a>.</p></section>
<section class="ilot" id="g25-semio-urgency" data-semiology="urgency"><h3>Urgence : le contexte prime sur la précision du nom</h3><p>Une installation soudaine avec déficit focal ou une myoclonie nouvelle avec confusion demande un circuit urgent selon les causes possibles. Fièvre, rigidité ou clonus, trouble mental et instabilité autonome après médicaments font rechercher une toxicité grave. Un trouble respiratoire, une convulsion prolongée ou une déglutition compromise ne doit pas attendre la classification complète.</p><p>Les syndromes malins peuvent être atypiques : la FI Tiapridal décrit notamment des formes sans rigidité ou avec fièvre modérée. L’objectif est d’évaluer, sécuriser et prendre en charge la cause avec l’équipe, sans attendre une triade parfaite. Inversement, l’arrêt brutal non encadré de certains traitements chroniques peut lui-même être dangereux.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-URG — Syndromes sérotoninergique et malin des antipsychotiques</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, galénique/dose/adaptations, sécurité/reproduction/mécanisme</a>.</p></section>
<section class="ilot" id="g25-semio-limits" data-semiology="limits"><h3>Limites : une observation dynamique et une preuve située</h3><p>Une photographie ou une planche normale ne montre ni la temporalité ni le mécanisme moléculaire. Les cinq originaux de ce cours servent à lire des structures et un marquage, avec leurs limites propres. Le donneur de l’image immunohistochimique n’est pas identifié comme malade G25 ; PCP4 n’est pas GAD65.</p><p>Les recommandations ont des populations et des versions. Les résumés de 2026 restent des résumés ; le consensus italien RLS dérive de recommandations américaines et ne devient pas une directive suisse. Les FI vérifient produit, formulation, voie et population ; efficacité rapportée et autorisation sont distinctes. Ce cours relève d’auto-relectures IA et de contrôles ciblés, sans validation médicale humaine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">IMG-MOTOR — Description, provenance, droits propres et original réellement vus</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:PCP4_immunohistochemistry_in_human_cerebellum.jpg" target="_blank" rel="noopener">IMG-PURKINJE — Description, provenance, droits propres et original réellement vus</a> ; <a data-reference-source="1" href="https://doi.org/10.1007/s10072-026-09487-2" target="_blank" rel="noopener">EU-RLS-2026 — Résumé primaire viaEuropePMC seulement</a> ; <a data-reference-source="1" href="https://www.awmf.org/aktuelles/awmf-aktuell/tremor" target="_blank" rel="noopener">EU-TREMOR-META — Version/validité affichées et comparaison PDF</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a>.</p></section>
<section class="ilot" id="g25-semio-sources" data-semiology="sources"><h3>Sources : revenir au passage applicable</h3><p>Les références sont liées aux questions traitées : examen suisse, critères de tremblement de la recommandation avec participation SNG, diagnostic RLS germanophone, myoclonies européennes, chorée approuvée aussi par SNG et évaluation ESSTS des tics. Les FI suisses du produit exact encadrent doses et précautions.</p><p>Le registre de recherche documente passages effectivement consultés, dates, versions, populations et limites ; il ne prétend pas que chaque document entier a été lu. Les textes complets sont conservés hors Git et les publications pédagogiques utilisent des paraphrases. La comparaison entre sources conserve les différences qui modifient une décision, notamment pramipexole sel/base, grossesse, fonction rénale et augmentation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, lignes1404–1406 du texte extrait réouvert</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-DX — Phénoménologie et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a>.</p></section>
</div><div class="sci" id="g25-s-anat" role="tabpanel" aria-labelledby="g25-tab-anat" hidden><section class="ilot" id="g25-s-anatomy" ><h2>Structures de commande et de régulation : lire une référence normale</h2><p>L’anatomie aide à poser une question de localisation. La voie corticospinale transmet une commande motrice ; les noyaux gris et les circuits cérébelleux participent à une régulation plus large. La phénoménologie d’un tremblement ne désigne pas à elle seule une structure lésée. Un syndrome de tremblement peut avoir plusieurs causes et une même cause plusieurs présentations.</p><figure data-g25-figure="basal"><div data-g25-frame="wide"><img src="assets/img/g25/alpha/codex/basal.png" alt="Schéma humain de deux niveaux de coupe coronale des noyaux gris, avec striatum, pallidum, noyau sous-thalamique et substance noire" loading="lazy"><span data-g25-mark="1" aria-hidden="true">1</span><span data-g25-mark="2" aria-hidden="true">2</span><span data-g25-mark="3" aria-hidden="true">3</span><span data-g25-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Striatum, nommé sur l’original : structure indiquée dans le premier niveau de coupe.</li><li>GPi : segment interne du globus pallidus, distinct du segment externe GPe nommé juste au-dessus.</li><li>STN : noyau sous-thalamique, nommé dans le second niveau de coupe.</li><li>SN : substance noire dans le second niveau ; cette image ne mesure ni dopamine ni activité d’un récepteur.</li></ol><p>Deux niveaux coronaux normaux du cerveau humain, pas une lésion démontrée ou un résultat d’imagerie du patient. La figure localise des structures ; elle ne mesure ni dopamine, ni fer, ni activité d’un récepteur et ne diagnostique pas un code G25.</p><p data-g25-credit>Andrew Gillies, schéma humain créé et publié en 2005 · <a href="https://commons.wikimedia.org/wiki/File:Basal-ganglia-coronal-sections.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels originaux inchangés ; repères et légende ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Sur ces coupes coronales, striatum, pallidum, noyau sous-thalamique et substance noire sont des repères distincts. Les deux niveaux ne sont pas deux états avant/après maladie. La figure ne mesure ni fer ni dopamine et ne constitue pas une IRM du patient. Une interprétation structurale exige concordance avec clinique et examens pertinents.</p><p>La moelle et ses racines constituent un autre niveau. Les générateurs de myoclonies peuvent être corticaux, sous-corticaux, segmentaires ou périphériques ; la distribution et les enregistrements aident à les différencier. Racine antérieure motrice et racine postérieure avec ganglion sensitif ne sont pas interchangeables. Le schéma ne dessine pas individuellement les interneurones inhibiteurs et ne localise pas un anticorps.</p><figure data-g25-figure="spinal"><div data-g25-frame="wide"><img src="assets/img/g25/alpha/codex/spinal.png" alt="Planche humaine historique de la moelle et des racines antérieure et postérieure avec ganglion spinal" loading="lazy"><span data-g25-mark="1" aria-hidden="true">1</span><span data-g25-mark="2" aria-hidden="true">2</span><span data-g25-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Substance grise centrale, entourée de substance blanche sur cette coupe de moelle humaine.</li><li>Racine antérieure, nommée sur l’original : trajet moteur, distinct de la racine postérieure.</li><li>Ganglion spinal, nommé sur l’original : repère du versant sensitif de la racine postérieure.</li></ol><p>Anatomie de référence humaine, pas une lésion ni un test de syndrome de la personne raide. Les circuits inhibiteurs ne sont pas dessinés individuellement ; aucun anticorps ou traitement ne se déduit de cette image.</p><p data-g25-credit>Gray/Carter, Anatomy of the Human Body, édition 1918, planche 675 · <a href="https://commons.wikimedia.org/wiki/File:Gray675.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p><b>Science → clinique.</b> Une secousse distale à l’action, des signes pyramidaux ou des spasmes axiaux ne fournissent pas les mêmes indices. <b>Science → examen.</b> Comparer force, réflexes, coordination, distribution et neurophysiologie choisie. L’IRM cherche une cause structurelle lorsqu’elle est indiquée, notamment devant un syndrome cérébelleux ou une chorée. <b>Science → traitement.</b> Identifier une cause peut changer le soin ; une planche seule ne choisit ni stimulation, ni médicament, ni immunothérapie.</p><div class="key"><b>À retenir.</b> Une structure normale est un repère de raisonnement, pas la preuve de la lésion ou du traitement du patient.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, lignes1404–1406 du texte extrait réouvert</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-CEREB — p81–82, syndrome cérébelleux</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Basal-ganglia-coronal-sections.png" target="_blank" rel="noopener">IMG-BASAL — Description, provenance, droits propres et original réellement vus</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray675.png" target="_blank" rel="noopener">IMG-SPINAL — Description, provenance, droits propres et original réellement vus</a>.</p></section>
</div><div class="sci" id="g25-s-histo" role="tabpanel" aria-labelledby="g25-tab-histo" hidden><section class="ilot" id="g25-s-histology" ><h2>Du tissu humain au marquage : observer sans inventer une lésion</h2><p>Le tissu nerveux associe neurones et glies. Un neurone possède un soma, des dendrites et un axone ; des cellules gliales assurent notamment soutien, myélinisation et surveillance. Cette organisation permet communication et intégration, mais une forme cellulaire ne résume pas tous les états fonctionnels. Une activité anormale peut ne pas correspondre à une anomalie visible sur une préparation histologique de routine.</p><p>Le cours d’histologie de l’Université de Bâle décrit une coupe normale de cervelet humain adulte colorée par hématoxyline-éosine. De la superficie vers la profondeur, on distingue couche moléculaire, rangée des grands somas de Purkinje et couche granulaire dense, puis substance blanche. Hématoxyline et éosine montrent des caractères morphologiques ; certaines glies ne se distinguent pas clairement par cet aspect seul.</p><figure data-g25-figure="histo"><div data-g25-frame="tall"><img src="assets/img/g25/alpha/codex/purkinje.jpg" alt="Trois microphotographies humaines du cervelet à grossissements 40, 100 et 200 fois avec immunomarquage PCP4 orange des cellules de Purkinje" loading="lazy"><span data-g25-mark="1" aria-hidden="true">1</span><span data-g25-mark="2" aria-hidden="true">2</span><span data-g25-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Panneau supérieur, annoncé 40 fois : rangée de cellules immunoréactives orange au bord de la zone granulaire dense.</li><li>Panneau médian, annoncé 100 fois : grands somas de Purkinje marqués dans cette préparation humaine.</li><li>Panneau inférieur, annoncé 200 fois : détail de somas et prolongements marqués ; ce n’est pas une mesure d’anticorps sanguins.</li></ol><p>L’auteur rapporte une préparation parmi trois spécimens humains ; statut clinique du donneur non précisé. Anti-PCP4 n’est ni anti-GAD65 ni une coloration de dopamine ou de fer. Aucune maladie G25 n’est diagnostiquée, aucune barre en micromètres n’est ajoutée à partir des seuls grossissements.</p><p data-g25-credit>Herizora, immunohistochimie personnelle de cervelet humain, 31 mai 2014 · <a href="https://commons.wikimedia.org/wiki/File:PCP4_immunohistochemistry_in_human_cerebellum.jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels originaux inchangés ; repères et légende ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>L’original ci-dessus est une autre préparation, provenant de Commons : une immunohistochimie anti-PCP4 de cervelet humain, avec trois grossissements annoncés. Les somas orange sont décrits comme cellules de Purkinje immunoréactives. Ce n’est pas la coupe H&E de Bâle, ni un marquage anti-GAD65, ni un résultat sérologique du patient. Le statut clinique du donneur n’est pas précisé.</p><p>Le grossissement annoncé ne remplace pas une barre d’échelle ; l’affichage redimensionné ne permet pas une mesure fiable en micromètres. Aucun repère de taille inventé n’a été ajouté. L’original est conservé sans modification des pixels ; les numéros et la légende sont ajoutés en superposition avec attribution et licence.</p><p><b>Science → clinique.</b> On ne diagnostique pas tremblement essentiel, jambes sans repos ou personne raide à partir de cette image de référence. <b>Science → examen.</b> L’examen du mouvement et les investigations ciblées restent déterminants ; une biopsie cérébelleuse de routine n’est pas déduite de l’illustration. <b>Science → traitement.</b> La présence d’un marquage de protéine ne constitue pas une indication d’immunothérapie ou de supplémentation.</p><div class="key"><b>À retenir.</b> Nommer le tissu, la méthode, le marqueur et les limites avant d’interpréter la couleur.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/12-2-nervous-tissue" target="_blank" rel="noopener">NORMAL-TISSUE — Neurones, soma/prolongements et glies explicitement réouverts</a> ; <a data-reference-source="1" href="https://tales.nmc.unibas.ch/en/histology-12/nervensystem-anatomische-mikroskopie-52/cerebellum-1-335" target="_blank" rel="noopener">NORMAL-CEREB — Préparation adulte humaine H&amp;E et trois couches</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:PCP4_immunohistochemistry_in_human_cerebellum.jpg" target="_blank" rel="noopener">IMG-PURKINJE — Description, provenance, droits propres et original réellement vus</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></section>
</div><div class="sci" id="g25-s-physio" role="tabpanel" aria-labelledby="g25-tab-physio" hidden><section class="ilot" id="g25-s-physiology" ><h2>Commande, oscillation et interruption : du fonctionnement au signe</h2><p>Une action efficace exige une activation musculaire organisée dans le temps, avec ajustement de la trajectoire. Dans la fibre, l’acétylcholine déclenche une dépolarisation ; le calcium mobilisé se lie à la troponine et rend possible l’interaction actine-myosine. Le cycle utilise de l’ATP ; la relaxation implique notamment la recapture du calcium et la fin du signal. Ce fonctionnement normal ne prouve pas que toute secousse résulte d’un trouble musculaire primaire.</p><p>Le tremblement est une oscillation. Sa condition d’activation renseigne : repos soutenu, maintien, mouvement ou approche d’une cible. Le tremblement cérébelleux comporte typiquement une composante d’intention avec amplitude augmentée près du but ; des signes associés de coordination doivent être cherchés. Une dysmétrie sans oscillation ne se renomme pas tremblement. Ces différences relient une observation à une question, pas à un diagnostic fondé sur une fréquence isolée.</p><figure data-g25-figure="cereb"><div data-g25-frame="wide"><img src="assets/img/g25/alpha/codex/cerebellum.png" alt="Planche historique humaine d’un folium cérébelleux avec cellule de Purkinje, arborisation et cellules granulaires" loading="lazy"><span data-g25-mark="1" aria-hidden="true">1</span><span data-g25-mark="2" aria-hidden="true">2</span><span data-g25-mark="3" aria-hidden="true">3</span><span data-g25-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Soma de la cellule de Purkinje au bord de la couche moléculaire, nommé sur l’original.</li><li>Arborisation dendritique étendue de Purkinje dans la couche moléculaire.</li><li>Cellules granulaires : la légende historique nuclear layer correspond ici à la couche granulaire.</li><li>Axone de Purkinje indiqué sur l’original, distinct de son arborisation dendritique.</li></ol><p>Schéma humain historique de référence, non généré par IA. Il ne démontre pas une lésion chez une personne avec tremblement essentiel ou cérébelleux ; l’oscillation et les signes cliniques ne sont pas visibles sur cette image statique.</p><p data-g25-credit>Gray/Carter, Anatomy of the Human Body, édition 1918, planche 706 · <a href="https://commons.wikimedia.org/wiki/File:Gray706.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Une myoclonie positive produit une brève activation ; la négative interrompt une contraction en cours. Le maintien d’un objet peut alors être rompu sans que la force de base soit nécessairement identique à celle d’une faiblesse permanente. L’électromyographie permet d’observer activation ou silence et leur relation avec d’autres muscles. Le générateur doit être inféré avec clinique et neurophysiologie, dont l’EEG couplé lorsque pertinent.</p><p>Dans le tremblement orthostatique primaire, la condition debout est centrale et l’activité musculaire caractéristique est rapide et cohérente. Dans les jambes sans repos, l’envie de bouger, le repos et l’horaire sont centraux ; ce n’est pas le même phénomène. Le soulagement par mouvement ne permet donc pas à lui seul d’unifier ces deux situations.</p><p><b>Science → clinique.</b> Décrire ce qui s’ajoute, oscille ou s’interrompt. <b>Science → examen.</b> Reproduire prudemment la condition et choisir un enregistrement capable d’observer le phénomène. <b>Science → traitement.</b> Traiter une cause ou un générateur pertinent évite de donner le même médicament à des mouvements différents.</p><div class="key"><b>À retenir.</b> Le temps, la condition et le type d’activité comptent autant que l’amplitude.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/10-3-muscle-fiber-contraction-and-relaxation" target="_blank" rel="noopener">NORMAL-MUSCLE — Paragraphes contraction/relaxation réouverts après extraction ciblée</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-CEREB — p81–82, syndrome cérébelleux</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray706.png" target="_blank" rel="noopener">IMG-CEREB — Description, provenance, droits propres et original réellement vus</a>.</p></section>
</div><div class="sci" id="g25-s-bio" role="tabpanel" aria-labelledby="g25-tab-bio" hidden><section class="ilot" id="g25-s-biochemistry" ><h2>Transmetteurs, fer et cibles pharmacologiques distinctes</h2><p>La glutamate décarboxylase 2, codée par GAD2 et appelée isoforme GAD65, catalyse la formation de GABA à partir de L-glutamate, avec libération de dioxyde de carbone et cofacteur pyridoxal-5′-phosphate. L’entrée humaine Swiss-Prot révisée le 2 septembre 2026 décrit cette fonction. Cette réaction normale n’est pas un protocole de vitamine B6, et un anticorps associé à une maladie ne permet pas de calculer un déficit enzymatique individuel.</p><p>Les médicaments agissent sur des cibles différentes. Le clonazépam renforce allostériquement l’effet du GABA à ses synapses inhibitrices. La prégabaline, malgré sa parenté chimique de nom avec le GABA, se lie à la sous-unité α2δ de canaux calciques et modifie la libération de transmetteurs ; elle n’est pas un simple agoniste GABA. Le lévétiracétam se lie notamment à la protéine vésiculaire SV2A, participant à un mécanisme antiépileptique encore partiel. Ces mécanismes ne rendent pas toutes les myoclonies sensibles à tous ces produits.</p><figure data-g25-figure="histo"><div data-g25-frame="tall"><img src="assets/img/g25/alpha/codex/purkinje.jpg" alt="Trois microphotographies humaines du cervelet à grossissements 40, 100 et 200 fois avec immunomarquage PCP4 orange des cellules de Purkinje" loading="lazy"><span data-g25-mark="1" aria-hidden="true">1</span><span data-g25-mark="2" aria-hidden="true">2</span><span data-g25-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Panneau supérieur, annoncé 40 fois : rangée de cellules immunoréactives orange au bord de la zone granulaire dense.</li><li>Panneau médian, annoncé 100 fois : grands somas de Purkinje marqués dans cette préparation humaine.</li><li>Panneau inférieur, annoncé 200 fois : détail de somas et prolongements marqués ; ce n’est pas une mesure d’anticorps sanguins.</li></ol><p>L’auteur rapporte une préparation parmi trois spécimens humains ; statut clinique du donneur non précisé. Anti-PCP4 n’est ni anti-GAD65 ni une coloration de dopamine ou de fer. Aucune maladie G25 n’est diagnostiquée, aucune barre en micromètres n’est ajoutée à partir des seuls grossissements.</p><p data-g25-credit>Herizora, immunohistochimie personnelle de cervelet humain, 31 mai 2014 · <a href="https://commons.wikimedia.org/wiki/File:PCP4_immunohistochemistry_in_human_cerebellum.jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels originaux inchangés ; repères et légende ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>PCP4 dans l’illustration n’est pas GAD65. Une couleur tissulaire de référence ne mesure ni concentration synaptique du GABA, ni fer cérébral, ni effet d’un médicament. Distinguer méthode anatomique, biochimie normale, biomarqueur clinique et cible pharmacologique prévient des conclusions excessives.</p><p>Le fer participe aux hypothèses physiopathologiques des jambes sans repos. La recommandation 2024 rapporte des données sur la régulation du fer central et la transmission dopaminergique, avec incertitudes. La ferritine sanguine et la saturation de la transferrine sont des paramètres cliniques utiles, sans être une mesure directe du compartiment cérébral. Le seuil de discussion de supplémentation appartient à un contexte RLS ; il n’est pas une frontière universelle de normalité.</p><p><b>Science → clinique.</b> Une amélioration sous agoniste ne prouve pas un simple déficit de dopamine. <b>Science → examen.</b> Lire ferritine, saturation, unités et contexte, et interpréter un anticorps dans un tableau compatible. <b>Science → traitement.</b> Cible, formulation, indication et élimination déterminent les précautions ; la chimie seule ne crée pas une autorisation suisse.</p><div class="key"><b>À retenir.</b> Une molécule, un marqueur et un médicament peuvent partager un contexte sans être des mesures équivalentes.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/Q05329.txt" target="_blank" rel="noopener">NORMAL-GAD2 — Fonction, catalyse, cofacteur</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680377570127" target="_blank" rel="noopener">FI-RIVOTRIL — Indications/voies/forme orale, organes, dépendance/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, galénique/dose/adaptations, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MECH — Pathophysiology et comorbidités</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-IRON — Résumé et section Iron/Intravenous Iron</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:PCP4_immunohistochemistry_in_human_cerebellum.jpg" target="_blank" rel="noopener">IMG-PURKINJE — Description, provenance, droits propres et original réellement vus</a>.</p></section>
</div><div class="sci" id="g25-s-immuno" role="tabpanel" aria-labelledby="g25-tab-immuno" hidden><section class="ilot" id="g25-s-immunology" ><h2>Inhibition et auto-immunité : le syndrome de la personne raide</h2><p>Le système nerveux comporte des cellules de soutien et de surveillance ; son environnement immunitaire n’est pas une barrière absolue à toute maladie immune. Le syndrome de la personne raide illustre une atteinte associée à une dysfonction de circuits inhibiteurs. Une raideur axiale ou proximale, des spasmes douloureux déclenchés par mouvement, bruit ou contact, et des chutes orientent la discussion sans établir seuls le diagnostic.</p><p>Des <button class="w" data-k="g25-gad">anticorps anti-glutamate décarboxylase 65</button> sont fréquents, mais ne sont ni universels ni spécifiques d’une maladie neurologique en toute circonstance. D’autres cibles, dont récepteur de la glycine ou amphiphysine selon le contexte, participent au spectre. Le guide danois actualisé en juin 2025 souligne que des anti-GAD65 peuvent être présents sans syndrome neurologique ; titre, phénotype et parfois recherche dans le liquide cérébrospinal importent.</p><figure data-g25-figure="spinal"><div data-g25-frame="wide"><img src="assets/img/g25/alpha/codex/spinal.png" alt="Planche humaine historique de la moelle et des racines antérieure et postérieure avec ganglion spinal" loading="lazy"><span data-g25-mark="1" aria-hidden="true">1</span><span data-g25-mark="2" aria-hidden="true">2</span><span data-g25-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Substance grise centrale, entourée de substance blanche sur cette coupe de moelle humaine.</li><li>Racine antérieure, nommée sur l’original : trajet moteur, distinct de la racine postérieure.</li><li>Ganglion spinal, nommé sur l’original : repère du versant sensitif de la racine postérieure.</li></ol><p>Anatomie de référence humaine, pas une lésion ni un test de syndrome de la personne raide. Les circuits inhibiteurs ne sont pas dessinés individuellement ; aucun anticorps ou traitement ne se déduit de cette image.</p><p data-g25-credit>Gray/Carter, Anatomy of the Human Body, édition 1918, planche 675 · <a href="https://commons.wikimedia.org/wiki/File:Gray675.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Cette planche montre des structures normales, pas la localisation d’anticorps ni les interneurones d’un patient. L’électrophysiologie peut montrer coactivation ou activité motrice continue dans un contexte compatible. L’IRM est souvent sans anomalie spécifique. Le spécialiste examine aussi les diagnostics concurrents et recherche une auto-immunité associée ou une tumeur lorsque le contexte l’indique.</p><p>La revue systématique française/européenne 2025 rassemble 36 études, dont 21 séries, dix cohortes et cinq essais randomisés. Elle rapporte un soutien plus solide aux immunoglobulines intraveineuses que pour plusieurs autres options, avec réponse non universelle. Les petits effectifs, variantes peu différenciées, mesures subjectives et suivis limités empêchent une règle thérapeutique identique pour tous. Les traitements symptomatiques et immunitaires répondent à des objectifs complémentaires.</p><p><b>Science → clinique.</b> Un spasme déclenché et une raideur progressive doivent être replacés dans l’ensemble neurologique. <b>Science → examen.</b> Le dosage d’anticorps ne remplace pas clinique et électrophysiologie. <b>Science → traitement.</b> Une immunothérapie exige un diagnostic argumenté, une indication spécialisée et la FI du produit exact ; aucun schéma de dose n’est déduit d’un code ou d’une image.</p><div class="key"><b>À retenir.</b> Auto-immunité possible ne signifie ni anticorps suffisant ni immunothérapie automatique.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/12-2-nervous-tissue" target="_blank" rel="noopener">NORMAL-TISSUE — Neurones, soma/prolongements et glies explicitement réouverts</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-MECH — Introduction et physiopathologie</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-TX — Méthode, discussion, table2 et limites</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray675.png" target="_blank" rel="noopener">IMG-SPINAL — Description, provenance, droits propres et original réellement vus</a>.</p></section>
</div></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="g25-p-plan" ><h2>Prescrire pour un syndrome et un produit identifiés</h2><p>La cause, le retentissement et les objectifs du patient précèdent le médicament. Le tableau sépare l’indication suisse de l’efficacité discutée dans une recommandation. Un usage hors indication demande une décision expliquée, une évaluation bénéfice-risque et un suivi ; il ne devient pas autorisé par la seule présence du nom dans une revue.</p><table class="t"><thead><tr><th>Situation</th><th>Option et statut</th><th>Contrôle décisif</th></tr></thead><tbody><tr><td>Tremblement essentiel</td><td>Propranolol : indication Inderal ; primidone : recommandation DGN/SNG, hors indication Mysoline</td><td>Asthme/bradycardie pour propranolol ; tolérance et formulation de faible dose pour primidone</td></tr><tr><td>Jambes sans repos</td><td>Pramipexole immédiat : indication Sifrol ; prégabaline : hors indication Lyrica</td><td>Fer, augmentation, rein, formulation et dose RLS</td></tr><tr><td>Myoclonie non épileptique sélectionnée</td><td>Lévétiracétam ou clonazépam selon générateur, hors indication de leurs FI épilepsie</td><td>Cause, niveau générateur, rein/foie, sédation et comportement</td></tr><tr><td>Tics sévères</td><td>Tiapridal selon indication et âge, après échec non médicamenteux</td><td>Ne pas appliquer une dose Huntington à toute chorée ou tout tic</td></tr><tr><td>Carence martiale adulte et oral inadapté</td><td>Ferinject si carence confirmée et indication FI remplie</td><td>Voie, poids, besoin total, plafond, hypersensibilité et phosphate</td></tr><tr><td>Syndrome de la personne raide</td><td>Traitements symptomatiques et immunitaires spécialisés</td><td>Diagnostic argumenté ; aucun produit/dose d’immunothérapie déduit du seul code</td></tr></tbody></table><p>Les huit FI ont été consultées dans les versions indiquées ci-dessous. L’existence d’une présentation dans la FI n’établit pas la disponibilité de chaque emballage. La page clinique USZ et les recommandations européennes ne remplacent pas l’information professionnelle suisse du produit exact.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317060015" target="_blank" rel="noopener">FI-INDERAL — Indication/posologie ET, galénique, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680178850145" target="_blank" rel="noopener">FI-MYSOLINE — Indications, début épilepsie, organes, interactions/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, galénique/dose/adaptations, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680377570127" target="_blank" rel="noopener">FI-RIVOTRIL — Indications/voies/forme orale, organes, dépendance/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-TX — p5–6 et20–21, propranolol/primidone</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-TX — Management et conclusion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-TX — Méthode, discussion, table2 et limites</a>.</p></section>
<section class="ilot" id="g25-p-inderal" ><h2>Propranolol — Inderal, FI janvier 2023</h2><p><b>Indication et mécanisme.</b> Tremblement essentiel autorisé ; antagoniste bêta-adrénergique. Les autres indications ne définissent pas le schéma du tremblement. Les comprimés à 10 ou 40 mg ont un sillon décoratif et ne doivent pas être cassés à ce niveau.</p><p><b>Adulte, rubrique tremblement essentiel.</b> Début 40 mg deux à trois fois par jour ; adaptation à intervalles hebdomadaires selon réponse. La dose usuelle mentionnée est de 80–160 mg/jour. Le plafond de 640 mg/jour figure dans la rubrique hypertension : il ne doit pas être transféré comme maximum du tremblement. La plage DGN de propranolol n’est pas un remplacement de cette FI.</p><p><b>Sécurité.</b> Contre-indiqué notamment en cas d’asthme ou d’antécédent de bronchospasme, bradycardie, hypotension, bloc auriculoventriculaire de deuxième/troisième degré ou insuffisance cardiaque décompensée. Le blocage peut masquer la tachycardie d’hypoglycémie. Vérapamil, diltiazem et autres médicaments ralentisseurs demandent une vigilance sur conduction, pression et fonction cardiaque.</p><p><b>Populations et suivi.</b> Prudence initiale si atteinte rénale ou hépatique ; chez la personne âgée, adapter selon réponse. Les doses pédiatriques d’autres indications ne forment pas un schéma pédiatrique ET. Grossesse seulement en nécessité absolue ; ne pas allaiter selon la FI. En cardiopathie ischémique, arrêt progressif sur une à deux semaines. Mesurer bénéfice fonctionnel, fréquence cardiaque, pression et tolérance.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317060015" target="_blank" rel="noopener">FI-INDERAL — Indication/posologie ET, galénique, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-TX — p5–6 et20–21, propranolol/primidone</a>.</p></section>
<section class="ilot" id="g25-p-mysoline" ><h2>Primidone — Mysoline, FI février 2024</h2><p><b>Statut.</b> La recommandation DGN/SNG propose la primidone pour le tremblement essentiel ; la FI suisse Mysoline décrit l’épilepsie. L’usage ET est donc hors indication. La primidone et ses métabolites, notamment phénobarbital, ont des effets centraux ; le mécanisme exact ne se réduit pas à une cible unique.</p><p><b>Début et formulation.</b> La FI présente des comprimés de 250 mg sécables en deux. Son début à 125 mg le soir est un schéma d’épilepsie, pas un protocole ET. La DGN rapporte des réactions aiguës même à 62,5 mg et discute un début très faible avec hausse lente, dont la protection contre ces réactions reste imparfaite. Une faible dose ne se fabrique pas en divisant arbitrairement le comprimé en dix ou en appelant un quart « 25 mg » : forme disponible ou préparation appropriée à vérifier avec la pharmacie et le spécialiste.</p><p><b>Sécurité.</b> Nausées, vertiges, ataxie et sédation peuvent limiter le début ; avertir le patient et prévenir les chutes. Contre-indications notamment troubles rénaux/hépatiques sévères, porphyrie hépatique aiguë, lésions du muscle cardiaque et hypersensibilité à la primidone ou au phénobarbital. Si atteinte moins sévère, accumulation possible et réduction/surveillance à envisager. Rash progressif avec lésions muqueuses impose une évaluation immédiate et la conduite d’arrêt prévue pour réaction grave.</p><p><b>Interactions et reproduction.</b> Induction enzymatique et interactions nombreuses, dont baisse d’efficacité contraceptive ; l’alcool est à éviter. La FI demande contraception hautement efficace pendant le traitement et deux mois après, conseil spécialisé et information sur le risque fœtal. Grossesse uniquement si bénéfice supérieur aux risques après examen des alternatives ; allaitement non recommandé. La réduction d’un traitement chronique est planifiée, sans arrêt brutal improvisé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680178850145" target="_blank" rel="noopener">FI-MYSOLINE — Indications, début épilepsie, organes, interactions/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-TX — p5–6 et20–21, propranolol/primidone</a>.</p></section>
<section class="ilot" id="g25-p-sifrol" ><h2>Pramipexole — Sifrol immédiat, FI octobre 2024</h2><p><b>Produit et indication.</b> Sifrol immédiat a une indication pour les jambes sans repos idiopathiques ; Sifrol ER retard est réservé aux indications parkinsoniennes dans cette FI. Les comprimés retard ne sont pas divisés, écrasés ou mâchés. Le comprimé immédiat à 0,125 mg n’est pas sécable.</p><p><b>Unité et schéma adulte RLS.</b> Les nombres suivants expriment le <b>sel, pramipexole dichlorhydrate monohydraté</b>, pas la base. Début 0,125 mg une fois par jour, deux à trois heures avant le coucher. Si nécessaire, augmentation de 0,125 mg tous les quatre à sept jours, <b>maximum RLS 0,75 mg/jour</b>, à la dose efficace la plus faible. La présentation 0,125 mg de sel correspond à 0,088 mg de base ; vérifier l’écriture de toute source avant comparaison. La fenêtre <button class="w" data-k="g25-base">sel et base</button> évite une substitution numérique. Les doses et plafonds Parkinson ne s’appliquent pas au RLS.</p><p><b>Rein et populations.</b> Le RLS avec insuffisance rénale n’a pas été étudié. La FI indique pas de réduction si clairance &gt; 20 mL/min ; si &lt; 20, diminution de dose selon la baisse de clairance. Elle ne résout pas explicitement la borne exactement 20 et ne fournit pas un plafond RLS rénal distinct à copier du Parkinson. Hémodialyse contre-indiquée ; efficacité/sécurité avant 18 ans non établies. Grossesse seulement nécessité absolue, allaitement à éviter.</p><p><b>Risques et arrêt.</b> Augmentation, somnolence/endormissement subit, troubles du contrôle des pulsions, hallucinations et hypotension orthostatique doivent être recherchés. Informer patient et entourage ; ne pas conduire si somnolence ou sommeil subit. Sédatifs/alcool et interactions de sécrétion rénale demandent vigilance. La FI RLS permet un arrêt sans décroissance et rapporte 10 % de rebond ; cela ne justifie pas un arrêt brutal universel dans l’augmentation chronique, pour laquelle la recommandation clinique souligne une diminution très lente et spécialisée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-TX — Recommandations thérapeutiques et Pregabalin</a>.</p></section>
<section class="ilot" id="g25-p-lyrica" ><h2>Prégabaline — Lyrica, FI juillet 2026, version 110F</h2><p><b>Statut et mécanisme.</b> La FI autorise des indications adultes de douleur neuropathique, épilepsie adjuvante et anxiété généralisée, <b>pas les jambes sans repos</b>. La prégabaline se lie à la sous-unité α2δ des canaux calciques ; elle n’est pas un agoniste GABA direct.</p><p><b>Distinguer deux contextes de doses.</b> Les indications FI utilisent 150–600 mg/jour en deux ou trois prises avec titration propre à l’indication. La recommandation RLS 2024 décrit, hors indication, un début de 50–75 mg, puis une plage efficace de 150–450 mg en une prise une à trois heures avant le coucher. Ce second schéma n’est pas une posologie RLS approuvée en Suisse et doit être individualisé. Le résumé italien 2026 préfère les ligands α2δ chez beaucoup d’adultes chroniques, mais son origine américaine et son statut de résumé restent explicites.</p><p><b>Fonction rénale, FI actuelle.</b> Lyrica ne doit pas être utilisé si clairance &lt; 30 mL/min. Le tableau FI donne, pour 30–60 mL/min, 75 mg/jour au début et 300 mg/jour au maximum, en deux ou trois prises ; pour ≥ 60, 150 et 600 mg/jour. La borne 60 est partagée dans la présentation du tableau : ne pas fabriquer une règle non écrite. Ce sont des limites FI pour ses indications, pas une autorisation de transposer ces doses au RLS. Aucun tableau étranger permettant de descendre en dessous de 30 n’est importé.</p><p><b>Sécurité et populations.</b> Somnolence, vertiges, chutes, œdèmes, dépendance et sevrage ; dépression respiratoire notamment avec opioïdes ou autres dépresseurs centraux. Moins de 18 ans : non recommandé. Grossesse seulement si bénéfice maternel clairement supérieur aux risques, contraception efficace ; allaitement déconseillé. Contre-indication d’hypersensibilité et précautions cardiovasculaires/rénales à vérifier. La FI recommande un arrêt progressif individualisé sur plusieurs semaines, voire plusieurs mois ; le raccourci universel « une semaine » n’est pas retenu.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-TX — Recommandations thérapeutiques et Pregabalin</a> ; <a data-reference-source="1" href="https://doi.org/10.1007/s10072-026-09487-2" target="_blank" rel="noopener">EU-RLS-2026 — Résumé primaire viaEuropePMC seulement</a>.</p></section>
<section class="ilot" id="g25-p-keppra" ><h2>Lévétiracétam — Keppra, FI avril 2023</h2><p><b>Indication et limite G25.</b> Keppra est autorisé dans des épilepsies définies, dont les crises myocloniques de l’épilepsie juvénile myoclonique à partir de 12 ans en association. Cette maladie est exclue de G25.3. Son utilisation dans certaines myoclonies corticales non épileptiques est discutée dans la revue européenne, mais ne devient pas une indication FI G25.</p><p><b>Repères de dose et formulation.</b> La revue 2024 cite 1000–3000 mg/jour dans les myoclonies corticales sélectionnées. La rubrique FI usuelle adulte et adolescent de 12–17 ans de plus de 40 kg commence à 500 mg deux fois par jour, avec possibilité médicale de 250 mg deux fois par jour puis 500 après deux semaines ; maximum 1500 mg deux fois par jour. Ce repère d’épilepsie ne choisit pas un protocole universel G25. La solution orale est à 100 mg/mL ; la barre des comprimés facilite la déglutition sans garantir deux demi-doses égales.</p><p><b>Rein.</b> La table rénale est une rubrique distincte pour adulte/adolescent à partir de 16 ans pesant plus de 50 kg, avec clairance indexée en mL/min/1,73 m². Par exemple, à 30–49, elle indique 250–750 mg deux fois par jour ; la dose réelle dépend du patient. Ne pas remplacer automatiquement cette clairance par une valeur de laboratoire de même apparence ni appliquer la table à tous les poids et âges. Hémodialyse et pédiatrie ont des consignes propres.</p><p><b>Sécurité.</b> Surveiller humeur, agressivité, idées suicidaires et somnolence ; informer proches et patient. Rash grave ou signes systémiques d’hypersensibilité demandent une conduite urgente. Peu d’interactions enzymatiques ne signifie pas absence de tout risque. L’arrêt est progressif en pratique usuelle. Grossesse : nécessité clinique, dose efficace la plus faible et surveillance ; allaitement déconseillé avec évaluation individuelle si indispensable. L’hypersensibilité est contre-indiquée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, galénique/dose/adaptations, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-TX — Management et conclusion</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a>.</p></section>
<section class="ilot" id="g25-p-rivotril" ><h2>Clonazépam — Rivotril, FI octobre 2023</h2><p><b>Statut et effet.</b> Rivotril a des indications d’épilepsie ; le clonazépam renforce la transmission GABAergique. La revue des myoclonies le discute pour certaines formes selon le générateur. Une myoclonie non épileptique G25.3 ou un symptôme de personne raide ne devient pas automatiquement une indication autorisée. Les benzodiazépines ne sont pas un traitement de routine recommandé des jambes sans repos dans le texte 2024.</p><p><b>Voies et concentration.</b> Les gouttes <b>orales</b> contiennent 2,5 mg/mL ; 25 gouttes correspondent à 1 mL, soit 0,1 mg par goutte avec le dispositif prévu. Le concentré injectable à 1 mg/mL est une autre formulation avec des consignes de dilution et de surveillance propres. Aucun schéma intraveineux d’état de mal n’est transféré à un mouvement chronique G25. Le <button class="w" data-k="g25-calculation">calcul d’une dose déjà retenue</button> ci-dessous n’en choisit pas l’indication.</p><p><b>Contre-indications et organes.</b> Insuffisance respiratoire sévère, insuffisance hépatique sévère, myasthénie, dépendance connue à médicaments/stupéfiants/alcool et hypersensibilité figurent parmi les contre-indications. En atteinte hépatique légère/modérée et chez la personne âgée, utiliser la dose la plus faible adaptée. L’insuffisance rénale n’impose pas une adaptation pharmacocinétique selon cette FI, malgré l’absence d’étude d’innocuité/efficacité spécifique : cela n’efface pas les autres risques.</p><p><b>Sécurité.</b> Sédation, chutes, dépendance et dépression respiratoire, majorées par alcool/opioïdes/autres dépresseurs ; prudence en apnées du sommeil. Réduction progressive, car un arrêt brutal expose au sevrage et, en épilepsie, à un état de mal. Grossesse seulement nécessité absolue, dose minimale utile et conseil spécialisé ; ne pas utiliser pendant allaitement, ou l’interrompre si indication incontournable. Les doses pédiatriques d’épilepsie ne sont pas des doses pédiatriques G25.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680377570127" target="_blank" rel="noopener">FI-RIVOTRIL — Indications/voies/forme orale, organes, dépendance/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-TX — Management et conclusion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-TX — Recommandations thérapeutiques et Pregabalin</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-TX — Méthode, discussion, table2 et limites</a>.</p></section>
<section class="ilot" id="g25-p-tiapridal" ><h2>Tiapride — Tiapridal, FI novembre 2022</h2><p><b>Indications.</b> Tics sévères de l’enfant, de l’adolescent et de l’adulte après échec du traitement non médicamenteux ; chorée sévère de Huntington chez l’adulte dans une autre rubrique. Le tiapride agit préférentiellement sur les récepteurs D2. Huntington relève de G10, pas d’une autorisation générale à traiter toutes les chorées G25.5 avec ses doses.</p><p><b>Rubrique des tics chez l’enfant.</b> La FI indique 7–12 ans : 50 mg, soit un demi-comprimé de 100 mg, deux à trois fois par jour ; à partir de 12 ans : 100 mg trois fois par jour. La borne 12 ans est partagée dans le libellé ; vérifier le schéma applicable avec le prescripteur, sans moyenne inventée. Avant six ans, ne pas utiliser ; l’intervalle 6–7 ans ne reçoit pas ici une dose déduite. Les doses initiales jusqu’à 1200 mg/jour décrites pour Huntington ne s’importent pas aux tics.</p><p><b>Rein et contre-indications.</b> La dose est une fraction de la dose normale : 25 % si clairance &lt; 10, 50 % pour 10–30 et 75 % pour 30–60 mL/min. Les bornes partagées du texte restent à clarifier cliniquement ; ne pas inventer une précision absente. Vérifier le rein chez la personne âgée. Contre-indiqué avec lévodopa, chez les patients parkinsoniens, en phéochromocytome, tumeur prolactino-dépendante, hypersensibilité et allaitement.</p><p><b>Risques.</b> QT prolongé et torsades, notamment avec bradycardie, hypokaliémie ou autres produits allongeant le QT ; interactions sédatives et hypotensives. Un syndrome malin peut être atypique : hyperthermie ou suspicion impose interruption rapide sous surveillance médicale. Grossesse et absence de contraception efficace : utilisation déconseillée, sauf nécessité absolue évaluée. Les effets extrapyramidaux ou endocriniens du médicament lui-même doivent aussi être recherchés.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-EXAM — Physical examination et examen multiforme</a>.</p></section>
<section class="ilot" id="g25-p-ferinject" ><h2>Carboxymaltose ferrique — Ferinject, FI juin 2025</h2><p><b>Indication.</b> Carence martiale adulte confirmée biologiquement lorsque le fer oral est insuffisamment efficace, impossible ou intoléré. Le diagnostic de jambes sans repos ne suffit pas. La formulation contient <b>50 mg de fer/mL</b> et se donne uniquement par voie intraveineuse selon les modalités prévues, jamais par voie sous-cutanée ou intramusculaire.</p><table class="t"><thead><tr><th>Modalité</th><th>Plafond et contrôle</th></tr></thead><tbody><tr><td>Injection IV</td><td>Dose unique ≤ 15 mg de fer/kg et ≤ 1000 mg</td></tr><tr><td>Perfusion IV</td><td>Dose unique ≤ 20 mg de fer/kg et ≤ 1000 mg ; dilution selon FI dans NaCl 0,9 %</td></tr><tr><td>Cumul</td><td>Maximum 1000 mg de fer par semaine ; administrations supplémentaires séparées d’au moins une semaine selon besoin</td></tr><tr><td>Hémodialyse chronique</td><td>Maximum 200 mg injectés une fois par jour</td></tr><tr><td>Surveillance</td><td>Personnel et réanimation disponibles ; observer pendant et au moins 30 minutes après chaque administration</td></tr></tbody></table><p><b>Précautions.</b> Hypersensibilité grave au fer parentéral, surcharge, anémie non ferriprive confirmée et premier trimestre de grossesse sont des contre-indications. Au deuxième/troisième trimestre, indication stricte et surveillance materno-fœtale adaptée. Infections, foie et extravasation demandent vigilance. Des hypophosphatémies parfois symptomatiques avec ostéomalacie/fractures sont rapportées ; contrôler le phosphate dans les situations à risque ou traitements répétés prolongés et réévaluer si persistance.</p><p><b>Âge et suivi.</b> Non approuvé pour 1–18 ans dans cette FI, sans recommandation posologique ; avant un an, non recommandé. Des essais pédiatriques décrits ne sont pas une autorisation. Réévaluer l’hémoglobine au plus tôt quatre semaines après la dernière dose ; le texte RLS propose une réévaluation clinique/martiale à douze semaines. La quantité totale dépend du besoin individuel, du poids et de l’hémoglobine, pas d’un forfait « 1 g pour tout RLS ».</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-IRON — Résumé et section Iron/Intravenous Iron</a>.</p></section>
<section class="ilot" id="g25-p-causal" ><h2>Populations et situations : ne pas transposer un schéma</h2><p><b>Enfant/adolescent.</b> Le diagnostic de jambes sans repos utilise les cinq critères avec les mots et le développement de l’enfant. Aucun médicament adulte RLS n’est automatiquement approuvé à cet âge ; vérifier chaque FI. Ferinject ne reçoit pas une dose pédiatrique extrapolée, et la rubrique Tiapridal des tics ne devient pas un traitement universel des mouvements de l’enfant.</p><p><b>Grossesse/allaitement.</b> Le besoin de soins et les risques de maladie ou de sevrage s’évaluent avec la spécialiste ; ni arrêt brutal général, ni maintien sans vérification. Primidone et induction contraceptive, prégabaline et risques fœtaux, pramipexole et inhibition de prolactine, clonazépam et effets néonataux ont des implications différentes. Ferinject est contre-indiqué au premier trimestre ; un seuil de discussion du fer RLS ne lève pas cette contre-indication.</p><p><b>Rein/âge et associations.</b> Lyrica actuel exclut l’utilisation à clairance &lt; 30 ; Keppra et Tiapridal possèdent des tables propres ; Sifrol RLS avec insuffisance rénale est peu étudié et l’hémodialyse est contre-indiquée. Rivotril a d’autres limites, notamment respiratoires et hépatiques. Somnolence, chutes, opioïdes et dépresseurs centraux doivent être revus sans addition automatique de traitements.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680178850145" target="_blank" rel="noopener">FI-MYSOLINE — Indications, début épilepsie, organes, interactions/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, galénique/dose/adaptations, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680377570127" target="_blank" rel="noopener">FI-RIVOTRIL — Indications/voies/forme orale, organes, dépendance/reproduction/mécanisme</a>.</p></section>
<section class="ilot" id="g25-p-calculation" ><h2>Calculs : le volume suit une dose et un produit déjà choisis</h2><p><b>Exercices fictifs, sans choix de prescription.</b> Une ordonnance déjà vérifiée demande 0,5 mg de Rivotril par voie orale avec les gouttes identifiées. À 0,1 mg/goutte : 0,5 ÷ 0,1 = <b>5 gouttes</b>. À 2,5 mg/mL : 0,5 ÷ 2,5 = <b>0,2 mL</b>. Cette égalité décrit le produit oral et son dispositif ; elle n’autorise pas d’utiliser le concentré injectable ni de choisir une dose pour toute myoclonie.</p><p>Une quantité déjà retenue de 500 mg de fer sous Ferinject correspond à 500 ÷ 50 = <b>10 mL de produit</b>, avant une éventuelle dilution de perfusion. Le volume final de perfusion est une autre grandeur. Pour illustrer les plafonds d’une personne de 40 kg : 15 × 40 = 600 mg maximum par injection ; 20 × 40 = 800 mg maximum par perfusion, chacun restant soumis au plafond absolu de 1000 mg, au besoin total et au cumul hebdomadaire. Un maximum n’est pas une dose à administrer par défaut.</p><p>Le pramipexole utilise une autre vérification : la force de 0,125 mg de sel correspond à 0,088 mg de base dans cette présentation. Ce ne sont pas deux doses interchangeables numériquement. Ne pas harmoniser les arrondis de différentes rubriques ou formulations par une règle de trois générale ; relire le produit exact.</p><p>Avant administration : personne, indication, produit, voie, unité, concentration, dose, volume et contrôles. Après : bénéfice fonctionnel et tolérance. Le calcul arithmétique peut être juste alors que l’indication, la formulation ou la population est fausse.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680377570127" target="_blank" rel="noopener">FI-RIVOTRIL — Indications/voies/forme orale, organes, dépendance/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a>.</p></section>
</div></div></div></template>

<template data-pop="g25-definition" data-title="Un groupe de troubles, pas une maladie unique"><p>G25 rassemble plusieurs phénomènes : tremblement, myoclonies, certaines chorées et certains tics, jambes sans repos et autres troubles précisés. Le même terme administratif ne choisit pas le traitement.</p><p>Décrire le mouvement et son contexte, rechercher une cause et une urgence, puis choisir le code applicable. Certaines maladies ou symptômes ressemblants sont classés ailleurs.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G25 et G25.0/.1/.2/.3/.4/.5/.6/.8/.80/.81/.88/.9</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a>.</p></template>
<template data-pop="g25-phenotype" data-title="Phénotype : ce que l’on observe"><p>Préciser type de mouvement, rythme, durée, régions, côté, conditions d’activation, chronologie et signes associés. Ajouter les symptômes que l’examen ne peut voir, comme besoin de bouger ou gêne sensitive.</p><p>Le phénotype oriente les examens mais n’établit pas toujours la cause. Une même étiologie peut produire plusieurs profils et plusieurs causes peuvent produire un profil proche.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a>.</p></template>
<template data-pop="g25-etiology" data-title="Cause : relier des arguments concordants"><p>Histoire familiale et médicale, médicaments, événements et signes associés permettent de cibler une hypothèse. Début aigu et confusion ne s’explorent pas comme une oscillation bilatérale stable depuis des années.</p><p>La famille négative ne supprime pas toute hérédité ; une association médicamenteuse n’est pas toujours une preuve d’imputabilité. Expliquer ce qui est certain, probable et encore à chercher.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a>.</p></template>
<template data-pop="g25-rest" data-title="Repos réellement soutenu"><p>Pour caractériser un tremblement de repos, le membre doit être relâché et soutenu ; une main tenue en l’air maintient déjà une activité posturale. Décrire la condition de l’observation.</p><p>Un tremblement de repos ne suffit pas à lui seul à diagnostiquer Parkinson. Les autres signes, médicaments et contexte restent indispensables.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/tremor/" target="_blank" rel="noopener">CH-USZ-TREMOR — Définition, activation, causes, anamnèse et examen</a>.</p></template>
