<template data-pop="g25-posture" data-title="Maintien de posture et mouvement"><p>Le tremblement postural apparaît lors d’un maintien contre la gravité ; le cinétique pendant le mouvement. Comparer aussi une tâche précise, car certaines manifestations dépendent d’une action ou d’une position.</p><p>Cette description prépare une hypothèse de syndrome. Elle ne prouve pas à elle seule une cause essentielle, médicamenteuse ou cérébelleuse.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a>.</p></template>
<template data-pop="g25-intention" data-title="Oscillation à l’approche d’une cible"><p>Le tremblement d’intention augmente typiquement lors de l’approche d’un but, par exemple au doigt-nez. Chercher les autres signes de coordination et distinguer une dysmétrie sans oscillation.</p><p>Un syndrome cérébelleux justifie une recherche de cause structurale, notamment par imagerie selon la recommandation. Toutes les intentions ne prouvent pas une même lésion ni un même traitement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-CEREB — p81–82, syndrome cérébelleux</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/tremor/" target="_blank" rel="noopener">CH-USZ-TREMOR — Définition, activation, causes, anamnèse et examen</a>.</p></template>
<template data-pop="g25-essential" data-title="Critères du tremblement essentiel"><p>La recommandation DGN/SNG 2022 décrit tremblement d’action bilatéral des membres supérieurs depuis au moins trois ans, sans autre syndrome neurologique défini. Une famille atteinte ou un effet de l’alcool peut soutenir mais n’est pas obligatoire.</p><p>Moins de trois ans : chercher notamment médicaments et hyperthyroïdie, documenter et réévaluer. Ce n’est pas une instruction d’attendre sans soins, ni une invitation à utiliser l’alcool.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a>.</p></template>
<template data-pop="g25-etplus" data-title="Essentiel plus : des signes discrets"><p>La catégorie essentiel plus décrit des signes supplémentaires discrets insuffisants pour établir un autre syndrome, par exemple anomalies légères de marche en tandem ou signes dystoniques douteux.</p><p>Un parkinsonisme, une ataxie ou une dystonie clairement établis ne sont pas simplement absorbés dans cette étiquette. Décrire et réévaluer ; les études historiques regroupaient souvent ces profils.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a>.</p></template>
<template data-pop="g25-drug" data-title="Médicament : dose, durée et chronologie"><p>Reprendre les médicaments réellement pris, ceux reçus ailleurs, changements et arrêts. Antagonistes dopaminergiques, certains antiémétiques, agents dopaminergiques et de nombreuses autres substances peuvent contribuer.</p><p>Revoir la cause avec le prescripteur avant d’empiler des traitements. Un arrêt brutal peut être dangereux pour certains traitements ; une toxicité grave relève d’une prise en charge urgente adaptée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-AKA — Akathisie et tremblement médicamenteux</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-URG — Syndromes sérotoninergique et malin des antipsychotiques</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, galénique/dose/adaptations, sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-frequency" data-title="La fréquence aide sans décider seule"><p>Une fréquence est un nombre d’oscillations par seconde. Plusieurs syndromes ont des plages qui se chevauchent ; la condition, le rythme, l’amplitude et les signes associés restent nécessaires.</p><p>Le profil rapide 13–18 Hz cohérent debout caractérise une situation particulière, le tremblement orthostatique primaire. On ne l’étend pas à tous les tremblements ou à toute instabilité.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a>.</p></template>
<template data-pop="g25-functional" data-title="Signes positifs d’un tremblement fonctionnel"><p>Variabilité, modification par distraction et entraînement à une tâche rythmique controlatérale peuvent soutenir le diagnostic dans un ensemble concordant. Le spécialiste explique les signes et le raisonnement.</p><p>Une anxiété, une IRM normale ou un seul signe ne suffit pas. Une autre maladie neurologique peut coexister, et trouble fonctionnel n’est pas synonyme de simulation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-FUNC — p98–99, signes positifs et explication</a>.</p></template>
<template data-pop="g25-orthostatic" data-title="Instabilité liée à la station debout"><p>Le tremblement orthostatique primaire survient dans les jambes debout, avec activité typique 13–18 Hz et cohérence élevée ; la station assise, couchée ou la marche peuvent soulager. L’examen et l’EMG doivent reproduire la condition avec sécurité.</p><p>Formes lentes et myoclonies orthostatiques sont distinctes. Ce n’est pas un diagnostic de jambes sans repos, ni une hypotension supposée sans évaluation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MIMIC — Table2 et diagnostics différentiels</a>.</p></template>
<template data-pop="g25-positive" data-title="Myoclonie positive"><p>Une contraction brève produit une secousse. Sa distribution, sa relation à l’action ou aux stimuli, et son évolution renseignent ; plusieurs niveaux de générateurs sont possibles.</p><p>La rythmicité n’est pas toujours absente et l’épilepsie n’est pas obligatoire. L’étiologie et, si nécessaire, la neurophysiologie déterminent la suite.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a>.</p></template>
<template data-pop="g25-negative" data-title="Myoclonie négative et astérixis"><p>Une interruption brève d’une activité musculaire en cours fait céder une posture. L’astérixis en est un exemple, notamment dans un contexte toxique ou métabolique.</p><p>Toutes les myoclonies négatives ne s’appellent pas astérixis. Distinguer interruption, faiblesse persistante et oscillation ; une confusion nouvelle impose une recherche urgente de cause.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a>.</p></template>
<template data-pop="g25-emg" data-title="Électromyographie de surface"><p>Des électrodes enregistrent les bouffées musculaires, leur durée et leurs relations. Choisir les muscles et la condition qui reproduit le phénomène est essentiel.</p><p>Durées et rythmes se chevauchent ; l’enregistrement ne livre pas seul la cause. Des techniques complémentaires et l’examen clinique sont parfois nécessaires.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a>.</p></template>
<template data-pop="g25-eeg" data-title="Coupler cerveau et muscles"><p>Un EEG–EMG simultané recherche la relation temporelle entre secousse et activité corticale. Un rétromoyennage peut rendre visible un signal discret avec suffisamment d’événements de qualité.</p><p>Artefacts, médicaments et échantillonnage limitent l’interprétation. Un EEG bref normal n’exclut pas toutes les crises ni tous les générateurs corticaux ; G25.3 exclut l’épilepsie myoclonique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a>.</p></template>
<template data-pop="g25-chorea" data-title="Chorée : un profil irrégulier"><p>Mouvements rapides, imprévisibles et irréguliers, parfois intégrés dans un geste apparemment volontaire. L’examen cherche aussi signes neurologiques, systémiques et histoire familiale.</p><p>Causes acquises, métaboliques, médicamenteuses et héréditaires sont possibles. Huntington et Sydenham ont des codes distincts ; une dose de traitement de Huntington ne devient pas un traitement de toutes les chorées.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-tic" data-title="Tic : besoin et suppression variables"><p>Tics moteurs ou vocaux, brefs et récurrents, souvent avec tension prémonitoire et possibilité de suppression transitoire. Ces caractéristiques varient selon âge et sévérité.</p><p>Ni absence de besoin rapporté chez un enfant ni suppression au cabinet ne tranche toute la question. Rechercher retentissement, comorbidités et causes ; Tourette ne relève pas de G25.6.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-DX — Phénoménologie et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-EXAM — Physical examination et examen multiforme</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a>.</p></template>
<template data-pop="g25-akathisia" data-title="Akathisie : une agitation à reconnaître"><p>Difficulté à rester assis ou immobile, avec besoin de bouger et agitation intérieure. Le lien avec médicament et évolution aide à distinguer ce phénomène d’une simple anxiété ou de jambes sans repos.</p><p>La prédominance soir/nuit et le profil sensoriel du RLS ne sont pas obligatoires dans l’akathisie. Revoir la cause et la dose avec l’équipe ; les adjuvants ont des preuves et des risques variables.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-AKA — Akathisie et tremblement médicamenteux</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MIMIC — Table2 et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-rls" data-title="Jambes sans repos : diagnostic clinique"><p>Le besoin de bouger au repos, soulagé par mouvement et à prédominance soir/nuit doit satisfaire les cinq critères, dont l’absence d’explication intégrale par une autre condition.</p><p>Une polysomnographie n’est pas obligatoire pour ce diagnostic. Crampes, neuropathie, gêne articulaire ou positionnelle peuvent imiter ou coexister ; distinguer les plaintes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MIMIC — Table2 et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://www.hug.ch/laboratoire-du-sommeil/syndrome-jambes-sans-repos" target="_blank" rel="noopener">CH-HUG-RLS — Page clinique complète, symptômes et PLMS</a>.</p></template>
<template data-pop="g25-criteria" data-title="Les cinq critères ensemble"><p>Besoin de bouger ; début ou aggravation au repos ; soulagement au moins partiel tant que le mouvement continue ; prédominance soir/nuit ; manifestations non entièrement expliquées par une autre condition.</p><p>Un score de sévérité n’est pas un diagnostic autonome. L’interview et les mots du patient, adaptés au développement chez l’enfant, restent nécessaires.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a>.</p></template>
<template data-pop="g25-plms" data-title="Mouvements périodiques et trouble du sommeil"><p>Les mouvements périodiques pendant le sommeil peuvent accompagner les jambes sans repos. Ils sont observés par un enregistrement du sommeil et ne sont pas la même chose qu’une envie consciente de bouger.</p><p>Un index polysomnographique seul ne suffit pas à définir une maladie PLMD à traiter. Le contexte, les plaintes et les autres troubles du sommeil doivent être pris en compte.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://doi.org/10.1007/s10072-026-09487-2" target="_blank" rel="noopener">EU-RLS-2026 — Résumé primaire viaEuropePMC seulement</a> ; <a data-reference-source="1" href="https://www.hug.ch/laboratoire-du-sommeil/syndrome-jambes-sans-repos" target="_blank" rel="noopener">CH-HUG-RLS — Page clinique complète, symptômes et PLMS</a>.</p></template>
<template data-pop="g25-iron" data-title="Fer : indication et bilan"><p>Numération, ferritine et saturation de la transferrine sont utiles dans la démarche RLS. La recommandation discute supplémentation selon tableau clinique et bilan.</p><p>Ferinject exige une carence adulte confirmée et un oral insuffisamment efficace, impossible ou intoléré. Un code RLS ne suffit pas à administrer automatiquement du fer intraveineux.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-IRON — Résumé et section Iron/Intravenous Iron</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a>.</p></template>
<template data-pop="g25-ferritin" data-title="Ferritine : un seuil contextualisé"><p>La recommandation RLS 2024 utilise autour de 75 µg/L pour discuter le fer, avec des formulations ≤ dans le résumé et < dans le corps du texte. La saturation et le contexte complètent la lecture.</p><p>Ce n’est ni une mesure directe du fer cérébral ni une norme universelle suisse. Aux bornes, ne pas fabriquer une précision absente et vérifier l’ensemble du bilan et du produit envisagé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-IRON — Résumé et section Iron/Intravenous Iron</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MECH — Pathophysiology et comorbidités</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a>.</p></template>
<template data-pop="g25-augmentation" data-title="Augmentation sous dopaminergique"><p>Début des symptômes avancé d’environ deux heures, propagation, intensité accrue ou effet plus court. La chronologie comparée au début du traitement est importante.</p><p>Ne pas augmenter automatiquement la dose. Revoir fer, imitateurs et traitement avec expertise ; un agoniste chronique peut devoir être réduit très lentement pour éviter un syndrome de sevrage.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-prami" data-title="Pramipexole immédiat et RLS"><p>La FI Sifrol prévoit 0,125 mg de sel une fois par jour deux à trois heures avant coucher, puis paliers de 0,125 mg tous les quatre à sept jours si besoin, maximum RLS 0,75 mg/jour et dose la plus faible utile.</p><p>La forme ER et les plafonds Parkinson ne s’importent pas au RLS. Vérifier rein, augmentation, somnolence/endormissement subit et pulsions ; l’hémodialyse est contre-indiquée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-base" data-title="Sel et base : deux écritures à identifier"><p>Dans la présentation lue, 0,125 mg de pramipexole sous forme de sel correspond à 0,088 mg de base. Les nombres du schéma RLS de ce cours sont exprimés en sel.</p><p>Une source étrangère ou une autre rubrique peut employer la base et des arrondis différents. Vérifier chaque force et formulation ; ne pas remplacer numériquement un nombre par l’autre ni harmoniser tous les arrondis.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-primidone" data-title="Primidone : usage et galénique"><p>La DGN/SNG recommande la primidone pour l’essentiel, hors indication de la FI Mysoline qui concerne l’épilepsie. La tolérance initiale peut être mauvaise même à faible dose.</p><p>Le comprimé suisse de 250 mg est demi-sécable ; un très faible début discuté dans la guideline exige une formulation vérifiée, pas une division inventée. Risques de sédation, ataxie, induction et reproduction à expliquer.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-TX — p5–6 et20–21, propranolol/primidone</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680178850145" target="_blank" rel="noopener">FI-MYSOLINE — Indications, début épilepsie, organes, interactions/reproduction et mécanisme</a>.</p></template>
<template data-pop="g25-pregabalin" data-title="Prégabaline : efficacité discutée et FI suisse"><p>Les indications Lyrica sont adultes et ne comprennent pas le RLS. La recommandation RLS décrit un usage hors indication ; le résumé italien 2026, dérivé de recommandations américaines, ne change pas ce statut.</p><p>La FI juillet 2026 exclut l’utilisation si clairance < 30 mL/min. Vérifier somnolence, dépendance et risque respiratoire avec opioïdes ; arrêt progressif individualisé sur semaines ou mois.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-TX — Recommandations thérapeutiques et Pregabalin</a> ; <a data-reference-source="1" href="https://doi.org/10.1007/s10072-026-09487-2" target="_blank" rel="noopener">EU-RLS-2026 — Résumé primaire viaEuropePMC seulement</a>.</p></template>
<template data-pop="g25-sps" data-title="Syndrome de la personne raide"><p>Raideur axiale/proximale, spasmes déclenchés et retentissement sur marche/chutes orientent. Le spectre peut être associé à une auto-immunité, mais le diagnostic relève d’un faisceau clinique spécialisé.</p><p>Électrophysiologie, anticorps et recherche de contexte auto-immun ou tumoral se discutent. Traitement symptomatique et immunitaire sont individualisés, avec preuves limitées pour plusieurs options.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-MECH — Introduction et physiopathologie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-TX — Méthode, discussion, table2 et limites</a>.</p></template>
<template data-pop="g25-gad" data-title="GAD65 : enzyme et anticorps"><p>GAD2 code une glutamate décarboxylase, isoforme GAD65, participant à la synthèse du GABA. Des anticorps anti-GAD65 sont associés à plusieurs contextes, dont certaines formes de personne raide.</p><p>Un résultat positif isolé ne constitue pas le diagnostic neurologique. Titre, clinique, électrophysiologie et parfois liquide cérébrospinal importent. L’immunomarquage PCP4 montré dans ce cours est différent.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/Q05329.txt" target="_blank" rel="noopener">NORMAL-GAD2 — Fonction, catalyse, cofacteur</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:PCP4_immunohistochemistry_in_human_cerebellum.jpg" target="_blank" rel="noopener">IMG-PURKINJE — Description, provenance, droits propres et original réellement vus</a>.</p></template>
<template data-pop="g25-urgent" data-title="Urgence : les signes associés changent le circuit"><p>Début soudain avec déficit, confusion, convulsions ou trouble respiratoire exige une évaluation immédiate. Après médicaments, fièvre, rigidité ou clonus et instabilité autonome font rechercher une toxicité grave.</p><p>Un syndrome malin peut être atypique, sans rigidité nette ou avec fièvre modérée. Ne pas attendre tous les critères ; sécuriser et traiter avec l’équipe, en retrouvant produits, doses et chronologie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-URG — Syndromes sérotoninergique et malin des antipsychotiques</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-follow" data-title="Suivi : fonction et sécurité"><p>Répéter une tâche utile dans des conditions comparables, demander sommeil, autonomie, chutes et vécu. Documenter traitements et effets indésirables, pas seulement amplitude du mouvement.</p><p>Une réponse symptomatique ne prouve pas la cause. Nouveaux signes, symptômes plus précoces sous agoniste ou perte de tolérance imposent une réévaluation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-TX — Méthode, discussion, table2 et limites</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-calculation" data-title="Dose déjà choisie, volume vérifié"><p>Pour les gouttes orales Rivotril à 0,1 mg/goutte, une quantité déjà prescrite de 0,5 mg correspond à cinq gouttes. Pour Ferinject à 50 mg de fer/mL, 500 mg correspondent à 10 mL de produit avant dilution.</p><p>L’arithmétique ne choisit pas indication, dose, voie ou personne. Rivotril injectable est une autre formulation ; Ferinject injection et perfusion ont des plafonds en mg/kg différents, avec cumul hebdomadaire et surveillance.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680377570127" target="_blank" rel="noopener">FI-RIVOTRIL — Indications/voies/forme orale, organes, dépendance/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a>.</p></template>

<template data-pop="g25-exp-1" data-title="Comprendre — point 1"><p><b>Raisonnement.</b> Exemple : une épilepsie juvénile myoclonique peut relever d’une indication Keppra, mais la nomenclature l’exclut de G25.3. Une indication de médicament ne doit donc pas être utilisée pour fabriquer le code.</p><p>Décrire le phénomène puis sa cause ; respecter les exclusions OFS avant de coder.</p><p>Un  trouble du mouvement  se décrit avant de recevoir une étiquette étiologique. Le  phénotype  précise rythme, durée, distribution, conditions de survenue et signes associés. Un tremblement oscille ; une myoclonie est une secousse brève ou une interruption de contraction ; une chorée est irrégulière et imprévisible ; un tic peut s’accompagner d’un besoin prémonitoire et d’une suppression transitoire.</p><p>G25.8 est subdivisé dans cette version suisse ; aucun G25.82 emprunté à une autre nomenclature n’est ajouté. Une cause médicamenteuse peut demander un code externe supplémentaire selon la note. La conclusion clinique et l’imputabilité précèdent ce choix ; une indication de médicament ne détermine pas à elle seule le code.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G25 et G25.0/.1/.2/.3/.4/.5/.6/.8/.80/.81/.88/.9</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-DX — Phénoménologie et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a>.</p></template>
<template data-pop="pareto-g25-1" data-title="Essentiel — point 1"><p>Décrire le phénomène puis sa cause ; respecter les exclusions OFS avant de coder.</p><div class="key"><b>À retenir.</b> Décrire, contextualiser et choisir une décision qui change les soins.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G25 et G25.0/.1/.2/.3/.4/.5/.6/.8/.80/.81/.88/.9</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-DX — Phénoménologie et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a>.</p></template>
<template data-pop="g25-exp-2" data-title="Comprendre — point 2"><p><b>Raisonnement.</b> Une statistique sur un syndrome défini dans une cohorte ne s’additionne pas aux fréquences d’autres symptômes qui peuvent coexister. Donner population, méthode et date évite une fausse estimation nationale.</p><p>G25 réunit des populations différentes ; aucune fréquence unique ne décrit le groupe.</p><p>Le tremblement essentiel compte parmi les tremblements les plus fréquents. Il peut commencer jeune, être familial et devenir plus gênant avec l’âge ; le mot « sénile » ne suffit donc pas à le définir. La source suisse USZ, actualisée le 16 avril 2026, décrit cette diversité sans fournir une enquête nationale récente couvrant tous les codes G25.</p><p>Les autres groupes sont très différents. Les myoclonies peuvent être physiologiques à l’endormissement ou révéler une maladie aiguë ou chronique. Les tics ont des profils liés au développement et à leur cause. Le syndrome de la personne raide est rare ; les séries thérapeutiques sont petites. Additionner ces catégories ne donne ni une incidence de maladie unique ni un risque individuel fiable.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.usz.ch/krankheit/tremor/" target="_blank" rel="noopener">CH-USZ-TREMOR — Définition, activation, causes, anamnèse et examen</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-EXAM — Physical examination et examen multiforme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-TX — Méthode, discussion, table2 et limites</a>.</p></template>
<template data-pop="pareto-g25-2" data-title="Essentiel — point 2"><p>G25 réunit des populations différentes ; aucune fréquence unique ne décrit le groupe.</p><div class="key"><b>À retenir.</b> Décrire, contextualiser et choisir une décision qui change les soins.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.usz.ch/krankheit/tremor/" target="_blank" rel="noopener">CH-USZ-TREMOR — Définition, activation, causes, anamnèse et examen</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-EXAM — Physical examination et examen multiforme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-TX — Méthode, discussion, table2 et limites</a>.</p></template>
<template data-pop="g25-exp-3" data-title="Comprendre — point 3"><p><b>Raisonnement.</b> Une myoclonie positive ajoute une activité ; une négative interrompt un maintien. Cette différence conduit à des enregistrements et causes possibles distincts, pas simplement à une graduation de sévérité.</p><p>Générateur, circuit et effecteur expliquent des signes distincts sans mécanisme universel.</p><p>La commande volontaire et sa régulation mobilisent plusieurs structures nerveuses. Une secousse peut venir d’un générateur cortical, sous-cortical, segmentaire ou périphérique ; son aspect seul ne localise pas toujours ce générateur. Le tremblement se décrit selon ses conditions d’activation et sa cause, sans attribuer tous les syndromes à un déficit dopaminergique unique.</p><p>La  myoclonie positive  correspond à une activation musculaire brève ; la  myoclonie négative  à une interruption brève de l’activité qui maintient une posture. L’astérixis en est un exemple, notamment dans un contexte toxique ou métabolique, sans être le synonyme de toutes les myoclonies négatives.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MECH — Pathophysiology et comorbidités</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-MECH — Introduction et physiopathologie</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/10-3-muscle-fiber-contraction-and-relaxation" target="_blank" rel="noopener">NORMAL-MUSCLE — Paragraphes contraction/relaxation réouverts après extraction ciblée</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Basal-ganglia-coronal-sections.png" target="_blank" rel="noopener">IMG-BASAL — Description, provenance, droits propres et original réellement vus</a>.</p></template>
<template data-pop="pareto-g25-3" data-title="Essentiel — point 3"><p>Générateur, circuit et effecteur expliquent des signes distincts sans mécanisme universel.</p><div class="key"><b>À retenir.</b> Décrire, contextualiser et choisir une décision qui change les soins.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MECH — Pathophysiology et comorbidités</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-MECH — Introduction et physiopathologie</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/10-3-muscle-fiber-contraction-and-relaxation" target="_blank" rel="noopener">NORMAL-MUSCLE — Paragraphes contraction/relaxation réouverts après extraction ciblée</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Basal-ganglia-coronal-sections.png" target="_blank" rel="noopener">IMG-BASAL — Description, provenance, droits propres et original réellement vus</a>.</p></template>
<template data-pop="g25-exp-4" data-title="Comprendre — point 4"><p><b>Raisonnement.</b> Confusion et secousses nouvelles après modification médicamenteuse changent la priorité. Décrire précisément le phénomène reste utile, mais ne doit pas retarder une recherche toxique ou métabolique urgente.</p><p>Sécurité et cause traitable précèdent la classification complète.</p><p>La fenêtre  urgence et médicaments  relie les signes au circuit de soins. Fièvre, trouble mental et instabilité autonome avec rigidité ou clonus peuvent évoquer une toxicité grave. Une forme atypique de syndrome malin peut être dépourvue de rigidité nette ou n’avoir qu’une fièvre modérée : ne pas attendre tous les signes avant d’agir.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, lignes1404–1406 du texte extrait réouvert</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-URG — Syndromes sérotoninergique et malin des antipsychotiques</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></template>
<template data-pop="pareto-g25-4" data-title="Essentiel — point 4"><p>Sécurité et cause traitable précèdent la classification complète.</p><div class="key"><b>À retenir.</b> Décrire, contextualiser et choisir une décision qui change les soins.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, lignes1404–1406 du texte extrait réouvert</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-URG — Syndromes sérotoninergique et malin des antipsychotiques</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></template>
<template data-pop="g25-exp-5" data-title="Comprendre — point 5"><p><b>Raisonnement.</b> Demander dernière prise, forme et évolution après chaque changement permet de tester une hypothèse. Une ordonnance ne prouve pas ce qui a réellement été administré, et une association temporelle reste à interpréter.</p><p>Une chronologie des symptômes et des prises réelles vaut mieux qu’une simple liste.</p><p>Reconstituer première région atteinte, âge de début, installation aiguë, subaiguë ou progressive, fluctuations et retentissement. Demander une  histoire étiologique  : maladies rénales, hépatiques, thyroïdiennes, neurologiques ou auto-immunes, événements vasculaires et histoire familiale. Une histoire familiale négative n’exclut pas une cause héréditaire.</p><p>La  revue médicamenteuse  comprend prescriptions, automédication, traitements reçus ailleurs, changements de dose, arrêts et dernières prises. Neuroleptiques, antiémétiques, agents dopaminergiques, lithium et plusieurs autres produits peuvent contribuer à des mouvements anormaux. Une association temporelle suggère une piste ; elle ne prouve pas toute imputabilité.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-DX — Phénoménologie et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-EXAM — Physical examination et examen multiforme</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></template>

<template data-pop="g25-exp-6" data-title="Comprendre — point 6"><p><b>Raisonnement.</b> Une main non soutenue n’est pas véritablement au repos. Une oscillation près d’une cible et une dysmétrie sans oscillation doivent être nommées séparément pour que la question d’imagerie soit correcte.</p><p>Comparer repos soutenu, maintien, action et signes associés avec sécurité.</p><p>Observer au  repos réellement soutenu , puis en  maintien de posture  et pendant l’action. Décrire côté, distribution, amplitude, régularité et signes associés. Lors du doigt-nez, une oscillation croissant à l’approche de la cible évoque un  tremblement d’intention  ; une erreur de visée sans oscillation est une dysmétrie, à décrire séparément.</p><p>Examiner force, tonus, réflexes, coordination, nerfs crâniens, sensibilité, marche et équilibre. Une secousse distale à l’action, une interruption de maintien ou un mouvement choréique demandent des descriptions différentes. Pour une instabilité uniquement debout, sécuriser l’examen et discuter un enregistrement musculaire dans cette position ; une mesure assise peut manquer le phénomène.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, lignes1404–1406 du texte extrait réouvert</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-CEREB — p81–82, syndrome cérébelleux</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-FUNC — p98–99, signes positifs et explication</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">IMG-MOTOR — Description, provenance, droits propres et original réellement vus</a>.</p></template>
<template data-pop="pareto-g25-6" data-title="Essentiel — point 6"><p>Comparer repos soutenu, maintien, action et signes associés avec sécurité.</p><div class="key"><b>À retenir.</b> Décrire, contextualiser et choisir une décision qui change les soins.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, lignes1404–1406 du texte extrait réouvert</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-CEREB — p81–82, syndrome cérébelleux</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-FUNC — p98–99, signes positifs et explication</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">IMG-MOTOR — Description, provenance, droits propres et original réellement vus</a>.</p></template>
<template data-pop="g25-exp-7" data-title="Comprendre — point 7"><p><b>Raisonnement.</b> L’envie de bouger au repos le soir relève d’un entretien clinique ; une activité rapide des jambes uniquement debout demande un autre raisonnement. Le soulagement par mouvement n’unifie pas toutes ces plaintes.</p><p>Oscillation, secousse, chorée, tic, agitation et spasme ne sont pas synonymes.</p><p>Le tremblement  orthostatique primaire  est une forme particulière documentée par électromyographie debout, typiquement 13–18 Hz avec forte cohérence. La  fréquence  d’un tremblement ordinaire, seule, ne permet pas de conclure à une cause. L’ akathisie  et les  mouvements périodiques pendant le sommeil  ne se confondent pas avec une envie de bouger définissant le syndrome des jambes sans repos.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-DX — Phénoménologie et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-AKA — Akathisie et tremblement médicamenteux</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></template>
<template data-pop="pareto-g25-7" data-title="Essentiel — point 7"><p>Oscillation, secousse, chorée, tic, agitation et spasme ne sont pas synonymes.</p><div class="key"><b>À retenir.</b> Décrire, contextualiser et choisir une décision qui change les soins.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-DX — Phénoménologie et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-AKA — Akathisie et tremblement médicamenteux</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></template>
<template data-pop="g25-exp-8" data-title="Comprendre — point 8"><p><b>Raisonnement.</b> Pour les jambes sans repos, le cinquième critère évite de classer une crampe ou une gêne articulaire comme syndrome. Une affection coexistante n’exclut pas le diagnostic si ses symptômes sont distingués.</p><p>Appliquer les critères complets et dire le niveau de certitude.</p><p>Le  tremblement essentiel  est défini dans la recommandation DGN/SNG 2022 par un tremblement d’action bilatéral des membres supérieurs depuis au moins trois ans, sans autre syndrome neurologique défini. Des signes discrets peuvent relever de la catégorie  essentiel plus . Un début plus récent exige recherche de cause et réévaluation ; il n’impose pas trois ans d’attente sans soins. Famille atteinte et amélioration après alcool ne sont pas obligatoires, et l’alcool n’est pas un traitement conseillé.</p><p>Pour les  jambes sans repos ,  les cinq critères  sont requis : besoin de bouger ; début/aggravation au repos ; soulagement partiel ou total par mouvement tant qu’il continue ; prédominance soir/nuit ; manifestations non entièrement expliquées par une autre condition. La fenêtre  critères et imitateurs  précise leur application. Le diagnostic est clinique ; une polysomnographie n’est pas systématiquement nécessaire.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MIMIC — Table2 et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-DX — Phénoménologie et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.parkreldis.2024.107216" target="_blank" rel="noopener">INT-IAPRD2025 — Résumé primaire et méthode Delphi</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></template>
<template data-pop="pareto-g25-8" data-title="Essentiel — point 8"><p>Appliquer les critères complets et dire le niveau de certitude.</p><div class="key"><b>À retenir.</b> Décrire, contextualiser et choisir une décision qui change les soins.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MIMIC — Table2 et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-DX — Phénoménologie et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.parkreldis.2024.107216" target="_blank" rel="noopener">INT-IAPRD2025 — Résumé primaire et méthode Delphi</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></template>
<template data-pop="g25-exp-9" data-title="Comprendre — point 9"><p><b>Raisonnement.</b> Une mesure hors de la condition déclenchante peut manquer le phénomène. Inversement, un résultat anormal sans question précise peut produire une attribution excessive. Expliquer ce que l’examen pourra changer.</p><p>Choisir un examen capable de répondre à la question clinique.</p><p>L’ électromyographie de surface  caractérise les bouffées musculaires et leur organisation. Un  enregistrement couplé EEG–EMG  aide à rechercher une relation corticale, parfois avec rétromoyennage. Durée, rythme et corrélation doivent être interprétés ensemble ; un EEG bref normal ne tranche pas tous les épisodes ni tous les générateurs.</p><p>La biologie cherche une cause selon l’histoire : glycémie, électrolytes, fonction rénale/hépatique ou thyroïdienne, notamment. Dans les jambes sans repos, numération et bilan du fer sont recommandés au diagnostic, au début du traitement et lors d’une aggravation. Une  ferritine  ne se lit pas seule, sans saturation de la transferrine, contexte et unités.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-IRON — Résumé et section Iron/Intravenous Iron</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-CEREB — p81–82, syndrome cérébelleux</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray706.png" target="_blank" rel="noopener">IMG-CEREB — Description, provenance, droits propres et original réellement vus</a>.</p></template>
<template data-pop="pareto-g25-9" data-title="Essentiel — point 9"><p>Choisir un examen capable de répondre à la question clinique.</p><div class="key"><b>À retenir.</b> Décrire, contextualiser et choisir une décision qui change les soins.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-IRON — Résumé et section Iron/Intravenous Iron</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-CEREB — p81–82, syndrome cérébelleux</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray706.png" target="_blank" rel="noopener">IMG-CEREB — Description, provenance, droits propres et original réellement vus</a>.</p></template>
<template data-pop="g25-exp-10" data-title="Comprendre — point 10"><p><b>Raisonnement.</b> L’existence d’une neuropathie ou d’un trouble fonctionnel ne supprime pas automatiquement une autre affection. Décrire les arguments pour chaque hypothèse permet un plan de suivi plus utile que forcer une cause unique.</p><p>Comparer le profil complet et accepter que plusieurs troubles coexistent.</p><p>Les diagnostics peuvent coexister. Une neuropathie n’exclut pas des jambes sans repos si les symptômes sont distingués ; un trouble fonctionnel n’interdit pas une autre atteinte neurologique. La conclusion doit dire ce qui est démontré, ce qui est probable et ce qui reste à réévaluer.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-FUNC — p98–99, signes positifs et explication</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MIMIC — Table2 et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></template>
<template data-pop="pareto-g25-10" data-title="Essentiel — point 10"><p>Comparer le profil complet et accepter que plusieurs troubles coexistent.</p><div class="key"><b>À retenir.</b> Décrire, contextualiser et choisir une décision qui change les soins.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-FUNC — p98–99, signes positifs et explication</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MIMIC — Table2 et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></template>
<template data-pop="g25-exp-11" data-title="Comprendre — point 11"><p><b>Raisonnement.</b> Une recommandation d’efficacité et une autorisation suisse répondent à deux questions. Prégabaline pour RLS et primidone pour essentiel illustrent un usage hors indication, avec formulation, rein et risques à vérifier.</p><p>Indication, formulation et population suisses encadrent le choix thérapeutique.</p><p>Cause.  Corriger une perturbation métabolique, traiter une affection identifiée ou revoir un médicament avec le prescripteur peut modifier le mouvement. Un arrêt brusque improvisé d’agoniste dopaminergique ou d’antiépileptique expose cependant à des complications ; l’urgence toxique grave relève d’une prise en charge immédiate.</p><p>Tremblement essentiel gênant.  Propranolol et  primidone  sont des options de la recommandation DGN/SNG. Inderal a une indication suisse pour l’essentiel ; Mysoline a une FI d’épilepsie et son usage pour tremblement est hors indication. Les formulations et contre-indications guident le choix. Les techniques spécialisées s’envisagent dans des cas sélectionnés, sans indication automatique pour tous les codes G25.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-URG — Syndromes sérotoninergique et malin des antipsychotiques</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, galénique/dose/adaptations, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317060015" target="_blank" rel="noopener">FI-INDERAL — Indication/posologie ET, galénique, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680178850145" target="_blank" rel="noopener">FI-MYSOLINE — Indications, début épilepsie, organes, interactions/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/tremor/" target="_blank" rel="noopener">CH-USZ-TX — Traitement essentiel et métadonnées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-TX — Recommandations thérapeutiques et Pregabalin</a> ; <a data-reference-source="1" href="https://doi.org/10.1007/s10072-026-09487-2" target="_blank" rel="noopener">EU-RLS-2026 — Résumé primaire viaEuropePMC seulement</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-TX — Management et conclusion</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680377570127" target="_blank" rel="noopener">FI-RIVOTRIL — Indications/voies/forme orale, organes, dépendance/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-TX — Méthode, discussion, table2 et limites</a>.</p></template>
<template data-pop="pareto-g25-11" data-title="Essentiel — point 11"><p>Indication, formulation et population suisses encadrent le choix thérapeutique.</p><div class="key"><b>À retenir.</b> Décrire, contextualiser et choisir une décision qui change les soins.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-URG — Syndromes sérotoninergique et malin des antipsychotiques</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, galénique/dose/adaptations, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317060015" target="_blank" rel="noopener">FI-INDERAL — Indication/posologie ET, galénique, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680178850145" target="_blank" rel="noopener">FI-MYSOLINE — Indications, début épilepsie, organes, interactions/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/tremor/" target="_blank" rel="noopener">CH-USZ-TX — Traitement essentiel et métadonnées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-TX — Recommandations thérapeutiques et Pregabalin</a> ; <a data-reference-source="1" href="https://doi.org/10.1007/s10072-026-09487-2" target="_blank" rel="noopener">EU-RLS-2026 — Résumé primaire viaEu <template data-pop="g25-exp-12" data-title="Comprendre — point 12"><p><b>Raisonnement.</b> Si les symptômes RLS commencent plus tôt sous agoniste, une escalade peut aggraver la situation. Reprendre l’heure de début, l’extension, le fer et les imitateurs puis planifier la conduite avec expertise.</p><p>Mesurer fonction et tolérance, et rechercher augmentation sous agoniste.</p><p>Le  suivi  compare une tâche reproductible, autonomie, sommeil, douleur, chutes et effets indésirables. L’objectif n’est pas seulement une amplitude moindre : le patient doit pouvoir accomplir les activités importantes avec une tolérance acceptable. Revoir une étiologie ou un syndrome si de nouveaux signes apparaissent.</p><p>Sous dopaminergique pour jambes sans repos, rechercher l’ augmentation  : début plus précoce, propagation à d’autres régions, intensité accrue ou durée d’effet moindre. Ce n’est pas une simple carence de dose. Vérifier fer, diagnostics et conduite spécialisée plutôt qu’escalader automatiquement ; le retrait d’un agoniste chronique augmenté peut nécessiter une diminution très lente.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680377570127" target="_blank" rel="noopener">FI-RIVOTRIL — Indications/voies/forme orale, organes, dépendance/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680178850145" target="_blank" rel="noopener">FI-MYSOLINE — Indications, début épilepsie, organes, interactions/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, galénique/dose/adaptations, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-TX — Management et conclusion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-TX — Méthode, discussion, table2 et limites</a>.</p></template>
<template data-pop="pareto-g25-12" data-title="Essentiel — point 12"><p>Mesurer fonction et tolérance, et rechercher augmentation sous agoniste.</p><div class="key"><b>À retenir.</b> Décrire, contextualiser et choisir une décision qui change les soins.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680377570127" target="_blank" rel="noopener">FI-RIVOTRIL — Indications/voies/forme orale, organes, dépendance/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680178850145" target="_blank" rel="noopener">FI-MYSOLINE — Indications, début épilepsie, organes, interactions/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, galénique/dose/adaptations, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target
