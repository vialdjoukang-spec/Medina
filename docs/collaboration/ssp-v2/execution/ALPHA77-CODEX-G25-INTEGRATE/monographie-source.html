<template id="ch-G25"><div class="chap"><div class="chap-head"><div class="code">G25 · Mouvements anormaux · S08 · CIM-10-GM suisse 2024</div><h1>Autres syndromes extrapyramidaux et troubles de la motricité</h1><span class="status">Sol-Neurologie-G25 · Auto-relecture IA documentée · Sans validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie</button></div><style>[data-g25-figure]{margin:1.2em 0;padding:1em;border:1px solid #b8c8d9;border-radius:12px;background:#fff}[data-g25-frame]{position:relative;width:100%;max-width:760px;margin:auto;line-height:0}[data-g25-frame="tall"]{max-width:440px}[data-g25-figure] img{display:block;width:100%;height:auto;margin:0}[data-g25-mark]{position:absolute;transform:translate(-50%,-50%);background:#fff4be;color:#172f50;border:2px solid #172f50;border-radius:50%;width:1.6em;height:1.6em;display:flex;align-items:center;justify-content:center;font:bold 16px/1 sans-serif;box-shadow:0 0 0 2px #fff}[data-g25-figure] figcaption{line-height:1.6;margin-top:.8em;overflow-wrap:anywhere}[data-g25-figure] ol{padding-left:1.5em}[data-g25-credit]{font-size:.85em}@media(max-width:600px){[data-g25-mark]{font-size:12px;width:1.4em;height:1.4em;box-shadow:0 0 0 1px #fff}}[data-g25-figure="basal"] [data-g25-mark="1"]{left:35%;top:55%}[data-g25-figure="basal"] [data-g25-mark="2"]{left:19%;top:62%}[data-g25-figure="basal"] [data-g25-mark="3"]{left:67%;top:62%}[data-g25-figure="basal"] [data-g25-mark="4"]{left:77%;top:66%}[data-g25-figure="motor"] [data-g25-mark="1"]{left:64%;top:13%}[data-g25-figure="motor"] [data-g25-mark="2"]{left:54%;top:25%}[data-g25-figure="motor"] [data-g25-mark="3"]{left:40%;top:61%}[data-g25-figure="spinal"] [data-g25-mark="1"]{left:50%;top:27%}[data-g25-figure="spinal"] [data-g25-mark="2"]{left:42%;top:51%}[data-g25-figure="spinal"] [data-g25-mark="3"]{left:63%;top:75%}[data-g25-figure="cereb"] [data-g25-mark="1"]{left:59%;top:27%}[data-g25-figure="cereb"] [data-g25-mark="2"]{left:40%;top:12%}[data-g25-figure="cereb"] [data-g25-mark="3"]{left:53%;top:51%}[data-g25-figure="cereb"] [data-g25-mark="4"]{left:76%;top:83%}[data-g25-figure="histo"] [data-g25-mark="1"]{left:36.5%;top:16.4%}[data-g25-figure="histo"] [data-g25-mark="2"]{left:47%;top:41.8%}[data-g25-figure="histo"] [data-g25-mark="3"]{left:27%;top:81%}</style><div class="panel" id="pA"><nav class="toc ui"><b>Plan monographique</b><ol><li><a href="#g25-1">Définition</a></li><li><a href="#g25-2">Épidémiologie</a></li><li><a href="#g25-3">Physiopathologie</a></li><li><a href="#g25-4">Démarche clinique</a></li><li><a href="#g25-5">Anamnèse</a></li><li><a href="#g25-6">Examen clinique</a></li><li><a href="#g25-7">Syndromes</a></li><li><a href="#g25-8">Diagnostic positif</a></li><li><a href="#g25-9">Explorations</a></li><li><a href="#g25-10">Arbre diagnostique et différentiels</a></li><li><a href="#g25-11">Prise en charge</a></li><li><a href="#g25-12">Prévention, suivi et pronostic</a></li><li><a href="#g25-13">Points clés</a></li><li><a href="#g25-14">Pièges</a></li></ol></nav><div class="chap-body" data-semiology-clinical="G25"><section class="ilot" id="g25-question" ><h2>Un mouvement anormal : quelle description change la décision ?</h2><p><b>Situations fictives originales.</b> Une personne renverse son verre quand elle l’approche de la bouche. Une autre lâche brusquement des objets et devient confuse après une modification de traitement. Une troisième doit marcher le soir pour soulager une gêne des jambes. Une quatrième développe une raideur du tronc et des spasmes au bruit. Ces tableaux demandent des questions, des examens et des traitements différents.</p><p>La priorité est de reconnaître une urgence, de décrire le mouvement et de chercher sa cause. Le nom du chapitre rassemble plusieurs syndromes ; il ne constitue pas une maladie unique. L’examen fédéral mobilise cette démarche clinique : description, hypothèses, décision utile et communication des limites.</p><div class="key"><b>À retenir.</b> Décrire le phénomène, rechercher une cause traitable, puis choisir un traitement adapté à la personne et à la formulation.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, lignes1404–1406 du texte extrait réouvert</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction et formes CK/CS réouvertes</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></section>
<section class="ilot" id="g25-1" ><h2>1. Définition : plusieurs phénomènes, des frontières précises</h2><p><button class="w" data-k="g25-exp-1">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g25-1">▲ Loi de Pareto — l’essentiel</button></p><p>Un <button class="w" data-k="g25-definition">trouble du mouvement</button> se décrit avant de recevoir une étiquette étiologique. Le <button class="w" data-k="g25-phenotype">phénotype</button> précise rythme, durée, distribution, conditions de survenue et signes associés. Un tremblement oscille ; une myoclonie est une secousse brève ou une interruption de contraction ; une chorée est irrégulière et imprévisible ; un tic peut s’accompagner d’un besoin prémonitoire et d’une suppression transitoire.</p><table class="t"><thead><tr><th>OFS 2024</th><th>Portée du sous-code</th></tr></thead><tbody><tr><td>G25.0</td><td>Tremblement essentiel ou familial ; tremblement sans précision R25.1 exclu</td></tr><tr><td>G25.1 / G25.2</td><td>Tremblement médicamenteux / autres tremblements précisés, dont intention</td></tr><tr><td>G25.3</td><td>Myoclonies ; épilepsie myoclonique G40.- et myokymie faciale G51.4 exclues</td></tr><tr><td>G25.4 / G25.5</td><td>Chorée médicamenteuse / autres chorées ; Huntington G10 et Sydenham I02.- exclus de G25.5</td></tr><tr><td>G25.6</td><td>Tics médicamenteux ou autres organiques ; Tourette F95.2 et tic sans précision F95.9 exclus</td></tr><tr><td>G25.80 / G25.81</td><td>Mouvements périodiques des jambes pendant le sommeil / syndrome des jambes sans repos</td></tr><tr><td>G25.88 / G25.9</td><td>Autres, dont akathisie et syndrome de la personne raide / sans précision</td></tr></tbody></table><p>G25.8 est subdivisé dans cette version suisse ; aucun G25.82 emprunté à une autre nomenclature n’est ajouté. Une cause médicamenteuse peut demander un code externe supplémentaire selon la note. La conclusion clinique et l’imputabilité précèdent ce choix ; une indication de médicament ne détermine pas à elle seule le code.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G25 et G25.0/.1/.2/.3/.4/.5/.6/.8/.80/.81/.88/.9</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-DX — Phénoménologie et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a>.</p></section>
<section class="ilot" id="g25-2" ><h2>2. Épidémiologie : le groupe G25 n’a pas une fréquence unique</h2><p><button class="w" data-k="g25-exp-2">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g25-2">▲ Loi de Pareto — l’essentiel</button></p><p>Le tremblement essentiel compte parmi les tremblements les plus fréquents. Il peut commencer jeune, être familial et devenir plus gênant avec l’âge ; le mot « sénile » ne suffit donc pas à le définir. La source suisse USZ, actualisée le 16 avril 2026, décrit cette diversité sans fournir une enquête nationale récente couvrant tous les codes G25.</p><p>Les autres groupes sont très différents. Les myoclonies peuvent être physiologiques à l’endormissement ou révéler une maladie aiguë ou chronique. Les tics ont des profils liés au développement et à leur cause. Le syndrome de la personne raide est rare ; les séries thérapeutiques sont petites. Additionner ces catégories ne donne ni une incidence de maladie unique ni un risque individuel fiable.</p><p>Pour interpréter une fréquence, préciser syndrome, âge, population, méthode de diagnostic et période. Aucun chiffre étranger de tremblement essentiel ou de jambes sans repos n’est présenté ici comme une mesure suisse de l’ensemble de G25. Le retentissement sur les activités et le sommeil guide le besoin de soins au-delà de la fréquence en population.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.usz.ch/krankheit/tremor/" target="_blank" rel="noopener">CH-USZ-TREMOR — Définition, activation, causes, anamnèse et examen</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-EXAM — Physical examination et examen multiforme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-TX — Méthode, discussion, table2 et limites</a>.</p></section>
<section class="ilot" id="g25-3" ><h2>3. Physiopathologie : des réseaux et des générateurs différents</h2><p><button class="w" data-k="g25-exp-3">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g25-3">▲ Loi de Pareto — l’essentiel</button></p><p>La commande volontaire et sa régulation mobilisent plusieurs structures nerveuses. Une secousse peut venir d’un générateur cortical, sous-cortical, segmentaire ou périphérique ; son aspect seul ne localise pas toujours ce générateur. Le tremblement se décrit selon ses conditions d’activation et sa cause, sans attribuer tous les syndromes à un déficit dopaminergique unique.</p><figure data-g25-figure="basal"><div data-g25-frame="wide"><img src="assets/img/g25/alpha/codex/basal.png" alt="Schéma humain de deux niveaux de coupe coronale des noyaux gris, avec striatum, pallidum, noyau sous-thalamique et substance noire" loading="lazy"><span data-g25-mark="1" aria-hidden="true">1</span><span data-g25-mark="2" aria-hidden="true">2</span><span data-g25-mark="3" aria-hidden="true">3</span><span data-g25-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Striatum, nommé sur l’original : structure indiquée dans le premier niveau de coupe.</li><li>GPi : segment interne du globus pallidus, distinct du segment externe GPe nommé juste au-dessus.</li><li>STN : noyau sous-thalamique, nommé dans le second niveau de coupe.</li><li>SN : substance noire dans le second niveau ; cette image ne mesure ni dopamine ni activité d’un récepteur.</li></ol><p>Deux niveaux coronaux normaux du cerveau humain, pas une lésion démontrée ou un résultat d’imagerie du patient. La figure localise des structures ; elle ne mesure ni dopamine, ni fer, ni activité d’un récepteur et ne diagnostique pas un code G25.</p><p data-g25-credit>Andrew Gillies, schéma humain créé et publié en 2005 · <a href="https://commons.wikimedia.org/wiki/File:Basal-ganglia-coronal-sections.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels originaux inchangés ; repères et légende ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La <button class="w" data-k="g25-positive">myoclonie positive</button> correspond à une activation musculaire brève ; la <button class="w" data-k="g25-negative">myoclonie négative</button> à une interruption brève de l’activité qui maintient une posture. L’astérixis en est un exemple, notamment dans un contexte toxique ou métabolique, sans être le synonyme de toutes les myoclonies négatives.</p><p>Dans les jambes sans repos, la régulation du fer cérébral, la susceptibilité génétique et le système dopaminergique participent à une physiopathologie encore incomplètement connue. Une réponse à un agoniste ne démontre pas un simple manque de dopamine. Dans le <button class="w" data-k="g25-sps">syndrome de la personne raide</button>, une dysfonction de circuits inhibiteurs, souvent associée à une auto-immunité, offre un mécanisme distinct.</p><p>Au muscle, dépolarisation, calcium et interactions actine-myosine réalisent la contraction. Cette voie finale commune ne rend pas identiques les causes ni les traitements des mouvements observés.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MECH — Pathophysiology et comorbidités</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-MECH — Introduction et physiopathologie</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/10-3-muscle-fiber-contraction-and-relaxation" target="_blank" rel="noopener">NORMAL-MUSCLE — Paragraphes contraction/relaxation réouverts après extraction ciblée</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Basal-ganglia-coronal-sections.png" target="_blank" rel="noopener">IMG-BASAL — Description, provenance, droits propres et original réellement vus</a>.</p></section>
<section class="ilot" id="g25-4" ><h2>4. Démarche clinique : sécurité, phénomène, cause, décision</h2><p><button class="w" data-k="g25-exp-4">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g25-4">▲ Loi de Pareto — l’essentiel</button></p><ol><li><b>Évaluer la sécurité.</b> Début soudain avec déficit focal, confusion, fièvre, convulsions, trouble respiratoire ou déglutition difficile impose une évaluation urgente.</li><li><b>Observer le phénomène.</b> Oscillation, secousse, interruption de posture, mouvement irrégulier, tic, agitation ou spasme : décrire sans tout appeler tremblement.</li><li><b>Décrire le contexte.</b> Repos, posture, action, station debout, endormissement ou soirée ; chronologie, médicament et signes associés.</li><li><b>Rechercher une cause accessible.</b> Exposition, dérèglement métabolique, lésion, inflammation ou maladie spécifique selon les indices.</li><li><b>Choisir et mesurer.</b> Examen qui change la décision, traitement de la cause et/ou du symptôme, objectifs fonctionnels et suivi.</li></ol><p>La fenêtre <button class="w" data-k="g25-urgent">urgence et médicaments</button> relie les signes au circuit de soins. Fièvre, trouble mental et instabilité autonome avec rigidité ou clonus peuvent évoquer une toxicité grave. Une forme atypique de syndrome malin peut être dépourvue de rigidité nette ou n’avoir qu’une fièvre modérée : ne pas attendre tous les signes avant d’agir.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, lignes1404–1406 du texte extrait réouvert</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-URG — Syndromes sérotoninergique et malin des antipsychotiques</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></section>
<section class="ilot" id="g25-5" ><h2>5. Anamnèse : une chronologie observable et les prises réelles</h2><p><button class="w" data-k="g25-exp-5">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g25-5">▲ Loi de Pareto — l’essentiel</button></p><p>Reconstituer première région atteinte, âge de début, installation aiguë, subaiguë ou progressive, fluctuations et retentissement. Demander une <button class="w" data-k="g25-etiology">histoire étiologique</button> : maladies rénales, hépatiques, thyroïdiennes, neurologiques ou auto-immunes, événements vasculaires et histoire familiale. Une histoire familiale négative n’exclut pas une cause héréditaire.</p><p>La <button class="w" data-k="g25-drug">revue médicamenteuse</button> comprend prescriptions, automédication, traitements reçus ailleurs, changements de dose, arrêts et dernières prises. Neuroleptiques, antiémétiques, agents dopaminergiques, lithium et plusieurs autres produits peuvent contribuer à des mouvements anormaux. Une association temporelle suggère une piste ; elle ne prouve pas toute imputabilité.</p><p>Pour les jambes, préciser gêne sensitive, besoin de bouger, déclenchement au repos, soulagement pendant le mouvement et horaire. Pour les tics, rechercher besoin prémonitoire, suppression transitoire, fluctuations et conséquences scolaires ou sociales, en tenant compte de l’âge. Pour les spasmes, demander douleur, bruit/toucher déclenchants, chutes et raideur axiale.</p><p>Évaluer repas, écriture, marche, travail, sommeil, vigilance et vécu du patient. Une vidéo consentie peut aider si le phénomène est intermittent ; elle complète l’examen et ne le remplace pas.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-DX — Phénoménologie et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-EXAM — Physical examination et examen multiforme</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></section>
<section class="ilot" id="g25-6" ><h2>6. Examen clinique : comparer des conditions sûres</h2><p><button class="w" data-k="g25-exp-6">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g25-6">▲ Loi de Pareto — l’essentiel</button></p><p>Observer au <button class="w" data-k="g25-rest">repos réellement soutenu</button>, puis en <button class="w" data-k="g25-posture">maintien de posture</button> et pendant l’action. Décrire côté, distribution, amplitude, régularité et signes associés. Lors du doigt-nez, une oscillation croissant à l’approche de la cible évoque un <button class="w" data-k="g25-intention">tremblement d’intention</button> ; une erreur de visée sans oscillation est une dysmétrie, à décrire séparément.</p><figure data-g25-figure="motor"><div data-g25-frame="tall"><img src="assets/img/g25/alpha/codex/motor.png" alt="Schéma historique humain de la voie corticospinale, capsule interne et décussation des pyramides, comparaison avec la régulation des noyaux gris" loading="lazy"><span data-g25-mark="1" aria-hidden="true">1</span><span data-g25-mark="2" aria-hidden="true">2</span><span data-g25-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Aire motrice corticale : commande volontaire dans le schéma.</li><li>Capsule interne : passage de fibres, distinct des noyaux striataux voisins.</li><li>Décussation des pyramides : repère de voie corticospinale, pas de la boucle dopaminergique.</li></ol><p>Voie corticospinale humaine normale simplifiée ; une myoclonie peut avoir plusieurs générateurs, non localisables par cette planche seule. Comparer force/réflexes/coordination et mouvement observé, sans confondre secousse, spasticité et faiblesse.</p><p data-g25-credit>Gray, édition 1918, planche 764, trajet moteur humain modifié d’après Poirier · <a href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Examiner force, tonus, réflexes, coordination, nerfs crâniens, sensibilité, marche et équilibre. Une secousse distale à l’action, une interruption de maintien ou un mouvement choréique demandent des descriptions différentes. Pour une instabilité uniquement debout, sécuriser l’examen et discuter un enregistrement musculaire dans cette position ; une mesure assise peut manquer le phénomène.</p><p>Le <button class="w" data-k="g25-functional">tremblement fonctionnel</button> se recherche par des signes positifs concordants : variabilité, changement avec distraction ou entraînement à une tâche rythmique controlatérale. Aucun de ces signes isolés, une anxiété ou une IRM normale ne suffit. Une maladie neurologique concomitante reste possible, et ce diagnostic n’est pas synonyme de simulation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, lignes1404–1406 du texte extrait réouvert</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-CEREB — p81–82, syndrome cérébelleux</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-FUNC — p98–99, signes positifs et explication</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">IMG-MOTOR — Description, provenance, droits propres et original réellement vus</a>.</p></section>
<section class="ilot" id="g25-7" ><h2>7. Syndromes : reconnaître les familles sans les fusionner</h2><p><button class="w" data-k="g25-exp-7">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g25-7">▲ Loi de Pareto — l’essentiel</button></p><table class="t"><thead><tr><th>Phénomène</th><th>Description utile</th><th>Question suivante</th></tr></thead><tbody><tr><td>Tremblement</td><td>Oscillation rythmique : repos, posture, action, intention ou debout</td><td>Quel syndrome, quels signes associés et quelle cause ?</td></tr><tr><td>Myoclonie</td><td>Secousse positive ou interruption négative, parfois sensible aux stimuli</td><td>Début aigu ? Générateur ? Épilepsie associée ou cause toxique/métabolique ?</td></tr><tr><td>Chorée</td><td>Mouvements irréguliers, imprévisibles, pouvant se fondre dans le geste</td><td>Cause acquise, médicament ou hérédité ? Frontières G10/I02 ?</td></tr><tr><td>Tic</td><td>Mouvement ou vocalisation récurrente, besoin/suppression souvent présents mais variables</td><td>Développement, retentissement, cause acquise ou trouble classé F95 ?</td></tr><tr><td>Akathisie</td><td>Agitation et besoin de bouger, difficulté à rester immobile</td><td>Médicament, temporalité ; distinguer jambes sans repos et anxiété</td></tr><tr><td>Jambes sans repos</td><td>Besoin de bouger au repos, soulagement par mouvement, prédominance soir/nuit</td><td>Les cinq critères sont-ils remplis, avec exclusion des imitateurs ?</td></tr><tr><td>Personne raide</td><td>Raideur axiale/proximale et spasmes déclenchés, marche/chutes</td><td>Évaluation neurologique, électrophysiologie, auto-immunité et diagnostics concurrents</td></tr></tbody></table><p>Le tremblement <button class="w" data-k="g25-orthostatic">orthostatique primaire</button> est une forme particulière documentée par électromyographie debout, typiquement 13–18 Hz avec forte cohérence. La <button class="w" data-k="g25-frequency">fréquence</button> d’un tremblement ordinaire, seule, ne permet pas de conclure à une cause. L’<button class="w" data-k="g25-akathisia">akathisie</button> et les <button class="w" data-k="g25-plms">mouvements périodiques pendant le sommeil</button> ne se confondent pas avec une envie de bouger définissant le syndrome des jambes sans repos.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-DX — Phénoménologie et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-AKA — Akathisie et tremblement médicamenteux</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></section>
<section class="ilot" id="g25-8" ><h2>8. Diagnostic positif : critères formels et limites</h2><p><button class="w" data-k="g25-exp-8">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g25-8">▲ Loi de Pareto — l’essentiel</button></p><p>Le <button class="w" data-k="g25-essential">tremblement essentiel</button> est défini dans la recommandation DGN/SNG 2022 par un tremblement d’action bilatéral des membres supérieurs depuis au moins trois ans, sans autre syndrome neurologique défini. Des signes discrets peuvent relever de la catégorie <button class="w" data-k="g25-etplus">essentiel plus</button>. Un début plus récent exige recherche de cause et réévaluation ; il n’impose pas trois ans d’attente sans soins. Famille atteinte et amélioration après alcool ne sont pas obligatoires, et l’alcool n’est pas un traitement conseillé.</p><p>Pour les <button class="w" data-k="g25-rls">jambes sans repos</button>, <b>les cinq critères</b> sont requis : besoin de bouger ; début/aggravation au repos ; soulagement partiel ou total par mouvement tant qu’il continue ; prédominance soir/nuit ; manifestations non entièrement expliquées par une autre condition. La fenêtre <button class="w" data-k="g25-criteria">critères et imitateurs</button> précise leur application. Le diagnostic est clinique ; une polysomnographie n’est pas systématiquement nécessaire.</p><p>Une <button class="w" data-k="g25-chorea">chorée</button> ou un <button class="w" data-k="g25-tic">tic</button> se reconnaît par la phénoménologie, puis se rattache à une cause. Pour les myoclonies, le consensus IAPRD publié dans le numéro de mars 2025 organise axe Ia clinique, Ib neurophysiologique et II étiologique ; seul son résumé primaire a été consulté. Ce cadre ne transforme pas une épilepsie myoclonique en G25.3.</p><p>Dans le syndrome de la personne raide, clinique, électrophysiologie et immunologie s’intègrent en neurologie spécialisée. Un anti-GAD65 positif isolé ne remplace pas ce raisonnement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MIMIC — Table2 et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-DX — Phénoménologie et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.parkreldis.2024.107216" target="_blank" rel="noopener">INT-IAPRD2025 — Résumé primaire et méthode Delphi</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></section>
<section class="ilot" id="g25-9" ><h2>9. Explorations : définir la question avant de commander</h2><p><button class="w" data-k="g25-exp-9">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g25-9">▲ Loi de Pareto — l’essentiel</button></p><p>L’<button class="w" data-k="g25-emg">électromyographie de surface</button> caractérise les bouffées musculaires et leur organisation. Un <button class="w" data-k="g25-eeg">enregistrement couplé EEG–EMG</button> aide à rechercher une relation corticale, parfois avec rétromoyennage. Durée, rythme et corrélation doivent être interprétés ensemble ; un EEG bref normal ne tranche pas tous les épisodes ni tous les générateurs.</p><p>La biologie cherche une cause selon l’histoire : glycémie, électrolytes, fonction rénale/hépatique ou thyroïdienne, notamment. Dans les jambes sans repos, numération et bilan du fer sont recommandés au diagnostic, au début du traitement et lors d’une aggravation. Une <button class="w" data-k="g25-ferritin">ferritine</button> ne se lit pas seule, sans saturation de la transferrine, contexte et unités.</p><p>L’IRM répond à une hypothèse structurale, notamment devant syndrome cérébelleux, chorée ou signes focaux. L’exploration immunologique du syndrome de la personne raide, ou un bilan génétique, est orientée par le phénotype et confiée aux spécialistes appropriés. Un vaste panel sans question expose à des résultats difficiles à interpréter.</p><figure data-g25-figure="cereb"><div data-g25-frame="wide"><img src="assets/img/g25/alpha/codex/cerebellum.png" alt="Planche historique humaine d’un folium cérébelleux avec cellule de Purkinje, arborisation et cellules granulaires" loading="lazy"><span data-g25-mark="1" aria-hidden="true">1</span><span data-g25-mark="2" aria-hidden="true">2</span><span data-g25-mark="3" aria-hidden="true">3</span><span data-g25-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Soma de la cellule de Purkinje au bord de la couche moléculaire, nommé sur l’original.</li><li>Arborisation dendritique étendue de Purkinje dans la couche moléculaire.</li><li>Cellules granulaires : la légende historique nuclear layer correspond ici à la couche granulaire.</li><li>Axone de Purkinje indiqué sur l’original, distinct de son arborisation dendritique.</li></ol><p>Schéma humain historique de référence, non généré par IA. Il ne démontre pas une lésion chez une personne avec tremblement essentiel ou cérébelleux ; l’oscillation et les signes cliniques ne sont pas visibles sur cette image statique.</p><p data-g25-credit>Gray/Carter, Anatomy of the Human Body, édition 1918, planche 706 · <a href="https://commons.wikimedia.org/wiki/File:Gray706.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-IRON — Résumé et section Iron/Intravenous Iron</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-CEREB — p81–82, syndrome cérébelleux</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray706.png" target="_blank" rel="noopener">IMG-CEREB — Description, provenance, droits propres et original réellement vus</a>.</p></section>
<section class="ilot" id="g25-10" ><h2>10. Arbre diagnostique et différentiels</h2><p><button class="w" data-k="g25-exp-10">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g25-10">▲ Loi de Pareto — l’essentiel</button></p><table class="t"><thead><tr><th>Point de départ</th><th>Branche utile</th><th>Erreur à éviter</th></tr></thead><tbody><tr><td>Installation soudaine avec déficit ou confusion</td><td>Circuit urgent, cause vasculaire/toxique/métabolique selon contexte</td><td>Traiter d’emblée comme essentiel chronique</td></tr><tr><td>Oscillation d’action bilatérale ancienne</td><td>Critères essentiel, examen des autres signes, médicaments/thyroïde</td><td>Confondre tout tremblement avec Parkinson</td></tr><tr><td>Secousses brèves, chutes d’objets</td><td>Positives/négatives, contexte aigu et EEG–EMG selon besoin</td><td>Toute secousse = épilepsie ou tout EEG normal = exclusion</td></tr><tr><td>Mouvement irrégulier imprévisible</td><td>Chorée, médicaments, cause métabolique/structurelle, famille</td><td>Huntington obligatoire ou histoire familiale négative rassurante à elle seule</td></tr><tr><td>Besoin de bouger les jambes</td><td>Cinq critères, crampes/neuropathie/claudication/akathisie</td><td>Diagnostic sur seul symptôme ou seule polysomnographie</td></tr><tr><td>Instabilité uniquement debout</td><td>Comparer assis/marche, électromyographie debout</td><td>Confondre avec jambes sans repos sans horaire ni gêne sensitive</td></tr><tr><td>Raideur et spasmes déclenchés</td><td>Syndrome de la personne raide et concurrents, bilan spécialisé</td><td>Anti-GAD seul ou stress comme conclusion étiologique</td></tr></tbody></table><p>Les diagnostics peuvent coexister. Une neuropathie n’exclut pas des jambes sans repos si les symptômes sont distingués ; un trouble fonctionnel n’interdit pas une autre atteinte neurologique. La conclusion doit dire ce qui est démontré, ce qui est probable et ce qui reste à réévaluer.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-FUNC — p98–99, signes positifs et explication</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MIMIC — Table2 et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></section>
<section class="ilot" id="g25-11" ><h2>11. Prise en charge : cause, symptôme, statut suisse</h2><p><button class="w" data-k="g25-exp-11">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g25-11">▲ Loi de Pareto — l’essentiel</button></p><p><b>Cause.</b> Corriger une perturbation métabolique, traiter une affection identifiée ou revoir un médicament avec le prescripteur peut modifier le mouvement. Un arrêt brusque improvisé d’agoniste dopaminergique ou d’antiépileptique expose cependant à des complications ; l’urgence toxique grave relève d’une prise en charge immédiate.</p><p><b>Tremblement essentiel gênant.</b> Propranolol et <button class="w" data-k="g25-primidone">primidone</button> sont des options de la recommandation DGN/SNG. Inderal a une indication suisse pour l’essentiel ; Mysoline a une FI d’épilepsie et son usage pour tremblement est hors indication. Les formulations et contre-indications guident le choix. Les techniques spécialisées s’envisagent dans des cas sélectionnés, sans indication automatique pour tous les codes G25.</p><p><b>Jambes sans repos.</b> Rechercher facteurs aggravants, comorbidités et bilan du <button class="w" data-k="g25-iron">fer</button>. La recommandation germanophone 2024 propose agoniste non ergot à faible dose ou gabapentinoïde hors indication. Le <button class="w" data-k="g25-prami">pramipexole immédiat</button> a sa propre dose RLS. La <button class="w" data-k="g25-pregabalin">prégabaline</button> n’a pas d’indication RLS dans la FI suisse lue. Le résumé du consensus italien du 17 octobre 2026 préfère les ligands α2δ pour la plupart des adultes chroniques : il dérive explicitement de recommandations américaines et ne change ni l’AMM ni les précautions suisses. La décision spécialisée explique ces différences.</p><p><b>Myoclonies, tics et chorée.</b> Le générateur, la cause et le retentissement guident les choix. Les indications épilepsie du lévétiracétam ou du clonazépam ne constituent pas des AMM pour toutes les myoclonies non épileptiques. Tiapridal distingue tics sévères et chorée de Huntington ; cette dernière indication ne s’étend pas à toutes les chorées G25.</p><p><b>Personne raide.</b> Traitement symptomatique, prise en charge fonctionnelle et immunothérapie sont individualisés en centre spécialisé. La revue européenne 2025 soutient davantage les immunoglobulines intraveineuses que plusieurs alternatives, avec réponse variable et limites de preuve ; aucun protocole de produit ou de dose n’est inventé ici.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-URG — Syndromes sérotoninergique et malin des antipsychotiques</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, galénique/dose/adaptations, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317060015" target="_blank" rel="noopener">FI-INDERAL — Indication/posologie ET, galénique, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680178850145" target="_blank" rel="noopener">FI-MYSOLINE — Indications, début épilepsie, organes, interactions/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/tremor/" target="_blank" rel="noopener">CH-USZ-TX — Traitement essentiel et métadonnées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-TX — Recommandations thérapeutiques et Pregabalin</a> ; <a data-reference-source="1" href="https://doi.org/10.1007/s10072-026-09487-2" target="_blank" rel="noopener">EU-RLS-2026 — Résumé primaire viaEuropePMC seulement</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-TX — Management et conclusion</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680377570127" target="_blank" rel="noopener">FI-RIVOTRIL — Indications/voies/forme orale, organes, dépendance/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-TX — Méthode, discussion, table2 et limites</a>.</p></section>
<section class="ilot" id="g25-12" ><h2>12. Prévention, suivi et pronostic : surveiller le bénéfice et les effets</h2><p><button class="w" data-k="g25-exp-12">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g25-12">▲ Loi de Pareto — l’essentiel</button></p><p>Le <button class="w" data-k="g25-follow">suivi</button> compare une tâche reproductible, autonomie, sommeil, douleur, chutes et effets indésirables. L’objectif n’est pas seulement une amplitude moindre : le patient doit pouvoir accomplir les activités importantes avec une tolérance acceptable. Revoir une étiologie ou un syndrome si de nouveaux signes apparaissent.</p><p>Sous dopaminergique pour jambes sans repos, rechercher l’<button class="w" data-k="g25-augmentation">augmentation</button> : début plus précoce, propagation à d’autres régions, intensité accrue ou durée d’effet moindre. Ce n’est pas une simple carence de dose. Vérifier fer, diagnostics et conduite spécialisée plutôt qu’escalader automatiquement ; le retrait d’un agoniste chronique augmenté peut nécessiter une diminution très lente.</p><p>Prévenir erreurs de formulation, sédation, chutes et conduite dangereuse. Pramipexole : sommeil subit et pulsions ; prégabaline ou clonazépam : sédation et risque respiratoire accru avec dépresseurs centraux ; primidone : interactions et risque reproductif. Une grossesse, un âge pédiatrique ou une insuffisance rénale impose une vérification propre au produit, sans transposition d’un schéma adulte.</p><p>Le pronostic dépend de la cause et du syndrome. Certaines expositions ou perturbations sont corrigeables ; d’autres situations nécessitent un suivi prolongé. Ni guérison universelle ni évolution à échéance fixe ne peuvent se déduire du code G25.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680377570127" target="_blank" rel="noopener">FI-RIVOTRIL — Indications/voies/forme orale, organes, dépendance/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680178850145" target="_blank" rel="noopener">FI-MYSOLINE — Indications, début épilepsie, organes, interactions/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, galénique/dose/adaptations, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-TX — Management et conclusion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-TX — Méthode, discussion, table2 et limites</a>.</p></section>
<section class="ilot" id="g25-13" ><h2>13. Points clés</h2><p><button class="w" data-k="g25-exp-13">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g25-13">▲ Loi de Pareto — l’essentiel</button></p><ul><li>Décrire oscillation, secousse positive/négative, chorée, tic, agitation ou spasme avant d’en chercher la cause.</li><li>Début aigu, déficit, confusion, fièvre ou atteinte respiratoire changent le circuit de soins.</li><li>Tremblement essentiel : critères et durée, sans diagnostic par famille, fréquence ou alcool seuls.</li><li>Jambes sans repos : cinq critères cliniques ; mouvements périodiques du sommeil et maladie PLMD ne sont pas équivalents.</li><li>RLS sous agoniste : penser augmentation et statut sel/base ; forme immédiate et forme retard ne se substituent pas librement.</li><li>G25.3 exclut les épilepsies myocloniques ; G25.5 exclut Huntington et Sydenham.</li><li>Le calcul d’un volume suit une dose déjà choisie pour le produit exact ; il ne choisit pas l’indication.</li><li>Sources et contrôles techniques sont documentés ; auto-relecture IA ne signifie pas validation médicale humaine.</li></ul><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://doi.org/10.1007/s10072-026-09487-2" target="_blank" rel="noopener">EU-RLS-2026 — Résumé primaire viaEuropePMC seulement</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680377570127" target="_blank" rel="noopener">FI-RIVOTRIL — Indications/voies/forme orale, organes, dépendance/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, lignes1404–1406 du texte extrait réouvert</a>.</p></section>
<section class="ilot" id="g25-14" ><h2>14. Pièges qui changent la conduite</h2><p><button class="w" data-k="g25-exp-14">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g25-14">▲ Loi de Pareto — l’essentiel</button></p><ul><li>Faire de G25 une maladie unique ou coder toute hyperkinésie dans ce groupe.</li><li>Présenter une myoclonie toujours irrégulière, une astérixis comme toutes les myoclonies négatives, ou une fréquence comme diagnostic complet.</li><li>Demander systématiquement polysomnographie, IRM ou panel génétique sans question clinique.</li><li>Assimiler la ferritine sanguine à une mesure directe du fer cérébral ou le seuil RLS à une norme universelle.</li><li>Augmenter sans réévaluation un agoniste alors que les symptômes commencent plus tôt.</li><li>Copier une dose Parkinson, une table rénale étrangère, une dose Huntington ou une indication épilepsie vers tout G25.</li><li>Diviser un comprimé non prévu pour cela ou convertir sel/base sans vérifier la présentation.</li><li>Confondre anti-PCP4 sur une image, anti-GAD65 du patient et preuve suffisante de syndrome de la personne raide.</li><li>Présenter un résumé récent, une page de soins ou une adaptation étrangère comme une nouvelle guideline nationale suisse.</li></ul><div class="trap"><b>Piège.</b> Le bon traitement dépend du phénomène, de la cause, de la personne et du produit ; une étiquette seule ne suffit pas.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G25 et G25.0/.1/.2/.3/.4/.5/.6/.8/.80/.81/.88/.9</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MECH — Pathophysiology et comorbidités</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, galénique/dose/adaptations, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:PCP4_immunohistochemistry_in_human_cerebellum.jpg" target="_blank" rel="noopener">IMG-PURKINJE — Description, provenance, droits propres et original réellement vus</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a> ; <a data-reference-source="1" href="https://doi.org/10.1007/s10072-026-09487-2" target="_blank" rel="noopener">EU-RLS-2026 — Résumé primaire viaEuropePMC seulement</a>.</p></section>
<section class="ilot" id="g25-entrainement" ><h2>S’entraîner : quatre décisions et quatre cas</h2><div class="quiz ui"><p>Une polysomnographie est-elle indispensable à tout diagnostic de jambes sans repos ?</p><button data-ok="1">Non, le diagnostic repose sur cinq critères cliniques et les examens sont ciblés.</button><button data-ok="0">Oui, aucun diagnostic ne peut être posé sans cet examen.</button><p class="fb" hidden>Les mouvements périodiques du sommeil et les symptômes de jambes sans repos ne sont pas équivalents.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a>.</p><div class="quiz ui"><p>Des symptômes plus précoces sous agoniste imposent-ils une augmentation automatique de dose ?</p><button data-ok="1">Non, une augmentation des symptômes liée au traitement doit être recherchée.</button><button data-ok="0">Oui, c’est toujours la preuve que la dose est trop faible.</button><p class="fb" hidden>Revoir chronologie, extension, fer et traitement avec expertise ; planifier toute réduction chronique.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a>.</p><div class="quiz ui"><p>La forme retard de pramipexole peut-elle remplacer librement la forme immédiate pour les jambes sans repos ?</p><button data-ok="1">Non, indication, formulation et schéma du produit doivent être vérifiés.</button><button data-ok="0">Oui, toute forme du même principe actif a le même schéma.</button><p class="fb" hidden>La forme retard a une indication parkinsonienne dans la monographie suisse lue.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a>.</p><div class="quiz ui"><p>Un anti-GAD positif suffit-il à diagnostiquer le syndrome de la personne raide ?</p><button data-ok="1">Non, clinique et explorations spécialisées doivent être concordantes.</button><button data-ok="0">Oui, tout résultat positif impose immédiatement le même traitement.</button><p class="fb" hidden>Un marqueur isolé ne remplace pas le phénotype, le titre et la neurophysiologie.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p><p><button class="w" data-k="g25-cas-1">Cas 1</button> <button class="w" data-k="g25-cas-2">Cas 2</button> <button class="w" data-k="g25-cas-3">Cas 3</button> <button class="w" data-k="g25-cas-4">Cas 4</button></p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, lignes1404–1406 du texte extrait réouvert</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction et formes CK/CS réouvertes</a>.</p></section>
</div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="g25-e-purpose" ><h2>Un examen doit répondre à une question</h2><table class="t"><thead><tr><th>Situation</th><th>Question et examen possible</th><th>Limite</th></tr></thead><tbody><tr><td>Oscillation difficile à distinguer d’une secousse</td><td>Électromyographie de surface, muscles adaptés et accélérométrie selon besoin</td><td>Rythmicité et durée se chevauchent ; interpréter avec clinique</td></tr><tr><td>Myoclonies et suspicion de générateur cortical</td><td>EEG–EMG simultané, rétromoyennage et tests spécialisés adaptés</td><td>Artefacts, traitements et faible nombre de secousses peuvent limiter la conclusion</td></tr><tr><td>Instabilité uniquement debout</td><td>Enregistrement des muscles des jambes debout, avec sécurité</td><td>La forme primaire orthostatique a typiquement 13–18 Hz cohérents ; toutes instabilités ne suivent pas ce profil</td></tr><tr><td>Syndrome cérébelleux ou chorée</td><td>IRM recherchant une cause structurale, complétée selon contexte</td><td>Imagerie parfois normale au début de certaines maladies ; aucune cause déduite d’un seul signe</td></tr><tr><td>Jambes sans repos</td><td>Interview avec cinq critères et bilan du fer ; PSG si question associée</td><td>Pas PSG systématique ni diagnostic par score seul</td></tr><tr><td>Raideur et spasmes déclenchés</td><td>Examen neurologique, électrophysiologie, anticorps et parfois LCR spécialisés</td><td>Un anti-GAD65 isolé n’est pas un diagnostic clinique</td></tr></tbody></table><p>Les résultats changent de sens avec l’âge, les unités, le laboratoire et la question clinique. Les doses de médicament ne se déduisent pas directement d’un résultat isolé. Documenter l’indication de l’examen et ce que sa normalité permet réellement d’écarter.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-CEREB — p81–82, syndrome cérébelleux</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></section>
<section class="ilot" id="g25-e-physiology" ><h2>Électrophysiologie : un signal, un contexte et une interprétation</h2><p>L’enregistrement multimusculaire caractérise la durée des bouffées, leur synchronisation et la propagation. Un tremblement peut produire une activité rythmique ; certaines myoclonies sont elles aussi rythmiques. Une durée courte évoque certains générateurs, mais les distributions se chevauchent : il n’existe pas une frontière en millisecondes qui remplace le raisonnement.</p><p>Lorsque les secousses et l’EEG sont enregistrés ensemble, un rétromoyennage centré sur les secousses peut révéler une activité corticale peu visible sur le tracé brut. Le nombre d’événements, les artefacts et les traitements influencent le résultat. L’absence d’anomalie sur un EEG bref non couplé n’élimine pas tous les épisodes épileptiques ni tous les générateurs corticaux.</p><p>Dans un syndrome orthostatique, enregistrer debout est essentiel pour reproduire la condition ; la forme primaire comporte typiquement 13–18 Hz et une forte cohérence entre muscles homologues. Des formes lentes et des myoclonies orthostatiques sont distinctes. Ce résultat ne se transpose pas au diagnostic des jambes sans repos, fondé sur l’histoire.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.neurol.2026.09.006" target="_blank" rel="noopener">EU-MYO-2026 — Résumé primaire viaEuropePMC</a>.</p></section>
<section class="ilot" id="g25-e-iron" ><h2>Fer et sommeil : deux questions à garder distinctes</h2><p>La recommandation DGN/DGSM 2024 demande numération et bilan martial, dont ferritine et saturation de la transferrine, au diagnostic, au début d’un traitement et lors d’une aggravation. Le résumé indique le fer oral pour une forme légère avec ferritine ≤ 75 µg/L ; le corps du texte emploie &lt; 75 µg/L ou saturation ≤ 20 %. Ces formulations légèrement différentes ne sont pas une norme biologique suisse universelle. À une borne, interpréter l’ensemble du bilan plutôt que fabriquer une équivalence.</p><p>Une ferritine périphérique ne mesure pas directement le fer du cerveau. La discussion de supplémentation dans les jambes sans repos ne dispense pas de vérifier l’indication, les contre-indications et les limites du produit suisse. Ferinject vise une carence confirmée chez l’adulte lorsque le fer oral est inadapté ; il n’est pas automatiquement indiqué à toute personne qui bouge les jambes.</p><p>Une polysomnographie recherche mouvements périodiques, troubles respiratoires, parasomnies ou autre question du sommeil selon le contexte. Les mouvements périodiques peuvent accompagner les jambes sans repos. Un index seul ne définit pas une maladie PLMD à traiter, et le diagnostic RLS reste clinique. La phrase générale de la page HUG sur la polysomnographie, placée après la description des mouvements périodiques, ne doit pas devenir une obligation universelle pour RLS.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-IRON — Résumé et section Iron/Intravenous Iron</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MECH — Pathophysiology et comorbidités</a> ; <a data-reference-source="1" href="https://doi.org/10.1007/s10072-026-09487-2" target="_blank" rel="noopener">EU-RLS-2026 — Résumé primaire viaEuropePMC seulement</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a> ; <a data-reference-source="1" href="https://www.hug.ch/laboratoire-du-sommeil/syndrome-jambes-sans-repos" target="_blank" rel="noopener">CH-HUG-RLS — Page clinique complète, symptômes et PLMS</a>.</p></section>
<section class="ilot" id="g25-e-etiology" ><h2>Biologie, imagerie et examens spécialisés orientés</h2><p>Un début aigu ou subaigu de myoclonies, particulièrement avec confusion, nécessite une recherche adaptée de cause toxique, métabolique, infectieuse ou inflammatoire. Le contexte peut conduire à vérifier glycémie, électrolytes, fonctions rénale et hépatique, médicaments et expositions. Pour un tremblement, une hyperthyroïdie ou une substance peut modifier la conduite. Le bilan s’ajuste à la situation réelle et au degré d’urgence.</p><p>Une chorée justifie une histoire familiale et médicamenteuse précise, l’examen des signes associés puis une imagerie et une biologie choisies. Hyperglycémie non cétosique, troubles électrolytiques ou lésion focale font partie des possibilités. La famille négative ne suffit pas à exclure une cause héréditaire ; une analyse génétique demande information, indication et interprétation.</p><p>Dans le syndrome de la personne raide, l’imagerie peut ne montrer aucune anomalie spécifique. Les anticorps, éventuellement le liquide cérébrospinal et la recherche d’une maladie auto-immune ou tumorale s’intègrent au phénotype et à l’électrophysiologie. Des anti-GAD65 peuvent exister sans maladie neurologique ; titre, compartiment et contexte importent.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/tremor/" target="_blank" rel="noopener">CH-USZ-TREMOR — Définition, activation, causes, anamnèse et examen</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a>.</p></section>
<section class="ilot" id="g25-e-measure" ><h2>Mesurer une réponse utile</h2><p>Avant traitement, choisir une activité importante et suffisamment reproductible : boire, écrire, marcher ou dormir, par exemple. Décrire conditions, amplitude ou fréquence quand pertinentes, retentissement et objectifs du patient. Les échelles de tremblement ou de jambes sans repos aident au suivi, mais leur score n’établit pas à lui seul une cause ni une indication.</p><p>Répéter dans des conditions comparables et demander les effets indésirables. Sous agoniste pour jambes sans repos, dater l’heure d’apparition des symptômes et leur extension ; une aggravation plus précoce peut être une augmentation. Après fer intraveineux, distinguer contrôle d’hémoglobine prévu au plus tôt quatre semaines dans la FI et réévaluation clinique/martiale à douze semaines du texte RLS : ils répondent à deux objectifs.</p><p>Documenter une nouvelle confusion, une somnolence, des chutes, des pulsions ou un trouble respiratoire avant de conclure que « le mouvement va mieux ». Une réponse symptomatique ne prouve pas rétroactivement l’étiologie. Les données thérapeutiques de plusieurs myoclonies et du syndrome de la personne raide restent hétérogènes, ce qui rend cette mesure individuelle importante.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-TX — Management et conclusion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-TX — Méthode, discussion, table2 et limites</a>.</p></section>
</div></div>

<div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="g25-tab-semio" role="tab" data-s="g25-s-semio" aria-controls="g25-s-semio" aria-selected="true">Sémiologie fondamentale et analytique</button><button id="g25-tab-anat" role="tab" data-s="g25-s-anat" aria-controls="g25-s-anat" aria-selected="false">Anatomie</button><button id="g25-tab-histo" role="tab" data-s="g25-s-histo" aria-controls="g25-s-histo" aria-selected="false">Histologie</button><button id="g25-tab-physio" role="tab" data-s="g25-s-physio" aria-controls="g25-s-physio" aria-selected="false">Physiologie</button><button id="g25-tab-bio" role="tab" data-s="g25-s-bio" aria-controls="g25-s-bio" aria-selected="false">Biochimie</button><button id="g25-tab-immuno" role="tab" data-s="g25-s-immuno" aria-controls="g25-s-immuno" aria-selected="false">Immunologie et physiopathologie</button></div><div class="chap-body sci-body"><div class="sci" id="g25-s-semio" role="tabpanel" aria-labelledby="g25-tab-semio"><section class="ilot" id="g25-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>Le geste normal combine une commande volontaire, un ajustement sensorimoteur et une exécution musculaire. Les noyaux gris, le cervelet, le cortex et les voies de sortie contribuent à des fonctions différentes ; leur représentation normale n’identifie pas une cause chez le patient. Au muscle, l’activité électrique mobilise du calcium puis les interactions actine-myosine. La sémiologie décrit l’effet observable d’une perturbation de ce fonctionnement.</p><p>On recherche donc ce que la personne veut faire, ce qui survient involontairement et dans quelle condition. Au repos soutenu, en maintien, pendant un geste ciblé ou debout, le mouvement peut changer. Cette comparaison permet de formuler une question clinique précise plutôt que d’utiliser le mot tremblement pour toutes les anomalies.</p><figure data-g25-figure="motor"><div data-g25-frame="tall"><img src="assets/img/g25/alpha/codex/motor.png" alt="Schéma historique humain de la voie corticospinale, capsule interne et décussation des pyramides, comparaison avec la régulation des noyaux gris" loading="lazy"><span data-g25-mark="1" aria-hidden="true">1</span><span data-g25-mark="2" aria-hidden="true">2</span><span data-g25-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Aire motrice corticale : commande volontaire dans le schéma.</li><li>Capsule interne : passage de fibres, distinct des noyaux striataux voisins.</li><li>Décussation des pyramides : repère de voie corticospinale, pas de la boucle dopaminergique.</li></ol><p>Voie corticospinale humaine normale simplifiée ; une myoclonie peut avoir plusieurs générateurs, non localisables par cette planche seule. Comparer force/réflexes/coordination et mouvement observé, sans confondre secousse, spasticité et faiblesse.</p><p data-g25-credit>Gray, édition 1918, planche 764, trajet moteur humain modifié d’après Poirier · <a href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p><b>Science → clinique.</b> Une voie normale explique ce qu’on examine, sans prouver une lésion. <b>Science → examen.</b> Observer puis comparer force, réflexes, coordination et mouvement. <b>Science → traitement.</b> Le mécanisme et la cause orientent la stratégie ; la seule contraction ne prescrit pas un médicament.</p><div class="key"><b>À retenir.</b> Décrire d’abord, localiser avec prudence, chercher une cause qui change les soins.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, lignes1404–1406 du texte extrait réouvert</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/10-3-muscle-fiber-contraction-and-relaxation" target="_blank" rel="noopener">NORMAL-MUSCLE — Paragraphes contraction/relaxation réouverts après extraction ciblée</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">IMG-MOTOR — Description, provenance, droits propres et original réellement vus</a>.</p></section>
