<template data-pop="g25-exp-13" data-title="Comprendre — point 13"><p><b>Raisonnement.</b> Une décision juste peut être de différer un médicament en recherchant une cause ou de réévaluer une formulation. Le succès ne se limite pas à faire disparaître visuellement un mouvement.</p><p>Les décisions utiles relient signe, cause, produit et suivi.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://doi.org/10.1007/s10072-026-09487-2" target="_blank" rel="noopener">EU-RLS-2026 — Résumé primaire viaEuropePMC seulement</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680377570127" target="_blank" rel="noopener">FI-RIVOTRIL — Indications/voies/forme orale, organes, dépendance/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191f <template data-pop="pareto-g25-13" data-title="Essentiel — point 13"><p>Les décisions utiles relient signe, cause, produit et suivi.</p><div class="key"><b>À retenir.</b> Décrire, contextualiser et choisir une décision qui change les soins.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://doi.org/10.1007/s10072-026-09487-2" target="_blank" rel="noopener">EU-RLS-2026 — Résumé primaire viaEuropePMC seulement</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680377570127" target="_blank" rel="noopener">FI-RIVOTRIL — Indications/voies/forme orale, organes, dépendance/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, lignes1404–1406 du texte extr <template data-pop="g25-exp-14" data-title="Comprendre — point 14"><p><b>Raisonnement.</b> Un volume peut être mathématiquement juste alors que le produit ou la voie est faux. De même, un anticorps positif et une image de référence ne fournissent pas seuls une indication d’immunothérapie.</p><p>Une étiquette, un test isolé ou un calcul exact ne valide pas toute la conduite.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G25 et G25.0/.1/.2/.3/.4/.5/.6/.8/.80/.81/.88/.9</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MECH — Pathophysiology et comorbidités</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?g <template data-pop="pareto-g25-14" data-title="Essentiel — point 14"><p>Une étiquette, un test isolé ou un calcul exact ne valide pas toute la conduite.</p><div class="key"><b>À retenir.</b> Décrire, contextualiser et choisir une décision qui change les soins.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G25 et G25.0/.1/.2/.3/.4/.5/.6/.8/.80/.81/.88/.9</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MECH — Pathophysiology et comorbidités</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, galénique/dose/adaptations, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:PCP4_immunohistochemistry_in_human_cerebellum.jpg" target="_blank" rel="noopener">IMG-PURKINJE — Description, provenance, droits propres et original réellement vus</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a> ; <a data-reference-source="1" href="https://doi.org/10.1007/s10072-026-09487-2" target="_blank" rel="noopener">EU-RLS-2026 — Résumé primaire viaEuropePMC seulement</a>.</p></template>
<template data-pop="g25-cas-1" data-title="Cas 1 — Une oscillation bilatérale ancienne"><p><b>Exercice fictif original.</b></p><p>Une personne décrit quatre ans d’oscillations des mains pendant maintien et gestes, sans autre signe évident à l’histoire. Sa famille n’est pas atteinte.</p><p>Observer les conditions, faire l’examen complet et rechercher médicaments/thyroïde avant conclusion ; une famille négative n’exclut pas l’essentiel, et un effet d’alcool n’est ni requis ni un traitement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a>.</p></template>
<template data-pop="g25-cas-2" data-title="Cas 2 — Secousses et confusion nouvelles"><p><b>Exercice fictif original.</b></p><p>Une personne commence à lâcher des objets et paraît confuse après changement de traitement, dans un contexte d’atteinte rénale.</p><p>Évaluer rapidement la sécurité et les causes toxiques/métaboliques ; distinguer secousses positives et interruptions de maintien. Ne pas prescrire automatiquement un traitement d’épilepsie sans évaluation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a>.</p></template>
<template data-pop="g25-cas-3" data-title="Cas 3 — Les jambes plus tôt dans la journée"><p><b>Exercice fictif original.</b></p><p>Sous agoniste chronique pour jambes sans repos, les symptômes commencent désormais deux heures plus tôt et touchent aussi les bras.</p><p>Penser augmentation, vérifier fer et imitateurs, revoir le traitement avec expertise. Ne pas augmenter automatiquement la dose ni interrompre brutalement un agoniste chronique sans plan.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-cas-4" data-title="Cas 4 — Un anticorps sans conclusion automatique"><p><b>Exercice fictif original.</b></p><p>Une personne présente une raideur du tronc et des spasmes déclenchés ; un dosage anti-GAD65 revient positif.</p><p>Neurologie spécialisée : phénotype, titre, électrophysiologie et contexte immunitaire/tumoral. Un résultat seul et l’image PCP4 de référence ne justifient pas un protocole d’immunothérapie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-TX — Méthode, discussion, table2 et limites</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:PCP4_immunohistochemistry_in_human_cerebellum.jpg" target="_blank" rel="noopener">IMG-PURKINJE — Description, provenance, droits propres et original réellement vus</a>.</p></template>
