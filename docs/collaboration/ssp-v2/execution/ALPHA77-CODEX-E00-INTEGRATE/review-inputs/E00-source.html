<template data-pop="e00-sources-guides" data-title="Sources et organismes cités">
<div class="lab">Organisations</div><p>L’Organisation mondiale de la santé (OMS), le Fonds des Nations unies pour l’enfance (UNICEF) et le Conseil international pour la lutte contre les troubles dus à la carence en iode (ICCIDD) ont publié en 2007 le guide d’évaluation des troubles dus à la carence en iode qui fournit les définitions, les besoins et les échelles d’iodurie de ce cours. Le consensus 2020-2021 sur l’hypothyroïdie congénitale est le travail du réseau européen de référence ENDO-ERN, avec l’aval de la Société européenne d’endocrinologie pédiatrique (ESPE) et de la Société européenne d’endocrinologie (ESE).</p>
<div class="lab">Portée</div><p>Le guide de l’OMS décrit des populations, pas des patients individuels. Le consensus européen porte sur l’hypothyroïdie congénitale sporadique ; il sert ici au nouveau-né hypothyroïdien et au diagnostic différentiel, non à la définition du crétinisme endémique.</p>
<div class="lab">Limite</div><p>Les pages OSAV sur le sel iodé, la grossesse et l’allaitement ainsi que les questions et réponses de 2018 et 2024 ont été lues lors de la reprise. Elles soutiennent une discussion individualisée du complément. Aucune recommandation suisse dédiée au syndrome E00 constitué n’a été obtenue. Les revues de Chen et Hetzel (2010) et de Zimmermann (2009) n’ont été lues qu’au niveau du résumé.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF et ICCIDD, 3e édition, 2007</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">consensus ENDO-ERN 2021</a>.</p></template>

<template data-pop="e00-definition" data-title="Crétinisme endémique : définition et place dans la classification">
<div class="lab">Définition</div><p>Le crétinisme endémique est la forme extrême des troubles dus à la carence iodée. Il associe, selon l’OMS, une déficience mentale avec un mélange de mutisme, de diplégie spastique, de strabisme, d’hypothyroïdie et de petite taille. Chen et Hetzel (2010) distinguent un syndrome neurologique, plus fréquent (lésions cérébrales, surdi-mutité, strabisme, parésie spastique des membres inférieurs), et un syndrome d’hypothyroïdie sévère avec retard de croissance et déficit mental moins marqué. Les deux sont évitables par la correction de la carence avant la grossesse.</p>
<div class="lab">Classification</div><p>La CIM-10-GM 2024 de l’Office fédéral de la statistique code le syndrome E00, avec les sous-codes E00.0 (type neurologique), E00.1 (type myxœdémateux), E00.2 (type mixte) et E00.9 (sans précision). L’intitulé anglais de la catégorie, « congenital iodine-deficiency syndrome », lève l’ambiguïté du libellé français.</p>
<div class="lab">Limite</div><p>Les critères diagnostiques individuels formalisés et validés n’existent dans aucune source lue. La définition reste descriptive.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.beem.2009.08.014" target="_blank" rel="noopener">Chen et Hetzel, 2010 (résumé)</a> ; OMS 2007, tableau 1 ; Office fédéral de la statistique, CIM-10-GM 2024.</p></template>

<template data-pop="e00-sous-types" data-title="Sous-codes E00 et remise en cause de la dichotomie">
<div class="lab">Les sous-codes</div><p>E00.0 désigne le type neurologique (déficience mentale profonde, surdi-mutité, diplégie cérébrale). E00.1 désigne le type myxœdémateux (retard statural sévère, traits myxœdémateux, déficit mental moindre, maturation sexuelle retardée). E00.2 désigne l’association des deux. E00.9 est sans précision.</p>
<div class="lab">Enquête thaïlandaise</div><p>Sur 112 personnes atteintes, âgées de 2 à 66 ans (57 neurologiques, 19 myxœdémateux, 36 mixtes), le quotient intellectuel moyen était de 30,8 ± 8,8. Le quotient, la surdité de perception et le déficit psychomoteur étaient semblables dans les trois types ; la spasticité, l’hyperréflexie, les réflexes primitifs et les troubles de la marche étaient répartis également. Les myxœdémateux étaient plus petits (p inférieur à 0,01), plus myxœdémateux et moins mûrs sexuellement (p inférieur à 0,05).</p>
<div class="lab">Chine occidentale et Java</div><p>Chez 104 personnes atteintes en Chine et 35 àJava, la même atteinte neurologique était présente dans presque tous les cas, quels que soient le type et la fonction thyroïdienne actuelle.</p>
<div class="lab">Conclusion</div><p>L’atteinte neurologique est commune à tous les types et résulte de l’hypothyroxinémie maternelle et fœtale ; le type myxœdémateux s’explique par la persistance d’une hypothyroïdie postnatale.</p>
<p class="src">Références : <a href="https://doi.org/10.1530/eje.0.1370349" target="_blank" rel="noopener">Rajatanavin et al., 1997 (résumé)</a> ; <a href="https://doi.org/10.1093/brain/114.2.825" target="_blank" rel="noopener">Halpern et al., 1991 (résumé)</a>.</p></template>

<template data-pop="e00-tdci" data-title="Troubles dus à la carence en iode : spectre complet">
<div class="lab">Spectre</div><p>Selon le tableau 1 du guide de l’OMS, ces troubles englobent le goitre, l’hypothyroïdie, les avortements, la mortinatalité, les anomalies congénitales, la mortalité périnatale et infantile, l’altération des fonctions mentales et le retard du développement physique. Le crétinisme endémique en est l’expression la plus sévère chez l’enfant né de mère carencée.</p>
<div class="lab">Conséquence pour le cours</div><p>La carence iodée n’est pas qu’un problème thyroïdien : elle altère la grossesse et le développement. Le goitre en est l’adaptation visible, le crétinisme la conséquence la plus grave.</p>
<p class="src">Références : OMS, UNICEF et ICCIDD 2007, tableau 1.</p></template>

<template data-pop="e00-besoins" data-title="Besoins quotidiens en iode">
<div class="lab">Valeurs</div><table class="t"><thead><tr><th>Âge ou situation</th><th>Besoin quotidien</th></tr></thead><tbody><tr><td>0 à 59 mois</td><td>90 µg</td></tr><tr><td>6 à 12 ans</td><td>120 µg</td></tr><tr><td>Adolescent et adulte</td><td>150 µg</td></tr><tr><td>Grossesse et allaitement</td><td>250 µg</td></tr></tbody></table>
<div class="lab">Lecture</div><p>Le tableau reprend les apports recommandés par l’OMS, l’UNICEF et l’ICCIDD. La valeur de la grossesse et de l’allaitement est supérieure de 100 µg à celle de l’adulte.</p>
<div class="lab">Limite</div><p>Ces valeurs sont des apports recommandés pour une population, pas des seuils de décision individuels.</p>
<p class="src">Références : OMS, UNICEF et ICCIDD 2007.</p></template>

<template data-pop="e00-fenetre" data-title="Période critique du développement cérébral">
<div class="lab">Définition</div><p>L’OMS situe la période la plus critique du point de vue de la carence iodée du deuxième trimestre de grossesse à la troisième année de vie.</p>
<div class="lab">Interprétation</div><p>La thyroïde fœtale n’est pas fonctionnellement mûre avant 18 à 20 semaines : au début du développement cérébral, le fœtus dépend de la thyroxine maternelle. L’apport en iode de la mère conditionne donc l’apport hormonal au cerveau fœtal, puis le lait maternel et l’alimentation prennent le relais.</p>
<div class="lab">Conséquence</div><p>La correction de la carence est donc recommandée avant la grossesse.</p>
<p class="src">Références : OMS 2007 ; consensus ENDO-ERN 2021, section 3.</p></template>

<template data-pop="e00-t4-maternelle" data-title="Thyroxine maternelle et dépendance du fœtus">
<div class="lab">Mécanisme</div><p>Avant 18 à 20 semaines, la thyroïde fœtale n’est pas fonctionnellement mûre. Le fœtus reçoit alors la thyroxine (T4) de sa mère. Ce transfert exige un statut iodé maternel optimal, car la mère fabrique la T4 à partir de l’iode qu’elle absorbe.</p>
<div class="lab">Conséquence clinique</div><p>Une mère très carencée fournit trop peu de T4 à un moment où le fœtus ne peut pas la remplacer. Le dommage se constitue avant la naissance.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 3.</p></template>

<template data-pop="e00-hypoxinemie" data-title="Hypothyroxinémie maternelle et fœtale">
<div class="lab">Définition</div><p>L’hypothyroxinémie désigne un taux insuffisant de thyroxine dans le sang. Dans le crétinisme endémique, elle touche la mère puis le fœtus pendant la neurogenèse.</p>
<div class="lab">Conséquences</div><p>Elle produit l’atteinte cérébrale diffuse et irréversible du type neurologique : déficience intellectuelle, signes pyramidaux proximaux, signes extrapyramidaux, strabisme, surdité. La persistance de l’hypothyroïdie après la naissance ajoute le retard de croissance, d’ossification et de maturation sexuelle du type myxœdémateux.</p>
<div class="lab">Limite</div><p>La chronologie précise de l’agression n’a pas été lue au-delà des résumés ; elle est présentée avec prudence.</p>
<p class="src">Références : Halpern et al., 1991 ; Rajatanavin et al., 1997 (résumés).</p></template>

<template data-pop="e00-cofacteurs" data-title="Sélénium et goitrogènes : cofacteurs proposés">
<div class="lab">Hypothèses</div><p>Deux cofacteurs ont été proposés pour le type myxœdémateux : la carence en sélénium et les goitrogènes, notamment le thiocyanate. Une publication de 1994 les discute (titre et mots-clés lus seulement). Une étude de 2002 indique que le thiocyanate inhibe de façon compétitive le transport de l’iodure dans la glande mammaire, ce qui abaisse l’iode du lait ; l’extrapolation au lait humain et au syndrome myxœdémateux est explicitement spéculative dans ce résumé.</p>
<div class="lab">Statut</div><p>Ces éléments sont des hypothèses. Ils ne guident aucune décision clinique dans les sources lues.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/0303-7207(94)90297-6" target="_blank" rel="noopener">Dumont et al., 1994 (titre)</a> ; <a href="https://doi.org/10.1089/105072502761016520" target="_blank" rel="noopener">Laurberg et al., 2002 (résumé)</a>.</p></template>

<template data-pop="e00-nis" data-title="Symporteur sodium-iodure">
<div class="lab">Fonction</div><p>Le symporteur sodium-iodure (en anglais Na+/I− symporter) assure le transport actif de l’iodure dans la thyroïde. C’est la première étape de la synthèse des hormones thyroïdiennes, qui sont cruciales pour le développement du système nerveux central et des poumons du fœtus et du nouveau-né.</p>
<div class="lab">Dans la carence</div><p>Une carence en iode laisse le transporteur sans substrat suffisant. La thyroïde compense en augmentant la captation et le recyclage de l’iode, mais l’iode disponible reste le facteur limitant.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/er.2012-1036" target="_blank" rel="noopener">Portulano et al., 2014 (résumé)</a>.</p></template>

<template data-pop="e00-wolff" data-title="Effet Wolff-Chaikoff chez le prématuré">
<div class="lab">Contexte</div><p>Le consensus européen mentionne l’effet Wolff-Chaikoff à propos de l’hypothyroïdie transitoire par excès d’iode : le prématuré ne parvient pas à s’y soustraire.</p>
<div class="lab">Conséquence</div><p>Les antiseptiques iodés et les apports maternels très riches en iode sont donc à éviter en période périnatale.</p>
<div class="lab">Limite</div><p>Le mécanisme moléculaire de cet effet n’est pas détaillé dans les sections lues.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 3.4.</p></template>

<template data-pop="e00-iodurie" data-title="Iodurie médiane : échelles de l’OMS">
<div class="lab">Enfant d’âge scolaire (6 ans et plus)</div><table class="t"><thead><tr><th>Médiane</th><th>Interprétation</th></tr></thead><tbody><tr><td>Inférieure à 20 µg/l</td><td>Carence sévère</td></tr><tr><td>20 à 49</td><td>Carence modérée</td></tr><tr><td>50 à 99</td><td>Carence légère</td></tr><tr><td>100 à 199</td><td>Adéquat</td></tr><tr><td>200 à 299</td><td>Supérieur aux besoins</td></tr><tr><td>300 et plus</td><td>Excessif</td></tr></tbody></table>
<div class="lab">Femme enceinte</div><p>Moins de 150 µg/l : insuffisant. 150 à 249 : adéquat. 250 à 499 : supérieur aux besoins. 500 et plus : excessif. Pendant l’allaitement et chez l’enfant de moins de 2 ans, une médiane d’au moins 100 µg/l correspond à un apport adéquat dans le tableau OMS.</p>
<div class="lab">Piège</div><p>La médiane d’un groupe ne caractérise pas un individu. La médiane d’iodurie est plus basse chez la femme allaitante, car l’iode passe dans le lait.</p>
<p class="src">Références : OMS, UNICEF et ICCIDD 2007, tableaux 4 et 5.</p></template>

<template data-pop="e00-tsh-neonatale" data-title="TSH néonatale supérieure à 5 mU/l : indicateur de population">
<div class="lab">Méthode</div><p>Le sang est prélevé 3 à 4 jours après la naissance. La proportion de nouveau-nés dont la TSH sur sang total dépasse 5 mU/l est calculée pour une population.</p>
<div class="lab">Interprétation</div><p>Moins de 3 % indique une population suffisante en iode. En zone d’endémie sévère, la fréquence peut dépasser 40 %.</p>
<div class="lab">Données suisses</div><p>Après le relèvement du sel iodé de 15 à 20 mg/kg en 1999, la fréquence est passée de 2,9 % (1992-1998, 259 035 nouveau-nés) à 1,7 % (1999-2004, 218 665 nouveau-nés).</p>
<div class="lab">Piège</div><p>Les antiseptiques iodés, comme la povidone iodée, élèvent la TSH néonatale et faussent l’indicateur.</p>
<p class="src">Références : OMS 2007 ; <a href="https://doi.org/10.1093/ajcn.82.2.388" target="_blank" rel="noopener">Zimmermann et al., 2005 (résumé)</a>.</p></template>

<template data-pop="e00-povidone" data-title="Povidone iodée et indicateur néonatal">
<div class="lab">Effet</div><p>Les antiseptiques iodés appliqués autour de la naissance élèvent la TSH néonatale. Un indicateur populationnel calculé sans contrôle de cette exposition surestime la carence.</p>
<div class="lab">Conduite</div><p>Le consensus européen recommande d’éviter les antiseptiques iodés en période périnatale, ce qui protège aussi le dépistage individuel.</p>
<p class="src">Références : OMS 2007 ; consensus ENDO-ERN 2021, section 3.4.</p></template>

<template data-pop="e00-sel" data-title="Sel iodé en Suisse : histoire et teneur">
<div class="lab">Histoire</div><p>Coindet traite le goitre par l’iode à Genève en 1813. Au début du vingtième siècle, des médecins suisses démontrent l’efficacité de la prophylaxie iodée contre le goitre et le crétinisme. Le programme de sel iodé est ininterrompu depuis 1922 ; la Suisse et les États-Unis ont été les premiers à iodurer le sel dans les années 1920.</p>
<div class="lab">Teneur</div><p>La teneur est passée de 15 à 20 mg/kg en 1999, puis à 25 mg/kg en janvier 2014, avec une marge autorisée de 20 à 40 mg/kg.</p>
<div class="lab">Limites</div><p>Le programme est volontaire : plus de 80 % des ménages utilisent du sel iodé, mais seulement un tiers des aliments transformés en contiennent.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/jn/138.11.2060" target="_blank" rel="noopener">Zimmermann, 2008 (résumé)</a> ; <a href="https://doi.org/10.1089/thy.2022.0454" target="_blank" rel="noopener">Pearce et Zimmermann, 2023 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10899291/" target="_blank" rel="noopener">Fischer et al., 2024</a>.</p><p>La <button class="w" data-k="e00-calcul-sel">conversion 25 mg/kg en 25 µg/g</button> explique l’apport du sel iodé. Choisir ce sel sans augmenter sa consommation totale, selon l’OSAV.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S111]</button>, <button class="w" data-k="e00-sources-2026">[S115]</button></span></template>

<template data-pop="e00-suisse-2020" data-title="Étude nationale suisse 2020-2022 : résultats">
<div class="lab">Résultats</div><p>Médiane d’iodurie de 127 µg/l chez l’enfant (adéquate) et de 97 µg/l chez la femme enceinte (insuffisante selon l’OMS). Quarante-sept pour cent des femmes prennent un supplément d’iode (au moins 150 µg/jour) : leur médiane est de 129 µg/l contre 81 µg/l chez les non-utilisatrices. La proportion estimée d’apport inadéquat (seuil de calcul de l’étude : moins de 160 µg/jour, non seuil de diagnostic individuel) est de 0,2 % chez les utilisatrices contre 31 %. Toutes les femmes étaient euthyroïdiennes.</p>
<div class="lab">Recommandation rapportée</div><p>En cas de multivitamine prénatale, choisir un produit contenant de l’iode ; les auteurs demandent plus de sel iodé dans les aliments transformés.</p>
<div class="lab">Limite</div><p>Il s’agit d’une étude transversale ; aucune recommandation officielle suisse de supplémentation systématique n’y est rapportée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10899291/" target="_blank" rel="noopener">Fischer et al., European Journal of Nutrition 2024</a>.</p></template>

<template data-pop="e00-surdimutite" data-title="Surdi-mutité, strabisme et surdité de perception">
<div class="lab">Description</div><p>Le crétinisme neurologique associe une surdité de perception, un mutisme et un strabisme. La surdité de perception était semblable dans les trois types dans l’enquête thaïlandaise.</p>
<div class="lab">Exploration</div><p>L’audiométrie objective la surdité. Dans l’hypothyroïdie congénitale traitée, une atteinte auditive légère touche 20 à 25 % des adolescents, ce qui justifie des tests avant l’âge scolaire.</p>
<p class="src">Références : Rajatanavin et al., 1997 ; consensus ENDO-ERN 2021, section 4.1.</p></template>

<template data-pop="e00-pyramidal" data-title="Signes pyramidaux proximaux et extrapyramidaux">
<div class="lab">Description</div><p>Les enquêtes de Chine occidentale et de Java décrivent des signes pyramidaux à distribution proximale, des signes extrapyramidaux, une démarche caractéristique, un strabisme, une surdité et des réflexes primitifs persistants.</p>
<div class="lab">Technique</div><p>Le médecin recherche l’hyperréflexie, la spasticité et les réflexes primitifs, puis observe la marche. Les valeurs chiffrées de ces signes n’ont pas été lues sur le texte intégral et ne sont donc pas citées.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/brain/114.2.825" target="_blank" rel="noopener">Halpern et al., 1991 (résumé)</a>.</p></template>

<template data-pop="e00-signes-neonataux" data-title="Signes d’hypothyroïdie néonatale sévère">
<div class="lab">Signes</div><p>Le consensus européen cite l’hypotonie, l’ictère, la hernie ombilicale et la macroglossie parmi les signes d’une hypothyroïdie néonatale sévère.</p>
<div class="lab">Valeur et limite</div><p>Ces signes sont inconstants. Leur absence n’exclut pas une hypothyroïdie et ne dispense pas du dépistage biologique, qui reste le moyen principal de repérage.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 5.2.</p></template>

<template data-pop="e00-ft4" data-title="fT4 et TSH sériques : lecture et seuils">
<div class="lab">Définition</div><p>La fT4 est la thyroxine libre, la fraction de l’hormone qui n’est pas liée aux protéines de transport. Elle s’exprime en pmol/l. La TSH est l’hormone hypophysaire qui stimule la thyroïde ; elle s’exprime en mU/l.</p>
<div class="lab">Seuils du consensus européen</div><p>Sévérité selon la fT4 : inférieure à 5 pmol/l sévère, 5 à 10 modérée, 10 à 15 légère. La combinaison fT4 basse et TSH nettement élevée impose le traitement immédiat ; une TSH sérique supérieure à 20 mU/l lors de la confirmation vers la deuxième semaine conduit au traitement même si la fT4 est normale (seuil d’avis expert).</p>
<div class="lab">Pièges</div><p>Dans l’hypothyroïdie centrale, la TSH est basse, normale ou peu élevée alors que la fT4 est basse : la TSH seule trompe. Une référence suisse et ses limites sont expliquées dans la <button class="w" data-k="e00-normes-2026">fenêtre de normalité</button> ; pour le nouveau-né, demander l’intervalle adapté à l’âge et au terme au laboratoire de prise en charge.</p>
<p class="src">Références : consensus ENDO-ERN 2021, sections 1.3 et 2.1.</p></template>

<template data-pop="e00-seuils-traitement" data-title="Seuils de traitement de l’hypothyroïdie congénitale">
<div class="lab">Seuils</div><table class="t"><thead><tr><th>Situation</th><th>Décision</th></tr></thead><tbody><tr><td>fT4 basse, TSH nettement élevée</td><td>Traitement immédiat</td></tr><tr><td>TSH sérique supérieure à 20 mU/l à la confirmation vers la deuxième semaine, même si fT4 normale ; seuil d’avis expert</td><td>Traitement</td></tr><tr><td>TSH de 6 à 20 mU/l après le 21e jour, enfant sain, fT4 normale pour l’âge ; bénéfice thérapeutique incertain</td><td>Traitement et réévaluation, ou contrôle à 1-2 semaines</td></tr><tr><td>Si confirmation sérique impossible : TSH sur buvard supérieure à 40 mU/l ; recommandation européenne de contexte, pas seuil de rappel suisse</td><td>Traitement</td></tr></tbody></table>
<div class="lab">Lecture</div><p>Le tableau reprend les seuils du consensus ENDO-ERN. Il concerne l’hypothyroïdie congénitale du nouveau-né ; il ne détermine pas le traitement du crétinisme constitué.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 2.1.</p></template>

<template data-pop="e00-dysgenesie" data-title="Dysgénésie thyroïdienne">
<div class="lab">Fréquence</div><p>Elle représente environ 65 % des hypothyroïdies congénitales primaires permanentes, dans des populations suffisantes en iode.</p>
<div class="lab">Distinction avec E00</div><p>La dysgénésie est un défaut de la glande elle-même ; le crétinisme endémique résulte du manque d’iode chez la mère. Le contexte nutritionnel oriente ; la morphologie de la glande et l’évaluation étiologique distinguent les causes, sans se fonder sur la géographie seule.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 5.2.</p></template>

<template data-pop="e00-dyshormonogenese" data-title="Dyshormonogenèse">
<div class="lab">Caractéristiques</div><p>La glande est en place. La dyshormonogenèse représente moins de la moitié des quelque 35 % d’hypothyroïdies primaires permanentes non dues à une dysgénésie. Un goitre est possible et une récurrence de 25 % concerne les formes autosomiques récessives confirmées.</p>
<div class="lab">Conséquence</div><p>Une histoire familiale oriente vers ce diagnostic et peut justifier un diagnostic prénatal.</p>
<p class="src">Références : consensus ENDO-ERN 2021, sections 4.4, 5.2 et 5.3.</p></template>

<template data-pop="e00-centrale" data-title="Hypothyroïdie congénitale centrale">
<div class="lab">Biologie</div><p>La fT4 est basse alors que la TSH est basse, normale ou peu élevée.</p>
<div class="lab">Clinique</div><p>Le consensus cite le micropénis, la cryptorchidie, l’hypoglycémie et l’ictère prolongé.</p>
<div class="lab">Précaution</div><p>La fonction surrénalienne doit être vérifiée avant la lévothyroxine ; à défaut, les glucocorticoïdes sont donnés d’abord.</p>
<p class="src">Références : consensus ENDO-ERN 2021, sections 1.3 et 2.1.</p></template>

<template data-pop="e00-iode-exces" data-title="Hypothyroïdie transitoire par excès d’iode">
<div class="lab">Causes</div><p>Les antiseptiques iodés et les apports maternels riches en iode peuvent provoquer une hypothyroïdie transitoire. Le prématuré est particulièrement exposé, car il ne parvient pas à échapper à l’effet Wolff-Chaikoff.</p>
<div class="lab">Conduite</div><p>Éviter les antiseptiques iodés en période périnatale et rechercher l’exposition à l’anamnèse.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 3.4.</p></template>

<template data-pop="e00-anticorps" data-title="Anticorps maternels bloquant le récepteur de la TSH">
<div class="lab">Effet sur l’examen</div><p>Ces anticorps rendent la scintigraphie faussement « blanche » : l’absence de captation ne prouve pas l’absence de glande.</p>
<div class="lab">Conséquence</div><p>L’interprétation de l’imagerie tient compte de ce piège ; elle se fait après le début du traitement.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 2.3.</p></template>

<template data-pop="e00-pendred" data-title="Syndrome de Pendred">
<div class="lab">Définition</div><p>Le syndrome de Pendred associe une surdité à une dyshormonogenèse.</p>
<div class="lab">Différentiel</div><p>Il peut simuler le tableau d’un enfant sourd et hypothyroïdien. Le contexte de carence de la mère et de la communauté oriente vers E00 ; l’histoire familiale oriente vers la dyshormonogenèse.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 4.1.</p></template>

<template data-pop="e00-surveillance" data-title="Calendrier de surveillance de la lévothyroxine">
<div class="lab">Calendrier</div><table class="t"><thead><tr><th>Période</th><th>Fréquence des contrôles</th></tr></thead><tbody><tr><td>Début du traitement</td><td>1 à 2 semaines (au plus tard une semaine si dose initiale proche de 15 µg/kg/jour), puis toutes les 2 semaines jusqu’à normalisation de la TSH</td></tr><tr><td>Jusqu’à 12 mois</td><td>Tous les 1 à 3 mois</td></tr><tr><td>1 à 3 ans</td><td>Tous les 2 à 4 mois</td></tr><tr><td>Au-delà de 3 ans</td><td>Tous les 3 à 6 mois</td></tr><tr><td>Après tout changement de dose</td><td>4 à 6 semaines</td></tr></tbody></table>
<div class="lab">Modalités</div><p>La fT4 et la TSH sont dosées avant la prise ou au moins quatre heures après. La TSH devrait se normaliser en 4 semaines. Lorsque la permanence de l’hypothyroïdie n’a pas été établie, notamment avec une glande en place, l’axe est réévalué vers 2 à 3 ans sous conduite spécialisée ; il ne faut pas interrompre le traitement de sa propre initiative.</p>
<p class="src">Références : consensus ENDO-ERN 2021, sections 3.2 et 3.4.</p></template>

<template data-pop="e00-pronostic" data-title="Pronostic de l’hypothyroïdie congénitale traitée">
<div class="lab">Données</div><p>Sous traitement précoce, la plupart des enfants ont un développement et une scolarité normaux, et la déficience intellectuelle (quotient intellectuel inférieur à 70) est quasiment disparue. Dans les cohortes rapportées, un traitement précoce avec doses initiales d’au moins 10 µg/kg/jour était associé à des résultats comparables à ceux de la fratrie ; cela ne constitue pas une dose universelle pour toutes les formes légères. Un surdosage précoce est associé à des troubles de l’attention. Une atteinte auditive légère touche 20 à 25 % des adolescents.</p>
<div class="lab">Limite</div><p>Ces données concernent l’hypothyroïdie congénitale sporadique traitée dès le dépistage. Elles ne s’appliquent pas au crétinisme endémique constitué, dont le dommage cérébral précède la naissance.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 4.1.</p></template>

<template data-pop="e00-grossesse" data-title="Grossesse : substitution et prévention nutritionnelle"><p>Une femme traitée pour hypothyroïdie congénitale optimise son équilibre avant la conception. Le consensus ENDO-ERN 2021 recommande des contrôles fT4/TSH toutes 4–6 semaines pendant la grossesse et une TSH cible&lt;2,5 mU/L dans ce cadre de substitution. C’est une cible pour une femme traitée, pas un seuil diagnostique universel pour toute grossesse.</p><p>La FI Euthyrox précise la poursuite du traitement sans interruption, l’augmentation possible des besoins et le retour à la dose antérieure après l’accouchement, avec contrôle de TSH 6–8 semaines plus tard. Aucun pourcentage d’augmentation automatique n’est prescrit ici. Le consensus décrit le lien entre déficit hormonal maternel et risques obstétricaux/neurodéveloppementaux, tout en distinguant associations et certitude individuelle.</p><p>La substitution hormonale maternelle ne supprime pas le besoin d’un apport nutritionnel iodé suffisant. L’OSAV recommande de discuter individuellement le complément. L’allaitement est compatible avec Euthyrox aux doses thérapeutiques.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S101]</button>, <button class="w" data-k="e00-sources-2026">[S102]</button>, <button class="w" data-k="e00-sources-2026">[S112]</button>, <button class="w" data-k="e00-sources-2026">[S115]</button></span></template>

<template data-pop="e00-antenatal" data-title="Goitre fœtal : évaluation spécialisée"><p>Un goitre fœtal découvert à l’échographie ou une dyshormonogenèse familiale peuvent justifier une évaluation prénatale. Le consensus européen propose une échographie thyroïdienne à 20–22 semaines, interprétée selon l’âge gestationnel. Un gros goitre, notamment avec hydramnios ou risque d’obstruction trachéale, relève d’un centre multidisciplinaire spécialisé.</p><p>Le consensus décrit des injections intra-amniotiques de lévothyroxine dans certaines hypothyroïdies fœtales goitreuses non immunes chez une mère euthyroïdienne. Cette pratique spécialisée ne correspond pas à la voie orale de la FI suisse Euthyrox présentée ici : aucune posologie ni préparation injectable n’est proposée dans ce cours. Les données ne définissent pas un régime garantissant l’euthyroïdie à la naissance. Si la mère est hypothyroïdienne, le texte privilégie son traitement plutôt qu’un traitement direct du fœtus.</p><p>Le prélèvement sanguin fœtal est exceptionnel et discuté si une intervention prénatale est envisagée. La décision nécessite une évaluation bénéfices–risques et une information des parents.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S102]</button>, <button class="w" data-k="e00-sources-2026">[S101]</button></span></template>

<template data-pop="e00-allaitement" data-title="Allaitement et iode du lait">
<div class="lab">Mécanisme</div><p>Le nourrisson allaité dépend de l’iode du lait, dont la concentration est déterminée par l’apport maternel. Son besoin est élevé en raison d’un renouvellement hormonal rapide.</p>
<div class="lab">Conséquences</div><p>Une mère carencée prolonge le risque après la naissance. L’OMS recommande 250 µg/jour pendant l’allaitement ; chez le nourrisson allaité, le lait apporte l’iode dont la concentration dépend de l’alimentation maternelle. Un complément maternel n’est pas automatique en Suisse : son indication se discute selon les conseils OSAV.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab029" target="_blank" rel="noopener">Andersson et Braegger, 2022 (résumé)</a> ; OMS 2007.</p></template>

<template data-pop="e00-d-levothyroxine" data-title="Lévothyroxine (Euthyrox®) : monographie">
<div class="lab">Mécanisme</div><p>La lévothyroxine remplace la thyroxine absente ou insuffisante. Elle est administrée seule, par voie orale, une fois par jour.</p>
<div class="lab">Indication et preuves</div><p>L’information professionnelle suisse d’Euthyrox® (Merck, février 2023) indique l’hypothyroïdie congénitale et précise que la dose tolérée la plus élevée possible doit être donnée en prophylaxie du crétinisme, en cherchant à normaliser la TSH. Le consensus ENDO-ERN rapporte un développement normal chez la plupart des enfants traités tôt.</p>
<div class="lab">Posologie</div><p>Dose initiale de 10 à 15 µg/kg/jour (Swisspeddose : 0 à 28 jours, une prise par jour, ajustée sur la TSH et la fT4 pour l’âge). Doses par âge : 0 à 6 mois 25 à 75 µg ; 6 à 12 mois 50 à 75 µg ; 1 à 5 ans 75 à 100 µg ; 6 à 12 ans 100 à 150 µg. Augmentations par paliers de 2 à 4 semaines. Comprimé désagrégé dans un peu d’eau, au moins une demi-heure avant le premier repas.</p>
<div class="lab">Pharmacocinétique</div><p>Résorption jusqu’à environ 80 % à jeun, diminuée de jusqu’à 20 % avec la nourriture ; pic vers 5 heures ; demi-vie d’environ 7 jours, de 9 à 10 jours en hypothyroïdie.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Surdosage chez l’enfant : craniosténose et soudure épiphysaire prématurée. Contre-indiquée en cas de troubles hypophysaires ou surrénaliens non traités. Chez le prématuré très immature, collapsus cardiovasculaires rapportés. En contexte cardiaque, la prescription relève d’une évaluation spécialisée de la FI et d’une titration individualisée ; ne pas appliquer automatiquement une fraction de dose.</p>
<div class="lab">Surveillance</div><p>fT4 et TSH selon le calendrier du consensus européen.</p>
<p class="src">Références : information professionnelle suisse Euthyrox®, Merck (Schweiz) AG, Swissmedic, février 2023 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">consensus ENDO-ERN 2021, sections 2.1, 3.1 et 4.1</a>.</p></template>

<template data-pop="e00-d-iode-oms" data-title="Apport total, supplément et programme de santé publique"><p>La prévention commence avant la grossesse : la quantité totale d’iode nécessaire n’est pas la dose d’un supplément à ajouter automatiquement à l’alimentation. Le consensus européen indique environ 250 µg/jour d’apport total pendant la grossesse. En Suisse, l’OSAV recommande une alimentation riche en iode, du sel iodé sans augmenter le sel et une discussion avec le gynécologue pour décider d’un complément. Si un multinutriment est pris, vérifier qu’il contient de l’iode.</p><p>Le guide OMS 2007 décrit aussi des stratégies temporaires, y compris l’huile iodée, dans les régions où l’accès au sel iodé reste insuffisant. Ce contexte de santé publique ne peut être transposé automatiquement à une ordonnance suisse. Les anciennes quantités de ce programme ne sont donc plus présentées comme posologies de spécialités locales ; aucune FI suisse du produit exact ne les étaye ici.</p><p>La littérature distingue la prévention des effets de la carence sévère de l’incertitude sur un bénéfice neurodéveloppemental mesurable d’une supplémentation dans une carence légère. Une enquête d’iodurie ou une différence entre groupes supplémentés ne suffit pas à démontrer ce bénéfice chez chaque enfant.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S102]</button>, <button class="w" data-k="e00-sources-2026">[S104]</button>, <button class="w" data-k="e00-sources-2026">[S111]</button>, <button class="w" data-k="e00-sources-2026">[S112]</button>, <button class="w" data-k="e00-sources-2026">[S113]</button>, <button class="w" data-k="e00-sources-2026">[S114]</button></span></template>

<template data-pop="e00-mnemo" data-title="Moyen mnémotechnique : les trois S du crétinisme neurologique">
<div class="lab">Aide</div><p>Les trois S regroupent la surdi-mutité, le strabisme et la spasticité, les trois signes qui reviennent dans la définition neurologique du syndrome.</p>
<div class="lab">Mention</div><p>Aide pédagogique, non critère officiel.</p></template>

<template data-pop="pareto-e00-definition" data-title="Pareto — Définition et classification"><p class="ratio" data-cover="e00-0,e00-1"></p><ul><li>E00 désigne le crétinisme endémique par carence iodée, non l’hypothyroïdie congénitale sporadique.</li><li>Deux syndromes classiques : neurologique (plus fréquent) et hypothyroïdie sévère avec retard de croissance.</li><li>Les sous-codes E00.0, E00.1, E00.2 et E00.9 correspondent aux types neurologique, myxœdémateux, mixte et sans précision.</li><li>L’atteinte neurologique est présente dans tous les types.</li></ul></template>
<template data-pop="pareto-e00-mecanismes" data-title="Pareto — Épidémiologie et physiopathologie"><p class="ratio" data-cover="e00-2,e00-3"></p><ul><li>La carence iodée est la première cause évitable de lésions cérébrales ; le sel iodé suisse est ininterrompu depuis 1922.</li><li>Médiane d’iodurie de la femme enceinte suisse : 97 µg/l, insuffisante selon l’OMS.</li><li>Avant 18 à 20 semaines, le fœtus dépend de la thyroxine maternelle ; période critique du deuxième trimestre à 3 ans.</li><li>Type neurologique : hypothyroxinémie prénatale. Type myxœdémateux : hypothyroïdie postnatale persistante.</li></ul></template>
<template data-pop="pareto-e00-causes" data-title="Pareto — Causes et facteurs de risque"><p class="ratio" data-cover="e00-4"></p><ul><li>Cause : carence iodée maternelle sévère pendant la grossesse.</li><li>Régions à risque : montagnes, plaines alluviales, éloignement de la mer.</li><li>Thiocyanate : hypothèse spéculative ; rôle du sélénium non vérifié au-delà d’un titre.</li></ul></template>
<template data-pop="pareto-e00-clinique" data-title="Pareto — Anamnèse et examen"><p class="ratio" data-cover="e00-5,e00-6"></p><ul><li>Rechercher le contexte de carence (origine, goitres, autres cas).</li><li>Signes neurologiques : signes pyramidaux proximaux, extrapyramidaux, strabisme, surdité de perception, réflexes primitifs.</li><li>Signes myxœdémateux : petite taille, immaturité sexuelle, retard d’ossification.</li><li>Nouveau-né : hypotonie, ictère, hernie ombilicale, macroglossie, signes inconstants.</li></ul></template>
<template data-pop="pareto-e00-diagnostic" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="e00-7"></p><ul><li>Diagnostic clinique en contexte de carence ; indicateurs populationnels : iodurie, TSH néonatale supérieure à 5 mU/l.</li><li>Confirmation néonatale : TSH et fT4 sériques ; imagerie après le début du traitement.</li><li>Différentiel : dysgénésie, dyshormonogenèse, forme centrale, excès d’iode, anticorps maternels, syndrome de Pendred.</li></ul></template>
<template data-pop="pareto-e00-urgences" data-title="Pareto — Urgences"><p class="ratio" data-cover="e00-8"></p><ul><li>fT4 basse et TSH nettement élevée : lévothyroxine immédiate, au plus tard 2 semaines après la naissance.</li><li>Forme centrale : vérifier la fonction surrénalienne avant la lévothyroxine.</li><li>Prématuré très immature : surveiller la circulation.</li></ul></template>
<template data-pop="pareto-e00-traitement" data-title="Pareto — Prise en charge"><p class="ratio" data-cover="e00-9,e00-10,e00-11"></p><ul><li>Le crétinisme se prévient : apport iodé suffisant avant la grossesse, objectif nutritionnel total de 250 µg/jour pendant la grossesse selon le consensus européen.</li><li>Nouveau-né hypothyroïdien : dose individualisée selon la sévérité ;10–15 µg/kg/jour pour une forme sévère. La normalisation de la TSH en 4 semaines est un objectif de la forme primaire.</li><li>Contrôle à 1–2 semaines, au plus tard une semaine si dose initiale proche de 15 µg/kg/jour ; puis toutes les 2 semaines jusqu’à normalisation de la TSH primaire, puis selon l’âge.</li><li>Aucune preuve de récupération des lésions neurologiques anciennes n’est établie ici ; une hypothyroïdie persistante doit néanmoins être traitée.</li></ul></template>
<template data-pop="pareto-e00-suivi" data-title="Pareto — Suivi et pronostic"><p class="ratio" data-cover="e00-10"></p><ul><li>Pronostic favorable de l’hypothyroïdie congénitale traitée tôt ; surveiller l’audition.</li><li>Éducation des parents et transition planifiée.</li></ul></template>
<template data-pop="pareto-e00-examens" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="e00-e-1,e00-e-2,e00-e-3,e00-e-4,e00-e-5"></p><ul><li>Dépistage suisse au 4e jour ; confirmation par TSH et fT4 sériques.</li><li>Seuils néonatals : traiter si fT4 basse avec TSH nettement élevée ; le seuil sérique de TSH supérieure à 20 mU/l à la confirmation vers la deuxième semaine est un avis expert.</li><li>Iodurie : inférieure à 20 µg/l carence sévère ; femme enceinte inférieure à 150 µg/l insuffisant.</li><li>Antiseptiques iodés : faussent la TSH néonatale.</li></ul></template>
<template data-pop="pareto-e00-anat" data-title="Pareto — Anatomie"><p class="ratio" data-cover="e00-s-anat-cours"></p><ul><li>Cerveau, noyaux gris centraux, audition, thyroïde et squelette sont atteints.</li><li>Calcifications des noyaux gris : hypothyroïdiens sévères seulement.</li></ul></template>
<template data-pop="pareto-e00-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="e00-s-physio-cours"></p><ul><li>Besoins en iode : 90, 120, 150, 250 µg/jour.</li><li>Thyroïde fœtale fonctionnelle vers 18 à 20 semaines.</li><li>Adaptation à la carence : captation accrue, goitre, sécrétion de T3.</li></ul></template>
<template data-pop="pareto-e00-bioch" data-title="Pareto — Biochimie"><p class="ratio" data-cover="e00-s-bioch-cours"></p><ul><li>Le symporteur sodium-iodure assure le transport actif de l’iodure.</li><li>Thiocyanate : hypothèse spéculative ; sélénium : titre seul, aucune conduite clinique.</li><li>Excès d’iode : hypothyroïdie transitoire du prématuré.</li></ul></template>
<template data-pop="pareto-e00-sante" data-title="Pareto — Santé publique"><p class="ratio" data-cover="e00-s-sante-cours"></p><ul><li>Programme suisse volontaire : un tiers des aliments transformés seulement.</li><li>Discuter le complément avec le gynécologue ; si un multinutriment est pris, vérifier sa teneur en iode.</li><li>Résultat de supplémentation en carence légère non extrapolable à la carence sévère.</li></ul></template>
<template data-pop="pareto-e00-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="e00-p-1,e00-p-2,e00-p-3,e00-p-4"></p><ul><li>Prévention par l’iode ; substitution par la lévothyroxine.</li><li>Lévothyroxine néonatale : dose selon la sévérité,10–15 µg/kg/jour dans une forme sévère ; suivi primaire par TSH/fT4, central principalement par fT4.</li><li>Résorption réduite par la nourriture ; surdosage : craniosténose.</li><li>Éviter les antiseptiques iodés.</li></ul></template>

<template data-pop="e00-sources-2026" data-title="Sources consultées et limites de la reprise"><p>Lectures ciblées du 2 novembre 2026, distinctes du dossier historique. Les auto-relectures sont attribuées à l’auteur IA ; elles ne constituent ni une revue indépendante ni une validation médicale humaine.</p><ul><li><b>[S101]</b> <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">Euthyrox, information professionnelle suisse; annexe SwissPedDose séparée</a> — février 2023; exemplaire AmiKo généré 1 novembre 2026. Composition; indications; posologie pédiatrique; contre-indications; mises en garde; interactions; grossesse/allaitement; pharmacocinétique; conservation; SwissPedDose. <b>Portée :</b> Patients recevant Euthyrox; nourrissons et enfants. <b>Limites :</b> Annexe SwissPedDose distincte du texte FI. Aucun maximum néonatal inventé; pas de données d’ajustement rénal/hépatique dans la FI.</li><li><b>[S102]</b> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">Congenital Hypothyroidism: 2020–2021 Consensus Guidelines Update</a> — 2021. §2.1–2.4;3.1–3.5;4.1–4.6;5.2 et tableaux 2–3; recommandations 1.3 ; §5.3 diagnostic et traitement prénatals (section intégrale lue). <b>Portée :</b> Hypothyroïdie congénitale, toutes causes. <b>Limites :</b> Ce cadre ne fait pas de toute hypothyroïdie congénitale un syndrome E00. Certaines conduites sont avis expert. Recommandation médicamenteuse européenne distincte de FI suisse.</li><li><b>[S103]</b> <a href="https://www.blv.admin.ch/fr/monitorage-statut-en-iode-dans-la-population-suisse" target="_blank" rel="noopener">Monitorage du statut en iode dans la population suisse</a> — page consultée 2 novembre 2026; enquête 2020–2022. Contexte; résultats; conception. <b>Portée :</b> Enfants 6–12 ans et femmes enceintes en Suisse. <b>Limites :</b> La page résume des données de groupe. Les valeurs sous-groupes 88/140 diffèrent du primaire 81/129; ne pas fusionner ces estimations.</li><li><b>[S104]</b> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10899291/" target="_blank" rel="noopener">Iodine intake in the Swiss population 100 years after the introduction of iodised salt</a> — 2024; mise en ligne décembre 2023. Résumé; méthodes recrutement/critères; résultats enfants et grossesse; discussion et limites; fig 1–2. <b>Portée :</b> 362 enfants 6–12 ans;473 échantillons urinaires initiaux grossesse; enquête 2020–2022. <b>Limites :</b> Étude transversale; iodurie ponctuelle et médiane de groupe; pas preuve de bénéfice neurodéveloppemental individuel. Méthode de calcul d’inadéquation utilise références nutritionnelles nord-américaines (National Academy of Medicine), aucune conduite américaine adoptée.</li><li><b>[S105]</b> <a href="https://www.neoscreening.ch/fr/" target="_blank" rel="noopener">Dépistage néonatal Suisse</a> — page consultée 2 novembre 2026. Prélèvement au quatrième jour; résultats; page Maladies: hypothyroïdie. <b>Portée :</b> Nouveau-nés suisses. <b>Limites :</b> Le seuil analytique de rappel n’est pas fourni sur ces pages; pas assimilé au seuil sérique de traitement.</li><li><b>[S106]</b> <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">The Thyroid Gland: normal anatomy, follicle and hormone synthesis</a> — page courante 2026; original figure 2013 acquis séparément. Description initiale; figure 17.12 et légende; synthèse et régulation hormonales. <b>Portée :</b> Anatomie/histologie normales humaines. <b>Limites :</b> Manuel de sciences; aucune conduite clinique américaine fondée sur ce texte. Licence image acquise de version 2013 CC BY 3, distincte licence texte de la deuxième édition courante.</li><li><b>[S107]</b> <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2026/block-e00-e07.htm" target="_blank" rel="noopener">ICD-10-GM 2026, E00 et E03</a> — 2026. E00 inclusions/exclusion et E00.0/.1/.2/.9; exclusion E03. <b>Portée :</b> Classification allemande; rapprochement du libellé OFS local 2024. <b>Limites :</b> Ne constitue pas validation de l’édition suisse applicable. Libellés français canoniques conservés.</li><li><b>[S108]</b> <a href="https://europepmc.org/article/MED/2043952" target="_blank" rel="noopener">The neurology of endemic cretinism. A study of two endemias</a> — 1991. Résumé réellement lu. <b>Portée :</b> 104 sujets Chine et 35 Java;50 scanners. <b>Limites :</b> Série historique de carence sévère; observations non généralisables aux nouveau-nés suisses dépistés; pas performances diagnostiques inventées.</li><li><b>[S109]</b> <a href="https://europepmc.org/article/MED/9368501" target="_blank" rel="noopener">Endemic cretinism in Thailand: a multidisciplinary survey</a> — 1997. Résumé réellement lu. <b>Portée :</b> 112 patients 2–66 ans, Thaïlande. <b>Limites :</b> Sélection clinique en endémie; hypothèse mécanistique attribuée; pas effet de traitement ni prévalence suisse.</li><li><b>[S110]</b> <a href="https://www.viollier.ch/fr/analysis/35634" target="_blank" rel="noopener">T4 libre, référence analytique 35634</a> — page consultée 2 novembre 2026. Matériel; méthode; valeurs de référence. <b>Portée :</b> Classe 0–19 ans, femmes et hommes; sérum; immunodosage chimiluminescent. <b>Limites :</b> Plage 13,4–21,1 pmol/L pour classe large; pas intervalle néonatal individualisé par jour/terme. Interprétation nouveau-né avec laboratoire pédiatrique obligatoire.</li><li><b>[S111]</b> <a href="https://www.blv.admin.ch/fr/sel-iode" target="_blank" rel="noopener">Pas plus de sel, mais du sel iodé !</a> — page consultée 2 novembre 2026. Pourquoi iode; aliments; couvrir besoins; concentration 25 mg/kg; grossesse/allaitement. <b>Portée :</b> Population suisse et grossesse/allaitement. <b>Limites :</b> Conseil nutritionnel. Ne prescrit pas de spécialité iodée ni de dose médicamenteuse.</li><li><b>[S112]</b> <a href="https://www.blv.admin.ch/fr/alimentation-grossesse-et-allaitement" target="_blank" rel="noopener">Alimentation pendant la grossesse et l’allaitement</a> — page consultée 2 novembre 2026. Iode, nutriment essentiel. <b>Portée :</b> Projet de grossesse, grossesse et allaitement. <b>Limites :</b> Conseil individualisé auprès gynécologue; aucun produit iodé automatiquement recommandé.</li><li><b>[S113]</b> <a href="https://www.blv.admin.ch/dam/fr/sd-web/N4QwSwOsdlbA/faq-ernaehrung-schwangerschaft-stillzeit-fr.pdf" target="_blank" rel="noopener">Questions et réponses sur l’alimentation pendant grossesse/allaitement</a> — novembre 2018; remis en ligne juillet 2026. Pages 1–2, question iode. <b>Portée :</b> Grossesse/allaitement en Suisse. <b>Limites :</b> Date du document 2018 conservée; date téléchargement/site ne vaut pas révision 2026.</li><li><b>[S114]</b> <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">Assessment of iodine deficiency disorders and monitoring their elimination, third edition</a> — 2007. p.6 ; §2.4 p.12 ; tableaux 4–5 p.33 et contexte p.32 ; références populationnelles ; §4.4.1 p.40 TSH néonatale (passage intégral lu). <b>Portée :</b> Programmes nutritionnels et populations à risque. <b>Limites :</b> Ancien guide international; doses huile iodée ne sont pas prescriptions suisses. Besoins totaux distingués de supplémentation.</li><li><b>[S115]</b> <a href="https://www.blv.admin.ch/dam/fr/sd-web/DknRSfuZymhE/faq-jod-supplement-fr.pdf" target="_blank" rel="noopener">Iode: réponses aux questions les plus fréquentes</a> — octobre 2024; remis en ligne septembre 2026. Deux pages; alimentation, sel iodé, législation, mer, fortification. <b>Portée :</b> Population suisse. <b>Limites :</b> Distinguer alimentation iodée et hypersensibilité au produit de contraste. Pas conseil pour pathologie spécifique non décrite.</li></ul><p>Les résumés hérités sur l’histoire suisse, la surveillance de 2005, l’allaitement, le thiocyanate, les effets de la correction populationnelle et l’essai de supplémentation de 2017 ont été relus séparément. Pour Dumont 1994 sur le sélénium, seul le titre est disponible : aucune description détaillée ni intervention n’en est déduite.</p></template>
<template data-pop="e00-normes-2026" data-title="fT4 : normalité, méthode et décision"><p>La fT4 est la fraction libre de thyroxine, exprimée ici en pmol/L. La référence suisse Viollier 35634 publie 13,4–21,1 pmol/L pour la classe 0–19 ans, deux sexes, sur sérum avec un immunodosage chimiluminescent. Cette catégorie d’âge très large ne fournit pas une norme particulière pour chaque jour de vie ou pour le prématuré.</p><p>Pour un nouveau-né, il faut donc connaître l’intervalle néonatal du laboratoire, l’âge en jours, le terme, les traitements et le moment du prélèvement. Le consensus européen demande une interprétation selon l’âge. Une fT4 basse associée à une TSH nettement élevée oriente vers une forme primaire ; une TSH basse, normale ou seulement peu élevée n’exclut pas une forme centrale. Le seuil sérique TSH&gt;20 mU/L, vers la deuxième semaine à la confirmation, est un seuil thérapeutique d’avis expert, pas une valeur normale ni un seuil de rappel suisse.</p><p>Au suivi, le prélèvement se fait avant la prise ou au moins 4 heures après. Une valeur de fT4 isolément élevée ne conduit pas automatiquement à diminuer la dose si la TSH et le contexte ne le justifient pas. La biotine peut perturber certains immunodosages : informer le laboratoire en cas d’utilisation.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S101]</button>, <button class="w" data-k="e00-sources-2026">[S102]</button>, <button class="w" data-k="e00-sources-2026">[S110]</button></span></template>
<template data-pop="e00-calcul-dose" data-title="De µg/kg/jour à µg/jour : calcul expliqué"><p>Une dose pondérale exprime la quantité quotidienne par kilogramme de poids. La dose totale est le produit de la dose pondérale par le poids : <b>µg/kg/jour × kg = µg/jour</b>. Les kilogrammes se simplifient ; les microgrammes ne doivent jamais être confondus avec les milligrammes.</p><p><b>Exemple pédagogique fictif :</b> pour un poids de 3,2 kg et une dose déjà choisie par le prescripteur de 10 µg/kg/jour, le calcul donne 10 × 3,2 = 32 µg/jour. À 15 µg/kg/jour, le même calcul donnerait 48 µg/jour. Ces résultats illustrent le calcul, pas une ordonnance. Ils ne déterminent ni l’indication, ni la dose appropriée à cet enfant, ni une fraction de comprimé à fabriquer.</p><p>La plage néonatale harmonisée SwissPedDose affichée par AmiKo est 10–15 µg/kg par prise, une prise par jour,0–28 jours, avec adaptation à la TSH et à la fT4. Le produit suisse disponible et la possibilité réelle d’administrer la dose doivent être vérifiés. Aucun maximum universel n’est déduit de cet exemple. Une dose mal notée en mg au lieu de µg multiplie la quantité par 1000.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S101]</button></span></template>
<template data-pop="e00-calcul-mediane" data-title="Médiane d’iodurie : calcul et limite clinique"><p>La médiane partage une série ordonnée en deux moitiés. Exemple fictif de cinq mesures en µg/L :50,80,100,160,300. La troisième valeur est 100 µg/L : c’est la médiane, même si les personnes ont des valeurs très différentes. Avec un effectif pair, on prend la moyenne des deux valeurs centrales.</p><p>L’exemple ne constitue pas une enquête représentative. Les seuils de l’OMS s’appliquent à une population et à un groupe physiologique identifiés : enfant d’âge scolaire, femme enceinte ou allaitante. Une médiane ne classe pas chaque personne de l’échantillon. Une iodurie ponctuelle est influencée par les apports récents et la dilution ; elle ne reconstitue pas l’exposition fœtale ancienne et ne diagnostique pas à elle seule E00.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S104]</button>, <button class="w" data-k="e00-sources-2026">[S114]</button></span></template>
<template data-pop="e00-calcul-sel" data-title="Du sel iodé à la quantité d’iode : conversion"><p>Le sel suisse décrit par l’OSAV contient 25 mg d’iode par kg de sel. Comme 1 mg = 1000 µg et 1 kg = 1000 g, on obtient 25 µg d’iode par gramme de sel. Un exemple fictif de 2 g de ce sel correspond donc à 50 µg d’iode, avant de considérer les autres sources alimentaires et les conditions d’utilisation.</p><p>Ce calcul n’est pas une recommandation de consommer davantage de sel. L’OSAV demande précisément de choisir le sel iodé sans augmenter la quantité de sel. La teneur d’un produit particulier doit être vérifiée sur son étiquetage ; sel marin et sel iodé ne sont pas équivalents.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S111]</button>, <button class="w" data-k="e00-sources-2026">[S115]</button></span></template>
<template data-pop="pareto-e00-histo" data-title="Pareto — Histologie"><p class="ratio" data-cover="e00-s-histo-cours"></p><p>Le follicule comprend un épithélium et une cavité de colloïde contenant la thyroglobuline. L’iode permet l’élaboration des hormones stockées sur cette protéine ; la stimulation par TSH participe à leur libération. Une carence en substrat et un défaut de synthèse sont des mécanismes distincts. La micrographie normale explique cette organisation ; elle ne diagnostique pas une carence.</p></template>
<template data-pop="e00-thyroperoxydase" data-title="TPO : thyroperoxydase dans ce cours"><p>Il s’agit ici de la thyroperoxydase, enzyme impliquée dans l’organification de l’iode et le couplage des résidus iodés sur la thyroglobuline. Le gène de cette enzyme figure parmi les causes de dyshormonogenèse dans le consensus européen. Une anomalie de cette synthèse n’est pas une carence nutritionnelle en iode.</p><p>Le même sigle peut désigner la thrombopoïétine en hématologie : cette autre signification ne s’applique pas au mécanisme thyroïdien présenté ici.</p><p>Sources : consensus ENDO-ERN 2021, tableaux des défauts génétiques de synthèse ; manuel OpenStax, synthèse hormonale normale.</p><button class="w" data-k="e00-sources-2026">Sources S102 et S106</button></template>
