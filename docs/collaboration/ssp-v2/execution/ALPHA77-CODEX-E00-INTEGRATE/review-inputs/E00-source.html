<section class="ilot" id="e00-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Un enfant naît dans une région où le sel iodé n’est pas disponible et où les goitres sont fréquents dans la population. Plus tard, ses parents s’inquiètent de son développement : il n’entend pas, parle peu ou pas, marche avec une démarche raide et présente un strabisme. Certains enfants de la même communauté sont, en plus, petits pour leur âge et ont des traits épaissis. Cette présentation est le <button class="w" data-k="e00-definition">crétinisme endémique (définition et place dans la classification E00)</button>, que la classification suisse range sous le code E00.</p>
<p>Cette <b>vignette est pédagogique</b> : elle rassemble des signes décrits dans les enquêtes de terrain, elle ne représente pas un patient réel. Elle pose trois questions que le cours traite dans l’ordre. Pourquoi une carence en un oligo-élément alimentaire détruit-elle de façon définitive le cerveau d’un enfant ? Pourquoi le même syndrome existe-t-il avec et sans hypothyroïdie persistante ? Comment, en Suisse, reconnaître et traiter un nouveau-né hypothyroïdien, qui constitue une situation urgente et distincte à reconnaître en pratique ?</p>
<div class="trap"><span class="k">Piège</span> Le libellé français « syndrome d’insuffisance thyroïdienne congénitale » suggère une hypothyroïdie congénitale quelconque. L’intitulé anglais de la même catégorie est « congenital iodine-deficiency syndrome » : E00 désigne la <b>carence iodée</b>. L’hypothyroïdie congénitale sporadique, due à une glande absente, ectopique ou à une synthèse hormonale altérée, relève d’autres catégories ; elle est traitée ici comme diagnostic différentiel et comme cadre de prise en charge du nouveau-né.</div>
<div class="key"><b>À retenir.</b> E00 est le crétinisme endémique, c’est-à-dire une atteinte neurodéveloppementale irréversible causée par la carence en iode de la mère et du fœtus. La prévention évite cette atteinte ; une hypothyroïdie persistante et les besoins auditifs, moteurs, éducatifs ou sociaux restent à prendre en charge après le diagnostic.</div>
</section>

<section class="ilot" id="e00-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Le <button class="w" data-k="e00-definition">crétinisme endémique (définition, deux syndromes classiques)</button> est la forme extrême des troubles dus à la carence en iode (<button class="w" data-k="e00-tdci">TDCI (spectre complet des troubles)</button>). La revue de Chen et Hetzel (2010) en distingue deux syndromes classiques. Le premier est un <b>trouble neurologique</b>, le plus fréquent, associant des lésions cérébrales, une surdi-mutité, un strabisme et une parésie spastique des membres inférieurs. Le second, moins fréquent, est un <b>syndrome d’hypothyroïdie sévère</b> avec retard de croissance et déficit mental moins marqué. Les deux sont causés par la carence iodée alimentaire et sont évitables par sa correction <b>avant la grossesse</b>.</p>
<p>Le guide de l’<button class="w" data-k="e00-sources-guides">OMS</button> de 2007 en donne la définition chez le nouveau-né et l’enfant : une déficience mentale associée, en proportions variables, à du mutisme, une diplégie spastique, un strabisme, une hypothyroïdie et une petite taille. Cette définition est descriptive : aucune source consultée ne propose de critères diagnostiques individuels formalisés et validés.</p>
<p>La <button class="w" data-k="e00-sous-types">classification CIM-10-GM 2024 (sous-codes E00.0, E00.1, E00.2, E00.9)</button> subdivise la catégorie selon le tableau clinique dominant.</p>
<table class="t"><thead><tr><th>Sous-code</th><th>Type</th><th>Traits dominants</th></tr></thead><tbody><tr><td>E00.0</td><td>Neurologique</td><td>Déficience mentale profonde, surdi-mutité, diplégie spastique</td></tr><tr><td>E00.1</td><td>Myxœdémateux</td><td>Retard statural sévère, traits myxœdémateux, déficit mental moindre, maturation sexuelle retardée</td></tr><tr><td>E00.2</td><td>Mixte</td><td>Association des deux tableaux</td></tr><tr><td>E00.9</td><td>Sans précision</td><td>Aucune précision disponible</td></tr></tbody></table>
<p>Ce tableau classe les sous-codes selon le tableau clinique. Il suppose deux entités distinctes, mais cette séparation est discutée : dans une enquête thaïlandaise, les trois types ne se distinguaient pas par le quotient intellectuel, la surdité de perception ni le déficit psychomoteur. La <button class="w" data-k="e00-sous-types">remise en cause de la dichotomie (Thaïlande, Chine, Java)</button> est détaillée dans la fenêtre associée et reprise dans la physiopathologie.</p>
<div class="trap"><span class="k">Piège</span> Le code E00 ne s’applique pas à une hypothyroïdie congénitale par dysgénésie ou dyshormonogenèse. Ces entités relèvent d’autres catégories du chapitre des maladies endocriniennes, par exemple E03.0 et E03.1 dans le fichier nosologique du dépôt.</div>
<button class="pareto-btn ui" data-k="pareto-e00-definition">▲ Loi de Pareto — Définition et classification</button>
</section>

<section class="ilot" id="e00-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p><b>Dans le monde.</b> L’<button class="w" data-k="e00-sources-guides">OMS</button> reconnaît la carence iodée comme la première cause évitable de lésions cérébrales : le guide de 2007 estimait à plus de 2 milliards les personnes à risque dans 130 pays. Ce chiffre historique n’est pas une estimation actuelle. L’usage domestique du sel iodé est passé de moins de 20 % avant 1990 à 68 % en 2000. Environ la moitié de l’Europe restait légèrement carencée selon une revue de 2009 ; ce pourcentage décrit cette période historique.</p>
<p><b>En Suisse, un siècle de prévention.</b> Coindet, à Genève, traite le goitre par l’iode en 1813. Au début du vingtième siècle, des médecins suisses démontrent l’efficacité de la prophylaxie iodée contre le goitre et le crétinisme. Le programme de <button class="w" data-k="e00-sel">sel iodé (histoire et ajustements successifs en Suisse)</button> est ininterrompu depuis 1922, et la Suisse et les États-Unis ont été les premiers pays à iodurer le sel. Aucune source consultée ne chiffre la prévalence historique du crétinisme en Suisse.</p>
<p>La teneur en iode du sel a été relevée de 15 à 20 mg/kg en 1999, puis à 25 mg/kg en janvier 2014 (marge autorisée de 20 à 40 mg/kg). Après le premier relèvement, la proportion de nouveau-nés avec une <button class="w" data-k="e00-tsh-neonatale">TSH néonatale supérieure à 5 mU/l (indicateur populationnel)</button> est passée de 2,9 % (1992-1998, 259 035 nouveau-nés) à 1,7 % (1999-2004, 218 665 nouveau-nés).</p>
<p><b>Situation actuelle.</b> Une étude nationale de 2020-2022 (<button class="w" data-k="e00-suisse-2020">apport en iode de la population suisse (résultats détaillés)</button>) montre que le programme est <b>volontaire</b> : plus de 80 % des ménages utilisent du sel iodé, mais seulement un tiers des aliments transformés en contiennent. La médiane d’iodurie est de 127 µg/l chez l’enfant (adéquate) et de <b>97 µg/l chez la femme enceinte</b>, ce qui est insuffisant selon le seuil de l’<button class="w" data-k="e00-sources-guides">OMS</button>. Les femmes qui prennent un supplément d’iode (47 % de l’échantillon) ont une médiane de 129 µg/l contre 81 µg/l pour les autres.</p>
<p><b>Hypothyroïdie congénitale sporadique (diagnostic différentiel).</b> Le consensus européen estime l’incidence de l’hypothyroïdie congénitale primaire à environ 1 naissance sur 2000 à 3000 selon les programmes ; le dépistage suisse indique environ un nouveau-né sur 3500 pour l’hypothyroïdie congénitale. Ces chiffres ne sont pas l’incidence du syndrome nutritionnel E00. Dans les pays suffisants en iode, l’<button class="w" data-k="e00-sources-guides">OMS</button> donne environ 1 sur 4000 et indique que la carence iodée est, hors goitrogènes, le seul facteur important qui augmente cette incidence.</p>
<div class="key"><b>À retenir.</b> En Suisse, le crétinisme endémique a disparu avec le sel iodé, mais la médiane d’iodurie de la femme enceinte reste inférieure au seuil de suffisance de l’<button class="w" data-k="e00-sources-guides">OMS</button>. Aucune source lue ne rapporte un cas contemporain de crétinisme endémique en Suisse.</div>
</section>

<section class="ilot" id="e00-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p><b>Le normal d’abord.</b> L’iode est un constituant des hormones thyroïdiennes. Le <button class="w" data-k="e00-nis">symporteur sodium-iodure (transport actif de l’iodure)</button> l’amène dans la thyroïde, ce qui constitue la première étape de la synthèse hormonale. Ces hormones sont indispensables au développement du système nerveux central et des poumons du fœtus et du nouveau-né. La thyroïde fœtale n’est pas fonctionnellement mûre avant 18 à 20 semaines de grossesse : au début du développement cérébral, le fœtus dépend donc de la <button class="w" data-k="e00-t4-maternelle">thyroxine d’origine maternelle (apport et dépendance fœtale)</button>, et cet apport exige un statut iodé maternel optimal.</p>
<p>La <button class="w" data-k="e00-fenetre">période la plus critique (deuxième trimestre à la troisième année)</button> couvre donc la fin de la grossesse et le début de la vie. Les besoins quotidiens en iode recommandés par l’<button class="w" data-k="e00-besoins">OMS, l’UNICEF et l’ICCIDD (90, 120, 150, 250 µg)</button> augmentent de 150 µg chez l’adulte à 250 µg pendant la grossesse et l’allaitement.</p>
<p><b>La carence.</b> Quand l’apport est très insuffisant, la thyroïde augmente la captation et le recyclage de l’iode, sécrète préférentiellement la T3 et, sous l’effet d’une TSH élevée, accroît sa masse : c’est le goitre. Si la carence est sévère, ces adaptations ne suffisent plus et la production hormonale baisse (hypothyroïdie).</p>
<p><b>Du mécanisme au tableau clinique.</b> Chez la femme enceinte carencée, la thyroxine disponible pour le cerveau fœtal est insuffisante pendant la neurogenèse. Cette <button class="w" data-k="e00-hypoxinemie">hypothyroxinémie maternelle et fœtale (conséquences neurologiques)</button> produit l’atteinte cérébrale diffuse et irréversible du type neurologique. Le type myxœdémateux s’y ajoute lorsque l’hypothyroïdie <b>persiste après la naissance</b> : elle retarde la croissance, l’ossification et la maturation sexuelle. L’atteinte neurologique se retrouve ainsi dans tous les types ; c’est la persistance de l’hypothyroïdie postnatale qui distingue le type myxœdémateux.</p>
<p>Deux pistes historiques sont évoquées pour le tableau myxœdémateux : la carence en <button class="w" data-k="e00-cofacteurs">sélénium et les goitrogènes (hypothèses)</button> et l’effet du thiocyanate sur l’iode du lait. Le thiocyanate est une hypothèse spéculative explicitement décrite dans le résumé de Laurberg. Pour le sélénium, le titre de Dumont évoque ce rôle, mais aucun résumé ni texte intégral n’a été obtenu : ce titre ne permet pas de décrire un mécanisme ni de proposer une intervention.</p>
<table class="t"><thead><tr><th>Étape</th><th>Normal</th><th>Dans la carence sévère</th></tr></thead><tbody><tr><td>Apport en iode</td><td>150 µg/jour chez l’adulte, 250 µg pendant la grossesse</td><td>Très insuffisant pendant la grossesse</td></tr><tr><td>Thyroïde maternelle</td><td>Hormones suffisantes ; relais fœtal par la thyroxine maternelle</td><td>Hypothyroxinémie maternelle puis fœtale</td></tr><tr><td>Cerveau fœtal</td><td>Neurogenèse avec apport hormonal adéquat</td><td>Atteinte diffuse irréversible</td></tr><tr><td>Après la naissance</td><td>Production thyroïdienne adéquate</td><td>Hypothyroïdie persistante possible : retard statural, osseux et pubertaire</td></tr></tbody></table>
<p>Le tableau suit la chaîne causale de l’apport vers la manifestation. Il montre que le dommage cérébral se joue avant la naissance, à un moment où aucun traitement du nouveau-né ne peut intervenir.</p>
<div class="trap"><span class="k">Piège</span> Un enfant né d’une mère carencée peut avoir une hypothyroïdie biologique modeste après la naissance et pourtant une atteinte neurologique profonde. L’intensité de l’hypothyroïdie postnatale n’indique pas l’étendue du dommage cérébral, qui s’est constitué avant.</div>
<button class="pareto-btn ui" data-k="pareto-e00-mecanismes">▲ Loi de Pareto — Physiopathologie</button>
</section>

<section class="ilot" id="e00-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>La cause est la <b>carence iodée maternelle sévère pendant la grossesse</b>. L’<button class="w" data-k="e00-sources-guides">OMS</button> décrit les régions typiques : chaînes de montagnes, plaines alluviales, hautes altitudes et zones éloignées de la mer. L’absence de sel iodé et les conflits qui empêchent sa distribution sont des facteurs de risque. Les goitrogènes alimentaires, notamment le thiocyanate, sont proposés comme facteurs aggravants.</p>
<p>En Suisse actuelle, le facteur de risque est un apport marginal chez la femme enceinte sans supplément : la médiane d’iodurie de 97 µg/l est inférieure au seuil de 150 µg/l, et 31 % des femmes sans supplément ont un apport inférieur à 160 µg/jour contre 0,2 % de celles qui en prennent. Toutes les femmes de l’étude étaient euthyroïdiennes.</p>
<table class="t"><thead><tr><th>Facteur</th><th>Mécanisme</th><th>Niveau de preuve dans le dossier</th></tr></thead><tbody><tr><td>Région carencée (montagne, plaine alluviale, éloignement de la mer)</td><td>Apport alimentaire en iode insuffisant en l’absence de sel iodé</td><td>Guide de l’<button class="w" data-k="e00-sources-guides">OMS</button> 2007</td></tr><tr><td>Absence de sel iodé</td><td>Aucune source alimentaire d’appoint</td><td>Guide de l’<button class="w" data-k="e00-sources-guides">OMS</button> 2007</td></tr><tr><td>Goitrogènes (thiocyanate)</td><td>Inhibition compétitive du symporteur dans la glande mammaire</td><td>Hypothèse spéculative selon les auteurs</td></tr><tr><td>Carence en sélénium</td><td>Cofacteur proposé du type myxœdémateux</td><td>Titre de publication seulement ; mécanisme et bénéfice non vérifiés</td></tr><tr><td>Apport marginal de la femme enceinte en Suisse</td><td>Un tiers seulement des aliments transformés est préparé avec du sel iodé ; 47 % des femmes seulement prennent un supplément</td><td>Étude nationale suisse 2024</td></tr></tbody></table>
<p>Le tableau hiérarchise les facteurs selon le niveau de preuve réellement disponible. Le premier est établi ; les deux suivants sont des hypothèses.</p>
<div class="key"><b>À retenir.</b> Le facteur causal est unique et nutritionnel. La prévention se joue donc avant la conception, à l’échelle de la population (sel iodé) et de la femme (supplément en cas d’apport insuffisant).</div>
<button class="pareto-btn ui" data-k="pareto-e00-causes">▲ Loi de Pareto — Causes et facteurs de risque</button>
</section>

<section class="ilot" id="e00-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire cherche d’abord le contexte de carence. Le médecin demande l’origine de la mère et le lieu de la grossesse : région carencée, absence de sel iodé, conflits ayant limité l’approvisionnement. Il demande si la communauté connaît des goitres fréquents ou d’autres cas semblables. Il documente ensuite le développement psychomoteur, l’audition et le langage.</p>
<p>Deux formes cliniques se rencontrent, et leur interrogatoire diffère.</p>
<div class="two"><div class="card"><h4>Forme neurologique (E00.0)</h4><p>L’interrogatoire du développement psychomoteur, de l’audition et du langage retrouve une déficience intellectuelle, une surdité de perception et un mutisme, associés à une démarche anormale. Le <button class="w" data-k="e00-surdimutite">strabisme et la surdi-mutité (caractérisation)</button> sont souvent signalés en premier.</p></div><div class="card"><h4>Forme myxœdémateuse (E00.1)</h4><p>Le motif de consultation est un retard de croissance avec des traits myxœdémateux et une maturation sexuelle retardée. Le déficit mental peut être moins marqué, mais l’atteinte neurologique est généralement présente.</p></div></div>
<p>Chez un nouveau-né, l’anamnèse recherche les signes d’une hypothyroïdie néonatale : hypotonie, ictère prolongé, hernie ombilicale, macroglossie. Elle recherche aussi les <button class="w" data-k="e00-iode-exces">expositions à l’iode (antiseptiques iodés, apports maternels riches en iode)</button>, qui peuvent causer une hypothyroïdie transitoire.</p>
<div class="trap"><span class="k">Piège</span> L’absence de goitre dans la famille n’exclut pas une carence maternelle ; le goitre est une adaptation, pas un signe constant d’une carence ayant touché la grossesse.</div>
</section>

<section class="ilot" id="e00-6"><h2 data-semiology-clinical="E00"><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, vitaux, croissance, puis signes ciblés. Dans le syndrome constitué, les signes neurologiques, myxœdémateux et thyroïdiens sont recherchés.</p>
<div class="two"><div class="card"><h4>Signes neurologiques</h4><ul><li>Déficience intellectuelle.</li><li><button class="w" data-k="e00-pyramidal">Signes pyramidaux à distribution proximale (technique et lecture)</button>, hyperréflexie, signes extrapyramidaux et démarche caractéristique.</li><li>Strabisme, <button class="w" data-k="e00-surdimutite">surdité de perception et mutisme</button>, persistance des réflexes primitifs.</li></ul></div><div class="card"><h4>Signes myxœdémateux</h4><ul><li>Petite taille.</li><li>Traits myxœdémateux et immaturité sexuelle.</li><li>Retard d’ossification et épiphyses anormales à la radiographie.</li></ul></div></div>
<p>Chez le nouveau-né hypothyroïdien, le tableau est différent : <button class="w" data-k="e00-signes-neonataux">hypotonie, ictère, hernie ombilicale, macroglossie (valeur et limites)</button>. Ces signes sont inconstants et leur absence ne dispense pas du dépistage biologique.</p>
<p>Le médecin examine enfin la glande : le volume thyroïdien est plus faible chez les sujets hypothyroïdiens dans l’enquête thaïlandaise ; un goitre est possible, notamment dans une dyshormonogenèse.</p>
<div class="key"><b>À retenir.</b> L’examen neurologique est anormal dans tous les types. Ce sont la taille, les traits, la maturation sexuelle et la radiographie qui indiquent la persistance d’une hypothyroïdie postnatale. Un <button class="w" data-k="e00-mnemo">moyen mnémotechnique (aide pédagogique, non critère officiel)</button> aide à retenir la triade neurologique.</div>
<button class="pareto-btn ui" data-k="pareto-e00-clinique">▲ Loi de Pareto — Anamnèse et examen</button>
</section>

<section class="ilot" id="e00-7"><h2><span class="n">7</span>Démarche diagnostique et diagnostic différentiel</h2>
<p><b>Diagnostic du syndrome.</b> Le diagnostic du crétinisme endémique est clinique et se pose dans un contexte de carence iodée sévère de la population : iodurie médiane basse, goitre endémique, TSH néonatale élevée. Deux indicateurs populationnels de l’<button class="w" data-k="e00-sources-guides">OMS</button> situent ce contexte. La <button class="w" data-k="e00-iodurie">médiane d’iodurie de l’enfant d’âge scolaire (seuils de l’OMS)</button> est inférieure à 20 µg/l en cas de carence sévère. La fréquence des <button class="w" data-k="e00-tsh-neonatale">TSH néonatales supérieures à 5 mU/l (prélèvement à 3-4 jours)</button> est inférieure à 3 % dans une population suffisante en iode, et peut dépasser 40 % en zone d’endémie sévère.</p>
<p><b>Bilan individuel.</b> Chez le nouveau-né suspect d’hypothyroïdie, la confirmation repose sur la TSH et la <button class="w" data-k="e00-ft4">fT4 sériques (interprétation et seuils)</button>. L’imagerie de la thyroïde (échographie ou scintigraphie) est organisée sans retarder le début du traitement. Une radiographie du genou estime la sévérité de l’hypothyroïdie intra-utérine. Dans les séries historiques, un scanner a montré des calcifications des noyaux gris centraux chez certains sujets sévèrement hypothyroïdiens ; cette observation ne justifie pas un scanner systématique. Une audiométrie documente l’atteinte auditive.</p>
<p><b>Diagnostic différentiel.</b> Le médecin doit distinguer le crétinisme endémique des hypothyroïdies congénitales d’autres origines, car la conduite et le conseil familial diffèrent.</p>
<table class="t"><thead><tr><th>Entité</th><th>Élément distinctif</th></tr></thead><tbody><tr><td><button class="w" data-k="e00-dysgenesie">Dysgénésie thyroïdienne (fréquence et mécanisme)</button></td><td>Environ 65 % des hypothyroïdies congénitales primaires permanentes ; population suffisante en iode</td></tr><tr><td><button class="w" data-k="e00-dyshormonogenese">Dyshormonogenèse (glande en place)</button></td><td>Moins de la moitié des 35 % restants ; goitre possible ; récurrence de 25 % pour une transmission autosomique récessive confirmée</td></tr><tr><td><button class="w" data-k="e00-centrale">Hypothyroïdie congénitale centrale (fT4 basse, TSH basse ou normale)</button></td><td>fT4 basse avec TSH basse, normale ou peu élevée ; micropénis, cryptorchidie, hypoglycémie, ictère prolongé</td></tr><tr><td><button class="w" data-k="e00-iode-exces">Hypothyroïdie transitoire par excès d’iode</button></td><td>Antiseptiques iodés, apports maternels riches en iode ; prématuré incapable d’échapper à l’effet Wolff-Chaikoff</td></tr><tr><td><button class="w" data-k="e00-anticorps">Anticorps maternels bloquant le récepteur de la TSH</button></td><td>Scintigraphie faussement « blanche »</td></tr><tr><td><button class="w" data-k="e00-pendred">Syndrome de Pendred</button></td><td>Surdité associée à une dyshormonogenèse</td></tr></tbody></table>
<p>Le tableau ordonne les alternatives selon l’élément qui les sépare du crétinisme endémique : la glande (absente, présente mais défaillante), l’axe hypophysaire (central), l’exposition à l’iode (transitoire) et l’immunité maternelle. Dans le syndrome de carence iodée, le contexte maternel et populationnel doit être documenté ; il ne remplace pas l’évaluation des autres causes.</p>
<div class="trap"><span class="k">Piège</span> Un enfant sourd et hypothyroïdien n’a pas forcément un crétinisme endémique : le syndrome de Pendred associe surdité et dyshormonogenèse. Le contexte nutritionnel oriente, mais ne tranche pas à lui seul : l’exploration thyroïdienne et audiologique, puis la génétique si indiquée, discriminent les causes.</div>
<div class="trap"><span class="k">Erreur fréquente</span> Retarder la substitution pour réaliser une scintigraphie chez un nouveau-né à TSH très élevée : l’imagerie ne doit pas retarder la lévothyroxine, et des anticorps maternels bloquants peuvent donner un résultat trompeur.</div>
<button class="pareto-btn ui" data-k="pareto-e00-diagnostic">▲ Loi de Pareto — Diagnostic</button>
</section>

<section class="ilot" id="e00-arbre-2026"><h2>Arbre clinique : partir de la présentation</h2><ol><li><b>Dépistage anormal ou signes d’appel chez le nouveau-né :</b> joindre la filière pédiatrique spécialisée et confirmer rapidement par fT4 et TSH sériques. Une fT4 basse avec TSH nettement élevée appelle le traitement sans attendre l’imagerie.</li><li><b>fT4 basse avec TSH inadaptée :</b> rechercher une forme centrale et évaluer les autres fonctions hypophysaires, en particulier l’axe surrénalien avant la lévothyroxine ; tenir compte de la prématurité et d’une maladie intercurrente.</li><li><b>Hypothyroïdie primaire confirmée :</b> traiter puis caractériser la glande et le contexte maternel. Une ectopie ou une dysgénésie, une dyshormonogenèse, une exposition iodée ou des anticorps maternels orientent vers une autre cause que la carence congénitale.</li><li><b>Troubles neurodéveloppementaux anciens :</b> documenter grossesse et exposition nutritionnelle, audition, développement et croissance ; mesurer la fonction hormonale actuelle. Le tableau ancien et le traitement d’une hypothyroïdie présente répondent à deux questions distinctes.</li><li><b>Question de prévention dans une population :</b> utiliser des enquêtes adaptées et leur médiane d’iodurie ; ne pas appliquer ces seuils comme diagnostic individuel d’E00.</li></ol><p>Une origine géographique, un goitre ou un bilan isolé ne remplace aucune de ces étapes. La finalité est d’identifier le risque traitable, puis la cause, avant de choisir le code administratif.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S102]</button>, <button class="w" data-k="e00-sources-2026">[S107]</button>, <button class="w" data-k="e00-sources-2026">[S108]</button>, <button class="w" data-k="e00-sources-2026">[S109]</button>, <button class="w" data-k="e00-sources-2026">[S114]</button></span></section><section class="ilot" id="e00-8"><h2><span class="n">8</span>Urgences et situations à ne pas manquer</h2>
<div class="alert"><b>Gravité d’abord.</b> L’urgence de prévention neurodéveloppementale est le <b>nouveau-né hypothyroïdien</b>. Une personne porteuse de séquelles anciennes nécessite néanmoins une évaluation de son état clinique et hormonal actuel. Un nouveau-né avec une fT4 basse et une TSH nettement élevée reçoit la <b>lévothyroxine immédiatement, au plus tard deux semaines après la naissance</b>. Chaque jour de retard expose le cerveau en développement à l’hypothyroïdie.</div>
<p>Trois situations demandent une précaution particulière.</p>
<table class="t"><thead><tr><th>Situation</th><th>Risque</th><th>Conduite</th></tr></thead><tbody><tr><td>Hypothyroïdie centrale</td><td>Insuffisance surrénalienne associée possible</td><td>Vérifier la fonction surrénalienne avant la lévothyroxine ; à défaut, glucocorticoïdes d’abord. L’information professionnelle suisse contre-indique la lévothyroxine en cas de troubles hypophysaires ou surrénaliens non traités.</td></tr><tr><td>Prématuré très immature</td><td>Collapsus cardiovasculaires rapportés sous lévothyroxine, par immaturité de l’axe et insuffisance corticosurrénalienne</td><td>Surveiller la circulation pendant le traitement.</td></tr><tr><td>Insuffisance cardiaque associée</td><td>Dose initiale habituelle non adaptée au contexte cardiaque</td><td>Évaluation spécialisée et titration individualisée. La FI Euthyrox décrit des contre-indications cardiaques ; aucune réduction automatique de moitié n’est prescrite ici.</td></tr></tbody></table>
<p>Le tableau montre que l’urgence est de traiter, mais que le premier geste dépend du contexte. Dans le doute sur l’axe hypophyso-surrénalien, la protection surrénalienne précède la thyroxine.</p>
<div class="trap"><span class="k">Piège</span> Attendre le résultat du second prélèvement chez un nouveau-né dont la fT4 est basse et la TSH nettement élevée. Le seuil de décision est celui du premier bilan sérique, pas la normalisation espérée d’un contrôle.</div>
<div class="key"><b>À retenir.</b> Le caractère ancien des séquelles ne permet pas de présumer que la fonction thyroïdienne actuelle est normale. L’urgence est de reconnaître et de traiter l’hypothyroïdie du nouveau-né avant qu’elle n’ajoute son effet à celui de la carence.</div>
<button class="pareto-btn ui" data-k="pareto-e00-urgences">▲ Loi de Pareto — Urgences</button>
</section>

<section class="ilot" id="e00-9"><h2><span class="n">9</span>Prise en charge</h2>
<p><b>Objectif.</b> Le traitement du crétinisme endémique est <b>préventif</b> : le syndrome est évitable par correction de la carence iodée avant la grossesse. L’atteinte neurologique constituée n’est décrite comme réversible dans aucune des sources lues.</p>
<p><b>9.1 Prévention.</b> En Suisse, la prévention repose sur le <button class="w" data-k="e00-sel">sel iodé (25 mg d’iode/kg de sel)</button>, utilisé sans augmenter la quantité totale de sel consommée. <span class="src"><button class="w" data-k="e00-sources-2026">[S111]</button></span> Les auteurs de l’étude nationale demandent plus de sel iodé dans les aliments transformés, et recommandent de choisir une multivitamine prénatale qui contient de l’iode. Au niveau européen, le consensus <button class="w" data-k="e00-sources-guides">ENDO-ERN</button> recommande un apport de 250 µg/jour d’iode à toute femme enceinte. L’OSAV conseille aux femmes ayant un projet de grossesse, enceintes ou allaitantes de discuter avec leur gynécologue la nécessité d’un complément et de choisir un multinutriment contenant de l’iode si elles en prennent un. La <button class="w" data-k="e00-d-iode-oms">différence entre apport nutritionnel, supplément et programme de santé publique</button> évite une prescription automatique. <span class="src"><button class="w" data-k="e00-sources-2026">[S112]</button>, <button class="w" data-k="e00-sources-2026">[S113]</button></span></p>
<div class="trap"><span class="k">Piège</span> Une supplémentation en iode chez des femmes enceintes <b>légèrement</b> carencées (médiane d’iodurie 131 µg/l, Inde et Thaïlande) avec 200 µg/jour n’a pas modifié le quotient intellectuel ni les fonctions exécutives à 5-6 ans dans un essai ayant inclus 832 femmes, dont 313 enfants ont été évalués pour le quotient intellectuel et 315 pour les fonctions exécutives ; cette attrition limite l’interprétation. Ce résultat ne s’extrapole pas à la carence sévère, qui est celle du crétinisme.</div>
<p><b>9.2 Nouveau-né hypothyroïdien.</b> En Suisse, le dépistage est réalisé par prélèvement au 4e jour de vie, analysé au laboratoire de dépistage de Zurich, dans le programme national de dépistage. Le consensus européen privilégie la TSH, test le plus sensible pour l’hypothyroïdie primaire, avec un prélèvement à 48 heures de vie au moins ; un second prélèvement vers 10 à 14 jours est possible chez les prématurés, les petits poids de naissance et les enfants malades.</p>
<p>Le traitement est la <button class="w" data-k="e00-d-levothyroxine">lévothyroxine seule, par voie orale, une fois par jour (monographie)</button>. Les <button class="w" data-k="e00-seuils-traitement">seuils de traitement (fT4, TSH, buvard)</button> sont : fT4 basse avec TSH nettement élevée, traitement immédiat ; TSH sérique supérieure à 20 mU/l lors de la confirmation vers la deuxième semaine, même avec une fT4 normale, traitement (avis expert) ; TSH de 6 à 20 mU/l après le 21e jour avec une fT4 normale, traitement et réévaluation ou contrôle à 1-2 semaines. La dose initiale va jusqu’à 15 µg/kg/jour : 10 à 15 µg/kg/jour dans une forme sévère, environ 10 µg/kg/jour dans une forme légère. La fT4 sépare les formes selon sa valeur : inférieure à 5 pmol/l sévère, de 5 à 10 modérée, de 10 à 15 légère.</p>
<p><b>9.3 Crétinisme constitué.</b> L’hypothyroïdie persistante se traite par lévothyroxine selon l’information professionnelle, et la carence iodée sous-jacente se corrige par l’iode. Aucune source lue ne quantifie le bénéfice d’un traitement tardif chez l’enfant ou l’adulte atteint de type myxœdémateux. Le suivi est pluridisciplinaire : développement, audition, scolarité.</p>
<div class="key"><b>À retenir.</b> La prévention (iode avant la grossesse) évite le crétinisme ; la lévothyroxine précoce évite l’aggravation par l’hypothyroïdie du nouveau-né. Aucune ne répare une atteinte cérébrale constituée.</div>
<button class="pareto-btn ui" data-k="pareto-e00-traitement">▲ Loi de Pareto — Prise en charge</button>
</section>

<section class="ilot" id="e00-10"><h2><span class="n">10</span>Suivi, pronostic et prévention</h2>
<p><b>Surveillance du traitement.</b> Le consensus <button class="w" data-k="e00-sources-guides">ENDO-ERN</button> dose la fT4 et la TSH avant la prise ou au moins quatre heures après. La TSH doit idéalement se normaliser en 4 semaines. Le <button class="w" data-k="e00-surveillance">calendrier des contrôles (fréquence selon l’âge)</button> est un premier contrôle à 1–2 semaines (au plus tard une semaine si dose initiale proche de 15 µg/kg/jour), puis toutes les 2 semaines jusqu’à normalisation de la TSH, tous les 1 à 3 mois jusqu’à 12 mois, tous les 2 à 4 mois de 1 à 3 ans, tous les 3 à 6 mois ensuite, et 4 à 6 semaines après tout changement de dose. Lorsque la permanence de l’hypothyroïdie n’a pas été établie, notamment avec une glande en place, l’axe est réévalué vers 2 à 3 ans sous conduite spécialisée ; il ne faut pas interrompre le traitement de sa propre initiative.</p>
<p><b>Pronostic sous traitement précoce.</b> Dans l’hypothyroïdie congénitale traitée tôt, la plupart des enfants ont un <button class="w" data-k="e00-pronostic">développement et une scolarité normaux (données et limites)</button>, et la déficience intellectuelle (QI inférieur à 70) a quasiment disparu. Une atteinte auditive légère touche 20 à 25 % des adolescents : des tests auditifs sont réalisés avant l’âge scolaire. Le pronostic du crétinisme constitué n’est pas chiffré dans les sources lues.</p>
<p><b>Éducation et transition.</b> Les parents sont éduqués dès le diagnostic, pour assurer une prise régulière pendant toute la durée nécessaire ; un traitement à vie dépend de la permanence de l’hypothyroïdie. La transition de la pédiatrie vers la médecine adulte est planifiée.</p>
<p><b>Prévention.</b> La correction populationnelle d’une carence entraîne une hausse transitoire de l’hyperthyroïdie (autonomie nodulaire) puis sa normalisation, et une légère augmentation de l’hypothyroïdie infraclinique et de l’auto-immunité. Ces effets se surveillent à l’échelle d’une population, ils ne remettent pas en cause la prévention.</p>
<button class="pareto-btn ui" data-k="pareto-e00-suivi">▲ Loi de Pareto — Suivi et pronostic</button>
</section>

<section class="ilot" id="e00-11"><h2><span class="n">11</span>Situations particulières</h2>
<table class="t"><thead><tr><th>Situation</th><th>Conduite d’après les sources</th></tr></thead><tbody><tr><td>Grossesse d’une femme hypothyroïdienne congénitale</td><td>Optimiser la lévothyroxine avant la conception ; contrôle toutes les 4 à 6 semaines ; <button class="w" data-k="e00-grossesse">TSH cible inférieure à 2,5 mU/l (justification)</button> ; retour à la dose préconceptionnelle après l’accouchement</td></tr><tr><td>Diagnostic prénatal</td><td>Goitre fœtal ou dyshormonogenèse familiale : <button class="w" data-k="e00-antenatal">échographie thyroïdienne fœtale à 20-22 semaines et lévothyroxine intra-amniotique (indications)</button></td></tr><tr><td>Allaitement</td><td><button class="w" data-k="e00-allaitement">L’iode du lait dépend de l’apport maternel (conséquences)</button> ; la médiane d’iodurie est plus basse chez la femme allaitante, car l’iode passe dans le lait</td></tr><tr><td>Antiseptiques iodés</td><td>À éviter en période périnatale</td></tr><tr><td>Trisomie 21, jumeaux</td><td>TSH à la fin de la période néonatale ; nouveau dépistage à envisager chez les jumeaux</td></tr></tbody></table>
<p>Le tableau regroupe les cas où le calendrier ou la dose habituels changent. Aucun d’eux ne modifie la règle générale : traiter précocement et corriger l’apport en iode.</p>
<div class="trap"><span class="k">Piège</span> Considérer l’iode du lait comme constant : le nourrisson allaité dépend de l’apport de sa mère, et son besoin est élevé en raison d’un renouvellement hormonal rapide.</div>
</section>

<section class="ilot" id="e00-12"><h2><span class="n">12</span>Critères formels et paramètres clés</h2>
<div class="alert"><b>Critères formels.</b> Aucune source lue ne fournit de critères diagnostiques individuels formalisés et validés du crétinisme endémique ; les éléments suivants sont des définitions descriptives.<ul><li><b>Crétinisme endémique :</b> atteinte neurodéveloppementale (déficience mentale, surdi-mutité, diplégie spastique, strabisme) avec ou sans hypothyroïdie et petite taille, chez un sujet né dans une population en carence iodée sévère (<button class="w" data-k="e00-sources-guides">OMS</button> 2007, tableau 1).</li><li><b>Carence iodée sévère d’une population :</b> médiane d’iodurie de l’enfant d’âge scolaire inférieure à 20 µg/l.</li><li><b>Suffisance iodée d’une population :</b> moins de 3 % de TSH néonatales supérieures à 5 mU/l à J3-J4.</li><li><b>Hypothyroïdie congénitale à traiter :</b> fT4 basse pour l’âge avec TSH nettement élevée, ou TSH sérique supérieure à 20 mU/l à la confirmation vers la deuxième semaine (avis expert).</li></ul></div>
<div class="key"><b>Paramètres clés.</b><ul><li>Besoins en iode : 90 µg/jour (0-59 mois), 120 µg (6-12 ans), 150 µg (adolescent, adulte), 250 µg (grossesse, allaitement).</li><li>Iodurie médiane adéquate : 100-199 µg/l chez l’enfant d’âge scolaire ; 150-249 µg/l pendant la grossesse.</li><li>Suisse : sel à 25 mg/kg ; iodurie 97 µg/l pendant la grossesse, 127 µg/l chez l’enfant.</li><li>Hypothyroïdie congénitale en Suisse : 1 sur 3500 ; dépistage au 4e jour.</li><li>Lévothyroxine néonatale : 10-15 µg/kg/jour, début au plus tard à 2 semaines ; TSH normalisée en environ 4 semaines.</li><li>Fenêtre critique : deuxième trimestre à 3 ans ; thyroïde fœtale fonctionnelle vers 18-20 semaines.</li></ul></div>
</section>

<div class="src"><p>Références héritées du dossier du 14 octobre 2026 : Office fédéral de la statistique, <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024, catégorie E00</a> ; Organisation mondiale de la santé, UNICEF et ICCIDD, <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">Assessment of iodine deficiency disorders and monitoring their elimination, 3e édition, 2007</a> ; van Trotsenburg et al., <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">consensus ENDO-ERN, ESPE et ESE sur l’hypothyroïdie congénitale, Thyroid 2021</a> ; Fischer et al., <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10899291/" target="_blank" rel="noopener">apport en iode de la population suisse, European Journal of Nutrition 2024</a> ; <a href="https://www.neoscreening.ch/de/krankheiten/" target="_blank" rel="noopener">dépistage néonatal suisse, Kinderspital Zürich</a> ; information professionnelle suisse Euthyrox®, Merck (Schweiz) AG, Swissmedic, février 2023.</p><p>Compléments (résumés lus) : Chen et Hetzel, <a href="https://doi.org/10.1016/j.beem.2009.08.014" target="_blank" rel="noopener">Cretinism revisited, 2010</a> ; Rajatanavin et al., <a href="https://doi.org/10.1530/eje.0.1370349" target="_blank" rel="noopener">crétinisme endémique en Thaïlande, 1997</a> ; Halpern et al., <a href="https://doi.org/10.1093/brain/114.2.825" target="_blank" rel="noopener">neurologie du crétinisme endémique, 1991</a> ; Zimmermann et al., <a href="https://doi.org/10.1093/ajcn.82.2.388" target="_blank" rel="noopener">sel iodé suisse, 2005</a> ; Gowachirapant et al., <a href="https://doi.org/10.1016/S2213-8587(17)30332-7" target="_blank" rel="noopener">supplémentation chez la femme enceinte, 2017</a>. La reprise du 2 novembre 2026 a consulté directement les pages OSAV sur le sel iodé et la grossesse, ainsi que les questions et réponses 2018 et 2024. Les recommandations nutritionnelles suisses sont désormais distinguées des anciens schémas internationaux de supplémentation. <span class="src"><button class="w" data-k="e00-sources-2026">[S111]</button>, <button class="w" data-k="e00-sources-2026">[S112]</button>, <button class="w" data-k="e00-sources-2026">[S113]</button>, <button class="w" data-k="e00-sources-2026">[S115]</button></span> Le seuil suisse de TSH du dépistage néonatal n’a pas été trouvé.</p></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="e00-e-1"><h2><span class="n">e-1</span>Hiérarchie des examens</h2>
<p>Deux questions différentes se posent en pratique, et elles n’appellent pas les mêmes examens. La première est populationnelle : une communauté est-elle carencée en iode, et à quel degré ? La seconde est individuelle : un nouveau-né est-il hypothyroïdien, et faut-il le traiter ? Aucune source lue ne désigne un test de référence individuel pour le crétinisme endémique constitué, dont le diagnostic reste clinique dans un contexte de carence. Pour la confirmation biologique chez le nouveau-né, le <b>test de référence</b> du consensus <button class="w" data-k="e00-sources-guides">ENDO-ERN</button> est le couple TSH et <button class="w" data-k="e00-ft4">fT4 sériques (lecture et seuils)</button>, qui confirme le dépistage. Pour une population, la référence est la <button class="w" data-k="e00-iodurie">médiane d’iodurie (échelle de l’OMS)</button>.</p>
<table class="t"><thead><tr><th>Question</th><th>Examen</th><th>Statut</th></tr></thead><tbody><tr><td>Un nouveau-né est-il suspect d’hypothyroïdie ?</td><td>Dépistage par TSH sur buvard au 4e jour de vie</td><td>Systématique en Suisse</td></tr><tr><td>Le dépistage est-il confirmé ?</td><td>TSH et fT4 sériques</td><td>Indiqué</td></tr><tr><td>La glande est-elle en place, ectopique ou absente ?</td><td>Échographie et scintigraphie thyroïdiennes, après le début du traitement</td><td>Conditionnel</td></tr><tr><td>Quelle est la sévérité de l’hypothyroïdie intra-utérine ?</td><td>Radiographie du genou</td><td>Conditionnel</td></tr><tr><td>Que décrivaient les séries historiques ?</td><td>Calcifications des noyaux gris observées au scanner chez certains sujets sévèrement hypothyroïdiens</td><td>Observation historique, sans indication de scanner systématique établie par ces séries</td></tr><tr><td>L’enfant entend-il ?</td><td>Audiométrie avant l’âge scolaire</td><td>Indiqué</td></tr><tr><td>La population est-elle carencée ?</td><td>Médiane d’iodurie, fréquence des TSH néonatales supérieures à 5 mU/l</td><td>Santé publique</td></tr></tbody></table>
<p>Le tableau relie chaque question à un examen et à son statut. La colonne « statut » signale qu’aucun de ces examens ne remplace l’autre : la scintigraphie ne décide pas du traitement, qui repose sur le bilan sérique.</p>
<div class="trap"><span class="k">Piège</span> Un examen d’imagerie ne se demande pas « pour compléter » un bilan : il répond à la question de l’étiologie et ne retarde pas le début de la lévothyroxine.</div>
</section>

<section class="ilot" id="e00-e-2"><h2><span class="n">e-2</span>Dépistage néonatal et bilan thyroïdien</h2>
<p><b>Dépistage.</b> En Suisse, le prélèvement est fait au 4e jour de vie et analysé à Zurich. La recommandation européenne dose la TSH, test le plus sensible pour l’hypothyroïdie primaire, sur un prélèvement fait à 48 heures de vie au moins. Chez les prématurés, les petits poids de naissance et les enfants malades, un second prélèvement vers 10 à 14 jours est possible. Le seuil suisse de TSH du dépistage n’a pas été trouvé et n’est donc pas cité.</p>
<p><b>Confirmation.</b> Le dépistage positif est confirmé par la <button class="w" data-k="e00-ft4">fT4 et la TSH sériques (valeurs, unités et pièges)</button>. Les <button class="w" data-k="e00-seuils-traitement">seuils de traitement</button> sont rappelés ci-dessous.</p>
<table class="t"><thead><tr><th>Profil biologique</th><th>Lecture</th><th>Conduite</th></tr></thead><tbody><tr><td>fT4 basse, TSH nettement élevée</td><td>Hypothyroïdie primaire</td><td>Lévothyroxine immédiate</td></tr><tr><td>TSH sérique supérieure à 20 mU/l à la confirmation vers la deuxième semaine, même si fT4 normale ; seuil d’avis expert</td><td>Hypothyroïdie primaire à fT4 conservée</td><td>Traiter</td></tr><tr><td>TSH de 6 à 20 mU/l après le 21e jour, enfant sain, fT4 normale pour l’âge ; bénéfice thérapeutique incertain</td><td>Zone intermédiaire</td><td>Traiter et réévaluer, ou contrôler à 1-2 semaines</td></tr><tr><td>fT4 basse, TSH basse, normale ou peu élevée</td><td>Hypothyroïdie centrale</td><td>Vérifier la fonction surrénalienne avant la lévothyroxine</td></tr><tr><td>Pas de laboratoire disponible, TSH sur buvard supérieure à 40 mU/l</td><td>Hypothyroïdie probable</td><td>Traiter</td></tr></tbody></table>
<p>Le tableau croise les configurations de TSH et de fT4 avec la lecture et la conduite. Ces valeurs concernent l’hypothyroïdie congénitale ; elles s’appliquent au nouveau-né, quelle que soit la cause de l’hypothyroïdie, carence iodée comprise.</p>
<div class="two"><div class="card"><h4>Sévérité selon la fT4</h4><table class="t"><thead><tr><th>fT4 avant traitement</th><th>Sévérité descriptive selon ENDO-ERN</th></tr></thead><tbody><tr><td>&lt;5 pmol/L</td><td>Sévère</td></tr><tr><td>5–10 pmol/L</td><td>Modérée</td></tr><tr><td>10–15 pmol/L</td><td>Légère</td></tr></tbody></table><p>Ce classement porte sur une hypothyroïdie diagnostiquée. Les intervalles sont reproduits tels que le consensus les présente ; la valeur exacte aux bornes et l’intervalle normal pour l’âge sont interprétés avec la biologie complète. Il ne classe pas la gravité d’un syndrome neurologique ancien.</p></div><div class="card"><h4>Pièges de prélèvement</h4><p>Les antiseptiques iodés, comme la povidone iodée, élèvent la TSH néonatale. Les anticorps maternels bloquants rendent la scintigraphie faussement « blanche ».</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span> Écarter un trouble central parce que la TSH est « normale », sans regarder la fT4 : dans l’hypothyroïdie centrale, la TSH est basse, normale ou peu élevée alors que la fT4 est basse.</div>
</section>

<section class="ilot" id="e00-e-normes"><h2>Norme, seuil et cible : trois lectures différentes</h2><p>Une valeur de référence décrit une population mesurée avec une méthode ; un seuil déclenche une action clinique ; une cible guide le traitement. Ces trois usages ne sont pas interchangeables.</p><table class="t"><thead><tr><th>Repère</th><th>Valeur et contexte</th><th>Utilisation et limite</th></tr></thead><tbody><tr><td>fT4, exemple de référence suisse</td><td>13,4–21,1 pmol/L ; sérum, immunodosage chimiluminescent Viollier ; classe 0–19 ans, deux sexes</td><td>La classe large publiée ne fournit pas une norme par jour de vie ou par terme. Demander l’intervalle néonatal applicable au laboratoire de prise en charge.</td></tr><tr><td>Seuil sérique de traitement</td><td>TSH&gt;20 mU/L à la confirmation, vers la deuxième semaine, même si fT4 normale</td><td>Consensus européen : seuil arbitraire fondé sur avis expert. Ce n’est pas le seuil suisse de rappel sur buvard.</td></tr><tr><td>Zone de décision</td><td>TSH 6–20 mU/L après 21 jours chez un nouveau-né en bonne santé, avec fT4 normale pour l’âge</td><td>Traiter puis réévaluer, ou recontrôler 1–2 semaines plus tard sous conduite spécialisée ; bénéfice du traitement incertain.</td></tr><tr><td>Cible du suivi d’hypothyroïdie primaire</td><td>TSH dans la référence pour l’âge, avec interprétation de fT4</td><td>Les prélèvements sont faits avant la prise ou au moins 4 heures après ; une fT4 isolément élevée ne suffit pas à réduire automatiquement la dose.</td></tr></tbody></table><p>Le seuil suisse de rappel du dépistage n’est pas documenté ici et n’est pas remplacé par une valeur d’un autre programme. La <button class="w" data-k="e00-normes-2026">fenêtre d’interprétation</button> détaille les conditions et la distinction primaire–centrale.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S102]</button>, <button class="w" data-k="e00-sources-2026">[S110]</button></span><p><b>Forme centrale : objectif de suivi différent.</b> Après sécurisation de l’axe surrénalien, le consensus suit principalement la fT4, maintenue au-dessus de la moyenne ou médiane de l’intervalle adapté à l’âge. Si la TSH était basse avant traitement, son dosage répété peut être omis dans ce cadre spécialisé. La normalisation de la TSH utilisée dans l’hypothyroïdie primaire n’est donc pas une cible transposable automatiquement. Une fT4 proche de la borne basse fait rechercher un sous-traitement ; une fT4 élevée s’interprète avec l’horaire de prise et les signes cliniques.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S102]</button></span></section><section class="ilot" id="e00-e-3"><h2><span class="n">e-3</span>Indicateurs de population</h2>
<p>L’<button class="w" data-k="e00-sources-guides">OMS</button> évalue la carence iodée d’une population avec la <button class="w" data-k="e00-iodurie">médiane d’iodurie (échelle complète)</button>. L’iode urinaire reflète l’apport récent de la population : il se lit sur la médiane d’un groupe, pas sur la valeur d’un individu.</p>
<table class="t"><thead><tr><th>Médiane d’iodurie de l’enfant d’âge scolaire (6 ans et plus)</th><th>Apport en iode</th></tr></thead><tbody><tr><td>Inférieure à 20 µg/l</td><td>Carence sévère</td></tr><tr><td>20 à 49 µg/l</td><td>Carence modérée</td></tr><tr><td>50 à 99 µg/l</td><td>Carence légère</td></tr><tr><td>100 à 199 µg/l</td><td>Adéquat</td></tr><tr><td>200 à 299 µg/l</td><td>Supérieur aux besoins</td></tr><tr><td>300 µg/l et plus</td><td>Excessif</td></tr></tbody></table>
<p>La femme enceinte a sa propre échelle : inférieure à 150 µg/l, insuffisant ; 150 à 249 µg/l, adéquat ; 250 à 499 µg/l, supérieur aux besoins ; 500 µg/l et plus, excessif. Pendant l’allaitement et chez l’enfant de moins de 2 ans, une médiane d’au moins 100 µg/l correspond à un apport adéquat dans le tableau OMS. La médiane d’iodurie est plus basse chez la femme allaitante, car l’iode passe dans le lait.</p>
<p>La <button class="w" data-k="e00-calcul-mediane">médiane se calcule sur un groupe</button> ; son interprétation ne se transfère pas à un individu.</p><p>Le second indicateur est <button class="w" data-k="e00-tsh-neonatale">la fréquence des TSH néonatales supérieures à 5 mU/l (méthode et interprétation)</button> sur du sang prélevé à 3-4 jours : inférieure à 3 %, la population est suffisante en iode ; en zone d’endémie sévère, elle peut dépasser 40 %.</p>
<div class="trap"><span class="k">Piège</span> Les résultats suisses de 2020-2022 sont adéquats chez l’enfant (127 µg/l) mais insuffisants chez la femme enceinte (97 µg/l) : il faut lire chaque groupe avec sa propre échelle, sinon on conclut à tort à une suffisance générale.</div>
</section>

<section class="ilot" id="e00-e-4"><h2><span class="n">e-4</span>Imagerie et examens spécialisés</h2>
<ul><li><b>Imagerie thyroïdienne</b> (échographie, scintigraphie) : elle se réalise après le début du traitement ; une scintigraphie « blanche » ne signifie pas forcément une absence de glande si des anticorps maternels bloquent le récepteur de la TSH.</li><li><b>Radiographie du genou</b> : elle estime la sévérité de l’hypothyroïdie intra-utérine ; dans le crétinisme myxœdémateux, elle montre un retard d’ossification et des épiphyses anormales.</li><li><b>Scanner cérébral</b> : des calcifications des noyaux gris centraux ont été observées chez 15 des 50 sujets examinés dans les enquêtes chinoise et indonésienne, uniquement chez les hypothyroïdiens sévères.</li><li><b>Audiométrie</b> : elle objective la surdité de perception ; elle est systématique avant l’âge scolaire dans l’hypothyroïdie congénitale traitée.</li></ul>
<p>Ces examens spécialisés servent à la caractérisation et au suivi, jamais à poser le traitement initial.</p>
<div class="key"><b>À retenir.</b> Le bilan sérique décide du traitement ; l’imagerie précise l’étiologie ; l’audiométrie et le suivi du développement jugent le retentissement.</div>
</section>

<section class="ilot" id="e00-e-5"><h2><span class="n">e-5</span>Cas corrigés</h2>
<p>Les cas suivants utilisent des valeurs choisies pour exercer les seuils du cours ; ils ne représentent pas des patients réels.</p>
<div class="quiz ui"><p><b>Cas 1.</b> Un nouveau-né de 5 jours a une fT4 sérique de 4 pmol/l et une TSH nettement élevée. Que faites-vous ?</p><button data-ok="0">A. Attendre un second prélèvement à 10-14 jours pour confirmer.</button><button data-ok="0">B. Réaliser d’abord une scintigraphie thyroïdienne.</button><button data-ok="1">C. Débuter la lévothyroxine immédiatement, à 10-15 µg/kg/jour.</button><p class="fb" hidden>Réponse C. Une fT4 inférieure à 5 pmol/l classe l’hypothyroïdie comme sévère, et l’association à une TSH nettement élevée impose le traitement immédiat, au plus tard deux semaines après la naissance. Les <button class="w" data-k="e00-seuils-traitement">seuils de traitement</button> ne prévoient pas d’attendre un contrôle, et l’imagerie se fait après le début du traitement.</p></div>
<div class="quiz ui"><p><b>Cas 2.</b> Une enquête mesure une iodurie médiane de 97 µg/l chez des femmes enceintes d’une région. Comment la lire ?</p><button data-ok="0">A. Adéquate, car elle dépasse 50 µg/l.</button><button data-ok="1">B. Insuffisante, car la médiane est inférieure à 150 µg/l, seuil de suffisance pendant la grossesse.</button><button data-ok="0">C. Excessive, car elle dépasse 20 µg/l.</button><p class="fb" hidden>Réponse B. L’échelle de l’enfant d’âge scolaire ne s’applique pas à la grossesse : l’<button class="w" data-k="e00-iodurie">OMS</button> retient moins de 150 µg/l comme insuffisant. C’est précisément la valeur observée en Suisse en 2020-2022.</p></div>
<div class="quiz ui"><p><b>Cas 3.</b> Dans un registre, 42 % des nouveau-nés ont une TSH supérieure à 5 mU/l à J3-J4, mais la maternité utilisait un antiseptique iodé pour les soins périnataux. Que conclure ?</p><button data-ok="0">A. La population est suffisante en iode.</button><button data-ok="1">B. La carence est possiblement surestimée, car les antiseptiques iodés élèvent la TSH néonatale ; il faut contrôler l’exposition.</button><button data-ok="0">C. Le résultat est sans valeur, car l’indicateur n’existe pas.</button><p class="fb" hidden>Réponse B. Le seuil de 40 % évoque une endémie sévère, mais la <button class="w" data-k="e00-povidone">povidone iodée (effet sur l’indicateur)</button> fausse l’indicateur. Il faut vérifier l’exposition avant de conclure.</p></div>
<div class="quiz ui"><p><b>Cas 4.</b> Un nouveau-né a une fT4 basse et une TSH basse. Avant de donner la lévothyroxine, que faut-il vérifier ?</p><button data-ok="1">A. La fonction surrénalienne, avec glucocorticoïdes d’abord si elle n’est pas évaluée.</button><button data-ok="0">B. La fonction hépatique uniquement.</button><button data-ok="0">C. Rien : la lévothyroxine précède tout.</button><p class="fb" hidden>Réponse A. Dans une hypothyroïdie centrale, une insuffisance surrénalienne associée est possible, et l’information professionnelle suisse contre-indique la lévothyroxine en cas de troubles hypophysaires ou surrénaliens non traités.</p></div>
<button class="pareto-btn ui" data-k="pareto-e00-examens">▲ Loi de Pareto — Examens complémentaires</button>
</section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>
<div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="e00-tab-semio" role="tab" aria-controls="e00-s-semio" aria-selected="true" data-s="e00-s-semio">Sémiologie fondamentale et analytique</button><button role="tab" aria-selected="false" aria-controls="e00-s-anat" data-s="e00-s-anat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M6 12h12M12 6v12"/></svg>Anatomie</button><button id="e00-tab-histo" role="tab" aria-selected="false" aria-controls="e00-s-histo" data-s="e00-s-histo">Histologie</button><button role="tab" aria-selected="false" aria-controls="e00-s-physio" data-s="e00-s-physio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M6 12h12M12 6v12"/></svg>Physiologie</button><button role="tab" aria-selected="false" aria-controls="e00-s-bioch" data-s="e00-s-bioch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M6 12h12M12 6v12"/></svg>Biochimie</button><button role="tab" aria-selected="false" aria-controls="e00-s-sante" data-s="e00-s-sante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M6 12h12M12 6v12"/></svg>Santé publique</button></div><div class="chap-body sci-body"><div class="sci" id="e00-s-semio" role="tabpanel" aria-labelledby="e00-tab-semio">
<section class="ilot" id="e00-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3>
<p>La question clinique est double : existe-t-il une atteinte du développement compatible avec une carence iodée précoce, et persiste-t-il aujourd’hui une insuffisance hormonale à traiter ? La première se raisonne avec l’histoire maternelle, la trajectoire du développement, l’audition et l’examen. La seconde exige une évaluation actuelle de la thyroxine libre et de la thyrotropine. Un bilan hormonal aujourd’hui rassurant n’efface pas une atteinte ancienne, et un déficit hormonal du nouveau-né ne prouve pas son origine nutritionnelle.</p>
<p>À l’état normal, les cellules folliculaires captent l’iodure et utilisent cet élément pour élaborer les hormones thyroïdiennes. La colloïde constitue leur lieu de stockage sur la thyroglobuline. La thyrotropine stimule cette activité ; les hormones produites freinent en retour la stimulation de l’axe hypothalamo-hypophysaire. Cette boucle explique pourquoi la lecture de la thyrotropine devient trompeuse si le défaut siège en amont de la glande. La <button class="w" data-k="e00-normes-2026">normalité biologique dépend de l’âge et de la méthode</button> : un seuil de décision ne remplace pas l’intervalle de référence du laboratoire.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S102]</button>, <button class="w" data-k="e00-sources-2026">[S106]</button>, <button class="w" data-k="e00-sources-2026">[S111]</button></span>
<div class="key"><b>Science → clinique.</b> La fonction hormonale actuelle et les conséquences du développement prénatal sont deux dimensions différentes. <b>Science → examen.</b> Elles conduisent à associer trajectoire développementale et bilan fT4–TSH. <b>Science → traitement.</b> La substitution traite l’insuffisance présente ; la prévention nutritionnelle doit commencer en amont de la grossesse. <b>À retenir.</b> Aucun signe isolé ne suffit à attribuer l’étiologie.</div></section>
<figure><svg role="img" aria-label="Démarche sémiologique : décrire la trajectoire du développement et mesurer la fonction hormonale actuelle, puis rechercher une cause compatible sans conclure sur la géographie ou l’iodurie seules." viewBox="0 0 660 220" style="width:100%;height:auto;background:#fff;border-radius:12px"><rect x="15" y="15" width="300" height="75" rx="8" fill="#e3eff3"/><rect x="345" y="15" width="300" height="75" rx="8" fill="#e3eff3"/><text x="30" y="44" fill="#17364b" font-size="17">Trajectoire du développement</text><text x="30" y="70" fill="#17364b" font-size="14">Croissance, audition, motricité</text><text x="360" y="44" fill="#17364b" font-size="17">Fonction hormonale actuelle</text><text x="360" y="70" fill="#17364b" font-size="14">fT4 + TSH, âge, terme, méthode</text><path d="M165 90 L165 115 L330 115 L330 135 M495 90 L495 115 L330 115" stroke="#247382" fill="none" stroke-width="3"/><rect x="110" y="135" width="440" height="68" rx="8" fill="#17364b"/><text x="132" y="161" fill="white" font-size="17">Confronter l’histoire, la clinique et la cause</text><text x="132" y="187" fill="white" font-size="14">Ni la géographie ni l’iodurie seules ne concluent</text></svg><figcaption>Deux dimensions complémentaires du raisonnement : conséquences anciennes du développement et déficit hormonal actuel. Schéma logique original fondé sur le consensus et les séries historiques ; ce n’est ni une image anatomique ni un score validé. La prise en charge d’un déficit néonatal confirmé n’attend pas la fin de l’enquête étiologique.</figcaption></figure><section class="ilot" id="e00-semio-signs" data-semiology="signs"><h3>Décrire les signes dans leur temporalité</h3><p>Dans les séries historiques de carence iodée sévère, l’atteinte neurologique associe troubles intellectuels et psychomoteurs, anomalies de la marche, signes pyramidaux et extrapyramidaux, strabisme et troubles auditifs. Les signes neurologiques ne sont pas réservés au sous-type dit neurologique : ils sont décrits dans les catégories myxœdémateuse et mixte. La taille, la maturation osseuse et pubertaire apportent une autre information, celle de la croissance et de l’exposition hormonale après la naissance.</p><p>L’anamnèse précise donc où et dans quelles conditions nutritionnelles la grossesse s’est déroulée, puis quand les difficultés de croissance, d’audition, de langage et d’apprentissage sont apparues. Elle recherche aussi les antécédents thyroïdiens et les expositions iodées maternelles : une exposition excessive peut provoquer une hypothyroïdie transitoire et ne doit pas être confondue avec une carence. Chez le nouveau-né, hypotonie, ictère prolongé, macroglossie et hernie ombilicale sont des signes d’appel d’hypothyroïdie, non une signature de la carence iodée.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S102]</button>, <button class="w" data-k="e00-sources-2026">[S108]</button>, <button class="w" data-k="e00-sources-2026">[S109]</button></span></section>
<section class="ilot" id="e00-semio-mechanisms" data-semiology="mechanisms"><h3>Relier mécanisme et manifestation</h3><table class="t"><thead><tr><th>Fonction normale</th><th>Perturbation</th><th>Conséquence à rechercher</th><th>Limite</th></tr></thead><tbody><tr><td>Disponibilité d’iode pour synthétiser les hormones</td><td>Carence sévère et production hormonale insuffisante</td><td>Retentissement du développement et parfois hypothyroïdie persistante</td><td>Une médiane d’iodurie récente ne reconstitue pas la grossesse d’un individu</td></tr><tr><td>Apport hormonal maternel pendant le développement fœtal précoce</td><td>Hypothyroxinémie maternelle et fœtale</td><td>Atteinte neurodéveloppementale et neurosensorielle</td><td>La dépendance maternelle est importante, non une absence absolue de contribution fœtale jusqu’à une date fixe</td></tr><tr><td>Hormones nécessaires à la croissance et à la maturation osseuse</td><td>Déficit postnatal persistant</td><td>Petite taille, retard de maturation</td><td>Ces signes ne désignent pas à eux seuls une cause nutritionnelle</td></tr><tr><td>Rétrocontrôle hormonal sur l’axe</td><td>Déficit primaire ou central</td><td>Couple fT4–TSH différent selon le siège du défaut</td><td>La TSH ne suffit pas à exclure une forme centrale</td></tr></tbody></table><p>Cette chaîne distingue mécanisme, observation et décision. Les séries anciennes soutiennent le modèle d’une atteinte prénatale commune, modulée ensuite par le déficit postnatal ; elles ne permettent pas de dater chez un patient la semaine exacte de la lésion ni de prédire sa réversibilité.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S102]</button>, <button class="w" data-k="e00-sources-2026">[S106]</button>, <button class="w" data-k="e00-sources-2026">[S108]</button>, <button class="w" data-k="e00-sources-2026">[S109]</button>, <button class="w" data-k="e00-sources-2026">[S114]</button></span></section>
<section class="ilot" id="e00-semio-examination" data-semiology="examination"><h3>Observer, mesurer, puis confirmer</h3><p>L’examen documente l’état général et les signes du nouveau-né, la croissance mesurée et son évolution, le développement psychomoteur, la marche quand elle est acquise, les signes neurologiques et l’audition. Une absence de réponse au langage ne doit pas être interprétée d’emblée comme une limitation intellectuelle : un déficit auditif peut contribuer aux difficultés. Le consensus recommande une évaluation répétée de l’audition, au-delà du seul dépistage néonatal, avant l’âge scolaire et selon le suivi.</p><p>Le volume thyroïdien observé ne mesure pas la fonction. L’échographie précise présence, localisation, taille et échotexture ; sa qualité dépend de l’examinateur et elle est moins performante que la scintigraphie pour certaines ectopies. Une scintigraphie sans captation ne prouve pas une absence de glande : traitement et freinage de la TSH, exposition iodée, anticorps maternels ou défauts génétiques peuvent expliquer ce résultat. L’imagerie étiologique n’attend pas d’être complète pour commencer le traitement d’un nouveau-né dont l’hypothyroïdie est confirmée.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S102]</button></span></section>
<section class="ilot" id="e00-semio-interpretation" data-semiology="interpretation"><h3>Interpréter sans mélanger les échelles</h3><p>Une fT4 basse avec une TSH nettement élevée soutient une hypothyroïdie primaire ; une fT4 basse avec une TSH basse, normale ou peu élevée fait rechercher une forme centrale, une maladie intercurrente ou le contexte de prématurité. Les valeurs doivent être comparées à l’intervalle pertinent pour l’âge postnatal, le terme et la méthode. Le prélèvement de suivi est réalisé avant la prise de lévothyroxine ou au moins quatre heures après, selon le consensus européen.</p><p>Pour la carence iodée, la médiane d’un échantillon de population et l’iodurie ponctuelle d’une personne sont des mesures de portée différente. La médiane reflète un groupe ; elle n’est ni un test diagnostique individuel d’E00, ni une mesure des lésions cérébrales. Le cours propose un <button class="w" data-k="e00-calcul-mediane">exemple de calcul et d’interprétation d’une médiane</button>. De même, le seuil de TSH utilisé par un programme de dépistage sur buvard n’est pas le seuil sérique qui déclenche le traitement.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S102]</button>, <button class="w" data-k="e00-sources-2026">[S110]</button>, <button class="w" data-k="e00-sources-2026">[S114]</button></span></section>
<section class="ilot" id="e00-semio-differentials" data-semiology="differentials"><h3>Chercher les éléments réellement discriminants</h3><table class="t"><thead><tr><th>Hypothèse</th><th>Élément utile</th><th>Ce qui ne suffit pas</th></tr></thead><tbody><tr><td>Carence iodée congénitale</td><td>Contexte nutritionnel documenté de la grossesse et atteinte compatible</td><td>Origine géographique seule</td></tr><tr><td>Dysgénésie thyroïdienne</td><td>Morphologie et localisation de la glande</td><td>Une TSH élevée ne distingue pas cette cause d’une autre hypothyroïdie primaire</td></tr><tr><td>Dyshormonogenèse</td><td>Glande en place, phénotype et conseil génétique ciblé</td><td>Goitre ou histoire familiale seuls</td></tr><tr><td>Hypothyroïdie centrale</td><td>fT4 basse avec TSH inadaptée et exploration des autres axes</td><td>TSH comprise dans l’intervalle du laboratoire</td></tr><tr><td>Excès iodé ou anticorps maternels</td><td>Expositions, contexte maternel, réévaluation étiologique</td><td>Supposer que toute hypothyroïdie persistante au dépistage est définitive</td></tr><tr><td>Syndrome de Pendred</td><td>Association audiologique et thyroïdienne, exploration spécialisée</td><td>Surdité associée à hypothyroïdie, commune à plusieurs causes</td></tr></tbody></table><p>Le tableau guide des examens orientés. Il ne propose pas un score de diagnostic : aucune sensibilité, spécificité ou probabilité n’est inventée pour ces associations.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S102]</button>, <button class="w" data-k="e00-sources-2026">[S107]</button></span></section>
<section class="ilot" id="e00-semio-urgency" data-semiology="urgency"><h3>Reconnaître l’urgence hormonale</h3><div class="alert"><b>Nouveau-né : ne pas attendre des signes complets.</b> Un dépistage anormal impose une confirmation rapide par fT4 et TSH sériques et une prise en charge spécialisée. Si la fT4 est basse et la TSH nettement élevée pour l’âge, le traitement débute immédiatement ; l’objectif de début avant deux semaines de vie n’autorise pas à attendre cette échéance.</div><p>Dans une forme centrale, la fonction surrénalienne doit être démontrée intacte ; si une insuffisance associée ne peut être exclue, la couverture glucocorticoïde précède la lévothyroxine. Chez le prématuré immature, la FI décrit un risque de collapsus cardiovasculaire qui motive la surveillance circulatoire. Un contexte cardiaque impose une décision spécialisée fondée sur la FI et l’état clinique, pas l’application automatique d’une fraction de dose.</p><p>Chez une personne ayant des séquelles anciennes, le caractère ancien du handicap ne dispense pas d’évaluer l’état clinique et hormonal actuel. L’absence de preuve de récupération neurologique sous traitement tardif ne justifie pas de laisser une hypothyroïdie persistante sans prise en charge.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S101]</button>, <button class="w" data-k="e00-sources-2026">[S102]</button></span></section>
<section class="ilot" id="e00-semio-limits" data-semiology="limits"><h3>Préciser population, âge et niveau de preuve</h3><p>Les descriptions du syndrome endémique viennent de séries historiques réalisées dans des populations très carencées. Elles ne décrivent pas le pronostic habituel d’un nouveau-né suisse dont l’hypothyroïdie est dépistée puis correctement traitée. Inversement, le bon pronostic de la plupart de ces nouveau-nés ne prouve pas la récupération d’une lésion ancienne liée à une carence prénatale sévère.</p><p>Les données suisses de 2020–2022 concernent l’apport iodé de groupes : enfants d’âge scolaire et femmes enceintes. Elles ne mesurent ni l’incidence actuelle d’E00, ni un effet causal d’un supplément sur le développement de chaque enfant. La conduite suisse de prévention est explicitement reliée à l’OSAV. Le consensus européen complète le diagnostic et le suivi de l’hypothyroïdie ; pour la prescription d’Euthyrox, les conditions du produit suisse restent identifiées séparément.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S102]</button>, <button class="w" data-k="e00-sources-2026">[S104]</button>, <button class="w" data-k="e00-sources-2026">[S111]</button>, <button class="w" data-k="e00-sources-2026">[S112]</button></span></section>
<section class="ilot" id="e00-semio-sources" data-semiology="sources"><h3>Sources et lecture ciblée</h3><p>Les textes consultés le 2 novembre 2026 sont accessibles dans la <button class="w" data-k="e00-sources-2026">fenêtre des sources et de leurs limites</button> : FI Euthyrox [S101], consensus ENDO-ERN/ESPE/ESE [S102], OSAV [S103,S111–S113,S115], étude nationale suisse [S104], dépistage suisse [S105], anatomie normale [S106], classification [S107], séries neurologiques historiques [S108,S109], norme analytique Viollier [S110] et guide nutritionnel OMS [S114]. Les résultats des études anciennes ont été relus sur leurs résumés ; les prescriptions et seuils repris viennent des sections intégrales des textes professionnels correspondants.</p></section>
