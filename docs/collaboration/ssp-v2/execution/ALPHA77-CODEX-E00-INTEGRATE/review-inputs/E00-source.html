<div class="sci" id="e00-s-anat" hidden><section class="ilot" id="e00-s-anat-cours"><h2>Anatomie normale et conséquences du déficit hormonal</h2><figure class="e00-original" aria-label="Anatomie et histologie thyroïdiennes humaines, original OpenStax2013"><div style="position:relative;max-width:737px;margin:auto"><img src="assets/img/e00/alpha/codex/e00-thyroid-anatomy-histology-openstax2013.jpg" alt="Original OpenStax2013 : vues antérieure et postérieure de la thyroïde, puis micrographie de follicules avec colloïde et épithélium cubique." width="737" height="1410" style="display:block;width:100%;height:auto;background:white"><span style="position:absolute;left:47.5%;top:17%;transform:translate(-50%,-50%);background:#162f43;color:white;border:2px solid white;border-radius:50%;padding:.1em .4em;font-weight:bold" aria-label="Repère1 : isthme thyroïdien">1</span><span style="position:absolute;left:57%;top:50.9%;transform:translate(-50%,-50%);background:#162f43;color:white;border:2px solid white;border-radius:50%;padding:.1em .4em;font-weight:bold" aria-label="Repère2 : parathyroïdes en arrière de la glande">2</span><span style="position:absolute;left:49%;top:85%;transform:translate(-50%,-50%);background:#162f43;color:white;border:2px solid white;border-radius:50%;padding:.1em .4em;font-weight:bold" aria-label="Repère3 : colloïde du follicule">3</span></div><figcaption><b>Lire l’original.</b> 1 : l’isthme relie les lobes devant la trachée. 2 : les parathyroïdes apparaissent sur la vue postérieure ; elles ne sont pas des follicules thyroïdiens. 3 : la cavité folliculaire contient la colloïde ; l’épithélium de cellules folliculaires l’entoure. Les traits et légendes anglais appartiennent à l’original ; les trois repères numérotés et leur traduction sont des annotations superposées dans la page ajoutées sans retoucher l’image. OpenStax College, <a href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">Anatomy &amp; Physiology, figure 1811, version 2013</a>, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>. Micrographie : Regents of University of Michigan Medical School, ©2012, crédit de la légende originale. Image normale, sans prétendre montrer une lésion de carence iodée.</figcaption></figure>
<p>Le crétinisme endémique n’est pas une maladie de la seule thyroïde : il touche plusieurs organes, et la localisation de chaque signe renseigne sur le moment et le mécanisme de l’atteinte. La glande normale se situe en avant de la trachée, sous le larynx. Un isthme unit ses deux lobes ; les parathyroïdes occupent principalement leur face postérieure. À l’échelle microscopique, les follicules réunissent cellules sécrétrices et colloïde. Cette organisation relie la localisation de la glande à son rôle dans la synthèse hormonale. <span class="src"><button class="w" data-k="e00-sources-2026">[S106]</button></span></p>
<p><b>Le système nerveux central.</b> Dans les enquêtes menées en Chine occidentale (104 sujets) et à Java (35 sujets), presque toutes les personnes atteintes présentaient la même atteinte neurologique, quels que soient leur type et leur fonction thyroïdienne actuelle. Elle associe des <button class="w" data-k="e00-pyramidal">signes pyramidaux à distribution proximale (examen)</button>, des signes extrapyramidaux, une démarche caractéristique, un strabisme, une surdité et la persistance de réflexes primitifs.</p>
<p><b>Les noyaux gris centraux.</b> Le scanner a montré des calcifications des noyaux gris centraux chez 15 des 50 sujets examinés, uniquement chez les hypothyroïdiens sévères. Cette observation relie une lésion visible à la sévérité de l’hypothyroïdie postnatale, alors que les signes neurologiques sont communs à tous les types.</p>
<p><b>L’audition.</b> La <button class="w" data-k="e00-surdimutite">surdité de perception</button> était semblable dans les trois types dans l’enquête thaïlandaise.</p>
<p><b>La thyroïde et le squelette.</b> Le volume thyroïdien était plus faible chez les hypothyroïdiens dans la même enquête. Le squelette traduit l’hypothyroïdie postnatale : retard d’ossification, épiphyses anormales et petite taille chez les sujets du type myxœdémateux.</p>
<figure aria-label="Correspondances entre organes et signes"><svg viewBox="0 0 640 230" role="img" aria-label="Figure 1 — Organes atteints et signes cliniques"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="10" y="10" width="190" height="95" rx="6"/><rect x="225" y="10" width="190" height="95" rx="6"/><rect x="440" y="10" width="190" height="95" rx="6"/><rect x="10" y="125" width="300" height="95" rx="6"/><rect x="330" y="125" width="300" height="95" rx="6"/></g><g fill="currentColor" font-size="13"><text x="105" y="32" text-anchor="middle" font-weight="bold">Cerveau</text><text x="105" y="54" text-anchor="middle">Signes pyramidaux proximaux</text><text x="105" y="72" text-anchor="middle">Signes extrapyramidaux</text><text x="105" y="90" text-anchor="middle">Strabisme, réflexes primitifs</text><text x="320" y="32" text-anchor="middle" font-weight="bold">Noyaux gris centraux</text><text x="320" y="54" text-anchor="middle">Calcifications au scanner</text><text x="320" y="72" text-anchor="middle">Hypothyroïdiens sévères</text><text x="320" y="90" text-anchor="middle">15 sujets sur 50</text><text x="535" y="32" text-anchor="middle" font-weight="bold">Audition</text><text x="535" y="54" text-anchor="middle">Surdité de perception</text><text x="535" y="72" text-anchor="middle">Mutisme associé</text><text x="160" y="147" text-anchor="middle" font-weight="bold">Thyroïde</text><text x="160" y="169" text-anchor="middle">Volume plus faible</text><text x="160" y="187" text-anchor="middle">chez les hypothyroïdiens</text><text x="480" y="147" text-anchor="middle" font-weight="bold">Squelette</text><text x="480" y="169" text-anchor="middle">Retard d’ossification, épiphyses anormales</text><text x="480" y="187" text-anchor="middle">Petite taille (type myxœdémateux)</text></g></svg><figcaption>Figure 1 — Schéma didactique des organes atteints et des signes associés, d’après les enquêtes thaïlandaise, chinoise et indonésienne. Il ne représente pas un patient ; le chiffre 15 sur 50 concerne seulement le sous-groupe historique examiné au scanner, sans constituer une fréquence générale d’E00.</figcaption></figure>
<div class="key"><b>Anatomie → clinique.</b> Le cerveau, l’oreille et le squelette n’ont pas la même chronologie d’atteinte : le dommage neurologique et auditif se constitue avant la naissance, celui du squelette dépend de la persistance de l’hypothyroïdie. Aucune source lue ne montre qu’un traitement tardif répare l’atteinte neurologique déjà constituée.</div>
<div class="key"><b>Science → clinique.</b> Localiser une anomalie neurologique, auditive ou de croissance aide à décrire le retentissement ; aucun de ces territoires ne prouve isolément la cause iodée. <b>Science → examen.</b> L’échographie situe la glande et mesure son volume ; elle ne remplace pas le couple fT4–TSH. <b>Science → traitement.</b> Une recherche étiologique par imagerie ne retarde pas la substitution d’un nouveau-né hypothyroïdien confirmé. <b>À retenir.</b> Structure de la glande, fonction hormonale et séquelles du développement sont trois observations distinctes.</div><span class="src"><button class="w" data-k="e00-sources-2026">[S102]</button>, <button class="w" data-k="e00-sources-2026">[S106]</button>, <button class="w" data-k="e00-sources-2026">[S108]</button>, <button class="w" data-k="e00-sources-2026">[S109]</button></span><button class="pareto-btn ui" data-k="pareto-e00-anat">▲ Loi de Pareto — Anatomie</button>
</section></div>

<div class="sci" id="e00-s-histo" role="tabpanel" aria-labelledby="e00-tab-histo" hidden><section class="ilot" id="e00-s-histo-cours"><h2>Histologie : comprendre le follicule avant la carence</h2>
<p>Le follicule thyroïdien associe une cavité contenant la colloïde et une paroi formée de cellules folliculaires. Sur la micrographie originale ci-dessous, la substance rose de la cavité se distingue des noyaux plus foncés de l’épithélium qui l’entoure. La légende originale identifie un épithélium cubique. Les cellules parafolliculaires constituent une autre population cellulaire ; elles ne sont pas le support de la synthèse de thyroxine décrite ici.</p>
<p>La colloïde n’est pas un espace vide : elle contient notamment la thyroglobuline, une glycoprotéine sécrétée par les cellules folliculaires. Les résidus tyrosine de cette protéine sont iodés ; leur couplage permet la formation des précurseurs liés des hormones T3 et T4. La thyrotropine stimule ensuite la reprise de colloïde par les cellules folliculaires. La dégradation de la thyroglobuline libère les hormones, qui peuvent rejoindre la circulation. Ce stockage extracellulaire explique pourquoi la synthèse, le stockage et la libération sont des étapes distinctes.</p>
<p>La carence iodée limite la matière première nécessaire à cette synthèse. La dyshormonogenèse peut, elle, altérer une étape du transport, de l’organification ou de la protéine support malgré un apport iodé suffisant. Une image histologique normale n’établit donc ni la disponibilité iodée d’une grossesse passée ni la compétence de toutes les protéines de synthèse. Dans l’hypothyroïdie congénitale, le consensus utilise la biologie, l’imagerie et, selon l’indication, la génétique pour caractériser la cause ; cette micrographie est une base de compréhension, pas un examen à demander systématiquement.</p>
<p>Les fonctions des principales protéines peuvent être reliées à cette organisation. SLC5A5 code le transporteur sodium–iodure ; <button class="w" data-k="e00-thyroperoxydase">TPO</button> participe à l’organification et au couplage ; TG code la thyroglobuline. Des anomalies de ces fonctions entrent dans le diagnostic différentiel de l’hypothyroïdie congénitale, et ne sont pas des sous-types génétiques du syndrome nutritionnel E00. Le conseil génétique doit partir du phénotype et de la question clinique ; un test n’est justifié que s’il peut améliorer le diagnostic, la prise en charge ou le pronostic.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S106]</button>, <button class="w" data-k="e00-sources-2026">[S102]</button></span><figure class="e00-original" aria-label="Anatomie et histologie thyroïdiennes humaines, original OpenStax2013"><div style="position:relative;max-width:737px;margin:auto"><img src="assets/img/e00/alpha/codex/e00-thyroid-anatomy-histology-openstax2013.jpg" alt="Original OpenStax2013 : vues antérieure et postérieure de la thyroïde, puis micrographie de follicules avec colloïde et épithélium cubique." width="737" height="1410" style="display:block;width:100%;height:auto;background:white"><span style="position:absolute;left:47.5%;top:17%;transform:translate(-50%,-50%);background:#162f43;color:white;border:2px solid white;border-radius:50%;padding:.1em .4em;font-weight:bold" aria-label="Repère1 : isthme thyroïdien">1</span><span style="position:absolute;left:57%;top:50.9%;transform:translate(-50%,-50%);background:#162f43;color:white;border:2px solid white;border-radius:50%;padding:.1em .4em;font-weight:bold" aria-label="Repère2 : parathyroïdes en arrière de la glande">2</span><span style="position:absolute;left:49%;top:85%;transform:translate(-50%,-50%);background:#162f43;color:white;border:2px solid white;border-radius:50%;padding:.1em .4em;font-weight:bold" aria-label="Repère3 : colloïde du follicule">3</span></div><figcaption><b>Lire l’original.</b> 1 : l’isthme relie les lobes devant la trachée. 2 : les parathyroïdes apparaissent sur la vue postérieure ; elles ne sont pas des follicules thyroïdiens. 3 : la cavité folliculaire contient la colloïde ; l’épithélium de cellules folliculaires l’entoure. Les traits et légendes anglais appartiennent à l’original ; les trois repères numérotés et leur traduction sont des annotations superposées dans la page ajoutées sans retoucher l’image. OpenStax College, <a href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">Anatomy &amp; Physiology, figure 1811, version 2013</a>, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>. Micrographie : Regents of University of Michigan Medical School, ©2012, crédit de la légende originale. Image normale, sans prétendre montrer une lésion de carence iodée.</figcaption></figure><div class="key"><b>Science → clinique.</b> Un déficit hormonal n’implique pas nécessairement une absence de glande. <b>Science → examen.</b> La biologie mesure la fonction ; l’imagerie décrit la glande et peut orienter l’étiologie. <b>Science → traitement.</b> La lévothyroxine remplace l’hormone déficitaire sans réparer une anomalie de la synthèse. <b>À retenir.</b> L’illustration montre le follicule normal et permet de localiser les fonctions, sans diagnostiquer une carence chez un patient.</div><button class="pareto-btn ui" data-k="pareto-e00-histo">▲ Loi de Pareto — Histologie</button></section></div><div class="sci" id="e00-s-physio" hidden><section class="ilot" id="e00-s-physio-cours"><h2>Physiologie de l’apport en iode et de l’axe thyroïdien</h2>
<p><b>Les besoins.</b> L’iode est le constituant minéral des hormones thyroïdiennes, que l’organisme ne fabrique pas : il vient de l’alimentation. Les recommandations de l’<button class="w" data-k="e00-besoins">OMS, de l’UNICEF et de l’ICCIDD (valeurs par âge)</button> sont de 90 µg/jour jusqu’à 59 mois, 120 µg de 6 à 12 ans, 150 µg à l’adolescence et à l’âge adulte, 250 µg pendant la grossesse et l’allaitement. Le besoin est le plus élevé pendant la grossesse, car le fœtus dépend au début de la thyroxine maternelle.</p>
<p><b>Le fœtus.</b> La thyroïde fœtale n’est pas fonctionnellement mûre avant 18 à 20 semaines. Jusque-là, le fœtus reçoit la <button class="w" data-k="e00-t4-maternelle">thyroxine maternelle</button>. Les hormones thyroïdiennes sont cruciales pour le développement du système nerveux central et des poumons : la <button class="w" data-k="e00-fenetre">période critique va du deuxième trimestre à la troisième année</button>.</p>
<p><b>Le nourrisson allaité.</b> Il dépend de l’iode du lait, lui-même déterminé par l’apport maternel. Son besoin est élevé parce que son renouvellement hormonal est rapide. Une mère carencée prolonge donc le risque après la naissance.</p>
<p><b>L’adaptation à la carence.</b> Lorsque l’iode manque, la thyroïde augmente la captation et le recyclage de l’iode, accroît sa masse sous l’effet d’une TSH élevée et sécrète préférentiellement la T3. Cette adaptation maintient d’abord l’euthyroïdie. Quand elle est dépassée, la production d’hormone chute.</p>
<figure aria-label="Fenêtre critique du développement"><svg viewBox="0 0 640 170" role="img" aria-label="Figure 2 — Chronologie de la fenêtre critique"><g fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 90h600"/><path d="M20 82v16M180 82v16M300 82v16M620 82v16"/><rect x="180" y="40" width="440" height="30" rx="4"/><rect x="20" y="108" width="280" height="26" rx="4"/></g><g fill="currentColor" font-size="13"><text x="20" y="74" text-anchor="start">Début de grossesse</text><text x="180" y="116" text-anchor="middle" font-size="12">Deuxième trimestre</text><text x="300" y="150" text-anchor="middle" font-size="12">18–20 semaines : maturation fonctionnelle fœtale</text><text x="400" y="60" text-anchor="middle">Période critique : deuxième trimestre à 3 ans</text><text x="620" y="116" text-anchor="end" font-size="12">Troisième année</text><text x="160" y="127" text-anchor="middle" font-size="12">Contribution maternelle majeure</text></g></svg><figcaption>Figure 2 — Schéma didactique non à l’échelle. Il juxtapose la contribution maternelle majeure avant la maturation fœtale vers 18–20 semaines, puis la coexistence des contributions maternelle et fœtale et la période la plus critique décrite par l’OMS (deuxième trimestre à troisième année).</figcaption></figure>
<div class="key"><b>Physiologie → clinique.</b> Au début de la grossesse, le fœtus dépend largement de la thyroxine maternelle. La contribution fœtale augmente ensuite, tandis que la contribution maternelle persiste : il ne s’agit pas d’un basculement exclusif à une date fixe. La prévention doit donc couvrir la grossesse entière, et ne peut pas attendre la découverte d’une hypothyroïdie néonatale.</div>
<p><b>Le rétrocontrôle comme outil de lecture.</b> Une baisse de thyroxine produite par la glande tend à augmenter la stimulation par la thyrotropine. Ce raisonnement suppose un axe de commande fonctionnel. Dans l’hypothyroïdie centrale, une TSH non élevée peut être inadaptée à une fT4 basse : la valeur de TSH, prise seule, donne alors une fausse impression de normalité. La décision s’appuie sur les deux dosages, l’âge et le contexte clinique.</p><div class="key"><b>Science → clinique.</b> La disponibilité hormonale au cours du développement explique l’urgence néonatale et l’intérêt d’une prévention avant la grossesse. <b>Science → examen.</b> Le rétrocontrôle explique pourquoi on interprète conjointement fT4 et TSH. <b>Science → traitement.</b> Le traitement apporte l’hormone déficitaire ; la surveillance vérifie l’équilibre sans confondre rythme de correction de la fT4 et de la TSH. <b>À retenir.</b> Un apport iodé adéquat et une substitution hormonale répondent à des besoins différents.</div><span class="src"><button class="w" data-k="e00-sources-2026">[S102]</button>, <button class="w" data-k="e00-sources-2026">[S106]</button>, <button class="w" data-k="e00-sources-2026">[S114]</button></span><button class="pareto-btn ui" data-k="pareto-e00-physio">▲ Loi de Pareto — Physiologie</button>
</section></div>

<div class="sci" id="e00-s-bioch" hidden><section class="ilot" id="e00-s-bioch-cours"><h2>Biochimie du transport de l’iode et des cofacteurs</h2>
<p><b>Le transport.</b> Le <button class="w" data-k="e00-nis">symporteur sodium-iodure (mécanisme)</button> fait entrer l’iodure dans la cellule thyroïdienne par transport actif. C’est la première étape de la synthèse hormonale. Une carence en iode laisse ce transporteur sans substrat : la thyroïde active ses mécanismes de captation, mais la quantité d’iodure disponible reste le facteur limitant.</p>
<p><b>Un excès d’iode.</b> L’<button class="w" data-k="e00-wolff">effet Wolff-Chaikoff (excès d’iode du prématuré)</button> est invoqué par le consensus européen pour l’hypothyroïdie transitoire par excès d’iode, en particulier chez le prématuré qui ne parvient pas à s’y soustraire. Les antiseptiques iodés sont donc à éviter en période périnatale.</p>
<p><b>Les cofacteurs proposés.</b> Deux hypothèses ont été avancées pour expliquer le type myxœdémateux. La première évoque <button class="w" data-k="e00-cofacteurs">sélénium et goitrogènes</button> dans le titre d’un article de 1994 ; son contenu n’a pas été obtenu, et aucun mécanisme précis n’en est déduit. La seconde invoque le thiocyanate alimentaire, qui inhibe de façon compétitive le symporteur de la glande mammaire et diminue l’iode du lait. Les auteurs qualifient cette seconde hypothèse de spéculative.</p>
<figure aria-label="Transport thyroïdien de l’iodure"><svg viewBox="0 0 640 190" role="img" aria-label="Figure 3 — Entrée de l’iodure dans la synthèse hormonale thyroïdienne"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="40" y="40" width="130" height="100" rx="6"/><rect x="250" y="40" width="140" height="100" rx="6"/><rect x="470" y="40" width="130" height="100" rx="6"/><path d="M170 90h70m0 0l-10-6m10 6l-10 6"/><path d="M390 90h70m0 0l-10-6m10 6l-10 6"/></g><g fill="currentColor" font-size="13"><text x="105" y="85" text-anchor="middle" font-weight="bold">Alimentation</text><text x="105" y="105" text-anchor="middle">Iode</text><text x="320" y="85" text-anchor="middle" font-weight="bold">Symporteur</text><text x="320" y="105" text-anchor="middle">sodium-iodure</text><text x="535" y="85" text-anchor="middle" font-weight="bold">Hormones</text><text x="535" y="105" text-anchor="middle">thyroïdiennes</text><text x="320" y="170" text-anchor="middle" font-size="12">Carence : peu d’iodure à transporter, production hormonale basse</text></g></svg><figcaption>Figure 3 — Schéma didactique, sans échelle. L’iode alimentaire entre dans la cellule par le symporteur sodium-iodure, puis sert à la synthèse des hormones. L’hypothèse de l’inhibition du transport dans la glande mammaire par le thiocyanate est discutée séparément dans le texte ; elle n’est pas représentée par la chaîne thyroïdienne de cette figure.</figcaption></figure>
<div class="key"><b>Biochimie → clinique.</b> Le goitre et l’élévation de la TSH sont des adaptations visibles du transport d’iodure. Un excès d’iode peut aussi provoquer une hypothyroïdie transitoire chez le prématuré ; l’échelle de l’OMS définit d’ailleurs des apports excessifs.</div>
<p><b>Du transport à la libération.</b> La captation d’iodure ne suffit pas à produire une hormone : l’iode doit être incorporé aux résidus tyrosine de la thyroglobuline, puis les résidus iodés sont couplés. La thyroperoxydase participe à l’organification et au couplage. Les hormones restent d’abord liées au support protéique de la colloïde ; la reprise et la dégradation de ce support permettent ensuite leur libération. Il faut donc distinguer substrat disponible, machinerie de synthèse et hormone circulante.</p><p>Cette distinction explique les diagnostics différentiels. Une anomalie du transporteur SLC5A5, de <button class="w" data-k="e00-thyroperoxydase">TPO</button> ou de la thyroglobuline peut provoquer une hypothyroïdie congénitale malgré des apports iodés suffisants. Le consensus décrit ces défauts de synthèse dans le cadre des dyshormonogenèses. Ils ne deviennent pas des syndromes de carence iodée E00 du seul fait qu’ils touchent une étape utilisant l’iode. La génétique est ciblée sur le phénotype et une utilité clinique attendue, et non demandée automatiquement devant toute TSH élevée.</p><div class="key"><b>Science → clinique.</b> Carence de substrat et défaut de synthèse peuvent aboutir au même déficit hormonal. <b>Science → examen.</b> La biologie confirme la fonction ; imagerie et investigation génétique ciblée précisent certaines causes. <b>Science → traitement.</b> Ajouter de l’iode n’est pas une réponse universelle : l’excès iodé peut lui-même perturber la fonction, notamment chez le prématuré. <b>À retenir.</b> Identifier une hormone basse ne suffit pas à identifier l’étape biochimique en cause.</div><span class="src"><button class="w" data-k="e00-sources-2026">[S102]</button>, <button class="w" data-k="e00-sources-2026">[S106]</button></span><button class="pareto-btn ui" data-k="pareto-e00-bioch">▲ Loi de Pareto — Biochimie</button>
</section></div>

<div class="sci" id="e00-s-sante" hidden><section class="ilot" id="e00-s-sante-cours"><h2>Santé publique : mesurer et prévenir la carence en iode</h2>
<p>L’exposition qui cause le crétinisme est nutritionnelle et collective. Sa mesure se fait donc sur des groupes : la <button class="w" data-k="e00-iodurie">médiane d’iodurie</button> et la <button class="w" data-k="e00-tsh-neonatale">fréquence des TSH néonatales élevées</button>. Le programme suisse de <button class="w" data-k="e00-sel">sel iodé</button> en est l’outil principal depuis 1922.</p>
<p><b>Un programme volontaire.</b> Le sel iodé n’est pas obligatoire dans tous les aliments : plus de 80 % des ménages en achètent, mais un tiers seulement des aliments transformés en contiennent. La médiane d’iodurie est de 97 µg/l chez la femme enceinte et de 127 µg/l chez l’enfant. Le besoin de la femme enceinte est plus élevé (250 µg/jour contre 150 µg/jour chez l’adulte), ce qui rend son statut plus sensible à cette lacune.</p>
<p><b>Les effets d’une correction.</b> La correction d’une carence dans une population s’accompagne d’une hausse transitoire de l’hyperthyroïdie (autonomie nodulaire) puis de sa normalisation, d’une légère augmentation de l’hypothyroïdie infraclinique et de l’auto-immunité.</p>
<p><b>La limite de l’intervention.</b> L’essai de supplémentation à 200 µg/jour chez des femmes légèrement carencées n’a pas modifié le développement neurologique de leurs enfants à 5-6 ans. Ce résultat ne s’extrapole pas à la carence sévère, qui est celle du crétinisme.</p>
<table class="t"><thead><tr><th>Échelle</th><th>Question posée</th><th>Indicateur</th></tr></thead><tbody><tr><td>Population générale</td><td>Le sel iodé couvre-t-il les besoins ?</td><td>Iodurie de l’enfant d’âge scolaire</td></tr><tr><td>Femmes enceintes</td><td>La grossesse est-elle couverte ?</td><td>Iodurie de la femme enceinte</td></tr><tr><td>Nouveau-nés</td><td>L’apport intra-utérin était-il suffisant ?</td><td>Fréquence des TSH supérieures à 5 mU/l</td></tr></tbody></table>
<p>Le tableau relie chaque échelle à son indicateur : aucun des trois ne se substitue aux autres.</p>
<div class="key"><b>Santé publique → clinique.</b> Le médecin de premier recours évalue les apports et les facteurs de risque, recherche les signes qui justifient une exploration clinique et discute avec la femme enceinte d’un complément selon les conseils suisses. Il ne diagnostique pas un syndrome congénital à partir de la seule iodurie d’un groupe.</div>
<figure><svg role="img" aria-label="Médianes d’iodurie suisses : 127 microgrammes par litre chez les enfants d’âge scolaire, 97 chez les femmes enceintes ; seuils de suffisance de groupe respectifs 100 et150." viewBox="0 0 660 230" style="width:100%;height:auto;background:#fff;color:#17364b;border-radius:12px"><text x="20" y="26" fill="#17364b" font-size="17">Enquête suisse 2020–2022 — médianes d’iodurie (µg/L)</text><text x="20" y="64" fill="#17364b" font-size="15">Enfants, n = 362</text><rect x="225" y="45" width="254" height="26" fill="#247382"/><text x="490" y="64" fill="#17364b" font-size="16">127</text><line x1="425" y1="38" x2="425" y2="80" stroke="#782b30" stroke-width="3"/><text x="295" y="100" fill="#782b30" font-size="13">Seuil de suffisance du groupe : 100</text><text x="20" y="141" fill="#17364b" font-size="15">Grossesse, n = 473</text><rect x="225" y="122" width="194" height="26" fill="#247382"/><text x="429" y="141" fill="#17364b" font-size="16">97</text><line x1="525" y1="115" x2="525" y2="157" stroke="#782b30" stroke-width="3"/><text x="295" y="177" fill="#782b30" font-size="13">Seuil de suffisance du groupe : 150</text><text x="20" y="212" fill="#17364b" font-size="14">Même échelle pour les deux groupes ; aucune valeur individuelle représentée.</text></svg><figcaption>Comparaison didactique des médianes non ajustées publiées dans l’étude suisse et présentées par l’OSAV, avec les bornes inférieures de suffisance de l’OMS pour chaque groupe. Les effectifs sont ceux des échantillons urinaires. Le graphique ne représente ni une distribution, ni une incidence d’E00, ni l’effet causal d’un supplément ; il ne fournit pas de diagnostic individuel. Construction graphique à partir des valeurs lues, sans image anatomique générée.</figcaption></figure><p><b>Ce que le programme mesure.</b> Les prélèvements de l’enquête suisse ont été recueillis en 2020–2022. La médiane brute de 97 µg/L chez les femmes enceintes ne doit pas être remplacée par la médiane ajustée de l’étude sans signaler le changement de méthode. Les résultats d’un sous-groupe supplémenté dépendent également de la source et de la définition : la page OSAV présente 88 contre 140 µg/L, alors que l’article principal donne 81 contre 129 µg/L. Ce graphique conserve les valeurs globales communes et ne fusionne pas ces sous-groupes.</p><p>Dans le guide OMS 2007, la fréquence des TSH sur sang total buvard supérieures à 5 mU/L constitue un indicateur de population lorsque les prélèvements sont faits à trois–quatre jours avec une méthode suffisamment sensible : une fréquence inférieure à 3 % soutient une suffisance iodée. Ce seuil n’est ni le seuil sérique de traitement ni un seuil de rappel affirmé pour le programme suisse. Les antiseptiques iodés peuvent augmenter la TSH néonatale et compliquer l’interprétation.</p><div class="key"><b>Science → clinique.</b> L’insuffisance des apports d’un groupe justifie une prévention adaptée, sans attribuer le diagnostic à chacun de ses membres. <b>Science → examen.</b> L’iodurie et la TSH néonatale de surveillance ont des populations, méthodes et limites différentes. <b>Science → traitement.</b> En Suisse, choisir le sel iodé sans augmenter le sel ; discuter individuellement le complément pendant le projet de grossesse, la grossesse et l’allaitement. <b>À retenir.</b> Indicateur collectif, examen diagnostique et dose de médicament sont trois objets distincts.</div><span class="src"><button class="w" data-k="e00-sources-2026">[S103]</button>, <button class="w" data-k="e00-sources-2026">[S104]</button>, <button class="w" data-k="e00-sources-2026">[S111]</button>, <button class="w" data-k="e00-sources-2026">[S112]</button>, <button class="w" data-k="e00-sources-2026">[S114]</button></span><button class="pareto-btn ui" data-k="pareto-e00-sante">▲ Loi de Pareto — Santé publique</button>
</section></div>

</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="e00-p-1"><h2><span class="n">p-1</span>Stratégie pharmacologique</h2>
<p>La pharmacologie de ce syndrome répond à deux logiques qu’il ne faut pas confondre. La première est <b>préventive</b> : apporter de l’iode à la femme enceinte et à la population pour éviter le crétinisme endémique. La seconde est <b>substitutive</b> : remplacer l’hormone chez le nouveau-né ou l’enfant hypothyroïdien par de la lévothyroxine. Aucune des deux ne répare une atteinte cérébrale constituée.</p>
<table class="t"><thead><tr><th>Objectif</th><th>Moyen</th><th>Limite</th></tr></thead><tbody><tr><td>Prévenir la carence à l’échelle de la population</td><td><button class="w" data-k="e00-sel">Sel iodé (teneur et programme suisses)</button></td><td>Programme volontaire ; un tiers seulement des aliments transformés en contiennent</td></tr><tr><td>Couvrir la grossesse et l’allaitement</td><td><button class="w" data-k="e00-d-iode-oms">Apport alimentaire et complément discuté individuellement</button></td><td>Ne pas confondre objectif d’apport total et dose du complément ; aucune huile iodée prescrite ici</td></tr><tr><td>Remplacer l’hormone chez l’hypothyroïdien</td><td><button class="w" data-k="e00-d-levothyroxine">Lévothyroxine (Euthyrox®, monographie)</button></td><td>Ne traite pas l’atteinte neurologique constituée ; surdosage nocif</td></tr><tr><td>Protéger l’axe en cas d’hypothyroïdie centrale</td><td>Glucocorticoïdes avant la lévothyroxine si la fonction surrénalienne n’est pas évaluée</td><td>Posologie non précisée dans les sources lues</td></tr></tbody></table>
<p>Le tableau associe chaque objectif à un moyen et indique sa limite. La lévothyroxine est le médicament substitutif étudié ici dans sa FI suisse exacte et dans l’annexe néonatale SwissPedDose distincte ; elle est indiquée dans l’hypothyroïdie congénitale, et l’information professionnelle précise que la dose tolérée la plus élevée doit être donnée en prophylaxie du crétinisme, en cherchant à normaliser la TSH.</p>
<div class="key"><b>À retenir.</b> La prévention du syndrome de carence iodée commence avant la grossesse et repose sur un apport iodé suffisant. La lévothyroxine traite l’hypothyroïdie du nouveau-né ; elle n’a pas été démontrée utile pour réparer un cerveau déjà atteint.</div>
</section>

<section class="ilot" id="e00-p-2"><h2><span class="n">p-2</span>Doses et objectifs</h2>
<p><b>Lévothyroxine chez l’enfant.</b> L’information professionnelle suisse d’Euthyrox® de février 2023 donne les doses par âge. Le consensus européen donne une dose initiale néonatale de 10 à 15 µg/kg/jour, et l’annexe harmonisée SwissPedDose affichée séparément dans AmiKo propose 10 à 15 µg/kg par dose, une prise par jour, de 0 à 28 jours, ajustée sur la TSH et la fT4 pour l’âge.</p>
<table class="t"><thead><tr><th>Âge</th><th>Dose quotidienne</th><th>Par kilo</th></tr></thead><tbody><tr><td>0 à 6 mois</td><td>25 à 75 µg</td><td>10 µg/kg</td></tr><tr><td>6 à 12 mois</td><td>50 à 75 µg</td><td>8 µg/kg</td></tr><tr><td>1 à 5 ans</td><td>75 à 100 µg</td><td>5 à 6 µg/kg</td></tr><tr><td>6 à 12 ans</td><td>100 à 150 µg</td><td>4 à 5 µg/kg</td></tr></tbody></table>
<p>Le <button class="w" data-k="e00-calcul-dose">calcul de dose selon le poids</button> doit être distingué du choix clinique de la dose. Le tableau est celui de l’information professionnelle suisse. La dose quotidienne augmente avec l’âge alors que la dose par kilo diminue. Pour le début du traitement néonatal, le consensus européen donne une dose initiale de 10 à 15 µg/kg/jour (forme sévère : 10 à 15 ; forme légère : environ 10), qui englobe la valeur de 10 µg/kg de l’information professionnelle. La dose est ensuite ajustée sur la TSH et la fT4, avec des augmentations par paliers de 2 à 4 semaines selon l’information professionnelle.</p>
<p><b>Administration.</b> Chez le nourrisson, le comprimé est désagrégé dans un peu d’eau et donné au moins une demi-heure avant le premier repas. La résorption atteint environ 80 % à jeun et diminue de jusqu’à 20 % avec la nourriture ; le pic est vers 5 heures et la demi-vie d’environ 7 jours (9 à 10 jours en hypothyroïdie).</p>
<p><b>Iode préventif : apport total et supplément ne sont pas synonymes.</b> Les repères ci-dessous sont des apports nutritionnels totaux du guide OMS 2007, également repris pour la grossesse par le consensus européen. Ils ne sont pas des doses à ajouter systématiquement à une alimentation qui apporte déjà de l’iode.</p><table class="t"><thead><tr><th>Population du repère nutritionnel</th><th>Apport total quotidien</th><th>Application</th></tr></thead><tbody><tr><td>Enfant 0–59 mois</td><td>90 µg</td><td>Apport global ; nourrisson : lait maternel ou préparation adaptée, selon situation</td></tr><tr><td>Enfant 6–12 ans</td><td>120 µg</td><td>Repère de nutrition, pas prescription de comprimé</td></tr><tr><td>Adolescent de plus de 12 ans et adulte</td><td>150 µg</td><td>Alimentation et sel iodé en quantité modérée</td></tr><tr><td>Grossesse et allaitement</td><td>250 µg</td><td>Apport global, avec supplément discuté individuellement en Suisse</td></tr></tbody></table><p>En Suisse, l’OSAV conseille de choisir du sel iodé sans augmenter le sel, de vérifier les ingrédients des produits transformés et de discuter un complément avec le gynécologue en cas de projet de grossesse, grossesse ou allaitement. Le guide OMS décrit aussi des programmes temporaires de supplémentation dans les régions où l’accès au sel iodé reste insuffisant. Leur contexte n’est pas une ordonnance suisse : aucune huile iodée ni spécialité iodée n’est prescrite ici en l’absence de FI exacte correspondante. La <button class="w" data-k="e00-d-iode-oms">fenêtre dédiée</button> explique cette distinction.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S102]</button>, <button class="w" data-k="e00-sources-2026">[S111]</button>, <button class="w" data-k="e00-sources-2026">[S112]</button>, <button class="w" data-k="e00-sources-2026">[S113]</button>, <button class="w" data-k="e00-sources-2026">[S114]</button></span><div class="trap"><span class="k">Piège</span> Confondre la dose par kilo et la dose quotidienne totale : le tableau donne les deux repères, et la dose se calcule sur le poids de l’enfant, non sur une valeur fixe.</div>
</section>

<section class="ilot" id="e00-p-3"><h2><span class="n">p-3</span>Interactions, effets indésirables et surveillance</h2>
<div class="alert"><b>Interactions et contre-indications dangereuses.</b><ul><li>Troubles hypophysaires ou surrénaliens non traités : la lévothyroxine est contre-indiquée dans l’information professionnelle suisse ; en hypothyroïdie centrale, vérifier la fonction surrénalienne avant de la donner.</li><li>Prématuré très immature : collapsus cardiovasculaires rapportés sous lévothyroxine ; surveiller la circulation.</li><li>Nourriture : la résorption est diminuée de jusqu’à 20 % ; la lévothyroxine se donne au moins une demi-heure avant le premier repas.</li><li>Antiseptiques iodés en période périnatale : risque d’hypothyroïdie transitoire et fausse élévation de la TSH ; à éviter.</li></ul></div>
<p><b>Effets indésirables du surdosage.</b> Chez l’enfant, le surdosage expose à la craniosténose et à la soudure épiphysaire prématurée selon l’information professionnelle. Un surdosage précoce est associé à des troubles de l’attention. Ces risques justifient la surveillance régulière.</p>
<p><b>Surveillance.</b> Elle suit le <button class="w" data-k="e00-surveillance">calendrier du consensus ENDO-ERN (fT4 et TSH)</button> : normalisation de la TSH en 4 semaines si possible, contrôle 4 à 6 semaines après tout changement de dose, dosage avant la prise ou au moins quatre heures après.</p>
<p>Les sections Interactions et Mises en garde de la FI ont été relues pour cette reprise ; le tableau «Prescrire Euthyrox» distingue absorption, métabolisme, interactions pharmacodynamiques et interférences analytiques. <span class="src"><button class="w" data-k="e00-sources-2026">[S101]</button></span></p>
<div class="quiz ui"><p><b>Cas pharmacologique.</b> Un nourrisson reçoit sa lévothyroxine mélangée à son repas. Quelle est la conséquence attendue ?</p><button data-ok="0">A. Aucune : la nourriture ne modifie pas la résorption.</button><button data-ok="1">B. Une résorption diminuée par rapport à la prise à jeun, avec une réduction pouvant atteindre 20 %, d’où un risque de sous-dosage.</button><button data-ok="0">C. Un risque de craniosténose immédiat.</button><p class="fb" hidden>Réponse B. L’information professionnelle indique une résorption jusqu’à environ 80 % à jeun, diminuée de jusqu’à 20 % avec la nourriture. La craniosténose est liée au surdosage.</p></div>
</section>

<section class="ilot" id="e00-p-securite2026"><h2>Prescrire Euthyrox : produit, interactions et suivi</h2><p>Les comprimés sécables suisses contiennent 25, 50, 75, 100, 125, 150, 175 ou 200 µg de lévothyroxine sodique. La FI indique la substitution dans l’hypothyroïdie de toute origine, notamment congénitale. La dose est individualisée selon l’âge, la sévérité, l’état général et les examens. La plage SwissPedDose néonatale affichée dans AmiKo est une annexe harmonisée séparée : elle ne doit pas être présentée comme une nouvelle formulation du tableau par âge de la FI. Ni l’une ni l’autre ne fournit ici un maximum néonatal universel.</p><p><b>Adulte et adolescent dès 12 ans : hypothyroïdie persistante.</b> Pour cette indication, la FI donne une dose initiale de 25–50 µg/jour, avec augmentations de 25–50 µg à intervalles de 2–4 semaines, puis une dose d’entretien usuelle de 100–200 µg/jour. Cette plage d’entretien n’est pas un maximum universel ni une dose à appliquer à tout patient. Chez la personne âgée, ou en cas d’hypothyroïdie ancienne ou sévère ou de comorbidités, la FI décrit un début plus faible à 25 µg, une augmentation prudente avec intervalles plus longs et des contrôles fréquents. Les contre-indications cardiaques restent à vérifier : cette titration ne les annule pas.</p><p>Ces modalités adultes ne remplacent pas la conduite néonatale urgente exposée plus haut. La FI indique que le traitement substitutif est le plus souvent à vie, tandis que le consensus recommande une réévaluation spécialisée quand le caractère permanent de l’hypothyroïdie congénitale n’a pas été établi.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S101]</button>, <button class="w" data-k="e00-sources-2026">[S102]</button></span><p>Chez le nourrisson, la FI demande de désagréger le comprimé dans un peu d’eau, de préparer la suspension juste avant la prise et de vérifier que la dose entière est administrée, au moins une demi-heure avant le premier repas. La <button class="w" data-k="e00-calcul-dose">conversion de la dose pondérale en dose quotidienne</button> est une étape de calcul ; le choix de la présentation et des fractions effectivement administrables relève de la prescription et de la pharmacie.</p><table class="t"><thead><tr><th>Association ou contexte</th><th>Conséquence</th><th>Conduite de la FI suisse</th></tr></thead><tbody><tr><td>Aluminium, fer, calcium</td><td>Absorption diminuée</td><td>Prendre la lévothyroxine au moins 2 heures avant ces médicaments.</td></tr><tr><td>Colestyramine ou colestipol</td><td>Absorption diminuée</td><td>Prendre la lévothyroxine 4–5 heures avant.</td></tr><tr><td>Inhibiteur de pompe à protons, sévélamer, orlistat</td><td>Contrôle hormonal susceptible de changer</td><td>Surveiller lors de l’introduction et de l’arrêt ; adapter individuellement si nécessaire.</td></tr><tr><td>Produits à base de soja</td><td>Absorption réduite</td><td>Surveiller lors du début et de l’arrêt d’une alimentation enrichie en soja.</td></tr><tr><td>Inducteurs enzymatiques ; phénytoïne ; inhibiteurs de protéases</td><td>Clairance et/ou liaison protéique modifiées</td><td>Contrôler les hormones et adapter selon réponse ; ne pas prédire la dose à partir du seul mécanisme.</td></tr><tr><td>Antivitamines K</td><td>Effet anticoagulant accru, risque hémorragique</td><td>Surveiller les paramètres de coagulation et adapter l’anticoagulant si nécessaire.</td></tr><tr><td>Antidiabétiques</td><td>Effet hypoglycémiant susceptible de diminuer</td><td>Contrôler la glycémie, surtout au début du traitement.</td></tr><tr><td>Biotine</td><td>Interférence possible avec certains immunodosages</td><td>Informer le laboratoire ; rechercher l’interférence devant une discordance biologique et clinique.</td></tr></tbody></table>
<p>L’amiodarone, les traitements modifiant la conversion T4–T3, les œstrogènes et d’autres associations mentionnées dans la FI peuvent également modifier l’équilibre : la vérification porte sur la liste complète des traitements et compléments. Il n’existe pas de règle unique d’augmentation ou de diminution de dose pour toutes ces situations.</p><div class="alert"><b>Précautions prioritaires.</b> Les troubles hypophysaires ou surrénaliens non traités figurent parmi les contre-indications. La FI liste aussi notamment angine de poitrine, infarctus ou myocardite aigus, pancardite aiguë et insuffisance cardiaque avec accélération de la fréquence. Un contexte cardiaque ne se résout pas par une règle automatique de demi-dose. Chez le prématuré immature, surveiller la circulation. Une dose excessive ou une augmentation trop rapide peut entraîner tachycardie, arythmie, agitation et manifestations d’hyperthyroïdie ; chez l’enfant, craniosténose et fermeture prématurée des cartilages de croissance sont des risques décrits.</div>
<p><b>Grossesse et allaitement.</b> La substitution se poursuit sans interruption, sous contrôle spécialisé ; les besoins peuvent augmenter. Après l’accouchement, la FI préconise le retour à la dose antérieure à la grossesse et un contrôle de TSH à 6–8 semaines. L’allaitement est compatible aux doses thérapeutiques. Le traitement associant lévothyroxine et antithyroïdien pour une hyperthyroïdie est contre-indiqué pendant la grossesse : il s’agit d’une situation différente de la substitution d’une hypothyroïdie.</p><p><b>Rein, foie et conservation.</b> La FI n’a pas de recommandation chiffrée d’adaptation rénale ou hépatique, ces populations n’ayant pas été étudiées sur le plan pharmacocinétique ; l’absence de tableau n’autorise pas à inventer un pourcentage de réduction. Les comprimés sont conservés à 25 °C au maximum, à l’abri de la lumière dans leur conditionnement original. La durée est souvent à vie si le déficit est permanent ; la décision de réévaluation d’une forme possiblement transitoire reste spécialisée.</p><span class="src"><button class="w" data-k="e00-sources-2026">[S101]</button>, <button class="w" data-k="e00-sources-2026">[S102]</button></span></section><section class="ilot" id="e00-p-4"><h2><span class="n">p-4</span>Médicaments à éviter et limites</h2>
<ul><li><b>Antiseptiques iodés</b> chez le nouveau-né et la mère en période périnatale.</li><li><b>Lévothyroxine sans évaluation surrénalienne</b> en cas d’hypothyroïdie centrale.</li><li><b>Doses trop élevées</b> par rapport à la TSH et à la fT4.</li><li><b>Iode à dose excessive</b> : l’OMS définit un apport excessif à partir de 300 µg/l chez l’enfant d’âge scolaire et de 500 µg/l pendant la grossesse pour la médiane d’iodurie d’une population ; ce ne sont pas des doses de médicament.</li></ul>
<p>La correction des apports suit les conseils nutritionnels suisses. Le bénéfice neurodéveloppemental d’une supplémentation dans la carence légère reste incertain ; ce constat ne doit pas être extrapolé à la prévention d’une carence sévère. Aucune posologie de spécialité iodée n’est proposée sans FI du produit exact.</p>
<div class="key"><b>À retenir.</b> Une prescription correcte nomme le produit suisse, sa dose par âge, son moment de prise et son contrôle. Corriger l’apport iodé insuffisant reste nécessaire, y compris chez une personne atteinte ; cela ne remplace pas la substitution d’une hypothyroïdie persistante et ne promet pas de réparer une lésion ancienne.</div>

</section>
