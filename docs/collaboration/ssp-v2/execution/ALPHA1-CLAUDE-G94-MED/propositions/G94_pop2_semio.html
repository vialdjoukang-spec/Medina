<template data-pop="g94-sm-delire" data-title="Inattention et délire hypoactif : mécanisme, valeur et piège">
<div class="lab">Définition</div><p>Le délire est une altération aiguë et fluctuante de l’attention et de la conscience. Dans l’encéphalopathie septique, il va du délire léger au coma.</p>
<div class="lab">Normal</div><p>Le sujet sain maintient son attention sur une tâche simple et répond de façon cohérente.</p>
<div class="lab">Mécanisme</div><p>La neuro-inflammation et l’ischémie touchent le cortex frontal, l’hippocampe, le système limbique et le tronc cérébral ; la défaillance énergétique et le stress oxydatif désorganisent la neurotransmission.</p>
<div class="lab">Valeur</div><p>Délire léger 19 %, coma 40 %, agitation environ 10 %, crises convulsives environ 2 %, signes focaux environ 1 % ; durée médiane du délire septique 3 jours (intervalle interquartile 2 à 6).</p>
<div class="lab">Piège</div><p>La forme hypoactive passe pour de la fatigue ; sans dépistage systématique par un outil validé, le délire est sous-diagnostiqué. Une encéphalopathie nouvelle peut aussi révéler un sepsis débutant.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10552444/" target="_blank" rel="noopener">Sonneville et collaborateurs, Critical Care 2023</a> ; <a href="https://doi.org/10.1007/s00134-026-08489-0" target="_blank" rel="noopener">Shankar-Hari et collaborateurs, Intensive Care Medicine 2026 (résumé)</a>.</p>
</template>
<template data-pop="g94-sm-glasgow" data-title="Score de Glasgow : technique, valeur et pièges">
<div class="lab">Technique</div><p>Le score explore trois composantes : ouverture des yeux, réponse verbale et réponse motrice. Un patient se décrit par ses trois composantes ; le score total sert surtout à décrire des groupes.</p>
<div class="lab">Normal</div><p>Le sujet conscient et orienté obtient 15.</p>
<div class="lab">Valeur</div><p>Dans l’encéphalopathie septique, un score de 3 à 8 est associé à la mortalité (rapport de risque 3,37 ; intervalle de confiance à 95 % 2,82 à 4,03) ; même un score de 13 à 14 reste associé à un risque accru (1,38).</p>
<div class="lab">Piège</div><p>Fièvre, désordres métaboliques et hypnotiques confondent l’évaluation ; une prédiction individuelle ne repose jamais sur le seul score.</p>
<div class="lab">Limite</div><p>La grille détaillée des points de chaque composante n’a pas été lue dans une source de ce dossier ; elle doit être reprise d’une source primaire avant intégration.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(14)70120-6" target="_blank" rel="noopener">Teasdale et collaborateurs, Lancet Neurology 2014 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10552444/" target="_blank" rel="noopener">Sonneville et collaborateurs, Critical Care 2023</a>.</p>
</template>
<template data-pop="g94-sm-camicu" data-title="Méthode CAM-ICU : dépister le délire aux soins intensifs">
<div class="lab">Rôle</div><p>Outil de dépistage du délire chez le patient de soins intensifs, y compris ventilé.</p>
<div class="lab">Valeur</div><p>Méta-analyse de neuf études (969 patients) : sensibilité 80,0 % (intervalle de confiance à 95 % 77,1 à 82,6 %), spécificité 95,9 % (94,8 à 96,8 %), aire sous la courbe 0,97. L’échelle ICDSC atteint 74 % et 81,9 %.</p>
<div class="lab">Conséquence</div><p>Un résultat positif rend le délire très probable ; à l’inverse, environ un patient délirant sur cinq obtient un résultat négatif (sensibilité de 80 %) : un test négatif n’exclut pas le délire.</p>
<div class="lab">Limite</div><p>Les items de l’outil ne sont pas détaillés dans les sources lues ; la référence diagnostique des études est psychiatrique (critères du manuel diagnostique).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3580690/" target="_blank" rel="noopener">Gusmao-Flores et collaborateurs, Critical Care 2012 (résumé)</a>.</p>
</template>
<template data-pop="g94-sm-tronc" data-title="Tronc cérébral, réponse motrice et mouvements anormaux">
<div class="lab">Ce qu’on évalue</div><p>L’examen clinique de l’encéphalopathie septique évalue l’état mental, les réponses motrices, les réflexes du tronc cérébral et les mouvements anormaux.</p>
<div class="lab">Décision</div><p>Un coma aigu ou tout signe d’atteinte du tronc impose une angiographie par tomodensitométrie : l’occlusion basilaire représente jusqu’à 10 % des comas non traumatiques inexpliqués, et plus de 40 % sont manquées sans contraste.</p>
<div class="lab">Mouvements anormaux</div><p>Des myoclonies sous céfépime orientent vers une neurotoxicité (37 % des cas), surtout en insuffisance rénale.</p>
<div class="lab">Limite</div><p>La technique détaillée de chaque réflexe n’est pas décrite dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10552444/" target="_blank" rel="noopener">Sonneville et collaborateurs, Critical Care 2023</a>.</p>
</template>
<template data-pop="g94-sm-htic" data-title="Hypertension intracrânienne par hydrocéphalie secondaire">
<div class="lab">Signes</div><p>Céphalées, nausées et vomissements, troubles cognitifs et baisse de la vigilance ; la diplopie traduit souvent une atteinte des nerfs oculomoteurs dans les métastases leptoméningées.</p>
<div class="lab">Mécanisme</div><p>Le trouble de circulation du liquide cérébrospinal élève la pression intracrânienne ; le drainage soulage rapidement ces symptômes.</p>
<div class="lab">Valeur</div><p>Non chiffrée dans les sources lues. Dans la méningite bactérienne de l’adulte, 69 % des hydrocéphalies sont déjà présentes à l’admission : l’imagerie initiale les cherche.</p>
<div class="lab">Piège</div><p>Une hydrocéphalie isolée ne suffit pas à affirmer des métastases leptoméningées.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10619142/" target="_blank" rel="noopener">EANO-ESMO 2023</a> ; <a href="https://doi.org/10.1212/WNL.0b013e3181f11e10" target="_blank" rel="noopener">Kasanmoentalib et collaborateurs, Neurology 2010 (résumé)</a>.</p>
</template>
<template data-pop="g94-sm-nerfs" data-title="Nerfs crâniens et racines : la signature leptoméningée">
<div class="lab">Signes</div><p>Diplopie ou trouble visuel (nerfs II, III, IV, VI), paralysie faciale (VII), surdité (VIII), faiblesse radiculaire, troubles mictionnels, syndrome de la queue de cheval, douleur cervicale ou dorsale radiculaire.</p>
<div class="lab">Valeur</div><p>L’atteinte multifocale est très évocatrice ; une présentation isolée, discrète, voire un examen normal restent possibles.</p>
<div class="lab">Technique</div><p>Examen neurologique détaillé et standardisé, consigné sur une grille, répété tous les deux mois pendant six mois puis tous les trois mois chez le patient stable.</p>
<div class="lab">Piège</div><p>Les séquelles d’une métastase cérébrale, d’un traitement ou d’une comorbidité imitent une atteinte leptoméningée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10619142/" target="_blank" rel="noopener">EANO-ESMO 2023</a>.</p>
</template>
<template data-pop="g94-sm-meninge" data-title="Syndrome méningé infectieux : la valeur de la triade">
<div class="lab">Signes</div><p>Céphalée, fièvre, raideur de nuque et altération de l’état mental.</p>
<div class="lab">Valeur</div><p>Dans 696 épisodes néerlandais de méningite bactérienne communautaire de l’adulte, la triade fièvre, raideur de nuque et trouble mental n’était présente que dans 44 % ; 95 % des patients avaient au moins deux des quatre signes. À l’admission, 14 % étaient comateux et 33 % avaient un signe focal.</p>
<div class="lab">Conséquence</div><p>Une triade incomplète n’écarte pas la méningite ; deux signes sur quatre suffisent à la suspecter.</p>
<div class="lab">Limite</div><p>Population adulte néerlandaise ; la technique de recherche de la raideur de nuque n’est pas décrite dans la source lue.</p>
<p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa040845" target="_blank" rel="noopener">van de Beek et collaborateurs, New England Journal of Medicine 2004 (résumé)</a>.</p>
</template>
