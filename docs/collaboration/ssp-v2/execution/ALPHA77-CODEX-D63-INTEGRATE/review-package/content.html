<section class="ilot" id="d63-0"><h2><span class="n">0</span> Une fatigue, une inflammation, plusieurs mécanismes possibles</h2>
<p>Un homme de 67 ans, suivi pour une polyarthrite active, décrit une fatigue croissante depuis trois mois. Il prend régulièrement des anti-inflammatoires. Son hémoglobine vaut104 g/L, sa ferritine 85 µg/L et sa protéine C réactive42 mg/L. Cette vignette est fictive. Elle pose une question réelle : l’inflammation explique-t-elle toute l’anémie, ou masque-t-elle aussi une perte de fer ?</p>
<p>La ferritine 85 µg/L n’est pas automatiquement basse chez une personne sans inflammation. Mais la <button class="w" data-k="d63-ferritine">ferritine augmente pendant la réponse inflammatoire</button>. Une valeur apparemment conservée peut alors coexister avec un manque de fer utilisable, voire avec des réserves diminuées. La prise d’anti-inflammatoires invite notamment à rechercher une perte digestive, sans prouver qu’elle existe.</p>
<p>La première décision porte sur la tolérance : douleur thoracique, dyspnée de repos, malaise, saignement ou dégradation rapide changent l’urgence. Chez une personne stable, le médecin étudie ensuite la production médullaire, l’état du fer et les mécanismes associés. Il ne prescrit pas du fer ni une hormone érythropoïétique sur le seul mot « chronique ».</p>
<p>Le raisonnement rejoint les situations de départ <button class="w" data-k="d63-profiles">PROFILES</button> 2017 : fatigue SSP 4, dyspnée SSP 46, pâleur SSP 147 et anémie SSP 165 ; la dyspnée aiguë sévère relève de SSP 206. Ces correspondances guident l’apprentissage et ne prédisent pas une question d’examen. Le cadre fédéral 2026 demeure distinct de la transition vers <button class="w" data-k="d63-profiles">PROFILES</button> 2 et l’examen 2028.</p>
<div class="key"><b>À retenir.</b> Une maladie inflammatoire rend l’anémie plausible ; elle ne dispense jamais d’en chercher les autres composantes. La stabilité clinique détermine le rythme de cette recherche.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2646/4202/12753" target="_blank" rel="noopener">[S402] Swiss Delphi study on iron deficiency</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S422] PROFILES 2017, situations de départ</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">[S423] OFSP/MEBEKO, exigences examen 2026, §2</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" target="_blank" rel="noopener">[S424] Swiss Medical Weekly 2025, transition PROFILES 2</a>.</p></div></section>
<section class="ilot" id="d63-1"><h2><span class="n">1</span> Définir l’anémie et séparer ses mécanismes</h2>
<p>Une anémie est une baisse de concentration d’hémoglobine par rapport au seuil applicable à la personne. Elle ne désigne ni une maladie unique, ni automatiquement une carence en fer. Dans une maladie chronique, l’inflammation peut réduire l’apport de fer à la moelle, freiner sa stimulation et raccourcir la survie des hématies. Le rein, le cancer, leurs traitements ou des pertes ajoutent souvent d’autres mécanismes.</p>
<p>Les seuils OMS 2024 sont des repères diagnostiques définis par population. Ils ne sont ni une cible à atteindre sous époétine, ni un ordre de transfuser. Chez l’adulte, le tableau OMS porte précisément sur 15–65 ans ; chez une personne plus âgée, les références du laboratoire, la situation clinique et les recommandations de sa maladie restent nécessaires.</p>
<table class="t"><thead><tr><th>Population OMS 2024</th><th>Anémie si hémoglobine inférieure à</th></tr></thead><tbody><tr><td>Femme non enceinte,15–65 ans</td><td>120 g/L</td></tr><tr><td>Homme,15–65 ans</td><td>130 g/L</td></tr><tr><td>Grossesse, premier / deuxième / troisième trimestre</td><td>110 /105 /110 g/L</td></tr><tr><td>Enfant 6–23 mois /24–59 mois</td><td>105 /110 g/L</td></tr><tr><td>Enfant 5–11 ans /12–14 ans</td><td>115 /120 g/L</td></tr></tbody></table>
<p>Une hémoglobine de 108 g/L n’a donc pas la même interprétation chez une femme non enceinte et au deuxième trimestre. Chez l’adulte 15–65 ans, l’OMS classe l’anémie comme sévère sous 80 g/L ; cette catégorie ne remplace pas l’évaluation de la vitesse de baisse, des symptômes ou du terrain cardiovasculaire. Le tableau ne fournit pas ici une norme pour le nourrisson de moins de six mois ou une norme spécifique après 65 ans.</p>
<h3>Trois questions sur le fer</h3>
<p>La <button class="w" data-k="d63-carence-absolue">carence absolue</button> signifie que les réserves sont insuffisantes. La <button class="w" data-k="d63-restriction">restriction du fer disponible</button> signifie que l’apport aux précurseurs érythroïdes est insuffisant ; elle peut persister malgré des réserves. Une forme mixte associe ces deux problèmes. L’expression « carence fonctionnelle » a été employée avec des sens variables ; les recommandations rénales 2026 privilégient une description qui précise disponibilité et réserves.</p>
<p>L’anémie rénale comporte souvent une stimulation érythropoïétique inadaptée, une inflammation, des pertes ou une carence. L’anémie du cancer peut associer inflammation, toxicité médullaire, saignement, infiltration et déficits nutritionnels. Aucun stade unique ne résume toutes ces situations. Le codage D63 sera précisé après la conclusion clinique.</p>
<div class="key"><b>À retenir.</b> Le diagnostic décrit l’anémie et son mécanisme probable. Les indices globulaires, les réticulocytes et le bilan martial préciseront ensuite ce que le seul taux d’hémoglobine ne peut pas expliquer.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S412] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a>.</p></div></section>
<section class="ilot" id="d63-2"><h2><span class="n">2</span> Fréquence, terrain et portée des chiffres</h2>
<p>L’anémie inflammatoire est fréquente chez les personnes hospitalisées ou atteintes de maladies chroniques. La revue de 2019 la décrit comme la deuxième grande forme d’anémie après la carence en fer. Elle rapporte des proportions mondiales et des cohortes très hétérogènes ; ces données ne constituent pas une incidence nationale suisse de D63.</p>
<p>La coexistence d’une carence absolue est particulièrement importante pour la décision. Dans les populations assemblées par cette revue, la proportion varie de 20à85 %. Cette amplitude reflète des maladies, des définitions et des contextes différents. Elle n’autorise pas à annoncer à un patient une probabilité individuelle située arbitrairement au milieu de l’intervalle.</p>
<p>Les documents suisses consultés apportent surtout des repères diagnostiques et des avis de traitement. Ils n’établissent pas une incidence contemporaine de D63, ni sa distribution nationale par âge et sexe. Les anciennes proportions suisses reprises dans le socle provenaient d’une série de 1997 citée de seconde main en 2011. Elles ne servent pas ici de fréquence actuelle.</p>
<p>Le terrain oriente l’enquête. Une maladie rénale avancée augmente la probabilité d’une composante rénale. Une maladie intestinale active peut associer inflammation, pertes et malabsorption. Les traitements anticancéreux peuvent modifier la production médullaire. Chez une personne âgée, plusieurs mécanismes peuvent s’ajouter ; qualifier l’anémie de conséquence normale du vieillissement risquerait de retarder une cause traitable.</p>
<p>Le pronostic dépend largement de la maladie sous-jacente et des mécanismes associés. En <button class="w" data-k="d63-mrc">MRC</button>, l’anémie est associée à des événements cardiovasculaires, une baisse de qualité de vie et une mortalité plus élevée. Pourtant, relever l’hémoglobine vers une valeur normale avec un <button class="w" data-k="d63-esa">ESA</button> ne corrige pas nécessairement ces issues et peut augmenter les risques. Une association statistique ne prouve donc pas qu’une normalisation médicamenteuse soit bénéfique.</p>
<div class="key"><b>À retenir.</b> La fréquence justifie de chercher l’anémie et ses causes associées. Elle ne remplace ni le diagnostic individuel, ni une analyse du bénéfice et du risque du traitement.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2646/4202/12753" target="_blank" rel="noopener">[S402] Swiss Delphi study on iron deficiency</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></section>
<section class="ilot" id="d63-3"><h2><span class="n">3</span> Le fonctionnement normal : produire, transporter et recycler</h2>
<p>La moelle rouge produit les cellules sanguines à partir de précurseurs qui prolifèrent puis se différencient. La maturation érythroïde permet l’accumulation d’hémoglobine ; les réticulocytes rejoignent ensuite le sang avant de devenir des hématies matures. Le <button class="w" data-k="d63-reticulocytes">nombre de réticulocytes</button> donne ainsi une information récente sur la production, différente de la concentration d’hémoglobine déjà circulante.</p>
<p>La photographie suivante situe le tissu médullaire dans une pièce osseuse. Ses repères sont macroscopiques ; ils ne montrent ni un dosage du fer ni une maladie particulière.</p>
<figure id="d63-figure-moelle-clinique" data-origin="human-original"><img src="assets/img/d63/alpha/codex/normal-marrow-openstax2016.jpg" alt="Coupe osseuse originale montrant tissu spongieux et moelle rouge" loading="lazy"><figcaption><b>Le compartiment où se fabrique le sang.</b> <b>Repère 1, centre rouge :</b> tissu médullaire entre les travées. <b>Repère 2, travées claires :</b> architecture spongieuse qui délimite les espaces. <b>Repère 3, bord périphérique :</b> limite osseuse de la pièce. <b>Repère 4, barre blanche supérieure :</b> barre conservée, sans mesure calculée car sa valeur manque dans ce fichier. Cette coupe macroscopique ne montre pas une lignée cellulaire, ne mesure pas le fer et ne diagnostique pas une anémie inflammatoire. Original : OpenStax, édition 8.25 du 18mai 2016, <a href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">provenance</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels intacts ; annotations françaises de lecture ajoutées à la légende.</figcaption></figure>
<p>Le fer intervient notamment dans l’hème de l’hémoglobine. La transferrine transporte le fer dans le plasma vers les cellules qui en ont besoin. La ferritine participe au stockage cellulaire. Ces protéines ont donc des fonctions différentes : mesurer la ferritine sérique ne revient pas à mesurer directement le fer livré à chaque précurseur médullaire.</p>
<p>La majeure partie du fer nécessaire chaque jour à la production érythrocytaire provient du recyclage des anciennes hématies. La revue 2019 estime que ce recyclage fournit plus de 90 % du besoin quotidien de l’érythropoïèse. L’absorption intestinale compense notamment les pertes. Cette organisation explique qu’un blocage macrophagique puisse perturber la production même lorsque les apports alimentaires ne paraissent pas particulièrement faibles.</p>
<p>La <button class="w" data-k="d63-ferroportine">ferroportine</button> permet l’export du fer depuis certaines cellules, dont les entérocytes et les macrophages. L’<button class="w" data-k="d63-hepcidine">hepcidine</button> hépatique règle cet export. La stimulation érythropoïétique aide normalement à adapter la production sanguine aux besoins ; l’érythropoïétine et les signaux des précurseurs interagissent avec la régulation du fer.</p>
<div class="key"><b>À retenir.</b> La production dépend à la fois d’un tissu médullaire fonctionnel, d’une stimulation adaptée et de matériaux disponibles. Une réserve conservée ne garantit pas leur livraison à la moelle.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S417] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S418] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">[S419] File:2205 Bone Marrow.jpg - Wikimedia Commons</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a>.</p></div></section>
<section class="ilot" id="d63-4"><h2><span class="n">4</span> De l’inflammation à la baisse d’hémoglobine</h2>
<p>L’inflammation active des voies immunitaires qui modifient la distribution du fer. L’interleukine6 stimule notamment la production hépatique d’hepcidine, avec participation de la voie <button class="w" data-k="d63-il6-stat3">STAT3</button>. L’hepcidine se lie à la ferroportine ; son internalisation et sa dégradation réduisent l’export. À certaines concentrations, une inhibition directe de l’export participe aussi au mécanisme décrit dans la revue.</p>
<p>Le fer reste alors davantage dans les macrophages et l’absorption intestinale contribue moins à son passage vers le plasma. La ferritine peut augmenter, tandis que le fer circulant et sa disponibilité pour la moelle diminuent. La transferrine est aussi influencée par l’inflammation. Les concentrations mesurées ne se lisent donc pas comme chez une personne sans réaction inflammatoire.</p>
<figure id="d63-chaine-hepcidine"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="680" viewBox="0 0 580 680" role="img" aria-label="Inflammation et restriction du fer"><title>Inflammation et restriction du fer</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="52" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Activation inflammatoire et</tspan><tspan x="290" dy="29">cytokines</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="196" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Hepcidine hépatique augmentée</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="326" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Export par ferroportine réduit</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Fer moins disponible pour les</tspan><tspan x="290" dy="29">précurseurs</tspan></text><text x="290" y="533" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="535" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="586" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Production d’hémoglobine limitée</tspan></text></svg><figcaption><b>Inflammation et restriction du fer.</b> Le schéma montre une chaîne importante, mais non exclusive. Une perte de fer, une insuffisance rénale ou une toxicité médullaire peuvent agir en parallèle. Schéma causal pédagogique, sans représentation anatomique synthétique.</figcaption></figure>
<p>L’inflammation ne se limite pas au fer. Les cytokines peuvent diminuer la production ou l’efficacité biologique de l’érythropoïétine, perturber la différenciation des précurseurs et favoriser leur perte. La survie des hématies peut également raccourcir. La part de chaque mécanisme varie selon la maladie ; les observations cellulaires ou animales ne permettent pas d’en calculer la contribution chez un patient donné.</p>
<p>En <button class="w" data-k="d63-mrc">MRC</button>, la baisse de stimulation érythropoïétique s’ajoute à la restriction du fer et aux autres causes possibles. Une diminution de l’élimination de l’hepcidine peut participer au phénomène. Les pertes liées aux prélèvements ou à la dialyse peuvent en plus vider les réserves. Augmenter sans fin la dose d’<button class="w" data-k="d63-esa">ESA</button> ne corrige ni une hémorragie ni une carence non traitée.</p>
<p>Une anémie qui apparaît en quelques heures ne s’explique pas uniquement par un ralentissement de fabrication. Une hémorragie, une hémolyse, une dilution ou une autre modification aiguë doivent être envisagées. La chronologie est donc un élément du mécanisme, pas seulement une information administrative.</p>
<div class="key"><b>À retenir.</b> Le même profil peut résulter de plusieurs voies. La compréhension du mécanisme aide à choisir l’examen puis le traitement, sans transformer un schéma explicatif en preuve diagnostique individuelle.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a>.</p></div></section>
<section class="ilot" id="d63-5"><h2><span class="n">5</span> Rechercher les causes et les composantes associées</h2>
<p>La maladie chronique connue est un point de départ. Elle ne doit pas arrêter l’enquête. Une anémie plus profonde que prévu, une modification rapide ou une autre cytopénie imposent de reconsidérer les hypothèses. Le bilan cherche une cause dominante et les composantes corrigibles.</p>
<p>Le tableau rapproche des contextes fréquents de la question utile. Il ne constitue pas une liste d’examens à prescrire indistinctement.</p>
<table class="t"><thead><tr><th>Contexte</th><th>Mécanismes possibles</th><th>Question qui oriente</th></tr></thead><tbody><tr><td>Inflammation chronique ou infection</td><td>Restriction du fer et réponse médullaire freinée ; pertes associées possibles.</td><td>La maladie est-elle active ? Une autre cause explique-t-elle la baisse ?</td></tr><tr><td>Maladie intestinale</td><td>Pertes, malabsorption, inflammation ; déficits B12/folate selon contexte.</td><td>La maladie est-elle active, avec saignement ou atteinte de l’absorption ?</td></tr><tr><td><button class="w" data-k="d63-mrc">MRC</button> ou dialyse</td><td>Stimulation inadaptée, restriction, pertes et déficits.</td><td>Le fer est-il disponible et la cause extra-rénale a-t-elle été recherchée ?</td></tr><tr><td>Cancer et traitements</td><td>Inflammation, chimiotoxicité, infiltration, pertes ou déficits.</td><td>Quelle est la chronologie par rapport au traitement et aux autres lignées ?</td></tr><tr><td>Médicaments et prélèvements</td><td>Saignement, moindre absorption ou perturbation de production.</td><td>Le médicament ou la répétition des prélèvements contribue-t-il au mécanisme ?</td></tr></tbody></table>
<p>Chez l’homme de la vignette, les anti-inflammatoires et une possible perte digestive justifient une anamnèse ciblée. Ils ne prouvent pas une hémorragie. La ferritine et la saturation de la transferrine, les réticulocytes, le frottis et les autres résultats seront confrontés au contexte. L’exploration digestive dépendra des indices de perte et de carence, pas seulement de l’étiquette de polyarthrite.</p>
<p>Une carence en B12 ou en folate, une hémolyse, une maladie thyroïdienne ou médullaire peuvent se superposer. Une numération d’hématies de taille moyenne normale ne suffit pas à les exclure : plusieurs mécanismes opposés peuvent masquer une modification du volume globulaire moyen. Une pancytopénie, des cellules atypiques ou une absence persistante d’explication motivent un avis spécialisé.</p>
<div class="key"><b>À retenir.</b> La recherche d’une cause associée protège contre deux erreurs : attribuer toute anémie à l’inflammation et traiter seulement le chiffre sans corriger le mécanisme accessible.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a>.</p></div></section>
<section class="ilot" id="d63-6" data-semiology-clinical="D63"><h2><span class="n">6</span> Interroger et examiner en partant de la tolérance</h2>
<p>La fatigue est fréquente et peu spécifique. Le médecin demande ce qui a changé : distance de marche, escaliers, activités quotidiennes, concentration, sommeil et récupération. Il précise la vitesse d’installation, les valeurs antérieures d’hémoglobine et les changements de traitement. Une comparaison avec l’état habituel aide à distinguer le retentissement de l’anémie de celui de la maladie causale.</p>
<p>La <button class="w" data-k="d63-dyspnee">dyspnée</button>, la douleur thoracique, les palpitations, les malaises et les signes de saignement sont recherchés en priorité. Un saignement extériorisé, des selles anormalement noires, des règles abondantes ou des prélèvements répétés orientent vers une perte ; l’absence de saignement visible n’écarte pas une perte occulte. Une coloration noire des selles sous fer oral doit être interprétée avec la clinique et les autres signes, sans assimiler toute coloration à un saignement ni tout saignement au médicament.</p>
<p>Les apports, les troubles digestifs, les antécédents de chirurgie digestive, les traitements et les infections sont précisés. Chez une personne atteinte de cancer, l’interrogatoire situe l’anémie par rapport à la chimiothérapie. Chez une personne dialysée, il examine aussi les pertes, les apports de fer, les traitements stimulant l’érythropoïèse et leur réponse documentée.</p>
<h3>De l’état général aux signes orientés</h3>
<p>L’examen commence par l’état de conscience, le confort respiratoire, la fréquence cardiaque, la pression artérielle et les signes de perfusion. Une situation instable impose une prise en charge urgente. La <button class="w" data-k="d63-paleur">pâleur cutanéomuqueuse</button> peut attirer l’attention, mais elle ne mesure pas précisément l’hémoglobine et n’identifie pas le mécanisme. Aucun chiffre de sensibilité ou de spécificité propre à D63 n’a été établi dans les sources retenues.</p>
<p>Une saturation pulsée normale ne garantit pas un transport total d’oxygène normal : elle décrit une proportion d’hémoglobine oxygénée, alors que l’anémie diminue la quantité d’hémoglobine. Le médecin recherche ensuite les signes de maladie causale ou associée : inflammation, infection, surcharge, atteinte digestive ou hématologique selon le contexte. Il n’interprète pas un examen peu expressif comme la preuve d’une anémie bénigne.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Une personne anémique a une saturation pulsée de 98 % et une dyspnée à l’effort. Que signifie cette valeur ?</p><button data-ok="1">Elle ne mesure pas la quantité totale d’hémoglobine disponible pour transporter l’oxygène.</button><button data-ok="0">Elle exclut un retentissement de l’anémie.</button><button data-ok="0">Elle prouve une origine inflammatoire.</button><p class="fb" hidden>Une proportion d’hémoglobine oxygénée peut être conservée alors que sa quantité diminue. La clinique, l’hémoglobine et les autres causes de dyspnée restent à analyser.</p></div>
<div class="key"><b>À retenir.</b> L’interrogatoire et l’examen évaluent d’abord le danger, puis orientent la cause. Le laboratoire complète cette démarche ; il ne remplace pas une réévaluation si l’état change.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S421] HUG, enseignement hémogramme adulte, septembre 2019</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S418] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S410] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a>.</p></div></section>

<section class="ilot" id="d63-7"><h2><span class="n">7</span> Établir un diagnostic qui résiste aux résultats discordants</h2>
<p>Le bilan commence par la numération sanguine, les indices globulaires et les réticulocytes. La concentration d’hémoglobine confirme l’anémie dans le contexte approprié. Les autres lignées et le frottis peuvent révéler qu’il ne s’agit pas d’un trouble érythrocytaire isolé. La production médullaire est appréciée par rapport à l’importance de l’anémie : un résultat dans l’intervalle habituel du laboratoire peut être insuffisant face à une baisse marquée d’hémoglobine.</p>
<p>Le bilan martial associe la ferritine et la <button class="w" data-k="d63-tsat">saturation de la transferrine</button>, avec une appréciation de l’inflammation. Le fer sérique seul est peu utile pour conclure. La saturation est un rapport ; si la transferrine diminue, notamment sous inflammation ou dénutrition, sa valeur peut aussi être trompeuse. Une ferritine élevée n’est pas un test d’exclusion universel de la carence.</p>
<table class="t"><thead><tr><th>Configuration</th><th>Interprétation plausible</th><th>Limite décisive</th></tr></thead><tbody><tr><td>Ferritine franchement abaissée</td><td>Les réserves sont probablement diminuées.</td><td>La cause de la perte doit encore être cherchée ; une inflammation peut coexister.</td></tr><tr><td>Inflammation, ferritine conservée/élevée,<button class="w" data-k="d63-tsat">TSAT</button> basse</td><td>Le fer disponible est insuffisant ; une composante inflammatoire est plausible.</td><td>Les réserves ne sont pas nécessairement normales et une cause mixte reste possible.</td></tr><tr><td>Ferritine 30–100 µg/L avec inflammation</td><td>Une carence associée est possible ; <button class="w" data-k="d63-sources-guides">ECCO</button> décrit une forme mixte probable dans les <button class="w" data-k="d63-mici">MICI</button>.</td><td>Ce domaine ne suffit pas à établir une règle identique pour toutes les maladies.</td></tr><tr><td>Réticulocytes élevés ou autre lignée anormale</td><td>Une perte, une hémolyse ou une atteinte plus large doit être discutée.</td><td>La réponse dépend aussi du délai et de la capacité médullaire.</td></tr></tbody></table>
<p>Pour le patient à ferritine 85 µg/L, le raisonnement reste ouvert. Le contexte, la saturation, les réticulocytes et les indices de perte apportent plus que l’opposition artificielle « ferritine normale ou anormale ». Les recommandations rénales utilisent des seuils permettant d’initier un traitement ; elles ne certifient pas toutes une absence de fer dans les réserves.</p>
<h3>Tests complémentaires, si la première lecture reste incertaine</h3>
<p>Le <button class="w" data-k="d63-stfr">récepteur soluble de la transferrine et son index</button> peut contribuer à certaines situations complexes. Il dépend toutefois de l’activité érythropoïétique, des traitements et des méthodes. Les valeurs d’index inférieures à 1 ou supérieures à 2 citées dans l’algorithme genevois 2011 ne deviennent pas des seuils interchangeables entre tous les laboratoires.</p>
<p>Le <button class="w" data-k="d63-chr">contenu en hémoglobine des réticulocytes</button> renseigne l’approvisionnement récent de l’érythropoïèse. Un résultat bas soutient une restriction du fer ; il ne prouve pas à lui seul des réserves vides. <button class="w" data-k="d63-sources-guides">ECCO</button> utilise un repère <button class="w" data-k="d63-chr">CHr</button>&lt;29 pg en appui d’un bilan incertain ; <button class="w" data-k="d63-sources-guides">ESMO</button> cite&lt;28 pg dans son contexte. La méthode, le seuil local et la population sont donc indispensables avant de comparer ces nombres.</p>
<p>Une hémolyse, une carence vitaminique, une maladie thyroïdienne ou médullaire et une cause rénale peuvent nécessiter des explorations ciblées. Le diagnostic d’anémie inflammatoire résulte d’une cohérence clinique et biologique, avec exclusion proportionnée des autres causes ; il ne repose pas sur une seule ferritine ou une seule <button class="w" data-k="d63-crp">CRP</button>.</p>
<figure id="d63-arbre-diagnostic"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="810" viewBox="0 0 580 810" role="img" aria-label="De la gravité au mécanisme"><title>De la gravité au mécanisme</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="52" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Évaluer tolérance, saignement et</tspan><tspan x="290" dy="29">évolution</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="182" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Confirmer anémie, indices et</tspan><tspan x="290" dy="29">autres lignées</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="312" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Interpréter la production par les</tspan><tspan x="290" dy="29">réticulocytes</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Réserves, fer disponible et</tspan><tspan x="290" dy="29">inflammation</tspan></text><text x="290" y="533" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="535" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="572" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Chercher pertes, déficits et</tspan><tspan x="290" dy="29">maladies associées</tspan></text><text x="290" y="663" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="665" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="702" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Choisir traitement et contrôle de</tspan><tspan x="290" dy="29">réponse</tspan></text></svg><figcaption><b>De la gravité au mécanisme.</b> Une urgence est traitée sans attendre la fin de toutes les explorations. Les étapes peuvent se mener en parallèle selon le contexte. Schéma causal pédagogique, sans représentation anatomique synthétique.</figcaption></figure>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Une patiente atteinte de <button class="w" data-k="d63-mici">MICI</button> active a une anémie, une ferritine 80 µg/L et une <button class="w" data-k="d63-tsat">TSAT</button> 12 %. Quelle lecture est la plus juste ?</p><button data-ok="1">Une restriction et une carence associée sont possibles ; la ferritine ne permet pas de les exclure.</button><button data-ok="0">Les réserves sont certainement normales puisque la ferritine dépasse 30 µg/L.</button><button data-ok="0">La ferritine prouve une hémolyse.</button><p class="fb" hidden><button class="w" data-k="d63-sources-guides">ECCO</button> décrit une forme mixte probable dans la zone 30–100 µg/L sous inflammation. Le bilan et les pertes sont évalués ; ce cadre <button class="w" data-k="d63-mici">MICI</button> ne devient pas une règle universelle pour tous les patients.</p></div>
<div class="key"><b>À retenir.</b> Le diagnostic devient solide lorsque les résultats répondent à des questions différentes et concordantes. Une discordance impose une interprétation, pas l’effacement du résultat gênant.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2011/revue-medicale-suisse-313/anemie-ferriprive-inflammatoire-ou-mixte-comment-orienter-le-diagnostic" target="_blank" rel="noopener">[S403] Anémie ferriprive, inflammatoire ou mixte : comment orienter le diagnostic ?</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S421] HUG, enseignement hémogramme adulte, septembre 2019</a>.</p></div></section>
<section class="ilot" id="d63-8"><h2><span class="n">8</span> Reconnaître la gravité et discuter la transfusion</h2>
<div class="alert"><b>La tolérance détermine l’urgence.</b><p>Une instabilité circulatoire, un saignement important, des signes d’ischémie, une dyspnée sévère ou une dégradation rapide nécessitent une prise en charge urgente. Le médecin ne retarde pas la stabilisation pour achever une classification inflammatoire. Une transfusion peut être nécessaire avant que l’ensemble du mécanisme soit établi.</p></div>
<p>Le danger ne dépend pas du seul taux d’hémoglobine. La vitesse de baisse, le volume circulant, les symptômes, le terrain et la maladie causale modifient la tolérance. Une anémie chronique peut être relativement bien tolérée à un chiffre bas ; cela ne supprime pas son besoin d’évaluation. À l’inverse, une mauvaise tolérance peut justifier une intervention à un chiffre plus élevé.</p>
<p>La recommandation suisse SSMIG de 2016 demande la quantité minimale de concentrés érythrocytaires nécessaire pour soulager les symptômes ou atteindre un niveau sûr. Elle cite70 g/L chez le patient stable sans maladie cardiaque et80 g/L en cas de maladie cardiovasculaire préexistante stable. Ces repères ne sont pas un algorithme pour une hémorragie active ou un syndrome coronarien aigu.</p>
<p>NICE recommande également une stratégie restrictive, avec exclusions explicites pour hémorragie majeure, syndrome coronarien aigu et anémie nécessitant des transfusions régulières. Chez un adulte sans saignement actif, une unité puis une réévaluation clinique et biologique évitent l’automatisme de deux unités. Les personnes chroniquement transfusées nécessitent des seuils individualisés.</p>
<p>En <button class="w" data-k="d63-mrc">MRC</button>, <button class="w" data-k="d63-sources-guides">KDIGO</button> demande de fonder la décision sur les signes et symptômes plutôt que sur un chiffre arbitraire. Chez le candidat à une transplantation, éviter si possible les transfusions limite l’<button class="w" data-k="d63-alloimmunisation">sensibilisation immunologique contre le donneur potentiel</button>. Ce risque ne justifie pas de laisser persister une urgence vitale. L’inefficacité ou le danger des autres traitements peut aussi rendre la transfusion préférable.</p>
<p>En oncologie, <button class="w" data-k="d63-sources-guides">ESMO</button> considère une transfusion sans délai lorsque l’hémoglobine est inférieure à 70–80 g/L et/ou que des symptômes graves imposent une amélioration immédiate. L’<button class="w" data-k="d63-esa">ESA</button> et le fer ne produisent pas cette correction immédiate. La transfusion ne traite toutefois ni la maladie causale ni toutes les conséquences d’un déficit martial.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Un patient stable sans maladie cardiaque a une Hb68 g/L et une fatigue importante. La stabilité interdit-elle une transfusion ?</p><button data-ok="1">Non. La décision se discute avec les symptômes et le contexte ; une unité peut être suivie d’une réévaluation.</button><button data-ok="0">Oui, seules les personnes en choc peuvent être transfusées.</button><button data-ok="0">Deux unités doivent être prescrites systématiquement.</button><p class="fb" hidden>Les repères restrictifs suisses et britanniques concernent précisément aussi des patients stables. Ils limitent l’exposition inutile sans transformer la stabilité en contre-indication absolue.</p></div>
<div class="key"><b>À retenir.</b> La transfusion répond à un besoin clinique de correction rapide ou à l’impossibilité d’une autre stratégie. Elle n’est ni réservée au choc, ni déclenchée mécaniquement par une catégorie de sévérité OMS.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng24/chapter/Red-blood-cell-transfusion" target="_blank" rel="noopener">[S407] Blood transfusion — red blood cell transfusion</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S412] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a>.</p></div></section>
<section class="ilot" id="d63-9"><h2><span class="n">9</span> Traiter la cause et choisir le fer utile</h2>
<p>Le traitement vise la maladie causale, les composantes corrigibles et le retentissement sur la personne. Contrôler l’inflammation peut améliorer l’anémie. Mais attendre seulement cette amélioration laisserait parfois persister une perte de fer, une carence vitaminique ou une autre cause traitable. À l’inverse, répéter du fer sans réévaluer le mécanisme expose à un traitement inutile.</p>
<p>La <button class="w" data-k="d63-d-fer-oral">voie orale</button> convient à certaines carences lorsque l’absorption, la tolérance et le délai attendu le permettent. La <button class="w" data-k="d63-d-ferinject">voie intraveineuse</button> peut être indiquée si la voie orale est insuffisante, inefficace ou impossible dans l’indication suisse du produit. Une inflammation active peut réduire l’efficacité de l’oral, mais le choix dépend de la maladie et du patient.</p>
<p>Les critères <button class="w" data-k="d63-sources-guides">KDIGO</button> 2026 illustrent pourquoi on doit nommer la population avant le nombre. Dans ce tableau, les deux conditions d’une même ligne doivent être réunies.</p>
<table class="t"><thead><tr><th>Population avec anémie <button class="w" data-k="d63-mrc">MRC</button></th><th>Critères suggérant l’introduction du fer</th></tr></thead><tbody><tr><td>Hémodialyse</td><td>Ferritine ≤ 500 µg/L et <button class="w" data-k="d63-tsat">TSAT</button> ≤ 30 %</td></tr><tr><td>Sans dialyse ou dialyse péritonéale, première possibilité</td><td>Ferritine&lt;100 µg/L et <button class="w" data-k="d63-tsat">TSAT</button>&lt;40 %</td></tr><tr><td>Sans dialyse ou dialyse péritonéale, autre possibilité</td><td>Ferritine ≥ 100 et&lt;300 µg/L et <button class="w" data-k="d63-tsat">TSAT</button>&lt;25 %</td></tr></tbody></table>
<p>Une personne non dialysée à ferritine 180 µg/L et <button class="w" data-k="d63-tsat">TSAT</button> 18 % peut donc relever d’une discussion de fer selon ce cadre. Cela ne signifie pas que ses réserves sont nécessairement vides. En hémodialyse, la voie IV est suggérée plutôt que l’oral. Hors hémodialyse, tolérance, efficacité, préférence, disponibilité et coûts interviennent dans le choix.</p>
<p><button class="w" data-k="d63-sources-guides">KDIGO</button> propose de suspendre le fer de routine si la ferritine dépasse 700 µg/L ou si la <button class="w" data-k="d63-tsat">TSAT</button> atteint 40 %. Une suspension temporaire est à envisager lors d’une infection systémique. La FI Ferinject recommande la prudence dans les infections aiguës ou chroniques et l’interruption en cas de bactériémie. Ces formulations ne signifient pas que tout symptôme infectieux mineur impose partout la même conduite.</p>
<p>Si un régime oral optimal reste inefficace après un à trois mois en <button class="w" data-k="d63-mrc">MRC</button>, ou s’il est mal toléré, le passage à l’IV est proposé. Le délai de deux semaines cité dans une revue ancienne ne devient pas un délai universel. Avant de conclure à l’échec, le médecin recherche prise réelle, interactions, perte persistante, malabsorption et diagnostic incomplet.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Une personne en <button class="w" data-k="d63-mrc">MRC</button> non dialysée a une anémie, ferritine 180 µg/L et <button class="w" data-k="d63-tsat">TSAT</button> 18 %. Quel énoncé respecte <button class="w" data-k="d63-sources-guides">KDIGO</button> 2026 ?</p><button data-ok="1">Le fer peut être discuté selon les critères de ce contexte, après évaluation clinique.</button><button data-ok="0">Le fer est interdit dès que la ferritine dépasse 100 µg/L.</button><button data-ok="0">Ces chiffres prouvent l’absence totale de réserves.</button><p class="fb" hidden>Le cadre non dialysé comprend ferritine 100 à&lt;300 µg/L avec <button class="w" data-k="d63-tsat">TSAT</button>&lt;25 %. C’est un critère de traitement suggéré, pas une mesure directe du stock ni une prescription indépendante des risques.</p></div>
<div class="key"><b>À retenir.</b> Une décision de fer associe indication, voie, produit exact et surveillance. La réponse sera contrôlée ; elle ne doit pas être présumée à partir du seul chiffre initial.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S410] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2646/4202/12753" target="_blank" rel="noopener">[S402] Swiss Delphi study on iron deficiency</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a>.</p></div></section>
<section class="ilot" id="d63-10"><h2><span class="n">10</span> Stimuler l’érythropoïèse sans chercher la normalisation à tout prix</h2>
<p>Les <button class="w" data-k="d63-d-eprex">agents stimulant l’érythropoïèse</button> augmentent la production érythrocytaire. Ils ne remplacent pas le fer disponible, une moelle fonctionnelle ou la correction d’une perte. Avant leur introduction, le médecin traite les causes corrigibles et discute les bénéfices attendus : réduction des besoins transfusionnels et amélioration de certains symptômes, avec des risques propres.</p>
<p>En <button class="w" data-k="d63-mrc">MRC</button>, <button class="w" data-k="d63-sources-guides">KDIGO</button> 2026 suggère un <button class="w" data-k="d63-esa">ESA</button> plutôt qu’un inhibiteur des prolyl-hydroxylases de HIF en première ligne après correction des causes accessibles. Chez le patient dialysé, l’introduction peut être discutée lorsque l’hémoglobine est à 90–100 g/L ou moins. Hors dialyse, il n’impose pas un seuil unique : symptômes, risques des transfusions et risques du traitement guident la décision partagée.</p>
<p>Chez l’adulte sous <button class="w" data-k="d63-esa">ESA</button>, <button class="w" data-k="d63-sources-guides">KDIGO</button> recommande une cible inférieure à 115 g/L. La FI suisse Eprex décrit une plage de 100–120 g/L dans ses indications. Ces deux textes ne sont pas identiques. Le plan thérapeutique rénal applique la recommandation de sécurité tout en respectant les limites et contre-indications du produit ; il n’utilise pas120 g/L comme objectif automatique.</p>
<p>La FI Eprex énumère notamment une hypertension non contrôlée, une aplasie érythroblastique pure après érythropoïétine et des antécédents thromboemboliques parmi les contre-indications. Dans le texte suisse lu, cette dernière ligne n’est pas limitée aux patients opérés. Les autres restrictions périopératoires conservent leur qualification spécifique. Une règle d’une autre juridiction ne doit pas effacer la formulation suisse.</p>
<p>En oncologie, la FI exclut l’usage dans un traitement à visée curative. L’indication, la chimiothérapie, les symptômes, le pronostic et le risque thrombotique sont examinés avec le patient. L’<button class="w" data-k="d63-esa">ESA</button> agit avec un délai et ne remplace pas une transfusion lorsqu’une correction immédiate est nécessaire. Les posologies suisses détaillées figurent dans l’onglet de pharmacologie.</p>
<h3>Une réponse insuffisante doit faire réexaminer la cause</h3>
<p>Une faible réponse peut résulter d’un déficit martial, d’une inflammation, d’une perte, d’une carence vitaminique ou d’une maladie médullaire. Augmenter indéfiniment la dose expose à des complications sans résoudre le mécanisme. Une chute d’hémoglobine avec réticulocytes très bas sous érythropoïétine peut aussi imposer la recherche d’une aplasie érythroblastique pure liée à des anticorps.</p>
<p>Les <button class="w" data-k="d63-hif-phi">inhibiteurs des prolyl-hydroxylases de HIF</button> représentent une autre stratégie dans certains cadres spécialisés. <button class="w" data-k="d63-sources-guides">KDIGO</button> décrit leurs risques et recommande de ne pas les associer à un <button class="w" data-k="d63-esa">ESA</button>. Leur présence dans une table internationale ne prouve pas leur autorisation ou leur remboursement suisse. Aucun schéma suisse non vérifié n’est présenté ici.</p>
<div class="key"><b>À retenir.</b> Le but est un bénéfice clinique avec la dose minimale utile. La normalisation du chiffre n’est pas une fin en soi, et une réponse insuffisante appelle d’abord une nouvelle explication.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a>.</p></div></section>
<section class="ilot" id="d63-11"><h2><span class="n">11</span> Adapter la stratégie à la maladie causale</h2>
<h3>Maladie intestinale inflammatoire</h3>
<p>Une <button class="w" data-k="d63-mici">MICI</button> peut associer inflammation, pertes et déficit d’absorption. <button class="w" data-k="d63-sources-guides">ECCO</button> 2024 recommande le fer IV en première ligne lorsque la maladie est cliniquement active, lorsque le fer oral était mal toléré ou lorsqu’un <button class="w" data-k="d63-esa">ESA</button> est nécessaire. La voie orale convient à une anémie ferriprive légère lorsque la maladie est inactive. Le traitement de la <button class="w" data-k="d63-mici">MICI</button> reste essentiel ; le fer ne le remplace pas.</p>
<p>Les seuils doivent être attribués avec précision. Le énoncé 5.2 décrit une anémie inflammatoire avec ferritine>100 µg/L et <button class="w" data-k="d63-tsat">TSAT</button>&lt;16 %, tandis que le commentaire utilise <button class="w" data-k="d63-tsat">TSAT</button>&lt;20 %. Cette différence est conservée. Dans la zone 30–100 µg/L sous inflammation, une composante mixte est probable ; la décision ne dépend pas d’une valeur isolée.</p>
<p><button class="w" data-k="d63-sources-guides">ECCO</button> propose parfois un <button class="w" data-k="d63-esa">ESA</button> après réponse insuffisante au fer IV et optimisation du traitement de la <button class="w" data-k="d63-mici">MICI</button>, avec cible ne dépassant pas120 g/L. Le niveau de preuve est limité et l’utilisation doit respecter le cadre du produit. Cette proposition ne crée pas une indication suisse générale Eprex pour toute <button class="w" data-k="d63-mici">MICI</button>.</p>
<h3>Cancer et chimiothérapie</h3>
<p><button class="w" data-k="d63-sources-guides">ESMO</button> 2018 recommande d’envisager un <button class="w" data-k="d63-esa">ESA</button> chez les patients sous chimiothérapie après correction des causes accessibles. Il distingue l’anémie symptomatique avec <button class="w" data-k="d63-hb">Hb</button>&lt;100 g/L et l’anémie asymptomatique avec <button class="w" data-k="d63-hb">Hb</button>&lt;80 g/L. La FI Eprex suisse mentionne son propre cadre d’indication et ses contre-indications ; sa restriction concernant l’intention curative demeure déterminante.</p>
<p>Une anémie tumorale n’est pas toujours une simple restriction du fer. L’infiltration, le traitement, le saignement ou un déficit nutritionnel peuvent dominer. Le contrôle de la maladie et la stratégie de soutien sont donc discutés ensemble. Le recours à une transfusion peut être préférable si les symptômes imposent une correction rapide.</p>
<h3>Insuffisance cardiaque</h3>
<p>La mise à jour ESC 2023 recommande le fer IV chez les patients avec fraction d’éjection réduite ou modérément réduite et déficit martial pour améliorer symptômes et qualité de vie. Il est aussi à considérer pour réduire les hospitalisations pour insuffisance cardiaque. La section textuelle lue n’établit pas un bénéfice sur la mortalité ; le tableau graphique des classes 2023 n’est pas utilisé comme s’il avait été lu.</p>
<p>Dans IRONMAN, le critère primaire de l’essai entier n’atteignait pas la significativité conventionnelle : rapport de taux 0,82, intervalle de confiance 95 %0,66–1,02 et P=0,070. L’analyse liée à la période COVID est une analyse distincte. Ces nuances évitent de transformer un résultat sélectionné en promesse de survie. Les modalités suisses du produit choisi restent à respecter.</p>
<h3>Maladie rénale et maladie aiguë</h3>
<p>En <button class="w" data-k="d63-mrc">MRC</button>, le fer, la réponse à l’<button class="w" data-k="d63-esa">ESA</button>, les pertes et la perspective de transplantation doivent être évalués ensemble. En maladie aiguë, une baisse rapide de l’hémoglobine peut aussi relever d’une hémorragie, d’une dilution ou d’une destruction accrue. L’inflammation ne suffit pas à expliquer toute variation rapide.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Une personne atteinte de <button class="w" data-k="d63-mici">MICI</button> active ne répond pas au fer oral. Peut-on conclure que toute supplémentation est inutile ?</p><button data-ok="1">Non. L’activité inflammatoire et la voie d’administration doivent être réévaluées ;ECCO privilégie l’IV dans ce contexte.</button><button data-ok="0">Oui, une anémie inflammatoire ne répond jamais au fer.</button><button data-ok="0">Oui, une ferritine mesurable exclut une carence.</button><p class="fb" hidden>Le fer disponible et les réserves sont des questions différentes. Le traitement de la <button class="w" data-k="d63-mici">MICI</button>, les pertes, la tolérance et la stratégie martiale sont réévalués ensemble.</p></div>
<div class="key"><b>À retenir.</b> Le mot « chronique » regroupe plusieurs maladies. Chaque recommandation conserve sa population, son niveau de preuve et les restrictions de la FI suisse correspondante.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a> ; <a data-reference-source="1" href="https://academic.oup.com/eurheartj/article/44/37/3627/7246292" target="_blank" rel="noopener">[S413] 2023 Focused Update of the 2021 ESC Guidelines for heart failure</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a>.</p></div></section>
<section class="ilot" id="d63-12"><h2><span class="n">12</span> Suivre la réponse et prévenir les pertes évitables</h2>
<p>Le suivi vérifie d’abord si la personne va mieux et si le traitement est toléré. L’hémoglobine, les réticulocytes et les marqueurs du fer répondent à des temporalités différentes. Un dosage trop précoce de ferritine après fer IV peut refléter l’administration récente plutôt que des réserves durablement rétablies.</p>
<p>Les rythmes suivants sont des repères attribués à un contexte. Ils ne constituent pas une ordonnance identique pour tous les patients.</p>
<table class="t"><thead><tr><th>Situation</th><th>Contrôle décrit dans la source</th></tr></thead><tbody><tr><td>Dépistage de l’anémie en <button class="w" data-k="d63-mrc">MRC</button></td><td>Au minimum annuel en G3,deuxfois/an en G4,tous 3 mois en G5/G5 avec dialyse ; davantage si besoin.</td></tr><tr><td>Fer en <button class="w" data-k="d63-mrc">MRC</button> non dialysée ou dialyse péritonéale</td><td><button class="w" data-k="d63-hb">Hb</button>,ferritine et <button class="w" data-k="d63-tsat">TSAT</button> environ tous 3 mois ; en HD,tous 1–3 mois.</td></tr><tr><td>Début ou changement de dose <button class="w" data-k="d63-esa">ESA</button> en <button class="w" data-k="d63-mrc">MRC</button></td><td><button class="w" data-k="d63-hb">Hb</button> toutes2–4semaines ; entretien au moins tous 3 mois, fréquence adaptée.</td></tr><tr><td>Ferinject</td><td><button class="w" data-k="d63-hb">Hb</button> au plus tôt4semaines après la dernière administration.</td></tr><tr><td>Contrôle des réserves après fer IV</td><td>Delphi suisse : ferritine 8–12semaines ;mediX :12semaines.</td></tr><tr><td><button class="w" data-k="d63-mici">MICI</button> après correction de la carence</td><td><button class="w" data-k="d63-hb">Hb</button>/ferritine tous 3–6 mois pendant au moins 1 an,puis 6–12 mois.</td></tr></tbody></table>
<p>Un contrôle d’hémoglobine à quatre semaines et une ferritine plus tardive répondent donc à deux questions différentes. En cas de symptôme nouveau, de saignement ou de changement rapide, le médecin n’attend pas la date de routine. Une hausse trop rapide sous <button class="w" data-k="d63-esa">ESA</button> nécessite une adaptation conforme au produit et au contexte.</p>
<p>La prévention vise notamment les pertes et les traitements inutiles. La SSMIG déconseille les bilans répétés sans question clinique précise : les prélèvements peuvent contribuer à l’anémie. Le médecin réévalue les médicaments, l’adhésion, les interactions et les apports ; il donne des consignes de recours en cas de dyspnée de repos, douleur, malaise ou saignement.</p>
<p>Une réponse faible ne doit pas déclencher une simple répétition du traitement. Le bilan recherche une perte persistante, une mauvaise absorption, une inflammation non contrôlée, un déficit associé ou une autre maladie. Le phosphate doit être surveillé selon les facteurs de risque et l’exposition au carboxymaltose ferrique ; des douleurs osseuses ou articulaires nouvelles méritent une évaluation.</p>
<div class="key"><b>À retenir.</b> Le suivi relie bénéfice, sécurité et mécanisme. Il ajuste la stratégie et ne sert pas seulement à constater que le taux d’hémoglobine a changé.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2646/4202/12753" target="_blank" rel="noopener">[S402] Swiss Delphi study on iron deficiency</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a>.</p></div></section>
<section class="ilot" id="d63-13"><h2><span class="n">13</span> Populations particulières et parcours suisse</h2>
<h3>Grossesse, enfant et personne âgée</h3>
<p>La grossesse modifie les seuils diagnostiques et les décisions de traitement. Ferinject est contre-indiqué au premier trimestre ; aux deuxième et troisième trimestres, la FI impose une indication stricte et une évaluation du rapport bénéfice-risque. Le poids prégrossesse intervient dans le calcul du besoin. Une réaction maternelle d’hypersensibilité peut s’accompagner d’une bradycardie fœtale ; la surveillance est adaptée.</p>
<p>Eprex ne doit être utilisé pendant la grossesse qu’en nécessité absolue selon la FI. Celle-ci recommande l’arrêt de l’allaitement pendant le traitement. Les données pédiatriques d’un produit ne se déduisent pas des doses adultes : des essais pédiatriques cités dans la FI Ferinject ne constituent pas une autorisation pédiatrique. Pour ferro sanol, les seuils d’âge et de poids sont explicites et cumulatifs.</p>
<p>Le seuil OMS 2024 des enfants de 6–23 mois est105 g/L, distinct du tableau plus ancien repris dans certains documents. La version et la population doivent accompagner le chiffre. Chez la personne âgée, l’anémie mérite une recherche causale ; la coexistence de maladies ne suffit pas à la rendre physiologique. Les préférences, la fragilité et le retentissement fonctionnel participent à la décision.</p>
<h3>Rein, foie, transplantation et cancer</h3>
<p>Une absence de données démontrant la nécessité d’ajuster la dose ne signifie pas absence de contre-indication. La FI ferro sanol contre-indique les atteintes rénale ou hépatique sévères. Ferinject impose sa propre limite quotidienne en hémodialyse et une appréciation prudente du risque en atteinte hépatique. Les doses ne se convertissent pas librement entre préparations de fer.</p>
<p>Le candidat à une transplantation bénéficie d’une stratégie limitant si possible les transfusions, tout en traitant l’urgence lorsqu’elle existe. Chez un patient ayant à la fois <button class="w" data-k="d63-mrc">MRC</button> et cancer, les recommandations rénales ne suppriment pas les contre-indications du produit ni l’enjeu oncologique. La discussion spécialisée explicite l’objectif, les alternatives et le risque thrombotique.</p>
<h3>Indication et couverture financière sont distinctes</h3>
<p>L’autorisation suisse, la disponibilité d’une spécialité et son inscription avec limitations dans la Liste des spécialités répondent à des questions différentes. Une recommandation européenne ou internationale ne garantit pas une prise en charge individuelle. Les cas particuliers des articles 71a à 71d de l’OAMal ont leurs conditions ; aucun accord d’assurance ni prix individuel n’est présumé ici.</p>
<p>Le retentissement professionnel, l’aptitude aux activités et les besoins de soutien sont documentés individuellement. Le seul code D63 ne prouve pas un droit à une prestation, une origine professionnelle ou une obligation liée à une maladie causale précise. Le parcours suisse vérifie ces questions selon la situation réelle.</p>
<div class="key"><b>À retenir.</b> L’âge, la grossesse et les fonctions d’organe changent la portée d’une recommandation. Le produit exact et ses restrictions doivent rester visibles jusqu’à la prescription.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S412] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S410] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S425] OFSP, liste des spécialités</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S426] OFSP, cas particuliers, art. 71a à 71d de l’OAMal</a>.</p></div></section>
<section class="ilot" id="d63-14"><h2><span class="n">14</span> Conclure : critères, paramètres et codage de la manifestation</h2>
<div class="alert"><b>Une conclusion clinique intégrée.</b><p>Le médecin documente l’anémie, une maladie causale compatible et une production ou une disponibilité du fer inadaptée. Il recherche proportionnellement les pertes, les carences, l’hémolyse et les autres causes. La conclusion peut être « anémie multifactorielle avec composante inflammatoire » ; elle ne doit pas devenir artificiellement certaine parce qu’une maladie chronique est connue.</p></div>
<p>Dans la vignette initiale, ferritine 85 µg/L et <button class="w" data-k="d63-crp">CRP</button> 42 mg/L laissent une carence associée possible. Les examens complètent le mécanisme ; la recherche de pertes est guidée par les données. Si le patient reste stable, l’évaluation et le traitement causal se poursuivent sans transformer un seul résultat en prescription de fer ou d’<button class="w" data-k="d63-esa">ESA</button>.</p>
<div class="key"><b>Quatre familles de nombres.</b><ul><li>Les seuils OMS définissent l’anémie dans une population.</li><li>Les critères du fer rénal identifient une situation où un traitement peut être proposé.</li><li>La cible <button class="w" data-k="d63-esa">ESA</button> rénale adulte demeure inférieure à 115 g/L selon <button class="w" data-k="d63-sources-guides">KDIGO</button> 2026.</li><li>Les repères transfusionnels suisses70/80 g/L concernent des patients stables définis et restent associés à la clinique.</li></ul></div>
<p>Le codage décrit ensuite la manifestation et sa cause. Dans la CIM-10-GM 2024 du projet, <button class="w" data-k="d63-cim">D63.0</button>* correspond à l’anémie au cours de maladies tumorales ; <button class="w" data-k="d63-cim">D63.8</button>* correspond aux autres maladies chroniques classées ailleurs. Ce dernier inclut l’anémie de la <button class="w" data-k="d63-mrc">MRC</button> au moins de stade 3, avec le code étiologique rénal correspondant. Le code de manifestation ne remplace pas la maladie causale.</p>
<p>Le sous-code <button class="w" data-k="d63-cim">D63.1</button> de la modification américaine CIM-10-CM ne doit pas être importé dans cette nomenclature GM 2024. Les libellés français ont été relus dans le fichier officiel OFS. La version 2024 utilisée par la plateforme ne constitue pas une certification de facturation pour toute année ou tout dossier.</p>
<div class="key"><b>À retenir.</b> La conclusion nomme le mécanisme, sa part d’incertitude et la prochaine décision. Le code conserve cette conclusion ; il ne doit jamais tenir lieu de raisonnement.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2011/revue-medicale-suisse-313/anemie-ferriprive-inflammatoire-ou-mixte-comment-orienter-le-diagnostic" target="_blank" rel="noopener">[S403] Anémie ferriprive, inflammatoire ou mixte : comment orienter le diagnostic ?</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S412] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a> ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d60-d64.htm" target="_blank" rel="noopener">[S414] ICD-10-GM 2024, D60–D64</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S415] CIM-10-GM 2024, libellés français officiels</a>.</p></div></section><button class="pareto-btn ui" data-k="pareto-d63-cours">▲ Loi de Pareto — Monographie</button><details id="d63-reference-index"><summary>Ouvrir une explication ou une synthèse</summary><ul><li><button class="w" data-k="d63-ferritine">Ferritine : réserve et réaction inflammatoire</button></li><li><button class="w" data-k="d63-carence-absolue">Carence absolue : le stock est diminué</button></li><li><button class="w" data-k="d63-restriction">Restriction martiale : le fer atteint mal la moelle</button></li><li><button class="w" data-k="d63-reticulocytes">Réticulocytes : apprécier la réponse de production</button></li><li><button class="w" data-k="d63-ferroportine">Ferroportine : la porte de sortie cellulaire du fer</button></li><li><button class="w" data-k="d63-hepcidine">Hepcidine : signal hépatique du métabolisme du fer</button></li><li><button class="w" data-k="d63-tsat">TSAT : saturation de la transferrine</button></li><li><button class="w" data-k="d63-stfr">Récepteur soluble de la transferrine et index</button></li><li><button class="w" data-k="d63-chr">CHr : contenu en hémoglobine des réticulocytes</button></li><li><button class="w" data-k="d63-alloimmunisation">Allo-immunisation : un risque à intégrer, sans retarder l’urgence</button></li><li><button class="w" data-k="d63-d-fer-oral">Fer oral : produit, indication et interactions</button></li><li><button class="w" data-k="d63-d-ferinject">Ferinject : les trois calculs à séparer</button></li><li><button class="w" data-k="d63-d-eprex">Eprex : vérifier indication, cible et contre-indications</button></li><li><button class="w" data-k="d63-hif-phi">HIF-PHI : mécanisme ne vaut pas autorisation</button></li><li><button class="w" data-k="d63-dyspnee">Dyspnée : retentissement possible, diagnostic encore ouvert</button></li><li><button class="w" data-k="d63-paleur">Pâleur : un signe, pas un dosage</button></li><li><button class="w" data-k="d63-hb">Hb : concentration d’hémoglobine</button></li><li><button class="w" data-k="d63-vgm">VGM : une moyenne ne décrit pas toute la population</button></li><li><button class="w" data-k="d63-crp">CRP : contextualiser la ferritine</button></li><li><button class="w" data-k="d63-mrc">MRC : maladie rénale chronique et anémie multifactorielle</button></li><li><button class="w" data-k="d63-mici">MICI : inflammation, pertes et absorption</button></li><li><button class="w" data-k="d63-esa">ESA : agents stimulant l’érythropoïèse</button></li><li><button class="w" data-k="d63-il6-stat3">IL-6–STAT3 : une voie de signalisation inflammatoire</button></li><li><button class="w" data-k="d63-hypophosphate">Hypophosphatémie après carboxymaltose ferrique</button></li><li><button class="w" data-k="d63-transfusion">Transfusion : indication, volume et réévaluation</button></li><li><button class="w" data-k="d63-calcul-fer">Calcul du fer : vérifier les unités et les limites</button></li><li><button class="w" data-k="d63-who">OMS 2024 : définition de l’anémie et populations</button></li><li><button class="w" data-k="d63-cim">D63* : code de manifestation, pas diagnostic automatique</button></li><li><button class="w" data-k="d63-profiles">PROFILES et examen suisse : partir d’une situation clinique</button></li><li><button class="w" data-k="d63-sources-guides">Sources : dates, populations et limites de lecture</button></li><li><button class="w" data-k="pareto-d63-cours">Monographie : les décisions qui organisent le raisonnement</button></li><li><button class="w" data-k="pareto-d63-examens">Examens : une question par mesure</button></li><li><button class="w" data-k="pareto-d63-pharma">Pharmacologie : produit précis et suivi réel</button></li><li><button class="w" data-k="pareto-d63-semio">Sémiologie : relier signe, mécanisme et décision</button></li><li><button class="w" data-k="pareto-d63-anat">Anatomie : plusieurs compartiments, une même Hb</button></li><li><button class="w" data-k="pareto-d63-histo">Histologie : observer sans surinterpréter</button></li><li><button class="w" data-k="pareto-d63-physio">Physiologie : le temps et la réserve comptent</button></li><li><button class="w" data-k="pareto-d63-bio">Biochimie : stock, transport, disponibilité</button></li><li><button class="w" data-k="pareto-d63-gen">Génétique : une régulation n’est pas une mutation</button></li></ul></details><div class="src"><p>Sources attribuées dans les sections et fiches. <button class="w" data-k="d63-sou
