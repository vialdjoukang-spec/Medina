<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="d63-e-1"><h2><span class="n">e-1</span> Confirmer l’anémie et décrire la réponse médullaire</h2>
<p>La numération formule sanguine donne l’<button class="w" data-k="d63-hb">Hb</button>, le volume globulaire moyen, les autres lignées et leur évolution. Le seuil définit une concentration basse pour une population ; il n’explique ni la cause ni la tolérance. Revoir les résultats antérieurs, l’état d’hydratation et la chronologie. Une valeur étonnante peut nécessiter confirmation, sans retarder l’évaluation d’une urgence clinique.</p>
<p>Selon l’OMS 2024, l’anémie concerne notamment une <button class="w" data-k="d63-hb">Hb</button> inférieure à 120 g/L chez la femme non enceinte de 15 à 65 ans et à 130 g/L chez l’homme du même âge. Les seuils de grossesse et pédiatriques diffèrent. Une norme de laboratoire locale peut différer : l’ancienne table adulte HUG utilisée comme repère ne remplace pas les recommandations OMS actuelles. Au-delà de 65 ans, ne pas inventer un seuil officiel couvert par un tableau qui ne concerne pas cette tranche d’âge.</p>
<table class="t"><thead><tr><th>Résultat</th><th>Ce qu’il apporte</th><th>Ce qu’il ne prouve pas</th></tr></thead><tbody><tr><td><button class="w" data-k="d63-vgm">VGM</button> normal</td><td>Compatible avec une anémie inflammatoire ; décrit une taille moyenne.</td><td>N’exclut pas une carence martiale ni des déficits opposés associés.</td></tr><tr><td>Microcytose</td><td>Oriente vers restriction de synthèse d’<button class="w" data-k="d63-hb">Hb</button>, dont carence ou inflammation prolongée ; autres causes possibles.</td><td>N’identifie pas seule le mécanisme ni l’indication de fer.</td></tr><tr><td>Réticulocytes bas ou insuffisants pour le degré d’anémie</td><td>Suggèrent une réponse de production inadéquate ; interpréter en valeur absolue et avec la gravité.</td><td>Ne distinguent pas seuls inflammation, <button class="w" data-k="d63-mrc">MRC</button>, carence ou maladie médullaire.</td></tr><tr><td>Réticulocytes élevés</td><td>Font chercher une réponse à pertes, hémolyse ou traitement, selon la chronologie.</td><td>Ne prouvent pas un saignement actif et n’excluent pas un mécanisme mixte.</td></tr><tr><td>Autres cytopénies ou anomalies du frottis</td><td>Peuvent orienter vers une atteinte médullaire ou une autre maladie systémique.</td><td>Ne doivent pas être absorbées par l’étiquette « anémie de maladie chronique ».</td></tr></tbody></table>
<p>Le frottis répond à une question morphologique. Il peut montrer des éléments qui imposent une exploration supplémentaire ; son interprétation relève de la qualité du prélèvement et de l’expertise du laboratoire. Le frottis humain normal illustré dans les sciences sert de comparaison visuelle, sans fournir une mesure quantitative de fer ou de réticulocytes.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S412] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S421] HUG, enseignement hémogramme adulte, septembre 2019</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">[S420] Human blood smear — Кров людини</a>.</p></div></section>
<section class="ilot" id="d63-e-2"><h2><span class="n">e-2</span> Ferritine, saturation de la transferrine et inflammation</h2>
<p>La ferritine renseigne sur les réserves mais augmente aussi dans la réponse inflammatoire. La saturation de la transferrine décrit la proportion de sites de transport occupés par le fer. Une saturation basse signale une disponibilité réduite ; elle n’indique pas à elle seule si le stock total est épuisé ou si le fer reste séquestré. Le fer sérique isolé varie et ne suffit pas à classer l’anémie.</p>
<table class="t"><thead><tr><th>Contexte documenté</th><th>Lecture proposée par la source</th><th>Prudence</th></tr></thead><tbody><tr><td>Sans inflammation, medix</td><td>Ferritine inférieure à 15 µg/L : réserves épuisées ; 15–30 : diminuées ; 30–50 : en principe suffisantes.</td><td>Le consensus suisse Delphi discute aussi la zone 30–50 avec <button class="w" data-k="d63-tsat">TSAT</button> inférieure à 20 % ; ne pas présenter les deux formulations comme un seuil identique.</td></tr><tr><td><button class="w" data-k="d63-mici">MICI</button> avec inflammation, <button class="w" data-k="d63-sources-guides">ECCO</button></td><td>Ferritine 30–100 µg/L : association carence/inflammation probable ; au-delà de 100, saturation basse compatible avec inflammation.</td><td>L’énoncé 5.2 utilise <button class="w" data-k="d63-tsat">TSAT</button> inférieure à 16 %, alors que le corps du texte décrit moins de 20 %. Conserver la méthode et le contexte.</td></tr><tr><td>Oncologie sous chimiothérapie, <button class="w" data-k="d63-sources-guides">ESMO</button></td><td>Seuil de ferritine 100 µg/L utilisé dans l’algorithme ; restriction fonctionnelle avec <button class="w" data-k="d63-tsat">TSAT</button> inférieure à 20 % et ferritine supérieure à 100.</td><td>Ce seuil de traitement spécialisé n’est pas une nouvelle définition universelle de réserve normale.</td></tr><tr><td><button class="w" data-k="d63-mrc">MRC</button>, <button class="w" data-k="d63-sources-guides">KDIGO</button> 2026</td><td>Les seuils d’initiation du fer dépendent de la dialyse et combinent ferritine et <button class="w" data-k="d63-tsat">TSAT</button>.</td><td>Un seuil d’initiation ne permet pas à lui seul de diagnostiquer une carence absolue chez toute personne.</td></tr></tbody></table>
<p>Doser la <button class="w" data-k="d63-crp">CRP</button> ou disposer d’un autre indicateur clinique de l’activité inflammatoire aide à interpréter la ferritine. Une <button class="w" data-k="d63-crp">CRP</button> normale à un instant donné ne résout pas toutes les causes de ferritine élevée. Hépatopathie, traitement récent, transfusions et contexte tumoral peuvent modifier la lecture. Indiquer les unités : 1 ng/mL de ferritine correspond à 1 µg/L, tandis que la concentration de fer sérique est une autre grandeur.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> <button class="w" data-k="d63-mici">MICI</button> active fictive, <button class="w" data-k="d63-hb">Hb</button> 101 g/L, ferritine 75 µg/L, <button class="w" data-k="d63-tsat">TSAT</button> 13 %. Quelle conclusion est la plus prudente ?</p><button data-ok="1">Un mécanisme mixte avec carence martiale et inflammation est plausible ; compléter le contexte et traiter selon la stratégie de la maladie intestinale.</button><button data-ok="0">Les réserves sont certainement normales car la ferritine dépasse 30.</button><button data-ok="0">Une ferritine de 75 prouve une surcharge en fer.</button><p class="fb" hidden>Dans l’inflammation associée à une <button class="w" data-k="d63-mici">MICI</button>, <button class="w" data-k="d63-sources-guides">ECCO</button> décrit la zone 30–100 µg/L comme compatible avec une association carence/inflammation. La ferritine ne se lit pas avec le seul seuil d’un adulte sans inflammation.</p></div><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2646/4202/12753" target="_blank" rel="noopener">[S402] Swiss Delphi study on iron deficiency</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a>.</p></div></section>
<section class="ilot" id="d63-e-3"><h2><span class="n">e-3</span> Examens de deuxième intention : choisir la question</h2>
<p>Une difficulté diagnostique ne justifie pas un panel indiscriminé. Rechercher d’abord ce que le résultat changera : carence masquée, hémolyse, atteinte rénale, déficit vitaminique, perte digestive ou génitale, ou anomalie médullaire. Le contexte clinique organise ensuite les examens et leur urgence.</p>
<table class="t"><thead><tr><th>Examen</th><th>Question utile</th><th>Limite</th></tr></thead><tbody><tr><td>Créatinine et estimation de la filtration</td><td>Existe-t-il une <button class="w" data-k="d63-mrc">MRC</button> contribuant à une production érythrocytaire insuffisante ?</td><td>Une <button class="w" data-k="d63-mrc">MRC</button> n’exclut pas une perte sanguine ni une carence en fer.</td></tr><tr><td>Vitamine B12 et folates selon contexte</td><td>Un déficit associé explique-t-il une partie du tableau ?</td><td>Un <button class="w" data-k="d63-vgm">VGM</button> normal ne suffit pas à écarter des déficits opposés.</td></tr><tr><td>LDH, bilirubine, haptoglobine et tests orientés</td><td>Existe-t-il une destruction accrue des hématies ?</td><td>Interpréter l’ensemble et l’inflammation ; un seul marqueur n’établit pas l’hémolyse.</td></tr><tr><td>Hémoglobine réticulocytaire <button class="w" data-k="d63-chr">CHr</button> ou mesure apparentée</td><td>Le fer récemment disponible pour l’érythropoïèse paraît-il insuffisant ?</td><td><button class="w" data-k="d63-sources-guides">ECCO</button> cite <button class="w" data-k="d63-chr">CHr</button> inférieur à 29 pg ; <button class="w" data-k="d63-sources-guides">ESMO</button> cite 28 pg. Analyseur, méthode et population doivent accompagner la valeur.</td></tr><tr><td>Récepteur soluble de la transferrine et index</td><td>Peuvent aider devant une carence associée difficile à identifier.</td><td>Les essais et seuils ne sont pas entièrement standardisés ; l’érythropoïèse influence aussi le résultat.</td></tr><tr><td>Exploration médullaire</td><td>Anémie inexpliquée persistante, anomalies associées ou suspicion de maladie médullaire après évaluation spécialisée.</td><td>Elle n’est pas l’examen de routine de toute inflammation avec <button class="w" data-k="d63-hb">Hb</button> basse.</td></tr></tbody></table>
<p>Un test de recherche de pertes ou une exploration digestive se décide selon l’histoire et les recommandations propres à cette question. Le diagnostic d’inflammation ne doit pas servir à éviter l’exploration d’un saignement potentiellement sérieux. Inversement, un résultat isolé ne doit pas entraîner une procédure invasive sans bénéfice attendu.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S421] HUG, enseignement hémogramme adulte, septembre 2019</a>.</p></div></section>
<section class="ilot" id="d63-e-4"><h2><span class="n">e-4</span> Mesurer la tolérance et préparer une éventuelle transfusion</h2>
<p>L’évaluation immédiate porte sur conscience, pression artérielle, fréquence cardiaque et respiratoire, saturation, perfusion, douleur thoracique et signes de saignement. Une saturation normale ne mesure pas la quantité d’<button class="w" data-k="d63-hb">Hb</button> disponible. Une dyspnée doit aussi faire rechercher insuffisance cardiaque, infection, embolie ou maladie respiratoire selon le contexte ; le résultat d’<button class="w" data-k="d63-hb">Hb</button> n’arrête pas le raisonnement.</p>
<p>En cas de transfusion envisagée, appliquer les procédures institutionnelles d’identification, de compatibilité et de traçabilité. Un antécédent de réaction, de transfusions ou d’anticorps doit être signalé. Pour une personne susceptible de transplantation rénale, le risque d’allo-immunisation participe à la stratégie ; une urgence vitale demeure une urgence.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> <button class="w" data-k="d63-hb">Hb</button> fictive 76 g/L chez un adulte sans saignement actif. Quelle information manque pour décider correctement ?</p><button data-ok="1">La tolérance, les comorbidités, la dynamique de l’hémoglobine et le contexte de stabilité.</button><button data-ok="0">Rien : toute hémoglobine inférieure à 80 g/L impose deux unités.</button><button data-ok="0">Rien : une saturation à 98 % exclut tout retentissement de l’anémie.</button><p class="fb" hidden>Les seuils restrictifs concernent des populations stables définies. Ils ne remplacent ni l’évaluation des symptômes ni celle d’un syndrome coronarien aigu ou d’une hémorragie. Une unité suivie d’une réévaluation peut suffire dans un contexte stable approprié.</p></div><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng24/chapter/Red-blood-cell-transfusion" target="_blank" rel="noopener">[S407] Blood transfusion — red blood cell transfusion</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S418] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a>.</p></div></section>
<section class="ilot" id="d63-e-5"><h2><span class="n">e-5</span> Surveillance longitudinale et réduction de la iatrogénie</h2>
<p>Un tableau de suivi doit relier chaque valeur à une date, au traitement reçu, aux symptômes et à l’activité de la maladie causale. Une <button class="w" data-k="d63-hb">Hb</button> isolée après perfusion de liquides ou transfusion ne s’interprète pas comme une mesure stable de la production médullaire. Utiliser le même laboratoire ou identifier les changements de méthode lorsque les décisions reposent sur une faible variation.</p>
<table class="t"><thead><tr><th>Situation</th><th>Repère de suivi attribué</th></tr></thead><tbody><tr><td><button class="w" data-k="d63-mrc">MRC</button> sans anémie connue, <button class="w" data-k="d63-sources-guides">KDIGO</button></td><td>Recherche d’anémie au moins annuelle en G3, deux fois par an en G4, tous les trois mois en G5 ou dialyse ; adapter si la clinique change.</td></tr><tr><td>Fer dans la <button class="w" data-k="d63-mrc">MRC</button>, <button class="w" data-k="d63-sources-guides">KDIGO</button></td><td><button class="w" data-k="d63-hb">Hb</button>, ferritine et <button class="w" data-k="d63-tsat">TSAT</button> environ tous les trois mois hors hémodialyse ou en dialyse péritonéale ; tous les un à trois mois en hémodialyse, davantage lors de changements.</td></tr><tr><td><button class="w" data-k="d63-esa">ESA</button>, <button class="w" data-k="d63-sources-guides">KDIGO</button></td><td>Contrôler l’<button class="w" data-k="d63-hb">Hb</button> après initiation ou modification, généralement à deux à quatre semaines, puis au moins tous les trois mois en entretien stable ; le risque clinique peut imposer davantage.</td></tr><tr><td>Fer oral, medix</td><td>Contrôle d’<button class="w" data-k="d63-hb">Hb</button> après environ quatre semaines ; contrôle des réserves à distance selon le protocole et la poursuite du traitement.</td></tr><tr><td><button class="w" data-k="d63-mici">MICI</button> après correction, <button class="w" data-k="d63-sources-guides">ECCO</button></td><td><button class="w" data-k="d63-hb">Hb</button> et ferritine tous les trois à six mois la première année, puis tous les six à douze mois ; surveiller la récidive et la maladie active.</td></tr></tbody></table>
<p>La recommandation suisse smarter medicine demande d’éviter les prélèvements de routine sans question clinique précise. Les pertes iatrogènes répétées peuvent contribuer à l’anémie ; regrouper les examens utiles et adapter les volumes est cohérent avec le suivi, sans supprimer un contrôle nécessaire. La surveillance comprend aussi l’activité fonctionnelle, les effets indésirables et la compréhension du patient.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a>.</p></div></section><button class="pareto-btn ui" data-k="pareto-d63-examens">▲ Loi de Pareto — Examens</button></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="d63-tab-semio" role="tab" aria-selected="true" aria-controls="d63-s-semio" data-s="d63-s-semio">Sémiologie fondamentale et analytique</button><button id="d63-tab-anat" role="tab" aria-selected="false" aria-controls="d63-s-anat" data-s="d63-s-anat">Anatomie</button><button id="d63-tab-histo" role="tab" aria-selected="false" aria-controls="d63-s-histo" data-s="d63-s-histo">Histologie</button><button id="d63-tab-physio" role="tab" aria-selected="false" aria-controls="d63-s-physio" data-s="d63-s-physio">Physiologie</button><button id="d63-tab-bio" role="tab" aria-selected="false" aria-controls="d63-s-bio" data-s="d63-s-bio">Biochimie et inflammation</button><button id="d63-tab-gen" role="tab" aria-selected="false" aria-controls="d63-s-gen" data-s="d63-s-gen">Génétique et régulation</button></div><div class="chap-body sci-body"><div class="sci" id="d63-s-semio" role="tabpanel" aria-labelledby="d63-tab-semio"><section class="ilot" id="d63-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3>
<h4>1. Partir de la fonction normale</h4>
<p>Les hématies assurent une grande partie du transport d’oxygène grâce à leur hémoglobine. La moelle les renouvelle, le fer recyclé par les macrophages contribue à la synthèse d’hème et la production rénale d’érythropoïétine participe à l’adaptation de l’érythropoïèse. Un stock de fer, un transport plasmatique et une utilisation médullaire sont trois compartiments fonctionnels différents.</p>
<p>La saturation mesurée par oxymétrie décrit la proportion d’hémoglobine oxygénée, sans donner la quantité totale d’hémoglobine. Une saturation à 98 % peut donc coexister avec une capacité de transport abaissée par l’anémie. Le retentissement dépend aussi du débit circulatoire, des besoins et des réserves cardiorespiratoires. La vitesse d’installation explique qu’un même taux d’<button class="w" data-k="d63-hb">Hb</button> puisse être toléré différemment.</p>
<p>Cette chaîne normale donne le fil du raisonnement : fonction perturbée, manifestation ressentie ou observée, examen qui répond à une question, interprétation puis décision. D63 est un code de manifestation dans une maladie classée ailleurs ; il ne dispense pas de démontrer le mécanisme de l’anémie chez la personne.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S417] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S418] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S415] CIM-10-GM 2024, libellés français officiels</a>.</p></div></section><figure id="d63-semio-frottis" data-origin="human-original"><img src="assets/img/d63/alpha/codex/normal-peripheral-blood.jpg" alt="Frottis sanguin humain original, champ large et barre100micromètres" loading="lazy"><figcaption><b>Les hématies observées dans le sang circulant.</b> <b>Repère 1, éléments rosés très nombreux :</b> hématies du champ. <b>Repère 2, centre plus clair de nombreuses hématies :</b> contraste de coloration visible, sans mesure quantitative d’hypochromie. <b>Repère 3, répartition dans le champ :</b> les cellules sont observées sur un frottis, non dans une circulation vivante. <b>Repère 4, angle supérieur gauche :</b> barre 100 µm originale. Ce faible grossissement ne permet ni de compter les réticulocytes, ni de doser le fer, ni d’établir D63. Une coloration et une analyse adaptées répondent à ces autres questions. Original : Степанюк Ярослав et Борис Максим, Wikimedia Commons, <a href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">provenance</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels intacts ; annotations françaises de lecture ajoutées à la légende.</figcaption></figure><section class="ilot" id="d63-semio-signs" data-semiology="signs"><h3>2. Symptômes et signes : décrire avant d’attribuer</h3>
<p>La fatigue se décrit par son début, sa progression, son effet sur les activités, le sommeil et les efforts. Préciser dyspnée d’effort ou de repos, palpitations, vertiges, douleur thoracique, malaise et limitation fonctionnelle. Une plainte apparue en quelques heures n’a pas la même signification qu’une diminution progressive des capacités sur plusieurs mois.</p>
<p>La pâleur est un constat compatible avec l’anémie ; elle ne mesure pas l’<button class="w" data-k="d63-hb">Hb</button> et sa perception dépend des conditions d’examen. Tachycardie et polypnée peuvent traduire une compensation mais aussi fièvre, douleur, infection ou hypovolémie. Rechercher signes de pertes sanguines, manifestations de la maladie inflammatoire, amaigrissement, fièvre et effets des traitements.</p>
<p>Ne pas réduire la personne à une anomalie biologique : une anémie modérée peut contribuer à une gêne importante chez un patient cardiorespiratoire fragile, tandis que des symptômes sévères peuvent venir d’une autre cause concomitante. Les sources étudiées ne fournissent pas ici une sensibilité ou une spécificité validée permettant de convertir une pâleur en taux d’<button class="w" data-k="d63-hb">Hb</button>.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S422] PROFILES 2017, situations de départ</a>.</p></div></section><section class="ilot" id="d63-semio-mechanisms" data-semiology="mechanisms"><h3>3. Mécanismes : relier disponibilité du fer et réponse médullaire</h3>
<p>L’inflammation stimule notamment l’axe interleukine 6–<button class="w" data-k="d63-il6-stat3">STAT3</button> et l’hepcidine hépatique. L’hepcidine réduit la sortie du fer par la ferroportine, dans les entérocytes et les macrophages. Le fer peut rester présent dans des réserves tout en devenant moins disponible pour l’érythropoïèse. Le profil peut associer fer circulant et <button class="w" data-k="d63-tsat">TSAT</button> bas, ferritine conservée ou élevée et production réticulocytaire insuffisante.</p>
<p>D’autres mécanismes s’ajoutent : réponse à l’érythropoïétine diminuée, production hormonale insuffisante en <button class="w" data-k="d63-mrc">MRC</button>, inhibition des précurseurs et survie érythrocytaire raccourcie. Une perte sanguine, une malabsorption ou un déficit vitaminique peuvent coexister. Une explication par l’hepcidine seule ne suffit donc pas à tous les tableaux.</p>
<p>La chronologie teste la cohérence du mécanisme. Une baisse importante d’<button class="w" data-k="d63-hb">Hb</button> en quelques heures ne doit pas être attribuée à la seule réduction de fabrication de nouvelles hématies. Chercher saignement, hémolyse, dilution ou autre événement aigu selon le contexte. Le mécanisme explique une tendance, il ne justifie pas toute variation.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a>.</p></div></section><section class="ilot" id="d63-semio-examination" data-semiology="examination"><h3>4. Examen clinique et choix des mesures</h3>
<p>Évaluer d’abord les paramètres vitaux, la conscience, la perfusion et la présence d’un saignement. Examiner peau et muqueuses, rechercher ictère, signes cardiorespiratoires, maladie inflammatoire active et anomalies suggérant une autre affection. L’examen doit être guidé par l’histoire et répété si l’état évolue.</p>
<p>La numération confirme la concentration d’<button class="w" data-k="d63-hb">Hb</button> et décrit <button class="w" data-k="d63-vgm">VGM</button> et autres lignées. Les réticulocytes évaluent une réponse de production ; ferritine, <button class="w" data-k="d63-tsat">TSAT</button> et contexte inflammatoire explorent disponibilité et réserves. Créatinine et filtration estimée renseignent sur une contribution rénale. Le frottis ou les examens d’hémolyse répondent à des questions supplémentaires, sans être un substitut à l’histoire.</p>
<p>Préciser les unités et la méthode. Pour l’<button class="w" data-k="d63-hb">Hb</button>, 100 g/L correspondent à 10 g/dL. La ferritine en µg/L ne se compare pas numériquement à une concentration de fer sérique. <button class="w" data-k="d63-chr">CHr</button> et mesures apparentées dépendent de l’analyseur : un seuil provenant d’une population n’est pas automatiquement transférable à une autre.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S412] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a>.</p></div></section><section class="ilot" id="d63-semio-interpretation" data-semiology="interpretation"><h3>5. Interprétation : combiner les résultats</h3>
<p>Une ferritine très basse soutient une carence absolue. Une ferritine élevée n’exclut pas une restriction du fer disponible, ni une carence associée dans une maladie inflammatoire. Une <button class="w" data-k="d63-tsat">TSAT</button> basse aide à reconnaître la disponibilité réduite mais ne sépare pas à elle seule stock épuisé et séquestration.</p>
<p>Les recommandations utilisent des seuils liés à leur population et à leur objectif. Dans la <button class="w" data-k="d63-mici">MICI</button> active, <button class="w" data-k="d63-sources-guides">ECCO</button> décrit une zone de ferritine 30–100 µg/L compatible avec une association carence/inflammation. <button class="w" data-k="d63-sources-guides">KDIGO</button> donne des critères de début de fer distincts en hémodialyse et hors hémodialyse. Ces seuils thérapeutiques ne doivent pas être transformés en une définition universelle de l’anémie inflammatoire.</p>
<p>Un <button class="w" data-k="d63-vgm">VGM</button> normal représente une moyenne ; il ne prouve pas que toutes les hématies sont normales ni que le fer et la vitamine B12 sont suffisants. Une anémie rénale peut aussi être carentielle ou hémorragique. La bonne interprétation conserve les hypothèses concurrentes et indique le résultat qui les renforcera ou les affaiblira.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a>.</p></div></section><section class="ilot" id="d63-semio-differentials" data-semiology="differentials"><h3>6. Diagnostics différentiels et mécanismes associés</h3>
<p>Discuter carence martiale isolée, mécanisme mixte, <button class="w" data-k="d63-mrc">MRC</button>, pertes chroniques ou aiguës, hémolyse, déficit vitaminique, toxicité médicamenteuse et maladie médullaire selon les données. Une hémoglobinopathie peut faire partie des causes de microcytose ; elle ne se diagnostique pas à partir d’un seul <button class="w" data-k="d63-vgm">VGM</button>.</p>
<p>Des cytopénies multiples, un frottis inhabituel, une aggravation inexpliquée ou une discordance durable avec l’activité inflammatoire justifient une évaluation élargie. Une maladie cancéreuse n’implique pas que l’anémie provient uniquement des cytokines : saignement, traitement, infiltration ou insuffisance rénale peuvent contribuer.</p>
<p>Une amélioration après fer soutient une composante répondant au fer ; elle ne prouve pas que la cause de la perte a disparu. De même, une hausse d’<button class="w" data-k="d63-hb">Hb</button> sous <button class="w" data-k="d63-esa">ESA</button> ne démontre pas que le diagnostic initial était complet. Réponse thérapeutique et diagnostic étiologique se complètent.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a>.</p></div></section><section class="ilot" id="d63-semio-urgency" data-semiology="urgency"><h3>7. Urgence : la tolérance prime sur l’étiquette chronique</h3>
<p>Douleur thoracique, dyspnée de repos marquée, syncope, altération de conscience, instabilité circulatoire ou saignement actif imposent une évaluation urgente. Une maladie connue depuis longtemps ne protège pas d’un événement aigu. La correction de la maladie inflammatoire ou l’effet d’un <button class="w" data-k="d63-esa">ESA</button> ne répondent pas à un besoin immédiat de transport d’oxygène.</p>
<p>La recommandation suisse smarter medicine donne des repères restrictifs de 70 g/L chez l’adulte stable sans maladie cardiovasculaire et de 80 g/L avec maladie cardiovasculaire préexistante stable. Ces repères ne sont pas un algorithme pour hémorragie majeure ou syndrome coronarien aigu. NICE distingue ces situations et recommande une unité suivie d’une réévaluation chez les adultes sans saignement actif quand une transfusion est indiquée.</p>
<p>Le risque de surcharge circulatoire, les antécédents transfusionnels et un projet de greffe rénale participent à la décision. Ils ne doivent pas conduire à retarder une transfusion nécessaire dans une situation menaçante. La décision se documente avec le contexte, le bénéfice attendu et la réponse observée.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng24/chapter/Red-blood-cell-transfusion" target="_blank" rel="noopener">[S407] Blood transfusion — red blood cell transfusion</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a>.</p></div></section><section class="ilot" id="d63-semio-limits" data-semiology="limits"><h3>8. Limites, pièges et niveau de preuve</h3>
<p>La pâleur n’est pas un dosage, la saturation n’est pas une mesure de masse d’<button class="w" data-k="d63-hb">Hb</button>, la ferritine n’est pas exclusivement un indicateur de stock et une valeur normale de <button class="w" data-k="d63-vgm">VGM</button> n’est pas une preuve d’absence de carence. Chaque raccourci peut conduire à omettre une maladie associée ou à traiter un chiffre sans bénéfice démontré.</p>
<p>Les données de prévalence de carence associée à l’inflammation sont hétérogènes ; elles ne donnent pas une probabilité individuelle suisse. Une association entre <button class="w" data-k="d63-hb">Hb</button> basse et mortalité en <button class="w" data-k="d63-mrc">MRC</button> ne prouve pas que normaliser l’<button class="w" data-k="d63-hb">Hb</button> par <button class="w" data-k="d63-esa">ESA</button> améliore la survie. Les essais ayant testé des objectifs élevés justifient au contraire la prudence des cibles recommandées.</p>
<p>Les désaccords de seuils ou de formulations sont conservés : <button class="w" data-k="d63-chr">CHr</button> 29 pg dans <button class="w" data-k="d63-sources-guides">ECCO</button> contre 28 dans <button class="w" data-k="d63-sources-guides">ESMO</button> ; <button class="w" data-k="d63-tsat">TSAT</button> 16 % dans un énoncé <button class="w" data-k="d63-sources-guides">ECCO</button> contre 20 % dans son texte ; objectif Eprex 10–12 g/dL contre cible <button class="w" data-k="d63-sources-guides">KDIGO</button> inférieure à 11,5. Une valeur sans date, population et objectif perd une partie de sa signification.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a>.</p></div></section><section class="ilot" id="d63-semio-sources" data-semiology="sources"><h3>9. Sources lues et portée des liens cliniques</h3>
<p>Les recommandations suisses medix et smarter medicine structurent la pratique générale et transfusionnelle ; <button class="w" data-k="d63-sources-guides">KDIGO</button> 2026 précise le contexte rénal. <button class="w" data-k="d63-sources-guides">ECCO</button> 2024 et <button class="w" data-k="d63-sources-guides">ESMO</button> 2018 concernent respectivement la <button class="w" data-k="d63-mici">MICI</button> et l’oncologie. La revue européenne de Weiss et collaborateurs de 2019 explicite les mécanismes ; elle ne remplace pas les indications et contre-indications des produits suisses.</p>
<p>Les passages consultés portent sur les mécanismes, les profils biologiques, les décisions thérapeutiques et leurs limites. Les informations professionnelles précisent les produits Ferinject, Eprex et ferro sanol. Les figures originales montrent une anatomie ou un frottis normaux ; elles ne constituent pas une preuve diagnostique d’anémie inflammatoire. Cette auto-relecture pédagogique reste distincte d’une validation médicale humaine indépendante.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S410] Information professionnelle suisse ferro sanol</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> La tolérance et la chronologie rendent les signes interprétables.</p><p><b>Science → examen.</b> <button class="w" data-k="d63-hb">Hb</button>, réticulocytes et bilan martial répondent à des questions distinctes.</p><p><b>Science → traitement.</b> Stabiliser si nécessaire, puis traiter le mécanisme documenté.</p><p><b>À retenir.</b> Relier la fonction normale au mécanisme, puis à une mesure et à une décision dont les limites restent explicites.</p></div><button class="pareto-btn ui" data-k="pareto-d63-semio">▲ Loi de Pareto — Sémiologie fondamentale et analytique</button></div><div class="sci" id="d63-s-anat" role="tabpanel" aria-labelledby="d63-tab-anat" hidden><section class="ilot" id="d63-s-anat-cours"><h3>Moelle, foie, intestin, rein : une organisation fonctionnelle</h3>
<p>La production des hématies se déroule dans le tissu hématopoïétique médullaire. Les cellules en maturation dépendent d’un environnement qui apporte nutriments et signaux. La photographie originale ci-dessous situe ce tissu dans l’os spongieux ; une coupe macroscopique ne permet pas de voir les stades de maturation ni de quantifier le stock de fer.</p>
<figure id="d63-science-moelle" data-origin="human-original"><img src="assets/img/d63/alpha/codex/normal-marrow-openstax2016.jpg" alt="Coupe osseuse originale montrant tissu spongieux et moelle rouge" loading="lazy"><figcaption><b>Le compartiment où se fabrique le sang.</b> <b>Repère 1, centre rouge :</b> tissu médullaire entre les travées. <b>Repère 2, travées claires :</b> architecture spongieuse qui délimite les espaces. <b>Repère 3, bord périphérique :</b> limite osseuse de la pièce. <b>Repère 4, barre blanche supérieure :</b> barre conservée, sans mesure calculée car sa valeur manque dans ce fichier. Cette coupe macroscopique ne montre pas une lignée cellulaire, ne mesure pas le fer et ne diagnostique pas une anémie inflammatoire. Original : OpenStax, édition 8.25 du 18mai 2016, <a href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">provenance</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels intacts ; annotations françaises de lecture ajoutées à la légende.</figcaption></figure>
<h4>Le circuit du fer relie plusieurs organes</h4>
<p>L’intestin constitue une porte d’entrée du fer alimentaire. Le fer transféré au plasma est transporté par la transferrine. Une part majeure du fer requis chaque jour pour l’érythropoïèse provient cependant du recyclage des hématies âgées par les macrophages, notamment dans les organes du système réticulo-endothélial. Le foie participe au stockage et produit l’hepcidine, signal qui réduit la sortie de fer vers le plasma.</p>
<p>Le rein contribue à l’adaptation hormonale par l’érythropoïétine. Une <button class="w" data-k="d63-mrc">MRC</button> peut donc associer défaut relatif de stimulation et inflammation, sans que le fer soit nécessairement absent de tous les compartiments. Les sites anatomiques expliquent pourquoi une même <button class="w" data-k="d63-hb">Hb</button> basse peut avoir plusieurs mécanismes ; ils ne donnent pas à eux seuls un diagnostic.</p>
<h4>Relier le site à l’examen</h4>
<p>La numération examine le sang circulant ; les réticulocytes renseignent sur la production récente. Une aspiration ou une biopsie médullaire explore un autre compartiment et se discute lorsqu’une question médullaire persiste. La ferritine plasmatique n’est pas une photographie directe des réserves de tous les organes. Des examens invasifs ne se justifient pas simplement parce que l’anémie est associée à une maladie chronique.</p>
<p>Le lien thérapeutique suit ces fonctions : traiter une maladie intestinale peut améliorer absorption et pertes ; réduire l’inflammation peut améliorer la sortie du fer ; un <button class="w" data-k="d63-esa">ESA</button> agit sur la production ; une transfusion apporte des hématies déjà formées. Ces actions ont des délais et des risques différents. Elles ne doivent pas être présentées comme quatre moyens interchangeables d’augmenter instantanément l’<button class="w" data-k="d63-hb">Hb</button>.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S417] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S418] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Moelle, intestin, rein et foie peuvent contribuer au même tableau.</p><p><b>Science → examen.</b> Le sang circulant ne révèle pas directement tous les compartiments.</p><p><b>Science → traitement.</b> La voie et le délai d’action du traitement dépendent de sa cible.</p><p><b>À retenir.</b> Relier la fonction normale au mécanisme, puis à une mesure et à une décision dont les limites restent explicites.</p></div><button class="pareto-btn ui" data-k="pareto-d63-anat">▲ Loi de Pareto — Anatomie</button></div><div class="sci" id="d63-s-histo" role="tabpanel" aria-labelledby="d63-tab-histo" hidden><section class="ilot" id="d63-s-histo-cours"><h3>Hématies et réticulocytes : ce que l’on observe réellement</h3>
<p>L’hématie mature humaine ne possède pas de noyau. Sa forme et sa richesse en hémoglobine contribuent à son rôle de transport. La maturation érythroïde se déroule avant son passage dans le sang ; les réticulocytes sont des cellules récemment libérées, identifiées par des méthodes adaptées aux constituants résiduels. Un frottis standard à faible grossissement ne permet pas de les compter de façon fiable.</p>
<figure id="d63-science-frottis" data-origin="human-original"><img src="assets/img/d63/alpha/codex/normal-peripheral-blood.jpg" alt="Frottis sanguin humain original, champ large et barre100micromètres" loading="lazy"><figcaption><b>Les hématies observées dans le sang circulant.</b> <b>Repère 1, éléments rosés très nombreux :</b> hématies du champ. <b>Repère 2, centre plus clair de nombreuses hématies :</b> contraste de coloration visible, sans mesure quantitative d’hypochromie. <b>Repère 3, répartition dans le champ :</b> les cellules sont observées sur un frottis, non dans une circulation vivante. <b>Repère 4, angle supérieur gauche :</b> barre 100 µm originale. Ce faible grossissement ne permet ni de compter les réticulocytes, ni de doser le fer, ni d’établir D63. Une coloration et une analyse adaptées répondent à ces autres questions. Original : Степанюк Ярослав et Борис Максим, Wikimedia Commons, <a href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">provenance</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels intacts ; annotations françaises de lecture ajoutées à la légende.</figcaption></figure>
<h4>De la morphologie à la mesure</h4>
<p>La taille moyenne donnée par le <button class="w" data-k="d63-vgm">VGM</button> résume une distribution. Deux populations de tailles différentes peuvent produire une moyenne normale. Le centre plus clair d’une hématie sur une image ne fournit pas une concentration d’<button class="w" data-k="d63-hb">Hb</button> mesurée ; préparation, coloration, étalement et grossissement influencent l’apparence. La morphologie complète les indices, elle ne les remplace pas.</p>
<p>L’anémie inflammatoire est souvent normocytaire, mais une microcytose peut apparaître et une carence associée peut modifier le profil. Il n’existe pas sur cette image normale un « signe de D63 » qui établirait la maladie. La recherche d’anomalies orientant vers hémolyse ou maladie médullaire nécessite un examen adapté et une interprétation de laboratoire.</p>
<h4>Réticulocytes et disponibilité récente du fer</h4>
<p>Le nombre de réticulocytes renseigne sur une réponse de production. Leur contenu en <button class="w" data-k="d63-hb">Hb</button> reflète une disponibilité récente du fer pour les cellules nouvellement produites. Ces deux informations ne sont pas identiques : une population peut être peu nombreuse et peu chargée en <button class="w" data-k="d63-hb">Hb</button>, ou répondre après correction d’un déficit. Le degré d’anémie et la chronologie doivent accompagner les résultats.</p>
<p>Les seuils de <button class="w" data-k="d63-chr">CHr</button> cités par <button class="w" data-k="d63-sources-guides">ECCO</button> et <button class="w" data-k="d63-sources-guides">ESMO</button> ne sont pas strictement identiques. On ne doit pas remplacer le nom d’un paramètre par celui d’un autre analyseur sans vérifier la comparabilité. Une mesure de contenu en <button class="w" data-k="d63-hb">Hb</button> peut soutenir une restriction martiale, mais elle ne localise pas les réserves ni ne prouve le mécanisme inflammatoire à elle seule.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S417] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S418] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">[S420] Human blood smear — Кров людини</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Une moyenne normale peut masquer des populations différentes.</p><p><b>Science → examen.</b> Frottis, réticulocytes et <button class="w" data-k="d63-chr">CHr</button> ne mesurent pas la même chose.</p><p><b>Science → traitement.</b> Une réponse morphologique ou biologique se confronte à la clinique.</p><p><b>À retenir.</b> Relier la fonction normale au mécanisme, puis à une mesure et à une décision dont les limites restent explicites.</p></div><button class="pareto-btn ui" data-k="pareto-d63-histo">▲ Loi de Pareto — Histologie</button></div><div class="sci" id="d63-s-physio" role="tabpanel" aria-labelledby="d63-tab-physio" hidden><section class="ilot" id="d63-s-physio-cours"><h3>Renouvellement, oxygène et adaptation</h3>
<p>La masse érythrocytaire résulte d’un équilibre entre production, durée de vie et pertes. La réponse hormonale à une baisse d’apport d’oxygène stimule l’érythropoïèse, à condition que les précurseurs disposent du fer et des autres substrats nécessaires. Une production stimulée ne fournit pas immédiatement des hématies matures ; le temps biologique de réponse est une donnée clinique.</p>
<p>En anémie, des compensations circulatoires peuvent maintenir une partie de l’apport tissulaire. Leur efficacité dépend de la réserve cardiovasculaire et du rythme d’installation. Une personne souffrant d’insuffisance cardiaque ou de maladie coronarienne peut être moins tolérante. Une dyspnée garde néanmoins plusieurs causes possibles ; ni l’anémie ni la saturation ne suffisent à décrire tout le transport d’oxygène.</p>
<figure id="d63-physio-causal"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="680" viewBox="0 0 580 680" role="img" aria-label="Pourquoi une saturation normale ne rassure pas à elle seule"><title>Pourquoi une saturation normale ne rassure pas à elle seule</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="66" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Moins d’hémoglobine dans le sang</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="182" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Proportion oxygénée parfois</tspan><tspan x="290" dy="29">normale</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="312" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Quantité transportée</tspan><tspan x="290" dy="29">potentiellement réduite</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Compensation dépendante des</tspan><tspan x="290" dy="29">réserves</tspan></text><text x="290" y="533" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="535" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="586" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Tolérance clinique à évaluer</tspan></text></svg><figcaption><b>Pourquoi une saturation normale ne rassure pas à elle seule.</b> La saturation renseigne sur une proportion ; l’<button class="w" data-k="d63-hb">Hb</button> et l’état circulatoire apportent des informations complémentaires. Schéma causal pédagogique, sans représentation anatomique synthétique.</figcaption></figure>
<h4>La réponse devient insuffisante</h4>
<p>L’inflammation peut réduire la réponse médullaire à l’érythropoïétine et modifier la survie des hématies. La <button class="w" data-k="d63-mrc">MRC</button> ajoute un défaut relatif de production hormonale. Une réticulocytose insuffisante pour le degré d’anémie devient alors cohérente, mais reste non spécifique : une carence ou une maladie médullaire peut produire un résultat comparable.</p>
<p>Le traitement vise une amélioration utile, pas la normalisation d’un chiffre à tout prix. Dans la <button class="w" data-k="d63-mrc">MRC</button>, <button class="w" data-k="d63-sources-guides">KDIGO</button> recommande une cible d’<button class="w" data-k="d63-hb">Hb</button> inférieure à 11,5 g/dL sous <button class="w" data-k="d63-esa">ESA</button> chez l’adulte. Une <button class="w" data-k="d63-hb">Hb</button> basse associée à un pronostic défavorable dans une cohorte ne prouve pas qu’un objectif pharmacologique élevé corrige ce pronostic. Les risques thrombotiques et cardiovasculaires font partie du raisonnement physiologique appliqué.</p>
<p>Une transfusion augmente rapidement la quantité d’hématies circulantes, mais ne corrige pas la cause de l’anémie et ajoute ses propres risques. Le fer corrige une disponibilité insuffisante lorsque l’indication est établie ; l’<button class="w" data-k="d63-esa">ESA</button> stimule la production dans des situations définies. Le choix dépend du délai acceptable, de la tolérance et du mécanisme.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S418] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Une saturation normale ne garantit pas un transport suffisant.</p><p><b>Science → examen.</b> Mesurer l’<button class="w" data-k="d63-hb">Hb</button> et examiner les réserves cardiorespiratoires.</p><p><b>Science → traitement.</b> Une cible d’<button class="w" data-k="d63-esa">ESA</button> élevée n’est pas un objectif physiologique anodin.</p><p><b>À retenir.</b> Relier la fonction normale au mécanisme, puis à une mesure et à une décision dont les limites restent explicites.</p></div><button class="pareto-btn ui" data-k="pareto-d63-physio">▲ Loi de Pareto — Physiologie</button></div><div class="sci" id="d63-s-bio" role="tabpanel" aria-labelledby="d63-tab-bio" hidden><section class="ilot" id="d63-s-bio-cours"><h3>Fer de réserve, fer transporté et fer utilisable</h3>
<p>La ferritine stocke le fer dans les cellules ; sa concentration circulante sert d’indicateur indirect des réserves, tout en participant au profil de phase aiguë. La transferrine transporte le fer dans le plasma. La saturation de la transferrine est une proportion de sites occupés ; ce n’est ni la quantité totale de fer de l’organisme ni un comptage des hématies.</p>
<p>La ferroportine permet la sortie du fer de certains compartiments cellulaires. L’hepcidine se lie à cette voie d’export et en réduit l’activité, notamment par internalisation/dégradation et inhibition de transport. En inflammation, la sortie du fer des macrophages et des entérocytes diminue. Le fer peut donc être conservé dans les tissus tandis que le plasma et les précurseurs érythroïdes en disposent moins.</p>
<figure id="d63-bio-causal"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="680" viewBox="0 0 580 680" role="img" aria-label="De l’inflammation à la restriction martiale"><title>De l’inflammation à la restriction martiale</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="52" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Signal inflammatoire, notamment</tspan><tspan x="290" dy="29">IL-6</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="196" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Voie STAT3 et hepcidine augmentées</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="326" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Export par ferroportine diminué</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Fer moins disponible pour</tspan><tspan x="290" dy="29">l’érythropoïèse</tspan></text><text x="290" y="533" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="535" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="572" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Profil biologique à interpréter en</tspan><tspan x="290" dy="29">contexte</tspan></text></svg><figcaption><b>De l’inflammation à la restriction martiale.</b> Cette chaîne n’exclut ni une carence absolue associée ni les autres mécanismes d’anémie. Schéma causal pédagogique, sans représentation anatomique synthétique.</figcaption></figure>
<h4>Le recyclage explique le paradoxe apparent</h4>
<p>La revue de Weiss décrit une contribution supérieure à 90 % du recyclage au fer quotidien nécessaire à l’érythropoïèse. Bloquer la disponibilité de ce flux peut donc avoir un effet important même lorsque l’absorption alimentaire n’est pas nulle. Ce pourcentage concerne un flux physiologique, pas la probabilité de carence d’un patient ni une indication de supplémentation.</p>
<p>Une ferritine élevée et une <button class="w" data-k="d63-tsat">TSAT</button> basse ne sont pas contradictoires : elles peuvent décrire des compartiments différents sous l’effet de l’inflammation. L’interprétation doit aussi tenir compte des transfusions, du fer administré récemment et des maladies hépatiques. La ferritine mesurée trop tôt après fer IV peut surestimer la reconstitution durable des réserves.</p>
<h4>Biologie et calculs thérapeutiques</h4>
<p>La formule de Ganzoni utilise une différence d’<button class="w" data-k="d63-hb">Hb</button> en g/dL, multipliée par 2,4, puis ajoute les réserves en mg. Entrer des g/L sans conversion crée un facteur dix d’erreur dans la composante de déficit. De même, 50 mg/mL est une concentration de Ferinject, non la dose par kg. Le calcul total, la limite pondérale et la limite hebdomadaire doivent être contrôlés séparément.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2646/4202/12753" target="_blank" rel="noopener">[S402] Swiss Delphi study on iron deficiency</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Un fer séquestré peut manquer à la moelle malgré des réserves.</p><p><b>Science → examen.</b> Confronter ferritine, <button class="w" data-k="d63-tsat">TSAT</button>, inflammation et traitement récent.</p><p><b>Science → traitement.</b> Calculer dose totale, dose par séance et limites du produit séparément.</p><p><b>À retenir.</b> Relier la fonction normale au mécanisme, puis à une mesure et à une décision dont les limites restent explicites.</p></div><button class="pareto-btn ui" data-k="pareto-d63-bio">▲ Loi de Pareto — Biochimie et inflammation</button></div><div class="sci" id="d63-s-gen" role="tabpanel" aria-labelledby="d63-tab-gen" hidden><section class="ilot" id="d63-s-gen-cours"><h3>Régulation des gènes et maladie acquise : ne pas les confondre</h3>
<p>L’hepcidine est un peptide dont la production dépend d’une régulation de l’expression génique. La voie inflammatoire <button class="w" data-k="d63-il6-stat3">IL-6</button>–<button class="w" data-k="d63-il6-stat3">STAT3</button> augmente cette production ; d’autres signaux reflètent le fer disponible et les besoins de l’érythropoïèse. Une modification d’expression provoquée par l’inflammation ne signifie pas qu’une mutation constitutionnelle a été acquise.</p>
<p>La revue de Weiss discute la régulation de l’hepcidine, le rôle de facteurs comme TMPRSS6 et les variations qui peuvent influencer le métabolisme du fer. Cela éclaire la diversité des réponses biologiques. Cela ne fonde pas un dépistage génétique systématique de toute anémie associée à une maladie chronique.</p>
<h4>Trois questions distinctes</h4>
<p>Une anémie acquise dans une maladie inflammatoire répond à une question de mécanisme actuel. Une histoire familiale, une anomalie ancienne ou un profil inhabituel peuvent conduire à rechercher une cause constitutionnelle. Une anomalie clonale médullaire relève encore d’une autre démarche. Les confondre peut conduire à demander un test inadapté ou à attribuer à tort une anomalie à l’inflammation.</p>
<p>Une microcytose persistante n’est pas un synonyme de carence martiale. L’histoire, les réserves, l’inflammation et, lorsque cela est indiqué, l’exploration d’une hémoglobinopathie aident à organiser le différentiel. Le résultat d’un test doit être expliqué selon sa portée : ce qui a été recherché, ce qui n’a pas été couvert et les conséquences pour la personne et sa famille.</p>
<h4>Du mécanisme moléculaire au médicament</h4>
<p>Les voies de réponse à l’hypoxie participent à la régulation de l’érythropoïétine. Des médicaments ciblant les prolyl-hydroxylases de HIF peuvent agir sur cette réponse, mais une plausibilité biologique n’est pas une autorisation suisse pour toute anémie. <button class="w" data-k="d63-sources-guides">KDIGO</button> 2026 préfère un <button class="w" data-k="d63-esa">ESA</button> aux <button class="w" data-k="d63-hif-phi">HIF-PHI</button> en première intention lorsqu’une stimulation est décidée et décrit des précautions ; le statut exact du produit et de l’indication doit être vérifié séparément.</p>
<p>Les traitements dirigés contre la maladie inflammatoire peuvent modifier plusieurs signaux et améliorer l’anémie. On ne peut pas attribuer toute amélioration à un seul gène ou conclure qu’un marqueur moléculaire remplace le suivi d’<button class="w" data-k="d63-hb">Hb</button>, des réserves et de la tolérance. Le niveau moléculaire explique une partie du mécanisme ; la décision clinique intègre aussi la personne et les preuves thérapeutiques.</p>
<figure id="d63-gen-causal"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="680" viewBox="0 0 580 680" role="img" aria-label="Expression régulée, diagnostic à construire"><title>Expression régulée, diagnostic à construire</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="52" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Inflammation : modification des</tspan><tspan x="290" dy="29">signaux</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="196" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Expression de l’hepcidine modulée</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="326" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Disponibilité du fer modifiée</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Ce mécanisme ne prouve pas une</tspan><tspan x="290" dy="29">mutation</tspan></text><text x="290" y="533" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="535" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="572" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Clinique et bilan guident la</tspan><tspan x="290" dy="29">décision</tspan></text></svg><figcaption><b>Expression régulée, diagnostic à construire.</b> La régulation acquise décrite ne justifie pas un panel génétique systématique. Schéma causal pédagogique, sans représentation anatomique synthétique.</figcaption></figure>< <div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="d63-p-1"><h2><span class="n">p-1</span> Avant de choisir un produit : quel défaut veut-on corriger ?</h2>
<p>Une anémie ne constitue pas à elle seule une indication de fer. Le traitement vise une carence documentée, une restriction de disponibilité dans une population définie ou une production érythrocytaire insuffisante relevant d’un traitement spécialisé. La maladie inflammatoire, le saignement et les déficits associés doivent être traités en parallèle. Donner du fer sans confirmer le mécanisme peut retarder une autre exploration et exposer à une surcharge.</p>
<p>Les fiches ci-dessous concernent des <b>produits précis commercialisés en Suisse</b> et les versions documentaires retrouvées : ferro sanol, avril 2021 ; Ferinject, juin 2025 ; Eprex, août 2021. Une recommandation de société savante n’étend pas automatiquement l’autorisation suisse d’un produit. Vérifier l’information en vigueur, les contre-indications, les autres médicaments et les conditions de remboursement au moment de la prescription. Une posologie de fer élément n’est pas la masse du sel de fer.</p>
<table class="t"><thead><tr><th>Situation</th><th>Raisonnement</th><th>Limite</th></tr></thead><tbody><tr><td>Carence en fer, absorption possible, maladie peu active</td><td>Fer oral envisageable ; choisir le produit, sa dose et les modalités compatibles avec la tolérance.</td><td>La fiche ferro sanol contre-indique l’insuffisance rénale ou hépatique sévère ; ne pas appliquer ce choix à toute <button class="w" data-k="d63-mrc">MRC</button>.</td></tr><tr><td>Carence documentée, fer oral inefficace, insuffisant ou impossible</td><td>Ferinject peut répondre à son indication adulte, avec calcul du besoin et limites par administration.</td><td>La quantité totale calculée n’autorise pas une perfusion unique dépassant les limites.</td></tr><tr><td><button class="w" data-k="d63-mrc">MRC</button> avec anémie symptomatique relevant d’un <button class="w" data-k="d63-esa">ESA</button></td><td>Corriger les causes accessibles ; décision spécialisée, dose minimale et surveillance.</td><td>Eprex n’est pas un traitement de secours immédiat d’une anémie aiguë sévère.</td></tr><tr><td>Cancer sous chimiothérapie</td><td>Confronter <button class="w" data-k="d63-sources-guides">ESMO</button> et indication/contre-indications Eprex suisses.</td><td>La fiche suisse contre-indique l’utilisation lorsque l’objectif du traitement anticancéreux est la guérison.</td></tr><tr><td>Anémie mal tolérée ou saignement actif</td><td>Évaluer et stabiliser ; la transfusion peut avoir une indication immédiate.</td><td>Ni fer ni <button class="w" data-k="d63-esa">ESA</button> ne restaurent instantanément le transport d’oxygène.</td></tr></tbody></table><div class="key"><b>À retenir.</b> On choisit d’abord une indication et un objectif clinique ; on calcule ensuite la dose d’un produit identifié.</div><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S410] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a>.</p></div></section>
<section class="ilot" id="d63-p-2"><h2><span class="n">p-2</span> Fer oral : ferro sanol, capsule à 100 mg de fer élément</h2>
<p>La capsule gastro-résistante contient un complexe de sulfate de glycine ferreux correspondant à <b>100 mg de fer bivalent</b>. Le fer absorbé contribue à la synthèse d’hémoglobine lorsque le fer manque. Une inflammation avec hepcidine élevée diminue la disponibilité du fer ; une réponse insuffisante impose donc de réexaminer absorption, observance, pertes et mécanisme, plutôt que d’augmenter indéfiniment une dose.</p>
<table class="t"><thead><tr><th>Paramètre</th><th>Information professionnelle suisse, avril 2021</th></tr></thead><tbody><tr><td>Posologie habituelle</td><td>À partir de 6 ans et d’un poids d’au moins 20 kg : 1 capsule une fois par jour, soit 100 mg de fer élément.</td></tr><tr><td>Carence sévère, phase initiale</td><td>À partir de 15 ans et d’un poids d’au moins 50 kg : 1 capsule deux fois par jour, soit 200 mg/jour. Ne pas dépasser 5 mg/kg/jour.</td></tr><tr><td>Prise</td><td>À jeun, à distance des repas, avec de l’eau ; ne pas mâcher. Si la capsule est ouverte, avaler les granules sans les mâcher.</td></tr><tr><td>Durée</td><td>Souvent 10 à 20 semaines, parfois davantage selon le déficit ; poursuivre après normalisation de l’<button class="w" data-k="d63-hb">Hb</button> jusqu’à correction contrôlée des réserves.</td></tr><tr><td>Contre-indications principales</td><td>Absence de carence, surcharge martiale, troubles de l’utilisation du fer, transfusions répétées, sténose œsophagienne, insuffisance rénale ou hépatique sévère, âge inférieur à 6 ans ou poids inférieur à 20 kg ; hypersensibilité.</td></tr><tr><td>Tolérance</td><td>Troubles digestifs, nausées, constipation ou diarrhée et coloration foncée des selles. La couleur ne dispense jamais d’évaluer une suspicion clinique de méléna.</td></tr><tr><td>Précautions</td><td>Prudence en maladie digestive inflammatoire. Tenir hors de portée des enfants : une ingestion excessive peut être dangereuse.</td></tr><tr><td>Grossesse et allaitement</td><td>Usage sur prescription médicale selon le besoin documenté ; les données limitées ne justifient pas une affirmation de sécurité universelle.</td></tr></tbody></table>
<h3>Interactions : organiser les prises avec le pharmacien</h3>
<p>Thé, café, lait et aliments riches en phytates diminuent l’absorption. Les antiacides et la cholestyramine interfèrent avec la disponibilité ; les inhibiteurs de la pompe à protons peuvent réduire l’absorption. La fiche demande d’éviter l’association avec la doxycycline et les quinolones ; les autres tétracyclines doivent être séparées d’au moins <b>3 heures</b>. L’intervalle indiqué avec la thyroxine est d’au moins <b>2 heures</b> dans cette fiche : ne pas remplacer silencieusement cette valeur par un intervalle provenant d’un autre produit. Méthyldopa, pénicillamine et lévodopa font aussi partie des interactions à examiner.</p>
<h3>Pourquoi une recommandation peut-elle proposer un autre rythme ?</h3>
<p><button class="w" data-k="d63-sources-guides">ECCO</button> discute des prises matinales alternées de 60 à 120 mg de sels ferreux, notamment pour limiter l’effet de l’hepcidine et améliorer la tolérance. Cela ne transforme pas la capsule suisse de 100 mg en une formulation fractionnable de n’importe quelle dose. Présenter séparément recommandation, produit disponible et prescription individualisée. Une préférence théorique pour le fer oral ne lève pas la contre-indication de cette spécialité en insuffisance rénale sévère.</p>
