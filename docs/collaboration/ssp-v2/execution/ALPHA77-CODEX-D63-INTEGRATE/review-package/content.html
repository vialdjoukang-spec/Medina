<p>Selon medix, une augmentation d’<button class="w" data-k="d63-hb">Hb</button> d’environ 2 g/dL en quatre semaines soutient une réponse, sans être une obligation universelle ni une preuve de cause unique. Une réponse absente conduit à chercher pertes persistantes, prise réelle, malabsorption, inflammation et autre anémie. L’évaluation de la ferritine intervient à distance de l’apport selon la voie et le contexte ; un dosage trop précoce après traitement parentéral peut tromper.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S410] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a>.</p></div></section>
<section class="ilot" id="d63-p-3"><h2><span class="n">p-3</span> Ferinject : distinguer besoin total, dose par séance et surveillance</h2>
<p>Ferinject contient du fer sous forme de carboxymaltose ferrique, <b>50 mg/mL</b>. L’indication suisse concerne le traitement d’une carence en fer chez l’adulte lorsque les préparations orales ne sont pas suffisamment efficaces, sont inefficaces ou ne peuvent pas être utilisées. La carence doit être établie par des examens appropriés. Cette indication ne signifie pas que toute ferritine élevée avec anémie autorise du fer intraveineux.</p>
<h3>Deux méthodes de calcul annoncées, sans fusion de leurs résultats</h3>
<p>La formule de Ganzoni de la fiche utilise : <b>poids (kg) × [<button class="w" data-k="d63-hb">Hb</button> cible − <button class="w" data-k="d63-hb">Hb</button> mesurée] (g/dL) × 2,4 + réserves (mg)</b>. La cible de 15 g/dL employée pour le calcul standard est un paramètre de cette formule, <b>pas une cible de traitement par <button class="w" data-k="d63-esa">ESA</button></b>. La fiche mentionne 500 mg ou plus de réserves chez les personnes de plus de 35 kg ; les adaptations de poids idéal en obésité et de poids avant grossesse doivent être respectées. Avec une <button class="w" data-k="d63-hb">Hb</button> saisie en g/L, le facteur 2,4 serait erroné : convertir d’abord en g/dL.</p>
<table class="t"><thead><tr><th><button class="w" data-k="d63-hb">Hb</button></th><th>Moins de 35 kg</th><th>35 à moins de 70 kg</th><th>70 kg et plus</th></tr></thead><tbody><tr><td>Moins de 10 g/dL</td><td>500 mg</td><td>1 500 mg</td><td>2 000 mg</td></tr><tr><td>10 à moins de 14 g/dL</td><td>500 mg</td><td>1 000 mg</td><td>1 500 mg</td></tr><tr><td>14 g/dL et plus</td><td>500 mg</td><td>500 mg</td><td>500 mg</td></tr></tbody></table>
<p>Ce tableau est le <b>schéma simplifié de besoins</b>, pas la dose unique autorisée. Exemple fictif : à 70 kg et <button class="w" data-k="d63-hb">Hb</button> 9 g/dL, Ganzoni avec réserves de 500 mg donne 70 × (15 − 9) × 2,4 + 500 = <b>1 508 mg</b>, arrondis à <b>1 600 mg</b> selon la règle de la fiche pour un poids supérieur à 66 kg. Le tableau simplifié donne <b>2 000 mg</b>. Ces méthodes ne donnent pas toujours la même quantité ; préciser la méthode utilisée et faire valider le plan, sans additionner les résultats. La fiche arrondit vers le bas par 100 mg jusqu’à 66 kg et vers le haut au-delà.</p>
<table class="t"><thead><tr><th>Administration</th><th>Limites et modalités de la fiche suisse</th></tr></thead><tbody><tr><td>Injection intraveineuse</td><td>Au maximum 15 mg/kg et 1 000 mg par administration. Pour plus de 200 à 500 mg : 100 mg/min ; pour plus de 500 à 1 000 mg : au moins 15 minutes.</td></tr><tr><td>Perfusion intraveineuse</td><td>Au maximum 20 mg/kg et 1 000 mg par administration. La limite la plus basse s’applique.</td></tr><tr><td>Préparation de la perfusion</td><td>NaCl 0,9 % uniquement ; concentration finale d’au moins 2 mg/mL sans compter le volume du produit. 100–200 mg : au plus 50 mL ; plus de 200–500 mg : au plus 100 mL, au moins 6 minutes ; plus de 500–1 000 mg : au plus 250 mL, au moins 15 minutes.</td></tr><tr><td>Cumul et intervalle</td><td>Au maximum 1 000 mg par semaine ; si plusieurs administrations sont requises, les séparer d’au moins une semaine.</td></tr><tr><td>Hémodialyse</td><td>Ne pas dépasser 200 mg de fer par jour selon cette fiche : ne pas transposer le maximum général de 1 000 mg.</td></tr><tr><td>Pédiatrie</td><td>Pas d’expérience en dessous d’un an ; traitement non approuvé de 1 à 18 ans dans cette fiche. Ne pas extrapoler les doses adultes.</td></tr><tr><td>Réévaluation</td><td>Contrôle d’<button class="w" data-k="d63-hb">Hb</button> au plus tôt quatre semaines après la dernière administration ; l’interprétation de la ferritine exige aussi un délai adapté.</td></tr></tbody></table>
<h3>Prévenir les complications concrètes</h3>
<p>Une équipe formée et un dispositif de réanimation doivent être disponibles. Surveiller au moins <b>30 minutes après chaque administration</b> ; interrompre immédiatement en cas de réaction d’hypersensibilité et traiter selon le protocole d’urgence. Une administration antérieure sans réaction n’annule pas ce risque. Une extravasation peut provoquer une coloration brune durable : arrêter l’administration et évaluer le site.</p>
<p>L’hypophosphatémie peut être symptomatique et, lors d’expositions répétées, s’associer à une ostéomalacie et à des fractures. Déficit en vitamine D, malabsorption du calcium ou phosphate, hyperparathyroïdie secondaire, <button class="w" data-k="d63-mici">MICI</button>, ostéoporose et administrations multiples font rechercher un risque accru. Contrôler le phosphate lorsque le contexte l’indique ; une hypophosphatémie persistante impose de réévaluer le carboxymaltose, au lieu d’attribuer fatigue et douleurs à l’anémie persistante.</p>
<p>Contre-indications : hypersensibilité, antécédent d’hypersensibilité sévère à un autre fer parentéral, anémie sans carence martiale, surcharge et premier trimestre de grossesse. En atteinte hépatique, évaluer soigneusement le risque et éviter les situations d’excès de fer ; la fiche cite notamment certaines hépatopathies. Interrompre en cas de bactériémie ; <button class="w" data-k="d63-sources-guides">KDIGO</button> recommande aussi de suspendre temporairement le fer lors d’une infection systémique. Au deuxième ou troisième trimestre, indication stricte et surveillance adaptée : une bradycardie fœtale peut suivre une réaction maternelle. Ne pas associer simultanément un fer oral, dont l’absorption peut être diminuée.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Une patiente adulte fictive de 45 kg a un besoin total validé de 1 000 mg. Quel maximum lié au poids s’applique à une seule perfusion de Ferinject ?</p><button data-ok="1">900 mg au maximum pour cette perfusion, avec planification du reste si indiqué.</button><button data-ok="0">1 000 mg car le flacon disponible contient cette quantité.</button><button data-ok="0">2 000 mg car le déficit total peut dépasser 1 000 mg.</button><p class="fb" hidden>20 mg/kg × 45 kg = 900 mg ; le plafond par poids est inférieur au plafond absolu de 1 000 mg. La quantité totale nécessaire et la quantité par séance sont deux décisions différentes.</p></div><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2646/4202/12753" target="_blank" rel="noopener">[S402] Swiss Delphi study on iron deficiency</a>.</p></div></section>
<section class="ilot" id="d63-p-4"><h2><span class="n">p-4</span> Eprex : époétine alfa, indications restreintes et objectifs prudents</h2>
<p>L’époétine alfa stimule la production érythrocytaire ; une disponibilité suffisante en fer et une moelle capable de répondre sont nécessaires. Le délai d’action explique pourquoi ce médicament ne remplace pas une correction urgente du transport d’oxygène. Les présentations en UI/mL diffèrent : vérifier concentration, dose en UI et volume de la seringue. Ne pas convertir une dose d’époétine alfa en dose d’un autre <button class="w" data-k="d63-esa">ESA</button> par simple analogie.</p>
<table class="t"><thead><tr><th>Contexte</th><th>Fiche suisse Eprex, août 2021</th><th>Confrontation à la recommandation</th></tr></thead><tbody><tr><td><button class="w" data-k="d63-mrc">MRC</button> avancée</td><td>Anémie symptomatique chronique nécessitant des transfusions, chez les patients prédialysés ou dialysés. Début usuel : 50 UI/kg trois fois par semaine. Voie IV si accès habituel en hémodialyse ; SC si l’accès IV n’est pas facilement praticable.</td><td><button class="w" data-k="d63-sources-guides">KDIGO</button> 2026 : corriger les causes accessibles, préférer un <button class="w" data-k="d63-esa">ESA</button> à un <button class="w" data-k="d63-hif-phi">HIF-PHI</button> en première intention si un traitement stimulant est retenu. En dialyse, envisager le début avec <button class="w" data-k="d63-hb">Hb</button> ≤ 9–10 g/dL ; hors dialyse, décision individualisée.</td></tr><tr><td>Cible rénale</td><td>La fiche décrit 10–12 g/dL et une dose minimale efficace sans dépasser 12 g/dL.</td><td><button class="w" data-k="d63-sources-guides">KDIGO</button> recommande chez l’adulte sous <button class="w" data-k="d63-esa">ESA</button> une cible inférieure à 11,5 g/dL. Ne pas chercher une <button class="w" data-k="d63-hb">Hb</button> normale de sujet sain.</td></tr><tr><td>Adaptation rénale</td><td>Si nécessaire, augmentation par 25 UI/kg au plus tôt toutes les quatre semaines. Sous 50 UI/kg trois fois par semaine, une hausse supérieure à 2 g/dL/mois conduit dans la fiche à supprimer une injection hebdomadaire.</td><td><button class="w" data-k="d63-sources-guides">KDIGO</button> : surveiller après début/changement, éviter les ajustements trop rapprochés ; réduire en cas de hausse rapide. Rechercher une cause d’hyporéponse avant une escalade.</td></tr><tr><td>Entretien en hémodialyse</td><td>En général 100–300 UI/kg par semaine, réparties en deux ou trois doses, adaptées à la réponse.</td><td>La moyenne ne constitue pas une dose automatique ; contexte cardiovasculaire et tolérance priment.</td></tr><tr><td>Cancer</td><td>Adulte avec anémie symptomatique, <button class="w" data-k="d63-hb">Hb</button> inférieure à 10,5 g/dL et chimiothérapie prévue pendant au moins deux mois. SC : 150 UI/kg trois fois par semaine ou 450 UI/kg une fois par semaine ; poursuivre un mois après la chimiothérapie selon la fiche.</td><td><button class="w" data-k="d63-sources-guides">ESMO</button> 2018 décrit notamment l’anémie symptomatique sous chimiothérapie avec <button class="w" data-k="d63-hb">Hb</button> inférieure à 10 g/dL après correction des causes. La restriction suisse concernant l’intention curative reste déterminante.</td></tr></tbody></table>
<p>Exemple fictif de vérification arithmétique, sans prescription autonome : 50 UI/kg pour 70 kg correspondent à <b>3 500 UI par injection</b>, trois fois par semaine dans le schéma initial rénal. Le volume dépend de la présentation exacte. Ne pas arrondir une seringue ou changer l’intervalle sans décision prescriptive. Les maxima de la fiche hors dialyse concernent des schémas distincts ; ils ne doivent jamais être cumulés.</p>
<h3>Contre-indications et situations où interrompre</h3>
<p>Lire la liste complète avant toute administration. Elle inclut hypersensibilité, hypertension non contrôlée, érythroblastopénie après érythropoïétine, anémie aiguë sévère nécessitant une correction immédiate, hémopathies myéloïdes et certaines situations opératoires. La fiche comporte aussi un item autonome d’antécédents thromboemboliques : il ne doit pas être artificiellement limité au seul contexte périopératoire. En oncologie, l’utilisation lorsque le traitement vise la guérison est contre-indiquée dans cette fiche. Une recommandation générale de décision partagée ne lève pas ces contre-indications du produit suisse.</p>
<p>Surveiller pression artérielle, <button class="w" data-k="d63-hb">Hb</button>, bilan martial et, au début, plaquettes selon la fiche. Une hypertension devenant incontrôlable impose d’interrompre. Une chute brutale de réponse avec anémie, réticulocytopénie marquée et besoins transfusionnels croissants doit faire rechercher une érythroblastopénie à anticorps ; ne pas simplement augmenter la dose. Les événements thrombotiques, l’AVC et les complications d’accès vasculaire nécessitent une réévaluation urgente ; <button class="w" data-k="d63-sources-guides">KDIGO</button> prévoit la suspension dans certaines hospitalisations aiguës et une décision individualisée de reprise.</p>
<h3>Limites documentaires à transmettre explicitement</h3>
<p>Dans le paragraphe oncologique de réponse à quatre semaines, la fiche emploie des conditions reliées par « ou » pour les critères d’augmentation d’<button class="w" data-k="d63-hb">Hb</button> et de réticulocytes, tant dans la poursuite que dans l’arrêt. Des résultats discordants peuvent donc tomber dans les deux formulations. Ce cours ne transforme pas cette ambiguïté en algorithme certain : faire clarifier le cas par le prescripteur et le protocole institutionnel. La fiche ne documente pas un schéma pédiatrique transférable ici.</p>
<p>Ne pas secouer, mélanger ou diluer la préparation ; la voie IV décrite est une injection lente, non une perfusion ajoutée à un autre médicament. Vérifier les modalités de la présentation. Inflammation, infection, carence en fer et autres causes de résistance doivent être corrigées autant que possible. Une surveillance des concentrations de ciclosporine peut être nécessaire avec la modification de la masse érythrocytaire. La grossesse exige une nécessité absolue selon la fiche ; l’allaitement doit être interrompu pendant le traitement selon cette information professionnelle.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a>.</p></div></section>
<section class="ilot" id="d63-p-5"><h2><span class="n">p-5</span> Suivi, effets indésirables et décisions partagées</h2>
<p>Le patient doit connaître le but : améliorer le retentissement et réduire certains besoins transfusionnels lorsque le bénéfice attendu le justifie, sans viser mécaniquement une <button class="w" data-k="d63-hb">Hb</button> « normale ». Expliquer le délai de réponse, les contrôles, les interactions et les signes qui nécessitent une consultation urgente. Documenter qui reçoit les résultats et qui décide de l’adaptation ; une prescription sans suivi organisé est incomplète.</p>
<table class="t"><thead><tr><th>Après quel traitement ?</th><th>Que rechercher ?</th><th>Réponse à une anomalie</th></tr></thead><tbody><tr><td>Fer oral</td><td>Prise réelle, tolérance digestive, <button class="w" data-k="d63-hb">Hb</button>, persistance des pertes.</td><td>Réévaluer le mécanisme et les interactions ; ne pas confondre augmentation de dose et résolution de la cause.</td></tr><tr><td>Carboxymaltose ferrique</td><td>Réaction immédiate, site d’injection, phosphate chez les sujets à risque, réponse d’<button class="w" data-k="d63-hb">Hb</button> à distance.</td><td>Arrêter en cas de réaction ; réévaluer une hypophosphatémie persistante et le besoin de nouvelles administrations.</td></tr><tr><td>Époétine alfa</td><td><button class="w" data-k="d63-hb">Hb</button> et vitesse d’augmentation, pression artérielle, fer disponible, thrombose ou hyporéponse.</td><td>Adapter ou suspendre selon la situation ; rechercher une cause de résistance avant une escalade ; alerte devant suspicion d’érythroblastopénie.</td></tr><tr><td>Transfusion</td><td>Tolérance, réponse clinique, <button class="w" data-k="d63-hb">Hb</button> selon contexte, surcharge circulatoire ou réaction.</td><td>Réévaluer après une unité chez l’adulte stable sans saignement actif ; appliquer immédiatement le protocole en cas de réaction.</td></tr></tbody></table>
<p>Une inscription dans la Liste des spécialités, l’autorisation d’une substance et la prise en charge d’une indication particulière sont des questions différentes. Les conditions et limitations applicables doivent être vérifiées pour la situation réelle. Un recours à un mécanisme exceptionnel de remboursement n’est ni une garantie de couverture ni une validation automatique de la pertinence médicale.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S410] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng24/chapter/Red-blood-cell-transfusion" target="_blank" rel="noopener">[S407] Blood transfusion — red blood cell transfusion</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S425] OFSP, liste des spécialités</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S426] OFSP, cas particuliers, art. 71a à 71d de l’OAMal</a>.</p></div></section><button class="pareto-btn ui" data-k="pareto-d63-pharma">▲ Loi de Pareto — Pharmacologie</button></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="d63-ferritine" data-title="Ferritine : réserve et réaction inflammatoire"><p>La ferritine est une protéine de stockage du fer. Sa concentration plasmatique constitue un indicateur indirect des réserves, mais elle augmente aussi lors de l’inflammation. Une valeur très basse soutient une carence absolue ; une valeur normale ou élevée ne suffit pas à exclure un fer insuffisamment disponible pour la moelle.</p><p>Interpréter avec <button class="w" data-k="d63-tsat">TSAT</button>, maladie sous-jacente, activité inflammatoire et traitements récents. La zone de 30–100 µg/L dans une <button class="w" data-k="d63-mici">MICI</button> active ne se lit pas comme chez un adulte sans inflammation. Après fer intraveineux, le délai du dosage influence sa signification. Les seuils thérapeutiques de <button class="w" data-k="d63-sources-guides">KDIGO</button> ne définissent pas une norme universelle de réserve.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a>.</p></div></template>
<template data-pop="d63-carence-absolue" data-title="Carence absolue : le stock est diminué"><p>Une carence absolue signifie que les réserves de fer sont diminuées ou épuisées. Elle peut résulter de pertes, d’apports insuffisants, de besoins augmentés ou d’une absorption insuffisante. La cause doit être recherchée même si un traitement martial fait remonter l’<button class="w" data-k="d63-hb">Hb</button>.</p><p>Elle peut coexister avec une inflammation. La ferritine peut alors être moins basse que prévu, tandis que la <button class="w" data-k="d63-tsat">TSAT</button> reste réduite. Une réponse au fer prouve au mieux une composante répondant à cet apport ; elle ne garantit pas que la source de perte a disparu. Des symptômes digestifs ou un saignement ne doivent pas être absorbés par le diagnostic de maladie chronique.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2646/4202/12753" target="_blank" rel="noopener">[S402] Swiss Delphi study on iron deficiency</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></template>
<template data-pop="d63-restriction" data-title="Restriction martiale : le fer atteint mal la moelle"><p>La restriction martiale décrit une disponibilité insuffisante du fer pour la production érythrocytaire. Elle peut exister malgré un stock conservé, notamment quand l’hepcidine réduit l’export du fer par la ferroportine. Le terme « fonctionnelle » est employé dans plusieurs recommandations, avec des critères liés à la population étudiée.</p><p>Ce mécanisme ne constitue pas à lui seul une indication de fer IV. Confronter anémie, <button class="w" data-k="d63-tsat">TSAT</button>, ferritine, activité inflammatoire, <button class="w" data-k="d63-mrc">MRC</button> ou chimiothérapie et recommandations pertinentes. Une carence absolue associée reste possible. La correction de la maladie causale peut améliorer la disponibilité du fer, tandis qu’une infection systémique peut conduire à suspendre temporairement le fer selon <button class="w" data-k="d63-sources-guides">KDIGO</button>.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></template>
<template data-pop="d63-reticulocytes" data-title="Réticulocytes : apprécier la réponse de production"><p>Les réticulocytes sont des hématies récemment produites, qui conservent des constituants détectables par des méthodes adaptées. Leur nombre doit être interprété par rapport au degré d’anémie et à la chronologie. Un pourcentage apparemment normal peut représenter une réponse insuffisante quand le nombre total d’hématies est réduit.</p><p>Une production faible peut accompagner inflammation, <button class="w" data-k="d63-mrc">MRC</button>, carence ou maladie médullaire. Une hausse peut apparaître après traitement ou en réponse à une perte ou une hémolyse. Le nombre de réticulocytes n’est pas leur contenu en <button class="w" data-k="d63-hb">Hb</button> : <button class="w" data-k="d63-chr">CHr</button> apporte une information complémentaire sur le fer récemment disponible. Le frottis normal illustré n’est pas une méthode de comptage réticulocytaire.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S418] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></template>
<template data-pop="d63-ferroportine" data-title="Ferroportine : la porte de sortie cellulaire du fer"><p>La ferroportine participe à l’export du fer depuis les entérocytes et les macrophages vers le plasma. L’hepcidine réduit cet export. Cette régulation relie absorption digestive, recyclage des hématies et besoins de la moelle.</p><p>Quand l’inflammation augmente l’hepcidine, le fer peut rester davantage dans les compartiments cellulaires. Ferritine conservée ou élevée et <button class="w" data-k="d63-tsat">TSAT</button> basse deviennent alors compatibles. Ce schéma n’explique pas tout : pertes sanguines, déficit d’<button class="w" data-k="d63-esa">EPO</button>, inhibition des précurseurs et réduction de survie des hématies peuvent s’ajouter. Une explication mécanistique n’est pas une preuve d’indication pour un médicament donné.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S417] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a>.</p></div></template>
<template data-pop="d63-hepcidine" data-title="Hepcidine : signal hépatique du métabolisme du fer"><p>L’hepcidine est un peptide produit principalement par le foie, régulé notamment par le fer, l’érythropoïèse et l’inflammation. La voie <button class="w" data-k="d63-il6-stat3">IL-6</button>–<button class="w" data-k="d63-il6-stat3">STAT3</button> participe à son augmentation inflammatoire. Elle réduit la disponibilité du fer en inhibant son export par la ferroportine.</p><p>Ce mécanisme explique pourquoi un apport oral peut être moins efficace dans une inflammation active. Il ne permet pas de conclure que le fer oral sera toujours inutile, ni que le fer IV est toujours indiqué. Les dosages d’hepcidine ne constituent pas dans ce cours un examen de routine universel ; les algorithmes retenus reposent surtout sur clinique, numération, ferritine, <button class="w" data-k="d63-tsat">TSAT</button> et contexte.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></template>
<template data-pop="d63-tsat" data-title="TSAT : saturation de la transferrine"><p>La transferrine transporte le fer dans le plasma. Sa saturation correspond à la proportion de sites occupés. Une saturation basse suggère que le fer disponible pour les tissus est réduit, mais ne distingue pas seule stock épuisé et fer séquestré.</p><p>Le seuil doit conserver son contexte. <button class="w" data-k="d63-sources-guides">ECCO</button> utilise moins de 16 % dans un énoncé et moins de 20 % dans le texte ; <button class="w" data-k="d63-sources-guides">ESMO</button> utilise notamment moins de 20 % pour la restriction fonctionnelle en oncologie. <button class="w" data-k="d63-sources-guides">KDIGO</button> combine des seuils différents avec la ferritine selon la dialyse. Une <button class="w" data-k="d63-tsat">TSAT</button> de 20 % n’est donc pas une frontière universelle entre « sain » et « malade ».</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a>.</p></div></template>
<template data-pop="d63-stfr" data-title="Récepteur soluble de la transferrine et index"><p>Le récepteur soluble de la transferrine peut contribuer à la recherche d’une carence associée lorsque l’inflammation rend la ferritine difficile à interpréter. Des index combinent ce résultat et la ferritine pour aider à distinguer certains profils.</p><p>Les méthodes et seuils ne sont pas totalement standardisés ; l’activité érythropoïétique influence aussi la mesure. Ne pas appliquer un seuil publié sans vérifier méthode, unité et population. Le résultat complète une démarche, il ne remplace pas l’examen clinique ni l’exploration de pertes. La revue de Weiss discute son intérêt et ses limites ; elle n’en fait pas un test indispensable à chaque anémie chronique.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></template>
<template data-pop="d63-chr" data-title="CHr : contenu en hémoglobine des réticulocytes"><p>Le <button class="w" data-k="d63-chr">CHr</button> renseigne sur le fer récemment incorporé dans les réticulocytes. Une valeur basse peut soutenir une restriction du fer disponible pour la production récente, même lorsque la ferritine est difficile à lire en contexte inflammatoire.</p><p><button class="w" data-k="d63-sources-guides">ECCO</button> cite un seuil inférieur à 29 pg ; <button class="w" data-k="d63-sources-guides">ESMO</button> cite 28 pg. Ces valeurs ne doivent pas être fusionnées en un nombre prétendument universel. Vérifier analyseur, paramètre exact et références locales. Le <button class="w" data-k="d63-chr">CHr</button> ne compte pas les réticulocytes et ne localise pas les réserves. Un résultat bas n’établit pas à lui seul le mécanisme inflammatoire ou l’indication d’une perfusion.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a>.</p></div></template>
<template data-pop="d63-alloimmunisation" data-title="Allo-immunisation : un risque à intégrer, sans retarder l’urgence"><p>Une exposition transfusionnelle peut conduire à une réponse immunitaire contre des antigènes d’autrui. En <button class="w" data-k="d63-mrc">MRC</button>, la sensibilisation est particulièrement pertinente lorsqu’une transplantation est envisagée. Les antécédents transfusionnels et immunologiques doivent être transmis à l’équipe et au laboratoire.</p><p><button class="w" data-k="d63-sources-guides">KDIGO</button> recommande d’éviter les transfusions lorsque cela est possible et pertinent, notamment dans cette perspective, mais la décision dépend du bénéfice et du risque immédiats. Une anémie menaçante ou un saignement urgent ne doivent pas rester sans correction au nom d’un risque futur. Documenter l’indication, utiliser le volume nécessaire et réévaluer la réponse clinique.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng24/chapter/Red-blood-cell-transfusion" target="_blank" rel="noopener">[S407] Blood transfusion — red blood cell transfusion</a>.</p></div></template>
<template data-pop="d63-d-fer-oral" data-title="Fer oral : produit, indication et interactions"><p>La fiche suisse ferro sanol décrit une capsule contenant 100 mg de fer élément. Le schéma habituel concerne les patients d’au moins 6 ans et 20 kg ; le schéma initial de 200 mg/jour concerne une carence sévère à partir de 15 ans et 50 kg. Le maximum de 5 mg/kg/jour ne supprime pas ces conditions.</p><p>La spécialité est contre-indiquée en insuffisance rénale ou hépatique sévère. Prendre à distance des repas, ne pas mâcher les granules et vérifier les interactions, notamment antibiotiques, thyroxine, antiacides et aliments. Les rythmes alternés discutés par <button class="w" data-k="d63-sources-guides">ECCO</button> et la posologie de cette spécialité sont présentés séparément. Une absence de réponse impose une réévaluation de la cause et de la prise réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S410] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a>.</p></div></template>
<template data-pop="d63-d-ferinject" data-title="Ferinject : les trois calculs à séparer"><p>Vérifier d’abord l’indication adulte et la carence documentée. Calculer ensuite le besoin total par une méthode annoncée. Enfin, appliquer les limites de chaque administration et de la semaine : perfusion au maximum 20 mg/kg et 1 000 mg ; injection au maximum 15 mg/kg et 1 000 mg ; cumul hebdomadaire au maximum 1 000 mg. En hémodialyse, la fiche limite à 200 mg par jour.</p><p>La formule de Ganzoni utilise l’<button class="w" data-k="d63-hb">Hb</button> en g/dL. Le tableau simplifié peut donner un besoin différent ; ne pas additionner les deux. Prévoir équipe formée, matériel d’urgence et observation d’au moins 30 minutes. Hypophosphatémie et extravasation ont une importance propre, même si l’<button class="w" data-k="d63-hb">Hb</button> s’améliore.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a>.</p></div></template>
<template data-pop="d63-d-eprex" data-title="Eprex : vérifier indication, cible et contre-indications"><p>L’époétine alfa stimule l’érythropoïèse dans des indications précises. La fiche suisse décrit notamment une anémie symptomatique de <button class="w" data-k="d63-mrc">MRC</button> avancée nécessitant des transfusions, et une indication oncologique chez l’adulte sous chimiothérapie. Elle n’autorise pas le traitement de toute anémie inflammatoire.</p><p>La cible rénale 10–12 g/dL de la fiche doit être distinguée de la recommandation <button class="w" data-k="d63-sources-guides">KDIGO</button> de rester sous 11,5 g/dL chez l’adulte sous <button class="w" data-k="d63-esa">ESA</button>. Hypertension non contrôlée, érythroblastopénie après <button class="w" data-k="d63-esa">EPO</button>, certaines situations thrombotiques et intention curative en oncologie figurent parmi les restrictions à examiner. Une hausse insuffisante ne justifie pas une escalade aveugle. L’effet n’est pas immédiat : une urgence transfusionnelle se traite comme telle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a>.</p></div></template>
<template data-pop="d63-hif-phi" data-title="HIF-PHI : mécanisme ne vaut pas autorisation"><p>Les inhibiteurs des prolyl-hydroxylases de HIF agissent sur la réponse à l’hypoxie et peuvent modifier la production d’érythropoïétine et le métabolisme du fer. <button class="w" data-k="d63-sources-guides">KDIGO</button> 2026 les discute dans l’anémie de <button class="w" data-k="d63-mrc">MRC</button>, avec des précautions liées notamment aux risques cardiovasculaires, thrombotiques et tumoraux.</p><p>La recommandation préfère un <button class="w" data-k="d63-esa">ESA</button> aux <button class="w" data-k="d63-hif-phi">HIF-PHI</button> en première intention lorsqu’une stimulation est retenue et ne recommande pas leur association. Ce cours ne déduit aucune autorisation suisse globale de leur présence dans une recommandation internationale. Vérifier le produit, l’indication, la fiche suisse et les conditions de prise en charge avant toute décision.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S425] OFSP, liste des spécialités</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S426] OFSP, cas particuliers, art. 71a à 71d de l’OAMal</a>.</p></div></template>
<template data-pop="d63-dyspnee" data-title="Dyspnée : retentissement possible, diagnostic encore ouvert"><p>Préciser effort déclenchant, début, progression, gêne au repos, douleur thoracique, orthopnée, fièvre, toux et malaise. L’anémie peut réduire le transport d’oxygène, mais une insuffisance cardiaque, une infection, une embolie ou une autre affection respiratoire peuvent coexister.</p><p>Une saturation normale ne mesure pas la concentration d’<button class="w" data-k="d63-hb">Hb</button>. Examiner fréquence respiratoire, circulation et signes de gravité ; une dyspnée de repos importante ou une instabilité impose une évaluation urgente. <button class="w" data-k="d63-profiles">PROFILES</button> inclut la dyspnée parmi les situations de départ : le raisonnement part du symptôme et de la sécurité, pas du code D63.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S418] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S422] PROFILES 2017, situations de départ</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a>.</p></div></template>
<template data-pop="d63-paleur" data-title="Pâleur : un signe, pas un dosage"><p>La pâleur cutanéomuqueuse peut orienter vers une anémie. L’éclairage, le site observé, la pigmentation et la perfusion modifient son appréciation. Les sources utilisées ici ne donnent pas une performance diagnostique permettant de prédire un taux d’<button class="w" data-k="d63-hb">Hb</button> à partir de ce seul signe.</p><p>Rechercher les symptômes associés et confirmer par une numération appropriée. L’absence de pâleur évidente n’exclut pas une anémie ; sa présence ne permet ni de classer le mécanisme ni de décider seule d’une transfusion. La sémiologie relie l’observation à une question biologique puis à une décision contextualisée.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S422] PROFILES 2017, situations de départ</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S412] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a>.</p></div></template>
<template data-pop="d63-hb" data-title="Hb : concentration d’hémoglobine"><p>L’<button class="w" data-k="d63-hb">Hb</button> indique une concentration d’hémoglobine dans le sang. 1 g/dL correspond à 10 g/L : 9 g/dL correspondent à 90 g/L. Les seuils de définition d’anémie varient selon âge, sexe et grossesse ; les seuils de transfusion répondent à une autre question.</p><p>Une concentration varie aussi avec le volume plasmatique. La dynamique, les perfusions, les transfusions et l’état d’hydratation doivent accompagner l’interprétation. La cible de 15 g/dL dans une formule de déficit en fer n’est pas une cible sous <button class="w" data-k="d63-esa">ESA</button>. Confondre ces usages produit des décisions erronées malgré une arithmétique exacte.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S412] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng24/chapter/Red-blood-cell-transfusion" target="_blank" rel="noopener">[S407] Blood transfusion — red blood cell transfusion</a>.</p></div></template>
<template data-pop="d63-vgm" data-title="VGM : une moyenne ne décrit pas toute la population"><p>Le volume globulaire moyen résume la taille moyenne des hématies. Une anémie inflammatoire peut être normocytaire ou microcytaire. Une carence en fer et un déficit favorisant une macrocytose peuvent se combiner et laisser une moyenne dans l’intervalle usuel.</p><p>Confronter <button class="w" data-k="d63-vgm">VGM</button>, distribution, frottis, réticulocytes et bilan orienté. Un <button class="w" data-k="d63-vgm">VGM</button> normal ne dispense pas d’évaluer le fer ; une microcytose ne prouve pas une carence absolue. La morphologie ne remplace pas l’étude de la cause et le suivi de sa correction.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></template>
<template data-pop="d63-crp" data-title="CRP : contextualiser la ferritine"><p>La protéine C-réactive contribue à apprécier un contexte inflammatoire. Une ferritine peut être augmentée dans ce contexte, ce qui modifie son interprétation comme indicateur de réserve. Le résultat s’intègre à la maladie connue, aux symptômes et à leur évolution.</p><p>La <button class="w" data-k="d63-crp">CRP</button> n’établit pas seule la cause d’une anémie. Une valeur normale à un instant donné ne résout pas toutes les causes de ferritine élevée, et une valeur élevée ne prouve pas que tous les symptômes viennent de l’inflammation. Les autres mécanismes, notamment pertes et <button class="w" data-k="d63-mrc">MRC</button>, restent à examiner.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a>.</p></div></template>
<template data-pop="d63-mrc" data-title="MRC : maladie rénale chronique et anémie multifactorielle"><p>La <button class="w" data-k="d63-mrc">MRC</button> peut contribuer à l’anémie par un défaut relatif de stimulation érythropoïétique, une inflammation et des perturbations du métabolisme du fer. Pertes, carences et autres maladies restent possibles. Le stade rénal ne suffit pas à expliquer toute baisse d’<button class="w" data-k="d63-hb">Hb</button>.</p><p><button class="w" data-k="d63-sources-guides">KDIGO</button> 2026 distingue l’hémodialyse des situations sans hémodialyse pour les seuils de début du fer. Les décisions d’<button class="w" data-k="d63-esa">ESA</button> sont individualisées hors dialyse ; la cible adulte recommandée est inférieure à 11,5 g/dL. Les contre-indications du produit suisse doivent rester respectées. Le risque d’allo-immunisation pèse dans une éventuelle transfusion si une greffe est envisagée.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a>.</p></div></template>

<template data-pop="d63-mici" data-title="MICI : inflammation, pertes et absorption"><p>Une maladie inflammatoire chronique intestinale peut associer inflammation, saignement, malabsorption et déficits nutritionnels. Un mécanisme mixte est fréquent dans ce contexte ; une ferritine intermédiaire ne doit pas être interprétée avec les seuls repères d’un adulte sans inflammation.</p><p><button class="w" data-k="d63-sources-guides">ECCO</button> recommande le fer IV en première intention notamment si la maladie est active, si le fer oral est mal toléré ou si un <button class="w" data-k="d63-esa">ESA</button> est nécessaire. Le fer oral peut convenir à une anémie légère avec maladie inactive. Le traitement de la maladie et la surveillance des récidives restent essentiels. Une proposition d’<button class="w" data-k="d63-esa">ESA</button> dans une recommandation <button class="w" data-k="d63-mici">MICI</button> n’étend pas automatiquement la fiche suisse Eprex.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2646/4202/12753" target="_blank" rel="noopener">[S402] Swiss Delphi study on iron deficiency</a>.</p></div></template>
<template data-pop="d63-esa" data-title="ESA : agents stimulant l’érythropoïèse"><p>Les <button class="w" data-k="d63-esa">ESA</button> stimulent la production de globules rouges ; l’époétine alfa en fait partie. Une production efficace requiert un fer disponible et une moelle capable de répondre. Leur délai d’action exclut de les considérer comme une correction immédiate d’une anémie menaçante.</p><p>Le choix et la dose dépendent de l’indication et du produit. En <button class="w" data-k="d63-mrc">MRC</button>, <button class="w" data-k="d63-sources-guides">KDIGO</button> recommande une cible d’<button class="w" data-k="d63-hb">Hb</button> inférieure à 11,5 g/dL chez l’adulte. Les risques d’hypertension et de thrombose, les contre-indications et la vitesse d’augmentation d’<button class="w" data-k="d63-hb">Hb</button> modifient le suivi. Une hyporéponse impose de rechercher les causes avant d’augmenter la dose.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a>.</p></div></template>
<template data-pop="d63-il6-stat3" data-title="IL-6–STAT3 : une voie de signalisation inflammatoire"><p>L’interleukine 6 transmet un signal inflammatoire qui peut activer la voie <button class="w" data-k="d63-il6-stat3">STAT3</button> et augmenter la production d’hepcidine. L’export du fer diminue alors, contribuant à une restriction de sa disponibilité pour l’érythropoïèse.</p><p>Cette voie explique une partie du mécanisme, sans rendre les autres mécanismes inutiles. Elle ne constitue ni un test diagnostique de D63 ni une indication universelle d’un traitement ciblant l’<button class="w" data-k="d63-il6-stat3">IL-6</button>. La maladie causale, les données cliniques et les preuves propres au traitement déterminent la conduite.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a>.</p></div></template>
<template data-pop="d63-hypophosphate" data-title="Hypophosphatémie après carboxymaltose ferrique"><p>Une baisse de phosphate peut survenir après Ferinject. Lorsqu’elle persiste ou se répète, elle peut s’associer à faiblesse, douleurs, ostéomalacie et fractures. Une fatigue après traitement n’est donc pas automatiquement une preuve de carence persistante en fer.</p><p>La fiche demande une attention particulière en cas de facteurs de risque : déficit en vitamine D, malabsorption, hyperparathyroïdie secondaire, <button class="w" data-k="d63-mici">MICI</button>, ostéoporose ou administrations répétées. Contrôler le phosphate lorsque le risque le justifie et réévaluer le traitement si l’hypophosphatémie persiste. Le bénéfice sur l’<button class="w" data-k="d63-hb">Hb</button> n’efface pas cet effet indésirable.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></template>
<template data-pop="d63-transfusion" data-title="Transfusion : indication, volume et réévaluation"><p>Chez un adulte stable sans saignement actif, une stratégie restrictive et la réévaluation après une unité peuvent limiter une exposition inutile. Les repères suisses sont 70 g/L sans maladie cardiovasculaire et 80 g/L avec maladie cardiovasculaire préexistante stable. Ils ne s’appliquent pas mécaniquement à une hémorragie majeure ou un syndrome coronarien aigu.</p><p>La tolérance, la chronologie, les comorbidités et les préférences participent à la décision. Transfuser améliore rapidement la quantité d’hématies, sans traiter la cause de l’anémie. Compatibilité, identification et surveillance des réactions restent indispensables ; la procédure institutionnelle s’applique.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng24/chapter/Red-blood-cell-transfusion" target="_blank" rel="noopener">[S407] Blood transfusion — red blood cell transfusion</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a>.</p></div></template>
<template data-pop="d63-calcul-fer" data-title="Calcul du fer : vérifier les unités et les limites"><p>Ganzoni dans la fiche Ferinject : poids en kg × différence d’<button class="w" data-k="d63-hb">Hb</button> en g/dL × 2,4 + réserves en mg. Exemple fictif de 70 kg, <button class="w" data-k="d63-hb">Hb</button> 9 g/dL et cible de calcul 15 g/dL avec 500 mg de réserves : 1 508 mg avant l’arrondi prévu. Avec le tableau simplifié, la même situation donne 2 000 mg ; la méthode doit être annoncée.</p><p>La quantité totale n’est pas la dose unique. Appliquer ensuite les maxima pondéraux, absolus, hebdomadaires et ceux de l’hémodialyse. Une unité mal saisie peut produire un résultat numériquement précis mais cliniquement dangereux. Faire contrôler le calcul et le produit avant administration.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a>.</p></div></template>
<template data-pop="d63-who" data-title="OMS 2024 : définition de l’anémie et populations"><p>Chez les adultes de 15 à 65 ans, les seuils retenus sont une <button class="w" data-k="d63-hb">Hb</button> inférieure à 120 g/L chez la femme non enceinte et à 130 g/L chez l’homme. En grossesse, les seuils sont 110 g/L aux premier et troisième trimestres et 105 g/L au deuxième. Pour les enfants, les seuils changent avec l’âge.</p><p>Le seuil de 6 à 23 mois est 105 g/L dans la recommandation 2024, distinct du seuil ancien de 110 g/L couvrant une tranche plus large. Le tableau ne fournit pas une norme pour les moins de six mois ou tous les plus de 65 ans. Ces seuils définissent une anémie ; ils ne constituent pas des seuils universels de transfusion ou d’<button class="w" data-k="d63-esa">ESA</button>.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S412] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a>.</p></div></template>
<template data-pop="d63-cim" data-title="D63* : code de manifestation, pas diagnostic automatique"><p>Dans la CIM-10-GM 2024 utilisée par l’OFS, <button class="w" data-k="d63-cim">D63.0</button>* concerne l’anémie au cours de maladies tumorales et <button class="w" data-k="d63-cim">D63.8</button>* l’anémie au cours d’autres maladies chroniques classées ailleurs. L’astérisque signale un code de manifestation associé à la maladie causale selon les règles applicables.</p><p>Le code américain <button class="w" data-k="d63-cim">D63.1</button> ne doit pas être importé dans cette classification. La CIM-10-GM inclut certaines situations rénales dans <button class="w" data-k="d63-cim">D63.8</button>*. Le codage vient après l’analyse clinique et documentaire ; une maladie chronique connue ne suffit pas à prouver que l’anémie lui est attribuable.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S415] CIM-10-GM 2024, libellés français officiels</a> ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d60-d64.htm" target="_blank" rel="noopener">[S414] ICD-10-GM 2024, D60–D64</a>.</p></div></template>
<template data-pop="d63-profiles" data-title="PROFILES et examen suisse : partir d’une situation clinique"><p>Le référentiel <button class="w" data-k="d63-profiles">PROFILES</button> 2017 inclut notamment fatigue (SSP 4), dyspnée (46), pâleur (147), anémie (165) et dyspnée aiguë (206). Ces situations demandent d’organiser l’évaluation, la sécurité, le différentiel et la prise en charge à partir d’une présentation, sans deviner d’emblée une cause unique.</p><p>Les exigences <button class="w" data-k="d63-profiles">MEBEKO</button> de l’examen 2026 consultées renvoient à ce référentiel. La transition annoncée pour le nouveau <button class="w" data-k="d63-profiles">PROFILES</button> ne doit pas être antidatée : déploiement pédagogique 2025/26 et examen 2028 sont distingués. La liste conservatoire de la plateforme n’est pas une liste fédérale de maladies à cocher.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S422] PROFILES 2017, situations de départ</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">[S423] OFSP/MEBEKO, exigences examen 2026, §2</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" target="_blank" rel="noopener">[S424] Swiss Medical Weekly 2025, transition PROFILES 2</a>.</p></div></template>
<template data-pop="d63-sources-guides" data-title="Sources : dates, populations et limites de lecture"><p>La hiérarchie pratique part des sources suisses disponibles : medix, consensus suisse, smarter medicine, OFS et informations professionnelles. <button class="w" data-k="d63-sources-guides">KDIGO</button> 2026 précise l’anémie rénale ; <button class="w" data-k="d63-sources-guides">ECCO</button> 2024 concerne la <button class="w" data-k="d63-mici">MICI</button> ; <button class="w" data-k="d63-sources-guides">ESMO</button> 2018 l’oncologie. Les paragraphes de ces textes ont été consultés pour les questions indiquées, sans prétendre avoir lu chaque page de tous les documents.</p><p>La revue mécanistique de Weiss 2019 et les descriptions de physiologie normale complètent ce cadre. Les données anciennes ou les divergences de seuil sont signalées. L’image macroscopique OpenStax 2016 et le frottis humain sous licence ouverte restent des images normales, sans diagnostic inventé. Les auto-relectures et tests techniques ne constituent pas une validation médicale humaine indépendante.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">[S419] File:2205 Bone Marrow.jpg - Wikimedia Commons</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">[S420] Human blood smear — Кров людини</a>.</p></div></template>
<template data-pop="pareto-d63-cours" data-title="Monographie : les décisions qui organisent le raisonnement"><ul><li>Confirmer l’anémie et sa dynamique sans confondre seuil diagnostique et seuil transfusionnel.</li><li>Décrire la tolérance, rechercher pertes et causes associées.</li><li>Interpréter ferritine et <button class="w" data-k="d63-tsat">TSAT</button> avec l’inflammation et la population.</li><li>Traiter la maladie causale et une carence documentée ; respecter les contre-indications du produit.</li><li>Organiser le suivi et réévaluer une réponse insuffisante.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a>.</p></div></template>
<template data-pop="pareto-d63-examens" data-title="Examens : une question par mesure"><ul><li><button class="w" data-k="d63-hb">Hb</button> et <button class="w" data-k="d63-vgm">VGM</button> décrivent le sang ; les réticulocytes interrogent la production.</li><li>Ferritine et <button class="w" data-k="d63-tsat">TSAT</button> ne mesurent pas le même compartiment.</li><li><button class="w" data-k="d63-crp">CRP</button>, fonction rénale et bilan orienté contextualisent les résultats.</li><li>Un <button class="w" data-k="d63-vgm">VGM</button> normal n’exclut pas des déficits associés.</li><li>Réserver les examens spécialisés à une question qui change la conduite.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></template>
<template data-pop="pareto-d63-pharma" data-title="Pharmacologie : produit précis et suivi réel"><ul><li>Fer oral : vérifier indication, âge, poids, contre-indications et interactions.</li><li>Ferinject : besoin total, maximum par séance et cumul hebdomadaire se calculent séparément.</li><li>Eprex : indication et restrictions suisses avant cible ou dose.</li><li>Sous <button class="w" data-k="d63-esa">ESA</button>, ne pas viser la normalisation d’<button class="w" data-k="d63-hb">Hb</button> en <button class="w" data-k="d63-mrc">MRC</button>.</li><li>Prévoir surveillance et conduite devant réaction, hypophosphatémie ou hyporéponse.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S410] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a>.</p></div></template>
<template data-pop="pareto-d63-semio" data-title="Sémiologie : relier signe, mécanisme et décision"><ul><li>Une saturation normale ne mesure pas la quantité d’<button class="w" data-k="d63-hb">Hb</button>.</li><li>La chronologie distingue une production insuffisante d’un événement aigu possible.</li><li>La ferritine ne se lit pas sans contexte inflammatoire.</li><li>Douleur thoracique, dyspnée de repos ou instabilité imposent une évaluation urgente.</li><li>Une étiquette chronique ne clôt pas le diagnostic différentiel.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S418] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a>.</p></div></template>
<template data-pop="pareto-d63-anat" data-title="Anatomie : plusieurs compartiments, une même Hb"><ul><li>Moelle : production ; rein : stimulation ; intestin : absorption.</li><li>Macrophages : recyclage ; foie : stockage et signal hepcidine.</li><li>Une mesure sanguine ne décrit pas directement toutes les réserves.</li><li>L’image originale situe un tissu normal, sans diagnostiquer D63.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S417] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a>.</p></div></template>
<template data-pop="pareto-d63-histo" data-title="Histologie : observer sans surinterpréter"><ul><li>Le <button class="w" data-k="d63-vgm">VGM</button> est une moyenne de tailles.</li><li>Le frottis normal illustre des hématies, sans dosage du fer.</li><li>Réticulocytes et <button class="w" data-k="d63-chr">CHr</button> répondent à des questions distinctes.</li><li>Méthode et population accompagnent chaque seuil.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S418] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a>.</p></div></template>
<template data-pop="pareto-d63-physio" data-title="Physiologie : le temps et la réserve comptent"><ul><li>Production, survie et pertes déterminent la masse érythrocytaire.</li><li>Saturation et quantité d’<button class="w" data-k="d63-hb">Hb</button> sont complémentaires.</li><li>Fer et <button class="w" data-k="d63-esa">ESA</button> ont un délai ; une transfusion ne traite pas la cause.</li><li>Un pronostic associé à une <button class="w" data-k="d63-hb">Hb</button> basse ne prouve pas le bénéfice d’une cible élevée.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a>.</p></div></template>
<template data-pop="pareto-d63-bio" data-title="Biochimie : stock, transport, disponibilité"><ul><li>Ferritine : indicateur de réserve et de phase aiguë.</li><li><button class="w" data-k="d63-tsat">TSAT</button> : proportion de transport occupée.</li><li>Hepcidine–ferroportine : régulation de l’export cellulaire.</li><li>Ganzoni : <button class="w" data-k="d63-hb">Hb</button> en g/dL, pas en g/L avec le même coefficient.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a>.</p></div></template>
<template data-pop="pareto-d63-gen" data-title="Génétique : une régulation n’est pas une mutation"><ul><li>L’inflammation modifie des programmes d’expression.</li><li>Une cause constitutionnelle exige une question spécifique.</li><li>Le mécanisme HIF ne prouve pas l’autorisation d’un produit.</li><li>Le test et le traitement doivent conserver leur portée et leurs limites.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a>.</p></div></template>
