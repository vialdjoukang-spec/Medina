<template id="ch-G01"><div class="chap"><div class="chap-head"><div class="code">G 01 · Neurologie · Méningite au cours d’affections bactériennes classées ailleurs</div><h1>Méningite au cours d’affections bactériennes classées ailleurs</h1><span class="status">Reprise Alpha du 15 octobre 2026 · Revue par intelligence artificielle · Aucune validation médicale humaine</span><p class="status">Révision Alpha en cours : certaines réserves thérapeutiques et sources héritées restent à vérifier ; les audits finaux de cette version ne sont pas clos.</p></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de la méningite</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#g01-0">Question clinique</a></li><li><a href="#g01-1">Définition et classification</a></li><li><a href="#g01-2">Fréquence et épidémiologie</a></li><li><a href="#g01-3">Physiopathologie</a></li><li><a href="#g01-4">Causes et facteurs de risque</a></li><li><a href="#g01-5">Anamnèse</a></li><li><a href="#g01-6">Examen clinique</a></li><li><a href="#g01-7">Démarche diagnostique</a></li><li><a href="#g01-8">Urgences et complications</a></li><li><a href="#g01-9">Prise en charge</a></li><li><a href="#g01-10">Suivi, pronostic et prévention</a></li><li><a href="#g01-11">Situations particulières</a></li><li><a href="#g01-12">Critères officiels et paramètres décisifs</a></li></ol></nav><div class="chap-body"><section class="ilot" id="g01-0"><h2><span class="n">0</span>Question clinique</h2>
<p data-src="S3">Dans cette <b>vignette fictive</b>, un homme de 71 ans, traité par corticoïdes pour un lymphome, arrive aux urgences après deux jours de fièvre à 39,2 °C et de céphalée. Il est devenu confus au cours de la dernière nuit et présente une raideur de nuque. La ponction lombaire montre 3200 cellules/µl à prédominance de polynucléaires neutrophiles, des protéines à 2400 mg/l, un glucose à 18 mg/dl et un lactate à 8 mmol/l. Ces valeurs sont pédagogiques ; elles servent à poser trois questions qui orientent les décisions.</p>
<p data-src="S3">La première question porte sur le délai : quels gestes précèdent l’imagerie et la ponction ? La deuxième porte sur le choix de l’antibiotique : pourquoi une céphalosporine seule serait-elle insuffisante chez ce patient ? La troisième porte sur la suite : si l’hémoculture isole <i>Listeria</i>, <i>Neisseria meningitidis</i> ou, dans un autre contexte, si le liquide est lymphocytaire avec un glucose bas, quelle maladie causale faut-il nommer et quelles mesures de santé publique en découlent ?</p>
<p data-src="S1">Ce cours traite les méningites dont l’agent bactérien est identifié et classé ailleurs : <button class="w" data-k="g01-meningocoque">méningocoque (profil, portage, gravité)</button>, <button class="w" data-k="g01-listeria"><i>Listeria</i> (tropisme et traitement)</button>, <button class="w" data-k="g01-borrelia"><i>Borrelia</i> (neuroborréliose)</button>, <button class="w" data-k="g01-syphilis"><i>Treponema pallidum</i> (neurosyphilis)</button>, <button class="w" data-k="g01-tuberculose"><i>Mycobacterium tuberculosis</i> (méningite tuberculeuse)</button> et <button class="w" data-k="g01-rares">agents rares (typhoïde, salmonelles, leptospirose, gonocoque, charbon)</button>. Il commence toutefois par la conduite devant toute méningite purulente, car cette conduite s’applique avant que le germe soit connu.</p>
<div class="key" data-src="S3"><b>À retenir.</b> Devant une méningite, le médecin traite d’abord l’urgence sans attendre le germe, en couvrant <i>Listeria</i> lorsque le terrain l’exige. Il identifie ensuite la maladie causale, car elle commande le traitement spécifique, la durée, la déclaration et la prophylaxie des contacts.</div>
</section>

<section class="ilot" id="g01-1"><h2><span class="n">1</span>Définition et classification</h2>
<p data-src="S1">Une méningite est une inflammation des enveloppes qui entourent l’encéphale et la moelle, avec une réaction cellulaire dans le liquide cérébro-spinal (<button class="w" data-k="g01-lcr-profils">LCR</button>). Dans la classification CIM-10-GM 2024, la catégorie G01* regroupe les méningites qui sont la <b>manifestation</b> d’une maladie bactérienne déjà classée ailleurs. La maladie causale reçoit le code croix ; la méningite, le code astérisque <button class="w" data-k="g01-codage">(logique croix-astérisque et exclusions)</button>.</p>
<p data-src="S1">Les affections causales retenues par la classification sont le charbon, la gonococcie, la leptospirose, la listériose, la maladie de Lyme, la méningococcie, la neurosyphilis, la salmonellose, la syphilis congénitale, la syphilis secondaire, la tuberculose et la fièvre typhoïde. La méningo-encéphalite et la méningomyélite, qui associent une atteinte du parenchyme, sont classées dans la catégorie G05. La méningite bactérienne sans maladie causale classée ailleurs, par exemple pneumococcique, relève de G00.</p>
<h3>1.1 Définitions cliniques</h3>
<p data-src="S3">La méningite bactérienne aiguë se reconnaît à quatre symptômes cardinaux : la céphalée, le méningisme, la fièvre et le trouble de la conscience. L’absence d’un de ces symptômes n’exclut pas le diagnostic <button class="w" data-k="g01-meningisme">(fréquences et limites des quatre symptômes)</button>.</p>
<p data-src="S15">Pour la neuroborréliose, la recommandation allemande de 2025 distingue trois niveaux de certitude. Le cas <b>possible</b> associe un tableau typique et des anticorps sériques, sans examen du liquide. Le cas <b>probable</b> exige en plus un liquide inflammatoire : pléiocytose lymphocytaire, dysfonction de barrière et synthèse intrathécale d’immunoglobulines. Le cas <b>confirmé</b> exige les critères du niveau probable, auxquels s’ajoute une synthèse intrathécale d’anticorps anti-<i>Borrelia</i> ou une culture ou une <button class="w" data-k="g01-pcr">PCR (rendement et limites)</button> positive dans le liquide <button class="w" data-k="g01-ai-borrelia">(index d’anticorps et seuil)</button>.</p>
<p data-src="S13">La neurosyphilis est dite précoce lorsqu’elle prend la forme d’une méningite syphilitique, d’une atteinte méningovasculaire ou de gommes, et tardive lorsqu’elle prend la forme d’un tabès ou d’une paralysie générale. La forme asymptomatique associe une sérologie positive et des anomalies du liquide sans manifestation clinique. Les critères de la recommandation allemande de 2020 sont détaillés dans le dernier îlot de la partie « Pathologie ».</p>
<p data-src="S1,S10,S19">La méningite tuberculeuse est une urgence médicale. Elle est suspectée devant une leucocytose du liquide à prédominance lymphocytaire, des protéines élevées et un rapport glucose du liquide sur glucose plasmatique inférieur à 50 %. La neurolistériose se présente comme une méningo-encéphalite dans 84 % des cas (212 sur 252 dans la cohorte française <button class="w" data-k="g01-monalisa">MONALISA (cohorte nationale)</button>), avec une atteinte du tronc cérébral chez 17 %. Comme la classification exclut de G01* la méningo-encéphalite, le codage suit l’atteinte du parenchyme lorsqu’elle est établie.</p>
<div class="trap" data-src="S3"><span class="k">Piège</span> Les noms « méningite bactérienne » et « méningite lymphocytaire » ne s’opposent pas toujours. La neuroborréliose, la neurosyphilis et la tuberculose sont des méningites bactériennes à liquide lymphocytaire ou mixte : un liquide non purulent n’exclut donc pas une cause bactérienne.</div>
<div class="key" data-src="S1"><b>À retenir.</b> G01* décrit une méningite <i>due à</i> une maladie nommée. Le diagnostic se rédige donc en deux temps : la maladie causale, puis sa manifestation méningée.</div>
<button class="pareto-btn ui" data-k="pareto-g01-definition">▲ Loi de Pareto — Définition et classification</button>
</section>

<section class="ilot" id="g01-2"><h2><span class="n">2</span>Fréquence et épidémiologie</h2>
<p data-src="S3">L’incidence de la méningite bactérienne diminue en Europe depuis trente ans. Aux Pays‑Bas, elle est passée de 6,37 pour 100 000 (1989–1993) à 1,58 pour 100 000 par an (2014–2019). La vaccination a fait reculer <i>Haemophilus influenzae</i> et le méningocoque ; les sérotypes pneumococciques non vaccinaux ont, eux, progressé.</p>
<table class="t" data-src="S7,S8,S10,S11,S12,S13,S14,S15,S18,S20"><thead><tr><th>Agent</th><th>Données disponibles dans le dossier</th><th>Population et limite</th></tr></thead><tbody><tr><td>Méningocoque</td><td>Environ 50 cas invasifs sévères par an en Suisse ; surtout avant 5 ans et entre 15 et 19 ans ; portage nasopharyngé de 8 à 15 % de la population européenne ; létalité environ 7 % (15 % chez le nourrisson) ; séquelles irréversibles chez 10 à 20 % des survivants</td><td>OFSP et fiche vaccinale 2024 ; sérogroupes 2011–2020 : B environ 40 %, C, W et Y environ 20 % chacun</td></tr><tr><td><i>Listeria</i></td><td>Jusqu’à 100 listérioses déclarées par an en Suisse (toutes formes) ; létalité jusqu’à 20 % ; moins de 10 % des méningites bactériennes communautaires de l’adulte en Europe centrale</td><td>Cohorte française de 818 cas dont 252 neurolistérioses ; enfant (1 mois–18 ans) : 3 % des cas</td></tr><tr><td><i>Borrelia</i></td><td>Manifestations neurologiques dans 3 à 15 % des borrélioses ; méningite isolée chez environ 30 % des enfants et 4 à 5 % des adultes</td><td>Recommandation allemande 2025 ; épidémiologie suisse de la neuroborréliose non trouvée</td></tr><tr><td><i>T. pallidum</i></td><td>Syphilis en Suisse : plateau de 800 à 1000 cas détectés par an depuis 2017, 1078 en 2022 ; neurosyphilis tardive chez 5 à 10 % dans l’histoire naturelle</td><td>Données suisses sur la syphilis en général ; neurosyphilis suisse non disponible</td></tr><tr><td><i>M. tuberculosis</i></td><td>365 cas de tuberculose en Suisse en 2022 (4,16 pour 100 000), dont 73 % d’origine non suisse</td><td>Toutes formes confondues ; la page de l’OFSP mentionne « près de 550 cas chaque année » : période différente, divergence à signaler</td></tr></tbody></table>
<p data-src="S12">Le tableau classe les agents selon leur importance pédagogique en Suisse. Il ne donne pas un taux de méningite pour chaque germe : seules les données retrouvées sont rapportées, chacune avec sa population. Pour la typhoïde, la salmonellose non typhique, la leptospirose, le gonocoque, le charbon et la syphilis congénitale, aucune source spécifique n’a été lue ; ces agents sont décrits comme des raretés sans chiffres.</p>
<p data-src="S8,S13">Le méningocoque présente une recrudescence en automne et en hiver. En Allemagne, 85 % des cas de syphilis concernent des hommes ayant des rapports sexuels avec des hommes (<button class="w" data-k="g01-syphilis">HSH</button>), dont 46 % sont co-infectés par le <button class="w" data-k="g01-vih-syph">VIH (co-infection et ponction lombaire)</button>. Au stade secondaire de la syphilis, le liquide contient le tréponème chez 30 % des patients et une pléiocytose chez 40 %.</p>
<div class="trap" data-src="S10,S13"><span class="k">Population des chiffres</span> La létalité de 7 % du méningocoque, la proportion de 252 neurolistérioses sur 818 cas et les pourcentages de syphilis proviennent de populations différentes (Suisse, France, Allemagne). Ils ne se comparent pas entre eux et ne forment pas une incidence suisse de la méningite à chaque germe.</div>
<div class="key" data-src="S7,S12,S18"><b>À retenir.</b> Trois chiffres suisses servent de repères : environ 50 méningococcies invasives par an, jusqu’à 100 listérioses par an et 365 tuberculoses déclarées en 2022. Ils justifient la place du méningocoque, de <i>Listeria</i> et de la tuberculose dans les priorités.</div>
</section>

<section class="ilot" id="g01-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p data-src="S6,S21">Le liquide cérébro-spinal normal contient peu de phagocytes et peu de complément ; une bactérie qui y pénètre s’y multiplie donc sans opposition efficace. La barrière hémato-encéphalique limite en outre le passage des antibiotiques : la ceftriaxone atteint environ 2 % de sa concentration plasmatique dans un liquide non inflammatoire, et jusqu’à 25 % lorsque les méninges sont enflammées <button class="w" data-k="g01-bhe">(barrière et pénétration des antibiotiques)</button>. Cette perméabilité acquise explique pourquoi le traitement intraveineux à forte dose reste nécessaire.</p>
<h3>3.1 Séquence décrite pour le pneumocoque</h3>
<p data-src="S6">Le modèle décrit ici est celui du pneumocoque ; il illustre l’invasion et l’inflammation, sans expliquer toutes les voies d’entrée ni toutes les particularités des autres agents. La bactérie colonise d’abord le nasopharynx, franchit l’épithélium et survit dans le sang grâce à sa capsule, qui limite l’action du complément. Elle traverse ensuite la barrière hémato-encéphalique, par voie transcellulaire ou paracellulaire, le plexus choroïde pouvant aussi servir d’entrée <button class="w" data-k="g01-physiopath-seq">(étapes détaillées et sources)</button>.</p>
<p data-src="S6">Dans le liquide, la bactérie se multiplie librement. Sa lyse libère des composants reconnus par des récepteurs de l’immunité innée (<button class="w" data-k="g01-cytokines">TLR et cytokines (signal inflammatoire)</button>). La production de TNF-α, d’interleukine-1β et d’interleukine-6, ainsi que de chimiokines, recrute des polynucléaires neutrophiles : ils créent la pléiocytose. Les radicaux oxygénés et le monoxyde d’azote qu’ils libèrent rompent la barrière, ce qui provoque un œdème vasogénique, une hypertension intracrânienne, une vascularite, une hydrocéphalie et une atteinte cochléaire.</p>
<figure><svg viewBox="0 0 420 330" role="img" aria-label="Figure 1 — Séquence physiopathologique" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="10" y="8" width="400" height="38" rx="5"/><path d="M210 46v12m-4-4l4 4 4-4"/><rect x="10" y="58" width="400" height="38" rx="5"/><path d="M210 96v12m-4-4l4 4 4-4"/><rect x="10" y="108" width="400" height="38" rx="5"/><path d="M210 146v12m-4-4l4 4 4-4"/><rect x="10" y="158" width="400" height="38" rx="5"/><path d="M210 196v12m-4-4l4 4 4-4"/><rect x="10" y="208" width="400" height="38" rx="5"/><path d="M210 246v12m-4-4l4 4 4-4"/><rect x="10" y="258" width="400" height="62" rx="5"/></g><g fill="currentColor" text-anchor="middle"><text x="210" y="32">Colonisation nasopharyngée, passage dans le sang</text><text x="210" y="82">Franchissement de la barrière hémato-encéphalique</text><text x="210" y="132">Multiplication libre dans le liquide, lyse bactérienne</text><text x="210" y="182">Cytokines, chimiokines, afflux de neutrophiles</text><text x="210" y="232">Radicaux oxygénés, monoxyde d’azote, rupture de barrière</text><text x="210" y="283">Œdème, hypertension intracrânienne, vascularite,</text><text x="210" y="303">hydrocéphalie, atteinte cochléaire</text></g></svg><figcaption>Figure 1 — Schéma didactique de la séquence du pneumocoque, transposable aux bactéries encapsulées, d’après la revue de physiopathologie de 2011. Chaque étape ouvre une cible thérapeutique : l’antibiotique agit sur la multiplication, la dexaméthasone sur la réaction inflammatoire.</figcaption></figure>
<h3>3.2 Particularités des agents « classés ailleurs »</h3>
<p data-src="S10,S13"><i>Listeria</i> présente un tropisme pour le tronc cérébral : la rhombencéphalite atteint 17 % des neurolistérioses, ce qui explique les paralysies de nerfs crâniens et les signes cérébelleux recherchés à l’examen <button class="w" data-k="g01-listeria">(profil de la bactérie)</button>. Dans la syphilis, la dissémination hématogène au système nerveux central est précoce ; elle guérit souvent spontanément, et une réaction granulomateuse tardive survient dans les formes évoluées <button class="w" data-k="g01-syphilis">(stades et lésions)</button>.</p>
<p data-src="S3,S5">Les liquides diffèrent selon l’agent : à prédominance neutrophile dans la méningite bactérienne aiguë, lymphocytaire dans la neuroborréliose et la neurosyphilis, mixte dans la tuberculose. La dexaméthasone, utile pour limiter l’inflammation sous-arachnoïdienne dans la méningite pneumococcique, n’a pas la même place pour tous les agents : les résultats observationnels sur son emploi dans la neurolistériose sont contradictoires.</p>
<div class="key" data-src="S5,S6"><b>À retenir.</b> Les lésions neurologiques résultent surtout de la réaction inflammatoire dans l’espace sous-arachnoïdien. La corticothérapie adjuvante vise cette inflammation, tandis que l’antibiotique agit sur la multiplication bactérienne.</div>
<button class="pareto-btn ui" data-k="pareto-g01-mecanismes">▲ Loi de Pareto — Mécanismes</button>
</section>

<section class="ilot" id="g01-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p data-src="S3">Le terrain oriente d’abord le choix de la couverture empirique. Chez l’adulte immunocompétent hospitalisé pour une méningite communautaire, <i>Listeria</i> représente moins de 10 % des cas en Europe centrale ; elle devient plus probable chez le sujet âgé, en cas de cancer ou d’immunosuppression. La recommandation allemande S2k associe néanmoins l’ampicilline à la ceftriaxone dans le traitement empirique de l’adulte, et le terrain augmente la probabilité de ce germe.</p>
<table class="t" data-src="S3,S9,S10,S12,S13,S15,S18"><thead><tr><th>Agent causal</th><th>Contexte favorisant</th><th>Mécanisme du risque</th></tr></thead><tbody><tr><td>Méningocoque</td><td>Âge &lt; 5 ans, 15–19 ans ; internat, caserne, prison, camp ; contact étroit avec un cas</td><td>Portage nasopharyngé asymptomatique chez 8 à 15 % ; contact direct avec les sécrétions</td></tr><tr><td><i>Listeria</i></td><td>Âge avancé, cancer, immunosuppression, grossesse, nouveau-né ; charcuterie, poisson, lait cru et fromages, salades en sachet</td><td>Ingestion d’aliments contaminés, puis bactériémie ; tropisme pour le tronc cérébral</td></tr><tr><td><i>Borrelia</i></td><td>Piqûre de tique en zone d’endémie ; l’érythème migrant est présent dans 25 à 50 % des cas aigus</td><td>Séroconversion après piqûre dans 2,6 à 5,6 % ; maladie dans 0,3 à 1,4 %</td></tr><tr><td><i>T. pallidum</i></td><td>Syphilis non traitée ou traitée tardivement ; HSH ; co-infection par le VIH</td><td>Dissémination précoce au système nerveux central, souvent spontanément résolutive</td></tr><tr><td><i>M. tuberculosis</i></td><td>Immunodépression, âges extrêmes, origine d’un pays à forte incidence</td><td>Méningite et formes disséminées surtout chez l’immunodéprimé et aux âges extrêmes ; le BCG protège contre la méningite tuberculeuse</td></tr></tbody></table>
<p data-src="S1">Pour les agents rares, aucune source spécifique n’a été lue. La typhoïde, la salmonellose non typhique, la leptospirose, la gonococcie, le charbon et la syphilis congénitale figurent dans la classification parmi les causes possibles ; les facteurs de risque propres à chacun ne sont pas rapportés ici faute de source <button class="w" data-k="g01-rares">(agents sans source spécifique)</button>.</p>
<div class="trap" data-src="S11"><span class="k">Erreur fréquente</span> Réserver l’ampicilline aux patients « fragiles » seulement. L’absence d’immunosuppression apparente ne protège pas : chez l’enfant, 79 % des listérioses de la cohorte pédiatrique surviennent sans immunosuppression connue.</div>
<div class="key" data-src="S3,S11"><b>À retenir.</b> Le contexte épidémiologique (âge, immunité, grossesse, alimentation, piqûre, exposition sexuelle, pays d’origine) pèse autant que la clinique pour choisir l’antibiotique et pour penser à une cause « classée ailleurs ».</div>
</section>

<section class="ilot" id="g01-5"><div data-semiology-clinical="G01"><h2><span class="n">5</span>Anamnèse</h2>
<p data-src="S3,S12,S15">L’anamnèse précise la chronologie, les expositions et les traitements en cours. Une évolution en quelques heures oriente vers une méningococcie ; une évolution sur des semaines évoque plutôt la tuberculose, la neuroborréliose ou la neurosyphilis. Le médecin interroge sur <button class="w" data-k="g01-aliments-listeria">les aliments à risque</button>, les <button class="w" data-k="g01-tique">piqûres de tique</button>, les expositions sexuelles, le séjour dans un pays à forte incidence de tuberculose, la vaccination et les contacts malades.</p>
<h3>5.1 Symptômes par fréquence</h3>
<p data-src="S3">Dans la méningite bactérienne aiguë de l’adulte, la céphalée est présente dans 83 à 87 % des cas, le méningisme dans 75 à 83 %, la fièvre dans 77 % et le trouble de la conscience dans 69 % des cas. Trois des quatre symptômes cardinaux ne sont réunis que chez la moitié des patients. Les nausées, les vomissements, la photophobie, la confusion et les crises sont possibles <button class="w" data-k="g01-meningisme">(valeur de chaque symptôme)</button>.</p>
<div class="two"><div class="card"><h4>Forme typique : méningococcie</h4><p data-src="S3,S7">La septicémie associe une fièvre brutale, des frissons, des arthralgies et une éruption cutanée ; le choc, le coma ou le décès peuvent survenir en quelques heures. La méningite se présente avec un état grippal, des troubles de la conscience, des crises et une raideur de nuque. L’incubation habituelle est de 3 à 4 jours (extrêmes 2 à 10).</p>
<p data-src="S3">Les lésions cutanées peuvent être prélevées pour microscopie et culture <button class="w" data-k="g01-purpura">(éruption et prélèvement)</button>.</p>
</div><div class="card"><h4>Forme atypique : neurolistériose</h4><p data-src="S3,S10">Le terrain correspond à l’une des situations suivantes : sujet âgé, cancer, immunosuppression, grossesse ou nouveau-né. Les signes du tronc cérébral (paralysies de nerfs crâniens, ataxie) doivent être recherchés <button class="w" data-k="g01-listeria">(rhombencéphalite)</button>.</p>
<p data-src="S10">La cohorte française montre que 35 neurolistérioses sur 252 n’ont été identifiées que par l’hémoculture.</p>
</div></div>
<div class="two"><div class="card"><h4>Neuroborréliose</h4><p data-src="S15">L’érythème migrant n’est présent que dans 25 à 50 % des cas aigus ; son absence n’exclut donc pas le diagnostic. Les douleurs radiculaires commencent 4 à 6 semaines après la piqûre (extrêmes 1 à 18) ; chez les trois quarts des patients, les déficits s’installent en 1 à 4 semaines. L’enfant présente plus souvent une méningite lymphocytaire avec paralysie faciale (environ 55 %) <button class="w" data-k="g01-bannwarth">(syndrome de Bannwarth)</button>.</p>
</div><div class="card"><h4>Méningite syphilitique</h4><p data-src="S13">Elle survient au stade secondaire, généralement la première année : céphalée, méningisme, nausées, vomissements, atteinte des nerfs crâniens III, VII et VIII, parfois du nerf optique. Une uvéite postérieure ou une surdité sont possibles. Un accident vasculaire cérébral du sujet jeune sans facteur de risque doit faire penser à la forme méningovasculaire <button class="w" data-k="g01-syph-avc">(forme vasculaire)</button>.</p>
</div></div>
<p data-src="S18,S19">Dans la méningite tuberculeuse, le retard thérapeutique est fortement associé au décès. Le contexte d’immunodépression ou d’origine d’un pays à forte incidence doit être recherché <button class="w" data-k="g01-tuberculose">(évolution et urgence)</button>.</p>
<div class="trap" data-src="S3"><span class="k">Piège</span> Attendre l’éruption ou une raideur de nuque complète pour traiter. Les symptômes cardinaux sont absents ou incomplets chez de nombreux patients ; la décision repose sur la suspicion, pas sur la réunion de tous les signes.</div>
<div class="key" data-src="S3,S15"><b>À retenir.</b> La rapidité de l’évolution, le terrain et l’exposition orientent le germe avant tout résultat. L’absence d’érythème migrant ne suffit pas à exclure une neuroborréliose ; l’absence de purpura ou de raideur ne suffit pas à exclure une méningite bactérienne.</div>
</div></section>

<section class="ilot" id="g01-6"><h2><span class="n">6</span>Examen clinique</h2>
<p data-src="S3">L’examen commence par l’état général et les signes vitaux, car ils déterminent le degré d’urgence : un état de choc, une altération de la conscience ou des crises imposent d’agir avant d’achever le bilan. Il se poursuit par la recherche de signes méningés, d’un déficit focal et de lésions cutanées.</p>
<div class="two"><div class="card"><h4>Signes méningés et conscience</h4><p data-src="S3">Le médecin évalue la conscience, recherche la raideur de nuque (méningisme), la photophobie et la fièvre. Il note un déficit focal nouveau ou une crise récente, car ces éléments modifient la séquence ponction lombaire – imagerie <button class="w" data-k="g01-pl">(contre-indications à la ponction)</button>.</p>
<p data-src="S15">Dans la neuroborréliose, il cherche une paralysie faciale, uni- ou bilatérale <button class="w" data-k="g01-paralysie-faciale">(atteinte du nerf facial)</button>.</p>
</div><div class="card"><h4>Signes d’orientation étiologique</h4><p data-src="S3,S13,S15">La peau est examinée à la recherche d’un purpura ou d’une éruption (méningocoque), d’un érythème migrant (<i>Borrelia</i>) ou d’une éruption du stade secondaire (syphilis).</p>
<p data-src="S3,S13">L’examen ORL est précoce, car un foyer ORL est retrouvé dans environ 20 % des méningites bactériennes ; l’acuité auditive et l’examen oculaire (uvéite) complètent l’examen <button class="w" data-k="g01-oeil-oreille">(uvéite et surdité)</button>.</p>
</div></div>
<div data-semiology-clinical="G01"><h3>6.1 Examen analytique et interprétation</h3>
<p data-src="S28">Faire préciser la gêne cervicale et observer une réticence à mobiliser la nuque : la raideur peut être discrète. Chez une personne âgée, comparer le comportement actuel à l’état habituel avec l’aide de l’entourage ; une démence ou une arthrose peuvent compliquer l’examen. Rechercher une prise d’antipyrétique avant d’interpréter l’absence de fièvre. Une confusion récente ne doit pas être attribuée d’emblée à une cause habituelle.</p>
<p data-src="S28,S3">Examiner toute la peau et les conjonctives, puis apprécier si les lésions blanchissent à la pression. Une éruption pétéchiale ou purpurique qui ne blanchit pas, surtout rapidement progressive, renforce l’alerte méningococcique ; sa visibilité peut être réduite sur une peau foncée ou bronzée. Son absence n’exclut pas la maladie. Documenter séparément un déficit focal nouveau, une crise récente et la sévérité de l’atteinte de conscience : ces signes commandent la séquence imagerie–ponction, tandis que l’urgence infectieuse commande le traitement sans attendre l’imagerie.</p>
<p class="src"><a href="https://www.nice.org.uk/guidance/ng240/chapter/Recommendations" target="_blank" rel="noopener">NICE, recommandation 240, 2024, tableaux 2–3 et recommandations 1.1.2–1.1.9</a> ; <a href="https://doi.org/10.1186/s42466-023-00264-6" target="_blank" rel="noopener">S2k 2023, recommandations 13–16</a>, consultées le 15.10.2026.</p></div>
<p data-src="S10,S15">La myélite de la neuroborréliose se manifeste par une marche spastique et ataxique et par des troubles vésicaux. Chez le patient atteint de neurolistériose, l’examen recherche des signes du tronc cérébral : paralysies de nerfs crâniens, nystagmus, ataxie.</p>
<div class="trap" data-src="S3"><span class="k">Erreur fréquente</span> Se limiter à la nuque. Le méningisme manque dans 17 à 25 % des cas, alors que le trouble de la conscience, la fièvre et la céphalée peuvent être les seuls éléments présents.</div>
<div class="key" data-src="S3"><b>À retenir.</b> L’examen sert à trois décisions : l’urgence (vitaux, conscience), la sécurité de la ponction (déficit focal, crise, trouble sévère de la conscience) et l’orientation étiologique (peau, nerfs crâniens, ORL, yeux).</div>
