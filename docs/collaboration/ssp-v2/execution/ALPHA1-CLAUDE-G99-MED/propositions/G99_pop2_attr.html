<template data-pop="g99-patisiran" data-title="Patisiran (Onpattro)">
<div class="lab">Indication suisse</div><p>Amylose héréditaire à transthyrétine de l’adulte avec polyneuropathie de stade 1 ou 2.</p>
<div class="lab">Posologie</div><p>300 µg par kg en perfusion intraveineuse toutes les 3 semaines, calculés sur le poids actuel ; à partir de 100 kg, la dose maximale est de 30 mg. Pour 70 kg, la dose est donc de 21 mg.</p>
<div class="lab">Conditions</div><p>Le traitement est instauré dans un centre spécialisé des affections neuromusculaires, le plus tôt possible après les premiers symptômes. La poursuite au stade 3 relève d’une décision individuelle.</p>
<p class="src">Références : information professionnelle suisse Onpattro, Swissmedic (AIPS via AmiKo), mise à jour octobre 2024, consultée le 16.10.2026.</p></template>
<template data-pop="g99-vutrisiran" data-title="Vutrisiran (Amvuttra)">
<div class="lab">Indication suisse</div><p>Amylose héréditaire à transthyrétine avec polyneuropathie de stade 1 ou 2 ; amylose à transthyrétine sauvage ou héréditaire avec cardiomyopathie.</p>
<div class="lab">Posologie</div><p>25 mg en injection sous-cutanée tous les 3 mois, soit quatre injections par an. Un apport de vitamine A d’environ 2500 à 3000 UI par jour au maximum est recommandé.</p>
<div class="lab">Conditions</div><p>Le traitement commence le plus tôt possible pour prévenir l’invalidité ; la poursuite au stade 3 relève du médecin.</p>
<p class="src">Références : information professionnelle suisse Amvuttra, Swissmedic (AIPS via AmiKo), mise à jour octobre 2025, consultée le 16.10.2026.</p></template>
<template data-pop="g99-eplontersen" data-title="Eplontersen (Wainzua)">
<div class="lab">Indication suisse</div><p>Polyneuropathie de stade 1 et 2 associée à une amylose héréditaire à transthyrétine, chez l’adulte.</p>
<div class="lab">Posologie</div><p>45 mg en injection sous-cutanée une fois par mois. Aucun ajustement n’est nécessaire pour un débit de filtration glomérulaire estimé de 45 à 90 mL/min/1,73 m².</p>
<div class="lab">Conditions</div><p>La poursuite au stade 3 relève d’une évaluation individuelle du bénéfice et du risque.</p>
<p class="src">Références : information professionnelle suisse Wainzua, Swissmedic (AIPS via AmiKo), mise à jour mai 2025, consultée le 16.10.2026.</p></template>
