<template data-pop="g99-sm-ortho" data-title="Mesure orthostatique : technique, mécanisme, valeur, piège">
<div class="lab">Normal</div><p>Chez le sujet sain, le lever actif ne fait baisser ni la systolique de 20 mmHg ni la diastolique de 10 mmHg [S4].</p>
<div class="lab">Technique</div><p>Le médecin mesure pression et fréquence couché, puis debout après un lever actif. Le sphygmomanomètre suffit pour l’hypotension classique et retardée ; il ne permet pas plus de quatre mesures par minute [S4]. L’information suisse de la midodrine adapte la dose à la systolique mesurée 3 minutes après le lever [S21].</p>
<div class="lab">Mécanisme</div><p>Au lever, le baroréflexe déclenche une vasoconstriction et une accélération. Quand les fibres autonomes sont lésées, la vasoconstriction manque et la fréquence monte peu [S4].</p>
<div class="lab">Valeur</div><p>Une hausse de fréquence habituellement de 10 battements par minute au plus suggère une origine neurogène [S4]. Associée à des tests de fréquence anormaux, l’hypotension classe la neuropathie comme sévère [S6].</p>
<div class="lab">Piège</div><p>Une anémie ou une hypovolémie accélèrent davantage la fréquence ; le seuil de 10 est un repère [S4].</p>
<p class="src">Références : ESC 2018, syncope (Eur Heart J 2018;39:1883-1948), section 4.2.2.1 ; Toronto 2011 (Diabetes Metab Res Rev 2011;27:639-653, résumé) ; information professionnelle suisse Gutron, mars 2021.</p></template>
<template data-pop="g99-sm-gp" data-title="Symptômes digestifs de la gastroparésie : valeur et limite">
<div class="lab">Mécanisme</div><p>Le trouble moteur gastrique participe aux symptômes, mais le panel UEG/ESNM n’a pas retenu que le retard de vidange les explique à lui seul (accord de 28 %) [S3].</p>
<div class="lab">Valeur</div><p>Les symptômes, seuls ou réunis, prédisent mal la vitesse de vidange et la réponse aux prokinétiques [S3]. Le diagnostic exige donc une endoscopie sans obstacle et un test de vidange anormal [S3].</p>
<div class="lab">Piège</div><p>Une perte de poids fait exclure un trouble du comportement alimentaire (accord de 98 %) [S3].</p>
<p class="src">Références : consensus UEG/ESNM 2021 (United European Gastroenterol J 2021;9:287-306), énoncés 3.8, 4.1, 5.1 et 5.3.</p></template>
<template data-pop="g99-sm-attr" data-title="Dysautonomie de l’amylose à transthyrétine">
<div class="lab">Fréquence</div><p>La dysautonomie touche environ 73 % des patients : impuissance chez 73 % des hommes, troubles digestifs 53 %, incontinence urinaire 50 %, dysrégulation orthostatique 46 % ; l’amaigrissement concerne environ 30 % des patients [S7].</p>
<div class="lab">Valeur</div><p>En zone d’endémie, une polyneuropathie des petites fibres avec dysautonomie et histoire familiale fait suspecter la maladie [S7].</p>
<div class="lab">Piège</div><p>Le tableau imite la neuropathie diabétique ; une diarrhée précoce s’associe à une survie plus courte [S7].</p>
<p class="src">Références : consensus européen d’experts, J Neurol 2021;268:2109-2122.</p></template>
<template data-pop="g99-sm-mscc" data-title="Douleur rachidienne du patient cancéreux">
<div class="lab">Valeur</div><p>La compression médullaire touche jusqu’à 5 à 10 % des patients porteurs de métastases ou d’atteintes tumorales osseuses [S13].</p>
<div class="lab">Tableau</div><p>Douleurs radiculaires, parésie avec syndrome pyramidal, hypo- ou anesthésie, troubles sphinctériens ou syndrome de la queue de cheval [S13].</p>
<div class="lab">Conduite</div><p>L’IRM de toute la colonne est faite sans délai ; la décision thérapeutique est multidisciplinaire [S13].</p>
<p class="src">Références : Revue médicale suisse 2016;12:176-177.</p></template>
<template data-pop="g99-sm-hoffmann" data-title="Signe de Hoffmann : technique, valeur, piège">
<div class="lab">Technique</div><p>L’examinateur maintient le majeur juste en amont de l’articulation interphalangienne distale et chiquenaude la dernière phalange. Une adduction du pouce avec flexion des autres doigts est positive [S31].</p>
<div class="lab">Valeur</div><p>Le signe oriente vers une atteinte du premier motoneurone ; un Hoffmann bilatéral s’associe à une compression plus nette [S31]. Sa sensibilité varie selon les séries, de 44 à 59 % [S31].</p>
<div class="lab">Piège</div><p>Il est présent chez 0,7 à 3 % de la population et dans les atteintes intracrâniennes [S31].</p>
<p class="src">Références : Jiang et coll., Global Spine J 2024;14:1369-1394 (revue systématique, Balgrist, Zurich), tableau 2 et discussion.</p></template>
<template data-pop="g99-sm-babinski" data-title="Signe de Babinski et clonus : spécificité">
<div class="lab">Technique</div><p>Une stimulation plantaire avec l’extrémité mousse du marteau va du talon vers le premier métatarsien. L’extension du gros orteil avec éventail des autres orteils est positive [S31].</p>
<div class="lab">Valeur</div><p>Babinski et clonus sont peu sensibles mais très spécifiques : 96 % et 92 % dans la revue de Cook citée par Jiang [S31]. Trois éléments sur cinq du groupement de Cook (trouble de la marche, Hoffmann, réflexe supinateur inversé, Babinski, âge supérieur à 45 ans) donnent une spécificité de 99 % [S31].</p>
<div class="lab">Piège</div><p>Leur absence n’exclut pas la myélopathie ; 21 % des patients d’une série opérée n’avaient aucun signe [S31].</p>
<p class="src">Références : Jiang et coll., Global Spine J 2024;14:1369-1394.</p></template>
