<template id="ch-G08"><div class="chap"><div class="chap-head"><div class="code">G08 · Neurologie</div><h1>G08 — Phlébite et thrombophlébite intracrâniennes et intrarachidiennes</h1><span class="status">Auto-relecture IA de l’auteur · Aucune validation médicale humaine attestée</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><div class="chap-body" data-semiology-clinical="G08"><section class="ilot" id="g08-question"><h2>Une infection et une thrombose : deux menaces à prendre en charge ensemble</h2><p>Une douleur ou un gonflement périorbitaire avec fièvre, diplopie, baisse visuelle ou anomalie neurologique impose de rechercher une complication profonde d’une infection de la face ou des sinus. Une céphalée inhabituelle, une crise ou une baisse de vigilance peut révéler une thrombose veineuse intracrânienne. Le besoin de confirmer le thrombus et celui de traiter l’infection avancent en parallèle : imagerie adaptée, prélèvements possibles sans danger et mobilisation de l’équipe spécialisée.</p><p>Cette leçon traite les phlébites et thrombophlébites intracrâniennes et intrarachidiennes de G08, sous leur périmètre septique. Elle ne réduit pas la maladie à une thrombose liée à la contraception ou à une thrombophilie. Un anticoagulant peut limiter l’extension thrombotique ; il ne stérilise pas un foyer infectieux. Une antibiothérapie ne dispense pas de discuter le risque de propagation ou de compression.</p><div class="key"><b>À retenir.</b> Chercher le territoire, la gravité et le foyer ; traiter la cause et discuter l’anticoagulation avec les spécialistes, sans ordonnance unique pour tout G08.</div><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button> · <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r14">[14]</button></p></section><section class="ilot" id="g08-definition"><h2>Définir le territoire et le caractère septique</h2><p><button class="w" data-k="g08-tvc">Thrombose, phlébite et infection : que faut-il établir ?</button></p><table class="t"><thead><tr><th>Question</th><th>Éléments utiles</th><th>Limite</th></tr></thead><tbody><tr><td>Où est la thrombose ?</td><td>Sinus caverneux, autres sinus, veines cérébrales ou territoire intrarachidien.</td><td>Le territoire modifie les signes, l’imagerie et l’accès au foyer.</td></tr><tr><td>Pourquoi la forme est-elle dite septique ?</td><td>Foyer contigu ou infection systémique pertinente, prélèvements et cohérence clinique.</td><td>Une culture négative ne suffit pas à exclure ; un test isolé ne suffit pas toujours à confirmer.</td></tr><tr><td>Quelles complications sont présentes ?</td><td>Vision, vigilance, déficit, crise, collection et menace mécanique.</td><td>Le diagnostic ne doit pas s’arrêter au mot thrombose.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Documenter manifestation, cause et degré de certitude ; le code ne démontre ni l’agent ni une stratégie commune.</div><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button> · <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button></p></section><section class="ilot" id="g08-codage"><h2>G08 sans subdivision : inclusions septiques et exclusions explicites</h2><p><button class="w" data-k="g08-codage">Lire les notes de classification avant de coder</button></p><table class="t"><thead><tr><th>Situation exclue de G08</th><th>Code ou groupe cité par la classification</th><th>Conséquence</th></tr></thead><tbody><tr><td>Phlébite/thrombophlébite intracrânienne non pyogène</td><td>I67.6</td><td>Ne pas coder toute thrombose veineuse cérébrale comme G08.</td></tr><tr><td>Forme intrarachidienne non purulente</td><td>G95.18</td><td>Décrire le territoire et la cause avant codage.</td></tr><tr><td>Complication d’avortement, grossesse extra-utérine ou molaire</td><td>O00–O07 ; O08.7</td><td>Utiliser les règles obstétricales applicables.</td></tr><tr><td>Complication de grossesse ou de puerpéralité</td><td>O22.5 ; O87.3</td><td>Maintenir la prise en charge urgente, avec codage causal adapté.</td></tr></tbody></table><p>Les libellés français correspondants ont été relus, notamment « Thrombose non pyogène du système veineux intracrânien » et les thromboses veineuses cérébrales de grossesse ou de puerpéralité. Le fichier des codes donne des libellés, mais pas toutes les notes contextuelles ; la classification applicable et le service de codage complètent la décision.</p><div class="key"><b>À retenir.</b> G08 est sans subdivision et garde son périmètre septique ; une exclusion administrative ne signifie jamais absence d’urgence clinique.</div><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button></p></section><section class="ilot" id="g08-epidemio"><h2>Épidémiologie : les chiffres de toutes thromboses ne décrivent pas G08</h2><p>Les recherches suisses ciblées et les sources européennes lues ne donnent pas une incidence ou une prévalence nationale actuelle propre à G08, avec une répartition exhaustive par âge et sexe. La revue de 2025 cite des incidences récentes de 1,2 à 1,3 pour 100000 habitants pour les thromboses veineuses cérébrales de toutes causes dans les populations étudiées. Cet ordre de grandeur ne devient pas une incidence suisse de thrombophlébite septique.</p><p>La série néerlandaise de douze patients réunit des enfants et des adultes, dans un centre tertiaire, sur la période 2005–2017. La revue sur les thromboses otogènes du sinus sigmoïde rassemble 113 patients issus de seize séries. Leurs modes de sélection, traitements et gravités empêchent d’en tirer une fréquence nationale ou un bénéfice causal universel d’un traitement.</p><table class="t"><thead><tr><th>Donnée</th><th>Ce qu’elle décrit</th><th>Ce qu’elle ne décrit pas</th></tr></thead><tbody><tr><td>1,2–1,3/100000</td><td>Ordre de grandeur de toutes thromboses veineuses cérébrales cité par une revue.</td><td>Incidence suisse G08 ou incidence septique.</td></tr><tr><td>12 patients</td><td>Série tertiaire néerlandaise de thrombose septique du sinus caverneux.</td><td>Pronostic attendu de tout patient ni comparaison randomisée.</td></tr><tr><td>113 patients ; 16 séries</td><td>Revue de thrombose otogène du sinus sigmoïde.</td><td>Effet causal certain de l’anticoagulation ou sécurité universelle.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Donner maladie, population, année et dénominateur ; conserver la lacune nationale plutôt que transformer une série en incidence.</div><p>Sources : <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r6">[6]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section><section class="ilot" id="g08-foyers"><h2>Rechercher un foyer sans imposer un agent unique</h2><p><button class="w" data-k="g08-foyer">Face, sinus, oreille et pharynx : relier le foyer à son extension</button></p><p>Les agents de la série sont variables : streptocoques, staphylocoque, Fusobacterium et, dans un cas, un champignon. La microbiologie, le terrain et la porte d’entrée orientent la couverture et son adaptation. Une infection invasive fongique doit être évoquée dans un contexte compatible, sans transformer un cas en agent dominant de toutes les thromboses.</p><table class="t"><thead><tr><th>Foyer possible</th><th>Questions utiles</th><th>Décision associée</th></tr></thead><tbody><tr><td>Sinus ou face</td><td>Douleur, sécrétions, gonflement, geste récent, évolution malgré traitement.</td><td>Imagerie des rapports et avis ORL selon gravité.</td></tr><tr><td>Oreille/mastoïde</td><td>Otalgie, otorrhée, infection récente ou chronique, baisse auditive.</td><td>Bilan otologique et du sinus adjacent, contrôle du foyer.</td></tr><tr><td>Pharynx/dents</td><td>Infection, douleur, trismus, soins ou collection.</td><td>Prélèvements et drainage adaptés si indiqués.</td></tr><tr><td>Infection systémique</td><td>Cultures, foyer distant et arguments d’endocardite.</td><td>Revoir cause et contre-indications des anticoagulants, notamment celle de Clexane.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Le foyer, l’agent et le thrombus sont trois informations à relier ; aucune ne remplace les deux autres.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r6">[6]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r10">[10]</button></p></section><section class="ilot" id="g08-anamnese"><h2>Construire une chronologie qui change la décision</h2><p>Préciser début et évolution de céphalée, douleur orbitaire, diplopie, baisse visuelle, vomissements, fièvre, crise et modification de vigilance. Rechercher les symptômes de sinusite, otite, infection faciale, dentaire ou pharyngée. La diffusion au second œil peut être évocatrice, mais il ne faut pas attendre une bilatéralité pour suspecter une thrombose caverneuse.</p><p>Documenter médicaments déjà pris, antibiotiques, anticoagulants, antiagrégants et traitements qui modifient le risque hémorragique. Relever doses, heures de dernière prise, rein, foie, grossesse possible et procédures prévues. Une baisse visuelle ou une confusion nouvelle nécessite une réévaluation rapide, même après un premier diagnostic de cellulite orbitaire ou une imagerie non adaptée au système veineux.</p><p><button class="w" data-k="g08-chronologie">Quand un tableau initialement local doit être réévalué</button></p><div class="key"><b>À retenir.</b> La date du changement neurologique et l’heure des traitements doivent pouvoir être relues par l’équipe suivante.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section><section class="ilot" id="g08-clinique"><h2>Examiner la fonction neurologique et la vision</h2><p>Commencer par stabilité, respiration, circulation, température et vigilance. Examiner vision de chaque œil, pupilles, motilité oculaire, douleur et signes orbitaires, puis langage, nerfs crâniens, force, sensibilité et coordination selon le tableau. Un examen normal incomplet ne suffit pas à exclure la maladie. L’inflammation orbitaire peut limiter l’examen ; cette limite est documentée plutôt qu’ignorée.</p><p><button class="w" data-k="g08-caverneux">Pourquoi une limitation d’abduction peut être importante</button></p><p><button class="w" data-k="g08-force">Mesurer la force de manière comparable</button></p><div class="key"><b>À retenir.</b> Mesurer séparément vision, motilité, vigilance et déficit, puis comparer ; un signe localise une fonction et ne prouve pas seul l’agent.</div><p>Sources : <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r9">[9]</button> · <button class="w" data-k="g08-r13">[13]</button></p></section><section class="ilot" id="g08-urgence"><h2>Vision, vigilance et déficit : les changements qui imposent d’agir</h2><p>Baisse de vision, déficit rapidement progressif, crise persistante ou répétée, baisse de vigilance ou signes de menace mécanique imposent stabilisation et évaluation urgente. Le guide recommande une prise en charge surveillée de la phase aiguë de thrombose veineuse cérébrale, avec transfert vers un centre disposant des compétences interventionnelles et neurochirurgicales lorsque nécessaire. La présence d’un foyer septique ajoute une prise en charge infectiologique et du foyer.</p><p><button class="w" data-k="g08-coma">Une baisse de vigilance ne se résume pas à un score pronostique</button></p><p><button class="w" data-k="g08-crises">Crise survenue et prévention systématique sont deux questions</button></p><p>Il ne faut pas attendre un résultat de D-dimères, une culture finale ou l’apparition de tous les signes orbitaires avant une imagerie adaptée. Le contrôle du foyer, les prélèvements sûrs et le traitement sont organisés en parallèle selon l’état clinique. Aucun délai arbitraire de tolérance d’un déficit ou seuil de diamètre n’est ajouté.</p><div class="key"><b>À retenir.</b> Une dégradation change immédiatement la sécurité et l’organisation des soins ; le diagnostic causal se précise sans retarder le traitement urgent.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section>

<section class="ilot" id="g08-infection"><h2>Antibiothérapie et contrôle du foyer sont indispensables</h2><p><button class="w" data-k="g08-antibiotiques">Ce que les données septiques permettent réellement de dire</button></p><p>ORL, ophtalmologie, neurologie, infectiologie, neuroradiologie et neurochirurgie interviennent selon le territoire. Le drainage vise sinus, mastoïde, foyer pharyngé, collection ou autre infection réellement documentée. La série rapporte des gestes très différents ; elle ne justifie pas une ouverture routinière du sinus caverneux ou du thrombus. Les prélèvements sont préparés avec le laboratoire.</p><div class="key"><b>À retenir.</b> L’anticoagulation ne remplace jamais les antibiotiques et le contrôle du foyer infectieux.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r10">[10]</button> · <button class="w" data-k="g08-r11">[11]</button> · <button class="w" data-k="g08-r12">[12]</button></p></section><section class="ilot" id="g08-anticoagulation"><h2>Anticoagulation : intégrer le guide général et les limites septiques</h2><p><button class="w" data-k="g08-heparine">Héparine en phase aiguë : recommandation et produit restent distincts</button></p><p><button class="w" data-k="g08-hemorragie">Une hémorragie de congestion n’interdit pas automatiquement toute héparine</button></p><p>La décision précise molécule, dose, calendrier par rapport aux gestes, fonctions d’organe et surveillance. La revue des thromboses otogènes retrouve davantage de recanalisation parmi les patients anticoagulés, mais ne démontre pas un bénéfice clinique causal universel. Le patient doit comprendre pourquoi l’équipe choisit, diffère ou adapte le traitement.</p><div class="key"><b>À retenir.</b> Recommandation générale forte, données septiques limitées et notice du produit doivent être confrontées, sans automatisme de prescription.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r6">[6]</button> · <button class="w" data-k="g08-r7">[7]</button></p></section><section class="ilot" id="g08-intervention"><h2>Interventions : sauver la fonction et traiter la complication</h2><p><button class="w" data-k="g08-decompression">Décompression : une menace mécanique peut être traitable</button></p><p><button class="w" data-k="g08-endovasc">Traitement endovasculaire : recours spécialisé, pas première étape routinière</button></p><div class="key"><b>À retenir.</b> Distinguer geste sur le foyer, traitement de l’effet de masse et tentative de recanalisation ; chacun demande une indication propre.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section><section class="ilot" id="g08-entretien"><h2>Après stabilisation : durée et choix oral individualisés</h2><p><button class="w" data-k="g08-aod">Anticoagulant oral direct : après stabilisation, sans effacer les limites</button></p><p><button class="w" data-k="g08-duree">Trois à douze mois : un cadre général, pas une durée pour toutes les infections</button></p><div class="key"><b>À retenir.</b> Stabilisation, foyer contrôlé, risque de récidive et tolérance guident l’entretien ; ne pas prolonger un traitement uniquement pour normaliser une image.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r6">[6]</button> · <button class="w" data-k="g08-r8">[8]</button></p></section><section class="ilot" id="g08-suivi"><h2>Suivre la fonction, le foyer et les effets du traitement</h2><p><button class="w" data-k="g08-recanalisation">Recanalisation et guérison clinique ne sont pas synonymes</button></p><p><button class="w" data-k="g08-pronostic">Pronostic : garder population et séquelles visibles</button></p><p>Répéter examen neurologique et visuel, vérifier le contrôle du foyer, l’observance, les interactions et les toxicités. L’imagerie est adaptée à l’évolution et à la question clinique. Une céphalée ou une fatigue persistante ne doit être ni banalisée ni assimilée automatiquement à une nouvelle thrombose ; l’examen et les preuves guident la réévaluation.</p><p><button class="w" data-k="g08-retour">Expliquer les signes qui imposent une réévaluation urgente</button></p><div class="key"><b>À retenir.</b> Une décision de poursuivre ou d’arrêter doit rester expliquée par clinique, foyer, risque et tolérance.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r6">[6]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section><section class="ilot" id="g08-particuliers"><h2>Grossesse, enfant et territoire intrarachidien : préciser le périmètre</h2><p><button class="w" data-k="g08-grossesse">Grossesse : même urgence, codage et produits à adapter</button></p><p><button class="w" data-k="g08-intraspinal">Formes intrarachidiennes : la rareté interdit la copie automatique</button></p><div class="key"><b>À retenir.</b> Population et territoire précèdent la dose ; une exclusion de code ou une lacune de littérature n’autorise pas à négliger une fonction menacée.</div><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button> · <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button></p></section><section class="ilot" id="g08-suisse"><h2>Prévention et questions suisses : vérifier chaque droit et obligation</h2><p>Le protocole local Spital Thurgau rappelle le danger de thrombose septique lié à une infection faciale. La prévention pratique repose sur la reconnaissance et le traitement du foyer, la réévaluation de l’aggravation et le suivi spécialisé lorsque nécessaire. L’antibiothérapie d’une affection superficielle ne devient pas une prévention garantie de toute complication ; une extension peut nécessiter un autre niveau de soins.</p><p>Les sources lues ne définissent pas un régime unique de déclaration, de remboursement ou d’aptitude à la conduite pour tout G08. Les obligations peuvent dépendre de l’agent ou de la maladie causale. Assurance, liste des spécialités, moyens auxiliaires, assurance-invalidité et reprise de conduite doivent être vérifiés individuellement avec les professionnels compétents. L’absence de règle établie dans ce dossier ne prouve ni absence d’obligation ni absence de prise en charge.</p><p>Les documents de classification sont les versions 2024 ; les objectifs PROFILES utilisés sont ceux de 2017 et leur rapprochement avec ce cours est pédagogique. Ni une fenêtre de médicament ni un code ne constitue une décision d’assureur, d’autorité ou d’aptitude professionnelle.</p><div class="key"><b>À retenir.</b> Nommer la question administrative et son interlocuteur ; ne pas promettre une prise en charge ou une aptitude sur le seul code G08.</div><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button> · <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r10">[10]</button> · <button class="w" data-k="g08-r14">[14]</button></p></section><section class="ilot" id="g08-criteres"><h2>Critères formels et paramètres clés</h2><div class="alert"><b>Critères formels.</b> Aucun score universel validé de tout G08 n’est établi dans les lectures. Documenter la thrombose ou l’atteinte veineuse, son territoire, le caractère septique probable ou confirmé, le foyer et les preuves disponibles. L’imagerie et les prélèvements se confrontent à la clinique. Une culture négative ou un résultat de D-dimères ne suffit pas seul à exclure ; un score pronostique de toutes thromboses ne prouve pas le caractère infectieux.</div><div class="key"><b>À retenir.</b> G08 sans subdivision ; formes non pyogènes et obstétricales distinguées. Phase d’entretien du guide général : au moins trois mois, cadre trois à douze mois individualisé. Dose thérapeutique, prophylaxie et durée antibiotique sont des notions différentes. Clairance rénale et unités sont propres à chaque spécialité ; la borne 50 ml/min de Pradaxa n’est pas harmonisée de mémoire.</div><button class="pareto-btn ui" data-k="pareto-g08-clinique">▲ Loi de Pareto — Les décisions à retenir</button><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button> · <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button> · <button class="w" data-k="g08-r14">[14]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="g08-e-imagerie"><h2>Imagerie veineuse et foyer : deux questions à couvrir</h2><p><button class="w" data-k="g08-imagerie">Pourquoi une imagerie non adaptée peut laisser la question ouverte</button></p><p>L’imagerie cherche aussi collection, lésion parenchymateuse, saignement de congestion et menace mécanique. Une infection du sinus ou de la mastoïde n’est pas une simple décoration de l’image : elle peut changer prélèvement, drainage et durée anti-infectieuse. La lecture doit donc répondre à une question de territoire et à une question de foyer.</p><div class="key"><b>À retenir.</b> Demander une exploration adaptée au système veineux et au foyer ; une modalité ne répond pas à toutes les questions par son seul nom.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section><section class="ilot" id="g08-e-prelevements"><h2>Microbiologie : préparer un prélèvement qui peut changer le traitement</h2><p><button class="w" data-k="g08-prelevement">Ce que prouve un prélèvement du sang ou du foyer</button></p><p>Relier le résultat à la question : un agent dans le sang, un foyer purulent et une thrombose sur l’image sont des niveaux de preuve complémentaires. Une culture négative ne suffit pas à effacer une cohérence clinique et radiologique forte ; un germe isolé hors du territoire ne dispense pas de vérifier cette cohérence.</p><div class="key"><b>À retenir.</b> Question, sécurité, heure et conditions d’envoi précèdent le prélèvement ; son résultat doit pouvoir modifier une décision.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r7">[7]</button></p></section><section class="ilot" id="g08-e-ddimere"><h2>D-dimères : ne pas utiliser un résultat pour rassurer à tort</h2><p><button class="w" data-k="g08-ddimere">Pourquoi le test ne remplace pas l’imagerie devant une suspicion septique</button></p><p>Les bilans biologiques servent aussi à préparer et surveiller le traitement : hémogramme, plaquettes, rein, foie et paramètres adaptés au médicament choisi. Les tests globaux de coagulation ne surveillent pas correctement tous les anticoagulants. L’interprétation doit préciser produit, heure de dernière prise, question et méthode du laboratoire.</p><div class="key"><b>À retenir.</b> Un test négatif ne prend pas la place d’une imagerie indiquée ni de la surveillance spécifique du produit.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section><section class="ilot" id="g08-e-differentiel"><h2>Syndrome orbitaire ou caverneux : comparer les hypothèses</h2><p><button class="w" data-k="g08-differentiel">Cellulite orbitaire et thrombose caverneuse peuvent se ressembler</button></p><p><button class="w" data-k="g08-vitt">Les thromboses non pyogènes gardent un autre raisonnement causal</button></p><table class="t"><thead><tr><th>Hypothèse</th><th>Éléments à confronter</th><th>Piège</th></tr></thead><tbody><tr><td>Thrombose septique caverneuse</td><td>Foyer, évolution, atteinte des nerfs et exploration du sinus.</td><td>Attendre bilatéralité ou tous les signes classiques.</td></tr><tr><td>Cellulite orbitaire</td><td>Territoire de l’infection et recherche d’extension.</td><td>Croire que le premier diagnostic exclut une complication intracrânienne.</td></tr><tr><td>Autre lésion caverneuse</td><td>Imagerie, chronologie et contexte infectieux/inflammatoire.</td><td>Donner des corticoïdes sur un seul nom de syndrome sans évaluer infection.</td></tr><tr><td>Thrombose non pyogène</td><td>Facteurs de risque et preuve causale.</td><td>La coder automatiquement G08 ou omettre un foyer réel.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Chercher les discordances et les complications associées ; un diagnostic initial ne doit pas fermer une évolution nouvelle.</div><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section><section class="ilot" id="g08-e-cas"><h2>Cinq cas pour relier le signe, la preuve et la décision</h2><p>Ces cas sont fictifs. Ils entraînent les situations PROFILES 2017 de céphalée, déficit aigu, trouble cognitif, parésie, sensibilité et crise ; ce rapprochement est pédagogique, sans nouvelle table fédérale officielle.</p><div class="quiz ui" id="g08-q1"><p><b>Cas pédagogique fictif 1.</b> Une infection sinusienne s’accompagne de diplopie et de baisse visuelle. Quelle priorité ?</p><button data-ok="0">Attendre une atteinte du second œil pour évoquer une complication.</button><button data-ok="1">Organiser une évaluation urgente et une imagerie adaptée au sinus veineux, à l’orbite et au foyer.</button><p class="fb" hidden>La thrombose peut débuter unilatéralement ; vision et nerfs menacés imposent une démarche rapide.</p></div><div class="quiz ui" id="g08-q2"><p><b>Cas pédagogique fictif 2.</b> Une personne fébrile présente céphalée et déficit nouveau, avec des D-dimères dits normaux. Que conclure ?</p><button data-ok="0">Le résultat exclut une thrombose veineuse septique.</button><button data-ok="1">La suspicion clinique peut encore justifier l’imagerie veineuse.</button><p class="fb" hidden>Le guide ne recommande pas les D-dimères en routine pour exclure la thrombose ; le tableau n’est pas une céphalée isolée de faible probabilité.</p></div><div class="quiz ui" id="g08-q3"><p><b>Cas pédagogique fictif 3.</b> Une thrombose veineuse s’accompagne d’un saignement de congestion. Quelle lecture est juste ?</p><button data-ok="0">Toute héparine est automatiquement interdite dans toutes les circonstances.</button><button data-ok="1">Confronter le guide, la cause du saignement, le produit et les risques avec l’équipe spécialisée.</button><p class="fb" hidden>Le guide recommande l’anticoagulation malgré une hémorragie veineuse de congestion ; les restrictions d’une spécialité et les gestes restent à arbitrer.</p></div><div class="quiz ui" id="g08-q4"><p><b>Cas pédagogique fictif 4.</b> Le sinus n’est pas totalement recanalisé alors que le patient s’améliore. Faut-il prolonger sans autre argument ?</p><button data-ok="0">Oui, jusqu’à normalisation de chaque image.</button><button data-ok="1">Non : réévaluer fonction, foyer, récidive et tolérance avant la décision.</button><p class="fb" hidden>La recanalisation n’est pas une mesure autonome de guérison et ne justifie pas seule une poursuite indéfinie.</p></div><div class="quiz ui" id="g08-q5"><p><b>Cas pédagogique fictif 5.</b> La clairance est exactement à une frontière partagée par deux paragraphes de notice. Quelle méthode ?</p><button data-ok="0">Arrondir librement pour choisir la dose la plus simple.</button><button data-ok="1">Vérifier le produit et faire résoudre la frontière avec pharmacie et prescripteur.</button><p class="fb" hidden>La borne 50 ml/min de Pradaxa est partagée dans les libellés lus ; aucune harmonisation silencieuse ou dose cérébrale validée n’est inventée.</p></div><button class="pareto-btn ui" data-k="pareto-g08-examens">▲ Loi de Pareto — Chaque examen doit répondre à une question</button><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r6">[6]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button> · <button class="w" data-k="g08-r14">[14]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="g08-tab-semio" role="tab" aria-selected="true" aria-controls="g08-s-semio" data-s="g08-s-semio">Sémiologie fondamentale et analytique</button><button id="g08-tab-anat" role="tab" aria-selected="false" aria-controls="g08-s-anat" data-s="g08-s-anat">Anatomie</button><button id="g08-tab-physio" role="tab" aria-selected="false" aria-controls="g08-s-physio" data-s="g08-s-physio">Physiologie</button><button id="g08-tab-biochim" role="tab" aria-selected="false" aria-controls="g08-s-biochim" data-s="g08-s-biochim">Biochimie et hémostase</button><button id="g08-tab-micro" role="tab" aria-selected="false" aria-controls="g08-s-micro" data-s="g08-s-micro">Microbiologie</button><button id="g08-tab-pk" role="tab" aria-selected="false" aria-controls="g08-s-pk" data-s="g08-s-pk">Pharmacologie et exposition</button></div><div class="chap-body sci-body"><div class="sci" id="g08-s-semio" role="tabpanel" aria-labelledby="g08-tab-semio"><section class="ilot" id="g08-s-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>La sémiologie part d’une fonction habituelle, décrit une perturbation puis recherche le territoire et le mécanisme. Normalement, vision, motilité des yeux, langage, vigilance et mouvements permettent une activité adaptée au contexte du patient. L’examen doit être comparé à l’état antérieur et aux asymétries anciennes. Une gêne nouvelle ne se réduit pas au mot « neurologique » : il faut dire ce qui a changé et quand.</p><p>Une obstruction veineuse et une infection peuvent altérer la fonction par congestion, inflammation, atteinte des nerfs ou lésion parenchymateuse. La clinique localise une fonction menacée ; l’image et les prélèvements précisent la maladie. Le normal ne se limite pas à une température ou à une valeur biologique : un résultat de laboratoire rassurant ne remplace pas la fonction réelle.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r9">[9]</button> · <button class="w" data-k="g08-r13">[13]</button></p></section><section class="ilot" id="g08-s-signs" data-semiology="signs"><h3>Décrire les signes élémentaires avant de les regrouper</h3><p>Décrire douleur périorbitaire, gonflement, chémosis, modification de vision et limitation du mouvement de chaque œil. Préciser diplopie, côté, début et changement. Le caractère bilatéral peut apparaître secondairement et n’est pas requis pour commencer la recherche. La réduction d’acuité et l’atteinte de la motilité sont des fonctions différentes, à documenter séparément.</p><p>Rechercher céphalée, vomissements, crise, faiblesse, trouble du langage et vigilance. La distribution du déficit et la vitesse d’évolution modifient la priorité. Un signe isolé ne fournit pas la cause ; le regroupement doit rester confronté au foyer et au territoire de thrombose.</p><p>Sources : <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section><section class="ilot" id="g08-s-mechanisms" data-semiology="mechanisms"><h3>Relier drainage, congestion et fonction</h3><p>L’obstruction du drainage peut augmenter la pression veineuse, diminuer la résorption du liquide céphalorachidien et produire une hypertension intracrânienne. Une lésion parenchymateuse peut donner déficit et crise ; une atteinte profonde ou étendue peut s’accompagner d’encéphalopathie. Ces syndromes peuvent se combiner.</p><p>Dans le territoire caverneux, la congestion orbitaire et l’atteinte de nerfs expliquent les signes oculaires. La présence d’une infection ajoute une question de foyer et d’agent. La chaîne utile relie mécanisme, fonction, signe et examen, sans sauter directement de diplopie à une molécule ou de fièvre à un code.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section><section class="ilot" id="g08-s-examination" data-semiology="examination"><h3>Faire un examen mesurable et répétable</h3><p>Commencer par stabilité et vigilance, puis tester vision de chaque œil, pupilles, motilité, langage et motricité selon le tableau. Décrire ce qui est mesuré et ce qui ne peut pas être évalué à cause de douleur, œdème, coopération ou sédation. Noter heure et conditions afin que le contrôle suivant puisse être comparé.</p><p>La force se grade de 0à 5 en isolant le mouvement et en évitant les compensations. Le territoire et le côté accompagnent le chiffre. L’examen recherche autant une nouvelle perte de fonction qu’une amélioration. Une modification de vision ou de conscience ne doit pas attendre une date de contrôle arbitraire.</p><p>Sources : <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r9">[9]</button> · <button class="w" data-k="g08-r13">[13]</button></p></section><section class="ilot" id="g08-s-interpretation" data-semiology="interpretation"><h3>Confronter le signe à l’image et à la cause</h3><p>Une motilité anormale ou une baisse visuelle ne différencie pas seule cellulite orbitaire et thrombose caverneuse. La suspicion doit orienter une imagerie qui explore aussi le sinus. Une thrombose visible, un foyer infectieux et un germe isolé apportent des niveaux de preuve distincts, à relier explicitement.</p><p>L’absence de culture positive ne suffit pas à exclure une forme septique. Un résultat de D-dimères ne remplace pas une imagerie indiquée. Une recanalisation ne mesure pas à elle seule le bénéfice clinique. L’interprétation doit préciser ce qui est établi, probable et encore discuté.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r6">[6]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section><section class="ilot" id="g08-s-differentials" data-semiology="differentials"><h3>Chercher ce qui explique mieux le tableau</h3><p>Cellulite orbitaire, autre lésion caverneuse, complication infectieuse associée et thrombose non pyogène doivent être distinguées. Une collection, une atteinte artérielle ou une lésion parenchymateuse peut coexister avec le thrombus. Le premier diagnostic ne doit pas faire ignorer un changement de trajectoire.</p><p>Sous traitement, une complication hémorragique ou une toxicité médicamenteuse peut aussi modifier l’examen. Rein, produits et heures de prise sont alors réévalués en parallèle de l’infection. Une confusion nouvelle n’autorise pas à choisir une seule cause sans examen et preuves complémentaires.</p><p>Sources : <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button> · <button class="w" data-k="g08-r9">[9]</button> · <button class="w" data-k="g08-r12">[12]</button></p></section><section class="ilot" id="g08-s-urgency" data-semiology="urgency"><h3>Reconnaître le signe qui change immédiatement l’organisation</h3><p>Baisse de vision, dégradation de vigilance, crise persistante, déficit progressif et menace mécanique imposent une évaluation urgente. Stabilisation, exploration veineuse, prise en charge du foyer et avis spécialisé avancent selon la gravité. Une infection compliquée ne doit pas être réduite à un tableau de faible probabilité sur un seul test négatif.</p><p>Le risque de masse et le traitement anticoagulant changent la sécurité des gestes, notamment d’une ponction. Le besoin de preuve n’autorise pas un prélèvement dangereux. Le calendrier des gestes et de l’anticoagulation se décide avec l’équipe et les notices des produits.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r7">[7]</button></p></section><section class="ilot" id="g08-s-limits" data-semiology="limits"><h3>Conserver les limites de l’examen et des études</h3><p>Œdème, douleur, fatigue et coopération peuvent limiter une mesure. Le noter permet de ne pas confondre différence de méthode et évolution de la maladie. Les valeurs normales et les tests biologiques dépendent aussi de leur méthode ; un seuil non validé pour G08 n’est pas inventé.</p><p>Les séries septiques sont petites et hétérogènes ; les recommandations générales concernent toutes thromboses veineuses cérébrales. Ni sensibilité universelle d’un signe ni score global d’exclusion de G08 n’est établi dans les lectures. Enfant, grossesse et territoire intrarachidien ne sont pas des copies du patient adulte crânien.</p><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button> · <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r6">[6]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section><section class="ilot" id="g08-s-sources" data-semiology="sources"><h3>Sources de la sémiologie et portée réelle des lectures</h3><p>La série européenne de thrombose septique décrit les signes orbitaires, les nerfs, le différentiel et les complications. Le guide DGN apporte les décisions générales d’imagerie et de prise en charge, en indiquant que l’infection exige son traitement propre. Le manuel du Medical Research Council décrit la force et sa méthode. Les fenêtres donnent les versions, passages et limites, sans prétendre à une validation humaine.</p><p><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6096574/" target="_blank" rel="noopener noreferrer">Série européenne de thrombose septique du sinus caverneux</a> · <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11027218/" target="_blank" rel="noopener noreferrer">Guide de consensus de thrombose veineuse cérébrale</a></p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r9">[9]</button> · <button class="w" data-k="g08-r13">[13]</button></p></section><figure id="g08-science-links-semio"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g08-diag-semio"><title id="g08-diag-semio">Fonction habituelle puis Signe nouveau puis Décision adaptée</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Fonction habituelle</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Signe nouveau</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Décision adaptée</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Fonction vers signe</td><td>Congestion, lésion ou atteinte d’un nerf peut perturber une fonction ; le signe doit être décrit précisément.</td></tr><tr><td>Signe vers décision</td><td>L’évolution change l’urgence ; clinique, imagerie, foyer et preuves sont confrontés.</td></tr></tbody></table></figure><p><b>Science → clinique.</b> Le signe localise une fonction, pas seul un agent.</p><p><b>Science → examen.</b> Comparer des mesures répétées à l’imagerie et au foyer.</p><p><b>Science → traitement.</b> La gravité peut imposer d’agir avant une preuve finale, avec des prélèvements sûrs.</p><div class="key"><b>À retenir.</b> Relier fonction normale, perturbation, signe, examen et décision en gardant les limites des preuves.</div></div><div class="sci" id="g08-s-anat" role="tabpanel" aria-labelledby="g08-tab-anat" hidden><section class="ilot" id="g08-s-anat-body"><h2>Enveloppes et sinus : du repère normal à l’image du patient</h2><p>Le sinus sagittal supérieur visible dans l’original Gray 1196 appartient au système veineux intracrânien. Le dessin humain historique montre ses rapports avec les enveloppes, notamment la dure-mère, l’arachnoïde et la pie-mère. Il permet de nommer des plans ; il ne représente ni le sinus caverneux ni une thrombose du patient. Un repère normal n’est pas une carte opératoire.</p><figure><img src="assets/img/g08/alpha/codex/Gray1196.png" alt="Enveloppes méningées normales et sinus sagittal supérieur" loading="lazy"><figcaption>Enveloppes méningées normales et sinus sagittal supérieur. Gray, Anatomy of the Human Body,1918, illustrations attribuées à Henry Vandyke Carter ; domaine public. Original humain historique normal, pixels inchangés. Annotations françaises ajoutées dans le tableau adjacent ; pixels conservés.</figcaption><table class="t"><thead><tr><th>Repère de l’original</th><th>Annotation française et portée clinique</th></tr></thead><tbody><tr><td>Dura mater</td><td>Dure-mère : enveloppe repérée dans l’original et rapport avec le sinus.</td></tr><tr><td>Arachnoid</td><td>Arachnoïde : plan distinct de la dure-mère et de la pie-mère.</td></tr><tr><td>Pia mater</td><td>Pie-mère : enveloppe au contact de la surface cérébrale dans cette coupe.</td></tr><tr><td>Superior sagittal sinus</td><td>Sinus sagittal supérieur : repère veineux normal ; ce n’est pas le sinus caverneux.</td></tr></tbody></table></figure><p>Dans le territoire caverneux, la série clinique précise que le nerf VI chemine dans le sinus, tandis que les autres nerfs cités sont en rapport avec la paroi latérale. Les branches V1 et V2 ne doivent pas être remplacées par le mot imprécis « tout le nerf V ». La congestion orbitaire et les rapports avec les veines ophtalmiques expliquent pourquoi vision et mouvements oculaires font partie de l’examen.</p><p>L’IRM originale ci-dessous provient de la série de données cliniques anonymisées de 2018. La légende décrit des défauts de remplissage bilatéraux des sinus caverneux et une opacification sphénoïdale bilatérale. L’âge du patient n’est pas précisé ; aucun âge n’est inféré. Les flèches rouges sont celles de la publication, sans modification des pixels ni ajout d’une anatomie par IA.</p><figure><img src="assets/img/g08/alpha/codex/Cavernous2018.jpg" alt="IRM avec contraste : défauts de remplissage caverneux décrits dans la source" loading="lazy"><figcaption>IRM avec contraste : défauts de remplissage caverneux décrits dans la source. Van der Poel et coll., European Archives of Oto-Rhino-Laryngology,2018, figure 1 ; <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">Creative Commons Attribution 4.0</a>. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6096574/" target="_blank" rel="noopener noreferrer">Source : figure 1 de la publication</a>. IRM clinique d’une série de données anonymisées, original humain, pixels et flèches de source inchangés. Âge du patient non précisé par la légende. Annotations françaises ajoutées dans le tableau adjacent ; pixels conservés.</figcaption><table class="t"><thead><tr><th>Repère de l’original</th><th>Annotation française et portée clinique</th></tr></thead><tbody><tr><td>Flèche rouge à gauche de l’image</td><td>Défaut de remplissage d’un sinus caverneux selon la légende ; aucun côté anatomique n’est déduit sans repère latéral explicite.</td></tr><tr><td>Flèche rouge à droite de l’image</td><td>Défaut de remplissage controlatéral décrit par les auteurs ; la figure illustre une atteinte bilatérale.</td></tr><tr><td>Région sphénoïdale de la coupe</td><td>La légende rapporte une opacification sphénoïdale bilatérale ; confronter foyer et extension sur l’examen complet.</td></tr><tr><td>Image pondérée T1 après contraste</td><td>La séquence et la légende sont celles de la publication ; cette coupe seule n’est ni un examen complet ni une preuve autonome du germe.</td></tr></tbody></table></figure><p>Le lien anatomique éclaire une hypothèse, mais les rapports réels, l’étendue et les complications se lisent sur l’imagerie complète du patient. Les autres sinus et les veines corticales ou profondes peuvent donner des syndromes différents. Les formes intrarachidiennes ont encore un autre territoire ; aucun trajet opératoire ou seuil de sécurité n’est tiré des deux figures.</p><figure id="g08-science-links-anat"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g08-diag-anat"><title id="g08-diag-anat">Territoire veineux puis Atteinte localisée puis Fonction à tester</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Territoire veineux</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Atteinte localisée</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Fonction à tester</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Territoire vers atteinte</td><td>La localisation réelle est établie par l’imagerie ; l’original normal sert au vocabulaire.</td></tr><tr><td>Atteinte vers examen</td><td>Vision, nerfs, déficit et vigilance sont testés selon les rapports et les lésions du patient.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Nommer précisément le sinus et les rapports ; l’anatomie normale et la coupe clinique ne remplacent pas l’examen complet.</div><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r9">[9]</button> · <button class="w" data-k="g08-r15">[15]</button></p></section><p><b>Science → clinique.</b> Les rapports du sinus et des nerfs expliquent des signes possibles.</p><p><b>Science → examen.</b> La figure normale donne un vocabulaire ; l’image complète du patient localise réellement.</p><p><b>Science → traitement.</b> Le territoire et les foyers orientent geste et contrôle de l’infection, sans choisir seuls la molécule.</p><div class="key"><b>À retenir.</b> Relier fonction normale, perturbation, signe, examen et décision en gardant les limites des preuves.</div></div><div class="sci" id="g08-s-physio" role="tabpanel" aria-labelledby="g08-tab-physio" hidden><section class="ilot" id="g08-s-physio-body"><h2>Drainage veineux, pression et lésion : comprendre les syndromes</h2><p>Le drainage veineux permet au sang de quitter les territoires cérébraux. La revue décrit l’obstruction thrombotique des sinus et des veines comme un mécanisme de pression veineuse accrue et de résorption moins efficace du liquide céphalorachidien. L’hypertension intracrânienne peut alors s’exprimer par céphalée, troubles visuels, vomissements et œdème papillaire. Ces signes doivent être confrontés aux autres fonctions et à l’imagerie.</p><p>La congestion peut s’accompagner de lésion parenchymateuse, d’œdème ou de saignement veineux. Un déficit focal et une crise n’ont donc pas exactement le même mécanisme qu’une hypertension isolée, même s’ils coexistent. Une atteinte profonde ou très étendue peut produire une encéphalopathie. La vitesse de changement et le territoire expliquent pourquoi le simple volume d’un thrombus ne résume pas l’urgence.</p><p>Le guide recommande l’héparine même en cas de saignement intracrânien lié à la congestion, car l’objectif est notamment de limiter la propagation thrombotique. Cela ne signifie pas que toute hémorragie possède le même rapport bénéfice-risque ou que toutes les spécialités peuvent être utilisées sans examiner leurs contre-indications. La physiologie explique une recommandation ; elle ne dispense pas de la notice et du jugement du centre.</p><table class="t"><thead><tr><th>Mécanisme</th><th>Observation recherchée</th><th>Décision</th></tr></thead><tbody><tr><td>Drainage obstrué et pression augmentée</td><td>Céphalée, vision, vigilance et complications sur l’image.</td><td>Imagerie adaptée et surveillance selon gravité.</td></tr><tr><td>Lésion parenchymateuse ou congestion hémorragique</td><td>Déficit, crise et extension.</td><td>Arbitrer anticoagulation et menace mécanique.</td></tr><tr><td>Foyer infectieux persistant</td><td>Évolution, prélèvements et contrôle du foyer.</td><td>Adapter l’anti-infectieux et discuter drainage.</td></tr></tbody></table><p>La recanalisation est une information de suivi, pas une garantie de récupération. La revue otogène ne démontre pas une relation clinique causale universelle entre les deux. Le suivi doit conserver l’état fonctionnel, la maîtrise du foyer et les effets des traitements, au lieu de réduire la guérison à la perméabilité d’un seul segment veineux.</p><figure id="g08-science-links-physio"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g08-diag-physio"><title id="g08-diag-physio">Drainage perturbé puis Congestion et lésion puis Fonction à surveiller</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Drainage perturbé</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Congestion et lésion</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Fonction à surveiller</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Drainage vers lésion</td><td>Pression, œdème et saignement veineux peuvent expliquer des syndromes différents.</td></tr><tr><td>Lésion vers décision</td><td>L’évolution de vision, vigilance et déficit change la priorité ; recanalisation et fonction sont distinguées.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Le mécanisme veineux éclaire la conduite, mais le suivi porte sur le patient et l’infection autant que sur l’image.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r6">[6]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section><p><b>Science → clinique.</b> Congestion et lésion peuvent perturber vision, motricité ou conscience.</p><p><b>Science → examen.</b> La dynamique clinique et l’image permettent de rechercher une menace.</p><p><b>Science → traitement.</b> L’hémorragie de congestion se raisonne avec le guide et les restrictions du produit.</p><div class="key"><b>À retenir.</b> Relier fonction normale, perturbation, signe, examen et décision en gardant les limites des preuves.</div></div><div class="sci" id="g08-s-biochim" role="tabpanel" aria-labelledby="g08-tab-biochim" hidden><section class="ilot" id="g08-s-biochim-body"><h2>Coagulation et cibles : anticoaguler ne signifie pas désinfecter</h2><p>La FI du dabigatran décrit la conversion du fibrinogène en fibrine par la thrombine. Le dabigatran étexilate est une prodrogue transformée en dabigatran ; celui-ci inhibe directement et de façon réversible la thrombine. Cela limite des étapes de formation du caillot. Le nom et la masse de la capsule désignent le dabigatran étexilate du produit, sans conversion improvisée vers une autre substance ou formulation.</p><p>L’énoxaparine présente une activité surtout anti-Xa et une activité anti-IIa plus faible, régulées par l’antithrombine selon sa notice. Elle ne se lit pas comme un nombre d’unités d’héparine non fractionnée ni comme une autre héparine de bas poids moléculaire. Les masses, activités et présentations doivent rester distinctes. Une dose prophylactique fixe et une dose thérapeutique pondérale ne répondent pas à la même question.</p><p>La revue générale relie thrombose à dysfonction endothéliale, changement du flux et état procoagulant. Une infection peut participer à cet ensemble, sans que le mécanisme suffise à identifier un germe. Un anticoagulant n’est ni un antibiotique ni un drainage. La fibrinolyse propre à l’organisme et la limitation de l’extension thrombotique expliquent pourquoi l’anticoagulation n’est pas identique à une procédure de recanalisation.</p><table class="t"><thead><tr><th>Niveau</th><th>Relation vérifiée</th><th>Limite clinique</th></tr></thead><tbody><tr><td>Thrombine</td><td>Participe à la conversion fibrinogène-fibrine ; cible du dabigatran.</td><td>La cible ne valide pas une indication G08 de la FI.</td></tr><tr><td>Facteur Xa et antithrombine</td><td>Activité antithrombotique de l’énoxaparine selon le produit.</td><td>Unités et spécialités non interchangeables.</td></tr><tr><td>Infection et thrombus</td><td>Le foyer et la réaction de l’hôte peuvent favoriser la thrombose.</td><td>Anticoaguler ne stérilise pas le foyer.</td></tr></tbody></table><p>Les tests usuels de coagulation ne résument pas tous ces mécanismes. La FI Clexane indique que les tests globaux ne permettent pas une surveillance utile de son effet ; Pradaxa nécessite une lecture spécifique des tests et du moment de prélèvement. Le rapport international normalisé utilisé pour certains traitements ne doit pas être repris comme une mesure quantitative universelle du dabigatran. Aucun seuil global d’arrêt ou de sécurité n’est inventé.</p><figure id="g08-science-links-biochim"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g08-diag-biochim"><title id="g08-diag-biochim">Cible de coagulation puis Exposition du produit puis Effet et surveillance</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Cible de coagulation</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Exposition du produit</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Effet et surveillance</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Cible vers exposition</td><td>Molécule, unité, voie et organes déterminent une partie de l’exposition, pas seulement le mécanisme.</td></tr><tr><td>Exposition vers effet</td><td>Réponse et saignement sont surveillés ; la même valeur biologique ne mesure pas tous les produits.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Relier la cible à la bonne unité, au bon produit et au bon test ; garder la cause infectieuse comme question distincte.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section><p><b>Science → clinique.</b> Une cible de coagulation n’est pas une cible microbienne.</p><p><b>Science → examen.</b> Les tests s’interprètent avec molécule et heure de prise.</p><p><b>Science → traitement.</b> Unité, activité et spécialité ne sont pas interchangeables.</p><div class="key"><b>À retenir.</b> Relier fonction normale, perturbation, signe, examen et décision en gardant les limites des preuves.</div></div><div class="sci" id="g08-s-micro" role="tabpanel" aria-labelledby="g08-tab-micro" hidden><section class="ilot" id="g08-s-micro-body"><h2>Foyer, agent et prélèvement : documenter la cause</h2><p>La série septique décrit des agents différents selon les foyers et les patients. Des streptocoques, un staphylocoque, Fusobacterium et un champignon sont rapportés ; plusieurs cultures restent négatives. Une petite série ne définit ni l’écologie de tout un pays ni un agent obligatoire. Le foyer ORL, facial, dentaire ou pharyngé et le terrain orientent la probabilité et les prélèvements.</p><p>La recherche microbiologique doit être préparée avec l’équipe qui traite le foyer. Sang, matériel de drainage et autre prélèvement accessible répondent à des questions différentes. Une culture positive peut permettre l’adaptation à la sensibilité ; un résultat négatif peut être limité par le traitement préalable, la qualité ou la disponibilité du matériel. Le contexte et l’image ne disparaissent pas sur un test isolé.</p><p>La série utilise des antibiotiques intraveineux adaptés à l’agent attendu ou retrouvé, avec discussion microbiologique de la durée. La couverture des staphylocoques, streptocoques, germes à Gram négatif et anaérobies dépend de la situation, des résistances et des produits. La présence d’un antibiotique dans un cas publié ne prouve pas son adéquation pour un autre agent ou une autre personne. Une suspicion fongique exige une stratégie spécifique, pas l’addition automatique de tous les médicaments cités.</p><table class="t"><thead><tr><th>Information</th><th>Ce qu’elle apporte</th><th>Ce qu’elle ne remplace pas</th></tr></thead><tbody><tr><td>Foyer clinique et image</td><td>Territoire à explorer ou à drainer.</td><td>Identification et sensibilité de l’agent.</td></tr><tr><td>Culture ou test adapté</td><td>Preuve et possibilité d’adapter.</td><td>Évaluation du contrôle mécanique du foyer.</td></tr><tr><td>Culture négative</td><td>Limite ou absence de documentation dans ce prélèvement.</td><td>Exclusion automatique de toute forme septique.</td></tr></tbody></table><p>Le contrôle du foyer peut être aussi important que le choix de molécule. Une collection persistante ou une extension peut maintenir le problème malgré un antibiotique théoriquement actif. L’adaptation du traitement doit donc se faire avec les informations microbiologiques, cliniques et opératoires, en conservant ce qui reste incertain. Le protocole d’une infection superficielle n’est pas un substitut de cette démarche.</p><figure id="g08-science-links-micro"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g08-diag-micro"><title id="g08-diag-micro">Foyer suspect puis Preuve et sensibilité puis Traitement adapté</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Foyer suspect</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Preuve et sensibilité</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Traitement adapté</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Foyer vers preuve</td><td>Choisir un prélèvement utile et sûr ; un résultat dépend de sa qualité et du contexte.</td></tr><tr><td>Preuve vers traitement</td><td>Adapter la couverture tout en vérifiant drainage et complications ; pas d’agent universel.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Documenter le foyer et l’agent sans confondre probabilité, preuve et contrôle de l’infection.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r6">[6]</button> · <button class="w" data-k="g08-r10">[10]</button> · <button class="w" data-k="g08-r11">[11]</button> · <button class="w" data-k="g08-r12">[12]</button></p></section><p><b>Science → clinique.</b> Le foyer et le terrain modifient les probabilités d’agent.</p><p><b>Science → examen.</b> Prélèvements et image apportent des niveaux complémentaires de preuve.</p><p><b>Science → traitement.</b> Adapter à la sensibilité tout en contrôlant le foyer.</p><div class="key"><b>À retenir.</b> Relier fonction normale, perturbation, signe, examen et décision en gardant les limites des preuves.</div></div><div class="sci" id="g08-s-pk" role="tabpanel" aria-labelledby="g08-tab-pk" hidden><section class="ilot" id="g08-s-pk-body"><h2>Produit, rein et gestes : sécuriser une exposition</h2><p>L’exposition dépend de la dose, du produit, des fonctions d’organe, des interactions et du calendrier. Une dose correcte au début peut devenir inadaptée si le rein change ou si une procédure devient nécessaire. Le guide préfère l’héparine non fractionnée dans certaines situations interventionnelles ou rénales ; la FI Clexane décrit aussi un tableau d’adaptation rénale. Il faut confronter les deux portées au lieu de les fusionner.</p><p>Pradaxa est une capsule de prodrogue à ne pas ouvrir. La FI donne des règles de clairance et d’âge, mais ne nomme pas la thrombose veineuse cérébrale comme indication. La borne 50 ml/min apparaît dans deux paragraphes de plages partagées ; elle n’est pas arrondie de mémoire. La diminution de dose décrite pour thrombose extracrânienne n’est pas, à elle seule, une dose validée d’entretien d’un G08.</p><p>Les antibiotiques ont aussi leurs limites. La ceftriaxone possède un seuil rénal et un maximum particuliers dans la FI consultée. Le métronidazole peut produire des signes neurologiques qui ressemblent à une complication ; sa prolongation exceptionnelle demande une justification et une surveillance. Le choix clinique d’un traitement prolongé ne fait pas disparaître les précautions du produit.</p><table class="t"><thead><tr><th>Question de sécurité</th><th>Conséquence</th><th>Vérification</th></tr></thead><tbody><tr><td>Fonction rénale modifiée</td><td>Exposition et risque de saignement ou toxicité peuvent changer.</td><td>Produit exact et clairance selon la méthode applicable.</td></tr><tr><td>Geste ou ponction prévu</td><td>Calendrier anticoagulant et risque neuraxial à coordonner.</td><td>Équipe compétente, notice et protocole ; pas délai universel.</td></tr><tr><td>Symptôme nouveau sous traitement</td><td>Infection, saignement et toxicité peuvent être concurrents.</td><td>Examen, bilan adapté et révision de l’ordonnance.</td></tr></tbody></table><p>Le patient doit connaître les signes d’alarme et le contact en cas de saignement, nouvelle anomalie neurologique ou problème de prise. Le suivi peut montrer pourquoi une molécule continue, change ou s’arrête. Une ordonnance révisable garde indication, produit, unité, heure, durée prévue et surveillance, sans donner à une case de tableau la responsabilité de toute la décision.</p><figure id="g08-science-links-pk"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g08-diag-pk"><title id="g08-diag-pk">Produit exact puis Organes et gestes puis Surveillance adaptée</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Produit exact</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Organes et gestes</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Surveillance adaptée</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Produit vers contexte</td><td>Dose et unité ne suffisent pas sans organes, interactions et calendrier.</td></tr><tr><td>Contexte vers surveillance</td><td>Réévaluer exposition et risques lors d’un changement ; ni tableau rénal ni image ne décide seul.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Une prescription sûre reste vérifiable et révisable : produit, population, organes, gestes et surveillance.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button> · <button class="w" data-k="g08-r11">[11]</button> · <button class="w" data-k="g08-r12">[12]</button></p></section><p><b>Science → clinique.</b> Une exposition inadaptée peut modifier efficacité et toxicité.</p><p><b>Science → examen.</b> Revoir organes, gestes et traitements dès un changement.</p><p><b>Science → traitement.</b> Choisir produit et surveillance avec les contraintes réelles, sans conversion silencieuse.</p><div class="key"><b>À retenir.</b> Relier fonction normale, perturbation, signe, examen et décision en gardant les limites des preuves.</div><button class="pareto-btn ui" data-k="pareto-g08-sci">▲ Loi de Pareto — Du normal à la décision</button></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="g08-p-principes"><h2>Lire une prescription avec sa population et sa source</h2><p>Pour chaque traitement, préciser objectif, produit, substance, voie, dose par prise, intervalle, durée prévue et surveillance. Les pages suivantes expliquent les repères et les pièges des notices suisses lues ; elles ne constituent pas une ordonnance commune à tout G08. Le guide de thrombose et les données septiques fixent un cadre clinique, tandis que la FI décrit le produit et ses restrictions.</p><p>L’usage d’un médicament dans une indication non nommée par sa FI exige une décision spécialisée documentée. Une dose de thrombose veineuse profonde ou d’infection anaérobie ne devient pas automatiquement une dose validée de thrombophlébite intracrânienne. Rein, foie, grossesse, âge, allergies, médicaments associés et gestes sont vérifiés avant prescription puis lors des changements.</p><div class="key"><b>À retenir.</b> La source d’un chiffre doit permettre de retrouver le produit, la population et la situation clinique.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button> · <button class="w" data-k="g08-r11">[11]</button> · <button class="w" data-k="g08-r12">[12]</button></p></section><section class="ilot" id="g08-p-clexane"><h2>Clexane : dose thérapeutique et prophylaxie ne sont pas interchangeables</h2><p><button class="w" data-k="g08-clexane">Énoxaparine : le repère de la FI et ses limites</button></p><p><button class="w" data-k="g08-calcul">Calculer la masse par prise sans transformer l’exemple en ordonnance</button></p><div class="key"><b>À retenir.</b> Calculer par prise, puis vérifier le contexte et le produit ; le calcul juste ne suffit pas à rendre l’indication juste.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r7">[7]</button></p></section><section class="ilot" id="g08-p-rein"><h2>Rein et procédures : éviter un tableau universel</h2><p><button class="w" data-k="g08-renale">Quand le rein change le choix et la dose</button></p><p><button class="w" data-k="g08-neuraxial">Ponction et geste neuraxial : pas de délai valable pour toutes les molécules</button></p><div class="key"><b>À retenir.</b> Produit, méthode de clairance et geste doivent rester nommés ; une frontière ambiguë se vérifie, elle ne s’invente pas.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button></p></section><section class="ilot" id="g08-p-pradaxa"><h2>Pradaxa : un relais oral spécialisé, pas un substitut immédiat à l’héparine</h2><p><button class="w" data-k="g08-pradaxa">Dabigatran étexilate : indication de la FI et règles du produit</button></p><p><button class="w" data-k="g08-interactions">Interactions et surveillance : le médicament exact compte</button></p><div class="key"><b>À retenir.</b> Relais après stabilisation, capsule intacte, rein et interactions vérifiés ; aucune dose de FI extracrânienne ne devient une validation automatique de G08.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button></p></section><section class="ilot" id="g08-p-ceftriaxone"><h2>Ceftriaxone : un exemple de lecture de produit, pas un protocole unique</h2><p><button class="w" data-k="g08-ceftriaxone">Ceftriaxon Labatec : produit suisse et contexte clinique</button></p><div class="key"><b>À retenir.</b> Séparer choix anti-infectieux, dose de spécialité et durée liée au foyer ; ne pas inventer une indication ou une recette universelle.</div><p>Sources : <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r11">[11]</button></p></section><section class="ilot" id="g08-p-metro"><h2>Métronidazole : garder formulation et surveillance neurologique</h2><p><button class="w" data-k="g08-metronidazole">Metronidazole SINT i.v. : dose générale et limite de transposition</button></p><div class="key"><b>À retenir.</b> La neurologie sous traitement peut changer par infection, saignement ou toxicité ; ne pas attribuer tout symptôme au seul thrombus.</div><p>Sources : <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r12">[12]</button></p></section><section class="ilot" id="g08-p-suivi"><h2>Une ordonnance doit pouvoir être révisée</h2><p>Avant toute prolongation, vérifier foyer, réponse neurologique et visuelle, cultures disponibles, observance, toxicités et interactions. La décision précise ce qui motive le maintien de chaque molécule. Une autre présentation, une modification du rein ou un geste prochain peut rendre l’ordonnance initiale inadaptée. Une nouvelle anomalie clinique impose une réévaluation, sans attendre le contrôle d’imagerie prévu.</p><p>Les différences de guide et de notice restent visibles, en particulier pour les indications cérébrales non nommées, l’hémorragie de congestion, les fonctions d’organe et les durées. Aucun changement d’anticoagulant ou de dose n’est proposé sur la seule base d’un tableau partagé entre produits. L’information donnée au patient explique les signes d’alarme et les contacts.</p><button class="pareto-btn ui" data-k="pareto-g08-pharm">▲ Loi de Pareto — Produit, preuve et surveillance</button><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button> · <button class="w" data-k="g08-r11">[11]</button> · <button class="w" data-k="g08-r12">[12]</button></p></section><section class="ilot" id="g08-src"><h2>Sources réellement lues et portée des références</h2><p>Sources suisses prioritaires : notices exactes, classification française et protocole hospitalier local pour le risque facial. Le guide DGN compte une participation de la Société suisse de neurologie ; il renvoie le traitement antibiotique septique hors de son champ. Les séries et revues gardent leur population et leurs limites. La version longue du guide n’est pas présentée comme lue après un retour de page web au lieu du document attendu.</p><ol><li><button class="w" data-k="g08-r1">[1] BfArM : entrée G08 complète</button></li><li><button class="w" data-k="g08-r2">[2] OFS : libellés français officiels de G08 et exclusions</button></li><li><button class="w" data-k="g08-r3">[3] Recommandations DGN et consensus DACH : thrombose veineuse cérébrale</button></li><li><button class="w" data-k="g08-r4">[4] Registre AWMF 030-098 : version et validité</button></li><li><button class="w" data-k="g08-r5">[5] Van der Poel et coll. : série de thrombose septique du sinus caverneux</button></li><li><button class="w" data-k="g08-r6">[6] George et coll. : thrombose otogène du sinus sigmoïde et anticoagulation</button></li><li><button class="w" data-k="g08-r7">[7] Clexane : information professionnelle suisse</button></li><li><button class="w" data-k="g08-r8">[8] Pradaxa : information professionnelle suisse</button></li><li><button class="w" data-k="g08-r9">[9] Vellema, van de Munckhof et Coutinho : actualités sur la thrombose veineuse cérébrale</button></li><li><button class="w" data-k="g08-r10">[10] Spital Thurgau : antibiothérapie locale 2026 et infection faciale</button></li><li><button class="w" data-k="g08-r11">[11] Ceftriaxon Labatec : information professionnelle</button></li><li><button class="w" data-k="g08-r12">[12] Metronidazole SINT i.v. : information professionnelle</button></li><li><button class="w" data-k="g08-r13">[13] Medical Research Council : examen de la force musculaire</button></li><li><button class="w" data-k="g08-r14">[14] PROFILES 2017 : situations cliniques de formation médicale</button></li><li><button class="w" data-k="g08-r15">[15] Gray 1196 : enveloppes méningées normales et droits</button></li></ol><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button> · <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r4">[4]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r6">[6]</button> · <button class="w" data-k="g08-r10">[10]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="g08-tvc" data-k="g08-tvc"><h3>Thrombose, phlébite et infection : que faut-il établir ?</h3><p>La thrombose veineuse cérébrale correspond à l’obstruction d’une ou plusieurs veines cérébrales ou d’un sinus dural par un thrombus. La phlébite décrit une inflammation veineuse ; la thrombophlébite associe inflammation et thrombose. G08 inclut les formes septiques des veines et sinus intracrâniens ou intrarachidiens. Le compte rendu doit préciser la localisation, le contexte infectieux et le niveau de preuve.</p><p>Une preuve d’agent peut venir du sang, du foyer ou d’un matériel opératoire adapté. L’absence de culture positive ne suffit pas à exclure une forme septique : dans la série néerlandaise, plusieurs cultures sont restées négatives. À l’inverse, une thrombose chez une personne ayant une infection banale ne démontre pas automatiquement une infection du thrombus. Clinique, imagerie et microbiologie doivent rester cohérentes.</p><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button></p></template>
<template data-pop="g08-codage" data-k="g08-codage"><h3>Lire les notes de classification avant de coder</h3><p>Le fichier français officiel OFS 2024 identifie G08 comme code terminal, sans sous-code à décimale. L’entrée complète du BfArM inclut les embolies, endophlébites, phlébites, thrombophlébites et thromboses septiques des sinus veineux et des veines intracrâniens ou intrarachidiens. Les cinq termes d’inclusion ne sont pas cinq sous-codes.</p><p>Les formes intracrâniennes non pyogènes sont exclues vers I67.6 ; les formes intrarachidiennes non purulentes vers G95.18. Les complications d’avortement, de grossesse extra-utérine ou molaire, de grossesse et de puerpéralité ont leurs exclusions obstétricales. Cela change le codage, pas le besoin de soigner une urgence. Les fichiers 2024 ne certifient pas une facture suisse 2026.</p><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button></p></template>
