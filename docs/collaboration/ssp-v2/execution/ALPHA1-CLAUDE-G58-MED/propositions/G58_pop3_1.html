<template data-pop="g58-sm-douleur" data-title="Douleur neuropathique">
<div class="lab">Définition</div><p>La douleur neuropathique est un signe sensitif positif : brûlure ou décharge électrique née de fibres nerveuses lésées [S1].</p>
<div class="lab">Mécanisme</div><p>Dans la neuropathie vasculitique, l’ischémie de troncs nerveux individuels détruit des axones ; la douleur siège dans le territoire du nerf atteint [S6].</p>
<div class="lab">Valeur</div><p>La douleur fait partie de la définition clinique d’une vascularite cliniquement probable [S9]. Une douleur neuropathique d’histoire courte, sans facteur de risque de polyneuropathie, fait suspecter une périartérite noueuse [S7]. Aucune sensibilité ni spécificité n’est chiffrée dans les sources lues.</p>
<div class="lab">Piège</div><p>Le soulagement de la douleur ne prouve pas l’arrêt de l’ischémie : le déficit se suit à l’examen, muscle par muscle [S2].</p>
<p class="src">Références : Bernard-Valnet et coll., Rev Med Suisse 2019 ; Blaes 2015 ; Ruffer et coll. 2024 ; Peripheral Nerve Society 2010.</p></template>
<template data-pop="g58-sm-paresth" data-title="Paresthésies et dysesthésies">
<div class="lab">Définition</div><p>Les paresthésies sont des picotements ou des fourmillements ; les dysesthésies désignent toute sensation anormale, avec ou sans stimulus [S1].</p>
<div class="lab">Mécanisme</div><p>Ce sont des signes positifs : la fibre sensitive lésée produit une activité anormale [S1].</p>
<div class="lab">Valeur et piège</div><p>Leur fréquence n’est pas chiffrée dans les sources lues. Elles peuvent précéder le déficit mesurable : leur territoire guide l’examen.</p>
<p class="src">Références : Bernard-Valnet et coll., Rev Med Suisse 2019.</p></template>
<template data-pop="g58-sm-hypo" data-title="Hypoesthésie d’un territoire nerveux">
<div class="lab">Technique</div><p>Le patient délimite la zone ; le toucher se teste au coton de la zone insensible vers la zone normale, la douleur à l’épingle en partant de la zone analgésique, à un rythme irrégulier [S2].</p>
<div class="lab">Mécanisme</div><p>Le toucher fin et la pallesthésie empruntent les fibres de gros calibre et les cordons postérieurs ; la douleur et la température empruntent les petites fibres et les voies spinothalamiques [S1].</p>
<div class="lab">Normal</div><p>Au diapason de Rydel-Seiffer, la limite inférieure au doigt et à l’orteil vaut 6,9 et 5,5 entre 20 et 39 ans, puis 6,2 et 4,7 entre 40 et 60 ans [S1].</p>
<div class="lab">Piège</div><p>Le territoire d’un nerf varie d’un patient à l’autre ; les cartes publiées montrent des zones habituelles [S2].</p>
<p class="src">Références : Medical Research Council, Aids to the examination of the peripheral nervous system ; Bernard-Valnet et coll., Rev Med Suisse 2019.</p></template>
<template data-pop="g58-sm-faiblesse" data-title="Faiblesse focale">
<div class="lab">Technique</div><p>Un muscle est testé à la fois, sur une articulation, en regardant et en palpant la contraction pour éviter les mouvements de suppléance [S2]. Tibial antérieur et long extenseur de l’hallux : nerf péronier profond ; longs et courts péroniers : nerf péronier superficiel ; premier interosseux dorsal et abducteur du cinquième doigt : nerf ulnaire ; court abducteur du pouce : nerf médian [S2].</p>
<div class="lab">Mécanisme</div><p>La perte d’axones moteurs du tronc ischémié réduit la force des seuls muscles de ce nerf [S6].</p>
<div class="lab">Valeur</div><p>Les nerfs péronier et ulnaire sont les plus souvent atteints [S7] ; aucune sensibilité n’est chiffrée.</p>
<p class="src">Références : Medical Research Council, Aids to the examination of the peripheral nervous system ; Blaes 2015 ; Ruffer et coll. 2024.</p></template>
<template data-pop="g58-sm-mrc" data-title="Échelle de force du Medical Research Council">
<div class="lab">Échelle</div><p>0 : aucune contraction ; 1 : ébauche de contraction ; 2 : mouvement actif sans pesanteur ; 3 : mouvement actif contre la pesanteur ; 4 : contre la pesanteur et une résistance ; 5 : force normale. Les grades 4−, 4 et 4+ indiquent une résistance faible, modérée ou forte [S2].</p>
<div class="lab">Application</div><p>La cotation muscle par muscle rend l’asymétrie mesurable et permet de suivre l’évolution sous traitement.</p>
<div class="lab">Limite</div><p>La facilité à percevoir une contraction varie avec la morphologie du patient [S2].</p>
<p class="src">Références : Medical Research Council, Aids to the examination of the peripheral nervous system, 1976.</p></template>
<template data-pop="g58-sm-generaux" data-title="Signes généraux">
<div class="lab">Valeur</div><p>Amaigrissement, fièvre et fatigue sont rapportés chez environ 80 % des neuropathies avec vascularite systémique et environ 50 % des formes non systémiques [S6].</p>
<div class="lab">Piège</div><p>Leur absence ne rassure pas ; une vascularite limitée au nerf peut aussi s’accompagner d’une biologie normale [S1].</p>
<p class="src">Références : Blaes 2015 ; Bernard-Valnet et coll., Rev Med Suisse 2019.</p></template>
<template data-pop="g58-sm-paroi" data-title="Douleur pariétale en bande">
<div class="lab">Caractères</div><p>La douleur est aiguë, brûlante, en éclair ou sourde ; l’inspiration profonde, la toux et la rotation du tronc l’aggravent [S5].</p>
<div class="lab">Mécanisme</div><p>La source décrit l’aggravation sans en donner le mécanisme ; la lésion ou l’irritation du nerf intercostal en est le substrat [S5].</p>
<div class="lab">Piège</div><p>Les patients consultent en moyenne environ cinq médecins avant le diagnostic [S5].</p>
<p class="src">Références : Shamoun et coll., J Thorac Dis 2026 (faits descriptifs).</p></template>
<template data-pop="g58-sm-visceral" data-title="Symptômes viscéraux de l’ACNES">
<div class="lab">Valeur</div><p>Chez 100 patients sélectionnés, le ballonnement (78 %), les nausées (66 %) et les troubles du transit (50 %) étaient fréquents ; un traitement efficace les réduisait [S3].</p>
<div class="lab">Piège</div><p>Ces plaintes orientent à tort vers un organe abdominal ; l’examen de la paroi doit précéder la multiplication des examens [S3].</p>
<p class="src">Références : Jacobs et coll., Hernia 2024.</p></template>
<template data-pop="g58-sm-carnett" data-title="Signe de Carnett">
<div class="lab">Technique</div><p>L’examinateur palpe le point douloureux pendant que le patient contracte ses muscles grands droits ; la douleur augmente dans l’ACNES [S3].</p>
<div class="lab">Valeur</div><p>C’est l’un des cinq critères diagnostiques publiés ; une baisse de la douleur après infiltration d’anesthésique local au point douloureux soutient le diagnostic [S3]. Sa sensibilité propre n’est pas chiffrée dans les sources lues.</p>
<p class="src">Références : Jacobs et coll., Hernia 2024.</p></template>
<template data-pop="g58-sm-pincement" data-title="Test de pincement cutané">
<div class="lab">Technique</div><p>L’examinateur pince la peau de la paroi en regard du point douloureux ; une douleur intense est un critère de l’ACNES [S3].</p>
<div class="lab">Limite</div><p>Sa valeur isolée n’est pas chiffrée dans les sources lues.</p>
<p class="src">Références : Jacobs et coll., Hernia 2024.</p></template>
