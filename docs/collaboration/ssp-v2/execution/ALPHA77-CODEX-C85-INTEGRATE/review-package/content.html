<section class="ilot" id="c85-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs décisions illustrent les recommandations des sources citées.</p>
<p>Une femme de 34 ans consulte pour une toux sèche et une dyspnée progressives. Le matin, son visage et ses bras sont gonflés ; les veines de son cou sont distendues. La radiographie du thorax montre une volumineuse masse du médiastin antérieur. Quatre décisions s’enchaînent. Le médecin doit d’abord évoquer un <button class="w" data-k="c85-lmpgb">lymphome médiastinal primitif à grandes cellules B</button> (code C85.2) et reconnaître le <button class="w" data-k="c85-vcs">syndrome cave supérieur</button>. Il doit ensuite obtenir une <button class="w" data-k="c85-biopsie">biopsie tissulaire suffisante</button> pour qualifier la maladie. En présence d’une compression menaçante, l’équipe spécialisée coordonne la sécurité immédiate, le prélèvement et le traitement ; cet enchaînement pédagogique ne doit pas devenir un retard à la prise en charge de l’urgence. Il stadifie alors la maladie par <button class="w" data-k="c85-tep">tomographie par émission de positons</button> couplée au scanner. Il choisit enfin une immunochimiothérapie à visée curative, puis décide de la radiothérapie de consolidation d’après la TEP de fin de traitement (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://doi.org/10.1200/JCO-24-01373" target="_blank" rel="noopener">IELSG37, Martelli et al.</a>).</p>
<p>Une seconde situation, plus fréquente dans les dossiers que dans les manuels, éclaire le code du chapitre. Un compte rendu ne mentionne que « lymphome B » ou « lymphome non hodgkinien », sans type. Le codage aboutit alors à C85.1 ou à C85.9, c’est-à-dire à un diagnostic <b>incomplet</b>. La conduite n’est pas de traiter sous cette étiquette : il faut compléter la biopsie et la faire relire par un hématopathologiste (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc C81–C96 (BfArM)</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a>).</p>
<div class="key"><b>À retenir.</b> Dans C85, une seule maladie est individualisée : le lymphome médiastinal primitif à grandes cellules B. C85.1 et C85.9 indiquent une absence de précision ; C85.7 signifie au contraire « autres types précisés » et ne doit pas leur être assimilé. Les objectifs du chapitre sont de reconnaître la forme médiastinale, de la biopsier correctement, de la stadifier par TEP, de choisir la première ligne et de gérer la rechute.</div>
<h3 id="c85-profiles2017">Situations cliniques et examen fédéral : distinguer les versions</h3>
<p>Les exigences MEBEKO pour 2026 utilisent 265 situations de départ. Dans PROFILES 2017, les situations particulièrement pertinentes ici sont les adénopathies (SSP 2), la fièvre (SSP 6), la perte de poids (SSP 16), la difficulté à avaler (SSP 23), le gonflement du visage ou du cou (SSP 37), la toux (SSP 45), la dyspnée (SSP 46), la dysphagie (SSP 48) et le stridor (SSP 49). Le chapitre les relie à l’interrogatoire, à la reconnaissance d’une compression, au choix du prélèvement et à l’interprétation des examens.</p>
<p>La révision PROFILES 2023, appelée aussi PROFILES 2, entre dans l’enseignement au semestre 2025/26 ; l’article des responsables de sa révision annonce son utilisation comme base de l’examen fédéral en 2028. Les identifiants G et S ci-dessous appartiennent à cette nouvelle version. Les correspondances proposées sont pédagogiques : elles ne certifient ni une fréquence de question, ni une liste officielle de maladies à connaître sous le code C85.</p>
<p class="src"><a href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">PROFILES 2017, pages 28–29</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">MEBEKO, exigences 2026, § 2</a> ; <a href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" target="_blank" rel="noopener">Berendonk et al., 2025, perspectives de mise en œuvre</a>.</p>

<section class="ilot" id="c85-1"><h2><span class="n">1</span>Définitions et entités voisines</h2>
<p>La catégorie C85 de la <button class="w" data-k="c85-cim">CIM-10-GM 2024</button> est la catégorie résiduelle des lymphomes non hodgkiniens : elle réunit les « autres types » et les lymphomes « non précisés » du bloc C81–C96 (<a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024, version française (OFS)</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc C81–C96 (BfArM)</a>). Quatre sous-codes la composent. Le code <b>C85.2</b> désigne le lymphome médiastinal (thymique) à grandes cellules B  ; les rubriques C83.3 (lymphome diffus à grandes cellules B) et C83.8 (autres lymphomes non folliculaires) excluent explicitement le lymphome médiastinal codé C85.2. Le code <b>C85.1</b> désigne un lymphome à cellules B sans précision ; la note du BfArM demande de coder la désignation plus spécifique dès qu’un lymphome nommé est d’origine B ou à composante B. Le code <b>C85.7</b> regroupe les autres types précisés de lymphome non hodgkinien ; la page officielle n’y liste ni inclusion ni exclusion, et aucune source lue ne lui rattache une entité précise. Le code <b>C85.9</b> couvre le lymphome non hodgkinien non précisé, avec pour inclusions « lymphome malin SAI », « lymphome SAI » et « lymphome non hodgkinien SAI » (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc C81–C96 (BfArM)</a>). Le sens de ces codes se résume ainsi : C85.2 nomme l’entité médiastinale ; C85.1 et C85.9 expriment une absence de précision. C85.7 désigne d’autres types précisés : le caractère résiduel de la rubrique ne signifie pas que le diagnostic tissulaire est incomplet.</p>
<p>Le <button class="w" data-k="c85-lmpgb">lymphome médiastinal primitif à grandes cellules B</button> est un lymphome B agressif. Il naît dans le médiastin à partir d’un lymphocyte B thymique médullaire. Ses grandes cellules expriment les marqueurs pan-B, mais pas d’immunoglobuline de surface (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a>, p. v91). La classification de l’<button class="w" data-k="c85-sources-guides">OMS</button>, 5e édition, le range parmi les lymphomes à grandes cellules B, sous le même nom que dans la 4e édition révisée (<a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a>, tableau 2). La classification de consensus international (ICC 2022) a paru en parallèle ; son rapport n’a pas été lu en texte intégral pour ce chapitre.</p>
<p>Trois entités voisines se confondent facilement avec lui. Le tableau les oppose, car chacune se définit par un critère différent.</p>
<table class="t"><tr><th>Entité</th><th>Définition</th><th>Particularité utile au raisonnement</th></tr>
<tr><td><button class="w" data-k="c85-dlbcl-nos">DLBCL, NOS</button></td><td>Morphologie à grandes cellules, phénotype B mature</td><td>Se définit par l’absence des critères d’une entité spécifique ; c’est l’entité la plus fréquente</td></tr>
<tr><td><button class="w" data-k="c85-mgzl">Lymphome de la zone grise médiastinale (MGZL)</button></td><td>Remplace l’ancienne catégorie « lymphome B inclassable, intermédiaire entre DLBCL et lymphome de Hodgkin classique »</td><td>Propre au médiastin ; un cas d’aspect semblable hors du médiastin est classé DLBCL, NOS</td></tr>
<tr><td><button class="w" data-k="c85-hgbl">HGBL, NOS</button></td><td>Lymphome B agressif à cellules moyennes ou blastoïdes</td><td>N’entre dans aucune entité définie</td></tr></table>
<p>Ce tableau montre que la localisation médiastinale ne suffit pas à nommer la maladie : le lymphome médiastinal primitif, la zone grise et le Hodgkin classique scléronodulaire se partagent le même territoire et des traits communs. Seule l’histologie relue par un hématopathologiste les sépare.</p>
<div class="trap"><span class="k">Piège</span> Ne pas écrire « lymphome diffus à grandes cellules B » pour un lymphome médiastinal primitif : la rubrique C83.3 exclut explicitement le lymphome médiastinal C85.2. Le choix entre les deux codes reflète une différence de biologie et de traitement.</div>
<div class="key"><b>À retenir.</b> Le lymphome médiastinal primitif est une entité à part entière. Le DLBCL, NOS est une entité définie par exclusion. La zone grise est médiastinale par définition. Les codes C85.1 et C85.9 indiquent une absence de précision. C85.7 regroupe d’autres types précisés ; ce libellé ne permet pas de conclure à une biopsie insuffisante.</div>
<p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024, version française (OFS)</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc C81–C96 (BfArM)</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, p. v91</a>.</p></section>
<section class="ilot" id="c85-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Les chiffres suisses disponibles portent sur l’ensemble des lymphomes non hodgkiniens, non sur C85. Entre 2013 et 2017, la Suisse a enregistré en moyenne 910 nouveaux cas par an chez l’homme et près de 710 chez la femme, soit 3,9 % et 3,6 % de tous les cancers. Le risque cumulé sur la vie est de 1,9 % chez l’homme et de 1,4 % chez la femme ; le rapport hommes/femmes est de 1,5. L’âge médian au diagnostic est de 69 ans chez l’homme et de 71 ans chez la femme. L’incidence est stable de 1988 à 2017, alors que la mortalité a baissé de 34 % chez l’homme et de 35 % chez la femme. La Suisse présente le deuxième taux d’incidence le plus bas parmi les pays européens comparés (<a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/19305697/master" target="_blank" rel="noopener">Le cancer en Suisse, rapport 2021 (OFS)</a>, § 4.22). Le rapport regroupe C82 à C86 et C96 ; <b>aucun chiffre suisse propre à C85 ou au lymphome médiastinal n’a été trouvé</b>.</p>
<p>Le lymphome médiastinal primitif touche une population très différente de celle des lymphomes en général : des femmes jeunes. Trois sources donnent des ordres de grandeur voisins, avec des dénominateurs différents.</p>
<table class="t"><tr><th>Source</th><th>Fréquence</th><th>Âge</th><th>Sexe</th></tr>
<tr><td><a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016</a></td><td>Environ 10 % des DLBCL</td><td>30 à 40 ans</td><td>Plus fréquent chez la femme</td></tr>
<tr><td><a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 12/2025</a></td><td>2 à 4 % des lymphomes</td><td>Médiane d’environ 35 ans</td><td>Surtout la femme jeune</td></tr>
<tr><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al. 2025</a></td><td>2 à 3 % des lymphomes non hodgkiniens</td><td>Pic à 30–39 ans</td><td>Rapport femmes/hommes de 1,5</td></tr></table>
<p>Les trois chiffres ne se contredisent pas : « 10 % des DLBCL » rapporte l’entité à un sous-ensemble, alors que « 2 à 4 % des lymphomes » la rapporte à l’ensemble, qui est beaucoup plus large. Pour mémoire, le DLBCL a une incidence d’environ 7 pour 100 000 habitants par an, croissante avec l’âge et plus élevée chez l’homme (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 2).</p>
<p>Le pronostic est favorable dans les séries à traitement moderne. Dans l’essai IELSG37, la survie globale à 5 ans atteint 99 % dans les deux bras chez les patients en réponse métabolique complète (<a href="https://doi.org/10.1200/JCO-24-01373" target="_blank" rel="noopener">IELSG37, Martelli et al.</a>). Une réponse maintenue au-delà de 18 mois laisse présager la guérison, et les rechutes sont plus rares que dans les autres DLBCL (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a>). Un réarrangement de <button class="w" data-k="c85-ciita">CIITA</button> est associé à une survie spécifique plus courte (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8044947/" target="_blank" rel="noopener">Chen et al., thérapies de précision</a>).</p>
<div class="key"><b>À retenir.</b> Le lymphome médiastinal primitif représente environ 10 % des DLBCL et touche surtout la femme d’environ 35 ans. Il n’existe aucune incidence suisse propre à l’entité : la lacune est à nommer, non à combler par une estimation.</div>
<p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/19305697/master" target="_blank" rel="noopener">OFS 2021, § 4.22</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://doi.org/10.1200/JCO-24-01373" target="_blank" rel="noopener">IELSG37, Martelli et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8044947/" target="_blank" rel="noopener">Chen et al., thérapies de précision</a>.</p></section>
<section class="ilot" id="c85-3"><h2><span class="n">3</span>Physiopathologie : du lymphocyte B thymique à la masse médiastinale</h2>
<p><b>État normal.</b> Le thymus contient une petite population de <button class="w" data-k="c85-origine-thymique">lymphocytes B médullaires</button> ; le lymphome médiastinal primitif en dériverait (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8044947/" target="_blank" rel="noopener">Chen et al., thérapies de précision</a> : origine thymique putative). Cette origine explique la localisation : la tumeur naît dans le médiastin antérieur, sans point de départ ganglionnaire à distance.</p>
<p><b>Transformation.</b> Trois familles d’altérations moléculaires ont été décrites (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a>, p. v91–v92 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8044947/" target="_blank" rel="noopener">Chen et al., thérapies de précision</a>). Elles sont présentées dans l’ordre de la chaîne cellulaire.</p>
<ul><li>L’activation de la voie <button class="w" data-k="c85-nfkb">NF-κB</button> résulte d’une amplification de REL (2p16) et de mutations inactivatrices de TNFAIP3. Une voie de survie reste ainsi allumée en permanence.</li>
<li>L’activation de la voie <button class="w" data-k="c85-jakstat">JAK-STAT</button> résulte d’une amplification de JAK2 (9p24), de mutations inactivatrices de SOCS1, d’une surexpression d’IL-13 et d’une signalisation STAT6. Un signal de prolifération est ainsi maintenu en l’absence de stimulus.</li>
<li>L’<button class="w" data-k="c85-echappement">échappement immunitaire</button> associe l’amplification ou la translocation de 9p24.1 (gènes de PD-L1 et PD-L2), la baisse des molécules HLA de classe II par réarrangement de CIITA, et des mutations de B2M et de CD58. La tumeur devient moins visible des lymphocytes T.</li></ul>
<p><b>Conséquences cliniques et thérapeutiques.</b> La surexpression de PD-L1 et PD-L2 et la perte des molécules HLA de classe II permettent à la tumeur d’échapper aux lymphocytes T. Ce mécanisme fonde l’efficacité du blocage de PD-1 en rechute (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8044947/" target="_blank" rel="noopener">Chen et al., thérapies de précision</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a>). Le <button class="w" data-k="c85-phenotype">phénotype</button> des grandes cellules (marqueurs pan-B présents, immunoglobuline de surface absente, CD30 faible dans environ 80 % des cas) fournit à la fois les critères diagnostiques et la cible du rituximab. La morphologie montre une prolifération diffuse de grandes cellules à cytoplasme clair avec une <button class="w" data-k="c85-sclerose">sclérose compartimentante</button> ; cette sclérose peut dominer la biopsie et la rendre trompeuse (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>).</p>
<p>La figure ordonne la chaîne depuis la cellule d’origine jusqu’aux signes du patient.</p>
<figure><svg viewBox="0 0 400 330" role="img" aria-label="Figure 1 — Du lymphocyte B thymique aux signes de compression" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="12" y="10" width="376" height="46" rx="5"/><path d="M200 56v16m-4-5l4 5 4-5"/><rect x="12" y="72" width="376" height="46" rx="5"/><path d="M200 118v16m-4-5l4 5 4-5"/><rect x="12" y="134" width="376" height="46" rx="5"/><path d="M200 180v16m-4-5l4 5 4-5"/><rect x="12" y="196" width="376" height="46" rx="5"/><path d="M200 242v16m-4-5l4 5 4-5"/><rect x="12" y="258" width="376" height="56" rx="5"/></g><g fill="currentColor" text-anchor="middle"><text x="200" y="38">Lymphocyte B médullaire du thymus (origine putative)</text><text x="200" y="92">Voies activées : NF-κB, JAK-STAT</text><text x="200" y="108">Échappement : PD-L1, PD-L2, perte de HLA de classe II</text><text x="200" y="152">Prolifération diffuse de grandes cellules B</text><text x="200" y="168">avec sclérose compartimentante</text><text x="200" y="224">Masse volumineuse du médiastin antérieur</text><text x="200" y="282">Compression : dyspnée, toux, dysphagie,</text><text x="200" y="298">syndrome cave supérieur, épanchements</text></g></svg><figcaption>Figure 1 — Chaîne physiopathologique du lymphome médiastinal primitif. Schéma didactique : les altérations moléculaires décrites sont des associations, non une séquence chronologique démontrée chez chaque patient.</figcaption></figure>
<p>Le lymphome médiastinal primitif partage plusieurs traits avec le lymphome de Hodgkin classique scléronodulaire : expression de CD30, activation constitutive de NF-κB et de JAK-STAT, échappement par PD-1 (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 5.2.1.1 ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a> sur la zone grise). Cette parenté explique pourquoi le diagnostic différentiel est difficile, même entre experts.</p>
<div class="key"><b>À retenir.</b> Une cellule B thymique, trois familles d’altérations (NF-κB, JAK-STAT, échappement immunitaire) et une sclérose compartimentante. Le blocage de PD-1 découle de l’échappement ; la prudence sur les petites biopsies découle de la sclérose.</div>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, p. v91–v92</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8044947/" target="_blank" rel="noopener">Chen et al., thérapies de précision</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 5.2.1.1</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a>.</p></section>
<section class="ilot" id="c85-4"><h2><span class="n">4</span>Causes, facteurs de risque et diagnostics incomplets</h2>
<p>Aucun facteur de risque spécifique du lymphome médiastinal primitif n’est établi (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>). Les seuls éléments épidémiologiques fiables sont l’âge jeune et le sexe féminin, qui orientent le soupçon sans constituer une cause. Cette absence de cause modifiable a une conséquence pratique : aucune prévention n’est documentée, et le bénéfice repose sur la rapidité du diagnostic et la qualité du premier traitement.</p>
<p>Il est plus utile de comprendre pourquoi un diagnostic reste <b>incomplet</b>, car c’est la cause réelle des codes C85.1 et C85.9. Trois mécanismes sont documentés. La <b>cytoponction à l’aiguille fine</b> est insuffisante, car le diagnostic exige histologie, immunohistochimie, cytogénétique et biologie moléculaire sur un échantillon tissulaire, de préférence le ganglion entier (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 4.1). La <b>sclérose</b> du lymphome médiastinal rend la tumeur hétérogène : un prélèvement trop petit peut n’en montrer que des bandes fibreuses (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>). Enfin, la distinction entre lymphome médiastinal, zone grise et Hodgkin classique reste peu reproductible, même entre experts, ce qui justifie la relecture par un hématopathologiste (<a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a> ; <a href="https://doi.org/10.1111/bjh.70432" target="_blank" rel="noopener">Sabattini et al., zone grise médiastinale (résumé)</a>, résumé).</p>
<div class="trap"><span class="k">Erreur fréquente</span> Débuter un traitement sur la seule mention « lymphome B » d’une cytoponction. Le type exact conditionne le schéma ; la démarche correcte consiste à re-biopsier ou à compléter l’analyse avant de traiter (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 4.1).</div>
<div class="key"><b>À retenir.</b> Aucune cause modifiable n’est connue. Un diagnostic incomplet résulte d’un prélèvement insuffisant ou d’une relecture absente : il se corrige par la biopsie, non par le traitement empirique.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 4.1</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a> ; <a href="https://doi.org/10.1111/bjh.70432" target="_blank" rel="noopener">Sabattini et al., zone grise médiastinale (résumé)</a>.</p></section>
<section class="ilot" id="c85-5"><h2><span class="n">5</span>Anamnèse</h2>
<p data-semiology-clinical="C85">L’interrogatoire cherche les conséquences d’une masse thoracique volumineuse, puis les symptômes systémiques, puis les éléments qui conditionneront le traitement. Les fréquences sont celles des séries publiées.</p>
<table class="t"><tr><th>Élément</th><th>Fréquence</th><th>Mécanisme de la plainte</th></tr>
<tr><td>Masse du médiastin antérieur</td><td>Plus des deux tiers des cas</td><td>La tumeur occupe le médiastin et comprime les structures voisines</td></tr>
<tr><td><button class="w" data-k="c85-compression">Dyspnée, toux, dysphagie</button></td><td>Fréquentes</td><td>Compression locale des voies aériennes et digestives ; la dysphagie traduit une compression digestive haute</td></tr>
<tr><td><button class="w" data-k="c85-vcs">Syndrome cave supérieur</button></td><td>Environ 50 %</td><td>Compression de la veine cave supérieure : les veines du cou et du thorax se distendent, le visage et les bras gonflent</td></tr>
<tr><td><button class="w" data-k="c85-epanchement">Épanchement pleural ou péricardique</button></td><td>Fréquent</td><td>Atteinte de la plèvre ou du péricarde par la masse</td></tr>
<tr><td><button class="w" data-k="c85-symptomes-b">Symptômes B</button></td><td>Environ un tiers des patients</td><td>Fièvre > 38 °C inexpliquée, sueurs nocturnes imposant de changer la literie, perte de poids > 10 % en 6 mois</td></tr></table>
<p>Ce tableau hiérarchise l’enquête : la compression cave et la compression des voies aériennes sont des symptômes d’urgence, les symptômes B des marqueurs de maladie active, qui ne déterminent pas à eux seuls le traitement. Le médecin demande aussi les antécédents d’hépatite B et d’infection par le VIH ou le VHC, car ces infections peuvent se réactiver sous traitement anti-B ; une cardiopathie, car une anthracycline est prévue ; et un désir d’enfant, car la fertilité se discute avant le traitement (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 4.3 et § 5.2.8 ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a>).</p>
<div class="two"><div class="card"><h4>Forme typique</h4><p>Une femme de 34 ans présente une toux sèche, une dyspnée, un œdème du visage et des bras et une radiographie avec masse du médiastin antérieur. Elle est dans les stades I–II, comme environ 80 % des patients, avec une masse supérieure à 10 cm qui peut infiltrer le poumon, la paroi, la plèvre ou le péricarde.</p></div><div class="card"><h4>Présentations qui demandent de la prudence</h4><p>Un tiers seulement des patients a des symptômes B, et la moitié environ n’a pas de syndrome cave. L’atteinte médullaire est rare (1 à 5 %). La rechute est souvent extranodale : rein, surrénale, foie, ovaire, tube digestif, système nerveux central. Un compte rendu « lymphome B » sans type impose de compléter l’histologie.</p></div></div>
<div class="trap"><span class="k">Piège</span> L’absence de syndrome cave ou de symptômes B n’écarte pas le diagnostic : ces signes manquent respectivement chez environ la moitié et les deux tiers des patients (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>).</div>
<div class="key"><b>À retenir.</b> L’histoire typique associe une femme jeune, une masse thoracique et des signes de compression. Les symptômes B sont inconstants. La rechute, souvent extranodale, se cherche hors du thorax.</div>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, tableau 1</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a>.</p></section>
<section class="ilot" id="c85-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen cherche d’abord la conséquence la plus menaçante, la compression, puis la diffusion, puis l’état général qui entrera dans le score pronostique. Aucune source du dossier ne décrit de manœuvre ou de signe sémiologique particulier : seuls les signes rapportés par les sources sont donc listés.</p>
<div class="two"><div class="card"><h4>Compression et retentissement</h4><p>Le <button class="w" data-k="c85-vcs">syndrome cave supérieur</button> se reconnaît à la distension des veines du cou et du thorax, à l’œdème du visage et des bras et au chémosis. La dyspnée, la toux et la dysphagie témoignent de la compression des voies aériennes et digestives. Un épanchement pleural ou péricardique complète le tableau (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>).</p></div><div class="card"><h4>Diffusion et état général</h4><p>Le médecin cherche des adénopathies à distance, rares dans cette maladie, et des signes d’atteinte extranodale. Il évalue l’état général selon l’échelle <button class="w" data-k="c85-ipi">ECOG</button>, car un ECOG ≥ 2 compte dans l’indice pronostique international (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 4.4.1).</p></div></div>
<p>Cet examen sert deux décisions. La première est l’urgence : un syndrome cave ou une compression trachéale impose une immunochimiothérapie urgente (<a href="https://doi.org/10.1002/jha2.151" target="_blank" rel="noopener">Villa et Sehn</a>). La seconde est le stade : l’atteinte ganglionnaire à distance est rare, et c’est l’imagerie, non l’examen, qui tranche.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Conclure à une maladie localisée parce que l’examen ne trouve pas d’adénopathie périphérique. Le lymphome médiastinal est confiné au thorax dans la plupart des cas ; seule la TEP établit le stade.</div>
<div class="key"><b>À retenir.</b> L’examen reconnaît la compression et mesure l’état général ; il ne remplace pas la stadification. Les signes de syndrome cave sont l’œdème du visage et des bras, la distension veineuse et le chémosis.</div>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://doi.org/10.1002/jha2.151" target="_blank" rel="noopener">Villa et Sehn</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 4.4.1</a>.</p>
<button class="pareto-btn ui" data-k="pareto-c85-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>

<section class="ilot" id="c85-7"><h2><span class="n">7</span>Démarche diagnostique</h2>
<p>Le diagnostic de lymphome ne se pose pas à l’imagerie : il repose sur l’<b>histologie d’un échantillon tissulaire suffisant</b>, de préférence le ganglion entier. Le bilan comprend histologie, immunohistochimie, cytogénétique et biologie moléculaire, relus par un hématopathologiste expérimenté (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 4.1). La <button class="w" data-k="c85-biopsie">cytoponction à l’aiguille fine est insuffisante</button> ; une biopsie au trocart n’est admise que si l’exérèse est impossible (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a>). Dans le lymphome médiastinal, le prélèvement se fait par aiguille percutanée, médiastinoscopie, médiastinotomie antérieure ou mini-thoracotomie, car la sclérose rend la tumeur hétérogène (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>).</p>
<p>La séquence suit une hiérarchie de gravité. Obtenir un échantillon interprétable avant le traitement reste l’objectif, car l’immunochimiothérapie dépend du type exact. Une menace cardiorespiratoire immédiate impose cependant une décision urgente commune : elle ne doit pas attendre une procédure diagnostique devenue dangereuse. La balance entre stabilisation, corticothérapie et prélèvement est explicitée dans la section consacrée aux urgences.</p>
<figure><svg viewBox="0 0 400 330" role="img" aria-label="Figure 2 — Séquence diagnostique devant une masse du médiastin antérieur" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="12" y="10" width="376" height="46" rx="5"/><path d="M200 56v16m-4-5l4 5 4-5"/><rect x="12" y="72" width="376" height="46" rx="5"/><path d="M200 118v16m-4-5l4 5 4-5"/><rect x="12" y="134" width="376" height="46" rx="5"/><path d="M200 180v16m-4-5l4 5 4-5"/><rect x="12" y="196" width="376" height="46" rx="5"/><path d="M200 242v16m-4-5l4 5 4-5"/><rect x="12" y="258" width="376" height="56" rx="5"/></g><g fill="currentColor" text-anchor="middle"><text x="200" y="38">Compression menaçante ? Urgence thérapeutique</text><text x="200" y="92">Biopsie tissulaire suffisante, relue par un hématopathologiste</text><text x="200" y="108">(pas de cytoponction seule)</text><text x="200" y="152">Histologie : lymphome médiastinal, zone grise, Hodgkin ?</text><text x="200" y="168">Phénotype et exclusion des entités voisines</text><text x="200" y="224">TEP-TDM, biologie, stade, indice pronostique</text><text x="200" y="282">Type précisé : traitement de l’entité</text><text x="200" y="298">Type non précisé (C85.1, C85.9) : compléter</text></g></svg><figcaption>Figure 2 — Séquence diagnostique. Schéma didactique : la recherche du type exact ne retarde pas la prise en charge d’une compression menaçante.</figcaption></figure>
<p>Le diagnostic recherche une prolifération diffuse de grandes cellules de lignée B, habituellement CD20 positives, intégrée au contexte d’une masse médiastinale antérieure dominante. Le <button class="w" data-k="c85-phenotype">phénotype</button> compatible est : immunoglobuline de surface négative, CD23 souvent positif, CD30 faible, MAL positif, CD15 négatif (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>). Le lymphome de Hodgkin classique et la zone grise sont exclus par l’hématopathologiste (<a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a>).</p>
<p>Quand l’histologie reste incomplète, le codage reflète cette incomplétude : C85.1 ou C85.9 ne sont acceptables qu’en attente du type, et ils doivent déclencher une démarche de complément, non un traitement standard (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc C81–C96 (BfArM)</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>).</p>
<div class="trap"><span class="k">Erreur fréquente</span> Se contenter de la TEP pour affirmer le diagnostic. La TEP est obligatoire pour stadifier le lymphome médiastinal, qui fixe le FDG dans tous les cas ; elle mesure l’extension, elle ne nomme pas la tumeur.</div>
<div class="key"><b>À retenir.</b> Biopsie tissulaire suffisante, relecture par un hématopathologiste, puis exclusion du Hodgkin classique et de la zone grise. La cytoponction seule ne suffit jamais. La TEP stadifie ; elle ne tient pas lieu d’histologie.</div>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 4.1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc C81–C96 (BfArM)</a>.</p></section>
<section class="ilot" id="c85-8"><h2><span class="n">8</span>Diagnostic différentiel d’une masse du médiastin antérieur</h2>
<p>Chez l’adulte, les causes les plus fréquentes d’une masse du médiastin antérieur sont les tumeurs thymiques, les masses thyroïdiennes et les lymphomes ; les masses du médiastin antérieur représentent 50 % des masses médiastinales (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al., masses médiastinales, 2013</a>). Le tableau les classe par ordre de ce qu’il ne faut pas manquer, avec l’indice qui oriente et l’examen qui tranche.</p>
<table class="t"><tr><th>Diagnostic</th><th>Indices cliniques ou radiologiques</th><th>Examen qui tranche</th></tr>
<tr><td><button class="w" data-k="c85-diff-lymphome">Lymphome médiastinal primitif</button></td><td>Femme jeune, masse volumineuse, syndrome cave, FDG constamment fixé</td><td>Histologie sur biopsie suffisante</td></tr>
<tr><td><button class="w" data-k="c85-diff-hodgkin">Lymphome de Hodgkin classique</button></td><td>50 à 70 % des lymphomes médiastinaux, contre 15 à 25 % pour les lymphomes non hodgkiniens</td><td>Histologie ; différentiel parfois difficile avec la zone grise</td></tr>
<tr><td><button class="w" data-k="c85-diff-lymphoblastique">Lymphome lymphoblastique T</button></td><td>Enfant et adolescent</td><td>Histologie</td></tr>
<tr><td><button class="w" data-k="c85-diff-thymome">Thymome</button></td><td>Tumeur primitive la plus fréquente du médiastin antérieur ; surtout après 40 ans ; myasthénie chez 30 à 50 % des patients ; épanchement et adénopathies rares</td><td>Histologie ; le scanner distingue mal un lymphome solitaire d’un thymome</td></tr>
<tr><td><button class="w" data-k="c85-diff-germinale">Tumeur germinale</button></td><td>Tératome mature (graisse, liquide, calcifications) ; séminome presque exclusivement chez l’homme de 20 à 40 ans</td><td>Marqueurs AFP et β-hCG (élevés dans les formes non séminomateuses) puis histologie</td></tr>
<tr><td><button class="w" data-k="c85-diff-goitre">Goitre plongeant</button></td><td>Continuité avec la thyroïde cervicale</td><td>Imagerie de la continuité thyroïdienne</td></tr></table>
<p>Ce tableau rappelle que le sexe, l’âge et les marqueurs biologiques structurent le raisonnement avant la biopsie : un homme de 30 ans avec une masse médiastinale oriente vers une tumeur germinale, dont les formes non séminomateuses élèvent l’AFP ou la β-hCG ; une femme de 34 ans avec un syndrome cave oriente vers le lymphome ; une myasthénie évoque un thymome. L’histologie reste le juge final dans tous les cas (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al., masses médiastinales, 2013</a>).</p>
<div class="trap"><span class="k">Piège</span> Le scanner distingue mal un lymphome solitaire d’un thymome ; c’est l’histologie qui tranche (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al., masses médiastinales, 2013</a>).</div>
<div class="key"><b>À retenir.</b> Devant une masse du médiastin antérieur, l’âge, le sexe, la myasthénie, l’AFP et la β-hCG orientent ; l’histologie décide. La zone grise et le Hodgkin classique scléronodulaire sont les entités les plus proches du lymphome médiastinal primitif.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al., masses médiastinales, 2013</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a> ; <a href="https://doi.org/10.1111/bjh.70432" target="_blank" rel="noopener">Sabattini et al., zone grise médiastinale (résumé)</a>.</p></section>
<section class="ilot" id="c85-9"><h2><span class="n">9</span>Urgences et complications</h2>
<div class="alert"><b>Compression thoracique menaçante.</b> Une compression thoracique menaçant les fonctions vitales peut imposer une immunochimiothérapie urgente, potentiellement curative, coordonnée par l’équipe spécialisée (<a href="https://doi.org/10.1002/jha2.151" target="_blank" rel="noopener">Villa et Sehn</a>). Le pembrolizumab n’est pas indiqué lorsqu’une cytoréduction urgente est nécessaire (<a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a>). <b>Syndrome de lyse tumorale.</b> La FI demande d’envisager une prophylaxie appropriée chez les patients à risque de lyse sous rituximab. Son délai de 48 heures figure dans la sous-section leucémie lymphatique chronique et ne constitue pas une règle chiffrée propre au lymphome médiastinal (<a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a>). <b>Réactions à la perfusion.</b> La perfusion s’interrompt en cas de dyspnée sévère, de bronchospasme ou d’hypoxie, et un syndrome de libération de cytokines se surveille (<a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a>). <b>Hépatite B.</b> L’AgHBs et l’anti-HBc se recherchent avant le rituximab ; la réactivation du VHB peut être fulminante (<a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a>). <b>Après CAR-T.</b> La FI Yescarta rapporte, dans les données après autorisation, un taux de signalement d’œdème cérébral de 1,6 % dans le lymphome médiastinal (0,8 % de cas fatals), contre 0,7 % dans le DLBCL et les autres indications (0,2 % de cas fatals). Ces taux de signalement concernent ce produit et ne sont pas une incidence comparative de tous les CAR-T ; une grosse masse médiastinale avec syndrome cave supérieur est un facteur de risque indépendant potentiel (<a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a>).</div>
<p>Chaque risque se déduit d’un mécanisme précis. La masse comprime des structures vitales : le retard de traitement expose à la détresse respiratoire ou à l’engorgement veineux de la tête et des bras. La lyse rapide des cellules peut entraîner hyperuricémie, hyperkaliémie, hyperphosphatémie, hypocalcémie et insuffisance rénale aiguë. La FI demande une prophylaxie adaptée au risque et une surveillance étroite, particulièrement en cas de forte charge tumorale. Le rituximab expose à la réactivation d’une hépatite B latente et à la <button class="w" data-k="c85-lemp">leucoencéphalopathie multifocale progressive</button> (<a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a>). Le <button class="w" data-k="c85-cart">CAR-T</button> expose à un syndrome de libération de cytokines, d’où l’exigence de disposer d’au moins quatre doses de tocilizumab avant la perfusion de l’axicabtagène ciloleucel (<a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a>).</p>

<div class="key"><b>À retenir.</b> L’urgence est la compression ; la prévention porte sur la lyse tumorale, l’hépatite B et, après CAR-T, sur le syndrome de libération de cytokines et l’œdème cérébral. Le pembrolizumab ne convient pas à une cytoréduction urgente.</div>
<p class="src">Références : <a href="https://doi.org/10.1002/jha2.151" target="_blank" rel="noopener">Villa et Sehn</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a>.</p>
<button class="pareto-btn ui" data-k="pareto-c85-diag">▲ Loi de Pareto — Diagnostic, différentiel et urgences</button><h3 id="c85-biopsie-securite">Biopsie, anesthésie et corticoïdes : préserver le diagnostic sans perdre la sécurité</h3>
<p>Une dyspnée aggravée en décubitus, une impossibilité de rester allongé, un stridor, une syncope ou un retentissement cardiovasculaire augmentent l’inquiétude devant une masse médiastinale. L’absence de symptômes ne garantit pas l’absence de risque anesthésique. Le scanner précise la compression trachéobronchique et vasculaire ; une suspicion d’atteinte cardiaque ou de retentissement hémodynamique peut justifier une échocardiographie.</p>
<p>La revue européenne de 2024, avec participation de l’Inselspital de Berne, recommande une préparation associant anesthésistes, équipe du prélèvement, hématologues et réanimation. Pour une biopsie diagnostique, une anesthésie locale ou régionale est préférée lorsque le site et le geste le permettent. Si une anesthésie générale est nécessaire, la stratégie d’induction, de ventilation, de positionnement et de secours est préparée selon l’anatomie et la gravité ; ce n’est pas un protocole universel à appliquer à toute masse. La revue souligne la faible qualité et l’hétérogénéité des preuves disponibles.</p>
<table class="t"><tr><th>Corticoïdes avant biopsie : quelle population ?</th><th>Observation et limite</th></tr>
<tr><td>Lymphomes médiastinaux pédiatriques, série rétrospective de 1988–1998</td><td>Parmi 86 enfants, les 23 prétraités avaient des signes de compromis respiratoire. Le diagnostic ou la stadification a été affecté chez 5 de ces 23 enfants (22 %). Cette sélection par gravité empêche d’y lire un effet causal randomisé ou un risque applicable à tout adulte.</td></tr>
<tr><td>DLBCL nouvellement diagnostiqué chez l’adulte, étude rétrospective publiée en 2025</td><td>Sur 320 patients d’âge moyen 68 ans, 48 avaient reçu des corticoïdes avant biopsie. Le rendement diagnostique était de 83 % contre 81 % sans corticoïdes, sans différence statistiquement significative. Cette population ne prouve pas l’innocuité diagnostique dans chaque lymphome médiastinal pédiatrique ou chaque type de prélèvement.</td></tr></table>
<p>En pratique, l’équipe documente le risque immédiat, la possibilité d’obtenir rapidement du tissu, le produit déjà administré et l’heure des doses ; elle prévient l’hématopathologiste. Les données ne justifient ni une interdiction absolue des corticoïdes face à une menace vitale, ni leur prescription systématique avant toute biopsie. Aucune dose de secours ou durée d’attente universelle n’est déduite de ces séries.</p>
<p class="src"><a href="https://www.termedia.pl/Challenges-and-pitfalls-in-the-perioperative-management-of-mediastinal-mass-syndrome-an-up-to-date-review,40,53909,1,1.html" target="_blank" rel="noopener">Leivaditis et al., 2024 : évaluation clinique, imagerie, conduite anesthésique et limites des preuves</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/10873047/" target="_blank" rel="noopener">Borenstein et al., 2000, résumé complet lu</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41379445/" target="_blank" rel="noopener">Madireddy et al., 2025, résumé complet lu</a>. Les deux séries sont des données complémentaires nord-américaines ; elles ne remplacent pas une recommandation suisse.</p>
</section>
<section class="ilot" id="c85-10"><h2><span class="n">10</span>Première ligne du lymphome médiastinal primitif</h2><div class="key" id="c85-eha2025-update"><b>Actualisation européenne 2025.</b> Pour le lymphome médiastinal primitif, les recommandations de l’Association européenne d’hématologie privilégient R-CHOP14 ou un schéma intensifié tel que DA-EPOCH-R et recommandent d’éviter R-CHOP-21. En réponse métabolique complète, la radiothérapie médiastinale peut être omise. Un score Deauville 4 en fin de traitement conduit à discuter une biopsie et une surveillance métabolique selon le contexte. Ces propositions concernent l’entité médiastinale ; elles ne se confondent pas avec les adaptations du lymphome diffus à grandes cellules B présentées dans la section suivante. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12456099/" target="_blank" rel="noopener">Recommandations EHA 2025, sous-section Primary mediastinal B-cell lymphoma</a>, consultées le 2 novembre 2026. La prescription suisse exige ensuite les informations professionnelles des produits et la décision de l’équipe spécialisée.</div>
<p>L’objectif est la guérison. Onkopedia décrit les options R-CHOP et <button class="w" data-k="c85-daepoch">DA-EPOCH-R</button> sont les deux options principales (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 5.2.1.2). Les recommandations ESMO 2016 retiennent comme standards le R-CHOP, le R-V/MACOP-B, le R-CHOP14 ou le DA-EPOCH-R, au choix selon l’expérience du centre (niveau III, grade A). Elles recommandent la radiothérapie médiastinale de consolidation après chimio-immunothérapie standard (II, A), qui peut être omise en réponse métabolique complète après DA-EPOCH-R (III, C) ; si elle est faite, la dose est de 30 à 36 Gy en fractions de 1,5 à 2,0 Gy (II, A) (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a>). Ces recommandations datent de 2016 et l’essai IELSG37 les a modifiées.</p>
<p>L’essai <button class="w" data-k="c85-ielsg37">IELSG37</button> est un essai randomisé de non-infériorité : 545 patients inclus, 268 randomisés en réponse métabolique complète, pour recevoir ou non 30 Gy.</p>
<table class="t"><tr><th>Résultat</th><th>Sans radiothérapie</th><th>Avec 30 Gy</th></tr>
<tr><td>Survie sans progression à 30 mois</td><td>96,2 %</td><td>98,5 %</td></tr>
<tr><td>Survie globale à 5 ans</td><td>99 %</td><td>99 %</td></tr></table>
<p>Le rapport de risques instantanés est de 1,47 (intervalle de confiance à 95 % de 0,34 à 6,28). Les patients de score Deauville 4 ont une survie sans progression à 5 ans de 95,8 % ; ceux de score Deauville 5 ont une survie sans progression de 60,3 % et une survie globale de 74,6 % à 5 ans (<a href="https://doi.org/10.1200/JCO-24-01373" target="_blank" rel="noopener">IELSG37, Martelli et al.</a>). L’essai est coordonné par l’IOR de Bellinzona et l’IOSI, avec des auteurs suisses (Zucca, Ceriani, Cavalli, Ionescu).</p>
<p>La conséquence pratique est reprise par <button class="w" data-k="c85-onkopedia">Onkopedia 2025</button> (DGHO, OeGHO, SGMO, SSH) : la radiothérapie peut être omise si la TEP-TDM de fin de traitement est négative, et la TEP est recommandée pour décider de la radiothérapie (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 5.2.1.2). Les patients de score Deauville 5 forment un groupe à pronostic nettement plus réservé.</p>
<p>Une méta-analyse de 4068 patients rapporte une survie globale de 88 % avec une chimio-immunothérapie intensifiée contre 80 % avec R-CHOP-21 ou CHOP-21. Dans l’analyse limitée aux schémas contenant du rituximab, la survie globale est de 91 % avec les schémas intensifiés contre 86 % avec R-CHOP-21 (p = 0,03). Il s’agit d’associations de traitements, et non de rituximab en monothérapie. La radiothérapie a été moins utilisée avec les schémas intensifiés (22 % contre 55 %). Ces données sont observationnelles, sans essai randomisé (<a href="https://doi.org/10.3324/haematol.2023.283446" target="_blank" rel="noopener">Cook et al., méta-analyse de 4068 patients</a>). La chimiothérapie intensive suivie d’autogreffe n’est pas recommandée chez un patient en rémission complète (III, A) ; chez le sujet jeune sans réponse partielle et avec une TEP positive, elle est recommandée si une biopsie confirme le résidu (III, B) (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a>). Les recommandations pragmatiques du LYSA (2025) couvrent diagnostic, stadification, réponse et traitement ; seul leur résumé a été lu (<a href="https://doi.org/10.1016/j.ejca.2025.115369" target="_blank" rel="noopener">Renaud et al., recommandations pragmatiques LYSA, 2025 (résumé)</a>).</p>
<div class="trap"><span class="k">Erreur fréquente</span> Appliquer la radiothérapie de consolidation recommandée par ESMO 2016 sans tenir compte d’IELSG37. En réponse métabolique complète, la survie globale observée est de 99 % dans les deux bras ; le critère principal de non-infériorité porte sur la survie sans progression ; la décision se prend sur la TEP de fin de traitement.</div>
<div class="key"><b>À retenir.</b> Première ligne du lymphome médiastinal : les recommandations EHA 2025 privilégient R-CHOP14 ou un schéma intensifié tel que DA-EPOCH-R, en évitant R-CHOP-21. La radiothérapie de consolidation se décide sur la TEP de fin de traitement ; IELSG37 : survie sans progression à 30 mois de 96,2 % sans radiothérapie contre 98,5 % avec, survie globale à 5 ans de 99 % dans les deux bras. Deauville 5 : pronostic nettement plus réservé.</div>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://doi.org/10.1200/JCO-24-01373" target="_blank" rel="noopener">IELSG37, Martelli et al.</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 5.2.1.2</a> ; <a href="https://doi.org/10.3324/haematol.2023.283446" target="_blank" rel="noopener">Cook et al., méta-analyse de 4068 patients</a> ; <a href="https://doi.org/10.1016/j.ejca.2025.115369" target="_blank" rel="noopener">Renaud et al., recommandations pragmatiques LYSA, 2025 (résumé)</a>.</p></section>
<section class="ilot" id="c85-11"><h2><span class="n">11</span>Lymphome B sans précision : compléter avant de traiter</h2>
<p>Lorsqu’un compte rendu mentionne un « lymphome B » ou un « lymphome non hodgkinien » sans type (C85.1, C85.9), la conduite dépend du type exact : il faut re-biopsier ou compléter l’analyse avant de traiter (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 4.1 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a>). Une fois l’histologie complétée, le traitement dépend de l’entité identifiée.</p>
<p>Si l’histologie complétée montre un DLBCL, le standard international est de <button class="w" data-k="c85-rchop">6 cycles de R-CHOP-21 avec 8 doses de rituximab</button> (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 5.1). Le schéma s’adapte comme suit.</p>
<table class="t"><tr><th>Situation</th><th>Option citée par Onkopedia</th></tr>
<tr><td>Jusqu’à 60 ans, sans facteur de l’indice pronostique international et sans masse volumineuse</td><td>4 R-CHOP suivis de 2 doses de rituximab</td></tr>
<tr><td>Indice pronostique international de 2 à 5</td><td><button class="w" data-k="c85-polapchp">Pola-R-CHP</button> (polatuzumab védotine, rituximab, cyclophosphamide, doxorubicine, prednisone), qui améliore la survie sans progression sans différence de survie globale</td></tr>
<tr><td>Plus de 80 ans ou patient fragile</td><td>R-miniCHOP</td></tr>
<tr><td>Prophylaxie du système nerveux central</td><td>Non systématique ; guidée par le CNS-IPI</td></tr></table>
<p>La posologie du rituximab dans le DLBCL est de 375 mg/m² au jour 1 de chaque cycle de CHOP, toutes les 3 semaines, pendant 8 cycles (<a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a>).</p>
<div class="alert"><b>Divergence suisse.</b> L’information professionnelle suisse de Polivy® (novembre 2025) ne mentionne que le DLBCL en rechute ou réfractaire, en association avec la bendamustine et le rituximab, chez un patient non éligible à la greffe. Onkopedia cite l’autorisation européenne (EMA) en première ligne. En Suisse, le Pola-R-CHP en première ligne n’est donc pas couvert par l’indication de la préparation (<a href="https://amiko.oddb.org/fr/fi?gtin=7680671650020" target="_blank" rel="noopener">Polivy®, information professionnelle suisse, novembre 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>).</div>
<div class="trap"><span class="k">Piège</span> Transposer sans réserve le schéma du DLBCL au lymphome médiastinal primitif. Le DLBCL, NOS est défini par exclusion ; le traitement d’une entité précise (C85.2) suit ses propres données (section précédente).</div>
<div class="key"><b>À retenir.</b> Type non précisé : compléter d’abord. DLBCL confirmé : 6 R-CHOP-21 avec 8 doses de rituximab ; adaptations selon l’âge, l’indice pronostique et la fragilité. En Suisse, Polivy® n’est autorisé qu’en rechute.</div>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 4.1 et § 5.1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680671650020" target="_blank" rel="noopener">Polivy®, information professionnelle suisse, novembre 2025</a>.</p></section>
<section class="ilot" id="c85-12"><h2><span class="n">12</span>Rechute et réfractarité</h2>
<p>Le choix dépend du délai de la rechute et des lignes déjà reçues (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 5.2.1.3 ; informations professionnelles suisses).</p>
<table class="t"><tr><th>Situation</th><th>Conduite</th><th>Source</th></tr>
<tr><td>Réfractaire primaire ou rechute en 12 mois ou moins</td><td>CAR-T par <button class="w" data-k="c85-breyanzi">lisocabtagène maraleucel</button> (Breyanzi®)</td><td><a href="https://amiko.oddb.org/fr/fi?gtin=7680674690016" target="_blank" rel="noopener">Breyanzi®, information professionnelle suisse</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a></td></tr>
<tr><td>Rechute tardive (plus de 12 mois), chimiosensible</td><td>Rattrapage à base de platine (R-DHAP, R-GDP ou R-ICE), puis BEAM et autogreffe si au moins une rémission partielle ; radiothérapie intégrée au rattrapage si elle n’a pas été faite d’emblée</td><td><a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> (II, A)</td></tr>
<tr><td>Réfractaire ou récidivant après au moins deux traitements dont un avec rituximab</td><td><button class="w" data-k="c85-keytruda">Pembrolizumab</button> (Keytruda®), si non éligible à l’autogreffe ou en rechute après autogreffe</td><td><a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a></td></tr>
<tr><td>Récidivant ou réfractaire après au moins deux lignes systémiques</td><td><button class="w" data-k="c85-yescarta">Axicabtagène ciloleucel</button> (Yescarta®)</td><td><a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a></td></tr></table>
<p>Pour le CAR-T Breyanzi®, l’indication suisse couvre le lymphome médiastinal réfractaire à la première ligne ou en rechute dans les 12 mois ; la dose cible est de 100 × 10⁶ cellules T CAR+ viables, après lymphodéplétion par fludarabine 30 mg/m² et cyclophosphamide 300 mg/m² pendant 3 jours, selon l’essai TRANSFORM (<a href="https://amiko.oddb.org/fr/fi?gtin=7680674690016" target="_blank" rel="noopener">Breyanzi®, information professionnelle suisse</a>).</p>
<p>Le <b>blocage de PD-1</b> est autorisé dans cette indication seulement aux États-Unis et en Suisse, selon Onkopedia. La posologie du pembrolizumab est de 200 mg toutes les 3 semaines ou de 400 mg toutes les 6 semaines. L’essai KEYNOTE-170 (53 patients, âge médian de 33 ans) rapporte une réponse objective de 45 %, dont 19 % de rémissions complètes, et une survie globale à 12 mois de 58 % (<a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a>, août 2026).</p>
<p>Dans ZUMA-1 et ZUMA-7, la FI de l’axicabtagène ciloleucel rapporte un syndrome de libération de cytokines très fréquent, avec des débuts entre J1 et J12. Cette fenêtre observée ne fixe pas une date d’arrêt de la vigilance, d’où l’exigence d’au moins quatre doses de tocilizumab avant la perfusion (<a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a>). Avant tout traitement anti-B, on recherche le VHB, le VHC et le VIH ; la réactivation du VHB peut être fulminante, et le rituximab expose au risque de leucoencéphalopathie multifocale progressive (<a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a>).</p>
<div class="trap"><span class="k">Piège</span> Confondre les deux CAR-T. Le lisocabtagène maraleucel est indiqué dans le lymphome médiastinal réfractaire à la première ligne ou en rechute dans les 12 mois ; l’axicabtagène ciloleucel après au moins deux lignes systémiques.</div>
<div class="key"><b>À retenir.</b> Rechute en 12 mois ou moins ou réfractarité primaire : CAR-T. Rechute tardive chimiosensible : rattrapage à base de platine, BEAM et autogreffe. Troisième ligne et au-delà : pembrolizumab (Suisse et États-Unis) ou axicabtagène ciloleucel.</div>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 5.2.1.3</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674690016" target="_blank" rel="noopener">Breyanzi®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a>.</p>
<button class="pareto-btn ui" data-k="pareto-c85-trait">▲ Loi de Pareto — Traitement</button></section>
<section class="ilot" id="c85-13"><h2><span class="n">13</span>Réponse, suivi et effets tardifs</h2>
<p>La réponse s’évalue par la TEP selon l’échelle de <button class="w" data-k="c85-deauville">Deauville</button> en cinq points : 1 = aucune fixation ; 2 = fixation inférieure ou égale à celle du médiastin ; 3 = fixation supérieure à celle du médiastin mais inférieure ou égale à celle du foie ; 4 = fixation modérément supérieure à celle du foie ; 5 = fixation nettement supérieure à celle du foie et/ou nouvelles lésions. Les scores 1 à 3 correspondent à une réponse métabolique complète (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a>, tableau 2).</p>
<p>Dans le lymphome médiastinal, la TEP de fin de traitement a une excellente valeur prédictive négative, mais une faible valeur prédictive positive. Les faux positifs viennent de la fibrose, de l’inflammation liée au rituximab ou d’un rebond thymique. Une TEP positive doit donc être vérifiée, par biopsie ou par TEP répétée, avant de changer de traitement. La TEP se fait au moins 5 à 6 semaines après la dernière perfusion (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>) ; Onkopedia recommande 6 à 8 semaines (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 6.1.2).</p>
<p>Le suivi se fait tous les 3 mois pendant 2 ans, tous les 6 mois pendant 3 ans, puis chaque année à partir de la 6e année. Il comprend anamnèse, examen et biologie, sans imagerie systématique (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 6.2 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a>).</p>
<p>Les effets tardifs justifient une surveillance spécifique : risque accru de second cancer après CHOP avant 45 ans, risque d’insuffisance cardiaque accru par rapport à la population générale après anthracyclines, particulièrement lorsque l’exposition a eu lieu avant 55 ans, dépistage précoce du cancer du sein à envisager chez la femme jeune irradiée au médiastin (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 6.2), cancer du sein et coronaropathie accélérée après radiothérapie médiastinale (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>).</p>
<div class="trap"><span class="k">Erreur fréquente</span> Changer de traitement sur une TEP positive isolée, réalisée trop tôt. Le rebond thymique et l’inflammation post-rituximab donnent des faux positifs ; il faut respecter le délai et vérifier.</div>
<p>Aide pédagogique, non critère officiel : l’<button class="w" data-k="c85-mnemo">aide-mémoire des cinq étapes du lymphome médiastinal</button> résume la séquence biopsie, stade, traitement, TEP, décision.</p>
<div class="key"><b>À retenir.</b> Deauville 1 à 3 : réponse métabolique complète. Une TEP positive se vérifie avant d’agir. Suivi sans imagerie systématique ; surveiller le cœur, le sein et le risque de second cancer.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 6.1.2 et § 6.2</a>.</p><h3 id="c85-suisse-registre">En Suisse : information du patient et registre des tumeurs</h3><p>L’Office fédéral de la santé publique distingue un diagnostic oncologique confirmé d’un simple cas suspect. Pour les maladies soumises à déclaration, les données sont transmises au registre compétent. Le médecin qui annonce le diagnostic est responsable de l’information orale et écrite du patient, de la documentation de sa date et de sa transmission au registre. Le patient garde le droit de s’opposer à l’enregistrement de ses données. Cette démarche administrative accompagne le diagnostic ; elle ne remplace pas l’explication clinique de la maladie.</p><p class="src"><a href="https://www.bag.admin.ch/fr/obligation-de-declarer-une-maladie-oncologique" target="_blank" rel="noopener">OFSP, Obligation de déclarer une maladie oncologique, sections Diagnostic confirmé, Information et Opposition, page du 12 avril 2024 consultée le 2 novembre 2026</a>.</p><h3 id="c85-suisse-acces">Accès aux soins et situation professionnelle en Suisse</h3>
<table><tr><th>Question pratique</th><th>Ce qu’il faut distinguer</th></tr>
<tr><td>Indication et remboursement</td><td>L’autorisation Swissmedic et la prise en charge par l’assurance sont deux vérifications différentes. La liste des spécialités (LS) précise les préparations remboursées et leurs limitations ; une indication dans la FI ne suffit pas à garantir le remboursement de chaque situation clinique.</td></tr>
<tr><td>Utilisation hors indication ou hors limitation</td><td>Les articles 71a à 71d OAMal prévoient des exceptions sous conditions. Une demande complète de garantie est examinée par l’assureur après avis de son médecin-conseil ; l’accord doit être obtenu avant de considérer la prise en charge comme acquise. Il ne découle pas automatiquement de la gravité du cancer.</td></tr>
<tr><td>Matériel de soins</td><td>La LiMA concerne les moyens et appareils utilisés notamment à domicile ou en EMS. Elle ne remplace pas la LS des médicaments : le besoin concret en matériel et sa position doivent être vérifiés séparément.</td></tr>
<tr><td>Suspicion d’origine professionnelle</td><td>Rechercher et documenter les expositions professionnelles pertinentes. Une maladie doit remplir les critères de l’article 9 LAA pour être reconnue comme professionnelle ; le seul diagnostic de lymphome ne démontre ni ce lien ni une prise en charge par la Suva.</td></tr></table>
<p class="src">OFSP : <a href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">médicaments et LS</a>, <a href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">cas particuliers et garantie de prise en charge</a>, <a href="https://www.bag.admin.ch/fr/liste-des-moyens-et-appareils-lima" target="_blank" rel="noopener">LiMA</a>. Suva : <a href="https://www.suva.ch/fr-ch/prevention/arbeitsmedizin/connaitre-et-reconnaitre-les-maladies-professionnelles" target="_blank" rel="noopener">définition des maladies professionnelles</a>. Les limitations actuelles de chaque médicament doivent être consultées au moment de la prescription.</p>
<h3 id="c85-conduite-fi">Conduite automobile : raisonner selon le produit et les effets neurologiques</h3>
<table><tr><th>Produit exact</th><th>Consigne de la FI suisse consultée</th></tr>
<tr><td>Yescarta, août 2026</td><td>Ne pas conduire ni utiliser de machines lourdes ou dangereuses pendant au moins deux semaines après la perfusion, et prolonger cette abstention jusqu’à disparition complète des effets neurologiques éventuels.</td></tr>
<tr><td>Breyanzi, février 2026</td><td>Pas de conduite ni de machines lourdes ou dangereuses pendant au moins deux semaines après administration, en raison du risque d’événements neurologiques, dont troubles mentaux et convulsions.</td></tr>
<tr><td>Keytruda, août 2026</td><td>Prudence tant que le patient n’est pas certain de l’absence d’effet sur ses capacités, notamment en cas de fatigue.</td></tr></table>
<p>Le délai minimal d’une FI ne permet pas, à lui seul, de déclarer une personne apte si des symptômes persistent. Il faut également prendre en compte les autres médicaments et l’état clinique ; les durées ne sont pas transposées automatiquement à tous les CAR-T.</p>
<p class="src">Rubrique « Effet sur l’aptitude à la conduite et l’utilisation de machines » des FI exactes : <a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta</a>, <a href="https://amiko.oddb.org/fr/fi?gtin=7680674690016" target="_blank" rel="noopener">Breyanzi</a>, <a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda</a>.</p>
</section>
<section class="ilot" id="c85-14"><h2><span class="n">14</span>Situations particulières</h2>
<p><b>Grossesse.</b> Un cas publié décrit une compression médiastinale à 28 semaines d’aménorrhée, une césarienne urgente, puis un DA-EPOCH-R post-partum. Il s’agit d’un rapport de cas, non d’une recommandation (<a href="https://doi.org/10.1186/s12884-026-09432-3" target="_blank" rel="noopener">Wei et al., cas de grossesse</a>). La section 5.2.8 d’Onkopedia a été relue : elle distingue les risques selon le trimestre et souligne le risque de la chimiothérapie pendant l’organogenèse ainsi que les conséquences de la prématurité. Ces recommandations sur les lymphomes agressifs exigent une discussion hématologique et obstétricale individualisée ; elles ne sont pas un protocole spécifique de lymphome médiastinal déduit de ce rapport de cas. <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, grossesse et fertilité</a>.</p>
<p><b>Fertilité.</b> La préservation de la fertilité se discute avant le traitement. Onkopedia relie notamment le risque aux alkylants et à l’irradiation pelvienne, décrit une possible réduction de la réserve ovarienne, et recommande une conservation du sperme avant chimiothérapie en cas de désir d’enfant (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 5.2.8).</p>
<p><b>Pédiatrie.</b> PD-L1 est constamment exprimé dans le lymphome médiastinal pédiatrique. L’essai randomisé du nivolumab en première ligne n’a pas encore livré de résultats (attendus en 2027) (<a href="https://doi.org/10.3324/haematol.2026.300531" target="_blank" rel="noopener">Hoogstra et al., lymphomes pédiatriques (résumé)</a>, résumé).</p>
<p><b>Cardiopathie.</b> La doxorubicine liposomale ou l’étoposide peuvent remplacer la doxorubicine (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 5.2.6).</p>
<p><b>Sujet âgé ou fragile.</b> Au-delà de 80 ans ou chez un patient fragile, Onkopedia cite le R-miniCHOP pour le DLBCL (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 5.1).</p>
