<p><b>Insuffisance rénale ou hépatique.</b> Les recommandations dépendent du produit, pas du seul diagnostic. <span id="c85-organes-fi-2026">La FI suisse Keytruda (août 2026) ne demande pas d’adaptation en insuffisance rénale légère à modérée ; l’insuffisance rénale sévère n’a pas été étudiée. Pour le foie, aucune adaptation n’est demandée dans les formes légères ou modérées, avec données limitées pour les formes modérées ; les formes sévères n’ont pas été étudiées.</span> La FI Polivy (novembre 2025) ne demande pas d’adaptation pour une clairance de la créatinine d’au moins 30 ml/min ; aucune recommandation posologique n’est disponible en dessous de ce seuil. Elle demande d’éviter le produit si la bilirubine totale dépasse 1,5 fois la limite supérieure de la normale. Ces limites concernent ces préparations ; les autres composants des associations exigent leur propre FI. <a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">FI suisse Keytruda, insuffisances d’organe</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680671650020" target="_blank" rel="noopener">FI suisse Polivy, instructions posologiques particulières</a>.</p>
<p><b>Cas récapitulatif.</b> Une femme de 34 ans avec masse médiastinale et syndrome cave est biopsiée (médiastinoscopie), le diagnostic de lymphome médiastinal primitif est confirmé, la TEP stadifie un stade II, un dépistage de l’hépatite B est négatif, et un DA-EPOCH-R est débuté en urgence. La TEP de fin de traitement, réalisée six à huit semaines après la dernière cure, montre un score Deauville 3 : la radiothérapie est omise (<a href="https://doi.org/10.1002/jha2.151" target="_blank" rel="noopener">Villa et Sehn</a> ; <a href="https://doi.org/10.1200/JCO-24-01373" target="_blank" rel="noopener">IELSG37, Martelli et al.</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>).</p>
<div class="key"><b>À retenir.</b> Grossesse, fertilité, pédiatrie et insuffisance d’organe reposent sur des données très limitées : cas isolé, essais en cours ou lacune. Ne pas transformer un rapport de cas en recommandation.</div>
<p class="src">Références : <a href="https://doi.org/10.1186/s12884-026-09432-3" target="_blank" rel="noopener">Wei et al., cas de grossesse</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 5.1, § 5.2.6 et § 5.2.8</a> ; <a href="https://doi.org/10.3324/haematol.2026.300531" target="_blank" rel="noopener">Hoogstra et al., lymphomes pédiatriques (résumé)</a> ; <a href="https://doi.org/10.1002/jha2.151" target="_blank" rel="noopener">Villa et Sehn</a> ; <a href="https://doi.org/10.1200/JCO-24-01373" target="_blank" rel="noopener">IELSG37, Martelli et al.</a>.</p><h3 id="c85-cytotoxiques-fi">Composants cytotoxiques : contrôler la préparation et la fonction d’organe</h3>
<p>Les doses d’une association comme DA-EPOCH-R sont celles du protocole hématologique retenu, avec adaptation aux nadirs et à la tolérance. Les règles ci-dessous décrivent les informations professionnelles suisses des préparations nommées ; elles ne constituent pas, à elles seules, une ordonnance complète de l’association. Une réduction de 50 % signifie administrer la moitié de la dose de référence du protocole.</p>
<table class="t"><tr><th>Préparation exacte</th><th>Rein</th><th>Foie et sécurité d’administration</th></tr>
<tr><td>Endoxan, poudre pour solution injectable</td><td>La FI propose une réduction de 50 % en insuffisance rénale sévère lorsque la clairance de la créatinine est inférieure à 10 ml/min ; l’adaptation doit rester liée au protocole et à la surveillance.</td><td>La copie consultée comporte une unité incohérente pour son seuil de bilirubine. Cette valeur n’est pas reproduite comme règle posologique : vérifier le document officiel exploitable et l’adaptation avec la pharmacie d’oncologie avant administration.</td></tr>
<tr><td>Doxorubicine Sandoz</td><td>Si la clairance est inférieure à 10 ml/min, ne pas dépasser 75 % de la dose prévue, soit une réduction d’au moins 25 % selon cette FI.</td><td>La FI prévoit une réduction en hyperbilirubinémie et contre-indique l’insuffisance hépatique sévère. Ses intervalles se rejoignent à 51 µmol/l : ne pas fabriquer une règle non ambiguë à cette borne. La présentation de 200 mg/100 ml sert à la préparation centralisée hospitalière et ne s’administre pas directement au patient.</td></tr>
<tr><td>Vincristin-Teva</td><td>Aucune adaptation rénale n’est demandée dans cette FI.</td><td>Si la bilirubine directe dépasse 3 mg/dl, réduire la dose initiale de 50 %. Administration intraveineuse exclusivement : l’injection intrathécale peut entraîner une paralysie ascendante mortelle.</td></tr>
<tr><td>Etoposide Sandoz</td><td>Pour une clairance de 15 à 50 ml/min, la FI recommande 50 à 75 % de la dose habituelle selon l’état du patient. En dessous de 15 ml/min, elle ne fournit pas de recommandation posologique faute d’expérience.</td><td>Cette FI ne demande pas d’adaptation en hyperbilirubinémie ; cette consigne n’est pas extrapolée à toutes les préparations ou insuffisances hépatiques. Dans son mode d’administration général : perfusion lente de 30 à 60 minutes, jamais en bolus. La perfusion prolongée d’un protocole DA-EPOCH-R relève de ce protocole spécifique.</td></tr>
<tr><td>Prednisone Streuli</td><td>La dose est individualisée selon la maladie, sa gravité et la réponse ; une dose de corticothérapie générale ne remplace pas celle du protocole du lymphome.</td><td>Le plein effet n’est pas immédiat : la FI indique 4 à 8 heures. Le corticoïde complète habituellement le traitement de fond et ne remplace pas les mesures nécessaires devant une urgence compressive.</td></tr></table>
<p class="src">FI suisses, rubriques posologie, populations particulières et administration : <a href="https://amiko.oddb.org/fr/fi?gtin=7680254420750" target="_blank" rel="noopener">Endoxan injectable</a>, <a href="https://amiko.oddb.org/fr/fi?gtin=7680548280015" target="_blank" rel="noopener">Doxorubicine Sandoz</a>, <a href="https://amiko.oddb.org/fr/fi?gtin=7680480001006" target="_blank" rel="noopener">Vincristin-Teva</a>, <a href="https://amiko.oddb.org/fr/fi?gtin=7680551650072" target="_blank" rel="noopener">Etoposide Sandoz</a>, <a href="https://amiko.oddb.org/fr/fi?gtin=7680293490370" target="_blank" rel="noopener">Prednisone Streuli</a>. Contrôler la version et la préparation au moment de la prescription.</p>
<h3 id="c85-pediatrie-produit">Enfant et adolescent : ne pas réduire simplement une prescription adulte</h3>
<p>L’équipe d’hématologie pédiatrique choisit un protocole adapté à l’entité, à l’âge et au développement. La FI Etoposide Sandoz indique que l’efficacité et la sécurité pédiatriques n’ont pas été confirmées dans des études contrôlées et réserve l’utilisation pédiatrique aux études cliniques. Les indications et doses pédiatriques d’autres composants ne valident donc pas automatiquement toute l’association. L’indication du pembrolizumab dans le lymphome médiastinal de la FI suisse consultée concerne l’adulte ; l’autorisation pédiatrique pour une autre maladie n’est pas transférable. Les résultats attendus d’un essai de nivolumab ne constituent pas une recommandation de première ligne.</p>
</section>
<section class="ilot" id="c85-15"><h2><span class="n">15</span>Critères formels et paramètres clés</h2>
<div class="alert"><b>Diagnostic formel : synthèse anatomoclinique et hématopathologique. Les éléments ci-dessous guident cette synthèse ; ils ne constituent pas un score validé ni une règle imposant la positivité simultanée de chaque marqueur.</b> (1) Histologie sur biopsie tissulaire, sans cytoponction seule, montrant une prolifération diffuse de grandes cellules B CD20 positives (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>). (2) Masse médiastinale antérieure (thymique) dominante, sans atteinte ganglionnaire à distance prédominante (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a>). (3) Phénotype compatible, interprété en panel : absence habituelle d’immunoglobuline de surface, expression fréquente de CD23, expression souvent faible de CD30, expression possible de MAL, CD15 généralement négatif. Les fréquences rapportées dans les sources montrent que ces marqueurs ne sont pas tous obligatoirement positifs chez chaque patient (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>). (4) Exclusion du lymphome de Hodgkin classique et de la zone grise médiastinale par l’hématopathologiste (<a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a>). Le codage suit le diagnostic, sans constituer un critère biologique supplémentaire : C85.2 si lymphome médiastinal primitif ; C85.1 ou C85.9 seulement si le type n’est pas précisé, ce qui impose de compléter le diagnostic (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc C81–C96 (BfArM)</a>).</div>
<div class="key"><b>Paramètres clés.</b> Lymphome médiastinal primitif : environ 10 % des DLBCL ; âge médian d’environ 35 ans ; prédominance féminine (environ 1,5:1). Syndrome cave supérieur : environ 50 % ; stades I–II : environ 80 % ; atteinte médullaire : 1 à 5 %. Suisse, lymphomes non hodgkiniens (C82–C86, C96) : environ 1620 nouveaux cas par an (2013–2017). IELSG37 : survie sans progression à 30 mois de 96,2 % sans radiothérapie contre 98,5 % avec ; survie globale à 5 ans de 99 %. DA-EPOCH-R : survie globale à 5 ans de 97 % (étude à un bras). TEP : réponse métabolique complète = Deauville 1 à 3 ; TEP de fin de traitement au moins 5 à 6 semaines après la dernière perfusion. Pembrolizumab (KEYNOTE-170) : réponse objective de 45 %, rémission complète de 19 %. Rituximab : 375 mg/m² par cycle ; AgHBs et anti-HBc avant traitement.</div>
<p class="src">Références principales : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://doi.org/10.1200/JCO-24-01373" target="_blank" rel="noopener">IELSG37, Martelli et al.</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc C81–C96 (BfArM)</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/19305697/master" target="_blank" rel="noopener">Le cancer en Suisse, rapport 2021 (OFS)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a>.</p>

<div class="panel" id="pE" hidden><nav class="toc ui"><b>Examens du lymphome médiastinal et des lymphomes non précisés</b><ol><li><a href="#c85-e-1">Chaque examen répond à une question</a></li><li><a href="#c85-e-2">Biopsie et histopathologie</a></li><li><a href="#c85-e-3">TEP-TDM et échelle de Deauville</a></li><li><a href="#c85-e-4">Stadification de Lugano et indice pronostique</a></li><li><a href="#c85-e-5">Biologie et bilan avant traitement</a></li><li><a href="#c85-e-6">Imagerie de la masse</a></li><li><a href="#c85-e-7">Configurations : entité et résultats</a></li><li><a href="#c85-e-8">Entraînement</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="c85-e-1"><h2><span class="n">1</span>Chaque examen répond à une question</h2>
<p>Un lymphome se nomme par l’histologie et se mesure par la TEP. Le <b>standard de référence du diagnostic est l’histologie d’un échantillon tissulaire suffisant, relue par un hématopathologiste</b> (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 4.1). Le <b>standard de référence de l’extension et de la réponse est la TEP-TDM au FDG, exprimée selon Lugano</b> (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 4.2 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a>). Les autres examens répondent à des questions plus étroites.</p>
<table class="t"><tr><th>Question</th><th>Examen</th><th>Statut</th></tr>
<tr><td>De quelle maladie s’agit-il ?</td><td><button class="w" data-k="c85-biopsie">Biopsie tissulaire</button>, immunohistochimie, cytogénétique, biologie moléculaire</td><td>Indiquée, avant le traitement</td></tr>
<tr><td>Quelle est l’extension ?</td><td><button class="w" data-k="c85-tep">TEP-TDM au FDG</button></td><td>Obligatoire dans le lymphome médiastinal primitif</td></tr>
<tr><td>La moelle est-elle atteinte ?</td><td><button class="w" data-k="c85-moelle">Biopsie ostéomédullaire</button></td><td>Conditionnelle</td></tr>
<tr><td>Quelle est la compression ?</td><td>Scanner, puis IRM selon l’extension</td><td>Indiqué</td></tr>
<tr><td>Le patient peut-il recevoir le traitement ?</td><td>Biologie, sérologies, ECG, échocardiographie</td><td>Indiqués avant l’anthracycline et le rituximab</td></tr>
<tr><td>Quelle est la réponse ?</td><td>TEP de fin de traitement, score de <button class="w" data-k="c85-deauville">Deauville</button></td><td>Indiquée, décision de radiothérapie</td></tr></table>
<p>Un résultat ne répond qu’à la question pour laquelle il a été demandé : une TEP très fixante ne nomme pas la tumeur, et une histologie correcte ne dit rien de l’extension.</p>
<div class="key"><b>À retenir.</b> Gold standard du diagnostic : histologie sur biopsie suffisante relue par un hématopathologiste. Gold standard de l’extension et de la réponse : TEP-TDM au FDG, interprétée selon Lugano et l’échelle de Deauville.</div>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 4.1 et § 4.2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a>.</p></section>
<section class="ilot" id="c85-e-2"><h2><span class="n">2</span>Biopsie et histopathologie</h2>
<p>La biopsie est l’examen qui décide du diagnostic. L’échantillon idéal est le ganglion entier ; la <button class="w" data-k="c85-biopsie">cytoponction à l’aiguille fine est insuffisante</button>. Dans le lymphome médiastinal, la biopsie se fait par aiguille percutanée, médiastinoscopie, médiastinotomie antérieure ou mini-thoracotomie. Le choix de la technique tient à la sclérose, qui rend la tumeur hétérogène.</p>
<p>La morphologie montre une prolifération diffuse de grandes cellules à cytoplasme clair avec une <button class="w" data-k="c85-sclerose">sclérose compartimentante</button>. L’immunohistochimie confirme le phénotype ; le tableau regroupe les marqueurs qui permettent de situer l’entité.</p>
<table class="t"><tr><th>Marqueur</th><th>Résultat dans le lymphome médiastinal primitif</th><th>Intérêt</th></tr>
<tr><td>CD19, CD20, CD22, CD79a, CD45</td><td>Positifs</td><td>Lignée B ; CD20 cible du rituximab</td></tr>
<tr><td>Immunoglobuline de surface</td><td>Absente</td><td>Distingue de nombreux lymphomes B matures</td></tr>
<tr><td>CD30</td><td>Faible, dans environ 80 % des cas</td><td>Parenté avec le Hodgkin classique</td></tr>
<tr><td>MAL</td><td>Positif dans environ 70 % des cas</td><td>Oriente vers l’origine thymique</td></tr>
<tr><td>CD23</td><td>Souvent positif</td><td>Argument en faveur de l’entité</td></tr>
<tr><td>CD15</td><td>Négatif</td><td>Argument contre un Hodgkin classique</td></tr>
<tr><td>CD10, CD21</td><td>Typiquement négatifs</td><td>Contribue à écarter d’autres lymphomes B</td></tr>
<tr><td>BCL6, IRF4</td><td>Variables</td><td>Non discriminants seuls</td></tr></table>
<p>Aucune valeur normale n’est attendue ici : l’interprétation est qualitative et se fait en bloc, par l’hématopathologiste. Les seuils chiffrés (CD30 ≈ 80 %, MAL ≈ 70 %) décrivent la fréquence d’un marqueur dans la série, non un critère de positivité d’un cas.</p>
<div class="trap"><span class="k">Piège</span> Interpréter un marqueur isolé. Le CD30 est exprimé aussi dans le Hodgkin classique, et l’exclusion de la zone grise et du Hodgkin repose sur l’ensemble morphologique et immunohistochimique (<a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>).</div>
<div class="trap"><span class="k">Erreur fréquente</span> Conclure sur une biopsie trop petite, où la sclérose domine. Le prélèvement doit être suffisant pour toutes les analyses.</div>
<div class="key"><b>À retenir.</b> Phénotype : marqueurs pan-B positifs, immunoglobuline de surface négative, CD23 souvent positif, CD30 faible, MAL positif, CD15 négatif. Le diagnostic repose sur l’ensemble.</div>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 4.1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a>.</p></section>
<section class="ilot" id="c85-e-3"><h2><span class="n">3</span>TEP-TDM et échelle de Deauville</h2>
<p>La TEP est <b>obligatoire</b> dans le lymphome médiastinal primitif, qui fixe le FDG dans tous les cas (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a>). C’est la méthode préférée de stadification et d’évaluation de la réponse (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 4.2 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a>). Elle conduit à réviser le stade à la hausse dans environ 20 % des cas (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>).</p>
<table class="t"><tr><th>Score de <button class="w" data-k="c85-deauville">Deauville</button></th><th>Fixation</th><th>Lecture</th></tr>
<tr><td>1</td><td>Aucune fixation</td><td>Réponse métabolique complète</td></tr>
<tr><td>2</td><td>Inférieure ou égale au médiastin</td><td>Réponse métabolique complète</td></tr>
<tr><td>3</td><td>Supérieure au médiastin, inférieure ou égale au foie</td><td>Réponse métabolique complète</td></tr>
<tr><td>4</td><td>Modérément supérieure au foie</td><td>Réponse incomplète ; vérifier</td></tr>
<tr><td>5</td><td>Nettement supérieure au foie et/ou nouvelles lésions</td><td>Pronostic nettement plus réservé dans IELSG37</td></tr></table>
<p>Dans le lymphome médiastinal, la TEP de fin de traitement a une excellente valeur prédictive négative et une faible valeur prédictive positive. Les faux positifs viennent de la fibrose, de l’inflammation liée au rituximab ou d’un <button class="w" data-k="c85-rebond">rebond thymique</button>. La TEP doit être réalisée au moins 5 à 6 semaines après la dernière perfusion (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>) ; Onkopedia recommande 6 à 8 semaines (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 6.1.2).</p>
<div class="trap"><span class="k">Erreur fréquente</span> Escalader un traitement sur une TEP positive précoce. Une TEP positive se vérifie par biopsie ou par TEP répétée avant de changer de conduite.</div>
<div class="key"><b>À retenir.</b> TEP : stadification, révision de stade dans environ 20 % des cas, décision de radiothérapie. Deauville 1 à 3 : réponse métabolique complète. Délai : au moins 5 à 6 semaines après la dernière perfusion.</div>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 4.2 et § 6.1.2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://doi.org/10.1200/JCO-24-01373" target="_blank" rel="noopener">IELSG37, Martelli et al.</a>.</p></section>
<section class="ilot" id="c85-e-4"><h2><span class="n">4</span>Stadification de Lugano et indice pronostique</h2>
<p>La stadification de <button class="w" data-k="c85-lugano">Lugano</button> (Ann Arbor modifiée) classe l’extension (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a>).</p>
<table class="t"><tr><th>Stade</th><th>Définition</th></tr>
<tr><td>I</td><td>Une région ou un groupe de ganglions adjacents ; IE : lésion extranodale unique sans atteinte ganglionnaire</td></tr>
<tr><td>II</td><td>Au moins deux groupes ganglionnaires du même côté du diaphragme ; IIE : extension extranodale contiguë limitée</td></tr>
<tr><td>II bulky</td><td>Stade II avec masse volumineuse ; regroupement thérapeutique limité ou avancé selon l’histologie et les facteurs pronostiques</td></tr>
<tr><td>III</td><td>Ganglions des deux côtés du diaphragme, ou ganglions sus-diaphragmatiques avec atteinte de la rate</td></tr>
<tr><td>IV</td><td>Atteinte extralymphatique non contiguë</td></tr></table>
<p>Dans Lugano, les mentions A/B ne sont exigées que pour le lymphome de Hodgkin. La rate est un tissu lymphatique pour ce classement ; son atteinte ne signifie pas automatiquement stade IV. Le suffixe E concerne les atteintes extranodales limitées et n’est pas pertinent dans une maladie avancée. Le diamètre maximal de la masse doit être documenté. Le texte de Lugano de 2014 discutait l’absence d’un seuil universel validé pour le DLBCL ; les recommandations EHA 2025 indiquent désormais que le seuil de 7,5 cm ou plus est largement utilisé. Onkopedia retient aussi ce seuil en Allemagne et signale que certains pays utilisent 10 cm (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 4.4.3).</p>
<p class="src" id="c85-bulk-eha-reference"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12456099/" target="_blank" rel="noopener">EHA 2025, traitement initial des lymphomes à grandes cellules B</a>. Le seuil descriptif ne remplace ni la stadification ni l’appréciation de la compression.</p>
<p>L’<button class="w" data-k="c85-ipi">indice pronostique international</button> compte cinq facteurs : âge supérieur à 60 ans, LDH élevée, stade III–IV, ECOG ≥ 2, plus d’un site extranodal. Dans les données de DLBCL présentées par Onkopedia, la survie globale à 3 ans est de 91 % pour 0–1 point, 81 % pour 2, 65 % pour 3 et 59 % pour 4–5 (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 4.4.1 ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a>, tableau 4). Dans le lymphome médiastinal, son pouvoir discriminant est limité par l’âge jeune et la maladie confinée au médiastin (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a>).</p>
<div class="trap"><span class="k">Piège</span> Utiliser l’indice pronostique international pour pronostiquer une femme de 30 ans avec une masse médiastinale. Ses facteurs (âge, stade avancé, sites extranodaux) sont rarement présents dans cette population ; la réponse métabolique de fin de traitement guide davantage la décision de radiothérapie.</div>
<div class="key"><b>À retenir.</b> Les stades I–II concernent environ 80 % des patients. L’indice pronostique international a un faible pouvoir discriminant dans le lymphome médiastinal.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 4.4</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, tableau 4</a>.</p></section>
<section class="ilot" id="c85-e-5"><h2><span class="n">5</span>Biologie et bilan avant traitement</h2>
<p>La biologie mesure la charge tumorale, l’état des organes et les infections à risque. Le bilan comprend l’hémogramme et la formule ; la bilirubine, l’ASAT, l’ALAT, les phosphatases alcalines, la GGT et la créatinine ; la LDH, qui reflète la prolifération ; l’acide urique, qui reflète la lyse cellulaire ; et les sérologies des hépatites et du VIH (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 4.3). Avant le rituximab, on recherche au minimum l’AgHBs et l’anti-HBc (<a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a>). L’ECG et l’échocardiographie précèdent l’anthracycline (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>, § 4.3).</p>
<p>Le dossier ne fournit pas d’intervalle de référence suisse pour ces paramètres : l’interprétation se fait avec les valeurs du laboratoire qui a réalisé l’analyse. La <button class="w" data-k="c85-moelle">biopsie ostéomédullaire</button> est inutile si la TEP montre une atteinte osseuse ou médullaire ; si la TEP est négative, elle n’est indiquée que si une histologie discordante changerait la conduite (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a>). Onkopedia la demande si aucune TEP n’est faite (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>).</p>
<div class="trap"><span class="k">Erreur fréquente</span> Débuter le rituximab sans rechercher l’AgHBs et l’anti-HBc. La réactivation de l’hépatite B peut être fulminante.</div>
<div class="key"><b>À retenir.</b> LDH : prolifération. Acide urique : lyse. AgHBs et anti-HBc : avant le rituximab. ECG et échocardiographie : avant l’anthracycline.</div>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 4.3</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a>.</p></section>
<section class="ilot" id="c85-e-6"><h2><span class="n">6</span>Imagerie de la masse</h2>
<p>Le scanner montre souvent nécrose, kystes ou hémorragie, ainsi que la compression ou la thrombose des vaisseaux médiastinaux. L’IRM précise l’extension aux gros vaisseaux, au cœur et à la paroi (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>). Ces images décrivent la masse ; aucune ne remplace l’histologie, car le scanner distingue mal un lymphome solitaire d’un thymome (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al., masses médiastinales, 2013</a>). La radiographie initiale du thorax, qui a fait suspecter la masse, ne donne ni le stade ni le type.</p>
<div class="key"><b>À retenir.</b> Le scanner et l’IRM mesurent l’extension locale (vaisseaux, cœur, paroi) ; l’histologie nomme la tumeur.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al., masses médiastinales, 2013</a>.</p></section>
<section class="ilot" id="c85-e-7"><h2><span class="n">7</span>Configurations : entité et résultats</h2>
<p>Le tableau croise les entités du médiastin antérieur avec les résultats qui les caractérisent. Il sert à raisonner, non à poser un diagnostic sans histologie.</p>
<table class="t"><tr><th>Entité</th><th>Histologie et phénotype</th><th>Biologie ou imagerie orientant</th></tr>
<tr><td>Lymphome médiastinal primitif</td><td>Grandes cellules B, sclérose, immunoglobuline de surface négative, CD23+, MAL+, CD15−</td><td>TEP : fixation constante ; masse volumineuse</td></tr>
<tr><td>Hodgkin classique scléronodulaire</td><td>Parenté avec le lymphome médiastinal ; CD30</td><td>Entité fréquente (50 à 70 % des lymphomes médiastinaux)</td></tr>
<tr><td>Zone grise médiastinale</td><td>Aspect intermédiaire, relu par expert</td><td>Reproductibilité difficile</td></tr>
<tr><td>Thymome</td><td>Tumeur épithéliale thymique (non détaillée ici)</td><td>Myasthénie chez 30 à 50 % des patients</td></tr>
<tr><td>Tumeur germinale non séminomateuse</td><td>Non détaillée ici</td><td>AFP ou β-hCG élevées</td></tr></table>
<div class="key"><b>À retenir.</b> Aucune ligne du tableau ne dispense de la biopsie. Les marqueurs AFP et β-hCG et la myasthénie sont les indices extra-histologiques utiles.</div>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al., masses médiastinales, 2013</a> ; <a href="https://doi.org/10.1111/bjh.70432" target="_blank" rel="noopener">Sabattini et al., zone grise médiastinale (résumé)</a>.</p></section>
<section class="ilot" id="c85-e-8"><h2><span class="n">8</span>Entraînement</h2>
<div class="quiz ui"><p><b>Cas pédagogique fictif 1.</b> Une femme de 34 ans présente une masse du médiastin antérieur avec syndrome cave supérieur. Une cytoponction à l’aiguille fine mentionne « cellules B atypiques ». Que faites-vous ?</p><button data-ok="0">Je débute un R-CHOP sur ce résultat, puisque le diagnostic de lymphome B est posé.</button><button data-ok="1">J’organise une biopsie tissulaire suffisante (percutanée, médiastinoscopie ou autre) relue par un hématopathologiste, sans retarder la prise en charge de la compression.</button><button data-ok="0">Je me fie à la TEP pour nommer la tumeur.</button><p class="fb" hidden>La cytoponction est insuffisante pour le diagnostic ; il faut un échantillon tissulaire (Onkopedia 2025, Lugano). La TEP stadifie sans nommer. Le type exact conditionne le schéma ; la compression ne justifie pas un diagnostic incomplet mais une organisation rapide de la biopsie.</p></div>
<div class="quiz ui"><p><b>Cas pédagogique fictif 2.</b> Un lymphome médiastinal primitif a reçu 6 cycles de DA-EPOCH-R. La TEP de fin de traitement, réalisée six à huit semaines après la dernière cure, montre un score Deauville 3. Que décidez-vous pour la radiothérapie ?</p><button data-ok="0">Je l’impose, car ESMO 2016 la recommande après toute chimio-immunothérapie.</button><button data-ok="1">Je peux l’omettre : réponse métabolique complète (Deauville 1 à 3), conformément à Onkopedia 2025 et à l’essai IELSG37.</button><button data-ok="0">Je programme d’emblée une autogreffe.</button><p class="fb" hidden>L’autogreffe n’est pas recommandée en rémission complète. IELSG37 : survie sans progression à 30 mois de 96,2 % sans radiothérapie contre 98,5 % avec 30 Gy, survie globale à 5 ans de 99 % dans les deux bras. Les patients Deauville 5 ont un pronostic nettement plus réservé.</p></div>
<div class="quiz ui"><p><b>Cas pédagogique fictif 3.</b> Un patient rechute 8 mois après un R-CHOP suivi de radiothérapie pour un lymphome médiastinal. Quelle option est la plus cohérente avec l’indication suisse ?</p><button data-ok="1">Un CAR-T par lisocabtagène maraleucel, car la rechute survient dans les 12 mois.</button><button data-ok="0">Un rattrapage à base de platine suivi de BEAM et d’autogreffe, réservé aux rechutes tardives.</button><button data-ok="0">Le pembrolizumab d’emblée, sans autre ligne préalable.</button><p class="fb" hidden>L’indication suisse du lisocabtagène couvre le lymphome médiastinal réfractaire à la première ligne ou en rechute dans les 12 mois. Le rattrapage au platine concerne la rechute tardive chimiosensible. Le pembrolizumab exige au moins deux traitements préalables dont un avec rituximab.</p></div>
<div class="quiz ui"><p><b>Cas pédagogique fictif 4.</b> Une TEP faite 3 semaines après la dernière perfusion montre un score Deauville 4. Quelle est la bonne attitude ?</p><button data-ok="0">Je conclus à un échec et je change de traitement.</button><button data-ok="1">Je respecte le délai d’au moins 5 à 6 semaines et je vérifie le résultat (biopsie ou TEP répétée) avant d’agir : fibrose, inflammation post-rituximab et rebond thymique donnent des faux positifs.</button><button data-ok="0">Je considère la TEP comme sans valeur dans cette maladie.</button><p class="fb" hidden>La valeur prédictive négative est excellente, la valeur prédictive positive faible. Une TEP positive se vérifie avant de changer de traitement.</p></div>
<div class="quiz ui"><p><b>Cas pédagogique fictif 5.</b> Un compte rendu mentionne uniquement « lymphome non hodgkinien » (C85.9). Quelle est la bonne démarche ?</p><button data-ok="0">Débuter un traitement empirique de lymphome B.</button><button data-ok="1">Compléter l’analyse ou re-biopsier, faire relire par un hématopathologiste, puis traiter l’entité identifiée.</button><button data-ok="0">Considérer le code comme un diagnostic définitif.</button><p class="fb" hidden>C85.1 et C85.9 sont des codes de précision insuffisante. Le traitement dépend du type exact ; le DLBCL confirmé relève par exemple de 6 cycles de R-CHOP-21 avec 8 doses de rituximab.</p></div>
