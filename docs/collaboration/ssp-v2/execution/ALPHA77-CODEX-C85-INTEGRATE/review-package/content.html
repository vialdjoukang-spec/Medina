<div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="c85-tab-semio" role="tab" aria-selected="true" aria-controls="c85-s-semio" data-s="c85-s-semio">Sémiologie fondamentale et analytique</button><button role="tab" aria-selected="false" aria-controls="c85-s-anat" data-s="c85-s-anat">Anatomie du médiastin</button><button role="tab" aria-selected="false" aria-controls="c85-s-histo" data-s="c85-s-histo">Histologie</button><button role="tab" aria-selected="false" aria-controls="c85-s-physio" data-s="c85-s-physio">Physiologie</button><button role="tab" aria-selected="false" aria-controls="c85-s-immuno" data-s="c85-s-immuno">Immunologie</button><button role="tab" aria-selected="false" aria-controls="c85-s-gen" data-s="c85-s-gen">Génétique moléculaire</button></div><div class="chap-body sci-body"><div class="sci" id="c85-s-semio" role="tabpanel" aria-labelledby="c85-tab-semio"><section class="ilot" id="c85-semio-intro"><h2>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h2><p>La sémiologie relie ce que le patient ressent, ce que l’examen observe et ce que les examens démontrent. Dans cette leçon, elle explique surtout comment une masse médiastinale produit des signes à distance et pourquoi ces signes ne remplacent pas le diagnostic tissulaire.</p></section><section class="ilot" id="c85-semio-normal" data-semiology="normal"><h3>Le normal : un passage central pour le sang, l’air et les aliments</h3><p>Avant d’interpréter un gonflement du visage, il faut situer le trajet du sang. La veine cave supérieure ramène vers l’oreillette droite le sang de la tête, du cou, du thorax et des membres supérieurs. Elle réunit ainsi des territoires éloignés en un même trajet veineux central. Un signe observé au visage peut donc révéler une difficulté située dans le thorax, et non une affection locale du visage.</p><p>Le médiastin se situe entre les cavités pleurales, depuis l’entrée du thorax jusqu’au diaphragme. La localisation antérieure d’une masse est un premier renseignement anatomique ; elle n’est pas son diagnostic histologique. En effet, une affection thymique, un lymphome, une lésion thyroïdienne ou une tumeur germinale peuvent occuper ce compartiment. Le raisonnement doit relier le territoire atteint à l’imagerie, puis à la nature du tissu prélevé.</p><p class="src">Passages de référence : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways" target="_blank" rel="noopener">OpenStax, retour veineux et veine cave supérieure</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al., Introduction et masses médiastinales</a>.</p></section><section class="ilot" id="c85-semio-signs" data-semiology="signs"><h3>Les symptômes : distinguer compression locale et retentissement général</h3><p>Dans le lymphome médiastinal, la toux, la dyspnée et la dysphagie appartiennent à la présentation compressive. L’interrogatoire précise leur apparition, leur progression et leur association. Il recherche aussi un gonflement du visage ou des bras ainsi qu’une distension des veines du cou et du thorax. Ces constatations correspondent au <button class="w" data-k="c85-vcs">syndrome cave supérieur</button> décrit dans les sources ; elles orientent vers une atteinte du retour veineux central.</p><p>En revanche, les <button class="w" data-k="c85-symptomes-b">symptômes B</button> décrivent le retentissement général. La définition utilisée par Onkopedia comprend une fièvre inexpliquée supérieure à 38 °C, des sueurs nocturnes nécessitant de changer le linge, ou une perte de poids inexpliquée supérieure à 10 % en six mois. Ces seuils définissent les symptômes, pas à eux seuls le lymphome. Le poids antérieur, la durée et les autres explications possibles doivent donc être précisés.</p><p>La présence d’une masse médiastinale ne se résume pas aux ganglions palpables. La revue de Nappi rapporte que l’atteinte ganglionnaire à distance est rare dans cette entité. Ainsi, l’examen des aires superficielles et l’exploration du thorax répondent à deux questions différentes ; un examen périphérique peu contributif ne remplace pas l’imagerie de la masse.</p><p class="src">Passages de référence : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, §3, §4.2 et §5.2.1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., Introduction, présentation clinique</a>.</p></section><section class="ilot" id="c85-semio-mechanisms" data-semiology="mechanisms"><h3>Le mécanisme : expliquer la distribution des signes</h3><p>La chaîne explicative du syndrome cave supérieur associe une masse médiastinale, une atteinte de la veine cave et des manifestations dans les territoires qu’elle draine. Les veines thoraciques et cervicales deviennent visibles ou distendues ; le visage et les bras présentent un œdème. Ce rapprochement est une interprétation anatomoclinique du trajet normal et des signes rapportés, pas une mesure de pression veineuse chez le patient.</p><p>La dyspnée n’identifie pas un mécanisme unique. La masse peut s’accompagner d’une compression des voies aériennes, d’un épanchement pleural ou d’un épanchement péricardique. Le scanner recherche ces rapports et ces complications. Par conséquent, attribuer toute gêne respiratoire à une simple compression bronchique ferait perdre des informations importantes sur l’extension locale.</p><p>Enfin, la taille de la masse et sa nature sont deux dimensions distinctes. Les signes compressifs traduisent ses rapports avec les organes voisins ; l’immunohistochimie et l’analyse du tissu déterminent le type de lymphome. Un symptôme intense n’est donc pas une preuve d’un sous-type, et un marqueur isolé ne décrit pas la tolérance respiratoire du patient.</p><p class="src">Passages de référence : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways" target="_blank" rel="noopener">OpenStax, drainage cave supérieur</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., présentation et imagerie</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12456099/" target="_blank" rel="noopener">EHA 2025, diagnostic et anatomopathologie</a>.</p></section><section class="ilot" id="c85-semio-examination" data-semiology="examination"><h3>L’examen : observer, préciser puis confronter à l’imagerie</h3><p>L’examen recherche les manifestations décrites dans la présentation clinique : œdème du visage ou des bras, distension veineuse cervicale ou thoracique, ainsi que les signes d’une atteinte respiratoire. La description doit préciser le siège et l’évolution ; le terme « syndrome cave » ne remplace pas le détail des constatations. Les symptômes rapportés par le patient et les signes effectivement observés restent distingués dans la synthèse.</p><p>Pour le bilan clinique du lymphome, Onkopedia demande aussi l’examen des amygdales, des aires ganglionnaires, du foie, de la rate, des épanchements et des masses visibles ou palpables. Cette recherche systématique complète l’évaluation thoracique. Elle ne donne toutefois ni la taille précise de la masse médiastinale ni l’identité de ses cellules.</p><p>Le scanner avec contraste décrit la localisation, l’extension et les rapports de la masse. La <button class="w" data-k="c85-biopsie">biopsie</button> répond ensuite à la question tissulaire. Une observation clinique, une coupe d’imagerie et un prélèvement ne sont donc pas trois versions du même examen : chacun apporte une information nécessaire au raisonnement.</p><p class="src">Passages de référence : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, §4.1 et §4.2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., présentation et bilan diagnostique</a>.</p></section><section class="ilot" id="c85-semio-interpretation" data-semiology="interpretation"><h3>L’interprétation : localiser ne signifie pas identifier</h3><p>Une masse du médiastin antérieur, une progression rapide et des signes compressifs sont compatibles avec un lymphome médiastinal primitif à grandes cellules B. Cependant, l’ensemble clinique ne suffit pas à le distinguer de toutes les autres lésions médiastinales. La confirmation repose sur l’intégration de la présentation, de la morphologie et du phénotype immunologique.</p><p>Les recommandations européennes de 2025 demandent une expertise hématopathologique disposant des techniques immunohistochimiques et moléculaires adaptées. Le prélèvement doit permettre de reconnaître une population B mature et de distinguer les sous-types pertinents. Cette exigence explique pourquoi la mention « lymphome B » reste parfois une étape du diagnostic, et non sa conclusion définitive.</p><p>Après traitement, une masse résiduelle et un foyer métabolique persistant ne sont pas interchangeables. Pour les lymphomes à grandes cellules B, les recommandations européennes indiquent qu’un résultat métabolique positif en fin de traitement peut nécessiter une biopsie ou un contrôle. Dans le lymphome médiastinal, elles encouragent en particulier la biopsie des lésions classées Deauville 4. Un compte rendu isolé ne doit donc pas être transformé automatiquement en preuve de maladie réfractaire.</p><p class="src">Passages de référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12456099/" target="_blank" rel="noopener">EHA 2025, diagnostic, réponse et lymphome médiastinal</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., diagnostic et limites de la TEP</a>.</p></section><section class="ilot" id="c85-semio-differentials" data-semiology="differentials"><h3>Les différentiels : utiliser la localisation puis le tissu</h3><p>Dans le médiastin antérieur, les principaux groupes à discuter comprennent les lésions thymiques, thyroïdiennes, germinales et lymphomateuses. L’imagerie décrit la composition de la masse et ses rapports ; l’histoire clinique et l’âge aident à hiérarchiser les possibilités. Ces indices orientent le prélèvement et les examens, mais ne remplacent pas une preuve tissulaire lorsque celle-ci est nécessaire.</p><p>Au sein des lymphomes, la distinction concerne notamment le lymphome médiastinal primitif, le lymphome de Hodgkin classique et les lymphomes médiastinaux de zone grise. Leurs caractères peuvent se recouvrir. L’étude anatomopathologique de Kim et collaborateurs montre l’intérêt de la fibrose réticulaire ou compartimentante et d’un ensemble de marquages ; elle ne permet pas de poser le diagnostic à partir d’une photographie isolée ou d’un seul marqueur.</p><p>La démarche reste donc progressive : localiser la lésion, caractériser ses constituants, recueillir un échantillon représentatif, puis intégrer les résultats morphologiques et immunologiques. La qualification finale conditionne la suite du traitement ; elle mérite une relecture spécialisée lorsqu’une discordance persiste.</p><p class="src">Passages de référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al., masses du médiastin antérieur</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6909622/" target="_blank" rel="noopener">Kim et al. 2019, résultats histologiques et figure2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12456099/" target="_blank" rel="noopener">EHA 2025, diagnostic spécialisé</a>.</p></section><section class="ilot" id="c85-semio-urgency" data-semiology="urgency"><h3>La priorité : évaluer le retentissement compressif</h3><p>Le lymphome médiastinal peut progresser rapidement et provoquer une compression des voies aériennes ou une obstruction du retour veineux supérieur. La priorité clinique est donc d’identifier ces atteintes et leur retentissement, plutôt que de commencer par le seul calcul d’un score pronostique. Les plaintes respiratoires, l’œdème cervicofacial et les signes d’épanchement doivent être mis en relation avec l’imagerie.</p><p>Les sources citées décrivent ces complications et les examens qui les caractérisent. Elles ne fournissent pas, pour tous les patients, un délai chiffré universel ni un schéma unique de traitement d’urgence. Une décision invasive, anesthésique ou thérapeutique doit être contextualisée par l’équipe spécialisée ; aucune posologie de secours n’est déduite de cette seule analyse sémiologique.</p><div class="alert"><b>À reconnaître en premier.</b> Une masse thoracique accompagnée de manifestations respiratoires ou d’un syndrome cave supérieur exige d’abord une appréciation de la compression et de sa tolérance. Le classement du lymphome ne remplace pas cette évaluation clinique.</div><p class="src">Passages de référence : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, §5.2.1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., présentation et imagerie</a>.</p></section><section class="ilot" id="c85-semio-limits" data-semiology="limits"><h3>Les limites : garder le périmètre de chaque source</h3><p>La recommandation Onkopedia associe notamment les sociétés suisses d’hématologie et d’oncologie médicale. Les recommandations européennes de 2025 apportent une actualisation distincte : dans le lymphome médiastinal, elles recommandent des schémas tels que R-CHOP14 ou DA-EPOCH-R et demandent d’éviter R-CHOP-21. Cette dernière proposition vise l’entité médiastinale ; elle ne doit pas être étendue sans distinction à tout lymphome diffus à grandes cellules B.</p><p>La revue radiologique de 2013 illustre la localisation et les images, sans servir de recommandation thérapeutique actuelle. L’étude histologique coréenne de 2019 sert ici à reconnaître les structures de sa planche, sans transposer ses fréquences à la population suisse. Quant au chapitre OpenStax, il étaye le trajet veineux normal et non une conduite thérapeutique.</p><p>Les indications et les doses des produits utilisés en Suisse restent contrôlées dans leurs informations professionnelles exactes. Ainsi, la fiche Polivy consultée le 2 novembre 2026, mise à jour en novembre 2025, indique l’association avec bendamustine et rituximab en rechute ou réfractarité chez les adultes non admissibles à une greffe. Une recommandation européenne ne suffit pas à modifier cette indication suisse.</p><p class="src">Passages de référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12456099/" target="_blank" rel="noopener">EHA 2025, sous-section lymphome médiastinal</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680671650020" target="_blank" rel="noopener">FI suisse Polivy, indications et date de mise à jour</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al. 2013</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6909622/" target="_blank" rel="noopener">Kim et al. 2019</a>.</p></section><section class="ilot" id="c85-semio-sources" data-semiology="sources"><h3>Des sources reliées aux questions de la leçon</h3><p>Le trajet veineux normal provient du chapitre OpenStax sur les voies circulatoires. Les limites anatomiques du médiastin et la lecture des coupes proviennent de Juanpere et collaborateurs. Les signes compressifs, les épanchements et le bilan du lymphome médiastinal sont décrits dans Onkopedia et dans la revue de Nappi de 2025.</p><p>Les recommandations européennes de 2025 étayent l’expertise diagnostique, la place de l’imagerie métabolique et les précautions d’interprétation après traitement. La planche de Kim et collaborateurs est une illustration histologique authentique. Les passages utiles ont été consultés le 2 novembre 2026 ; les données anciennes du reste du cours conservent leurs références propres et leurs limites.</p><p class="src">Passages de référence : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, §3, §4.1–4.2 et §5.2.1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al. 2025, Introduction</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al. 2013, Introduction et figure25</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6909622/" target="_blank" rel="noopener">Kim et al. 2019, figure2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12456099/" target="_blank" rel="noopener">EHA 2025</a> ; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways" target="_blank" rel="noopener">OpenStax, §20.5</a>.</p><div id="c85-s-semio-lecture-2026"><figure id="c85-semio-scanner"><img src="assets/img/c85/alpha/codex/juanpere-2013-figure25-original.jpg" alt="Deux coupes tomodensitométriques originales : masse médiastinale antérieure repérée par les flèches en A et épanchement péricardique par la flèche ouverte en B." loading="lazy" width="609" height="219"><figcaption>Lecture sémiologique — Lymphome médiastinal primitif chez un homme de 19 ans. <b>A :</b> les flèches blanches délimitent la masse antérieure ; l’astérisque indique ses remaniements kystiques. <b>B :</b> la flèche ouverte indique l’épanchement péricardique. Les repères sont ceux de la publication originale ; les annotations explicatives françaises sont ajoutées dans cette légende. Juanpere et al., 2013, figure 25, <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">article source</a> ; <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Les pixels de l’original sont conservés.</figcaption></figure>
<div class="key"><b>Science → clinique.</b> L’œdème cervicofacial et la distension veineuse prennent sens lorsqu’on les relie au trajet cave supérieur ; les symptômes généraux décrivent une autre dimension de la maladie.</div><div class="key"><b>Science → examen.</b> L’examen repère la distribution des signes, le scanner caractérise la compression, et la biopsie identifie la nature du tissu. La figure montre une masse et un épanchement ; elle ne mesure pas leur tolérance clinique.</div><div class="key"><b>Science → traitement.</b> L’évaluation des complications compressives et la qualification du lymphome sont complémentaires. Un signe ne permet pas de choisir seul un protocole.</div><div class="key"><b>À retenir.</b> Décrire, localiser, expliquer puis confirmer : cette succession évite de confondre un syndrome compressif avec un diagnostic histologique.</div></div></section></div><div class="sci" id="c85-s-physio" hidden><section class="ilot" id="c85-physio-cours"><h2>Physiologie : comprendre un obstacle au retour veineux</h2><p>La circulation veineuse supérieure rassemble des territoires éloignés avant leur retour au cœur. Ce trajet explique la distribution des manifestations d’une obstruction médiastinale. Il permet de passer d’un signe observé au visage à une question anatomique précise.</p><p>En situation normale, les veines de la tête et du cou rejoignent les voies brachiocéphaliques ; le sang des membres supérieurs rejoint également ce réseau. La veine cave supérieure ramène ensuite le sang vers l’oreillette droite. Le diaphragme fournit un repère pédagogique pour distinguer les territoires principalement drainés par la veine cave supérieure et ceux drainés par la veine cave inférieure ; il ne faut pas en faire une frontière absolue pour tous les circuits veineux.</p><p>Lorsqu’une masse médiastinale compromet ce trajet supérieur, les manifestations décrites dans le lymphome médiastinal associent la distension des veines du thorax et du cou à un œdème du visage et des bras. Le lien entre ces signes et la localisation de la masse devient alors intelligible. Cette explication est anatomoclinique ; ni une pression veineuse ni une sensibilité diagnostique ne sont attribuées à un signe sans mesure ou étude correspondante.</p><p>Le retentissement respiratoire doit être étudié séparément. Les sources décrivent à la fois la compression des voies aériennes et les épanchements pleuraux ou péricardiques. La coexistence possible de plusieurs mécanismes explique pourquoi l’imagerie doit montrer les rapports de la masse, et non seulement son diamètre.</p><div class="key"><b>Science → clinique.</b> La distribution cervicofaciale et brachiale des signes oriente l’étude du retour veineux supérieur.</div><div class="key"><b>Science → examen.</b> Le scanner caractérise la masse et recherche ses rapports avec les structures vasculaires et respiratoires ainsi que les épanchements.</div><div class="key"><b>Science → traitement.</b> L’évaluation du retentissement compressif complète le diagnostic tissulaire ; elle ne permet pas de choisir seule le schéma d’immunochimiothérapie.</div><p class="src">Passages de référence : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways" target="_blank" rel="noopener">OpenStax, §20.5, retour veineux</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al. 2025, présentation et imagerie</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12456099/" target="_blank" rel="noopener">EHA 2025, diagnostic</a>.</p><div class="key"><b>À retenir.</b> La topographie des signes s’explique par les trajets normaux. La nature du lymphome et la gravité de sa compression répondent à deux questions complémentaires.</div><div id="c85-s-physio-lecture-2026"><figure id="c85-physio-scanner"><img src="assets/img/c85/alpha/codex/juanpere-2013-figure25-original.jpg" alt="Deux coupes tomodensitométriques originales : masse médiastinale antérieure repérée par les flèches en A et épanchement péricardique par la flèche ouverte en B." loading="lazy" width="609" height="219"><figcaption>Lecture physiopathologique — Lymphome médiastinal primitif chez un homme de 19 ans. <b>A :</b> les flèches blanches délimitent la masse antérieure ; l’astérisque indique ses remaniements kystiques. <b>B :</b> la flèche ouverte indique l’épanchement péricardique. Les repères sont ceux de la publication originale ; les annotations explicatives françaises sont ajoutées dans cette légende. Juanpere et al., 2013, figure 25, <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">article source</a> ; <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Les pixels de l’original sont conservés.</figcaption></figure>
<p>Sur cette image pathologique, la masse antérieure et l’épanchement péricardique constituent deux constatations distinctes. Le raisonnement physiologique explique pourquoi il faut examiner leurs rapports et leur retentissement ; la photographie ne remplace ni l’examen respiratoire ni une évaluation cardiovasculaire.</p></div></section></div>
<div class="sci" id="c85-s-anat" hidden><section class="ilot" id="c85-s-anat-cours"><h2><span class="n"></span>Anatomie : le médiastin antérieur et ses voisins</h2>
<p>Pourquoi une tumeur née dans le thymus se manifeste-t-elle par un gonflement du visage ? La réponse tient à l’anatomie du médiastin antérieur, qui loge la tumeur au contact de structures vitales. Le lymphome médiastinal primitif naît d’un lymphocyte B thymique (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a>) ; la masse se développe donc dans le médiastin antérieur, devant le cœur et les gros vaisseaux.</p>
<h3>Les voisins comprimés</h3>
<p>Les sources décrivent les conséquences d’une masse souvent supérieure à 10 cm, qui infiltre le poumon, la paroi, la plèvre ou le péricarde (70 à 80 % des cas) et qui comprime ou thrombose les vaisseaux médiastinaux (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>). Par lecture anatomique, la dyspnée et la toux correspondent à la compression des voies aériennes, la dysphagie à celle du tube digestif haut, le syndrome cave supérieur à celle de la veine cave supérieure, qui ramène au cœur le sang de la tête, du cou et des bras : sa compression élève la pression veineuse en amont et provoque l’œdème du visage et des bras, la distension des veines du cou et le chémosis. Ces rapprochements sont des lectures anatomiques des signes rapportés par <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> et <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>, non des données propres à une source.</p>
<figure id="c85-figure-originale-mediastin"><img src="assets/img/c85/alpha/codex/juanpere-2013-figure25-original.jpg" alt="Deux coupes tomodensitométriques originales : masse médiastinale antérieure repérée par les flèches en A et épanchement péricardique par la flèche ouverte en B." loading="lazy" width="609" height="219"><figcaption>Figure 3 — Lymphome médiastinal primitif chez un homme de 19 ans. <b>A :</b> les flèches blanches délimitent la masse antérieure ; l’astérisque indique ses remaniements kystiques. <b>B :</b> la flèche ouverte indique l’épanchement péricardique. Les repères sont ceux de la publication originale ; les annotations explicatives françaises sont ajoutées dans cette légende. Juanpere et al., 2013, figure 25, <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">article source</a> ; <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Les pixels de l’original sont conservés.</figcaption></figure>
<div class="key"><b>Corrélation clinique.</b> Une compression de voisinage explique chaque symptôme : voies aériennes (dyspnée, toux), tube digestif haut (dysphagie), veine cave supérieure (syndrome cave), plèvre et péricarde (épanchements). C’est pourquoi la compression, non la taille seule, dicte l’urgence.</div>
<div id="c85-s-anat-lecture-2026"><div class="key"><b>Science → clinique.</b> Le médiastin réunit des structures vasculaires, respiratoires et digestives. La distribution des manifestations dépend des rapports de la masse avec ces structures, et non du seul nom du lymphome.</div><div class="key"><b>Science → examen.</b> Sur les coupes originales, repérer séparément la masse antérieure en A et l’épanchement péricardique en B. Ces repères répondent à une question de localisation ; ils ne démontrent pas le phénotype des cellules.</div><div class="key"><b>Science → traitement.</b> L’imagerie documente l’extension et les complications à prendre en compte dans la prise en charge spécialisée. Le choix d’un schéma repose aussi sur la classification tissulaire.</div><div class="key"><b>À retenir.</b> La localisation antérieure oriente les diagnostics possibles ; le prélèvement permet de les distinguer.</div></div></section></div>
<div class="sci" id="c85-s-histo" hidden><section class="ilot" id="c85-s-histo-cours"><h2><span class="n"></span>Histologie : grandes cellules claires et sclérose</h2>
<p>Pourquoi une biopsie trop petite peut-elle tromper le pathologiste ? La structure du tissu tumoral l’explique. Le lymphome médiastinal primitif associe une prolifération diffuse de grandes cellules à cytoplasme clair et une sclérose compartimentante, c’est-à-dire des bandes fibreuses qui cloisonnent la tumeur (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>).</p>
<h3>Ce que le pathologiste voit</h3>
<p>Les grandes cellules expriment les marqueurs pan-B (CD19, CD20, CD22, CD79a, CD45) et n’ont pas d’immunoglobuline de surface ; CD30 est faible dans environ 80 % des cas, MAL positif dans environ 70 %, CD23 souvent positif, CD15 négatif (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>). La sclérose peut dominer le prélèvement : un petit fragment peut ne montrer que des bandes fibreuses et manquer les cellules tumorales, ce qui rend les petites biopsies trompeuses ; d’où l’exigence d’un échantillon suffisant et d’une relecture par un expert.</p>
<figure id="c85-figure-originale-histologie"><img src="assets/img/c85/alpha/codex/histologie-2019-figure2-original.jpg" alt="Planche histologique originale du lymphome médiastinal : fibrose et agrégats tumoraux en A et B, puis marquages immunohistochimiques en C à F." loading="lazy" width="787" height="768"><figcaption>Figure 4 — Histologie authentique du lymphome médiastinal primitif. <b>A :</b> fibrose réticulaire. <b>B :</b> agrégats tumoraux séparés par une fibrose compartimentante. <b>C :</b> marquage p63. <b>D :</b> marquage bcl-6. <b>E :</b> marquage CD23. <b>F :</b> positivité focale pour la cycline E dans l’exemple présenté. Ces annotations suivent les panneaux de la légende originale. Kim et al., 2019, figure 2, <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6909622/" target="_blank" rel="noopener">article source</a> ; <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. L’ensemble morphologique et immunologique s’interprète avec les données cliniques ; cette planche ne permet pas à elle seule de diagnostiquer un patient.</figcaption></figure>
<div class="key"><b>Corrélation clinique.</b> La sclérose explique l’hétérogénéité du prélèvement : un échantillon suffisant (ganglion entier si possible, voie chirurgicale ou percutanée adaptée) et une relecture experte évitent un diagnostic incomplet (C85.1 ou C85.9).</div>
<div id="c85-s-histo-lecture-2026"><h3>Lire une architecture avant d’interpréter un marquage</h3>
<p>La planche originale permet une progression concrète. Les panneaux A et B montrent d’abord la disposition du tissu : une fibrose réticulaire ou des agrégats séparés par des cloisons. Les panneaux C à F répondent ensuite à des questions de phénotype. Un marquage positif ne décrit pas, à lui seul, la manière dont les cellules s’organisent dans le prélèvement.</p>
<p>Dans la série de Kim et collaborateurs, les fibroses alvéolaire et compartimentante favorisent le diagnostic de lymphome médiastinal primitif. Les auteurs soulignent toutefois la difficulté à reconnaître cette architecture sur un petit fragment. Leur étude compare une série limitée de lymphomes médiastinaux et de Hodgkin classiques ; ses performances ne doivent pas devenir une règle universelle applicable à toute masse thoracique.</p>
<p>Le pathologiste confronte donc les caractères morphologiques, un ensemble de marqueurs et les données cliniques. L’expertise spécialisée demandée par les recommandations européennes explique cette intégration. Si le compte rendu reste non spécifique ou discordant, une photographie illustrative ne permet pas de contourner la réévaluation du prélèvement.</p>
<p class="src"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6909622/" target="_blank" rel="noopener">Kim et al. 2019, résultats histopathologiques, discussion et figure 2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12456099/" target="_blank" rel="noopener">EHA 2025, diagnostic anatomopathologique</a>.</p><div class="key"><b>Science → clinique.</b> Deux masses de localisation comparable peuvent correspondre à des entités différentes. L’apparence clinique ne suffit pas à les séparer.</div><div class="key"><b>Science → examen.</b> L’architecture et les immunomarquages s’interprètent ensemble sur un prélèvement adapté ; les panneaux de la figure montrent ces deux niveaux de lecture.</div><div class="key"><b>Science → traitement.</b> Une qualification précise évite d’appliquer à un lymphome non classé le traitement d’une entité simplement supposée.</div><div class="key"><b>À retenir.</b> Reconnaître une fibrose ou un marquage est une étape du raisonnement ; le diagnostic reste une synthèse spécialisée.</div></div></section></div>
<div class="sci" id="c85-s-immuno" hidden><section class="ilot" id="c85-s-immuno-cours"><h2><span class="n"></span>Immunologie : comment la tumeur échappe aux lymphocytes T</h2>
<p>Pourquoi un anticorps dirigé contre PD-1 est-il actif dans cette maladie ? La tumeur surexprime les ligands de PD-1 et perd les molécules qui la signalent au système immunitaire. L’amplification ou la translocation de 9p24.1 augmente PD-L1 (CD274) et PD-L2 (PDCD1LG2) ; le réarrangement de CIITA fait chuter les molécules HLA de classe II ; des mutations de B2M et de CD58 complètent l’échappement (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8044947/" target="_blank" rel="noopener">Chen et al., thérapies de précision</a>).</p>
<h3>De l’échappement au traitement</h3>
<p>Un lymphocyte T reconnaît la tumeur grâce aux molécules HLA ; il est freiné lorsque PD-1 lie PD-L1 ou PD-L2. La tumeur du lymphome médiastinal combine donc une moindre présentation de l’antigène et un frein actif sur les lymphocytes T. Le blocage de PD-1 lève ce frein, ce qui fonde l’usage du pembrolizumab en rechute ; l’indication suisse le prévoit chez l’adulte réfractaire ou récidivant, après au moins deux traitements dont un avec rituximab, si l’autogreffe n’est pas une option ou en cas de récidive après celle-ci (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8044947/" target="_blank" rel="noopener">Chen et al., thérapies de précision</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a>). L’essai KEYNOTE-170 rapporte une réponse objective de 45 % dont 19 % de rémissions complètes (<a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a>).</p>
<figure><svg viewBox="0 0 420 200" role="img" aria-label="Figure 5 — Échappement immunitaire du lymphome médiastinal" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="10" y="20" width="170" height="90" rx="8"/><rect x="240" y="20" width="170" height="90" rx="8"/><path d="M180 50h60m-8-5l8 5-8 5"/><path d="M180 90h60" stroke-dasharray="5 4"/><path d="M200 82l20 16m0-16l-20 16"/></g><g fill="currentColor" text-anchor="middle"><text x="95" y="45">Cellule tumorale</text><text x="95" y="65">PD-L1, PD-L2 élevés</text><text x="95" y="85">HLA de classe II bas</text><text x="325" y="45">Lymphocyte T</text><text x="325" y="65">PD-1</text><text x="325" y="85">activité freinée</text><text x="210" y="45" font-size="11">frein</text><text x="210" y="125" font-size="11">présentation d’antigène réduite</text><text x="210" y="165" font-size="12">Le blocage de PD-1 lève le frein</text></g></svg><figcaption>Figure 5 — Échappement immunitaire. Le ligand tumoral freine le lymphocyte T via PD-1 ; la perte de HLA de classe II réduit la présentation de l’antigène. Schéma didactique.</figcaption></figure>
<div class="key"><b>Corrélation clinique.</b> L’amplification de 9p24.1 et la perte de HLA de classe II expliquent la sensibilité au blocage de PD-1 en rechute ; l’information professionnelle précise cependant que le pembrolizumab n’est pas indiqué lorsqu’une cytoréduction urgente est nécessaire.</div>
<div id="c85-s-immuno-lecture-2026"><h3>Du signal immunitaire normal à sa perturbation tumorale</h3>
<p>La présentation d’antigènes et les signaux inhibiteurs sont deux composantes différentes de la réponse immunitaire. Les molécules de présentation rendent des antigènes accessibles à la reconnaissance lymphocytaire. La voie PD-1 module l’activité des lymphocytes T lorsque ses ligands sont présents. La tumeur peut donc modifier à la fois ce qui est reconnu et l’intensité de la réponse.</p>
<p>La revue de Chen décrit des altérations touchant notamment B2M, CIITA et les ligands de PD-1. B2M code la bêta-2-microglobuline, nécessaire à l’expression des molécules du complexe majeur d’histocompatibilité de classe I. Il faut la distinguer des mécanismes qui concernent la classe II : résumer toutes ces anomalies par « perte de HLA II » ferait disparaître cette différence.</p>
<p>Le schéma causal ci-dessus simplifie ces mécanismes pour les rendre lisibles ; il ne représente pas une coupe anatomique. Son intérêt est de distinguer une présentation antigénique réduite d’un signal inhibiteur accru. Aucun de ces mécanismes ne garantit une réponse individuelle au traitement. L’indication clinique et les précautions restent celles de la préparation suisse et de la situation du patient.</p>
<p class="src"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8044947/" target="_blank" rel="noopener">Chen et al. 2021, Genetic Features</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">FI suisse Keytruda, mécanisme d’action et lymphome médiastinal</a>.</p><div class="key"><b>Science → clinique.</b> L’échappement immunitaire aide à comprendre la persistance tumorale ; il ne fournit pas un signe clinique spécifique ni une prédiction individuelle de réponse.</div><div class="key"><b>Science → examen.</b> L’étude du tissu définit le lymphome. Une altération moléculaire ne remplace pas cette synthèse et ne constitue pas automatiquement un test compagnon exigé pour chaque traitement.</div><div class="key"><b>Science → traitement.</b> Le pembrolizumab bloque PD-1. Son usage dans le lymphome médiastinal suit les conditions suisses de lignes antérieures et exclut la situation nécessitant une réduction tumorale urgente.</div><div class="key"><b>À retenir.</b> Le mécanisme explique une cible ; l’indication autorisée et le contexte clinique déterminent son utilisation.</div></div></section></div>
<div class="sci" id="c85-s-gen" hidden><section class="ilot" id="c85-s-gen-cours"><h2><span class="n"></span>Génétique moléculaire : trois voies altérées</h2>
<p>Pourquoi le lymphome médiastinal ressemble-t-il à un Hodgkin classique au niveau moléculaire ? Parce que les deux entités partagent des voies de survie constitutivement actives. Les altérations décrites se regroupent en trois familles (<a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8044947/" target="_blank" rel="noopener">Chen et al., thérapies de précision</a>).</p>
<h3>Les trois voies</h3>
<table class="t"><tr><th>Voie</th><th>Altérations décrites</th><th>Effet</th></tr>
<tr><td>NF-κB</td><td>Amplification de REL (2p16) ; mutations inactivatrices de TNFAIP3</td><td>Survie cellulaire maintenue</td></tr>
<tr><td>JAK-STAT</td><td>Amplification de JAK2 (9p24) ; mutations inactivatrices de SOCS1 ; surexpression d’IL-13 ; signalisation STAT6</td><td>Prolifération soutenue</td></tr>
<tr><td>Échappement immunitaire</td><td>Amplification ou translocation de 9p24.1 (PD-L1, PD-L2) ; réarrangement de CIITA ; mutations de B2M et de CD58</td><td>Moindre reconnaissance par les lymphocytes T</td></tr></table>
<figure><svg viewBox="0 0 420 210" role="img" aria-label="Figure 6 — Les trois familles d’altérations moléculaires" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="8" y="14" width="126" height="130" rx="6"/><rect x="147" y="14" width="126" height="130" rx="6"/><rect x="286" y="14" width="126" height="130" rx="6"/><path d="M71 144v28m-4-6l4 6 4-6M210 144v28m-4-6l4 6 4-6M349 144v28m-4-6l4 6 4-6"/><rect x="8" y="172" width="404" height="30" rx="6"/></g><g fill="currentColor" text-anchor="middle"><text x="71" y="36">NF-κB</text><text x="71" y="64">REL amplifié</text><text x="71" y="84">TNFAIP3 perdu</text><text x="210" y="36">JAK-STAT</text><text x="210" y="64">JAK2 amplifié</text><text x="210" y="84">SOCS1 perdu</text><text x="210" y="104">IL-13, STAT6</text><text x="349" y="36">Échappement</text><text x="349" y="64">9p24.1 : PD-L1, PD-L2</text><text x="349" y="84">CIITA réarrangé</text><text x="349" y="104">B2M, CD58 mutés</text><text x="210" y="192">Lymphome médiastinal primitif à grandes cellules B</text></g></svg><figcaption>Figure 6 — Les trois familles d’altérations moléculaires du lymphome médiastinal primitif. Schéma didactique : ces altérations sont des associations, non une séquence chronologique.</figcaption></figure>
<div class="key"><b>Corrélation clinique.</b> Un réarrangement de CIITA est associé à une survie spécifique plus courte. L’amplification de 9p24.1 fonde le blocage de PD-1. Aucune de ces altérations n’est un critère diagnostique formel : le diagnostic repose sur l’histologie et le phénotype.</div>
<button class="pareto-btn ui" data-k="pareto-c85-sciences">▲ Loi de Pareto — Sciences fondamentales</button><div id="c85-s-gen-lecture-2026"><h3>Une carte de mécanismes, pas une succession obligatoire</h3>
<p>Une amplification augmente le nombre de copies d’une région génomique ; un réarrangement en modifie l’organisation. Ces mots décrivent des événements différents. Dans la revue de Chen, l’amplification de la région 9p24.1 concerne notamment JAK2 et les ligands de PD-1. Elle relie donc un même territoire chromosomique à la signalisation intracellulaire et aux interactions immunitaires.</p>
<p>Les voies NF-κB et JAK-STAT participent aux programmes cellulaires décrits dans cette revue. Leur activation anormale et les mécanismes d’échappement immunitaire peuvent coexister. Les trois colonnes du schéma ne doivent pas être lues comme trois étapes que chaque patient franchirait dans le même ordre. Les anomalies proviennent de séries et d’analyses différentes ; toutes ne sont pas présentes dans chaque tumeur.</p>
<p>La parenté moléculaire avec le lymphome de Hodgkin explique une partie des difficultés de classification, sans rendre les deux diagnostics interchangeables. L’analyse génétique complète la morphologie et le phénotype. Elle peut aussi éclairer une stratégie thérapeutique, mais une association biologique ou pronostique n’équivaut pas à une indication suisse ni à un bénéfice individuel démontré.</p>
<p class="src"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8044947/" target="_blank" rel="noopener">Chen et al. 2021, Genetic Features</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12456099/" target="_blank" rel="noopener">EHA 2025, diagnostic spécialisé</a>.</p><div class="key"><b>Science → clinique.</b> Des mécanismes partagés peuvent s’observer dans des entités cliniques distinctes. Ils n’effacent pas leurs différences de présentation et de prise en charge.</div><div class="key"><b>Science → examen.</b> Les résultats moléculaires se confrontent au prélèvement et au phénotype. Le tableau constitue une carte pédagogique et non une liste de critères tous obligatoires.</div><div class="key"><b>Science → traitement.</b> Une voie altérée peut fournir une cible de recherche ou de traitement ; son emploi clinique exige des données et des conditions d’utilisation propres au médicament.</div><div class="key"><b>À retenir.</b> Ne pas confondre anomalie observée, mécanisme plausible, association pronostique et indication thérapeutique.</div></div></section></div>
</div></div>

<div class="panel" id="pP" hidden><nav class="toc ui"><b>Pharmacologie des lymphomes B agressifs</b><ol><li><a href="#c85-p-1">Classes et place</a></li><li><a href="#c85-p-2">Doses et schémas sourcés</a></li><li><a href="#c85-p-3">Associations et précautions dangereuses</a></li><li><a href="#c85-p-4">Effets indésirables et surveillance</a></li><li><a href="#c85-p-5">Ce qu’il faut éviter</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="c85-p-1"><h2><span class="n">1</span>Classes et place</h2>
<p>Le traitement du lymphome médiastinal primitif et du DLBCL combine un anticorps anti-CD20, une chimiothérapie à base d’anthracycline et, en rechute, des thérapies immunologiques. Le choix dépend de la ligne de traitement, du délai de rechute et de l’autorisation suisse.</p>
<table class="t"><tr><th>Classe</th><th>Représentants</th><th>Place</th></tr>
<tr><td><button class="w" data-k="c85-mabthera">Anticorps anti-CD20</button></td><td>Rituximab (MabThera®)</td><td>Toutes les lignes de chimio-immunothérapie</td></tr>
<tr><td><button class="w" data-k="c85-rchop">Chimio-immunothérapie</button></td><td>R-CHOP, DA-EPOCH-R</td><td>Première ligne</td></tr>
<tr><td><button class="w" data-k="c85-polapchp">Conjugué anticorps-médicament</button></td><td>Polatuzumab védotine (Polivy®)</td><td>Pola-R-CHP (première ligne selon Onkopedia) ; en Suisse, rechute avec bendamustine et rituximab</td></tr>
<tr><td><button class="w" data-k="c85-breyanzi">Thérapie par cellules CAR-T</button></td><td>Lisocabtagène maraleucel (Breyanzi®), axicabtagène ciloleucel (Yescarta®)</td><td>Réfractaire ou rechute précoce ; au moins deux lignes</td></tr>
<tr><td><button class="w" data-k="c85-keytruda">Anticorps anti-PD-1</button></td><td>Pembrolizumab (Keytruda®)</td><td>Lymphome médiastinal réfractaire ou récidivant chez l’adulte, après au moins deux traitements dont un avec rituximab, si l’autogreffe n’est pas une option ou en cas de récidive après celle-ci ; hors besoin de cytoréduction urgente</td></tr></table>
<p>La place de chaque classe découle du mécanisme : CD20 est présent sur la lignée B (cible du rituximab) ; l’échappement par PD-1 fonde le pembrolizumab ; la rechute précoce justifie la thérapie cellulaire.</p>
<div class="key"><b>À retenir.</b> Première ligne : anticorps anti-CD20 plus chimiothérapie. Rechute : thérapie cellulaire si précoce, rattrapage au platine et autogreffe si tardive, anti-PD-1 selon les conditions complètes de la FI suisse : lignes antérieures, statut vis-à-vis de l’autogreffe et absence de besoin de cytoréduction urgente.</div>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680671650020" target="_blank" rel="noopener">Polivy®, information professionnelle suisse, novembre 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674690016" target="_blank" rel="noopener">Breyanzi®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a>.</p></section>
<section class="ilot" id="c85-p-2"><h2><span class="n">2</span>Doses et schémas sourcés</h2>
<p>Le tableau ne reprend que les posologies présentes dans les sources lues. Les doses de l’association CHOP relèvent du protocole du centre. Les FI exactes du cyclophosphamide, de la doxorubicine, de la vincristine, de l’étoposide et de la prednisone ont été consultées ; leurs adaptations et limites sont détaillées dans les situations particulières.</p>
<table class="t"><tr><th>Médicament ou schéma</th><th>Posologie sourcée</th><th>Précisions</th></tr>
<tr><td>Rituximab (DLBCL)</td><td>375 mg/m² au jour 1 de chaque cycle de CHOP, toutes les 3 semaines, 8 cycles</td><td><a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a></td></tr>
<tr><td>R-CHOP-21 (DLBCL)</td><td>6 cycles avec 8 doses de rituximab</td><td>4 R-CHOP puis 2 rituximab jusqu’à 60 ans sans facteur de risque ni masse volumineuse (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>)</td></tr>
<tr><td>Pembrolizumab</td><td>200 mg toutes les 3 semaines ou 400 mg toutes les 6 semaines</td><td><a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a></td></tr>
<tr><td>Lisocabtagène maraleucel</td><td>Dose cible : 100 × 10⁶ cellules T CAR+ viables</td><td>Lymphodéplétion préalable : fludarabine 30 mg/m² et cyclophosphamide 300 mg/m² pendant 3 jours (<a href="https://amiko.oddb.org/fr/fi?gtin=7680674690016" target="_blank" rel="noopener">Breyanzi®, information professionnelle suisse</a>)</td></tr>
<tr><td>Axicabtagène ciloleucel</td><td>Dose cible : 2 × 10⁶ cellules CAR T anti-CD19/kg ; maximum 2 × 10⁸ cellules</td><td>Perfusion unique autologue dans un centre qualifié. Au moins 4 doses de tocilizumab disponibles avant la perfusion (<a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a>)</td></tr>
<tr><td>Radiothérapie médiastinale</td><td>30 à 36 Gy, fractions de 1,5 à 2,0 Gy</td><td><a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; 30 Gy dans IELSG37</td></tr></table>
<p>La lecture du tableau est utile en pratique : la dose de rituximab (375 mg/m²) est la même pour chaque cycle, le nombre de doses (8) est supérieur au nombre de cycles de chimiothérapie (6), et la lymphodéplétion précède toujours le CAR-T.</p>
<div class="key"><b>À retenir.</b> Rituximab : 375 mg/m² par cycle, 8 doses. Pembrolizumab : 200 mg toutes les 3 semaines ou 400 mg toutes les 6 semaines. Liso-cel : 100 × 10⁶ cellules après fludarabine et cyclophosphamide.</div>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 5.1</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674690016" target="_blank" rel="noopener">Breyanzi®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://doi.org/10.1200/JCO-24-01373" target="_blank" rel="noopener">IELSG37, Martelli et al.</a>.</p></section>
<section class="ilot" id="c85-p-3"><h2><span class="n">3</span>Associations et précautions dangereuses</h2>
<div class="alert"><b>Hépatite B.</b> L’AgHBs et l’anti-HBc se recherchent avant le rituximab ; la réactivation du VHB peut être fulminante (<a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a>). <b>Lyse tumorale.</b> Prophylaxie de la lyse adaptée au risque avant rituximab ; ne pas extrapoler au lymphome médiastinal le délai de 48 heures décrit dans la FI pour la leucémie lymphatique chronique (<a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a>). <b>Pembrolizumab et urgence.</b> Il n’est pas indiqué lorsqu’une cytoréduction urgente est nécessaire (<a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a>). <b>CAR-T et masse médiastinale.</b> Après Yescarta, la FI rapporte un taux de signalement d’œdème cérébral de 1,6 % dans le lymphome médiastinal (0,8 % de cas fatals) ; il s’agit de données après autorisation propres au produit ; une grosse masse médiastinale avec syndrome cave supérieur est un facteur de risque indépendant potentiel (<a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a>). <b>Axicabtagène.</b> Au moins 4 doses de tocilizumab doivent être disponibles avant la perfusion (<a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a>). <b>Réaction à la perfusion.</b> Interrompre la perfusion en cas de dyspnée sévère, de bronchospasme ou d’hypoxie (<a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a>).</div>
<h3>Interactions : distinguer mécanisme, modélisation et conduite</h3><p>La FI suisse de Polivy décrit des interactions concernant la monométhylauristatine E libérée par le médicament. Les inhibiteurs puissants du CYP3A peuvent augmenter son exposition ; la FI demande une surveillance plus étroite de la toxicité. Les variations chiffrées ci-dessous proviennent de modélisations pharmacocinétiques, et non d’un essai clinique d’interaction chez les patients. Cette préparation concerne le lymphome diffus à grandes cellules B selon son indication suisse ; ces chiffres ne définissent pas un protocole de lymphome médiastinal.</p><table class="t"><tr><th>Situation</th><th>Exposition à la fraction non conjuguée</th><th>Interprétation</th></tr><tr><td>Inhibiteur puissant du CYP3A, exemple cité : kétoconazole</td><td>Aire sous la courbe augmentée de 48 % dans la modélisation</td><td>Surveiller plus étroitement les signes de toxicité</td></tr><tr><td>Inducteur puissant du CYP3A, exemple cité : rifampicine</td><td>Aire sous la courbe diminuée de 49 % dans la modélisation</td><td>Ne pas assimiler cette variation d’exposition à une variation chiffrée démontrée d’efficacité clinique</td></tr></table><p>Pour le pembrolizumab, la FI ne prévoit pas d’interaction métabolique, l’élimination relevant du catabolisme. Elle demande d’éviter les corticoïdes systémiques ou immunosuppresseurs avant l’instauration en raison d’une possible interférence avec son activité. Elle précise aussi les exceptions : prise en charge des effets indésirables immunologiques après l’instauration, et usages liés à la chimiothérapie lorsqu’une association est prévue. Cette précaution ne signifie donc pas qu’un effet indésirable immunologique doit rester sans traitement.</p><p class="src"><a href="https://amiko.oddb.org/fr/fi?gtin=7680671650020" target="_blank" rel="noopener">FI suisse Polivy, novembre 2025, Interactions</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">FI suisse Keytruda, août 2026, Interactions</a>.</p>
<div class="key"><b>À retenir.</b> Hépatite B, lyse tumorale, réaction à la perfusion, urgence de cytoréduction et œdème cérébral après CAR-T sont les précautions documentées.</div>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a>.</p></section>
<section class="ilot" id="c85-p-4"><h2><span class="n">4</span>Effets indésirables et surveillance</h2>
<table class="t"><tr><th>Produit</th><th>Effet documenté</th><th>Surveillance ou conduite</th></tr>
<tr><td>Rituximab</td><td>Syndrome de lyse tumorale ; réactions à la perfusion ; réactivation du VHB ; leucoencéphalopathie multifocale progressive</td><td>Sérologie préalable ; uricostatique ; arrêt de la perfusion si dyspnée sévère, bronchospasme ou hypoxie (<a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a>)</td></tr>
<tr><td>Axicabtagène ciloleucel</td><td>Syndrome de libération de cytokines chez presque tous les patients, avec débuts entre J1 et J12 dans ZUMA-1 et ZUMA-7, sans exclure des événements plus tardifs ; œdème cérébral</td><td>Tocilizumab (au moins 4 doses disponibles) ; vigilance en cas de grosse masse médiastinale (<a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a>)</td></tr>
<tr><td>Anthracycline</td><td>Risque d’insuffisance cardiaque accru par rapport à la population générale, particulièrement si l’exposition a eu lieu avant 55 ans</td><td>ECG et échocardiographie avant le traitement ; doxorubicine liposomale ou étoposide en cas de cardiopathie (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>)</td></tr>
<tr><td>Radiothérapie médiastinale</td><td>Cancer du sein et coronaropathie accélérée</td><td>Dépistage précoce du cancer du sein à envisager chez la femme jeune irradiée (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>)</td></tr></table>
<p>La surveillance se règle sur le moment du risque : la lyse et les réactions de perfusion dominent à la première administration, le syndrome de libération de cytokines précocement après thérapie cellulaire (jours 1 à 12 dans ZUMA-1 et ZUMA-7 ; ce délai ne constitue pas une limite de surveillance), et les effets cardiaques et tumoraux secondaires au fil des années.</p>
<div class="key"><b>À retenir.</b> Chaque effet indésirable a son moment : perfusion et lyse d’abord, cytokines précocement après thérapie cellulaire, sans arrêter la vigilance au douzième jour, cœur et second cancer à long terme.</div>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 5.2.6 et § 6.2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>.</p></section>
<section class="ilot" id="c85-p-5"><h2><span class="n">5</span>Ce qu’il faut éviter</h2>
<table class="t"><tr><th>À éviter</th><th>Raison</th></tr>
<tr><td>Traiter un « lymphome B » sans type</td><td>Le schéma dépend du type exact ; obtenir l’histologie dès que possible, avec décision spécialisée si la compression vitale rend l’attente dangereuse (<a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>)</td></tr>
<tr><td>Rituximab sans dépistage de l’hépatite B</td><td>La réactivation du VHB peut être fulminante (<a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a>)</td></tr>
<tr><td>Pembrolizumab quand une cytoréduction urgente est nécessaire</td><td>Non indiqué dans cette situation (<a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a>)</td></tr>
<tr><td>Pola-R-CHP présenté comme indication suisse de première ligne</td><td>Polivy® n’est autorisé en Suisse qu’en rechute ou réfractarité du DLBCL (<a href="https://amiko.oddb.org/fr/fi?gtin=7680671650020" target="_blank" rel="noopener">Polivy®, information professionnelle suisse, novembre 2025</a>)</td></tr>
<tr><td>Radiothérapie de consolidation systématique après réponse métabolique complète</td><td>IELSG37 : survie globale observée de 99 % dans les deux bras en réponse métabolique complète (<a href="https://doi.org/10.1200/JCO-24-01373" target="_blank" rel="noopener">IELSG37, Martelli et al.</a>)</td></tr>
<tr><td>Autogreffe en rémission complète</td><td>Non recommandée (ESMO 2016)</td></tr></table>
<div class="key"><b>À retenir.</b> Six erreurs de prescription sont évitables : type non précisé, hépatite B non dépistée, pembrolizumab en urgence, Pola-R-CHP supposé autorisé en première ligne en Suisse, radiothérapie systématique, autogreffe en rémission complète.</div>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680671650020" target="_blank" rel="noopener">Polivy®, information professionnelle suisse, novembre 2025</a> ; <a href="https://doi.org/10.1200/JCO-24-01373" target="_blank" rel="noopener">IELSG37, Martelli et al.</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a>.</p>
