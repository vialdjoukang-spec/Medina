<template data-pop="g01-codage" data-title="Logique croix-astérisque de G01*">
<div class="lab">Définition</div><p>Un code astérisque décrit la <b>manifestation</b> d’une maladie ; il ne s’emploie jamais seul. La maladie causale reçoit le code croix. G01* désigne la méningite qui manifeste une maladie bactérienne classée ailleurs.</p>
<div class="lab">Application</div><p>La classification cite comme maladies causales le charbon, la gonococcie, la leptospirose, la listériose, la maladie de Lyme, la méningococcie, la neurosyphilis, la salmonellose, la syphilis congénitale, la syphilis secondaire, la tuberculose et la fièvre typhoïde ; chacune porte son code croix dans le chapitre des maladies infectieuses.</p>
<div class="lab">Voisinage</div><p>La méningo-encéphalite et la méningomyélite au cours d’affections bactériennes classées ailleurs sont exclues de G01* et classées dans la catégorie G05. G00 couvre la méningite bactérienne non classée ailleurs (pneumocoque, <i>Haemophilus</i>, streptocoques, staphylocoques). G02* couvre les méningites au cours d’autres maladies infectieuses et parasitaires (virales, mycosiques).</p>
<div class="lab">Limite</div><p>La version allemande de la classification (BfArM, 2024) a été lue ; la version française de l’Office fédéral de la statistique n’a pas été lue directement.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">Classification internationale des maladies, version allemande 2024, bloc G00–G09 (Institut fédéral allemand des médicaments), consultée le 14.10.2026</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">Classification internationale des maladies, version suisse 2024, entrée G01 du registre local (Office fédéral de la statistique)</a>.</p>
</template>
<template data-pop="g01-meningisme" data-title="Quatre symptômes cardinaux de la méningite bactérienne">
<div class="lab">Fréquences</div><p>Céphalée 83–87 %, méningisme 75–83 %, fièvre 77 %, trouble de la conscience 69 %. Trois des quatre symptômes ne sont réunis que chez la moitié des patients.</p>
<div class="lab">Pourquoi ces symptômes</div><p>La fièvre traduit la réaction inflammatoire systémique ; la céphalée et le méningisme traduisent l’irritation des enveloppes ; le trouble de la conscience traduit l’œdème cérébral et l’hypertension intracrânienne décrits dans la physiopathologie.</p>
<div class="lab">Piège</div><p>L’absence d’un symptôme n’exclut pas le diagnostic. Nausées, vomissements, photophobie, confusion et crises complètent le tableau.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande, autrichienne et suisse sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3131058/" target="_blank" rel="noopener">Revue de physiopathologie de la méningite pneumococcique (van de Beek et collaborateurs), Clinical Microbiology Reviews 2011</a>.</p>
</template>
<template data-pop="g01-monalisa" data-title="MONALISA : cohorte française de listériose">
<div class="lab">Contenu</div><p>Cohorte prospective nationale de 818 cas de listériose dont 252 neurolistérioses. La méningo-encéphalite représente 84 % (212/252) des formes neurologiques, la rhombencéphalite 17 %.</p>
<div class="lab">Résultats utiles</div><p>Le germe n’est détecté que par l’hémoculture chez 35 patients sur 252. La dexaméthasone est associée à une mortalité accrue (odds ratio 4,58). Les prédicteurs de mortalité sont le cancer actif (5,19), la défaillance multiviscérale (7,98), la monocytopénie (3,70) et l’hémoculture positive en neurolistériose (3,67). La mortalité à 3 mois est plus élevée pour la bactériémie que pour la neurolistériose (HR 0,54).</p>
<div class="lab">Limite</div><p>Association observationnelle : le lien entre dexaméthasone et mortalité n’est pas une preuve de causalité. Aucune recommandation suisse n’a été lue sur ce point.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1473-3099(16)30521-7" target="_blank" rel="noopener">Charlier et collaborateurs, cohorte nationale française de listériose, Lancet Infectious Diseases 2017</a>.</p>
</template>
<template data-pop="g01-lcr-profils" data-title="Profils du liquide cérébro-spinal">
<div class="lab">Profil bactérien</div><p>Plus de 1000 cellules/µl à prédominance neutrophile, protéines &gt; 1000 mg/l (&gt; 100 mg/dl), glucose &lt; 30 mg/dl, rapport liquide/sérum &lt; 0,3, lactate &gt; 3,5 mmol/l. Un tiers des méningites pneumococciques ont moins de 1000 cellules/µl.</p>
<div class="lab">Profil viral</div><p>Moins de 1000 lymphocytes/µl ; lactate &lt; 3,5 mmol/l.</p>
<div class="lab">Profil tuberculeux</div><p>Moins de 1000 cellules de formule mixte ; glucose modérément abaissé ; lactate &gt; 3,5 mmol/l ; protéines &gt; 100 mg/dl ; synthèse intrathécale d’IgA.</p>
<div class="lab">Piège</div><p>Les seuils sont des repères de groupe. Les valeurs normales du liquide ne figurent pas dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande, autrichienne et suisse sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a>.</p>
</template>
<template data-pop="g01-pcr" data-title="PCR et sensibilité des tests moléculaires">
<div class="lab">PCR multiplex</div><p>Sensibilité 89,5 % et spécificité 97,4 % pour les germes bactériens de la méningite aiguë.</p>
<div class="lab">PCR dans les formes subaiguës</div><p>Neuroborréliose : positive dans 10 à 30 % seulement. Neurosyphilis : PCR du liquide non recommandée (sensibilité 31,7 à 63,7 %).</p>
<div class="lab">Application</div><p>Une PCR négative n’exclut pas une neuroborréliose ni une neurosyphilis ; le diagnostic repose sur la synthèse intrathécale d’anticorps.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande, autrichienne et suisse sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" target="_blank" rel="noopener">Recommandation allemande sur le diagnostic et le traitement de la neurosyphilis, Neurological Research and Practice 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">Recommandation allemande sur la neuroborréliose de Lyme, German Medical Science 2025</a>.</p>
</template>
<template data-pop="g01-ai-borrelia" data-title="Index d’anticorps anti-Borrelia">
<div class="lab">Définition</div><p>L’index d’anticorps compare la concentration d’anticorps dans le liquide à celle du sérum ; un index ≥ 1,5 signe une synthèse intrathécale.</p>
<div class="lab">Valeurs</div><p>Détectable chez plus de 99 % des patients à 6–8 semaines ; synthèse intrathécale d’IgM chez 80 à 100 %.</p>
<div class="lab">Application</div><p>Une synthèse intrathécale d’anticorps confirme la neuroborréliose. Elle peut exister sans anticorps sériques (28 neuroborrélioses sur 127 dans une série néerlandaise lue au résumé).</p>
<div class="lab">Limite</div><p>L’index, la sérologie et les bandes oligoclonales ne servent pas au suivi du traitement.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">Recommandation allemande sur la neuroborréliose de Lyme, German Medical Science 2025</a> ; <a href="https://doi.org/10.1111/ene.15631" target="_blank" rel="noopener">Zomer et collaborateurs, Neuroborréliose avec anticorps dans le liquide mais non dans le sérum, European Journal of Neurology 2022 (résumé)</a>.</p>
</template>
<template data-pop="g01-meningocoque" data-title="Méningocoque : profil et gravité">
<div class="lab">Épidémiologie suisse</div><p>Environ 50 cas invasifs sévères par an, surtout avant 5 ans et entre 15 et 19 ans ; portage nasopharyngé asymptomatique chez 8 à 15 % ; létalité environ 7 % (15 % chez le nourrisson) ; séquelles irréversibles chez 10 à 20 % des survivants. Sérogroupes 2011–2020 : B environ 40 %, C, W et Y environ 20 % chacun.</p>
<div class="lab">Clinique</div><p>Septicémie (fièvre brutale, frissons, arthralgies, éruption ; choc, coma ou décès en quelques heures) et/ou méningite. Incubation 3 à 4 jours.</p>
<div class="lab">Conduite</div><p>Ceftriaxone ; pas de pénicilline avant l’antibiogramme ; isolement jusqu’à 24 heures après début d’un antibiotique efficace ; prophylaxie des contacts étroits.</p>
<div class="lab">Limite</div><p>Recrudescence en automne et en hiver ; le Bulletin de l’OFSP n’a pas été lu directement.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande, autrichienne et suisse sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a> ; <a href="https://www.bag.admin.ch/fr/maladies-invasives-a-meningocoques" target="_blank" rel="noopener">Office fédéral de la santé publique, Maladies invasives à méningocoques (page consultée le 14.10.2026)</a> ; <a href="https://www.infovac.ch/docs/public/fs/fs-vaccination-m--ningocoques-2024.pdf" target="_blank" rel="noopener">Office fédéral de la santé publique et Commission fédérale pour les vaccinations, Fiche d’information Méningocoques, janvier 2024</a> ; <a href="https://fr.ch/document/347621" target="_blank" rel="noopener">Service du médecin cantonal de Fribourg, Maladies invasives à méningocoques, informations aux professionnels, 2025 (d’après le Bulletin de l’Office fédéral de la santé publique 4/25)</a>.</p>
</template>
<template data-pop="g01-bhe" data-title="Barrière hémato-encéphalique et antibiotiques">
<div class="lab">Normal</div><p>Le liquide cérébro-spinal contient peu de phagocytes et peu de complément ; la barrière limite le passage des antibiotiques.</p>
<div class="lab">Pathologique</div><p>La ceftriaxone atteint environ 2 % de sa concentration plasmatique dans un liquide non inflammatoire, jusqu’à 25 % lors de la méningite.</p>
<div class="lab">Conséquence</div><p>Les doses élevées par voie intraveineuse sont nécessaires ; la faible pénétration de la rifampicine et de l’éthambutol justifie une discussion de doses élevées en méningite tuberculeuse.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3131058/" target="_blank" rel="noopener">Revue de physiopathologie de la méningite pneumococcique (van de Beek et collaborateurs), Clinical Microbiology Reviews 2011</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Office fédéral de la santé publique et Ligue pulmonaire suisse, Tuberculose en Suisse, guide V1.2024</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Ceftriaxon Labatec, Swissmedic, juin 2025</a>.</p>
</template>
<template data-pop="g01-physiopath-seq" data-title="Séquence du pneumocoque (transposable)">
<div class="lab">Étapes</div><p>Colonisation du nasopharynx, franchissement de l’épithélium, survie dans le sang grâce à la capsule (complément limité), franchissement de la barrière, multiplication dans le liquide, lyse bactérienne, activation de TLR2/TLR4/Nod2, cytokines, afflux de neutrophiles, monoxyde d’azote et radicaux oxygénés, rupture de barrière.</p>
<div class="lab">Conséquences</div><p>Œdème vasogénique, hypertension intracrânienne, vascularite, hydrocéphalie, atteinte cochléaire.</p>
<div class="lab">Limite</div><p>Modèle pneumocoque ; lecture partielle de la revue (premiers 100 000 caractères). Aux Pays‑Bas, la mortalité de la méningite pneumococcique de l’adulte est passée d’environ 30 à 20 % après généralisation de la dexaméthasone.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3131058/" target="_blank" rel="noopener">Revue de physiopathologie de la méningite pneumococcique (van de Beek et collaborateurs), Clinical Microbiology Reviews 2011</a>.</p>
</template>
<template data-pop="g01-cytokines" data-title="Récepteurs de l’immunité innée et cytokines">
<div class="lab">Mécanisme</div><p>Les composants bactériens libérés par la lyse sont reconnus par TLR2, TLR4 et Nod2. Cette reconnaissance induit TNF-α, interleukine-1β, interleukine-6 et chimiokines.</p>
<div class="lab">Conséquence</div><p>Les chimiokines recrutent les neutrophiles, source de la pléiocytose ; leurs radicaux oxygénés et leur monoxyde d’azote rompent la barrière.</p>
<div class="lab">Application thérapeutique</div><p>Cette inflammation justifie la dexaméthasone adjuvante.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/14651858.CD004405.pub5" target="_blank" rel="noopener">Brouwer et collaborateurs, Corticoïdes dans la méningite bactérienne aiguë, Cochrane 2015 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3131058/" target="_blank" rel="noopener">Revue de physiopathologie de la méningite pneumococcique (van de Beek et collaborateurs), Clinical Microbiology Reviews 2011</a>.</p>
</template>
<template data-pop="g01-listeria" data-title="Listeria monocytogenes">
<div class="lab">Terrain</div><p>Sujet âgé, cancer, immunosuppression, grossesse, nouveau-né. Aliments en cause : charcuterie, poisson, lait cru et fromages, salades en sachet.</p>
<div class="lab">Clinique</div><p>Méningo-encéphalite (84 %), rhombencéphalite (17 %). Le germe n’est détecté que par l’hémoculture chez 35 patients sur 252.</p>
<div class="lab">Traitement</div><p>Ampicilline (ou cotrimoxazole, méropénème), fosfomycine ou rifampicine associables, souvent ≥ 3 semaines. Une céphalosporine seule ne suffit pas.</p>
<div class="lab">Pronostic et limite</div><p>Létalité de la listériose jusqu’à 20 % ; prédicteurs de mortalité : cancer actif, défaillance multiviscérale, monocytopénie. Aucune recommandation suisse de traitement (durée, gentamicine) n’a été lue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande, autrichienne et suisse sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a> ; <a href="https://doi.org/10.1016/S1473-3099(16)30521-7" target="_blank" rel="noopener">Charlier et collaborateurs, cohorte nationale française de listériose, Lancet Infectious Diseases 2017</a> ; <a href="https://www.bag.admin.ch/fr/listeriose-2" target="_blank" rel="noopener">Office fédéral de la santé publique, Listériose (page consultée le 14.10.2026)</a>.</p>
</template>
<template data-pop="g01-borrelia" data-title="Borrelia burgdorferi et neuroborréliose">
<div class="lab">Formes</div><p>Précoce (méningite, syndrome de Bannwarth, paralysies de nerfs crâniens) ; tardive (encéphalomyélite, moins de 3 % des cas). Manifestations neurologiques dans 3 à 15 % des borrélioses.</p>
<div class="lab">Traitement</div><p>Doxycycline par voie orale ou ceftriaxone, céfotaxime ou pénicilline G par voie intraveineuse, d’efficacité équivalente ; 14 jours en forme précoce, 14–21 jours en forme tardive.</p>
<div class="lab">Piège</div><p>L’érythème migrant manque dans 50 à 75 % des cas aigus ; la sérologie ne sert ni de marqueur d’acuité ni de suivi, et la séroprévalence chez les sujets sains est de 3 à 20 %.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">Recommandation allemande sur la neuroborréliose de Lyme, German Medical Science 2025</a> ; <a href="https://doi.org/10.1111/ene.16034" target="_blank" rel="noopener">Revue systématique des traitements de la neuroborréliose de Lyme, European Journal of Neurology 2023</a> ; <a href="https://doi.org/10.3238/arztebl.2018.0751" target="_blank" rel="noopener">Rauer et collaborateurs, Neuroborréliose de Lyme, Deutsches Ärzteblatt International 2018</a>.</p>
</template>
<template data-pop="g01-syphilis" data-title="Treponema pallidum et neurosyphilis">
<div class="lab">Stades</div><p>Précoce : méningite syphilitique, atteinte méningovasculaire, gommes. Tardive : tabès, paralysie générale. Asymptomatique : sérologie positive et liquide anormal sans clinique. Neurosyphilis tardive chez 5 à 10 % dans l’histoire naturelle.</p>
<div class="lab">Épidémiologie</div><p>Suisse : 800 à 1000 cas par an, 1078 en 2022. Allemagne : 85 % des cas chez les HSH, co-infection par le VIH 46 % chez les HSH.</p>
<div class="lab">Traitement</div><p>Pénicilline G par voie intraveineuse pendant 14 jours (au moins 10) ; alternatives ceftriaxone ou doxycycline.</p>
<div class="lab">Limite</div><p>Épidémiologie suisse de la neurosyphilis non disponible.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" target="_blank" rel="noopener">Recommandation allemande sur le diagnostic et le traitement de la neurosyphilis, Neurological Research and Practice 2020</a> ; <a href="https://www.newsd.admin.ch/newsd/message/attachments/87224.pdf" target="_blank" rel="noopener">Office fédéral de la santé publique, communiqué sur les infections sexuellement transmissibles, 24.04.2024</a>.</p>
</template>
<template data-pop="g01-tuberculose" data-title="Méningite tuberculeuse">
<div class="lab">Présentation</div><p>Urgence médicale. Suspicion devant une leucocytose lymphocytaire, des protéines élevées et un rapport glucose liquide/plasma &lt; 50 %.</p>
<div class="lab">Traitement</div><p>Début empirique sans attendre la confirmation ; 2 mois de rifampicine, isoniazide, pyrazinamide et éthambutol, puis continuation étendue à 10 mois (12 mois au total) ; corticoïdes les premières semaines (6–8 semaines) pour tous les patients.</p>
<div class="lab">Prévention</div><p>Le BCG protège contre la méningite tuberculeuse ; il est recommandé seulement pour les nourrissons de moins de 12 mois vivant durablement dans un pays d’incidence &gt; 50 pour 100 000.</p>
<div class="lab">Limite</div><p>Pas de source européenne récente en texte intégral ; recommandation britannique de 2009 lue au résumé ; doses de dexaméthasone non lues.</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Office fédéral de la santé publique et Ligue pulmonaire suisse, Tuberculose en Suisse, guide V1.2024</a> ; <a href="https://doi.org/10.1016/j.jinf.2009.06.011" target="_blank" rel="noopener">Recommandation britannique sur la tuberculose du système nerveux central, Journal of Infection 2009 (résumé)</a> ; <a href="https://www.bag.admin.ch/fr/tuberculose" target="_blank" rel="noopener">Office fédéral de la santé publique, Tuberculose (page consultée le 14.10.2026)</a>.</p>
</template>
<template data-pop="g01-rares" data-title="Agents rares : typhoïde, salmonelles, leptospirose, gonocoque, charbon">
<div class="lab">Statut</div><p>La classification G01* cite fièvre typhoïde, salmonellose, leptospirose, gonococcie et charbon comme causes possibles.</p>
<div class="lab">Limite</div><p>Aucune source spécifique n’a été lue pour ces agents, ni pour la syphilis congénitale. Aucune donnée sur la fréquence, la clinique ou le traitement n’est donc rapportée : le médecin consulte l’information locale et l’infectiologue.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">Classification internationale des maladies, version allemande 2024, bloc G00–G09 (Institut fédéral allemand des médicaments), consultée le 14.10.2026</a>.</p>
</template>
<template data-pop="g01-lacunes" data-title="Sources non lues et limites">
<div class="lab">Non accessible</div><p>Recommandation ESCMID de 2016 (accès refusé) ; aucune recommandation européenne récente sur la méningite bactérienne lue ; aucun article du Swiss Medical Forum ni recommandation d’une société suisse propre à la méningite.</p>
<div class="lab">Non trouvé</div><p>Information professionnelle suisse de l’ampicilline (amoxicilline utilisée comme substitut à valider) ; typhoïde, salmonellose, leptospirose, gonocoque, charbon, syphilis congénitale ; délais légaux de déclaration ; épidémiologie suisse de la neuroborréliose et de la neurosyphilis.</p>
<div class="lab">Lecture partielle</div><p>Douze sources lues au résumé seulement, dont la méningite tuberculeuse (recommandation britannique de 2009).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande, autrichienne et suisse sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a> ; <a href="https://doi.org/10.1016/j.jinf.2009.06.011" target="_blank" rel="noopener">Recommandation britannique sur la tuberculose du système nerveux central, Journal of Infection 2009 (résumé)</a>.</p>
</template>
<template data-pop="g01-aliments-listeria" data-title="Aliments à risque de listériose">
<div class="lab">Aliments en cause</div><p>Charcuterie, poisson, lait cru et fromages, salades en sachet.</p>
<div class="lab">Prévention</div><p>Hygiène de cuisine ; les groupes à risque évitent salades crues, viande ou poisson crus, fruits de mer, fromages à pâte molle et au lait cru.</p>
<div class="lab">Épidémiologie</div><p>Jusqu’à 100 cas déclarés par an en Suisse ; flambées possibles ; létalité jusqu’à 20 %.</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/fr/listeriose-2" target="_blank" rel="noopener">Office fédéral de la santé publique, Listériose (page consultée le 14.10.2026)</a>.</p>
</template>
<template data-pop="g01-tique" data-title="Piqûre de tique et risque de borréliose">
<div class="lab">Valeurs</div><p>Séroconversion après piqûre : 2,6 à 5,6 % ; maladie : 0,3 à 1,4 %. Séroprévalence chez le sujet sain : 3 à 20 %.</p>
<div class="lab">Clinique</div><p>Douleurs radiculaires 4 à 6 semaines après la piqûre (extrêmes 1 à 18) ; érythème migrant dans 25 à 50 % des cas aigus.</p>
<div class="lab">Application</div><p>Une séroprévalence de 3 à 20 % chez le sujet sain impose de ne pas interpréter une sérologie positive isolée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">Recommandation allemande sur la neuroborréliose de Lyme, German Medical Science 2025</a>.</p>
</template>
<template data-pop="g01-bannwarth" data-title="Syndrome de Bannwarth">
<div class="lab">Définition</div><p>Radiculite douloureuse avec atteinte des nerfs crâniens et pléiocytose lymphocytaire dans le liquide.</p>
<div class="lab">Valeurs</div><p>Atteinte des nerfs crâniens chez environ 60 % ; facial dans plus de 80 % de ces cas, bilatéral dans un tiers.</p>
<div class="lab">Piège</div><p>Chez l’enfant, la méningite lymphocytaire avec paralysie faciale (environ 55 %) domine.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">Recommandation allemande sur la neuroborréliose de Lyme, German Medical Science 2025</a>.</p>
</template>
<template data-pop="g01-paralysie-faciale" data-title="Paralysie faciale et neuroborréliose">
<div class="lab">Valeurs</div><p>Atteinte faciale dans plus de 80 % des syndromes de Bannwarth avec nerfs crâniens atteints ; bilatérale dans un tiers.</p>
<div class="lab">Conduite</div><p>Pas de corticoïdes pour la paralysie faciale de la neuroborréliose. Récupération en 1 à 2 mois, séquelles 5 à 10 %.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">Recommandation allemande sur la neuroborréliose de Lyme, German Medical Science 2025</a>.</p>
</template>
<template data-pop="g01-purpura" data-title="Éruption cutanée et prélèvement dans la méningococcie">
<div class="lab">Clinique</div><p>La septicémie méningococcique comprend une éruption cutanée, avec choc, coma ou décès possibles en quelques heures.</p>
<div class="lab">Examen</div><p>Les lésions cutanées peuvent être prélevées pour microscopie et culture.</p>
<div class="lab">Limite</div><p>La description morphologique précise de l’éruption n’est pas détaillée dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande, autrichienne et suisse sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a> ; <a href="https://www.bag.admin.ch/fr/maladies-invasives-a-meningocoques" target="_blank" rel="noopener">Office fédéral de la santé publique, Maladies invasives à méningocoques (page consultée le 14.10.2026)</a>.</p>
</template>
<template data-pop="g01-oeil-oreille" data-title="Atteintes oculaire et auditive dans la syphilis">
<div class="lab">Clinique</div><p>Uvéite postérieure ou panuvéite, surdité et atteinte des nerfs crâniens III, VII, VIII et parfois du nerf optique.</p>
<div class="lab">Application</div><p>Ces atteintes justifient de rechercher une uvéite et une surdité ; la surdité est aussi une séquelle de la méningite bactérienne.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande, autrichienne et suisse sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" target="_blank" rel="noopener">Recommandation allemande sur le diagnostic et le traitement de la neurosyphilis, Neurological Research and Practice 2020</a>.</p>
</template>
<template data-pop="g01-syph-avc" data-title="Forme méningovasculaire de la syphilis">
<div class="lab">Clinique</div><p>Accident vasculaire cérébral du sujet jeune sans facteur de risque vasculaire.</p>
<div class="lab">Application</div><p>Devant cette présentation, le médecin recherche une neurosyphilis par sérologie tréponémique et examen du liquide.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" target="_blank" rel="noopener">Recommandation allemande sur le diagnostic et le traitement de la neurosyphilis, Neurological Research and Practice 2020</a>.</p>
</template>
<template data-pop="g01-vih-syph" data-title="Infection par le VIH et neurosyphilis">
<div class="lab">Critères de ponction</div><p>Au moins deux parmi : CD4 ≤ 200/µl, VIH non traité, charge virale détectable, VDRL &gt; 1:64.</p>
<div class="lab">Particularités</div><p>Régression plus lente du liquide ; une pléiocytose isolée peut exister indépendamment de la syphilis. Dépistage du VIH chez tout patient tuberculeux.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" target="_blank" rel="noopener">Recommandation allemande sur le diagnostic et le traitement de la neurosyphilis, Neurological Research and Practice 2020</a> ; <a href="https://doi.org/10.1016/j.jinf.2009.06.011" target="_blank" rel="noopener">Recommandation britannique sur la tuberculose du système nerveux central, Journal of Infection 2009 (résumé)</a>.</p>
</template>
<template data-pop="g01-anat-meninges" data-title="Enveloppes méningées">
<div class="lab">Rappel didactique</div><p>Dure-mère, arachnoïde, pie-mère ; le liquide circule dans l’espace sous-arachnoïdien. Rappel non chiffré.</p>
<div class="lab">Application</div><p>La réaction inflammatoire de la méningite se développe dans cet espace ; l’hydrocéphalie figure parmi les conséquences décrites.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3131058/" target="_blank" rel="noopener">Revue de physiopathologie de la méningite pneumococcique (van de Beek et collaborateurs), Clinical Microbiology Reviews 2011</a>.</p>
</template>
<template data-pop="g01-histo-barriere" data-title="Passage de la bactérie à travers la barrière">
<div class="lab">Voies</div><p>Voie transcellulaire ou paracellulaire ; le plexus choroïde peut aussi servir d’entrée.</p>
<div class="lab">Application</div><p>Une fois dans le liquide, la bactérie se multiplie sans opposition, car le complément et les phagocytes y sont rares.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3131058/" target="_blank" rel="noopener">Revue de physiopathologie de la méningite pneumococcique (van de Beek et collaborateurs), Clinical Microbiology Reviews 2011</a>.</p>
</template>
<template data-pop="g01-hic" data-title="Hypertension intracrânienne dans la méningite">
<div class="lab">Mécanisme</div><p>L’œdème vasogénique par rupture de barrière élève la pression intracrânienne.</p>
<div class="lab">Mesures</div><p>Tête à 30 °, sédation, hyperventilation brève (pCO2 32–35 mmHg), mannitol possible, dérivation ventriculaire externe en cas d’hydrocéphalie, héparine en cas de thrombose veineuse. Pas de glycérol ni d’hypothermie.</p>
<div class="lab">Limite</div><p>L’hyperventilation est brève ; la recommandation n’en fait pas un traitement prolongé.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande, autrichienne et suisse sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3131058/" target="_blank" rel="noopener">Revue de physiopathologie de la méningite pneumococcique (van de Beek et collaborateurs), Clinical Microbiology Reviews 2011</a>.</p>
</template>
<template data-pop="g01-contact" data-title="Contact étroit du méningocoque">
<div class="lab">Est un contact étroit</div><p>Ménage commun ou situation comparable (internat, caserne, prison, camp) ; contact direct avec les sécrétions (baisers, réanimation sans protection, intubation) ; sport de combat ; même groupe de crèche ou de jardin d’enfants.</p>
<div class="lab">N’est pas un contact étroit</div><p>Simple proximité, contact après décès, même classe d’école primaire ou secondaire.</p>
<div class="lab">Fenêtre</div><p>De 7 jours avant les symptômes à 24 heures après le début du traitement.</p>
<p class="src">Références : <a href="https://fr.ch/document/347621" target="_blank" rel="noopener">Service du médecin cantonal de Fribourg, Maladies invasives à méningocoques, informations aux professionnels, 2025 (d’après le Bulletin de l’Office fédéral de la santé publique 4/25)</a>.</p>
</template>
<template data-pop="g01-chimioprophylaxie" data-title="Chimioprophylaxie des contacts">
<div class="lab">Délais</div><p>Idéalement dans les 24 heures ; utile jusqu’au 10<sup>e</sup> jour après le dernier contact. La vaccination antérieure ne dispense pas.</p>
<div class="lab">Choix</div><p>Ciprofloxacine 20 mg/kg par voie orale, dose unique (maximum 500 mg), dès la naissance ; rifampicine 10 mg/kg (maximum 600 mg) toutes les 12 heures pendant 2 jours (5 mg/kg avant 1 mois) ; ceftriaxone par voie intramusculaire 125 mg (≤ 12 ans) ou 250 mg (&gt; 12 ans et femme enceinte).</p>
<div class="lab">Grossesse</div><p>Ciprofloxacine et rifampicine exclues ; ceftriaxone 250 mg.</p>
<div class="lab">Limite</div><p>Source : fiche du médecin cantonal de Fribourg citant le Bulletin de l’OFSP 4/25, non lu directement. Aucune information professionnelle suisse n’a été lue pour la ciprofloxacine dans cette indication.</p>
<p class="src">Références : <a href="https://fr.ch/document/347621" target="_blank" rel="noopener">Service du médecin cantonal de Fribourg, Maladies invasives à méningocoques, informations aux professionnels, 2025 (d’après le Bulletin de l’Office fédéral de la santé publique 4/25)</a>.</p>
</template>
<template data-pop="g01-vaccination" data-title="Vaccination antiméningococcique">
<div class="lab">Routine</div><p>Vaccins B (Bexsero) et ACWY (Menveo, MenQuadfi) : 3–18 mois (rattrapage jusqu’à 5 ans) et 11–15 ans (rattrapage jusqu’à 20 ans) ; groupes à risque à tout âge ; recrues, personnel de laboratoire, voyageurs.</p>
<div class="lab">Post-exposition</div><p>Le plus tôt possible : sérogroupes A, C, W, Y si typé ; pas avant 2 mois. Extension au sérogroupe B depuis mai 2022 selon la recommandation allemande, à vérifier dans le Bulletin de l’OFSP.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande, autrichienne et suisse sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a> ; <a href="https://www.bag.admin.ch/fr/maladies-invasives-a-meningocoques" target="_blank" rel="noopener">Office fédéral de la santé publique, Maladies invasives à méningocoques (page consultée le 14.10.2026)</a> ; <a href="https://www.infovac.ch/docs/public/fs/fs-vaccination-m--ningocoques-2024.pdf" target="_blank" rel="noopener">Office fédéral de la santé publique et Commission fédérale pour les vaccinations, Fiche d’information Méningocoques, janvier 2024</a> ; <a href="https://fr.ch/document/347621" target="_blank" rel="noopener">Service du médecin cantonal de Fribourg, Maladies invasives à méningocoques, informations aux professionnels, 2025 (d’après le Bulletin de l’Office fédéral de la santé publique 4/25)</a>.</p>
</template>
<template data-pop="g01-jarisch" data-title="Réaction de Jarisch-Herxheimer">
<div class="lab">Définition</div><p>Réaction inflammatoire transitoire après le début du traitement d’une neurosyphilis.</p>
<div class="lab">Valeurs</div><p>Survient 12 à 24 heures après le début (1 à 2 % des neurosyphilis) selon la recommandation allemande ; 2 à 12 heures après la première dose selon l’information professionnelle suisse de la pénicilline G.</p>
<div class="lab">Conduite</div><p>Anti-inflammatoires non stéroïdiens ; l’antibiotique n’est pas interrompu ; corticoïdes non recommandés en routine.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" target="_blank" rel="noopener">Recommandation allemande sur le diagnostic et le traitement de la neurosyphilis, Neurological Research and Practice 2020</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Pénicilline Grünenthal, Swissmedic, mai 2023</a>.</p>
</template>
<template data-pop="g01-herpes" data-title="Aciclovir et encéphalite herpétique">
<div class="lab">Indication</div><p>L’aciclovir par voie intraveineuse est ajouté tant que l’encéphalite herpétique n’est pas exclue.</p>
<div class="lab">Limite</div><p>Posologie et durée non lues dans le dossier ; se référer à l’information professionnelle suisse de l’aciclovir.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande, autrichienne et suisse sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a>.</p>
</template>
<template data-pop="g01-crosreact" data-title="Réactivité croisée et CXCL13">
<div class="lab">Réactivité croisée</div><p>Les tests TPHA/TPPA peuvent réagir avec Borrelia.</p>
<div class="lab">CXCL13</div><p>Élevé dans la neuroborréliose, la neurosyphilis et le lymphome du système nerveux central ; non recommandé en neurosyphilis ; non standardisé en neuroborréliose.</p>
<div class="lab">Application</div><p>Un résultat isolé ne tranche jamais entre ces entités ; la clinique et la synthèse intrathécale d’anticorps spécifiques décident.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" target="_blank" rel="noopener">Recommandation allemande sur le diagnostic et le traitement de la neurosyphilis, Neurological Research and Practice 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">Recommandation allemande sur la neuroborréliose de Lyme, German Medical Science 2025</a>.</p>
</template>
<template data-pop="g01-mnemo" data-title="Séquence H, A, D, I">
<div class="lab">Contenu</div><p>Hémocultures, Antibiotique, Dexaméthasone, Imagerie si critères (trouble sévère de la conscience, déficit focal nouveau, crise récente), puis ponction.</p>
<div class="lab">Mention</div><p>Aide pédagogique, non critère officiel.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande, autrichienne et suisse sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a>.</p>
</template>
