<template data-pop="g32-codage" data-k="g32-codage"><h3>Une manifestation précise exige une maladie causale documentée</h3><p>La classification française désigne G32.0* comme « Dégénérescence combinée subaiguë de la moelle épinière au cours de maladies classées ailleurs ». Elle inclut celle associée à une carence en vitamine B12, avec E53.8†. E53.8 inclut la carence en cobalamine. D51 concerne l’anémie par carence en B12 : une carence et une anémie ne sont pas des synonymes que l’on code sans examiner le dossier.</p><p>G32.8* signifie « Autres affections dégénératives précisées du système nerveux au cours de maladies classées ailleurs ». L’entrée lue ne fournit pas de liste de causes. Le mot précisées ne signifie pas non précisées : ce sous-code ne devient pas une catégorie de secours pour toute neuropathie, toute intoxication ou tout trouble de la marche sans cause établie.</p><p>Le manuel suisse 2026 donne priorité au code étiologique dague, suivi immédiatement de la manifestation étoile si les conditions sont remplies ; un code étoile ne s’utilise jamais seul. La traduction d’une exposition au protoxyde d’azote et d’une carence fonctionnelle en codes causaux supplémentaires demande les règles applicables au cas réel. Aucun couple non vérifié n’est imposé ici à toutes les intoxications.</p><p>Sources : <button class="w" data-k="g32-r1">[1]</button> · <button class="w" data-k="g32-r2">[2]</button> · <button class="w" data-k="g32-r10">[10]</button></p></template>
<template data-pop="g32-serie" data-k="g32-serie"><h3>Ce que montre la série allemande de 23 cas</h3><p>Cinq services allemands ont réuni rétrospectivement 23 cas neurologiques liés au protoxyde d’azote entre 2020 et 2024. Les paresthésies étaient rapportées chez 22 sur 23, l’ataxie chez 19 sur 23 et une neuropathie chez les 20 personnes testées. Une B12 anormale concernait 8 sur 23 ; l’acide méthylmalonique était anormal chez 18 sur 19 testés. Le nombre de personnes examinées varie donc selon le paramètre.</p><p>Ces observations ne sont ni une sensibilité de test dans la population générale ni un risque individuel après une exposition. Plusieurs pourcentages du tableau ne concordent pas avec leurs comptes ; ils ne sont pas recopiés comme valeurs stables. Le suivi ne concernait que sept personnes, avec sélection et durée variables. Le cours conserve les comptes pertinents et leurs limites, sans convertir la série en taux suisse.</p><p>Sources : <button class="w" data-k="g32-r6">[6]</button></p></template>
<template data-pop="g32-etiologies" data-k="g32-etiologies"><h3>Pourquoi la B12 manque-t-elle ou fonctionne-t-elle mal ?</h3><p>Interroger les apports et les compléments, sans conclure qu’un régime explique à lui seul tout déficit. Rechercher chirurgie gastrique ou iléale, maladie digestive, gastrite auto-immune et médicaments associés à une baisse du statut B12. Plusieurs causes peuvent coexister, et l’exposition au protoxyde d’azote peut révéler une vulnérabilité préexistante.</p><p>Le facteur intrinsèque participe à l’absorption digestive. Une gastrite auto-immune, une gastrectomie ou une atteinte de l’iléon peuvent modifier les besoins de substitution et la durée d’entretien. Les anticorps anti-facteur intrinsèque constituent un argument selon la situation, mais leur négativité n’exclut pas à elle seule une cause auto-immune. Le bilan est guidé par l’histoire et l’interprétation du laboratoire. NICE utilise le terme gastrite auto-immune et évite de le rendre synonyme d’anémie pernicieuse ; la FI conserve ce dernier terme pour ses indications. Les formulations gardent ici leur champ propre.</p><p>Le protoxyde d’azote perturbe l’activité de la cobalamine. Le questionnement porte sur quantité, fréquence, durée, type de contenant, dernière exposition et compléments pris pour se protéger. Une B12 achetée librement ne rend pas la poursuite du gaz sûre. L’arrêt de l’exposition et l’accompagnement sont centraux ; l’étiquette de carence fonctionnelle ne remplace pas l’enquête sur une compression, une inflammation ou une autre maladie.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></template>
<template data-pop="g32-exposition" data-k="g32-exposition"><h3>Questionner l’exposition avec confidentialité et précision</h3><p>Demander explicitement l’usage de protoxyde d’azote, car la personne ne fait pas toujours le lien avec ses symptômes et ne le rapporte pas spontanément. Le type de contenant et la quantité comptent ; un nombre de ballons ou de cartouches sans taille ni fréquence est une information incomplète. Rechercher la dernière exposition et les tentatives de supplémentation.</p><p>Recueillir régime, chirurgie digestive, maladie digestive ou auto-immune, traitements et résultats antérieurs. Interroger symptômes sphinctériens, douleurs rachidiennes, faiblesse, fièvre et autres signes qui peuvent changer la localisation ou l’urgence. L’entretien évite le jugement : son objectif est d’obtenir des données utiles et de construire un suivi auquel la personne pourra adhérer.</p><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button> · <button class="w" data-k="g32-r9">[9]</button></p></template>
<template data-pop="g32-examen" data-k="g32-examen"><h3>Une manœuvre doit être sûre et interprétable</h3><p>Pour le sens de position, faire reconnaître des positions yeux ouverts, puis yeux fermés, avec de petites mobilisations progressives ; tenir les faces latérales du segment limite les indices de pression. La pallesthésie est testée avec un diapason de 128 Hz sur les reliefs osseux après démonstration. Le niveau et la symétrie de la perception sont décrits, plutôt qu’un seuil numérique non validé pour tous les patients.</p><p>Le Romberg compare l’équilibre avec puis sans information visuelle, dans des conditions protégées contre la chute. Une aggravation à fermeture des yeux évoque notamment un trouble proprioceptif, mais l’interprétation doit distinguer d’autres syndromes de l’équilibre. Une personne incapable de tenir debout en sécurité n’est pas exposée à une chute pour obtenir un signe. Examiner force, tonus, réflexes, réponses plantaires, coordination et marche selon la sécurité.</p><p>Une force conservée ou des réponses plantaires en flexion n’excluent pas une myélopathie sensitive. Les réflexes peuvent être diminués ou augmentés selon l’importance relative de la neuropathie et de l’atteinte médullaire. Une discordance appelle une nouvelle analyse, pas la suppression d’un signe gênant pour l’étiquette initiale.</p><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r6">[6]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r13">[13]</button></p></template>
<template data-pop="g32-criteres" data-k="g32-criteres"><h3>Il n’existe pas de score unique pour tout G32</h3><p>Pour G32.0, le dossier relie un syndrome médullaire compatible, une cause de déficit ou d’inactivation B12 et des investigations pertinentes. L’atteinte combinée peut être incomplète. Les marqueurs fonctionnels et l’imagerie soutiennent l’interprétation sans être tous obligatoirement anormaux. Les autres diagnostics restent ouverts si les signes ou l’évolution ne concordent pas.</p><p>G32.8 est une autre manifestation dégénérative précisée au cours d’une maladie classée ailleurs. Il ne se diagnostique pas par un seuil B12, un résultat de Romberg ou un test de métabolite commun à toutes ses causes. L’absence de liste causale dans l’entrée ne donne pas le droit d’y placer une affection sans preuve. La maladie causale et la manifestation doivent être nommées et leur association de codage vérifiée.</p><p>Une réponse au traitement est utile au suivi, mais elle ne remplace pas l’évaluation initiale des urgences ni ne prouve seule une cause. Inversement, l’absence d’amélioration immédiate n’exclut pas une atteinte qui peut récupérer lentement ou laisser des séquelles. Définir les observations à suivre permet d’interpréter la trajectoire.</p><p>Sources : <button class="w" data-k="g32-r1">[1]</button> · <button class="w" data-k="g32-r2">[2]</button> · <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button></p></template>
<template data-pop="g32-b12-fonction" data-k="g32-b12-fonction"><h3>Pourquoi une B12 normale peut-elle tromper ?</h3><p>Dans une carence liée au protoxyde d’azote, la fonction de la vitamine peut être altérée alors que la concentration paraît normale. NICE privilégie alors homocystéine ou acide méthylmalonique au bilan initial. Les suppléments déjà pris peuvent augmenter la B12 totale ou active sans avoir corrigé toutes les conséquences de la carence. Le nom, la dose et la date de ces prises sont transmis au laboratoire.</p><p>L’acide méthylmalonique et l’homocystéine reflètent des réactions dépendantes de B12, mais ne sont pas spécifiques en toute situation. Le rein, d’autres carences et certains médicaments peuvent modifier les résultats. Après arrêt du gaz ou début de traitement, les marqueurs peuvent se normaliser et perdre de leur valeur pour documenter l’état initial. Le délai exact ne doit pas être reconstruit comme une fenêtre universelle.</p><p>L’absence d’anémie ou de macrocytose n’exclut pas une atteinte neurologique. Inversement, une anémie demande son propre bilan et ne démontre pas à elle seule une dégénérescence médullaire. L’interprétation associe clinique, cause, méthodes et chronologie, avec recherche d’une autre explication en cas de discordance.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r6">[6]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></template>
<template data-pop="g32-prise-en-charge" data-k="g32-prise-en-charge"><h3>Une stratégie adaptée à la cause et à la gravité</h3><p>La prise en charge d’une atteinte neurologique compatible doit être organisée rapidement avec l’équipe adaptée. La FI suisse de Vitarubine Dépôt décrit chez l’adulte des cas aigus traités par 1000 µg deux à trois fois par semaine par voie intramusculaire. Les informations exactes de la préparation et les précautions sont détaillées en pharmacologie. Ce repère ne définit pas à lui seul le schéma de toute cause de G32.</p><p>Le protocole britannique spécialisé de myélopathie au gaz privilégie une prise en charge injectable intensive et une réévaluation neurologique rapprochée ; son rythme n’est pas fusionné silencieusement avec la notice suisse. NICE laisse plus largement le choix de voie selon le contexte dans la carence liée au gaz. La gravité, la sécurité, l’observance et le produit réellement disponible sont discutés avec neurologie et pharmacie, sans présenter ces populations comme identiques.</p><p>L’arrêt de l’exposition au protoxyde d’azote est indispensable. La supplémentation ne protège pas d’une poursuite du gaz. Proposer un accompagnement confidentiel, l’accès aux soins et un suivi réalisable. Physiothérapie, rééducation de la marche, prévention des chutes et aides adaptées répondent au handicap pendant la récupération. Les autres causes de G32.8 nécessitent leur propre traitement causal ; il n’existe pas d’ordonnance commune déduite du seul code.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r9">[9]</button></p></template>
<template data-pop="g32-folates" data-k="g32-folates"><h3>Folates et méthionine : distinguer complément indiqué et routine non prouvée</h3><p>Les folates seuls peuvent corriger ou masquer l’anémie sans corriger la carence en B12, alors que l’atteinte neurologique peut progresser. La FI demande de dépister et traiter les manques associés ; le protocole britannique mesure les folates et les corrige s’ils sont bas. Cela ne justifie pas de substituer des folates à la B12 devant un syndrome neurologique compatible.</p><p>Le cas suisse rapporte une supplémentation en folates et méthionine et discute son propre protocole. L’article britannique ne trouve pas de preuve clinique en faveur de méthionine ou folates adjuvants systématiques en dehors des carences à corriger. Un schéma décrit dans un cas ne devient donc pas une prescription générale. Aucune dose nouvelle de méthionine ou de folates n’est proposée ici sans information professionnelle suisse correspondante.</p><p>Le calendrier est discuté avec l’équipe selon le bilan et le traitement B12 engagé. Attendre mécaniquement qu’un taux sérique de B12 se normalise est une règle trompeuse si le dosage est déjà influencé par les injections. Le but est de traiter correctement B12 et les carences associées, avec contrôle clinique et biologique adapté.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></template>
<template data-pop="g32-pronostic" data-k="g32-pronostic"><h3>Lire le suivi des cas sans promettre un résultat</h3><p>Dans le cas suisse, le suivi téléphonique à trois mois rapportait symptômes persistants et poursuite du gaz après arrêt des vitamines. Il s’agit d’une trajectoire avec plusieurs facteurs ; ce délai et ce mode de suivi ne démontrent pas à eux seuls une irréversibilité définitive pour toute personne. Les termes du cas ne deviennent pas un pronostic individuel certain.</p><p>Dans la série allemande, seulement sept personnes avaient un suivi disponible : trois s’étaient améliorées avec des signes persistants, quatre sans amélioration notable. La sélection, la durée et les traitements limitent la comparaison. La FI souligne que des symptômes anciens peuvent ne pas être entièrement réversibles ; elle ne donne pas une garantie de récupération complète avant un seuil de durée.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r6">[6]</button> · <button class="w" data-k="g32-r7">[7]</button></p></template>
<template data-pop="g32-aide" data-k="g32-aide"><h3>Urgence médicale et accompagnement des addictions</h3><p>Infodrog oriente vers les services locaux d’addictologie, son annuaire et SafeZone, consultation anonyme en ligne. Le secret professionnel et une relation non jugeante facilitent l’accès au suivi. En cas d’urgence médicale, le 144 est le numéro d’ambulance indiqué. Une plateforme de conseil ne remplace pas une prise en charge urgente d’un déficit progressif ou d’une difficulté respiratoire.</p><p>L’accès aux injections et à la rééducation doit être réaliste : rendez-vous, transport, responsabilités des intervenants et possibilité de recontact sont précisés. Une information seule ne résout pas une difficulté d’observance ou une dépendance. L’accompagnement se construit avec la personne et ses ressources, sans inférence à partir de son origine ou de son niveau de formation.</p><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r9">[9]</button></p></template>
<template data-pop="pareto-g32-a" data-k="pareto-g32-a"><h3>Localisation, fonction et cause</h3><p>Une B12 ou un hémogramme normaux ne suffisent pas à exclure une atteinte fonctionnelle. G32.0 et G32.8 restent distincts. La gravité guide les soins, et le code traduit une conclusion plutôt qu’il ne la crée.</p></template>
<template data-pop="g32-seuils" data-k="g32-seuils"><h3>Repères de NICE et limites des marqueurs fonctionnels</h3><p>NICE 2024 propose, pour la B12 totale, une valeur inférieure à 133 pmol/l comme repère de carence, une zone intermédiaire de 133 à 258 pmol/l et une valeur supérieure à 258 pmol/l rendant une carence moins probable. Pour la B12 active, ses repères sont inférieurs à 25, entre 25 et 70, puis supérieurs à 70 pmol/l. Ce sont les seuils attribués à ce guide, avec respect des seuils validés par le laboratoire ; ce ne sont pas des limites universelles pour chaque méthode suisse.</p><p>Dans l’exposition au protoxyde d’azote, une B12 totale ou active normale ne suffit pas à exclure l’inactivation fonctionnelle. NICE privilégie alors homocystéine ou acide méthylmalonique au départ. Pour ces métabolites, le guide demande les références locales et l’examen des facteurs associés. Les seuils approximatifs de publications plus anciennes ne sont donc pas réunis en une seule table impérative.</p><p>Le rein peut augmenter les métabolites, et les folates ou d’autres facteurs influencent l’homocystéine. Prévenir le laboratoire des traitements et de la date de dernière exposition. Un prélèvement tardif après arrêt ou substitution peut être moins informatif sur l’état initial. Ni une valeur normale tardive ni une valeur élevée isolée ne remplace la synthèse clinique.</p><p>Sources : <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></template>
<template data-pop="g32-imagerie" data-k="g32-imagerie"><h3>Lire l’IRM avec la question et les signes</h3><p>Une atteinte des cordons postérieurs peut apparaître comme un hypersignal sur les séquences T2, avec un aspect en V inversé en coupe axiale. Le cas suisse montre ce profil dans un contexte cohérent de symptômes et d’exposition. Ce motif n’est pas spécifique du protoxyde d’azote : d’autres carences et maladies peuvent partager une atteinte postérieure.</p><p>L’imagerie recherche aussi une compression et d’autres causes. Une IRM normale ne suffit pas toujours à exclure une myélopathie au gaz. La concordance entre niveau, signes et mécanisme est plus utile qu’une reconnaissance de forme isolée. La figure ci-dessous est une image clinique publiée, avec flèches de la source ; elle n’est pas un outil d’autodiagnostic.</p><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r7">[7]</button></p></template>
<template data-pop="pareto-g32-e" data-k="pareto-g32-e"><h3>Mesure, contexte et délai</h3><p>Les tests de concentration et de fonction, l’image et l’examen neurologique se complètent. Une valeur sous traitement n’a pas le même sens que le prélèvement initial ; la fonction reste un objectif du suivi.</p></template>
<template data-pop="pareto-g32-sci" data-k="pareto-g32-sci"><h3>Concentration, fonction et preuve</h3><p>La sémiologie décrit la perte fonctionnelle ; l’anatomie et la physiologie localisent ; la biochimie, l’hématologie et l’immunologie documentent des mécanismes et des causes ; la pharmacologie sécurise le produit. Aucune étape n’est remplacée par le code.</p></template>
<template data-pop="g32-vitarubine" data-k="g32-vitarubine"><h3>Acétate d’hydroxocobalamine : garder la formulation du produit</h3><p>La composition de la FI indique : une ampoule de 1 ml contient 1,0 mg d’acétate d’hydroxocobalamine. Elle ne fournit pas d’équivalence en masse de base à recalculer ici. Le cours conserve cette formulation et ne la transforme pas silencieusement en 1 mg de cyanocobalamine, en une autre forme de B12 ou en une dose orale. Un nom de vitamine ne rend pas deux préparations interchangeables.</p><p>Chez l’adulte dans les cas aigus, la FI décrit 1000 µg deux à trois fois par semaine par injection intramusculaire. Une injection intraveineuse lente est possible mais n’est pas recommandée par la notice. Le libellé de dose est repris avec le produit et sa voie ; un schéma d’une autre publication n’est pas présenté comme celui de la FI.</p><p>L’anémie pernicieuse avec ou sans symptômes neurologiques fait partie des indications, ainsi que d’autres états de carence cités dans la notice. Le diagnostic doit être assuré avant la thérapie selon le texte du produit. Devant une atteinte neurologique évocatrice et grave, les textes cliniques demandent de ne pas attendre inutilement les résultats : l’équipe documente hypothèse, bilan initial et décision, avec prise en charge spécialisée et pharmacie.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button></p></template>
<template data-pop="g32-unites" data-k="g32-unites"><h3>Lire une dose en microgrammes sans inventer une conversion chimique</h3><p>Mille microgrammes correspondent à un milligramme comme relation entre unités de masse. Cette relation ne fournit pas une conversion entre masse du sel et masse de base, ni entre différentes substances. La composition et le libellé de dose de la spécialité doivent rester ceux de la notice. Le volume à préparer dépend de la présentation réellement utilisée et de la prescription vérifiée.</p><p>Une substitution de forme ou de voie demande un choix explicite du prescripteur et du pharmacien. Une dose orale d’une autre cobalamine n’est pas obtenue par le simple remplacement du mot injectable. L’exercice d’unité ne valide pas l’indication, le rythme ou la durée pour une personne donnée.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button></p></template>
<template data-pop="g32-entretien" data-k="g32-entretien"><h3>La durée dépend de la cause et de la réponse</h3><p>Pour l’anémie pernicieuse au long cours, la FI décrit 1000 µg tous les deux à trois mois et une poursuite pour une durée indéterminée. Dans les autres états de carence, elle prévoit de continuer jusqu’à élimination de la cause et reconstitution des réserves. Ces formulations ne signifient ni arrêt après une première amélioration ni injections indéfinies pour toute exposition passée au gaz.</p><p>Le protocole britannique spécialisé réévalue la progression neurologique et la stabilisation du bénéfice. NICE distingue cause irréversible, cause résolue et cause encore inconnue. Les recommandations et la FI convergent sur la nécessité de réévaluer la raison du traitement, mais ne fournissent pas un calendrier identique applicable à tout G32. La prescription indique ce qui motive l’entretien et ce qui sera réexaminé.</p><p>Une B12 élevée sous injections peut refléter l’exposition médicamenteuse. Elle ne prouve pas seule un surdosage responsable des symptômes et ne constitue pas à elle seule une raison d’arrêt d’un traitement nécessaire. À l’inverse, une aggravation demande une analyse clinique complète plutôt qu’une prolongation automatique sans revoir la cause.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></template>
<template data-pop="g32-securite" data-k="g32-securite"><h3>Les précautions du produit ne disparaissent pas parce qu’il s’agit d’une vitamine</h3><p>La FI contre-indique une hypersensibilité connue à l’un des composants. Le produit contient du cobalt ; une allergie connue au cobalt demande une évaluation individuelle bénéfice-risque. Le parahydroxybenzoate de méthyle peut provoquer des réactions allergiques, éventuellement retardées, et exceptionnellement un bronchospasme. Une réaction sévère relève des mesures urgentes appropriées.</p><p>Une production transitoirement accrue de plaquettes peut augmenter le risque de complications chez les personnes prédisposées aux thromboses. L’intensification de l’érythropoïèse accroît le besoin en potassium ; la notice demande un contrôle régulier de la kaliémie. Une réponse insuffisante peut faire rechercher un manque associé en fer ou folates. Ces surveillances complètent l’examen neurologique, elles ne le remplacent pas.</p><p>La FI décrit aussi des effets cutanés et des réactions allergiques. Une aggravation neurologique, une réaction nouvelle ou un malaise sous traitement ne sont pas banalisés comme un effet inévitable de réparation. Revoir les signes, les résultats, la cause et les produits associés. Le cours n’invente pas un seuil biologique d’urgence propre à cette préparation si la notice ne le donne pas.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button></p></template>
<template data-pop="g32-interactions" data-k="g32-interactions"><h3>Une nouvelle prescription peut modifier l’effet ou l’interprétation</h3><p>Le chloramphénicol peut réduire l’effet thérapeutique en inhibant la maturation érythrocytaire selon la FI. Le méthotrexate, la pyriméthamine et certains anti-infectieux peuvent fausser des déterminations microbiologiques de B12 ; transmettre les traitements au laboratoire. Le type de dosage réellement utilisé compte et une ancienne mention ne doit pas devenir une règle indifférenciée pour toutes les méthodes.</p><p>La notice déconseille de mélanger le produit à d’autres solutions injectables, car des incompatibilités sont possibles. La préparation et la voie sont vérifiées avec le protocole et la pharmacie, sans ajouter arbitrairement un autre produit à l’ampoule. Les médicaments et compléments pris pour prévenir les effets du gaz sont aussi recherchés dans l’entretien.</p><p>Le protoxyde d’azote peut induire la carence fonctionnelle malgré des réserves normales. Continuer l’exposition pendant la substitution compromet donc son objectif. Les vitamines ne constituent pas une protection permettant de poursuivre sans risque. L’accompagnement de l’arrêt fait partie des soins, avec des modalités adaptées à la personne.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r9">[9]</button></p></template>
<template data-pop="pareto-g32-p" data-k="pareto-g32-p"><h3>Produit, cause et réponse</h3><p>Vitarubine : masse d’acétate, dose de FI, voie et précautions. La cause et la réponse expliquent l’entretien ; le taux sous injections ne résume pas la récupération. L’arrêt du gaz et l’accès au suivi sont aussi des traitements.</p></template>

<template data-pop="g32-r1" data-k="g32-r1"><h3>[1] OFS : CIM-10-GM française 2024</h3><p>G32 est une catégorie de manifestation à astérisque. G32.0 décrit la dégénérescence combinée subaiguë et inclut celle liée à une carence en vitamine B12 avec E53.8†. G32.8 désigne les autres affections dégénératives précisées, sans liste causale dans son entrée. E53.8 inclut la carence en cobalamine ; D51 concerne l’anémie par carence en B12.</p><p><b>Passages lus :</b> Entrées complètes G32, G32.0, G32.8, E53.8 et D51 du fichier structuré français. <b>Version :</b> 2024, export du 31 octobre 2024. <b>Limites :</b> Les sous-codes ne sont pas des causes interchangeables. Aucune association automatique de toute myélopathie ou de toute intoxication avec G32.8 n’est établie. La version de classification est explicitée ; les règles individuelles de codage restent à vérifier.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener noreferrer">Consulter la source — Office fédéral de la statistique</a></p></template>
<template data-pop="g32-r2" data-k="g32-r2"><h3>[2] BfArM : entrée G32 et ses deux sous-codes</h3><p>La version allemande confirme les deux sous-codes et l’inclusion de la dégénérescence combinée subaiguë liée à la carence en B12 avec E53.8† sous G32.0*. Aucune liste de maladies causales n’est ajoutée sous G32.8*.</p><p><b>Passages lus :</b> Entrée G32 entière, G32.0 et G32.8 jusqu’à la fin du bloc. <b>Version :</b> ICD-10-GM 2024. <b>Limites :</b> Classification allemande, sans protocole thérapeutique ni certification de facturation suisse.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g30-g32.htm" target="_blank" rel="noopener noreferrer">Consulter la source — BfArM</a></p></template>
<template data-pop="g32-r3" data-k="g32-r3"><h3>[3] Vitarubine Dépôt : information professionnelle suisse</h3><p>Une ampoule de 1 ml contient 1,0 mg d’acétate d’hydroxocobalamine. La FI décrit chez l’adulte, dans les cas aigus, 1000 µg deux à trois fois par semaine par voie intramusculaire ; la voie intraveineuse lente est possible mais non recommandée. Dans l’anémie pernicieuse, l’entretien de 1000 µg tous les deux à trois mois est poursuivi pour une durée indéterminée. Les autres carences sont traitées jusqu’à correction de la cause et reconstitution des réserves. Surveiller réponse, potassium et besoins en fer/folates selon contexte. Hypersensibilité aux composants contre-indiquée ; cobalt et excipients imposent leurs précautions. Une exposition prolongée au protoxyde d’azote peut induire une carence fonctionnelle malgré des réserves normales.</p><p><b>Passages lus :</b> Composition, indications, doses, voie, contre-indications, avertissements, interactions, grossesse, mécanisme, pharmacocinétique et date. <b>Version :</b> Juillet 2025, version réellement servie. <b>Limites :</b> La masse de base n’est pas donnée par la composition : ne pas convertir silencieusement la masse d’acétate, ni remplacer par cyanocobalamine. Enfant et adolescent non étudiés ; grossesse/allaitement seulement si nécessité absolue selon la notice. Pas d’adaptation rénale ou hépatique chiffrée propre trouvée. Les rythmes de centres étrangers et l’urgence clinique ne sont pas fusionnés dans le libellé de la FI.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680335840026" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic, information AIPS via AmiKo ; Streuli Pharma</a></p></template>
<template data-pop="g32-r4" data-k="g32-r4"><h3>[4] Myélopathie liée au protoxyde d’azote : cas de Suisse romande</h3><p>Un homme de 27 ans présentait une ataxie sensitive, une perte de vibration et de position, avec force conservée et réflexes diminués. L’IRM montrait une atteinte postérieure cervicale et un aspect en V inversé non spécifique. L’hémogramme était sans anomalie. La neurophysiologie initiale normale ne permettait pas d’exclure formellement une neuropathie aiguë. Des symptômes persistaient au suivi téléphonique à trois mois après non-observance et reprise d’exposition.</p><p><b>Passages lus :</b> Résumé, présentation clinique et discussion complètes, légendes des figures, licence et déclarations des auteurs. <b>Version :</b> 2026 ; identifiant de publication 10.7759/cureus.104698. <b>Limites :</b> Cas unique, ni fréquence nationale ni garantie de pronostic. Le protocole décrit n’est pas une recommandation nationale ; méthionine, folates et voies ne sont pas recopiés comme ordonnance. Les données d’Infodrog citées de seconde main ne sont pas des statistiques de G32. Figure 1 sous licence de l’article ; figure 5 BioRender avec droits réservés, non importée. Les auteurs indiquent un consentement obtenu ou une dispense ; aucun consentement individuel écrit n’est inventé.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener noreferrer">Consulter la source — Witzig et coll., Hôpital Riviera-Chablais à Rennaz ; Cureus</a></p></template>
<template data-pop="g32-r5" data-k="g32-r5"><h3>[5] NICE NG239 : carence en B12 chez les personnes de 16 ans et plus</h3><p>L’absence d’anémie ou de macrocytose n’exclut pas la carence. En cas de protoxyde d’azote, les marqueurs fonctionnels sont privilégiés au bilan initial. Prélever avant substitution si possible, sans retarder une prise en charge neurologique urgente. Le tableau distingue B12 totale inférieure à 133 pmol/l, zone intermédiaire de 133 à 258 et valeur supérieure à 258, tout en respectant les seuils validés localement. Les anticorps anti-facteur intrinsèque négatifs n’excluent pas une gastrite auto-immune. Le champ du guide commence à 16 ans inclus, vérifié sur sa présentation officielle. Il distingue gastrite auto-immune et anémie pernicieuse. Cause, gravité, voie et réponse guident le suivi.</p><p><b>Passages lus :</b> Sections 1.3 tests/seuils, 1.4 causes, 1.5 prise en charge et 1.6 suivi jusqu’à 1.6.14 ; rappels de 1.2. <b>Version :</b> Publié le 6 mars 2024, texte consulté le 2 novembre 2026. <b>Limites :</b> Guide britannique, pas une nouvelle autorisation de dose orale suisse. La carence liée au protoxyde d’azote en général et la myélopathie sévère spécialisée ne sont pas des populations identiques. Les références du laboratoire priment pour les métabolites ; les seuils britanniques ne sont pas imposés à chaque laboratoire suisse.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://www.nice.org.uk/guidance/ng239/chapter/Recommendations" target="_blank" rel="noopener noreferrer">Consulter la source — National Institute for Health and Care Excellence, Royaume-Uni</a></p></template>
<template data-pop="g32-r6" data-k="g32-r6"><h3>[6] Troubles neurologiques liés au protoxyde d’azote : expérience multicentrique allemande</h3><p>Vingt-trois cas rétrospectifs de cinq services entre 2020 et 2024. Paresthésies chez 22 sur 23, ataxie chez 19 sur 23 ; neuropathie chez 20 sur 20 testés. B12 anormale chez 8 sur 23 et acide méthylmalonique anormal chez 18 sur 19. Les dénominateurs changent selon les examens. Parmi sept suivis, trois se sont améliorés avec signes persistants et quatre sans amélioration notable.</p><p><b>Passages lus :</b> Résumé, résultats et tableaux 1–3 ; traitements et suivi rapportés dans les résultats. <b>Version :</b> 2025 ; identifiant de publication 10.1186/s42466-024-00361-0. <b>Limites :</b> Petit effectif sélectionné, sans sensibilité diagnostique populationnelle ni pronostic universel. Plusieurs pourcentages du tableau ne concordent pas avec leurs comptes ; ils ne sont pas recopiés. Une unité de protéine du liquide est incohérente et n’est pas utilisée. Traitements de série variables, sans directive suisse déduite.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11737043/" target="_blank" rel="noopener noreferrer">Consulter la source — Meißner et coll., Neurological Research and Practice</a></p></template>
<template data-pop="g32-r7" data-k="g32-r7"><h3>[7] Myélopathie au protoxyde d’azote : diagnostic et traitement</h3><p>La présentation peut associer ataxie sensitive, perte de vibration/position et réflexes variables selon composante médullaire et périphérique. B12 peut être normale ; les marqueurs fonctionnels dépendent du rein, des autres causes et du délai après arrêt ou traitement. L’IRM peut être normale et l’aspect en V n’est pas spécifique. Le centre privilégie les injections, une réévaluation neurologique standardisée et l’abstinence accompagnée. Il ne trouve pas de preuve clinique en faveur de méthionine ou folates adjuvants systématiques.</p><p><b>Passages lus :</b> Reconnaissance et diagnostic, investigations et tableau 2, traitement avec sous-sections, coordination des soins. <b>Version :</b> 2023 ; identifiant de publication 10.1136/pn-2022-003631. <b>Limites :</b> Conseils pratiques spécialisés de 2023, pas consensus universel de 2026. NICE 2024 est lu séparément. Rythme du protocole local et FI suisse restent distincts ; aucun schéma étranger n’est transformé en prescription suisse automatique. Les repères biologiques approximatifs ne sont pas des seuils universels.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10313972/" target="_blank" rel="noopener noreferrer">Consulter la source — Paris, Lake et coll., Practical Neurology ; équipes britanniques</a></p></template>
<template data-pop="g32-r8" data-k="g32-r8"><h3>[8] Les multiples présentations de la carence en cobalamine</h3><p>B12 est cofacteur de la méthylmalonyl-CoA mutase et de la méthionine synthase. Son déficit peut augmenter acide méthylmalonique et homocystéine, avec limites rénales, analytiques et autres causes. Les folates seuls peuvent masquer l’anémie sans corriger la carence en B12. Les causes comprennent auto-immunité, malabsorption, chirurgie, apports et médicaments.</p><p><b>Passages lus :</b> Biochimie/diagnostic, interférences analytiques et causes ; résumé et cas A partiellement. <b>Version :</b> 2019 ; identifiant de publication 10.1016/j.mayocpiqo.2019.03.002. <b>Limites :</b> Revue narrative d’auteurs néerlandais chez un éditeur américain, pas fondement d’une recommandation américaine. Section de traitement non lue et non utilisée. Plages anciennes et résultats d’études non relues ne deviennent pas seuils suisses universels.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6543499/" target="_blank" rel="noopener noreferrer">Consulter la source — Wolffenbuttel et coll., Groningen, Pays-Bas ; Mayo Clinic Proceedings Innovations, Quality and Outcomes</a></p></template>
<template data-pop="g32-r9" data-k="g32-r9"><h3>[9] Gaz hilarant : ressources suisses de prévention et d’aide</h3><p>Services confidentiels, annuaire des addictions et consultation anonyme SafeZone. Le 144 est indiqué pour l’ambulance. La réglementation du protoxyde d’azote dépend de l’usage et des règles applicables, y compris cantonales ; disponibilité ne signifie pas innocuité.</p><p><b>Passages lus :</b> Aide, urgence, prévention, réglementation et actualités ; risques généraux. <b>Version :</b> Page sans date de révision, actualités 2026 visibles ; consultée le 2 novembre 2026. <b>Limites :</b> Page grand public, pas fondement d’un protocole de myélopathie ni de chiffres nationaux de G32. Les données des enquêtes originales n’ont pas été lues. Les listes de risques ne sont pas reprises comme preuves mécanistiques exhaustives ; pas certificat juridique.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://www.infodrog.ch/fr/ressources/formes-de-dependances/gaz-hilarant.html" target="_blank" rel="noopener noreferrer">Consulter la source — Infodrog, centrale de coordination des addictions</a></p></template>
<template data-pop="g32-r10" data-k="g32-r10"><h3>[10] Manuel suisse de codage médical 2026 : D03m</h3><p>Le code étiologique dague précède le code manifestation étoile ; un code étoile ne s’utilise pas seul. Les conditions du diagnostic supplémentaire et les règles de diagnostic principal restent applicables.</p><p><b>Passages lus :</b> Règle D03m page 34 réellement lue pour G22 et explicitement réutilisée. <b>Version :</b> 2026, publié le 30 septembre 2025. <b>Limites :</b> Réutilisation ciblée réelle, sans nouvelle lecture intégrale ni audit de facturation.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/36144082/master" target="_blank" rel="noopener noreferrer">Consulter la source — Office fédéral de la statistique</a></p></template>
<template data-pop="g32-r11" data-k="g32-r11"><h3>[11] PROFILES 2017 : situations neurologiques</h3><p>La leçon relie pédagogiquement troubles de la marche, de l’équilibre, de la sensibilité et faiblesse à un raisonnement causal et à la gravité.</p><p><b>Passages lus :</b> Situations 96–105 réellement lues par Sol et réutilisées : équilibre, marche, sensibilité, force et cognition. <b>Version :</b> 2017. <b>Limites :</b> Correspondance pédagogique locale, pas une nouvelle table officielle CIM-PROFILES 2026 ni garantie du contenu d’examen.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://www.siwf.ch/files/pdf24/profiles_2017-broschuere.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — Objectifs nationaux suisses de formation médicale</a></p></template>
<template data-pop="g32-r12" data-k="g32-r12"><h3>[12] Gray764 : voie motrice normale et droits</h3><p>L’illustration humaine historique montre une voie corticospinale normale. Elle aide à distinguer voie motrice, force et trouble sensitif, sans représenter une lésion de patient ni toute la proprioception.</p><p><b>Passages lus :</b> Source et droits du domaine public antérieurement lus ; pixels effectivement affichés à nouveau. <b>Version :</b> 1918 ; droits lus par Sol, original de nouveau inspecté pour G32. <b>Limites :</b> Original du domaine public, pixels inchangés ; annotations françaises adjacentes. Aucune validation médicale humaine ni dessin anatomique par IA.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener noreferrer">Consulter la source — Gray, Anatomy of the Human Body ; illustration attribuée à Henry Vandyke Carter, Commons</a></p></template>
<template data-pop="g32-r13" data-k="g32-r13"><h3>[13] CEN : sémiologie de la sensibilité</h3><p>La proprioception renseigne sur position et mouvement. L’atteinte peut majorer l’instabilité à fermeture des yeux. Le sens de position est examiné après démonstration, avec mobilisation et limitation des indices cutanés. La pallesthésie est testée au diapason sur les reliefs osseux ; la topographie doit être décrite avant d’attribuer une cause.</p><p><b>Passages lus :</b> Sensibilité profonde, manœuvres de position, vibration et Romberg, syndrome cordonal postérieur. <b>Version :</b> Page non datée, consultée le 2 novembre 2026. <b>Limites :</b> Chapitre pédagogique français, sans performance universelle d’un signe ni protocole de traitement. Aucune illustration importée ni licence présumée. Le nombre de relais de la phrase introductive n’est pas repris comme schéma synaptique.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://www.cen-neurologie.fr/premier-cycle/les-fondamentaux-de-la-pathologie-neurologique/la-semiologie-neurologique-et-ses-bases-anatomofonctionnelles/chapitre-7-semiologie-de-la-sensibilite" target="_blank" rel="noopener noreferrer">Consulter la source — Collège des enseignants de neurologie, France</a></p></template>
