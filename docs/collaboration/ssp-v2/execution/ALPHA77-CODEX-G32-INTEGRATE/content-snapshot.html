<template id="ch-G32"><div class="chap"><div class="chap-head"><div class="code">G32 · Neurologie</div><h1>G32 — Autres affections dégénératives du système nerveux au cours d’affections classées ailleurs</h1><span class="status">Auto-relecture IA de l’auteur · Aucune validation médicale humaine attestée</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><div class="chap-body" data-semiology-clinical="G32"><section class="ilot" id="g32-question"><h2>Une marche instable et des paresthésies demandent une localisation et une cause</h2><p>Une personne dit marcher sur du coton, ne plus sentir la position de ses pieds ou perdre son équilibre dans l’obscurité. Une force conservée n’exclut pas une atteinte neurologique importante. Le clinicien recherche une ataxie sensitive, une atteinte médullaire et une éventuelle neuropathie associée. La chronologie, la gravité et les autres signes déterminent le niveau de soins et les investigations.</p><p>G32* est une catégorie de manifestation au cours de maladies classées ailleurs. Elle comporte G32.0*, dégénérescence combinée subaiguë de la moelle, et G32.8*, autres affections dégénératives précisées. L’inclusion B12 de G32.0 est explicitement vérifiée ; elle fournit le fil clinique principal de cette leçon. Les autres myélopathies et neuropathies ne sont pas toutes transformées en G32.8.</p><div class="key"><b>À retenir.</b> Localiser le syndrome, rechercher une cause traitable et vérifier le code ; un résultat biologique ou une image isolés ne réalisent pas ces trois étapes.</div><p>Sources : <button class="w" data-k="g32-r1">[1]</button> · <button class="w" data-k="g32-r2">[2]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r10">[10]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-definition"><h2>La dégénérescence combinée subaiguë concerne la moelle et peut s’associer à une neuropathie</h2><p><button class="w" data-k="g32-dcs">Cordons postérieurs, voies motrices et myéloneuropathie</button></p><div class="key"><b>À retenir.</b> Le syndrome se décrit par ses fonctions atteintes ; il ne se résume ni à une anémie ni à une valeur de B12.</div><p>Sources : <button class="w" data-k="g32-r1">[1]</button> · <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-code-body"><h2>G32.0* et G32.8* sont deux sous-codes distincts</h2><p><button class="w" data-k="g32-codage">Une manifestation précise exige une maladie causale documentée</button></p><table class="t"><thead><tr><th>Code</th><th>Portée vérifiée</th><th>Piège</th></tr></thead><tbody><tr><td>G32.0*</td><td>Dégénérescence combinée subaiguë ; inclusion B12 avec E53.8†.</td><td>Ne pas exiger une anémie pour reconnaître une atteinte neurologique.</td></tr><tr><td>G32.8*</td><td>Autres affections dégénératives précisées au cours d’une autre maladie.</td><td>Ne pas y classer toute maladie médullaire sans preuve.</td></tr><tr><td>G32</td><td>Catégorie avec les deux sous-codes précédents.</td><td>Ne pas inventer une subdivision supplémentaire ou la présenter comme sans subdivision.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Le code traduit une conclusion documentée ; il ne crée ni la topographie ni la preuve causale.</div><p>Sources : <button class="w" data-k="g32-r1">[1]</button> · <button class="w" data-k="g32-r2">[2]</button> · <button class="w" data-k="g32-r10">[10]</button></p></section><section class="ilot" id="g32-epidemiologie"><h2>Les statistiques de consommation ou de carence ne mesurent pas la fréquence de G32</h2><p>Aucune incidence ou prévalence suisse actuelle de G32, avec ventilation complète par âge et sexe, n’a été établie dans les sources réellement lues. La présence d’un cas suisse publié permet d’illustrer une situation locale ; elle ne fournit pas un taux national. Les données de carence en B12, de consommation de protoxyde d’azote et de dégénérescence combinée ne désignent pas les mêmes populations.</p><p><button class="w" data-k="g32-serie">Ce que montre la série allemande de 23 cas</button></p><p>Le cas de Rennaz concerne un homme de 27 ans, hospitalisé en 2025 et publié en 2026. Cet âge ne définit pas une tranche obligatoire. Les carences classiques peuvent survenir dans d’autres contextes, notamment malabsorption, chirurgie ou cause auto-immune ; leur épidémiologie ne se superpose pas à celle des usagers de gaz.</p><div class="key"><b>À retenir.</b> Lire population, dénominateur et méthode avant d’appliquer un chiffre à une personne.</div><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r6">[6]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r9">[9]</button></p></section><section class="ilot" id="g32-causes"><h2>Distinguer manque d’apport, malabsorption et inactivation fonctionnelle</h2><p><button class="w" data-k="g32-etiologies">Pourquoi la B12 manque-t-elle ou fonctionne-t-elle mal ?</button></p><table class="t"><thead><tr><th>Contexte</th><th>Enjeu</th><th>Conséquence</th></tr></thead><tbody><tr><td>Apports insuffisants</td><td>Vérifier alimentation, compléments et autres causes.</td><td>Adapter substitution et prévention sans présumer une cause unique.</td></tr><tr><td>Malabsorption ou cause auto-immune</td><td>Établir la cause et sa persistance.</td><td>Entretien et voie peuvent être durablement nécessaires.</td></tr><tr><td>Protoxyde d’azote</td><td>Identifier inactivation et exposition continue.</td><td>Substitution et abstinence accompagnée vont ensemble.</td></tr><tr><td>Autre maladie neurologique</td><td>Tester les diagnostics concurrents.</td><td>Ne pas donner G32.8 par défaut.</td></tr></tbody></table><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></section><section class="ilot" id="g32-anamnese"><h2>La chronologie et la fonction orientent le diagnostic</h2><p>Faire préciser le début des paresthésies, leur topographie, la sensation de position des pieds, les circonstances des chutes et l’effet de l’obscurité. Évaluer marche autonome, escalier, toilette, travail et activités antérieures. Une sensation de faiblesse doit être confrontée à la force réelle, car une perte de retour sensitif peut rendre un geste peu sûr sans parésie.</p><p><button class="w" data-k="g32-exposition">Questionner l’exposition avec confidentialité et précision</button></p><div class="key"><b>À retenir.</b> Nommer le changement et son tempo permet de choisir les examens ; une liste d’expositions ne suffit pas à attribuer une cause.</div><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-examen-body"><h2>Examiner sensibilité profonde, motricité et sécurité de la marche</h2><p>Montrer d’abord les tâches et vérifier leur compréhension. Rechercher le sens de position d’un orteil ou d’un doigt, la vibration sur un relief osseux et la topographie d’autres troubles sensitifs. Comparer les côtés et les niveaux, sans réduire l’examen à une seule réponse correcte ou incorrecte. La douleur, une difficulté cognitive ou une mauvaise consigne peuvent modifier la performance.</p><p><button class="w" data-k="g32-examen">Une manœuvre doit être sûre et interprétable</button></p><div class="key"><b>À retenir.</b> Décrire ce qui est perdu, ce qui reste conservé et les conditions du test avant de conclure.</div><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r6">[6]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-urgence"><h2>Une atteinte rapidement progressive demande une évaluation urgente</h2><p>Une perte rapide de marche autonome, une faiblesse croissante, un trouble sphinctérien, un déficit focal ou une menace respiratoire imposent une évaluation urgente. Rechercher en particulier les autres causes médullaires ou périphériques graves, dont une compression. La présence d’une exposition au protoxyde d’azote ne dispense pas de les examiner. Un diagnostic supposé de carence ne doit pas retarder une imagerie ou un avis spécialisé nécessaires.</p><p>Le bilan initial est prélevé avant substitution lorsque cela est possible immédiatement, car le traitement et l’arrêt d’exposition modifient les marqueurs. Cette préférence ne signifie pas attendre plusieurs jours un résultat devant une atteinte neurologique évocatrice. Les recommandations cliniques insistent sur la prise en charge sans retard ; la FI demande un diagnostic assuré avant thérapie. L’équipe documente donc l’hypothèse, les prélèvements, la gravité et la décision, avec coordination spécialisée.</p><p>Sous traitement, rechercher aussi effets indésirables et troubles électrolytiques. La FI souligne le besoin de contrôler régulièrement le potassium lorsque l’érythropoïèse s’intensifie. Une détérioration n’est pas attribuée automatiquement à la seule maladie initiale ou à un défaut d’observance.</p><div class="trap"><span class="k">Piège</span> Attendre l’apparition d’une anémie, une B12 franchement basse ou la totalité des résultats peut perdre du temps dans une atteinte neurologique sévère.</div><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button></p></section><section class="ilot" id="g32-diagnostic"><h2>Établir un faisceau clinique, causal et biologique</h2><p><button class="w" data-k="g32-criteres">Il n’existe pas de score unique pour tout G32</button></p><div class="alert"><p><b>Critères de travail, sans score universel :</b> décrire le syndrome et la topographie, documenter cause et niveau de preuve, interpréter les tests avec leurs limites, rechercher les urgences et les diagnostics concurrents. Puis vérifier le sous-code et le code causal. Une image en V ou un taux de B12 isolés ne constituent pas un critère unique de G32.</p></div><p>Sources : <button class="w" data-k="g32-r1">[1]</button> · <button class="w" data-k="g32-r2">[2]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section>

<section class="ilot" id="g32-biologie"><h2>Un dosage de concentration n’est pas une mesure complète de fonction</h2><p><button class="w" data-k="g32-b12-fonction">Pourquoi une B12 normale peut-elle tromper ?</button></p><div class="key"><b>À retenir.</b> La normalité d’un chiffre doit être confrontée à ce que le test mesure et au moment où il a été prélevé.</div><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></section><section class="ilot" id="g32-differentiel"><h2>Une exposition plausible ne ferme pas les autres diagnostics</h2><table class="t"><thead><tr><th>Hypothèse</th><th>Élément à rechercher</th><th>Limite</th></tr></thead><tbody><tr><td>Compression médullaire</td><td>Tempo, douleurs, niveau sensitif, déficit et imagerie.</td><td>Ne pas attribuer d’emblée tout tableau au gaz ou à une carence.</td></tr><tr><td>Atteinte inflammatoire ou infectieuse</td><td>Signes associés et investigations ciblées selon contexte.</td><td>Un signal postérieur n’identifie pas un agent ni un mécanisme unique.</td></tr><tr><td>Carence en cuivre ou autre trouble métabolique</td><td>Malabsorption, chirurgie, zinc, bilan adapté.</td><td>Une ressemblance avec B12 ne suffit pas à choisir la substitution.</td></tr><tr><td>Neuropathie périphérique</td><td>Topographie distale, réflexes et neurophysiologie selon question.</td><td>Un examen initial normal n’exclut pas toute neuropathie aiguë.</td></tr><tr><td>Autre syndrome de l’équilibre</td><td>Coordination, vision, vestibule et sensibilité profonde.</td><td>Romberg positif ne prouve pas une étiologie B12.</td></tr></tbody></table><p>L’IRM peut rechercher une cause concurrente et les examens biologiques sont choisis pour une question précise. Ne pas donner une liste indifférenciée de tests à toute personne, mais ne pas fermer l’enquête lorsqu’un signe important n’est pas expliqué. La réévaluation clinique est une partie du diagnostic.</p><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-traitement"><h2>Substitution, arrêt de l’exposition et soutien fonctionnel avancent ensemble</h2><p><button class="w" data-k="g32-prise-en-charge">Une stratégie adaptée à la cause et à la gravité</button></p><div class="key"><b>À retenir.</b> Le traitement vise la cause et la fonction ; la première injection ne remplace ni l’arrêt de l’exposition ni l’organisation du suivi.</div><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r9">[9]</button></p></section><section class="ilot" id="g32-folates"><h2>Corriger une carence associée ne signifie pas traiter par folates seuls</h2><p><button class="w" data-k="g32-folates">Folates et méthionine : distinguer complément indiqué et routine non prouvée</button></p><div class="trap"><span class="k">Piège</span> Une amélioration de l’hémogramme n’est pas une preuve que l’atteinte neurologique est corrigée.</div><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></section><section class="ilot" id="g32-complications"><h2>La récupération est variable ; une séquelle ne se pronostique pas sur un seul résultat</h2><p>Les conséquences peuvent inclure chutes, perte de marche autonome, troubles sensitifs persistants et atteintes fonctionnelles selon les réseaux concernés. Une exposition continue, un diagnostic retardé ou une autre cause peuvent empêcher l’amélioration. La correction biologique et la récupération neurologique n’ont pas nécessairement le même rythme.</p><p><button class="w" data-k="g32-pronostic">Lire le suivi des cas sans promettre un résultat</button></p><div class="key"><b>À retenir.</b> Mesurer la fonction dans le temps et expliquer l’incertitude ; aucune image ni valeur seule ne fixe la récupération.</div><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r6">[6]</button> · <button class="w" data-k="g32-r7">[7]</button></p></section><section class="ilot" id="g32-suivi"><h2>Le suivi porte sur la fonction, la cause et les effets du traitement</h2><p>Reprendre les mêmes observations utiles : distance et sécurité de marche, autonomie, position et vibration, force, chutes et symptômes sphinctériens. Une réévaluation plus précoce est nécessaire si le tableau est sévère ou s’aggrave. Les schémas de suivi de recommandations concernent des populations précises ; ils ne deviennent pas un calendrier universel de tout G32.</p><p>Sous injections, une B12 sérique élevée peut refléter le traitement et ne doit pas motiver à elle seule son arrêt. NICE déconseille de répéter le test diagnostique initial chez les personnes recevant une substitution intramusculaire. La décision d’entretien dépend de la cause, de sa persistance et de la réponse. Une gastrite auto-immune ou une résection définitive ne se gère pas comme une exposition éliminée sans autre carence.</p><p>La FI demande la surveillance de la réponse et du potassium, avec recherche de carence en fer ou folates si la réponse est insuffisante. En cas d’aggravation, revoir diagnostic, exposition, observance, organes et effets indésirables. La personne reçoit un plan de contact si symptômes nouveaux, rechute ou difficultés à suivre le traitement.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p><p>Le suivi comprend aussi la maladie causale. Dans une gastrite auto-immune suspectée ou confirmée, NICE signale un risque accru de tumeurs neuroendocrines gastriques et un possible risque accru d’adénocarcinome. Des symptômes digestifs hauts nouveaux ou aggravés justifient une réévaluation et la discussion d’une endoscopie avec le spécialiste ; aucun intervalle universel de surveillance n’est construit ici.</p></section><section class="ilot" id="g32-particuliers"><h2>Âge, grossesse et organes : garder les limites des données</h2><p>NICE NG239 concerne les personnes de 16 ans et plus. La FI Vitarubine Dépôt indique que l’utilisation et la sécurité ne sont pas étudiées chez l’enfant et l’adolescent. Leurs tableaux ne reçoivent pas automatiquement un schéma adulte. Une difficulté de marche ou une atteinte neurologique à ces âges justifie une évaluation adaptée à la gravité.</p><p>La FI réserve l’utilisation pendant grossesse et allaitement à une nécessité absolue, faute d’études contrôlées adaptées. NICE recommande de poursuivre une substitution déjà indiquée et de réévaluer la cause et le traitement ; ces formulations ne sont pas fondues en une garantie de sécurité absolue. La balance bénéfice-risque et les conséquences d’une carence neurologique sont discutées avec les spécialistes et la personne.</p><p>La fonction rénale influence l’interprétation de l’acide méthylmalonique et de l’homocystéine. Aucune formule d’adaptation de dose propre à Vitarubine en insuffisance rénale ou hépatique n’a été trouvée dans la notice lue ; le cours n’en invente pas. Les comorbidités, l’exposition et les résultats biologiques sont transmis au prescripteur.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></section><section class="ilot" id="g32-suisse"><h2>En Suisse, organiser les soins et l’aide sans présumer les droits administratifs</h2><p><button class="w" data-k="g32-aide">Urgence médicale et accompagnement des addictions</button></p><p>La réglementation du gaz dépend de l’usage et des dispositions applicables, notamment cantonales ; sa disponibilité ne signifie ni innocuité ni absence de restrictions. Les obligations détaillées de déclaration, d’assurance, d’aptitude à conduire, d’invalidité et de remboursement n’ont pas été établies exhaustivement pour tout G32. Elles sont examinées selon la cause, le handicap et le contexte avec les professionnels compétents. Aucune absence d’obligation n’est affirmée.</p><p>Sources : <button class="w" data-k="g32-r1">[1]</button> · <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r9">[9]</button> · <button class="w" data-k="g32-r10">[10]</button></p></section><section class="ilot" id="g32-cas"><h2>Quatre exercices pour tester signe, preuve et décision</h2><div class="quiz ui" id="g32-q1"><p><b>Cas pédagogique fictif 1.</b> Une personne marche difficilement mais sa force reste conservée. Quelle conclusion est correcte ?</p><button data-ok="1">Rechercher sens de position, vibration et ataxie : force normale n’exclut pas une atteinte sensitive.</button><button data-ok="0">Écarter une maladie neurologique puisque la force est normale.</button><p class="fb" hidden>La force et la sensibilité profonde sont distinctes. La marche peut être très altérée par perte d’information proprioceptive.</p></div><div class="quiz ui" id="g32-q2"><p><b>Cas pédagogique fictif 2.</b> Après usage de protoxyde d’azote, la B12 totale est dans la plage du laboratoire. Que faire devant un tableau neurologique évocateur ?</p><button data-ok="1">Interpréter le contexte, rechercher les marqueurs fonctionnels et organiser l’évaluation sans retard.</button><button data-ok="0">Conclure que le gaz ne peut pas être responsable.</button><p class="fb" hidden>La concentration ne mesure pas toute l’activité de la B12. Les prélèvements initiaux, le délai et les diagnostics concurrents comptent.</p></div><div class="quiz ui" id="g32-q3"><p><b>Cas pédagogique fictif 3.</b> L’hémogramme s’améliore sous folates seuls alors que la marche se dégrade. Quelle réponse convient ?</p><button data-ok="1">Réévaluer rapidement une carence B12 et la cause neurologique ; le sang ne prouve pas la guérison de la moelle.</button><button data-ok="0">Continuer sans réévaluation puisque l’anémie s’améliore.</button><p class="fb" hidden>Les folates seuls peuvent masquer l’anémie. Le traitement B12 et le bilan neurologique restent des questions distinctes.</p></div><div class="quiz ui" id="g32-q4"><p><b>Cas pédagogique fictif 4.</b> Une neuropathie n’a pas encore de cause établie. Peut-elle recevoir G32.8* par défaut ?</p><button data-ok="1">Non : préciser manifestation, maladie causale et association de codage.</button><button data-ok="0">Oui : G32.8 signifie toute affection neurologique non précisée.</button><p class="fb" hidden>G32.8 concerne des affections dégénératives précisées au cours d’une autre maladie ; ce n’est pas un code de secours universel.</p></div><div class="key"><b>À retenir.</b> Pour l’examen fédéral : expliquer le mécanisme, la limite du test et ce qui change immédiatement la décision.</div><p>Sources : <button class="w" data-k="g32-r1">[1]</button> · <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button> · <button class="w" data-k="g32-r10">[10]</button> · <button class="w" data-k="g32-r11">[11]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-synthese"><h2>Une démarche réévaluable du symptôme au code</h2><table class="t"><thead><tr><th>Étape</th><th>Résultat attendu</th></tr></thead><tbody><tr><td>Décrire et protéger</td><td>Sensibilité profonde, force, réflexes, marche et risque de chute.</td></tr><tr><td>Localiser</td><td>Moelle, nerf périphérique ou association, avec recherche d’urgence.</td></tr><tr><td>Documenter la cause</td><td>Apports, absorption, auto-immunité, médicaments, exposition et autres diagnostics.</td></tr><tr><td>Interpréter les tests</td><td>Fonction, concentration, méthode, rein et chronologie.</td></tr><tr><td>Traiter et suivre</td><td>Cause, substitution exacte, fonction et accès aux soins.</td></tr><tr><td>Coder</td><td>Sous-code et maladie causale documentés ; étoile jamais seule.</td></tr></tbody></table><button class="pareto-btn ui" data-k="pareto-g32-a">▲ Loi de Pareto — Localisation, fonction et cause</button><p>Sources : <button class="w" data-k="g32-r1">[1]</button> · <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r10">[10]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="g32-e-strategie"><h2>Un examen complémentaire répond à une question clinique</h2><p>Le bilan part de la topographie, du tempo et des hypothèses. Une atteinte rapidement progressive ou une perte d’autonomie demande une organisation urgente ; une image supposée compatible avec carence ne remplace pas la recherche d’une cause compressive ou inflammatoire. Les prélèvements avant substitution sont utiles s’ils peuvent être faits sans retarder la prise en charge nécessaire.</p><table class="t"><thead><tr><th>Question</th><th>Outil</th><th>Limite</th></tr></thead><tbody><tr><td>Concentration ou fonction B12 ?</td><td>B12 totale/active et marqueurs fonctionnels selon contexte.</td><td>Suppléments, gaz, méthode et délai influencent le sens du résultat.</td></tr><tr><td>Atteinte médullaire ou autre lésion ?</td><td>IRM adaptée cervicale et thoracique selon contexte.</td><td>Aspect postérieur non spécifique ; une IRM normale ne ferme pas toujours le dossier.</td></tr><tr><td>Composante périphérique ?</td><td>Neurophysiologie selon discordance ou réponse.</td><td>Un examen initial normal ne démontre pas l’absence de toute neuropathie.</td></tr><tr><td>Cause persistante ?</td><td>Bilan digestif, immunologique ou métabolique ciblé.</td><td>Un test négatif isolé ne remplace pas la probabilité clinique.</td></tr></tbody></table><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></section><section class="ilot" id="g32-e-marqueurs"><h2>Nommer le test et ses unités avant d’interpréter le résultat</h2><p><button class="w" data-k="g32-seuils">Repères de NICE et limites des marqueurs fonctionnels</button></p><div class="key"><b>À retenir.</b> Total, actif et fonctionnel désignent des mesures différentes ; leurs unités et références ne s’interchangent pas.</div><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></section><section class="ilot" id="g32-e-irm"><h2>L’aspect en V inversé illustre une topographie, pas une cause unique</h2><p><button class="w" data-k="g32-imagerie">Lire l’IRM avec la question et les signes</button></p><figure><img src="assets/img/g32/alpha/codex/SwissMyelopathy2026.jpg" alt="IRM cervicale T2 de la figure1 du cas suisse publié en2026" loading="lazy"><figcaption>IRM cervicale T2 de la figure 1 du cas suisse publié en 2026. Witzig et coll., Hôpital Riviera-Chablais, Cureus, 2026, figure 1 ; <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">Creative Commons Attribution 4.0</a>. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener noreferrer">Publication originale</a>. IRM clinique humaine d’un homme de 27 ans. Les auteurs indiquent un consentement obtenu ou une dispense, sans autre précision individuelle reprise ici. Pixels et flèches de source inchangés ; annotations françaises adjacentes ajoutées.</figcaption><table class="t"><thead><tr><th>Repère de l’original</th><th>Annotation française et portée</th></tr></thead><tbody><tr><td>Vue sagittale à gauche et ligne de repérage</td><td>Localisation de la coupe ; l’absence de signal évident dans ce plan ne remplace pas la lecture des coupes axiales.</td></tr><tr><td>Vue axiale à droite, flèches orange de la source</td><td>Hypersignaux postérieurs formant un V inversé selon légende, au niveau C1–C2.</td></tr><tr><td>Étendue rapportée dans le texte du cas</td><td>Atteinte C1–C5 décrite par les auteurs ; cette seule vue ne montre pas tous les niveaux.</td></tr><tr><td>Portée clinique</td><td>Image non spécifique, à confronter aux signes, aux tests et aux diagnostics concurrents ; pixels et repères inchangés.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-e-cause"><h2>Rechercher la cause sans interpréter un test négatif comme exclusion absolue</h2><p>Une carence confirmée ou une vulnérabilité préexistante peut demander un bilan de cause auto-immune, digestive, chirurgicale ou médicamenteuse. NICE propose les anticorps anti-facteur intrinsèque lorsque le contexte évoque une gastrite auto-immune. Un résultat négatif ne suffit pas à l’exclure ; d’autres examens sont discutés selon la probabilité et avec le spécialiste.</p><p>La B12 peut être affectée par une prise préalable ou par une interférence analytique. Une valeur qui ne concorde pas avec un tableau neurologique important justifie un échange avec le laboratoire. Une exposition au gaz n’exclut pas une malabsorption associée. La recherche d’une autre carence, notamment cuivre selon contexte, relève d’une question clinique précise et non d’une substitution empirique indifférenciée.</p><p>Le liquide céphalorachidien ou d’autres investigations ne constituent pas un bilan obligatoire du seul code G32 ; ils répondent à une suspicion concurrente et à leurs conditions de sécurité. La décision dépend de ce que le résultat peut changer dans la prise en charge.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></section><section class="ilot" id="g32-e-suivi"><h2>Un examen de suivi n’est pas toujours le test diagnostique de départ</h2><p>Sous substitution intramusculaire, la concentration de B12 augmente et ne mesure pas directement la récupération de la marche ou de la sensibilité. NICE déconseille de répéter le test initial comme routine chez ces patients. Une amélioration biologique n’impose pas automatiquement d’arrêter un entretien nécessaire à une cause persistante.</p><p>La neurophysiologie est utile lorsqu’une composante périphérique est suspectée, si le tableau est discordant ou si la réponse est insuffisante. Le cas suisse rappelle la limite d’un examen initial normal dans un tableau aigu. La répétition de l’imagerie ou des analyses est décidée pour une question qui peut modifier le diagnostic ou les soins.</p><button class="pareto-btn ui" data-k="pareto-g32-e">▲ Loi de Pareto — Mesure, contexte et délai</button><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="g32-tab-semio" role="tab" aria-selected="true" aria-controls="g32-s-semio" data-s="g32-s-semio">Sémiologie fondamentale et analytique</button><button id="g32-tab-anat" role="tab" aria-selected="false" aria-controls="g32-s-anat" data-s="g32-s-anat">Anatomie</button><button id="g32-tab-physio" role="tab" aria-selected="false" aria-controls="g32-s-physio" data-s="g32-s-physio">Physiologie et physiopathologie</button><button id="g32-tab-biochim" role="tab" aria-selected="false" aria-controls="g32-s-biochim" data-s="g32-s-biochim">Biochimie</button><button id="g32-tab-micro" role="tab" aria-selected="false" aria-controls="g32-s-micro" data-s="g32-s-micro">Hématologie et immunologie</button><button id="g32-tab-pk" role="tab" aria-selected="false" aria-controls="g32-s-pk" data-s="g32-s-pk">Pharmacologie fondamentale</button></div><div class="chap-body sci-body"><div class="sci" id="g32-s-semio" role="tabpanel" aria-labelledby="g32-tab-semio"><section class="ilot" id="g32-s-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>La sensibilité profonde renseigne sur la position, le déplacement et la vibration. Elle permet d’ajuster un geste et la posture sans regarder constamment chaque segment du corps. La force volontaire et le retour sensitif ne sont pas la même fonction : une personne peut produire une force normale tout en plaçant mal son pied ou en perdant l’équilibre. Le normal attendu doit donc être décrit avant de nommer une faiblesse ou une ataxie.</p><p>Le clinicien observe la marche et la coordination, puis teste des dimensions précises de la sensibilité. Il montre les tâches, vérifie la compréhension et compare les côtés. La vision peut compenser une partie des difficultés proprioceptives ; sa suppression lors d’une manœuvre protégée rend certaines anomalies plus apparentes. Cette relation aide à interpréter un signe, sans identifier à elle seule une maladie ou un sous-code.</p><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-s-semio-signs" data-semiology="signs"><h3>Distinguer paresthésie, perte de position, ataxie et faiblesse</h3><p>Une paresthésie est une sensation anormale décrite par la personne ; elle n’est pas l’équivalent d’une perte de force ou d’un niveau médullaire démontré. La pallesthésie correspond à la perception de vibration ; le sens de position est une autre dimension de la sensibilité profonde. Une ataxie sensitive traduit un défaut d’ajustement lié à ces informations, avec une marche ou des gestes rendus peu sûrs.</p><p>Le tableau peut associer symptômes distaux, Romberg proprioceptif et troubles de la marche, avec des réflexes variables. Une force conservée, une absence d’anémie ou une réponse plantaire en flexion ne suffisent pas à exclure l’atteinte. La description doit préciser ce qui est atteint et ce qui ne l’est pas. Le mot combinée n’oblige pas à retrouver tous les signes dans chaque présentation individuelle.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r6">[6]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-s-semio-mechanisms" data-semiology="mechanisms"><h3>Relier l’information perdue à la performance observée</h3><p>Les informations proprioceptives conscientes empruntent notamment des grosses fibres myélinisées et les voies cordonales postérieures. Une atteinte peut perturber la perception de position et de vibration, puis l’ajustement du mouvement. L’instabilité majorée lorsque les yeux se ferment explique pourquoi l’examen compare les conditions visuelles. Une mauvaise coordination ne signifie donc pas toujours une atteinte cérébelleuse primaire.</p><p>Dans une myéloneuropathie, atteinte centrale et périphérique peuvent se combiner. Les réflexes ne suivent pas nécessairement le profil d’une atteinte médullaire pure. Le mécanisme B12 ou l’inactivation fonctionnelle par protoxyde d’azote peut produire des tableaux différents selon les territoires et la gravité. Une B12 sérique renseigne sur une concentration ; elle ne remplace pas la mesure clinique de ces fonctions ni les marqueurs de réactions enzymatiques.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-s-semio-examination" data-semiology="examination"><h3>Faire un examen comparatif et protéger contre les chutes</h3><p>Pour le sens de position, expliquer et montrer le mouvement du segment, puis demander la reconnaissance yeux fermés en limitant les indices cutanés. Pour la vibration, utiliser le diapason sur un relief osseux après démonstration, en notant niveau et symétrie. Les conditions du test et les facteurs qui limitent la réponse sont consignés. Une réponse isolée ne doit pas remplacer l’observation de l’ensemble du profil.</p><p>Le Romberg est effectué seulement si la station peut être rendue sûre, avec protection rapprochée. Comparer l’équilibre avant et après fermeture des yeux ; ne pas provoquer une chute chez une personne déjà très instable. Compléter par force, réflexes, réponses plantaires, coordination et examen de la marche si possible. La fonction initiale, comme la marche autonome ou le besoin d’aide, fournit une référence essentielle pour suivre la réponse.</p><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r6">[6]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-s-semio-interpretation" data-semiology="interpretation"><h3>Un signe localise mieux qu’il ne démontre une cause</h3><p>La perte de vibration et de position, l’ataxie et le contexte orientent vers une atteinte des voies proprioceptives. Il faut encore distinguer moelle, nerf périphérique ou association, puis chercher la cause. Les réflexes et les autres déficits aident à cette localisation, sans qu’un signe isolé soit toujours décisif. Une exposition au gaz augmente une hypothèse ; elle ne prouve pas que toutes les anomalies en découlent.</p><p>De même, un V inversé en imagerie décrit une distribution de signal et non un agent ou un toxique unique. La concentration B12 peut paraître normale dans une inactivation fonctionnelle et après supplémentation. Clinique, imagerie, biologie et chronologie doivent donc se soutenir mutuellement. Une discordance reste visible et motive une investigation ou une réévaluation plutôt qu’un ajustement de récit pour conserver le premier diagnostic.</p><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-s-semio-differentials" data-semiology="differentials"><h3>Comparer les autres mécanismes d’instabilité et de déficit</h3><p>Une faiblesse réduit la force ; une atteinte cérébelleuse ou vestibulaire peut altérer l’équilibre par un autre mécanisme ; une douleur ou une difficulté de compréhension modifie la performance. Le Romberg ne fournit donc pas seul une étiologie B12. La comparaison yeux ouverts/fermés est interprétée avec coordination, sensibilité et autres signes, dans des conditions de sécurité.</p><p>Dans une atteinte médullaire, rechercher une compression, une inflammation, une infection et d’autres causes métaboliques selon contexte. La carence en cuivre peut ressembler à une atteinte B12 et demande un bilan propre. Une neuropathie peut coexister ou constituer une autre hypothèse. Aucune de ces ressemblances n’autorise à choisir un médicament, à attribuer un code manifestation ou à fermer la recherche sur une image seule.</p><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-s-semio-urgency" data-semiology="urgency"><h3>La gravité fonctionnelle change le niveau de soins</h3><p>La perte rapide de marche autonome, une faiblesse croissante, un trouble sphinctérien ou une atteinte respiratoire demandent une évaluation urgente. L’examen recherche les causes concurrentes menaçantes. Une carence supposée ou un antécédent d’exposition au gaz ne justifie pas d’attendre passivement des résultats lorsque la fonction se dégrade. La stabilisation, l’imagerie indiquée et l’avis spécialisé sont organisés selon le tableau.</p><p>Les prélèvements avant traitement facilitent l’interprétation, mais leur organisation ne doit pas créer un retard dangereux dans une atteinte évocatrice. La décision clinique et les règles de produit sont documentées. Pendant la substitution, une nouvelle aggravation exige aussi une recherche d’effets indésirables, d’exposition persistante et d’anomalies électrolytiques ; elle n’est pas automatiquement le signe d’une seule cause.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button></p></section><section class="ilot" id="g32-s-semio-limits" data-semiology="limits"><h3>Connaître les limites d’un test, d’une série et d’une mesure de suivi</h3><p>Les tests sensitifs demandent compréhension, coopération et méthode. La topographie et les conditions comptent davantage qu’une réponse isolée. Une neurophysiologie initialement normale ne suffit pas toujours à exclure une neuropathie aiguë ; une IRM normale ne ferme pas nécessairement un dossier compatible. Aucune sensibilité ou spécificité universelle n’est attribuée aux manœuvres de cette leçon.</p><p>Les comptes des séries varient selon les personnes testées, et plusieurs pourcentages de la série allemande sont incohérents avec leurs dénominateurs. Ils ne deviennent pas des performances diagnostiques. Le suivi sous traitement se concentre sur fonction, cause et tolérance : une B12 haute après injection ne mesure pas directement la récupération. Il n’existe pas de score unique validé pour toute la catégorie G32.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r6">[6]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-s-semio-sources" data-semiology="sources"><h3>Les sources de sémiologie et les preuves causales gardent des rôles distincts</h3><p>Le chapitre de sémiologie du Collège des enseignants de neurologie décrit les fonctions et les manœuvres. Le cas suisse et la série allemande montrent des phénotypes possibles, tandis que les textes britannique et NICE expliquent les limites des investigations et l’organisation des soins. Les informations de la FI sont celles d’un produit précis ; elles ne décrivent pas toutes les causes de la catégorie de codage.</p><p>Les fenêtres de référence nomment les passages effectivement lus, les réutilisations de lectures de Sol et les limites. Une revue ou un cas ne remplace pas une étude de performance ni un protocole suisse national. Le <a href="https://www.cen-neurologie.fr/premier-cycle/les-fondamentaux-de-la-pathologie-neurologique/la-semiologie-neurologique-et-ses-bases-anatomofonctionnelles/chapitre-7-semiologie-de-la-sensibilite" target="_blank" rel="noopener noreferrer">chapitre de sémiologie de la sensibilité</a> est directement lié pour retrouver la méthode.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r6">[6]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><figure id="g32-science-links-semio"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g32-diag-semio"><title id="g32-diag-semio">Position et vibration puis Ataxie observée puis Cause à documenter</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Position et vibration</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Ataxie observée</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Cause à documenter</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Fonction</td><td>Perte d’information profonde peut altérer un geste malgré force conservée.</td></tr><tr><td>Examen</td><td>Comparer conditions et topographie, protéger la marche et l’équilibre.</td></tr><tr><td>Limite</td><td>Le signe ne fournit ni cause unique ni code automatique.</td></tr></tbody></table></figure><p><b>Science → clinique.</b> Force et sensibilité profonde sont des dimensions différentes.</p><p><b>Science → examen.</b> Décrire la topographie et les conditions avant de conclure.</p><p><b>Science → traitement.</b> La cause et la gravité guident la décision, pas un signe isolé.</p><div class="key"><b>À retenir.</b> Relier le normal, la perturbation, le signe, l’examen et la décision en gardant les limites des preuves.</div></div><div class="sci" id="g32-s-anat" role="tabpanel" aria-labelledby="g32-tab-anat" hidden><section class="ilot" id="g32-s-anat-body"><h2>Voies sensitives, voies motrices et composante périphérique</h2><p>La sensibilité profonde consciente utilise des informations issues des segments du corps et transmises par de grosses fibres myélinisées, puis des voies médullaires et leurs connexions centrales. Les cordons postérieurs sont particulièrement pertinents pour vibration et position. La topographie explique pourquoi l’examen cherche un niveau, une symétrie et d’autres fonctions associées plutôt que de conclure sur un seul point de test.</p><p>La voie corticospinale participe à la commande motrice. L’illustration historique de Gray montre un trajet normal avec cortex, capsule interne, décussation et faisceaux descendants. Elle ne représente pas les cordons postérieurs en détail et ne doit pas être transformée par annotation en carte de toute proprioception. Elle sert ici à rappeler que la force et l’information sensitive sont deux dimensions distinctes du fonctionnement neurologique.</p><p>Dans une dégénérescence combinée, une atteinte des voies motrices peut accompagner les troubles proprioceptifs ; elle n’est pas nécessairement cliniquement évidente d’emblée. Dans la myéloneuropathie, le nerf périphérique apporte une autre composante. Des réflexes diminués et une instabilité ne sont donc pas incompatibles avec une atteinte médullaire. L’examen répartit les arguments entre ces territoires avant de choisir les investigations.</p><p>L’IRM montre des aspects anatomiques et de signal à interpréter avec les signes. Le cas suisse décrit une atteinte cervicale postérieure, mais le motif en V ne démontre pas le protoxyde d’azote à lui seul. D’autres maladies peuvent toucher les mêmes voies. L’image clinique illustre la localisation d’un cas et non une relation obligatoire entre un niveau, une étiologie et un pronostic. Cette distinction évite une anatomie simplifiée qui ferait de chaque signe un diagnostic automatique.</p><figure><img src="assets/img/g32/alpha/codex/Gray764.png" alt="Voie corticospinale normale dans une illustration historique" loading="lazy"><figcaption>Voie corticospinale normale dans une illustration historique. Gray, Anatomy of the Human Body, 1918, illustration attribuée à Henry Vandyke Carter ; <a href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener noreferrer">original humain historique du domaine public</a>. Pixels inchangés ; annotations françaises adjacentes ajoutées.</figcaption><table class="t"><thead><tr><th>Repère de l’original</th><th>Annotation française et portée</th></tr></thead><tbody><tr><td>Motor area of cortex</td><td>Aire motrice du cortex : commande volontaire, distincte de la perception de position.</td></tr><tr><td>Internal capsule</td><td>Capsule interne : trajet de fibres représenté, pas une lésion de patient.</td></tr><tr><td>Decussation of pyramids</td><td>Décussation des pyramides dans l’original historique.</td></tr><tr><td>Anterior et lateral cerebrospinal fasciculi</td><td>Faisceaux corticospinaux représentés ; cette planche ne dessine pas toute la voie proprioceptive.</td></tr></tbody></table></figure><figure id="g32-science-links-anat"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g32-diag-anat"><title id="g32-diag-anat">Sensibilité et force puis Topographie clinique puis Image contextualisée</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Sensibilité et force</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Topographie clinique</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Image contextualisée</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Examen</td><td>Distinguer voies sensitives, motrices et nerf périphérique.</td></tr><tr><td>Imagerie</td><td>Tester la concordance, chercher d’autres causes pertinentes.</td></tr><tr><td>Limite</td><td>Original normal historique et image clinique restent différents.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r12">[12]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><p><b>Science → clinique.</b> Une atteinte postérieure peut gêner la marche sans faiblesse.</p><p><b>Science → examen.</b> Confronter territoires, réflexes et image.</p><p><b>Science → traitement.</b> Rechercher une autre cause menaçante avant une attribution automatique.</p><div class="key"><b>À retenir.</b> Relier le normal, la perturbation, le signe, l’examen et la décision en gardant les limites des preuves.</div></div><div class="sci" id="g32-s-physio" role="tabpanel" aria-labelledby="g32-tab-physio" hidden><section class="ilot" id="g32-s-physio-body"><h2>Une information manquante peut désorganiser le geste sans supprimer sa force</h2><p>Une action ajustée demande une commande motrice et un retour sur la position et le mouvement. Ces informations permettent des corrections pendant l’activité et le maintien de la posture. La vision aide à compenser certaines difficultés ; la majoration de l’instabilité lorsqu’elle est supprimée renseigne sur le mécanisme possible. Le test est une observation fonctionnelle à intégrer, pas une preuve causale isolée.</p><p>Les fibres myélinisées de grand calibre et les voies proprioceptives contribuent à une transmission adaptée à ces tâches. Une perturbation peut altérer vibration et position, puis rendre la marche incertaine, surtout lorsque les repères visuels diminuent. La personne peut décrire du coton sous les pieds ou une difficulté à savoir où les poser. La force restant conservée ne rend pas cette perte d’information bénigne.</p><p>Dans une atteinte liée à B12, plusieurs territoires peuvent être touchés. La composante postérieure explique une partie de l’ataxie ; une atteinte motrice et une neuropathie peuvent modifier force et réflexes. Le tableau est donc une combinaison de fonctions, et non la répétition obligatoire d’un syndrome pur. Il faut examiner les signes qui semblent discordants pour savoir s’ils révèlent une association ou une autre maladie.</p><p>Le traitement d’une cause peut rétablir certains processus avant que la fonction récupère. Une concentration de vitamine ou un métabolite corrigés ne garantissent pas une marche normale immédiatement. Le suivi mesure la fonction dans des conditions comparables et cherche une amélioration, un plateau ou une aggravation. La rééducation et la sécurité répondent à la période de handicap sans remplacer le traitement causal. Une récupération incomplète appelle une analyse, pas une promesse ou un abandon fondé sur un seul résultat.</p><figure id="g32-science-links-physio"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g32-diag-physio"><title id="g32-diag-physio">Retour sensitif utile puis Information perturbée puis Geste et marche altérés</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Retour sensitif utile</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Information perturbée</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Geste et marche altérés</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Mécanisme</td><td>Position et vibration contribuent à l’ajustement du mouvement.</td></tr><tr><td>Examen</td><td>Mesurer fonction et autres systèmes avec conditions explicites.</td></tr><tr><td>Traitement</td><td>Corriger cause et soutenir la fonction ; récupération variable.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><p><b>Science → clinique.</b> La perte de retour sensitif altère l’ajustement des gestes.</p><p><b>Science → examen.</b> Comparer des fonctions et leur évolution.</p><p><b>Science → traitement.</b> Corriger la cause et soutenir la fonction pendant la récupération.</p><div class="key"><b>À retenir.</b> Relier le normal, la perturbation, le signe, l’examen et la décision en gardant les limites des preuves.</div></div><div class="sci" id="g32-s-biochim" role="tabpanel" aria-labelledby="g32-tab-biochim" hidden><section class="ilot" id="g32-s-biochim-body"><h2>La B12 : distinguer concentration, activité et produits métaboliques</h2><p>La vitamine B12 participe comme cofacteur à deux réactions mises en avant dans la revue néerlandaise. La méthylmalonyl-CoA mutase transforme le méthylmalonyl-CoA en succinyl-CoA ; une altération de cette réaction peut augmenter l’acide méthylmalonique. La méthionine synthase intervient dans le passage homocystéine-méthionine ; son activité altérée peut augmenter l’homocystéine. Ces marqueurs ne sont pas des dosages identiques de la vitamine.</p><p>La concentration sérique et l’activité cellulaire ne se superposent pas dans toutes les situations. Le protoxyde d’azote peut perturber la cobalamine et ses fonctions alors que la B12 totale ou active ne paraît pas basse. Une supplémentation déjà commencée peut aussi modifier les concentrations sans résoudre toutes les conséquences neurologiques. L’histoire de l’exposition et des produits pris fait donc partie de la biologie clinique.</p><p>Un métabolite élevé n’est pas spécifique par nature. L’insuffisance rénale peut augmenter acide méthylmalonique et homocystéine ; les folates, d’autres carences, l’état thyroïdien ou certains médicaments peuvent également influencer l’interprétation. NICE demande les références du laboratoire pour les marqueurs fonctionnels. Les valeurs approximatives d’une autre étude ne sont pas imposées à une méthode différente. Une mesure doit être interprétée avec son unité, sa méthode et le contexte.</p><p>Les marqueurs changent avec l’arrêt d’exposition et le traitement. Un prélèvement initial est utile si son obtention ne retarde pas une prise en charge urgente ; un prélèvement tardif peut être moins informatif sur le mécanisme de départ. Le suivi ne consiste pas à poursuivre un chiffre jusqu’à lui donner le sens de guérison. La fonction neurologique, la cause et l’observance restent nécessaires pour décider de la durée et de l’entretien. Cette approche évite aussi de présenter une B12 élevée sous injection comme une toxicité ou une raison suffisante d’arrêt.</p><figure id="g32-science-links-biochim"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g32-diag-biochim"><title id="g32-diag-biochim">Cofacteur disponible puis Réactions enzymatiques puis Marqueurs interprétés</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Cofacteur disponible</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Réactions enzymatiques</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Marqueurs interprétés</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Mécanisme</td><td>B12 intervient dans méthylmalonyl-CoA et homocystéine-méthionine.</td></tr><tr><td>Examen</td><td>MMA et homocystéine demandent rein, méthode et délai.</td></tr><tr><td>Traitement</td><td>Concentration et récupération fonctionnelle ne sont pas équivalentes.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></section><p><b>Science → clinique.</b> Concentration et activité B12 peuvent diverger.</p><p><b>Science → examen.</b> Interpréter marqueurs avec méthode, rein et délai.</p><p><b>Science → traitement.</b> Ne pas réduire la décision à la normalisation d’un seul chiffre.</p><div class="key"><b>À retenir.</b> Relier le normal, la perturbation, le signe, l’examen et la décision en gardant les limites des preuves.</div></div><div class="sci" id="g32-s-micro" role="tabpanel" aria-labelledby="g32-tab-micro" hidden><section class="ilot" id="g32-s-micro-body"><h2>L’anémie et les anticorps répondent à d’autres questions que l’examen médullaire</h2><p>La B12 intervient dans l’hématopoïèse et sa carence peut produire une anémie mégaloblastique, mais ce n’est pas une condition nécessaire pour une atteinte neurologique. Le cas suisse ne présentait pas d’anomalie hématologique et la série allemande retrouvait souvent des marqueurs sanguins non caractéristiques. L’hémogramme décrit une dimension du problème ; sa normalité ne rétablit pas une information proprioceptive perdue.</p><p>La FI explique qu’une intensification de l’érythropoïèse après substitution augmente le besoin cellulaire en potassium. Elle demande une surveillance régulière de la kaliémie et attire l’attention sur des besoins en fer ou folates selon la réponse. La présence d’une anémie et son traitement peuvent donc ajouter des besoins de sécurité, tandis que l’absence d’anémie ne permet pas d’omettre l’examen neurologique ou l’évaluation causale.</p><p>Une gastrite auto-immune peut perturber l’absorption liée au facteur intrinsèque. Les anticorps anti-facteur intrinsèque aident à documenter cette cause lorsqu’elle est suspectée. NICE rappelle qu’un résultat négatif ne suffit pas à l’exclure et que la méthode doit être connue. La recherche peut se poursuivre selon la probabilité et avec le spécialiste ; elle n’est pas remplacée par un automatisme de laboratoire. Une cause irréversible peut rendre l’entretien durablement nécessaire.</p><p>Les folates et B12 ne sont pas substituables sur le seul résultat de l’hémogramme. Des folates seuls peuvent masquer l’anémie sans corriger le mécanisme neurologique de B12. Dépister et corriger une carence associée reste pertinent, mais n’est pas un argument pour suspendre la prise en charge B12. La décision réunit cause, symptômes, biologie et produit exact. Elle ne se réduit ni à une amélioration du sang ni à la présence ou absence d’un anticorps.</p><figure id="g32-science-links-micro"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g32-diag-micro"><title id="g32-diag-micro">Sang et absorption puis Cause documentée puis Suivi adapté</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Sang et absorption</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Cause documentée</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Suivi adapté</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Hématologie</td><td>Absence d’anémie n’exclut pas une atteinte neurologique.</td></tr><tr><td>Immunologie</td><td>Anticorps interprétés avec méthode et probabilité clinique.</td></tr><tr><td>Traitement</td><td>B12 et carences associées, avec surveillance du potassium selon FI.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r6">[6]</button> · <button class="w" data-k="g32-r8">[8]</button></p></section><p><b>Science → clinique.</b> L’anémie peut manquer dans une atteinte neurologique.</p><p><b>Science → examen.</b> Hémogramme et anticorps ont leurs questions et leurs limites.</p><p><b>Science → traitement.</b> Traiter B12 et carences associées sans substitution de l’une à l’autre.</p><div class="key"><b>À retenir.</b> Relier le normal, la perturbation, le signe, l’examen et la décision en gardant les limites des preuves.</div></div><div class="sci" id="g32-s-pk" role="tabpanel" aria-labelledby="g32-tab-pk" hidden><section class="ilot" id="g32-s-pk-body"><h2>La formulation explique la voie et une partie des règles de traitement</h2><p>Vitarubine Dépôt est une préparation injectable d’acétate d’hydroxocobalamine. Sa composition indique une masse d’acétate par ampoule ; le cours ne reconstruit pas une équivalence de base non donnée. L’unité du libellé de dose, la formulation et la voie restent visibles. Une cyanocobalamine orale ou une autre préparation ne se substitue pas à partir d’une égalité apparente de noms ou de milligrammes.</p><p>La notice explique le caractère retard par la fixation aux protéines sériques et tissulaires, et non par un dépôt simplement peu soluble au point d’injection. Elle décrit l’absorption après voie intramusculaire, le transport par des protéines et le stockage, notamment hépatique. Ces mécanismes ne permettent pas de calculer une nouvelle durée de traitement à partir du seul stock théorique. La cause et la réponse clinique déterminent aussi l’entretien.</p><p>Le taux sanguin sous injections change avec l’exposition médicamenteuse. Il ne devient pas une mesure directe de la réparation d’une voie médullaire ou de la nécessité future de substitution. Si la cause persiste, un entretien peut rester nécessaire même après amélioration. Si l’exposition au protoxyde d’azote continue, elle peut neutraliser l’objectif de la supplémentation ; le traitement n’est pas un moyen de rendre le gaz sûr.</p><p>La sécurité comprend hypersensibilité aux composants, cobalt et excipients, surveillance du potassium, réponse hématologique et interactions décrites dans la notice. Une voie intraveineuse techniquement possible n’est pas pour autant la voie recommandée par la FI ; l’injection intramusculaire est le repère du produit. La préparation ne se mélange pas arbitrairement à d’autres solutions. Les doses de centre, la notice et les besoins individuels sont confrontés par l’équipe plutôt que fondus en une recette universelle.</p><figure id="g32-science-links-pk"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g32-diag-pk"><title id="g32-diag-pk">Forme et exposition puis Effet et sécurité puis Entretien justifié</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Forme et exposition</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Effet et sécurité</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Entretien justifié</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Produit</td><td>Masse d’acétate, voie et dose de FI restent explicites.</td></tr><tr><td>Examen</td><td>Clinique et biologie de sécurité ; pas arrêt sur B12 haute seule.</td></tr><tr><td>Traitement</td><td>Cause persistante ou exposition éliminée changent la stratégie.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button></p></section><p><b>Science → clinique.</b> Le produit et la voie modifient exposition et sécurité.</p><p><b>Science → examen.</b> Revoir réponse, potassium, formulation et traitements associés.</p><p><b>Science → traitement.</b> Conserver unité, indication et raison d’entretien dans la prescription.</p><div class="key"><b>À retenir.</b> Relier le normal, la perturbation, le signe, l’examen et la décision en gardant les limites des preuves.</div><button class="pareto-btn ui" data-k="pareto-g32-sci">▲ Loi de Pareto — Concentration, fonction et preuve</button></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="g32-p-principes"><h2>La prescription doit garder produit, voie, objectif et cause visibles</h2><p>Une dose ne se lit pas sans population, formulation et objectif. La substitution d’une carence neurologique, l’entretien d’une cause persistante et le traitement d’une autre maladie responsable de G32.8 ne sont pas un même protocole. La personne reçoit une prescription et un plan de suivi adaptés à la gravité, aux organes, à l’observance et à l’accès aux soins.</p><p>Les informations chiffrées de produit présentées ici sont celles de Vitarubine Dépôt, FI suisse de juillet 2025. Les recommandations cliniques aident à organiser l’urgence et la stratégie, mais leurs populations et leurs rythmes ne sont pas réécrits comme le libellé de cette notice. Aucun traitement causal commun à toute catégorie G32 n’est inventé.</p><p>Sources : <button class="w" data-k="g32-r1">[1]</button> · <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button></p></section><section class="ilot" id="g32-p-vitarubine"><h2>Vitarubine Dépôt : composition exacte et dose de la notice</h2><p><button class="w" data-k="g32-vitarubine">Acétate d’hydroxocobalamine : garder la formulation du produit</button></p><p><button class="w" data-k="g32-unites">Lire une dose en microgrammes sans inventer une conversion chimique</button></p><div class="key"><b>À retenir.</b> Conserver le nom du produit, la masse telle que libellée, la voie et le rythme ; le calcul d’unité ne remplace pas la décision clinique.</div><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button></p></section><section class="ilot" id="g32-p-rythme"><h2>Rythme aigu et entretien répondent à des objectifs différents</h2><p><button class="w" data-k="g32-entretien">La durée dépend de la cause et de la réponse</button></p><table class="t"><thead><tr><th>Situation</th><th>Décision à documenter</th></tr></thead><tbody><tr><td>Phase aiguë</td><td>Produit, voie, rythme prévu et moment de réévaluation.</td></tr><tr><td>Cause persistante ou irréversible</td><td>Raison de l’entretien et surveillance de la réponse.</td></tr><tr><td>Exposition arrêtée et récupération</td><td>Réévaluer besoin selon autres causes et symptômes.</td></tr><tr><td>Nouvelle aggravation</td><td>Revoir diagnostic, exposition, observance et toxicités possibles.</td></tr></tbody></table><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></section><section class="ilot" id="g32-p-securite"><h2>La sécurité comprend allergies, potassium et réponse hématologique</h2><p><button class="w" data-k="g32-securite">Les précautions du produit ne disparaissent pas parce qu’il s’agit d’une vitamine</button></p><div class="key"><b>À retenir.</b> Produit vitaminique ne signifie pas absence de précautions ; la surveillance est clinique et biologique.</div><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button></p></section><section class="ilot" id="g32-p-interactions"><h2>Interactions et mélanges : la préparation exacte compte</h2><p><button class="w" data-k="g32-interactions">Une nouvelle prescription peut modifier l’effet ou l’interprétation</button></p><div class="key"><b>À retenir.</b> Revoir médicaments, compléments, méthode de laboratoire et exposition au gaz ; ne pas traiter ces éléments comme des détails séparés.</div><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r9">[9]</button></p></section><section class="ilot" id="g32-p-voies"><h2>Voie orale, grossesse et âge : ne pas généraliser une option</h2><p>NICE prévoit un choix de voie dans certains contextes de carence, dont celle liée au gaz, selon jugement clinique et préférences. L’article britannique consacré à la myélopathie privilégie une stratégie injectable. Cette différence ne doit pas être masquée : carence générale, sévérité neurologique, cause, capacité à suivre le traitement et produit sont discutés avant de choisir. Aucune dose orale d’un produit suisse non relu n’est ajoutée par mémoire.</p><p>La FI Vitarubine indique que l’enfant et l’adolescent n’ont pas été étudiés pour cette utilisation. Pendant grossesse et allaitement, elle réserve le traitement à une nécessité absolue, tandis que le guide clinique rappelle la nécessité de traiter une carence indiquée. Le plan est individualisé avec les équipes compétentes, sans arrêt brutal décidé sur une phrase isolée de notice ou de guide.</p><p>Aucune adaptation rénale ou hépatique chiffrée propre n’a été trouvée dans la FI lue. Cela ne signifie pas qu’un trouble d’organe est sans conséquence : il influence notamment la biologie et l’évaluation globale. La prescription et l’interprétation sont revues dans le contexte réel.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></section><section class="ilot" id="g32-p-revision"><h2>Une ordonnance doit rester reliée à un objectif mesurable</h2><p>Le suivi précise ce qui change : marche, autonomie, sensibilité, force, troubles associés, exposition et tolérance. Les mêmes observations sont reprises autant que possible. Une cause permanente, une exposition supprimée et un diagnostic encore incertain ne conduisent pas automatiquement à la même durée. La personne sait quand recontacter l’équipe et comment obtenir les soins prévus.</p><p>La décision ne repose ni sur un marqueur isolé sous traitement ni sur une promesse de réversibilité complète. Elle explicite pourquoi le traitement est poursuivi, intensifié, adapté ou réévalué. Un écart entre notice et stratégie clinique est discuté et documenté, sans présenter la décision d’un centre comme la règle de tous les patients.</p><button class="pareto-btn ui" data-k="pareto-g32-p">▲ Loi de Pareto — Produit, cause et réponse</button><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r9">[9]</button></p></section><section class="ilot" id="g32-sources"><h2>Sources réellement lues et limites de leur utilisation</h2><p>Classification et manuel suisses, FI exacte et ressources locales sont prioritaires. Les recommandations britanniques et la revue néerlandaise gardent leur champ ; le cas suisse et la série allemande sont des observations. Les fenêtres précisent les passages effectivement lus et les réutilisations déclarées, avec accès direct à la source primaire.</p><ol><li><button class="w" data-k="g32-r1">[1] OFS : CIM-10-GM française 2024</button></li><li><button class="w" data-k="g32-r2">[2] BfArM : entrée G32 et ses deux sous-codes</button></li><li><button class="w" data-k="g32-r3">[3] Vitarubine Dépôt : information professionnelle suisse</button></li><li><button class="w" data-k="g32-r4">[4] Myélopathie liée au protoxyde d’azote : cas de Suisse romande</button></li><li><button class="w" data-k="g32-r5">[5] NICE NG239 : carence en B12 chez les personnes de 16 ans et plus</button></li><li><button class="w" data-k="g32-r6">[6] Troubles neurologiques liés au protoxyde d’azote : expérience multicentrique allemande</button></li><li><button class="w" data-k="g32-r7">[7] Myélopathie au protoxyde d’azote : diagnostic et traitement</button></li><li><button class="w" data-k="g32-r8">[8] Les multiples présentations de la carence en cobalamine</button></li><li><button class="w" data-k="g32-r9">[9] Gaz hilarant : ressources suisses de prévention et d’aide</button></li><li><button class="w" data-k="g32-r10">[10] Manuel suisse de codage médical 2026 : D03m</button></li><li><button class="w" data-k="g32-r11">[11] PROFILES 2017 : situations neurologiques</button></li><li><button class="w" data-k="g32-r12">[12] Gray764 : voie motrice normale et droits</button></li><li><button class="w" data-k="g32-r13">[13] CEN : sémiologie de la sensibilité</button></li></ol><p>Sources : <button class="w" data-k="g32-r1">[1]</button> · <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r9">[9]</button> · <button class="w" data-k="g32-r10">[10]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="g32-dcs" data-k="g32-dcs"><h3>Cordons postérieurs, voies motrices et myéloneuropathie</h3><p>La dégénérescence combinée subaiguë associe classiquement une atteinte des cordons postérieurs et des voies latérales de la moelle dans le contexte d’un déficit en B12. Le tableau réel peut être incomplet : perte de vibration ou de position et ataxie sensitive peuvent dominer, sans faiblesse ni signe pyramidal évident. Une neuropathie périphérique peut coexister et modifier les réflexes.</p><p>Le terme myélopathie décrit l’atteinte médullaire ; neuropathie concerne les nerfs périphériques ; myéloneuropathie signale leur association. Une atteinte postérieure peut rendre la marche très instable alors que la force reste normale. Des réflexes diminués n’excluent pas nécessairement une atteinte centrale associée, surtout si une composante périphérique existe.</p><p>Une carence peut venir d’un apport ou d’une absorption insuffisants. Le protoxyde d’azote peut aussi inactiver fonctionnellement la B12 : la concentration ou les réserves ne traduisent alors pas nécessairement son activité cellulaire. La FI suisse rappelle la possibilité de symptômes neurologiques graves malgré des réserves normales. Ce mécanisme ne dispense pas de rechercher une autre cause médullaire.</p><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></template>
